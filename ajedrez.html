<head>

<title>AjedrezAR</title>
<style>
/* AjedrezAR: un café de barrio. Mesa de madera, tablero con marco y piezas dibujadas en el código. */
:root{--bg:#121614;--line:#2c3532;--ink:#eef1ea;--dim:#a7b2ad;--aqua:#7ce9e5;--gold:#e0b14a;
  --wood:#2a1e15;--wood2:#1b130d;--frame:#5b3d24;--frame2:#3c2716;
  --sq-l:#eedcb6;--sq-d:#a8784f;--hi:rgba(246,214,90,.55);--sel:rgba(124,233,229,.55);--chk:rgba(224,80,63,.85);
  --pw:#f7f0e2;--pws:#2a2118;--pwd:#2a2118;--pb:#2b2622;--pbs:#0d0b09;--pbd:#e8dcc4;
  --parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;--brown:#2a2118;--soft:#7d6d58;--olive:#3f7a5a;--olive2:#2d5c43;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--bs:320px}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);flex:none;border-bottom:1px solid #1f2723;position:relative;z-index:5}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap;display:flex;align-items:center}.brand span{color:var(--gold)}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#cfd8d2;border:1px solid #455261;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#18201d;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink);position:relative;padding:0 8px}
.icon-btn+.icon-btn{margin-left:0}
.icon-btn[hidden]{display:none}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,6px);grid-template-rows:6px 6px auto;gap:2px;place-content:center;padding:0;min-width:44px;align-content:center}
.games-btn i{width:6px;height:6px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
.games-btn b{grid-column:1/-1;font:800 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:#d5e6ea;margin-top:2px;text-align:center;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e0503f;color:#fff;font:800 11px/18px system-ui;padding:0 5px;text-align:center}
.badge:empty{display:none}
/* La mesa */
.mesa{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overflow:hidden;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,235,200,.03) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--wood),var(--wood2))}
.col{display:flex;flex-direction:column;gap:6px;width:var(--bs);max-width:100%;flex:none}
.strip{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 6px 4px 4px;border-radius:12px;background:rgba(10,14,12,.45);box-shadow:inset 0 0 0 1px rgba(214,226,206,.08)}
.strip.turn{box-shadow:inset 0 0 0 2px var(--gold)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c,#3b5866);font-size:18px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 2px rgba(214,226,206,.30);flex:none}
.who{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.who b{font:700 15px/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.cap{display:inline-flex;align-items:center;gap:0}.cap svg{width:15px;height:15px;margin-right:-4px}.cap em{font-style:normal;margin-left:6px;color:#cfe3c0;font-weight:700}
.clk{flex:none;min-width:70px;text-align:center;font:800 19px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:7px 9px;border-radius:9px;background:#0e1311;color:#c9d2cd;border:1px solid #2c3532;font-variant-numeric:tabular-nums}
.clk.on{background:#f2ead8;color:#1e1813;border-color:#f2ead8}
.clk.low{background:#e0503f;color:#fff;border-color:#e0503f}
.clk[hidden]{display:none}
.emo{position:absolute;right:86px;top:50%;transform:translateY(-50%);font-size:26px;animation:emo 2.4s ease forwards;pointer-events:none}
@keyframes emo{0%{opacity:0;transform:translateY(-30%) scale(.6)}15%{opacity:1;transform:translateY(-50%) scale(1.15)}80%{opacity:1}100%{opacity:0;transform:translateY(-90%)}}
.strip{position:relative}
/* El tablero */
.bwrap{position:relative;width:var(--bs);height:var(--bs);flex:none;padding:6px;border-radius:10px;background:linear-gradient(145deg,var(--frame),var(--frame2));box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,230,190,.12)}
.board{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:3px;overflow:hidden;touch-action:none}
.sq{position:relative;background:var(--sq-l)}
.sq.d{background:var(--sq-d)}
.sq.last::before{content:"";position:absolute;inset:0;background:var(--hi)}
.sq.sel::before{content:"";position:absolute;inset:0;background:var(--sel)}
.sq.chk::before{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--chk) 0%,rgba(224,80,63,.45) 45%,transparent 72%)}
.sq .dot{position:absolute;left:50%;top:50%;width:30%;height:30%;margin:-15% 0 0 -15%;border-radius:50%;background:rgba(20,30,25,.32);pointer-events:none;z-index:2}
.sq .ring{position:absolute;inset:4%;border-radius:50%;box-shadow:inset 0 0 0 calc(var(--bs)*.0085) rgba(20,30,25,.38);pointer-events:none;z-index:2}
.sq .co{position:absolute;font:700 calc(var(--bs)*.026)/1 system-ui;pointer-events:none;opacity:.8;z-index:1}
.sq .co.r{left:3%;top:3%}.sq .co.f{right:4%;bottom:2%}
.sq.d .co{color:var(--sq-l)}.sq:not(.d) .co{color:var(--sq-d)}
.pz{position:absolute;inset:4%;width:92%;height:92%;z-index:3;pointer-events:none;filter:drop-shadow(0 calc(var(--bs)*.004) calc(var(--bs)*.004) rgba(0,0,0,.35))}
.pz.w{--f:var(--pw);--s:var(--pws);--k:var(--pwd)}
.pz.b{--f:var(--pb);--s:var(--pbs);--k:var(--pbd)}
.pz.anim{transition:transform .22s cubic-bezier(.3,.8,.3,1)}
.pz.capt{z-index:2;animation:capt .38s ease-in forwards}
@keyframes capt{to{opacity:0;transform:scale(.6) rotate(-12deg)}}
.sq.promo-flash::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;border-radius:4px;background:radial-gradient(circle,rgba(255,236,150,.95) 0%,rgba(255,215,90,.5) 40%,transparent 72%);animation:promo .85s ease-out forwards}
@keyframes promo{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.4)}}
.sq.chk.pulse::before{animation:jaque .7s ease-in-out 2}
@keyframes jaque{50%{transform:scale(1.18);opacity:.75}}
.pz.ghost{opacity:.35}
.drag{position:fixed;z-index:30;pointer-events:none;width:calc(var(--bs)/8*1.25);height:calc(var(--bs)/8*1.25);margin:calc(var(--bs)/-8*.62) 0 0 calc(var(--bs)/-8*.62);filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.drag .pz{inset:0;width:100%;height:100%}
.board.flip{transform:none}
.promo{position:absolute;z-index:8;display:flex;flex-direction:column;background:#f2ead8;border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.55);overflow:hidden;width:calc(100%/8)}
.promo button{position:relative;aspect-ratio:1;border:0;background:none;padding:0}.promo button:hover{background:#e3d6ba}
.promo .pz{inset:6%;width:88%;height:88%}
.promo .px{aspect-ratio:auto;height:28px;font-size:14px;background:#e7dcc4}
.thinking{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;padding:8px 14px;border-radius:12px;background:rgba(20,26,23,.86);color:#eef1ea;font-weight:700;pointer-events:none;font-size:13px}
.thinking[hidden]{display:none}
/* Jugadas y botones */
.moves{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-height:30px;align-items:center;padding:2px 2px;border-radius:10px;background:rgba(10,14,12,.35)}
.moves::-webkit-scrollbar{display:none}
.moves .n{flex:none;color:#7f8c86;font-size:12px;margin-left:4px}
.moves .m{flex:none;padding:3px 6px;border-radius:7px;font:700 13px/1.2 system-ui;color:#dfe6e2;border:0;background:none}
.moves .m.cur{background:#f2ead8;color:#1e1813}
.moves .vacio{color:#7f8c86;font-size:12.5px;padding-left:8px}
.status{min-height:20px;font-size:13.5px;color:#e6ece6;text-align:center;font-weight:650}
.status b{color:#f3dc9a}
.acts{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;width:100%}
.act{min-height:44px;flex:1 1 0;min-width:0;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:12px;border:1px solid #3a4652;background:rgba(16,22,20,.8);color:#dfe6e2;font:700 13.5px/1.1 system-ui,sans-serif}
.act.go{border-color:#7a5d33;background:linear-gradient(#d9bd7d,#bb9856);color:#2a1f12;box-shadow:0 3px 0 #5d4425}
.act:disabled{opacity:.4}
.act[hidden]{display:none}
.banner{width:100%;padding:8px 10px;border-radius:12px;background:#f2ead8;color:#2a2118;font-weight:650;font-size:13.5px;line-height:1.5;text-align:center}
.banner[hidden]{display:none}
.banner button{min-height:34px;border-radius:9px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;padding:0 10px;color:#2a2118;margin:4px 3px 0;vertical-align:middle}
.banner button.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.onl{position:absolute;top:4px;right:max(12px,env(safe-area-inset-right));font-size:11.5px;font-weight:700;color:#cfe3c0;z-index:4;pointer-events:none}
.onl.off{color:#e8cf9a}.onl:empty{display:none}
/* Carteles, hojas, menú */
.over{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,10,12,.58);z-index:9}
.over[hidden]{display:none}
.ccard{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ccard h3{margin:0;font:700 22px/1.2 var(--serif)}
.ccard p{margin:0;color:#4d4031}
.ccard .ic{font-size:34px;line-height:1}
.ccard .btn{width:100%}
.ccard .cap2{font-size:12.5px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:46px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;flex-direction:column}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.on{box-shadow:inset 0 0 0 2px #3f7a5a;background:#e8efe2}
.btn:disabled{opacity:.45}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,12,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(540px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.sheet h4{margin:6px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.sheet .seg{display:flex;gap:6px;flex-wrap:wrap}.sheet .seg .btn{flex:1;min-width:64px}
.sheet .seg.tc .btn{min-width:84px}
.note{font-size:12.5px;color:var(--soft)}
.sheet ul{margin:0;padding-left:18px;color:#4d4031;display:flex;flex-direction:column;gap:4px}
.ulist{list-style:none!important;margin:0;padding:0!important;display:flex;flex-direction:column;gap:6px}
.ulist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.ulist .av{width:34px;height:34px;font-size:18px}
.ulist .nm{flex:1;font-weight:700;min-width:0}
.ulist .nm small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.ulist .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5aa64a;margin-left:6px}
.ulist button{min-height:38px;border-radius:9px;border:1px solid #7a5d33;background:linear-gradient(#d9bd7d,#bb9856);font-weight:700;padding:0 12px;color:#2a1f12}
.ulist button:disabled{opacity:.5}
.ulist.mini{max-height:min(260px,38vh);overflow-y:auto;overscroll-behavior:contain;padding:2px!important;border:1px solid var(--rule);border-radius:14px;background:rgba(255,255,255,.35)}
.ulist.mini li{cursor:pointer;min-height:48px}.ulist.mini li.on{border-color:#3f7a52;background:#e7f1e3;box-shadow:inset 0 0 0 1.5px #3f7a52}
.ulist.mini .chk{width:22px;text-align:center;font-weight:800;color:#3f7a52}.ulist.mini .nm em{font-style:normal;font-size:11px;font-weight:700;color:#3f7a52;border:1px solid #3f7a5266;border-radius:6px;padding:0 5px;margin-left:6px}
.ulist.mini li.vacio{cursor:default;justify-content:center;color:var(--soft)}
.ubusca{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--rule);padding:0 12px;font:inherit;margin-bottom:6px;background:#fffaf0}
.pasos{list-style:none;display:flex;gap:6px;margin:4px 0 8px;padding:0;counter-reset:p}
.pasos li{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--soft);padding:5px 4px;border-radius:9px;background:rgba(0,0,0,.05);counter-increment:p}
.pasos li::before{content:counter(p) " · "}.pasos li.on{background:#3f7a52;color:#fff}.pasos li.ok{background:#d9e8d4;color:#2c5a3b}
.row.pie{position:sticky;bottom:0;background:inherit;padding-top:8px}
.menu-list .salir{border-color:#a3482f66;color:#7a2e1c}
.plist{list-style:none!important;margin:0;padding:0!important;display:flex;flex-direction:column;gap:6px}
.plist li>button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;text-align:left;color:var(--brown)}
.plist li.toca>button{border-color:#3f7a5a;box-shadow:inset 0 0 0 1px #3f7a5a;background:#eef4ea}
.plist .mini{width:46px;height:46px;flex:none;border-radius:4px;overflow:hidden;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);box-shadow:0 0 0 1px #b9a27a}
.plist .mini i{background:var(--sq-l)}.plist .mini i.d{background:var(--sq-d)}.plist .mini i.w::after,.plist .mini i.b::after{content:"";display:block;width:70%;height:70%;margin:15%;border-radius:50%}
.plist .mini i.w::after{background:#fff;box-shadow:0 0 0 .5px #333}.plist .mini i.b::after{background:#222}
.plist .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}.plist .tx b{font-size:14.5px}.plist .tx small{font-size:12px;color:var(--soft)}
.plist .st{flex:none;font-weight:800;font-size:12px;padding:4px 8px;border-radius:8px;background:#e7dcc4;color:#4d4031}
.plist .toca .st{background:var(--olive);color:#f4efe0}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #b9a27a;border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(8,10,12,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#151b18;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#222b27;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#1b2420;font-weight:650;text-decoration:none;color:var(--ink);text-align:left}
.menu-list .tg{margin-left:auto;font-size:12px;color:var(--dim)}
.side .note{color:#9aa6ad}
.toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;pointer-events:none;background:rgba(20,26,23,.96);color:var(--ink);border:1px solid rgba(224,177,74,.35);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);animation:tin .2s ease;max-width:min(360px,90vw);text-align:center}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
.log{margin:0;padding-left:18px;display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 10px;color:#4d4031;font-size:14px;list-style:none!important;padding:0!important}
.log span{font-weight:700}.log i{font-style:normal;color:var(--soft)}
/* Acostado: tablero a la izquierda, todo lo demás a la derecha */
@media (orientation:landscape) and (max-height:600px){
  .mesa{display:grid;grid-template-columns:auto min(300px,38vw);grid-template-rows:auto 1fr;justify-content:center;align-content:center;column-gap:12px;row-gap:6px}
  .bwrap{grid-column:1;grid-row:1/3;align-self:center}
  #col-a{grid-column:2;grid-row:1;width:100%}
  #col-b{grid-column:2;grid-row:2;width:100%;align-self:start}
  .act{font-size:12.5px;padding:0 4px}
}
@media (prefers-reduced-motion:reduce){.sheet,.side-panel,.toast,.emo,.pz.capt,.sq.promo-flash::after,.sq.chk.pulse::before{animation:none}.pz.anim{transition:none}.pz.capt{display:none}}

/* v74: la lista de amigos para invitar no se achica dentro de la hoja (se veía una sola fila cortada): se ven 2 o 3 filas enteras y, si hay más, scroll */
.sheet .ulist,.ulist.chica,.ulist.compacta,.ulist.corta{flex:none}.ulist li{flex:none}.ulist.chica,.ulist.compacta{max-height:max(156px,min(240px,34vh))}
</style>
<script>
/* ───────── Latido (v76): UNA sola consulta periódica a la planilla para toda la página ─────────
   Antes cada parte preguntaba por su lado (el chat cada 4 s, el buzón del juego cada 5–8 s, los amigos del menú
   cada 4 s, la lista de gente cada 25–30 s, la estancia cada 90 s). Ahora pregunta sólo esto, con la acción «latido»
   de la planilla, y reparte la respuesta a cada parte.
   Cada cuánto (los topes que pidió el usuario):
     · con una charla abierta: cada 2 s, siempre;
     · con el chat cerrado y la app a la vista: arranca en 4 s y, si no pasa nada, sube de a 1 s hasta 9 s
       (así el primer mensaje después de un rato llega en menos de 10 s, contando lo que tarda la red);
     · vuelve a 4 s apenas llega algo, al tocar la pantalla o al volver a la app (en ese caso pregunta enseguida);
     · en segundo plano: cada 30 s;
     · con una mesa armándose o conectándose: cada 3 s como mucho.
   El chat de la mesa durante la partida va directo entre los teléfonos (WebRTC): no pasa por acá.
   Si la planilla es vieja (no conoce «latido»), se apaga solo y cada parte vuelve a preguntar como antes.
   API: LATIDO.registrar(nombre, {armar(p), recibir(j), ms(), error(e)}) · LATIDO.activo() · LATIDO.ahora() · LATIDO.buzon()
        LATIDO.ultimo() → la última respuesta · LATIDO.espera(t0) → cuánto esperar entre consultas del buzón
        mientras se conecta una mesa (0,7 s los primeros 90 s; después 2 s) · evento «bloques-latido» con la respuesta. */
(function(){
'use strict';
if(window.LATIDO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const MIN=4000,MAX=9000,PASO=1000,FONDO=30000,MESA=3000;
const L={parts:{},timer:0,prox:0,ult:0,enCurso:false,otra:false,quietos:0,viejo:false,ok:false,fallas:0,j:null,jAt:0,mesaHasta:0,tocadoAt:0,limpiado:false,
  sig:{t:0,inv:'',pr:'',eg:null,pa:null,am:''},n:0};
async function call(p,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();
    if(!j||!j.ok){const e=new Error(j&&j.error||'La planilla respondió con un error.');e.planilla=true;throw e;}
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
function intervalo(){
  if(document.hidden)return FONDO;
  let ms=Math.min(MAX,MIN+L.quietos*PASO);
  if(Date.now()<L.mesaHasta)ms=Math.min(ms,MESA);
  for(const k in L.parts){try{const m=L.parts[k].ms&&L.parts[k].ms();if(m>0)ms=Math.min(ms,m);}catch(_){}}
  return ms;
}
function programar(ms){
  if(L.viejo||!acct()||!Object.keys(L.parts).length)return;
  if(ms===undefined)ms=Math.max(0,L.ult+intervalo()-Date.now());
  const cuando=Date.now()+ms;
  if(L.timer&&L.prox&&L.prox<=cuando)return;   // ya hay uno antes
  clearTimeout(L.timer);L.prox=cuando;L.timer=setTimeout(tick,ms);
}
function reprogramar(){clearTimeout(L.timer);L.timer=0;L.prox=0;programar();}
async function tick(){
  L.timer=0;L.prox=0;
  if(L.viejo)return;
  const a=acct();if(!a)return;
  if(L.enCurso){L.otra=true;return;}
  L.enCurso=true;L.ult=Date.now();
  const p={accion:'latido',usuario:a.usuario,token:a.token,q:{bz:{}}};
  for(const k in L.parts){try{L.parts[k].armar&&L.parts[k].armar(p);}catch(_){}}
  let j=null,err=null;
  try{j=await call(p);L.n++;}catch(e){err=e;}
  if(j){
    L.ok=true;L.fallas=0;L.j=j;L.jAt=Date.now();
    const nuevo=novedad(j);L.quietos=nuevo||L.n<=1?0:Math.min(L.quietos+1,20);
    for(const k in L.parts){try{const r=L.parts[k].recibir&&L.parts[k].recibir(j);if(r&&r.then)await r.catch(()=>{});}catch(_){}}
    try{window.dispatchEvent(new CustomEvent('bloques-latido',{detail:j}));}catch(_){}
    if(j.lp&&!L.limpiado){L.limpiado=true;call({accion:'limpieza',usuario:a.usuario,token:a.token},60000).catch(()=>{});}   // una vez por día, la hace el primero
  }else{
    const m=String(err&&err.message||err);
    if(/desconocida/i.test(m)){apagar();}
    else if(err&&err.planilla&&!/sesión venció/i.test(m)&&++L.fallas>=3){apagar();}   // algo anda mal con «latido»: mejor como antes
    for(const k in L.parts){try{L.parts[k].error&&L.parts[k].error(err);}catch(_){}}
  }
  L.enCurso=false;
  if(L.otra){L.otra=false;programar(0);}else programar();
}
function novedad(j){
  // Novedad = algo para vos: un mensaje, una invitación, amigos/solicitudes, tu estancia o La Gran Pampa.
  // (Que otro se conecte o cambie de juego no cuenta: con mucha gente pasaría todo el tiempo y nunca se iría más lento.)
  const S=L.sig,am=j.amigos?JSON.stringify(j.amigos):S.am;
  const ch=(Number(j.t)||0)!==S.t||String(j.inv||'')!==S.inv||(j.eg!==undefined&&j.eg!==S.eg)||(j.pa!==undefined&&j.pa!==S.pa)||am!==S.am||(j.bz&&j.bz.invitacion);
  const primera=!L.n||L.n===1;
  S.t=Number(j.t)||0;S.inv=String(j.inv||'');S.am=am;if(j.eg!==undefined)S.eg=j.eg;if(j.pa!==undefined)S.pa=j.pa;
  return ch&&!primera;
}
function apagar(){
  if(L.viejo)return;L.viejo=true;L.ok=false;clearTimeout(L.timer);
  try{window.dispatchEvent(new CustomEvent('bloques-latido-viejo'));}catch(_){}
}
function despertar(){if(L.viejo)return;L.quietos=0;programar(0);}
// Tocar la pantalla: vuelve al paso rápido (sin preguntar de más: como mucho a los 4 s de la anterior).
function tocado(){
  if(L.viejo||document.hidden)return;const t=Date.now();if(t-L.tocadoAt<1500)return;L.tocadoAt=t;
  if(L.quietos>0){L.quietos=0;clearTimeout(L.timer);L.timer=0;L.prox=0;programar(Math.max(150,L.ult+MIN-t));}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)despertar();else reprogramar();});
for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,tocado,{passive:true,capture:true});
window.addEventListener('online',despertar);
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'){L.sig={t:0,inv:'',pr:'',eg:null,pa:null,am:''};L.n=0;programar(300);}});
window.LATIDO={
  registrar(n,o){L.parts[n]=o||{};programar(L.ult?undefined:1200);},
  quitar(n){delete L.parts[n];},
  activo:()=>!L.viejo&&!!acct()&&L.ok,                 // ya respondió bien: las demás partes no preguntan por su lado
  usable:()=>!L.viejo&&!!acct(),                       // todavía no sabemos si la planilla lo conoce, pero se intenta
  get viejo(){return L.viejo;},
  ahora(){if(L.viejo)return;programar(L.enCurso?0:Math.max(0,Math.min(250,L.ult+500-Date.now())));},   // «preguntá ya» (de a una)
  despertar,
  ultimo:()=>L.j,ultimoAt:()=>L.jAt,
  // Lo del buzón que trajo el latido recién (si es de hace menos de 2,5 s): el juego lo usa en vez de preguntar otra vez.
  buzon(){return L.j&&L.j.bz&&Date.now()-L.jAt<2500?Object.assign({ok:true},L.j.bz):null;},
  espera(t0){L.mesaHasta=Date.now()+10000;return Date.now()-(t0||0)<90000?700:2000;},
  mesa(seg){L.mesaHasta=Date.now()+(seg||10)*1000;programar();},
  intervalo,
  get estado(){return {quietos:L.quietos,ms:intervalo(),n:L.n,ok:L.ok,viejo:L.viejo};}
};
})();

</script>
<script>
/* ───────── SYNCRO: tu progreso en todos los dispositivos (v63) ─────────
   Va en todas las páginas. Con la cuenta abierta, lo que cada juego guarda en este dispositivo (preferencias,
   partidas en curso contra la compu, récords, rangos, XP, logros, regalos para la estancia…) también se guarda en
   la planilla (accion=sync, hoja «Partes»), y al abrir cualquier juego —o al volver a él— se trae lo del otro
   dispositivo y se junta con lo de acá:
   · cada clave guarda cuándo cambió por última vez: gana la más nueva (una partida en curso, una preferencia);
   · las listas se unen (partidas ya contadas), los récords se quedan con lo mejor, los contadores con lo mayor;
   · «rk» (rangos, XP y logros de todos los juegos) se junta con RANGOS.importData (que también trae LOGROS).
   Los cambios se notan solos (se envuelve localStorage.setItem): se suben a los pocos segundos y al salir.
   Cuando se trae algo nuevo, avisa con el evento «bloques-sync» {detail:{claves:[…], partes:[…]}} para que cada
   juego lo muestre (p. ej. retomar la partida del otro dispositivo).
   BloqueAR (su progreso, medallas, récords y apariencia) sigue con su sincronización de siempre (src/688_cuenta.js),
   y EstanciAR con la suya (hoja EstPriv). API: window.SYNCRO = {ahora(), estado(), html(), onEstado(fn), partes}. */
(function(){
'use strict';
if(window.SYNCRO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
let ST;try{ST=window.localStorage;}catch(_){ST=null;}
const rawSet=ST?Storage.prototype.setItem:null,rawDel=ST?Storage.prototype.removeItem:null;
const ls={get(k){try{return ST.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?rawDel.call(ST,k):rawSet.call(ST,k,v);}catch(_){}},
  json(k,d){try{const v=JSON.parse(ST.getItem(k)||'null');return v??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const me=()=>{const a=acct();return a?String(a.usuario).toLowerCase():'';};
const dev=(()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;})();
const pruebas=/[?#&]sync-off\b/.test(location.href);

/* ── Qué se guarda de cada juego ──
   [clave, regla]: 'nuevo' (por defecto) · 'union' (lista) · 'min' / 'max' (objeto de números) · 'claves' (objeto: se
   suman las claves) · 'maxnum' (número) · 'recsol' (récords del solitario). «{me}» es tu usuario. */
const PARTES={
  truco:['truco-np','truco-meta','truco-dif','truco-lg-dif','truco-ayuda','truco-partida-v1','truco-eq-v1',['truco-xp-hechas','union']],
  uno:['uno-meta','uno-especial','uno-dif','uno-bots','uno-apilar','uno-ayuda','uno-mesa-n','uno-partida-v1',['uno-xp-hechas','union']],
  pool:['pool-modo','pool-dif','pool-serie','pool-meta','pool-guia','pool-reloj','pool-reloj-on','pool-n','pool-sonido','pool-vibrar','pool-zurdo','pool-soltar','pool-sens','pool-efecto-fijo','pool-ayuda','pool-tutorial-ok','pool-partida-v1',['pool-xp-hechas','union']],
  ludo:['ludo-dif','ludo-bots','ludo-color','ludo-eq','ludo-reglas','ludo-auto1','ludo-ayuda','ludo-mesa-n','ludo-partida-v1',['ludo-xp-hechas','union']],
  poblar:['poblar-dificultad','poblar-jugadores','poblar-jugadores-online','poblar-ayuda','poblar-partida-v2',['poblar-xp-hechas','union']],
  solos:['sudoku-dif','sudoku-errores','sudoku-choques','sudoku-zona','sudoku-iguales','sudoku-notasAuto','sudoku-faltan','sudoku-ayuda','sudoku-partida-v1',['sudoku-records-v1','min'],['sudoku-dias-v1','claves'],['sudoku-xp-hechas','union'],
    'solitario-robo','solitario-consol','solitario-nivel','solitario-ayuda','solitario-partida-v1','solitario-racha',['solitario-records-v1','recsol'],['solitario-dias-v1','claves'],['solitario-xp-hechas','union'],
    'buscaminas-dif','buscaminas-resaltar','buscaminas-listos','buscaminas-chord','buscaminas-mantener','buscaminas-vibrar','buscaminas-ayuda','buscaminas-partida-v1',['buscaminas-records-v1','min'],['buscaminas-dias-v1','claves'],['buscaminas-stats-v1','nuevo'],['buscaminas-xp-hechas','union']],
  laberinto:['laberinto-pref','laberinto-dif','laberinto-libre','laberinto-ayuda','laberinto-sonido','laberinto-partida-v1',['laberinto-records-v1','max'],['laberinto-campana-v1','max'],['laberinto-dias-v1','claves'],['laberinto-xp-hechas','union']],   // v73
  invasores:['invasores-ajustes','invasores-cfg','invasores-taller','invasores-tut','invasores-partida-v1',['invasores-records','max'],['invasores-dia','claves'],['invasores-xp-hechas','union']],   // v73 InvasorAR
  pampa:['pampa-resultado','pampa-visto','pampa-resumen','pampa-cruce','pampa-copas','pampa-ayuda-9'],
  gen:[['bloques-novedades','maxnum'],['bloques-chat-read-{me}','max'],['bloques-chat-borr-{me}','max'],'bloques-chat-frase','bloques-chat-modo',
    'bloques-ranked-bloquear','bloques-ranked-poblar','bloques-ranked-truco','bloques-ranked-uno','bloques-ranked-ludo','bloques-ranked-pool','bloques-ranked-invasores','bloques-ranked-estancia',
    'bloques-favoritos-v1','bloques-orden-v1']   // v67: juegos fijados y orden propio del menú de juegos
};
// v75: también el oro. Antes, el oro que ganabas sin que cambiara otra cosa de «rk» (el cofre al subir de nivel la estancia,
// la pulpería, una compra con oro) no se marcaba para subir: si cerrabas la app, el otro dispositivo nunca lo veía.
const RK_CLAVES=['bloques-rangos-v1','bloques-xpjuegos-v1','bloques-logros-v1','bloques-partidas-v1','bloques-oro-v1'];
const clavesDe=n=>(PARTES[n]||[]).map(x=>{const [k,r]=Array.isArray(x)?x:[x,'nuevo'];return [k.replace('{me}',me()),r];});
let MAPA=null,MAPA_U='';
function parteDe(k){
  if(!MAPA||MAPA_U!==me()){MAPA=new Map();MAPA_U=me();for(const x of RK_CLAVES)MAPA.set(x,'rk');MAPA.set('estancia-premios','premios');MAPA.set('pampa-act','act');
    for(const n of Object.keys(PARTES))for(const [x] of clavesDe(n))MAPA.set(x,n);}
  return MAPA.get(k)||'';
}
// JSON con las claves ordenadas, para comparar sin falsos «cambió».
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o);}

/* ── Cuándo cambió cada clave (por dispositivo) ── */
const META_K='sync-meta-v1';
// Otra cuenta en este dispositivo: se arranca de cero y lo que quedó acá de la otra cuenta no se le sube a ésta
// (lo de la cuenta nueva gana; lo que sólo está acá se queda acá hasta que se vuelva a tocar).
function metaCargar(){let M=ls.json(META_K,{});if(M.u&&M.u!==me())M={ajena:true};return M;}
let META=metaCargar();
function metaSave(){META.u=me();ls.set(META_K,JSON.stringify(META));}
function hash(s){if(s==null)return '∅';let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;}
// Mira si cambió algo desde la última vez. «t» = ahora; lo que nunca se miró en este dispositivo arranca en t=1
// (así, si la cuenta tiene algo más nuevo, gana la cuenta).
function revisar(n){const M=(META[n]=META[n]||{});let ch=false;
  for(const [k] of clavesDe(n)){const v=ls.get(k),h=hash(v),m=M[k];
    if(!m){M[k]={h,t:v==null?0:1};}else if(m.h!==h){M[k]={h,t:Date.now()};ch=true;}}
  return ch;}
function exportar(n){revisar(n);const M=META[n]||{},k={};
  for(const [x] of clavesDe(n)){const m=M[x];if(!m)continue;const v=ls.get(x);if(v==null&&!m.t)continue;k[x]=[v,m.t||0];}
  return {k};}
const J=s=>{try{return JSON.parse(s);}catch(_){return null;}};
function juntarValor(regla,a,b){   // a = lo de acá, b = lo de la cuenta (strings)
  if(a==null)return b;if(b==null)return a;
  const A=J(a),B=J(b);
  if(regla==='union'&&Array.isArray(A)&&Array.isArray(B)){const o=[...A];for(const x of B)if(!o.includes(x))o.push(x);return JSON.stringify(o.slice(-120));}
  if((regla==='min'||regla==='max')&&A&&B&&typeof A==='object'&&typeof B==='object'){const o={...A};
    for(const [x,v] of Object.entries(B))if(Number.isFinite(v)&&(!Number.isFinite(o[x])||(regla==='min'?v<o[x]:v>o[x])))o[x]=v;return JSON.stringify(o);}
  if(regla==='claves'&&A&&B&&typeof A==='object'&&typeof B==='object')return JSON.stringify({...B,...A});
  if(regla==='maxnum'){const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?String(Math.max(x,y)):a;}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u','a','l','k','s','o','m','r','v','w'],   // v73: v y w, InvasorAR
    // v70: también ajedrez, pool, ludo, los del día y los retos
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){

    let traidos=[],partes=[];const ajena=!!META.ajena;

      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}

        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);

    else{setSt(navigator.onLine===false||e instanceof TypeError||e.name==='AbortError'?'off':'err',m);for(const n of TODAS)if(n)SUC.dirty.add(n);}
  }finally{SUC.busy=false;if(SUC.again){SUC.again=false;setTimeout(()=>ahora(true),300);}}
}

/* ── Notar los cambios: cada vez que un juego guarda algo de una parte, se programa la subida ── */
if(ST&&!pruebas){

function arrancar(){

  window.addEventListener('online',()=>{if(SUC.dirty.size)ahora(true);});

  try{const sp=()=>{const b=document.getElementById('side-panel');if(b)new MutationObserver(()=>engancharMenu()).observe(b,{childList:true});};if(document.getElementById('side-panel'))sp();else document.addEventListener('DOMContentLoaded',sp);}catch(_){}
}

window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'&&acct()){META=metaCargar();SUC.primero=true;ahora(true);}});

function auto(k){const n=parteDe(k);if(!n||ESPECIALES[n])return;const M=(META[n]=META[n]||{});M[k]={h:hash(ls.get(k)),t:1};metaSave();}
window.SYNCRO={ahora,auto,html,texto,estado:()=>({...E,sub:undefined}),onEstado(f){E.sub.add(f);},partes:PARTES,
  cuenta(){META=metaCargar();SUC.primero=true;ahora(true);},_dev:dev,_canon:canon};
})();

<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────

   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el

   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).

   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta

   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa?

   · Al pasar a segundo plano (visibilitychange / pagehide / freeze) se manda por TODAS las conexiones abiertas un aviso

     (5 minutos; o 3 veces la gracia de las pruebas) en vez de la normal, y el cartel dice «salió un momento de la app».
   · El que volvió: recuerdo() acepta hasta GRACIA_FONDO desde que la página se fue a segundo plano.
   · RECON.fondo() → {yo: ms desde que me fui (0 si estoy), otro: ms desde que el otro avisó (0 si nadie)}.
   v67 · RED: mejor conexión.
   · Toda RTCPeerConnection (de cualquier juego) suma servidores STUN públicos de respaldo (Google 1 y 2, Cloudflare),
     sin repetir los que ya trae el juego.
   · RED.gathered(pc, max=6000): espera los candidatos ICE, pero termina antes si ya hay salida directa (srflx) y relé

(function(){

let ocultoT=0,cerrando=false;

/* ── RED (v67): STUN de respaldo y espera de candidatos más corta ── */
const STUN_EXTRA=['stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302','stun:stun.cloudflare.com:3478'];

/* ── La mesa en la que estás ── */

<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',truco:'TrucAR',uno:'UnoAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',invasores:'InvasorAR'};
// Solitarios (v62): no tienen rango (no son competitivos), pero su XP suma al nivel general.
const SOLOS={sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',laberinto:'LaberintAR'};   // v73: LaberintAR (arcade para uno solo, sin rango)
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';

function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido

// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.

// v70: «info» (opcional) dice cómo fue la partida, para que las leguas dependan del rival y del resultado, para los

//   info = {j: 'truco' (id del juego), res: 'g' ganó | 'e' empate | 'p' perdió, rival: 'p' personas | 'c' compu | 's' solo,
//           dif: 'facil'|'normal'|'dificil'|'maestro', esf: true si la partida tuvo «esfuerzo» (cada juego dice cuánto

  // (otra forma de decir lo mismo: {ok} = {esf}, {extra} = {x}; si no dicen el esfuerzo, se calcula con cuenta())

    if(info.esf===undefined)info.esf=cuenta(info.j||NOM_ID[de],info).ok;}

  // v70 (dos monedas): lo que dan los juegos es ORO (ORO.premio, con su tabla y su tope del día). Para la estancia queda «un
  // poquito» de pesos: un décimo de la XP (mínimo 2), hasta 30 por partida y hasta 150 por día. Iguales a ECO.premio de EstanciAR.
  const d=new Date(Date.now()),dia=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,PD=ls.json('estancia-premios-dia',{}),ya=PD.d===dia?PD.n||0:0;

/* ── Leguas de La Gran Pampa (v70) ──
   Cuánto da una partida ranked, según contra quién y cómo terminó. Sin «esfuerzo» (perder en 20 segundos, abandonar
   enseguida) no da nada. Contra personas da más que contra la compu.
                     compu Normal   compu Difícil   personas
     Ganar                1               2             3
     Empate (ajedrez)     0               1             2
     Perder peleando      0               0             1
   Solo (Maratón ranked de BloqueAR): 1 si llegás a la meta. En Fácil y en las amistosas: nada.
   Topes por día: cada juego hasta 4 leguas (y de esas, hasta 2 contra la compu); EstanciAR 1 por cosecha (hasta 4);

function leguasTxt(pr){if(!pr)return '';return pr.leguas?` · 🚩 +${pr.leguas} ${pr.leguas===1?'legua':'leguas'} en La Gran Pampa`:pr.nota?` · 🚩 ${pr.nota}`:'';}

  const tot=Object.keys(PAMPA_ACT).reduce((s,k)=>s+Math.min(PAMPA_ACT[k].tope,o[k]|0),0);
  let g=Math.min(n,A.tope-(o[q]|0),PAMPA_DIA-tot);
  // de la compu, hasta 2 por juego y por día (se cuenta en cada dispositivo)
  if(compu&&g>0){const C=ls.json('pampa-act-c',{}),c=C.d===dia?C:{d:dia};g=Math.min(g,PAMPA_COMPU-(c[q]|0));if(g>0){c[q]=(c[q]|0)+g;ls.set('pampa-act-c',JSON.stringify(c));}}

const dev=()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;};
const diaAR=(t=Date.now())=>new Date(t-3*3600e3).toISOString().slice(0,10);

/* ── Cuánto da cada juego (partida ganada contra la compu, duración normal) ── */
const NIVEL_DIF=s=>({facil:1,principiante:1,normal:2,medio:2,intermedio:2,dificil:3,experto:3,maestro:3})[s]||2;
const ORO_TABLA={
  poblar:12,
  truco:i=>((i.x&&i.x.a)||15)>=30?10:6,          // a 30: 10 · a 15: 6
  ajedrez:i=>i.x&&i.x.ritmo==='bala'?4:8,         // bala: 4
  uno:6,ludo:6,
  pool:4,                                          // por mesa de Bola 8
  bloquear:(i,ex)=>Math.min(10,Math.floor(((ex&&ex.lin)||(i.x&&i.x.lin)||0)/10)),   // 1 cada 10 líneas, hasta 10
  sudoku:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  solitario:i=>i.extra&&i.extra.delDia?6:(i.extra&&i.extra.dificultad==='dificil'?3:2),
  buscaminas:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  laberinto:i=>i.extra&&i.extra.delDia?6:Math.min(10,4+2*Math.min(3,(i.extra&&i.extra.mapas)||0)),   // v73: 4 por participar, +2 por mapa limpio (hasta 10); el del día 6
  invasores:i=>{const x=i.x||i.extra||{};if(x.modo==='duelo')return 6;if(x.modo==='dia')return 6;return Math.min(10,2+(x.olas||0))*(x.dif==='tranquila'?.6:1);},   // v73: 2 + 1 por oleada limpia (hasta 10); duelo y del día 6
  reto:5                                           // cada reto de la semana cumplido
};
const ORO_DEF=4;   // un juego que todavía no está en la tabla
const MULT_RES={g:1,e:.6,p:.4,a:0},MULT_RIVAL={p:2,c:1,s:1};
const MULT_DIF=d=>d==='facil'?.5:(d==='dificil'||d==='maestro')?1.5:1;
const TOPE=[150,300];   // del día: hasta 150 enteros, hasta 300 a la mitad, después un cuarto
const CAMBIO={tasa:8,dia:50};
const NOM_ID={BloqueAR:'bloquear',PoblAR:'poblar',TrucAR:'truco',UnoAR:'uno',AjedrezAR:'ajedrez',PoolAR:'pool',LudAR:'ludo',SudokAR:'sudoku',SolitARio:'solitario',BuscaminAR:'buscaminas',LaberintAR:'laberinto',InvasorAR:'invasores'};
const SOLOS=new Set(['sudoku','solitario','buscaminas','laberinto']);

// «info» de cada juego, en la forma corta que usa RANGOS ({res:'g'|'e'|'p'|'a', rival:'p'|'c'|'s', esf}); también acepta la larga
// ({rival:'compu'|'personas', res:'gana'|'empata'|'pierde'|'abandona', ok, extra}). Los solitarios van como «solo».
function norm(info,de){if(!info||typeof info!=='object')return info;const o={...info};
  const R={compu:'c',personas:'p',amigos:'p',solo:'s'},S={gana:'g',empata:'e',pierde:'p',abandona:'a'};
  if(R[o.rival])o.rival=R[o.rival];if(S[o.res])o.res=S[o.res];if(o.esf===undefined&&o.ok!==undefined)o.esf=!!o.ok;
  if(!o.j&&de)o.j=NOM_ID[de]||NOM_ID[String(de).replace(/ \(reto\)$/,'')]||'';
  if(SOLOS.has(o.j))o.rival='s';
  if(o.extra&&o.extra.dificultad&&!o.dif)o.dif=o.extra.dificultad;
  return o;}
// Cuánto vale (sin el tope del día). Sin «info» (la forma vieja): como una partida ganada sin rival.
function calc(de,info,extra){
  if(/\(reto\)$/.test(String(de||'')))return ORO_TABLA.reto;
  const i=norm(info||{},de)||{},j=i.j||NOM_ID[de]||'';
  const b=ORO_TABLA[j],base=typeof b==='function'?b(i,extra):b!=null?b:ORO_DEF;
  if(!info)return Math.round(base);
  const res=i.res||'g';if(res==='a'||i.esf===false)return 0;   // sin esfuerzo (perder en 20 segundos, ganar sin jugar) no da
  // contra quién: la misma regla que las leguas (RANGOS.cuenta: personas 2, compu Difícil 1,5, Normal 1, Fácil 0,5, solo 1)
  let rv=1;try{rv=SOLOS.has(j)?1:window.RANGOS&&RANGOS.cuenta?RANGOS.cuenta(j,{rival:i.rival||'c',res,dif:i.dif}).mult||1:(MULT_RIVAL[i.rival]||1)*(i.rival==='c'?MULT_DIF(i.dif):1);}catch(_){}
  return Math.round(base*(MULT_RES[res]??1)*rv);}

/* ── Datos ── */
function load(){const o=ls.json(K,{});o.d=o.d&&typeof o.d==='object'?o.d:{};o.k=o.k&&typeof o.k==='object'?o.k:{};o.p=o.p&&typeof o.p==='object'?o.p:{};o.h=Array.isArray(o.h)?o.h:[];return o;}
function save(o){o.at=Date.now();ls.set(K,JSON.stringify(o));aviso();}
let SUB=new Set();function aviso(){for(const f of SUB)try{f(saldo());}catch(_){}try{document.querySelectorAll('[data-oro-saldo]').forEach(el=>{el.textContent=fmt(saldo());});}catch(_){}}
function saldoDe(o){let s=0;for(const x of Object.values(o.d))s+=(Number(x&&x.g)||0)-(Number(x&&x.s)||0);for(const x of Object.values(o.k))s+=Number(Array.isArray(x)?x[0]:0)||0;for(const x of Object.values(o.p))s-=Number(Array.isArray(x)?x[0]:0)||0;return Math.max(0,Math.round(s));}
function saldo(){return saldoDe(load());}
function hist(o,n,de){o.h.unshift({t:Date.now(),n:Math.round(n),de:String(de||'').slice(0,40)});if(o.h.length>25)o.h.length=25;}
function mio(o){const d=dev();return (o.d[d]=o.d[d]||{g:0,s:0});}
// Ganar oro suelto (una partida). Devuelve lo que entró.
function ganar(n,de,sinAnim){n=Math.round(Number(n)||0);if(n<=0)return 0;const o=load();mio(o).g+=n;hist(o,n,de);save(o);if(!sinAnim)anim(n);return n;}
// Un premio con nombre (cuenta una sola vez, aunque se cobre en dos dispositivos).
function cobrar(key,n,de,sinAnim){key=String(key);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.k[key])return 0;o.k[key]=[n,Date.now()];if(n)hist(o,n,de);save(o);if(n&&!sinAnim)anim(n);return n;}
function cobrado(key){return !!load().k[String(key)];}
// Comprar algo con nombre (se paga una vez). true si ya era tuyo o si alcanzó.
function tiene(id){return !!load().p[String(id)];}
function comprar(id,n,que){id=String(id);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.p[id])return true;if(saldoDe(o)<n)return false;o.p[id]=[n,Date.now()];hist(o,-n,que||id);save(o);return true;}
// Gastar suelto (lo que se usa, como el cambio en la pulpería).
function gastar(n,que){n=Math.max(0,Math.round(Number(n)||0));const o=load();if(saldoDe(o)<n)return false;mio(o).s+=n;hist(o,-n,que);save(o);return true;}
// Pulpería: oro → pesos (1 → 8), hasta 50 de oro por día en cada dispositivo. Devuelve los pesos (0 si no se pudo).
function cambioHoy(){const o=load(),c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;return Math.max(0,CAMBIO.dia-c);}
function cambiar(n){n=Math.floor(Number(n)||0);if(n<=0||n>cambioHoy())return 0;const o=load();if(saldoDe(o)<n)return 0;
  mio(o).s+=n;const c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;o.cam={d:diaAR(),n:c+n};hist(o,-n,'Cambio en la pulpería');save(o);return n*CAMBIO.tasa;}

/* ── Lo que da una partida (lo llama RANGOS.premio): con el tope del día ── */
function premio(de,info,extra){
  let v=calc(de,info,extra);if(v<=0)return 0;
  const o=load(),hoy=diaAR(),ya=o.dia&&o.dia.d===hoy?o.dia.n|0:0;
  v=Math.max(1,Math.round(v*(ya<TOPE[0]?1:ya<TOPE[1]?.5:.25)));
  o.dia={d:hoy,n:ya+v};mio(o).g+=v;hist(o,v,String(de||'').replace(/ \(reto\)$/,' · reto'));save(o);
  anim(v);
  try{setTimeout(()=>niveles(true),1600);}catch(_){}
  return v;}
function hoy(){const o=load();return o.dia&&o.dia.d===diaAR()?o.dia.n|0:0;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() como «o» ── */
function exportData(){const o=load();return {d:o.d,k:o.k,p:o.p,ti:o.ti||null,mc:o.mc||null,r70:o.r70||0,at:o.at||0};}
function importData(d){if(!d||typeof d!=='object')return false;const o=load();let ch=false;
  for(const [dv,x] of Object.entries(d.d||{})){if(!x||typeof x!=='object')continue;const y=o.d[dv]||{g:0,s:0},g=Math.max(Number(y.g)||0,Number(x.g)||0),s=Math.max(Number(y.s)||0,Number(x.s)||0);if(g!==(y.g||0)||s!==(y.s||0)||!o.d[dv]){o.d[dv]={g,s};ch=true;}}
  for(const M of ['k','p'])for(const [key,x] of Object.entries(d[M]||{})){if(!Array.isArray(x))continue;const y=o[M][key];
    if(!y){o[M][key]=[Number(x[0])||0,Number(x[1])||0];ch=true;}else if((Number(x[0])||0)>(Number(y[0])||0)){o[M][key]=[Number(x[0])||0,Math.min(Number(y[1])||0,Number(x[1])||0)];ch=true;}}
  if(Array.isArray(d.ti)&&(!Array.isArray(o.ti)||(Number(d.ti[2])||0)>(Number(o.ti[2])||0))){o.ti=d.ti;ch=true;}
  if(Array.isArray(d.mc)&&(!Array.isArray(o.mc)||(Number(d.mc[1])||0)>(Number(o.mc[1])||0))){o.mc=d.mc;ch=true;}
  if(d.r70&&!o.r70){o.r70=d.r70;ch=true;}
  if(ch){const at=o.at;ls.set(K,JSON.stringify({...o,at:Math.max(at||0,d.at||0)}));aviso();}
  return ch;}

// Para el cartel final de cada juego: « · ◆+8 de oro · 🎁 +$ 3 para tu estancia».
function premioTxt(pr){if(!pr)return '';const p=[];if(pr.oro)p.push(txt(pr.oro));if(pr.pesos)p.push(`🎁 +$${fmt(pr.pesos)} para tu estancia`);return p.join(' · ');}
let FLY=null,FLYN=0,FLYT=0;

  document.body.appendChild(FLY);requestAnimationFrame(()=>requestAnimationFrame(()=>FLY&&FLY.classList.add('on')));

function R(){return window.RANGOS||null;}

function juegos(){const r=R();return r?[...Object.keys(r.GAMES||{}),...Object.keys(r.SOLOS||{})]:[];}
// Todos los títulos que tenés: [{id, n, de}]
function titulos(){const out=[],g=lvGen();
  for(const [L,n] of Object.entries(TIT_GEN))if(g>=+L)out.push({id:'g'+L,n,de:`Nivel general ${L}`});
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);if(l>=10)out.push({id:'j:'+j+':10',n:T[0],de:`${JNOM[j]||j} nivel 10`});if(l>=30)out.push({id:'j:'+j+':30',n:T[1],de:`${JNOM[j]||j} nivel 30`});}
  const o=load(),camp=Object.keys(o.k).filter(k=>/^pm:\d{4}-\d\d-\d\d:\d+:1$/.test(k)).length;
  if(camp)out.push({id:'pm:campeon',n:'Campeón de La Gran Pampa',de:camp===1?'Ganaste una semana':`Ganaste ${camp} semanas`});

window.TITULOS=(function(){

  function poner(u,t,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const v=limpio(t);if(v)M.u[k]=v;else delete M.u[k];if(guardar)save();}

  return {poner,caudillos,guardarLista,de,html};
})();

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}

function revisar(o,j){

  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;

const COLA=[];let MOSTRANDO=false;

// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;

  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

function llamadoHtml(c,m){
  const mine=lc(m.de)===lc(S.me),ic={truco:'🃏',uno:'🎴',poblar:'🏘️',bloquear:'🧱',ajedrez:'♟️',ludo:'🎲',pool:'🎱',invasores:'👾'}[c.j]||'🎮',viejo=Date.now()-m.t>30*60e3;

  else if(viejo)pie=`<span class="cx-inv-st st-vieja">Ya pasó un rato: puede que la mesa ya esté jugando.</span>`;
  else if(yo&&!vencio)pie=`<span class="cx-inv-st st-esperando"><i class="cx-spin"></i> Esperando que ${esc(c.host||m.de)} te haga lugar…</span>`;
  else if(yo&&vencio)pie=`<span class="cx-inv-msg">No te llegó lugar: puede que la mesa ya se haya llenado.</span><span class="cx-inv-b"><button type="button" class="cx-cplay" data-a="meprendo" data-id="${esc(m.id)}">Probar de nuevo</button></span>`;
  else pie=`<span class="cx-inv-b"><button type="button" class="cx-cplay" data-a="meprendo" data-id="${esc(m.id)}">🙋 Me prendo</button></span>`;

async function mePrendo(mid){
  const m=S.msgs.find(x=>x.id===mid),o=m&&S.plain[mid],c=o&&o.card;if(!c||!c.ll)return;

// v70.1: la planilla 19 no conoce LudAR ni PoolAR: su tarjeta dice «BloqueAR · Duelo en línea». Se mira esa invitación
// (una sola vez por tarjeta) y se corrige el juego que muestra la tarjeta y adónde lleva «Entrar».

/* ───────── Chat de la mesa (v66) ─────────
   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la

   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve
     libre por toda la pantalla. movible(el, juego, {abrir, cerrar, btn, visible, ancla}) — abrir: cómo reabrirlo desde

   · nuevo(juego, de, txt)  (v74) los chats propios (UnoAR, LudAR, InvasorAR) avisan cada mensaje que llega: si está

   El mensaje en la red: {t:'mchat', de, txt, eq}. eq=1: sólo para el equipo del que lo manda. */

  root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(mandar(b.dataset.r)&&fr&&!fr.hidden){fr.hidden=true;if(frb){frb.classList.remove('on');frb.setAttribute('aria-expanded','false');}}});

   y que al abrirlo en cualquier lugar no se rompa ni quede afuera»):
   · El panel tiene alto fijo chico (clase mc-comp) y los mensajes se leen con scroll adentro. Si estás leyendo arriba,
     no te lo baja: aparece «↓ nuevos».
   · ▁ lo minimiza a una barrita que se puede llevar a cualquier lado; tocándola vuelve a abrirse ahí mismo. Con el chat
     minimizado, cada mensaje nuevo sale como globito arriba (o abajo, si no hay lugar) de la barrita.
   · Se arrastra libre por toda la pantalla. Se guarda el centro como fracción de la pantalla {cx, cy}, por juego y

  if(!o){el.style.left=el.style.right=el.style.top=el.style.bottom='';
    // sin posición guardada: donde dice el CSS de cada juego, pero igual adentro de lo visible (teclado abierto)
    const V=vista();if(V.tec){const r=el.getBoundingClientRect();if(r.bottom>V.y+V.h-MARG||r.top<V.y)encerrar(el,r.left,r.top);}return;}

// Arrastrar con umbral: un toque sigue siendo un toque. op.handle: se agarra de cualquier lado (botón o barrita).

// «↓ nuevos»: si estás leyendo arriba, el juego no te baja la lista (sirve también para los chats propios, que la

      box.parentNode.insertBefore(p,box.nextSibling);}p.style.top=Math.max(0,box.offsetTop+box.clientHeight-36)+'px';return p;};

function movible(el,juego,op={}){
  if(!el)return;css();const j=juego||(S.op&&S.op.juego)||'x',q=op.q||'pos';el.classList.add('mc-mov');

function miniEl(j){const R=REG[j];if(!R)return null;

  if(R.op&&R.op.ancla){const a=R.op.ancla();if(a&&a.isConnected&&!a.hidden)return a;}

  css();const b=document.createElement('button');b.type='button';b.className='mc-mini';b.setAttribute('aria-label','Abrir el chat de la mesa');
  b.innerHTML='<span class="mc-grip" aria-hidden="true">⠿</span>💭 <b>Chat</b><span class="mc-mini-n"></span>';
  ['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>e.stopPropagation(),{passive:true}));
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();restaurar(j);});

function miniOcultar(j){const R=REG[j];if(!R)return;if(R.mini)R.mini.hidden=true;if(R.mb)R.mb.classList.remove('on');}
function miniBadge(j){const R=REG[j];if(!R)return;if(R.mini){const n=R.mini.querySelector('.mc-mini-n');if(n)n.textContent=R.no?String(Math.min(R.no,99)):'';}}

<script>
/* ───────── AjedrezAR · motor ─────────
   Tablero 0x88 (a1=0 … h8=0x77). Piezas: mayúscula blancas (PNBRQK), minúscula negras.
   Todo lo que hace falta para jugar bien: jugadas legales (enroque, al paso, coronación), jaque, mate, ahogado,
   triple repetición, 50 movimientos, material insuficiente, notación algebraica (SAN) y la compu (alfa-beta). */
const AJ=(function(){
'use strict';
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const FILES='abcdefgh';
const N_OFF=[-33,-31,-18,-14,14,18,31,33],K_OFF=[-17,-16,-15,-1,1,15,16,17],B_OFF=[-17,-15,15,17],R_OFF=[-16,-1,1,16];
const sqName=s=>FILES[s&7]+((s>>4)+1);
const sqIdx=n=>(n.charCodeAt(1)-49)*16+(n.charCodeAt(0)-97);
const isW=p=>p>='A'&&p<='Z';
const colorOf=p=>p?(isW(p)?'w':'b'):null;
const lower=p=>p.toLowerCase();

function fromFEN(fen){
  const parts=String(fen||START).trim().split(/\s+/),b=new Array(128).fill(null);
  const rows=parts[0].split('/');if(rows.length!==8)throw new Error('FEN inválido');
  for(let r=0;r<8;r++){let f=0;for(const ch of rows[r]){if(/\d/.test(ch))f+=Number(ch);else{b[(7-r)*16+f]=ch;f++;}}if(f!==8)throw new Error('FEN inválido');}
  const st={b,turn:parts[1]==='b'?'b':'w',castle:parts[2]&&parts[2]!=='-'?parts[2]:'',ep:parts[3]&&parts[3]!=='-'?sqIdx(parts[3]):-1,
    half:Number(parts[4])||0,full:Number(parts[5])||1,hist:[],keys:[],kw:-1,kb:-1};
  for(let s=0;s<128;s++){if(b[s]==='K')st.kw=s;else if(b[s]==='k')st.kb=s;}
  st.keys.push(posKey(st));return st;
}
function toFEN(st){
  let s='';for(let r=7;r>=0;r--){let e=0;for(let f=0;f<8;f++){const p=st.b[r*16+f];if(!p)e++;else{if(e){s+=e;e=0;}s+=p;}}if(e)s+=e;if(r)s+='/';}
  return `${s} ${st.turn} ${st.castle||'-'} ${st.ep>=0?sqName(st.ep):'-'} ${st.half} ${st.full}`;
}
function clone(st){return {b:st.b.slice(),turn:st.turn,castle:st.castle,ep:st.ep,half:st.half,full:st.full,hist:[],keys:st.keys.slice(),kw:st.kw,kb:st.kb};}
// Clave de la posición para la repetición: el al paso cuenta sólo si de verdad se puede comer al paso.
function posKey(st){
  let s='';for(let r=0;r<8;r++)for(let f=0;f<8;f++)s+=st.b[r*16+f]||'.';
  let ep='-';if(st.ep>=0){const pw=st.turn==='w'?'P':'p',d=st.turn==='w'?-16:16;for(const o of [d-1,d+1]){const q=st.ep+o;if(!(q&0x88)&&st.b[q]===pw){ep=sqName(st.ep);break;}}}
  return s+st.turn+(st.castle||'-')+ep;
}
function kingSq(st,c){return c==='w'?st.kw:st.kb;}
// ¿La casilla s está atacada por el color «by»?
function attacked(st,s,by){
  const b=st.b,w=by==='w';
  // peones
  const pd=w?-16:16,pw=w?'P':'p';
  for(const o of [pd-1,pd+1]){const q=s+o;if(!(q&0x88)&&b[q]===pw)return true;}
  const n=w?'N':'n';for(const o of N_OFF){const q=s+o;if(!(q&0x88)&&b[q]===n)return true;}
  const k=w?'K':'k';for(const o of K_OFF){const q=s+o;if(!(q&0x88)&&b[q]===k)return true;}
  const bq=w?['B','Q']:['b','q'],rq=w?['R','Q']:['r','q'];
  for(const o of B_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===bq[0]||p===bq[1])return true;break;}q+=o;}}
  for(const o of R_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===rq[0]||p===rq[1])return true;break;}q+=o;}}
  return false;
}
function inCheck(st,c=st.turn){const k=kingSq(st,c);return k>=0&&attacked(st,k,c==='w'?'b':'w');}
// Jugadas: {f (desde), t (hasta), p (pieza), x (comida o null), pr (coronación, en el color de quien juega), fl ('n','2','ep','O','OOO')}
function pseudo(st,soloCapturas){
  const out=[],b=st.b,us=st.turn,them=us==='w'?'b':'w',W=us==='w';
  const add=(f,t,p,x,fl='n')=>{
    if((p==='P'&&(t>>4)===7)||(p==='p'&&(t>>4)===0)){for(const q of (W?['Q','R','B','N']:['q','r','b','n']))out.push({f,t,p,x,pr:q,fl});}
    else out.push({f,t,p,x,pr:null,fl});};
  for(let s=0;s<128;s++){
    if(s&0x88){s+=7;continue;}
    const p=b[s];if(!p||colorOf(p)!==us)continue;const P=p.toUpperCase();
    if(P==='P'){
      const d=W?16:-16,r=s>>4,start=W?1:6;
      const t1=s+d;
      if(!soloCapturas||((t1>>4)===(W?7:0))){if(!(t1&0x88)&&!b[t1]){add(s,t1,p,null);if(r===start&&!b[t1+d]&&!soloCapturas)out.push({f:s,t:t1+d,p,x:null,pr:null,fl:'2'});}}
      for(const o of [d-1,d+1]){const t=s+o;if(t&0x88)continue;
        if(b[t]&&colorOf(b[t])===them)add(s,t,p,b[t]);
        else if(t===st.ep)out.push({f:s,t,p,x:W?'p':'P',pr:null,fl:'ep'});}
      continue;}
    if(P==='N'||P==='K'){
      for(const o of (P==='N'?N_OFF:K_OFF)){const t=s+o;if(t&0x88)continue;const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else if(colorOf(q)===them)add(s,t,p,q);}
      if(P==='K'&&!soloCapturas){
        const home=W?4:116;
        if(s===home&&!attacked(st,s,them)){
          const K=W?'K':'k',Q=W?'Q':'q',R=W?'R':'r';
          if(st.castle.includes(K)&&b[s+3]===R&&!b[s+1]&&!b[s+2]&&!attacked(st,s+1,them)&&!attacked(st,s+2,them))out.push({f:s,t:s+2,p,x:null,pr:null,fl:'O'});
          if(st.castle.includes(Q)&&b[s-4]===R&&!b[s-1]&&!b[s-2]&&!b[s-3]&&!attacked(st,s-1,them)&&!attacked(st,s-2,them))out.push({f:s,t:s-2,p,x:null,pr:null,fl:'OOO'});
        }}
      continue;}
    const offs=P==='B'?B_OFF:P==='R'?R_OFF:K_OFF;
    for(const o of offs){let t=s+o;while(!(t&0x88)){const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else{if(colorOf(q)===them)add(s,t,p,q);break;}t+=o;}}
  }
  return out;
}
const CR={0:'Q',7:'K',112:'q',119:'k'};// torre en su casilla de origen → derecho de enroque
function quitarEnroque(c,ch){return c.replace(ch,'');}
function make(st,m){
  const b=st.b;
  st.hist.push({m,castle:st.castle,ep:st.ep,half:st.half,full:st.full});
  b[m.f]=null;
  if(m.fl==='ep'){b[m.t+(st.turn==='w'?-16:16)]=null;}
  b[m.t]=m.pr||m.p;
  if(m.p==='K')st.kw=m.t;else if(m.p==='k')st.kb=m.t;
  if(m.fl==='O'){b[m.t-1]=b[m.t+1];b[m.t+1]=null;}
  if(m.fl==='OOO'){b[m.t+1]=b[m.t-2];b[m.t-2]=null;}
  let c=st.castle;
  if(c){if(m.p==='K')c=quitarEnroque(quitarEnroque(c,'K'),'Q');else if(m.p==='k')c=quitarEnroque(quitarEnroque(c,'k'),'q');
    if(CR[m.f]!==undefined)c=quitarEnroque(c,CR[m.f]);if(CR[m.t]!==undefined)c=quitarEnroque(c,CR[m.t]);}
  st.castle=c;
  st.ep=m.fl==='2'?(m.f+m.t)>>1:-1;
  st.half=(m.p==='P'||m.p==='p'||m.x)?0:st.half+1;
  if(st.turn==='b')st.full++;
  st.turn=st.turn==='w'?'b':'w';
  st.keys.push(posKey(st));
}
function unmake(st){
  const h=st.hist.pop();if(!h)return;const m=h.m,b=st.b;
  st.keys.pop();
  st.turn=st.turn==='w'?'b':'w';st.castle=h.castle;st.ep=h.ep;st.half=h.half;st.full=h.full;
  b[m.f]=m.p;b[m.t]=null;
  if(m.p==='K')st.kw=m.f;else if(m.p==='k')st.kb=m.f;
  if(m.fl==='ep')b[m.t+(st.turn==='w'?-16:16)]=m.x;
  else if(m.x)b[m.t]=m.x;
  if(m.fl==='O'){b[m.t+1]=b[m.t-1];b[m.t-1]=null;}
  if(m.fl==='OOO'){b[m.t-2]=b[m.t+1];b[m.t+1]=null;}
}
function legal(st){const us=st.turn,out=[];for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))out.push(m);unmake(st);}return out;}
function legalFrom(st,s){return legal(st).filter(m=>m.f===s);}
const uci=m=>sqName(m.f)+sqName(m.t)+(m.pr?lower(m.pr):'');
function fromUci(st,u){u=String(u||'').toLowerCase();return legal(st).find(m=>uci(m)===u)||null;}
// Notación algebraica en castellano rioplatense de club: se usan las letras internacionales (N, B, R, Q, K)
// para que se entienda con cualquier libro o app. La UI las muestra con figuritas.
function san(st,m){
  let s;
  if(m.fl==='O')s='O-O';else if(m.fl==='OOO')s='O-O-O';
  else{const P=m.p.toUpperCase();
    if(P==='P'){s=(m.x?FILES[m.f&7]+'x':'')+sqName(m.t)+(m.pr?'='+m.pr.toUpperCase():'');}
    else{const otros=legal(st).filter(o=>o.p===m.p&&o.t===m.t&&o.f!==m.f);let dis='';
      if(otros.length){const sameF=otros.some(o=>(o.f&7)===(m.f&7)),sameR=otros.some(o=>(o.f>>4)===(m.f>>4));
        dis=!sameF?FILES[m.f&7]:!sameR?String((m.f>>4)+1):sqName(m.f);}
      s=P+dis+(m.x?'x':'')+sqName(m.t);}}
  make(st,m);const ch=inCheck(st),mate=ch&&legal(st).length===0;unmake(st);
  return s+(mate?'#':ch?'+':'');
}
function fromSan(st,s){const t=String(s||'').replace(/[+#!?]/g,'');return legal(st).find(m=>san(st,m).replace(/[+#]/g,'')===t)||null;}
function material(st){const out={w:[],b:[]};for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=st.b[s];if(p&&p.toUpperCase()!=='K')out[colorOf(p)].push({p:p.toUpperCase(),sq:s});}return out;}
function insuficiente(st){
  const M=material(st),w=M.w,b=M.b;
  if(w.some(x=>'PRQ'.includes(x.p))||b.some(x=>'PRQ'.includes(x.p)))return false;
  if(!w.length&&!b.length)return true;
  if(w.length+b.length===1)return true;                       // rey y alfil o caballo contra rey solo
  const all=w.concat(b);
  if(all.every(x=>x.p==='B')){const col=x=>((x.sq>>4)+(x.sq&7))&1;return all.every(x=>col(x)===col(all[0]));}// alfiles del mismo color
  return false;
}
function repeticiones(st){const k=st.keys[st.keys.length-1];let n=0;for(const x of st.keys)if(x===k)n++;return n;}
// Estado de la partida: {fin, res ('1-0','0-1','½-½'), motivo, jaque}
function estado(st){
  const L=legal(st),ch=inCheck(st);
  if(!L.length)return ch?{fin:true,res:st.turn==='w'?'0-1':'1-0',motivo:'mate',jaque:true}:{fin:true,res:'½-½',motivo:'ahogado',jaque:false};
  if(insuficiente(st))return {fin:true,res:'½-½',motivo:'material',jaque:ch};
  if(st.half>=100)return {fin:true,res:'½-½',motivo:'50',jaque:ch};
  if(repeticiones(st)>=3)return {fin:true,res:'½-½',motivo:'repeticion',jaque:ch};
  return {fin:false,jaque:ch,n:L.length};
}
function perft(st,d){if(d===0)return 1;let n=0;const us=st.turn;for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))n+=d===1?1:perft(st,d-1);unmake(st);}return n;}
// Una partida desde una lista de jugadas (uci). Devuelve el estado, las SAN y si alguna no era legal.
function jugarLista(lista,fen=START){const st=fromFEN(fen),sans=[];for(const u of lista||[]){const m=fromUci(st,u);if(!m)return {st,sans,error:u};sans.push(san(st,m));make(st,m);}return {st,sans,error:null};}

/* ── La compu: alfa-beta con profundidad creciente, quietud y tablas de posición ── */
const VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
// Tablas desde el lado de las blancas, de a8 (índice 0) a h1 (63).
const PST={
P:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
N:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
B:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
R:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
Q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
K:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20],
KE:[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50]};
const pIdx=(s,w)=>w?(7-(s>>4))*8+(s&7):(s>>4)*8+(s&7);
// Evaluación desde el lado del que juega.
function evaluar(st){
  let sc=0,mat=0;const b=st.b;
  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(p){const P=p.toUpperCase();if(P!=='K'&&P!=='P')mat+=VAL[P];}}
  const final=mat<=1300;
  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(!p)continue;const P=p.toUpperCase(),w=isW(p);
    const v=VAL[P]+(P==='K'&&final?PST.KE:PST[P])[pIdx(s,w)];sc+=w?v:-v;}
  return st.turn==='w'?sc:-sc;
}
function ordenar(ms,best){for(const m of ms){m.o=(m.x?10*VAL[m.x.toUpperCase()]-VAL[m.p.toUpperCase()]/10+1000:0)+(m.pr?800:0)+(best&&m.f===best.f&&m.t===best.t&&m.pr===best.pr?100000:0);}ms.sort((a,b)=>b.o-a.o);return ms;}
function buscar(st,opts={}){
  const t0=Date.now(),ms=opts.ms||800,maxD=opts.depth||4,rnd=opts.rnd||0,R=opts.R||Math.random;
  let nodos=0,corte=false,best=null,bestSc=0;
  const MATE=100000;
  function q(alpha,beta,ply){
    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;
    const ep=evaluar(st);if(ep>=beta)return beta;if(ep>alpha)alpha=ep;if(ply>8)return alpha;
    const us=st.turn;
    for(const m of ordenar(pseudo(st,true))){make(st,m);if(inCheck(st,us)){unmake(st);continue;}const v=-q(-beta,-alpha,ply+1);unmake(st);if(corte)return 0;if(v>=beta)return beta;if(v>alpha)alpha=v;}
    return alpha;}
  function ab(d,alpha,beta,ply){
    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;

  // La raíz aparte: con «rnd» cada jugada que queda a menos de rnd de la mejor se mide exacta y se elige con un poco de azar.
