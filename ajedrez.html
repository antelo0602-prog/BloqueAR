<script>
'use strict';
const MOTOR_SRC="/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 AjedrezAR \u00b7 motor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   Tablero 0x88 (a1=0 \u2026 h8=0x77). Piezas: may\u00fascula blancas (PNBRQK), min\u00fascula negras.\n   Todo lo que hace falta para jugar bien: jugadas legales (enroque, al paso, coronaci\u00f3n), jaque, mate, ahogado,\n   triple repetici\u00f3n, 50 movimientos, material insuficiente, notaci\u00f3n algebraica (SAN) y la compu (alfa-beta). */\nconst AJ=(function(){\n'use strict';\nconst START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';\nconst FILES='abcdefgh';\nconst N_OFF=[-33,-31,-18,-14,14,18,31,33],K_OFF=[-17,-16,-15,-1,1,15,16,17],B_OFF=[-17,-15,15,17],R_OFF=[-16,-1,1,16];\nconst sqName=s=>FILES[s&7]+((s>>4)+1);\nconst sqIdx=n=>(n.charCodeAt(1)-49)*16+(n.charCodeAt(0)-97);\nconst isW=p=>p>='A'&&p<='Z';\nconst colorOf=p=>p?(isW(p)?'w':'b'):null;\nconst lower=p=>p.toLowerCase();\n\nfunction fromFEN(fen){\n  const parts=String(fen||START).trim().split(/\\s+/),b=new Array(128).fill(null);\n  const rows=parts[0].split('/');if(rows.length!==8)throw new Error('FEN inv\u00e1lido');\n  for(let r=0;r<8;r++){let f=0;for(const ch of rows[r]){if(/\\d/.test(ch))f+=Number(ch);else{b[(7-r)*16+f]=ch;f++;}}if(f!==8)throw new Error('FEN inv\u00e1lido');}\n  const st={b,turn:parts[1]==='b'?'b':'w',castle:parts[2]&&parts[2]!=='-'?parts[2]:'',ep:parts[3]&&parts[3]!=='-'?sqIdx(parts[3]):-1,\n    half:Number(parts[4])||0,full:Number(parts[5])||1,hist:[],keys:[],kw:-1,kb:-1};\n  for(let s=0;s<128;s++){if(b[s]==='K')st.kw=s;else if(b[s]==='k')st.kb=s;}\n  st.keys.push(posKey(st));return st;\n}\nfunction toFEN(st){\n  let s='';for(let r=7;r>=0;r--){let e=0;for(let f=0;f<8;f++){const p=st.b[r*16+f];if(!p)e++;else{if(e){s+=e;e=0;}s+=p;}}if(e)s+=e;if(r)s+='/';}\n  return `${s} ${st.turn} ${st.castle||'-'} ${st.ep>=0?sqName(st.ep):'-'} ${st.half} ${st.full}`;\n}\nfunction clone(st){return {b:st.b.slice(),turn:st.turn,castle:st.castle,ep:st.ep,half:st.half,full:st.full,hist:[],keys:st.keys.slice(),kw:st.kw,kb:st.kb};}\n// Clave de la posici\u00f3n para la repetici\u00f3n: el al paso cuenta s\u00f3lo si de verdad se puede comer al paso.\nfunction posKey(st){\n  let s='';for(let r=0;r<8;r++)for(let f=0;f<8;f++)s+=st.b[r*16+f]||'.';\n  let ep='-';if(st.ep>=0){const pw=st.turn==='w'?'P':'p',d=st.turn==='w'?-16:16;for(const o of [d-1,d+1]){const q=st.ep+o;if(!(q&0x88)&&st.b[q]===pw){ep=sqName(st.ep);break;}}}\n  return s+st.turn+(st.castle||'-')+ep;\n}\nfunction kingSq(st,c){return c==='w'?st.kw:st.kb;}\n// \u00bfLa casilla s est\u00e1 atacada por el color \u00abby\u00bb?\nfunction attacked(st,s,by){\n  const b=st.b,w=by==='w';\n  // peones\n  const pd=w?-16:16,pw=w?'P':'p';\n  for(const o of [pd-1,pd+1]){const q=s+o;if(!(q&0x88)&&b[q]===pw)return true;}\n  const n=w?'N':'n';for(const o of N_OFF){const q=s+o;if(!(q&0x88)&&b[q]===n)return true;}\n  const k=w?'K':'k';for(const o of K_OFF){const q=s+o;if(!(q&0x88)&&b[q]===k)return true;}\n  const bq=w?['B','Q']:['b','q'],rq=w?['R','Q']:['r','q'];\n  for(const o of B_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===bq[0]||p===bq[1])return true;break;}q+=o;}}\n  for(const o of R_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===rq[0]||p===rq[1])return true;break;}q+=o;}}\n  return false;\n}\nfunction inCheck(st,c=st.turn){const k=kingSq(st,c);return k>=0&&attacked(st,k,c==='w'?'b':'w');}\n// Jugadas: {f (desde), t (hasta), p (pieza), x (comida o null), pr (coronaci\u00f3n, en el color de quien juega), fl ('n','2','ep','O','OOO')}\nfunction pseudo(st,soloCapturas){\n  const out=[],b=st.b,us=st.turn,them=us==='w'?'b':'w',W=us==='w';\n  const add=(f,t,p,x,fl='n')=>{\n    if((p==='P'&&(t>>4)===7)||(p==='p'&&(t>>4)===0)){for(const q of (W?['Q','R','B','N']:['q','r','b','n']))out.push({f,t,p,x,pr:q,fl});}\n    else out.push({f,t,p,x,pr:null,fl});};\n  for(let s=0;s<128;s++){\n    if(s&0x88){s+=7;continue;}\n    const p=b[s];if(!p||colorOf(p)!==us)continue;const P=p.toUpperCase();\n    if(P==='P'){\n      const d=W?16:-16,r=s>>4,start=W?1:6;\n      const t1=s+d;\n      if(!soloCapturas||((t1>>4)===(W?7:0))){if(!(t1&0x88)&&!b[t1]){add(s,t1,p,null);if(r===start&&!b[t1+d]&&!soloCapturas)out.push({f:s,t:t1+d,p,x:null,pr:null,fl:'2'});}}\n      for(const o of [d-1,d+1]){const t=s+o;if(t&0x88)continue;\n        if(b[t]&&colorOf(b[t])===them)add(s,t,p,b[t]);\n        else if(t===st.ep)out.push({f:s,t,p,x:W?'p':'P',pr:null,fl:'ep'});}\n      continue;}\n    if(P==='N'||P==='K'){\n      for(const o of (P==='N'?N_OFF:K_OFF)){const t=s+o;if(t&0x88)continue;const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else if(colorOf(q)===them)add(s,t,p,q);}\n      if(P==='K'&&!soloCapturas){\n        const home=W?4:116;\n        if(s===home&&!attacked(st,s,them)){\n          const K=W?'K':'k',Q=W?'Q':'q',R=W?'R':'r';\n          if(st.castle.includes(K)&&b[s+3]===R&&!b[s+1]&&!b[s+2]&&!attacked(st,s+1,them)&&!attacked(st,s+2,them))out.push({f:s,t:s+2,p,x:null,pr:null,fl:'O'});\n          if(st.castle.includes(Q)&&b[s-4]===R&&!b[s-1]&&!b[s-2]&&!b[s-3]&&!attacked(st,s-1,them)&&!attacked(st,s-2,them))out.push({f:s,t:s-2,p,x:null,pr:null,fl:'OOO'});\n        }}\n      continue;}\n    const offs=P==='B'?B_OFF:P==='R'?R_OFF:K_OFF;\n    for(const o of offs){let t=s+o;while(!(t&0x88)){const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else{if(colorOf(q)===them)add(s,t,p,q);break;}t+=o;}}\n  }\n  return out;\n}\nconst CR={0:'Q',7:'K',112:'q',119:'k'};// torre en su casilla de origen \u2192 derecho de enroque\nfunction quitarEnroque(c,ch){return c.replace(ch,'');}\nfunction make(st,m){\n  const b=st.b;\n  st.hist.push({m,castle:st.castle,ep:st.ep,half:st.half,full:st.full});\n  b[m.f]=null;\n  if(m.fl==='ep'){b[m.t+(st.turn==='w'?-16:16)]=null;}\n  b[m.t]=m.pr||m.p;\n  if(m.p==='K')st.kw=m.t;else if(m.p==='k')st.kb=m.t;\n  if(m.fl==='O'){b[m.t-1]=b[m.t+1];b[m.t+1]=null;}\n  if(m.fl==='OOO'){b[m.t+1]=b[m.t-2];b[m.t-2]=null;}\n  let c=st.castle;\n  if(c){if(m.p==='K')c=quitarEnroque(quitarEnroque(c,'K'),'Q');else if(m.p==='k')c=quitarEnroque(quitarEnroque(c,'k'),'q');\n    if(CR[m.f]!==undefined)c=quitarEnroque(c,CR[m.f]);if(CR[m.t]!==undefined)c=quitarEnroque(c,CR[m.t]);}\n  st.castle=c;\n  st.ep=m.fl==='2'?(m.f+m.t)>>1:-1;\n  st.half=(m.p==='P'||m.p==='p'||m.x)?0:st.half+1;\n  if(st.turn==='b')st.full++;\n  st.turn=st.turn==='w'?'b':'w';\n  st.keys.push(posKey(st));\n}\nfunction unmake(st){\n  const h=st.hist.pop();if(!h)return;const m=h.m,b=st.b;\n  st.keys.pop();\n  st.turn=st.turn==='w'?'b':'w';st.castle=h.castle;st.ep=h.ep;st.half=h.half;st.full=h.full;\n  b[m.f]=m.p;b[m.t]=null;\n  if(m.p==='K')st.kw=m.f;else if(m.p==='k')st.kb=m.f;\n  if(m.fl==='ep')b[m.t+(st.turn==='w'?-16:16)]=m.x;\n  else if(m.x)b[m.t]=m.x;\n  if(m.fl==='O'){b[m.t+1]=b[m.t-1];b[m.t-1]=null;}\n  if(m.fl==='OOO'){b[m.t-2]=b[m.t+1];b[m.t+1]=null;}\n}\nfunction legal(st){const us=st.turn,out=[];for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))out.push(m);unmake(st);}return out;}\nfunction legalFrom(st,s){return legal(st).filter(m=>m.f===s);}\nconst uci=m=>sqName(m.f)+sqName(m.t)+(m.pr?lower(m.pr):'');\nfunction fromUci(st,u){u=String(u||'').toLowerCase();return legal(st).find(m=>uci(m)===u)||null;}\n// Notaci\u00f3n algebraica en castellano rioplatense de club: se usan las letras internacionales (N, B, R, Q, K)\n// para que se entienda con cualquier libro o app. La UI las muestra con figuritas.\nfunction san(st,m){\n  let s;\n  if(m.fl==='O')s='O-O';else if(m.fl==='OOO')s='O-O-O';\n  else{const P=m.p.toUpperCase();\n    if(P==='P'){s=(m.x?FILES[m.f&7]+'x':'')+sqName(m.t)+(m.pr?'='+m.pr.toUpperCase():'');}\n    else{const otros=legal(st).filter(o=>o.p===m.p&&o.t===m.t&&o.f!==m.f);let dis='';\n      if(otros.length){const sameF=otros.some(o=>(o.f&7)===(m.f&7)),sameR=otros.some(o=>(o.f>>4)===(m.f>>4));\n        dis=!sameF?FILES[m.f&7]:!sameR?String((m.f>>4)+1):sqName(m.f);}\n      s=P+dis+(m.x?'x':'')+sqName(m.t);}}\n  make(st,m);const ch=inCheck(st),mate=ch&&legal(st).length===0;unmake(st);\n  return s+(mate?'#':ch?'+':'');\n}\nfunction fromSan(st,s){const t=String(s||'').replace(/[+#!?]/g,'');return legal(st).find(m=>san(st,m).replace(/[+#]/g,'')===t)||null;}\nfunction material(st){const out={w:[],b:[]};for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=st.b[s];if(p&&p.toUpperCase()!=='K')out[colorOf(p)].push({p:p.toUpperCase(),sq:s});}return out;}\nfunction insuficiente(st){\n  const M=material(st),w=M.w,b=M.b;\n  if(w.some(x=>'PRQ'.includes(x.p))||b.some(x=>'PRQ'.includes(x.p)))return false;\n  if(!w.length&&!b.length)return true;\n  if(w.length+b.length===1)return true;                       // rey y alfil o caballo contra rey solo\n  const all=w.concat(b);\n  if(all.every(x=>x.p==='B')){const col=x=>((x.sq>>4)+(x.sq&7))&1;return all.every(x=>col(x)===col(all[0]));}// alfiles del mismo color\n  return false;\n}\nfunction repeticiones(st){const k=st.keys[st.keys.length-1];let n=0;for(const x of st.keys)if(x===k)n++;return n;}\n// Estado de la partida: {fin, res ('1-0','0-1','\u00bd-\u00bd'), motivo, jaque}\nfunction estado(st){\n  const L=legal(st),ch=inCheck(st);\n  if(!L.length)return ch?{fin:true,res:st.turn==='w'?'0-1':'1-0',motivo:'mate',jaque:true}:{fin:true,res:'\u00bd-\u00bd',motivo:'ahogado',jaque:false};\n  if(insuficiente(st))return {fin:true,res:'\u00bd-\u00bd',motivo:'material',jaque:ch};\n  if(st.half>=100)return {fin:true,res:'\u00bd-\u00bd',motivo:'50',jaque:ch};\n  if(repeticiones(st)>=3)return {fin:true,res:'\u00bd-\u00bd',motivo:'repeticion',jaque:ch};\n  return {fin:false,jaque:ch,n:L.length};\n}\nfunction perft(st,d){if(d===0)return 1;let n=0;const us=st.turn;for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))n+=d===1?1:perft(st,d-1);unmake(st);}return n;}\n// Una partida desde una lista de jugadas (uci). Devuelve el estado, las SAN y si alguna no era legal.\nfunction jugarLista(lista,fen=START){const st=fromFEN(fen),sans=[];for(const u of lista||[]){const m=fromUci(st,u);if(!m)return {st,sans,error:u};sans.push(san(st,m));make(st,m);}return {st,sans,error:null};}\n\n/* \u2500\u2500 La compu: alfa-beta con profundidad creciente, quietud y tablas de posici\u00f3n \u2500\u2500 */\nconst VAL={P:100,N:320,B:330,R:500,Q:900,K:0};\n// Tablas desde el lado de las blancas, de a8 (\u00edndice 0) a h1 (63).\nconst PST={\nP:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],\nN:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],\nB:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],\nR:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],\nQ:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],\nK:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20],\nKE:[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50]};\nconst pIdx=(s,w)=>w?(7-(s>>4))*8+(s&7):(s>>4)*8+(s&7);\n// Evaluaci\u00f3n desde el lado del que juega.\nfunction evaluar(st){\n  let sc=0,mat=0;const b=st.b;\n  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(p){const P=p.toUpperCase();if(P!=='K'&&P!=='P')mat+=VAL[P];}}\n  const final=mat<=1300;\n  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(!p)continue;const P=p.toUpperCase(),w=isW(p);\n    const v=VAL[P]+(P==='K'&&final?PST.KE:PST[P])[pIdx(s,w)];sc+=w?v:-v;}\n  return st.turn==='w'?sc:-sc;\n}\nfunction ordenar(ms,best){for(const m of ms){m.o=(m.x?10*VAL[m.x.toUpperCase()]-VAL[m.p.toUpperCase()]/10+1000:0)+(m.pr?800:0)+(best&&m.f===best.f&&m.t===best.t&&m.pr===best.pr?100000:0);}ms.sort((a,b)=>b.o-a.o);return ms;}\nfunction buscar(st,opts={}){\n  const t0=Date.now(),ms=opts.ms||800,maxD=opts.depth||4,rnd=opts.rnd||0,R=opts.R||Math.random;\n  let nodos=0,corte=false,best=null,bestSc=0;\n  const MATE=100000;\n  function q(alpha,beta,ply){\n    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;\n    const ep=evaluar(st);if(ep>=beta)return beta;if(ep>alpha)alpha=ep;if(ply>8)return alpha;\n    const us=st.turn;\n    for(const m of ordenar(pseudo(st,true))){make(st,m);if(inCheck(st,us)){unmake(st);continue;}const v=-q(-beta,-alpha,ply+1);unmake(st);if(corte)return 0;if(v>=beta)return beta;if(v>alpha)alpha=v;}\n    return alpha;}\n  function ab(d,alpha,beta,ply){\n    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;\n    if(ply&&(st.half>=100||repeticiones(st)>=2))return 0;\n    if(d<=0)return q(alpha,beta,0);\n    const us=st.turn,L=ordenar(pseudo(st));let n=0;\n    for(const m of L){make(st,m);if(inCheck(st,us)){unmake(st);continue;}n++;\n      const v=-ab(d-1,-beta,-alpha,ply+1);\n      unmake(st);if(corte)return 0;\n      if(v>alpha)alpha=v;\n      if(alpha>=beta)break;}\n    if(!n)return inCheck(st)?-MATE+ply:0;\n    return alpha;}\n  // La ra\u00edz aparte: con \u00abrnd\u00bb cada jugada que queda a menos de rnd de la mejor se mide exacta y se elige con un poco de azar.\n  function raizBusca(d,pv){\n    const us=st.turn,L=ordenar(pseudo(st),pv);let bestRaw=-MATE*2,elegida=null,elegidaV=-MATE*3,raw=0;\n    for(const m of L){make(st,m);if(inCheck(st,us)){unmake(st);continue;}\n      const a=rnd?bestRaw-rnd:bestRaw;\n      const v=-ab(d-1,-MATE*2,-a,1);unmake(st);if(corte)return;\n      if(v>bestRaw)bestRaw=v;\n      if(v>a){const nv=v+(rnd&&Math.abs(v)<MATE-100?Math.floor((R()*2-1)*rnd/2):0);if(nv>elegidaV||!elegida){elegida=m;elegidaV=nv;raw=v;}}}\n    // si la elegida qued\u00f3 muy por debajo de la mejor (pasa con poco azar), vale igual: est\u00e1 dentro de rnd\n    best=elegida;bestSc=raw;}\n  const raiz=legal(st);if(!raiz.length)return null;if(raiz.length===1)return {m:raiz[0],sc:0,d:0};\n  let pv=null,ultimo=null,ultimoSc=0,dHecho=0;\n  for(let d=1;d<=maxD;d++){best=null;raizBusca(d,pv);if(corte&&d>1)break;if(best){ultimo=best;ultimoSc=bestSc;pv=best;dHecho=d;}if(Math.abs(ultimoSc)>MATE-100)break;if(Date.now()-t0>ms*0.55)break;}\n  if(!ultimo)ultimo=raiz[Math.floor(R()*raiz.length)];\n  return {m:ultimo,sc:ultimoSc,d:dHecho,nodos};\n}\n// Niveles: f\u00e1cil se equivoca a prop\u00f3sito; maestro piensa m\u00e1s.\n/* v67: la compu juega como una persona. En vez de tirar a veces una jugada al azar (eso parec\u00eda absurdo), cada\n   tanto se \u00abdespista\u00bb: elige una jugada razonable que no es la mejor, pero s\u00f3lo entre las que pierden poco\n   (margen, en cent\u00e9simos de pe\u00f3n). Nunca deja pasar un mate ni una pieza regalada grande. M\u00e1s nivel, menos despistes.\n   Juega s\u00f3lo con lo que hay en el tablero (en el ajedrez no hay nada escondido). */\nconst NIVELES={facil:{depth:2,ms:300,rnd:140,desp:.35,margen:260},normal:{depth:3,ms:600,rnd:40,desp:.12,margen:90},dificil:{depth:4,ms:1300,rnd:10,desp:.04,margen:40},maestro:{depth:7,ms:2600,rnd:0,desp:0,margen:0}};\nfunction despiste(st,L,margen,R){\n  const sc=[];\n  for(const m of L){const s=clone(st);make(s,m);const r=buscar(s,{depth:1,ms:60});const v=r?-r.sc:(inCheck(s)?100000:0);sc.push({m,v});}\n  sc.sort((a,b)=>b.v-a.v);const best=sc[0].v;if(Math.abs(best)>90000)return null;   //     WK=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));}catch(_){WK=false;}

function pensar(nivel){

const DRAG={on:false,from:-1,x:0,y:0,el:null,id:null,moved:false,ya:false};
function sqDesde(x,y){const r=$('board').getBoundingClientRect();if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return -1;
  const col=Math.floor((x-r.left)/(r.width/8)),row=Math.floor((y-r.top)/(r.height/8)),fl=flip();const rr=fl?row:7-row,f=fl?7-col:col;return rr*16+f;}

  if(G.modo==='vivo'&&(!ON||ON.state!=='on'))return 'Se cortó la conexión: esperá que vuelva.';
  if(G.modo==='dist'&&DIST.enviando)return 'Un momento: mandando tu jugada…';
  if(G.modo==='compu'&&PENSANDO)return `Esperá: ${esc(rivalCompu())} está pensando.`;

  if(SEL>=0&&s!==SEL){const L=AJ.legalFrom(G.st,SEL).filter(m=>m.t===s);if(L.length){intentar(SEL,s,L);return;}}
  if(p&&AJ.colorOf(p)===G.st.turn){DRAG.ya=SEL===s;SEL=s;DRAG.on=false;DRAG.moved=false;DRAG.from=s;DRAG.x=e.clientX;DRAG.y=e.clientY;DRAG.id=e.pointerId;

  DRAG.el.style.left=e.clientX+'px';DRAG.el.style.top=e.clientY+'px';

  if(on){const s=sqDesde(e.clientX,e.clientY),L=s>=0?AJ.legalFrom(G.st,from).filter(m=>m.t===s):[];

/* ───────── Deshacer, rendirse, tablas ───────── */
function deshacer(){
  if(!G||G.modo!=='compu'||G.fin||!G.moves.length)return;
  COMPU_TOK++;PENSANDO=false;$('thinking').hidden=true;
  // vuelve hasta que te toque a vos (tu jugada y la de la compu)
  const t0=AJ.fromFEN(G.fen0).turn,turnoEn=n=>n%2===0?t0:otro(t0);
  let n=G.moves.length-1;if(n>0&&turnoEn(n)!==G.yo)n--;if(turnoEn(n)!==G.yo)n=Math.max(0,n-1);
  const lista=G.moves.slice(0,Math.max(0,n));G=armar({...G,moves:lista,clk:G.clk,fin:null,ayuda:true});
  if(!AYUDA_DESHACER&&G.ranked){AYUDA_DESHACER=true;toast('Usaste deshacer: esta partida ya no mueve el rango.',3200);}
  arrancarReloj();guardar();render();
  if(G.st.turn!==G.yo)compuJuega();
}
function rendirse(){
  if(!G||G.fin)return;
  sheet('¿Te rendís?',`<p>${G.modo==='compu'?'La partida cuenta como perdida.':`Le das la partida a <b>${esc(nombreDe(otro(G.yo)))}</b>.`}</p><div class="row"><button class="btn" id="rn-no">Seguir jugando</button><button class="btn go" id="rn-si">Rendirme</button></div>`);
  $('rn-no').onclick=closeSheet;
  $('rn-si').onclick=()=>{closeSheet();if(G.modo==='dist'){distAbandonar();return;}if(G.modo==='vivo')netSend({t:'abandono',gid:G.id});terminar({res:G.yo==='w'?'0-1':'1-0',motivo:'abandono'},G.modo!=='vivo');};
}
function ofrecerTablas(){
  if(!G||G.fin)return;
  if(G.modo==='dist'){distTablas('ofrecer');return;}
  if(G.modo==='vivo'){if(!ON||ON.state!=='on')return;if(VIVO_T.tablasEl){vivoAccion('tablas-si');return;}VIVO_T.tablasYo=true;netSend({t:'tablas',op:'ofrecer',gid:G.id});toast(`Le ofreciste tablas a ${esc(ON.peer.usuario)}.`);renderBanner();}
}

  if(AUTO)setTimeout(()=>{hideOver();},FAST?0:300);

// XP, rango, regalo para la estancia y leguas (una vez por partida, en cada celular).
function premios(r){
  const out={html:'',rank:''};if(!window.RANGOS||AUTO||!G||r==='anulada')return out;
  const key='aj:'+G.id,hechas=ls.json('ajedrez-xp-hechas',[]);
  const amigo=G.modo!=='compu',dif=G.dif==='maestro'?'dificil':G.dif,kind=amigo?'amigo':'compu-'+dif;
  const ranked=G.ranked&&!G.ayuda&&(amigo||G.dif!=='facil')&&G.moves.length>=2;
  let rk=null,xp=0,pr=null;
  try{if(ranked&&r!=='tablas')rk=RANGOS.apply('ajedrez',{key,win:r==='gane',kind,extra:G.dif==='maestro'?8:0});}catch(_){}
  if(!hechas.includes(key)){xp=30+(r==='gane'?30:r==='tablas'?12:0)+(G.dif==='dificil'?10:G.dif==='maestro'?20:0)+(amigo?15:0)+Math.min(20,Math.floor(G.moves.length/8));
    try{RANGOS.addXp('ajedrez',xp);const jug=Math.ceil(G.moves.length/2),tb=G.tc&&TCS[G.tc]?TCS[G.tc].b:0;
      // v70: las tablas también dan leguas (antes no) y perder en 20 segundos no: ganar pide 6 jugadas tuyas; perder o empatar, 15.
      pr=RANGOS.premio('AjedrezAR',xp,ranked,{j:'ajedrez',res:r==='gane'?'g':r==='tablas'?'e':'p',rival:amigo?'p':'c',dif:G.dif,key,esf:RANGOS.cuenta('ajedrez',{res:r==='gane'?'g':'p',jugadas:jug}).ok,
        x:{ritmo:G.modo==='dist'?'dist':!tb?'libre':tb<=60e3?'bala':tb<=300e3?'blitz':'rapida',op:amigo?String(nombreDe(otro(G.yo))||''):'',j:jug}});}catch(_){}hechas.push(key);ls.set('ajedrez-xp-hechas',JSON.stringify(hechas.slice(-80)));
    try{if(window.LOGROS){const blitz=G.tc&&TCS[G.tc].b<=180000;
      const lr=LOGROS.fin('ajedrez',{gano:r==='gane',modo:amigo?'online':'compu',dif:G.dif,mate:G.fin.motivo==='mate',dist:G.modo==='dist',blitz:!!blitz,negras:G.yo==='b',tablas:r==='tablas',jugadas:Math.ceil(G.moves.length/2)},key);
      out.lg=lr.html;}}catch(_){}}
  let lv=null;try{lv=RANGOS.levelInfo(RANGOS.xp('ajedrez'));}catch(_){}
  const porque=!rk?(r==='tablas'&&ranked?' · Con tablas el rango no se mueve':G.ayuda?' · Usaste deshacer: no mueve el rango':!G.ranked?' · Partida amistosa: no mueve el rango':G.dif==='facil'&&!amigo?' · En Fácil no se mueve el rango ni da leguas':''):'';
  out.html=(rk?RANGOS.resultHtml(rk):'')+(lv?`<p class="cap2">AjedrezAR nivel ${lv.lv}${xp?` · +${xp} XP`:''}${pr?`${window.ORO?(ORO.premioTxt(pr)?' · '+ORO.premioTxt(pr):''):' · 🎁 +'+fmt(pr.pesos)+' 🪙 para tu estancia'}${RANGOS.leguasTxt?RANGOS.leguasTxt(pr):pr.leguas?` · 🚩 +${pr.leguas} leguas en La Gran Pampa`:''}`:''}${porque}</p>`:'')+(out.lg||'');
  out.rank=rk&&rk.after?rk.after.label:'';return out;
}

let toastT=0;function toast(t,ms=2200){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms);}

function hideOver(){$('over').hidden=true;}
function sheet(title,body){$('sheet').innerHTML=`<header><h2>${title}</h2><button class="x" id="sh-x" aria-label="Cerrar">✕</button></header><div class="body">${body}</div>`;$('modal').hidden=false;$('sh-x').onclick=closeSheet;}

const colorElegido=()=>CFG.color==='azar'?(Math.random()<.5?'w':'b'):CFG.color;
function nuevaCompu(o={}){
  if(PAMPA_CRUCE&&!o.pampa)PAMPA_CRUCE=null;   // otra partida: el cruce queda sin jugar
  if(ON&&G&&G.modo==='vivo'&&!G.fin){if(!confirm('¿Dejar la partida en vivo?'))return;}
  if(ON)netLeave();distParar();
  COMPU_TOK++;PENSANDO=false;$('thinking').hidden=true;hideOver();FIN_VISTO='';AYUDA_DESHACER=false;
  const yo=o.yo||colorElegido(),me=yoPerfil(),bot={n:botNombre(o.dif||CFG.dif),a:DIFE[o.dif||CFG.dif]||'🤖',c:'#46555f'};
  G=armar({modo:'compu',yo,dif:o.dif||CFG.dif,tc:o.tc!==undefined?o.tc:CFG.tc,w:yo==='w'?me:bot,b:yo==='b'?me:bot,ranked:window.RANGOS?RANGOS.isRanked('ajedrez'):false,moves:o.moves||[],fen0:o.fen0});
  FLIPU=false;SEL=-1;VER=null;arrancarReloj();guardar();render();

}

// v67: salir de la partida, en todos los modos. Contra la compu queda guardada; la distendida sigue en «Mis partidas»
// (podés volver cuando quieras); en vivo, se avisa al otro y la partida termina para los dos.
function salirPartida(){
  if(!G){mesaSinPartida();return;}
  const fin=()=>{COMPU_TOK++;PENSANDO=false;$('thinking').hidden=true;if(G&&G.modo==='dist')distParar();G=null;SEL=-1;VER=null;render();mesaSinPartida();};
  if(G.modo==='vivo'&&!G.fin){sheet('Salir de la partida',`<p>Si salís ahora, la partida con ${esc(nombreDe(otro(G.yo))||'tu amigo')} termina y se cuenta como que te rendiste.</p><div class="row"><button class="btn" id="sl-no">Seguir jugando</button><button class="btn go" id="sl-si">Salir</button></div>`);
    $('sl-no').onclick=closeSheet;$('sl-si').onclick=()=>{closeSheet();try{netSend({t:'abandono',gid:G.id});terminar({res:G.yo==='w'?'0-1':'1-0',motivo:'abandono'},false);}catch(_){}if(ON)netLeave();hideOver();fin();};return;}
  if(G.modo==='compu'&&!G.fin){guardar();toast('Tu partida queda guardada: seguila desde «Mis partidas».',3000);}
  else if(G.modo==='dist')toast('La partida sigue: la encontrás en «Mis partidas».',3000);
  fin();
}
function openLog(){

  let h='';for(let i=0;i<G.sans.length;i+=2)h+=`<span>${i/2+1}.</span><b>${esc(sanEs(G.sans[i]))}</b><i>${G.sans[i+1]?esc(sanEs(G.sans[i+1])):''}</i>`;
  sheet('Jugadas',`<div class="log">${h}</div><p class="note">Letras de las piezas: R rey, D dama, T torre, A alfil, C caballo. Los peones van sin letra. «x» es comer, «+» jaque y «#» mate.</p>
    <button class="btn" id="lg-copy">Copiar las jugadas</button>`);
  $('lg-copy').onclick=async()=>{const t=G.sans.map((s,i)=>(i%2===0?`${i/2+1}. `:'')+s).join(' ');try{await navigator.clipboard.writeText(t);toast('Copiadas');}catch(_){toast(esc(t));}};

function openHelp(){
  sheet('Cómo se juega',`<p><b>El ajedrez de siempre.</b> Cada uno mueve una pieza por turno; gana el que le da <b>jaque mate</b> al rey del otro (lo ataca y no tiene cómo escaparse).</p>
    <h4>Cómo se mueve cada pieza</h4><ul><li><b>Rey:</b> una casilla para cualquier lado.</li><li><b>Dama:</b> todo lo que quiera en línea recta o en diagonal.</li><li><b>Torre:</b> en línea recta.</li><li><b>Alfil:</b> en diagonal.</li><li><b>Caballo:</b> en «L», y salta por encima.</li><li><b>Peón:</b> para adelante de a uno (dos la primera vez) y come en diagonal. Si llega al final, corona: elegís en qué se convierte.</li></ul>
    <h4>Jugadas especiales</h4><ul><li><b>Enroque:</b> el rey va dos casillas hacia una torre y la torre salta al otro lado. Sólo si ninguno de los dos se movió, no hay nada en el medio y el rey no está ni pasa por jaque.</li><li><b>Al paso:</b> si un peón avanza dos y queda al lado de uno tuyo, lo podés comer como si hubiera avanzado uno, pero sólo en ese momento.</li></ul>
    <h4>Tablas</h4><p>Rey ahogado (no tiene jugadas y no está en jaque), la misma posición tres veces, cincuenta jugadas sin comer ni mover peones, cuando ya nadie puede dar mate, o si los dos se ponen de acuerdo.</p>
    <h4>Tres maneras de jugar</h4><ul><li><b>Contra la compu:</b> cuatro niveles, con o sin reloj. Podés deshacer (pero así no mueve el rango).</li><li><b>En vivo:</b> con un amigo, ahora. Con reloj (bala, blitz, rápida) o sin reloj. Si se corta la conexión, el reloj se para y se espera que vuelva.</li><li><b>Distendida:</b> la partida queda guardada y cada uno mueve cuando puede. Al otro le llega al chat que le toca. Podés tener varias a la vez.</li></ul>
    <p class="note">Para mover: tocá la pieza y después la casilla, o arrastrala. Tocando las jugadas de abajo mirás cómo venía la partida.</p>
    <button class="btn go" id="h-ok">Entendido</button>`);$('h-ok').onclick=closeSheet;
}

   cada uno lleva su propio reloj y se lo pasa al otro con cada jugada.
   Si se corta (te subiste al colectivo, se cayó el wifi): el reloj se para, el que invitó vuelve a invitar solo y

const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}

function recibirSync(m){

    const yo=yoHost?m.hostColor:otro(m.hostColor);

  else{
    const mia=G.moves,suya=m.moves||[],prefijo=(a,b)=>a.every((u,i)=>b[i]===u);
    if(suya.length>mia.length&&prefijo(mia,suya)){G=armar({...G,moves:suya,clk:m.clk||G.clk,fin:m.fin||G.fin});}
    else if(mia.length>suya.length&&prefijo(suya,mia)){netSend(datosSync());}

function distBanner(){
  const d=G&&G.dist;if(!d||G.fin)return '';const riv=esc(nombreDe(otro(G.yo))),me=miUsuario(),mio=G.st.turn===G.yo;
  if(d.tablas&&d.tablas.toLowerCase()!==me)return `🤝 <b>${riv}</b> te ofrece tablas <button data-bn="d-tablas-si" class="go">Aceptar</button><button data-bn="d-tablas-no">Seguir jugando</button>`;
  let h='';
  if(mio)h=`📮 Te toca${d.dias&&d.limite?` · tenés hasta ${fechaCorta(d.limite)}`:''}`;
  else{h=`📮 Le toca a <b>${riv}</b> · ${d.tUlt?`jugaste ${hace(d.tUlt)}`:''}`;
    if(d.vencida)h+=` · se le pasó el tiempo <button data-bn="d-ganar" class="go">Ganar por tiempo</button><button data-bn="d-esperar">Darle ${d.dias} ${d.dias===1?'día':'días'} más</button>`;}
  if(d.tablas&&d.tablas.toLowerCase()===me)h+=' · le ofreciste tablas';
  return h;
}
function distAccion(a){
  if(a==='tablas-si')distTablas('aceptar');else if(a==='tablas-no')distTablas('rechazar');
  else if(a==='ganar')distReclamar('ganar');else if(a==='esperar')distReclamar('esperar');else if(a==='lista')openPartidas();
}
async function nuevaDist(u){
  if(!acct()){pedirCuenta();return;}
  sheet('Distendida',`<p><span class="busy"></span>Armando la partida con ${esc(u.usuario)}…</p>`);
  try{const j=await lbCall(conCuenta({accion:'ajNueva',para:u.usuario,color:colorElegido(),dias:CFG.dias}));
    await abrirDist(j.id);toast(G&&G.st.turn===G.yo?`Arrancás vos: con tu primera jugada a ${esc(u.usuario)} le llega el desafío al chat.`:`Listo. A ${esc(u.usuario)} le llega al chat que le toca.`,3500);}
  catch(e){sheet('Distendida',`<p>${esc(e.message)}</p><button class="btn" id="nd-x">Volver</button>`);$('nd-x').onclick=()=>openNew('dist');}
}

/* v66: mensajes en la partida distendida (quedan guardados en la planilla; los ven los dos al abrirla). */
let DCH_ID='',DCH_N=0;
function distChatCargar(nueva){
  if(!window.MESA_CHAT||!G||G.modo!=='dist')return;const L=(G.dist&&G.dist.msgs)||[],me=miUsuario();
  if(nueva||DCH_ID!==G.id){DCH_ID=G.id;DCH_N=L.length;MESA_CHAT.cargar(L.map(m=>({de:m.de,txt:m.txt,yo:String(m.de||'').toLowerCase()===me})));return;}
  for(const m of L.slice(DCH_N))if(String(m.de||'').toLowerCase()!==me)MESA_CHAT.recibir({de:m.de,txt:m.txt});
  DCH_N=L.length;
}
async function distChatMandar(txt){
  if(!G||G.modo!=='dist')return;const id=G.id;
  try{const j=await lbCall(conCuenta({accion:'ajChat',id,txt}));if(G&&G.id===id){G.dist.msgs=(j.partida&&j.partida.msgs)||G.dist.msgs;DCH_N=G.dist.msgs.length;}}
  catch(e){toast(esc(e.message||'No se pudo mandar el mensaje.'));}
}

/* ───────── Arranque ───────── */
function aceptando(){try{return !!sessionStorage.getItem('ajedrez-accept');}catch(_){return false;}}
function esperarInvitacion(){
  sheet('Partida con un amigo','<p><span class="busy"></span>Buscando la invitación de tu amigo…</p>');
  let n=0;const t=setInterval(()=>{
    if(ON||!aceptando()){clearInterval(t);return;}
    if(++n>12){clearInterval(t);try{sessionStorage.removeItem('ajedrez-accept');}catch(_){}
      sheet('Partida con un amigo','<p>No encontramos la invitación: puede que tu amigo ya no esté esperando o que la haya cancelado.</p><p>Pedile que te invite de nuevo, o invitalo vos.</p><button class="btn go" id="ia-inv">Invitar a alguien</button><button class="btn" id="ia-new">Jugar con la compu</button>');
      $('ia-inv').onclick=()=>elegirAmigo('vivo');$('ia-new').onclick=()=>openNew('compu');return;}
    pollInbox(true);
  },2500);
  setTimeout(()=>pollInbox(true),300);
}
// Si se cerró la página en medio de una partida en vivo (hace menos de 10 minutos), se vuelve a esperar al otro.
function retomarVivo(){
  const v=ls.json(VIVO,null);if(!v||!v.g||v.g.fin||!v.on||!acct()||Date.now()-(v.t||0)>600000)return false;
  G=armar(v.g);ON={role:v.on.role,peer:v.on.peer,state:'cortado',re:G.id};VIVO_T.cortadoT=Date.now();
  render();renderOnline();toast(`Volviendo a la partida con ${esc(ON.peer.usuario)}…`,3000);
  clearInterval(VIVO_T.iv);VIVO_T.iv=setInterval(()=>{if(!ON||ON.state!=='cortado'){clearInterval(VIVO_T.iv);return;}renderBanner();if(ON.role==='guest')pollInbox(true);},1500);
  if(ON.role==='host')reconectarHost();
  return true;
}
(function start(){
  try{window.LOGROS&&LOGROS.aplicar('ajedrez');}catch(_){}
  if(window.RANGOS)RANGOS.css();
  acomodar();
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;const d=(location.hash.match(/dif=(\w+)/)||[])[1];if(d&&DIFN[d])CFG.dif=d;
    const tc=(location.hash.match(/tc=([\d+]+)/)||[])[1];CFG.tc=tc&&TCS[tc]?tc:'';nuevaCompu({yo:'w'});return;}
  ls.set('bloques-ultimo-juego','ajedrez');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  const pm=/^#partida=([\w-]+)/.exec(hash),im=/^#invitar=([^&]+)/.exec(hash);
  const pcr=/[#&]pampa-cruce=(\d+)&duelo=([\w-]+)/.exec(hash);   // v69: un cruce de La Gran Pampa
  if(pcr){PAMPA_CRUCE={seed:Number(pcr[1]),duelo:pcr[2]};nuevaCompu({pampa:1,yo:Number(pcr[1])%2?'b':'w',dif:'normal',tc:'3+2'});setTimeout(()=>toast('⚔️ Cruce de La Gran Pampa: blitz 3+2 contra la compu'),500);}
  else if(pm){abrirDist(pm[1]);}
  else if(!aceptando()&&!retomarVivo()){
    const sv=ls.json(SAVE,null);
    if(sv&&sv.moves&&!sv.fin)seguirCompu(sv);
    else{render();if(!im&&!/^#(amigos|mesa|nueva|partidas)/.test(hash)){if(!ls.get('ajedrez-ayuda')){ls.set('ajedrez-ayuda','1');openHelp();}else mesaSinPartida();}}
  }
  if(aceptando())esperarInvitacion();
  if(/^#(amigos|mesa)/.test(hash))setTimeout(()=>openNew('vivo'),200);
  if(/^#partidas/.test(hash))setTimeout(openPartidas,200);
  if(im&&acct()){let u='';try{u=decodeURIComponent(im[1]);}catch(_){u=im[1];}setTimeout(()=>invitarA(u),300);}
  // v66: chat de la mesa en vivo (por la conexión) y en las distendidas (queda guardado en la partida)
  if(window.MESA_CHAT)MESA_CHAT.montar({juego:'ajedrez',
    activo:()=>!!((ON&&ON.state==='on'&&G&&G.modo==='vivo')||(G&&G.modo==='dist'&&acct())),
    enviar:m=>{if(G&&G.modo==='dist'){distChatMandar(m.txt);return;}netSend({t:'mchat',de:yoPerfil().n,txt:m.txt});},
    nota:()=>G&&G.modo==='dist'?'Queda guardado en esta partida: lo ven los dos cuando la abren.':'Sólo lo ven ustedes dos y se borra al terminar.',
    sonido:()=>sfx('msg')});
  if(window.CHAT)CHAT.init({busy:()=>!!(G&&!G.fin&&G.modo!=='dist'&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'ajedrez',inbox:()=>pollInbox(true),
    invite:(g,u)=>{if(g==='ajedrez'){invitarA(u);return;}if(g==='estancia'){location.href='estancia.html#malon';return;}
      location.href=({poblar:'poblar.html',truco:'truco.html',uno:'uno.html'}[g]||'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='ajedrez'){if(c.aj)abrirDist(c.aj);else openNew();return;}
      location.href=c.j==='estancia'?'estancia.html#malon':({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',pampa:'pampa.html',sudoku:'sudoku.html',solitario:'solitario.html',buscaminas:'buscaminas.html'}[c.j]||'./');}});
  setInterval(()=>pollInbox(),4000);
  window.addEventListener('bloques-latido',e=>{const b=e.detail&&e.detail.bz;if(b&&b.ajToca!==undefined){try{distBadge(b.ajToca);}catch(_){}}});   // v76
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){setTimeout(()=>pollInbox(true),500);if(G&&G.modo==='dist'&&!G.fin)recargarDist(true);}});
  setTimeout(()=>pollInbox(true),1500);
  if(acct())setTimeout(()=>distLista(),2500);
  setInterval(()=>{if(acct()&&!document.hidden)distLista();},90000);
})();
window.AJEDREZ={AJ,get G(){return G;},get ON(){return ON;},get CFG(){return CFG;},get DIST(){return DIST;},get PENSANDO(){return PENSANDO;},
  jugar,nuevaCompu,openNew,openHelp,openPartidas,abrirDist,elegirAmigo,inviteFriend,acceptInvite,pollInbox,netLeave,netSend,onLost,render,terminar,deshacer,
  restante,turnoMio,recargarDist,pasarADist,invitarA,nuevaDist,distLista,openMenu,mostrarFin,salirPartida,animUltima,
  set FAST(v){FAST=v;},set AUTO(v){AUTO=v;},set FLIPU(v){FLIPU=v;}};
