function fromSan(st,s){const t=String(s||'').replace(/[+#!?]/g,'');return legal(st).find(m=>san(st,m).replace(/[+#]/g,'')===t)||null;}
function material(st){const out={w:[],b:[]};for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=st.b[s];if(p&&p.toUpperCase()!=='K')out[colorOf(p)].push({p:p.toUpperCase(),sq:s});}return out;}
function insuficiente(st){
  const M=material(st),w=M.w,b=M.b;
  if(w.some(x=>'PRQ'.includes(x.p))||b.some(x=>'PRQ'.includes(x.p)))return false;
  if(!w.length&&!b.length)return true;
  if(w.length+b.length===1)return true;                       // rey y alfil o caballo contra rey solo
  const all=w.concat(b);
  if(all.every(x=>x.p==='B')){const col=x=>((x.sq>>4)+(x.sq&7))&1;return all.every(x=>col(x)===col(all[0]));}// alfiles del mismo color
  return false;
}
function repeticiones(st){const k=st.keys[st.keys.length-1];let n=0;for(const x of st.keys)if(x===k)n++;return n;}
// Estado de la partida: {fin, res ('1-0','0-1','½-½'), motivo, jaque}
function estado(st){
  const L=legal(st),ch=inCheck(st);
  if(!L.length)return ch?{fin:true,res:st.turn==='w'?'0-1':'1-0',motivo:'mate',jaque:true}:{fin:true,res:'½-½',motivo:'ahogado',jaque:false};
  if(insuficiente(st))return {fin:true,res:'½-½',motivo:'material',jaque:ch};
  if(st.half>=100)return {fin:true,res:'½-½',motivo:'50',jaque:ch};
  if(repeticiones(st)>=3)return {fin:true,res:'½-½',motivo:'repeticion',jaque:ch};
  return {fin:false,jaque:ch,n:L.length};
}
function perft(st,d){if(d===0)return 1;let n=0;const us=st.turn;for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))n+=d===1?1:perft(st,d-1);unmake(st);}return n;}
// Una partida desde una lista de jugadas (uci). Devuelve el estado, las SAN y si alguna no era legal.
function jugarLista(lista,fen=START){const st=fromFEN(fen),sans=[];for(const u of lista||[]){const m=fromUci(st,u);if(!m)return {st,sans,error:u};sans.push(san(st,m));make(st,m);}return {st,sans,error:null};}

/* ── La compu: alfa-beta con profundidad creciente, quietud y tablas de posición ── */
const VAL={P:100,N:320,B:330,R:500,Q:900,K:0};
// Tablas desde el lado de las blancas, de a8 (índice 0) a h1 (63).
const PST={
P:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],
N:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],
B:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],
R:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],
Q:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],
K:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20],
KE:[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50]};
const pIdx=(s,w)=>w?(7-(s>>4))*8+(s&7):(s>>4)*8+(s&7);
// Evaluación desde el lado del que juega.
function evaluar(st){
  let sc=0,mat=0;const b=st.b;
  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(p){const P=p.toUpperCase();if(P!=='K'&&P!=='P')mat+=VAL[P];}}
  const final=mat<=1300;
  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(!p)continue;const P=p.toUpperCase(),w=isW(p);
    const v=VAL[P]+(P==='K'&&final?PST.KE:PST[P])[pIdx(s,w)];sc+=w?v:-v;}

}
function ordenar(ms,best){for(const m of ms){m.o=(m.x?10*VAL[m.x.toUpperCase()]-VAL[m.p.toUpperCase()]/10+1000:0)+(m.pr?800:0)+(best&&m.f===best.f&&m.t===best.t&&m.pr===best.pr?100000:0);}ms.sort((a,b)=>b.o-a.o);return ms;}
function buscar(st,opts={}){
  const t0=Date.now(),ms=opts.ms||800,maxD=opts.depth||4,rnd=opts.rnd||0,R=opts.R||Math.random;

  function raizBusca(d,pv){

    // si la elegida quedó muy por debajo de la mejor (pasa con poco azar), vale igual: está dentro de rnd

// Niveles: fácil se equivoca a propósito; maestro piensa más.
const NIVELES={facil:{depth:1,ms:250,rnd:220,error:.25},normal:{depth:3,ms:600,rnd:40,error:0},dificil:{depth:4,ms:1300,rnd:8,error:0},maestro:{depth:7,ms:2600,rnd:0,error:0}};
function jugadaCompu(st,nivel='normal',R=Math.random){

return {START,FILES,sqName,sqIdx,fromFEN,toFEN,clone,posKey,attacked,inCheck,pseudo,legal,legalFrom,make,unmake,uci,fromUci,san,fromSan,estado,perft,jugarLista,insuficiente,evaluar,buscar,jugadaCompu,NIVELES,colorOf,kingSq,VAL};
})();

<script>
'use strict';
const MOTOR_SRC="/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 AjedrezAR \u00b7 motor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   Tablero 0x88 (a1=0 \u2026 h8=0x77). Piezas: may\u00fascula blancas (PNBRQK), min\u00fascula negras.\n   Todo lo que hace falta para jugar bien: jugadas legales (enroque, al paso, coronaci\u00f3n), jaque, mate, ahogado,\n   triple repetici\u00f3n, 50 movimientos, material insuficiente, notaci\u00f3n algebraica (SAN) y la compu (alfa-beta). */\nconst AJ=(function(){\n'use strict';\nconst START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';\nconst FILES='abcdefgh';\nconst N_OFF=[-33,-31,-18,-14,14,18,31,33],K_OFF=[-17,-16,-15,-1,1,15,16,17],B_OFF=[-17,-15,15,17],R_OFF=[-16,-1,1,16];\nconst sqName=s=>FILES[s&7]+((s>>4)+1);\nconst sqIdx=n=>(n.charCodeAt(1)-49)*16+(n.charCodeAt(0)-97);\nconst isW=p=>p>='A'&&p<='Z';\nconst colorOf=p=>p?(isW(p)?'w':'b'):null;\nconst lower=p=>p.toLowerCase();\n\nfunction fromFEN(fen){\n  const parts=String(fen||START).trim().split(/\\s+/),b=new Array(128).fill(null);\n  const rows=parts[0].split('/');if(rows.length!==8)throw new Error('FEN inv\u00e1lido');\n  for(let r=0;r<8;r++){let f=0;for(const ch of rows[r]){if(/\\d/.test(ch))f+=Number(ch);else{b[(7-r)*16+f]=ch;f++;}}if(f!==8)throw new Error('FEN inv\u00e1lido');}\n  const st={b,turn:parts[1]==='b'?'b':'w',castle:parts[2]&&parts[2]!=='-'?parts[2]:'',ep:parts[3]&&parts[3]!=='-'?sqIdx(parts[3]):-1,\n    half:Number(parts[4])||0,full:Number(parts[5])||1,hist:[],keys:[],kw:-1,kb:-1};\n  for(let s=0;s<128;s++){if(b[s]==='K')st.kw=s;else if(b[s]==='k')st.kb=s;}\n  st.keys.push(posKey(st));return st;\n}\nfunction toFEN(st){\n  let s='';for(let r=7;r>=0;r--){let e=0;for(let f=0;f<8;f++){const p=st.b[r*16+f];if(!p)e++;else{if(e){s+=e;e=0;}s+=p;}}if(e)s+=e;if(r)s+='/';}\n  return `${s} ${st.turn} ${st.castle||'-'} ${st.ep>=0?sqName(st.ep):'-'} ${st.half} ${st.full}`;\n}\nfunction clone(st){return {b:st.b.slice(),turn:st.turn,castle:st.castle,ep:st.ep,half:st.half,full:st.full,hist:[],keys:st.keys.slice(),kw:st.kw,kb:st.kb};}\n// Clave de la posici\u00f3n para la repetici\u00f3n: el al paso cuenta s\u00f3lo si de verdad se puede comer al paso.\nfunction posKey(st){\n  let s='';for(let r=0;r<8;r++)for(let f=0;f<8;f++)s+=st.b[r*16+f]||'.';\n  let ep='-';if(st.ep>=0){const pw=st.turn==='w'?'P':'p',d=st.turn==='w'?-16:16;for(const o of [d-1,d+1]){const q=st.ep+o;if(!(q&0x88)&&st.b[q]===pw){ep=sqName(st.ep);break;}}}\n  return s+st.turn+(st.castle||'-')+ep;\n}\nfunction kingSq(st,c){return c==='w'?st.kw:st.kb;}\n// \u00bfLa casilla s est\u00e1 atacada por el color \u00abby\u00bb?\nfunction attacked(st,s,by){\n  const b=st.b,w=by==='w';\n  // peones\n  const pd=w?-16:16,pw=w?'P':'p';\n  for(const o of [pd-1,pd+1]){const q=s+o;if(!(q&0x88)&&b[q]===pw)return true;}\n  const n=w?'N':'n';for(const o of N_OFF){const q=s+o;if(!(q&0x88)&&b[q]===n)return true;}\n  const k=w?'K':'k';for(const o of K_OFF){const q=s+o;if(!(q&0x88)&&b[q]===k)return true;}\n  const bq=w?['B','Q']:['b','q'],rq=w?['R','Q']:['r','q'];\n  for(const o of B_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===bq[0]||p===bq[1])return true;break;}q+=o;}}\n  for(const o of R_OFF){let q=s+o;while(!(q&0x88)){const p=b[q];if(p){if(p===rq[0]||p===rq[1])return true;break;}q+=o;}}\n  return false;\n}\nfunction inCheck(st,c=st.turn){const k=kingSq(st,c);return k>=0&&attacked(st,k,c==='w'?'b':'w');}\n// Jugadas: {f (desde), t (hasta), p (pieza), x (comida o null), pr (coronaci\u00f3n, en el color de quien juega), fl ('n','2','ep','O','OOO')}\nfunction pseudo(st,soloCapturas){\n  const out=[],b=st.b,us=st.turn,them=us==='w'?'b':'w',W=us==='w';\n  const add=(f,t,p,x,fl='n')=>{\n    if((p==='P'&&(t>>4)===7)||(p==='p'&&(t>>4)===0)){for(const q of (W?['Q','R','B','N']:['q','r','b','n']))out.push({f,t,p,x,pr:q,fl});}\n    else out.push({f,t,p,x,pr:null,fl});};\n  for(let s=0;s<128;s++){\n    if(s&0x88){s+=7;continue;}\n    const p=b[s];if(!p||colorOf(p)!==us)continue;const P=p.toUpperCase();\n    if(P==='P'){\n      const d=W?16:-16,r=s>>4,start=W?1:6;\n      const t1=s+d;\n      if(!soloCapturas||((t1>>4)===(W?7:0))){if(!(t1&0x88)&&!b[t1]){add(s,t1,p,null);if(r===start&&!b[t1+d]&&!soloCapturas)out.push({f:s,t:t1+d,p,x:null,pr:null,fl:'2'});}}\n      for(const o of [d-1,d+1]){const t=s+o;if(t&0x88)continue;\n        if(b[t]&&colorOf(b[t])===them)add(s,t,p,b[t]);\n        else if(t===st.ep)out.push({f:s,t,p,x:W?'p':'P',pr:null,fl:'ep'});}\n      continue;}\n    if(P==='N'||P==='K'){\n      for(const o of (P==='N'?N_OFF:K_OFF)){const t=s+o;if(t&0x88)continue;const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else if(colorOf(q)===them)add(s,t,p,q);}\n      if(P==='K'&&!soloCapturas){\n        const home=W?4:116;\n        if(s===home&&!attacked(st,s,them)){\n          const K=W?'K':'k',Q=W?'Q':'q',R=W?'R':'r';\n          if(st.castle.includes(K)&&b[s+3]===R&&!b[s+1]&&!b[s+2]&&!attacked(st,s+1,them)&&!attacked(st,s+2,them))out.push({f:s,t:s+2,p,x:null,pr:null,fl:'O'});\n          if(st.castle.includes(Q)&&b[s-4]===R&&!b[s-1]&&!b[s-2]&&!b[s-3]&&!attacked(st,s-1,them)&&!attacked(st,s-2,them))out.push({f:s,t:s-2,p,x:null,pr:null,fl:'OOO'});\n        }}\n      continue;}\n    const offs=P==='B'?B_OFF:P==='R'?R_OFF:K_OFF;\n    for(const o of offs){let t=s+o;while(!(t&0x88)){const q=b[t];if(!q){if(!soloCapturas)add(s,t,p,null);}else{if(colorOf(q)===them)add(s,t,p,q);break;}t+=o;}}\n  }\n  return out;\n}\nconst CR={0:'Q',7:'K',112:'q',119:'k'};// torre en su casilla de origen \u2192 derecho de enroque\nfunction quitarEnroque(c,ch){return c.replace(ch,'');}\nfunction make(st,m){\n  const b=st.b;\n  st.hist.push({m,castle:st.castle,ep:st.ep,half:st.half,full:st.full});\n  b[m.f]=null;\n  if(m.fl==='ep'){b[m.t+(st.turn==='w'?-16:16)]=null;}\n  b[m.t]=m.pr||m.p;\n  if(m.p==='K')st.kw=m.t;else if(m.p==='k')st.kb=m.t;\n  if(m.fl==='O'){b[m.t-1]=b[m.t+1];b[m.t+1]=null;}\n  if(m.fl==='OOO'){b[m.t+1]=b[m.t-2];b[m.t-2]=null;}\n  let c=st.castle;\n  if(c){if(m.p==='K')c=quitarEnroque(quitarEnroque(c,'K'),'Q');else if(m.p==='k')c=quitarEnroque(quitarEnroque(c,'k'),'q');\n    if(CR[m.f]!==undefined)c=quitarEnroque(c,CR[m.f]);if(CR[m.t]!==undefined)c=quitarEnroque(c,CR[m.t]);}\n  st.castle=c;\n  st.ep=m.fl==='2'?(m.f+m.t)>>1:-1;\n  st.half=(m.p==='P'||m.p==='p'||m.x)?0:st.half+1;\n  if(st.turn==='b')st.full++;\n  st.turn=st.turn==='w'?'b':'w';\n  st.keys.push(posKey(st));\n}\nfunction unmake(st){\n  const h=st.hist.pop();if(!h)return;const m=h.m,b=st.b;\n  st.keys.pop();\n  st.turn=st.turn==='w'?'b':'w';st.castle=h.castle;st.ep=h.ep;st.half=h.half;st.full=h.full;\n  b[m.f]=m.p;b[m.t]=null;\n  if(m.p==='K')st.kw=m.f;else if(m.p==='k')st.kb=m.f;\n  if(m.fl==='ep')b[m.t+(st.turn==='w'?-16:16)]=m.x;\n  else if(m.x)b[m.t]=m.x;\n  if(m.fl==='O'){b[m.t+1]=b[m.t-1];b[m.t-1]=null;}\n  if(m.fl==='OOO'){b[m.t-2]=b[m.t+1];b[m.t+1]=null;}\n}\nfunction legal(st){const us=st.turn,out=[];for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))out.push(m);unmake(st);}return out;}\nfunction legalFrom(st,s){return legal(st).filter(m=>m.f===s);}\nconst uci=m=>sqName(m.f)+sqName(m.t)+(m.pr?lower(m.pr):'');\nfunction fromUci(st,u){u=String(u||'').toLowerCase();return legal(st).find(m=>uci(m)===u)||null;}\n// Notaci\u00f3n algebraica en castellano rioplatense de club: se usan las letras internacionales (N, B, R, Q, K)\n// para que se entienda con cualquier libro o app. La UI las muestra con figuritas.\nfunction san(st,m){\n  let s;\n  if(m.fl==='O')s='O-O';else if(m.fl==='OOO')s='O-O-O';\n  else{const P=m.p.toUpperCase();\n    if(P==='P'){s=(m.x?FILES[m.f&7]+'x':'')+sqName(m.t)+(m.pr?'='+m.pr.toUpperCase():'');}\n    else{const otros=legal(st).filter(o=>o.p===m.p&&o.t===m.t&&o.f!==m.f);let dis='';\n      if(otros.length){const sameF=otros.some(o=>(o.f&7)===(m.f&7)),sameR=otros.some(o=>(o.f>>4)===(m.f>>4));\n        dis=!sameF?FILES[m.f&7]:!sameR?String((m.f>>4)+1):sqName(m.f);}\n      s=P+dis+(m.x?'x':'')+sqName(m.t);}}\n  make(st,m);const ch=inCheck(st),mate=ch&&legal(st).length===0;unmake(st);\n  return s+(mate?'#':ch?'+':'');\n}\nfunction fromSan(st,s){const t=String(s||'').replace(/[+#!?]/g,'');return legal(st).find(m=>san(st,m).replace(/[+#]/g,'')===t)||null;}\nfunction material(st){const out={w:[],b:[]};for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=st.b[s];if(p&&p.toUpperCase()!=='K')out[colorOf(p)].push({p:p.toUpperCase(),sq:s});}return out;}\nfunction insuficiente(st){\n  const M=material(st),w=M.w,b=M.b;\n  if(w.some(x=>'PRQ'.includes(x.p))||b.some(x=>'PRQ'.includes(x.p)))return false;\n  if(!w.length&&!b.length)return true;\n  if(w.length+b.length===1)return true;                       // rey y alfil o caballo contra rey solo\n  const all=w.concat(b);\n  if(all.every(x=>x.p==='B')){const col=x=>((x.sq>>4)+(x.sq&7))&1;return all.every(x=>col(x)===col(all[0]));}// alfiles del mismo color\n  return false;\n}\nfunction repeticiones(st){const k=st.keys[st.keys.length-1];let n=0;for(const x of st.keys)if(x===k)n++;return n;}\n// Estado de la partida: {fin, res ('1-0','0-1','\u00bd-\u00bd'), motivo, jaque}\nfunction estado(st){\n  const L=legal(st),ch=inCheck(st);\n  if(!L.length)return ch?{fin:true,res:st.turn==='w'?'0-1':'1-0',motivo:'mate',jaque:true}:{fin:true,res:'\u00bd-\u00bd',motivo:'ahogado',jaque:false};\n  if(insuficiente(st))return {fin:true,res:'\u00bd-\u00bd',motivo:'material',jaque:ch};\n  if(st.half>=100)return {fin:true,res:'\u00bd-\u00bd',motivo:'50',jaque:ch};\n  if(repeticiones(st)>=3)return {fin:true,res:'\u00bd-\u00bd',motivo:'repeticion',jaque:ch};\n  return {fin:false,jaque:ch,n:L.length};\n}\nfunction perft(st,d){if(d===0)return 1;let n=0;const us=st.turn;for(const m of pseudo(st)){make(st,m);if(!inCheck(st,us))n+=d===1?1:perft(st,d-1);unmake(st);}return n;}\n// Una partida desde una lista de jugadas (uci). Devuelve el estado, las SAN y si alguna no era legal.\nfunction jugarLista(lista,fen=START){const st=fromFEN(fen),sans=[];for(const u of lista||[]){const m=fromUci(st,u);if(!m)return {st,sans,error:u};sans.push(san(st,m));make(st,m);}return {st,sans,error:null};}\n\n/* \u2500\u2500 La compu: alfa-beta con profundidad creciente, quietud y tablas de posici\u00f3n \u2500\u2500 */\nconst VAL={P:100,N:320,B:330,R:500,Q:900,K:0};\n// Tablas desde el lado de las blancas, de a8 (\u00edndice 0) a h1 (63).\nconst PST={\nP:[0,0,0,0,0,0,0,0,50,50,50,50,50,50,50,50,10,10,20,30,30,20,10,10,5,5,10,25,25,10,5,5,0,0,0,20,20,0,0,0,5,-5,-10,0,0,-10,-5,5,5,10,10,-20,-20,10,10,5,0,0,0,0,0,0,0,0],\nN:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],\nB:[-20,-10,-10,-10,-10,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,10,10,5,0,-10,-10,5,5,10,10,5,5,-10,-10,0,10,10,10,10,0,-10,-10,10,10,10,10,10,10,-10,-10,5,0,0,0,0,5,-10,-20,-10,-10,-10,-10,-10,-10,-20],\nR:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],\nQ:[-20,-10,-10,-5,-5,-10,-10,-20,-10,0,0,0,0,0,0,-10,-10,0,5,5,5,5,0,-10,-5,0,5,5,5,5,0,-5,0,0,5,5,5,5,0,-5,-10,5,5,5,5,5,0,-10,-10,0,5,0,0,0,0,-10,-20,-10,-10,-5,-5,-10,-10,-20],\nK:[-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-30,-40,-40,-50,-50,-40,-40,-30,-20,-30,-30,-40,-40,-30,-30,-20,-10,-20,-20,-20,-20,-20,-20,-10,20,20,0,0,0,0,20,20,20,30,10,0,0,10,30,20],\nKE:[-50,-40,-30,-20,-20,-30,-40,-50,-30,-20,-10,0,0,-10,-20,-30,-30,-10,20,30,30,20,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,30,40,40,30,-10,-30,-30,-10,20,30,30,20,-10,-30,-30,-30,0,0,0,0,-30,-30,-50,-30,-30,-30,-30,-30,-30,-50]};\nconst pIdx=(s,w)=>w?(7-(s>>4))*8+(s&7):(s>>4)*8+(s&7);\n// Evaluaci\u00f3n desde el lado del que juega.\nfunction evaluar(st){\n  let sc=0,mat=0;const b=st.b;\n  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(p){const P=p.toUpperCase();if(P!=='K'&&P!=='P')mat+=VAL[P];}}\n  const final=mat<=1300;\n  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=b[s];if(!p)continue;const P=p.toUpperCase(),w=isW(p);\n    const v=VAL[P]+(P==='K'&&final?PST.KE:PST[P])[pIdx(s,w)];sc+=w?v:-v;}\n  return st.turn==='w'?sc:-sc;\n}\nfunction ordenar(ms,best){for(const m of ms){m.o=(m.x?10*VAL[m.x.toUpperCase()]-VAL[m.p.toUpperCase()]/10+1000:0)+(m.pr?800:0)+(best&&m.f===best.f&&m.t===best.t&&m.pr===best.pr?100000:0);}ms.sort((a,b)=>b.o-a.o);return ms;}\nfunction buscar(st,opts={}){\n  const t0=Date.now(),ms=opts.ms||800,maxD=opts.depth||4,rnd=opts.rnd||0,R=opts.R||Math.random;\n  let nodos=0,corte=false,best=null,bestSc=0;\n  const MATE=100000;\n  function q(alpha,beta,ply){\n    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;\n    const ep=evaluar(st);if(ep>=beta)return beta;if(ep>alpha)alpha=ep;if(ply>8)return alpha;\n    const us=st.turn;\n    for(const m of ordenar(pseudo(st,true))){make(st,m);if(inCheck(st,us)){unmake(st);continue;}const v=-q(-beta,-alpha,ply+1);unmake(st);if(corte)return 0;if(v>=beta)return beta;if(v>alpha)alpha=v;}\n    return alpha;}\n  function ab(d,alpha,beta,ply){\n    if((++nodos&1023)===0&&Date.now()-t0>ms)corte=true;if(corte)return 0;\n    if(ply&&(st.half>=100||repeticiones(st)>=2))return 0;\n    if(d<=0)return q(alpha,beta,0);\n    const us=st.turn,L=ordenar(pseudo(st));let n=0;\n    for(const m of L){make(st,m);if(inCheck(st,us)){unmake(st);continue;}n++;\n      const v=-ab(d-1,-beta,-alpha,ply+1);\n      unmake(st);if(corte)return 0;\n      if(v>alpha)alpha=v;\n      if(alpha>=beta)break;}\n    if(!n)return inCheck(st)?-MATE+ply:0;\n    return alpha;}\n  // La ra\u00edz aparte: con \u00abrnd\u00bb cada jugada que queda a menos de rnd de la mejor se mide exacta y se elige con un poco de azar.\n  function raizBusca(d,pv){\n    const us=st.turn,L=ordenar(pseudo(st),pv);let bestRaw=-MATE*2,elegida=null,elegidaV=-MATE*3,raw=0;\n    for(const m of L){make(st,m);if(inCheck(st,us)){unmake(st);continue;}\n      const a=rnd?bestRaw-rnd:bestRaw;\n      const v=-ab(d-1,-MATE*2,-a,1);unmake(st);if(corte)return;\n      if(v>bestRaw)bestRaw=v;\n      if(v>a){const nv=v+(rnd&&Math.abs(v)<MATE-100?Math.floor((R()*2-1)*rnd/2):0);if(nv>elegidaV||!elegida){elegida=m;elegidaV=nv;raw=v;}}}\n    // si la elegida qued\u00f3 muy por debajo de la mejor (pasa con poco azar), vale igual: est\u00e1 dentro de rnd\n    best=elegida;bestSc=raw;}\n  const raiz=legal(st);if(!raiz.length)return null;if(raiz.length===1)return {m:raiz[0],sc:0,d:0};\n  let pv=null,ultimo=null,ultimoSc=0,dHecho=0;\n  for(let d=1;d<=maxD;d++){best=null;raizBusca(d,pv);if(corte&&d>1)break;if(best){ultimo=best;ultimoSc=bestSc;pv=best;dHecho=d;}if(Math.abs(ultimoSc)>MATE-100)break;if(Date.now()-t0>ms*0.55)break;}\n  if(!ultimo)ultimo=raiz[Math.floor(R()*raiz.length)];\n  return {m:ultimo,sc:ultimoSc,d:dHecho,nodos};\n}\n// Niveles: f\u00e1cil se equivoca a prop\u00f3sito; maestro piensa m\u00e1s.\nconst NIVELES={facil:{depth:1,ms:250,rnd:220,error:.25},normal:{depth:3,ms:600,rnd:40,error:0},dificil:{depth:4,ms:1300,rnd:8,error:0},maestro:{depth:7,ms:2600,rnd:0,error:0}};\nfunction jugadaCompu(st,nivel='normal',R=Math.random){\n  const N=NIVELES[nivel]||NIVELES.normal,L=legal(st);if(!L.length)return null;\n  if(N.error&&R()<N.error)return L[Math.floor(R()*L.length)];\n  const s=clone(st);const r=buscar(s,{depth:N.depth,ms:N.ms,rnd:N.rnd,R});return r?L.find(m=>m.f===r.m.f&&m.t===r.m.t&&m.pr===r.m.pr)||r.m:null;\n}\nreturn {START,FILES,sqName,sqIdx,fromFEN,toFEN,clone,posKey,attacked,inCheck,pseudo,legal,legalFrom,make,unmake,uci,fromUci,san,fromSan,estado,perft,jugarLista,insuficiente,evaluar,buscar,jugadaCompu,NIVELES,colorOf,kingSq,VAL};\n})();\n";
/* ───────── AjedrezAR: la mesa ─────────
   Tres maneras de jugar: contra la compu, en vivo con un amigo (con o sin reloj) y «distendida»: la partida queda
   guardada en la planilla y cada uno mueve cuando puede (le llega al otro por el chat). Las reglas están en el motor. */
const $=id=>document.getElementById(id);

/* ───────── Sonido: madera sobre madera ───────── */
let SND=ls.get('ajedrez-sonido')!=='0',AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function nota(f,t0=0,d=.25,v=.04,tipo='triangle'){const a=actx();if(!a)return;const t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.value=f;
  o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let RUIDO=null;
function toc(t0=0,v=1,f=900){const a=actx();if(!a)return;const t=a.currentTime+t0;if(!RUIDO){const n=Math.floor(a.sampleRate*.05);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,4);}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=RUIDO;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;g.gain.value=.5*v;
  s.connect(bp).connect(g).connect(a.destination);s.start(t);s.onended=()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
const SX={mover(){toc(0,1,850);},comer(){toc(0,1.1,700);toc(.05,.7,1100);},jaque(){toc(0,1,850);nota(988,.03,.18,.03,'sine');},enroque(){toc(0,.9,850);toc(.09,.9,900);},
  gano(){[523,659,784,1047].forEach((f,i)=>nota(f,i*.09,.5,.045));},pierdo(){[392,330,262].forEach((f,i)=>nota(f,i*.14,.5,.04));},tablas(){nota(523,0,.3,.04);nota(523,.15,.4,.035);},
  turno(){nota(784,0,.12,.025,'sine');},msg(){nota(880,0,.1,.02,'sine');},poco(){nota(1320,0,.08,.02,'square');}};
function sfx(k){if(!SND||FAST)return;try{SX[k]&&SX[k]();}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC&&AC.state==='running')AC.suspend().catch(()=>{});});

/* ───────── Estado ───────── */
const SAVE='ajedrez-partida-v1';
const TCS={'1+0':{b:60e3,i:0,n:'Bala 1+0'},'3+2':{b:180e3,i:2e3,n:'Blitz 3+2'},'5+0':{b:300e3,i:0,n:'Blitz 5+0'},'10+0':{b:600e3,i:0,n:'Rápida 10+0'},'15+10':{b:900e3,i:10e3,n:'Rápida 15+10'}};
const DIFN={facil:'Fácil',normal:'Normal',dificil:'Difícil',maestro:'Maestro'};
const DIFE={facil:'🐣',normal:'🦉',dificil:'🦊',maestro:'🐲'};
let CFG={dif:ls.get('ajedrez-dif')||'normal',color:ls.get('ajedrez-color')||'w',tc:ls.get('ajedrez-tc')||'',dias:Number(ls.get('ajedrez-dias'))||3};
if(!DIFN[CFG.dif])CFG.dif='normal';if(CFG.tc&&!TCS[CFG.tc])CFG.tc='';
// G: la partida que se ve. modo: 'compu' | 'vivo' | 'dist'. yo: 'w' | 'b'.
let G=null,SEL=-1,VER=null,FLIPU=false,AYUDA_DESHACER=false;
const otro=c=>c==='w'?'b':'w';
const nuevoId=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function armar(o){
  const g={id:o.id||nuevoId(),modo:o.modo,yo:o.yo||'w',fen0:o.fen0||AJ.START,moves:[],sans:[],st:null,fin:o.fin||null,w:o.w,b:o.b,dif:o.dif||'',
    tc:o.tc||'',clk:o.clk||null,clkT:0,clkOn:false,dist:o.dist||null,creado:o.creado||Date.now(),ayuda:!!o.ayuda,ranked:o.ranked!==undefined?o.ranked:true};
  g.st=AJ.fromFEN(g.fen0);
  for(const u of o.moves||[]){const m=AJ.fromUci(g.st,u);if(!m)break;g.sans.push(AJ.san(g.st,m));AJ.make(g.st,m);g.moves.push(u);}
  if(g.tc&&!g.clk){const T=TCS[g.tc];g.clk={w:T.b,b:T.b};}
  return g;
}
const nombreDe=c=>G?(G[c]&&G[c].n)||'':'';
const turnoDe=()=>G&&G.st.turn;
const enJuego=()=>!!(G&&!G.fin);
function turnoMio(){if(!G||G.fin||VER!==null)return false;if(G.st.turn!==G.yo&&!AUTO)return false;
  if(G.modo==='vivo'&&(!ON||ON.state!=='on'))return false;
  if(G.modo==='dist'&&(DIST.enviando||!G.dist||G.dist.est!=='juega'))return false;
  if(G.modo==='compu'&&PENSANDO)return false;
  return true;}

/* ───────── Reloj ───────── */
function restante(c){if(!G||!G.clk)return 0;let v=G.clk[c];if(G.clkOn&&G.st.turn===c&&!G.fin)v-=Date.now()-G.clkT;return v;}
function relojTxt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);if(ms<10000)return `0:${String(s).padStart(2,'0')}.${Math.floor(ms%1000/100)}`;const m=Math.floor(s/60);return `${m}:${String(s%60).padStart(2,'0')}`;}
let TICK=0,POCO_AVISO=false;
function relojes(){
  clearInterval(TICK);if(!G||!G.clk||G.fin)return;
  TICK=setInterval(()=>{if(!G||!G.clk||G.fin){clearInterval(TICK);return;}
    for(const c of ['w','b']){const el=document.querySelector(`.clk[data-c="${c}"]`);if(!el)continue;const v=restante(c);el.textContent=relojTxt(v);el.classList.toggle('low',v<20000&&G.clkOn&&G.st.turn===c);}
    if(G.clkOn&&G.st.turn===G.yo&&restante(G.yo)<20000&&!POCO_AVISO){POCO_AVISO=true;sfx('poco');}
    const c=G.st.turn;
    if(G.clkOn&&restante(c)<=0){
      // Se le terminó el tiempo. En vivo lo declara el que se quedó sin tiempo (o el otro, si ya pasaron 3 s).
      if(G.modo==='vivo'&&c!==G.yo&&restante(c)>-3000)return;
      G.clk[c]=0;G.clkOn=false;const gana=otro(c);
      const res=AJ.insuficiente(soloColor(G.st,gana))?'½-½':(gana==='w'?'1-0':'0-1');
      terminar({res,motivo:res==='½-½'?'tiempo-material':'tiempo'},true);}
  },100);
}
// ¿Al que le queda tiempo le alcanza el material para dar mate? (si no, es tablas)
function soloColor(st,c){const s=AJ.clone(st);for(let i=0;i<128;i++){if(i&0x88){i+=7;continue;}const p=s.b[i];if(p&&AJ.colorOf(p)!==c&&p.toUpperCase()!=='K')s.b[i]=null;}return s;}
function arrancarReloj(){if(!G||!G.clk||G.fin)return;G.clkT=Date.now();G.clkOn=G.moves.length>0;relojes();}
// Al mover: se descuenta lo que pensó y se suma el incremento.
function cobrarReloj(c){if(!G||!G.clk)return;const T=TCS[G.tc]||{i:0};
  if(G.clkOn){G.clk[c]=Math.max(0,G.clk[c]-(Date.now()-G.clkT))+T.i;}
  G.clkT=Date.now();G.clkOn=true;POCO_AVISO=restante(G.yo)<20000;}

/* ───────── Jugar ───────── */
let PENSANDO=false,COMPU_TOK=0;
// Juega «u» (uci) para el que tiene el turno. origen: 'yo' | 'rival' | 'compu'. Devuelve true si se jugó.
function jugar(u,origen='yo',extra={}){
  if(!G||G.fin)return false;const m=AJ.fromUci(G.st,u);if(!m)return false;
  const mover=G.st.turn,ply=G.moves.length,s=AJ.san(G.st,m);
  if(origen==='rival'&&extra.clk&&G.clk){G.clk={w:extra.clk.w,b:extra.clk.b};G.clkT=Date.now();G.clkOn=true;}
  else cobrarReloj(mover);
  AJ.make(G.st,m);G.moves.push(AJ.uci(m));G.sans.push(s);SEL=-1;VER=null;
  sfx(/#|\+/.test(s)?'jaque':m.fl==='O'||m.fl==='OOO'?'enroque':m.x?'comer':'mover');
  if(m.pr&&mover===G.yo&&window.LOGROS&&!AUTO)try{LOGROS.evento('ajedrez','corona',1,G.id+':'+ply);}catch(_){}
  const e=AJ.estado(G.st);
  render({f:m.f,t:m.t,anim:extra.anim!==false});
  if(e.fin){terminar({res:e.res,motivo:e.motivo},origen!=='rival');}
  else if(G.st.turn===G.yo&&origen!=='yo')sfx('turno');
  guardar();
  if(origen==='yo'){
    if(G.modo==='vivo')netSend({t:'mv',u:AJ.uci(m),ply,clk:G.clk,gid:G.id});
    if(G.modo==='dist')distMover(AJ.uci(m),s,ply);}
  if(G.modo==='compu'&&!G.fin&&(G.st.turn!==G.yo||AUTO))compuJuega();
  return true;
}
// La compu piensa en otro hilo (Web Worker) para no trabar el celular; si no se puede, acá mismo.
let WK=null;
function worker(){
  if(WK!==null)return WK;
  try{const src=MOTOR_SRC+`\nonmessage=e=>{const d=e.data,st=AJ.fromFEN(d.fen);st.keys=d.keys;const m=AJ.jugadaCompu(st,d.nivel);postMessage({tok:d.tok,u:m?AJ.uci(m):null});};`;
    WK=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));}catch(_){WK=false;}
  return WK;
}
function pensar(nivel){
  return new Promise(res=>{const tok=++COMPU_TOK,w=worker(),st=G.st;
    let n=nivel;if(G.clk){const quedan=restante(G.st.turn);if(quedan<15000)n='facil';else if(quedan<45000&&n==='maestro')n='dificil';}
    if(w){const on=e=>{if(e.data.tok!==tok)return;w.removeEventListener('message',on);res(e.data.u);};w.addEventListener('message',on);
      w.postMessage({tok,fen:AJ.toFEN(st),keys:st.keys,nivel:n});}
    else setTimeout(()=>{const m=AJ.jugadaCompu(AJ.clone(st),n);res(m?AJ.uci(m):null);},20);});
}
async function compuJuega(){
  if(!G||G.fin||G.modo!=='compu'||PENSANDO)return;
  const g=G,tok=COMPU_TOK+1;PENSANDO=true;renderStatus();
  const t0=Date.now();
  const nivel=AUTO&&G.st.turn===G.yo?'normal':G.dif;
  const think=setTimeout(()=>{if(PENSANDO&&G===g)$('thinking').hidden=false;},700);
  const u=await pensar(nivel);
  clearTimeout(think);$('thinking').hidden=true;
  const espera=FAST?0:Math.max(0,(G.clk?250:420)-(Date.now()-t0));if(espera)await sleep(espera);
  PENSANDO=false;
  if(G!==g||G.fin||tok>COMPU_TOK+1)return;
  if(u)jugar(u,'compu');else renderStatus();
}
function terminar(fin,yoDeclaro){
  if(!G||G.fin)return;G.fin=fin;G.clkOn=false;clearInterval(TICK);PENSANDO=false;COMPU_TOK++;
  if(G.modo==='vivo'&&yoDeclaro)netSend({t:'fin',fin,gid:G.id});
  if(G.modo==='dist'&&yoDeclaro&&fin.motivo&&!/^(mate|ahogado|material|50|repeticion)$/.test(fin.motivo))distFin(fin);
  guardar();render();setTimeout(mostrarFin,FAST?0:650);
}
function resultadoMio(){if(!G||!G.fin)return null;const r=G.fin.res;if(r==='½-½')return 'tablas';if(r==='—')return 'anulada';return (r==='1-0')===(G.yo==='w')?'gane':'perdi';}
const MOTIVOS={mate:'Jaque mate',ahogado:'Rey ahogado: no tiene jugadas y no está en jaque',material:'Ya nadie puede dar mate',50:'Cincuenta jugadas sin comer ni mover un peón',
  repeticion:'La misma posición se repitió tres veces',tiempo:'Se terminó el tiempo','tiempo-material':'Se terminó el tiempo, pero al otro no le alcanza para dar mate',
  abandono:'Abandonó',acuerdo:'Tablas de común acuerdo',desconexion:'Se desconectó y no volvió','tiempo-dist':'No jugó a tiempo',anulada:'La partida no se jugó'};

/* ───────── Guardar ───────── */
function guardar(){

  const o={id:G.id,modo:G.modo,yo:G.yo,fen0:G.fen0,moves:G.moves,fin:G.fin,w:G.w,b:G.b,dif:G.dif,tc:G.tc,clk:G.clk?{w:restante('w'),b:restante('b')}:null,creado:G.creado,ayuda:G.ayuda,ranked:G.ranked,dist:G.dist,t:Date.now()};

/* ───────── Dibujar ───────── */
const LETRA_ES={K:'R',Q:'D',R:'T',B:'A',N:'C'};
const sanEs=s=>String(s||'').replace(/^[KQRBN]/,c=>LETRA_ES[c]).replace(/=([QRBN])/,(_,c)=>'='+LETRA_ES[c]);
function pzHtml(p,cls=''){const c=AJ.colorOf(p)==='w'?'w':'b';return `<svg class="pz ${c}${cls?' '+cls:''}" viewBox="0 0 45 45" aria-hidden="true"><use href="#pz-${p.toUpperCase()}"/></svg>`;}
const flip=()=>(G?G.yo==='b':false)!==FLIPU;
let VCACHE={k:'',st:null};
function stVista(){if(!G)return AJ.fromFEN(AJ.START);if(VER===null)return G.st;const k=G.id+':'+VER;if(VCACHE.k!==k){VCACHE={k,st:AJ.jugarLista(G.moves.slice(0,VER),G.fen0).st};}return VCACHE.st;}
function ultimaDe(n){if(!G||!n)return null;const s=AJ.fromFEN(G.fen0);let m=null;for(let i=0;i<n;i++){m=AJ.fromUci(s,G.moves[i]);if(!m)return null;if(i<n-1)AJ.make(s,m);}return m;}
let ULT={k:'',m:null};
function ultimaJugada(){const n=VER===null?(G?G.moves.length:0):VER,k=(G?G.id:'')+':'+n+':'+(G?G.moves.length:0);if(ULT.k!==k)ULT={k,m:ultimaDe(n)};return ULT.m;}
function render(anim){renderBoard(anim);renderStrips();renderMoves();renderActs();renderStatus();acomodar();}
function renderBoard(anim){
  const st=stVista(),fl=flip(),last=ultimaJugada();

    const r=fl?row:7-row,f=fl?7-col:col,s=r*16+f,p=st.b[s];
    const cls=['sq'];if((r+f)%2===0)cls.push('d');if(last&&(last.f===s||last.t===s))cls.push('last');if(s===SEL)cls.push('sel');if(s===chk)cls.push('chk');
    const tg=leg.find(m=>m.t===s);
    h+=`<div class="${cls.join(' ')}" data-s="${s}">${col===0?`<i class="co r">${r+1}</i>`:''}${row===7?`<i class="co f">${AJ.FILES[f]}</i>`:''}${p?pzHtml(p,s===DRAG.from&&DRAG.on?'ghost':''):''}${tg?(p||tg.fl==='ep'?'<i class="ring"></i>':'<i class="dot"></i>'):''}</div>`;}
  const b=$('board');b.innerHTML=h;
  if(anim&&anim.anim&&!RM&&!FAST&&anim.f!==undefined){
    const to=b.querySelector(`[data-s="${anim.t}"] .pz`),fromEl=b.querySelector(`[data-s="${anim.f}"]`),toSq=b.querySelector(`[data-s="${anim.t}"]`);
    if(to&&fromEl&&toSq){const a=fromEl.getBoundingClientRect(),z=toSq.getBoundingClientRect();to.style.transform=`translate(${a.left-z.left}px,${a.top-z.top}px)`;
      requestAnimationFrame(()=>{to.classList.add('anim');to.style.transform='';});}}
}
function capturadas(st){// lo que le falta a cada uno respecto de lo que tenía al empezar
  const cuenta={w:{P:0,N:0,B:0,R:0,Q:0},b:{P:0,N:0,B:0,R:0,Q:0}};
  for(let s=0;s<128;s++){if(s&0x88){s+=7;continue;}const p=st.b[s];if(p&&p.toUpperCase()!=='K')cuenta[AJ.colorOf(p)][p.toUpperCase()]++;}
  const ini={P:8,N:2,B:2,R:2,Q:1},V={P:1,N:3,B:3,R:5,Q:9};let mw=0,mb=0;const out={w:[],b:[]};
  for(const P of ['Q','R','B','N','P']){for(let i=cuenta.b[P];i<ini[P];i++)out.w.push(P.toLowerCase());for(let i=cuenta.w[P];i<ini[P];i++)out.b.push(P);mw+=cuenta.w[P]*V[P];mb+=cuenta.b[P]*V[P];}
  return {w:out.w,b:out.b,dif:mw-mb};// out.w: lo que comieron las blancas
}
function stripHtml(c){
  if(!G)return '';const P=G[c]||{n:'',a:'🙂',c:'#3b5866'},st=stVista(),cap=capturadas(st),mine=c===G.yo;
  const comio=cap[c],ventaja=c==='w'?cap.dif:-cap.dif;
  let sub=c==='w'?'Blancas':'Negras';

  if(G.modo==='vivo'&&!mine&&ON)sub+=ON.state==='on'?' · en vivo':' · sin conexión';
  return `${avHtml(P.a,P.c)}<div class="who"><b>${esc(P.n||'')}</b><small>${esc(sub)} <span class="cap">${comio.map(p=>pzHtml(p)).join('')}${ventaja>0?`<em>+${ventaja}</em>`:''}</span></small></div>
    ${G.clk?`<div class="clk${G.clkOn&&G.st.turn===c&&!G.fin?' on':''}" data-c="${c}">${relojTxt(restante(c))}</div>`:''}`;
}
function renderStrips(){

  const arriba=flip()?'w':'b',abajo=otro(arriba);

function renderMoves(){
  const el=$('moves');if(!G||!G.sans.length){el.innerHTML='<span class="vacio">Las jugadas van apareciendo acá.</span>';return;}
  const cur=VER===null?G.sans.length:VER;let h='';
  G.sans.forEach((s,i)=>{if(i%2===0)h+=`<span class="n">${Math.floor(i/2)+1}.</span>`;h+=`<button type="button" class="m${i+1===cur?' cur':''}" data-ply="${i+1}">${esc(sanEs(s))}</button>`;});
  el.innerHTML=h;
  const c=el.querySelector('.m.cur');if(c)c.scrollIntoView({block:'nearest',inline:'center'});else el.scrollLeft=el.scrollWidth;

}
function statusTxt(){

  if(G.fin){const r=resultadoMio();return `<b>${r==='gane'?'Ganaste':r==='perdi'?'Perdiste':r==='anulada'?'Partida anulada':'Tablas'}</b> · ${esc(finTxt(G.fin))}`;}
  const t=G.st.turn,jaque=AJ.inCheck(G.st);
  if(G.modo==='vivo'&&ON&&ON.state!=='on')return 'Se cortó la conexión: el reloj está parado.';

}
function renderStatus(){$('status').innerHTML=statusTxt();renderBanner();}
function renderActs(){
  const el=$('acts');if(!G){el.innerHTML=`<button class="act go" id="a-new">♟️ Partida nueva</button>`;$('a-new').onclick=openNew;return;}

/* ───────── Tocar y arrastrar ───────── */
const DRAG={on:false,from:-1,x:0,y:0,el:null,id:null,moved:false,ya:false};
function sqDesde(x,y){const r=$('board').getBoundingClientRect();if(x<r.left||y<r.top||x>=r.right||y>=r.bottom)return -1;
  const col=Math.floor((x-r.left)/(r.width/8)),row=Math.floor((y-r.top)/(r.height/8)),fl=flip();const rr=fl?row:7-row,f=fl?7-col:col;return rr*16+f;}
function porQueNo(){
  if(!G)return '';if(G.fin)return 'La partida terminó.';
  if(G.modo==='vivo'&&(!ON||ON.state!=='on'))return 'Se cortó la conexión: esperá que vuelva.';
  if(G.modo==='dist'&&DIST.enviando)return 'Un momento: mandando tu jugada…';
  if(G.modo==='compu'&&PENSANDO)return 'Esperá: la compu está pensando.';
  if(G.st.turn!==G.yo)return `Le toca a ${esc(nombreDe(G.st.turn))}.`;return '';}
function abajo(e){
  if(!G||e.button>0)return;actx();
  if(VER!==null){VER=null;SEL=-1;render();return;}
  const s=sqDesde(e.clientX,e.clientY);if(s<0)return;
  const p=G.st.b[s];
  if(!turnoMio()){const w=porQueNo();if(w&&(p||SEL>=0))toast(w);return;}
  if(SEL>=0&&s!==SEL){const L=AJ.legalFrom(G.st,SEL).filter(m=>m.t===s);if(L.length){intentar(SEL,s,L);return;}}
  if(p&&AJ.colorOf(p)===G.st.turn){DRAG.ya=SEL===s;SEL=s;DRAG.on=false;DRAG.moved=false;DRAG.from=s;DRAG.x=e.clientX;DRAG.y=e.clientY;DRAG.id=e.pointerId;
    try{$('board').setPointerCapture(e.pointerId);}catch(_){}renderBoard();return;}
  SEL=-1;renderBoard();
}
function mueve(e){
  if(DRAG.from<0||e.pointerId!==DRAG.id)return;
  if(!DRAG.on){if(Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)<7)return;DRAG.on=true;DRAG.moved=true;
    const d=document.createElement('div');d.className='drag';d.innerHTML=pzHtml(G.st.b[DRAG.from]);document.body.appendChild(d);DRAG.el=d;renderBoard();}
  DRAG.el.style.left=e.clientX+'px';DRAG.el.style.top=e.clientY+'px';
}
function suelta(e){
  if(DRAG.from<0||e.pointerId!==DRAG.id)return;
  const from=DRAG.from,on=DRAG.on;DRAG.from=-1;DRAG.on=false;if(DRAG.el){DRAG.el.remove();DRAG.el=null;}
  if(on){const s=sqDesde(e.clientX,e.clientY),L=s>=0?AJ.legalFrom(G.st,from).filter(m=>m.t===s):[];
    if(L.length){intentar(from,s,L,false);return;}renderBoard();return;}
  if(DRAG.ya){SEL=-1;renderBoard();}// tocar dos veces la misma pieza la suelta
}
function intentar(f,t,L,anim=true){
  if(L.length>1&&L[0].pr){elegirCoronacion(f,t,anim);return;}
  jugar(AJ.uci(L[0]),'yo',{anim});
}
function elegirCoronacion(f,t,anim){
  const b=$('board'),sq=b.querySelector(`[data-s="${t}"]`);if(!sq)return;
  const w=G.st.turn==='w',ops=w?['Q','N','R','B']:['q','n','r','b'];
  const r=sq.getBoundingClientRect(),br=b.getBoundingClientRect(),arriba=r.top-br.top<br.height/2;
  const d=document.createElement('div');d.className='promo';d.style.left=(r.left-br.left)+'px';
  if(arriba)d.style.top=(r.top-br.top)+'px';else d.style.bottom=(br.bottom-r.bottom)+'px';
  const lista=arriba?ops:ops.slice().reverse();
  d.innerHTML=(arriba?'':'<button class="px" data-x>✕</button>')+lista.map(p=>`<button data-p="${p}" aria-label="Coronar ${({q:'dama',n:'caballo',r:'torre',b:'alfil'})[p.toLowerCase()]}">${pzHtml(p)}</button>`).join('')+(arriba?'<button class="px" data-x>✕</button>':'');
  b.appendChild(d);
  const t0=Date.now();// el mismo toque que la abrió no cuenta (si no, elegiría la dama sin querer)
  d.onclick=e=>{const x=e.target.closest('button');if(!x||Date.now()-t0<400)return;e.stopPropagation();d.remove();if(x.dataset.p)jugar(AJ.uci({f,t,pr:x.dataset.p}),'yo',{anim});else{SEL=-1;renderBoard();}};
  d.addEventListener('pointerdown',e=>e.stopPropagation());
}
$('board').addEventListener('pointerdown',abajo);
$('board').addEventListener('pointermove',mueve);
$('board').addEventListener('pointerup',suelta);
$('board').addEventListener('pointercancel',e=>{if(DRAG.el)DRAG.el.remove();DRAG.el=null;DRAG.from=-1;DRAG.on=false;if(G)renderBoard();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('modal').hidden){closeSheet();e.preventDefault();}else if(!$('side').hidden){closeSide();e.preventDefault();}else if(SEL>=0){SEL=-1;renderBoard();}}
  if(!G||!$('modal').hidden||!$('side').hidden)return;
  if(e.key==='ArrowLeft'){const n=VER===null?G.moves.length:VER;VER=Math.max(0,n-1);SEL=-1;render();}
  if(e.key==='ArrowRight'&&VER!==null){VER=VER+1>=G.moves.length?null:VER+1;render();}});

/* ───────── Deshacer, rendirse, tablas ───────── */
function deshacer(){
  if(!G||G.modo!=='compu'||G.fin||!G.moves.length)return;
  COMPU_TOK++;PENSANDO=false;$('thinking').hidden=true;
  // vuelve hasta que te toque a vos (tu jugada y la de la compu)
  const t0=AJ.fromFEN(G.fen0).turn,turnoEn=n=>n%2===0?t0:otro(t0);
  let n=G.moves.length-1;if(n>0&&turnoEn(n)!==G.yo)n--;if(turnoEn(n)!==G.yo)n=Math.max(0,n-1);
  const lista=G.moves.slice(0,Math.max(0,n));G=armar({...G,moves:lista,clk:G.clk,fin:null,ayuda:true});
  if(!AYUDA_DESHACER&&G.ranked){AYUDA_DESHACER=true;toast('Usaste deshacer: esta partida ya no mueve el rango.',3200);}
  arrancarReloj();guardar();render();
  if(G.st.turn!==G.yo)compuJuega();
}
function rendirse(){
  if(!G||G.fin)return;
  sheet('¿Te rendís?',`<p>${G.modo==='compu'?'La partida cuenta como perdida.':`Le das la partida a <b>${esc(nombreDe(otro(G.yo)))}</b>.`}</p><div class="row"><button class="btn" id="rn-no">Seguir jugando</button><button class="btn go" id="rn-si">Rendirme</button></div>`);

}
function ofrecerTablas(){

// XP, rango, regalo para la estancia y leguas (una vez por partida, en cada celular).
function premios(r){
  const out={html:'',rank:''};if(!window.RANGOS||AUTO||!G||r==='anulada')return out;
  const key='aj:'+G.id,hechas=ls.json('ajedrez-xp-hechas',[]);
  const amigo=G.modo!=='compu',dif=G.dif==='maestro'?'dificil':G.dif,kind=amigo?'amigo':'compu-'+dif;
  const ranked=G.ranked&&!G.ayuda&&(amigo||G.dif!=='facil')&&G.moves.length>=2;
  let rk=null,xp=0,pr=null;
  try{if(ranked&&r!=='tablas')rk=RANGOS.apply('ajedrez',{key,win:r==='gane',kind,extra:G.dif==='maestro'?8:0});}catch(_){}
  if(!hechas.includes(key)){xp=30+(r==='gane'?30:r==='tablas'?12:0)+(G.dif==='dificil'?10:G.dif==='maestro'?20:0)+(amigo?15:0)+Math.min(20,Math.floor(G.moves.length/8));
    try{RANGOS.addXp('ajedrez',xp);pr=RANGOS.premio('AjedrezAR',xp,!!rk);}catch(_){}hechas.push(key);ls.set('ajedrez-xp-hechas',JSON.stringify(hechas.slice(-80)));
    try{if(window.LOGROS){const blitz=G.tc&&TCS[G.tc].b<=180000;
      const lr=LOGROS.fin('ajedrez',{gano:r==='gane',modo:amigo?'online':'compu',dif:G.dif,mate:G.fin.motivo==='mate',dist:G.modo==='dist',blitz:!!blitz,negras:G.yo==='b',tablas:r==='tablas',jugadas:Math.ceil(G.moves.length/2)},key);
      out.lg=lr.html;}}catch(_){}}
  let lv=null;try{lv=RANGOS.levelInfo(RANGOS.xp('ajedrez'));}catch(_){}
  const porque=!rk?(r==='tablas'&&ranked?' · Con tablas el rango no se mueve':G.ayuda?' · Usaste deshacer: no mueve el rango':!G.ranked?' · Partida amistosa: no mueve el rango':G.dif==='facil'&&!amigo?' · En Fácil no se mueve el rango ni da leguas':''):'';
  out.html=(rk?RANGOS.resultHtml(rk):'')+(lv?`<p class="cap2">AjedrezAR nivel ${lv.lv}${xp?` · +${xp} XP`:''}${pr?` · 🎁 +${fmt(pr.pesos)} 🪙 para tu estancia${pr.leguas?` · 🚩 +${pr.leguas} leguas en La Gran Pampa`:''}`:''}${porque}</p>`:'')+(out.lg||'');
  out.rank=rk&&rk.after?rk.after.label:'';return out;
}

/* ───────── En vivo con un amigo ─────────
   Como en TrucAR: la invitación viaja por la planilla (sin códigos de sala) y la partida va directo entre los dos
   celulares (WebRTC, con servidores públicos STUN/TURN de ayuda). Los dos conocen las reglas y validan cada jugada;
   cada uno lleva su propio reloj y se lo pasa al otro con cada jugada.
   Si se corta (te subiste al colectivo, se cayó el wifi): el reloj se para, el que invitó vuelve a invitar solo y
   el otro acepta solo. Si no vuelve, se puede seguir como partida distendida. */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

function onMsg(m){
  if(m.t==='hola'){if(m.yo){ON.peer.avatar=m.yo.avatar||ON.peer.avatar;ON.peer.color=m.yo.color||ON.peer.color;}return;}
  if(m.t==='nueva'){

  if(m.t==='sync'){recibirSync(m);return;}

    return;}
  if(m.t==='otra'){VIVO_T.otraEl=true;if(VIVO_T.otraYo)revanchaArranca();else{sfx('msg');hideOver();renderBanner();toast(`🔁 ${esc(ON.peer.usuario)} quiere la revancha`);}return;}
  if(m.t==='otra-no'){VIVO_T.otraEl=false;renderBanner();return;}
  if(m.t==='emo'){mostrarEmo(otro(G.yo),m.e);sfx('msg');return;}
  if(m.t==='bye'){onLost('salió del juego');}
}
// Al volver la conexión cada uno manda lo que tiene: se queda la lista de jugadas más larga.
function recibirSync(m){
  const yoHost=ON&&ON.role==='host';
  if(!G||G.modo!=='vivo'||G.id!==m.gid){
    const yo=yoHost?m.hostColor:otro(m.hostColor);
    G=armar({id:m.gid,modo:'vivo',yo,tc:m.tc||'',w:m.w,b:m.b,moves:m.moves,clk:m.clk,fin:m.fin});ON.re=G.id;}
  else{
    const mia=G.moves,suya=m.moves||[],prefijo=(a,b)=>a.every((u,i)=>b[i]===u);
    if(suya.length>mia.length&&prefijo(mia,suya)){G=armar({...G,moves:suya,clk:m.clk||G.clk,fin:m.fin||G.fin});}
    else if(mia.length>suya.length&&prefijo(suya,mia)){netSend(datosSync());}
    else if(m.clk&&G.clk&&mia.length===suya.length){G.clk={w:Math.min(m.clk.w,restante('w')),b:Math.min(m.clk.b,restante('b'))};}
    if(m.fin&&!G.fin)G.fin=m.fin;}
  reanudar();if(G.fin)setTimeout(mostrarFin,400);
}
function onLost(why='se desconectó'){
  if(!ON)return;const o=ON;
  if(['preparing','waiting','connecting'].includes(o.state)&&o.state!=='cortado'){if(o.re&&G&&G.modo==='vivo'&&!G.fin){o.state='cortado';return;}failOnline('No se pudieron conectar.');return;}
  if(o.state==='cortado')return;
  try{o.pc&&o.pc.close();}catch(_){}o.ch=null;
  if(G&&G.modo==='vivo'&&!G.fin){
    if(G.clk){G.clk={w:restante('w'),b:restante('b')};G.clkOn=false;}
    o.state='cortado';VIVO_T.cortadoT=Date.now();guardar();render();renderOnline();
    toast(`📡 ${esc(o.peer.usuario)} ${esc(why)}. El reloj se para mientras esperamos que vuelva.`,3500);
    clearInterval(VIVO_T.iv);VIVO_T.iv=setInterval(()=>{if(!ON||ON.state!=='cortado'){clearInterval(VIVO_T.iv);return;}renderBanner();if(ON.role==='guest')pollInbox(true);},1500);
    if(o.role==='host')reconectarHost();
    return;}
  ON=null;renderOnline();if(G&&G.modo==='vivo')render();
  toast(`${esc(o.peer.usuario)} ${esc(why)}.`);
}
// El que invitó vuelve a invitar (en silencio) hasta que el otro vuelva o se deje de esperar.
async function reconectarHost(){
  const a=acct();if(!a||!ON||ON.role!=='host')return;const me0=ON,gid=G.id,n=++VIVO_T.intento;
  while(ON===me0&&ON.state==='cortado'&&n===VIVO_T.intento&&G&&G.id===gid&&!G.fin){
    try{
      const pc=new RTCPeerConnection({iceServers:await iceServers()});
      if(ON!==me0||ON.state!=='cortado'){pc.close();return;}
      try{ON.pc&&ON.pc.close();}catch(_){}ON.pc=pc;attach(pc.createDataChannel('ajedrez',{ordered:true}));
      pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&ON===me0&&ON.pc===pc&&ON.state==='on')onLost();};
      await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(ON!==me0||ON.state!=='cortado')return;
      const j=await lbCall(conCuenta({accion:'invitar',para:ON.peer.usuario,oferta:'AJEDREZ:'+JSON.stringify({sdp:pc.localDescription.sdp,re:gid,tc:G.tc})}));
      ON.id=j.id;const t0=Date.now();
      while(ON===me0&&ON.state==='cortado'&&Date.now()-t0<120000){
        await sleep(2000);if(ON!==me0||ON.state!=='cortado')return;
        let r;try{r=await lbCall(conCuenta({accion:'buzon',id:ON.id}));}catch(_){continue;}
        if(r.estado==='aceptada'&&r.respuesta){await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});
          const t1=Date.now();while(ON===me0&&ON.state==='cortado'&&Date.now()-t1<30000)await sleep(500);break;}
        if(['rechazada','cancelada','vencida'].includes(r.estado))break;}
    }catch(_){await sleep(3000);}
    if(ON===me0&&ON.state==='cortado')await sleep(1500);
  }
}

async function distReclamar(op){
  if(!G)return;const id=G.id;
  try{const j=await lbCall(conCuenta({accion:'ajReclamar',id,op}));if(!G||G.id!==id)return;const n=desdePlanilla(j.partida);G.dist=n.dist;
    if(n.fin&&!G.fin){G.fin=n.fin;render();setTimeout(mostrarFin,300);}else{render();toast('Le diste más tiempo.');}}
  catch(e){toast(esc(e.message));}
}
function distBanner(){
  const d=G&&G.dist;if(!d||G.fin)return '';const riv=esc(nombreDe(otro(G.yo))),me=miUsuario(),mio=G.st.turn===G.yo;
  if(d.tablas&&d.tablas.toLowerCase()!==me)return `🤝 <b>${riv}</b> te ofrece tablas <button data-bn="d-tablas-si" class="go">Aceptar</button><button data-bn="d-tablas-no">Seguir jugando</button>`;
  let h='';
  if(mio)h=`📮 Te toca${d.dias&&d.limite?` · tenés hasta ${fechaCorta(d.limite)}`:''}`;
  else{h=`📮 Le toca a <b>${riv}</b> · ${d.tUlt?`jugaste ${hace(d.tUlt)}`:''}`;
    if(d.vencida)h+=` · se le pasó el tiempo <button data-bn="d-ganar" class="go">Ganar por tiempo</button><button data-bn="d-esperar">Darle ${d.dias} ${d.dias===1?'día':'días'} más</button>`;}
  if(d.tablas&&d.tablas.toLowerCase()===me)h+=' · le ofreciste tablas';
  return h;
}
function distAccion(a){
  if(a==='tablas-si')distTablas('aceptar');else if(a==='tablas-no')distTablas('rechazar');
  else if(a==='ganar')distReclamar('ganar');else if(a==='esperar')distReclamar('esperar');else if(a==='lista')openPartidas();
}
async function nuevaDist(u){
  if(!acct()){pedirCuenta();return;}
  sheet('Distendida',`<p><span class="busy"></span>Armando la partida con ${esc(u.usuario)}…</p>`);
  try{const j=await lbCall(conCuenta({accion:'ajNueva',para:u.usuario,color:colorElegido(),dias:CFG.dias}));
    await abrirDist(j.id);toast(`Listo. A ${esc(u.usuario)} le llega al chat.${G&&G.st.turn===G.yo?' Arrancás vos.':''}`,3000);}
  catch(e){sheet('Distendida',`<p>${esc(e.message)}</p><button class="btn" id="nd-x">Volver</button>`);$('nd-x').onclick=()=>openNew('dist');}
}

/* ───────── Arranque ───────── */
function aceptando(){try{return !!sessionStorage.getItem('ajedrez-accept');}catch(_){return false;}}
function esperarInvitacion(){
  sheet('Partida con un amigo','<p><span class="busy"></span>Buscando la invitación de tu amigo…</p>');
  let n=0;const t=setInterval(()=>{
    if(ON||!aceptando()){clearInterval(t);return;}
    if(++n>12){clearInterval(t);try{sessionStorage.removeItem('ajedrez-accept');}catch(_){}
      sheet('Partida con un amigo','<p>No encontramos la invitación: puede que tu amigo ya no esté esperando o que la haya cancelado.</p><p>Pedile que te invite de nuevo, o invitalo vos.</p><button class="btn go" id="ia-inv">Invitar a alguien</button><button class="btn" id="ia-new">Jugar con la compu</button>');
      $('ia-inv').onclick=()=>elegirAmigo('vivo');$('ia-new').onclick=()=>openNew('compu');return;}
    pollInbox(true);
  },2500);
  setTimeout(()=>pollInbox(true),300);
}
// Si se cerró la página en medio de una partida en vivo (hace menos de 10 minutos), se vuelve a esperar al otro.
function retomarVivo(){
  const v=ls.json(VIVO,null);if(!v||!v.g||v.g.fin||!v.on||!acct()||Date.now()-(v.t||0)>600000)return false;
  G=armar(v.g);ON={role:v.on.role,peer:v.on.peer,state:'cortado',re:G.id};VIVO_T.cortadoT=Date.now();
  render();renderOnline();toast(`Volviendo a la partida con ${esc(ON.peer.usuario)}…`,3000);
  clearInterval(VIVO_T.iv);VIVO_T.iv=setInterval(()=>{if(!ON||ON.state!=='cortado'){clearInterval(VIVO_T.iv);return;}renderBanner();if(ON.role==='guest')pollInbox(true);},1500);
  if(ON.role==='host')reconectarHost();
  return true;
}
(function start(){
  try{window.LOGROS&&LOGROS.aplicar('ajedrez');}catch(_){}
  if(window.RANGOS)RANGOS.css();
  acomodar();
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;const d=(location.hash.match(/dif=(\w+)/)||[])[1];if(d&&DIFN[d])CFG.dif=d;
    const tc=(location.hash.match(/tc=([\d+]+)/)||[])[1];CFG.tc=tc&&TCS[tc]?tc:'';nuevaCompu({yo:'w'});return;}
  ls.set('bloques-ultimo-juego','ajedrez');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  const pm=/^#partida=([\w-]+)/.exec(hash),im=/^#invitar=([^&]+)/.exec(hash);
  if(pm){abrirDist(pm[1]);}
  else if(!aceptando()&&!retomarVivo()){
    const sv=ls.json(SAVE,null);
    if(sv&&sv.moves&&!sv.fin)seguirCompu(sv);
    else{render();if(!im&&!/^#(amigos|mesa|nueva|partidas)/.test(hash)){if(!ls.get('ajedrez-ayuda')){ls.set('ajedrez-ayuda','1');openHelp();}else mesaSinPartida();}}
  }
  if(aceptando())esperarInvitacion();
  if(/^#(amigos|mesa)/.test(hash))setTimeout(()=>openNew('vivo'),200);
  if(/^#partidas/.test(hash))setTimeout(openPartidas,200);
  if(im&&acct()){let u='';try{u=decodeURIComponent(im[1]);}catch(_){u=im[1];}setTimeout(()=>invitarA(u),300);}
  if(window.CHAT)CHAT.init({busy:()=>!!(G&&!G.fin&&G.modo!=='dist'&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'ajedrez',inbox:()=>pollInbox(true),
    invite:(g,u)=>{if(g==='ajedrez'){invitarA(u);return;}if(g==='estancia'){location.href='estancia.html#malon';return;}
      location.href=({poblar:'poblar.html',truco:'truco.html',uno:'uno.html'}[g]||'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='ajedrez'){if(c.aj)abrirDist(c.aj);else openNew();return;}
      location.href=c.j==='estancia'?'estancia.html#malon':({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',pampa:'pampa.html',sudoku:'sudoku.html',solitario:'solitario.html'}[c.j]||'./');}});
  setInterval(()=>pollInbox(),4000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){setTimeout(()=>pollInbox(true),500);if(G&&G.modo==='dist'&&!G.fin)recargarDist(true);}});
  setTimeout(()=>pollInbox(true),1500);
  if(acct())setTimeout(()=>distLista(),2500);
  setInterval(()=>{if(acct()&&!document.hidden)distLista();},90000);
})();
window.AJEDREZ={AJ,get G(){return G;},get ON(){return ON;},get CFG(){return CFG;},get DIST(){return DIST;},get PENSANDO(){return PENSANDO;},
  jugar,nuevaCompu,openNew,openHelp,openPartidas,abrirDist,elegirAmigo,inviteFriend,acceptInvite,pollInbox,netLeave,netSend,onLost,render,terminar,deshacer,
  restante,turnoMio,recargarDist,pasarADist,invitarA,nuevaDist,distLista,openMenu,mostrarFin,
  set FAST(v){FAST=v;},set AUTO(v){AUTO=v;},set FLIPU(v){FLIPU=v;}};

</script>
