<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>EstanciAR</title>
<style>
/* EstanciAR: tonos de campo. La maqueta es lo que se luce; los controles quedan sobrios (cuero oscuro, bronce y papel). */
:root{--bg:#17140f;--line:#3b3226;--ink:#efe6d2;--aqua:#7ce9e5;--gold:#f6c453;
  --bark:#1e1a14;--bark2:#2a241c;--brass:#c4a265;--brass2:#8a6a3e;--parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;
  --brown:#2a2118;--soft:#7d6d58;--olive:#5f7a3a;--olive2:#4a6030;--clay:#a3482f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--brown);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
/* Barra de arriba: la misma de todos los juegos */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);flex:none;border-bottom:1px solid #2b251c}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;display:flex;align-items:center}.brand span{color:#d9b866}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#d9c79e;border:1px solid #6b5a3e;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#211c15;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0}
.games-btn i{width:7px;height:7px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
/* Campo */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#23271a}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* Marcadores de arriba (nivel, plata, trofeos) */
.hud{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 8px;border-radius:11px;background:rgba(30,26,20,.86);border:1px solid rgba(196,162,101,.32);box-shadow:0 4px 14px rgba(0,0,0,.28);color:var(--ink);font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.pill .ic svg{width:20px;height:20px;display:block}
.pill.lv{gap:8px}.pill.lv .ic{width:auto;height:auto;font:700 12px/1 var(--serif);color:var(--brass);letter-spacing:.02em}
.pill.lv b{font:700 16px/1 var(--serif);color:var(--ink)}
.pill .xp{width:52px;height:4px;border-radius:2px;background:rgba(239,230,210,.16);overflow:hidden}.pill .xp i{display:block;height:100%;background:var(--brass)}
.pill.sm{height:30px;font-size:13px;padding:0 10px}
.hud .sp{flex:1}
.hint{position:absolute;left:50%;top:52px;transform:translateX(-50%);max-width:92%;background:rgba(30,26,20,.9);color:var(--ink);border:1px solid rgba(196,162,101,.28);border-radius:10px;padding:7px 13px;font-weight:600;text-align:center;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);font-size:13.5px}
.hint:empty{display:none}
/* Botonera de abajo: una bandeja de cuero con cuatro herramientas */
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px;padding:5px;border-radius:16px;background:rgba(30,26,20,.9);border:1px solid rgba(196,162,101,.3);box-shadow:0 10px 26px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tool{width:74px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;border-radius:11px;padding:0;position:relative;color:var(--ink)}
.tool .b{width:24px;height:24px;display:grid;place-items:center}
.tool .b svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool small{font-size:11.5px;font-weight:650;letter-spacing:.01em;color:#d9cdb2}
.tool:active,.tool:focus-visible{background:rgba(196,162,101,.16)}
.tool .badge{position:absolute;top:5px;right:14px;min-width:17px;height:17px;border-radius:9px;background:var(--clay);color:#fff3e2;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tool .badge:empty{display:none}
.harvest-all{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));pointer-events:auto;height:40px;padding:0 18px;border-radius:12px;background:linear-gradient(#d4b674,#b89550);border:1px solid #7a5d33;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,245,215,.45);font-weight:750;font-size:14.5px;color:#2a1f12;font-variant-numeric:tabular-nums}
.harvest-all[hidden]{display:none}
/* Tarjeta de lo que tocaste */
.pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 16px));background:var(--parch);border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:up .2s ease-out}
.pop[hidden]{display:none}
@keyframes up{from{transform:translate(-50%,10px);opacity:.3}}
.pop h3{margin:0;font:700 18px/1.2 var(--serif);display:flex;align-items:baseline;gap:8px;padding-right:36px}.pop h3 small{font:600 12px system-ui,sans-serif;color:var(--soft)}
.pop p{margin:0;color:#4d4031;font-size:14px}
.pop .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:9px;border:0;background:var(--parch2);font-size:14px;color:var(--brown)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:44px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.gold{background:linear-gradient(#d4b674,#b89550);border-color:#7a5d33;color:#2a1f12}
.btn.red{background:var(--clay);border-color:#7e3420;color:#fff3e2}
.btn:disabled{opacity:.45}
.bar{height:6px;border-radius:3px;background:#ded1b4;overflow:hidden}.bar i{display:block;height:100%;background:var(--olive)}
/* Hojas que suben desde abajo */
.modal{position:fixed;inset:0;z-index:20;background:rgba(14,11,7,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--parch);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1;color:var(--brown)}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 16px 8px;padding:3px;border-radius:11px;background:var(--parch2);scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:8px;border:0;background:none;font-weight:700;color:#6b5a44}
.tabs button.on{background:#fbf7ee;color:var(--brown);box-shadow:0 1px 3px rgba(60,40,20,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:stretch;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;padding:0;overflow:hidden;text-align:left}
.card canvas{display:block;width:100%;height:96px;background:radial-gradient(ellipse at 50% 78%,#7f9152 0%,#66783f 45%,#4c5832 100%)}
.card .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card b{font:700 15px/1.2 var(--serif)}.card small{color:var(--soft);font-size:12px;font-weight:500}
.card .price{font-weight:750;font-size:13.5px;color:#7a5a24;font-variant-numeric:tabular-nums}
.card:disabled{opacity:.55;filter:grayscale(.5)}
.card.lock .price{color:var(--soft)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;text-align:left;width:100%}
.item .ic{font-size:26px;width:40px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font:700 15.5px/1.25 var(--serif)}.item .tx small{display:block;color:var(--soft);font-size:12.5px;font-weight:500}
.item:disabled{opacity:.5}
.item .btn{flex:none;min-height:40px}
.big{font-size:40px;text-align:center;line-height:1.1}
.co{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-left:.22em;border-radius:50%;background:radial-gradient(circle at 36% 34%,#f0dba2 0 18%,#c9a24a 48%,#94702f 100%);box-shadow:inset 0 0 0 1px rgba(90,64,26,.75)}
.center{text-align:center}
.note{font-size:12.5px;color:var(--soft)}
/* Malón */
.stars{font-size:16px;letter-spacing:1px}.stars i{font-style:normal;opacity:.25}.stars i.on{opacity:1}
.troops{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;padding:5px;border-radius:16px;background:rgba(30,26,20,.9);border:1px solid rgba(196,162,101,.3);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.troop{width:66px;height:62px;border-radius:11px;background:none;border:1px solid transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;padding:0}
.troop span{font-size:24px;line-height:1.1;display:grid;place-items:center;min-height:38px}.troop span svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.uic{display:block}.troop small{font-size:11.5px;color:#d9cdb2;font-variant-numeric:tabular-nums}
.troop.sel{border-color:rgba(196,162,101,.7);background:rgba(196,162,101,.16)}
.troop:disabled{opacity:.4}
.troop.end{background:var(--clay);color:#fff3e2}
.troop .x2{font:800 18px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.02em}.troop.spd.sel .x2{color:#f2c14e}
@media (max-width:380px){.troop{width:56px}.troops{gap:2px;padding:4px}}
/* Menú lateral */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(10,8,5,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#1c1813;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#2a241c;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#231e17;font-weight:650;text-decoration:none;color:var(--ink);font-size:15px}
.side .note{color:#a39276}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(30,26,20,.95);color:var(--ink);border:1px solid rgba(196,162,101,.3);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}
.fly{position:fixed;z-index:25;pointer-events:none;width:18px;height:18px;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s;will-change:transform}
.fly svg{width:18px;height:18px;display:block}
.placebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;width:min(420px,calc(100% - 16px))}
.placebar[hidden]{display:none}
.placebar .btn{flex:1;min-height:50px;font-size:15.5px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
@media (orientation:landscape) and (max-height:520px){
  .tools{left:auto;right:max(8px,env(safe-area-inset-right));transform:none;top:52px;bottom:auto;flex-direction:column;gap:2px;padding:4px}
  .tool{width:62px;height:50px}.tool small{font-size:10.5px}
  .harvest-all{bottom:12px}.pop{bottom:10px}.troops{left:auto;right:8px;transform:none;top:48px;bottom:auto;flex-direction:column;gap:4px}.troop{width:60px;height:52px}.troop span{font-size:20px}
  .placebar{bottom:8px}.placebar .btn{min-height:44px}
  .hint{top:50px}.toast{bottom:auto;top:100px}}
@media (min-width:760px){.sheet{border-radius:18px;border-bottom:1px solid var(--rule);margin-bottom:24px}.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.sheet,.pop,.side-panel,.toast{animation:none}.fly{transition:none}}

/* el botón de juegos dice «Juegos» (un amigo no lo reconocía) */
.games-btn{grid-template-columns:repeat(2,6px)!important;grid-template-rows:6px 6px auto!important;gap:2px!important;min-width:44px;align-content:center}.games-btn i{width:6px!important;height:6px!important}.games-btn b{grid-column:1/-1;font:800 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:#d5e6ea;margin-top:2px;text-align:center;white-space:nowrap}
</style>
<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',truco:'TrucAR',uno:'UnoAR'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
// ranked: sólo las partidas ranked (las que mueven el rango) dan leguas para La Gran Pampa (pedido del usuario, v56).
function premio(de,xp,ranked){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  const p={de,trigo:0,pesos:Math.min(1000,Math.round(n*2)),t:Date.now()};

const ORDEN=['truco','uno','poblar','estancia','pampa'];
let OCULTOS=[];

/* ── Datos guardados ── */
function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}
function save(o){o.at=Date.now();ls.set(KEY,JSON.stringify(o));}
const cnt=(o,j)=>(o.c[j]=o.c[j]||{});
const tiene=(o,j,id)=>!!(o.g[j]&&o.g[j][id]);

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;}
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&R.GAMES[j])R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);return out;}
  for(const [k,n] of finEventos(j,d))sumar(o,j,k,n);
  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  return out;
}

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
function siguiente(){const a=COLA.shift();if(!a){MOSTRANDO=false;return;}MOSTRANDO=true;css();
  if(!document.body){MOSTRANDO=false;return;}
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  setTimeout(()=>{el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);},3400);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
function aplicar(j){const G=D[j];if(!G)return;css();
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;
  const retH=rs.length?`<section class="lg-sec"><h3>Retos de la semana</h3><p class="lg-lead">Los mismos para todos. Se renuevan el lunes: faltan ${diasHastaLunes()}.</p>
    ${rs.map(r=>`<div class="lg-reto${r.hecho?' ok':''}"><div class="lg-rt"><b>${esc(r.txt)}</b><small>${r.hecho?'✅ Cumplido':`${fmt(r.va)} de ${fmt(r.n)}`} · +${r.xp} XP${window.RANGOS&&!OCULTOS.includes('estancia')?` y ${fmt(Math.min(1000,r.xp*2))} 🪙`:''}</small></div><div class="lg-bar"><i style="width:${(r.va/r.n*100).toFixed(1)}%"></i></div></div>`).join('')}</section>`:'';
  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);
    return `<div class="lg-l${on?' on':''}"><i>${L.e}</i><div><b>${esc(L.n)}</b><small>${esc(L.d)}</small>${!on&&m>1?`<div class="lg-bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><small>${fmt(v)} de ${fmt(m)}</small>`:''}</div>${on?'<em>✓</em>':''}</div>`;}).join('')}</div></section>`;
  const tipos=Object.entries(G.ap);
  const apH=tipos.length?`<section class="lg-sec"><h3>Apariencias</h3><p class="lg-lead">Se destraban subiendo de nivel en ${esc(G.n)} (vas por el ${nivel(j)}) o con logros.</p>
    ${tipos.map(([tipo,A])=>{const cur=apariencia(j,tipo);return `<h4>${esc(A.n)}</h4><div class="lg-aps">${A.op.map(op=>{const ok=libre(j,op,o),req=op.logro?`Logro: ${(G.logros.find(L=>L.id===op.logro)||{}).n||''}`:op.lv?`Nivel ${op.lv}`:'';
      return `<button type="button" class="lg-ap${cur===op.id?' on':''}" data-lg-tipo="${tipo}" data-lg-id="${op.id}" ${ok?'':'disabled'} aria-pressed="${cur===op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${cur===op.id?'Puesta':ok?'Elegir':'🔒 '+esc(req)}</small></button>`;}).join('')}</div>`;}).join('')}</section>`:'';
  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};
  const x=root.querySelector('#lg-x');if(x)x.onclick=()=>{op.cerrar?op.cerrar():(root.closest('.side')||{}).hidden=true;};
  root.querySelectorAll('[data-lg-tipo]').forEach(el=>el.onclick=()=>{if(elegir(j,el.dataset.lgTipo,el.dataset.lgId)){const top=root.scrollTop;abrir(j,op);root.scrollTop=top;}});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

function contar(){const o=load(),out={};for(const j of ORDEN){if(OCULTOS.includes(j))continue;out[j]={tiene:D[j].logros.filter(L=>tiene(o,j,L.id)).length,total:D[j].logros.length};}return out;}

    return `<div class="lg-rr"><i>${D[j].e}</i><span><b>${esc(D[j].n)}</b><small>${x.tiene} de ${x.total} logros${rs.length?` · retos de la semana ${h}/${rs.length}`:''}</small></span><span class="lg-bar"><i style="width:${(x.tiene/x.total*100).toFixed(1)}%"></i></span></div>`;}).join('')}</div>`;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() ── */
function exportData(){const o=load();return {g:o.g,c:o.c,s:{w:o.s.w,c:o.s.c,h:o.s.h},ap:o.ap,at:o.at||0};}
// Une lo de la planilla con lo de acá. Devuelve {ch: cambió algo acá, falta: acá hay algo que la planilla no tiene}.
function importData(d){
  const res={ch:false,falta:false};if(!d||typeof d!=='object')return res;const o=load();
  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}
  for(const [j,C] of Object.entries(o.c))for(const [k,v] of Object.entries(C))if(v>((d.c&&d.c[j]&&d.c[j][k])||0))res.falta=true;
  const s=d.s;if(s&&s.w===o.s.w){for(const [j,C] of Object.entries(s.c||{})){if(!D[j])continue;const sc=(o.s.c[j]=o.s.c[j]||{});for(const [k,v] of Object.entries(C||{}))if(Number.isFinite(v)&&v>(sc[k]||0)){sc[k]=v;res.ch=true;}}
    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
  // Los retos que la planilla ya tenía cumplidos se marcan acá sin volver a dar el premio.
  if(res.ch)save(o);
  return res;
}
function ocultar(L){OCULTOS=Array.isArray(L)?L.slice():[];}

<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no suena ni aparece nada: sólo sube el numerito del botón 💬. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte).slice(-3000);}
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
function unreadFrom(n){const r=S.read[lc(n)]||0;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id))continue;S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>(r[lc(m.de)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===lc(m.de)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||m.tmp)continue;
    if(typeof m.p==='string'){try{S.plain[m.id]=JSON.parse(m.p);}catch(_){S.plain[m.id]=null;}continue;}
    if(S.key&&cs)S.plain[m.id]=await unseal(other(m),m.cont).catch(()=>null);}
}
// Mensajes viejos (v5–v11) que este dispositivo no puede abrir sin el PIN.
const viejoCerrado=m=>m.tipo!=='zumbido'&&!m.tmp&&typeof m.p!=='string'&&!S.plain[m.id];
// Desde la planilla v12 el chat anda con la cuenta: el texto se manda y la planilla lo guarda cerrado.
function sinV12(e){const t=String(e&&e.message||e);return S.ver&&S.ver<12&&/vacío|cifrado|inválido/i.test(t)?'Para escribir sin PIN hay que actualizar la planilla a la versión 12 (pegar el Codigo.gs nuevo y publicar una Nueva versión).':t;}

/* ── Avisos ── */
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'💬 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;
  if(ST.m==='dnd'){S.pending.length=0;return;}
  const list=S.pending.splice(0),names=[...new Set(list.map(m=>m.de))];
  if(list.some(m=>m.tipo==='zumbido'))beep('zumbido');else beep('msg');
  if(list.length===1){toast(list[0].de,preview(list[0]));return;}
  toast(names.length===1?names[0]:names.slice(0,3).join(', '),`Te ${list.length===1?'escribió':'escribieron'}: ${list.length} mensajes nuevos.`,names.length===1?names[0]:null);
}
function shake(){const el=S.open?$('.cx-panel'):document.body;if(!el)return;el.classList.remove('cx-shake');void el.offsetWidth;el.classList.add('cx-shake');setTimeout(()=>el.classList.remove('cx-shake'),800);}
let baseTitle=document.title,titleTimer=0;
function flashTitle(){if(titleTimer)return;baseTitle=document.title.replace(/^\(\d+\) /,'');let on=false;titleTimer=setInterval(()=>{const n=unreadTotal();if(!document.hidden||!n){clearInterval(titleTimer);titleTimer=0;document.title=baseTitle;return;}on=!on;document.title=on?`(${n}) 💬 Mensaje nuevo`:baseTitle;},1200);}
function sysNotify(m){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const u=userOf(m.de),n=new Notification(`${u?u.avatar+' ':''}${m.de}`,{body:preview(m),tag:'bloques-chat-'+lc(m.de),silent:false});
    n.onclick=()=>{window.focus();open(m.de);n.close();};}catch(_){}
}
function toast(who,txt,openWho=who){
  const box=$('.cx-toasts');if(!box)return;const u=userOf(who);
  const el=document.createElement('button');el.type='button';el.className='cx-toast';
  el.innerHTML=`${u?avatar(u):'<span class="cx-av">💬</span>'}<span><b>${esc(who)}</b><small>${esc(txt).slice(0,140)}</small></span>`;
  el.onclick=()=>{el.remove();open(openWho||undefined);};
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},6500);
}
function badges(){
  const n=unreadTotal();
  document.querySelectorAll('[data-chat-btn]').forEach(b=>{let s=b.querySelector('.cx-badge');if(!n){if(s)s.remove();return;}if(!s){s=document.createElement('span');s.className='cx-badge';b.appendChild(s);}s.textContent=n>9?'9+':String(n);});
  if(!document.hidden)document.title=baseTitle;
}

/* ── Vista ── */
const avatar=(u,big)=>`<span class="cx-av${big?' big':''}" style="--avc:${/^#[0-9a-fA-F]{6}$/.test(u&&u.color||'')?u.color:'#7ce9e5'}">${esc(u&&u.avatar||'🙂')}</span>`;
const hora=t=>{const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});if(d.toDateString()===n.toDateString())return hm;const y=new Date(n-864e5);if(d.toDateString()===y.toDateString())return 'ayer '+hm;return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});};

function convList(){

  const users=S.users.filter(u=>lc(u.usuario)!==me);
  for(const k of Object.keys(by))if(!users.some(u=>lc(u.usuario)===k)){const m=by[k];users.push({usuario:other(m),avatar:'🙂',color:'#93a1b6',enLinea:false});}
  return users.map(u=>({u,m:by[lc(u.usuario)]||null})).sort((a,b)=>((b.m?b.m.t:0)-(a.m?a.m.t:0))||((b.u.enLinea?1:0)-(a.u.enLinea?1:0))||a.u.usuario.localeCompare(b.u.usuario));
}

function markRead(n){const t=lastFrom(n);if(t>(S.read[lc(n)]||0)){S.read[lc(n)]=t;saveRead();badges();}}
async function onClick(e){
  const b=e.target.closest('[data-a],[data-con]');if(!b)return;
  if(b.dataset.con&&!b.dataset.a){S.con=b.dataset.con;S.view='conv';S.pickFor=null;S.invFor=null;S.err='';render();poll();return;}
  const a=b.dataset.a;
  if(a==='cerrar')close();
  else if(a==='volver'){if(S.view==='perfil'&&S.con){S.view='conv';}else{S.view='list';S.con=null;}S.pickFor=null;S.invFor=null;S.card=null;render();}
  else if(a==='modo'){ST.m=b.dataset.m;ls.set('bloques-chat-modo',ST.m);modeBtns();poll();}
  else if(a==='perfil')openProfile(b.dataset.u);
  else if(a==='invitar'){S.invFor=b.dataset.u;$('.cx-panel').dataset.sig='';render();}
  else if(a==='invx'){S.invFor=null;$('.cx-panel').dataset.sig='';render();}
  else if(a==='inv'){const who=S.invFor,g=b.dataset.g;S.invFor=null;close();try{H.invite&&H.invite(g,who);}catch(_){}}
  else if(a==='sharecon')shareTo(b.dataset.u);
  else if(a==='cardplay'){const o=S.plain[b.dataset.id];if(o&&o.card&&H.play){close();try{H.play(o.card);}catch(_){}}}
  else if(a==='cuenta'){close();H.account();}
  else if(a==='activar')activate();
  else if(a==='verpin'){S.pinAsk=true;$('.cx-panel').dataset.sig='';render();setTimeout(()=>$('#cx-pin')?.focus(),50);}
  else if(a==='pinx'){S.pinAsk=false;S.err='';$('.cx-panel').dataset.sig='';render();}
  else if(a==='enviar')send();
  else if(a==='zumbido')buzz();
  else if(a==='permiso'){try{await Notification.requestPermission();}catch(_){}render();}
  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);
}
// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}
async function send(){
  const ta=$('#cx-in');if(!ta||!S.con)return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const tmp={id:'tmp'+Date.now(),de:S.me,para:S.con,tipo:'msg',cont:'',ref:'',t:Date.now(),tmp:true};S.plain[tmp.id]={x:txt};S.msgs.push(tmp);render();
  try{
    const pl=JSON.stringify({x:txt}),j=await call(auth({accion:'enviar',para:S.con,tipo:'msg',p:pl}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    const m={id:j.id,de:S.me,para:S.con,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:txt};saveMsgs();S.err='';
  }catch(e){const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);S.err=sinV12(e);ta.value=txt;}
  render();
}
async function shareTo(name){

  ls.set('estancia-listos',JSON.stringify(E.items.map(i=>i.crop?i.crop.at+SEEDS[i.crop.k].time:CAT[i.k].prod?(i.at||0)+CAT[i.k].prod.every:0).filter(Boolean)));}

const count=k=>E.items.filter(i=>i.k===k).length;
const troopsUsed=()=>TORDER.reduce((a,k)=>a+(E.tropas[k]||0)*TT[k].space,0)+E.cola.reduce((a,q)=>a+TT[q.k].space,0);
const cropReady=it=>!!it.crop&&Date.now()>=it.crop.at+SEEDS[it.crop.k].time;
const prodReady=it=>!!CAT[it.k].prod&&Date.now()>=(it.at||0)+CAT[it.k].prod.every;
const readyItems=()=>E.items.filter(i=>cropReady(i)||prodReady(i));
function addXp(n,silent){
  if(!n)return;const before=E.lv;E.xp+=n;E.lv=lvFromXp(E.xp).lv;if(E.lv>before)try{window.LOGROS&&LOGROS.marca('estancia','nivel',E.lv);}catch(_){}
  try{window.RANGOS&&RANGOS.addXp('estancia',n);}catch(_){}
  if(E.lv>before)setTimeout(()=>levelUp(before,E.lv),silent?900:500);
}
function tick(now=Date.now()){
  let ch=false;E.t=now;
  while(E.cola.length){if(!E.colaT)E.colaT=now;const q=E.cola[0];if(now-E.colaT>=TT[q.k].time){E.colaT+=TT[q.k].time;E.cola.shift();E.tropas[q.k]=(E.tropas[q.k]||0)+1;ch=true;}else break;}
  if(!E.cola.length)E.colaT=0;return ch;
}
/* Regalos de los otros juegos (los deja RANGOS.premio en BloqueAR y PoblAR) */
function takePremios(){
  const L=ls.json('estancia-premios',[]);if(!L.length)return;ls.set('estancia-premios','[]');
  for(const x of L)E.regalos.push({de:x.de,pesos:Math.round((x.pesos||0)+(x.trigo||0)/2),t:x.t||Date.now()});
  E.regalos=E.regalos.slice(-40);save();renderTools();
}

/* ───────── Dibujo isométrico ─────────
   Una maqueta de estancia pampeana, con luz de tarde desde arriba a la izquierda: pasto con textura,
   paredes a la cal, tejas, chapa, madera gastada y alambre. El suelo se pinta una sola vez en baldosas
   (varias versiones de pasto) y en cada cuadro sólo se estampan; las cosas se dibujan encima, de atrás para adelante. */
const TW=64,TH=32,HW=TW/2,HH=TH/2;
const cv=$('map'),ctx=cv.getContext('2d');
let W=0,Hh=0,DPR=1;
const cam={x:0,y:HH*NX,z:.6};
function P(x,y,z=0){return [(x-y)*HW,(x+y)*HH-z];}
function poly(g,pts,fill,stroke,lw){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function line(g,a,b,col,lw){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.stroke();}
function circle(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function oval(g,x,y,rx,ry,col,rot=0){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,7);g.fill();}
function emoji(g,e,x,y,size){g.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);}
const EDGE='rgba(38,26,14,.38)';
/* Paleta: colores de campo, sin estridencias */
const PAL={
  lime:'#ebe3d0',limeL:'#e2d8c2',limeR:'#c9bda3',limeLn:'rgba(120,98,66,.10)',
  tile:{base:'#9c4a33',alt:'#8a3f2b',sh:'#6f3021',gable:'#d9cfb8',ln:'rgba(70,26,16,.45)',ridge:'#6a2c1f',eave:'#5a2519'},
  zinc:{base:'#a7aba8',alt:'#8f9491',sh:'#767b78',gable:null,ln:'rgba(60,64,62,.35)',ridge:'#6b706d',eave:'#5d625f'},
  thatch:{base:'#b89a5e',alt:'#a8894f',sh:'#8a703f',gable:null,ln:'rgba(90,68,30,.45)',ridge:'#7a6234',eave:'#6e5729'},
  wood:'#7b5b3c',woodL:'#86653f',woodR:'#5f452c',woodDk:'#46321f',woodHi:'#9b7853',woodLn:'rgba(40,26,14,.35)',
  brick:'#9a5843',brickR:'#7c4535',glass:'#2d393b',shutter:'#56694c',door:'#5a3e27',
  soil:'#5d4129',soilHi:'#7b5a3b',soilDk:'#46311f',
  iron:'#3a3835',water:'#4c7a8b',waterHi:'#8db4bf'
};
function rnd(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
// Sombra suave sobre el suelo (la luz viene de arriba a la izquierda, la sombra cae a la derecha).
function sshadow(g,cx,cy,rx,ry,a=.3){const p=P(cx,cy);g.save();g.translate(p[0]+rx*.14,p[1]+ry*.12);g.scale(1,ry/rx);
  const gr=g.createRadialGradient(0,0,rx*.15,0,0,rx);gr.addColorStop(0,`rgba(26,22,10,${a})`);gr.addColorStop(.7,`rgba(26,22,10,${a*.45})`);gr.addColorStop(1,'rgba(26,22,10,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,7);g.fill();g.restore();}
// Sombra de contacto: oscurece apenas el suelo justo alrededor de la base.
function contact(g,x,y,w,h,a=.22){const e=.1;poly(g,[P(x-e,y-e),P(x+w+e,y-e),P(x+w+e*2.4,y+h+e*2.4),P(x-e,y+h+e)],`rgba(26,22,10,${a})`);}
function shadow(g,cx,cy,rx,ry,a=.2){sshadow(g,cx,cy,rx,ry,a+.08);}
// Caja: arriba, cara izquierda (mira a +y) y cara derecha (mira a +x).
function box(g,x,y,w,h,z0,hh,top,left,right,edge=EDGE){
  const A=P(x,y,z0+hh),B=P(x+w,y,z0+hh),C=P(x+w,y+h,z0+hh),D=P(x,y+h,z0+hh),B0=P(x+w,y,z0),C0=P(x+w,y+h,z0),D0=P(x,y+h,z0);
  poly(g,[D,C,C0,D0],left,edge,.8);poly(g,[C,B,B0,C0],right,edge,.8);if(top)poly(g,[A,B,C,D],top,edge,.8);
}
// Caras sueltas: izquierda en el plano y=Y (de u0 a u1 a lo largo de x), derecha en el plano x=X (a lo largo de y).
function faceL(g,Y,u0,u1,z0,z1,col,st){poly(g,[P(u0,Y,z0),P(u1,Y,z0),P(u1,Y,z1),P(u0,Y,z1)],col,st,.8);}
function faceR(g,X,u0,u1,z0,z1,col,st){poly(g,[P(X,u0,z0),P(X,u1,z0),P(X,u1,z1),P(X,u0,z1)],col,st,.8);}
// Rayado de una cara: tablas (vertical) o hiladas (horizontal).
function hatchL(g,Y,u0,u1,z0,z1,n,col,vert,lw=.7){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();
  for(let i=1;i<n;i++){if(vert){const u=u0+(u1-u0)*i/n,a=P(u,Y,z0),b=P(u,Y,z1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}else{const z=z0+(z1-z0)*i/n,a=P(u0,Y,z),b=P(u1,Y,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}}g.stroke();}
function hatchR(g,X,u0,u1,z0,z1,n,col,vert,lw=.7){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();
  for(let i=1;i<n;i++){if(vert){const u=u0+(u1-u0)*i/n,a=P(X,u,z0),b=P(X,u,z1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}else{const z=z0+(z1-z0)*i/n,a=P(X,u0,z),b=P(X,u1,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}}g.stroke();}
// Ventana con postigos verdes abiertos.
function winL(g,Y,u0,u1,z0,z1){const w=u1-u0;faceL(g,Y,u0-w*.42,u0,z0-.5,z1+.5,PAL.shutter);faceL(g,Y,u1,u1+w*.42,z0-.5,z1+.5,PAL.shutter);
  faceL(g,Y,u0,u1,z0,z1,PAL.glass);line(g,P((u0+u1)/2,Y,z0),P((u0+u1)/2,Y,z1),'#5b5040',.8);line(g,P(u0-.02,Y,z0-.6),P(u1+.02,Y,z0-.6),'#f4eee0',1.4);}
function winR(g,X,u0,u1,z0,z1){const w=u1-u0;faceR(g,X,u0-w*.42,u0,z0-.5,z1+.5,'#465a3f');faceR(g,X,u1,u1+w*.42,z0-.5,z1+.5,'#465a3f');
  faceR(g,X,u0,u1,z0,z1,'#262f31');line(g,P(X,(u0+u1)/2,z0),P(X,(u0+u1)/2,z1),'#4a4134',.8);line(g,P(X,u0-.02,z0-.6),P(X,u1+.02,z0-.6),'#d8cfbd',1.4);}
// Techo a dos aguas con la cumbrera a lo largo de x. mid(): lo que va entre el faldón de atrás y el de adelante (chimenea).
function roof(g,x,y,w,h,z0,rh,R,mid){
  const ov=.12,a=P(x-ov,y-ov,z0),b=P(x+w+ov,y-ov,z0),r1=P(x-ov,y+h/2,z0+rh),r2=P(x+w+ov,y+h/2,z0+rh),c=P(x+w+ov,y+h+ov,z0),d=P(x-ov,y+h+ov,z0);
  poly(g,[a,b,r2,r1],R.sh,EDGE,.8);

  else poly(g,[P(x+w+ov,y-ov,z0),P(x+w+ov,y+h+ov,z0),P(x+w+ov,y+h/2,z0+rh)],R.sh,EDGE,.8);
  if(mid)mid();

  const n=Math.max(3,Math.round((w+2*ov)*7));
  for(let i=1;i<n;i+=2){const u0=x-ov+i*(w+2*ov)/n,u1=x-ov+(i+1)*(w+2*ov)/n;poly(g,[P(u0,y+h/2,z0+rh),P(u1,y+h/2,z0+rh),P(u1,y+h+ov,z0),P(u0,y+h+ov,z0)],R.alt);}
  g.strokeStyle=R.ln;g.lineWidth=.8;g.beginPath();

  poly(g,[r1,r2,c,d],null,EDGE,.8);line(g,r1,r2,R.ridge,2.2);line(g,d,c,R.eave,1.3);

// Alambrado: postes de madera y tres hilos.
function wire(g,a,b,z){const A=P(a[0],a[1],z),B=P(b[0],b[1],z);g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(B[0],B[1]);g.stroke();}
function post(g,x,y,h=15){const b=P(x,y),t=P(x,y,h);line(g,[b[0]+1.2,b[1]],[t[0]+1.2,t[1]],'#3f2c1b',3);line(g,b,t,'#7a5a3b',2.4);line(g,[t[0]-.6,t[1]+1],[t[0]-.6,t[1]+5],'#9c7b55',1);}
function fenceRect(g,x,y,w,h,front,kind='wire'){
  const segs=front?[[[x,y+h],[x+w,y+h]],[[x+w,y],[x+w,y+h]]]:[[[x,y],[x+w,y]],[[x,y],[x,y+h]]];
  for(const [a,b] of segs){const n=Math.max(1,Math.round(Math.hypot(b[0]-a[0],b[1]-a[1])*1.6));
    if(kind==='rail'){for(const z of [6,12]){line(g,P(a[0],a[1],z),P(b[0],b[1],z),'#5f452c',3);line(g,P(a[0],a[1],z+.8),P(b[0],b[1],z+.8),'#8d6b46',1.4);}}
    else{g.strokeStyle='rgba(205,200,186,.85)';g.lineWidth=.7;for(const z of [5,9,13])wire(g,a,b,z);}
    for(let i=0;i<=n;i++){const u=i/n;post(g,a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,kind==='rail'?15:15);}}
}

/* ── Árboles: copas en racimos con luz arriba a la izquierda ── */
function canopy(g,cx,cy,r,tones,seed,sway){const R=rnd(seed);

    setTimeout(()=>{d.style.transform=`translate(${tr.left-sx+2}px,${tr.top-sy+2}px) scale(.7)`;d.style.opacity='.4';},30+i*60);setTimeout(()=>d.remove(),900+i*60);}}
// Cada cosecha suma para las leguas de La Gran Pampa (con tope por día; las cobra el mapa).

// Dibujito de cada cosa en la tienda.
function drawPreview(c){const k=c.dataset.prev,g=c.getContext('2d'),C=CAT[k];
  const wpx=(C.w+C.h)*HW,hpx=(C.w+C.h)*HH+(C.H||0)+10,s=Math.min(2.2,Math.min(240/wpx,165/hpx));
  const mid=P(C.w/2,C.h/2);
  g.setTransform(s,0,0,s,140-mid[0]*s,180-P(C.w,C.h)[1]*s);
  const it={id:3,k,x:0,y:0,at:Date.now(),crop:k==='parcela'?{k:'maiz',at:0}:null};
  const e=.3;poly(g,[P(-e,-e),P(C.w+e,-e),P(C.w+e,C.h+e),P(-e,C.h+e)],'rgba(36,46,20,.28)');
  if(C.flat)poly(g,[P(0,0),P(1,0),P(1,1),P(0,1)],'#b49c74','#8e7656',1.5);else ART[k](g,it,1,[it]);}
function startPlace(k){const c=CAT[k],own=land();SEL=null;MODE='place';
  const r=cv.getBoundingClientRect(),ct=toTile(r.left+W/2,r.top+Hh/2);let best=null,bd=1e9;
  for(let y=own.y0;y<=own.y1-c.h;y++)for(let x=own.x0;x<=own.x1-c.w;x++)if(fits(k,x,y)){const d=Math.hypot(x+c.w/2-ct.x,y+c.h/2-ct.y);if(d<bd){bd=d;best={x,y};}}
  GHOST={k,x:best?best.x:own.x0,y:best?best.y:own.y0,id:-1};renderPlace();renderAll();
  if(!best)toast('No hay lugar libre: ampliá el campo o vendé algo.');}
function renderPlace(){const on=MODE==='place'||MODE==='move';$('placebar').hidden=!on;$('tools').style.display=on?'none':'';if(on)$('harvest-all').hidden=true;
  if(!on)return;
  if(!GHOST){$('hint').textContent='Tocá lo que quieras mover';$('pl-ok').textContent='Listo';$('pl-ok').disabled=false;return;}
  const ok=fits(GHOST.k,GHOST.x,GHOST.y,GHOST.id);$('pl-ok').disabled=!ok;$('pl-ok').innerHTML=MODE==='place'?`Poner acá · ${fmt(CAT[GHOST.k].cost)}<i class="co"></i>`:'Dejar acá';

  add('gallinero');if(L>=3)add('tambo');if(L>=5)add('colmena');if(L>=6)add('ovejas');if(L>=2)add('corral');
  for(let i=0;i<3+L%4;i++)add('parcela',{crop:{k:'trigo',at:0}});for(let i=0;i<4;i++)add(R()<.5?'arbol':'flores');

}
function deployAt(cx,cy){

const cOf=i=>{const c=CAT[i.k];return {x:i.x+c.w/2,y:i.y+c.h/2};};

  const g=Math.floor(B.lootable*(i.k==='casco'?4:1)/B.wsum);B.loot+=g;if(g>0)FLOATS.push({x:cOf(i).x,y:cOf(i).y,txt:`+${g} 🪙`,t:performance.now()});}
let lastFrame=0;
// Lo que se lleva un malón además de los pesos: los productos listos de lo que rompió (arriba) y, con estrellas,
// parte de las cosechas listas (las más cercanas a lo que rompió). El que ataca se queda con el 60 % de lo que valen.
const ROBO=.6,ROBO_COSECHA=[0,.3,.5,.7];

  if(B.pampa||!B.stars)return;
  const down=B.view.items.filter(i=>CAT[i.k].cnt&&i.hp<=0).map(cOf),lis=B.view.items.filter(i=>i.crop&&i.rdy);if(!lis.length)return;
  const d=i=>{const c=cOf(i);return down.length?Math.min(...down.map(p=>Math.hypot(p.x-c.x,p.y-c.y))):0;};
  const n=Math.ceil(lis.length*ROBO_COSECHA[B.stars]);
  for(const i of lis.sort((a,b)=>d(a)-d(b)).slice(0,n)){const S=SEEDS[i.crop.k];if(!S)continue;const v=Math.round(S.gain*ROBO);B.robo+=v;B.robado.push([i.x,i.y]);B.robN[S.e]=(B.robN[S.e]||0)+1;i.rdy=false;i.crop=null;}

const roboTxt=N=>Object.entries(N||{}).map(([e,n])=>n>1?`${e}×${n}`:e).join(' ');

/* Cruce por malón de La Gran Pampa: el mapa manda acá a atacar la estancia del vecino dueño del paraje.
   Se juega igual, con tu tropa más una ayuda prestada; con 2 ⭐ o más el paraje es tuyo. No da pesos ni trofeos.
   Si tu vecino todavía no guardó su estancia, se defiende una estancia de tu nivel.
   Estancia nivelada (v57): si su estancia es más floja que una de tu nivel, la pampa le presta defensas
   (mangrullos, perreras y tapias junto al casco) hasta quedar parejo. Así a quien no le copa EstanciAR no
   le sacan todo con malones. */
const PAMPA_AYUDA={gaucho:4,boleador:2};
let PM_DUELO='';
function poderDef(items){let p=0;for(const i of items){if(i.k==='mangrullo')p+=3;else if(i.k==='perrera')p+=2;else if(i.k==='tapia')p+=.35;else if(i.k==='alambrado')p+=.12;}return p;}
function nivelar(base,L){
  const meta=poderDef(npcBase(L).items);let p=poderDef(base.items),id=5000;const own=base.own,N={};
  if(p>=meta)return N;
  const cas=base.items.find(i=>i.k==='casco')||{x:own.x0+own.L/2-1.5,y:own.y0+own.L/2-1.5};
  const add=k=>{const c=CAT[k];let best=null,bd=1e9;
    for(let y=own.y0;y<=own.y1-c.h;y++)for(let x=own.x0;x<=own.x1-c.w;x++)if(fits(k,x,y,null,base.items,own)){const d=Math.hypot(x+c.w/2-(cas.x+1.5),y+c.h/2-(cas.y+1.5));if(d<bd){bd=d;best={x,y};}}
    if(!best)return false;base.items.push({id:id++,k,x:best.x,y:best.y,prestado:1});N[k]=(N[k]||0)+1;return true;};
  for(const k of ['mangrullo','perrera','mangrullo','perrera','mangrullo','mangrullo']){if(p>=meta)break;if(add(k))p+=k==='mangrullo'?3:2;}
  for(let n=0;n<40&&p<meta;n++){if(!add('tapia'))break;p+=.35;}
  return N;
}
async function pampaMalon(q,duelo=''){
  if(BAT)return;let base=null,niv=null;PM_DUELO=duelo;
  try{if(acct())base=await fetchFriend(q);}catch(_){base=null;}
  if(!base){base=npcBase(clamp(E.lv,2,8));base.name='Estancia de '+q;}
  else{niv=nivelar(base,clamp(E.lv,2,12));}
  base.pampa=q;base.friend=null;
  const nv=niv&&Object.keys(niv).length?Object.entries(niv).map(([k,n])=>`${n} ${CAT[k].e}`).join(' '):'';
  toast(`🐎 Malón a ${q}: además de tu tropa, te prestan 4 gauchos y 2 boleadores${nv?`. Su estancia está nivelada: la pampa le prestó ${nv}`:''}`);
  startBattle(base,{...PAMPA_AYUDA});
}
async function endPampaMalon(B,won){
  let txt='',ok=false;
  try{const j=await lb({accion:'pampaMalon',duelo:PM_DUELO,estrellas:B.stars});ok=true;txt=(j.eventos&&j.eventos[0]&&j.eventos[0].txt)||'';}
  catch(e){txt='No se pudo anotar en La Gran Pampa: '+e.message;}
  addXp(won?10+B.stars*4:4,true);
  E.log.unshift({t:Date.now(),tipo:'ataque',a:B.name,estrellas:B.stars,pesos:0});E.log=E.log.slice(0,30);save();sfx(won?'win':'lose');
  sheet(won?'¡Malón exitoso!':'Malón rechazado',`<div class="big">${[0,1,2].map(i=>i<B.stars?'⭐':'☆').join('')}</div>
    <p class="center">${Math.floor(B.pct)}% destruido en la estancia de <b>${esc(B.pampa)}</b>.</p>
    <p class="center"><b>${esc(txt)}</b></p>${ok?'':'<p class="note center">Volvé al mapa: si el cruce sigue abierto, podés probar de nuevo.</p>'}
    <a class="btn go" href="pampa.html#malon" id="r-back">Volver a La Gran Pampa</a><button class="btn" id="r-ok">Quedarme en la estancia</button>`);
  const back=()=>{$('modal').hidden=true;BAT=null;MODE='farm';renderBattleBar();focusLand();renderAll();};
  $('sh-x').onclick=back;$('r-ok').onclick=back;
}

/* ───────── Cuenta y planilla ───────── */
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
async function lb(p,ms=15000){
  const a=acct(),url=ls.get('bloques-lb-url-v1')||LB_DEF;if(!a)throw new Error('Necesitás tu cuenta de BloqueAR.');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{method:'POST',body:JSON.stringify({usuario:a.usuario,token:a.token,...p}),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}
let syncT=0,syncing=false;
// Lo que un malón te robó del campo: esas cosechas se pierden y esos animales vuelven a empezar.
function perderRobado(lista){const N={};for(const q of Array.isArray(lista)?lista:[]){const it=E.items.find(i=>i.x===q[0]&&i.y===q[1]);if(!it)continue;
  if(it.crop&&SEEDS[it.crop.k]){const e=SEEDS[it.crop.k].e;N[e]=(N[e]||0)+1;it.crop=null;}else if(CAT[it.k].prod){const e=CAT[it.k].prod.e;N[e]=(N[e]||0)+1;it.at=Date.now();}}
  return roboTxt(N);}
function schedSync(){clearTimeout(syncT);syncT=setTimeout(sync,8000);}
async function sync(){
  if(!acct()||syncing)return;syncing=true;
  try{const datos=JSON.stringify({v:2,casco:E.casco,lv:E.lv,trofeos:E.trofeos,res:{pesos:Math.floor(E.pesos),trigo:0},items:E.items.map(i=>{const o={k:i.k,x:i.x,y:i.y};if(i.crop)o.c=i.crop.k;if(cropReady(i)||prodReady(i))o.r=1;return o;})});
    const j=await lb({accion:'estGuardar',datos,desde:E.seen||0});
    if(j.escudo)E.escudo=j.escudo;
    if(j.malones&&j.malones.length){let p=0;for(const m of j.malones){p+=m.pesos;const qu=perderRobado(m.robado);m.qu=qu;if(!m.estrellas)lgEv('aguantes',1,'d'+m.t+':'+m.de);E.log.unshift({t:m.t,tipo:'defensa',a:m.de,estrellas:m.estrellas,pesos:m.pesos,robo:qu});}
      E.pesos=Math.max(0,E.pesos-Math.floor(p));E.log=E.log.slice(0,30);
      sheet('🚨 ¡Te hicieron un malón!',`${j.malones.map(x=>`<p><b>${esc(x.de)}</b>: ${'⭐'.repeat(x.estrellas)||'sin estrellas'} · se llevó ${fmt(x.pesos)}<i class="co"></i>${x.qu?` y lo que tenías listo para juntar: ${x.qu}`:''}</p>`).join('')}
        ${E.escudo>Date.now()?`<p>🛡️ Tenés escudo por ${dur(E.escudo-Date.now())}: nadie te puede atacar.</p>`:''}<p class="note">Juntá seguido lo que está listo (lo listo se lo pueden llevar) y poné mangrullos, perros, alambrados y tapias para defenderte mejor.</p><button class="btn go" id="m-ok">Ahora van a ver</button>`);$('m-ok').onclick=closeSheet;sfx('lose');}
    E.seen=j.ahora||E.seen;ls.set(KEY,JSON.stringify(E));renderHud();
  }catch(_){}finally{syncing=false;}
}

/* ───────── Sonidos (sencillos y bajitos) ───────── */
let AC=null,SND=ls.get('estancia-sonido')!=='0';
function actx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,d,v=.07,delay=0,type='sine'){const a=actx(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g).connect(a.destination);o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let NZ=null;function noise(d,v=.2,delay=0,f=1000){const a=actx();if(!NZ){NZ=a.createBuffer(1,a.sampleRate*.4,a.sampleRate);const x=NZ.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;}const t=a.currentTime+delay,s=a.createBufferSource(),bq=a.createBiquadFilter(),g=a.createGain();s.buffer=NZ;bq.type='bandpass';bq.frequency.value=f;s.connect(bq).connect(g).connect(a.destination);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.start(t);s.stop(t+d+.02);}
const SX={harvest(){tone(660,560,.1);tone(880,760,.1,.06,.07);},collect(){tone(740,640,.1);},plant(){noise(.05,.2,0,700);},build(){noise(.05,.3,0,850);noise(.05,.25,.11,800);},
  level(){[523,659,784].forEach((f,i)=>tone(f,f,.25,.06,i*.1));},horn(){tone(220,220,.35,.05);tone(294,294,.4,.05,.25);},drop(){tone(420,380,.05,.04);},ko(){tone(300,200,.08,.03);},dogs(){tone(520,420,.08,.04);tone(540,420,.08,.04,.14);},
  crash(){noise(.15,.25,0,350);},win(){[523,659,784].forEach((f,i)=>tone(f,f,.28,.07,i*.12));},lose(){[392,330].forEach((f,i)=>tone(f,f,.3,.06,i*.16));},nope(){tone(180,170,.08,.05);}};
function sfx(k){if(!SND)return;try{SX[k]&&SX[k]();}catch(_){}}

/* ───────── Varios ───────── */
let toastT=0;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),2600);}
function openHelp(){sheet('Cómo se juega',`
  <p>🌾 <b>Sembrá</b> en las parcelas y volvé cuando esté listo para cosechar. Cada cultivo tarda distinto: el trigo, minutos; el zapallo, horas.</p>
  <p>🐔 Los <b>animales</b> te dan cosas cada tantas horas, aunque tengas el juego cerrado. Cuando aparece la burbuja, tocala.</p>
  <p>🛒 En la <b>Tienda</b> comprás más parcelas, animales, adornos y defensas. Con <b>Acomodar</b> movés todo a tu gusto.</p>
  <p>🏡 Tocando el <b>casco</b> ampliás el campo.</p>
  <p>⚔️ Con un <b>corral de gauchos</b> entrenás tropa y salís de <b>malón</b> contra la compu o tus amigos. Te llevás parte de sus pesos y lo que tenía listo para juntar en lo que rompés (y, con estrellas, parte de sus cosechas). Con <b>×2</b> lo ves al doble de velocidad.</p>
  <p>🛡️ 🔭 Mangrullos, 🐕 perros, 🪵 alambrados y 🧱 tapias te defienden. Las tapias aguantan mucho: los de a caballo las tienen que romper, pero los boleadores tiran por encima. Juntá seguido: lo listo se lo pueden llevar.</p>
  <p>🗺️ En los cruces de <b>La Gran Pampa</b>, si tu estancia es más floja que la del que te ataca, la pampa te presta defensas para que quede parejo.</p>
  <p>🎁 Cada partida de <b>BloqueAR</b>, <b>PoblAR</b> y <b>TrucAR</b> te deja un regalo.</p>
  <button class="btn go" id="h-ok">¡Vamos!</button>`);$('h-ok').onclick=closeSheet;}
function openSide(h){$('side-panel').innerHTML=h;$('side').hidden=false;}
function closeSide(){$('side').hidden=true;}
$('side').addEventListener('click',e=>{if(e.target.id==='side')closeSide();});
function openMenu(){
  openSide(`<div class="side-head"><h2>Menú</h2><button class="side-x" id="m-x" aria-label="Cerrar">✕</button></div>${window.RANGOS?RANGOS.mine('estancia'):''}<div class="menu-list">
    <button id="m-help">❓ Cómo se juega</button><button id="m-log">📜 Últimos malones</button>
    <button id="m-snd">${SND?'🔊 Sonido: prendido':'🔇 Sonido: apagado'}</button>
    ${window.LOGROS?'<button id="m-logros">🏅 Logros y retos</button>':''}<a href="./#tablas=estancia">🏆 Tabla</a>
    <a href="./#cuenta">👤 Mi cuenta</a><a href="./#juegos">🎮 Menú de juegos</a></div><p class="note" style="margin-top:auto;text-align:center">EstanciAR · versión 60</p>`);
  $('m-x').onclick=closeSide;$('m-help').onclick=()=>{closeSide();openHelp();};
  $('m-snd').onclick=()=>{SND=!SND;ls.set('estancia-sonido',SND?'1':'0');openMenu();};
  if($('m-logros'))$('m-logros').onclick=()=>LOGROS.abrir('estancia',{side:openSide,volver:openMenu,cerrar:closeSide});
  $('m-log').onclick=()=>{closeSide();sheet('Últimos malones',E.log.length?E.log.map(l=>`<p>${l.tipo==='ataque'?'⚔️ Atacaste a':'🚨 Te atacó'} <b>${esc(l.a)}</b> · ${'⭐'.repeat(l.estrellas)||'sin estrellas'} · ${fmt(l.pesos||0)}<i class="co"></i></p>`).join(''):'<p>Todavía no hubo malones.</p>');};
}
$('btn-menu').onclick=openMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('side').hidden)closeSide();else if(!$('modal').hidden&&!BAT)closeSheet();else if(MODE==='move'||MODE==='place'){$('pl-no').click();}else if(!$('pop').hidden){SEL=null;closePop();}}});
window.addEventListener('resize',()=>{fitScreen();resize();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(E){tick();ls.set(KEY,JSON.stringify(E));sync();}}else if(E&&!BAT){readCopas();tick();takePremios();renderAll();sync();}});

/* ───────── Arranque ───────── */
let FRAME=0;
function loop(now){
  if(BAT&&!BAT.over){const dt=Math.min(.1,(now-lastFrame)/1000)*(BAT.x2?2:1);lastFrame=now;const n=Math.ceil(dt/.05);for(let i=0;i<n;i++)if(BAT&&!BAT.over)step(dt/n);if(BAT)renderHud();}
  else lastFrame=now;
  if(BAT||(FRAME++%2===0))draw();
  requestAnimationFrame(loop);
}
(function start(){
  load();readCopas();fitScreen();
  try{if(!/^#pampa-malon=/.test(location.hash))localStorage.setItem('bloques-ultimo-juego','estancia');localStorage.setItem('bloques-hub-v1','1');}catch(_){}
  const pm=/^#pampa-malon=([^&]+)(?:&duelo=([A-Za-z0-9_-]+))?/.exec(location.hash),first=!ls.get(KEY+'-ayuda');tick();takePremios();save();
  resize();focusLand();renderAll();
  if(pm){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}ls.set(KEY+'-ayuda','1');let q='';try{q=decodeURIComponent(pm[1]);}catch(_){q=pm[1];}setTimeout(()=>pampaMalon(q,pm[2]||''),300);}
  else if(first){ls.set(KEY+'-ayuda','1');setTimeout(openHelp,400);}
  setInterval(()=>{if(BAT)return;if(tick())save();renderAll();},1000);
  requestAnimationFrame(loop);
  if(window.RANGOS)RANGOS.css();
  try{if(window.LOGROS&&E)LOGROS.marca('estancia','nivel',E.lv,null,true);}catch(_){}
  if(window.CHAT)CHAT.init({busy:()=>!!BAT,account:()=>{location.href='./#cuenta';},game:()=>'estancia',
    invite:(g,u)=>{if(g==='estancia'){openMalon('amigos');return;}location.href=(g==='poblar'?'poblar.html':g==='truco'?'truco.html':'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='estancia')openMalon();else location.href=c.j==='poblar'?'poblar.html':c.j==='pampa'?'pampa.html':c.j==='truco'?'truco.html':'./';}});
  if(/^#(malon|invitar=)/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}setTimeout(()=>openMalon(acct()?'amigos':'compu'),first?900:200);}
  setTimeout(sync,1500);
})();
window.ESTANCIA={destroyed,pampaMalon,nivelar,poderDef,robarCosechas,perderRobado,fetchFriend,deployAt,CAT,simulate(sec){for(let i=0;i<sec*20&&BAT&&!BAT.over;i++)step(.05);},get E(){return E;},get BAT(){return BAT;},get cam(){return cam;},P,toTile,startBattle,npcBase,endBattle,sync,takePremios,tick,save,renderAll,focusLand,draw,
  screenOf(x,y,z=0){const p=P(x,y,z),r=cv.getBoundingClientRect();return {x:r.left+W/2+(p[0]-cam.x)*cam.z,y:r.top+Hh/2+(p[1]-cam.y)*cam.z};}};
</script>
