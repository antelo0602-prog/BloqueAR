<title>EstanciAR</title>
<style>
:root{--bg:#0b1019;--line:#283345;--ink:#f4f7fe;--aqua:#7ce9e5;--gold:#f6c453;
  --paper:#fff8e8;--paper2:#f6ead0;--wood:#8a5a32;--wood2:#5e3b1f;--brown:#3b2a1a;--soft:#86735c;--leaf:#4f9a3a;--leaf2:#3d7d2c;--coin:#f2b01e;--red:#d4492c}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:600 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--brown);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
/* Barra de arriba: la misma de todos los juegos */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);flex:none}
.brand{font-weight:900;letter-spacing:.12em;font-size:15px}.brand span{color:#e8c14a}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#121b29;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0}
.games-btn i{width:7px;height:7px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
/* Campo */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#4d7f37}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* Marcadores de arriba (nivel, plata, trofeos) */
.hud{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 6px;border-radius:18px;background:var(--paper);border:2px solid var(--wood);box-shadow:0 3px 0 var(--wood2),0 6px 14px #0004;font-weight:900;font-size:15px;white-space:nowrap}
.pill .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:#fff;border:2px solid var(--wood)}
.pill.lv .ic{background:#5cb847;color:#fff;font-size:13px;border-color:#2f6b22}
.pill .xp{width:54px;height:7px;border-radius:4px;background:#e2d3b5;overflow:hidden}.pill .xp i{display:block;height:100%;background:#5cb847}
.pill.coin .ic{background:#ffd34d;border-color:#b07a12}
.pill.sm{height:30px;font-size:13px;padding:0 10px}
.hud .sp{flex:1}
.hint{position:absolute;left:50%;top:54px;transform:translateX(-50%);max-width:92%;background:#2b1d10e8;color:#fff7e0;border-radius:14px;padding:8px 14px;font-weight:800;text-align:center;pointer-events:none;box-shadow:0 6px 16px #0005;font-size:14px}
.hint:empty{display:none}
/* Botonera de abajo */
.tools{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;padding:0 8px;pointer-events:none}
.tool{pointer-events:auto;width:64px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;position:relative}
.tool .b{width:56px;height:56px;border-radius:50%;background:var(--paper);border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood2),0 8px 16px #0005;display:grid;place-items:center;font-size:26px}
.tool small{font-size:12px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000,0 0 6px #000a}
.tool:active .b{transform:translateY(2px);box-shadow:0 2px 0 var(--wood2)}
.tool .badge{position:absolute;top:-2px;right:2px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.tool .badge:empty{display:none}
.harvest-all{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));pointer-events:auto;height:44px;padding:0 18px;border-radius:22px;background:#ffd34d;border:3px solid #b07a12;box-shadow:0 4px 0 #7a540c,0 8px 16px #0005;font-weight:900;font-size:15px;color:#3b2a00}
.harvest-all[hidden]{display:none}
/* Tarjeta de lo que tocaste */
.pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 16px));background:var(--paper);border:3px solid var(--wood);border-radius:20px;box-shadow:0 5px 0 var(--wood2),0 12px 28px #0006;padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:up .16s ease-out}
.pop[hidden]{display:none}
@keyframes up{from{transform:translate(-50%,14px);opacity:.3}}
.pop h3{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}.pop h3 small{font-size:12px;color:var(--soft);font-weight:800}
.pop p{margin:0;color:#5b4a37;font-size:14px}
.pop .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;border:0;background:var(--paper2);font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:46px;border-radius:14px;border:2px solid var(--wood);background:#fff;font-weight:900;font-size:15px;padding:0 12px;box-shadow:0 3px 0 var(--wood2)}
.btn.go{background:#5cb847;border-color:#2f6b22;color:#fff;box-shadow:0 3px 0 #2f6b22}
.btn.gold{background:#ffd34d;border-color:#b07a12;box-shadow:0 3px 0 #7a540c}
.btn.red{background:#e2583c;border-color:#8f2a16;color:#fff;box-shadow:0 3px 0 #8f2a16}
.btn:disabled{opacity:.45}
.bar{height:10px;border-radius:5px;background:#e2d3b5;overflow:hidden}.bar i{display:block;height:100%;background:#5cb847}
/* Hojas que suben desde abajo */
.modal{position:fixed;inset:0;z-index:20;background:#1a120acc;display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--paper);border:3px solid var(--wood);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px #0007;animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font-size:21px;flex:1}
.sheet>header .x{width:40px;height:40px;border-radius:12px;border:0;background:var(--paper2);font-size:17px}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#5b4a37}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;height:38px;padding:0 14px;border-radius:19px;border:2px solid var(--wood);background:#fff;font-weight:900}
.tabs button.on{background:var(--wood);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:stretch;border-radius:16px;border:2px solid var(--wood);background:#fff;box-shadow:0 3px 0 var(--wood2);padding:0;overflow:hidden;text-align:left}
.card canvas{display:block;width:100%;height:96px;background:linear-gradient(#9fd5ea,#cfeac0 60%,#8cc46b 60%)}
.card .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card b{font-size:15px}.card small{color:var(--soft);font-size:12px;font-weight:700}
.card .price{font-weight:900;font-size:14px;color:#7a540c}
.card:disabled{opacity:.55;filter:grayscale(.6)}
.card.lock .price{color:var(--soft)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;border:2px solid var(--wood);background:#fff;box-shadow:0 3px 0 var(--wood2);text-align:left;width:100%}
.item .ic{font-size:30px;width:42px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font-size:16px}.item .tx small{display:block;color:var(--soft);font-size:12.5px;font-weight:700}
.item:disabled{opacity:.5}
.item .btn{flex:none;min-height:40px}
.big{font-size:46px;text-align:center;line-height:1.1}
.center{text-align:center}
.note{font-size:12.5px;color:var(--soft)}
/* Malón */
.stars{font-size:20px;letter-spacing:1px}.stars i{font-style:normal;opacity:.25}.stars i.on{opacity:1}
.troops{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;padding:0 8px}
.troop{width:72px;height:78px;border-radius:18px;background:var(--paper);border:3px solid var(--wood);box-shadow:0 4px 0 var(--wood2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;padding:0}
.troop span{font-size:28px;line-height:1.1}.troop small{font-size:12px}
.troop.sel{border-color:#2f6b22;background:#dff3d2;transform:translateY(-4px)}
.troop:disabled{opacity:.4}
.troop.end{background:#e2583c;border-color:#8f2a16;color:#fff;box-shadow:0 4px 0 #8f2a16}
/* Menú lateral */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:#05080dcc}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#111a27;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font-size:20px}
.side-x{width:44px;height:44px;border-radius:14px;border:0;background:#1a2536;font-size:18px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#0f1724;font-weight:800;text-decoration:none;color:var(--ink);font-size:15px}
.side .note{color:#93a1b6}
.toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:#2b1d10f2;color:#fff7e0;border-radius:16px;padding:10px 16px;font-weight:800;box-shadow:0 12px 30px #0007;max-width:92vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}
.fly{position:fixed;z-index:25;pointer-events:none;font-size:22px;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s;will-change:transform}
.placebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;width:min(420px,calc(100% - 16px))}
.placebar[hidden]{display:none}
.placebar .btn{flex:1;min-height:54px;font-size:16px}
@media (orientation:landscape) and (max-height:520px){
  .tools{left:auto;right:max(8px,env(safe-area-inset-right));top:52px;bottom:auto;flex-direction:column;gap:4px;padding:0;width:auto}
  .tool .b{width:46px;height:46px;font-size:22px}.tool small{font-size:11px}
  .harvest-all{bottom:12px}.pop{bottom:10px}.troops{left:auto;right:8px;top:48px;bottom:auto;flex-direction:column;width:auto;gap:6px}.troop{width:62px;height:58px}.troop span{font-size:22px}
  .placebar{bottom:8px}.placebar .btn{min-height:46px}
  .hint{top:50px}.toast{bottom:auto;top:100px}}
@media (min-width:760px){.sheet{border-radius:24px;border-bottom:3px solid var(--wood);margin-bottom:24px}.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.sheet,.pop,.side-panel,.toast{animation:none}.fly{transition:none}}
</style>
<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
function premio(de,xp){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  const p={de,trigo:0,pesos:Math.min(1000,Math.round(n*2)),t:Date.now()};
  const L=ls.json('estancia-premios',[]);L.push(p);ls.set('estancia-premios',JSON.stringify(L.slice(-40)));
  // La Gran Pampa: cada partida terminada da una tirada extra ese día (hasta 3).
  const d=new Date(),dia=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,X=ls.json('pampa-extra',{}),n2=(X.dia===dia?X.n||0:0)+1;
  ls.set('pampa-extra',JSON.stringify({dia,n:n2}));
  const a=ls.json('bloques-acct-v1',null);
  return {...p,tirada:n2<=3&&!!(a&&a.usuario)};
}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){return {r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  const r=ls.json(RKEY,{});if(d.r&&(d.r.at||0)>(r.at||0)){ls.set(RKEY,JSON.stringify(d.r));ch=true;}
  const x=ls.json(XKEY,{});if(d.x){const o={...x};for(const [k,v] of Object.entries(d.x))if(k!=='at'&&Number.isFinite(v)&&v>(o[k]||0)){o[k]=v;ch=true;}if(ch){o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}}
  return ch;
}
function badge(v,small){const i=info(v);return `<span class="rk-badge${small?' sm':''}" style="--rk:${i.t.c}" title="${i.label}${i.next!=null?` · ${i.pr}/${DIV} PR`:''}"><i>${i.t.e}</i>${i.short}</span>`;}
const CSS=`.rk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent);background:color-mix(in srgb,var(--rk) 16%,#0c131e);color:var(--rk);font:800 11.5px/1.3 system-ui,-apple-system,sans-serif;white-space:nowrap;vertical-align:middle}
.rk-badge i{font-style:normal;font-size:12px}.rk-badge.sm{font-size:10.5px;padding:1px 7px 1px 4px}
.rk-res{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-weight:800}
.rk-res .rk-d{font-size:15px}.rk-res .rk-d.up{color:#57d49b}.rk-res .rk-d.down{color:#ff8a6b}
.rk-bar{height:6px;border-radius:3px;background:#283345;overflow:hidden;margin-top:4px}.rk-bar i{display:block;height:100%;background:var(--rk,#7ce9e5)}`;
function css(){if(document.getElementById('rk-css'))return;const s=document.createElement('style');s.id='rk-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
function resultHtml(r){if(!r)return '';const sign=r.delta>0?'+':'';return `<div class="rk-res">${badge(r.after.v)}<span class="rk-d ${r.delta>=0?'up':'down'}">${sign}${r.delta} PR</span>${r.up?'<span>¡Subiste!</span>':r.down?'<span>Bajaste</span>':''}</div>`;}
window.RANGOS={TIERS,GAMES,info,get,generalFrom,isRanked,setRanked,apply,soloTarget,xp,addXp,general,exportData,importData,badge,resultHtml,css,levelInfo,premio,DIV};
})();

</script>
<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no suena ni aparece nada: sólo sube el numerito del botón 💬. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},
  timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte).slice(-3000);}
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
function unreadFrom(n){const r=S.read[lc(n)]||0;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2500:5000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()}};
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    if(j.t>S.last)await fetchNew();
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(){
  const j=await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id))continue;S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>(r[lc(m.de)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===lc(m.de)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  if(!S.key||!cs)return;
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||m.tmp)continue;const o=await unseal(other(m),m.cont).catch(()=>null);S.plain[m.id]=o;}
}

/* ── Avisos ── */
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'🔒 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;
  if(ST.m==='dnd'){S.pending.length=0;return;}
  const list=S.pending.splice(0),names=[...new Set(list.map(m=>m.de))];
  if(list.some(m=>m.tipo==='zumbido'))beep('zumbido');else beep('msg');
  if(list.length===1){toast(list[0].de,preview(list[0]));return;}
  toast(names.length===1?names[0]:names.slice(0,3).join(', '),`Te ${list.length===1?'escribió':'escribieron'}: ${list.length} mensajes nuevos.`,names.length===1?names[0]:null);
}
function shake(){const el=S.open?$('.cx-panel'):document.body;if(!el)return;el.classList.remove('cx-shake');void el.offsetWidth;el.classList.add('cx-shake');setTimeout(()=>el.classList.remove('cx-shake'),800);}
let baseTitle=document.title,titleTimer=0;
function flashTitle(){if(titleTimer)return;baseTitle=document.title.replace(/^\(\d+\) /,'');let on=false;titleTimer=setInterval(()=>{const n=unreadTotal();if(!document.hidden||!n){clearInterval(titleTimer);titleTimer=0;document.title=baseTitle;return;}on=!on;document.title=on?`(${n}) 💬 Mensaje nuevo`:baseTitle;},1200);}
function sysNotify(m){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const u=userOf(m.de),n=new Notification(`${u?u.avatar+' ':''}${m.de}`,{body:preview(m),tag:'bloques-chat-'+lc(m.de),silent:false});
    n.onclick=()=>{window.focus();open(m.de);n.close();};}catch(_){}
}
function toast(who,txt,openWho=who){
  const box=$('.cx-toasts');if(!box)return;const u=userOf(who);
  const el=document.createElement('button');el.type='button';el.className='cx-toast';
  el.innerHTML=`${u?avatar(u):'<span class="cx-av">💬</span>'}<span><b>${esc(who)}</b><small>${esc(txt).slice(0,140)}</small></span>`;
  el.onclick=()=>{el.remove();open(openWho||undefined);};
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},6500);
}
function badges(){
  const n=unreadTotal();
  document.querySelectorAll('[data-chat-btn]').forEach(b=>{let s=b.querySelector('.cx-badge');if(!n){if(s)s.remove();return;}if(!s){s=document.createElement('span');s.className='cx-badge';b.appendChild(s);}s.textContent=n>9?'9+':String(n);});
  if(!document.hidden)document.title=baseTitle;
}

/* ── Vista ── */
const avatar=(u,big)=>`<span class="cx-av${big?' big':''}" style="--avc:${/^#[0-9a-fA-F]{6}$/.test(u&&u.color||'')?u.color:'#7ce9e5'}">${esc(u&&u.avatar||'🙂')}</span>`;
const hora=t=>{const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});if(d.toDateString()===n.toDateString())return hm;const y=new Date(n-864e5);if(d.toDateString()===y.toDateString())return 'ayer '+hm;return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});};
const dia=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return 'Hoy';if(d.toDateString()===new Date(n-864e5).toDateString())return 'Ayer';return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});};
function ensureDom(){
  if($('#cx-root'))return;
  const r=document.createElement('div');r.id='cx-root';
  r.innerHTML=`<div class="cx-scrim" hidden></div><aside class="cx-panel" hidden role="dialog" aria-modal="true" aria-label="Chat"></aside><div class="cx-toasts" aria-live="polite"></div>`;
  document.body.appendChild(r);
  $('.cx-scrim').onclick=close;
  const p=$('.cx-panel');
  p.addEventListener('click',onClick);
  p.addEventListener('focusout',e=>{if(e.target.id==='cx-frase')saveFrase(e.target.value);});
  p.addEventListener('input',e=>{if(e.target.id==='cx-in'){S.typedAt=Date.now();autoGrow(e.target);}});
  p.addEventListener('keydown',e=>{
    if(e.target.id==='cx-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
    if(e.target.id==='cx-pin'&&e.key==='Enter'){e.preventDefault();activate();}
    if(e.target.id==='cx-frase'&&e.key==='Enter'){e.preventDefault();e.target.blur();}
    e.stopPropagation();
  });
  document.addEventListener('keydown',e=>{if(S.open&&e.key==='Escape'){e.preventDefault();e.stopPropagation();if(S.invFor){S.invFor=null;$('.cx-panel').dataset.sig='';render();}else if(S.pickFor){S.pickFor=null;render();}else if(S.view==='perfil'&&S.con){S.view='conv';render();}else if(S.view==='conv'||S.view==='perfil'||S.view==='share'){S.view='list';S.card=null;render();}else close();}},true);
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function convList(){
  const me=lc(S.me),by={};
  for(const m of S.msgs){const o=lc(other(m));if(!by[o]||m.t>by[o].t)by[o]=m;}
  const users=S.users.filter(u=>lc(u.usuario)!==me);
  for(const k of Object.keys(by))if(!users.some(u=>lc(u.usuario)===k)){const m=by[k];users.push({usuario:other(m),avatar:'🙂',color:'#93a1b6',enLinea:false});}
  return users.map(u=>({u,m:by[lc(u.usuario)]||null})).sort((a,b)=>((b.m?b.m.t:0)-(a.m?a.m.t:0))||((b.u.enLinea?1:0)-(a.u.enLinea?1:0))||a.u.usuario.localeCompare(b.u.usuario));
}
function render(){
  const p=$('.cx-panel');if(!p||!S.open)return;
  const a=acct();
  if(!a){p.innerHTML=head('Chat')+`<div class="cx-empty"><p>Para chatear con tus amigos necesitás una cuenta (la misma de los juegos).</p><button type="button" class="cx-primary" data-a="cuenta">Crear cuenta o entrar</button></div>`;return;}
  if(S.unsupported){p.innerHTML=head('Chat')+`<div class="cx-empty"><p>${esc(S.err)}</p><p class="cx-dim">Es la misma planilla de la tabla: Extensiones › Apps Script, pegar el código nuevo e Implementar › Nueva versión.</p></div>`;return;}
  if(!cs){p.innerHTML=head('Chat')+`<div class="cx-empty"><p>Este navegador no permite el cifrado del chat. Abrí el juego desde la página (https), no como archivo suelto.</p></div>`;return;}
  if(!S.key){if(p.dataset.sig==='act'&&$('#cx-pin')){const e=$('#cx-err');if(e)e.textContent=S.err||'';return;}p.dataset.sig='act';p.innerHTML=head('Chat')+`<div class="cx-empty"><p><b>Abrí tu chat</b></p><p>Tus mensajes viajan cifrados: en la planilla nadie los puede leer. Para abrirlos en este dispositivo, escribí tu PIN.</p>

    <p class="cx-dim">Con un PIN corto la protección es básica. No mandes contraseñas ni datos de tarjetas por acá.</p></div>`;setTimeout(()=>$('#cx-pin')?.focus(),50);return;}
  if(S.view==='conv'&&S.con){renderConv(p);return;}
  if(S.view==='perfil'&&S.prof){p.dataset.sig='';renderProfile(p);return;}
  if(S.view==='share'&&S.card){if(p.dataset.sig!=='share'){p.dataset.sig='share';renderShare(p);}else{const l=$('#cx-slist');if(l)l.innerHTML=shareRows();}return;}
  const rows=convList().map(({u,m})=>{
    const n=unreadFrom(u.usuario),typing=S.typing.some(x=>lc(x)===lc(u.usuario));

    return `<button type="button" class="cx-row${n?' unread':''}" data-con="${esc(u.usuario)}">${avatar(u)}<span class="cx-mid"><b>${esc(u.usuario)}<i class="cx-dot${dotCls(u)}" title="${esc(estTxt(u))}"></i>${u.estado&&u.estado.g?'<em class="cx-st">🎮</em>':''}</b><small>${sub}</small></span><span class="cx-end">${m?`<small>${hora(m.t)}</small>`:''}${n?`<span class="cx-n">${n}</span>`:''}</span></button>`;
  }).join('')||'<p class="cx-dim cx-pad">Todavía no hay otras cuentas. Cuando tus amigos se creen una, aparecen acá.</p>';
  if(p.dataset.sig==='list'&&$('#cx-frase')){$('.cx-list').innerHTML=rows;modeBtns();return;}
  p.dataset.sig='list';
  const a2=acct(),mine=userOf(S.me)||{},canAsk='Notification' in window&&Notification.permission==='default'&&!/iPhone|iPad/.test(navigator.userAgent);

      <input id="cx-frase" maxlength="60" placeholder="Tu frase (la ven tus amigos)" value="${esc(ST.frase??mine.frase??'')}"></div></div>

/* Perfil de un jugador: nivel, rangos, medallas y récords. */

function invSheet(){return `<div class="cx-sheet"><b>¿A qué jugamos con ${esc(S.invFor)}?</b><button type="button" data-a="inv" data-g="bloquear">🧱 BloqueAR</button><button type="button" data-a="inv" data-g="poblar">🏘️ PoblAR</button><button type="button" data-a="inv" data-g="estancia">🐎 Malón en EstanciAR</button><button type="button" class="cx-ghost" data-a="invx">Cancelar</button></div>`;}
/* Compartir una partida: elegís a quién y le llega como tarjeta con un botón para jugar. */
function shareRows(){return convList().map(({u})=>`<button type="button" class="cx-row" data-a="sharecon" data-u="${esc(u.usuario)}"${u.pub?'':' disabled'}>${avatar(u)}<span class="cx-mid"><b>${esc(u.usuario)}<i class="cx-dot${dotCls(u)}"></i></b><small>${u.pub?esc(estTxt(u)):'Todavía no puede leer mensajes'}</small></span></button>`).join('');}
function renderShare(p){

function cardHtml(c,btn,id){const ic={bloquear:'🧱',poblar:'🏘️',estancia:'🐎',pampa:'🗺️'}[c.j]||'🎮';
  return `<b>${ic} ${esc(c.t||'')}</b>${c.d?`<span>${esc(c.d)}</span>`:''}${c.r?`<span class="cx-cr">${esc(c.r)}</span>`:''}${btn&&H.play?`<button type="button" class="cx-cplay" data-a="cardplay" data-id="${esc(id)}">▶ Jugar</button>`:''}`;}
function head(t,extra=''){return `<div class="cx-head"><h2>${t}</h2>${extra}<button type="button" class="cx-x" data-a="cerrar" aria-label="Cerrar">✕</button></div>`;}
function renderConv(p){
  const sig=[S.con,S.msgs.length,S.typing.join(','),JSON.stringify(S.vistos),S.err,S.pickFor,S.invFor,Object.keys(S.plain).length,(userOf(S.con)||{}).enLinea,JSON.stringify((userOf(S.con)||{}).estado),(userOf(S.con)||{}).pub?1:0].join('|');
  if(p.dataset.sig===sig&&$('#cx-msgs'))return;p.dataset.sig=sig;
  const u=userOf(S.con)||{usuario:S.con,avatar:'🙂',color:'#93a1b6'},me=lc(S.me),con=lc(S.con);
  const list=S.msgs.filter(m=>(lc(m.de)===me&&lc(m.para)===con)||(lc(m.de)===con&&lc(m.para)===me));
  const reacs={};for(const m of list)if(m.tipo==='reac'&&m.ref){const o=S.plain[m.id];(reacs[m.ref]=reacs[m.ref]||{})[lc(m.de)]=o&&o.e||'';}
  const typing=S.typing.some(x=>lc(x)===con),status=typing?'escribiendo…':estTxt(u);
  let html='',lastDay='',lastMine=null;
  for(const m of list){if(m.tipo==='reac')continue;
    const d=dia(m.t);if(d!==lastDay){html+=`<div class="cx-day">${esc(d)}</div>`;lastDay=d;}
    const mine=lc(m.de)===me;if(mine)lastMine=m;
    if(m.tipo==='zumbido'){html+=`<div class="cx-zb">${mine?'Le mandaste un zumbido':esc(m.de)+' te mandó un zumbido'} 📳 <small>${hora(m.t)}</small></div>`;continue;}
    const o=S.plain[m.id],txt=o&&o.card?`<div class="cx-card">${cardHtml(o.card,true,m.id)}</div>${o.x?esc(o.x).replace(/\n/g,'<br>'):''}`:o&&typeof o.x==='string'?esc(o.x).replace(/\n/g,'<br>'):'<i>🔒 No se puede leer este mensaje en este dispositivo</i>';
    const R=reacs[m.id]||{},chips=Object.entries(R).filter(([,e])=>e).map(([who,e])=>`<span title="${esc(who)}">${esc(e)}</span>`).join('');
    html+=`<div class="cx-msg${mine?' me':''}" data-id="${esc(m.id)}"><div class="cx-bub" data-a="reac" data-id="${esc(m.id)}">${txt}<small>${hora(m.t)}</small></div>${chips?`<div class="cx-reacs">${chips}</div>`:''}${S.pickFor===m.id?`<div class="cx-pick">${REACS.map(e=>`<button type="button" data-a="dar" data-id="${esc(m.id)}" data-e="${e}">${e}</button>`).join('')}</div>`:''}</div>`;
  }
  if(lastMine&&(S.vistos[u.usuario]||S.vistos[S.con]||0)>=lastMine.t)html+=`<div class="cx-seen">Visto</div>`;
  if(typing)html+=`<div class="cx-msg"><div class="cx-bub cx-dots"><i></i><i></i><i></i></div></div>`;

  p.innerHTML=`<div class="cx-head cx-chead"><button type="button" class="cx-back" data-a="volver" aria-label="Volver a la lista">‹</button><button type="button" class="cx-whob" data-a="perfil" data-u="${esc(u.usuario)}" aria-label="Ver el perfil de ${esc(u.usuario)}">${avatar(u)}<span class="cx-who"><b>${esc(u.usuario)}</b><small class="${typing?'cx-typing':''}">${esc(status)}</small></span></button>
    ${H.invite?`<button type="button" class="cx-zbtn" data-a="invitar" data-u="${esc(u.usuario)}" aria-label="Invitar a jugar" title="Invitar a jugar">🎮</button>`:''}<button type="button" class="cx-zbtn" data-a="zumbido" aria-label="Mandar un zumbido" title="Mandar un zumbido">📳</button><button type="button" class="cx-x" data-a="cerrar" aria-label="Cerrar">✕</button></div>
    <div class="cx-msgs" id="cx-msgs">${html||`<p class="cx-dim cx-pad">${can?`Mandale el primer mensaje a ${esc(u.usuario)}.`:`${esc(u.usuario)} todavía no entró con su cuenta desde que existe el chat. Cuando entre, le vas a poder escribir. Mientras, le podés mandar un zumbido 📳.`}</p>`}</div>
    ${S.err?`<p class="cx-err cx-pad">${esc(S.err)}</p>`:''}
    ${S.invFor?invSheet():''}
    <div class="cx-bar"><textarea id="cx-in" rows="1" maxlength="1000" placeholder="${can?'Escribí un mensaje':'Todavía no te puede leer'}"${can?'':' disabled'}></textarea><button type="button" class="cx-send" data-a="enviar" aria-label="Enviar"${can?'':' disabled'}>➤</button></div>`;
  const box=$('#cx-msgs');box.scrollTop=box.scrollHeight;

function markRead(n){const t=lastFrom(n);if(t>(S.read[lc(n)]||0)){S.read[lc(n)]=t;saveRead();badges();}}
async function onClick(e){
  const b=e.target.closest('[data-a],[data-con]');if(!b)return;
  if(b.dataset.con&&!b.dataset.a){S.con=b.dataset.con;S.view='conv';S.pickFor=null;S.invFor=null;S.err='';render();poll();return;}
  const a=b.dataset.a;
  if(a==='cerrar')close();
  else if(a==='volver'){if(S.view==='perfil'&&S.con){S.view='conv';}else{S.view='list';S.con=null;}S.pickFor=null;S.invFor=null;S.card=null;render();}
  else if(a==='modo'){ST.m=b.dataset.m;ls.set('bloques-chat-modo',ST.m);modeBtns();poll();}
  else if(a==='perfil')openProfile(b.dataset.u);
  else if(a==='invitar'){S.invFor=b.dataset.u;$('.cx-panel').dataset.sig='';render();}
  else if(a==='invx'){S.invFor=null;$('.cx-panel').dataset.sig='';render();}
  else if(a==='inv'){const who=S.invFor,g=b.dataset.g;S.invFor=null;close();try{H.invite&&H.invite(g,who);}catch(_){}}
  else if(a==='sharecon')shareTo(b.dataset.u);
  else if(a==='cardplay'){const o=S.plain[b.dataset.id];if(o&&o.card&&H.play){close();try{H.play(o.card);}catch(_){}}}
  else if(a==='cuenta'){close();H.account();}
  else if(a==='activar')activate();
  else if(a==='reset')activate(true);
  else if(a==='enviar')send();
  else if(a==='zumbido')buzz();
  else if(a==='permiso'){try{await Notification.requestPermission();}catch(_){}render();}
  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);
}
// Abre (o crea) la llave del chat con el PIN. Se llama sola al entrar a la cuenta, así a cualquiera
// le pueden escribir aunque nunca haya abierto el chat.
async function ensureKey(pin,reset=false){
  if(!cs||!acct())return false;
  loadLocal();if(S.key&&!reset)return true;
  const j=await call(auth({accion:'llave'}));
  let local;
  if(j.llave&&!reset){local=await openRemote(JSON.parse(j.llave),pin);}
  else{const k=await newKeyPair(pin);await call(auth({accion:'llave',pin,llave:JSON.stringify(k.remote),reemplazar:reset||undefined}));local=k.local;}
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(reset=false){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  const err=t=>{S.err=t;const el=$('#cx-err');if(el)el.textContent=t;};
  if(!/^\d{4,6}$/.test(pin)){err('El PIN tiene de 4 a 6 números.');return;}
  err('Abriendo…');
  try{
    try{await ensureKey(pin,reset);}catch(e){if(e&&e.name==='OperationError'){err('PIN incorrecto.');const b=$('#cx-reset');if(b)b.hidden=false;return;}throw e;}
    S.err='';$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();poll();
  }catch(e){err(String(e.message||e).replace('Acción desconocida.','Para usar el chat hay que actualizar la planilla a la versión 5.'));}
}
async function send(){
  const ta=$('#cx-in');if(!ta||!S.con)return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const tmp={id:'tmp'+Date.now(),de:S.me,para:S.con,tipo:'msg',cont:'',ref:'',t:Date.now(),tmp:true};S.plain[tmp.id]={x:txt};S.msgs.push(tmp);render();
  try{
    const cont=await seal(S.con,{x:txt});const j=await call(auth({accion:'enviar',para:S.con,tipo:'msg',cont}));
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    const m={id:j.id,de:S.me,para:S.con,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:txt};saveMsgs();S.err='';
  }catch(e){const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);S.err=String(e.message||e);ta.value=txt;}
  render();
}
async function shareTo(name){
  const c=S.card;if(!c)return;const note=String(($('#cx-snote')||{}).value||'').trim().slice(0,200);
  try{const cont=await seal(name,{x:note,card:c});const j=await call(auth({accion:'enviar',para:name,tipo:'msg',cont}));
    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();
    S.card=null;S.con=name;S.view='conv';S.err='';$('.cx-panel').dataset.sig='';render();}
  catch(e){S.err=String(e.message||e);const el=$('.cx-panel');if(el){el.dataset.sig='';}render();}
}
function share(card){ensureDom();S.card=card;S.view='share';S.open=true;$('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;$('.cx-panel').dataset.sig='';try{H.onOpen();}catch(_){}render();loadUsers().then(()=>{if(S.view==='share')render();});}
async function buzz(){
  if(!S.con)return;if(Date.now()-S.zbAt<8000){S.err='Esperá un poquito para mandar otro zumbido.';render();return;}
  S.zbAt=Date.now();shake();beep('zumbido');
  try{const j=await call(auth({accion:'enviar',para:S.con,tipo:'zumbido'}));S.msgs.push({id:j.id,de:S.me,para:S.con,tipo:'zumbido',cont:'',ref:'',t:j.t});saveMsgs();S.err='';}
  catch(e){S.err=String(e.message||e);}
  render();
}
async function react(id,e){
  S.pickFor=null;const m=S.msgs.find(x=>x.id===id);if(!m)return;
  const mine=S.msgs.filter(x=>x.tipo==='reac'&&x.ref===id&&lc(x.de)===lc(S.me)).pop(),cur=mine&&S.plain[mine.id]&&S.plain[mine.id].e;
  const val=cur===e?'':e;
  try{const cont=await seal(S.con,{e:val});const j=await call(auth({accion:'enviar',para:S.con,tipo:'reac',cont,ref:id}));
    const r={id:j.id,de:S.me,para:S.con,tipo:'reac',cont,ref:id,t:j.t};S.msgs.push(r);S.plain[r.id]={e:val};saveMsgs();S.err='';}
  catch(err){S.err=String(err.message||err);}
  render();
}
function open(name){
  ensureDom();S.open=true;S.err=S.unsupported?S.err:'';
  if(name){S.con=name;S.view='conv';}else if(S.view!=='conv')S.view='list';
  $('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;document.documentElement.classList.add('cx-on');
  try{H.onOpen();}catch(_){}
  render();loadUsers().then(render);poll();
}
function close(){
  S.open=false;S.pickFor=null;const p=$('.cx-panel');if(p){p.hidden=true;$('.cx-scrim').hidden=true;}document.documentElement.classList.remove('cx-on');
  try{H.onClose();}catch(_){}schedule();
}

  ls.set('estancia-listos',JSON.stringify(E.items.map(i=>i.crop?i.crop.at+SEEDS[i.crop.k].time:CAT[i.k].prod?(i.at||0)+CAT[i.k].prod.every:0).filter(Boolean)));}

function tick(now=Date.now()){
  let ch=false;E.t=now;
  while(E.cola.length){if(!E.colaT)E.colaT=now;const q=E.cola[0];if(now-E.colaT>=TT[q.k].time){E.colaT+=TT[q.k].time;E.cola.shift();E.tropas[q.k]=(E.tropas[q.k]||0)+1;ch=true;}else break;}

function poly(g,pts,fill,stroke,lw){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}

function box(g,x,y,w,h,z0,hh,top,left,right,edge){

}

function roof(g,x,y,w,h,z0,rh,front,back,gable,lines){

}

function faceL(g,Y,u0,u1,z0,z1,col){poly(g,[P(u0,Y,z0),P(u1,Y,z0),P(u1,Y,z1),P(u0,Y,z1)],col);}

// Encuadre: lo que hay construido (o un terreno entero), entre los marcadores de arriba y los botones de abajo.
const SHORT=()=>W>Hh&&Hh<520;
function focusBox(b,maxZ=1.1){const m=SHORT()?{t:52,b:10,l:8,r:86}:{t:56,b:98,l:8,r:8},aw=W-m.l-m.r,ah=Hh-m.t-m.b;
  cam.z=clamp(Math.min(aw/(b.r-b.l),ah/(b.b-b.t)),.25,maxZ);
  cam.x=(b.l+b.r)/2-((m.l+aw/2)-W/2)/cam.z;cam.y=(b.t+b.b)/2-((m.t+ah/2)-Hh/2)/cam.z;clampCam();}
function landBox(own){return {l:P(own.x0,own.y1)[0],r:P(own.x1,own.y0)[0],t:P(own.x0,own.y0,40)[1],b:P(own.x1,own.y1)[1]};}
function focusLand(own,pad=1.5){
  if(own){focusBox(landBox(own),1.2);return;}
  const list=VISIT?VISIT.items:E.items;if(!list.length){focusBox(landBox(land()));return;}
  let b={l:1e9,r:-1e9,t:1e9,b:-1e9};for(const it of list){const c=CAT[it.k];b.l=Math.min(b.l,P(it.x,it.y+c.h)[0]);b.r=Math.max(b.r,P(it.x+c.w,it.y)[0]);b.t=Math.min(b.t,P(it.x,it.y,(c.H||0)+20)[1]);b.b=Math.max(b.b,P(it.x+c.w,it.y+c.h)[1]);}
  b.l-=pad*HW;b.r+=pad*HW;b.t-=pad*HH;b.b+=pad*HH;
  if(W<520){const c=(b.l+b.r)/2,hw=Math.min((b.r-b.l)/2,(W-16)/2/.7);b.l=c-hw;b.r=c+hw;}
  // que nunca quede más chico que medio terreno, para que se vea dónde construir
  const lb=landBox(land()),minW=(lb.r-lb.l)*.6;if(b.r-b.l<minW){const c=(b.l+b.r)/2;b.l=c-minW/2;b.r=c+minW/2;}
  focusBox(b);}
function clampCam(){const m=P(NX/2,NY/2);cam.z=clamp(cam.z,.22,1.8);cam.x=clamp(cam.x,m[0]-NX*HW,m[0]+NX*HW);cam.y=clamp(cam.y,m[1]-NY*HH-80,m[1]+NY*HH);}
function toTile(cx,cy){const r=cv.getBoundingClientRect(),wx=(cx-r.left-W/2)/cam.z+cam.x,wy=(cy-r.top-Hh/2)/cam.z+cam.y;return {x:(wx/HW+wy/HH)/2,y:(wy/HH-wx/HW)/2,wx,wy};}
// Qué cosa tocaste: la que está más adelante, contando lo alto (árboles, torres).
function hitItem(cx,cy,list=E.items){const p=toTile(cx,cy);let best=null;
  for(const it of list){const c=CAT[it.k];let inside=p.x>=it.x&&p.x<it.x+c.w&&p.y>=it.y&&p.y<it.y+c.h;
    if(!inside&&c.H>14){const l=P(it.x,it.y+c.h)[0],rr=P(it.x+c.w,it.y)[0],top=P(it.x,it.y,c.H+10)[1],mid=P(it.x+c.w/2,it.y+c.h/2)[1];inside=p.wx>=l+6&&p.wx<=rr-6&&p.wy>=top&&p.wy<=mid;}
    if(inside&&(!best||(!c.flat&&(CAT[best.k].flat||depth(it)>depth(best)))))best=it;}
  return {it:best,fx:p.x,fy:p.y};}
function fits(k,x,y,ignore,list=E.items,own=land()){const c=CAT[k];if(x<own.x0||y<own.y0||x+c.w>own.x1||y+c.h>own.y1)return false;
  return !list.some(o=>o.id!==ignore&&x<o.x+CAT[o.k].w&&x+c.w>o.x&&y<o.y+CAT[o.k].h&&y+c.h>o.y);}
/* Gestos: arrastrar mueve la cámara, pellizcar o la ruedita acerca, tocar elige. */
const PTR=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId);}catch(_){}PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(PTR.size===1){gest={sx:e.clientX,sy:e.clientY,cx:cam.x,cy:cam.y,moved:false,drag:null};
    if(GHOST){const h=toTile(e.clientX,e.clientY),c=CAT[GHOST.k];if(h.x>=GHOST.x-.6&&h.x<GHOST.x+c.w+.6&&h.y>=GHOST.y-.6&&h.y<GHOST.y+c.h+.6)gest.drag='ghost';}
    if(BAT&&!BAT.over){gest.drag='deploy';deployAt(e.clientX,e.clientY);gest.last={x:e.clientX,y:e.clientY};}}
  else if(PTR.size===2){const [a,b]=[...PTR.values()];gest={pinch:Math.hypot(a.x-b.x,a.y-b.y),z:cam.z,mx:(a.x+b.x)/2,my:(a.y+b.y)/2,cx:cam.x,cy:cam.y,moved:true};}
});
cv.addEventListener('pointermove',e=>{if(!PTR.has(e.pointerId)||!gest)return;PTR.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.pinch){if(PTR.size<2)return;const [a,b]=[...PTR.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;cam.z=clamp(gest.z*d/gest.pinch,.22,1.8);cam.x=gest.cx-(mx-gest.mx)/cam.z;cam.y=gest.cy-(my-gest.my)/cam.z;clampCam();return;}
  const dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;if(Math.hypot(dx,dy)>8)gest.moved=true;
  if(gest.drag==='ghost'){const h=toTile(e.clientX,e.clientY),c=CAT[GHOST.k];GHOST.x=Math.round(h.x-c.w/2);GHOST.y=Math.round(h.y-c.h/2);renderPlace();return;}
  if(gest.drag==='deploy'){if(gest.last&&Math.hypot(e.clientX-gest.last.x,e.clientY-gest.last.y)<22)return;deployAt(e.clientX,e.clientY);gest.last={x:e.clientX,y:e.clientY};return;}
  if(gest.moved){cam.x=gest.cx-dx/cam.z;cam.y=gest.cy-dy/cam.z;clampCam();}
});
function ptrEnd(e){if(!PTR.has(e.pointerId))return;PTR.delete(e.pointerId);if(PTR.size===0&&gest){if(!gest.moved&&!gest.pinch&&!gest.drag)tap(e.clientX,e.clientY);gest=null;}}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();const before=toTile(e.clientX,e.clientY);cam.z=clamp(cam.z*(e.deltaY<0?1.12:1/1.12),.22,1.8);const after=toTile(e.clientX,e.clientY);cam.x+=before.wx-after.wx;cam.y+=before.wy-after.wy;clampCam();},{passive:false});

/* ───────── Tocar ───────── */
function tap(cx,cy){
  if(BAT)return;
  if(VISIT){const h=hitItem(cx,cy,VISIT.items);if(h.it)toast(`${CAT[h.it.k].e} ${CAT[h.it.k].n} de ${VISIT.name}`);return;}
  if(MODE==='place'||MODE==='move'){
    if(GHOST){const h=toTile(cx,cy),c=CAT[GHOST.k];GHOST.x=Math.round(h.x-c.w/2);GHOST.y=Math.round(h.y-c.h/2);renderPlace();return;}
    const h=hitItem(cx,cy);if(h.it&&h.it.k!=='casco'){GHOST={...h.it};renderPlace();}else if(h.it)toast('El casco se queda en su lugar.');return;}
  const it=hitItem(cx,cy).it;
  if(!it){SEL=null;closePop();return;}
  const c=CAT[it.k];
  if(it.k==='parcela'){if(cropReady(it)){harvest(it);return;}if(!it.crop){SEL=it.id;openSeeds(it);return;}}
  if(c.prod&&prodReady(it)){collectProd(it);return;}
  SEL=it.id;openPop(it);
}
function floatAt(it,txt,col){const c=CAT[it.k];FLOATS.push({x:it.x+c.w/2,y:it.y+c.h/2,txt,col,t:performance.now()});}
function flyCoin(it,n){const c=CAT[it.k],p=P(it.x+c.w/2,it.y+c.h/2,30),r=cv.getBoundingClientRect(),sx=r.left+W/2+(p[0]-cam.x)*cam.z,sy=r.top+Hh/2+(p[1]-cam.y)*cam.z;
  const tgt=document.querySelector('.pill.coin .ic');if(!tgt)return;const tr=tgt.getBoundingClientRect();
  for(let i=0;i<Math.min(5,1+Math.floor(n/40));i++){const d=document.createElement('div');d.className='fly';d.textContent='🪙';d.style.left=(sx-11+i*4)+'px';d.style.top=(sy-11)+'px';document.body.appendChild(d);
    setTimeout(()=>{d.style.transform=`translate(${tr.left-sx+2}px,${tr.top-sy+2}px) scale(.7)`;d.style.opacity='.4';},30+i*60);setTimeout(()=>d.remove(),900+i*60);}}
function harvest(it,silent){const S=SEEDS[it.crop.k];E.pesos+=S.gain;it.crop=null;if(!silent){floatAt(it,`+${S.gain} 🪙`);flyCoin(it,S.gain);sfx('harvest');}addXp(S.xp,silent);
  if(E.tut===0)E.tut=1;save();renderAll();return S.gain;}
function collectProd(it,silent){const p=CAT[it.k].prod;E.pesos+=p.gain;it.at=Date.now();if(!silent){floatAt(it,`+${p.gain} 🪙`);flyCoin(it,p.gain);sfx('collect');}addXp(p.xp,silent);save();renderAll();return p.gain;}
function plantIn(it,k){const S=SEEDS[k];if(E.pesos<S.cost){toast('No te alcanza la plata.');sfx('nope');return false;}E.pesos-=S.cost;it.crop={k,at:Date.now()};if(E.tut<=1)E.tut=2;return true;}

/* ───────── Panel de lo tocado ───────── */
let popTimer=0;
function openPop(it){
  const c=CAT[it.k],now=Date.now();let body='',acts='';
  if(it.k==='parcela'&&it.crop){const S=SEEDS[it.crop.k],f=clamp((now-it.crop.at)/S.time,0,1);
    body=`<p>${S.e} ${S.n}: falta <b data-left="${it.crop.at+S.time}">${dur(it.crop.at+S.time-now)}</b> · da ${S.gain} 🪙</p><div class="bar"><i data-bar="${it.crop.at}|${S.time}" style="width:${f*100}%"></i></div>`;
    acts=`<button class="btn" data-a="move">↔ Mover</button><button class="btn red" data-a="clear">Arrancar</button>`;}
  else if(c.prod){const f=clamp((now-(it.at||0))/c.prod.every,0,1);
    body=`<p>${c.prod.e} Da ${c.prod.n} (${c.prod.gain} 🪙) cada ${dur(c.prod.every)}. Falta <b data-left="${(it.at||0)+c.prod.every}">${dur((it.at||0)+c.prod.every-now)}</b>.</p><div class="bar"><i data-bar="${it.at||0}|${c.prod.every}" style="width:${f*100}%"></i></div>`;
    acts=`<button class="btn" data-a="move">↔ Mover</button><button class="btn" data-a="sell">Vender (${fmt(sellValue(it))} 🪙)</button>`;}
  else if(it.k==='casco'){const nx=CASCO_UP[E.casco+1];
    body=`<p>Tu terreno: ${LAND[E.casco]}×${LAND[E.casco]}. ${nx?`Ampliarlo a ${LAND[E.casco+1]}×${LAND[E.casco+1]} cuesta ${fmt(nx.cost)} 🪙${E.lv<nx.lv?` y pide nivel ${nx.lv}`:''}.`:'Ya es lo más grande.'}</p>`;
    acts=nx?`<button class="btn go" data-a="expand"${E.lv<nx.lv||E.pesos<nx.cost?' disabled':''}>Ampliar el campo</button>`:'';}
  else if(it.k==='corral'){body=`<p>Tropa: ${TORDER.filter(k=>E.tropas[k]).map(k=>`${E.tropas[k]} ${TT[k].e}`).join(' · ')||'ninguna'}${E.cola.length?` · entrenando ${E.cola.length}`:''}.</p>`;
    acts=`<button class="btn" data-a="move">↔ Mover</button><button class="btn go" data-a="train">Entrenar</button>`;}
  else{body=`<p>${c.desc}</p>`;acts=`<button class="btn" data-a="move">↔ Mover</button><button class="btn" data-a="sell">Vender (${fmt(sellValue(it))} 🪙)</button>`;}
  $('pop').innerHTML=`<button class="x" data-a="x" aria-label="Cerrar">✕</button><h3>${c.e} ${c.n}${it.k==='casco'?` <small>nivel ${E.casco}</small>`:''}</h3>${body}${acts?`<div class="row">${acts}</div>`:''}`;
  $('pop').hidden=false;$('tools').style.visibility='hidden';$('harvest-all').hidden=true;
  $('pop').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='x'){SEL=null;closePop();}
    else if(a==='move'){SEL=null;closePop();MODE='move';GHOST={...it};renderPlace();}
    else if(a==='sell'){const v=sellValue(it);E.items=E.items.filter(o=>o!==it);E.pesos+=v;sfx('collect');toast(`Vendiste ${c.n.toLowerCase()} por ${fmt(v)} 🪙`);SEL=null;closePop();save();renderAll();}
    else if(a==='clear'){it.crop=null;SEL=null;closePop();save();renderAll();}
    else if(a==='expand'){const nx=CASCO_UP[E.casco+1];if(E.pesos<nx.cost||E.lv<nx.lv)return;E.pesos-=nx.cost;E.casco++;sfx('level');addXp(40);save();SEL=null;closePop();focusLand();toast(`🏡 ¡Campo más grande! Ahora es de ${LAND[E.casco]}×${LAND[E.casco]}.`);renderAll();}
    else if(a==='train'){SEL=null;closePop();openCorral();}};
  clearInterval(popTimer);popTimer=setInterval(()=>{if($('pop').hidden){clearInterval(popTimer);return;}const n=Date.now();
    $('pop').querySelectorAll('[data-left]').forEach(x=>{const l=Number(x.dataset.left)-n;x.textContent=l>0?dur(l):'¡listo!';});
    $('pop').querySelectorAll('[data-bar]').forEach(x=>{const [a,b]=x.dataset.bar.split('|').map(Number);x.style.width=clamp((n-a)/b,0,1)*100+'%';});
    if(cropReady(it)||prodReady(it)){SEL=null;closePop();}},500);
}
function closePop(){$('pop').hidden=true;$('tools').style.visibility='';renderTools();}
const sellValue=it=>Math.floor((CAT[it.k].cost||0)/2);

/* ───────── Sembrar ───────── */
function openSeeds(it){
  const empty=E.items.filter(i=>i.k==='parcela'&&!i.crop).length;
  sheet('¿Qué sembramos?',`<p class="note">Cuando esté lista, tocala para cosechar.</p>
    ${SORDER.map(k=>{const S=SEEDS[k],lock=E.lv<S.lv,ok=!lock&&E.pesos>=S.cost;return `<button class="item" data-s="${k}"${ok?'':' disabled'}><span class="ic">${S.e}</span><span class="tx"><b>${S.n}</b><small>${lock?`Se desbloquea en el nivel ${S.lv}`:`Tarda ${dur(S.time)} · da ${S.gain} 🪙 · ${S.xp} XP`}</small></span><span class="btn gold" style="display:grid;place-items:center">${S.cost} 🪙</span></button>`;}).join('')}
    ${empty>1?`<label class="note" style="display:flex;gap:8px;align-items:center;font-size:14px;color:#5b4a37"><input type="checkbox" id="s-all" checked style="width:20px;height:20px"> Sembrar en las ${empty} parcelas vacías</label>`:''}`);
  document.querySelectorAll('#sheet [data-s]').forEach(b=>b.onclick=()=>{const k=b.dataset.s,all=$('s-all')&&$('s-all').checked;let n=0;
    const targets=all?E.items.filter(i=>i.k==='parcela'&&!i.crop):[it];for(const p of targets){if(!plantIn(p,k))break;n++;}
    if(n){sfx('plant');closeSheet();SEL=null;save();renderAll();if(n>1)toast(`Sembraste ${n} parcelas de ${SEEDS[k].n.toLowerCase()}`);}});
}

/* ───────── Tienda ───────── */
let SHOPTAB='granja';
function openShop(tab=SHOPTAB){SHOPTAB=tab;if(E.tut===2)E.tut=3;
  const keys=Object.keys(CAT).filter(k=>CAT[k].cat===tab);
  sheet('Tienda',`<div class="grid">${keys.map(k=>{const c=CAT[k],lock=E.lv<c.lv,mx=c.max?c.max(E.lv):99,full=count(k)>=mx,ok=!lock&&!full&&E.pesos>=c.cost;
    return `<button class="card${lock?' lock':''}" data-k="${k}"${ok?'':' disabled'}><canvas data-prev="${k}" width="280" height="192"></canvas><span class="tx"><b>${c.n}</b><small>${lock?`Se desbloquea en el nivel ${c.lv}`:full?`Ya tenés ${count(k)} de ${mx}`:c.desc}</small><span class="price">${lock?'🔒':fmt(c.cost)+' 🪙'}</span></span></button>`;}).join('')}</div>`,
    `<div class="tabs">${SHOP_TABS.map(([k,n])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${n}</button>`).join('')}</div>`);
  document.querySelectorAll('#sheet [data-tab]').forEach(b=>b.onclick=()=>openShop(b.dataset.tab));
  document.querySelectorAll('#sheet canvas[data-prev]').forEach(drawPreview);
  document.querySelectorAll('#sheet [data-k]').forEach(b=>b.onclick=()=>{closeSheet();startPlace(b.dataset.k);});
}
// Dibujito de cada cosa en la tienda.
function drawPreview(c){const k=c.dataset.prev,g=c.getContext('2d'),C=CAT[k];
  const wpx=(C.w+C.h)*HW,hpx=(C.w+C.h)*HH+(C.H||0)+10,s=Math.min(2.2,Math.min(240/wpx,165/hpx));
  const mid=P(C.w/2,C.h/2);
  g.setTransform(s,0,0,s,140-mid[0]*s,180-P(C.w,C.h)[1]*s);
  const it={id:3,k,x:0,y:0,at:Date.now(),crop:k==='parcela'?{k:'maiz',at:0}:null};
  if(C.flat)poly(g,[P(0,0),P(1,0),P(1,1),P(0,1)],'#d8b98a','#b8976a',2);else ART[k](g,it,1,[it]);}
function startPlace(k){const c=CAT[k],own=land();SEL=null;MODE='place';
  const r=cv.getBoundingClientRect(),ct=toTile(r.left+W/2,r.top+Hh/2);let best=null,bd=1e9;
  for(let y=own.y0;y<=own.y1-c.h;y++)for(let x=own.x0;x<=own.x1-c.w;x++)if(fits(k,x,y)){const d=Math.hypot(x+c.w/2-ct.x,y+c.h/2-ct.y);if(d<bd){bd=d;best={x,y};}}
  GHOST={k,x:best?best.x:own.x0,y:best?best.y:own.y0,id:-1};renderPlace();renderAll();
  if(!best)toast('No hay lugar libre: ampliá el campo o vendé algo.');}
function renderPlace(){const on=MODE==='place'||MODE==='move';$('placebar').hidden=!on;$('tools').style.display=on?'none':'';if(on)$('harvest-all').hidden=true;
  if(!on)return;
  if(!GHOST){$('hint').textContent='Tocá lo que quieras mover';$('pl-ok').textContent='Listo';$('pl-ok').disabled=false;return;}
  const ok=fits(GHOST.k,GHOST.x,GHOST.y,GHOST.id);$('pl-ok').disabled=!ok;$('pl-ok').textContent=MODE==='place'?`Poner acá · ${fmt(CAT[GHOST.k].cost)} 🪙`:'Dejar acá';
  $('hint').textContent=ok?'Arrastralo o tocá donde va':'Ahí no entra: buscá un lugar libre';}
$('pl-no').onclick=()=>{if(MODE==='move'&&GHOST){GHOST=null;renderPlace();return;}GHOST=null;MODE='farm';renderPlace();renderAll();};
$('pl-ok').onclick=()=>{
  if(!GHOST){MODE='farm';renderPlace();renderAll();return;}
  if(!fits(GHOST.k,GHOST.x,GHOST.y,GHOST.id))return;
  if(MODE==='move'){const it=E.items.find(i=>i.id===GHOST.id);if(it){it.x=GHOST.x;it.y=GHOST.y;}GHOST=null;sfx('plant');save();renderPlace();return;}
  const c=CAT[GHOST.k];if(E.pesos<c.cost){toast('No te alcanza la plata.');sfx('nope');return;}
  E.pesos-=c.cost;const it={id:E.nextId++,k:GHOST.k,x:GHOST.x,y:GHOST.y};if(c.prod)it.at=Date.now();E.items.push(it);addXp(c.xp||2);sfx('build');floatAt(it,`-${fmt(c.cost)} 🪙`,'#ffd34d');save();
  // los baratos (parcelas, caminos, alambrados, flores) se ponen de a varios
  const mx=c.max?c.max(E.lv):99;if(c.cost<=40&&E.pesos>=c.cost&&count(c.k)<mx){const k=GHOST.k;GHOST={k,x:GHOST.x+c.w,y:GHOST.y,id:-1};if(!fits(k,GHOST.x,GHOST.y))startPlace(k);renderPlace();renderHud();return;}
  GHOST=null;MODE='farm';renderPlace();renderAll();};

/* ───────── Corral ───────── */
function openCorral(){
  if(!count('corral')){sheet('Tropa',`<p>Para entrenar gauchos necesitás un <b>corral de gauchos</b>. ${E.lv<CAT.corral.lv?`Se desbloquea en el nivel ${CAT.corral.lv}.`:'Está en la Tienda › Defensa.'}</p>`);return;}
  const cap=troopCap(),used=troopsUsed();
  sheet('Corral de gauchos',`<p>Lugar: <b>${used}/${cap}</b> (sube con tu nivel).</p>
    ${TORDER.map(k=>{const T=TT[k],lock=E.lv<T.lv,ok=!lock&&used+T.space<=cap&&E.pesos>=T.cost;return `<div class="item"><span class="ic">${T.e}</span><span class="tx"><b>${T.n} · tenés ${E.tropas[k]||0}</b><small>${lock?`Se desbloquea en el nivel ${T.lv}`:`${T.desc} · ${dur(T.time)}`}</small></span><button class="btn gold" data-t="${k}"${ok?'':' disabled'}>${T.cost} 🪙</button></div>`;}).join('')}
    ${E.cola.length?`<p class="note">Entrenando: ${E.cola.map(q=>TT[q.k].e).join(' ')} · el próximo sale en ${dur(TT[E.cola[0].k].time-(Date.now()-(E.colaT||Date.now())))}</p>`:''}`);
  document.querySelectorAll('#sheet [data-t]').forEach(b=>b.onclick=()=>{const k=b.dataset.t,T=TT[k];if(troopsUsed()+T.space>troopCap()||E.pesos<T.cost)return;E.pesos-=T.cost;if(!E.cola.length)E.colaT=Date.now();E.cola.push({k});sfx('plant');save();renderHud();openCorral();});
}

/* ───────── Regalos ───────── */
function openGifts(){takePremios();
  if(!E.regalos.length){sheet('Regalos',`<div class="big">🎁</div><p class="center">Cada partida que jugás en <b>BloqueAR</b> y <b>PoblAR</b> te deja un regalo para la estancia. ¡Andá a jugar y volvé!</p>`);return;}
  const tot=E.regalos.reduce((a,r)=>a+r.pesos,0);
