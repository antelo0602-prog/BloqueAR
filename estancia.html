<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>EstanciAR</title>
<style>
/* EstanciAR: tonos de campo. La maqueta es lo que se luce; los controles quedan sobrios (cuero oscuro, bronce y papel). */
:root{--bg:#17140f;--line:#3b3226;--ink:#efe6d2;--aqua:#7ce9e5;--gold:#f6c453;
  --bark:#1e1a14;--bark2:#2a241c;--brass:#c4a265;--brass2:#8a6a3e;--parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;
  --brown:#2a2118;--soft:#7d6d58;--olive:#5f7a3a;--olive2:#4a6030;--clay:#a3482f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--brown);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
/* Barra de arriba: la misma de todos los juegos */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);flex:none;border-bottom:1px solid #2b251c}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;display:flex;align-items:center}.brand span{color:#d9b866}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#d9c79e;border:1px solid #6b5a3e;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#211c15;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0}
.games-btn i{width:7px;height:7px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
/* Campo */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#23271a}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* Marcadores de arriba (nivel, plata, trofeos) */
.hud{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 8px;border-radius:11px;background:rgba(30,26,20,.86);border:1px solid rgba(196,162,101,.32);box-shadow:0 4px 14px rgba(0,0,0,.28);color:var(--ink);font-weight:700;font-size:14.5px;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pill .ic{width:20px;height:20px;display:grid;place-items:center;flex:none}
.pill .ic svg{width:20px;height:20px;display:block}
.pill.lv{gap:8px}.pill.lv .ic{width:auto;height:auto;font:700 12px/1 var(--serif);color:var(--brass);letter-spacing:.02em}
.pill.lv b{font:700 16px/1 var(--serif);color:var(--ink)}
.pill .xp{width:52px;height:4px;border-radius:2px;background:rgba(239,230,210,.16);overflow:hidden}.pill .xp i{display:block;height:100%;background:var(--brass)}
.pill.sm{height:30px;font-size:13px;padding:0 10px}
.hud .sp{flex:1}
.hint{position:absolute;left:50%;top:52px;transform:translateX(-50%);max-width:92%;background:rgba(30,26,20,.9);color:var(--ink);border:1px solid rgba(196,162,101,.28);border-radius:10px;padding:7px 13px;font-weight:600;text-align:center;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);font-size:13.5px}
.hint:empty{display:none}
/* Botonera de abajo: una bandeja de cuero con cuatro herramientas */
.tools{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:2px;padding:5px;border-radius:16px;background:rgba(30,26,20,.9);border:1px solid rgba(196,162,101,.3);box-shadow:0 10px 26px rgba(0,0,0,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.tool{width:74px;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:0;border-radius:11px;padding:0;position:relative;color:var(--ink)}
.tool .b{width:24px;height:24px;display:grid;place-items:center}
.tool .b svg{width:24px;height:24px;display:block;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool small{font-size:11.5px;font-weight:650;letter-spacing:.01em;color:#d9cdb2}
.tool:active,.tool:focus-visible{background:rgba(196,162,101,.16)}
.tool .badge{position:absolute;top:5px;right:14px;min-width:17px;height:17px;border-radius:9px;background:var(--clay);color:#fff3e2;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tool .badge:empty{display:none}
.harvest-all{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));pointer-events:auto;height:40px;padding:0 18px;border-radius:12px;background:linear-gradient(#d4b674,#b89550);border:1px solid #7a5d33;box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,245,215,.45);font-weight:750;font-size:14.5px;color:#2a1f12;font-variant-numeric:tabular-nums}
.harvest-all[hidden]{display:none}
/* Tarjeta de lo que tocaste */
.pop{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(420px,calc(100% - 16px));background:var(--parch);border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.4);padding:12px 14px;display:flex;flex-direction:column;gap:8px;animation:up .2s ease-out}
.pop[hidden]{display:none}
@keyframes up{from{transform:translate(-50%,10px);opacity:.3}}
.pop h3{margin:0;font:700 18px/1.2 var(--serif);display:flex;align-items:baseline;gap:8px;padding-right:36px}.pop h3 small{font:600 12px system-ui,sans-serif;color:var(--soft)}
.pop p{margin:0;color:#4d4031;font-size:14px}
.pop .x{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:9px;border:0;background:var(--parch2);font-size:14px;color:var(--brown)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:44px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.gold{background:linear-gradient(#d4b674,#b89550);border-color:#7a5d33;color:#2a1f12}
.btn.red{background:var(--clay);border-color:#7e3420;color:#fff3e2}
.btn:disabled{opacity:.45}
.bar{height:6px;border-radius:3px;background:#ded1b4;overflow:hidden}.bar i{display:block;height:100%;background:var(--olive)}
/* Hojas que suben desde abajo */
.modal{position:fixed;inset:0;z-index:20;background:rgba(14,11,7,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--parch);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1;color:var(--brown)}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 16px 8px;padding:3px;border-radius:11px;background:var(--parch2);scrollbar-width:none;flex:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;height:34px;padding:0 12px;border-radius:8px;border:0;background:none;font-weight:700;color:#6b5a44}
.tabs button.on{background:#fbf7ee;color:var(--brown);box-shadow:0 1px 3px rgba(60,40,20,.18)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:stretch;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;padding:0;overflow:hidden;text-align:left}
.card canvas{display:block;width:100%;height:96px;background:radial-gradient(ellipse at 50% 78%,#7f9152 0%,#66783f 45%,#4c5832 100%)}
.card .tx{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px}
.card b{font:700 15px/1.2 var(--serif)}.card small{color:var(--soft);font-size:12px;font-weight:500}
.card .price{font-weight:750;font-size:13.5px;color:#7a5a24;font-variant-numeric:tabular-nums}
.card:disabled{opacity:.55;filter:grayscale(.5)}
.card.lock .price{color:var(--soft)}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;text-align:left;width:100%}
.item .ic{font-size:26px;width:40px;text-align:center;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font:700 15.5px/1.25 var(--serif)}.item .tx small{display:block;color:var(--soft);font-size:12.5px;font-weight:500}
.item:disabled{opacity:.5}
.item .btn{flex:none;min-height:40px}
.big{font-size:40px;text-align:center;line-height:1.1}
.co{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-left:.22em;border-radius:50%;background:radial-gradient(circle at 36% 34%,#f0dba2 0 18%,#c9a24a 48%,#94702f 100%);box-shadow:inset 0 0 0 1px rgba(90,64,26,.75)}
.center{text-align:center}
.note{font-size:12.5px;color:var(--soft)}
/* Malón */
.stars{font-size:16px;letter-spacing:1px}.stars i{font-style:normal;opacity:.25}.stars i.on{opacity:1}
.troops{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:4px;padding:5px;border-radius:16px;background:rgba(30,26,20,.9);border:1px solid rgba(196,162,101,.3);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.troop{width:66px;height:62px;border-radius:11px;background:none;border:1px solid transparent;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;padding:0}
.troop span{font-size:24px;line-height:1.1;display:grid;place-items:center;min-height:38px}.troop span svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.uic{display:block}.troop small{font-size:11.5px;color:#d9cdb2;font-variant-numeric:tabular-nums}
.troop.sel{border-color:rgba(196,162,101,.7);background:rgba(196,162,101,.16)}
.troop:disabled{opacity:.4}
.troop.end{background:var(--clay);color:#fff3e2}
.troop .x2{font:800 18px/1 system-ui,-apple-system,sans-serif;letter-spacing:-.02em}.troop.spd.sel .x2{color:#f2c14e}
@media (max-width:380px){.troop{width:56px}.troops{gap:2px;padding:4px}}
/* Menú lateral */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(10,8,5,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#1c1813;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#2a241c;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#231e17;font-weight:650;text-decoration:none;color:var(--ink);font-size:15px}
.side .note{color:#a39276}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(30,26,20,.95);color:var(--ink);border:1px solid rgba(196,162,101,.3);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}
.fly{position:fixed;z-index:25;pointer-events:none;width:18px;height:18px;transition:transform .7s cubic-bezier(.5,-0.3,.7,1),opacity .7s;will-change:transform}
.fly svg{width:18px;height:18px;display:block}
.placebar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;width:min(420px,calc(100% - 16px))}
.placebar[hidden]{display:none}
.placebar .btn{flex:1;min-height:50px;font-size:15.5px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
@media (orientation:landscape) and (max-height:520px){
  .tools{left:auto;right:max(8px,env(safe-area-inset-right));transform:none;top:52px;bottom:auto;flex-direction:column;gap:2px;padding:4px}
  .tool{width:62px;height:50px}.tool small{font-size:10.5px}
  .harvest-all{bottom:12px}.pop{bottom:10px}.troops{left:auto;right:8px;transform:none;top:48px;bottom:auto;flex-direction:column;gap:4px}.troop{width:60px;height:52px}.troop span{font-size:20px}
  .placebar{bottom:8px}.placebar .btn{min-height:44px}
  .hint{top:50px}.toast{bottom:auto;top:100px}}
@media (min-width:760px){.sheet{border-radius:18px;border-bottom:1px solid var(--rule);margin-bottom:24px}.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.sheet,.pop,.side-panel,.toast{animation:none}.fly{transition:none}}
/* v61: cinco herramientas, pedidos, despensa, personaje y mascota */
.tool{width:66px}@media (max-width:380px){.tool{width:60px}.tool small{font-size:10.5px}}
.sh3{margin:6px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.ped{border:1px solid var(--rule);background:#fbf7ee;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}.ped.ok{border-color:var(--olive);box-shadow:0 0 0 1px var(--olive) inset}
.ped-h{display:flex;gap:10px;align-items:center}.ped-av{font-size:28px;width:38px;text-align:center}.ped .tx b{display:block;font:700 15.5px/1.25 var(--serif)}.ped .tx small{font-size:14px;color:#4d4031}.ped .falta{opacity:.45}
.desp{display:flex;flex-wrap:wrap;gap:6px}.desp span{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:9px;background:#fbf7ee;border:1px solid var(--rule);font-size:15px}.desp b{font-size:13px;color:var(--brown)}
.filt{display:flex;align-items:center;gap:8px;font-size:13.5px;color:#5b4a37;font-weight:600}.filt input{width:19px;height:19px}
.card.ofe{border-color:#c9473a;box-shadow:0 0 0 1px #c9473a inset}.card .old{text-decoration:line-through;color:var(--soft);font-weight:500;margin-right:4px}
.pjprev{width:100%;height:auto;aspect-ratio:560/300;border-radius:12px;display:block}
.pjsw{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.pjsw>span{font-size:12.5px;color:var(--soft);width:100%;font-weight:650}
.pjsw .dot{width:30px;height:30px;border-radius:50%;border:2px solid #fbf7ee;box-shadow:0 0 0 1px var(--rule)}.pjsw .dot.on{box-shadow:0 0 0 2px var(--brown)}
.pill2{min-height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--rule);background:#fbf7ee;font-weight:650;font-size:13.5px}.pill2.on{background:var(--brown);color:var(--parch);border-color:var(--brown)}
.pjtabs{margin:4px 0 0}.pjgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pjc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 11px;border-radius:11px;border:1px solid var(--rule);background:#fbf7ee;text-align:left}.pjc b{font:700 14.5px/1.2 var(--serif)}.pjc small{font-size:12px;color:var(--soft)}.pjc.on{border-color:var(--olive);box-shadow:0 0 0 1px var(--olive) inset}.pjc:disabled{opacity:.6}
.campo canvas{width:100%;height:auto;aspect-ratio:560/220;border-radius:12px;background:radial-gradient(ellipse at 50% 60%,#3d4428,#23271a)}.campo{display:flex;flex-direction:column;gap:10px}
.petui{position:fixed;inset:0;z-index:24;background:#17140f;display:flex;flex-direction:column;color:var(--ink)}.petui[hidden]{display:none}
.pet-top{display:flex;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 10px 6px}.pet-top .icon-btn{margin-left:0;font-size:20px}
.pet-name{flex:1;min-width:0;text-align:center}.pet-name b{display:block;font:700 20px/1.2 var(--serif)}.pet-name small{color:#bfae8c;font-size:12.5px}.lnk{background:none;border:0;color:var(--gold);text-decoration:underline;padding:0;font-size:12.5px}
.pet-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:4px 14px 8px}.pb{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:4px 6px}.pb small{grid-column:2;font-size:11px;color:#bfae8c;margin-top:-3px}
.pbar{height:9px;border-radius:5px;background:#2e271e;overflow:hidden}.pbar i{display:block;height:100%;transition:width .4s}
#pet-cv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.pet-msg{position:absolute;left:50%;top:44%;transform:translateX(-50%);background:rgba(30,26,20,.9);border:1px solid rgba(196,162,101,.3);border-radius:10px;padding:6px 12px;font-weight:650;opacity:0;pointer-events:none;max-width:90vw;text-align:center}
.pet-msg.on{animation:petmsg 2.6s ease-out}@keyframes petmsg{0%{opacity:0;transform:translate(-50%,6px)}10%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.pet-acts{display:flex;justify-content:center;gap:6px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:#1e1a14;border-top:1px solid var(--line)}
.pa{flex:1;max-width:84px;min-height:62px;border-radius:12px;border:1px solid var(--line);background:#2a241c;color:var(--ink);font-size:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}.pa small{font-size:11.5px;color:#d9cdb2}.pa.wide{max-width:220px}
.pet-sub{position:absolute;left:8px;right:8px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--parch);color:var(--brown);border-radius:14px;padding:10px 12px;box-shadow:0 12px 30px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:8px;max-height:46%;overflow:auto}.pet-sub[hidden]{display:none}

</style>
<script>
/* ───────── SYNCRO: tu progreso en todos los dispositivos (v63) ─────────
   Va en todas las páginas. Con la cuenta abierta, lo que cada juego guarda en este dispositivo (preferencias,
   partidas en curso contra la compu, récords, rangos, XP, logros, regalos para la estancia…) también se guarda en
   la planilla (accion=sync, hoja «Partes»), y al abrir cualquier juego —o al volver a él— se trae lo del otro
   dispositivo y se junta con lo de acá:
   · cada clave guarda cuándo cambió por última vez: gana la más nueva (una partida en curso, una preferencia);
   · las listas se unen (partidas ya contadas), los récords se quedan con lo mejor, los contadores con lo mayor;
   · «rk» (rangos, XP y logros de todos los juegos) se junta con RANGOS.importData (que también trae LOGROS).
   Los cambios se notan solos (se envuelve localStorage.setItem): se suben a los pocos segundos y al salir.
   Cuando se trae algo nuevo, avisa con el evento «bloques-sync» {detail:{claves:[…], partes:[…]}} para que cada
   juego lo muestre (p. ej. retomar la partida del otro dispositivo).
   BloqueAR (su progreso, medallas, récords y apariencia) sigue con su sincronización de siempre (src/688_cuenta.js),
   y EstanciAR con la suya (hoja EstPriv). API: window.SYNCRO = {ahora(), estado(), html(), onEstado(fn), partes}. */
(function(){
'use strict';
if(window.SYNCRO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
let ST;try{ST=window.localStorage;}catch(_){ST=null;}
const rawSet=ST?Storage.prototype.setItem:null,rawDel=ST?Storage.prototype.removeItem:null;
const ls={get(k){try{return ST.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?rawDel.call(ST,k):rawSet.call(ST,k,v);}catch(_){}},
  json(k,d){try{const v=JSON.parse(ST.getItem(k)||'null');return v??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const me=()=>{const a=acct();return a?String(a.usuario).toLowerCase():'';};
const dev=(()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;})();
const pruebas=/[?#&]sync-off\b/.test(location.href);

/* ── Qué se guarda de cada juego ──
   [clave, regla]: 'nuevo' (por defecto) · 'union' (lista) · 'min' / 'max' (objeto de números) · 'claves' (objeto: se
   suman las claves) · 'maxnum' (número) · 'recsol' (récords del solitario). «{me}» es tu usuario. */
const PARTES={
  truco:['truco-np','truco-meta','truco-dif','truco-lg-dif','truco-ayuda','truco-partida-v1','truco-eq-v1',['truco-xp-hechas','union']],
  uno:['uno-meta','uno-especial','uno-dif','uno-bots','uno-apilar','uno-ayuda','uno-mesa-n','uno-partida-v1',['uno-xp-hechas','union']],
  poblar:['poblar-dificultad','poblar-jugadores','poblar-jugadores-online','poblar-ayuda','poblar-partida-v2',['poblar-xp-hechas','union']],
  solos:['sudoku-dif','sudoku-errores','sudoku-ayuda','sudoku-partida-v1',['sudoku-records-v1','min'],['sudoku-dias-v1','claves'],['sudoku-xp-hechas','union'],
    'solitario-robo','solitario-consol','solitario-ayuda','solitario-partida-v1','solitario-racha',['solitario-records-v1','recsol'],['solitario-dias-v1','claves'],['solitario-xp-hechas','union']],
  pampa:['pampa-resultado','pampa-visto','pampa-resumen','pampa-cruce','pampa-copas','pampa-ayuda-9'],
  gen:[['bloques-novedades','maxnum'],['bloques-chat-read-{me}','max'],['bloques-chat-borr-{me}','max'],'bloques-chat-frase','bloques-chat-modo',
    'bloques-ranked-bloquear','bloques-ranked-poblar','bloques-ranked-truco','bloques-ranked-uno','bloques-ranked-estancia']
};
const RK_CLAVES=['bloques-rangos-v1','bloques-xpjuegos-v1','bloques-logros-v1'];
const clavesDe=n=>(PARTES[n]||[]).map(x=>{const [k,r]=Array.isArray(x)?x:[x,'nuevo'];return [k.replace('{me}',me()),r];});
let MAPA=null,MAPA_U='';
function parteDe(k){
  if(!MAPA||MAPA_U!==me()){MAPA=new Map();MAPA_U=me();for(const x of RK_CLAVES)MAPA.set(x,'rk');MAPA.set('estancia-premios','premios');MAPA.set('pampa-act','act');
    for(const n of Object.keys(PARTES))for(const [x] of clavesDe(n))MAPA.set(x,n);}
  return MAPA.get(k)||'';
}
// JSON con las claves ordenadas, para comparar sin falsos «cambió».
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o);}

/* ── Cuándo cambió cada clave (por dispositivo) ── */
const META_K='sync-meta-v1';
// Otra cuenta en este dispositivo: se arranca de cero y lo que quedó acá de la otra cuenta no se le sube a ésta
// (lo de la cuenta nueva gana; lo que sólo está acá se queda acá hasta que se vuelva a tocar).
function metaCargar(){let M=ls.json(META_K,{});if(M.u&&M.u!==me())M={ajena:true};return M;}
let META=metaCargar();
function metaSave(){META.u=me();ls.set(META_K,JSON.stringify(META));}
function hash(s){if(s==null)return '∅';let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;}
// Mira si cambió algo desde la última vez. «t» = ahora; lo que nunca se miró en este dispositivo arranca en t=1
// (así, si la cuenta tiene algo más nuevo, gana la cuenta).
function revisar(n){const M=(META[n]=META[n]||{});let ch=false;
  for(const [k] of clavesDe(n)){const v=ls.get(k),h=hash(v),m=M[k];
    if(!m){M[k]={h,t:v==null?0:1};}else if(m.h!==h){M[k]={h,t:Date.now()};ch=true;}}
  return ch;}
function exportar(n){revisar(n);const M=META[n]||{},k={};
  for(const [x] of clavesDe(n)){const m=M[x];if(!m)continue;const v=ls.get(x);if(v==null&&!m.t)continue;k[x]=[v,m.t||0];}
  return {k};}
const J=s=>{try{return JSON.parse(s);}catch(_){return null;}};
function juntarValor(regla,a,b){   // a = lo de acá, b = lo de la cuenta (strings)
  if(a==null)return b;if(b==null)return a;
  const A=J(a),B=J(b);
  if(regla==='union'&&Array.isArray(A)&&Array.isArray(B)){const o=[...A];for(const x of B)if(!o.includes(x))o.push(x);return JSON.stringify(o.slice(-120));}
  if((regla==='min'||regla==='max')&&A&&B&&typeof A==='object'&&typeof B==='object'){const o={...A};
    for(const [x,v] of Object.entries(B))if(Number.isFinite(v)&&(!Number.isFinite(o[x])||(regla==='min'?v<o[x]:v>o[x])))o[x]=v;return JSON.stringify(o);}
  if(regla==='claves'&&A&&B&&typeof A==='object'&&typeof B==='object')return JSON.stringify({...B,...A});
  if(regla==='maxnum'){const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?String(Math.max(x,y)):a;}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u'],
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};
    for(const [dv,x] of Object.entries(d.por||{})){if(dv===dev)continue;const y=por[dv]||{};por[dv]={};for(const f of this.F)por[dv][f]=Math.max(x[f]|0,y[f]|0);}
    const s={};for(const f of this.F)s[f]=Object.entries(por).reduce((a,[dv,x])=>dv===dev?a:a+(x[f]|0),0);
    ls.set('sync-act-por',JSON.stringify({d:h,por}));ls.set('sync-act-otros',JSON.stringify({d:h,s}));
    const L={d:h};for(const f of this.F)L[f]=mio[f]+s[f];const antes=ls.get('pampa-act'),nuevo=JSON.stringify(L);
    if(antes!==nuevo){ls.set('pampa-act',nuevo);return true;}return false;}};
const ESPECIALES={rk:RK,premios:PREM,act:ACT};
const TODAS=[...Object.keys(PARTES),'rk','premios','act'];
function datosDe(n){return ESPECIALES[n]?ESPECIALES[n].exportar():exportar(n);}

/* ── Red ── */
async function call(p,ms=15000,keep=false){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow',keepalive:keep});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}

/* ── Estado (para el indicador del menú) ── */
const E={st:'',t:Number(ls.get('sync-ultimo')||0),err:'',sub:new Set()};
function setSt(st,err){E.st=st;E.err=err||'';if(st==='ok'){E.t=Date.now();ls.set('sync-ultimo',String(E.t));}for(const f of E.sub)try{f(E);}catch(_){}pintar();}
function hace(t){if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'recién':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`;}
function texto(){if(!acct())return '';if(E.st==='busy')return '☁️ Guardando en tu cuenta…';if(E.st==='off')return '☁️ Sin conexión: se guarda cuando vuelva';
  if(E.st==='err')return '☁️ No se pudo guardar en tu cuenta';return E.t?`☁️ ✓ Guardado en tu cuenta · ${hace(E.t)}`:'☁️ Se guarda en tu cuenta';}
function html(){const t=texto();return t?`<div class="sync-st" data-sync-st>${t}</div>`:'';}
function pintar(){const t=texto();document.querySelectorAll('[data-sync-st]').forEach(el=>{el.textContent=t;});}
// Si el menú del juego se abre, el renglón aparece solo debajo del rango (rk-mine) o al principio del menú.
function css(){if(document.getElementById('sync-css'))return;const s=document.createElement('style');s.id='sync-css';
  s.textContent='.sync-st{font:500 12px/1.3 system-ui,-apple-system,sans-serif;color:#93a1b6;opacity:.9;margin:-4px 0 10px;text-align:left}';(document.head||document.documentElement).appendChild(s);}
function engancharMenu(){if(!acct())return;
  const box=document.getElementById('side-panel');if(!box)return;const L=box.querySelector('.menu-list');   // sólo en el menú principal del juego
  if(!L||box.querySelector('[data-sync-st]'))return;css();
  const d=document.createElement('div');d.className='sync-st';d.dataset.syncSt='';d.textContent=texto();L.before(d);}

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){
  const a=acct();if(!a||pruebas)return;
  if(SUC.busy){SUC.again=true;return;}SUC.busy=true;clearTimeout(SUC.timer);setSt('busy');
  try{
    let traidos=[],partes=[];const ajena=!!META.ajena;
    if(bajar||SUC.primero){
      const j=await call({accion:'sync',usuario:a.usuario,token:a.token,bajar:true},15000,keep);
      SUC.pullT=Date.now();SUC.primero=false;
      if(j.version!==undefined&&!j.partes)throw new Error('vieja');
      const P=j.partes||{};
      if(ajena){for(const k of RK_CLAVES)ls.set(k,null);partes.push('rk');}   // otra cuenta: los rangos y logros de acá no se mezclan
      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}
      // lo que acá es distinto de la cuenta, se sube
      for(const n of TODAS){const r=P[n];const mio=datosDe(n);if(!mio)continue;
        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);
    SUC.dirty.clear();
    if(subir.length){await call({accion:'sync',usuario:a.usuario,token:a.token,subir},15000,keep);SUC.last=Date.now();}

<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────
   Para todos los juegos en línea. Cuando alguien se corta (se le fue la señal, subió al micro, cerró la app sin
   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el
   juego espera (TrucAR de a 2, el duelo de BloqueAR). Si vuelve, recupera su lugar y su mano.
   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).
   API (window.RECON):
   · GRACIA                         ms de espera (60.000).
   · recordar(juego, info) / recuerdo(juego) / olvidar(juego)   la mesa en la que estás (info: {mesa, host, seat, …}).
     recuerdo() devuelve null si pasó más de GRACIA desde el último recordar() (la partida ya no te espera).
   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta
     encontrar la invitación de vuelta de esa mesa y llama onInv(inv). Devuelve {cancelar()}.
   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa? */
(function(){
'use strict';
if(window.RECON)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const GRACIA=Number(ls.get('recon-gracia'))||60000;   // (las pruebas la pueden achicar)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(p,ms=12000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}
/* ── La mesa en la que estás ── */
function recordar(juego,info){ls.set('recon-'+juego,JSON.stringify({...info,t:Date.now()}));}
function recuerdo(juego){const o=ls.json('recon-'+juego,null);return o&&Date.now()-(o.t||0)<GRACIA?o:null;}

/* ── Cartel con cuenta regresiva ── */
const CART=new Map();
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function css(){if(document.getElementById('recon-css'))return;const s=document.createElement('style');s.id='recon-css';
  s.textContent=`.recon-bar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.recon-bar>div{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(20,26,34,.92);color:#f4f1e8;border:1px solid rgba(242,193,78,.55);box-shadow:0 6px 20px rgba(0,0,0,.35);font:600 13.5px/1.3 system-ui,-apple-system,sans-serif;max-width:100%}
.recon-bar>div i{font-style:normal}.recon-bar>div b{font-variant-numeric:tabular-nums;color:#f2c14e;margin-left:auto}
.recon-bar .recon-sp{width:12px;height:12px;border-radius:50%;border:2px solid #f2c14e;border-right-color:transparent;animation:recon-g 1s linear infinite;flex:none}
@keyframes recon-g{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.recon-bar .recon-sp{animation:none}}`;
  (document.head||document.documentElement).appendChild(s);}
function barra(){let b=document.querySelector('.recon-bar');if(!b){css();b=document.createElement('div');b.className='recon-bar';b.setAttribute('role','status');b.setAttribute('aria-live','polite');document.body.appendChild(b);}return b;}
function cartel(id,texto,hasta,onFin){quitar(id);const el=document.createElement('div');el.dataset.recon=id;
  el.innerHTML='<span class="recon-sp" aria-hidden="true"></span><span class="recon-t"></span><b></b>';el.querySelector('.recon-t').textContent=texto;barra().appendChild(el);
  const pinta=()=>{const r=hasta-Date.now();el.querySelector('b').textContent=mmss(r);if(r<=0){quitar(id);try{onFin&&onFin();}catch(e){console.warn(e);}}};
  pinta();const iv=setInterval(pinta,500);CART.set(id,{el,iv});return el;}
function quitar(id){const c=CART.get(id);if(!c)return;clearInterval(c.iv);c.el.remove();CART.delete(id);}

function reinvitar(o){
  let vivo=true,id='';const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());

    while(!fin()){await sleep(2000);if(fin())break;
      let r;try{r=await call({accion:'buzon',usuario:a.usuario,token:a.token,id});}catch(_){continue;}
      if(r.estado==='aceptada'&&r.respuesta){vivo=false;let sdp='';try{sdp=JSON.parse(r.respuesta).sdp||'';}catch(_){}o.onRespuesta(sdp,id,r.respuesta);return;}   // (raw: para respuestas que no son JSON, como las de BloqueAR)
      if(r.estado==='rechazada'||r.estado==='cancelada'||r.estado==='vencida')break;}
    if(id){try{await call({accion:'cancelar',usuario:a.usuario,token:a.token,id});}catch(_){}}
  })();
  return {cancelar(){vivo=false;},get id(){return id;}};
}
/* ── El que se cortó: busca la invitación de vuelta ── */
function esVuelta(inv,prefijo,mesa){const of=String(inv&&inv.oferta||'');if(!of.startsWith(prefijo))return false;
  try{const o=JSON.parse(of.slice(prefijo.length));return !!o.re&&String(o.re)===String(mesa);}catch(_){return false;}}
function buscarVuelta(o){
  let vivo=true;const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{const a=acct();if(!a)return;
    while(!fin()){
      try{const j=await call({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
        if(inv&&esVuelta(inv,o.prefijo,o.mesa)&&(!o.de||String(inv.de).toLowerCase()===String(o.de).toLowerCase())){vivo=false;o.onInv(inv);return;}}catch(_){}
      await sleep(2500);}
  })();
  return {cancelar(){vivo=false;}};
}
window.RECON={GRACIA,recordar,recuerdo,olvidar,cartel,quitar,mmss,reinvitar,buscarVuelta,esVuelta};
})();

</script>
<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];

// Solitarios (v62): no tienen rango (no son competitivos), pero su XP suma al nivel general.
const SOLOS={sudoku:'SudokAR',solitario:'SolitARio'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo

const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}

// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);

// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
// ranked: sólo las partidas ranked (las que mueven el rango) dan leguas para La Gran Pampa (pedido del usuario, v56).
function premio(de,xp,ranked){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  // v63: para no inflar la estancia, cada partida da su XP en pesos (hasta 300) y, en el mismo día, rinde menos a medida que juntás:
  // los primeros 600 🪙 enteros, hasta 1.200 a la mitad y después a un cuarto (nunca menos de 5).
  const d=new Date(),dia=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,PD=ls.json('estancia-premios-dia',{}),ya=PD.d===dia?PD.n||0:0;
  const pesos=Math.max(5,Math.round(Math.min(300,n)*(ya<600?1:ya<1200?.5:.25)));ls.set('estancia-premios-dia',JSON.stringify({d:dia,n:ya+pesos}));

}
// La Gran Pampa: lo que jugás cada día da leguas para el mapa (las cobra el mapa al abrirse; la planilla pone los topes).
// Por día: BloqueAR 1 por partida ranked (hasta 4), PoblAR y TrucAR 2 por partida ranked (hasta 2) y EstanciAR 1 por cosecha (hasta 4).
const PAMPA_ACT={b:{tope:4,v:1},p:{tope:2,v:2},e:{tope:4,v:1},t:{tope:2,v:2},u:{tope:2,v:2},a:{tope:2,v:2}};
function pampaAct(q){
  const A=PAMPA_ACT[q];if(!A)return 0;
  // día en hora argentina, como la planilla
  const dia=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),X=ls.json('pampa-act',{}),o=X.d===dia?X:{d:dia,b:0,p:0,e:0,t:0,u:0,a:0};
  o[q]=(o[q]||0)+1;ls.set('pampa-act',JSON.stringify(o));

}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0)+Object.keys(SOLOS).reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0)+Object.keys(SOLOS).reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){const o={r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};try{if(window.LOGROS)o.lg=window.LOGROS.exportData();}catch(_){}return o;}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  // Rangos (v63): juego por juego, para no perder lo que jugaste en el otro dispositivo: queda el que tiene más
  // partidas ranked; si empatan, el de la última partida más nueva.
  const r=ls.json(RKEY,{});

function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}

function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}

function revisar(o,j){

  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);

  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;}
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}

  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;

function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);

  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}

}

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}

// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Datos guardados en este dispositivo ── */

  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;

  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre

function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}
/* ── Borrar chats (v63): sólo para vos. La planilla guarda «borrado hasta tal hora» por charla y no te devuelve

async function borrarChat(name){

const lastAny=n=>{let t=0;for(const m of S.msgs)if(lc(other(m))===lc(n)&&m.t>t)t=m.t;return t;};

/* ── Consultas periódicas ── */
function schedule(){

async function poll(){
  const a=acct();

  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    const pend=invPendientes();if(pend.length)p.invs=pend;
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}
    const invCh=j.invs?invGuardarSt(j.invs):false;if(invCh&&$('.cx-panel'))$('.cx-panel').dataset.sig='';
    if(j.borr&&aplicarBorrados(j.borr)&&S.open){$('.cx-panel').dataset.sig='';render();badges();}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}

}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id)||!nombreOk(m.de)||!nombreOk(m.para)||borradoLocal(m))continue;
    // Si un «No se mandó» en realidad sí llegó (se cortó la respuesta), se reemplaza por el de la planilla.
    if(lc(m.de)===lc(S.me)&&typeof m.p==='string'){const i=S.msgs.findIndex(x=>x.tmp&&lc(x.para)===lc(m.para)&&x.p===m.p&&Math.abs(x.t-m.t)<5*60e3);if(i>=0){delete S.plain[S.msgs[i].id];S.msgs.splice(i,1);}}

  ta.value='';autoGrow(ta);ta.focus();

async function mandar(tmp){

    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);

    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();

function save(local){const yo=typeof SY!=='undefined'&&!local;if(yo)E.uT=Date.now();ls.set(KEY,JSON.stringify(E));if(yo){SY.dirty=true;SY.cc++;if(E.xp>0)SY.virgen=false;syMeta();schedSync();}

const prodReady=it=>!!CAT[it.k].prod&&Date.now()>=(it.at||0)+prodEvery(it);

function addXp(n,silent){
  if(!n)return;const before=E.lv;E.xp+=n;E.lv=lvFromXp(E.xp).lv;for(let l=before+1;l<=E.lv;l++)E.pesos+=ECO.nivelPremio(l);if(E.lv>before)try{window.LOGROS&&LOGROS.marca('estancia','nivel',E.lv);}catch(_){}
  try{window.RANGOS&&RANGOS.addXp('estancia',n);}catch(_){}
  if(E.lv>before)setTimeout(()=>levelUp(before,E.lv),silent?900:500);
}
function tick(now=Date.now()){
  let ch=false;E.t=now;
  while(E.cola.length){if(!E.colaT)E.colaT=now;const q=E.cola[0];if(now-E.colaT>=TT[q.k].time){E.colaT+=TT[q.k].time;E.cola.shift();E.tropas[q.k]=(E.tropas[q.k]||0)+1;ch=true;}else break;}
  if(!E.cola.length)E.colaT=0;return ch;
}

/* ───────── Dibujo isométrico ─────────
   Una maqueta de estancia pampeana, con luz de tarde desde arriba a la izquierda: pasto con textura,
   paredes a la cal, tejas, chapa, madera gastada y alambre. El suelo se pinta una sola vez en baldosas
   (varias versiones de pasto) y en cada cuadro sólo se estampan; las cosas se dibujan encima, de atrás para adelante. */
const TW=64,TH=32,HW=TW/2,HH=TH/2;
const cv=$('map'),ctx=cv.getContext('2d');
let W=0,Hh=0,DPR=1;
const cam={x:0,y:HH*NX,z:.6};
function P(x,y,z=0){return [(x-y)*HW,(x+y)*HH-z];}
function poly(g,pts,fill,stroke,lw){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||1;g.stroke();}}
function line(g,a,b,col,lw){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.stroke();}
function circle(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function oval(g,x,y,rx,ry,col,rot=0){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,7);g.fill();}
function emoji(g,e,x,y,size){g.font=`${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,x,y);}
const EDGE='rgba(38,26,14,.38)';
/* Paleta: colores de campo, sin estridencias */
const PAL={
  lime:'#ebe3d0',limeL:'#e2d8c2',limeR:'#c9bda3',limeLn:'rgba(120,98,66,.10)',
  tile:{base:'#9c4a33',alt:'#8a3f2b',sh:'#6f3021',gable:'#d9cfb8',ln:'rgba(70,26,16,.45)',ridge:'#6a2c1f',eave:'#5a2519'},
  zinc:{base:'#a7aba8',alt:'#8f9491',sh:'#767b78',gable:null,ln:'rgba(60,64,62,.35)',ridge:'#6b706d',eave:'#5d625f'},
  thatch:{base:'#b89a5e',alt:'#a8894f',sh:'#8a703f',gable:null,ln:'rgba(90,68,30,.45)',ridge:'#7a6234',eave:'#6e5729'},
  wood:'#7b5b3c',woodL:'#86653f',woodR:'#5f452c',woodDk:'#46321f',woodHi:'#9b7853',woodLn:'rgba(40,26,14,.35)',
  brick:'#9a5843',brickR:'#7c4535',glass:'#2d393b',shutter:'#56694c',door:'#5a3e27',
  soil:'#5d4129',soilHi:'#7b5a3b',soilDk:'#46311f',
  iron:'#3a3835',water:'#4c7a8b',waterHi:'#8db4bf'
};
function rnd(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
// Sombra suave sobre el suelo (la luz viene de arriba a la izquierda, la sombra cae a la derecha).
function sshadow(g,cx,cy,rx,ry,a=.3){const p=P(cx,cy);g.save();g.translate(p[0]+rx*.14,p[1]+ry*.12);g.scale(1,ry/rx);
  const gr=g.createRadialGradient(0,0,rx*.15,0,0,rx);gr.addColorStop(0,`rgba(26,22,10,${a})`);gr.addColorStop(.7,`rgba(26,22,10,${a*.45})`);gr.addColorStop(1,'rgba(26,22,10,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,rx,0,7);g.fill();g.restore();}
// Sombra de contacto: oscurece apenas el suelo justo alrededor de la base.
function contact(g,x,y,w,h,a=.22){const e=.1;poly(g,[P(x-e,y-e),P(x+w+e,y-e),P(x+w+e*2.4,y+h+e*2.4),P(x-e,y+h+e)],`rgba(26,22,10,${a})`);}
function shadow(g,cx,cy,rx,ry,a=.2){sshadow(g,cx,cy,rx,ry,a+.08);}
// Caja: arriba, cara izquierda (mira a +y) y cara derecha (mira a +x).
function box(g,x,y,w,h,z0,hh,top,left,right,edge=EDGE){
  const A=P(x,y,z0+hh),B=P(x+w,y,z0+hh),C=P(x+w,y+h,z0+hh),D=P(x,y+h,z0+hh),B0=P(x+w,y,z0),C0=P(x+w,y+h,z0),D0=P(x,y+h,z0);
  poly(g,[D,C,C0,D0],left,edge,.8);poly(g,[C,B,B0,C0],right,edge,.8);if(top)poly(g,[A,B,C,D],top,edge,.8);
}
// Caras sueltas: izquierda en el plano y=Y (de u0 a u1 a lo largo de x), derecha en el plano x=X (a lo largo de y).
function faceL(g,Y,u0,u1,z0,z1,col,st){poly(g,[P(u0,Y,z0),P(u1,Y,z0),P(u1,Y,z1),P(u0,Y,z1)],col,st,.8);}
function faceR(g,X,u0,u1,z0,z1,col,st){poly(g,[P(X,u0,z0),P(X,u1,z0),P(X,u1,z1),P(X,u0,z1)],col,st,.8);}
// Rayado de una cara: tablas (vertical) o hiladas (horizontal).
function hatchL(g,Y,u0,u1,z0,z1,n,col,vert,lw=.7){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();
  for(let i=1;i<n;i++){if(vert){const u=u0+(u1-u0)*i/n,a=P(u,Y,z0),b=P(u,Y,z1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}else{const z=z0+(z1-z0)*i/n,a=P(u0,Y,z),b=P(u1,Y,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}}g.stroke();}
function hatchR(g,X,u0,u1,z0,z1,n,col,vert,lw=.7){g.strokeStyle=col;g.lineWidth=lw;g.beginPath();
  for(let i=1;i<n;i++){if(vert){const u=u0+(u1-u0)*i/n,a=P(X,u,z0),b=P(X,u,z1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}else{const z=z0+(z1-z0)*i/n,a=P(X,u0,z),b=P(X,u1,z);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}}g.stroke();}
// Ventana con postigos verdes abiertos.
function winL(g,Y,u0,u1,z0,z1){const w=u1-u0;faceL(g,Y,u0-w*.42,u0,z0-.5,z1+.5,PAL.shutter);faceL(g,Y,u1,u1+w*.42,z0-.5,z1+.5,PAL.shutter);
  faceL(g,Y,u0,u1,z0,z1,PAL.glass);line(g,P((u0+u1)/2,Y,z0),P((u0+u1)/2,Y,z1),'#5b5040',.8);line(g,P(u0-.02,Y,z0-.6),P(u1+.02,Y,z0-.6),'#f4eee0',1.4);}
function winR(g,X,u0,u1,z0,z1){const w=u1-u0;faceR(g,X,u0-w*.42,u0,z0-.5,z1+.5,'#465a3f');faceR(g,X,u1,u1+w*.42,z0-.5,z1+.5,'#465a3f');
  faceR(g,X,u0,u1,z0,z1,'#262f31');line(g,P(X,(u0+u1)/2,z0),P(X,(u0+u1)/2,z1),'#4a4134',.8);line(g,P(X,u0-.02,z0-.6),P(X,u1+.02,z0-.6),'#d8cfbd',1.4);}
// Techo a dos aguas con la cumbrera a lo largo de x. mid(): lo que va entre el faldón de atrás y el de adelante (chimenea).
function roof(g,x,y,w,h,z0,rh,R,mid){
  const ov=.12,a=P(x-ov,y-ov,z0),b=P(x+w+ov,y-ov,z0),r1=P(x-ov,y+h/2,z0+rh),r2=P(x+w+ov,y+h/2,z0+rh),c=P(x+w+ov,y+h+ov,z0),d=P(x-ov,y+h+ov,z0);
  poly(g,[a,b,r2,r1],R.sh,EDGE,.8);
  if(R.gable!==null)poly(g,[P(x+w,y,z0),P(x+w,y+h,z0),P(x+w,y+h/2,z0+rh)],R.gable||PAL.limeR,EDGE,.8);
  else poly(g,[P(x+w+ov,y-ov,z0),P(x+w+ov,y+h+ov,z0),P(x+w+ov,y+h/2,z0+rh)],R.sh,EDGE,.8);
  if(mid)mid();
  poly(g,[r1,r2,c,d],R.base);
  const n=Math.max(3,Math.round((w+2*ov)*7));

function tap(cx,cy){
  if(BAT)return;
  if(VISIT){const h=hitItem(cx,cy,VISIT.items);
    if(h.it&&CAT[h.it.k].use&&WK.me){usar(h.it);return;}
    if(!WK.me||!caminarA(h.fx,h.fy)){if(h.it)toast(`${CAT[h.it.k].e} ${CAT[h.it.k].n} de ${VISIT.name}`);}
    return;}
  if(MODE==='place'||MODE==='move'){
    if(GHOST){const h=toTile(cx,cy),c=CAT[GHOST.k];GHOST.x=Math.round(h.x-c.w/2);GHOST.y=Math.round(h.y-c.h/2);renderPlace();return;}
    const h=hitItem(cx,cy);if(h.it&&h.it.k!=='casco'){GHOST={...h.it};renderPlace();}else if(h.it)toast('El casco se queda en su lugar.');return;}
  const hh=hitItem(cx,cy),it=hh.it;
  if(!(it&&(cropReady(it)||prodReady(it)))){const w=hitWalker(cx,cy);if(w){SEL=null;closePop();
    if(w.pj)openPersonaje();else if(w.pet)openPet(w.pet.id);else if(w.vis)atenderVisita();else if(w.chest)openGifts();return;}}
  if(!it){SEL=null;closePop();irA(hh.fx,hh.fy);return;}
  const c=CAT[it.k];
  if(it.k==='parcela'){if(cropReady(it)){harvest(it);return;}if(!it.crop){SEL=it.id;openSeeds(it);return;}}
  if(c.prod&&prodReady(it)){collectProd(it);return;}
  SEL=it.id;openPop(it);
}

function rng(seed){let a=seed>>>0||1;return ()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

      if(t){i.cd=1.3;t.hp-=52*(1+.3*((i.n||1)-1));B.shots.push({x1:c.x,y1:c.y,z1:100,x2:t.x,y2:t.y,t:B.t,c:'#ffb04d'});if(t.hp<=0)sfx('ko');}}}
    if(i.k==='perrera'&&!i.dogsOut){const c=cOf(i);if(att.some(u=>Math.hypot(u.x-c.x,u.y-c.y)<6)){i.dogsOut=true;sfx('dogs');for(let n=0;n<2+(i.n||1);n++)B.units.push({side:'d',e:'🐕',x:c.x+(n-1)*.5,y:c.y+.6,hp:140,max:140,dmg:14,cd:0,rate:.8,range:.7,speed:2.8});}}

const ROBO=.6,ROBO_COSECHA=[0,.3,.5,.7];
function robarCosechas(B){
  if(B.pampa||!B.stars)return;
  const down=B.view.items.filter(i=>CAT[i.k].cnt&&i.hp<=0).map(cOf),lis=B.view.items.filter(i=>i.crop&&i.rdy);if(!lis.length)return;
  const d=i=>{const c=cOf(i);return down.length?Math.min(...down.map(p=>Math.hypot(p.x-c.x,p.y-c.y))):0;};
  const n=Math.ceil(lis.length*ROBO_COSECHA[B.stars]);

/* Cruce por malón de La Gran Pampa: el mapa manda acá a atacar la estancia del vecino dueño del paraje.
   Se juega igual, con tu tropa más una ayuda prestada; con 2 ⭐ o más el paraje es tuyo. No da pesos ni trofeos.
   Si tu vecino todavía no guardó su estancia, se defiende una estancia de tu nivel.
   Estancia nivelada (v57): si su estancia es más floja que una de tu nivel, la pampa le presta defensas
   (mangrullos, perreras y tapias junto al casco) hasta quedar parejo. Así a quien no le copa EstanciAR no
   le sacan todo con malones. */
const PAMPA_AYUDA={gaucho:4,boleador:2};
let PM_DUELO='';
function poderDef(items){let p=0;for(const i of items){const m=1+.4*((i.n||1)-1);if(i.k==='mangrullo')p+=3*m;else if(i.k==='perrera')p+=2*m;else if(i.k==='fortin')p+=6*m;else if(i.k==='tapia')p+=.35;else if(i.k==='cerco')p+=.2;else if(i.k==='trampa')p+=.5;else if(i.k==='alambrado')p+=.12;}return p*(1+buffOf('defensa',items)*.75);}
function nivelar(base,L){
  const meta=poderDef(npcBase(L).items);let p=poderDef(base.items),id=5000;const own=base.own,N={};
  if(p>=meta)return N;
  const cas=base.items.find(i=>i.k==='casco')||{x:own.x0+own.L/2-1.5,y:own.y0+own.L/2-1.5};
  const add=k=>{const c=CAT[k];let best=null,bd=1e9;
    for(let y=own.y0;y<=own.y1-c.h;y++)for(let x=own.x0;x<=own.x1-c.w;x++)if(fits(k,x,y,null,base.items,own)){const d=Math.hypot(x+c.w/2-(cas.x+1.5),y+c.h/2-(cas.y+1.5));if(d<bd){bd=d;best={x,y};}}
    if(!best)return false;base.items.push({id:id++,k,x:best.x,y:best.y,prestado:1});N[k]=(N[k]||0)+1;return true;};
  for(const k of ['mangrullo','perrera','mangrullo','perrera','mangrullo','mangrullo']){if(p>=meta)break;if(add(k))p+=k==='mangrullo'?3:2;}
  for(let n=0;n<40&&p<meta;n++){if(!add('tapia'))break;p+=.35;}

async function pampaMalon(q,duelo=''){
  if(BAT)return;let base=null,niv=null;PM_DUELO=duelo;

  if(!base){base=npcBase(clamp(E.lv,2,8));base.name='Estancia de '+q;}
  else{niv=nivelar(base,clamp(E.lv,2,12));}

  toast(`🐎 Malón a ${q}: además de tu tropa, te prestan 4 gauchos y 2 boleadores${nv?`. Su estancia está nivelada: la pampa le prestó ${nv}`:''}`);

/* ───────── v61: tu personaje, la mascota, la despensa, los pedidos, el cofre, la feria y las visitas ───────── */
const dayAR=(t=Date.now())=>new Date(t-3*3600e3).toISOString().slice(0,10);
const dowAR=(t=Date.now())=>new Date(t-3*3600e3).getUTCDay();
const feriaOn=(t=Date.now())=>{const d=dowAR(t);return d===6||d===0;};
const lgHas=(j,id)=>{try{const o=JSON.parse(localStorage.getItem('bloques-logros-v1')||'{}');return !!(o.g&&o.g[j]&&o.g[j][id]);}catch(_){return false;}};
const LGN={truco:'TrucAR',uno:'UnoAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa'};
function lgNombre(j,id){try{const L=window.LOGROS&&LOGROS.D[j]&&LOGROS.D[j].logros.find(x=>x.id===id);return L?L.n:id;}catch(_){return id;}}
// Estado nuevo (se agrega a las estancias que ya existen sin tocar lo que tenían).
function migrar(s){
  s.desp=s.desp&&typeof s.desp==='object'?s.desp:{};
  s.ped=s.ped&&Array.isArray(s.ped.l)?s.ped:{l:[],t:0,n:0};
  s.cofre=s.cofre&&typeof s.cofre==='object'?s.cofre:{d:'',r:0};
  s.pj=s.pj&&s.pj.look?s.pj:{look:{...PJ_BASE},own:[]};for(const k in PJ_BASE)if(s.pj.look[k]==null)s.pj.look[k]=PJ_BASE[k];if(!Array.isArray(s.pj.own))s.pj.own=[];
  s.pets=Array.isArray(s.pets)?s.pets:[];s.petSel=s.petSel||(s.pets[0]&&s.pets[0].id)||0;
  s.vis=s.vis&&typeof s.vis==='object'?s.vis:{t:0,cur:null,n:0};
  s.ofe=s.ofe||null;
  for(const it of s.items)if(CAT[it.k]&&CAT[it.k].up&&!it.n)it.n=1;
  // v63: precios nuevos. A las estancias que ya existían no se les saca nada: la plata y lo comprado quedan; se avisa una vez.
  if(!s.eco){s.eco=63;if(s.xp>0)s.ecoAviso=1;}
  return s;}
/* ── Ganancias: lindura, obras que mejoran a otras y la mascota contenta ── */
function lindura(list=E.items){let s=0;for(const i of list)s+=CAT[i.k]&&CAT[i.k].lin||0;return s;}
const linBonus=(list)=>Math.min(.15,Math.floor(lindura(list)/20)*.01);
function buffOf(k,list=E.items){const seen=new Set();let p=0;for(const it of list){const b=CAT[it.k]&&CAT[it.k].buff;if(b&&b.k===k&&!seen.has(it.k)){seen.add(it.k);p+=b.p;}}return p;}
const petBonus=()=>E.pets.some(p=>petMood(p)>=60)?.05:0;
const kindOf=k=>k==='tambo'||k==='cabras'?'lacteos':k==='vinedo'?'vinedo':'';
function gainMul(kind){return 1+linBonus()+petBonus()+(kind?buffOf(kind):0);}
function despAdd(k,n=1){if(!k||!DESP[k])return;E.desp[k]=Math.min(DESP_MAX,(E.desp[k]||0)+n);}
const despTxt=o=>Object.entries(o).filter(([,n])=>n>0).map(([k,n])=>`${DESP[k]?DESP[k].e:'?'}×${n}`).join(' ');

/* ── Pedidos de los vecinos: piden cosas de la despensa y pagan bien ── */
const VECINOS=[['Doña Rosa','👵'],['Don Ramón','👴'],['La maestra Elvira','👩‍🏫'],['El pulpero Tito','🧔'],['Carmencita','👧'],['El cura Anselmo','🧑‍🦳'],['Doña Pocha','👩‍🦰'],['El comisario','👮'],['Los del almacén','🧑‍🍳'],['Tía Nelly','👵']];
const PED_MAX=3,PED_EVERY=2*HOUR;
function despValor(k){if(SEEDS[k])return SEEDS[k].gain;for(const c of Object.values(CAT))if(c.prod&&c.prod.d===k)return c.prod.gain;return 50;}
// Lo que tu estancia puede producir hoy (para no pedir imposibles).
function producibles(){const s=new Set();for(const k of SORDER)if(E.lv>=SEEDS[k].lv&&E.items.some(i=>i.k==='parcela'))s.add(k);for(const it of E.items){const p=CAT[it.k].prod;if(p&&p.d)s.add(p.d);}return [...s];}
function nuevoPedido(now=Date.now()){const ks=producibles();if(!ks.length)return null;const R=rnd((now/1000|0)+E.ped.n*7919);
  const n=1+Math.floor(R()*Math.min(3,ks.length)),pool=ks.slice(),items={};
  for(let i=0;i<n;i++){const k=pool.splice(Math.floor(R()*pool.length),1)[0];const v=despValor(k);items[k]=clamp(Math.round(ECO.pedido.valor(E.lv)/n/v*(.6+R()*.8)),1,8);}
  const [de,av]=VECINOS[Math.floor(R()*VECINOS.length)];const val=Object.entries(items).reduce((a,[k,q])=>a+despValor(k)*q,0);
  return {id:++E.ped.n,de,av,items,pesos:ECO.pedido.paga(val,E.lv),xp:Math.round(8+E.lv*2+Object.keys(items).length*4),t:now};}
function tickPedidos(now=Date.now()){let ch=false;
  if(!E.ped.t){E.ped.t=now;for(let i=0;i<2;i++){const p=nuevoPedido(now+i);if(p){E.ped.l.push(p);ch=true;}}}
  while(E.ped.l.length<PED_MAX&&now-E.ped.t>=PED_EVERY){E.ped.t+=PED_EVERY;const p=nuevoPedido(E.ped.t);if(p){E.ped.l.push(p);ch=true;}else break;}
  if(E.ped.l.length>=PED_MAX&&now-E.ped.t>PED_EVERY)E.ped.t=now-PED_EVERY;
  return ch;}
const pedPaga=p=>Math.round(p.pesos*(1+buffOf('pedidos')+(feriaOn()?.5:0)));
const pedListo=p=>Object.entries(p.items).every(([k,q])=>(E.desp[k]||0)>=q);
const pedListos=()=>E.ped.l.filter(pedListo).length;
function openPedidos(){tickPedidos();
  const d=Object.entries(E.desp).filter(([,n])=>n>0);
  const pl=E.ped.l.map(p=>{const ok=pedListo(p);return `<div class="ped${ok?' ok':''}"><div class="ped-h"><span class="ped-av">${p.av}</span><span class="tx"><b>${esc(p.de)}</b><small>Pide: ${Object.entries(p.items).map(([k,q])=>`<span class="${(E.desp[k]||0)>=q?'':'falta'}">${DESP[k].e}×${q}</span>`).join(' ')}</small></span></div>
    <div class="row"><button class="btn" data-ped-x="${p.id}">No, gracias</button><button class="btn go" data-ped="${p.id}"${ok?'':' disabled'}>Entregar · ${fmt(pedPaga(p))}<i class="co"></i></button></div></div>`;}).join('');
  const next=E.ped.l.length<PED_MAX?`<p class="note">Llega otro pedido en ${dur(E.ped.t+PED_EVERY-Date.now())}.</p>`:'';
  sheet('Pedidos de los vecinos',`<p class="note">Los vecinos piden cosas de tu despensa: lo que juntás de tus animales y cosechás va quedando ahí.${buffOf('pedidos')?' La pulpería hace que paguen 25 % más.':''}${feriaOn()?' <b>Hoy hay feria: pagan 50 % más.</b>':''}</p>
    ${pl||'<p>Todavía no hay pedidos. Volvé en un rato.</p>'}${next}
    <h3 class="sh3">Tu despensa</h3><div class="desp">${d.length?d.map(([k,n])=>`<span title="${esc(DESP[k].n)}">${DESP[k].e}<b>${n}</b></span>`).join(''):'<span class="note">Vacía: cosechá y juntá lo de tus animales.</span>'}</div>`);
  document.querySelectorAll('#sheet [data-ped]').forEach(b=>b.onclick=()=>{const p=E.ped.l.find(x=>x.id==b.dataset.ped);if(!p||!pedListo(p))return;
    for(const [k,q] of Object.entries(p.items))E.desp[k]-=q;const pay=pedPaga(p);E.pesos+=pay;E.ped.l=E.ped.l.filter(x=>x!==p);if(E.ped.l.length===PED_MAX-1&&Date.now()-E.ped.t>=PED_EVERY)E.ped.t=Date.now();
    addXp(p.xp);lgEv('pedidos');sfx('win');toast(`${p.av} ${p.de} te pagó ${fmt(pay)} 🪙. ¡Gracias!`);save();openPedidos();renderAll();});
  document.querySelectorAll('#sheet [data-ped-x]').forEach(b=>b.onclick=()=>{E.ped.l=E.ped.l.filter(x=>x.id!=b.dataset.pedX);if(Date.now()-E.ped.t>=PED_EVERY*.5)E.ped.t=Date.now()-PED_EVERY*.5;save();openPedidos();renderAll();});
}

/* ── Cofre del día: abrilo cada día y la racha sube (el día 7 trae algo especial) ── */
const COFRE=[{p:ECO.cofre[0]},{p:ECO.cofre[1],d:{huevo:3}},{p:ECO.cofre[2]},{p:ECO.cofre[3],d:{miel:2,leche:2}},{p:ECO.cofre[4]},{p:ECO.cofre[5],d:{pan:2}},{p:ECO.cofre[6],x:1}];
const cofreListo=()=>E.cofre.d!==dayAR();
function cofreRacha(){const hoy=dayAR(),ayer=dayAR(Date.now()-864e5);return E.cofre.d===ayer?E.cofre.r+1:E.cofre.d===hoy?E.cofre.r:1;}
function abrirCofre(){if(!cofreListo())return null;const r=cofreRacha(),C=COFRE[(r-1)%7],m=ECO.cofreMult(E.lv),pesos=Math.round(C.p*m);
  E.pesos+=pesos;if(C.d)for(const [k,n] of Object.entries(C.d))despAdd(k,n);let extra='';
  if(C.x){const pr=PJ_OPTS.filter(o=>o.cofre&&!E.pj.own.includes(o.id));if(pr.length){const o=pr[(Math.floor(r/7)-1+pr.length)%pr.length]||pr[0];E.pj.own.push(o.id);extra=`${o.n} para tu personaje`;}else{E.pesos+=500;extra='500 🪙 más';}}
  E.cofre={d:dayAR(),r};addXp(5+r*2);try{if(window.LOGROS)LOGROS.marca('estancia','racha',r);}catch(_){}save();
  return {pesos,r,d:C.d,extra};}

function tickVisita(now=Date.now()){
  if(E.vis.cur&&now-E.vis.cur.t>VIS_STAY){E.vis.cur=null;WK.vis=null;return true;}
  if(E.vis.cur||E.tut<3)return false;if(!E.vis.t){E.vis.t=now-VIS_EVERY+20*MIN;return true;}
  if(now-E.vis.t<VIS_EVERY)return false;
  const ks=Object.keys(VISITAS),k=ks[Math.floor(rnd(now/1000|0)()*ks.length)],sp=freeNear(land(),E.items,null);if(!sp)return false;
  E.vis={t:now,cur:{k,t:now,x:sp.x+.5,y:sp.y+.5},n:E.vis.n||0};return true;}
function atenderVisita(){const v=E.vis.cur;if(!v)return;const V=VISITAS[v.k],pr=V.premio();let txt=[];
  if(pr.pesos){E.pesos+=pr.pesos;txt.push(`+${fmt(pr.pesos)}<i class="co"></i>`);}
  if(pr.d){for(const [k,n] of Object.entries(pr.d))despAdd(k,n);txt.push(despTxt(pr.d)+' para la despensa');}
  if(pr.oferta){const pool=Object.keys(CAT).filter(k=>{const c=CAT[k];return c.cost>=150&&c.lv<=E.lv&&!c.feria&&['deco','animales','granja','prod'].includes(c.cat)&&(!c.max||count(k)<c.max(E.lv));});
    if(pool.length){const k=pool[Math.floor(Math.random()*pool.length)];E.ofe={k,price:Math.round(costFor(k)*.5),until:Date.now()+24*HOUR};txt.push(`oferta: ${CAT[k].e} ${CAT[k].n} a ${fmt(E.ofe.price)}<i class="co"></i> (está en la Tienda por 24 horas)`);}}
  if(pr.xp){addXp(pr.xp);txt.push(`+${pr.xp} XP`);}
  E.vis.cur=null;E.vis.n=(E.vis.n||0)+1;WK.vis=null;lgEv('visitas');save();sfx(v.k==='payador'?'level':'collect');
  sheet(`${V.e} ${V.n}`,`<p>${V.txt}</p><p class="center"><b>${txt.join(' · ')}</b></p><button class="btn go" id="vi-ok">¡Gracias!</button>`);$('vi-ok').onclick=closeSheet;renderAll();}

function pjLibre(o){if(E.pj.own.includes(o.id))return true;if(o.cofre||o.pesos)return false;if(o.logro)return lgHas(o.logro[0],o.logro[1]);return !o.lv||E.lv>=o.lv;}

// Dibujo del personaje (x, y en baldosas; face: 1 mira a la izquierda, -1 a la derecha)
function persona(g,x,y,t,L,walk,face=1,s=1.45,sit=false){
  const p=P(x,y);g.save();g.translate(p[0],p[1]);g.scale(face*s,s);
  const sk=PIEL[L.piel%5],hc=PELO[L.pelo%6],pc=COLS[L.ropac%8],bc=['#3a3530','#5a4a3a','#e9e1d0','#4f5a6a','#6b4a2a','#2a2622'][L.bomb%6];
  const ph=walk?t*8.5:0,sw=walk?Math.sin(ph):0,bob=walk?Math.abs(Math.cos(ph))*1.2:Math.sin(t*1.6)*.3;
  if(!sit){oval(g,0,0,6.4,2.1,'rgba(26,22,10,.3)');
    // piernas: bombacha ancha y botas
    const lg=(dx,k)=>{g.strokeStyle=bc;g.lineWidth=3.6;g.lineCap='round';g.beginPath();g.moveTo(dx,-12-bob);g.quadraticCurveTo(dx+k*1.6,-7,dx+k*2.6,-2.2);g.stroke();
      const bt=L.botas==='alpargatas'?'#d9cdb2':L.botas==='negras'?'#1a1714':'#c9a37a';oval(g,dx+k*2.6-.6,-1.2,2.4,1.4,bt);if(L.botas!=='alpargatas'){g.strokeStyle=bt;g.lineWidth=3;g.beginPath();g.moveTo(dx+k*2.4,-5);g.lineTo(dx+k*2.6,-1.4);g.stroke();}};

const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];
async function iceServers(){const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return window.ESTANCIA_ICE||list;}
function gathered(pc){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const t=setTimeout(res,5000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);res();}});});}
function rtcSend(ch,m){try{if(ch&&ch.readyState==='open')ch.send(JSON.stringify(m));}catch(_){}}
function rtcTodos(m,salvo){if(SALA.host)rtcSend(SALA.host.ch,m);for(const [u,P2] of SALA.peers)if(u!==salvo)rtcSend(P2.ch,m);}
function rtcCerrar(){try{SALA.host&&SALA.host.pc.close();}catch(_){}SALA.host=null;for(const P2 of SALA.peers.values())try{P2.pc.close();}catch(_){}SALA.peers.clear();}
async function rtcOfrecer(){SALA.tried++;const d=SALA.dueno;
  try{const pc=new RTCPeerConnection({iceServers:await iceServers()}),ch=pc.createDataChannel('estancia',{ordered:true}),H={pc,ch,open:false};SALA.host=H;
    ch.onopen=()=>{if(SALA.host!==H)return;H.open=true;salaMovi();rtcSend(ch,{t:'p',u:yoNom(),...yoPos()});renderSala();};
    ch.onclose=()=>{if(SALA.host===H)SALA.host=null;};
    ch.onmessage=e=>{let x;try{x=JSON.parse(e.data);}catch(_){return;}rtcMsg(x);};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&SALA.host===H)SALA.host=null;};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(SALA.host!==H||SALA.dueno!==d)return;

    setTimeout(()=>{if(SALA.host===H&&!H.open){try{pc.close();}catch(_){}SALA.host=null;}},40000);
  }catch(_){SALA.host=null;}}
async function rtcRespuesta(sdp){const H=SALA.host;if(!H||H.pc.remoteDescription)return;try{await H.pc.setRemoteDescription({type:'answer',sdp});}catch(_){}}
async function rtcResponder(o){const u=lc(o.de),old=SALA.peers.get(u);if(old&&old.sdp===o.sdp)return;if(old)try{old.pc.close();}catch(_){}
  try{const pc=new RTCPeerConnection({iceServers:await iceServers()}),P2={pc,ch:null,open:false,sdp:o.sdp};SALA.peers.set(u,P2);
    pc.ondatachannel=e=>{const ch=e.channel;P2.ch=ch;ch.onopen=()=>{P2.open=true;rtcSend(ch,{t:'p',u:yoNom(),...yoPos()});
        for(const [k,e2] of SALA.gente)if(k!==u)rtcSend(ch,{t:'p',u:e2.u,x:e2.tx,y:e2.ty,s:e2.w.s||e2.w.sPend||''});};
      ch.onclose=()=>{if(SALA.peers.get(u)===P2)SALA.peers.delete(u);};ch.onmessage=ev=>{let x;try{x=JSON.parse(ev.data);}catch(_){return;}rtcMsg(x,u);};};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState)&&SALA.peers.get(u)===P2)SALA.peers.delete(u);};
    await pc.setRemoteDescription({type:'offer',sdp:o.sdp});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    if(SALA.peers.get(u)!==P2)return;SALA.ans[o.de]=pc.localDescription.sdp;salaPollYa();
  }catch(_){SALA.peers.delete(u);}}
function rtcMsg(x,de){if(!x||typeof x!=='object')return;
  if(de){const e=SALA.gente.get(de);x.u=e?e.u:de;rtcTodos(x,de);}   // el dueño reparte (y el nombre lo pone él)
