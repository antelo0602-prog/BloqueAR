<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).
   v67: amigos con solicitudes (pestañas Charlas / Amigos / Global), grupos de juego (Jugar con el grupo, partidas
   del grupo, archivar solos los que nadie usa) y selector de emojis.
   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},
   CHAT.esAmigo(n), CHAT.usuarios() → [{usuario, avatar, color, enLinea, estado}], CHAT.conectados() → {amigos, global}
   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=21;   // v76: la planilla guarda 21 días (antes 30)
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={fortinar:'FortinAR',bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',laberinto:'LaberintAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',invasores:'InvasorAR',marcar:'MarcAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
// Un nombre de usuario de verdad (nunca null, vacío ni el texto «null»/«undefined» que deja un error).
function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre
  // bien): se borran de acá y se vuelven a pedir desde un poco antes, así reaparecen en la charla correcta.
  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));
  if(malos.length){S.msgs=S.msgs.filter(x=>x&&nombreOk(x.de)&&nombreOk(x.para));const t0=Math.min(...malos.map(x=>Number(x&&x.t)||0).filter(Boolean));
    if(t0)S.last=Math.min(S.last,t0-60000);ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
  // Lo que se estaba mandando cuando se cerró la página queda como «No se mandó» (se puede reintentar).
  for(const x of S.msgs)if(x.tmp){x.sending=false;x.fail=true;if(typeof x.p==='string'){try{S.plain[x.id]=JSON.parse(x.p);}catch(_){}}}
  const B=ls.json(kBorr(),{});S.borr=B&&typeof B==='object'?B:{};
  S.invSt=ls.json(kInvSt(),{})||{};
  {const G=ls.json(kGrupos(),[]);S.grupos=Array.isArray(G)?G:[];}S.am=amLimpio(ls.json(kAm(),null));S.amOk=false;try{S.espero=JSON.parse(sessionStorage.getItem('bloques-chat-espero')||'null');}catch(_){S.espero=null;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}
/* ── Borrar chats (v63): sólo para vos. La planilla guarda «borrado hasta tal hora» por charla y no te devuelve
   lo anterior; si el otro te escribe de nuevo, la charla vuelve con lo nuevo. ── */
const kBorr=()=>'bloques-chat-borr-'+lc(S.me);
function borradoLocal(m){const o=conv(m),h=S.borr&&S.borr[o];return !!h&&m.t<=h&&!m.tmp;}
function aplicarBorrados(B){let ch=false;for(const [k,t] of Object.entries(B||{})){const v=Number(t)||0;if(v>(S.borr[lc(k)]||0)){S.borr[lc(k)]=v;ch=true;}}
  if(ch){ls.set(kBorr(),JSON.stringify(S.borr));const n=S.msgs.length;S.msgs=S.msgs.filter(m=>!borradoLocal(m));if(S.msgs.length!==n)saveMsgs();}return ch;}
async function borrarChat(name){
  // La marca usa la hora de la planilla (la de los mensajes), no el reloj de este dispositivo.
  if(!nombreOk(name))return;const k=lc(name),t=lastAny(name);
  if(t>(S.borr[k]||0)){S.borr[k]=t;ls.set(kBorr(),JSON.stringify(S.borr));}S.msgs=S.msgs.filter(m=>!(conv(m)===k&&m.tmp)&&!borradoLocal(m));saveMsgs();
  S.delFor=null;if(lc(S.con)===k){S.con=null;S.view='list';}$('.cx-panel').dataset.sig='';render();badges();
  try{const j=await call(auth({accion:'chatBorrar',con:name}));if(j.hasta)aplicarBorrados({[k]:j.hasta});}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para borrar chats en todos tus dispositivos hay que actualizar la planilla (versión nueva). En este quedó borrado.':String(e.message||e);render();}
}
const lastAny=n=>{let t=0;for(const m of S.msgs)if(conv(m)===lc(n)&&m.t>t)t=m.t;return t;};
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
/* ── Grupos (v66): los mensajes de un grupo van con para = «g:<id>». La charla de un mensaje es el grupo o el otro. ── */
const esGK=k=>/^g:/i.test(String(k||''));
const esG=m=>esGK(m&&m.para);
const conv=m=>esG(m)?lc(m.para):lc(other(m));
const grupoDe=k=>{const id=lc(k).replace(/^g:/,'');return S.grupos.find(g=>lc(g.id)===id)||null;};
const conNombre=k=>esGK(k)?((grupoDe(k)||{}).n||'Grupo'):k;
const kGrupos=()=>'bloques-chat-grupos-'+lc(S.me);
/* ── Amigos (v67) ── */
const kAm=()=>'bloques-chat-amigos-'+lc(S.me);
const amLimpio=o=>({a:Array.isArray(o&&o.a)?o.a.filter(nombreOk):[],in:Array.isArray(o&&o.in)?o.in.filter(nombreOk):[],out:Array.isArray(o&&o.out)?o.out.filter(nombreOk):[]});
function amEstado(n){const k=lc(n);if(S.am.a.some(x=>lc(x)===k))return 'amigo';if(S.am.in.some(x=>lc(x)===k))return 'te-pidio';if(S.am.out.some(x=>lc(x)===k))return 'pediste';return '';}
function avisarAmigos(){try{window.dispatchEvent(new CustomEvent('bloques-amigos',{detail:{amigos:S.am.a.slice(),in:S.am.in.slice(),out:S.am.out.slice()}}));}catch(_){}}
function guardarAmigos(o,primera){
  const n=amLimpio(o),antes=S.am,a=JSON.stringify(n),ch=a!==JSON.stringify(antes);S.am=n;S.amOk=true;
  if(!ch)return false;ls.set(kAm(),a);

  if(!primera){const nuevas=n.in.filter(x=>!antes.in.some(y=>lc(y)===lc(x)));for(const x of nuevas){if(H.busy())beep('soft');else{beep('msg');toast(x,'Te mandó una solicitud de amistad 🤝',x);}}}
  avisarAmigos();return true;}
async function amAccion(accion,p,ok){
  try{const j=await call(auth({accion,...p}));if(j.amigos)guardarAmigos(j.amigos);if(ok)S.err='';poll();return j;}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para agregar amigos hay que pegar el código nuevo de la planilla.':String(e.message||e);}
  finally{p0().dataset.sig='';render();}
}
const pedirAmistad=n=>amAccion('amigoPedir',{para:n},true);
const responderAmistad=(n,si)=>amAccion('amigoResponder',{de:n,si:si?1:0},true);
const cancelarAmistad=n=>amAccion('amigoCancelar',{para:n},true);
const quitarAmigo=n=>amAccion('amigoQuitar',{con:n},true);
function guardarGrupos(L){if(!Array.isArray(L))return false;const a=JSON.stringify(L),ch=a!==JSON.stringify(S.grupos);S.grupos=L;if(ch)ls.set(kGrupos(),a);return ch;}
function unreadFrom(n){const r=S.read[lc(n)]||0;if(esGK(n))return S.msgs.filter(m=>conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(esG(m)){if(lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>(S.read[conv(m)]||0))n++;continue;}if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ──
   v76: si está el «latido» (chat/latido.js), la consulta la hace él para toda la página: el chat sólo le dice qué
   necesita (armarChat) y procesa la respuesta (recibirChat). Si la planilla es vieja, vuelve a preguntar solo, como antes. */
const conLatido=()=>!!(window.LATIDO&&LATIDO.usable());
const msChat=()=>document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:0;
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  if(conLatido()){LATIDO.registrar('chat',PARTE);return;}   // el latido ajusta su paso (2 s con una charla abierta)
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
function cuentaAlDia(){const a=acct();if(!a){if(S.me){loadLocal();render();}return null;}if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}return a;}
function armarChat(p){
  Object.assign(p,{estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last});
  const pend=invPendientes();if(pend.length)p.invs=pend;
  if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&Date.now()-S.typedAt<4000)p.escribe=S.con;
  if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
  if(conLatido())p.q.pr=1;   // quién está conectado viene en el latido (la lista entera, cada 5 minutos)
  return p;
}
// v76: lo de «en línea» que trae el latido se aplica a la lista que ya tenemos (sin bajarla entera).
function aplicarPresencia(pr){
  if(!Array.isArray(pr)||!S.users.length)return false;
  const M=new Map(pr.map(x=>[lc(x[0]),x[1]]));let falta=false;
  for(const k of M.keys())if(!S.users.some(u=>lc(u.usuario)===k))falta=true;
  const on=a=>a.filter(u=>u.enLinea).map(u=>lc(u.usuario)).sort().join(',');const antes=on(S.users);
  S.users=S.users.map(u=>{const k=lc(u.usuario),en=M.has(k);return en===u.enLinea&&JSON.stringify(u.estado||null)===JSON.stringify(en?M.get(k):null)?u:{...u,enLinea:en,estado:en?M.get(k):null};});
  S.users.sort((a,b)=>(b.enLinea-a.enLinea)||a.usuario.localeCompare(b.usuario));
  if(on(S.users)!==antes)avisarAmigos();
  try{revisarConexiones();}catch(_){}
  return falta;
}
async function recibirChat(j){
    if(!cuentaAlDia())return;
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}

  ta.value='';autoGrow(ta);ta.focus();
  const pl=JSON.stringify({x:txt}),tmp={id:'tmp'+Date.now()+Math.random().toString(36).slice(2,6),de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:Date.now(),tmp:true};
  S.plain[tmp.id]={x:txt};S.msgs.push(tmp);saveMsgs();render();

async function mandar(tmp){
  tmp.fail=false;tmp.sending=true;$('.cx-panel')&&($('.cx-panel').dataset.sig='');render();
  try{
    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    if(!S.msgs.some(x=>x.id===j.id)){const m={id:j.id,de:S.me,para:tmp.para,tipo:'msg',cont:'',p:tmp.p,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]=S.plain[tmp.id];}

function llamadoHtml(c,m){
  const mine=lc(m.de)===lc(S.me),ic={truco:'🃏',uno:'🎴',poblar:'🏘️',bloquear:'🧱',ajedrez:'♟️',ludo:'🎲',pool:'🎱',invasores:'👾',marcar:'🎯',fortinar:'🏰'}[c.j]||'🎮',viejo=Date.now()-m.t>30*60e3;
  const yo=S.espero&&S.espero.mid===m.id,vencio=yo&&Date.now()-S.espero.t>150000;
  let pie='';
  if(mine)pie=`<span class="cx-inv-st st-esperando">Avisaste al grupo: los que se prenden te llegan solos a la mesa.</span>`;
  else if(viejo)pie=`<span class="cx-inv-st st-vieja">Ya pasó un rato: puede que la mesa ya esté jugando.</span>`;
  else if(yo&&!vencio)pie=`<span class="cx-inv-st st-esperando"><i class="cx-spin"></i> Esperando que ${esc(c.host||m.de)} te haga lugar…</span>`;
  else if(yo&&vencio)pie=`<span class="cx-inv-msg">No te llegó lugar: puede que la mesa ya se haya llenado.</span><span class="cx-inv-b"><button type="button" class="cx-cplay" data-a="meprendo" data-id="${esc(m.id)}">Probar de nuevo</button></span>`;

async function mePrendo(mid){

  S.espero={host:c.host||m.de,j:c.j,mesa:c.mesa||'',t:Date.now(),mid};try{sessionStorage.setItem('bloques-chat-espero',JSON.stringify(S.espero));}catch(_){}

// Llegó la invitación del que armó la mesa: se entra solo (es la que pediste con «Me prendo»).
// v70.1: la planilla 19 no conoce LudAR ni PoolAR: su tarjeta dice «BloqueAR · Duelo en línea». Se mira esa invitación
// (una sola vez por tarjeta) y se corrige el juego que muestra la tarjeta y adónde lleva «Entrar».
const INV_PREF={TRUCO:'truco',UNO:'uno',POBLAR:'poblar',AJEDREZ:'ajedrez',LUDO:'ludo',POOL:'pool',INVASOR:'invasores',MARCAR:'marcar',FORTINAR:'fortinar'};
async function invCorregir(){
  if(!(S.ver&&S.ver<20))return;S.invFix=S.invFix||{};
  for(const m of S.msgs.slice(-40)){const c=invCard(m);
    if(!c||c.j!=='bloquear'||S.invFix[c.inv]||lc(m.de)===lc(S.me)||(S.invSt[c.inv]&&S.invSt[c.inv]!=='esperando'))continue;
    S.invFix[c.inv]=1;
    try{const j=await call(auth({accion:'buzon',ver:c.inv})),iv=j.invitacion,of=String(iv&&iv.id===c.inv&&iv.oferta||''),k=(/^([A-Z]+):/.exec(of)||[])[1],g=k&&INV_PREF[k];
      if(!g)continue;let o=null;try{o=JSON.parse(of.slice(of.indexOf(':')+1));}catch(_){}

      if($('.cx-panel'))$('.cx-panel').dataset.sig='';if(S.open)render();badges();

}
function esperoRevisar(fresh){
  const e=S.espero;if(!e||Date.now()-e.t>(e.cita?20*60e3:180000))return;   // v82: por un link del chat se espera más (el que invitó tiene que llegar a la mesa)
  // v70.1: una planilla vieja no conoce los juegos nuevos (LudAR, PoolAR…) y marca su tarjeta como «bloquear»: también vale.
  for(const m of fresh){const c=invCard(m);if(!c||lc(m.de)!==lc(e.host)||(e.j&&c.j!==e.j&&!(c.j==='bloquear'&&INV_URL[e.j])))continue;
    S.espero=null;try{sessionStorage.removeItem('bloques-chat-espero');}catch(_){}
    invAccion('inventrar',c.inv,c.j==='bloquear'&&e.j&&INV_URL[e.j]?e.j:c.j);return;}
}
// Para los juegos: avisar en un grupo que hay lugar en la mesa.
async function llamar(gid,card){
  const g=grupoDe(gid);if(!g)throw new Error('No encontramos ese grupo.');
  const pl=JSON.stringify({x:'',card:{...card,ll:1,host:S.me}}),para='g:'+g.id;

function injectCss(){if($('#cx-css'))return;const s=document.createElement('style');s.id='cx-css';s.textContent=CSS;document.head.appendChild(s);}

/* ── Arranque ── */
function bindButtons(){document.querySelectorAll('[data-chat-btn]').forEach(b=>{if(!b.dataset.cxOn){b.dataset.cxOn='1';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();S.open?close():open();});}});badges();}
function init(opts={}){
  Object.assign(H,opts);injectCss();ensureDom();loadLocal();
  bindButtons();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){ST.lastInput=Date.now();document.title=baseTitle;poll();}});
  for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,()=>{ST.lastInput=Date.now();},{passive:true,capture:true});
  ST.frase=ls.get('bloques-chat-frase');
  window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'||e.key===kKey){loadLocal();render();badges();}});
  // (v67) Lo que leíste en otro dispositivo llega con SYNCRO: se suma acá, así no vuelve a aparecer como no leído.
  window.addEventListener('bloques-sync',()=>{if(!S.me)return;let ch=false;const R=ls.json(kRead(),{})||{};
    for(const [k,t] of Object.entries(R)){const v=Number(t)||0;if(v>(S.read[k]||0)){S.read[k]=v;ch=true;}}
    if(aplicarBorrados(ls.json(kBorr(),{})||{}))ch=true;if(ch){badges();if(S.open){p0().dataset.sig='';render();}}});
  badges();
  if(conLatido())LATIDO.registrar('chat',PARTE);   // v76: arranca el latido (pregunta en 1,2 s)
  else if(acct())setTimeout(poll,1200);
}
/* ── v81 · INVITAR CON UN LINK (pedido del 31/10: «poder mandar invitaciones como links para copiar y compartir por WhatsApp»)
   El juego invita a CHAT.LINK (un lugar «por link») y la planilla guarda la invitación sin destinatario (acción invitar con
   abierta: 1). CHAT.linkCompartir(id, juego) muestra el link para copiar, mandar por WhatsApp o compartir. El que lo abre:
   con cuenta, entra solo a la mesa (es la misma invitación de siempre, la acepta como si tocara «Entrar» en el chat);
   sin cuenta, la crea (o entra) y después lo lleva a la mesa. Vale mientras el que invita espera, como cualquier invitación. */
const LINK_U=Object.freeze({usuario:'Alguien con el link',avatar:'🔗',color:'#25d366',link:true});
const PAG_J={bloquear:'',truco:'truco.html',uno:'uno.html',poblar:'poblar.html',ajedrez:'ajedrez.html',ludo:'ludo.html',pool:'pool.html',invasores:'invasores.html',marcar:'marcar.html',fortinar:'fortinar.html'};
function paginaJ(){const f=(location.pathname.split('/').pop()||'').toLowerCase();for(const k in PAG_J)if(PAG_J[k]&&PAG_J[k]===f)return k;return /^(|index\.html|bloques\.html)$/.test(f)?'bloquear':'';}
function linkDe(id,j){const a=acct(),base=location.href.replace(/[#?].*$/,'').replace(/[^/]*$/,''),pg=PAG_J[j]||(location.protocol==='file:'?'index.html':'');
  return `${base}${pg}#unirse=${id}${a?'&de='+encodeURIComponent(a.usuario):''}`;}
function linkBoton(txt){linkCss();return `<button type="button" class="cx-linkb" data-link-inv><span>🔗</span><b>${esc(txt||'Invitar con un link')}<small>Para mandar por WhatsApp o donde quieras</small></b></button>`;}
function linkCerrar(){const e=document.getElementById('cx-lk');if(e)e.remove();}
function linkCompartir(id,j,det){
  linkCss();linkCerrar();const url=linkDe(id,j),nom=GAMES[j]||'BloqueAR',txt=`¡Vení a jugar ${nom} conmigo${det?' ('+det+')':''}! Entrá con este link: ${url}`;
  const el=document.createElement('div');el.id='cx-lk';el.className='cx-lk';el.setAttribute('role','dialog');el.setAttribute('aria-label','Invitar con un link');
  el.innerHTML=`<div class="cx-lk-c"><h3>🔗 Invitá con un link</h3><p>Mandale este link a quien quieras: entra el primero que lo abra con su cuenta (si no tiene, se la crea en un toque). Vale mientras esperás.</p>
    <input class="cx-lk-u" readonly value="${esc(url)}" aria-label="Link de la invitación">
    <a class="cx-lk-wa" href="https://wa.me/?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp</a>
    <div class="cx-lk-r"><button type="button" data-lk="copiar">📋 Copiar link</button>${navigator.share?'<button type="button" data-lk="share">📤 Compartir…</button>':''}</div>
    <button type="button" class="cx-lk-x" data-lk="x">Listo, espero acá</button></div>`;
  document.body.appendChild(el);
  el.addEventListener('click',async e=>{const b=e.target.closest('[data-lk]');if(e.target===el){linkCerrar();return;}if(!b)return;const k=b.dataset.lk;
    if(k==='x')linkCerrar();
    else if(k==='copiar'){let ok=false;try{await navigator.clipboard.writeText(url);ok=true;}catch(_){try{const i=el.querySelector('.cx-lk-u');i.select();ok=document.execCommand('copy');}catch(_){}}b.textContent=ok?'✓ Copiado':'Copialo de arriba';setTimeout(()=>{b.textContent='📋 Copiar link';},2200);}
    else if(k==='share'){try{await navigator.share({title:'Jugá '+nom+' conmigo',text:txt.replace(url,'').trim(),url});}catch(_){}}});
  return url;}
// Para el juego: con quién quedó (la planilla dice quién entró por el link) → {usuario, avatar, color} o null.
function linkQuien(r){return r&&r.quien&&r.quien.usuario?{usuario:String(r.quien.usuario),avatar:r.quien.avatar||'🙂',color:r.quien.color||'#7ce9e5'}:null;}
const LK_K='bloques-unirse';
function linkLlegada(){
  let P=null;const m=/[#&]unirse=([A-Za-z0-9]{6,16})(?:&de=([^&#]*))?/.exec(location.hash);
  if(m){let de='';try{de=decodeURIComponent(m[2]||'').slice(0,20);}catch(_){}P={id:m[1],de,j:paginaJ()||'bloquear',t:Date.now()};
    try{history.replaceState(null,'',location.href.replace(/#.*$/,''));}catch(_){}ls.set(LK_K,JSON.stringify(P));}
  else{P=ls.json(LK_K,null);if(P&&(!P.id||Date.now()-P.t>20*60e3)){ls.set(LK_K,null);P=null;}}
  if(!P)return;
  const ir=()=>{const a=acct();if(!a)return false;ls.set(LK_K,null);linkCerrar();
    try{sessionStorage.setItem(INV_KEY[P.j]||'blq-accept',P.id);}catch(_){}
    if(paginaJ()!==P.j){location.href=(PAG_J[P.j]||'./');}return true;};
  if(ir())return;
  // sin cuenta: lo invitamos a crearla y, apenas la tenga, lo llevamos a la mesa
  const mostrar=()=>{if(acct()||document.getElementById('cx-lk'))return;linkCss();const el=document.createElement('div');el.id='cx-lk';el.className='cx-lk';el.setAttribute('role','dialog');
    el.innerHTML=`<div class="cx-lk-c"><h3>🎮 ${esc(P.de||'Un amigo')} te invitó a jugar ${esc(GAMES[P.j]||'BloqueAR')}</h3><p>Para entrar a la mesa necesitás una cuenta de BloqueAR: es gratis, con un usuario y un PIN. Apenas la tengas, te llevamos a la mesa.</p>
      <a class="cx-lk-wa" href="./#cuenta" data-lk="cuenta">Crear cuenta o entrar</a><button type="button" class="cx-lk-x" data-lk="x">Ahora no</button></div>`;
    document.body.appendChild(el);el.addEventListener('click',e=>{const b=e.target.closest('[data-lk]');if(b&&b.dataset.lk==='x'){ls.set(LK_K,null);linkCerrar();}});};
  if(!/#cuenta/.test(location.hash)){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(mostrar,400));else setTimeout(mostrar,400);}

   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)

       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));

   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve
     libre por toda la pantalla. movible(el, juego, {abrir, cerrar, btn, visible, ancla}) — abrir: cómo reabrirlo desde

/* ── La barrita del chat minimizado ── */
function miniEl(j){const R=REG[j];if(!R)return null;

function miniVisible(j){const R=REG[j];if(!R||!R.min)return false;let v=true;try{if(R.op.visible)v=!!R.op.visible();else if(R.op.btn){const b=typeof R.op.btn==='function'?R.op.btn():R.op.btn;v=!!(b&&!b.hidden);}}catch(_){}return v;}

  const p=R.el,r=p.getBoundingClientRect(),abajo=r.top+r.height/2>innerHeight/2,izq=r.left+r.width/2<innerWidth/2;

    // la barrita queda donde estaba el panel: en su esquina de abajo (o de arriba) del lado donde estaba
    const w=b.offsetWidth||110,h=b.offsetHeight||40;encerrar(b,izq?r.left:r.right-w,abajo?r.bottom-h:r.top);posGuardar(j,'mini',centro(b));}

// Globito arriba de la barrita (o abajo si está pegada arriba); tocarlo abre el chat.
function miniBurb(j,de,txt){const R=REG[j];if(!R)return;css();

// Dónde sale el globito con el chat cerrado (no minimizado): del lado y a la altura donde dejaste el chat.
function burbLugar(){if(!S.burb)return;const o=posLeer(S.op&&S.op.juego,'pos');const b=S.burb.style;

function nota(){const n=S.op&&S.op.nota;try{return (typeof n==='function'?n():n)||'Sólo lo ve la gente de esta mesa y se borra al terminar.';}catch(_){return '';}}

function cerrar(){S.abierto=false;if(S.panel)S.panel.hidden=true;badge();}
function mandar(txt){
  txt=limpiar(txt);if(!txt||!S.op)return false;

/* «Avisar a un grupo» (v66): desde la mesa de espera de un juego, el que la armó avisa en un grupo del chat 💬

      :'<p class="mc-pn">Todavía no estás en ningún grupo. Armá uno en el chat 💬 (👥 Armar un grupo) y volvé.</p><button type="button" class="mc-pchat">Abrir el chat</button>'}</div>`;
  ['pointerdown','touchstart','keydown'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));

let notiCorre=false;

const KU='pampa-notis-unido';

async function notis(ya){

  notiCorre=true;ls.set(KT,String(Date.now()));let r=null;

  const sig=()=>{const n=cola.shift();if(!n){if(evs.length){const pil=()=>{if(!listo()||document.querySelector('.pa-pil')){setTimeout(pil,1500);return;}if(enInicio())pildoraEventos(r.semana,eventosNuevos(r));notiCorre=false;};pil();}else notiCorre=false;return;}
    const V=new Set(vistos());if(n.ids.every(i=>V.has(i))){sig();return;}   // ya lo vio en otro aparato o en el mapa
    const prob=()=>{if(!listo()){setTimeout(prob,1500);return;}if(n.ids.every(i=>new Set(vistos()).has(i))){sig();return;}marcar(n.ids);avisarVisto(n.ids);abrirNoti(n);esperar();};prob();};
  const esperar=()=>{if(document.querySelector('.pa-scrim')){setTimeout(esperar,800);return;}setTimeout(sig,600);};

}
let corriendo=false;
async function mirar(){
  if(corriendo)return;const sem=lunesHoy();if(ls.get(K)===sem)return;
  if(!window.CHAT||typeof CHAT.api!=='function')return;
  corriendo=true;let r=null;
  try{r=await CHAT.api({accion:'pampaAviso'});}catch(_){corriendo=false;return;}   // sin conexión: la próxima vez
  if(!r||!r.ok){corriendo=false;return;}
  if(!r.pasada||!(r.top||[]).length){ls.set(K,sem);corriendo=false;return;}   // la semana pasada no se jugó: nada que contar
  // Espera a que no haya Novedades a la vista, ni una partida en curso, ni la pestaña escondida.
  const listo=()=>!document.querySelector('.nv-scrim,.nv-toast,.pa-scrim')&&document.visibilityState==='visible'&&!(window.CHAT&&CHAT.ocupado&&CHAT.ocupado());
  const intentar=()=>{if(ls.get(K)===sem){corriendo=false;return;}if(!listo()){setTimeout(intentar,1500);return;}if(abrir(r,sem))ls.set(K,sem);corriendo=false;};

function arrancar(){
  if(window.top!==window)return;                                     // dentro de la ventanita de la estancia
  if(/pampa\.html$/.test(location.pathname)){ls.set(K,lunesHoy());return;}   // en La Gran Pampa ya se ve todo
  if(navigator.webdriver&&ls.get('bloques-pa-force')!=='1')return;    // las pruebas automáticas no lo ven (salvo que lo pidan)
  setTimeout(mirar,2600);setTimeout(notis,3400);   // v81: después del semanal, los avisos personales
  // v83: el latido avisa si cambió algo en un cruce donde defendés («pat»): se pregunta enseguida
  const engancharLatido=(n)=>{if(window.LATIDO&&typeof LATIDO.registrar==='function'){LATIDO.registrar('pampa-at',{recibir(j){if(j&&j.pat&&String(j.pat)!==ls.get('pampa-pat')){ls.set('pampa-pat',String(j.pat));setTimeout(()=>notis(true),400);}}});return;}if(n<20)setTimeout(()=>engancharLatido(n+1),1000);};
  engancharLatido(0);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){setTimeout(mirar,1500);setTimeout(notis,2400);}});
}
if(document.readyState==='complete')arrancar();else window.addEventListener('load',arrancar,{once:true});
window.PAMPA_AVISO={mirar,abrir,lunesHoy,notis,armarNotis,abrirNoti,pildoraEventos,eventosNuevos};

    else cuerpo=`<div class="adm-2"><input id="adm-q" type="search" placeholder="Buscar un usuario" value="${esc(P.q)}" autocomplete="off"><button type="button" class="adm-go" id="adm-qb">Buscar</button></div>

  else if(P.tab==='log')cuerpo=P.log?P.log.length?P.log.map(l=>`<div class="adm-li"><span><b>${esc(l.acc)}</b>${l.u?' · '+esc(l.u):''}<small>${esc(l.d)}</small></span><small>${l.t?new Date(l.t).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):''} · ${esc(l.a)}</small></div>`).join(''):'<p class="adm-note">Todavía no hay nada.</p>':'<p class="adm-note">Cargando…</p>';
  d.innerHTML=`<div class="adm-c"><header><b>🛠️ Administración</b><button type="button" class="adm-xx" id="adm-cerrar" aria-label="Cerrar">✕</button></header>

  const $=id=>document.getElementById(id);
  $('adm-cerrar').onclick=cerrar;d.onclick=e=>{if(e.target===d)cerrar();};
  d.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{P.tab=b.dataset.tab;P.msg='';if(P.tab==='log')op({op:'log'},j=>{P.log=j.log;});pintar();});
  if($('adm-eco-ok'))$('adm-eco-ok').onclick=()=>{const eco={};d.querySelectorAll('[data-eco]').forEach(i=>{eco[i.dataset.eco]=Number(String(i.value).replace(',','.'));});
    op({op:'eco',eco},j=>{P.d.eco=j.eco;P.msg='Listo: la economía quedó guardada.';ls.set(CFG_K,JSON.stringify({g:j.g,eco:j.eco,an:j.an,t:Date.now()}));});};
  if($('adm-an-ok'))$('adm-an-ok').onclick=()=>{const t=$('adm-an').value.trim();if(!t){P.msg='Escribí el anuncio.';pintar();return;}op({op:'eco',an:{txt:t}},j=>{P.d.an=j.an;P.msg='Listo: el anuncio quedó publicado.';try{if(j.an&&j.an.id){const v=ls.json(AN_K,[]);v.push(j.an.id);ls.set(AN_K,JSON.stringify(v.slice(-30)));}ls.set(CFG_K,JSON.stringify({g:j.g,eco:j.eco,an:j.an,t:Date.now()}));}catch(_){}});};

  if($('adm-tipo'))$('adm-tipo').onchange=()=>{$('adm-modo').disabled=$('adm-tipo').value==='his';};
  if($('adm-ban'))$('adm-ban').onclick=()=>{const on=!P.ver.ban;if(on&&!confirm(`¿Suspender a ${P.ver.u} de los rankings? Sus puntajes no se muestran hasta que lo vuelvas a habilitar.`))return;
    op({op:'ban',quien:P.ver.u,on},()=>recargar());};
  if($('adm-plata'))$('adm-plata').onclick=()=>{const u=P.ver.u;op({op:'plata',quien:u},j=>{if(P.ver&&P.ver.u===u)P.ver.plata=j;});};
  d.querySelectorAll('[data-rest]').forEach(b=>b.onclick=()=>{const u=P.ver.u,f=Number(b.dataset.rest),pl=Number(b.dataset.plata);
    if(!confirm(`¿Volver la estancia de ${u} a esta copia, con $${fmt(pl)}? Lo que hizo después de esa copia se pierde. Sus aparatos la traen solos.`))return;
    op({op:'restaurar',quien:u,fila:f},j=>{const m=`Listo: la estancia de ${u} volvió a la copia ($${fmt(j.plata)}). Sus aparatos la traen solos. Queda en el registro.`;return op({op:'plata',quien:u},k=>{if(P.ver&&P.ver.u===u)P.ver.plata=k;P.msg=m;});});});
  d.querySelectorAll('[data-borrar]').forEach(b=>b.onclick=()=>{if(!confirm('¿Borrar este puntaje? No se puede deshacer.'))return;op({op:'borrar',quien:P.ver.u,fila:Number(b.dataset.borrar),hoja:b.dataset.hoja},()=>{P.msg='Puntaje borrado.';return recargar();});});
}

<script>
/* ───────── v82 · La cara del gaucho como foto, para que la vean todos ─────────
   Va en todas las páginas (después de chat.js). Antes sólo vos veías tu cara; los demás veían 🧑‍🌾.
   · Subir: si usás la cara de tu gaucho (avatar 🧑‍🌾), la imagen que deja EstanciAR («bloques-cara-v1») se achica a
     48 px (~2 KB) y se sube una vez por cada cambio (accion «cara»). La planilla guarda la versión (cv).
   · Bajar: la lista de usuarios trae sólo la versión de cada cara (cv). Las que faltan o cambiaron se piden juntas, de a
     40 (accion «caras»), y quedan guardadas en este aparato («bloques-caras-v1»), así no se vuelven a bajar.
   · Mostrar: CARAS.url(nombre) da la imagen (o '' y la pide). Los que dibujan avatares ponen data-cara-u="nombre" en el
     círculo del 🧑‍🌾; cuando llega una cara, CARAS.pintar() la pone en todos los círculos que la esperan.
   API: window.CARAS = {GA, url(nombre), ver(usuarios), subir(forzar), pintar(raiz), img(nombre)} */
(function(){
'use strict';
if(window.CARAS)return;
const GA='🧑‍🌾',K='bloques-caras-v1',KS='bloques-cara-subida',KL='bloques-cara-v1';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v;}catch(_){return d;}}};
const lc=s=>String(s||'').toLowerCase();
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const okUrl=u=>typeof u==='string'&&/^data:image\/(webp|png|jpeg);base64,[A-Za-z0-9+/=]+$/.test(u)&&u.length<=8000;
let C=ls.json(K,{});if(!C||typeof C!=='object')C={};
const pedidas=new Set();let cola=new Set(),tm=0;
async function call(p,ms=15000){const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'error');return j;}finally{clearTimeout(to);}}
function guardar(){const ks=Object.keys(C);if(ks.length>250){ks.sort((a,b)=>(C[a].t||0)-(C[b].t||0)).slice(0,ks.length-250).forEach(k=>delete C[k]);}ls.set(K,JSON.stringify(C));}
function prog(){if(!tm)tm=setTimeout(bajar,250);}
async function bajar(){tm=0;const L=[...cola].slice(0,40);cola=new Set([...cola].slice(40));if(!L.length)return;L.forEach(k=>pedidas.add(k));
  try{const j=await call({accion:'caras',nombres:L});const R=j.caras||{};let n=0;
    for(const k of Object.keys(R)){const x=R[k]||{};C[lc(k)]={v:String(x.v||''),url:okUrl(x.url)?x.url:'',t:Date.now()};n++;}
    if(n){guardar();pintar();try{window.dispatchEvent(new CustomEvent('bloques-caras'));}catch(_){}}}
  catch(_){L.forEach(k=>pedidas.delete(k));}   // sin conexión: se vuelve a pedir la próxima vez
  if(cola.size)prog();}
// La imagen de la cara de alguien (si la tenemos). Si no la tenemos, se pide (una vez por sesión).
function url(n){const k=lc(n);if(!k)return '';const me=acct();if(me&&lc(me.usuario)===k){const d=propia();if(d)return d;}
  const x=C[k];if(x&&x.url)return x.url;if(!x&&!pedidas.has(k)){cola.add(k);prog();}return '';}
// Con la lista de usuarios (que trae cv): pide las caras nuevas o que cambiaron.
function ver(L){if(!Array.isArray(L))return;let n=0;for(const u of L){if(!u||u.avatar!==GA||!u.cv)continue;const k=lc(u.usuario),x=C[k];if((!x||x.v!==u.cv)&&!pedidas.has(k+':'+u.cv)){pedidas.add(k+':'+u.cv);cola.add(k);n++;}}if(n)prog();}
function propia(){let d=ls.get(KL)||'';if(d[0]==='{'){try{d=JSON.parse(d).url||'';}catch(_){d='';}}return /^data:image\/(png|webp|jpeg);base64,/.test(d)&&d.length<200000?d:'';}
function img(n){const u=url(n);return u?`<img class="cara82" src="${u}" alt="">`:'';}
function css(){if(document.getElementById('cara82-css'))return;const s=document.createElement('style');s.id='cara82-css';
  s.textContent='.cara82-on{overflow:hidden!important;padding:0!important;font-size:0!important}.cara82-on>img.cara82{width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit}';(document.head||document.documentElement).appendChild(s);}
// Pone la cara en los círculos que la esperan (los que tienen data-cara-u).
function pintar(root){root=root||document;try{css();root.querySelectorAll('[data-cara-u]').forEach(el=>{const k=lc(el.dataset.caraU),me=acct(),u=(me&&lc(me.usuario)===k&&propia())||(C[k]&&C[k].url);
  if(!u)return;const i=el.querySelector('img.cara82');if(i&&i.getAttribute('src')===u)return;el.innerHTML=`<img class="cara82" src="${u}" alt="">`;el.classList.add('cara82-on');});}catch(_){}}
// Subir la cara propia: sólo si usás el 🧑‍🌾 y la imagen cambió desde la última vez que se subió.
let subiendo=false;
function achicar(src,lado,q){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=lado;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(im,0,0,lado,lado);
  let d=c.toDataURL('image/webp',q);if(!d.startsWith('data:image/webp'))d=c.toDataURL('image/png');res(d);}catch(_){res('');}};im.onerror=()=>res('');im.src=src;});}
function firma(s){let h=0;for(let i=0;i<s.length;i+=7)h=(h*31+s.charCodeAt(i))|0;return s.length+':'+h;}
async function subir(forzar){const a=acct();if(!a||a.avatar!==GA||subiendo)return false;const d=propia();if(!d)return false;
  const f=lc(a.usuario)+'|'+firma(d);if(!forzar&&ls.get(KS)===f)return false;subiendo=true;
  try{let s=await achicar(d,48,.82);if(s.length>6000)s=await achicar(d,40,.7);if(!s||s.length>6000)return false;
    const j=await call({accion:'cara',usuario:a.usuario,token:a.token,url:s});ls.set(KS,f);C[lc(a.usuario)]={v:String(j.cv||''),url:s,t:Date.now()};guardar();return true;}
  catch(_){return false;}finally{subiendo=false;}}
window.CARAS={GA,url,ver,subir,pintar,img,_cache:()=>C};
// Al abrir: subir si hace falta; y cuando EstanciAR cambia la cara (en esta u otra pestaña), de nuevo.
setTimeout(()=>{subir(false);pintar();},3500);
window.addEventListener('storage',e=>{if(e.key===KL||e.key==='bloques-acct-v1')setTimeout(()=>subir(false),800);});
setInterval(()=>{if(!document.hidden)subir(false);},90000);
/* ── v83 · La cara en los asientos de cada juego (TrucAR, UnoAR, LudAR, PoolAR, PoblAR, AjedrezAR): esos juegos dibujan
   el círculo del avatar sin el nombre (span.av con el 🧑‍🌾). Acá se busca el nombre que está al lado del círculo
   (el <b> del asiento; «Vos» = tu cuenta) y se le pone data-cara-u, así pintar() pone la cara cuando la tiene.
   Sólo mira los círculos con el 🧑‍🌾: los de la compu (🤖, 🦉…) ni se tocan. Barato: una pasada cada vez que cambia algo,
   como mucho cada 400 ms. */
const PAG83=((location.pathname.split('/').pop()||'').replace(/\.html$/,'')||'index').toLowerCase();

const SS={get(k){try{return sessionStorage.getItem(k);}catch(_){return null;}},set(k,v){try{sessionStorage.setItem(k,v);}catch(_){}}};
function hubMomento(){if(quieto()||SS.get('jugo-hub'))return;SS.set('jugo-hub','1');
  const L=[...document.querySelectorAll('#hub .hub-game')].filter(e=>e.getClientRects().length).slice(0,12);
  L.forEach((e,i)=>{try{e.animate([{opacity:0,transform:'translateY(12px) scale(.97)'},{opacity:1,transform:'none'}],{duration:320,delay:60+i*32,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});}catch(_){}});}
function hubOro(){const el=document.querySelector('#hub-oro [data-oro-saldo]');if(!el)return;const v=parseInt((el.textContent||'').replace(/\D/g,''),10);if(!(v>=0))return;
  const k='jugo-oro-visto',antes=parseInt(SS.get(k)||'',10);SS.set(k,String(v));
  if(antes>=0&&v>antes){setTimeout(()=>{contar(el,700,antes);const c=centro(el);burst(c.x,c.y,{n:10,col:C.oro,arriba:true,grav:-.01,vel:2,vida:650});},350);}}
if(/^(index|bloques)$/.test(PAG)){const mira=()=>{const h=document.getElementById('hub');if(!h)return;let antes=h.hidden;const ver=()=>{hubMomento();setTimeout(hubOro,60);};
  if(!h.hidden)setTimeout(ver,120);new MutationObserver(()=>{const ahora=h.hidden;if(antes&&!ahora)setTimeout(ver,60);antes=ahora;}).observe(h,{attributes:true,attributeFilter:['hidden']});};
  if(document.readyState==='loading')addEventListener('DOMContentLoaded',mira);else mira();}

/* ── Jugo por juego. Criterio: lo bueno se festeja en proporción (un acierto, chispitas; ganar, papel picado);
      lo malo se nota con un temblor chiquito y nada más; nada se repite solo ni apura a nadie. ── */
const C={oro:['#ffe08a','#ffb84d','#fff6d6'],celeste:['#74b9e8','#ffffff','#f2c14e'],uno:['#e5574a','#f6c453','#4fae6a','#3f86d6'],
  polvo:['#c9b38f','#a8916d','#e6d6b6'],rojo:['#ff6b5b','#ffb27a','#ffd7a8'],hoja:['#ff9fc0','#ffd1e1','#fff'],verde:['#57d49b','#bff2d8','#fff'],humo:['#3a3a3a','#6a5a4a','#8a7a6a']};
const H={
  truco(k,x){
    if(k==='truco')temblor('#felt|#eq-felt',2);else if(k==='retruco')temblor('#felt|#eq-felt',3);else if(k==='vale4'){temblor('#felt|#eq-felt',4,300);}
    else if(k==='flor'){const p=punto('#felt|#eq-felt',0);burst(p.x,p.y,{n:16,col:C.hoja,tipo:'estrella',tam:4,vel:2.6,grav:.03});}
    else if(k==='puntos'){const p=punto('#score|#eq-top',0);burst(p.x,p.y,{n:6+Math.min(6,x||1)*2,col:C.oro,arriba:true,grav:-.02,vel:2.2,vida:700});}
    else if(k==='gano')confeti(C.celeste);},
  uno(k){
    if(k==='uno'){const p=punto('#me',0);burst(p.x,p.y,{n:22,col:C.uno,vel:4,tam:3.4});temblor('#hand',2);}
    else if(k==='gano')confeti(C.uno);},
  ludo(k){
    if(k==='comer'){const p=punto('#tab');burst(p.x,p.y,{n:18,col:C.rojo,vel:3.6});temblor('#tabwrap|#tab',3);}
    else if(k==='comido')temblor('#tabwrap|#tab',2,200);
    else if(k==='meta'){const p=punto('#tab');burst(p.x,p.y,{n:14,col:C.oro,tipo:'estrella',tam:4.5,vel:2.8,grav:.02});}
    else if(k==='seis')pop('#dado',1.18);},
  ajedrez(k){
    const dest=()=>{const L=[...document.querySelectorAll('#board .sq.last')].find(s=>s.querySelector('.pz'));return L||null;};
    if(k==='comer'){const d=dest();const p=d?centro(d):punto('#board');burst(p.x,p.y,{n:12,col:C.polvo,tipo:'polvo',tam:3,vel:2,grav:.02,vida:520});}
    else if(k==='jaque'){const b=q('#bwrap|#board');if(b&&b.animate&&!quieto())try{b.animate([{boxShadow:'0 0 0 0 #ef6f6c00'},{boxShadow:'0 0 0 4px #ef6f6caa'},{boxShadow:'0 0 0 0 #ef6f6c00'}],{duration:520,easing:'ease-out'});}catch(_){}}
    else if(k==='enroque'){const d=dest();if(d){const p=centro(d);burst(p.x,p.y,{n:8,col:C.oro,tipo:'estrella',tam:3,vel:1.8,grav:0});}}
    else if(k==='gano')confeti(['#f4ead5','#2b2b2b','#f2c14e','#b07a3c']);},
  pool(k){if(k==='gano')confeti(['#1f7a4d','#f2c14e','#ffffff','#e5574a']);},
  solos(k){
    const juego=PAG;
    if((k==='palo'||k==='linea')&&juego==='sudoku')return;   // v84: el sudoku va sobrio, sin festejos por línea
    if(k==='palo'||k==='linea'){const n=combo(juego+':ok',k==='palo'?5000:9000),p=punto(juego==='sudoku'?'#tab':'#mesa');
      burst(p.x,p.y,{n:k==='linea'?18:10,col:k==='linea'?C.verde:C.oro,tipo:'estrella',tam:k==='linea'?4:3.2,vel:k==='linea'?3:2.3,grav:.02});
      if(n>=2)texto('×'+n,p.x,p.y-24,{col:n>=4?'#ffd36e':'#fff1c2',tam:Math.min(30,18+n*2)});}
    else if(k==='pum'){const p=punto('#tab');burst(p.x,p.y,{n:20,col:C.humo,tipo:'polvo',tam:4,vel:3,grav:-.01,vida:800});temblor('#tab|#vp',5,320);}
    else if(k==='gano')confeti(juego==='solitario'?['#e5574a','#2b2b2b','#ffffff','#f2c14e']:C.verde.concat(['#74b9e8']));},
  poblar(k,x){   // v84: x = {x,y} de la pieza recién construida (PoblAR la calcula); si no viene, como antes
    const aca=()=>x&&isFinite(x.x)&&isFinite(x.y)?x:punto('#board|svg');
    if(k==='town'){const p=aca();burst(p.x,p.y,{n:18,col:C.oro,tipo:'estrella',tam:4,vel:2.8,grav:.02});}
    else if(k==='ranch'){const p=aca();burst(p.x,p.y,{n:10,col:C.oro,vel:2.2});}
    else if(k==='road'){const p=aca();burst(p.x,p.y,{n:6,col:C.polvo,tipo:'polvo',tam:2.4,vel:1.5,grav:0,vida:420});}
    else if(k==='robber')temblor('#board|svg',2);
    else if(k==='win')confeti(['#f2c14e','#b5512e','#57a35d','#3f86d6','#fff']);}
};
function ev(g,k,x){try{if(document.hidden)return;const f=H[g];if(f)f(k,x);}catch(_){}}

window.JUGO={ev,burst,confeti,temblor,pop,texto,contar,combo,quieto,punto,efectos,setEfectos};
})();

</script>

/* ── Estrategia: defender, tomar puestos, CUIDARLOS, hostigar y salir en oleadas (v86) ──

   - toma puestos y deja un guardia en cada uno (custodia);
   - desde «ataqueDesde» y con «ataqueMin» tropas (más cada oleada) sale a pelear: a un puesto del rival, a su ejército
     o a su fortín; si la pelea viene mal y la dificultad lo permite, se retira y vuelve a juntar;
   - normal y difícil mandan jinetes a molestar a los peones. */
function estrategia(G, ia, P, cmds) {
  const yo = P.J, eq = yo.eq, p = ia.p, D = DIFICULTADES[ia.dif];
  const larga = conquista(G);   // Conquista: todo más tarde y con más tropa
  const base = miCentro(P) || P.mios.find(e => e.k === 'b');
  const tropas = P.mios.filter(e => e.k === 'u' && e.t !== 'peon' && (UNIDADES[e.t].reemplaza || e.t) !== 'explorador');
  const enemigosT = P.enemigos.filter(e => e.k === 'u' && e.t !== 'peon');
  const vivo = id => { const e = G.ent.get(id); return e && e.o === p && !e.muerto; };
  // limpiar listas de grupos
  for (const k in ia.guardias) if (!vivo(ia.guardias[k])) delete ia.guardias[k];
  if (ia.hostIds) { ia.hostIds = ia.hostIds.filter(vivo); if (!ia.hostIds.length) ia.hostIds = null; }
  if (ia.esc) { ia.esc = ia.esc.filter(vivo); if (!ia.esc.length) ia.esc = null; }
  const guard = new Set(Object.values(ia.guardias)), host = new Set(ia.hostIds || []);
  const ejercito = tropas.filter(u => !guard.has(u.id) && !host.has(u.id) && !(ia.esc && ia.esc.includes(u.id)));
  // 1) Defensa: tropas enemigas cerca de mi base (todo el mundo, guardias incluidos, salvo los de puestos lejanos)
  // (un baqueano solo que mira no es una invasión: no se para todo por eso)
  const invasores = base ? enemigosT.filter(e => P.mios.some(b => b.k === 'b' && MOTOR.distA(e, b) < L_(8))) : [];
  const soloMiran = invasores.length === 1 && (UNIDADES[invasores[0].t].reemplaza || invasores[0].t) === 'explorador';
  if (invasores.length && !soloMiran) {
    const c = centro(invasores);
    if (ia.modo !== 'defender') anotar(ia, G, 'defiende: ' + invasores.length + ' cerca de la base');
    ia.modo = 'defender'; ia.olaIds = null;
    const libres = ejercito.concat(tropas.filter(u => host.has(u.id))).filter(u => !u.ord || u.ord.k !== 'atacar');
    if (libres.length) cmds.push({c: 'amover', ids: libres.map(u => u.id), x: c[0], y: c[1]});
    return;
  }
  if (ia.modo === 'defender') { ia.modo = 'tomar'; }
  const seg = G.tick / 20;
  const mio = q => q.dueno === eq, delOtro = q => q.dueno >= 0 && q.dueno !== eq;
  const cercaMia = q => base ? MOTOR.dist2(q.x, q.y, base.x, base.y) : 0;
  const fEl = fuerza(G, [...ia.mem.values()].filter(m => m.k === 'u' && m.t !== 'peon'), null);
  const fYo = fuerza(G, ejercito, ia.visto);

  // 2) Custodia: un guardia (lo más barato) en cada puesto propio, si hay tropa de sobra
  // un guardia solo frente a un grupo es gloria regalada: si se acerca tropa, el guardia vuelve al ejército
  for (const k in ia.guardias) { const u = G.ent.get(ia.guardias[k]); if (!u) continue;
    const amenaza = enemigosT.filter(e => MOTOR.dist2(e.x, e.y, u.x, u.y) < L_(6.5) * L_(6.5)).length;
    if (amenaza >= 2) { delete ia.guardias[k]; const c = ejercito.length ? centro(ejercito) : base ? [base.x, base.y] : [u.x, u.y]; cmds.push({c: 'mover', ids: [u.id], x: c[0], y: c[1]}); ia.sinGuardia = G.tick; } }
  if (D.custodia && ejercito.length >= (larga ? 8 : ia.dif === 'dificil' ? 10 : 5) && G.tick - (ia.sinGuardia || -9999) > 20 * 30) {
    for (const [i, q] of G.puestos.entries()) {
      if (!mio(q) || ia.guardias[i]) continue;
      const cand = ejercito.filter(u => ['miliciano', 'lancero_pie'].includes(UNIDADES[u.t].reemplaza || u.t) && !(ia.olaIds && ia.olaIds.includes(u.id)))
        .sort((a, b) => MOTOR.dist2(a.x, a.y, q.x, q.y) - MOTOR.dist2(b.x, b.y, q.x, q.y))[0];
      if (!cand) break;
      ia.guardias[i] = cand.id; cmds.push({c: 'amover', ids: [cand.id], x: q.x, y: q.y}); anotar(ia, G, 'deja guardia en ' + q.nombre);
    }
    // guardias que se alejaron (persiguiendo) vuelven a su puesto; si el puesto se perdió, vuelven al ejército

      if (!mio(q)) { delete ia.guardias[k]; continue; }
      if (u && !u.ord && MOTOR.dist2(u.x, u.y, q.x, q.y) > L_(2) * L_(2)) cmds.push({c: 'amover', ids: [u.id], x: q.x, y: q.y}); }

    const rap = ejercito.filter(u => UNIDADES[u.t].clase.includes('caballeria') && !UNIDADES[u.t].remonta || u.t === 'jinete_estancia').filter(u => UNIDADES[u.t].ataque.bonos && UNIDADES[u.t].ataque.bonos.trabajador).slice(0, 2);

    if (herido || G.tick > ia.hostT - 20 * 25 && hs.every(u => !u.ord)) { if (base) cmds.push({c: 'mover', ids: ia.hostIds, x: base.x, y: base.y + (p ? -1 : 1) * L_(3)}); ia.hostIds = null; }

    else {

      const fO = fuerza(G, ola, ia.visto), fC = fuerza(G, cerca, null);
      if (D.retira && fC > fO * 1.6 && cerca.length >= 3) {   // viene mal: retirada al puesto propio más cercano o a casa
        const ref = G.puestos.filter(mio).sort((a, b) => MOTOR.dist2(a.x, a.y, c[0], c[1]) - MOTOR.dist2(b.x, b.y, c[0], c[1]))[0] || base;
        if (ref) cmds.push({c: 'mover', ids: ola.map(u => u.id), x: ref.x, y: ref.y});
        anotar(ia, G, 'se retira (' + Math.round(fO) + ' contra ' + Math.round(fC) + ')'); ia.olaIds = null; ia.olaT = G.tick; return;
      }
      ia.olaIds = ola.map(u => u.id);
      const obj = blancoOla(G, ia, P, c, fO);
      const quietos = ola.filter(u => !u.ord || (u.ord.k !== 'atacar' && (u.ord.x !== obj.x || u.ord.y !== obj.y)));
      if (quietos.length && (obj.id !== ia.olaObj || G.tick % 100 < 20)) {
        const canones = quietos.filter(u => UNIDADES[u.t].clase.includes('asedio')), resto = quietos.filter(u => !UNIDADES[u.t].clase.includes('asedio'));
        const fe = obj.ent && G.ent.get(obj.ent);
        if (canones.length && fe && MOTOR.ve(G, p, fe)) cmds.push({c: 'atacar', ids: canones.map(u => u.id), id: fe.id});
        else if (canones.length) cmds.push({c: 'amover', ids: canones.map(u => u.id), x: obj.x, y: obj.y});
        if (resto.length) cmds.push({c: 'amover', ids: resto.map(u => u.id), x: obj.x, y: obj.y});
        if (obj.id !== ia.olaObj) anotar(ia, G, 'oleada ' + ia.ola + ' va a ' + obj.id);

  if (seg >= desde && enfriar && animo && (ejercito.length >= minimo || (yoAtrasado && ejercito.length >= minimo - 3) || ejercito.length >= 20)) {

    anotar(ia, G, 'sale la oleada ' + ia.ola + ' con ' + ejercito.length + ' (fuerza ' + Math.round(fYo) + ' contra ' + Math.round(fEl) + ')');
    const obj = blancoOla(G, ia, P, base ? [base.x, base.y] : [0, 0], fYo);

  let obj = null;
  const ordenados = pend.slice().sort((a, b) => cercaMia(a) - cercaMia(b));
  if (ia.modo === 'abrir') {
    ia.modo = 'tomar';
    const cerca = G.puestos.slice().sort((a, b) => cercaMia(a) - cercaMia(b))[0];
    const rapidos = (larga || ia.dif === 'dificil' ? P.mios.filter(e => e.k === 'u' && (UNIDADES[e.t].reemplaza || e.t) === 'explorador') : ejercito.filter(u => UNIDADES[u.t].clase.includes('caballeria'))).slice(0, 2);
    if (cerca && rapidos.length) { cmds.push({c: 'amover', ids: rapidos.map(u => u.id), x: cerca.x, y: cerca.y}); ia.esc = rapidos.map(u => u.id); anotar(ia, G, 'manda ' + rapidos.length + ' al ' + cerca.nombre); }
    obj = ia.apertura === 'centro' ? G.puestos[0] : G.puestos.slice(0, 3).sort((a, b) => cercaMia(b) - cercaMia(a))[0];

  }
  if (ia.esc) { const cerca = G.puestos.slice().sort((a, b) => cercaMia(a) - cercaMia(b))[0];
    if (cerca && mio(cerca) && G.tick > 20 * 40) ia.esc = null; }
  // lo que se vio hace poco (memoria con fecha) cuenta para decidir: no meterse donde perdió recién
  const recientes = [...ia.mem.values()].filter(m => m.k === 'u' && m.t !== 'peon' && G.tick - m.tick < 20 * 25);
  const fuerzaEn = q => fuerza(G, recientes.filter(m => MOTOR.dist2(m.x, m.y, q.x, q.y) < L_(8) * L_(8)), null);
  if (!obj || fuerzaEn(obj) > fYo * 1.1) {

    // costo = casillas hasta el puesto (+ cuánto más cerca le queda al rival) + castigo si ahí se vio un ejército más fuerte
    const bR = G.bases[1 - p], dR = q => Math.hypot((q.x >> 8) - bR[0] - 2, (q.y >> 8) - bR[1] - 2);
    const costo = q => { const dM = Math.sqrt(cercaMia(q)) / L_(1); let c = dM + Math.max(0, dM - dR(q)) * 1.5;
      if (ia.dif !== 'facil' && fuerzaEn(q) > fYo * 0.9) c += 40; if (q === G.puestos[0] && ia.apertura === 'centro') c -= 6; return c; };
    const cand = (pend.length ? pend : G.puestos).slice().sort((a, b) => costo(a) - costo(b));

  // pelea perdida en el camino: retirarse hacia casa y juntar (normal y difícil)
  if (D.retira && ejercito.length && base) {
    const c = centro(ejercito), cerca = enemigosT.filter(e => MOTOR.dist2(e.x, e.y, c[0], c[1]) < L_(6) * L_(6));
    const fC = fuerza(G, cerca, null);
    if (cerca.length >= 2 && fC > fYo * 1.4) {

      if (ia.plan !== 'repliega') anotar(ia, G, 'se repliega a casa (' + Math.round(fYo) + ' contra ' + Math.round(fC) + ')'); ia.plan = 'repliega'; return;
    }
  }
  // no ir de a uno: si la tropa está desparramada, primero se junta (la fácil no lo hace)
  if (ia.dif !== 'facil' && ejercito.length >= 3 && base) {
    const c = centro(ejercito), lejosC = ejercito.filter(u => MOTOR.dist2(u.x, u.y, c[0], c[1]) > L_(5) * L_(5));
    const enObj = ejercito.filter(u => MOTOR.dist2(u.x, u.y, obj.x, obj.y) < L_(4) * L_(4)).length;
    if (lejosC.length > ejercito.length / 3 && enObj < ejercito.length / 2) {
      const mx = Math.round((base.x * 2 + obj.x) / 3), my = Math.round((base.y * 2 + obj.y) / 3);
      const sueltos = ejercito.filter(u => MOTOR.dist2(u.x, u.y, mx, my) > L_(3) * L_(3) && (!u.ord || u.ord.k !== 'atacar'));
      if (sueltos.length) cmds.push({c: 'amover', ids: sueltos.map(u => u.id), x: mx, y: my});

  }
  // ¿me animo? si el rival conocido cerca del objetivo es mucho más fuerte, junto más tropa antes de ir
  const fCerca = Math.max(fuerza(G, enemigosT.filter(e => MOTOR.dist2(e.x, e.y, obj.x, obj.y) < L_(7) * L_(7)), null), ia.dif === 'facil' ? 0 : fuerzaEn(obj));
