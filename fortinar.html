<title>FortinAR</title>
<style>

:root{--bg:#0b121a;--panel:#172432;--panel2:#23384a;--line:#35505b;--ink:#f2f3e9;--dim:#a9bbc2;--aqua:#7ce9e5;--brass:#d7b26a;--danger:#e87b6d;--ok:#9fc98d;--paper:#f1e6cb;

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;font:500 14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--aqua);outline-offset:2px}

  background:linear-gradient(180deg,rgba(11,18,26,.94),rgba(11,18,26,.78));border-bottom:1px solid rgba(215,178,106,.35);pointer-events:none}

.games{display:grid;grid-template-columns:repeat(2,6px);grid-template-rows:6px 6px auto;gap:2px;place-content:center;min-width:44px;padding:0}
.games i{width:6px;height:6px;background:var(--aqua);border-radius:2px}.games i:nth-child(4){background:var(--brass)}
.games b{grid-column:1/-1;font:800 9px/1 system-ui;color:#d5e6ea;margin-top:2px;text-align:center}
.marca{font:800 15px/1 var(--serif);letter-spacing:.06em;white-space:nowrap}.marca span{color:var(--brass)}.marca em{font:700 9px system-ui;font-style:normal;border:1px solid #455261;border-radius:5px;padding:2px 4px;margin-left:5px;color:#cfd8d2;vertical-align:2px}

.rec i{width:18px;height:18px;display:block}.rec i svg{width:100%;height:100%}.rec.lleno b{color:var(--danger)}
#puntos{margin:0 auto}
.pts{display:flex;align-items:center;gap:6px}
.pt{display:flex;align-items:center;gap:4px;width:84px;height:18px;border-radius:9px;background:#0e1820;border:1px solid #2c4250;overflow:hidden;position:relative}
.pt i{position:absolute;top:0;bottom:0;background:var(--c);opacity:.55}.pt.yo i{left:0}.pt.el i{right:0}
.pt b{position:relative;font:800 12px system-ui;padding:0 6px}.pt.el{justify-content:flex-end}
.reloj{font:800 13px ui-monospace,monospace;color:var(--paper)}
/* v86: etapas (Conquista) y elección de modo en la portada */
.pt.ed{width:auto;min-width:70px;border-color:var(--c)}.pt.ed b{color:var(--c)}.pt.ed small{font:700 10px system-ui;color:#c9c2ad;padding-right:6px;white-space:nowrap}.pt.el.ed small{padding:0 0 0 6px}
@media (max-width:520px){.pt.ed small{display:none}}

<script>
/* ───────── v77 · El sonido de la app no corta la música del celular ─────────
   Pedido del 25/10: «no se puede escuchar música en el celular mientras se juega».
   · En iOS (Safari 16.4+ y la app instalada) el sonido de una página usa por defecto una «sesión de audio» que pausa a
     Spotify/Apple Music. Con navigator.audioSession.type = 'ambient' la app SE MEZCLA con la música de otras apps.
     Contra: en 'ambient' el sonido de la app respeta el interruptor de silencio (con el celu en silencio, la app no suena).
   · Va antes que todo (es el primer script de cada página) y además envuelve AudioContext para volver a ponerlo justo antes
     de crear cada contexto (iOS a veces lo resetea al volver de segundo plano).
   · En Android y en la compu no hace falta: Chrome ya mezcla el audio de la página con el de otras apps.
   · iOS más viejo (sin audioSession): no hay forma desde una página web de no pausar la otra música si la app suena;
     ahí lo único que se puede hacer es no crear audio hasta que haga falta (los juegos ya lo crean recién con el primer
     sonido) y bajar el sonido de la app desde sus menús. */
(function(){
'use strict';
function ambient(){try{const s=navigator.audioSession;if(s&&s.type!=='ambient')s.type='ambient';}catch(_){}}
ambient();
for(const k of ['AudioContext','webkitAudioContext']){
  const C=window[k];if(!C||C.__ambient)continue;
  const W=function(...a){ambient();return new C(...a);};
  W.prototype=C.prototype;W.__ambient=true;try{Object.setPrototypeOf(W,C);}catch(_){}
  try{window[k]=W;}catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ambient();});
window.addEventListener('pageshow',ambient);
window.SONIDO={ambient,tipo:()=>{try{return navigator.audioSession?navigator.audioSession.type:null;}catch(_){return null;}}};
})();

</script>
<script>
/* ───────── Latido (v76): UNA sola consulta periódica a la planilla para toda la página ─────────
   Antes cada parte preguntaba por su lado (el chat cada 4 s, el buzón del juego cada 5–8 s, los amigos del menú
   cada 4 s, la lista de gente cada 25–30 s, la estancia cada 90 s). Ahora pregunta sólo esto, con la acción «latido»
   de la planilla, y reparte la respuesta a cada parte.
   Cada cuánto (los topes que pidió el usuario):
     · con una charla abierta: cada 2 s, siempre;
     · con el chat cerrado y la app a la vista: arranca en 4 s y, si no pasa nada, sube de a 1 s hasta 9 s
       (así el primer mensaje después de un rato llega en menos de 10 s, contando lo que tarda la red);
     · vuelve a 4 s apenas llega algo, al tocar la pantalla o al volver a la app (en ese caso pregunta enseguida);
     · en segundo plano: cada 30 s;
     · con una mesa armándose o conectándose: cada 3 s como mucho.
   El chat de la mesa durante la partida va directo entre los teléfonos (WebRTC): no pasa por acá.

    if(Object.keys(mn).length)o._min=mn;return JSON.stringify(o);}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u','a','l','k','s','o','m','r','v','w'],   // v73: v y w, InvasorAR
    // v70: también ajedrez, pool, ludo, los del día y los retos
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};
    for(const [dv,x] of Object.entries(d.por||{})){if(dv===dev)continue;const y=por[dv]||{};por[dv]={};for(const f of this.F)por[dv][f]=Math.max(x[f]|0,y[f]|0);}
    const s={};for(const f of this.F)s[f]=Object.entries(por).reduce((a,[dv,x])=>dv===dev?a:a+(x[f]|0),0);
    ls.set('sync-act-por',JSON.stringify({d:h,por}));ls.set('sync-act-otros',JSON.stringify({d:h,s}));
    const L={d:h};for(const f of this.F)L[f]=mio[f]+s[f];const antes=ls.get('pampa-act'),nuevo=JSON.stringify(L);
    if(antes!==nuevo){ls.set('pampa-act',nuevo);return true;}return false;}};
const ESPECIALES={rk:RK,premios:PREM,act:ACT};
const TODAS=[...Object.keys(PARTES),'rk','premios','act'];
function datosDe(n){return ESPECIALES[n]?ESPECIALES[n].exportar():exportar(n);}

/* ── Red ── */
async function call(p,ms=15000,keep=false){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow',keepalive:keep});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}

/* ── Estado (para el indicador del menú) ── */
const E={st:'',t:Number(ls.get('sync-ultimo')||0),err:'',sub:new Set()};
function setSt(st,err){E.st=st;E.err=err||'';if(st==='ok'){E.t=Date.now();ls.set('sync-ultimo',String(E.t));}for(const f of E.sub)try{f(E);}catch(_){}pintar();}
function hace(t){if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'recién':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`;}
function texto(){if(!acct())return '';if(E.st==='busy')return '☁️ Guardando en tu cuenta…';if(E.st==='off')return '☁️ Sin conexión: se guarda cuando vuelva';
  if(E.st==='err')return '☁️ No se pudo guardar en tu cuenta';return E.t?`☁️ ✓ Guardado en tu cuenta · ${hace(E.t)}`:'☁️ Se guarda en tu cuenta';}
function html(){const t=texto();return t?`<div class="sync-st" data-sync-st>${t}</div>`:'';}
function pintar(){const t=texto();document.querySelectorAll('[data-sync-st]').forEach(el=>{el.textContent=t;});}
// Si el menú del juego se abre, el renglón aparece solo debajo del rango (rk-mine) o al principio del menú.
function css(){if(document.getElementById('sync-css'))return;const s=document.createElement('style');s.id='sync-css';
  s.textContent='.sync-st{font:500 12px/1.3 system-ui,-apple-system,sans-serif;color:#93a1b6;opacity:.9;margin:-4px 0 10px;text-align:left}';(document.head||document.documentElement).appendChild(s);}
function engancharMenu(){if(!acct())return;
  const box=document.getElementById('side-panel');if(!box)return;const L=box.querySelector('.menu-list');   // sólo en el menú principal del juego
  if(!L||box.querySelector('[data-sync-st]'))return;css();
  const d=document.createElement('div');d.className='sync-st';d.dataset.syncSt='';d.textContent=texto();L.before(d);}

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){
  const a=acct();if(!a||pruebas)return;
  if(SUC.busy){SUC.again=true;return;}SUC.busy=true;clearTimeout(SUC.timer);setSt('busy');
  try{
    let traidos=[],partes=[];const ajena=!!META.ajena;
    if(bajar||SUC.primero){
      const j=await call({accion:'sync',usuario:a.usuario,token:a.token,bajar:true},15000,keep);
      SUC.pullT=Date.now();SUC.primero=false;
      if(j.version!==undefined&&!j.partes)throw new Error('vieja');
      const P=j.partes||{};
      if(ajena){for(const k of RK_CLAVES)ls.set(k,null);partes.push('rk');}   // otra cuenta: los rangos y logros de acá no se mezclan
      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}
      // lo que acá es distinto de la cuenta, se sube
      for(const n of TODAS){const r=P[n];const mio=datosDe(n);if(!mio)continue;
        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);
    SUC.dirty.clear();
    // v73: de a 10 partes por pedido (la planilla toma hasta 12 y ya hay más partes que eso)
    for(let i=0;i<subir.length;i+=10){await call({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)},15000,keep);SUC.last=Date.now();}
    setSt('ok');
    if(partes.length)try{window.dispatchEvent(new CustomEvent('bloques-sync',{detail:{claves:traidos,partes}}));}catch(_){}
  }catch(e){
    const m=String(e&&e.message||e);
    if(/sesión venció/i.test(m)){setSt('err','Tu sesión venció.');}
    else if(m==='vieja'||/Acción desconocida/.test(m)){setSt('err','La planilla todavía no tiene la versión nueva.');}
    else{setSt(navigator.onLine===false||e instanceof TypeError||e.name==='AbortError'?'off':'err',m);for(const n of TODAS)if(n)SUC.dirty.add(n);}
  }finally{SUC.busy=false;if(SUC.again){SUC.again=false;setTimeout(()=>ahora(true),300);}}
}

/* ── Notar los cambios: cada vez que un juego guarda algo de una parte, se programa la subida ── */
if(ST&&!pruebas){
  Storage.prototype.setItem=function(k,v){
    if(this===ST&&k==='estancia-premios'){   // lo que desaparece de la cola es lo que la estancia ya cobró
      try{const antes=J(ST.getItem(k))||[],ahoraL=J(String(v))||[],quedan=new Set(ahoraL.map(idP)),cob=antes.filter(x=>!quedan.has(idP(x))).map(idP);
        if(cob.length){const c=ls.json(PRC,[]);for(const x of cob)if(!c.includes(x))c.push(x);rawSet.call(ST,PRC,JSON.stringify(c.slice(-200)));}}catch(_){}}
    rawSet.call(this,k,v);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
  Storage.prototype.removeItem=function(k){rawDel.call(this,k);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
}
function arrancar(){
  if(!acct()||pruebas)return;
  setTimeout(()=>ahora(true),600);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(SUC.dirty.size)ahora(true,true);}
    else if(Date.now()-SUC.pullT>15000)ahora(true);});
  window.addEventListener('pagehide',()=>{if(!SUC.dirty.size||SUC.primero)return;const a=acct();if(!a)return;   // al cerrar: se manda lo que falta, sin esperar · v81: sólo si ya se trajo lo de la cuenta (si no, un aparato con datos viejos o vacíos podía pisar tu progreso)
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(Boolean);
    for(let i=0;i<subir.length;i+=10)try{fetch(lbUrl(),{method:'POST',body:JSON.stringify({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)}),headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true});}catch(_){}});
  window.addEventListener('online',()=>{if(SUC.dirty.size)ahora(true);});
  // Cuando se abre un menú lateral, se muestra el renglón del guardado.
  try{const sp=()=>{const b=document.getElementById('side-panel');if(b)new MutationObserver(()=>engancharMenu()).observe(b,{childList:true});};if(document.getElementById('side-panel'))sp();else document.addEventListener('DOMContentLoaded',sp);}catch(_){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arrancar);else arrancar();
// Al entrar con la cuenta (o cambiar de cuenta) en esta página, se trae todo.
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'&&acct()){META=metaCargar();SUC.primero=true;ahora(true);}});

// Para lo que un juego guarda solo al abrir (p. ej. reparte una partida nueva porque no había ninguna):
// queda como «de antes», así una partida que venías jugando en otro dispositivo le gana.
function auto(k){const n=parteDe(k);if(!n||ESPECIALES[n])return;const M=(META[n]=META[n]||{});M[k]={h:hash(ls.get(k)),t:1};metaSave();}
window.SYNCRO={ahora,auto,html,texto,estado:()=>({...E,sub:undefined}),onEstado(f){E.sub.add(f);},partes:PARTES,
  cuenta(){META=metaCargar();SUC.primero=true;ahora(true);},_dev:dev,_canon:canon};
})();

</script>
<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────
   Para todos los juegos en línea. Cuando alguien se corta (se le fue la señal, subió al micro, cerró la app sin
   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el
   juego espera (TrucAR de a 2, el duelo de BloqueAR). Si vuelve, recupera su lugar y su mano.
   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).
   API (window.RECON):
   · GRACIA                         ms de espera (60.000).
   · recordar(juego, info) / recuerdo(juego) / olvidar(juego)   la mesa en la que estás (info: {mesa, host, seat, …}).
     recuerdo() devuelve null si pasó más de GRACIA desde el último recordar() (la partida ya no te espera).
   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta
     encontrar la invitación de vuelta de esa mesa y llama onInv(inv). Devuelve {cancelar()}.
   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa?

   v67 · SEGUNDO PLANO: salir a contestar un WhatsApp y volver.
   · Al pasar a segundo plano (visibilitychange / pagehide / freeze) se manda por TODAS las conexiones abiertas un aviso
     chiquito («\u0001fondo:1»); al volver, «\u0001fondo:0». Los juegos no lo ven: se filtra antes de que llegue a su
     onmessage. Del otro lado, mientras alguien avisó que se fue un momento, RECON.GRACIA vale RECON.GRACIA_FONDO
     (5 minutos; o 3 veces la gracia de las pruebas) en vez de la normal, y el cartel dice «salió un momento de la app».
   · El que volvió: recuerdo() acepta hasta GRACIA_FONDO desde que la página se fue a segundo plano.
   · RECON.fondo() → {yo: ms desde que me fui (0 si estoy), otro: ms desde que el otro avisó (0 si nadie)}.
   v67 · RED: mejor conexión.
   · Toda RTCPeerConnection (de cualquier juego) suma servidores STUN públicos de respaldo (Google 1 y 2, Cloudflare),
     sin repetir los que ya trae el juego.
   · RED.gathered(pc, max=6000): espera los candidatos ICE, pero termina antes si ya hay salida directa (srflx) y relé
     (relay) y no llega nada nuevo en 400 ms, o a los 2,5 s si ya hay alguno de los dos. Sin internet de verdad (sólo
     candidatos locales) espera como antes, hasta «complete» o max. */
(function(){
'use strict';
if(window.RECON)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const GRACIA_BASE=Number(ls.get('recon-gracia'))||60000;   // (las pruebas la pueden achicar)
const GRACIA_FONDO=Number(ls.get('recon-gracia'))?GRACIA_BASE*3:300000;
/* ── Segundo plano (v67) ── */
const FONDO={yoDesde:0};
const MARCA='\u0001fondo:';
const CANALES=new Set(),FUERA=new Map();
const PING='\u0001ping:',PONG='\u0001pong:',RTT=new WeakMap();
setInterval(()=>{if(document.hidden)return;const t=String(Date.now());for(const ch of CANALES){try{if(ch.readyState==='open')ch.send(PING+t);}catch(_){}}},5000);
function rtt(ch){const v=ch&&RTT.get(ch);return v==null?Infinity:v;}
/* v77 · RELEVO: si el que lleva la mesa se va, la sigue otro (el «suplente»).
   · El que lleva la mesa elige el suplente: el jugador con mejor conexión (menor RTT medido con los ping de arriba) y,
     a igualdad, el primero. Le manda a él solo el estado completo de la partida (también en los juegos con cartas tapadas:
     así, si la mesa se cae, nadie pierde la mano) y a todos quién es el suplente. Lo hace cada juego (uno, truco, ludo, pool).
   · Si la mesa se cae y no vuelve en RELEVO_MS (o se fue a propósito: enseguida), el suplente pasa a llevarla: arma la mesa
     con ese estado, la compu ocupa los lugares de los que faltan y les manda a todos la invitación de vuelta de la misma mesa
     (los demás ya la están buscando y aceptan la del suplente igual que la del que llevaba la mesa).
   · El que llevaba la mesa, si vuelve, queda como uno más: busca la invitación del suplente. */
function elegirSuplente(lugares,excluir){let mejor=-1,r=Infinity;
  (lugares||[]).forEach((L,i)=>{if(i===excluir||!L||L.tipo!=='humano'||!L.ch||L.ch.readyState!=='open')return;const x=rtt(L.ch);if(mejor<0||x<r){mejor=i;r=x;}});return mejor;}
function relevoMs(){return Number(ls.get('recon-relevo'))||(fondoOtro()?45000:20000);}
function registrar(ch){
  if(!ch||CANALES.has(ch))return;CANALES.add(ch);
  // Primer oyente del canal: lo nuestro no le llega al juego.
  // Cada conexión lleva su propio «se fue un momento» (se borra con el «volví» o a los GRACIA_FONDO).
  ch.addEventListener('message',e=>{if(typeof e.data!=='string'||e.data.charCodeAt(0)!==1)return;
    if(e.data.startsWith(MARCA)){e.stopImmediatePropagation();if(e.data.endsWith('1'))FUERA.set(ch,Date.now());else FUERA.delete(ch);return;}
    // v77 · RTT: «ping» de un lado, «pong» del otro; cuánto tarda cada conexión (para elegir quién sigue la mesa si el que la lleva se va)
    if(e.data.startsWith(PING)){e.stopImmediatePropagation();try{if(ch.readyState==='open')ch.send(PONG+e.data.slice(PING.length));}catch(_){}return;}
    if(e.data.startsWith(PONG)){e.stopImmediatePropagation();const ms=Date.now()-Number(e.data.slice(PONG.length));if(ms>=0&&ms<60000){const v=RTT.get(ch);RTT.set(ch,v==null?ms:Math.round(v*.7+ms*.3));}return;}});
  ch.addEventListener('close',()=>CANALES.delete(ch));
}
function avisarFondo(si){for(const ch of CANALES){try{if(ch.readyState==='open')ch.send(MARCA+(si?'1':'0'));}catch(_){}}}
let ocultoT=0,cerrando=false;
function alOcultar(){if(!FONDO.yoDesde){FONDO.yoDesde=Date.now();ls.set('recon-fondo',String(FONDO.yoDesde));}avisarFondo(true);}
// Al ocultarse se espera un cuarto de segundo: si en ese rato la página se cierra de verdad, no es «un momento».
function alOcultarLuego(){clearTimeout(ocultoT);ocultoT=setTimeout(()=>{if(!cerrando&&document.hidden)alOcultar();},250);}
// Cerrar la app de verdad (no es «un momento»): se avisa que no, así la mesa espera lo de siempre.
function alCerrar(e){if(e&&e.persisted){alOcultar();return;}cerrando=true;clearTimeout(ocultoT);avisarFondo(false);}
function alVolver(){const ya=FONDO.yoDesde;FONDO.yoDesde=0;if(ya)avisarFondo(false);}
try{
  document.addEventListener('visibilitychange',()=>{document.hidden?alOcultarLuego():(clearTimeout(ocultoT),alVolver());});

/* ── RED (v67): STUN de respaldo y espera de candidatos más corta ── */

/* ── La mesa en la que estás ── */
function recordar(juego,info){ls.set('recon-'+juego,JSON.stringify({...info,t:Date.now()}));}
// (v67) Si la página se fue a segundo plano después del último recordar(), la partida te espera más (GRACIA_FONDO).

// con t + RECON.GRACIA, y en una página recién abierta GRACIA vale 60 s aunque la mesa te espere 5 min (saliste «un momento»).
// Ahora recuerdo() devuelve t corrido para que t + GRACIA sea justo hasta cuándo te espera la mesa (t0: el original; hasta).
function limite(o){const f=Number(ls.get('recon-fondo'))||0;return f&&f>=(o.t||0)-5000?Math.max(GRACIA_BASE,GRACIA_FONDO):GRACIA_BASE;}
function recuerdo(juego){const o=ls.json('recon-'+juego,null);if(!o)return null;const lim=limite(o),t0=o.t||0;
  if(Date.now()-t0>=lim||ls.get('recon-ab-'+juego+'-'+o.mesa))return null;const hasta=Math.max(t0+lim,Date.now()+15000);   // (al menos 15 s para buscar: la mesa cuenta su espera desde el corte, que pudo ser después)

function olvidar(juego){ls.set('recon-'+juego,null);try{quitar('recon-aviso');}catch(_){}}

const CART=new Map();

  (document.head||document.documentElement).appendChild(s);}
function barra(){let b=document.querySelector('.recon-bar');if(!b){css();b=document.createElement('div');b.className='recon-bar';b.setAttribute('role','status');b.setAttribute('aria-live','polite');document.body.appendChild(b);}return b;}
function cartel(id,texto,hasta,onFin){quitar(id);
  if(fondoOtro()&&/se cort|desconect/i.test(String(texto)))texto=String(texto).replace(/se cortó|se desconectó/i,'salió un momento de la app');const el=document.createElement('div');el.dataset.recon=id;
  el.innerHTML='<span class="recon-sp" aria-hidden="true"></span><span class="recon-t"></span><b></b>';el.querySelector('.recon-t').textContent=texto;barra().appendChild(el);

/* ── El que lleva la mesa: manda la invitación de vuelta y espera ── */
function reinvitar(o){
  let vivo=true,id='';const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{
    const a=acct();if(!a)return;
    while(!fin()&&!id){try{const j=await call({accion:'invitar',usuario:a.usuario,token:a.token,para:o.para,oferta:o.prefijo+JSON.stringify({...o.oferta,re:String(o.re||o.oferta.mesa||'')})});id=j.id;}catch(_){await sleep(2500);}}
    const t0=Date.now();   // v76: mientras se reconecta, cada 0,7 s (los primeros 90 s)
    while(!fin()){await sleep(window.LATIDO?LATIDO.espera(t0):2000);if(fin())break;
      let r;try{r=await call({accion:'buzon',usuario:a.usuario,token:a.token,id});}catch(_){continue;}
      if(r.estado==='aceptada'&&r.respuesta){vivo=false;let sdp='';try{sdp=JSON.parse(r.respuesta).sdp||'';}catch(_){}o.onRespuesta(sdp,id,r.respuesta);return;}   // (raw: para respuestas que no son JSON, como las de BloqueAR)
      if(r.estado==='rechazada'){vivo=false;dejoLaMesa(o.para);return;}   // v77: abandonó («Abandonar»): no se lo espera más
      if(r.estado==='cancelada'||r.estado==='vencida')break;}
    if(id){try{await call({accion:'cancelar',usuario:a.usuario,token:a.token,id});}catch(_){}}
  })();

}
/* v77 · El que se cortó apretó «Abandonar»: se terminan ya los carteles «X se cortó · esperándolo…» de esa persona
   (su onFin es lo mismo que pasa cuando se acaba la espera: la compu ocupa su lugar o la partida termina) y se avisa. */
function dejoLaMesa(nom){const n=String(nom||'').toLowerCase();if(!n)return;let hubo=false;
  for(const [id,c] of [...CART]){if(String(c.texto||'').toLowerCase().includes(n)&&/cort|momento|esperándol|desconect/i.test(c.texto)){hubo=true;quitar(id);try{c.onFin&&c.onFin();}catch(e){console.warn(e);}}}
  aviso(`${nom} abandonó la partida.`);return hubo;}
function aviso(txt){try{if(typeof window.toast==='function'){window.toast(txt);return;}}catch(_){}
  try{css();const el=document.createElement('div');el.textContent=txt;el.style.cssText='opacity:1;transition:opacity .4s';barra().appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),450);},3800);}catch(_){}}
/* ── El que se cortó: busca la invitación de vuelta ── */
function esVuelta(inv,prefijo,mesa){const of=String(inv&&inv.oferta||'');if(!of.startsWith(prefijo))return false;
  try{const o=JSON.parse(of.slice(prefijo.length));return !!o.re&&String(o.re)===String(mesa);}catch(_){return false;}}
function buscarVuelta(o){
  let vivo=true;const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{const a=acct();if(!a)return;
    while(!fin()){
      try{const j=await call({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
        if(inv&&esVuelta(inv,o.prefijo,o.mesa)&&(!o.de||String(inv.de).toLowerCase()===String(o.de).toLowerCase())){vivo=false;o.onInv(inv);return;}}catch(_){}
      await sleep(2500);}
  })();
  return {cancelar(){vivo=false;}};
}
/* ── v77 · «Tenés una partida en curso: Volver / Abandonar» en TODAS las páginas ──
   Antes, volver sólo pasaba si abrías la página de ese juego; si reabrías la app en el inicio (o en otro juego) no había forma
   de volver aunque la mesa te estuviera esperando. Ahora cualquier página muestra el renglón con la cuenta regresiva:
   · Volver → abre el juego, que acepta solo la invitación de vuelta (como siempre).
   · Abandonar → avisa a la planilla (accion «abandonar»): la invitación de vuelta (la que está y las que vengan) se rechaza
     sola, la mesa deja de esperarte enseguida y la compu ocupa tu lugar. En la página del juego, el cartel «Volviendo a la

const JUEGOS={uno:['uno.html','UnoAR'],truco:['truco.html','TrucAR'],'truco-eq':['truco.html','TrucAR'],ludo:['ludo.html','LudoAR'],pool:['pool.html','PoolAR'],poblar:['poblar.html','PoblAR'],'invasores-co':['invasores.html','InvasorAR'],'invasores-du':['invasores.html','InvasorAR']};   // v85: también el Versus (cada uno su campo: al volver, el tuyo sigue como estaba)   // (InvasorAR: sólo De a dos y En contra — v82; el duelo Versus no: cada uno juega su campo en su aparato)
const pagina=()=>{try{return (location.pathname.split('/').pop()||'index.html').toLowerCase();}catch(_){return '';}};
function enCurso(){const out=[];for(const j of Object.keys(JUEGOS)){const rc=recuerdo(j);if(rc&&rc.rol!=='host'&&rc.mesa&&rc.host)out.push([j,rc]);}return out;}
async function abandonar(juego){const o=ls.json('recon-'+juego,null);olvidar(juego);if(!o||!o.mesa)return false;
  ls.set('recon-ab-'+juego+'-'+o.mesa,'1');const a=acct();if(!a||!o.host)return false;
  for(let i=0;i<4;i++){try{await call({accion:'abandonar',usuario:a.usuario,token:a.token,mesa:String(o.mesa),de:String(o.host)});return true;}catch(_){await sleep(1500);}}
  return false;}
function boton(txt,fn,fuerte){const b=document.createElement('button');b.type='button';b.textContent=txt;
  b.style.cssText='font:700 12.5px/1 system-ui,sans-serif;border-radius:999px;padding:6px 11px;cursor:pointer;border:1px solid rgba(242,193,78,.7);'+(fuerte?'background:#f2c14e;color:#1a1f27':'background:transparent;color:#f4f1e8');
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn();});return b;}
let AV_T=0;
function avisoEnCurso(){

  const el=cartel('recon-aviso',`Tenés una partida de ${nom} en curso con ${rc.host}`,rc.hasta,()=>{});
  el.classList.add('recon-aviso');el.querySelector('.recon-sp').remove();
  el.insertBefore(boton('Volver',()=>{location.href=url;},true),el.querySelector('b'));
  el.insertBefore(boton('Abandonar',()=>{quitar('recon-aviso');abandonar(j).then(()=>aviso(`Abandonaste la partida de ${nom}.`));}),el.querySelector('b'));

// En la página del juego: «Volviendo a la partida de X…» + «Abandonar» (recarga la página sin esa mesa).
function abandonarDesdeCartel(id,el){
  const pag=pagina(),j=Object.keys(JUEGOS).find(k=>JUEGOS[k][0]===pag&&ls.get('recon-'+k));if(!j)return;
  el.insertBefore(boton('Abandonar',()=>{const c=CART.get(id);if(c)c.onFin=null;quitar(id);abandonar(j).finally(()=>{try{location.replace(location.pathname);}catch(_){location.reload();}});}),el.querySelector('b'));
}
function arrancarAviso(){try{avisoEnCurso();}catch(e){console.warn(e);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(arrancarAviso,1200));else setTimeout(arrancarAviso,1200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(arrancarAviso,1500);});
window.RECON={get GRACIA(){return fondoOtro()?Math.max(GRACIA_BASE,GRACIA_FONDO):GRACIA_BASE;},GRACIA_BASE,GRACIA_FONDO,fondo,recordar,recuerdo,olvidar,cartel,quitar,mmss,reinvitar,buscarVuelta,esVuelta,abandonar,enCurso,dejoLaMesa,avisoEnCurso,JUEGOS,rtt,elegirSuplente,relevoMs};
})();

<script>
/* ───────── Gestos y animaciones de salida para paneles (v67) ─────────
   Va en todas las páginas (lo inyectan build.sh y package.sh, como rangos.js). Dos cosas:

   · GESTOS.salida(el, op)  Anima la salida de un panel que se va a cerrar. Llamala JUSTO ANTES de ocultarlo
       (el.hidden=true): copia el panel tal como se ve, lo pone en el mismo lugar y lo hace salir (desliza y se
       desvanece) mientras el original ya está oculto. Así la lógica y las pruebas no esperan a ninguna animación.
       op = {panel:'selector del panel adentro del fondo' (opcional), dir:'derecha'|'abajo'|'nada', ms:180,
             keepId:true si el estilo del panel depende de su id (la copia lo conserva unos 180 ms)}

   · GESTOS.deslizar(panel, op)  Deslizar para cerrar: hacia la derecha un panel lateral o hacia abajo una hoja.
       op = {dir:'derecha'|'abajo', cerrar:()=>{…}, fondo:elementoQueSeOscurece (opcional), umbral:70}
       Sólo se activa si el gesto empieza adentro del panel, va claramente en esa dirección y no empieza en un campo
       de texto, un control deslizante, algo con desplazamiento horizontal o algo marcado con class="no-gesto".
       Nunca toca los controles de un juego: se engancha sólo al panel que le pasás.

   Respeta «reducir movimiento» del sistema (sin animaciones, pero el gesto anda igual). Todo con transform y
   opacity; will-change sólo mientras dura. */
(function(){
'use strict';
const quieto=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches||localStorage.getItem('bloques-efectos')==='0';}catch(_){return false;}};   // v85: también con «Animaciones» apagadas
const visible=el=>el&&!el.hidden&&el.isConnected&&getComputedStyle(el).display!=='none';
function salida(el,op={}){
  try{
    if(quieto()||!visible(el)||!el.animate)return;

    const c=el.cloneNode(true);
    if(!op.keepId)c.removeAttribute('id');c.querySelectorAll('[id]').forEach(x=>x.removeAttribute('id'));

        zIndex:cs.zIndex,background:cs.backgroundColor,borderLeft:cs.borderLeft,borderRadius:cs.borderRadius,boxShadow:cs.boxShadow,padding:cs.padding,boxSizing:'border-box',overflow:'hidden'});}

    if(p&&pOrig)p.scrollTop=pOrig.scrollTop;

    const hacia=dir==='abajo'?'translateY(60px)':dir==='nada'?'scale(.97)':'translateX(60px)';
    const anims=[];
    if(p)anims.push(p.animate([{transform:desde,opacity:1},{transform:hacia,opacity:0}],{duration:ms,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}));
    if(op.panel)anims.push(c.animate([{opacity:1},{opacity:0}],{duration:ms,easing:'linear',fill:'forwards'}));
    let listo=false;const fin=()=>{if(listo)return;listo=true;c.remove();};
    (anims[0]?anims[0].finished:Promise.resolve()).then(fin,fin);setTimeout(fin,ms+120);
  }catch(_){}
}
const NO='input,textarea,select,[contenteditable],.no-gesto,[type=range]';
function scrollHoriz(t,panel){for(let n=t;n&&n!==panel;n=n.parentElement){const cs=getComputedStyle(n);if(/auto|scroll/.test(cs.overflowX)&&n.scrollWidth>n.clientWidth+2)return true;}return false;}
function deslizar(panel,op={}){
  if(!panel||panel.dataset.gxDesliza)return;panel.dataset.gxDesliza='1';

    const t=e.target;if(t.closest&&t.closest(NO))return;if(dir==='derecha'&&scrollHoriz(t,panel))return;
    if(dir==='abajo'&&panel.scrollTop>2)return;

  });

    if(!G.on){

      if(!ok){if(Math.abs(dx)>14||Math.abs(dy)>14)G=null;return;}
      G.on=true;panel.style.transition='none';panel.style.willChange='transform';try{panel.setPointerCapture(G.id);}catch(_){}
      panel.classList.add('gx-arrastrando');
    }
    const d=Math.max(0,dir==='derecha'?dx:dy);G.d=d;
    panel.style.transform=dir==='derecha'?`translateX(${d}px)`:`translateY(${d}px)`;
    if(op.fondo)op.fondo.style.opacity=String(Math.max(.35,1-d/(dir==='derecha'?panel.offsetWidth:panel.offsetHeight)));
  });

    if(!G||e.pointerId!==G.id)return;const g=G;G=null;if(!g.on)return;
    panel.classList.remove('gx-arrastrando');

    if(cierra)try{op.cerrar&&op.cerrar();}catch(_){}

    // tragarse un clic que haga el propio «cerrar»).
    const tragar=ev=>{if(!ev.isTrusted)return;ev.stopPropagation();ev.preventDefault();};panel.addEventListener('click',tragar,{capture:true,once:true});setTimeout(()=>panel.removeEventListener('click',tragar,{capture:true}),350);
    if(cierra){
      panel.style.transform='';panel.style.transition='';panel.style.willChange='';if(op.fondo)op.fondo.style.opacity='';return;}
    if(quieto()||!panel.animate){panel.style.transform='';}
    else{const a=panel.animate([{transform:panel.style.transform},{transform:'none'}],{duration:160,easing:'ease-out'});panel.style.transform='';a.finished.catch(()=>{});}
    panel.style.transition='';panel.style.willChange='';if(op.fondo)op.fondo.style.opacity='';
  };

<script>

// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.

  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M||{}));}catch(_){}};
  const limpio=m=>{const o={};if(m&&typeof m==='object')for(const q of ORDEN)if(Number(m[q])>0)o[q]=Math.floor(Number(m[q]));return o;};
  function poner(u,m,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const o=limpio(m);if(Object.keys(o).length)M[k]=o;else delete M[k];if(guardar)save();}
  function guardarLista(L){if(!Array.isArray(L))return;load();for(const x of L)poner(x.usuario||x.n,x.med,false);save();}
  const medDe=u=>typeof u==='object'&&u?limpio(u):load()[String(u||'').toLowerCase()]||null;
  function de(u){const m=medDe(u);if(!m)return '';for(const q of ORDEN)if(m[q])return EM[q];return '';}
  function lista(u){const m=medDe(u)||{};return ORDEN.split('').filter(q=>m[q]).map(q=>({q,e:EM[q],n:m[q],t:NOM[q]}));}
  function titulo(u){return lista(u).map(x=>x.t+(x.n>1?` ×${x.n}`:'')).join(' · ');}
  function html(u){const e=de(u);return e?`<span class="med-pampa" title="${titulo(u).replace(/"/g,'&quot;')}" aria-label="${titulo(u).replace(/"/g,'&quot;')}">${e}</span>`:'';}
  return {de,lista,html,titulo,poner,guardarLista,EM,NOM};
})();
/* ───────── ORO (v70): la moneda de los juegos ─────────
   Dos monedas (pedido del 24/10): los PESOS salen de la estancia y sirven para lo común; el ORO sale de jugar cualquier juego
   y sirve para lo lindo (apariencias, ropa y caballos especiales, adornos únicos, gestos y marcos). Las mejoras grandes de
   la estancia piden las dos. En la pulpería se puede cambiar oro por pesos (1 → 8, hasta 50 de oro por día); al revés no.
   · Cuánto da cada juego: ORO_TABLA (abajo), por partida ganada contra la compu; contra personas ×2, empate ×0,6, perder con
     esfuerzo ×0,4, abandonar 0; contra la compu en Fácil ×0,5 y en Difícil ×1,5 (la misma regla que las leguas: RANGOS.cuenta). Tope del día: 150 enteros, hasta 300 a la mitad, después un cuarto.
   · Se guarda en «bloques-oro-v1» y viaja con la cuenta dentro de RANGOS.exportData() («o»). Para que dos dispositivos no se
     pisen, el saldo no se guarda: se CALCULA. Cada dispositivo anota lo suyo (d[dev] = {g ganado suelto, s gastado suelto}) y lo
     que tiene nombre va aparte: k = premios con clave (cofres de nivel, puestos de La Gran Pampa…: cuentan una sola vez aunque
     se cobren en los dos) y p = compras con clave (una apariencia, un adorno: se pagan una sola vez). Al juntar: de cada
     dispositivo lo mayor y las claves se unen. Saldo = Σ(g − s) + Σk − Σp.
   · Niveles: ORO.niveles() revisa el nivel general y el de cada juego, cobra los cofres y avisa con un cartel lo que ganaste
     (títulos, apariencias, adornos para la estancia, ropa). La primera vez (v70) marca los niveles que ya pasaste y da UN cofre
     de bienvenida (hasta 500).
   · Títulos: el que elegís se ve en tu perfil y al lado de tu nombre en el chat y en las mesas (TITULOS, más abajo). */
window.ORO=(function(){
'use strict';
const K='bloques-oro-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
const dev=()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;};
const diaAR=(t=Date.now())=>new Date(t-3*3600e3).toISOString().slice(0,10);

/* ── Cuánto da cada juego (partida ganada contra la compu, duración normal) ── */
const NIVEL_DIF=s=>({facil:1,principiante:1,normal:2,medio:2,intermedio:2,dificil:3,experto:3,maestro:3})[s]||2;
const ORO_TABLA={
  poblar:12,
  truco:i=>((i.x&&i.x.a)||15)>=30?10:6,          // a 30: 10 · a 15: 6
  ajedrez:i=>i.x&&i.x.ritmo==='bala'?4:8,         // bala: 4
  uno:6,ludo:6,
  pool:4,                                          // por mesa de Bola 8
  bloquear:(i,ex)=>Math.min(10,Math.floor(((ex&&ex.lin)||(i.x&&i.x.lin)||0)/10)),   // 1 cada 10 líneas, hasta 10
  sudoku:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  solitario:i=>i.extra&&i.extra.delDia?6:(i.extra&&i.extra.dificultad==='dificil'?3:2),
  buscaminas:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  laberinto:i=>i.extra&&i.extra.delDia?6:Math.min(10,4+2*Math.min(3,(i.extra&&i.extra.mapas)||0)),   // v73: 4 por participar, +2 por mapa limpio (hasta 10); el del día 6
  invasores:i=>{const x=i.x||i.extra||{};if(x.modo==='duelo')return 6;if(x.modo==='dia')return 6;return Math.min(10,2+(x.olas||0))*(x.dif==='tranquila'?.6:1);},   // v73: 2 + 1 por oleada limpia (hasta 10); duelo y del día 6
  marcar:i=>{const x=i.x||i.extra||{};return x.modo==='carrera'?6:8;},   // v83: MarcAR (Bomba 8, Carrera 6)
  reto:5                                           // cada reto de la semana cumplido
};
const ORO_DEF=4;   // un juego que todavía no está en la tabla
const MULT_RES={g:1,e:.6,p:.4,a:0},MULT_RIVAL={p:2,c:1,s:1};
const MULT_DIF=d=>d==='facil'?.5:(d==='dificil'||d==='maestro')?1.5:1;
const TOPE=[150,300];   // del día: hasta 150 enteros, hasta 300 a la mitad, después un cuarto
const CAMBIO={tasa:8,dia:50};
const NOM_ID={BloqueAR:'bloquear',PoblAR:'poblar',TrucAR:'truco',UnoAR:'uno',AjedrezAR:'ajedrez',PoolAR:'pool',LudAR:'ludo',SudokAR:'sudoku',SolitARio:'solitario',BuscaminAR:'buscaminas',LaberintAR:'laberinto',InvasorAR:'invasores',MarcAR:'marcar'};
const SOLOS=new Set(['sudoku','solitario','buscaminas','laberinto']);

// «info» de cada juego, en la forma corta que usa RANGOS ({res:'g'|'e'|'p'|'a', rival:'p'|'c'|'s', esf}); también acepta la larga
// ({rival:'compu'|'personas', res:'gana'|'empata'|'pierde'|'abandona', ok, extra}). Los solitarios van como «solo».
function norm(info,de){if(!info||typeof info!=='object')return info;const o={...info};
  const R={compu:'c',personas:'p',amigos:'p',solo:'s'},S={gana:'g',empata:'e',pierde:'p',abandona:'a'};
  if(R[o.rival])o.rival=R[o.rival];if(S[o.res])o.res=S[o.res];if(o.esf===undefined&&o.ok!==undefined)o.esf=!!o.ok;
  if(!o.j&&de)o.j=NOM_ID[de]||NOM_ID[String(de).replace(/ \(reto\)$/,'')]||'';
  if(SOLOS.has(o.j))o.rival='s';
  if(o.extra&&o.extra.dificultad&&!o.dif)o.dif=o.extra.dificultad;
  return o;}
// Cuánto vale (sin el tope del día). Sin «info» (la forma vieja): como una partida ganada sin rival.
function calc(de,info,extra){
  if(/\(reto\)$/.test(String(de||'')))return ORO_TABLA.reto;
  const i=norm(info||{},de)||{},j=i.j||NOM_ID[de]||'';
  const b=ORO_TABLA[j],base=typeof b==='function'?b(i,extra):b!=null?b:ORO_DEF;
  if(!info)return Math.round(base);
  const res=i.res||'g';if(res==='a'||i.esf===false)return 0;   // sin esfuerzo (perder en 20 segundos, ganar sin jugar) no da
  // contra quién: la misma regla que las leguas (RANGOS.cuenta: personas 2, compu Difícil 1,5, Normal 1, Fácil 0,5, solo 1)
  let rv=1;try{rv=SOLOS.has(j)?1:window.RANGOS&&RANGOS.cuenta?RANGOS.cuenta(j,{rival:i.rival||'c',res,dif:i.dif}).mult||1:(MULT_RIVAL[i.rival]||1)*(i.rival==='c'?MULT_DIF(i.dif):1);}catch(_){}
  return Math.round(base*(MULT_RES[res]??1)*rv);}

/* ── Datos ── */
function load(){const o=ls.json(K,{});o.d=o.d&&typeof o.d==='object'?o.d:{};o.k=o.k&&typeof o.k==='object'?o.k:{};o.p=o.p&&typeof o.p==='object'?o.p:{};o.h=Array.isArray(o.h)?o.h:[];return o;}
function save(o){o.at=Date.now();ls.set(K,JSON.stringify(o));aviso();}
let SUB=new Set();function aviso(){for(const f of SUB)try{f(saldo());}catch(_){}try{document.querySelectorAll('[data-oro-saldo]').forEach(el=>{el.textContent=fmt(saldo());});}catch(_){}}
function saldoDe(o){let s=0;for(const x of Object.values(o.d))s+=(Number(x&&x.g)||0)-(Number(x&&x.s)||0);for(const x of Object.values(o.k))s+=Number(Array.isArray(x)?x[0]:0)||0;for(const x of Object.values(o.p))s-=Number(Array.isArray(x)?x[0]:0)||0;return Math.max(0,Math.round(s));}
function saldo(){return saldoDe(load());}
function hist(o,n,de){o.h.unshift({t:Date.now(),n:Math.round(n),de:String(de||'').slice(0,40)});if(o.h.length>25)o.h.length=25;}
function mio(o){const d=dev();return (o.d[d]=o.d[d]||{g:0,s:0});}
// Ganar oro suelto (una partida). Devuelve lo que entró.
function ganar(n,de,sinAnim){n=Math.round(Number(n)||0);if(n<=0)return 0;const o=load();mio(o).g+=n;hist(o,n,de);save(o);if(!sinAnim)anim(n);return n;}
// Un premio con nombre (cuenta una sola vez, aunque se cobre en dos dispositivos).
function cobrar(key,n,de,sinAnim){key=String(key);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.k[key])return 0;o.k[key]=[n,Date.now()];if(n)hist(o,n,de);save(o);if(n&&!sinAnim)anim(n);return n;}
function cobrado(key){return !!load().k[String(key)];}
// Comprar algo con nombre (se paga una vez). true si ya era tuyo o si alcanzó.
function tiene(id){return !!load().p[String(id)];}
function comprar(id,n,que){id=String(id);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.p[id])return true;if(saldoDe(o)<n)return false;o.p[id]=[n,Date.now()];hist(o,-n,que||id);save(o);return true;}
// Gastar suelto (lo que se usa, como el cambio en la pulpería).
function gastar(n,que){n=Math.max(0,Math.round(Number(n)||0));const o=load();if(saldoDe(o)<n)return false;mio(o).s+=n;hist(o,-n,que);save(o);return true;}
// Pulpería: oro → pesos (1 → 8), hasta 50 de oro por día en cada dispositivo. Devuelve los pesos (0 si no se pudo).
// v81 · Administración: multiplicadores globales que pone el admin (bloques-cfg-v1, lo trae chat/admin.js). Por defecto 1.
function admMul(k){try{const c=JSON.parse(localStorage.getItem('bloques-cfg-v1')||'null'),v=Number(c&&c.eco&&c.eco[k]);return v>=.1&&v<=10?v:1;}catch(_){return 1;}}
function cambioDia(){return Math.max(0,Math.round(CAMBIO.dia*admMul('cambio')));}
function cambioHoy(){const o=load(),c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;return Math.max(0,cambioDia()-c);}
// v81 · Un ajuste del admin: suma (o resta) oro una sola vez aunque se aplique en dos dispositivos (va como premio o compra con nombre).
function ajustar(key,delta,de){key=String(key);delta=Math.round(Number(delta)||0);const o=load();if(o.k[key]||o.p[key])return 0;
  if(delta>0)o.k[key]=[delta,Date.now()];else if(delta<0)o.p[key]=[-delta,Date.now()];else o.k[key]=[0,Date.now()];
  if(delta)hist(o,delta,de||'Ajuste de la administración');save(o);return delta;}
function cambiar(n){n=Math.floor(Number(n)||0);if(n<=0||n>cambioHoy())return 0;const o=load();if(saldoDe(o)<n)return 0;
  mio(o).s+=n;const c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;o.cam={d:diaAR(),n:c+n};hist(o,-n,'Cambio en la pulpería');save(o);return n*CAMBIO.tasa;}

/* ── Lo que da una partida (lo llama RANGOS.premio): con el tope del día ── */
// v85: tope propio de algunos juegos (MarcAR: 50 de oro por día y 200 por semana, biblia de MarcAR cap. 25), además del tope general
const TOPE_J={marcar:[50,200]};
const semAR=(t=Date.now())=>{const d=new Date(t-3*3600e3);d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10);};
function topeJuego(j){const T=TOPE_J[j];if(!T)return null;const o=load(),h=o.tj&&o.tj.d===diaAR()?o.tj.n||{}:{},w=o.tw&&o.tw.s===semAR()?o.tw.n||{}:{};
  return {dia:T[0],semana:T[1],hoy:h[j]|0,sem:w[j]|0,queda:Math.max(0,Math.min(T[0]-(h[j]|0),T[1]-(w[j]|0)))};}
function premio(de,info,extra){
  let v=calc(de,info,extra);if(v<=0)return 0;v=Math.max(1,Math.round(v*admMul('oro')));   // v81: multiplicador del admin
  const o=load(),hoy=diaAR(),ya=o.dia&&o.dia.d===hoy?o.dia.n|0:0;
  v=Math.max(1,Math.round(v*(ya<TOPE[0]?1:ya<TOPE[1]?.5:.25)));
  {const j=(norm(info||{},de)||{}).j||NOM_ID[de]||'',tj=topeJuego(j);if(tj){v=Math.min(v,tj.queda);if(v<=0)return 0;
    const sw=semAR();o.tj=o.tj&&o.tj.d===hoy?o.tj:{d:hoy,n:{}};o.tw=o.tw&&o.tw.s===sw?o.tw:{s:sw,n:{}};o.tj.n[j]=(o.tj.n[j]|0)+v;o.tw.n[j]=(o.tw.n[j]|0)+v;}}
  o.dia={d:hoy,n:ya+v};mio(o).g+=v;hist(o,v,String(de||'').replace(/ \(reto\)$/,' · reto'));save(o);
  anim(v);
  try{setTimeout(()=>niveles(true),1600);}catch(_){}
  return v;}
function hoy(){const o=load();return o.dia&&o.dia.d===diaAR()?o.dia.n|0:0;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() como «o» ── */
function exportData(){const o=load();return {d:o.d,k:o.k,p:o.p,ti:o.ti||null,mc:o.mc||null,r70:o.r70||0,at:o.at||0};}
function importData(d){if(!d||typeof d!=='object')return false;const o=load();let ch=false;
  for(const [dv,x] of Object.entries(d.d||{})){if(!x||typeof x!=='object')continue;const y=o.d[dv]||{g:0,s:0},g=Math.max(Number(y.g)||0,Number(x.g)||0),s=Math.max(Number(y.s)||0,Number(x.s)||0);if(g!==(y.g||0)||s!==(y.s||0)||!o.d[dv]){o.d[dv]={g,s};ch=true;}}
  for(const M of ['k','p'])for(const [key,x] of Object.entries(d[M]||{})){if(!Array.isArray(x))continue;const y=o[M][key];
    if(!y){o[M][key]=[Number(x[0])||0,Number(x[1])||0];ch=true;}else if((Number(x[0])||0)>(Number(y[0])||0)){o[M][key]=[Number(x[0])||0,Math.min(Number(y[1])||0,Number(x[1])||0)];ch=true;}}
  if(Array.isArray(d.ti)&&(!Array.isArray(o.ti)||(Number(d.ti[2])||0)>(Number(o.ti[2])||0))){o.ti=d.ti;ch=true;}
  if(Array.isArray(d.mc)&&(!Array.isArray(o.mc)||(Number(d.mc[1])||0)>(Number(o.mc[1])||0))){o.mc=d.mc;ch=true;}
  if(d.r70&&!o.r70){o.r70=d.r70;ch=true;}
  if(ch){const at=o.at;ls.set(K,JSON.stringify({...o,at:Math.max(at||0,d.at||0)}));aviso();}
  return ch;}

const ROPA_GEN={10:['ropa:gala','Poncho de gala'],20:['som:dorado','Chambergo dorado'],30:['ropa:patrio','Poncho celeste y blanco'],40:['ropa:caudillo','Saco de caudillo'],50:['ropa:vicuna','Poncho de vicuña']};
const cofreGen=L=>20+5*L;

const TIT_J={bloquear:['Apilador','Gran arquitecto'],poblar:['Colono','Fundador de pueblos'],truco:['Gaucho del truco','Mano de oro del truco'],uno:['Cantor del uno','Rey de la mesa'],
  ajedrez:['Alfil del pago','Gran maestro'],ludo:['Fichero','Patrón del ludo'],pool:['Taquero','Mago del paño'],sudoku:['Numerero','Sabio de los números'],solitario:['Paciente','Maestro del solitario'],
  buscaminas:['Rastreador de minas','Desactivador'],invasores:['Defensor de la llanura','Azote de la Nodriza'],marcar:['Recluta de la Estación','Leyenda del Mercado'],estancia:['Chacarero','Gran estanciero']};
const JNOM={bloquear:'BloqueAR',poblar:'PoblAR',truco:'TrucAR',uno:'UnoAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',invasores:'InvasorAR',marcar:'MarcAR',estancia:'EstanciAR'};
const cofreEst=L=>L>=8?10+2*L:0;   // EstanciAR: desde el nivel 8, un cofre chico por nivel (lo cobra la estancia)
function R(){return window.RANGOS||null;}
function lvGen(){try{return R().general().level.lv;}catch(_){return 1;}}
function lvJ(j){try{return R().levelInfo(R().xp(j)).lv;}catch(_){return 1;}}
function juegos(){const r=R();return r?[...Object.keys(r.GAMES||{}),...Object.keys(r.SOLOS||{})]:[];}
// Todos los títulos que tenés: [{id, n, de}]
function titulos(){const out=[],g=lvGen();
  for(const [L,n] of Object.entries(TIT_GEN))if(g>=+L)out.push({id:'g'+L,n,de:`Nivel general ${L}`});
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);if(l>=10)out.push({id:'j:'+j+':10',n:T[0],de:`${JNOM[j]||j} nivel 10`});if(l>=30)out.push({id:'j:'+j+':30',n:T[1],de:`${JNOM[j]||j} nivel 30`});}
  const o=load(),camp=Object.keys(o.k).filter(k=>/^pm:\d{4}-\d\d-\d\d:\d+:1$/.test(k)).length;
  if(camp)out.push({id:'pm:campeon',n:'Campeón de La Gran Pampa',de:camp===1?'Ganaste una semana':`Ganaste ${camp} semanas`});
  if(Object.keys(o.k).some(k=>/^tp:\d+:1$/.test(k)))out.push({id:'pm:temporada',n:'Campeón de temporada',de:'Ganaste una temporada de La Gran Pampa'});
  return out;}
function titulo(){const o=load(),ti=Array.isArray(o.ti)?o.ti:null;if(!ti||!ti[0])return null;const t=titulos().find(x=>x.id===ti[0]);return t||null;}
function ponerTitulo(id){const o=load();const t=id?titulos().find(x=>x.id===id):null;if(id&&!t)return false;o.ti=[t?t.id:'',t?t.n:'',Date.now()];save(o);
  try{if(window.TITULOS){const a=ls.json('bloques-acct-v1',null);if(a&&a.usuario)TITULOS.poner(a.usuario,t?t.n:'');}}catch(_){}
  subirPerfil();return true;}
/* Marcos para tu foto y gestos para el chat (150 de oro cada uno) */
const MARCOS={dorado:{n:'Aro de oro',p:150},patrio:{n:'Celeste y blanco',p:150},fogon:{n:'Fogón',p:150},filete:{n:'Fileteado',p:150}};
const GESTOS_ORO=[['🧉','Un mate'],['🤠','Gaucho'],['🐎','Al galope'],['🏆','Copa'],['💃','A bailar'],['🥩','Asado']];
function marco(){const o=load(),m=Array.isArray(o.mc)?o.mc[0]:'';if(m&&MARCOS[m]&&o.p['mc:'+m]){css();return m;}return '';}
function ponerMarco(id){const o=load();if(id&&!(MARCOS[id]&&o.p['mc:'+id]))return false;o.mc=[id||'',Date.now()];save(o);subirPerfil();return true;}

// El título y el marco viajan a la planilla (columna «titulo» de Usuarios) para que los demás los vean.
function subirPerfil(){const t=titulo();return subirTitulo(t?t.n:'',marco());}
async function subirTitulo(n,mc){const a=ls.json('bloques-acct-v1',null);if(!a||!a.usuario||!a.token)return;
  const url=ls.get('bloques-lb-url-v1')||(typeof LB_DEF!=='undefined'?LB_DEF:'https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec');

// Revisa los niveles. «mostrar»: si hay algo nuevo, el cartel. Devuelve la lista de lo nuevo.
let REV=false;
function niveles(mostrar){if(REV||!R())return [];REV=true;try{
  const o=load(),g=lvGen(),nuevos=[];
  if(!o.r70){   // primera vez: lo que ya pasaste queda marcado y va UN cofre de bienvenida
    let tot=0;for(let L=2;L<=g;L++){const k='lv:'+L;if(!o.k[k]){o.k[k]=[0,Date.now()];tot+=cofreGen(L);}}
    o.r70=Date.now();const bien=Math.min(500,tot);if(bien>0&&!o.k.bienvenida){o.k.bienvenida=[bien,Date.now()];hist(o,bien,'Cofre de bienvenida');nuevos.push({e:'oro',b:`Cofre de bienvenida: +${fmt(bien)} de oro`,s:'Por los niveles que ya tenías'});}
    {const ad=[];for(const L of Object.keys(ADORNO_GEN))if(g>=+L)regalarAdorno(o,+L,ad,true);
      if(ad.length)nuevos.push({e:'🏡',b:ad.length===1?ad[0].b:`${ad.length} adornos para tu estancia`,s:(ad.length>1?ad.map(x=>x.b).join(', ')+'. ':'')+'Están en la estancia, en Tienda › Guardados'});}
    for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const L of [10,30])if(l>=L)o.k['tj:'+j+':'+L]=o.k['tj:'+j+':'+L]||[0,Date.now()];}
    const ts=titulos();if(ts.length)nuevos.push({e:'🎖️',b:ts.length===1?`Título: ${ts[0].n}`:`${ts.length} títulos para elegir`,s:'Elegí cuál se ve en tu perfil, en Mi cuenta'});
    save(o);if(mostrar&&nuevos.length)cartel(g,nuevos,true);return nuevos;}
  for(let L=2;L<=g;L++){const k='lv:'+L;if(o.k[k])continue;const n=cofreGen(L);o.k[k]=[n,Date.now()];hist(o,n,`Cofre del nivel ${L}`);
    nuevos.push({e:'oro',b:`Cofre del nivel ${L}: +${fmt(n)} de oro`});
    if(TIT_GEN[L])nuevos.push({e:'🎖️',b:`Título: ${TIT_GEN[L]}`,s:'Elegilo en Mi cuenta'});
    if(ADORNO_GEN[L])regalarAdorno(o,L,nuevos);
    if(ROPA_GEN[L])nuevos.push({e:'🧥',b:ROPA_GEN[L][1],s:'Para tu personaje: ponétela en la estancia (Personaje)'});}
  // títulos de cada juego (10 y 30)
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const [L,n] of [[10,T[0]],[30,T[1]]]){const k='tj:'+j+':'+L;if(l>=L&&!o.k[k]){o.k[k]=[0,Date.now()];nuevos.push({e:'🎖️',b:`Título: ${n}`,s:`Por llegar al nivel ${L} en ${JNOM[j]||j}`});}}}
  if(nuevos.length){save(o);if(mostrar)cartel(g,nuevos);}
  return nuevos;}finally{REV=false;}}
// Adorno exclusivo de la estancia: va a la cola de regalos («estancia-premios»), una sola vez.
function regalarAdorno(o,L,nuevos,retro){const A=ADORNO_GEN[L];if(!A)return;const k='adn:'+L;if(o.k[k])return;o.k[k]=[0,Date.now()];
  try{const Q=ls.json('estancia-premios',[]);Q.push({de:`Nivel ${L}`,trigo:0,pesos:0,obj:[A[0]],t:Date.now()+L});ls.set('estancia-premios',JSON.stringify(Q.slice(-40)));}catch(_){}
  nuevos.push({e:'🏡',b:A[1],s:'Para tu estancia: está en Tienda › Guardados'});}
// El cartel lindo de «¡Subiste de nivel!»
const COLA_LV=[];let LV_ON=false;
function cartel(lv,items,bienvenida){if(typeof document==='undefined')return;COLA_LV.push({lv,items,bienvenida});if(!LV_ON)otroCartel();}
function otroCartel(){const c=COLA_LV.shift();if(!c){LV_ON=false;return;}if(!document.body){LV_ON=false;return;}LV_ON=true;css();
  if(enZona()){pildoraNivel(c);return;}
  cartelGrande(c);}
// v82: en un juego, primero una píldora chica en la zona («¡Subiste al nivel 12! · +80 de oro»); tocándola se ve el cartel con todo.
function pildoraNivel(c,n=0){
  if((zonaOcupada()||document.querySelector('.oro-fly.on'))&&n<12){setTimeout(()=>pildoraNivel(c,n+1),420);return;}
  const it=c.items[0],el=document.createElement('button');el.type='button';el.className='oro-lvp';el.setAttribute('role','status');
  el.innerHTML=`<i>${c.bienvenida?'✨':'⬆️'}</i><span>${c.bienvenida?'Llegó el oro a BloqueAR':`¡Subiste al nivel ${c.lv}!`}</span>${it?`<small>· ${esc(it.b)}${c.items.length>1?` y ${c.items.length-1} más`:''}</small>`:''}`;
  el.setAttribute('aria-label',(c.bienvenida?'Llegó el oro':'Subiste al nivel '+c.lv)+'. Tocá para ver los premios');
  document.body.appendChild(el);{const sm=el.querySelector('small');if(sm&&el.scrollWidth>el.clientWidth+2)sm.remove();}   // si no entra el detalle, queda sólo «¡Subiste al nivel N!»
  requestAnimationFrame(()=>el.classList.add('on'));try{if(window.SFX_ORO)window.SFX_ORO();}catch(_){}
  let ido=false;const fin=(ver)=>{if(ido)return;ido=true;clearTimeout(to);el.classList.remove('on');setTimeout(()=>{el.remove();if(ver)cartelGrande(c);else otroCartel();},230);};

function cartelGrande(c){
  const el=document.createElement('div');el.className='oro-lv';el.setAttribute('role','status');el.setAttribute('aria-label',c.bienvenida?'Llegó el oro':'Subiste de nivel');

    <ul>${c.items.map(x=>`<li>${x.e==='oro'?ico():`<i>${x.e}</i>`}<span><b>${esc(x.b)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</span></li>`).join('')}</ul><button type="button">¡Buenísimo!</button></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));

   Pampa: «Caudillo de la semana» durante la semana siguiente) y en el perfil. Se guardan en «bloques-titulos-v1».
   TITULOS.html(usuario) → <span class="tit-chip"> discreto (o ''), para poner al lado del nombre. */
window.TITULOS=(function(){
  const K='bloques-titulos-v1';let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}M.u=M.u||{};M.cau=Array.isArray(M.cau)?M.cau:[];return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M));}catch(_){}};
  const limpio=t=>String(t||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,32);
  function poner(u,t,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const v=limpio(t);if(v)M.u[k]=v;else delete M.u[k];if(guardar)save();}
  function caudillos(L,sem){load();M.cau=(Array.isArray(L)?L:[]).map(x=>String(x||'').toLowerCase()).filter(Boolean);M.sem=sem||'';save();}
  function guardarLista(L,cau){if(!Array.isArray(L))return;load();for(const x of L)if(x&&x.usuario!==undefined)poner(x.usuario,x.ti,false);if(Array.isArray(cau))M.cau=cau.map(x=>String(x||'').toLowerCase());save();}
  function de(u){load();const k=String(u||'').toLowerCase();if(M.cau.includes(k))return {t:'Caudillo de la semana',cau:true};
    if(window.ORO){try{const a=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');if(a&&String(a.usuario).toLowerCase()===k){const t=ORO.titulo();return t?{t:t.n}:null;}}catch(_){}}
    return M.u[k]?{t:M.u[k]}:null;}
  function html(u){const x=de(u);if(!x)return '';try{ORO.css();}catch(_){}const e=String(x.t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);return `<span class="tit-chip${x.cau?' cau':''}" title="${e}">${x.cau?'🏆 ':''}${e}</span>`;}
  return {poner,caudillos,guardarLista,de,html};
})();

for(const [j,T] of Object.entries(AP_V70))for(const [tipo,L] of Object.entries(T)){const A=D[j]&&D[j].ap&&D[j].ap[tipo];if(!A)continue;for(const op of L)if(!A.op.some(x=>x.id===op.id))A.op.push(op);}

const ORDEN=['truco','uno','poblar','ajedrez','pool','ludo','estancia','pampa','sudoku','solitario','buscaminas','laberinto','invasores'];

/* ── Datos guardados ── */
function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}
function save(o){o.at=Date.now();ls.set(KEY,JSON.stringify(o));}
const cnt=(o,j)=>(o.c[j]=o.c[j]||{});
const tiene=(o,j,id)=>!!(o.g[j]&&o.g[j][id]);

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;
    try{if(window.RANGOS&&RANGOS.pampaAct)RANGOS.pampaAct('r',1);}catch(_){}}   // v70: los 3 retos de la semana de un juego dan 1 legua para La Gran Pampa
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&(R.GAMES[j]||(R.SOLOS&&R.SOLOS[j])))R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='ludo'&&win){if(d.n>=4&&!d.eq)E.push(['ganadas_4',1]);if(d.eq)E.push(['ganadas_eq',1]);if(d.limpio)E.push(['limpio',1]);}
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='pool'){if(d.modo==='online')E.push(['online_part',1]);if(win&&d.dobles)E.push(['dobles_gan',1]);if(win&&d.limpia)E.push(['limpia',1]);}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}
  if(j==='buscaminas'&&win){E.push(['gan_'+dif,1]);if(dif!=='principiante')E.push(['gan_ie',1]);if(d.diario)E.push(['dias',1]);if(d.sinBand)E.push(['sin_band',1]);
    if(d.limpio){E.push(['sin_pistas',1]);if(dif!=='principiante')E.push(['limpios_ie',1]);}
    if(dif==='principiante'&&d.ms<20000)E.push(['rapido_p',1]);if(dif==='intermedio'&&d.ms<120000)E.push(['rapido_i',1]);}
  if(j==='invasores'){if(d.olas)E.push(['oleadas',d.olas]);if(d.bajas)E.push(['bajas',d.bajas]);if(d.sum)E.push(['suministros',d.sum]);if(d.cen)E.push(['centinela',d.cen]);if(d.nod)E.push(['nodriza',d.nod]);if(d.perf)E.push(['perfectos',d.perf]);
    if(d.escudos)E.push(['escudos',d.escudos]);if(d.diario)E.push(['dias',1]);if(win&&d.limpio)E.push(['limpio',1]);if(win&&dif==='experta'&&d.modo==='solo')E.push(['gan_experta',1]);}
  if(j==='laberinto'){if(d.limpios)E.push(['limpios',d.limpios]);if(d.sinMorir)E.push(['sin_morir',d.sinMorir]);if(d.combo4)E.push(['combo4',1]);if(d.capturas)E.push(['capturas',d.capturas]);
    if(d.bonus)E.push(['bonus',d.bonus]);if(d.vuelta)E.push(['vuelta',1]);if(d.diario)E.push(['dias',1]);if(d.limDif)E.push(['lim_dif',d.limDif]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);out.html=apBoton(j,'fin');return out;}
  for(const [k,n] of finEventos(j,d))sumar(o,j,k,n);
  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  out.html+=apBoton(j,'fin');   // v72: la apariencia, a mano al terminar

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
// v81: con la zona de avisos (chat.js) también espera a que se vaya el aviso del chat, porque comparten el lugar.
const hayToast=()=>!!document.querySelector('.toast')||(document.documentElement.classList.contains('zn-on')&&!!document.querySelector('.cx-toasts .cx-toast:not(.out),.oro-lvp'));   // v82: también la píldora de nivel (el «+N de oro» le deja el lugar al logro)
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  if(document.documentElement.classList.contains('zn-on'))document.querySelectorAll('.oro-fly:not(.off)').forEach(f=>{f.classList.add('off');setTimeout(()=>f.remove(),520);});   // v82: en la zona va uno por vez: el logro gana
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(op.oro)return !!(window.ORO&&ORO.tiene(op.k_));if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
let PREV=null;   // v72: {j,tipo,id} mientras se prueba una en la hoja
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';if(PREV&&PREV.j===j&&PREV.tipo===tipo&&A.op.some(x=>x.id===PREV.id))return PREV.id;const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

// Une lo de la planilla con lo de acá. Devuelve {ch: cambió algo acá, falta: acá hay algo que la planilla no tiene}.
function importData(d){
  const res={ch:false,falta:false};if(!d||typeof d!=='object')return res;const o=load();
  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}

    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
