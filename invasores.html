/* ── Bucle ── */
function frame(ts){
  const dt=Math.min(.1,Math.max(0,(ts-ULT)/1000)||0);ULT=ts;
  if(EST==='jugando'&&G&&G._espejo){try{espejoPaso(dt);}catch(e){console.warn('espejo',e);}if(G.fin)alTerminar();}   // v77: el invitado mira lo que manda el anfitrión
  else if(EST==='mirando'){try{espejoPaso(dt);}catch(_){}}   // v77: terminó tu campo del duelo: mirás el del otro en vivo
  else if(EST==='jugando'&&G&&!G.fin){
    // v74: «hit-stop» — en los golpes grandes la acción se congela unos milisegundos (sólo el reloj de la pantalla: los
    // pasos del motor son los mismos, así que no cambia nada del resultado)
    if(HITSTOP>0){HITSTOP-=dt;ACC=0;}
    else{ACC+=dt*(G.R.lento?.5:1);let n=0;
    while(ACC>=DT&&n<8&&!G.fin){if(G._online){const E=entradasOnline(G);paso(G,E[0],E[1]);eventos(G);hostPaso(G);}else{paso(G,entrada(G));eventos(G);}ACC-=DT;n++;tutPaso();if(HITSTOP>0){ACC=0;break;}}}
    if(ACC>DT*8)ACC=0;
    marcha(G,dt);
    GUARD_T+=dt;if(GUARD_T>5){GUARD_T=0;guardar();}
    try{duelTick&&duelTick(dt);}catch(_){}
    if(G.fin)alTerminar();}
  else if(EST==='jugando'&&G&&G.fin)alTerminar();   // terminó fuera del bucle (p. ej. el reloj del duelo)
  else if(EST==='cuenta'){CUENTA_T-=dt;const n=Math.ceil(CUENTA_T);$('cuenta').textContent=n>0?String(n):'';if(CUENTA_T<=0){$('cuenta').hidden=true;EST='jugando';ACC=0;}
    try{duelTick&&duelTick(dt);}catch(_){}}
  else if(EST==='menu'&&!G){demoPaso(dt);}
  try{duelTick&&EST!=='jugando'&&EST!=='cuenta'&&duelTick(dt);}catch(_){}
  dibujar(EST==='mirando'&&ESPEJO?ESPEJO:G||DEMO,dt);
  pintarEscudo();
  requestAnimationFrame(frame);
}
// Detrás de la portada, una partida de muestra (la juega sola una compu que no se muere).
function demoPaso(dt){if(document.hidden)return;if(!DEMO||DEMO.fin)DEMO=nuevaPartida({modo:'resistencia',dif:'normal',reglas:{invul:true}});
  DEMO._acc=(DEMO._acc||0)+dt;let n=0;while(DEMO._acc>=DT&&n<4){paso(DEMO,botDemo(DEMO));DEMO._acc-=DT;n++;}DEMO.ev.length=0;if(DEMO.seg>240)DEMO=null;}
// La compu de la portada (y de las pruebas): apunta adelantándose a donde va a estar el blanco, esquiva lo que le cae
// cerca y junta poderes. No es perfecta: es para mostrar el juego.
function botDemo(G,N){N=N||miNave(G)||G.nave;const x=N.x;let tx=x;
  const E=G.ene.filter(e=>e.est!=='muerto'&&!(e.est==='entra'&&e.en.t<0)&&!(e.est==='bandada'&&e.bd.t<0));
  if(G.jefe&&!G.jefe.muerto)tx=G.jefe.x+Math.sin(G.t/40)*50;
  else if(E.length){const e=E.reduce((a,e)=>e.y>a.y+4||(Math.abs(e.y-a.y)<=4&&Math.abs(e.x-x)<Math.abs(a.x-x))?e:a);
    const tv=(MUNDO.NAVE_Y-e.y)/1500,vx=e.est==='form'?(G.form.vel||0)*G.form.dir:e.est==='bandada'?(e.bd.lado>0?230:-230):0;tx=e.x+vx*tv;}
  const pw=G.poderes.find(p=>p.y>560);if(pw)tx=pw.x;
  const peligro=G.hostiles.concat(G.rocas).filter(h=>h.y>640&&h.y<MUNDO.NAVE_Y+10&&Math.abs(h.x-x)<34+(MUNDO.NAVE_Y-h.y)*.1);
  const at=G.ene.filter(e=>(e.est==='kami'||e.est==='mini'||e.est==='pica')&&e.y>600&&Math.abs(e.x-x)<60);
  const barr=G.barr.filter(b=>Math.abs(b.x-x)<60);
  if(peligro.length||at.length||barr.length){const L=peligro.concat(at,barr),izq=L.reduce((s,h)=>s+(h.x<x?1:-1),0);tx=x+(izq>0?110:-110);if(tx<40)tx=x+110;if(tx>680)tx=x-110;}
  return {tx:Math.max(MUNDO.NAVE_MIN,Math.min(MUNDO.NAVE_MAX,tx)),fuego:true,escudo:false,mov:0};}

/* ── Empezar, pausar, seguir ── */
function empezar(modo,op={}){
  closeSheet();hideOver();closeSide();soltarTodo();
  const reglas=modo==='libre'?tallerReglas():modo==='tutorial'?{invul:true,fInt:1.6,escudo:true}:op.reglas;
  const seed=op.seed!=null?op.seed:modo==='dia'?semillaDia(hoyAR()):undefined;
  G=nuevaPartida({modo:modo==='tutorial'?'tutorial':modo,dif:modo==='pampa'?'experta':modo==='dia'||modo==='duelo'||modo==='tutorial'||modo==='contra'?'normal':(op.dif||CFG.dif),seed,reglas,nivel:op.nivel,coop:op.coop});
  if(op.online)G._online=op.online;
  G._dia=modo==='dia'?hoyAR():null;G._oficialDia=modo==='dia'&&!diaHecho();G._key='i'+G.seed.toString(36)+Date.now().toString(36);G._t0=Date.now();
  if(modo==='dia'&&G._oficialDia){const D=ls.json(DIA_K,{});D[G._dia]={empezado:Date.now()};ls.set(DIA_K,JSON.stringify(D));}
  if(modo==='tutorial'){TUT={paso:0,t:0,mov0:0};}else TUT=null;
  ESCENA=modo;document.body.classList.remove('menu');$('hud-pausa').hidden=false;
  if(modo!=='duelo'&&modo!=='pampa'&&!op.online)ls.set(SAVE,null);   // v79: el cruce no pisa tu partida guardada
  aplicarAj();medirCampo();cuenta(op.cuenta??2);if(modo!=='tutorial')try{ayudaDesliz();}catch(_){}
  ls.set('bloques-ultimo-juego','invasores');
}
function cuenta(seg){if(seg<=0||RM&&!enDuelo()){EST='jugando';ACC=0;return;}EST='cuenta';CUENTA_T=seg;const c=$('cuenta');c.hidden=false;c.textContent=String(Math.ceil(seg));}
function pausar(silencio){
  if(!G||G.fin||EST!=='jugando')return;soltarTodo();
  if(G.modo==='pampa'){if(!silencio)menuPampa();return;}   // v79: en el cruce tampoco hay pausa
  if(enDuelo()){if(!silencio)menuDuelo();return;}   // en el duelo no hay pausa: el combate sigue (y salir de la app no abre nada)
  EST='pausa';guardar();
  over(`<div class="ic">⏸</div><h3>Pausa</h3><p class="cap">${esc(MODOS[G.modo].n)}${G.oficial?'':' · reglas libres'} · oleada ${G.ola+1} · ${fmt(G.puntos)} puntos</p>
    <button class="btn go" id="pz-sigue">Continuar</button><div class="row"><button class="btn" id="pz-ctrl">🎮 Controles</button><button class="btn" id="pz-snd">${AJ.sonido?'🔊 Sonido':'🔇 Sin sonido'}</button></div>
    <div class="row"><button class="btn" id="pz-rein">↻ Reiniciar</button><button class="btn" id="pz-salir">Salir</button></div>
    ${G._oficialDia?'<p class="cap">Es tu intento oficial del desafío de hoy: si salís o reiniciás, se termina (cuenta lo que llevás).</p>':G.modo==='resistencia'?'<p class="cap">La pausa no corre el reloj de la expedición.</p>':''}`);
  $('pz-sigue').onclick=continuar;$('pz-ctrl').onclick=()=>openAjustes(true);
  $('pz-snd').onclick=()=>{AJ.sonido=!AJ.sonido;guardarAj();pausarRepintar();};
  $('pz-rein').onclick=()=>{if(G._oficialDia){if(!confirm('¿Reiniciar? Se termina tu intento oficial de hoy con lo que llevás.'))return;cerrarOficialDia();}else if(G.seg>20&&!confirm('¿Reiniciar? Se pierde esta partida.'))return;
    const m=G.modo==='tutorial'?'tutorial':G.modo;hideOver();empezar(m,m==='historia'?{dif:G.dif,nivel:G.nivel}:{dif:G.dif});};   // v81: en Historia reinicia el MISMO nivel (antes volvía al 1)
  $('pz-salir').onclick=()=>{if(G._oficialDia){if(!confirm('¿Salir? Se termina tu intento oficial de hoy con lo que llevás.'))return;cerrarOficialDia();}
    else if(G.seg>20&&G.modo!=='tutorial'&&!confirm('¿Salir? La partida queda guardada y la podés seguir después.'))return;
    if(!G._oficialDia&&G.modo!=='tutorial'&&G.modo!=='duelo')guardar(true);G=null;EST='menu';$('hud-pausa').hidden=true;document.body.classList.add('menu');hideOver();portada();};
}

/* ── Guardar y retomar (modos individuales, hasta 24 h) ── */
function guardar(forzar){if(!G||G.fin||G.modo==='duelo'||G.modo==='pampa'||G.modo==='tutorial'||G._oficialDia||G._online||G._espejo)return;if(!forzar&&EST==='menu')return;
  try{const c=JSON.parse(JSON.stringify(G));c.ev=[];ls.set(SAVE,JSON.stringify({t:Date.now(),G:c}));}catch(_){}}
function guardada(){const s=ls.json(SAVE,null);if(!s||!s.G||s.G.v!==MOTOR_V||s.G.fin||Date.now()-s.t>24*3600e3)return null;return s;}
function retomar(){const s=guardada();if(!s)return portada();G=s.G;G.ev=[];ESCENA=G.modo;document.body.classList.remove('menu');$('hud-pausa').hidden=false;hideOver();closeSheet();soltarTodo();medirCampo();

function cerrarOficialDia(){if(!G||!G._oficialDia)return;if(!G.fin){G.fin={res:'abandono',motivo:'salida',puntos:G.puntos,olas:G.olaN,vidas:G.nave.vidas,danio:G.st.danio,seg:Math.round(G.seg),act:Object.keys(G.st.actT).length};}
  anotarDia(G);G._oficialDia=false;}
function anotarDia(G){const D=ls.json(DIA_K,{}),F=G.fin;D[G._dia]={hecho:true,puntos:F.puntos,olas:F.olas,vidas:F.vidas,t:Date.now()};

function anotarRecord(G){if(!G.oficial||G.modo==='historia')return {nuevo:false,antes:0};const R=records(),k=G.modo+(G.nave2?'2':'')+':'+G.dif,antes=R[k]||0,nuevo=G.puntos>antes;

    his=`<div class="estrellas">${[1,2,3].map(i=>`<span class="${i<=est?'on':''}">★</span>`).join('')}</div><p class="cap">${est===3?'¡Sin un rasguño!':est===2?'3 estrellas si no te pegan nunca.':est===1?'Con menos golpes, más estrellas.':'Probá de nuevo: el nivel es siempre el mismo.'}</p>`;}
  const pr=premios(G),lg=logrosFin(G);

  const ic=gano?'🏆':F.res==='tiempo'?'⏱':'👾';
  // v74: lo primero es el puntaje y «Otra», grande; si no hubo récord, cuánto faltó (las ganas de una más)
  const falta=G.oficial&&!rec.nuevo&&rec.antes>F.puntos?rec.antes-F.puntos:0;
  const recTxt=!G.oficial?'':rec.nuevo&&rec.antes>0?'<div class="rs-rec nuevo">🏆 ¡Nuevo récord!</div>':rec.nuevo?'<div class="rs-rec nuevo">🏆 Tu primer récord</div>':falta?`<div class="rs-rec">Te faltaron <b>${fmt(falta)}</b> para tu récord (${fmt(rec.antes)})</div>`:'';
  over(`<div class="ic">${ic}</div><h3>${tit}</h3>

    <button class="btn go otra" id="rs-otra">${G.modo==='historia'?gano&&G.nivel<HISTORIA_N?'▶ Nivel '+(G.nivel+1):'↻ Reintentar':'▶ Otra'}</button>
    ${G.modo==='historia'&&gano?'<button class="btn" id="rs-rep">↻ Repetir el nivel '+G.nivel+'</button>':''}
    <div class="lines"><div><span>Puntos</span><b>${fmt(F.puntos)}</b></div><div><span>Oleadas limpias</span><b>${F.olas}</b></div><div><span>Cadena máxima</span><b>×${G.st.maxCombo}</b></div><div><span>Duración</span><b>${durTxt(F.seg)}</b></div>
    <div><span>Precisión</span><b>${G.st.disparos?Math.round(100*Math.min(1,G.st.aciertos/G.st.disparos)):0}%</b></div></div>
    ${dia}<div id="rs-podio"></div>${pr.html}${lg}
    <div class="row"><button class="btn" id="rs-modo">Cambiar modo</button>${window.CHAT&&acct()?'<button class="btn" id="rs-share">💬 Compartir</button>':''}</div>

// v81: la tabla en el cartel final (como en BloqueAR): arcade e infinito siempre; el desafío del día, la del día; Historia, la de niveles.
function podioFin(G){const R=window.RANGOS,h=$('rs-podio');if(!R||!R.podio||!h||!G.oficial)return;
  const t=G.modo==='arcade'?{normal:'arc',experta:'arcx',tranquila:'arcf'}[G.dif]:G.modo==='infinito'&&G.dif==='normal'&&!G.nave2?'inf':G.modo==='dia'?'dia':G.modo==='historia'?'his':'';
  if(!t)return;const per=t==='dia'?'hoy':t==='his'?'mes':'semana';
  R.podio(h,{juego:'invasores',tabla:t,per,titulo:{arc:'Arcade Normal',arcx:'Arcade Experto',arcf:'Arcade Fácil',inf:'Infinito',dia:'Desafío del día',his:'Historia'}[t],esperar:R.enviarCola?R.enviarCola():null,dif:t==='his'?null:R.difPts});}
const durTxt=s=>`${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`;

/* ── Premios (sólo en modos oficiales y si la partida fue de verdad) ──
   XP: 10 por oleada limpia y 40 por ganar (hasta 150 por partida). Oro, pesos y leguas con la regla de toda la app
   (RANGOS.premio): 1 legua por el primer intento válido del día y 1 más por el desafío del día. */
const XP_K='invasores-xp-hechas';
function premios(G){
  const out={html:''};const F=G.fin,R=window.RANGOS;
  const filas=[];
  if(!G.oficial){out.html=`<div class="premios"><b>Reglas libres · sin premios</b><span class="no">Las partidas con reglas cambiadas no dan XP, oro ni leguas, y no van a las tablas.</span></div>`;return out;}
  // Historia: un nivel superado vale la primera vez (o si la partida fue larga); repetir el nivel 1 no es una fábrica de XP
  const valida=elegible(G)&&(G.modo!=='historia'||G._hisNuevo||G.seg>=90&&(F.act||0)>=60);
  if(!R){return out;}
  const hechas=ls.json(XP_K,[]);if(hechas.includes(G._key))return out;hechas.push(G._key);ls.set(XP_K,JSON.stringify(hechas.slice(-80)));
  const gano=F.res==='victoria'||F.res==='expedicion';
  const xp=valida?Math.min(150,10*F.olas+(gano?40:0)):0;
  let pr=null;
  if(xp>0){try{R.addXp('invasores',xp);}catch(_){}
    try{pr=R.premio('InvasorAR',xp,true,{j:'invasores',rival:'s',res:'g',dif:DIF_ORO[G.dif],esf:true,key:G._key,x:{olas:F.olas,pts:F.puntos,modo:G.modo,dif:G.dif,gano:gano?1:0}});}catch(e){console.warn('premio',e);}}
  // el desafío del día: una legua más, una vez por día (el oficial)
  let legDia=0;if(G.modo==='dia'&&G._fueOficialDia&&valida&&!G._diaPremiado){G._diaPremiado=true;try{legDia=R.pampaAct('w',1)||0;}catch(_){}}
  // tabla de Arcade (la de la planilla muestra la de Normal; se anotan todas para el perfil)
  if(G.modo==='arcade'&&valida){try{R.resultado('invasores','partida',gano?1:0,{r:'s',cu:1,modo:'arcade',dif:G.dif,pts:F.puntos,ol:F.olas,vi:F.vidas},'invasores:arc:'+G._key);}catch(_){}}
  if((G.modo==='infinito'||G.modo==='historia'&&gano)&&valida){try{R.resultado('invasores','partida',gano?1:0,{r:'s',cu:1,modo:G.modo,dif:G.dif,pts:F.puntos,ol:F.olas,vi:F.vidas,niv:G.nivel||0,dos:G.nave2?1:0},'invasores:'+G.modo.slice(0,3)+':'+G._key);}catch(_){}}   // v77
  let lv=null;try{lv=R.levelInfo(R.xp('invasores'));}catch(_){}
  if(xp)filas.push(`InvasorAR nivel ${lv?lv.lv:1} · +${xp} XP`);
  if(pr&&pr.oro)filas.push(`🟡 +${fmt(pr.oro)} de oro`);
  if(pr&&pr.pesos)filas.push(`🎁 +${fmt(pr.pesos)} 🪙 para tu estancia`);
  const leg=(pr&&pr.leguas||0)+legDia;
  if(leg)filas.push(`🚩 +${leg} ${leg===1?'legua':'leguas'} en La Gran Pampa`);
  else if(acct()&&valida)filas.push(`<span class="no">🚩 ${pr&&pr.nota?esc(pr.nota):'Ya juntaste las leguas de hoy en InvasorAR'}</span>`);
  else if(!acct())filas.push('<span class="no">🚩 Con tu cuenta, jugar también da leguas para La Gran Pampa.</span>');
  if(!valida)filas.unshift('<span class="no">Partida muy corta: hace falta jugar 90 segundos y limpiar 2 oleadas (o ganar) para los premios.</span>');
  out.html=`<div class="premios">${filas.map(f=>`<div>${f}</div>`).join('')}</div>`;
  return out;
}
function logrosFin(G){if(!window.LOGROS)return '';const F=G.fin,gano=F.res==='victoria';
  try{const k='i'+G._key;
    if(G.oficial){LOGROS.marca('invasores','max_combo',G.st.maxCombo,k,true);if(G.modo==='resistencia'||G.modo==='infinito')LOGROS.marca('invasores','olas_res',F.olas,k,true);}
    return LOGROS.fin('invasores',{gano:G.oficial&&gano,modo:'solo',dif:G.dif,olas:F.olas,bajas:G.st.bajas,sum:G.st.suministros,cen:G.st.centinela,nod:G.st.nodriza,perf:G.st.perfectos,escudos:G.st.escudosOk,
      limpio:G.modo==='arcade'&&G.dif!=='tranquila'&&F.vidas===G.nave.vidas0&&!G.nave2,diario:G.modo==='dia'&&!!G._fueOficialDia,oficial:G.oficial},k).html;}catch(e){console.warn('logros',e);return '';}}

  return `<span class="chip-el">XP y oro${a?' · 1 legua por día':''}${m==='dia'?' · +1 legua del día':''}</span>${a?'':' <span class="chip-el no">Sin cuenta: sin leguas</span>'}`;}

async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

function espejoPaso(dt){const M=ESPEJO;if(!M||!SNAPS.length)return;
  const now=performance.now()-70,L=SNAPS;let A=L[0],B=L[L.length-1];
  for(let i=0;i<L.length-1;i++)if(L[i].at<=now&&L[i+1].at>=now){A=L[i];B=L[i+1];break;}
  const u=B.at>A.at?Math.max(0,Math.min(1,(now-A.at)/(B.at-A.at))):1;
  if(!M.fin)aplicarSnap(A.S,B.S,u);
  if(EST!=='jugando'||!G||G!==M)return;
  // mi nave: al instante, con el mismo movimiento que en el motor
  const mia=MI_P===2?M.nave2:MI_P===1?M.nave:null;
  if(mia){if(!LOC||mia.caida){LOC={x:mia.x,vx:0};}
    else{const q=entrada(M);if(q.escudo)ESC_N++;const f={R:M.R,mov:0};let pasos=Math.round(dt/DT)||1;while(pasos-->0)moverNave(f,q,LOC);LOC.f=q.fuego;}
    mia.x=LOC.x;mia.vx=LOC.vx;

      if(g==='estancia'){location.href='estancia.html#malon';return;}location.href=({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',ajedrez:'ajedrez.html',ludo:'ludo.html',pool:'pool.html'}[g]||'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='invasores'){if(EST!=='jugando')portada();}else location.href=({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',ajedrez:'ajedrez.html',ludo:'ludo.html',pool:'pool.html',estancia:'estancia.html#malon',pampa:'pampa.html',sudoku:'sudoku.html',solitario:'solitario.html',buscaminas:'buscaminas.html'}[c.j]||'./');}});
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);});setTimeout(()=>pollInbox(true),1500);
  setTimeout(fitScreen,60);
  requestAnimationFrame(t=>{ULT=t;requestAnimationFrame(frame);});
})();
