<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).
   v67: amigos con solicitudes (pestañas Charlas / Amigos / Global), grupos de juego (Jugar con el grupo, partidas
   del grupo, archivar solos los que nadie usa) y selector de emojis.
   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},
   CHAT.esAmigo(n), CHAT.usuarios() → [{usuario, avatar, color, enLinea, estado}], CHAT.conectados() → {amigos, global}
   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=21;   // v76: la planilla guarda 21 días (antes 30)
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',laberinto:'LaberintAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',invasores:'InvasorAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
// Un nombre de usuario de verdad (nunca null, vacío ni el texto «null»/«undefined» que deja un error).
function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre
  // bien): se borran de acá y se vuelven a pedir desde un poco antes, así reaparecen en la charla correcta.
  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));
  if(malos.length){S.msgs=S.msgs.filter(x=>x&&nombreOk(x.de)&&nombreOk(x.para));const t0=Math.min(...malos.map(x=>Number(x&&x.t)||0).filter(Boolean));
    if(t0)S.last=Math.min(S.last,t0-60000);ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
  // Lo que se estaba mandando cuando se cerró la página queda como «No se mandó» (se puede reintentar).
  for(const x of S.msgs)if(x.tmp){x.sending=false;x.fail=true;if(typeof x.p==='string'){try{S.plain[x.id]=JSON.parse(x.p);}catch(_){}}}
  const B=ls.json(kBorr(),{});S.borr=B&&typeof B==='object'?B:{};
  S.invSt=ls.json(kInvSt(),{})||{};
  {const G=ls.json(kGrupos(),[]);S.grupos=Array.isArray(G)?G:[];}S.am=amLimpio(ls.json(kAm(),null));S.amOk=false;try{S.espero=JSON.parse(sessionStorage.getItem('bloques-chat-espero')||'null');}catch(_){S.espero=null;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}
/* ── Borrar chats (v63): sólo para vos. La planilla guarda «borrado hasta tal hora» por charla y no te devuelve
   lo anterior; si el otro te escribe de nuevo, la charla vuelve con lo nuevo. ── */
const kBorr=()=>'bloques-chat-borr-'+lc(S.me);
function borradoLocal(m){const o=conv(m),h=S.borr&&S.borr[o];return !!h&&m.t<=h&&!m.tmp;}
function aplicarBorrados(B){let ch=false;for(const [k,t] of Object.entries(B||{})){const v=Number(t)||0;if(v>(S.borr[lc(k)]||0)){S.borr[lc(k)]=v;ch=true;}}
  if(ch){ls.set(kBorr(),JSON.stringify(S.borr));const n=S.msgs.length;S.msgs=S.msgs.filter(m=>!borradoLocal(m));if(S.msgs.length!==n)saveMsgs();}return ch;}
async function borrarChat(name){
  // La marca usa la hora de la planilla (la de los mensajes), no el reloj de este dispositivo.
  if(!nombreOk(name))return;const k=lc(name),t=lastAny(name);
  if(t>(S.borr[k]||0)){S.borr[k]=t;ls.set(kBorr(),JSON.stringify(S.borr));}S.msgs=S.msgs.filter(m=>!(conv(m)===k&&m.tmp)&&!borradoLocal(m));saveMsgs();
  S.delFor=null;if(lc(S.con)===k){S.con=null;S.view='list';}$('.cx-panel').dataset.sig='';render();badges();
  try{const j=await call(auth({accion:'chatBorrar',con:name}));if(j.hasta)aplicarBorrados({[k]:j.hasta});}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para borrar chats en todos tus dispositivos hay que actualizar la planilla (versión nueva). En este quedó borrado.':String(e.message||e);render();}
}
const lastAny=n=>{let t=0;for(const m of S.msgs)if(conv(m)===lc(n)&&m.t>t)t=m.t;return t;};
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
/* ── Grupos (v66): los mensajes de un grupo van con para = «g:<id>». La charla de un mensaje es el grupo o el otro. ── */
const esGK=k=>/^g:/i.test(String(k||''));
const esG=m=>esGK(m&&m.para);
const conv=m=>esG(m)?lc(m.para):lc(other(m));
const grupoDe=k=>{const id=lc(k).replace(/^g:/,'');return S.grupos.find(g=>lc(g.id)===id)||null;};
const conNombre=k=>esGK(k)?((grupoDe(k)||{}).n||'Grupo'):k;
const kGrupos=()=>'bloques-chat-grupos-'+lc(S.me);
/* ── Amigos (v67) ── */
const kAm=()=>'bloques-chat-amigos-'+lc(S.me);
const amLimpio=o=>({a:Array.isArray(o&&o.a)?o.a.filter(nombreOk):[],in:Array.isArray(o&&o.in)?o.in.filter(nombreOk):[],out:Array.isArray(o&&o.out)?o.out.filter(nombreOk):[]});
function amEstado(n){const k=lc(n);if(S.am.a.some(x=>lc(x)===k))return 'amigo';if(S.am.in.some(x=>lc(x)===k))return 'te-pidio';if(S.am.out.some(x=>lc(x)===k))return 'pediste';return '';}
function avisarAmigos(){try{window.dispatchEvent(new CustomEvent('bloques-amigos',{detail:{amigos:S.am.a.slice(),in:S.am.in.slice(),out:S.am.out.slice()}}));}catch(_){}}
function guardarAmigos(o,primera){
  const n=amLimpio(o),antes=S.am,a=JSON.stringify(n),ch=a!==JSON.stringify(antes);S.am=n;S.amOk=true;
  if(!ch)return false;ls.set(kAm(),a);
  // Una solicitud nueva: un aviso chico (en partida, sólo el «tic»).
  if(!primera){const nuevas=n.in.filter(x=>!antes.in.some(y=>lc(y)===lc(x)));for(const x of nuevas){if(H.busy())beep('soft');else{beep('msg');toast(x,'Te mandó una solicitud de amistad 🤝',x);}}}
  avisarAmigos();return true;}
async function amAccion(accion,p,ok){
  try{const j=await call(auth({accion,...p}));if(j.amigos)guardarAmigos(j.amigos);if(ok)S.err='';poll();return j;}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para agregar amigos hay que pegar el código nuevo de la planilla.':String(e.message||e);}
  finally{p0().dataset.sig='';render();}
}
const pedirAmistad=n=>amAccion('amigoPedir',{para:n},true);
const responderAmistad=(n,si)=>amAccion('amigoResponder',{de:n,si:si?1:0},true);
const cancelarAmistad=n=>amAccion('amigoCancelar',{para:n},true);
const quitarAmigo=n=>amAccion('amigoQuitar',{con:n},true);
function guardarGrupos(L){if(!Array.isArray(L))return false;const a=JSON.stringify(L),ch=a!==JSON.stringify(S.grupos);S.grupos=L;if(ch)ls.set(kGrupos(),a);return ch;}
function unreadFrom(n){const r=S.read[lc(n)]||0;if(esGK(n))return S.msgs.filter(m=>conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(esG(m)){if(lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>(S.read[conv(m)]||0))n++;continue;}if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ──
   v76: si está el «latido» (chat/latido.js), la consulta la hace él para toda la página: el chat sólo le dice qué
   necesita (armarChat) y procesa la respuesta (recibirChat). Si la planilla es vieja, vuelve a preguntar solo, como antes. */
const conLatido=()=>!!(window.LATIDO&&LATIDO.usable());
const msChat=()=>document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:0;
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  if(conLatido()){LATIDO.registrar('chat',PARTE);return;}   // el latido ajusta su paso (2 s con una charla abierta)
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
function cuentaAlDia(){const a=acct();if(!a){if(S.me){loadLocal();render();}return null;}if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}return a;}
function armarChat(p){
  Object.assign(p,{estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last});

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){

    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);

  else if(viejo)pie=`<span class="cx-inv-st st-vieja">Ya pasó un rato: puede que la mesa ya esté jugando.</span>`;

   abierta: 1). CHAT.linkCompartir(id, juego) muestra el link para copiar, mandar por WhatsApp o compartir. El que lo abre:
   con cuenta, entra solo a la mesa (es la misma invitación de siempre, la acepta como si tocara «Entrar» en el chat);
   sin cuenta, la crea (o entra) y después lo lleva a la mesa. Vale mientras el que invita espera, como cualquier invitación. */

   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje

     }

   · sistema(txt)                         un renglón gris («Ana se cortó»)

   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)

function marcar(ids){const L=vistos(),S=new Set(L);ids.forEach(i=>S.add(i));ls.set(KV,JSON.stringify([...S].slice(-80)));}
function enInicio(){return /(^|\/)(index\.html)?$/.test(location.pathname)||/bloques\.html$/.test(location.pathname);}
function unido(){try{const r=JSON.parse(localStorage.getItem('pampa-resumen')||'null');return !!(r&&r.unido&&r.semana===lunesHoy());}catch(_){return false;}}
const fmtHasta=t=>{try{return new Date(t).toLocaleString('es-AR',{weekday:'long',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'America/Argentina/Buenos_Aires'}).replace(/\.$/,'')+' h';}catch(_){return '';}};
const CSS2=`.pa-chico .pa-caja{padding-top:26px}.pa-ic{font-size:40px;line-height:1;margin:2px 0 6px}.pa-lista{list-style:none;margin:6px 0 12px;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.pa-lista li{background:#2e2216;border:1px solid #5a4630;border-radius:12px;padding:9px 11px;font-size:14px;line-height:1.35;color:#eadcbe}.pa-lista b{color:#fff3d6}
.pa-lista small{display:block;color:#cdbb98;font-size:12.5px;margin-top:2px}`;
function abrirNoti(n){
  css();if(!document.getElementById('pa-css2')){const st=document.createElement('style');st.id='pa-css2';st.textContent=CSS2;document.head.appendChild(st);}
  const w=document.createElement('div');w.className='pa-scrim pa-chico';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');w.setAttribute('aria-labelledby','pa-t');
  w.innerHTML=`<div class="pa-caja"><div class="pa-luces" aria-hidden="true">${'<i></i>'.repeat(12)}</div><div class="pa-ic" aria-hidden="true">${n.ic}</div>
    <h2 id="pa-t">${esc(n.tit)}</h2>${n.sub?`<p class="pa-sem">${esc(n.sub)}</p>`:''}<ul class="pa-lista">${n.items.map(x=>`<li>${x}</li>`).join('')}</ul>
    <button type="button" class="pa-go" id="pa-go">${esc(n.go)}</button><button type="button" class="pa-no" id="pa-no">Ahora no</button></div>`;
  const cerrar=()=>{w.remove();document.removeEventListener('keydown',tecla,true);};
  const tecla=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cerrar();}};
  w.addEventListener('click',e=>{if(e.target===w)cerrar();});document.body.appendChild(w);document.addEventListener('keydown',tecla,true);
  w.querySelector('#pa-no').onclick=cerrar;w.querySelector('#pa-go').onclick=()=>{cerrar();location.href=n.url;};
  setTimeout(()=>{try{w.querySelector('#pa-go').focus({preventScroll:true});}catch(_){}},60);
}
function armarNotis(r){
  const V=new Set(vistos()),out=[];
  const at=(r.ataques||[]).filter(a=>!V.has('a:'+a.id));
  if(at.length){const turno=at.filter(a=>a.turno),L=at.slice(0,4);
    out.push({ids:at.map(a=>'a:'+a.id),ic:turno.length?'⚔️':at.some(a=>a.fin==='a')?'🛡️':'🏴',tit:turno.length?(turno.length>1?'¡Te atacaron!':'¡Te desafiaron!'):'Pasó algo en tu tierra',sub:'La Gran Pampa',
      items:L.map(a=>{const quien=`<b>${esc(a.de)}</b>${a.al?` (con <b>${esc(a.al)}</b>)`:''}`,lugar=a.lugar?` por tu paraje de ${esc(a.lugar)}`:'';
        if(a.malon)return `🐎 ${quien} te hizo un malón${lugar}. ${a.fin==='a'?'<b>Te defendiste</b>: el paraje sigue siendo tuyo.':a.fin==='marca'?'Era un fortín: te dejó su marca.':'<b>Se llevó el paraje.</b>'}`;
        if(a.turno)return `⚔️ ${quien} te desafió${lugar}. Defendelo con <b>${esc(a.jn||'su juego')}</b>.${a.hasta?`<small>Tenés hasta el ${esc(fmtHasta(a.hasta))}.</small>`:''}`;
        return `${a.fin==='a'?'🛡️':'⚔️'} ${quien} te desafió${lugar}: ${a.fin==='a'?'<b>tu paraje aguantó</b> (tu guardia o el mínimo).':a.fin==='marca'?'era un fortín: te dejó su marca.':'<b>no llegaste a defenderlo</b> y se lo llevó.'}`;}),
      go:turno.length?'🛡️ Defender':'🗺️ Ver el mapa',url:'./pampa.html'+(turno.length===1?'#duelo='+encodeURIComponent(turno[0].id):'')});}
  if(enInicio()){const ev=(r.eventos||[]).filter(e=>!V.has('e:'+r.semana+':'+e.id));
    if(ev.length)out.push({ids:ev.map(e=>'e:'+r.semana+':'+e.id),ic:ev[0].e,tit:ev.length>1?'Hay eventos en La Gran Pampa':ev[0].n+' en La Gran Pampa',sub:'',
      items:ev.slice(0,3).map(e=>`${e.e} <b>${esc(e.n)}</b>: ${esc(e.txt||'')}${e.hasta?`<small>Hasta el ${esc(fmtHasta(e.hasta))}.</small>`:''}`),go:'🗺️ Ir a La Gran Pampa',url:'./pampa.html'});}
  return out;
}
let notiCorre=false;
async function notis(){
  if(notiCorre||!unido())return;if(!window.CHAT||typeof CHAT.api!=='function')return;
  try{const a=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');if(!(a&&a.usuario&&a.token))return;}catch(_){return;}
  if(Date.now()-Number(ls.get(KT)||0)<120000&&!ls.get('bloques-pa-force'))return;
  notiCorre=true;ls.set(KT,String(Date.now()));let r=null;
  try{r=await CHAT.api({accion:'pampaNotis'});}catch(_){notiCorre=false;return;}
  if(!r||!r.ok||!r.unido){notiCorre=false;return;}
  const cola=armarNotis(r);
  const listo=()=>!document.querySelector('.nv-scrim,.nv-toast,.pa-scrim')&&document.visibilityState==='visible'&&!(window.CHAT&&CHAT.ocupado&&CHAT.ocupado())&&!corriendo;
  const sig=()=>{const n=cola.shift();if(!n){notiCorre=false;return;}
    const V=new Set(vistos());if(n.ids.every(i=>V.has(i))){sig();return;}   // ya lo vio en otro aparato o en el mapa
    const prob=()=>{if(!listo()){setTimeout(prob,1500);return;}marcar(n.ids);abrirNoti(n);esperar();};prob();};
  const esperar=()=>{if(document.querySelector('.pa-scrim')){setTimeout(esperar,800);return;}setTimeout(sig,600);};
  sig();
}
let corriendo=false;
async function mirar(){
  if(corriendo)return;const sem=lunesHoy();if(ls.get(K)===sem)return;
  if(!window.CHAT||typeof CHAT.api!=='function')return;
  corriendo=true;let r=null;
  try{r=await CHAT.api({accion:'pampaAviso'});}catch(_){corriendo=false;return;}   // sin conexión: la próxima vez
  if(!r||!r.ok){corriendo=false;return;}
  if(!r.pasada||!(r.top||[]).length){ls.set(K,sem);corriendo=false;return;}   // la semana pasada no se jugó: nada que contar
  // Espera a que no haya Novedades a la vista, ni una partida en curso, ni la pestaña escondida.
  const listo=()=>!document.querySelector('.nv-scrim,.nv-toast,.pa-scrim')&&document.visibilityState==='visible'&&!(window.CHAT&&CHAT.ocupado&&CHAT.ocupado());
  const intentar=()=>{if(ls.get(K)===sem){corriendo=false;return;}if(!listo()){setTimeout(intentar,1500);return;}if(abrir(r,sem))ls.set(K,sem);corriendo=false;};
  intentar();
}
function arrancar(){
  if(window.top!==window)return;                                     // dentro de la ventanita de la estancia
  if(/pampa\.html$/.test(location.pathname)){ls.set(K,lunesHoy());return;}   // en La Gran Pampa ya se ve todo
  if(navigator.webdriver&&ls.get('bloques-pa-force')!=='1')return;    // las pruebas automáticas no lo ven (salvo que lo pidan)
  setTimeout(mirar,2600);setTimeout(notis,3400);   // v81: después del semanal, los avisos personales
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){setTimeout(mirar,1500);setTimeout(notis,2400);}});
}
if(document.readyState==='complete')arrancar();else window.addEventListener('load',arrancar,{once:true});
window.PAMPA_AVISO={mirar,abrir,lunesHoy,notis,armarNotis,abrirNoti};
})();

</script>
<script>
/* ───────── v81 · Administración, ajustes y anuncios ─────────
   Va en todas las páginas (después de rangos.js y novedades.js).
   · Lo que pone el admin para todos (multiplicadores de la economía y un anuncio) queda en «bloques-cfg-v1»; el latido
     trae el número de versión (cf) y, si cambió, se pide la configuración nueva. EstanciAR y el oro leen los
     multiplicadores de ahí (por defecto, 1: no cambia nada).
   · Ajustes para vos (pesos, oro, Historia de InvasorAR): el latido avisa (adj) y se traen una sola vez. El oro va como
     premio o compra con nombre (no se duplica entre aparatos); los pesos se aplican en la estancia (en otra página
     quedan esperando); la Historia sube el nivel (nunca baja).
   · Recuperar: en InvasorAR, una vez por día, se pregunta a la planilla lo más alto que sabe de tu Historia; si es más
     que lo que hay acá, se te devuelve (para el que perdió su progreso).
   · El panel «🛠️ Administración» (desde Mi cuenta, sólo para el admin; la planilla lo valida con la sesión).
   API: window.ADMIN = {es(), abrir(), tomar(), cfg()} */
(function(){
'use strict';
if(window.ADMIN)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.round(Number(n)||0).toLocaleString('es-AR');
const enMarco=(()=>{try{return window.top!==window;}catch(_){return true;}})();   // dentro de la ventanita de la estancia: lo hace la página de afuera
const CFG_K='bloques-cfg-v1',ADM_K='bloques-admin',AN_K='bloques-anuncio-visto',REC_K='bloques-recupero-dia',HIS_K='invasores-historia';
async function call(p,ms=20000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return Object.assign({usuario:a&&a.usuario,token:a&&a.token},o);};
const diaAR=()=>new Date(Date.now()-3*3600e3).toISOString().slice(0,10);

/* ── Avisito propio (chico, arriba; no tapa nada importante) ── */
function css(){if(document.getElementById('adm-css'))return;const s=document.createElement('style');s.id='adm-css';s.textContent=CSS;document.head.appendChild(s);}
function aviso(txt,ms=5200){css();const d=document.createElement('button');d.type='button';d.className='adm-toast';d.textContent=txt;d.onclick=()=>d.remove();document.body.appendChild(d);setTimeout(()=>{d.classList.add('out');setTimeout(()=>d.remove(),400);},ms);}

/* ── Configuración para todos ── */
let pidiendoCfg=false;
async function traerCfg(){if(pidiendoCfg)return;pidiendoCfg=true;
  try{const j=await call({accion:'config'});const o={g:Number(j.g)||0,eco:j.eco||{},an:j.an||null,t:Date.now()};ls.set(CFG_K,JSON.stringify(o));anuncio();}catch(_){}
  finally{pidiendoCfg=false;}}
function cfg(){return ls.json(CFG_K,{g:0,eco:{},an:null});}

/* ── Anuncio: una sola vez por anuncio, cuando no hay partida ni otro cartel ── */
function anuncio(){if(enMarco)return;const c=cfg(),an=c.an;if(!an||!an.id||!an.txt)return;const vistos=ls.json(AN_K,[]);if(vistos.includes(an.id))return;
  const ocupado=()=>{try{if(document.querySelector('.nv-scrim,.nv-toast,.pa-aviso,.adm-an,#adm-p'))return true;if(window.CHAT&&CHAT.ocupado&&CHAT.ocupado())return true;}catch(_){}return false;};
  const mostrar=()=>{if(ocupado()){setTimeout(mostrar,2500);return;}if(ls.json(AN_K,[]).includes(an.id))return;css();
    const d=document.createElement('div');d.className='adm-an';d.setAttribute('role','dialog');d.setAttribute('aria-label','Anuncio');
    d.innerHTML=`<div class="adm-an-c"><b>📣 Anuncio</b><p>${esc(an.txt)}</p><button type="button" class="adm-ok">Entendido</button></div>`;
    const fin=()=>{d.remove();const v=ls.json(AN_K,[]);v.push(an.id);ls.set(AN_K,JSON.stringify(v.slice(-30)));};
    d.querySelector('.adm-ok').onclick=fin;d.onclick=e=>{if(e.target===d)fin();};document.body.appendChild(d);};
  setTimeout(mostrar,1800);}

/* ── Ajustes que hizo el admin para vos ── */
function hisSubir(n,porque){n=Math.max(0,Math.min(100,Math.floor(Number(n)||0)));if(!n)return false;
  let H=ls.json(HIS_K,{});if(!H||typeof H!=='object')H={};const antes=Number(H.max)||0;if(antes>=n)return false;
  for(let i=1;i<=n;i++)if(!(Number(H[i])>0))H[i]=1;H.max=n;ls.set(HIS_K,JSON.stringify(H));
  try{window.dispatchEvent(new CustomEvent('invasores-historia',{detail:{max:n,de:porque}}));}catch(_){}return true;}
let tomando=false;
async function tomar(){if(tomando||!acct()||enMarco)return;tomando=true;
  try{const E=window.ESTANCIA,conPesos=!!(E&&E.ajustarPesos&&E.E&&!E.VISIT&&E.SYNC&&E.SYNC.pulled&&!E.SYNC.eligiendo);   // los pesos, recién cuando la estancia ya se juntó con la cuenta (si no, el primer «juntar» los pisa)
    const j=await call(auth({accion:'admTomar',tipos:conPesos?['oro','his','pesos']:['oro','his']}));
    for(const a of j.ajustes||[]){const m=a.motivo?' · '+a.motivo:'';
      try{
        if(a.tipo==='oro'&&window.ORO&&ORO.ajustar){const d=a.modo==='poner'?a.n-ORO.saldo():a.n;const r=ORO.ajustar('adm:'+a.id,d,'Admin'+(a.motivo?': '+a.motivo:''));if(r)aviso(`🛠️ Ajuste de la administración: ${r>0?'+':'−'}${fmt(Math.abs(r))} de oro${m}`);}
        else if(a.tipo==='his'){if(hisSubir(a.n,'admin'))aviso(`🛠️ Tu Historia de InvasorAR quedó en el nivel ${a.n}${m}`);}
        else if(a.tipo==='pesos'&&conPesos){E.ajustarPesos(a.n,a.modo,a.motivo);}
      }catch(_){}}
  }catch(_){}finally{tomando=false;}}

/* ── Recuperar la Historia de InvasorAR (una vez por día, sólo en InvasorAR) ── */
async function recuperar(){if(!acct()||enMarco||!/invasores/i.test(location.pathname))return;
  const k=REC_K,hoy=diaAR()+':'+String(acct().usuario).toLowerCase();if(ls.get(k)===hoy)return;
  try{const j=await call(auth({accion:'recuperar'}));ls.set(k,hoy);const H=ls.json(HIS_K,{})||{},mio=Number(H.max)||0;
    if(Number(j.his)>mio&&hisSubir(j.his,'recuperar'))aviso(`☁️ Recuperamos tu progreso de la Historia: nivel ${j.his} superado`,7000);}catch(_){}}

/* ── El latido reparte: cf (configuración), adj (ajustes pendientes), ad (sos admin) ── */
window.addEventListener('bloques-latido',e=>{const j=e&&e.detail;if(!j||!j.latido)return;
  if(j.cf!==undefined&&Number(j.cf)!==Number(cfg().g||0))traerCfg();
  if(j.ad)ls.set(ADM_K,'1');else if(ls.get(ADM_K))ls.set(ADM_K,null);
  if(j.adj)tomar();});
function arrancar(){if(enMarco)return;anuncio();setTimeout(recuperar,2500);
  // en la estancia, si quedaron ajustes de pesos esperando, se traen cuando la estancia ya cargó
  if(/estancia/i.test(location.pathname)){let n=0;const t=setInterval(()=>{const E=window.ESTANCIA;if(++n>20||!acct()){clearInterval(t);return;}if(E&&E.SYNC&&E.SYNC.pulled){clearInterval(t);tomar();}},3000);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arrancar);else arrancar();

/* ───────── El panel ───────── */
const ECO_DEF=[
  ['granja','🌾 Granja','Lo que dan cultivos, animales y talleres en EstanciAR.'],
  ['oro','🪙 Oro de los juegos','Lo que da cada partida (antes del tope del día).'],
  ['precios','🏷️ Precios de la tienda','Lo que cuesta todo en la tienda de EstanciAR (también ampliar el campo).'],
  ['leguas','🗺️ Leguas','Las leguas que da jugar cada día para La Gran Pampa.'],
  ['cambio','🔁 Tope de la pulpería','Cuánto oro se puede cambiar por pesos por día (hoy 50).']];
const P={tab:'eco',d:null,q:'',lista:null,ver:null,log:null,msg:'',busy:false};
function el(){return document.getElementById('adm-p');}
function cerrar(){const d=el();if(d)d.remove();document.removeEventListener('keydown',tecla);}
function tecla(e){if(e.key==='Escape')cerrar();}
async function abrir(){css();cerrar();const d=document.createElement('div');d.id='adm-p';d.className='adm-p';d.setAttribute('role','dialog');d.setAttribute('aria-label','Administración');
  document.body.appendChild(d);document.addEventListener('keydown',tecla);P.msg='Cargando…';pintar();
  try{P.d=await call(auth({accion:'admin',op:'yo'}));P.msg='';}catch(e){P.d=null;P.msg=e.message;}pintar();}
async function op(o,ok){P.busy=true;P.msg='';pintar();try{const j=await call(auth(Object.assign({accion:'admin'},o)));P.busy=false;if(ok)await ok(j);}catch(e){P.busy=false;P.msg=e.message;}pintar();}
function pintar(){const d=el();if(!d)return;
  const T=[['eco','Economía'],['gente','Jugadores'],['log','Registro']];
  let cuerpo='';
  if(!P.d)cuerpo=`<p class="adm-msg">${esc(P.msg||'')}</p>`;
  else if(P.tab==='eco'){const e=P.d.eco||{};
    cuerpo=`<p class="adm-lead">Multiplicadores para todos: 1 es como viene el juego. Van de 0,1 a 10 y se aplican en cada aparato la próxima vez que abre el juego.</p>
      ${ECO_DEF.map(([k,n,t])=>`<label class="adm-row"><span><b>${n}</b><small>${t}</small></span><input type="number" inputmode="decimal" min="0.1" max="10" step="0.1" data-eco="${k}" value="${Number(e[k]||1)}"></label>`).join('')}
      <button type="button" class="adm-go" id="adm-eco-ok"${P.busy?' disabled':''}>Guardar la economía</button>
      <h3>📣 Anuncio para todos</h3>
      ${P.d.an?`<p class="adm-cur">Publicado: «${esc(P.d.an.txt)}»</p>`:'<p class="adm-cur">No hay ningún anuncio.</p>'}
      <textarea id="adm-an" maxlength="280" rows="3" placeholder="Lo ve cada uno una sola vez, la próxima vez que abre la app."></textarea>
      <div class="adm-2"><button type="button" class="adm-go" id="adm-an-ok"${P.busy?' disabled':''}>Publicar anuncio</button>${P.d.an?`<button type="button" class="adm-b" id="adm-an-x"${P.busy?' disabled':''}>Borrar el anuncio</button>`:''}</div>`;}
  else if(P.tab==='gente'){
    if(P.ver){const v=P.ver,h=v.his||{};
      cuerpo=`<button type="button" class="adm-b adm-back" id="adm-back">‹ Volver a la lista</button>
        <div class="adm-who"><span class="adm-av">${esc(v.av)}</span><div><b>${esc(v.u)}</b><small>${v.ban?'⛔ Suspendido del ranking':'En el ranking'}</small></div></div>
        <div class="adm-kpi"><span><b>${v.oro==null?'—':fmt(v.oro)}</b>oro</span><span><b>${v.pesos==null?'—':'$'+fmt(v.pesos)}</b>pesos (última vez guardada)</span><span><b>${h.max||0}</b>Historia InvasorAR</span></div>
        <p class="adm-note">Historia según las tablas: nivel ${h.tablas||0} · según lo sincronizado: nivel ${h.sinc||0}.${(h.tablas||0)>(h.sinc||0)?' Se le va a recuperar sola la próxima vez que abra InvasorAR.':''}</p>
        <h3>Hacer un ajuste</h3>
        <div class="adm-form"><select id="adm-tipo"><option value="pesos">Pesos de la estancia</option><option value="oro">Oro</option><option value="his">Historia de InvasorAR (nivel)</option></select>
          <select id="adm-modo"><option value="sumar">Sumar (o restar con −)</option><option value="poner">Dejarlo en</option></select>
          <input id="adm-n" type="number" inputmode="numeric" placeholder="Cantidad">
          <input id="adm-mot" type="text" maxlength="120" placeholder="Motivo (lo ve el jugador)">
          <button type="button" class="adm-go" id="adm-aj"${P.busy?' disabled':''}>Aplicar el ajuste</button></div>

        ${v.ajustes&&v.ajustes.length?`<h3>Ajustes</h3>${v.ajustes.map(a=>`<div class="adm-li"><span>${a.tipo==='his'?'📖 Historia':a.tipo==='oro'?'🪙 Oro':'💵 Pesos'} · ${a.modo==='poner'?'dejar en ':''}${fmt(a.n)}${a.motivo?' · '+esc(a.motivo):''}</span><small>${a.tomado?'✓ Aplicado':'⏳ Pendiente'}</small></div>`).join('')}`:''}

function reglasOficiales(r){const a=reglasDe(r);return Object.keys(REGLAS0).every(k=>a[k]===REGLAS0[k]);}

/* ── Azar con semilla, separado por oleada y por tipo (tiros, picadas, botín, jefe, meteoros) ── */

/* ── Refugios: 18 × 11 celdas de 6 unidades (108 × 66), con el arco de paso abajo ── */
const REF_C=18,REF_F=11,REF_CEL=6;
const REF_MASK=(()=>{const m=[];for(let f=0;f<REF_F;f++)for(let c=0;c<REF_C;c++){let on=1;
    if(f===0&&(c<2||c>15))on=0;if(f===1&&(c<1||c>16))on=0;
    if(f>=7&&c>=6&&c<=11)on=0;if(f===6&&c>=7&&c<=10)on=0;m.push(on);}return m;})();

/* ── v77: oleadas generadas (Infinito e Historia) ──
   Cada oleada sale de una semilla: una forma de formación (bloque, cuña, copa, rombo, columnas, damero, alas, escalera,
   marco), un «tema» (blindada, de francotiradores, en picada, enjambre, kamikaze, con tormenta, veloz o mixta) y una mezcla
   de enemigos que se va abriendo con la dificultad «d» (la oleada equivalente): primero exploradores, después

const FORMAS={
  bloque:()=>true,
  cuna:(c,f,F)=>Math.abs(c-3.5)+.5>=F-1-f,
  copa:(c,f)=>Math.abs(c-3.5)+.5>=f,
  rombo:(c,f,F)=>Math.abs(c-3.5)+Math.abs(f-(F-1)/2)*1.7<=3.8,
  columnas:c=>c%3!==2,
  damero:(c,f)=>(c+f)%2===0,
  alas:c=>c<3||c>4,
  escalera:(c,f)=>(c-f+16)%8<5,
  marco:(c,f,F)=>f===0||f===F-1||c===0||c===7||c===3&&f%2===0||c===4&&f%2===1};
const TEMAS=[
  {k:'mixta',n:'',w:{}},
  {k:'blindada',n:'blindada',w:{bli:4},min:2},
  {k:'tiradores',n:'de francotiradores',w:{tir:4},min:1},
  {k:'picada',n:'en picada',w:{pic:4},pic:1,min:1},
  {k:'enjambre',n:'enjambre',w:{exp:3,div:3},vel:1.15,filas:1,min:3},
  {k:'kamikaze',n:'kamikaze',w:{kam:4},kam:1,min:5},
  {k:'tormenta',n:'con tormenta',w:{},meteoros:true,min:3},
  {k:'veloz',n:'veloz',w:{exp:2,pic:2},vel:1.35,filas:-1,min:2}];
const DESDE={exp:0,tir:1,pic:1,bli:2,div:3,kam:5};
function olaGen(sem,i,d){
  const st={a:hash32(sem+':gen:'+i)||1},rnd=()=>rngNext(st);
  const temas=TEMAS.filter(T=>(T.min||0)<=d),T=d<1?TEMAS[0]:temas[Math.floor(rnd()*temas.length)];
  const nombres=Object.keys(FORMAS).filter(k=>d>=2||k==='bloque'||k==='columnas'),forma=nombres[Math.floor(rnd()*nombres.length)];
  const F=Math.max(2,Math.min(5,3+Math.floor(d/3)+(T.filas||0)));
  const W={};for(const k of Object.keys(DESDE))if(d>=DESDE[k])W[k]=({exp:Math.max(1,6-d*.35),tir:1+d*.08,bli:.8+d*.09,pic:1,div:.9,kam:.6+d*.05})[k]*(T.w[k]||1);
  const tipos=Object.keys(W),tot=tipos.reduce((a,k)=>a+W[k],0);
  const elegir=()=>{let r=rnd()*tot;for(const k of tipos){r-=W[k];if(r<=0)return k;}return tipos[0];};
  let cel=[];for(let f=0;f<F;f++)for(let c=0;c<8;c++)if(FORMAS[forma](c,f,F))cel.push([c,f]);
  if(cel.length<10){cel=[];for(let f=0;f<F;f++)for(let c=0;c<8;c++)cel.push([c,f]);}
  const fila=[];for(let f=0;f<F;f++){const a=elegir(),b=rnd()<.3?elegir():a;fila.push([a,b]);}
  const celdas=cel.map(([c,f])=>[fila[f][c%2],c,f]),comp={};for(const [t] of celdas)comp[t]=(comp[t]||0)+1;
  const pic=W.pic?Math.min(4,1+Math.floor(d/6)+(T.pic||0)):0,kam=comp.kam?Math.min(3,1+Math.floor(Math.max(0,d-5)/6)+(T.kam||0)):0;
  return {gen:1,forma,tema:T.n,filas:F,celdas,comp,vel:(24+Math.min(8,d*.5))*(T.vel||1),int:Math.max(.7,1.1-d*.025),pic,kam,sum:d>=1,
    meteoros:!!T.meteoros||d>=3&&rnd()<.22,baja:Math.min(40,Math.floor(d)*3)};}
// Infinito: ciclos de 10 (8 formaciones generadas, un bonus en la 5.ª y un jefe en la 10.ª, que se alterna); cada ciclo
// suma un escalón (formación más rápida, tiros más seguidos, jefes con más vida, blindados más duros).
function olaInfinito(G,i){const blq=Math.floor(i/10),r=i%10;

// v79 · Cruce de La Gran Pampa: sin calentamiento (arranca como la oleada 8 de Infinito y sube rápido), sin bonus,
// y un jefe cada 5 (Centinela y Nodriza alternados). Todo sale de la semilla del cruce: los dos ven las mismas oleadas.
function olaPampa(G,i){const r=i%5,blq=1+Math.floor(i/3);

// Historia: 100 niveles fijos (la misma semilla para todos), cada uno de 1 a 3 oleadas, cada vez más difíciles; cada 10, un
// jefe (Centinela y Nodriza alternados, cada vez más fuertes) y los terminados en 5 tienen un bonus en el medio.
const HISTORIA_N=100;
function nivelOlas(n){n=Math.max(1,Math.min(HISTORIA_N,Math.round(n)||1));const sem='invasorar-historia:'+n;
  if(n%10===0)return [{blq:Math.floor((n-10)/20),def:{jefe:n%20?'centinela':'nodriza'}}];
  const w=n<=3?1:n%10===5||n%10>=8||n>50?3:2,L=[];
  for(let q=0;q<w;q++){if(n%10===5&&q===1){L.push({blq:Math.floor((n-1)*.08),def:{bonus:true}});continue;}

const semillaHistoria=n=>hash32('invasorar-historia:'+n);
/* ── v77: En contra ──
   El que ataca tiene un presupuesto que se recarga con el tiempo; compra invasores (cada tipo cuesta distinto), los ubica en
   una grilla de 8 × 5 y los manda en grupo. Si el campo está ocupado, la oleada espera (una en cola); cuando el que
   defiende limpia, entra la siguiente. El que defiende suma por cada baja y también por cada segundo que aguanta (así no
   conviene «no mandar nada»), y si una oleada llega a la línea pierde una vida y esa oleada se va. Ronda de 150 s o hasta
   quedarse sin vidas; después se invierten los papeles y gana el que hizo más puntos defendiendo. */

function costoOla(celdas){let c=0;for(const x of celdas||[])c+=CONTRA.costo[x&&x[0]]||0;return c;}
function olaContra(celdas,n){const comp={};for(const [t] of celdas)comp[t]=(comp[t]||0)+1;
  const filas=1+Math.max(...celdas.map(x=>x[2]));
  return {filas,celdas:celdas.map(x=>x.slice()),comp,vel:26+Math.min(6,n*.5),int:Math.max(.75,1-n*.02),pic:comp.pic?Math.min(3,Math.ceil(comp.pic/3)):0,
    kam:comp.kam?Math.min(3,Math.ceil(comp.kam/3)):0,sum:false,contra:1};}
// Valida y encola la oleada del que ataca: [[tipo, columna 0-7, fila 0-4], …]. Devuelve {ok, costo} o {ok:false, error}.
function encolarOla(G,celdas){
  if(!G||G.modo!=='contra'||G.fin)return {ok:false,error:'fin'};
  if(!Array.isArray(celdas)||!celdas.length||celdas.length>CONTRA.maxCel)return {ok:false,error:'vacia'};
  const usadas=new Set(),L=[];
  for(const x of celdas){if(!Array.isArray(x))return {ok:false,error:'celda'};const t=String(x[0]),c=x[1]|0,f=x[2]|0;
    if(!CONTRA.costo[t]||c<0||c>7||f<0||f>4||usadas.has(c+':'+f))return {ok:false,error:'celda'};usadas.add(c+':'+f);L.push([t,c,f]);}

// Si el que ataca no manda nada y el campo queda vacío 5 s, sale sola una oleada con lo que haya en el presupuesto (no
// conviene guardarse: el que defiende igual suma por aguantar).
const ORD_AUTO=['tir','exp','pic','exp','bli','div','exp','kam'];
function autoOla(G){if(G.pres<10)return;let p=G.pres;const cel=[];
  for(let f=0;f<5;f++)for(let c=0;c<8;c++){const t=ORD_AUTO[(c+f*3)%ORD_AUTO.length],k=CONTRA.costo[t]<=p?t:CONTRA.costo.exp<=p?'exp':null;if(k){cel.push([k,c,f]);p-=CONTRA.costo[k];}}

/* ── v77: de a dos (cooperativo). G.nave es la del que hospeda y G.nave2 la del invitado; cada una con sus vidas, el puntaje
   y la cadena son de los dos. Si una se queda sin vidas cae: se la rescata pasando por encima 2 segundos (o vuelve sola,
   con una vida, al terminar la oleada). Se pierde cuando caen las dos. */

/* ── Partida nueva ──

// Qué oleada (de la tabla) toca en el lugar «i» de la secuencia del modo, y con qué escala.
function olaDe(G,i){
  const M=MODOS[G.modo];

  if(G.modo==='pampa')return {k:-1,...olaPampa(G,i)};
  if(G.modo==='historia'){const L=nivelOlas(G.nivel);return {k:-1,...(L[i]||L[L.length-1])};}
  if(G.modo==='contra')return {k:-1,blq:Math.floor((G.enviadas||0)/4),def:G.cola&&G.cola.length?G.cola.shift():OLA_CONTRA0};
  if(M.seq)return {k:M.seq[i],blq:0};

  // cada bloque más duro

function hayMasOlas(G,i){const M=MODOS[G.modo];if(G.modo==='historia')return i<nivelOlas(G.nivel).length;if(G.modo==='infinito'||G.modo==='contra'||G.modo==='pampa')return true;if(M.seq)return i<M.seq.length;if(G.modo==='arcade')return i<OLEADAS.length;if(G.modo==='libre')return i<G.R.oleadas;return true;}

/* ── Utilidades ── */
const vivos=G=>G.ene.filter(e=>e.est!=='muerto');

// Vida extra a los 30.000, 80.000 y 160.000 puntos (hasta 5).
const VIDA_EXTRA=[30000,80000,160000];
function sumarPuntos(G,base,x,y,conCombo=true){const p=Math.round(base*(conCombo?G.combo.mult:1)),antes=G.puntos;G.puntos+=p;G.ev.push({t:'pts',x,y,p});

  return p;}
// La cadena: cada baja (o gema) la sostiene 2,2 s; cada 6 bajas seguidas sube el multiplicador (hasta ×8).
function baja(G){const C=G.combo;C.n++;C.t=0;const m=Math.min(8,1+Math.floor(C.n/6));if(m>C.mult){C.mult=m;G.ev.push({t:'combo',m});}if(C.mult>G.st.maxCombo)G.st.maxCombo=C.mult;}
function cortaCombo(G){if(G.combo.n>=6||G.combo.mult>1)G.ev.push({t:'combo0',m:G.combo.mult});G.combo={n:0,mult:1,t:0};}
function posForm(G,e){return [e.bx+G.form.fx,e.by+G.form.fy];}

/* ── Un paso (1/60 s) ──
   inp = {mov:-1|0|1, tx: x objetivo o null (deslizar), fuego: bool, escudo: bool (se apretó en este paso)} */
function paso(G,inp,inp2){
  if(G.fin)return G;
  inp=inp||{};inp2=inp2||{};G.t++;G.ev.length=0;
  const R=G.R,NS=navesDe(G),IN=[inp,inp2],N=G.nave;
  // la fase de introducción o de transición: se mueve la nave, se dispara y se juntan cosas, nada más
  if(G.fase!=='juego'){
    NS.forEach((M,j)=>{if(!M.caida)moverNave(G,IN[j],M);});
    G.faseT-=DT;
    if(G.modo==='contra'){G.seg+=DT;contraTick(G);}   // en contra el reloj de la ronda corre siempre
    if(G.fase==='jefeIntro'&&G.jefe){const J=G.jefe;J.y+=(J.y0-J.y)*.08;}
    if(G.fase==='intro'||G.fase==='jefeIntro'){moverEntradas(G);}
    NS.forEach((M,j)=>{if(!M.caida)disparar(G,IN[j],M);});moverTiros(G,G.fase==='transicion');moverPoderes(G,G.fase==='transicion');moverGemas(G,G.fase==='transicion');
    if(G.faseT<=0){if(G.fase==='transicion'){if(G.modo==='contra'&&!(G.cola&&G.cola.length)){G.faseT=0;G.espera=true;G.esperaT=(G.esperaT||0)+DT;if(G.esperaT>=CONTRA.auto)autoOla(G);}else{G.espera=false;siguienteOla(G);}}
      else{G.fase='juego';if(G.jefe)G.jefe.y=G.jefe.y0;}}
    if(G.modo==='contra'&&!G.fin&&G.seg>=MODOS.contra.lim)terminar(G,'tiempo','tiempo');
    return G;}
  G.seg+=DT;G.form.olaT+=DT;if(G.form.dropCd>0)G.form.dropCd-=DT;
  if(G.modo==='contra')contraTick(G);
  // actividad (para saber si la partida fue de verdad): un segundo cuenta si te moviste, disparaste o usaste el escudo
  const sec=Math.floor(G.seg);
  NS.forEach((M,j)=>{const q=IN[j];if(!M.caida&&(q.mov||q.tx!=null&&Math.abs(q.tx-M.x)>2||q.fuego||q.escudo))G.st.actT[sec]=1;});
  // 1) escudo, poderes y movimiento propio (de cada nave)
  NS.forEach((M,j)=>{const q=IN[j];if(M.caida)return;
    if(M.esc.act>0)M.esc.act=Math.max(0,M.esc.act-DT);
    if(M.esc.rec>0)M.esc.rec=Math.max(0,M.esc.rec-DT);
    if(q.escudo&&R.escudo&&M.esc.rec<=0&&M.esc.act<=0){M.esc.act=1.2;M.esc.rec=R.recarga*(DIFS[G.dif].rec||1)+1.2;G.ev.push({t:'escudo',x:M.x,p:M.p});}
    if(M.inv>0)M.inv=Math.max(0,M.inv-DT);
    for(const k of Object.keys(M.pw)){if(M.pw[k]>0){M.pw[k]-=DT;if(M.pw[k]<=0){M.pw[k]=0;G.ev.push({t:'pwFin',k,p:M.p});}}}
    moverNave(G,q,M);});
  if(G.nave2)rescate(G);
  // 2) formación, picadas, kamikazes, bandadas, suministros, meteoros y jefe
  moverEntradas(G);
  if(G.jefe)moverJefe(G);else if(G.def.bonus)moverBandadas(G);else moverFormacion(G);
  moverAtacantes(G);
  moverSuministro(G);
  moverRocas(G);
  // 3) tiros propios
  NS.forEach((M,j)=>{if(!M.caida)disparar(G,IN[j],M);});
  // 4) proyectiles (con pasos chicos: un tiro rápido no atraviesa una celda ni un enemigo entre dos pasos), láser, poderes, gemas
  moverTiros(G,false);
  NS.forEach((M,j)=>{if(!M.caida&&M.pw.laser>0&&IN[j].fuego)laser(G,M);});
  moverHostiles(G);
  moverPoderes(G,false);
  moverGemas(G,false);
  // 5) la cadena: 2,2 segundos sin bajas ni gemas la cortan
  G.combo.t+=DT;if(G.combo.t>=2.2&&(G.combo.n||G.combo.mult>1))cortaCombo(G);
  // 6) ¿terminó? invasión, vidas, objetivos y reloj, en ese orden
  if(!G.jefe&&!G.def.bonus&&!G.fin){const inv=enForm(G).some(e=>e.y+TIPOS[e.tipo].h/2>=MUNDO.LINEA);
    if(inv){G.ev.push({t:'invasion'});
      if(G.modo==='contra'){N.vidas--;G.st.danio++;N.inv=1.5;cortaCombo(G);G.ene=[];G.hostiles=[];G.rocas=[];G.barr=[];if(N.vidas>0)olaCompleta(G,true);}
      else if(R.invasion==='vida'&&N.vidas>1){N.vidas--;G.st.danio++;N.inv=1.5;cortaCombo(G);G.hostiles=[];G.form.fx=0;G.form.fy=0;G.form.dir=1;G.ene.forEach(e=>{if(e.est!=='muerto'){e.est='form';const p=posForm(G,e);e.x=p[0];e.y=p[1];}});G.fase='intro';G.faseT=1;}
      else{N.vidas=Math.max(0,N.vidas-(R.invasion==='vida'?1:N.vidas));if(G.nave2)G.nave2.vidas=0;terminar(G,'derrota','invasion');return G;}}}
  if(NS.every(M=>M.vidas<=0)){terminar(G,'derrota','vidas');return G;}
  if(G.jefe&&G.jefe.vida<=0&&!G.jefe.muerto){G.jefe.muerto=true;}
  if(G.def.bonus){G.bonusT-=DT;if(G.bonusT<=0||vivos(G).length===0)olaCompleta(G);}
  else if((G.jefe&&G.jefe.muerto)||(!G.jefe&&vivos(G).length===0)){olaCompleta(G);}
  const lim=MODOS[G.modo].lim;if(!G.fin&&lim&&G.seg>=lim)terminar(G,G.modo==='resistencia'?'expedicion':'tiempo','tiempo');
  return G;
}
// La nave: con el dedo (tx) va casi al instante (hasta 2600 por segundo, sin inercia); con teclas o botones acelera en
// 0,05 s a su velocidad y frena en seco.
function moverNave(G,inp,N=G.nave){const v=G.R.naveVel;let nx=N.x;
  if(inp.tx!=null&&Number.isFinite(inp.tx)){const d=inp.tx-N.x,m=2600*DT;nx+=Math.max(-m,Math.min(m,d));N.vx=(nx-N.x)/DT;}
  else if(inp.mov){const obj=Math.sign(inp.mov)*v;N.vx+=(obj-N.vx)*.45;if(Math.sign(N.vx)!==Math.sign(obj))N.vx=obj*.5;nx+=N.vx*DT;}
  else N.vx=0;
  nx=Math.max(MUNDO.NAVE_MIN,Math.min(MUNDO.NAVE_MAX,nx));if(Math.abs(nx-N.x)>.01)G.mov++;N.x=nx;}

function disparar(G,inp,N=G.nave){const R=G.R;N.cad=Math.max(0,N.cad-DT);
  if(!inp.fuego||N.cad>0||N.pw.laser>0)return;
  const dos=!!G.nave2,propios=dos?G.tiros.filter(t=>(t.p||1)===N.p).length:G.tiros.length,y=MUNDO.NAVE_Y-20,tiro=(x,yy,vx)=>dos?{x,y:yy,vx,h:[],p:N.p}:{x,y:yy,vx,h:[]};
  if(N.pw.triple>0){if(propios+3<=20){G.tiros.push(tiro(N.x,y,0),tiro(N.x-8,y+4,-150),tiro(N.x+8,y+4,150));G.st.disparos+=3;G.ev.push({t:'tiro',x:N.x,k:3,p:N.p});}}
  else if(propios<8){G.tiros.push(tiro(N.x,y,0));G.st.disparos++;G.ev.push({t:'tiro',x:N.x,p:N.p});}
  N.cad=R.cad;}

/* ── Entradas en formación (curva de Bézier desde un costado hasta el lugar en la formación, que se mueve) ── */
function moverEntradas(G){
  for(const e of G.ene){
    if(e.est==='entra'){const n=e.en;n.t+=DT;if(n.t<0)continue;const u=Math.min(1,n.t/n.dur),a=1-u,p=posForm(G,e);
      e.x=a*a*n.x0+2*a*u*n.cx+u*u*p[0];e.y=a*a*n.y0+2*a*u*n.cy+u*u*p[1];if(u>=1){e.est='form';e.x=p[0];e.y=p[1];}}
    else if(e.est==='vuelve'){const n=e.en;n.t+=DT;const u=Math.min(1,n.t/n.dur),a=1-u,p=posForm(G,e);
      e.x=a*a*n.x0+2*a*u*n.cx+u*u*p[0];e.y=a*a*n.y0+2*a*u*n.cy+u*u*p[1];if(u>=1){e.est='form';e.x=p[0];e.y=p[1];}}}
}

function moverFormacion(G){
  const F=G.form,D=DIFS[G.dif],R=G.R,def=G.def,E=enForm(G),k=ralento(G);
  const vivosN=vivos(G).length,ini=G.iniciales||1;
  // la formación se mece más rápido a medida que quedan menos (como siempre), con tope; lo que sube la tensión son los
  // ataques, no la velocidad
  let vel=def.vel*G.escala.vel*(1+1.4*(1-vivosN/ini))*D.ene*R.fVel;
  if(F.olaT>45)vel*=Math.pow(1.05,Math.floor((F.olaT-45)/8)+1);
  const tope=(G.escala.blq?Math.min(160,D.tope*G.escala.vel):D.tope)*R.fVel;vel=Math.min(vel,tope);
  F.vel=vel;vel*=k;
  // refuerzos: cuando queda el 40 %, entra volando otra escuadrilla a llenar los huecos (salvo en la primera oleada)
  if(G.ola>0&&!F.refHecho&&G.slots&&vivosN>0&&vivosN<=ini*.4&&G.fase==='juego'){F.refHecho=true;
    const ocupados=new Set(G.ene.filter(e=>e.est!=='muerto'&&e.col>=0).map(e=>e.col+':'+e.fila));
    const libres=G.slots.filter(sl=>!ocupados.has(sl.col+':'+sl.fila)).slice(-Math.min(16,Math.ceil(G.slots.length*.5)));
    libres.forEach((sl,q)=>{const lado=q%2?1:-1,T=TIPOS[sl.tipo];
      G.ene.push({id:G.sigId++,tipo:sl.tipo,vida:T.vida+G.escala.vida*(sl.tipo==='bli'?1:0),bx:sl.bx,by:sl.by,x:lado>0?780:-60,y:-40,col:sl.col,fila:sl.fila,est:'entra',fl:0,carga:0,
        en:{t:-q*.09,dur:1.1,x0:lado>0?780:-60,y0:40,cx:lado>0?560:160,cy:460}});});
    G.iniciales+=libres.length;if(libres.length)G.ev.push({t:'refuerzo',n:libres.length});}
  const todos=G.ene.filter(e=>e.est!=='muerto'&&e.est!=='entra');
  if(todos.length){F.fx+=F.dir*vel*DT;
    let mn=1e9,mx=-1e9;for(const e of G.ene){if(e.est==='muerto'||e.col<0)continue;const w=TIPOS[e.tipo].w/2,x=e.bx+F.fx;if(x-w<mn)mn=x-w;if(x+w>mx)mx=x+w;}
    if(mn<34&&F.dir<0){F.fx+=34-mn;F.fy+=16;F.dir=1;G.ev.push({t:'baja'});}
    else if(mx>686&&F.dir>0){F.fx-=mx-686;F.fy+=16;F.dir=-1;G.ev.push({t:'baja'});}}
  for(const e of G.ene)if(e.est==='form'){const p=posForm(G,e);e.x=p[0];e.y=p[1];}
  // los enemigos de la formación que bajan hasta los refugios los van comiendo
  for(const e of E){const T=TIPOS[e.tipo];if(e.y+T.h/2<705)continue;for(const r of G.ref)comerRefugio(r,e.x,e.y,T.w,T.h);}
  if(G.fase!=='juego')return;
  // tiros de la formación: un temporizador para toda la oleada; tira el de más abajo de una columna. Los francotiradores
  // avisan (se cargan 0,4 s) y apuntan a donde estás; los blindados tiran de a dos.
  F.tiroT-=DT*k;
  if(F.tiroT<=0){F.tiroT+=def.int*G.escala.int*D.int*R.fInt;
    const cols={};for(const e of E){if(e.carga>0)continue;if(!cols[e.col]||e.by>cols[e.col].by)cols[e.col]=e;}
    const cand=Object.keys(cols).sort((a,b)=>a-b).map(c=>cols[c]);
    const maxF=G.escala.blq?Math.min(14,9+G.escala.blq):9,propios=G.hostiles.filter(h=>h.de==='f').length;
    if(cand.length&&propios<maxF&&G.hostiles.length<40){
      let tot=0;const W=cand.map(e=>{const w=e.tipo==='tir'?(D.tir||3):e.tipo==='bli'?2:1;tot+=w;return w;});
      let r=rngNext(G.rs.tiro)*tot,sel=cand[0];for(let i=0;i<cand.length;i++){r-=W[i];if(r<=0){sel=cand[i];break;}}
      if(sel.tipo==='tir'){sel.carga=.4;G.ev.push({t:'carga',x:sel.x,y:sel.y});}
      else tiroEnemigo(G,sel);}
    else rngNext(G.rs.tiro);}   // el intento se consume igual (sin deuda)
  for(const e of E)if(e.carga>0){e.carga-=DT*k;if(e.carga<=0){e.carga=0;tiroEnemigo(G,e);}}
  // picadas: cada tanto, uno (o dos) se larga en rulo hacia la nave, tira una vez y vuelve a su lugar por arriba
  if(def.pic&&G.ene.length){F.picT-=DT*k;if(F.picT<=0){F.picT+=Math.max(1.4,3.2-.35*def.pic)*G.escala.int;
    const fuera=G.ene.filter(e=>e.est==='pica').length,cand=E.filter(e=>e.tipo==='pic'||e.tipo==='exp'||e.tipo==='div');
    const pref=cand.filter(e=>e.tipo==='pic'),lista=pref.length?pref:cand;
    if(fuera<def.pic&&lista.length&&vivosN>3){const e=lista[Math.floor(rngNext(G.rs.pica)*lista.length)];
      e.est='pica';e.pk={t:0,x0:e.x,y0:e.y,lado:e.x<360?1:-1,tiro:false};G.ev.push({t:'pica',x:e.x,y:e.y});}
    else rngNext(G.rs.pica);}}
  // kamikazes: avisan medio segundo (titilan) y se lanzan en línea recta a donde estabas
  if(def.kam){F.kamT-=DT*k;if(F.kamT<=0){F.kamT+=Math.max(2.2,5.5-def.kam)*G.escala.int;
    const fuera=G.ene.filter(e=>e.est==='apunta'||e.est==='kami').length,cand=E.filter(e=>e.tipo==='kam');
    if(fuera<def.kam&&cand.length){const e=cand[Math.floor(rngNext(G.rs.pica)*cand.length)];e.est='apunta';e.av=.55;G.ev.push({t:'kamAviso',x:e.x,y:e.y});}
    else rngNext(G.rs.pica);}}
  // la nave de suministros: cruza arriba cada tanto (la primera a los 7 s) y suelta un poder si la bajás
  if(def.sum){F.sumT-=DT;if(F.sumT<=0&&!G.sum){F.sumT=11;const dir=((G.ola+Math.floor(F.olaT/11))%2)?-1:1;G.sum={x:dir>0?-40:760,y:96,dir,vida:3,fl:0};G.ev.push({t:'suministro'});}}
  // lluvia de meteoritos: a los 9 s, 10 piedras en 4 segundos (se pueden romper: 15 cada una)
  if(def.meteoros&&F.metT>0){F.metT-=DT;if(F.metT<=0){G.ev.push({t:'meteoros'});F.metN=10;F.metC=0;}}
  if(F.metN>0){F.metC-=DT;if(F.metC<=0){F.metC=.4;F.metN--;const x=40+rngNext(G.rs.met)*640,vx=(rngNext(G.rs.met)-.5)*120,r=14+rngNext(G.rs.met)*12;
    G.rocas.push({x,y:-30,vx,vy:(240+rngNext(G.rs.met)*120)*D.proy,r,vida:r>20?2:1,rot:rngNext(G.rs.met)*6,id:G.sigId++});}}
}
function tiroEnemigo(G,e){const D=DIFS[G.dif],R=G.R,k=G.escala.blq?Math.pow(1.04,G.escala.blq):1,T=TIPOS[e.tipo];
  const y=e.y+T.h/2;
  if(e.tipo==='tir'){const dx=masCerca(G,e.x).x-e.x,dy=MUNDO.NAVE_Y-y,l=Math.hypot(dx,dy)||1,v=Math.min(470,370*D.proy*R.fProy*k);
    G.hostiles.push({x:e.x,y,vx:v*dx/l,vy:v*dy/l,de:'f',k:'z'});G.ev.push({t:'tiroE',x:e.x,k:'z'});}
  else if(e.tipo==='bli'){const v=Math.min(380,280*D.proy*R.fProy*k);G.hostiles.push({x:e.x-10,y,vx:0,vy:v,de:'f',k:'d'},{x:e.x+10,y,vx:0,vy:v,de:'f',k:'d'});G.ev.push({t:'tiroE',x:e.x,k:'d'});}
  else{const v=Math.min(400,300*D.proy*R.fProy*k);G.hostiles.push({x:e.x,y,vx:0,vy:v,de:'f',k:'r'});G.ev.push({t:'tiroE',x:e.x,k:'r'});}}

// Picadas, kamikazes, chispas (lo que dejó un divisor) y las vueltas a la formación.
function moverAtacantes(G){const k=ralento(G),D=DIFS[G.dif],dos=!!G.nave2;let N=G.nave;
  for(const e of G.ene){if(dos)N=masCerca(G,e.x);
    if(e.est==='pica'){const P=e.pk;P.t+=DT*k;
      // un rulo: baja meciéndose y se va corriendo hacia donde está la nave
      const vy=(330+60*D.ene)*k;e.y+=vy*DT;
      const sway=Math.sin(P.t*3.2)*170*P.lado;const objX=Math.max(40,Math.min(680,N.x));
      e.x+=((P.x0+sway)-e.x)*.06+((objX-e.x)*.012);
      if(!P.tiro&&e.y>380){P.tiro=true;if(G.hostiles.length<40){const dx=N.x-e.x,dy=MUNDO.NAVE_Y-e.y,l=Math.hypot(dx,dy)||1,v=340*D.proy*G.R.fProy;G.hostiles.push({x:e.x,y:e.y+12,vx:v*dx/l,vy:v*dy/l,de:'f',k:'r'});G.ev.push({t:'tiroE',x:e.x,k:'r'});}}
      for(const r of G.ref)comerRefugio(r,e.x,e.y,TIPOS[e.tipo].w*.6,TIPOS[e.tipo].h*.6);
      if(choqueNave(G,e))continue;
      if(e.y>1000){e.est='vuelve';const p=posForm(G,e);e.en={t:0,dur:1,x0:e.x<360?-40:760,y0:-40,cx:p[0],cy:-120};e.x=e.en.x0;e.y=-40;}}
    else if(e.est==='apunta'){e.av-=DT*k;if(e.av<=0){e.est='kami';const tx=Math.max(40,Math.min(680,N.x)),dx=tx-e.x,dy=MUNDO.NAVE_Y+80-e.y,l=Math.hypot(dx,dy)||1,v=640*D.ene;e.kv={vx:v*dx/l,vy:v*dy/l};G.ev.push({t:'kami',x:e.x,y:e.y});}}
    else if(e.est==='kami'){e.x+=e.kv.vx*DT*k;e.y+=e.kv.vy*DT*k;
      if(choqueRefugio(G,e))continue;if(choqueNave(G,e))continue;
      if(e.y>1000||e.x<-60||e.x>780){e.est='muerto';e.salio=true;}}
    else if(e.est==='mini'){e.mt=(e.mt||0)+DT*k;e.x+=e.mv.vx*DT*k+Math.sin(e.mt*9)*1.6;e.y+=e.mv.vy*DT*k;
      if(e.x<20&&e.mv.vx<0||e.x>700&&e.mv.vx>0)e.mv.vx*=-1;
      if(choqueRefugio(G,e))continue;if(choqueNave(G,e))continue;
      if(e.y>1000){e.est='muerto';e.salio=true;}}}
  if(G.ene.some(e=>e.est==='muerto'))G.ene=G.ene.filter(e=>e.est!=='muerto');}
function choqueNave(G,e){const T=TIPOS[e.tipo];
  for(const N of navesDe(G)){if(N.caida)continue;
    if(!solapa(e.x,e.y,T.w*.8,T.h*.8,N.x,MUNDO.NAVE_Y,34,22))continue;
    if(N.esc.act>0){e.est='muerto';G.st.escudosOk++;G.ev.push({t:'explota',x:e.x,y:e.y,k:e.tipo,grande:1});sumarPuntos(G,TIPOS[e.tipo].pts,e.x,e.y);baja(G);return true;}
    if(N.inv<=0&&!G.R.invul){e.est='muerto';G.ev.push({t:'explota',x:e.x,y:e.y,k:e.tipo});danio(G,N);return true;}}
  return false;}
function choqueRefugio(G,e){const T=TIPOS[e.tipo];for(const r of G.ref){if(pegarRefugio(r,e.x,e.y,T.w*.7,T.h*.7,1)){comerRefugio(r,e.x,e.y,T.w,T.h*.8);e.est='muerto';G.ev.push({t:'explota',x:e.x,y:e.y,k:e.tipo});return true;}}return false;}

// La oleada bonus: bandadas que cruzan meciéndose; no tiran ni chocan.
function moverBandadas(G){
  for(const e of G.ene){if(e.est!=='bandada')continue;const B=e.bd;B.t+=DT;if(B.t<0)continue;
    e.x=B.lado>0?-40+B.t*230:760-B.t*230;e.y=B.y0+Math.sin(B.t*B.fq)*B.amp;
    if(B.t>3.8){e.est='muerto';e.salio=true;}}
  if(G.ene.some(e=>e.est==='muerto'))G.ene=G.ene.filter(e=>e.est!=='muerto');}

function moverSuministro(G){const S=G.sum;if(!S)return;S.x+=S.dir*150*DT;if(S.fl>0)S.fl-=DT;if(S.x<-60||S.x>780)G.sum=null;}
function moverRocas(G){const k=ralento(G);const keep=[];
  for(const r of G.rocas){r.x+=r.vx*DT*k;r.y+=r.vy*DT*k;r.rot+=DT*2;
    if(r.y>1000)continue;
    let pego=false;for(const f of G.ref)if(pegarRefugio(f,r.x,r.y,r.r,r.r,1)){pego=true;comerRefugio(f,r.x,r.y,r.r*1.2,r.r);break;}
    if(pego){G.ev.push({t:'roca',x:r.x,y:r.y});continue;}
    let golpe=false;for(const N of navesDe(G)){if(N.caida)continue;if(Math.abs(r.x-N.x)<r.r+16&&Math.abs(r.y-MUNDO.NAVE_Y)<r.r+10){
      if(N.esc.act>0){G.st.escudosOk++;G.ev.push({t:'roca',x:r.x,y:r.y});golpe=true;break;}
      if(N.inv<=0&&!G.R.invul){G.ev.push({t:'roca',x:r.x,y:r.y});danio(G,N);golpe=true;break;}}}
    if(golpe)continue;
    keep.push(r);}
  G.rocas=keep;}

function moverJefe(G){
  const J=G.jefe,JD=JEFES[J.tipo],D=DIFS[G.dif],R=G.R,N=G.nave2?masCerca(G,J.x):G.nave,k=ralento(G);
  if(J.flash>0)J.flash-=DT;
  if(J.muerto)return;
  J.t+=DT*k;
  // se mece de lado a lado y sube y baja un poco
  const lo=J.w/2+24,hi=720-J.w/2-24;
  J.x+=J.dir*JD.vel*D.ene*R.fVel*DT*k*(J.fase>=3?1.35:1);if(J.x<lo){J.x=lo;J.dir=1;}if(J.x>hi){J.x=hi;J.dir=-1;}
  J.y=J.y0+Math.sin(J.t*1.3)*14;
  // fases: al 60 % y al 25 % (un segundo sin ataques, se limpian los tiros y cambia el patrón)
  const p=J.vida/J.max,f=p>.6?1:p>.25?2:3;
  if(f!==J.fase){J.fase=f;J.trans=1;G.hostiles=[];G.barr=[];G.ev.push({t:'fase',f,tipo:J.tipo});}
  if(J.trans>0){J.trans-=DT;return;}
  const pv=250*D.proy*R.fProy;
  const bala=(x,y,ang,v,kk)=>{if(G.hostiles.length<46)G.hostiles.push({x,y,vx:v*Math.sin(ang),vy:v*Math.cos(ang),de:'j',k:kk||'o'});};
  const abanico=(n,ab)=>{for(let i=0;i<n;i++){const a=-ab/2+ab*i/(n-1);bala(J.x,J.y+J.h/2,a,pv);}G.ev.push({t:'abanico',x:J.x});};
  const rafaga=n=>{const dx=N.x-J.x,dy=MUNDO.NAVE_Y-J.y,a=Math.atan2(dx,dy);for(let i=0;i<n;i++)bala(J.x,J.y+J.h/2,a+(i-(n-1)/2)*.06,pv*1.35,'z');G.ev.push({t:'tiroE',x:J.x,k:'z'});};
  const barrido=(x,aviso)=>{G.barr.push({x:Math.max(70,Math.min(650,x)),av:aviso,pe:.5,hit:false});G.ev.push({t:'barridoAviso'});};
  const t2=D.int*R.fInt;
  if(J.tipo==='centinela'){
    if(J.fase===1){J.abT-=DT*k;if(J.abT<=0){J.abT+=1.3*t2;abanico(5,1.1);}
      J.rafT-=DT*k;if(J.rafT<=0){J.rafT+=2.6*t2;rafaga(3);}}
    else if(J.fase===2){J.abT-=DT*k;if(J.abT<=0){J.abT+=1.6*t2;abanico(7,1.4);}
      J.barrT-=DT*k;if(J.barrT<=0){J.barrT+=3.6*t2;barrido(60+rngNext(G.rs.jefe)*600,.85);}
      J.rafT-=DT*k;if(J.rafT<=0){J.rafT+=2.2*t2;rafaga(3);}}
    else{// espiral: dos brazos que giran
      J.espT-=DT*k;if(J.espT<=0){J.espT+=.11*t2;J.espA+=.38;bala(J.x,J.y+10,J.espA,pv*.85);bala(J.x,J.y+10,J.espA+Math.PI,pv*.85);if(J.espN++%12===0)G.ev.push({t:'abanico',x:J.x});}
      J.rafT-=DT*k;if(J.rafT<=0){J.rafT+=2.4*t2;rafaga(5);}}}
  else{
    if(J.fase===1){J.abT-=DT*k;if(J.abT<=0){J.abT+=1.5*t2;abanico(7,1.5);}
      J.refT-=DT*k;if(J.refT<=0){J.refT+=4.5;spawnMinis(G,J.x,J.y+J.h/2,2);}}
    else if(J.fase===2){
      J.barrT-=DT*k;if(J.barrT<=0){J.barrT+=3*t2;const a=70+rngNext(G.rs.jefe)*580;let b=a<360?a+180+rngNext(G.rs.jefe)*(650-a-180):a-180-rngNext(G.rs.jefe)*(a-180-70);barrido(a,1);barrido(b,1);}
      J.rafT-=DT*k;if(J.rafT<=0){J.rafT+=1.8*t2;rafaga(3);}
      J.refT-=DT*k;if(J.refT<=0){J.refT+=5;const x=(J.alterna++%2)?560:160;G.ene.push({id:G.sigId++,tipo:'kam',vida:1,bx:x,by:260,x,y:260,col:-1,est:'apunta',av:.6,fl:0});G.ev.push({t:'kamAviso',x,y:260});}}
    else{J.espT-=DT*k;if(J.espT<=0){J.espT+=.09*t2;J.espA+=.31;for(let q=0;q<3;q++)bala(J.x,J.y+10,J.espA+q*2.0944,pv*.8);if(J.espN++%14===0)G.ev.push({t:'abanico',x:J.x});}
      J.abT-=DT*k;if(J.abT<=0){J.abT+=2.2*t2;abanico(9,1.8);}
      J.refT-=DT*k;if(J.refT<=0){J.refT+=4;spawnMinis(G,J.x,J.y+J.h/2,2);}}}
  // los barridos: aviso y después la franja quema (como mucho un golpe por ventana)
  for(const B of G.barr){
    if(B.av>0){B.av-=DT;continue;}
    B.pe-=DT;
    for(const M of navesDe(G)){const hk=M.p===2?'hit2':'hit';if(M.caida||B[hk]||Math.abs(M.x-B.x)>=30+15)continue;
      if(M.esc.act>0){B[hk]=true;G.st.escudosOk++;G.ev.push({t:'bloqueo',x:M.x,y:MUNDO.NAVE_Y});}
      else if(M.inv<=0&&!G.R.invul){B[hk]=true;danio(G,M);}}}
  G.barr=G.barr.filter(B=>B.av>0||B.pe>0);
}
function spawnMinis(G,x,y,n){for(let i=0;i<n;i++){if(G.ene.length>60)return;const s=i%2?1:-1;
  G.ene.push({id:G.sigId++,tipo:'mini',vida:1,bx:x,by:y,x:x+s*10,y,col:-1,est:'mini',fl:0,mv:{vx:s*(150+40*i),vy:250}});}
  G.ev.push({t:'divide',x,y});}

function moverTiros(G,soloSalir){
  const keep=[],sub=4,dy=1500*DT/sub;
  tiros:for(const s of G.tiros){
    for(let q=0;q<sub;q++){s.y-=dy;s.x+=(s.vx||0)*DT/sub;
      if(s.y<MUNDO.TOPE_Y-30||s.x<-10||s.x>730)continue tiros;
      if(soloSalir)continue;
      // v74: los tiros propios pasan por los refugios (con autodisparo, gastarlos solo era un castigo sin gracia)
      // nave de suministros
      if(G.sum&&solapa(s.x,s.y,6,18,G.sum.x,G.sum.y,56,24)){G.sum.vida--;G.sum.fl=.08;G.st.aciertos++;
        if(G.sum.vida<=0){sumarPuntos(G,150,G.sum.x,G.sum.y);G.st.suministros++;G.ev.push({t:'explota',x:G.sum.x,y:G.sum.y,k:'sum',grande:1});soltarPoder(G,G.sum.x,G.sum.y);G.sum=null;baja(G);}
        else G.ev.push({t:'golpe',x:s.x,y:s.y});
        continue tiros;}
      // jefe
      if(G.jefe&&!G.jefe.muerto&&G.fase==='juego'){const J=G.jefe;if(solapa(s.x,s.y,6,18,J.x,J.y,J.w*.9,J.h*.9)){golpeJefe(G,1,s.x,s.y);continue tiros;}}
      // meteoros
      for(const r of G.rocas){if(Math.abs(r.x-s.x)<r.r+3&&Math.abs(r.y-s.y)<r.r+9){r.vida--;G.st.aciertos++;
        if(r.vida<=0){r.y=2000;sumarPuntos(G,15,r.x,r.y);baja(G);G.ev.push({t:'roca',x:r.x,y:r.y,rota:1});gema(G,r.x,r.y,5);}else G.ev.push({t:'golpe',x:s.x,y:s.y});continue tiros;}}
      // enemigos
      for(const e of G.ene){if(e.est==='muerto'||e.est==='entra'&&e.en.t<0||e.est==='bandada'&&e.bd.t<0||s.h.includes(e.id))continue;const T=TIPOS[e.tipo];
        if(!solapa(s.x,s.y,10,18,e.x,e.y,T.w,T.h))continue;
        pegarEnemigo(G,e,1);s.h.push(e.id);continue tiros;}
    }
    keep.push(s);}
  G.tiros=keep;
}
function pegarEnemigo(G,e,d){e.vida-=d;e.fl=.08;G.st.aciertos++;
  if(e.vida>0){G.ev.push({t:'golpe',x:e.x,y:e.y,bli:1});return;}
  const tipo=e.tipo,atacando=e.est!=='form';e.est='muerto';G.st.bajas++;
  const base=TIPOS[tipo].pts*(atacando&&tipo!=='bon'?2:1);sumarPuntos(G,base,e.x,e.y);baja(G);
  G.ev.push({t:'explota',x:e.x,y:e.y,k:tipo,grande:tipo==='bli'||tipo==='div'||tipo==='kam'||atacando?1:0,at:atacando?1:0});
  if(tipo==='div')spawnMinis(G,e.x,e.y,2);
  gema(G,e.x,e.y,tipo==='bon'?10:5);
  // de vez en cuando, un poder (con una espera mínima entre uno y otro)
  if(G.R.poderes&&G.form.dropCd<=0&&tipo!=='bon'&&rngNext(G.rs.bot)<(DIFS[G.dif].drop||.06)){soltarPoder(G,e.x,e.y);G.form.dropCd=4;}
  if(tipo==='bon'){G.bonusK++;if(G.bonusK===G.iniciales){sumarPuntos(G,1500,360,420,false);G.st.perfectos++;G.ev.push({t:'perfecto'});}}}
function golpeJefe(G,d,x,y){const J=G.jefe;J.vida-=d;J.flash=.06;G.st.aciertos++;G.ev.push({t:'golpe',x,y,jefe:1});
  if(J.vida<=0&&!J.muerto){J.muerto=true;sumarPuntos(G,JEFES[J.tipo].pts,J.x,J.y,false);G.st[J.tipo]++;G.ev.push({t:'explotaJefe',x:J.x,y:J.y,k:J.tipo});G.hostiles=[];G.barr=[];G.ene.forEach(e=>e.est='muerto');
    for(let i=0;i<10;i++)gema(G,J.x+(i-4.5)*18,J.y+((i*37)%30),20);}}
// El láser: una columna que quema todo lo que tiene arriba (enemigos, jefe, piedras) cada 0,07 s; no gasta refugios.
function laser(G,N=G.nave){N.laserT-=DT;if(N.laserT>0)return;N.laserT=.07;G.st.disparos++;G.ev.push({t:'laser',x:N.x});
  for(const e of G.ene){if(e.est==='muerto'||e.est==='entra'&&e.en.t<0)continue;if(Math.abs(e.x-N.x)<TIPOS[e.tipo].w/2+10&&e.y<MUNDO.NAVE_Y)pegarEnemigo(G,e,1);}
  if(G.jefe&&!G.jefe.muerto&&G.fase==='juego'&&Math.abs(G.jefe.x-N.x)<G.jefe.w*.45)golpeJefe(G,1,N.x,G.jefe.y+G.jefe.h/2);
  if(G.sum&&Math.abs(G.sum.x-N.x)<30){G.sum.vida=0;sumarPuntos(G,150,G.sum.x,G.sum.y);G.st.suministros++;G.ev.push({t:'explota',x:G.sum.x,y:G.sum.y,k:'sum',grande:1});soltarPoder(G,G.sum.x,G.sum.y);G.sum=null;baja(G);}
  for(const r of G.rocas)if(Math.abs(r.x-N.x)<r.r+10&&r.y<MUNDO.NAVE_Y){r.vida=0;r.y=2000;sumarPuntos(G,15,r.x,r.y);baja(G);G.ev.push({t:'roca',x:r.x,y:r.y,rota:1});}
  G.hostiles=G.hostiles.filter(h=>!(Math.abs(h.x-N.x)<12&&h.y<MUNDO.NAVE_Y));
  if(G.ene.some(e=>e.est==='muerto'))G.ene=G.ene.filter(e=>e.est!=='muerto');}
function moverHostiles(G){
  const NS=navesDe(G).filter(N=>!N.caida),keep=[],k=ralento(G);
  hs:for(const h of G.hostiles){
    for(let q=0;q<2;q++){h.x+=h.vx*DT*k/2;h.y+=h.vy*DT*k/2;
      if(h.y>MUNDO.H+20||h.y<-40||h.x<-20||h.x>740)continue hs;
      for(const r of G.ref)if(pegarRefugio(r,h.x,h.y,8,16,1)){G.ev.push({t:'ref',x:h.x,y:h.y});continue hs;}
      for(const N of NS){
        if(solapa(h.x,h.y,8,14,N.x,MUNDO.NAVE_Y,28,18)){
          if(N.esc.act>0){G.st.escudosOk++;G.ev.push({t:'bloqueo',x:h.x,y:h.y});continue hs;}
          if(N.inv<=0&&!G.R.invul){danio(G,N);continue hs;}}
        // el escudo también ataja lo que pasa cerca (el contorno es más grande que la nave)
        if(N.esc.act>0&&Math.abs(h.x-N.x)<40&&Math.abs(h.y-MUNDO.NAVE_Y)<34){G.st.escudosOk++;G.ev.push({t:'bloqueo',x:h.x,y:h.y});continue hs;}}}
    keep.push(h);}
  let L=keep;for(const N of NS)if(N.limpia===G.t)L=L.filter(h=>Math.hypot(h.x-N.x,h.y-MUNDO.NAVE_Y)>=110);
  G.hostiles=L;
}
function danio(G,N=G.nave){if(N.inv>0||N.caida)return;
  N.vidas--;G.st.danio++;N.inv=1.6;N.limpia=G.t;N.pw.triple=0;N.pw.laser=0;cortaCombo(G);
  G.hostiles=G.hostiles.filter(h=>Math.hypot(h.x-N.x,h.y-MUNDO.NAVE_Y)>=110);
  G.ev.push({t:'danio',x:N.x,y:MUNDO.NAVE_Y,vidas:N.vidas,p:N.p});
  if(G.nave2&&N.vidas<=0){N.caida=true;N.resc=0;N.pw={};N.esc.act=0;G.ev.push({t:'caida',p:N.p,x:N.x});}}

/* ── Refugios ── */
function pegarRefugio(r,x,y,w,h,dir){
  const x0=refX0(r),y0=refY0(r);if(x+w/2<x0||x-w/2>x0+REF_C*REF_CEL||y+h/2<y0||y-h/2>y0+REF_F*REF_CEL)return false;
  const c0=Math.max(0,Math.floor((x-w/2-x0)/REF_CEL)),c1=Math.min(REF_C-1,Math.floor((x+w/2-x0)/REF_CEL));
  const f0=Math.max(0,Math.floor((y-h/2-y0)/REF_CEL)),f1=Math.min(REF_F-1,Math.floor((y+h/2-y0)/REF_CEL));
  // la primera celda en el sentido del viaje: subiendo, la de más abajo; bajando, la de más arriba
  const filas=[];for(let f=f0;f<=f1;f++)filas.push(f);if(dir<0)filas.reverse();
  for(const f of filas){const cs=[];for(let c=c0;c<=c1;c++)if(r.c[f*REF_C+c]>0)cs.push(c);
    if(cs.length){const c=cs.reduce((a,b)=>Math.abs(x0+(b+.5)*REF_CEL-x)<Math.abs(x0+(a+.5)*REF_CEL-x)?b:a);r.c[f*REF_C+c]--;return true;}}
  return false;}
function comerRefugio(r,x,y,w,h){const x0=refX0(r),y0=refY0(r);
  if(x+w/2<x0||x-w/2>x0+REF_C*REF_CEL||y+h/2<y0||y-h/2>y0+REF_F*REF_CEL)return;
  const c0=Math.max(0,Math.floor((x-w/2-x0)/REF_CEL)),c1=Math.min(REF_C-1,Math.floor((x+w/2-x0)/REF_CEL));
  const f0=Math.max(0,Math.floor((y-h/2-y0)/REF_CEL)),f1=Math.min(REF_F-1,Math.floor((y+h/2-y0)/REF_CEL));
  for(let f=f0;f<=f1;f++)for(let c=c0;c<=c1;c++)r.c[f*REF_C+c]=0;}
// Reparar: primero las celdas que faltan más abajo, de izquierda a derecha; si no faltan, se refuerzan las dañadas.
function repararRefugios(G,cant){const R=G.R;
  for(const r of G.ref){let n=cant;
    for(let f=REF_F-1;f>=0&&n>0;f--)for(let c=0;c<REF_C&&n>0;c++){const i=f*REF_C+c;if(REF_MASK[i]&&r.c[i]===0){r.c[i]=R.resRef;n--;}}
    for(let f=REF_F-1;f>=0&&n>0;f--)for(let c=0;c<REF_C&&n>0;c++){const i=f*REF_C+c;if(REF_MASK[i]&&r.c[i]>0&&r.c[i]<R.resRef){r.c[i]=R.resRef;n--;}}}}

/* ── Gemas: cada baja suelta una; juntarlas suma puntos (por la cadena) y la sostiene. Con el imán vienen solas. ── */
function gema(G,x,y,v){if(G.gemas.length>=40)return;G.gemas.push({x,y,v,vy:-90-((G.sigId*37)%60),t:0,id:G.sigId++});}
function moverGemas(G,auto){const NS=navesDe(G).filter(N=>!N.caida),keep=[];if(!NS.length)return;const IM=NS.find(N=>N.pw.iman>0);
  for(const g of G.gemas){g.t+=DT;const N=IM||(auto?(NS.length>1?masCerca(G,g.x):NS[0]):null);
    if(N){const dx=N.x-g.x,dy=MUNDO.NAVE_Y-g.y,l=Math.hypot(dx,dy)||1,v=Math.min(1100,300+g.t*900);g.x+=dx/l*v*DT;g.y+=dy/l*v*DT;}
    else{g.vy=Math.min(260,g.vy+600*DT);g.y+=g.vy*DT;}
    if(NS.some(N=>Math.abs(g.x-N.x)<34&&Math.abs(g.y-MUNDO.NAVE_Y)<30)){sumarPuntos(G,g.v,g.x,g.y);G.st.gemas++;G.combo.t=Math.max(0,G.combo.t-.5);G.ev.push({t:'gema',x:g.x,y:g.y,v:g.v});continue;}
    if(g.y>MUNDO.H+20||g.t>7)continue;keep.push(g);}
  G.gemas=keep;}

/* ── Poderes ── */
function soltarPoder(G,x,y){if(!G.R.poderes)return;
  if(!G.bolsa.length){const b=PODER_IDS.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(rngNext(G.bolsaS)*(i+1));[b[i],b[j]]=[b[j],b[i]];}G.bolsa=b;}
  const tipo=G.bolsa.shift();if(G.poderes.length<4)G.poderes.push({x:Math.max(30,Math.min(690,x)),y,tipo,t:7});}
function moverPoderes(G,auto){const NS=navesDe(G).filter(N=>!N.caida),keep=[];if(!NS.length)return;const IM=NS.find(N=>N.pw.iman>0);
  for(const p of G.poderes){p.t-=DT;
    if(IM){const N=IM,dx=N.x-p.x,dy=MUNDO.NAVE_Y-p.y,l=Math.hypot(dx,dy)||1;p.x+=dx/l*500*DT;p.y+=dy/l*500*DT;}else p.y+=170*DT;
    const N=auto?(NS.length>1?masCerca(G,p.x):NS[0]):NS.find(N=>solapa(p.x,p.y,36,36,N.x,MUNDO.NAVE_Y,48,30));
    if(N){aplicarPoder(G,p.tipo,N);continue;}
    if(p.t>0&&p.y<MUNDO.H+20)keep.push(p);}
  G.poderes=keep;}
function aplicarPoder(G,t,N=G.nave){G.st.poderes++;G.ev.push({t:'poder',tipo:t,x:N.x,p:N.p});
  if(t==='bomba'){// limpia los tiros, rompe las piedras y barre la fila de abajo de la formación (al jefe le saca 8 %)
    G.hostiles=[];G.barr=[];for(const r of G.rocas){sumarPuntos(G,15,r.x,r.y);G.ev.push({t:'roca',x:r.x,y:r.y,rota:1});}G.rocas=[];
    const E=G.ene.filter(e=>e.est!=='muerto'&&!(e.est==='entra'&&e.en.t<0));
    if(E.length){const yMax=Math.max(...E.map(e=>e.est==='form'?e.by:1e4));
      for(const e of E)if(e.est!=='form'||e.by===yMax){e.vida=1;pegarEnemigo(G,e,1);}}
    if(G.jefe&&!G.jefe.muerto&&G.fase==='juego')golpeJefe(G,Math.ceil(G.jefe.max*.08),G.jefe.x,G.jefe.y);
    G.ene=G.ene.filter(e=>e.est!=='muerto');G.ev.push({t:'bomba'});}
  else if(t==='escudo'){N.esc.act=Math.max(N.esc.act,PODERES.escudo.dur);}
  else N.pw[t]=PODERES[t].dur;}

/* ── Fin de oleada, de partida ── */
function olaCompleta(G,sinPts){
  if(G.fase==='transicion')return;
  const jefe=!!G.jefe,bonus=!!G.def.bonus;
  if(!sinPts){G.olaN++;G.st.oleadas++;if(!bonus)sumarPuntos(G,100,360,480,false);if(jefe)sumarPuntos(G,500,360,520,false);}
  G.ev.push({t:'olaCompleta',i:G.ola,jefe,bonus,sinPts:sinPts?1:0});
  if(G.nave2)for(const N of navesDe(G))if(N.caida)revivir(G,N);   // de a dos: el caído vuelve con una vida
  // cada 3 oleadas completas se repara el 20 % de cada refugio
  if(!sinPts&&G.R.reparar&&G.olaN%G.R.reparar===0&&G.ref.length)repararRefugios(G,Math.round(REF_TOTAL*.2));
  if(!hayMasOlas(G,G.ola+1)){
    if(G.modo==='arcade'){sumarPuntos(G,500*G.nave.vidas,360,560,false);}
    terminar(G,'victoria','objetivo');return;}
  G.fase='transicion';G.faseT=1.1;G.hostiles=[];G.barr=[];G.sum=null;G.rocas=[];
}
function siguienteOla(G){moverPoderes(G,true);moverGemas(G,true);G.tiros=[];cargarOla(G,G.ola+1);}
function terminar(G,res,motivo){if(G.fin)return;
  const segs=Object.keys(G.st.actT).length;G.st.actSeg=segs;
  G.fin={res,motivo,puntos:G.puntos,olas:G.olaN,vidas:navesDe(G).reduce((a,N)=>a+Math.max(0,N.vidas),0),danio:G.st.danio,seg:Math.round(G.seg),act:segs};
  G.fase='fin';G.ev.push({t:'fin',res});}

/* ── Comparar resultados (duelo y tablas): mayor puntaje; después más oleadas, más vidas, menos daño ── */
function comparar(a,b){return (b.puntos-a.puntos)||(b.olas-a.olas)||(b.vidas-a.vidas)||(a.danio-b.danio);}
// ¿La partida fue «de verdad»? (para premios): 60 s activos, 90 s de combate y 2 oleadas, o ganar
function elegible(G){const F=G.fin||{};if(!G.oficial)return false;if(F.res==='victoria')return true;return (F.act||0)>=60&&G.seg>=90&&G.olaN>=2;}
function semillaDia(dia){return hash32('invasorar-dia:'+dia);}

/* ── Hojas, carteles y menú lateral ── */

/* ───────── InvasorAR · el dibujo (v74: neón y «juice») ─────────
   Canvas 2D con arte de píxeles propio, dibujado acá (sin imágenes que bajar). v74: colores vivos con brillo (cada
   sprite se pre-dibuja una vez con su resplandor), fondo de estrellas en tres capas que corren (más rápido cuanto más
   alta la cadena), los invasores estallan en sus propios píxeles, temblor de pantalla y destellos en lo grande, puntos que
   saltan, cartel grande de cada oleada. Todo con tope (partículas en un pozo fijo) para que ande a 60 en el celular.
   Las apariencias (nave, tiros, fondo) sólo cambian el dibujo: el golpe y el tiro son siempre los mismos. */
const CV=$('campo'),CX=CV.getContext('2d',{alpha:false});

// Ajusta el lienzo al lugar que le toca, manteniendo 3 a 4 y centrado.
// v80 (pedido del 26/10: «que ocupe más pantalla en el celular, queda mucho aire abajo»): si el lugar es más alto que
// 3 a 4 (celular parado), el lienzo crece para llenarlo, SIN tocar el juego: el campo de 720×960 es el mismo para todos
// (mismas distancias y tiempos, los récords y los cruces siguen parejos). Lo que sobra va arriba como cielo, donde
// queda el marcador (EXT_T), y una franja de suelo abajo para el escudo flotante (EXT_B), en unidades del mundo.
let EXT_T=0,EXT_B=0;
function medirCampo(){
  const box=$('campo-box');if(!box)return;const r=box.getBoundingClientRect();
  DPR=Math.min(1.5,window.devicePixelRatio||1);   // v74: el arte es de píxeles: más resolución sólo cuesta cuadros
  const cs=getComputedStyle(box),px=k=>parseFloat(cs[k])||0;   // sin el relleno de la caja (si no, se pasa unos píxeles a la derecha)
  const w=Math.max(120,r.width-px('paddingLeft')-px('paddingRight')),h=Math.max(160,r.height-px('paddingTop')-px('paddingBottom')),s=Math.min(w/MUNDO.W,h/MUNDO.H);
  const sobra=Math.min(MUNDO.H*.75,Math.max(0,Math.floor(h/s-MUNDO.H-2)));   // en unidades del mundo
  const flota=document.body.classList.contains('tactil')&&document.body.classList.contains('c-deslizar');

function olaTexto(G){const d=G.def;if(!d||d.jefe)return '';if(d.bonus)return '¡Bajá todos los dorados en 10 segundos!';const c=d.comp,p=[];

/* ───────── InvasorAR · la partida y las pantallas ─────────
   Portada con los modos, preparación, el bucle (paso fijo de 1/60 s, dibujo a lo que dé la pantalla), pausa con cuenta,
   resultado con premios (XP, oro, un poquito de pesos, leguas), récords, el desafío del día, el tutorial y el taller. */
let G=null,EST='menu',DEMO=null,ULT=0,ACC=0,GUARD_T=0,CUENTA_T=0,ESCENA='',HITSTOP=0;
function congelar(ms){if(AJ.reducir||(G&&(G.modo==='duelo'||G._online||G._espejo)))return;HITSTOP=Math.max(HITSTOP,ms/1000);}
const SAVE='invasores-partida-v1',REC_K='invasores-records',DIA_K='invasores-dia',CFG_K='invasores-cfg',TALLER_K='invasores-taller',HIS_K='invasores-historia';
// v77: el progreso de la Historia: {max: el último nivel superado, '<n>': estrellas de ese nivel (1 a 3)} (se sincroniza con «max»)
function historia(){const H=ls.json(HIS_K,{});return H&&typeof H==='object'?H:{};}
function hisMax(){return Math.max(0,Math.min(HISTORIA_N,Number(historia().max)||0));}
function hisEstrellas(n){return Number(historia()[n])||0;}
function hisAnotar(n,est){const H=historia(),antes=Number(H[n])||0;H[n]=Math.max(antes,est);H.max=Math.max(Number(H.max)||0,n);ls.set(HIS_K,JSON.stringify(H));return {antes,nuevo:est>antes};}
const estrellasDe=F=>F.res!=='victoria'?0:F.danio===0?3:F.danio<=1?2:1;
