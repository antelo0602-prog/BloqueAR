function pixAncho(txt,p){return Math.max(0,String(txt).length*6*p-p);}
// Dibuja texto de píxeles. p = tamaño del píxel; al = 'izq' | 'centro' | 'der'
function pix(g,txt,x,y,p,col,al){txt=String(txt).toUpperCase();const w=pixAncho(txt,p);if(al==='centro')x-=w/2;else if(al==='der')x-=w;
  g.fillStyle=col;x=Math.round(x);y=Math.round(y);
  for(let k=0;k<txt.length;k++){let ch=txt[k];const ac=ACENTO[ch];if(ac)ch=ac;const f=FONT[ch]||FONT['?'],ox=x+k*6*p;
    for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(f[r*5+c]==='1')g.fillRect(ox+c*p,y+r*p,p,p);
    if(ac){if(txt[k]==='Ñ'){g.fillRect(ox+p,y-2*p,p,p);g.fillRect(ox+2*p,y-3*p,p,p);g.fillRect(ox+3*p,y-2*p,p,p);}else{g.fillRect(ox+2*p,y-2*p,p,p);g.fillRect(ox+3*p,y-3*p,p,p);}}}}

/* ── Sonido: chiptune propio, todo sintetizado ── */
const AUD={k:null,n:null,alt:false,tSem:0};
function tono(f1,f2,d,v,tipo='square',t0=0){const a=actx();if(!a||!SND)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=tipo;
  o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.setValueAtTime(v,t+d*.75);g.gain.linearRampToValueAtTime(0,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
Object.assign(SX,{
  waka(){AUD.alt=!AUD.alt;AUD.alt?tono(560,240,.075,.035):tono(240,560,.075,.035);},
  mate(){tono(220,880,.22,.04,'square');tono(330,1320,.22,.02,'triangle',.02);},
  captura(){[0,1,2,3].forEach(i=>tono(300+i*220,520+i*260,.06,.04,'sawtooth',i*.05));tono(1600,700,.12,.03,'square',.2);},
  muere(){tono(900,120,1.1,.045,'sawtooth');[0,1,2,3,4,5].forEach(i=>tono(700-i*90,640-i*90,.07,.025,'square',i*.15));},
  limpio(){[523,659,784,1046,784,1046].forEach((f,i)=>tono(f,f,.11,.04,'square',i*.1));},
  bonus(){tono(880,1760,.08,.04);tono(1320,1980,.14,.035,'square',.08);},
  vida(){[784,988,1175,1568,1175,1568].forEach((f,i)=>tono(f,f,.09,.035,'square',i*.08));},

  arranque(){const N=[523,659,784,659,880,784,659,523,587,698,880,1046];N.forEach((f,i)=>{tono(f,f,.11,.035,'square',i*.13);tono(f/2,f/2,.11,.025,'triangle',i*.13);});},

});
// Los sonidos que siguen sonando: sirena (más aguda cuanto menos semillas quedan), fuga (asustados) y ojos que vuelven
function bucleSonido(k,prog){const a=AC;
  if(!SND||!a||a.state!=='running'||document.hidden)k=null;
  if(AUD.k===k){if(k==='sirena'&&AUD.n){const f=320+260*prog,r=1.5+1.8*prog;AUD.n.o.frequency.setTargetAtTime(f,a.currentTime,.3);AUD.n.l.frequency.setTargetAtTime(r,a.currentTime,.3);}return;}
  if(AUD.n){const n=AUD.n;try{n.g.gain.setTargetAtTime(0,a.currentTime,.03);setTimeout(()=>{try{n.o.stop();n.l.stop();n.o.disconnect();n.l.disconnect();n.g.disconnect();}catch(_){}},150);}catch(_){}AUD.n=null;}
  AUD.k=k;if(!k)return;
  try{const o=a.createOscillator(),l=a.createOscillator(),lg=a.createGain(),f=a.createBiquadFilter(),g=a.createGain();
    const P={sirena:['triangle',320+260*prog,'triangle',1.5+1.8*prog,90,1800,.05],fuga:['square',170,'square',7.5,60,900,.022],ojos:['sawtooth',1150,'triangle',12,380,2600,.014]}[k];
    o.type=P[0];o.frequency.value=P[1];l.type=P[2];l.frequency.value=P[3];lg.gain.value=P[4];f.type='lowpass';f.frequency.value=P[5];
    l.connect(lg).connect(o.frequency);o.connect(f).connect(g).connect(a.destination);g.gain.value=0;g.gain.setTargetAtTime(P[6],a.currentTime,.04);
    o.start();l.start();AUD.n={o,l,g};}catch(_){AUD.n=null;}}

function acomodar(){
  const vp=$('vp');if(!vp)return;const w=vp.clientWidth,h=vp.clientHeight;if(!w||!h)return;
  const S=G.S||G.D,W=S?S.M.W:23,H=S?S.M.H:27;
  // Dos formas: el puntaje arriba y las vidas abajo (parado), o todo en una columna al costado (acostado, compu): la que
  // deja el laberinto más grande
  // v75: medio píxel de resolución (en vez de píxel entero): en el celular parado el ancho manda y así el tablero gana ~4 %
  const q=v=>Math.floor(v*2)/2,cA=q(Math.min((w-2)/W,(h-4)/(H+HUD_T+HUD_B))),cB=q(Math.min((w-2)/(W+LADO),(h-4)/H));
  G.lado=cB>cA;G.cell=Math.max(8,G.lado?cB:cA);G.dpr=Math.min(3,window.devicePixelRatio||1);
  G.mx=G.lado?LADO:0;G.my=G.lado?0:HUD_T;
  const bw=Math.round(G.cell*(G.lado?W+LADO:W)),bh=Math.round(G.cell*(G.lado?H:H+HUD_T+HUD_B));
  cv.style.left=Math.floor((w-bw)/2)+'px';cv.style.top=Math.floor((h-bh)/2)+'px';cv.style.width=bw+'px';cv.style.height=bh+'px';
  cv.width=Math.round(bw*G.dpr);cv.height=Math.round(bh*G.dpr);G.murosK='';G.hudK='';
  // el botón de pausa: afuera del tablero si sobra lugar al costado (compu, acostado); si no, arriba a la derecha
  const hb=$('hud'),afuera=!G.lado&&(w-bw)/2>=54;G.pausaAfuera=afuera;
  if(hb){hb.style.left=Math.floor((w-bw)/2)+'px';hb.style.width=(G.lado?Math.round(G.cell*(LADO-.3)):bw+(afuera?52:0))+'px';hb.style.top=Math.floor((h-bh)/2)+'px';hb.style.setProperty('--hud-h',Math.max(30,Math.round(G.cell*HUD_T))+'px');}
  dibujar(1);
}

/* ── Paredes de neón: se calculan una vez por mapa/tema/tamaño ──
   Máscara de paredes → desenfoque (tres pasadas de caja) → dos líneas a distinta profundidad (la de afuera en todas las
   paredes, la de adentro sólo en las gruesas y en el borde: por eso el borde queda con doble línea, como las maquinitas)
   → un brillo alrededor. Las esquinas salen redondeadas solas. */
function cajaBlur(src,w,h,r,out,tmp){const d=2*r+1;
  for(let y=0;y<h;y++){const o=y*w;let acc=0;for(let k=-r;k<=r;k++)acc+=src[o+(k<0?0:k>=w?w-1:k)];
    for(let x=0;x<w;x++){tmp[o+x]=acc/d;const a=x+r+1,b=x-r;acc+=src[o+(a>=w?w-1:a)]-src[o+(b<0?0:b)];}}
  for(let x=0;x<w;x++){let acc=0;for(let k=-r;k<=r;k++)acc+=tmp[(k<0?0:k>=h?h-1:k)*w+x];
    for(let y=0;y<h;y++){out[y*w+x]=acc/d;const a=y+r+1,b=y-r;acc+=tmp[(a>=h?h-1:a)*w+x]-tmp[(b<0?0:b)*w+x];}}}
function blur3(a,w,h,r){const t=new Float32Array(w*h),b=new Float32Array(w*h);cajaBlur(a,w,h,r,b,t);cajaBlur(b,w,h,r,a,t);cajaBlur(a,w,h,r,b,t);return b;}
function construirMuros(M,cell,dprMax,tema){
  const q=Math.min(dprMax,2),s=cell*q,w=Math.round(M.W*s),h=Math.round(M.H*s);
  const m=new Float32Array(w*h);
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++)if(M.t[y*M.W+x]==='#'){const x0=Math.round(x*s),x1=Math.round((x+1)*s),y0=Math.round(y*s),y1=Math.round((y+1)*s);
    for(let yy=y0;yy<y1;yy++)m.fill(1,yy*w+x0,yy*w+x1);}
  const r=Math.max(1,Math.round(s*.17));const v=blur3(m,w,h,r);
  const L=new Float32Array(w*h);
  const band=(x,c,ww)=>{const d=Math.abs(x-c)/ww;return d>=1?0:1-d*d;};
  for(let i=0;i<w*h;i++){const a=v[i];L[i]=Math.max(band(a,.69,.075),band(a,.972,.012));}
  const gl=blur3(Float32Array.from(L),w,h,Math.max(1,Math.round(s*.09)));
  const mk=(col,core,fill)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d'),id=g.createImageData(w,h),d=id.data;
    for(let i=0;i<w*h;i++){const a=v[i],l=L[i],gg=Math.min(1,gl[i]*1.6),o=i*4;let R=0,Gc=0,B=0,A=0;
      if(a>.69){R=fill[0];Gc=fill[1];B=fill[2];A=255;}
      if(gg>0){const al=gg*.55;R=R*(1-al)+col[0]*al;Gc=Gc*(1-al)+col[1]*al;B=B*(1-al)+col[2]*al;A=Math.max(A,al*255);}
      if(l>0){const k=l>.7?(l-.7)/.3*.6:0,cr=col[0]+(core[0]-col[0])*k,cg=col[1]+(core[1]-col[1])*k,cb=col[2]+(core[2]-col[2])*k;R=R*(1-l)+cr*l;Gc=Gc*(1-l)+cg*l;B=B*(1-l)+cb*l;A=Math.max(A,l*255);}
      d[o]=R;d[o+1]=Gc;d[o+2]=B;d[o+3]=A;}
    g.putImageData(id,0,0);
    // puerta del corral
    if(M.puerta){const [px,py]=M.puerta;g.fillStyle='#ffb8de';g.fillRect(px*s-s*.1,py*s+s*.38,s*1.2,s*.22);}
    return c;};
  return {s,q,n:mk(tema.pared,tema.brillo,tema.relleno),f:mk([255,255,255],[255,255,255],tema.relleno)};
}
function muros(S){const M=S.M,tm=apar('tema'),tema=TEMAS[tm]||TEMAS.campo,k=S.mapaIdx+'|'+tm+'|'+G.cell+'|'+G.dpr;
  if(G.murosK===k&&G.muros)return G.muros;const m=construirMuros(M,G.cell,G.dpr,tema);
  // se arma a 2× como mucho (es caro), pero se escala una sola vez al tamaño real de la pantalla: así cada cuadro copia
  // la imagen tal cual en vez de reescalarla (en un iPhone de 3× eso era lo más pesado del dibujo)
  const ancho=Math.round(M.W*G.cell*G.dpr),alto=Math.round(M.H*G.cell*G.dpr);
  if(m.n.width!==ancho)for(const q of ['n','f']){const c=document.createElement('canvas');c.width=ancho;c.height=alto;const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(m[q],0,0,ancho,alto);m[q]=c;}
  G.muros=m;G.murosK=k;return m;}

/* ── Dibujo ── */
function lerpPos(a,b,t){let dx=b[0]-a[0];if(Math.abs(dx)>2*LAB.U)return b;return [a[0]+dx*t,a[1]+(b[1]-a[1])*t];}
function dibujar(alpha){

  const txt=!S?'':`${S.cfg.modo==='dia'?'Del día':S.cfg.modo==='campana'?'Etapa '+(G.op.etapa+1):libre?(S.cfg.modo==='practica'?'Práctica':'Reglas libres')+' · sin premios':DIFN[S.cfg.dif]} · ${fmt(S.puntos)} puntos · ${S.vidas} ${S.vidas===1?'vida':'vidas'} · nivel ${S.nivel}`;
  el.innerHTML=`<span class="sr" aria-live="polite">${esc(txt)}</span>${S&&!G.fin?'<button class="pausa" id="b-pausa" aria-label="Pausa">❚❚</button>':''}`;
  if($('b-pausa'))$('b-pausa').onclick=()=>pausar(true);}
let HUDK='';function hudSiCambia(){const S=G.S;const k=S?[S.puntos,S.nivel,S.vidas,S.estado,G.fin].join('|'):'-';if(k!==HUDK){HUDK=k;hud();}}

/* ── Bucle ── */
function bucle(ts){G.raf=requestAnimationFrame(bucle);
  if(!G.last)G.last=ts;let dt=Math.min(250,ts-G.last);G.last=ts;
  const PASO=1000/LAB.FPS;
  if(G.S){
    if(!G.pausa&&!G.fin){G.acc+=dt;let n=0;
      while(G.acc>=PASO&&n<8){G.acc-=PASO;n++;pasoUno();if(G.fin||G.pausa)break;}
      if(G.acc>PASO*8)G.acc=0;}
    const S=G.S;let k=null;if(!G.pausa&&!G.fin&&S.estado==='juega'){k=S.enem.some(e=>e.st==='vuelve'||e.st==='entra')?'ojos':S.mateT>0?'fuga':'sirena';}
    bucleSonido(k,S?1-S.quedan/Math.max(1,S.total):0);
    dibujar(G.pausa||G.fin?1:Math.min(1,G.acc/PASO));hudSiCambia();
  }else{
    bucleSonido(null);
    if(G.D){G.acc+=dt;let n=0;while(G.acc>=PASO&&n<4){G.acc-=PASO;n++;const D=G.D;LAB.paso(D,LAB.auto(D));if(D.estado==='fin'){nuevaDemo();break;}}if(G.acc>PASO*4)G.acc=0;}
    dibujar(1);
  }
}
function nuevaDemo(){G.D=LAB.crear({modo:'demo',dif:'normal',mapas:[Math.floor(Math.random()*NM)],niveles:1,vidas:1,semilla:(Math.random()*1e9)>>>0,extra:0},MAPAS);G.D.estado='juega';G.D.t=0;acomodar();}
function pasoUno(){const S=G.S;G.prev={j:[S.jug.px,S.jug.py],e:S.enem.map(e=>[e.px,e.py])};
  const d=G.once>=0?G.once:G.held;G.once=-1;LAB.paso(S,d);
  for(const e of S.ev)evento(e);
  if((G.guardT=(G.guardT||0)+1)%120===0)guardar();
}
function evento(e){const S=G.S,ahora=performance.now();
  if(e.tipo==='semilla'){if(ahora-AUD.tSem>55){AUD.tSem=ahora;sfx('waka');}}
  else if(e.tipo==='mate'){sfx('mate');G.mateMax=S.mateT||1;G.shake=ahora;vibrar(18);}
  else if(e.tipo==='captura'){sfx('captura');G.flot.push({x:e.x,y:e.y,txt:String(e.pts),t:ahora,dur:700,col:'#2ef0ea'});vibrar(25);}
  else if(e.tipo==='bonus'){sfx('bonus');G.flot.push({x:e.x,y:e.y,txt:String(e.pts),t:ahora,dur:1100,col:'#ffb8de'});}
  else if(e.tipo==='muere'){bucleSonido(null);sfx('muere');vibrar(70);}
  else if(e.tipo==='limpio'){bucleSonido(null);sfx('limpio');}
  else if(e.tipo==='vida'){sfx('vida');G.vidaT=ahora;}
  else if(e.tipo==='nivel_nuevo'){G.murosK='';}
  else if(e.tipo==='fin'){G.fin=true;bucleSonido(null);setTimeout(terminar,e.como==='gano'?900:1300);}}
function vibrar(ms){if(PREF.vibrar===false)return;try{navigator.vibrate&&navigator.vibrate(ms);}catch(_){}}

/* ── Controles ── */
const TECLAS={ArrowUp:0,KeyW:0,ArrowLeft:1,KeyA:1,ArrowDown:2,KeyS:2,ArrowRight:3,KeyD:3};
const PULS=[];
addEventListener('keydown',e=>{if($('modal').hidden===false||!$('side').hidden)return;
  if(e.code==='Escape'||e.code==='KeyP'){if(juegoActivo()){e.preventDefault();pausar(!G.pausa);}return;}
  if(e.code==='Enter'&&G.pausa&&juegoActivo()&&!$('over').hidden&&$('p-seguir')){e.preventDefault();$('p-seguir').click();return;}
  const d=TECLAS[e.code];if(d==null||!G.S)return;e.preventDefault();
  if(!PULS.includes(d))PULS.push(d);G.held=d;G.once=d;});
addEventListener('keyup',e=>{const d=TECLAS[e.code];if(d==null)return;const i=PULS.indexOf(d);if(i>=0)PULS.splice(i,1);G.held=PULS.length?PULS[PULS.length-1]:-1;});
addEventListener('blur',()=>{PULS.length=0;G.held=-1;if(juegoActivo()&&!G.pausa)pausar(true);});
// Cruceta: toda la zona de abajo responde (no hace falta acertarle al botón): la dirección sale del ángulo respecto del
// centro de la cruceta, con un centro neutro chico. Mantener o tocar una vez dan la misma orden.
(function(){const pad=$('pad'),zona=$('ctrl');let id=null;
  const dirDe=(ev)=>{const r=pad.getBoundingClientRect(),x=ev.clientX-(r.left+r.width/2),y=ev.clientY-(r.top+r.height/2),R=r.width/2;
    if(Math.hypot(x,y)<R*.15)return -1;return Math.abs(x)>Math.abs(y)?(x<0?1:3):(y<0?0:2);};
  const marca=d=>{pad.querySelectorAll('b').forEach(b=>b.classList.toggle('on',Number(b.dataset.d)===d));};
  zona.addEventListener('pointerdown',ev=>{if(PREF.ctrl==='swipe'||ev.target.closest('button,a'))return;ev.preventDefault();if(id!==null)return;id=ev.pointerId;try{zona.setPointerCapture(id);}catch(_){}
    const d=dirDe(ev);G.held=d;if(d>=0)G.once=d;marca(d);actx();});
  zona.addEventListener('pointermove',ev=>{if(ev.pointerId!==id)return;const d=dirDe(ev);if(d!==G.held){G.held=d;if(d>=0)G.once=d;marca(d);}});
  const suelta=ev=>{if(ev.pointerId!==id)return;id=null;G.held=-1;marca(-1);};
  zona.addEventListener('pointerup',suelta);zona.addEventListener('pointercancel',suelta);zona.addEventListener('lostpointercapture',suelta);})();
// Deslizar (lo de siempre en el celular desde v75): en cualquier lugar de la pantalla de juego (tablero incluido); la
// orden sale apenas el dedo se mueve un poco y se puede seguir deslizando sin levantarlo (cada cambio de dirección es
// un giro nuevo). Tocar sin deslizar no hace nada; un segundo dedo no cambia nada. Sin scroll ni zoom de la página.
(function(){let id=null,x0=0,y0=0,ult=-1;const z=$('app');
  const enJuego=ev=>PREF.ctrl==='swipe'&&!ev.target.closest('button,a,input,.top');
  z.addEventListener('pointerdown',ev=>{if(!enJuego(ev))return;if(id!==null)return;id=ev.pointerId;x0=ev.clientX;y0=ev.clientY;ult=-1;actx();});
  z.addEventListener('pointermove',ev=>{if(ev.pointerId!==id)return;const dx=ev.clientX-x0,dy=ev.clientY-y0,ax=Math.abs(dx),ay=Math.abs(dy),u=PREF.umbral||14;
    if(Math.max(ax,ay)<u)return;const r=Math.max(ax,ay)/Math.max(1,Math.min(ax,ay));if(r<1.25&&Math.max(ax,ay)<u*1.8)return;
    const d=ax>ay?(dx<0?1:3):(dy<0?0:2);G.once=d;if(d!==ult){ult=d;ayudaDesliz(false);}x0=ev.clientX;y0=ev.clientY;});
  const fin=ev=>{if(ev.pointerId===id)id=null;};z.addEventListener('pointerup',fin);z.addEventListener('pointercancel',fin);
  // iOS Safari: que deslizar no mueva la página ni haga zoom de dos dedos
  z.addEventListener('touchmove',e=>{if(PREF.ctrl==='swipe'&&!e.target.closest('.sheet,.side-panel,.menu-list'))e.preventDefault();},{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
})();
// La primera vez (y las 3 primeras partidas): un aviso chico «Deslizá el dedo» que se va solo o al primer giro.
function ayudaDesliz(mostrar){let el=$('desliz');if(!mostrar){if(el)el.classList.remove('on');return;}
  if(PREF.ctrl!=='swipe'||esPC)return;const n=Number(ls.get('laberinto-desliz')||0);if(n>=3)return;ls.set('laberinto-desliz',String(n+1));
  if(!el){el=document.createElement('div');el.id='desliz';el.className='desliz';el.innerHTML='<b>👆</b> Deslizá el dedo hacia donde querés ir';$('vp').appendChild(el);}
  el.classList.add('on');clearTimeout(ayudaDesliz.t);ayudaDesliz.t=setTimeout(()=>el.classList.remove('on'),3200);}
function aplicarCtrl(){$('ctrl').classList.toggle('swipe',PREF.ctrl==='swipe');document.body.classList.toggle('zurdo',!!PREF.zurdo);
  $('info').textContent=PREF.ctrl==='swipe'?'Deslizá el dedo hacia donde querés ir.':'Tocá o mantené: sigue solo hasta la pared. Doblá antes de la esquina.';
  // v75: con deslizar, en el celular no hay barra de controles (el tablero usa todo el alto); en la compu sigue el teclado
  if(esPC)document.body.classList.add('pc');document.body.classList.toggle('desliza',PREF.ctrl==='swipe'&&!esPC);
  requestAnimationFrame(acomodar);}

/* ── Pausa, continuidad ── */
function pausar(si){const S=G.S;if(!S||G.fin)return;G.pausa=si;G.held=-1;PULS.length=0;
  if(si){bucleSonido(null);guardar();const libre=S.cfg.libre||S.cfg.modo==='practica';
    over(`<div class="ic">⏸️</div><h3>En pausa</h3><p>${esc(S.M.n)} · ${S.cfg.modo==='rapida'?'nivel '+S.nivel+' · ':''}${fmt(S.puntos)} puntos</p>
      <button class="btn go" id="p-seguir">Continuar</button>
      <div class="row"><button class="btn" id="p-ctrl">Controles</button><button class="btn" id="p-son">${SND?'🔊 Sonido':'🔇 Sin sonido'}</button></div>
      <div class="row"><button class="btn" id="p-reini">Reiniciar</button><button class="btn" id="p-salir">Salir</button></div>
      <p class="cap">${libre?'Esta partida no da premios.':'Reiniciar o salir termina este intento (lo que ya jugaste no se pierde: cuenta para el récord si vale).'}</p>`);
    $('p-seguir').onclick=()=>{hideOver();G.pausa=false;G.last=0;actx();};
    $('p-ctrl').onclick=()=>ajustes(true);
    $('p-son').onclick=()=>{SND=!SND;ls.set(JUEGO.id+'-sonido',SND?'1':'0');$('p-son').textContent=SND?'🔊 Sonido':'🔇 Sin sonido';};
    $('p-reini').onclick=()=>{cerrarIntento(true);iniciar(G.op);};
    $('p-salir').onclick=()=>{cerrarIntento(true);inicio();};
  }}
// Cerrar un intento a mano: si ya valía, cuenta (como «se terminó»); si no, se descarta sin premio
function cerrarIntento(){const S=G.S;if(!S||G.fin)return;if(!['practica'].includes(S.cfg.modo)&&!S.cfg.libre){S.estado='fin';S.fin='salio';premiar(true);}
  ls.set('laberinto-partida-v1',null);G.S=null;G.fin=true;}
function guardar(){const S=G.S;if(!S||G.fin||S.estado==='fin')return;
  try{const o={v:2,op:G.op,run:G.run,S:{...S,M:undefined,mapasDef:undefined,obj:Array.from(S.obj),ev:[],_dc:undefined,_ad:undefined},t:Date.now()};ls.set('laberinto-partida-v1',JSON.stringify(o));}catch(_){}}
function recuperar(){const o=ls.json('laberinto-partida-v1',null);if(!o||!o.S||!o.op)return false;
  // más de dos horas, o una partida de los mapas viejos (antes de la v74): ya no se recupera
  if(Date.now()-o.t>2*3600e3||o.v!==2||!MAPAS[o.S.mapaIdx]){ls.set('laberinto-partida-v1',null);return false;}
  const S=o.S;S.mapasDef=MAPAS;S.M=LAB.leer(MAPAS[S.mapaIdx]);S.obj=Uint8Array.from(S.obj);S.ev=[];
  G.S=S;G.D=null;G.op=o.op;G.run=o.run;G.fin=false;G.prev=null;G.objMostrar=!!o.op.objetivos;G.mateMax=S.v.mate||1;acomodar();HUDK='';hud();pausar(true);return true;}
document.addEventListener('visibilitychange',()=>{if(document.hidden){bucleSonido(null);if(juegoActivo()&&!G.pausa)pausar(true);else guardar();}});
addEventListener('pagehide',guardar);
// v77 · SEGUIR DONDE LA DEJASTE: si de tu cuenta llega la partida que dejaste en pausa en otro dispositivo y acá no estás jugando, se sigue ésa (en pausa).
addEventListener('bloques-sync',e=>{const k=(e.detail&&e.detail.claves)||[];if(!k.includes('laberinto-partida-v1'))return;
  if(G.S&&!G.fin&&G.S.estado!=='fin')return;
  if(recuperar()){try{$('modal').hidden=true;}catch(_){}try{toast('Seguís la partida del laberinto que dejaste en tu otro dispositivo.');}catch(_){}}});
addEventListener('orientationchange',()=>{if(juegoActivo()&&!G.pausa)pausar(true);setTimeout(acomodar,300);});

/* ── Empezar ── */
function iniciar(op){
  G.op=op;G.run=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const base={modo:op.modo,dif:op.dif||'normal'};
  if(op.modo==='rapida')Object.assign(base,{mapas:M_RAPIDA,niveles:10,semilla:LAB.hash(G.run),limite:20*60});
  else if(op.modo==='dia'){const D=LAB.delDia(diaAR(),NM);Object.assign(base,{dif:'normal',mapas:[D.mapa],niveles:1,vidas:1,semilla:D.semilla,limite:5*60});op.fecha=diaAR();}
  else if(op.modo==='campana'){const E=ETAPAS[op.etapa];Object.assign(base,{dif:'normal',mapas:[E.m],niveles:1,vidas:3,semilla:LAB.hash('etapa'+op.etapa),acel:E.acel});}
  else if(op.modo==='practica')Object.assign(base,{mapas:[op.mapa||0],niveles:1,semilla:LAB.hash(G.run),invulnerable:!!op.invulnerable,vJug:op.lenta?5.2:0,vEnem:op.lenta?4.2:0});
  else if(op.modo==='libre')Object.assign(base,{mapas:op.secuencia?M_RAPIDA.slice(0,NM):[op.mapa||0],niveles:op.niveles||1,semilla:LAB.hash(G.run),vidas:op.vidas,enemigos:op.enemigos,vJug:op.vJug,vEnem:op.vEnem,mate:op.mate,libre:true});
  G.S=LAB.crear(base,MAPAS);G.D=null;G.fin=false;G.pausa=false;G.prev=null;G.acc=0;G.last=0;G.flot=[];G.objMostrar=op.modo==='practica'&&!!op.objetivos;G.mateMax=G.S.v.mate||1;
  G.recIni=(REC()[base.dif]||0);
  ls.set('laberinto-partida-v1',null);hideOver();closeSheet&&($('modal').hidden=true);HUDK='';acomodar();hud();actx();sfx('arranque');ayudaDesliz(true);
}

/* ── Fin y premios ── */
function terminar(){const S=G.S;if(!S)return;const r=premiar(false);mostrarFin(r);}
function premiar(silencioso){const S=G.S,r=LAB.resumen(S),modo=S.cfg.modo,out={r,premio:null,record:false,estrellas:null,dia:false,leguas:0,lg:''};
  ls.set('laberinto-partida-v1',null);
  const homolog=['rapida','dia','campana'].includes(modo)&&!S.cfg.libre,vale=homolog&&LAB.valida(r);out.vale=vale;out.homolog=homolog;
  // récords (sólo partidas oficiales que valen)
  if(vale&&modo==='rapida'){const R=REC();if(r.puntos>(R[r.dif]||0)){R[r.dif]=r.puntos;ls.set('laberinto-records-v1',JSON.stringify(R));out.record=r.puntos>0;}}
  // campaña: estrellas (unión de lo logrado: una repetición peor no saca ninguna)
  let primera=false;
  if(modo==='campana'&&r.mapas>=1){const E=ETAPAS[G.op.etapa],o=ESTR(),k='e'+E.i,antes=!!o[k+'c'];
    o[k+'c']=1;if(r.vidasPerdidas===0)o[k+'n']=1;if(r.seg<=E.obj)o[k+'t']=1;o[k+'b']=Math.max(o[k+'b']||0,r.puntos);ls.set('laberinto-campana-v1',JSON.stringify(o));
    primera=!antes;out.estrellas=[!!o[k+'c'],!!o[k+'n'],!!o[k+'t']];out.primera=primera;}
  if(vale){
    const xp=Math.min(100,20+10*r.mapas+Math.floor(r.puntos/1000));
    const info={rival:'solo',res:'gana',ok:true,extra:{delDia:modo==='dia',mapas:r.mapas,dificultad:r.dif}};
    if(modo!=='campana'||primera)out.premio=premiosSolo(modo==='campana'?'etapa-'+G.op.etapa:G.run,modo==='campana'?Math.max(xp,40):xp,info);
    // leguas: 1 por el primer intento que vale del día (el del día da la suya aparte)
    if(modo!=='dia')try{out.leguas=window.RANGOS&&acct()?RANGOS.pampaAct('f',1):0;}catch(_){}
    if(modo==='rapida')try{window.RANGOS&&RANGOS.resultado('laberinto','partida',r.puntos,{cu:1,pts:r.puntos,dif:r.dif,niv:r.nivel},'laberinto:'+G.run);}catch(_){}
  }
  if(modo==='dia'){const D=DIAS(),f=G.op.fecha||diaAR();out.diaPrimera=!(f in D);if(!(f in D)){D[f]=r.puntos;ls.set('laberinto-dias-v1',JSON.stringify(D));}
    out.dia=vale&&out.diaPrimera;}
  // logros y retos (sólo oficiales; práctica y reglas libres no desbloquean nada)
  if(homolog&&window.LOGROS){try{
    const d={gano:r.mapas>0,modo:'solo',dif:r.dif,limpios:r.mapas,sinMorir:r.sinMorir,combo4:r.maxCombo>=4,capturas:r.capturas,bonus:r.bonus,
      vuelta:modo==='rapida'&&r.fin==='gano',diario:modo==='dia'&&r.mapas>0&&out.diaPrimera,limDif:r.dif==='dificil'?r.mapas:0};
    const f=LOGROS.fin('laberinto',d,G.run);out.lg=f.html||'';
    if(modo==='campana'){const o=ESTR();let et=0,st=0;for(const E of ETAPAS){if(o['e'+E.i+'c'])et++;st+=(o['e'+E.i+'c']?1:0)+(o['e'+E.i+'n']?1:0)+(o['e'+E.i+'t']?1:0);}
      LOGROS.marca('laberinto','etapas',et,null,true);LOGROS.marca('laberinto','estrellas',st,null,true);}
  }catch(_){}}
  if(!silencioso&&out.record)sfx('record');
  return out;
}
function mostrarFin(o){const S=G.S,r=o.r,modo=S.cfg.modo;
  const tit=r.fin==='gano'?'¡Vuelta completa!':r.fin==='tiempo'?'Se terminó el tiempo':modo==='campana'&&r.mapas?'¡Etapa limpia!':modo==='dia'&&r.mapas?'¡Limpiaste el del día!':'Fin del juego';
  const est=o.estrellas?`<p class="estr">${o.estrellas.map(x=>x?'★':'☆').join('')}</p><p class="cap">Limpiarla · sin perder vidas · en menos de ${ETAPAS[G.op.etapa].obj} s</p>`:'';
  const porque=!o.homolog?'<p class="cap">Práctica y reglas libres: no dan premios ni leguas, y no cuentan para las tablas.</p>':!o.vale?'<p class="cap">Para premios, la partida tiene que durar un minuto con 30 cosas recogidas, o limpiar un mapa.</p>':'';
  const prem=o.premio?premiosHtml(o.premio):'';
  const leg=o.leguas?'<p class="cap">🚩 +1 legua en La Gran Pampa</p>':'';
  const sig=modo==='campana'&&r.mapas&&G.op.etapa<14?`<button class="btn go" id="f-sig">Siguiente etapa</button>`:'';
  const recTxt=o.record?'<p class="rec">¡RÉCORD EN '+DIFN[r.dif].toUpperCase()+'!</p>':modo==='rapida'&&o.homolog?`<p class="cap">Tu récord en ${DIFN[r.dif]}: ${fmt(Math.max(G.recIni,r.puntos))}${r.puntos<G.recIni?' · te faltaron '+fmt(G.recIni-r.puntos):''}</p>`:'';
  over(`<h3>${tit}</h3><div class="res-pts">${fmt(r.puntos)}</div>${recTxt}
    ${est}<div class="stats"><div><b>${r.mapas}</b><small>mapas limpios</small></div><div><b>${fmt(r.recogidos)}</b><small>semillas</small></div><div><b>${r.capturas}</b><small>corridos</small></div></div>
    <p class="cap">${modo==='rapida'?'Nivel '+r.nivel+' · ':''}${reloj(r.seg*1000)} jugados${r.vidasPerdidas?' · '+r.vidasPerdidas+(r.vidasPerdidas===1?' vida perdida':' vidas perdidas'):''}</p>
    <button class="btn go tall" id="f-otra">▶ Otra</button>${sig}
    ${prem}${leg}${modo==='dia'?'<p class="cap" id="f-dia"></p>':''}${porque}${o.lg||''}
    <div class="row"><button class="btn" id="f-ini">Cambiar</button><a class="btn" href="./#juegos">Volver a BloqueAR</a></div>`);
  if(modo==='dia'&&o.homolog){if(o.diaPrimera&&o.vale)delDiaEnviar(G.op.fecha,r.puntos,{lim:r.mapas?1:0,rec:r.recogidos});else{const e=$('f-dia');if(e)e.innerHTML=o.diaPrimera?'Para la tabla del día tiene que valer (un minuto y 30 recogidas, o limpiarlo).':'Para la tabla cuenta el primer intento del día. Podés seguir jugándolo igual.';}}
  if(r.mapas)confeti();
  $('f-otra').onclick=()=>iniciar(G.op);$('f-ini').onclick=inicio;
  if($('f-sig'))$('f-sig').onclick=()=>iniciar({modo:'campana',etapa:G.op.etapa+1});
}

/* ── Inicio (con la demo corriendo atrás, como las maquinitas) ── */
function logo(c,txt,p,col){const w=pixAncho(txt,p)+p*4,h=p*11;c.width=w*2;c.height=h*2;c.style.width=w+'px';c.style.height=h+'px';const g=c.getContext('2d');g.scale(2,2);
  g.shadowColor=col;g.shadowBlur=p*2;pix(g,txt,p*2,p*3,p,col,'izq');}
function elenco(c){const W=300,H=58;c.width=W*2;c.height=H*2;c.style.width=W+'px';c.style.height=H+'px';const g=c.getContext('2d');g.scale(2,2);const t=performance.now();
  const nombres=['ZORRO','LECHUZA','TERO','PELUDO'];
  LAB.NOMBRES.forEach((N,i)=>{const x=38+i*75;bicho(g,x,20,13,{i,dir:2,st:'persigue'},false,t,null);pix(g,nombres[i],x,42,1.6,N.c,'centro');});}
function inicio(){G.S=null;G.fin=true;if(!G.D)nuevaDemo();hud();
  const R=REC(),o=ESTR(),hoy=diaAR(),D=DIAS(),dd=LAB.delDia(hoy,NM);let et=0,st=0;for(const E of ETAPAS){if(o['e'+E.i+'c'])et++;st+=(o['e'+E.i+'c']?1:0)+(o['e'+E.i+'n']?1:0)+(o['e'+E.i+'t']?1:0);}
  const dif=ls.get('laberinto-dif')||'normal',hay=ls.json('laberinto-partida-v1',null);
  over(`<div class="ini">
    <canvas class="logo" id="i-logo" aria-label="LaberintAR"></canvas>
    <canvas class="elenco" id="i-elenco" aria-hidden="true"></canvas>
    <div class="bajada">Comé todas las semillas y que no te agarren. Con un mate, los corrés vos.</div>
    ${hay&&hay.v===2?'<button class="btn go" id="i-volver">↩️ Volver a tu partida</button>':''}
    <div class="difs">${Object.entries(DIFN).map(([k,n])=>`<button class="btn${k===dif?' on':''}" data-dif="${k}">${n}</button>`).join('')}</div>
    <button class="btn go tall" id="i-jugar">▶ Jugar<small>10 niveles · 3 vidas · récord ${fmt(R[dif]||0)}</small></button>
    <div class="modos">
      <button class="btn" id="i-dia">🗓️ Del día<small>${esc(MAPAS[dd.mapa].n)} · 1 vida${hoy in D?' · hecho':''}</small></button>
      <button class="btn" id="i-camp">🏆 Campaña<small>${et}/15 etapas · ★ ${st}/45</small></button>
      <button class="btn" id="i-prac">🎯 Práctica<small>sin premios</small></button>
      <button class="btn" id="i-libre">🛠️ Reglas libres<small>sin premios</small></button>
    </div>
    ${nivelHtml()}
    <div class="row"><button class="btn" id="i-como">Cómo se juega</button><button class="btn" id="i-ctrl">Controles</button></div>
  </div>`);
  logo($('i-logo'),'LABERINTAR',4,'#ffe23f');elenco($('i-elenco'));
  document.querySelectorAll('[data-dif]').forEach(b=>b.onclick=()=>{ls.set('laberinto-dif',b.dataset.dif);inicio();});
  $('i-jugar').onclick=()=>iniciar({modo:'rapida',dif});
  $('i-dia').onclick=()=>iniciar({modo:'dia'});
  $('i-camp').onclick=campana;$('i-prac').onclick=practica;$('i-libre').onclick=libres;$('i-como').onclick=comoSeJuega;$('i-ctrl').onclick=()=>ajustes(false);
  if($('i-volver'))$('i-volver').onclick=()=>{hideOver();recuperar();};
  if(!ls.get('laberinto-ayuda')){ls.set('laberinto-ayuda','1');setTimeout(comoSeJuega,250);}
}
function campana(){const o=ESTR();let html='';
  for(let r=0;r<3;r++){html+=`<h4>${REGIONES[r]}${r?` · ${r===1?'un poco':'bastante'} más rápido`:''}</h4><div class="etapas">`;
    for(const E of ETAPAS.slice(r*5,r*5+5)){const ab=E.i===0||!!o['e'+(E.i-1)+'c'],n=(o['e'+E.i+'c']?1:0)+(o['e'+E.i+'n']?1:0)+(o['e'+E.i+'t']?1:0);
      html+=`<button data-et="${E.i}" ${ab?'':'disabled'} class="${ab&&!o['e'+E.i+'c']?'hoy':''}" title="${esc(MAPAS[E.m].n)}">${E.i+1}<small>${'★'.repeat(n)}${'☆'.repeat(3-n)}</small></button>`;}
    html+='</div>';}
  sheet('Campaña',`<p>Quince etapas en tres regiones: los cinco laberintos, cada vez más rápido. Cada una se juega con 3 vidas. Estrellas: limpiarla · sin perder ninguna vida · antes del tiempo (100 s en el Patio, 95 en la Estación, 90 en la Pampa nocturna). La primera vez que limpiás cada etapa da premio.</p>${html}`);
  document.querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>{closeSheet();iniciar({modo:'campana',etapa:Number(b.dataset.et)});});}
function practica(){const P={mapa:0,objetivos:true,invulnerable:false,lenta:false};
  const pintar=()=>{sheet('Práctica',`<p>Para probar los laberintos y tus rutas de escape. No da premios ni cuenta para las tablas.</p><h4>Laberinto</h4><div class="mapas">${MAPAS.map((m,i)=>`<button data-m="${i}" class="${i===P.mapa?'on':''}">${esc(m.n)}<small>${esc(m.idea)}</small></button>`).join('')}</div>
    <div class="ajustes">${[['objetivos','Ver a dónde va cada uno','Una cruz del color de cada perseguidor'],['invulnerable','No me agarran','Para practicar tranquilo'],['lenta','Más despacio','Todos van más lento']].map(([k,t,s])=>`<button class="aj${P[k]?' on':''}" data-k="${k}"><span><b>${t}</b><small>${s}</small></span><i></i></button>`).join('')}</div>
    <button class="btn go" id="pr-go">Empezar</button>`);
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{P.mapa=Number(b.dataset.m);pintar();});
    document.querySelectorAll('.aj[data-k]').forEach(b=>b.onclick=()=>{P[b.dataset.k]=!P[b.dataset.k];pintar();});
    $('pr-go').onclick=()=>{closeSheet();iniciar({modo:'practica',...P});};};pintar();}
function libres(){const DEF={vidas:3,enemigos:4,vJug:7.6,vEnem:6.8,mate:5};const P=Object.assign({...DEF,mapa:0,secuencia:false,niveles:1},ls.json('laberinto-libre',{}));
  if(P.vJug<5)Object.assign(P,{vJug:DEF.vJug,vEnem:DEF.vEnem});   // lo guardado con las velocidades viejas (antes de la v74)
  const fila=(k,t,s,fmtv)=>`<div class="regla"><span><b>${t}</b><small>${s}</small></span><div class="st"><button data-k="${k}" data-d="-1" aria-label="menos">−</button><b>${fmtv?fmtv(P[k]):P[k]}</b><button data-k="${k}" data-d="1" aria-label="más">+</button></div></div>`;
  const LIM={vidas:[1,9,1],enemigos:[1,4,1],vJug:[4,10,.2],vEnem:[3,10,.2],mate:[0,12,1]};
  const pintar=()=>{sheet('Reglas libres',`<div class="aviso-libre">Reglas libres · sin premios: se juega igual, pero no da oro, XP, leguas ni récords.</div>
    ${fila('vidas','Vidas','De 1 a 9')}${fila('enemigos','Perseguidores','Primero sale el Colorado, después Violeta, Turquesa y Ocre')}
    ${fila('vJug','Tu velocidad','Casillas por segundo',v=>v.toFixed(1))}${fila('vEnem','Velocidad de ellos','Casillas por segundo',v=>v.toFixed(1))}
    ${fila('mate','Mate','Segundos para correrlos (0: no se puede)',v=>v+' s')}
    <h4>Laberinto</h4><div class="mapas"><button data-sec="1" class="${P.secuencia?'on':''}">Los ${NM} seguidos</button>${MAPAS.map((m,i)=>`<button data-m="${i}" class="${!P.secuencia&&i===P.mapa?'on':''}">${esc(m.n)}</button>`).join('')}</div>
    <div class="row"><button class="btn" id="lb-def">Volver a Normal</button><button class="btn go" id="lb-go">Empezar</button></div>`);
    document.querySelectorAll('.st button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,[mn,mx,ps]=LIM[k];P[k]=Math.round(Math.max(mn,Math.min(mx,P[k]+Number(b.dataset.d)*ps))*10)/10;pintar();});
    document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{P.mapa=Number(b.dataset.m);P.secuencia=false;pintar();});
    $('sheet').querySelector('[data-sec]').onclick=()=>{P.secuencia=true;pintar();};
    $('lb-def').onclick=()=>{Object.assign(P,DEF);pintar();};
    $('lb-go').onclick=()=>{ls.set('laberinto-libre',JSON.stringify(P));closeSheet();iniciar({modo:'libre',...P,niveles:P.secuencia?NM:1});};};pintar();}
function comoSeJuega(){sheet('Cómo se juega',`<p>Recorré el laberinto y comé <b>todas las semillas</b> y los <b>mates</b> 🧉. Cuando no queda nada, pasás al siguiente.</p>
  <p>Te persiguen cuatro: <b style="color:#d63030">el Colorado</b> (zorro) va derecho a vos y se apura cuando quedan pocas semillas; <b style="color:#c040a8">la Violeta</b> (lechuza) apunta adelante tuyo; <b style="color:#1f9a96">el Turquesa</b> (tero) te corta el paso según dónde esté el Colorado; <b style="color:#b8741a">el Ocre</b> (peludo) te sigue de lejos y de cerca se va a su rincón. A ratos se van a sus rincones y después vuelven a buscarte.</p>
  <p>Un <b>mate</b> los asusta unos segundos: se ponen azules y los podés correr (200, 400, 800 y 1600 puntos seguidos). Cuando titilan, se les pasa. En los <b>túneles</b> de los costados ellos van más lento: usalos para escaparte.</p>
  <p><b>Doblá antes de llegar a la esquina:</b> la orden queda guardada y el pajarito corta la curva; doblar bien te hace más rápido que ellos.</p>
  <p>Dos veces por laberinto aparece un <b>bonus</b> abajo del corral (torta frita, empanada, alfajor…): vale más en cada nivel. A los 10.000 puntos, una vida más.</p>
  <h4>Controles</h4><ul><li><b>Celular:</b> deslizá el dedo en cualquier parte de la pantalla hacia donde querés ir: el pajarito sigue solo hasta la próxima pared y podés encadenar giros sin levantar el dedo. Si preferís la cruceta, está en Controles.</li><li><b>Compu:</b> flechas o WASD; P o Esc para pausar.</li></ul>
  <h4>Premios</h4><p>Partida rápida, Del día y Campaña dan oro, XP y una legua por día para La Gran Pampa si la partida vale (un minuto con 30 recogidas, o un laberinto limpio). El del día da otra legua y va a la tabla del día. Práctica y reglas libres no dan premios.</p>`);}
function ajustes(enPausa){const pintar=()=>{sheet('Controles',`<div class="ajustes">
    <button class="aj${PREF.ctrl==='swipe'?' on':''}" data-k="swipe"><span><b>Deslizar el dedo</b><small>En cualquier parte de la pantalla (si lo apagás, aparece la cruceta abajo)</small></span><i></i></button>
    <button class="aj${PREF.zurdo?' on':''}" data-k="zurdo"><span><b>Zurdo</b><small>Los controles del otro lado</small></span><i></i></button>
    <button class="aj${PREF.vibrar!==false?' on':''}" data-k="vibrar"><span><b>Vibrar</b><small>Al comer un mate, correr a uno o perder una vida</small></span><i></i></button>
    <button class="aj${SND?' on':''}" data-k="son"><span><b>Sonido</b></span><i></i></button>
    ${PREF.ctrl==='swipe'?`<div class="regla"><span><b>Sensibilidad del deslizar</b><small>Cuánto hay que mover el dedo (8 a 36 px)</small></span><div class="st"><button data-u="-2">−</button><b>${PREF.umbral}</b><button data-u="2">+</button></div></div>`:''}
  </div>`);
  document.querySelectorAll('.aj[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='swipe')PREF.ctrl=PREF.ctrl==='swipe'?'pad':'swipe';else if(k==='son'){SND=!SND;ls.set(JUEGO.id+'-sonido',SND?'1':'0');}else if(k==='vibrar')PREF.vibrar=PREF.vibrar===false;else PREF[k]=!PREF[k];guardaPref();aplicarCtrl();pintar();});
  document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{PREF.umbral=Math.max(8,Math.min(36,PREF.umbral+Number(b.dataset.u)));guardaPref();pintar();});};
  pintar();}
function alCerrarHoja(){}

$('btn-menu').onclick=()=>{if(juegoActivo()&&!G.pausa)pausar(true);
  openSide(`<div class="side-head"><h2>LaberintAR</h2><button class="side-x" id="m-x" aria-label="Cerrar">✕</button></div>${nivelHtml()}
  <div class="menu-list"><button id="m-ini">🏠 Inicio del juego</button><button id="m-como">❓ Cómo se juega</button><button id="m-ctrl">🎮 Controles</button>${menuPie()}</div>`);
  $('m-x').onclick=closeSide;$('m-ini').onclick=()=>{closeSide();if(juegoActivo())cerrarIntento(true);inicio();};$('m-como').onclick=()=>{closeSide();comoSeJuega();};$('m-ctrl').onclick=()=>{closeSide();ajustes(false);};
  cablearPie(()=>$('btn-menu').click());};

(function(){
  const malos=MAPAS.map((m,i)=>[i,LAB.validar(m)]).filter(x=>x[1].length);if(malos.length)console.warn('LaberintAR: mapas con problemas',malos);
  iniciarComun(()=>juegoActivo()&&!G.pausa);aplicarCtrl();
  addEventListener('lg-apariencia',()=>{G.murosK='';});
  new ResizeObserver(()=>acomodar()).observe($('vp'));
  G.raf=requestAnimationFrame(bucle);
