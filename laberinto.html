/* v69: MEDALLAS de La Gran Pampa, para mostrar al lado del nombre en todos los juegos.
   La planilla las manda en «usuarios» (med: {o, p, b, g, d}) y en «perfil» (perfil.pampa.med); el mapa de la Pampa
   las manda en jugadores[].med. Se guardan en el celular («bloques-medallas-v1») así cualquier juego las muestra
   sin pedir nada: MEDALLAS.de(usuario) → la mejor ('🥇', '🥈', '🥉', '🤠' Gran Estanciero, '🐎' Domador o '');
   MEDALLAS.html(usuario) → un <span class="med-pampa"> con título; MEDALLAS.lista(med o usuario) → todas con su
   cantidad (para un perfil); MEDALLAS.guardarLista(lista de usuarios) y MEDALLAS.poner(usuario, med) las guardan. */
window.MEDALLAS=(function(){
  const K='bloques-medallas-v1',ORDEN='opbgd',EM={o:'🥇',p:'🥈',b:'🥉',g:'🤠',d:'🐎'},
    NOM={o:'Ganó La Gran Pampa',p:'Segundo en La Gran Pampa',b:'Tercero en La Gran Pampa',g:'Gran Estanciero (más parajes de la semana)',d:'Domador (domó una tropilla salvaje)'};
  let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M||{}));}catch(_){}};
  const limpio=m=>{const o={};if(m&&typeof m==='object')for(const q of ORDEN)if(Number(m[q])>0)o[q]=Math.floor(Number(m[q]));return o;};
  function poner(u,m,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const o=limpio(m);if(Object.keys(o).length)M[k]=o;else delete M[k];if(guardar)save();}
  function guardarLista(L){if(!Array.isArray(L))return;load();for(const x of L)poner(x.usuario||x.n,x.med,false);save();}
  const medDe=u=>typeof u==='object'&&u?limpio(u):load()[String(u||'').toLowerCase()]||null;
  function de(u){const m=medDe(u);if(!m)return '';for(const q of ORDEN)if(m[q])return EM[q];return '';}
  function lista(u){const m=medDe(u)||{};return ORDEN.split('').filter(q=>m[q]).map(q=>({q,e:EM[q],n:m[q],t:NOM[q]}));}
  function titulo(u){return lista(u).map(x=>x.t+(x.n>1?` ×${x.n}`:'')).join(' · ');}
  function html(u){const e=de(u);return e?`<span class="med-pampa" title="${titulo(u).replace(/"/g,'&quot;')}" aria-label="${titulo(u).replace(/"/g,'&quot;')}">${e}</span>`:'';}
  return {de,lista,html,titulo,poner,guardarLista,EM,NOM};
})();
/* ───────── ORO (v70): la moneda de los juegos ─────────
   Dos monedas (pedido del 24/10): los PESOS salen de la estancia y sirven para lo común; el ORO sale de jugar cualquier juego
   y sirve para lo lindo (apariencias, ropa y caballos especiales, adornos únicos, gestos y marcos). Las mejoras grandes de
   la estancia piden las dos. En la pulpería se puede cambiar oro por pesos (1 → 8, hasta 50 de oro por día); al revés no.
   · Cuánto da cada juego: ORO_TABLA (abajo), por partida ganada contra la compu; contra personas ×2, empate ×0,6, perder con
     esfuerzo ×0,4, abandonar 0; contra la compu en Fácil ×0,5 y en Difícil ×1,5 (la misma regla que las leguas: RANGOS.cuenta). Tope del día: 150 enteros, hasta 300 a la mitad, después un cuarto.
   · Se guarda en «bloques-oro-v1» y viaja con la cuenta dentro de RANGOS.exportData() («o»). Para que dos dispositivos no se
     pisen, el saldo no se guarda: se CALCULA. Cada dispositivo anota lo suyo (d[dev] = {g ganado suelto, s gastado suelto}) y lo
     que tiene nombre va aparte: k = premios con clave (cofres de nivel, puestos de La Gran Pampa…: cuentan una sola vez aunque
     se cobren en los dos) y p = compras con clave (una apariencia, un adorno: se pagan una sola vez). Al juntar: de cada
     dispositivo lo mayor y las claves se unen. Saldo = Σ(g − s) + Σk − Σp.
   · Niveles: ORO.niveles() revisa el nivel general y el de cada juego, cobra los cofres y avisa con un cartel lo que ganaste
     (títulos, apariencias, adornos para la estancia, ropa). La primera vez (v70) marca los niveles que ya pasaste y da UN cofre
     de bienvenida (hasta 500).
   · Títulos: el que elegís se ve en tu perfil y al lado de tu nombre en el chat y en las mesas (TITULOS, más abajo). */
window.ORO=(function(){
'use strict';
const K='bloques-oro-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
const dev=()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;};
const diaAR=(t=Date.now())=>new Date(t-3*3600e3).toISOString().slice(0,10);

/* ── Cuánto da cada juego (partida ganada contra la compu, duración normal) ── */
const NIVEL_DIF=s=>({facil:1,principiante:1,normal:2,medio:2,intermedio:2,dificil:3,experto:3,maestro:3})[s]||2;
const ORO_TABLA={
  poblar:12,
  truco:i=>((i.x&&i.x.a)||15)>=30?10:6,          // a 30: 10 · a 15: 6
  ajedrez:i=>i.x&&i.x.ritmo==='bala'?4:8,         // bala: 4
  uno:6,ludo:6,
  pool:4,                                          // por mesa de Bola 8
  bloquear:(i,ex)=>Math.min(10,Math.floor(((ex&&ex.lin)||(i.x&&i.x.lin)||0)/10)),   // 1 cada 10 líneas, hasta 10
  sudoku:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  solitario:i=>i.extra&&i.extra.delDia?6:(i.extra&&i.extra.dificultad==='dificil'?3:2),
  buscaminas:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  laberinto:i=>i.extra&&i.extra.delDia?6:Math.min(10,4+2*Math.min(3,(i.extra&&i.extra.mapas)||0)),   // v73: 4 por participar, +2 por mapa limpio (hasta 10); el del día 6
  invasores:i=>{const x=i.x||i.extra||{};if(x.modo==='duelo')return 6;if(x.modo==='dia')return 6;return Math.min(10,2+(x.olas||0))*(x.dif==='tranquila'?.6:1);},   // v73: 2 + 1 por oleada limpia (hasta 10); duelo y del día 6
  reto:5                                           // cada reto de la semana cumplido
};
const ORO_DEF=4;   // un juego que todavía no está en la tabla
const MULT_RES={g:1,e:.6,p:.4,a:0},MULT_RIVAL={p:2,c:1,s:1};
const MULT_DIF=d=>d==='facil'?.5:(d==='dificil'||d==='maestro')?1.5:1;
const TOPE=[150,300];   // del día: hasta 150 enteros, hasta 300 a la mitad, después un cuarto
const CAMBIO={tasa:8,dia:50};
const NOM_ID={BloqueAR:'bloquear',PoblAR:'poblar',TrucAR:'truco',UnoAR:'uno',AjedrezAR:'ajedrez',PoolAR:'pool',LudAR:'ludo',SudokAR:'sudoku',SolitARio:'solitario',BuscaminAR:'buscaminas',LaberintAR:'laberinto',InvasorAR:'invasores'};
const SOLOS=new Set(['sudoku','solitario','buscaminas','laberinto']);

// «info» de cada juego, en la forma corta que usa RANGOS ({res:'g'|'e'|'p'|'a', rival:'p'|'c'|'s', esf}); también acepta la larga
// ({rival:'compu'|'personas', res:'gana'|'empata'|'pierde'|'abandona', ok, extra}). Los solitarios van como «solo».
function norm(info,de){if(!info||typeof info!=='object')return info;const o={...info};
  const R={compu:'c',personas:'p',amigos:'p',solo:'s'},S={gana:'g',empata:'e',pierde:'p',abandona:'a'};
  if(R[o.rival])o.rival=R[o.rival];if(S[o.res])o.res=S[o.res];if(o.esf===undefined&&o.ok!==undefined)o.esf=!!o.ok;
  if(!o.j&&de)o.j=NOM_ID[de]||NOM_ID[String(de).replace(/ \(reto\)$/,'')]||'';
  if(SOLOS.has(o.j))o.rival='s';
  if(o.extra&&o.extra.dificultad&&!o.dif)o.dif=o.extra.dificultad;
  return o;}
// Cuánto vale (sin el tope del día). Sin «info» (la forma vieja): como una partida ganada sin rival.
function calc(de,info,extra){
  if(/\(reto\)$/.test(String(de||'')))return ORO_TABLA.reto;
  const i=norm(info||{},de)||{},j=i.j||NOM_ID[de]||'';
  const b=ORO_TABLA[j],base=typeof b==='function'?b(i,extra):b!=null?b:ORO_DEF;
  if(!info)return Math.round(base);
  const res=i.res||'g';if(res==='a'||i.esf===false)return 0;   // sin esfuerzo (perder en 20 segundos, ganar sin jugar) no da
  // contra quién: la misma regla que las leguas (RANGOS.cuenta: personas 2, compu Difícil 1,5, Normal 1, Fácil 0,5, solo 1)
  let rv=1;try{rv=SOLOS.has(j)?1:window.RANGOS&&RANGOS.cuenta?RANGOS.cuenta(j,{rival:i.rival||'c',res,dif:i.dif}).mult||1:(MULT_RIVAL[i.rival]||1)*(i.rival==='c'?MULT_DIF(i.dif):1);}catch(_){}
  return Math.round(base*(MULT_RES[res]??1)*rv);}

/* ── Datos ── */
function load(){const o=ls.json(K,{});o.d=o.d&&typeof o.d==='object'?o.d:{};o.k=o.k&&typeof o.k==='object'?o.k:{};o.p=o.p&&typeof o.p==='object'?o.p:{};o.h=Array.isArray(o.h)?o.h:[];return o;}
function save(o){o.at=Date.now();ls.set(K,JSON.stringify(o));aviso();}
let SUB=new Set();function aviso(){for(const f of SUB)try{f(saldo());}catch(_){}try{document.querySelectorAll('[data-oro-saldo]').forEach(el=>{el.textContent=fmt(saldo());});}catch(_){}}
function saldoDe(o){let s=0;for(const x of Object.values(o.d))s+=(Number(x&&x.g)||0)-(Number(x&&x.s)||0);for(const x of Object.values(o.k))s+=Number(Array.isArray(x)?x[0]:0)||0;for(const x of Object.values(o.p))s-=Number(Array.isArray(x)?x[0]:0)||0;return Math.max(0,Math.round(s));}
function saldo(){return saldoDe(load());}
function hist(o,n,de){o.h.unshift({t:Date.now(),n:Math.round(n),de:String(de||'').slice(0,40)});if(o.h.length>25)o.h.length=25;}
function mio(o){const d=dev();return (o.d[d]=o.d[d]||{g:0,s:0});}
// Ganar oro suelto (una partida). Devuelve lo que entró.
function ganar(n,de,sinAnim){n=Math.round(Number(n)||0);if(n<=0)return 0;const o=load();mio(o).g+=n;hist(o,n,de);save(o);if(!sinAnim)anim(n);return n;}
// Un premio con nombre (cuenta una sola vez, aunque se cobre en dos dispositivos).
function cobrar(key,n,de,sinAnim){key=String(key);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.k[key])return 0;o.k[key]=[n,Date.now()];if(n)hist(o,n,de);save(o);if(n&&!sinAnim)anim(n);return n;}
function cobrado(key){return !!load().k[String(key)];}
// Comprar algo con nombre (se paga una vez). true si ya era tuyo o si alcanzó.
function tiene(id){return !!load().p[String(id)];}
function comprar(id,n,que){id=String(id);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.p[id])return true;if(saldoDe(o)<n)return false;o.p[id]=[n,Date.now()];hist(o,-n,que||id);save(o);return true;}
// Gastar suelto (lo que se usa, como el cambio en la pulpería).
function gastar(n,que){n=Math.max(0,Math.round(Number(n)||0));const o=load();if(saldoDe(o)<n)return false;mio(o).s+=n;hist(o,-n,que);save(o);return true;}
// Pulpería: oro → pesos (1 → 8), hasta 50 de oro por día en cada dispositivo. Devuelve los pesos (0 si no se pudo).
function cambioHoy(){const o=load(),c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;return Math.max(0,CAMBIO.dia-c);}
function cambiar(n){n=Math.floor(Number(n)||0);if(n<=0||n>cambioHoy())return 0;const o=load();if(saldoDe(o)<n)return 0;
  mio(o).s+=n;const c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;o.cam={d:diaAR(),n:c+n};hist(o,-n,'Cambio en la pulpería');save(o);return n*CAMBIO.tasa;}

/* ── Lo que da una partida (lo llama RANGOS.premio): con el tope del día ── */
function premio(de,info,extra){
  let v=calc(de,info,extra);if(v<=0)return 0;
  const o=load(),hoy=diaAR(),ya=o.dia&&o.dia.d===hoy?o.dia.n|0:0;
  v=Math.max(1,Math.round(v*(ya<TOPE[0]?1:ya<TOPE[1]?.5:.25)));
  o.dia={d:hoy,n:ya+v};mio(o).g+=v;hist(o,v,String(de||'').replace(/ \(reto\)$/,' · reto'));save(o);
  anim(v);
  try{setTimeout(()=>niveles(true),1600);}catch(_){}
  return v;}
function hoy(){const o=load();return o.dia&&o.dia.d===diaAR()?o.dia.n|0:0;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() como «o» ── */
function exportData(){const o=load();return {d:o.d,k:o.k,p:o.p,ti:o.ti||null,mc:o.mc||null,r70:o.r70||0,at:o.at||0};}
function importData(d){if(!d||typeof d!=='object')return false;const o=load();let ch=false;
  for(const [dv,x] of Object.entries(d.d||{})){if(!x||typeof x!=='object')continue;const y=o.d[dv]||{g:0,s:0},g=Math.max(Number(y.g)||0,Number(x.g)||0),s=Math.max(Number(y.s)||0,Number(x.s)||0);if(g!==(y.g||0)||s!==(y.s||0)||!o.d[dv]){o.d[dv]={g,s};ch=true;}}
  for(const M of ['k','p'])for(const [key,x] of Object.entries(d[M]||{})){if(!Array.isArray(x))continue;const y=o[M][key];
    if(!y){o[M][key]=[Number(x[0])||0,Number(x[1])||0];ch=true;}else if((Number(x[0])||0)>(Number(y[0])||0)){o[M][key]=[Number(x[0])||0,Math.min(Number(y[1])||0,Number(x[1])||0)];ch=true;}}
  if(Array.isArray(d.ti)&&(!Array.isArray(o.ti)||(Number(d.ti[2])||0)>(Number(o.ti[2])||0))){o.ti=d.ti;ch=true;}
  if(Array.isArray(d.mc)&&(!Array.isArray(o.mc)||(Number(d.mc[1])||0)>(Number(o.mc[1])||0))){o.mc=d.mc;ch=true;}
  if(d.r70&&!o.r70){o.r70=d.r70;ch=true;}
  if(ch){const at=o.at;ls.set(K,JSON.stringify({...o,at:Math.max(at||0,d.at||0)}));aviso();}
  return ch;}

const TIT_J={bloquear:['Apilador','Gran arquitecto'],poblar:['Colono','Fundador de pueblos'],truco:['Gaucho del truco','Mano de oro del truco'],uno:['Cantor del uno','Rey de la mesa'],
  ajedrez:['Alfil del pago','Gran maestro'],ludo:['Fichero','Patrón del ludo'],pool:['Taquero','Mago del paño'],sudoku:['Numerero','Sabio de los números'],solitario:['Paciente','Maestro del solitario'],
  buscaminas:['Rastreador de minas','Desactivador'],invasores:['Defensor de la llanura','Azote de la Nodriza'],estancia:['Chacarero','Gran estanciero']};
const JNOM={bloquear:'BloqueAR',poblar:'PoblAR',truco:'TrucAR',uno:'UnoAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',invasores:'InvasorAR',estancia:'EstanciAR'};
const cofreEst=L=>L>=8?10+2*L:0;   // EstanciAR: desde el nivel 8, un cofre chico por nivel (lo cobra la estancia)
function R(){return window.RANGOS||null;}
function lvGen(){try{return R().general().level.lv;}catch(_){return 1;}}
function lvJ(j){try{return R().levelInfo(R().xp(j)).lv;}catch(_){return 1;}}
function juegos(){const r=R();return r?[...Object.keys(r.GAMES||{}),...Object.keys(r.SOLOS||{})]:[];}
// Todos los títulos que tenés: [{id, n, de}]
function titulos(){const out=[],g=lvGen();
  for(const [L,n] of Object.entries(TIT_GEN))if(g>=+L)out.push({id:'g'+L,n,de:`Nivel general ${L}`});
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);if(l>=10)out.push({id:'j:'+j+':10',n:T[0],de:`${JNOM[j]||j} nivel 10`});if(l>=30)out.push({id:'j:'+j+':30',n:T[1],de:`${JNOM[j]||j} nivel 30`});}
  const o=load(),camp=Object.keys(o.k).filter(k=>/^pm:\d{4}-\d\d-\d\d:\d+:1$/.test(k)).length;
  if(camp)out.push({id:'pm:campeon',n:'Campeón de La Gran Pampa',de:camp===1?'Ganaste una semana':`Ganaste ${camp} semanas`});
  if(Object.keys(o.k).some(k=>/^tp:\d+:1$/.test(k)))out.push({id:'pm:temporada',n:'Campeón de temporada',de:'Ganaste una temporada de La Gran Pampa'});
  return out;}
function titulo(){const o=load(),ti=Array.isArray(o.ti)?o.ti:null;if(!ti||!ti[0])return null;const t=titulos().find(x=>x.id===ti[0]);return t||null;}
function ponerTitulo(id){const o=load();const t=id?titulos().find(x=>x.id===id):null;if(id&&!t)return false;o.ti=[t?t.id:'',t?t.n:'',Date.now()];save(o);
  try{if(window.TITULOS){const a=ls.json('bloques-acct-v1',null);if(a&&a.usuario)TITULOS.poner(a.usuario,t?t.n:'');}}catch(_){}
  subirPerfil();return true;}

const MARCOS={dorado:{n:'Aro de oro',p:150},patrio:{n:'Celeste y blanco',p:150},fogon:{n:'Fogón',p:150},filete:{n:'Fileteado',p:150}};

function ponerMarco(id){const o=load();if(id&&!(MARCOS[id]&&o.p['mc:'+id]))return false;o.mc=[id||'',Date.now()];save(o);subirPerfil();return true;}

function subirPerfil(){const t=titulo();return subirTitulo(t?t.n:'',marco());}
async function subirTitulo(n,mc){const a=ls.json('bloques-acct-v1',null);if(!a||!a.usuario||!a.token)return;
  const url=ls.get('bloques-lb-url-v1')||(typeof LB_DEF!=='undefined'?LB_DEF:'https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec');

// Revisa los niveles. «mostrar»: si hay algo nuevo, el cartel. Devuelve la lista de lo nuevo.
let REV=false;
function niveles(mostrar){if(REV||!R())return [];REV=true;try{
  const o=load(),g=lvGen(),nuevos=[];
  if(!o.r70){   // primera vez: lo que ya pasaste queda marcado y va UN cofre de bienvenida
    let tot=0;for(let L=2;L<=g;L++){const k='lv:'+L;if(!o.k[k]){o.k[k]=[0,Date.now()];tot+=cofreGen(L);}}
    o.r70=Date.now();const bien=Math.min(500,tot);if(bien>0&&!o.k.bienvenida){o.k.bienvenida=[bien,Date.now()];hist(o,bien,'Cofre de bienvenida');nuevos.push({e:'oro',b:`Cofre de bienvenida: +${fmt(bien)} de oro`,s:'Por los niveles que ya tenías'});}
    {const ad=[];for(const L of Object.keys(ADORNO_GEN))if(g>=+L)regalarAdorno(o,+L,ad,true);
      if(ad.length)nuevos.push({e:'🏡',b:ad.length===1?ad[0].b:`${ad.length} adornos para tu estancia`,s:(ad.length>1?ad.map(x=>x.b).join(', ')+'. ':'')+'Están en la estancia, en Tienda › Guardados'});}
    for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const L of [10,30])if(l>=L)o.k['tj:'+j+':'+L]=o.k['tj:'+j+':'+L]||[0,Date.now()];}
    const ts=titulos();if(ts.length)nuevos.push({e:'🎖️',b:ts.length===1?`Título: ${ts[0].n}`:`${ts.length} títulos para elegir`,s:'Elegí cuál se ve en tu perfil, en Mi cuenta'});
    save(o);if(mostrar&&nuevos.length)cartel(g,nuevos,true);return nuevos;}
  for(let L=2;L<=g;L++){const k='lv:'+L;if(o.k[k])continue;const n=cofreGen(L);o.k[k]=[n,Date.now()];hist(o,n,`Cofre del nivel ${L}`);
    nuevos.push({e:'oro',b:`Cofre del nivel ${L}: +${fmt(n)} de oro`});
    if(TIT_GEN[L])nuevos.push({e:'🎖️',b:`Título: ${TIT_GEN[L]}`,s:'Elegilo en Mi cuenta'});
    if(ADORNO_GEN[L])regalarAdorno(o,L,nuevos);
    if(ROPA_GEN[L])nuevos.push({e:'🧥',b:ROPA_GEN[L][1],s:'Para tu personaje: ponétela en la estancia (Personaje)'});}
  // títulos de cada juego (10 y 30)
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const [L,n] of [[10,T[0]],[30,T[1]]]){const k='tj:'+j+':'+L;if(l>=L&&!o.k[k]){o.k[k]=[0,Date.now()];nuevos.push({e:'🎖️',b:`Título: ${n}`,s:`Por llegar al nivel ${L} en ${JNOM[j]||j}`});}}}
  if(nuevos.length){save(o);if(mostrar)cartel(g,nuevos);}
  return nuevos;}finally{REV=false;}}
// Adorno exclusivo de la estancia: va a la cola de regalos («estancia-premios»), una sola vez.
function regalarAdorno(o,L,nuevos,retro){const A=ADORNO_GEN[L];if(!A)return;const k='adn:'+L;if(o.k[k])return;o.k[k]=[0,Date.now()];
  try{const Q=ls.json('estancia-premios',[]);Q.push({de:`Nivel ${L}`,trigo:0,pesos:0,obj:[A[0]],t:Date.now()+L});ls.set('estancia-premios',JSON.stringify(Q.slice(-40)));}catch(_){}

const COLA_LV=[];let LV_ON=false;
function cartel(lv,items,bienvenida){if(typeof document==='undefined')return;COLA_LV.push({lv,items,bienvenida});if(!LV_ON)otroCartel();}
function otroCartel(){const c=COLA_LV.shift();if(!c){LV_ON=false;return;}if(!document.body){LV_ON=false;return;}LV_ON=true;css();
  const el=document.createElement('div');el.className='oro-lv';el.setAttribute('role','status');el.setAttribute('aria-label',c.bienvenida?'Llegó el oro':'Subiste de nivel');
  el.innerHTML=`<div class="oro-lv-c">${c.bienvenida?`<div class="oro-lv-n">${ico()}</div><h2>Llegó el oro a BloqueAR</h2><p style="margin:8px 0 0;opacity:.82;font-size:13px">Jugando cualquier juego ganás oro: sirve para apariencias, ropa y adornos únicos. Los pesos siguen siendo de la estancia.</p>`:`<h2>¡Subiste de nivel!</h2><div class="oro-lv-n">Nivel ${c.lv}</div>`}
    <ul>${c.items.map(x=>`<li>${x.e==='oro'?ico():`<i>${x.e}</i>`}<span><b>${esc(x.b)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</span></li>`).join('')}</ul><button type="button">¡Buenísimo!</button></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));

/* TÍTULOS de los demás (v70): la planilla los manda en «usuarios» (ti, y cau = los campeones de la última semana de La Gran
   Pampa: «Caudillo de la semana» durante la semana siguiente) y en el perfil. Se guardan en «bloques-titulos-v1».
   TITULOS.html(usuario) → <span class="tit-chip"> discreto (o ''), para poner al lado del nombre. */
window.TITULOS=(function(){
  const K='bloques-titulos-v1';let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}M.u=M.u||{};M.cau=Array.isArray(M.cau)?M.cau:[];return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M));}catch(_){}};
  const limpio=t=>String(t||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,32);
  function poner(u,t,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const v=limpio(t);if(v)M.u[k]=v;else delete M.u[k];if(guardar)save();}
  function caudillos(L,sem){load();M.cau=(Array.isArray(L)?L:[]).map(x=>String(x||'').toLowerCase()).filter(Boolean);M.sem=sem||'';save();}

  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}
  for(const [j,C] of Object.entries(o.c))for(const [k,v] of Object.entries(C))if(v>((d.c&&d.c[j]&&d.c[j][k])||0))res.falta=true;
  const s=d.s;if(s&&s.w===o.s.w){for(const [j,C] of Object.entries(s.c||{})){if(!D[j])continue;const sc=(o.s.c[j]=o.s.c[j]||{});for(const [k,v] of Object.entries(C||{}))if(Number.isFinite(v)&&v>(sc[k]||0)){sc[k]=v;res.ch=true;}}
    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
  // Los retos que la planilla ya tenía cumplidos se marcan acá sin volver a dar el premio.

}

<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).
   v67: amigos con solicitudes (pestañas Charlas / Amigos / Global), grupos de juego (Jugar con el grupo, partidas
   del grupo, archivar solos los que nadie usa) y selector de emojis.
   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},
   CHAT.esAmigo(n), CHAT.usuarios() → [{usuario, avatar, color, enLinea, estado}], CHAT.conectados() → {amigos, global}

// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}

async function mandar(tmp){
  tmp.fail=false;tmp.sending=true;$('.cx-panel')&&($('.cx-panel').dataset.sig='');render();
  try{
    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    if(!S.msgs.some(x=>x.id===j.id)){const m={id:j.id,de:S.me,para:tmp.para,tipo:'msg',cont:'',p:tmp.p,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]=S.plain[tmp.id];}

  }catch(e){tmp.sending=false;tmp.fail=true;tmp.why=sinV12(e);saveMsgs();}
  if($('.cx-panel'))$('.cx-panel').dataset.sig='';render();

  if(!(S.ver&&S.ver<20))return;S.invFix=S.invFix||{};
  for(const m of S.msgs.slice(-40)){const c=invCard(m);
    if(!c||c.j!=='bloquear'||S.invFix[c.inv]||lc(m.de)===lc(S.me)||(S.invSt[c.inv]&&S.invSt[c.inv]!=='esperando'))continue;
    S.invFix[c.inv]=1;
    try{const j=await call(auth({accion:'buzon',ver:c.inv})),iv=j.invitacion,of=String(iv&&iv.id===c.inv&&iv.oferta||''),k=(/^([A-Z]+):/.exec(of)||[])[1],g=k&&INV_PREF[k];
      if(!g)continue;let o=null;try{o=JSON.parse(of.slice(of.indexOf(':')+1));}catch(_){}
      c.j=g;c.t='Invitación a '+GAMES[g];c.d=o&&o.re?'Volver a la partida':g==='pool'?(({b8:'Bola 8',b9:'Bola 9',b10:'Bola 10',caram:'Carambola',tres:'Tres bandas'}[o&&o.modo]||'Pool')+(o&&Number(o.n)===4?' · Dobles (2 contra 2)':' · mano a mano')):o&&Number(o.n)>2?'Mesa de '+o.n:'Mano a mano';
      if($('.cx-panel'))$('.cx-panel').dataset.sig='';if(S.open)render();badges();
      if(S.espero)esperoRevisar([m]);}catch(_){}}
}
function esperoRevisar(fresh){
  const e=S.espero;if(!e||Date.now()-e.t>180000)return;
  // v70.1: una planilla vieja no conoce los juegos nuevos (LudAR, PoolAR…) y marca su tarjeta como «bloquear»: también vale.
  for(const m of fresh){const c=invCard(m);if(!c||lc(m.de)!==lc(e.host)||(e.j&&c.j!==e.j&&!(c.j==='bloquear'&&INV_URL[e.j])))continue;
    S.espero=null;try{sessionStorage.removeItem('bloques-chat-espero');}catch(_){}
    invAccion('inventrar',c.inv,c.j==='bloquear'&&e.j&&INV_URL[e.j]?e.j:c.j);return;}
}
// Para los juegos: avisar en un grupo que hay lugar en la mesa.
async function llamar(gid,card){
  const g=grupoDe(gid);if(!g)throw new Error('No encontramos ese grupo.');
  const pl=JSON.stringify({x:'',card:{...card,ll:1,host:S.me}}),para='g:'+g.id;
  const j=await call(auth({accion:'enviar',para,tipo:'msg',p:pl}));
  const m={id:j.id,de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};if(!S.msgs.some(x=>x.id===j.id)){S.msgs.push(m);S.plain[m.id]=JSON.parse(pl);saveMsgs();}
  return g;
}

   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de

   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón

  root.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(mandar(b.dataset.r)&&fr&&!fr.hidden){fr.hidden=true;if(frb){frb.classList.remove('on');frb.setAttribute('aria-expanded','false');}}});
  if(frb)frb.onclick=()=>{fr.hidden=!fr.hidden;frb.classList.toggle('on',!fr.hidden);frb.setAttribute('aria-expanded',String(!fr.hidden));if(!fr.hidden)em.hidden=true;};
  f.onsubmit=e=>{e.preventDefault();if(mandar(t.value))t.value='';};
  root.querySelector('.mc-eb').onclick=()=>{em.hidden=!em.hidden;if(!em.hidden&&fr){fr.hidden=true;if(frb)frb.classList.remove('on');}};
  em.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const a=t.selectionStart??t.value.length;t.value=(t.value.slice(0,a)+b.dataset.e+t.value.slice(a)).slice(0,120);try{t.setSelectionRange(a+b.dataset.e.length,a+b.dataset.e.length);}catch(_){}t.focus();});
  t.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Escape'&&alCerrar){e.preventDefault();alCerrar();}});
}
function espera(el,op){
  if(!el){if(S.inl)S.inl.innerHTML='';S.inl=null;S.inlOp=null;badge();return;}
  css();S.inl=el;S.inlOp=op||{};S.no=0;
  el.innerHTML=`<div class="mc-inl" role="region" aria-label="Chat de la mesa"><header><b>💭 ${esc(S.inlOp.titulo||'Chat de la mesa')}</b></header><div class="mc-msgs" aria-live="polite"></div>${formHtml('Escribile a la mesa')}</div>`;
  ['pointerdown','touchstart','keydown','keyup','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));
  cablearForm(el.querySelector('.mc-inl'),null);dibujar();ocultarBurb();
}
/* ── (v72→v74) Mover, achicar y minimizar el chat ──
   v74 (pedido del 25/10: «que se mantenga chiquito, con scroll; un botón para minimizarlo; moverlo por toda la pantalla
   y que al abrirlo en cualquier lugar no se rompa ni quede afuera»):
   · El panel tiene alto fijo chico (clase mc-comp) y los mensajes se leen con scroll adentro. Si estás leyendo arriba,
     no te lo baja: aparece «↓ nuevos».
   · ▁ lo minimiza a una barrita que se puede llevar a cualquier lado; tocándola vuelve a abrirse ahí mismo. Con el chat
     minimizado, cada mensaje nuevo sale como globito arriba (o abajo, si no hay lugar) de la barrita.
   · Se arrastra libre por toda la pantalla. Se guarda el centro como fracción de la pantalla {cx, cy}, por juego y
     orientación; al poner el panel siempre se lo encierra en lo visible (también con el teclado del celular abierto:
     visualViewport). Las posiciones viejas {l, y} (v72) se siguen leyendo. */
const POSK=(j,q)=>'mesa-chat-'+(q||'pos')+':'+(j||'x')+':'+(innerWidth>innerHeight?'h':'v');
function posLeer(j,q){try{const o=JSON.parse(localStorage.getItem(POSK(j,q))||'null');if(!o)return null;
  if(isFinite(o.cx)&&isFinite(o.cy))return {cx:Math.max(0,Math.min(1,o.cx)),cy:Math.max(0,Math.min(1,o.cy))};
  if((o.l==='l'||o.l==='r')&&isFinite(o.y))return {cx:o.l==='l'?0:1,cy:o.y,viejo:1};return null;}catch(_){return null;}}
function posGuardar(j,q,o){try{if(o)localStorage.setItem(POSK(j,q),JSON.stringify({cx:+o.cx.toFixed(4),cy:+o.cy.toFixed(4)}));else localStorage.removeItem(POSK(j,q));}catch(_){}}
const MARG=8;
function topSeguro(){const t=document.querySelector('.topbar,header.top,.top,#topbar,.hdr');let y=MARG;try{const r=t&&t.getBoundingClientRect();if(r&&r.bottom>0&&r.bottom<innerHeight*.3)y=Math.max(y,Math.round(r.bottom)+4);}catch(_){}return y;}
// Lo que se ve de verdad (con el teclado del celular abierto, visualViewport es más chico que la ventana).
function vista(){const v=window.visualViewport;if(v&&v.height>0&&v.height<innerHeight-40)return {x:v.offsetLeft,y:v.offsetTop,w:v.width,h:v.height,tec:true};return {x:0,y:0,w:innerWidth,h:innerHeight,tec:false};}
// Encierra el elemento en lo visible (left/top en px).
function encerrar(el,left,top){const V=vista(),w=el.offsetWidth||300,h=el.offsetHeight||200;
  const minY=V.tec?V.y+MARG:Math.min(topSeguro(),Math.max(MARG,V.h-h-MARG)),maxY=Math.max(minY,V.y+V.h-h-MARG);
  const minX=V.x+MARG,maxX=Math.max(minX,V.x+V.w-w-MARG);
  el.style.left=Math.round(Math.max(minX,Math.min(maxX,left)))+'px';el.style.top=Math.round(Math.max(minY,Math.min(maxY,top)))+'px';
  el.style.right=el.style.bottom='auto';}
function ponerEn(el,o){
  // con el teclado abierto y poco lugar (celular acostado), el panel se achica a lo que se ve
  if(el.classList.contains('mc-comp')){const V=vista();el.style.removeProperty('height');if(V.tec&&el.offsetHeight>V.h-2*MARG)el.style.setProperty('height',Math.max(120,V.h-2*MARG)+'px','important');}
  if(!o){el.style.left=el.style.right=el.style.top=el.style.bottom='';
    // sin posición guardada: donde dice el CSS de cada juego, pero igual adentro de lo visible (teclado abierto)
    const V=vista();if(V.tec){const r=el.getBoundingClientRect();if(r.bottom>V.y+V.h-MARG||r.top<V.y)encerrar(el,r.left,r.top);}return;}
  const w=el.offsetWidth||300,h=el.offsetHeight||200;
  if(o.viejo){encerrar(el,o.cx<.5?MARG:innerWidth-w-MARG,o.cy*innerHeight);return;}
  encerrar(el,o.cx*innerWidth-w/2,o.cy*innerHeight-h/2);
}
const centro=el=>{const r=el.getBoundingClientRect();return {cx:(r.left+r.width/2)/innerWidth,cy:(r.top+r.height/2)/innerHeight};};
// Registro de paneles de chat (el de acá y los propios de UnoAR, LudAR e InvasorAR), por juego.
const REG={};
const MINK=j=>'mesa-chat-min:'+(j||'x');
function minLeer(j){try{return localStorage.getItem(MINK(j))==='1';}catch(_){return false;}}
function minGuardar(j,v){try{if(v)localStorage.setItem(MINK(j),'1');else localStorage.removeItem(MINK(j));}catch(_){}}
// Arrastrar con umbral: un toque sigue siendo un toque. op.handle: se agarra de cualquier lado (botón o barrita).
function arrastrable(el,j,q,handleAll,alSoltar){
  if(el._mcArr)return;el._mcArr=1;let D=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button>0)return;
    if(!handleAll){const h=e.target.closest('header');if(!h||h.parentElement!==el||e.target.closest('button,input,a,select,textarea'))return;}
    const r=el.getBoundingClientRect();D={id:e.pointerId,x0:e.clientX,y0:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,mov:false};
  });
  addEventListener('pointermove',e=>{if(!D||e.pointerId!==D.id)return;
    if(!D.mov){if(Math.hypot(e.clientX-D.x0,e.clientY-D.y0)<8)return;D.mov=true;el.classList.add('mc-arr');try{el.setPointerCapture(e.pointerId);}catch(_){}}
    e.preventDefault();e.stopPropagation();
    const w=el.offsetWidth,h=el.offsetHeight,x=Math.max(0,Math.min(innerWidth-w,e.clientX-D.ox)),y=Math.max(0,Math.min(innerHeight-h,e.clientY-D.oy));
    el.style.left=x+'px';el.style.top=y+'px';el.style.right=el.style.bottom='auto';},{passive:false,capture:true});
  const fin=e=>{if(!D||(e&&e.pointerId!==D.id))return;const d=D;D=null;if(!d.mov)return;el.classList.remove('mc-arr');if(e)e.stopPropagation();
    const o=centro(el);posGuardar(j,q,o);ponerEn(el,o);try{alSoltar&&alSoltar(o);}catch(_){}
    // el clic que viene después de soltar no es un toque
    const no=ev=>{ev.stopPropagation();ev.preventDefault();};el.addEventListener('click',no,{capture:true,once:true});setTimeout(()=>el.removeEventListener('click',no,{capture:true}),400);};
  addEventListener('pointerup',fin,true);addEventListener('pointercancel',fin,true);
}
// «↓ nuevos»: si estás leyendo arriba, el juego no te baja la lista (sirve también para los chats propios, que la
// redibujan entera: se mira con un MutationObserver y se devuelve el scroll a donde estabas).
function seguirScroll(el){
  const box=el.querySelector('.mc-msgs,.msgs');if(!box||box._mcSc)return;box._mcSc={abajo:true,top:0};
  const st=box._mcSc,pill=()=>{let p=el.querySelector('.mc-nuevos');if(!p){p=document.createElement('button');p.type='button';p.className='mc-nuevos';p.textContent='↓ nuevos';
      p.onclick=e=>{e.stopPropagation();st.abajo=true;box.scrollTop=box.scrollHeight;p.remove();};
      box.parentNode.insertBefore(p,box.nextSibling);}p.style.top=Math.max(0,box.offsetTop+box.clientHeight-36)+'px';return p;};
  box.addEventListener('scroll',()=>{if(box._mcIgn)return;st.abajo=box.scrollTop+box.clientHeight>=box.scrollHeight-24;st.top=box.scrollTop;if(st.abajo){const p=el.querySelector('.mc-nuevos');if(p)p.remove();}},{passive:true});
  new MutationObserver(()=>{box._mcIgn=1;if(st.abajo)box.scrollTop=box.scrollHeight;else{box.scrollTop=st.top;pill();}requestAnimationFrame(()=>{box._mcIgn=0;});}).observe(box,{childList:true,subtree:true,characterData:true});
}
function movible(el,juego,op={}){
  if(!el)return;css();const j=juego||(S.op&&S.op.juego)||'x',q=op.q||'pos';el.classList.add('mc-mov');
  if(q==='btn'){arrastrable(el,j,q,true);ponerEn(el,posLeer(j,q));requestAnimationFrame(()=>ponerEn(el,posLeer(j,q)));
    if(!el._mcRz){el._mcRz=1;addEventListener('resize',()=>{if(el.isConnected&&posLeer(j,q))ponerEn(el,posLeer(j,q));});}return;}
  // un panel de chat
  el.classList.add('mc-comp');
  const R=REG[j]||(REG[j]={j,no:0,min:false});R.el=el;R.op=Object.assign(R.op||{},op);
  const hd=el.querySelector(':scope>header');
  if(hd&&!hd.querySelector('.mc-grip')){const g=document.createElement('span');g.className='mc-grip';g.textContent='⠿';g.setAttribute('aria-hidden','true');hd.insertBefore(g,hd.firstChild);
    hd.title='Arrastrá esta barra para mover el chat';
    const x=hd.querySelector('button:last-of-type');
    const r=document.createElement('button');r.type='button';r.className='mc-rst';r.setAttribute('aria-label','Volver el chat a su lugar');r.title='Volver a su lugar';r.textContent='⟲';
    hd.insertBefore(r,x||null);
    r.onclick=e=>{e.preventDefault();e.stopPropagation();posGuardar(j,q,null);ponerEn(el,null);r.hidden=true;};
    const m=document.createElement('button');m.type='button';m.className='mc-minb';m.setAttribute('aria-label','Minimizar el chat');m.title='Minimizar';m.innerHTML='<i></i>';
    hd.insertBefore(m,x||null);
    m.onclick=e=>{e.preventDefault();e.stopPropagation();minimizar(j);};
    // ✕ cierra del todo (sin barrita)
    if(x&&!x._mcX){x._mcX=1;x.addEventListener('click',()=>{R.min=false;minGuardar(j,false);miniOcultar(j);},true);}}
  const rst=hd&&hd.querySelector('.mc-rst');
  // se abrió (desde el botón del juego o desde la barrita): ya no está minimizado
  if(!el.hidden&&R.min){R.min=false;minGuardar(j,false);}
  miniOcultar(j);R.no=0;
  const aplicarPos=()=>{let o=posLeer(j,q);if(R.desde){o=R.desde;}ponerEn(el,o);if(rst)rst.hidden=!posLeer(j,q);};
  aplicarPos();requestAnimationFrame(()=>{aplicarPos();R.desde=null;});
  seguirScroll(el);
  arrastrable(el,j,q,false,()=>{if(rst)rst.hidden=false;});
  if(!el._mcRz){el._mcRz=1;
    const re=()=>{if(el.isConnected&&!el.hidden)ponerEn(el,posLeer(j,q));};addEventListener('resize',re);
    if(window.visualViewport){visualViewport.addEventListener('resize',re);visualViewport.addEventListener('scroll',re);}
    // al escribir, que el campo quede a la vista con el teclado abierto
    el.addEventListener('focusin',e=>{if(e.target.matches('input,textarea'))setTimeout(re,350);});}
}
/* ── La barrita del chat minimizado ── */
function miniEl(j){const R=REG[j];if(!R)return null;
  // si el juego tiene su botón flotante del chat (el de acá, sin lugar en la barra de arriba), ése hace de barrita
  if(R.op&&R.op.ancla){const a=R.op.ancla();if(a&&a.isConnected&&!a.hidden)return a;}
  if(R.mini&&R.mini.isConnected)return R.mini;
  css();const b=document.createElement('button');b.type='button';b.className='mc-mini';b.setAttribute('aria-label','Abrir el chat de la mesa');
  b.innerHTML='<span class="mc-grip" aria-hidden="true">⠿</span>💭 <b>Chat</b><span class="mc-mini-n"></span>';
  ['pointerdown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>e.stopPropagation(),{passive:true}));
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();restaurar(j);});
  document.body.appendChild(b);arrastrable(b,j,'mini',true,()=>miniBurbLugar(j));R.mini=b;return b;}
function miniPoner(j){const R=REG[j],b=R&&R.mini;if(!b||!b.isConnected)return;const o=posLeer(j,'mini');if(o)ponerEn(b,o);}
function miniOcultar(j){const R=REG[j];if(!R)return;if(R.mini)R.mini.hidden=true;if(R.mb)R.mb.classList.remove('on');}
function miniBadge(j){const R=REG[j];if(!R)return;if(R.mini){const n=R.mini.querySelector('.mc-mini-n');if(n)n.textContent=R.no?String(Math.min(R.no,99)):'';}}
function miniVisible(j){const R=REG[j];if(!R||!R.min)return false;let v=true;try{if(R.op.visible)v=!!R.op.visible();else if(R.op.btn){const b=typeof R.op.btn==='function'?R.op.btn():R.op.btn;v=!!(b&&!b.hidden);}}catch(_){}return v;}
function minimizar(j){const R=REG[j];if(!R||!R.el)return;
  const p=R.el,r=p.getBoundingClientRect(),abajo=r.top+r.height/2>innerHeight/2,izq=r.left+r.width/2<innerWidth/2;
  try{R.op.cerrar?R.op.cerrar():(p.hidden=true);}catch(_){p.hidden=true;}
  p.hidden=true;R.min=true;R.no=0;minGuardar(j,true);
  const b=miniEl(j);if(!b)return;
  if(b===R.mini){b.hidden=false;miniBadge(j);
    // la barrita queda donde estaba el panel: en su esquina de abajo (o de arriba) del lado donde estaba
    const w=b.offsetWidth||110,h=b.offsetHeight||40;encerrar(b,izq?r.left:r.right-w,abajo?r.bottom-h:r.top);posGuardar(j,'mini',centro(b));}
}
function restaurar(j){const R=REG[j];if(!R)return;const b=R.mini&&!R.mini.hidden?R.mini:null;
  // el panel se abre «hacia donde hay lugar», pegado a la barrita
  if(b){const r=b.getBoundingClientRect(),p=R.el,w=(p&&p.offsetWidth)||Math.min(340,innerWidth-20),h=(p&&p.offsetHeight)||260;
    const abajo=r.top+r.height/2>innerHeight/2,izq=r.left+r.width/2<innerWidth/2;
    const left=izq?r.left:r.right-w,top=abajo?r.bottom-h:r.top;
    R.desde={cx:Math.max(0,Math.min(1,(left+w/2)/innerWidth)),cy:Math.max(0,Math.min(1,(top+h/2)/innerHeight))};posGuardar(j,'pos',R.desde);}
  R.min=false;minGuardar(j,false);miniOcultar(j);R.no=0;
  try{if(R.op.abrir)R.op.abrir();else if(R.el){R.el.hidden=false;movible(R.el,j,R.op);}}catch(_){}
}
// Globito arriba de la barrita (o abajo si está pegada arriba); tocarlo abre el chat.
function miniBurb(j,de,txt){const R=REG[j];if(!R)return;css();
  if(!R.mb||!R.mb.isConnected){R.mb=document.createElement('button');R.mb.type='button';R.mb.className='mc-mburb';document.body.appendChild(R.mb);
    ['pointerdown','touchstart'].forEach(ev=>R.mb.addEventListener(ev,e=>e.stopPropagation(),{passive:true}));
    R.mb.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();restaurar(j);});}
  R.mb.innerHTML=`<b>${esc(de)}:</b>${esc(txt)}`;miniBurbLugar(j);
  requestAnimationFrame(()=>R.mb&&R.mb.classList.add('on'));clearTimeout(R.mbT);R.mbT=setTimeout(()=>{if(R.mb)R.mb.classList.remove('on');},4500);}
function miniBurbLugar(j){const R=REG[j];if(!R||!R.mb)return;const a=miniEl(j);if(!a)return;const r=a.getBoundingClientRect(),m=R.mb,w=m.offsetWidth||220,h=m.offsetHeight||44;
  const arriba=r.top-h-8>topSeguro();const izq=r.left+r.width/2<innerWidth/2;
  m.classList.toggle('abajo',!arriba);m.classList.toggle('izq',izq);
  encerrar(m,izq?r.left:r.right-w,arriba?r.top-h-8:r.bottom+8);}
// Un mensaje nuevo que llegó con el chat minimizado (los chats propios lo avisan con MESA_CHAT.nuevo).
function nuevo(j,de,txt){const R=REG[j];if(!R||!R.min||!miniVisible(j))return false;txt=limpiar(txt);if(!txt)return false;
  R.no++;const b=miniEl(j);if(b===R.mini){b.hidden=false;miniBadge(j);}miniBurb(j,String(de||'').slice(0,30),txt);return true;}
// Cada segundo: la barrita se ve sólo mientras el juego tenga mesa en línea.
setInterval(()=>{for(const j in REG){const R=REG[j];if(!R.min){if(R.mini&&!R.mini.hidden)miniOcultar(j);continue;}
  const v=miniVisible(j),b=miniEl(j);if(!b||b!==R.mini)continue;if(v&&b.hidden){b.hidden=false;miniPoner(j);miniBadge(j);}else if(!v&&!b.hidden)miniOcultar(j);}},1000);
addEventListener('resize',()=>{for(const j in REG){miniPoner(j);if(REG[j].mb&&REG[j].mb.classList.contains('on'))miniBurbLugar(j);}});
// Dónde sale el globito con el chat cerrado (no minimizado): del lado y a la altura donde dejaste el chat.
function burbLugar(){if(!S.burb)return;const o=posLeer(S.op&&S.op.juego,'pos');const b=S.burb.style;
  if(!o){b.left=b.right=b.top=b.bottom='';S.burb.style.borderRadius='';return;}
  const y=Math.max(topSeguro(),Math.min(innerHeight-120,o.cy*innerHeight-60));b.top=y+'px';b.bottom='auto';
  if(o.cx<.5){b.left=`max(${MARG}px, env(safe-area-inset-left))`;b.right='auto';S.burb.style.borderRadius='14px 14px 14px 4px';}else{b.right=`max(${MARG}px, env(safe-area-inset-right))`;b.left='auto';S.burb.style.borderRadius='';}}
function nota(){const n=S.op&&S.op.nota;try{return (typeof n==='function'?n():n)||'Sólo lo ve la gente de esta mesa y se borra al terminar.';}catch(_){return '';}}
function abrir(){
  if(!S.op)return;css();
  if(!S.panel||!S.panel.isConnected){S.panel=document.createElement('div');S.panel.className='mc-panel';S.panel.id='mc-panel';S.panel.setAttribute('role','dialog');S.panel.setAttribute('aria-label','Chat de la mesa');document.body.appendChild(S.panel);
    ['pointerdown','touchstart','keydown','keyup','wheel'].forEach(ev=>S.panel.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));}
  const eqs=!!(S.op.equipos&&S.op.equipos());if(!eqs)S.eq=false;
  S.panel.innerHTML=`<header><b>Chat de la mesa</b><button type="button" class="mc-x" aria-label="Cerrar">✕</button></header><div class="mc-msgs" aria-live="polite"></div>
    ${eqs?`<div class="mc-a"><button type="button" data-a="0" class="${S.eq?'':'on'}">A todos</button><button type="button" data-a="1" class="${S.eq?'on':''}">A mi equipo</button></div>`:''}
    ${formHtml(eqs&&S.eq?'Escribile a tu equipo':'Escribile a la mesa')}`;
  S.panel.hidden=false;S.abierto=true;S.no=0;dibujar();ocultarBurb();
  movible(S.panel,S.op.juego,{abrir,cerrar,ancla:()=>S.btn&&S.btn.classList.contains('mc-flot')?S.btn:null,visible:()=>!!(S.btn&&!S.btn.hidden)});
  S.panel.querySelector('.mc-x').onclick=cerrar;
  S.panel.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{S.eq=b.dataset.a==='1';abrir();});
  cablearForm(S.panel,cerrar);
}
function cerrar(){S.abierto=false;if(S.panel)S.panel.hidden=true;badge();}
function mandar(txt){
  txt=limpiar(txt);if(!txt||!S.op)return false;
  const now=Date.now();if(now-S.ult<600)return false;S.ult=now;
  const eq=S.eq&&S.op.equipos&&S.op.equipos()?1:0;
  try{S.op.enviar({t:'mchat',txt,eq});}catch(_){}
  agregar({de:'Vos',txt,yo:true,eq});return true;
}
function agregar(m){S.msgs.push(m);if(S.msgs.length>80)S.msgs=S.msgs.slice(-80);if(!S.abierto&&!enEspera()&&!m.yo&&!m.sis)S.no++;dibujar();}
function ocultarBurb(){if(S.burb)S.burb.classList.remove('on');clearTimeout(S.burbT);}
function burbuja(m){
  if(S.abierto)return;css();
  if(!S.burb||!S.burb.isConnected){S.burb=document.createElement('div');S.burb.className='mc-burb';S.burb.setAttribute('role','status');document.body.appendChild(S.burb);}
  S.burb.innerHTML=`${m.eq?'<span style="color:#7ce9e5">(equipo) </span>':''}<b>${esc(m.de)}:</b>${esc(m.txt)}`;burbLugar();
  requestAnimationFrame(()=>S.burb&&S.burb.classList.add('on'));clearTimeout(S.burbT);S.burbT=setTimeout(ocultarBurb,4200);

function recibir(m){

const REV=d=>(d+2)&3;
const seg=s=>Math.round(s*FPS);
const ESQUINA=450;                                 // tolerancia para doblar antes/después del centro (en unidades)

/* ── Dificultades (velocidades en casillas por segundo; tiempos en segundos) ── */
const PRESETS={
  facil:  {n:'Fácil',  jug:7.2,enem:6.0,asus:3.6,mate:7,  sale:[0,5,10,15],modos:[9,16,9,16,7]},
  normal: {n:'Normal', jug:7.6,enem:6.8,asus:4.2,mate:5,  sale:[0,3,7,11],modos:[7,20,7,20,5]},
  dificil:{n:'Difícil',jug:8.0,enem:7.6,asus:4.8,mate:3.5,sale:[0,1,3,5], modos:[4,24,4,24,2]}
};
const MATE_MIN={facil:2,normal:1.5,dificil:1};
const TOPE_JUG=8.6,TOPE_ENEM=8.2;
const VUELVE=15,TUNEL=.5,CASA_V=4;
const PUNTOS={semilla:10,mate:50,captura:[200,400,800,1600]};
// El bonus cambia con el nivel (lo que vale y cómo se ve): k es el dibujo
const FRUTAS=[{k:'torta',n:'Torta frita',p:100},{k:'empanada',n:'Empanada',p:300},{k:'alfajor',n:'Alfajor',p:500},{k:'choclo',n:'Choclo',p:700},
  {k:'sandia',n:'Sandía',p:1000},{k:'pastelito',n:'Pastelito',p:2000},{k:'mate',n:'Mate dorado',p:3000},{k:'estrella',n:'Estrella',p:5000}];
const frutaDe=n=>FRUTAS[Math.min(FRUTAS.length-1,Math.max(0,n-1))];
const NOMBRES=[{id:'colorado',n:'Colorado',c:'#ff3b3b',bicho:'zorro'},{id:'violeta',n:'Violeta',c:'#ff8be8',bicho:'lechuza'},
  {id:'turquesa',n:'Turquesa',c:'#2ef0ea',bicho:'tero'},{id:'ocre',n:'Ocre',c:'#ffab3d',bicho:'peludo'}];

function rngSig(a){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return [a,((t^(t>>>14))>>>0)/4294967296];}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

/* ── Mapas ── */
const pasaC=c=>c!=='#'&&c!=='H'&&c!=='-'&&c!==undefined;
function leer(m){
  const H=m.filas.length,W=m.filas[0].length,t=[];let ini=null,bonus=null,puerta=null;const casa=[],tuneles=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const c=m.filas[y][x];t.push(c);
    if(c==='P')ini=[x,y];if(c==='B')bonus=[x,y];if(c==='-')puerta=[x,y];if(c==='H')casa.push([x,y]);if(c==='T'&&x===0)tuneles.push(y);}
  // largo de cada túnel (desde el borde hasta el primer cruce): ahí los perseguidores van más lento
  const tl={};for(const y of tuneles){let x=0;while(x<W/2&&pasaC(t[y*W+x])&&!pasaC(t[(y-1)*W+x])&&!pasaC(t[(y+1)*W+x]))x++;tl[y]=Math.max(1,x);}
  return {id:m.id,n:m.n,idea:m.idea||'',v:m.v||1,W,H,t,ini,bonus,puerta,casa,tuneles,tl};
}
function celda(M,x,y){if(y<0||y>=M.H)return '#';if(x<0||x>=M.W){if(M.t[y*M.W]==='T'){x=(x+M.W)%M.W;}else return '#';}return M.t[y*M.W+x];}
function vecino(M,x,y,d){let nx=x+DIRS[d][0],ny=y+DIRS[d][1];if(nx<0||nx>=M.W){if(celda(M,0,y)==='T')nx=(nx+M.W)%M.W;else return null;}if(ny<0||ny>=M.H)return null;return pasaC(M.t[ny*M.W+nx])?[nx,ny]:null;}
// Medidas de un mapa (para el validador y las pruebas): cruces, vueltas posibles (ciclos), pasillo más largo sin cruce
function metricas(M){let V=0,E=0,cruces=0,deg=0,cuad=0;const nb=(x,y)=>{let n=0;for(let d=0;d<4;d++)if(vecino(M,x,y,d))n++;return n;};
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){if(!pasaC(M.t[y*M.W+x]))continue;V++;const n=nb(x,y);E+=n;deg+=n;if(n>=3)cruces++;
    if(x<M.W-1&&y<M.H-1&&pasaC(M.t[y*M.W+x+1])&&pasaC(M.t[(y+1)*M.W+x])&&pasaC(M.t[(y+1)*M.W+x+1]))cuad++;}
  let largo=0;for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){if(!pasaC(M.t[y*M.W+x])||nb(x,y)===2)continue;
    for(let d=0;d<4;d++){let v=vecino(M,x,y,d);if(!v)continue;let px=x,py=y,l=1;while(v&&nb(v[0],v[1])===2&&l<200){let sig=null;for(let k=0;k<4;k++){const w=vecino(M,v[0],v[1],k);if(w&&(w[0]!==px||w[1]!==py)){sig=w;break;}}px=v[0];py=v[1];v=sig;l++;}largo=Math.max(largo,l);}}
  return {casillas:V,cruces,gradoMedio:+(deg/V).toFixed(2),vueltas:E/2-V+1,pasilloMasLargo:largo,cuadrados:cuad};}
// Validador: lo que tiene que cumplir un mapa para jugarse
function validar(m){
  const E=[];let M;try{M=leer(m);}catch(e){return ['no se pudo leer'];}
  if(!m.id)E.push('sin id');
  if(M.W<19||M.W>29||M.W%2===0||M.H<21||M.H>33)E.push('tamaño raro: '+M.W+'×'+M.H);
  if(!m.filas.every(f=>f.length===M.W))E.push('filas de distinto largo');
  if(m.filas.join('').split('P').length!==2)E.push('tiene que haber exactamente una salida del jugador');
  if(!M.puerta)E.push('sin puerta del corral');
  if(M.casa.length<4)E.push('corral chico');
  if(!M.bonus)E.push('sin lugar para el bonus');
  for(let y=0;y<M.H;y++){const a=celda(M,0,y)==='T',b=M.t[y*M.W+M.W-1]==='T';if(a!==b)E.push('túnel sin pareja en la fila '+y);}
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++){const c=M.t[y*M.W+x];if((x===0||y===0||x===M.W-1||y===M.H-1)&&c!=='#'&&c!=='T')E.push('borde abierto en '+x+','+y);}
  for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++)if(pasaC(M.t[y*M.W+x])!==pasaC(M.t[y*M.W+M.W-1-x]))E.push('no es simétrico en '+x+','+y);
  const mates=m.filas.join('').split('o').length-1;if(mates!==4)E.push('tiene que tener 4 mates');
  if(M.ini){
    const vis=new Set([M.ini[1]*M.W+M.ini[0]]),q=[M.ini];
    while(q.length){const [x,y]=q.pop();for(let d=0;d<4;d++){const v=vecino(M,x,y,d);if(!v)continue;const k=v[1]*M.W+v[0];if(!vis.has(k)){vis.add(k);q.push(v);}}}
    for(let i=0;i<M.t.length;i++)if(pasaC(M.t[i])&&!vis.has(i))E.push('casilla suelta en '+(i%M.W)+','+Math.floor(i/M.W));
    for(let i=0;i<M.t.length;i++)if(pasaC(M.t[i])){const x=i%M.W,y=Math.floor(i/M.W);let n=0;for(let d=0;d<4;d++)if(vecino(M,x,y,d))n++;if(n<2)E.push('callejón sin salida en '+x+','+y);}
    if(M.puerta&&!vecino(M,M.puerta[0],M.puerta[1],0))E.push('la puerta no da a un pasillo');
    const me=metricas(M);
    if(me.cuadrados)E.push('pasillo de dos de ancho ('+me.cuadrados+')');
    if(me.vueltas<20)E.push('pocas vueltas para escaparse ('+me.vueltas+')');
    if(me.cruces<40)E.push('pocos cruces ('+me.cruces+')');
  }
  return E;
}

/* ── Configuración de una partida ──
   op = {modo:'rapida'|'dia'|'practica'|'libre'|'campana'|'demo', dif, mapas:[índices], semilla, vidas, enemigos, vJug,
         vEnem, mate (segundos), niveles, limite (segundos activos), invulnerable, acel (multiplica las velocidades),
         extra (puntos para la vida extra; 0 = sin vida extra)} */
function config(op){
  const P=PRESETS[op.dif]||PRESETS.normal,ac=op.acel||1;
  return {modo:op.modo||'rapida',dif:PRESETS[op.dif]?op.dif:'normal',mapas:(op.mapas&&op.mapas.length?op.mapas:[0]).slice(),semilla:(op.semilla>>>0)||1,
    vidas:Math.max(1,Math.min(9,op.vidas||3)),enemigos:Math.max(1,Math.min(4,op.enemigos||4)),
    vJug:(op.vJug||P.jug)*ac,vEnem:(op.vEnem||P.enem)*ac,vAsus:P.asus*ac,mate:op.mate!=null?Math.max(0,Math.min(12,op.mate)):P.mate,
    sale:P.sale.slice(),modos:P.modos.slice(),niveles:Math.max(1,Math.min(10,op.niveles||op.mapas&&op.mapas.length||1)),
    limite:op.limite||0,invulnerable:!!op.invulnerable,libre:!!op.libre,extra:op.extra!=null?op.extra:10000};
}
function velocidades(S){const C=S.cfg,n=S.nivel-1;
  // cada nivel: +0,08 al jugador y +0,12 a los perseguidores (con tope); el mate dura 0,4 s menos (con un mínimo)
  const vj=Math.min(C.vJug+.08*n,Math.max(C.vJug,TOPE_JUG)),ve=Math.min(C.vEnem+.12*n,Math.max(C.vEnem,TOPE_ENEM));
  const mate=C.mate<=0?0:Math.max(Math.min(C.mate,MATE_MIN[C.dif]),C.mate-.4*n);
  return {jug:Math.round(vj*U/FPS),enem:Math.round(ve*U/FPS),asus:Math.round(C.vAsus*U/FPS),
    vuelve:Math.round(VUELVE*U/FPS),casa:Math.round(CASA_V*U/FPS),mate:seg(mate)};}

/* ── Partida ── */
function crear(op,mapas){
  const cfg=config(op);
  const S={cfg,mapasDef:mapas,nivel:1,vidas:cfg.vidas,puntos:0,paso:0,activo:0,estado:'cuenta',t:seg(2),fin:null,congela:0,extraDada:false,
    a:cfg.semilla>>>0,ev:[],capturas:0,vidasPerdidas:0,mapasLimpios:0,recogidos:0,maxCombo:0,bonusComidos:0,mates:0,limpioSinMorir:0,muerteNivel:false};
  cargarNivel(S);return S;
}
function cargarNivel(S){
  const idx=S.cfg.mapas[(S.nivel-1)%S.cfg.mapas.length],M=leer(S.mapasDef[idx]);
  S.M=M;S.mapaIdx=idx;S.obj=new Uint8Array(M.W*M.H);let tot=0;
  for(let i=0;i<M.t.length;i++){const c=M.t[i];if(c==='.'){S.obj[i]=1;tot++;}else if(c==='o'){S.obj[i]=2;tot++;}}
  // Mate en 0 segundos: sus casillas son semillas comunes (y no se puede correr a nadie)
  if(S.cfg.mate<=0)for(let i=0;i<S.obj.length;i++)if(S.obj[i]===2)S.obj[i]=1;
  S.total=tot;S.quedan=tot;S.umbrales=[Math.ceil(tot*.35),Math.ceil(tot*.75)];S.umbralHecho=[false,false];S.recNivel=0;S.tNivel=0;S.muerteNivel=false;
  // rincones de patrulla: afuera del mapa, en cada esquina (se llevan a la casilla más cercana)
  S.esq=[[M.W-2,-3],[1,-3],[M.W-1,M.H+2],[0,M.H+2]];
  S.v=velocidades(S);reposicionar(S);
}
function reposicionar(S){
  const M=S.M,[px,py]=M.ini;
  S.jug={px:px*U,py:py*U,dir:1,want:-1,mov:true,boca:0};
  const ys=M.casa.map(c=>c[1]),cx=M.puerta[0],cy=Math.round((Math.min(...ys)+Math.max(...ys))/2);
  const slots=[[cx,M.puerta[1]-1],[cx-2,cy],[cx,cy],[cx+2,cy]];
  S.casaCentro=[cx,cy];S.salida=[M.puerta[0],M.puerta[1]-1];
  // el Colorado arranca afuera, arriba del corral (como en las maquinitas); los otros adentro
  S.enem=NOMBRES.slice(0,S.cfg.enemigos).map((N,i)=>({i,id:N.id,px:slots[i][0]*U,py:slots[i][1]*U,dir:1,st:i===0?'patrulla':'casa',sale:seg(S.cfg.sale[i]),rev:false,ya:false}));
  S.modoIdx=0;S.modoT=seg(S.cfg.modos[0]);S.modo='patrulla';S.mateT=0;S.combo=0;S.bonus=null;S.prot=0;S.reloj=0;S.congela=0;
}
const tile=v=>Math.round(v/U);
function enCentro(e){return e.px%U===0&&e.py%U===0;}
function emit(S,tipo,o){S.ev.push({tipo,paso:S.paso,...(o||{})});}
function azar(S){const [a,r]=rngSig(S.a);S.a=a;return r;}
const tx=(M,px)=>((Math.round(px/U)%M.W)+M.W)%M.W;

// Mueve un perseguidor «sp» unidades; en cada centro de casilla pregunta a «decide» hacia dónde seguir (null = se queda)
function mover(S,e,sp,decide,para){
  const M=S.M,WU=M.W*U;let rem=sp,guarda=0;
  while(rem>0&&guarda++<8){
    if(enCentro(e)){if(para&&e.px===para[0]*U&&e.py===para[1]*U)return true;   // llegó a donde iba (los ojos a la puerta)
      const nd=decide(e,e.px/U,e.py/U);if(nd==null){e.mov=false;return;}e.dir=nd;e.mov=true;}
    const [dx,dy]=DIRS[e.dir],r=dx?((e.px%U)+U)%U:((e.py%U)+U)%U;
    const d=dx?(dx>0?U-r:(r||U)):(dy>0?U-r:(r||U));
    const s=Math.min(rem,d);e.px+=dx*s;e.py+=dy*s;rem-=s;
    if(e.px<0)e.px+=WU;if(e.px>=WU)e.px-=WU;
  }
}
// El jugador: dobla hasta ESQUINA unidades antes o después del centro del cruce y corta en diagonal; la reversa es
// inmediata; contra una pared se queda en el centro con la orden guardada. Nunca atraviesa una pared ni una esquina.
function moverJug(S,j,sp){
  const M=S.M,WU=M.W*U;
  if(j.want>=0&&j.want!==j.dir){
    if(j.want===REV(j.dir)){j.dir=j.want;j.want=-1;}
    else{const cx=Math.round(j.px/U),cy=Math.round(j.py/U),along=DIRS[j.dir][0]?j.px-cx*U:j.py-cy*U;
      if(Math.abs(along)<=ESQUINA&&vecino(M,((cx%M.W)+M.W)%M.W,cy,j.want)){j.dir=j.want;j.want=-1;}}
  }else if(j.want===j.dir)j.want=-1;
  const [dx,dy]=DIRS[j.dir];
  // lo que quedó del otro eje después de doblar se corrige sin gastar avance (por eso doblar bien es más rápido)
  if(dx){const off=j.py-Math.round(j.py/U)*U;if(off)j.py-=Math.sign(off)*Math.min(sp,Math.abs(off));}
  else{const off=j.px-Math.round(j.px/U)*U;if(off)j.px-=Math.sign(off)*Math.min(sp,Math.abs(off));}
  const cx=Math.round(j.px/U),cy=Math.round(j.py/U),a=dx?(j.px-cx*U)*dx:(j.py-cy*U)*dy;
  const libre=vecino(M,((cx%M.W)+M.W)%M.W,cy,j.dir);
  const mov=libre?sp:Math.max(0,Math.min(sp,-a));
  j.px+=dx*mov;j.py+=dy*mov;j.mov=mov>0;
  if(j.px<0)j.px+=WU;if(j.px>=WU)j.px-=WU;
  return mov;
}
// Distancias por caminos desde una casilla (para la IA). Se guardan por paso.
function distDesde(S,x,y){const k=x+','+y;S._dc=S._dc&&S._dc.p===S.paso?S._dc:{p:S.paso};if(S._dc[k])return S._dc[k];
  const M=S.M,D=new Int16Array(M.W*M.H).fill(-1),q=[[x,y]];D[y*M.W+x]=0;
  for(let h=0;h<q.length;h++){const [cx,cy]=q[h],b=D[cy*M.W+cx];for(let d=0;d<4;d++){const v=vecino(M,cx,cy,d);if(!v)continue;const i=v[1]*M.W+v[0];if(D[i]<0){D[i]=b+1;q.push(v);}}}
  return (S._dc[k]=D);}
// Un objetivo en una pared se lleva a la casilla transitable más cercana (desempate: fila y después columna)
function proyectar(S,x,y){const M=S.M;x=Math.max(0,Math.min(M.W-1,x));y=Math.max(0,Math.min(M.H-1,y));
  if(pasaC(M.t[y*M.W+x]))return [x,y];
  for(let r=1;r<M.W+M.H;r++){let best=null;for(let dy=-r;dy<=r;dy++){const yy=y+dy;if(yy<0||yy>=M.H)continue;const rx=r-Math.abs(dy);for(const xx of rx?[x-rx,x+rx]:[x]){if(xx<0||xx>=M.W)continue;if(pasaC(M.t[yy*M.W+xx])&&(!best||yy<best[1]||(yy===best[1]&&xx<best[0])))best=[xx,yy];}}if(best)return best;}
  return [x,y];}
// El Colorado se apura cuando quedan pocas semillas (y ya no se va a su rincón)
const apuro=S=>S.quedan<=Math.max(8,Math.round(S.total*.05))?2:S.quedan<=Math.max(16,Math.round(S.total*.1))?1:0;
function objetivo(S,e){
  const j=S.jug,jx=tx(S.M,j.px),jy=tile(j.py),[dx,dy]=DIRS[j.dir];
  if(S.modo==='patrulla'&&!(e.i===0&&apuro(S)))return proyectar(S,...S.esq[e.i]);
  if(e.i===0)return [jx,jy];
  if(e.i===1)return proyectar(S,jx+4*dx,jy+4*dy);
  if(e.i===2){const c=S.enem[0]||e,cx=tx(S.M,c.px),cy=tile(c.py),p2x=jx+2*dx,p2y=jy+2*dy;return proyectar(S,2*p2x-cx,2*p2y-cy);}
  const D=distDesde(S,jx,jy),dd=D[tile(e.py)*S.M.W+tx(S.M,e.px)];
  return dd>7||dd<0?[jx,jy]:proyectar(S,...S.esq[3]);
}
function decideEnem(S){return (e,x,y)=>{
  const M=S.M,legal=[];for(let d=0;d<4;d++)if(vecino(M,x,y,d))legal.push(d);
  if(!legal.length)return null;
  if(e.rev){e.rev=false;const r=REV(e.dir);if(legal.includes(r))return r;}
  let ops=legal.filter(d=>d!==REV(e.dir));if(!ops.length)ops=legal;
  if(e.st==='asusta'){return ops[Math.floor(azar(S)*ops.length)];}
  // Los ojos vuelven por el camino más corto. Los demás eligen en cada cruce la salida que los deja más cerca (en línea
  // recta) de su objetivo, sin mirar más allá: así presionan y cortan caminos, pero se los puede engañar dando la vuelta
  // a una manzana (si fueran perfectos, no habría escape).
  if(e.st==='vuelve'){const D=distDesde(S,S.salida[0],S.salida[1]);let best=ops[0],bd=1e9;for(const d of ops){const v=vecino(M,x,y,d),dd=D[v[1]*M.W+v[0]];const k=dd<0?9999:dd;if(k<bd){bd=k;best=d;}}return best;}
  const [tx2,ty2]=objetivo(S,e);
  let best=ops[0],bd=1e18;for(const d of ops){const nx=x+DIRS[d][0],ny=y+DIRS[d][1],k=(nx-tx2)*(nx-tx2)+(ny-ty2)*(ny-ty2);if(k<bd){bd=k;best=d;}}
  return best;};}
// Movimiento guionado dentro del corral (entrar y salir por la puerta): primero en x, después en y
function irA(e,tx2,ty2,sp){let rem=sp;tx2*=U;ty2*=U;
  while(rem>0){if(e.px!==tx2){const s=Math.min(rem,Math.abs(tx2-e.px));e.px+=Math.sign(tx2-e.px)*s;e.dir=tx2>e.px?3:1;rem-=s;}
    else if(e.py!==ty2){const s=Math.min(rem,Math.abs(ty2-e.py));e.py+=Math.sign(ty2-e.py)*s;e.dir=ty2>e.py?2:0;rem-=s;}else return true;}
  return e.px===tx2&&e.py===ty2;}
function enTunel(S,e){const y=tile(e.py);if(!(y in S.M.tl)||e.py%U!==0)return false;const x=tx(S.M,e.px),l=S.M.tl[y];return x<l||x>=S.M.W-l;}

// Distancia mínima entre dos movimientos rectos en un paso (para que un cruce de frente no pase de largo)
function contacto(a0,a1,b0,b1,WU){
  const wr=v=>{v=((v%WU)+WU)%WU;return v>WU/2?v-WU:v;};
  const r0x=wr(b0[0]-a0[0]),r0y=b0[1]-a0[1],r1x=wr(b1[0]-a1[0]),r1y=b1[1]-a1[1];
  if(Math.abs(r1x-r0x)>2*U||Math.abs(r1y-r0y)>2*U)return Math.hypot(r1x,r1y);   // alguien pasó por un túnel
  const vx=r1x-r0x,vy=r1y-r0y,vv=vx*vx+vy*vy;let t=vv?-(r0x*vx+r0y*vy)/vv:0;t=Math.max(0,Math.min(1,t));
  return Math.hypot(r0x+vx*t,r0y+vy*t);
}

/* ── Un paso (1/60 s). dir: 0..3 para pedir dirección, -1 nada ── */
function paso(S,dir){
  S.ev.length=0;S.paso++;
  if(S.estado==='fin')return S;
  if(dir>=0&&dir<4)S.jug.want=dir;
  if(S.estado==='cuenta'){if(--S.t<=0){S.estado='juega';S.prot=seg(.6);emit(S,'arranca');if(S.pendLimpio){S.pendLimpio=false;nivelLimpio(S);}}return S;}
  if(S.estado==='muerte'){if(--S.t<=0){if(S.vidas<=0){terminar(S,'perdio');return S;}reposicionar(S);S.estado='cuenta';S.t=seg(1.6);if(S.quedan===0)S.pendLimpio=true;}return S;}
  if(S.estado==='nivel'){if(--S.t<=0){if(S.nivel>=S.cfg.niveles){terminar(S,'gano');return S;}S.nivel++;cargarNivel(S);S.estado='cuenta';S.t=seg(1.6);emit(S,'nivel_nuevo',{nivel:S.nivel});}return S;}
  // jugando
  S.activo++;S.tNivel++;
  if(S.congela>0){S.congela--;return S;}             // después de comerse a uno: todo quieto un ratito
  const M=S.M,W=M.W,j=S.jug,j0=[j.px,j.py];
  if(moverJug(S,j,S.v.jug))j.boca++;
  // recoger
  const cx=tx(M,j.px),cy=tile(j.py),i=cy*W+cx;
  if(S.obj[i]){const o=S.obj[i];S.obj[i]=0;S.quedan--;S.recogidos++;S.recNivel++;
    if(o===1){S.puntos+=PUNTOS.semilla;emit(S,'semilla',{x:cx,y:cy});}
    else{S.puntos+=PUNTOS.mate;S.mates++;emit(S,'mate',{x:cx,y:cy});activarMate(S);}
    const col=S.total-S.quedan;
    for(let u=0;u<2;u++)if(!S.umbralHecho[u]&&col>=S.umbrales[u]){S.umbralHecho[u]=true;const F=frutaDe(S.nivel);S.bonus={x:M.bonus[0],y:M.bonus[1],t:seg(9),v:F.p,k:F.k,n:F.n};emit(S,'bonus_aparece',{k:F.k});}}
  if(S.bonus){if(cx===S.bonus.x&&cy===S.bonus.y){S.puntos+=S.bonus.v;S.bonusComidos++;emit(S,'bonus',{x:cx,y:cy,pts:S.bonus.v,k:S.bonus.k});S.bonus=null;}else if(--S.bonus.t<=0){S.bonus=null;emit(S,'bonus_se_va');}}
  // mate y reloj de patrulla/persecución
  if(S.mateT>0){if(--S.mateT<=0){for(const e of S.enem)if(e.st==='asusta')e.st=S.modo;S.combo=0;emit(S,'mate_fin');}else if(S.mateT===seg(1.5))emit(S,'mate_aviso');}
  else if(S.modoT>0&&--S.modoT<=0){S.modoIdx++;S.modo=S.modoIdx%2?'persigue':'patrulla';S.modoT=S.modoIdx<S.cfg.modos.length?seg(S.cfg.modos[S.modoIdx]):0;
    for(const e of S.enem)if(e.st==='patrulla'||e.st==='persigue'){e.st=S.modo;e.rev=true;}}
  if(S.prot>0)S.prot--;
  // perseguidores
  S.reloj++;const dec=decideEnem(S),pos0=[],ap=apuro(S);
  for(const e of S.enem){pos0.push([e.px,e.py]);
    if(e.st==='casa'){if(S.reloj>=e.sale&&!S.enem.some(o=>o.st==='sale')){e.st='sale';}else continue;}
    if(e.st==='sale'){if(irA(e,S.salida[0],S.salida[1],S.v.casa)){e.st=S.mateT>0&&e.ya?'asusta':S.modo;e.dir=1;emit(S,'sale',{i:e.i});}continue;}
    if(e.st==='entra'){if(irA(e,S.casaCentro[0],S.casaCentro[1],S.v.casa)){e.st='casa';e.sale=S.reloj+seg(1);e.ya=true;}continue;}
    if(e.st==='vuelve'){if(mover(S,e,S.v.vuelve,dec,S.salida)||(e.px===S.salida[0]*U&&e.py===S.salida[1]*U))e.st='entra';continue;}
    let sp=e.st==='asusta'?S.v.asus:S.v.enem;
    if(e.i===0&&ap&&e.st!=='asusta')sp=Math.round(sp*(ap===2?1.1:1.05));
    if(enTunel(S,e))sp=Math.round(sp*TUNEL);
    mover(S,e,sp,dec);}
  // contactos (protección después de morir: ni captura ni daño)
  let muere=false;
  if(S.prot<=0){for(let k=0;k<S.enem.length;k++){const e=S.enem[k];if(e.st!=='patrulla'&&e.st!=='persigue'&&e.st!=='asusta')continue;
    const d=contacto(j0,[j.px,j.py],pos0[k],[e.px,e.py],W*U);if(d>.5*U)continue;
    if(e.st==='asusta'){const p=PUNTOS.captura[Math.min(3,S.combo)];S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);S.puntos+=p;S.capturas++;e.st='vuelve';S.congela=seg(.4);
      emit(S,'captura',{i:e.i,pts:p,x:e.px/U,y:e.py/U,combo:S.combo});}
    else if(!S.cfg.invulnerable)muere=true;}}
  if(muere){S.vidas--;S.vidasPerdidas++;S.muerteNivel=true;S.estado='muerte';S.t=seg(1.5);S.bonus=null;S.mateT=0;S.congela=0;emit(S,'muere',{vidas:S.vidas});return S;}
  if(S.cfg.extra&&!S.extraDada&&S.puntos>=S.cfg.extra){S.extraDada=true;if(S.vidas<5){S.vidas++;emit(S,'vida',{vidas:S.vidas});}}
  if(S.quedan===0){nivelLimpio(S);return S;}
  if(S.cfg.limite&&S.activo>=seg(S.cfg.limite))terminar(S,'tiempo');
  return S;
}
function activarMate(S){if(S.v.mate<=0)return;S.mateT=S.v.mate;S.combo=0;emit(S,'mate_on');
  for(const e of S.enem)if(e.st==='patrulla'||e.st==='persigue'||e.st==='asusta'){if(e.st!=='asusta')e.rev=true;e.st='asusta';}}
function nivelLimpio(S){S.mapasLimpios++;if(!S.muerteNivel)S.limpioSinMorir++;S.estado='nivel';S.t=seg(1.5);S.mateT=0;S.bonus=null;S.congela=0;
  for(const e of S.enem)if(e.st==='asusta')e.st=S.modo;
  emit(S,'limpio',{nivel:S.nivel,seg:Math.round(S.tNivel/FPS),sinMorir:!S.muerteNivel});}
function terminar(S,como){S.estado='fin';S.fin=como;emit(S,'fin',{como});}

/* ── Resumen de una partida (para premios, tablas y logros) ── */
function resumen(S){return {modo:S.cfg.modo,dif:S.cfg.dif,fin:S.fin,puntos:S.puntos,nivel:S.nivel,seg:Math.round(S.activo/FPS),recogidos:S.recogidos,
  mapas:S.mapasLimpios,sinMorir:S.limpioSinMorir,capturas:S.capturas,maxCombo:S.maxCombo,vidasPerdidas:S.vidasPerdidas,bonus:S.bonusComidos,mates:S.mates};}
// ¿Vale para premios? Al menos 60 segundos activos y 30 cosas recogidas, o un mapa limpio
function valida(r){return (r.seg>=60&&r.recogidos>=30)||r.mapas>=1;}

/* ── Jugador automático (pruebas y la demo del inicio) ──
   Calcula para cada casilla quién llega antes: el corredor o el perseguidor más cercano (por caminos). Va a la semilla
   más cercana por casillas «seguras» (donde llega antes con margen); si no hay, se escapa hacia donde más ventaja tiene.
   Con el mate encendido, sale a cazar. Sirve para medir que en los mapas hay escapes. */
function bfsDesde(M,x,y,D){D.fill(-1);const q=[x,y];D[y*M.W+x]=0;for(let h=0;h<q.length;h+=2){const cx=q[h],cy=q[h+1],b=D[cy*M.W+cx];for(let d=0;d<4;d++){const v=vecino(M,cx,cy,d);if(!v)continue;const i=v[1]*M.W+v[0];if(D[i]<0){D[i]=b+1;q.push(v[0],v[1]);}}}return D;}
function auto(S){const j=S.jug,M=S.M,W=M.W,N=W*M.H;
  // la próxima casilla a la que llega (ahí se decide, como con el dedo)
  let x=tx(M,j.px),y=tile(j.py);
  if(!enCentro(j)){const [dx,dy]=DIRS[j.dir],ax=dx?(j.px-Math.round(j.px/U)*U)*dx:(j.py-Math.round(j.py/U)*U)*dy;if(ax>0){const v=vecino(M,x,y,j.dir);if(v){x=v[0];y=v[1];}}}
  const clave=y*W+x+':'+S.estado;if(S._bk===clave&&S._bd!=null&&!S.enem.some(e=>e.st==='asusta'))return S._bd;   // ya decidió para esta casilla
  S._bk=clave;S._bd=elegir();return S._bd;
  function elegir(){
  S._ad=S._ad||{P:new Int16Array(N),G:new Int16Array(N),T:new Int16Array(N)};const A=S._ad;
  bfsDesde(M,x,y,A.P);A.G.fill(32000);
  const peligro=S.enem.filter(e=>e.st==='patrulla'||e.st==='persigue');
  for(const e of peligro){bfsDesde(M,tx(M,e.px),tile(e.py),A.T);for(let i=0;i<N;i++)if(A.T[i]>=0&&A.T[i]<A.G[i])A.G[i]=A.T[i];}
  const vj=S.v.jug,ve=S.v.enem,seguro=i=>A.P[i]>=0&&(A.P[i]*ve+2*ve<A.G[i]*vj);   // llego antes que todos, con margen
  // primer paso hacia cada casilla, por casillas seguras
  const prim=new Int8Array(N).fill(-1),vis=new Uint8Array(N),q=[x,y];vis[y*W+x]=1;let meta=-1,caza=-1;
  const presa=S.mateT>seg(1)?new Set(S.enem.filter(e=>e.st==='asusta').map(e=>tile(e.py)*W+tx(M,e.px))):null;
  for(let h=0;h<q.length;h+=2){const cx=q[h],cy=q[h+1],i=cy*W+cx;
    if(h){if(presa&&caza<0&&presa.has(i))caza=i;if(meta<0&&(S.obj[i]||(S.bonus&&S.bonus.x===cx&&S.bonus.y===cy)))meta=i;}
    for(let d=0;d<4;d++){const v=vecino(M,cx,cy,d);if(!v)continue;const k=v[1]*W+v[0];if(vis[k]||(!presa&&!seguro(k)))continue;vis[k]=1;prim[k]=h?prim[i]:d;q.push(v[0],v[1]);}}
  if(caza>=0&&prim[caza]>=0)return prim[caza];
  if(meta>=0&&prim[meta]>=0){S._sinComer=0;return prim[meta];}
  // nada seguro a la vista: si hace rato que no come, se arriesga (llegar antes alcanza, sin margen)
  S._sinComer=(S._sinComer||0)+1;
  if(S._sinComer>seg(2)){const p2=new Int8Array(N).fill(-1),v2=new Uint8Array(N),q2=[x,y];v2[y*W+x]=1;let m2=-1;
    for(let h=0;h<q2.length&&m2<0;h+=2){const cx=q2[h],cy=q2[h+1],i=cy*W+cx;if(h&&S.obj[i]){m2=i;break;}
      for(let d=0;d<4;d++){const v=vecino(M,cx,cy,d);if(!v)continue;const k=v[1]*W+v[0];if(v2[k]||!(A.P[k]*ve<A.G[k]*vj))continue;v2[k]=1;p2[k]=h?p2[i]:d;q2.push(v[0],v[1]);}}
    if(m2>=0&&p2[m2]>=0)return p2[m2];}
  // sin camino seguro: hacia el vecino con más ventaja (más lejos de ellos), mirando un poco más allá
  let best=-1,bv=-1e9;for(let d=0;d<4;d++){const v=vecino(M,x,y,d);if(!v)continue;let val=A.G[v[1]*W+v[0]];
    bfsDesde(M,v[0],v[1],A.T);let mejor=-1e9;for(let i=0;i<N;i++)if(A.T[i]>=0&&A.T[i]<=8){const m=A.G[i]-A.T[i];if(m>mejor)mejor=m;}val=val*2+mejor;
    if(val>bv){bv=val;best=d;}}
  return best;}}

// Mapa del día: el mismo para todos (la fecha argentina elige mapa y semilla)
function delDia(fecha,n){const h=hash('LAB·'+fecha);return {mapa:h%n,semilla:(h>>>8)||1};}

const objetivoDe=(S,e)=>e.st==='vuelve'?S.salida:objetivo(S,e);
return {objetivoDe,U,FPS,DIRS,PRESETS,PUNTOS,FRUTAS,frutaDe,NOMBRES,ESQUINA,leer,validar,metricas,config,crear,paso,resumen,valida,auto,delDia,hash,seg,tile,vecino,pasaC,celda,proyectar,contacto};
})();

<script>
'use strict';
const JUEGO={id:'laberinto',n:'LaberintAR',compartir:'¿Un LaberintAR? Juntá las semillas sin que te agarren. Hay un desafío del día igual para todos.'};
/* ───────── Lo común de los solitarios: ayudas, sonido, hojas, menú, carteles, XP y premios ───────── */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const acct=()=>{try{const o=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');return o&&o.usuario&&o.token?o:null;}catch(_){return null;}};
// 1:05 · 12:30 · 1:02:03
function reloj(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}

/* Sonido: chiquito y opcional */
let SND=ls.get(JUEGO.id+'-sonido')!=='0',AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function nota(f,t0=0,d=.25,v=.04,tipo='triangle'){const a=actx();if(!a)return;const t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.value=f;
  o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
const SX_BASE={tic(){nota(1180,0,.06,.02,'sine');},bien(){nota(660,0,.12,.03);nota(990,.06,.16,.025);},mal(){nota(220,0,.18,.035,'square');},
  gano(){[523,659,784,1047].forEach((f,i)=>nota(f,i*.09,.5,.045));},pista(){nota(880,0,.2,.03,'sine');nota(1320,.08,.25,.02,'sine');}};
let SX={...SX_BASE};
function sfx(k){if(!SND)return;try{SX[k]&&SX[k]();}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC&&AC.state==='running')AC.suspend().catch(()=>{});});

/* Carteles */
let toastT=0;function toast(t,ms=2200){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms);}
function over(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('over');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}
function hideOver(){$('over').hidden=true;}
function sheet(title,body){$('sheet').innerHTML=`<header><h2>${title}</h2><button class="x" id="sh-x" aria-label="Cerrar">✕</button></header><div class="body">${body}</div>`;$('modal').hidden=false;$('sh-x').onclick=closeSheet;}
function closeSheet(){$('modal').hidden=true;if(typeof alCerrarHoja==='function')alCerrarHoja();}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
function openSide(h){$('side-panel').innerHTML=h;$('side').hidden=false;}
function closeSide(){$('side').hidden=true;if(typeof alCerrarHoja==='function')alCerrarHoja();}
$('side').addEventListener('click',e=>{if(e.target.id==='side')closeSide();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(!$('modal').hidden){closeSheet();e.preventDefault();}else if(!$('side').hidden){closeSide();e.preventDefault();}});
const tapado=()=>!$('modal').hidden||!$('side').hidden||!$('over').hidden||document.hidden;
function confeti(){if(RM)return;const box=document.createElement('div');box.className='confeti';const C=['#e0a93b','#7ce9e5','#e0503a','#57d49b','#c7a5ff','#f4ecdc'];
  for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=C[i%C.length];p.style.animationDelay=(Math.random()*.6)+'s';p.style.animationDuration=(1.2+Math.random()*1.1)+'s';box.appendChild(p);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3200);}

/* Nivel del juego (sin rango: estos no son competitivos) */
function nivelHtml(){const R=window.RANGOS;if(!R)return '';const L=R.levelInfo(R.xp(JUEGO.id));
  return `<div class="lv-mine"><span class="lv">${L.lv}</span><div><b>Tu nivel en ${JUEGO.n}</b><small>Faltan ${fmt(L.need-L.into)} XP para el ${L.lv+1}</small><div class="bar"><i style="width:${(L.into/L.need*100).toFixed(1)}%"></i></div></div></div>`;}
// XP y un regalito para la estancia (una vez por partida). No da leguas: no es ranked.
// info (opcional, v70): lo que RANGOS.premio usa para la economía {rival, res, ok, extra}.
function premiosSolo(key,xp,info){
  const out={xp:0,pesos:0,lv:null};if(!window.RANGOS||!xp)return out;
  const H=ls.json(JUEGO.id+'-xp-hechas',[]);
  if(!H.includes(key)){try{RANGOS.addXp(JUEGO.id,xp);out.xp=xp;const pr=RANGOS.premio(JUEGO.n,xp,false,info);if(pr){out.pesos=pr.pesos;out.oro=pr.oro||0;}}catch(_){}H.push(key);ls.set(JUEGO.id+'-xp-hechas',JSON.stringify(H.slice(-80)));}
  try{out.lv=RANGOS.levelInfo(RANGOS.xp(JUEGO.id));}catch(_){}
  return out;}
/* v70: el del día va a la tabla del día (con tu cuenta) y da 1 legua para La Gran Pampa (una por día).
   valor: lo que ordena la tabla (segundos); extra: lo demás que muestra (err, mov…). En el cartel final va
   <p class="cap" id="f-dia"></p> y acá se completa con el puesto y la legua. */
const LEG_DIA={sudoku:'s',solitario:'o',buscaminas:'m',laberinto:'h'};
async function delDiaEnviar(fecha,valor,extra){
  const R=window.RANGOS,el=()=>$('f-dia');if(!R||!R.resultado||!fecha)return null;
  if(!acct()){const e=el();if(e)e.innerHTML='Con una cuenta, el del día entra en la tabla de todos y da leguas para La Gran Pampa.';return null;}
  let leg=0;try{leg=R.pampaAct(LEG_DIA[JUEGO.id]||'s',1);}catch(_){}
  const pon=j=>{const e=el();if(!e)return;const p=[];if(j&&j.puesto)p.push(`🏆 Hoy vas <b>${j.puesto}°</b> de ${j.de}${j.ya?' (cuenta la primera vez)':''}`);else if(j&&j.ya)p.push('🏆 En la tabla cuenta la primera vez del día');
    if(leg)p.push('🚩 +1 legua en La Gran Pampa');e.innerHTML=(p.join(' · ')||'🏆 Va a la tabla del día cuando haya internet')+` · <a href="./#tablas=${JUEGO.id}">Ver tabla</a>`;};
  pon(null);
  let j=null;try{j=await R.resultado(JUEGO.id,'dia',valor,{fecha,...(extra||{})},JUEGO.id+':dia:'+fecha);}catch(_){}
  pon(j&&j.ok?j:null);return j;
}
function premiosHtml(p){if(!p||!p.lv)return '';return `<p class="cap">${JUEGO.n} nivel ${p.lv.lv}${p.xp?` · +${p.xp} XP`:''}${window.ORO?(ORO.premioTxt(p)?' · '+ORO.premioTxt(p):''):p.pesos?` · 🎁 +${fmt(p.pesos)} 🪙 para tu estancia`:''}</p>`;}

/* v72: cruce de La Gran Pampa contra reloj («#pampa-cruce=SEMILLA&duelo=ID»). Los dos juegan el mismo tablero, cada uno
   cuando puede, y gana el que hace más puntos. No se guarda (tu partida de siempre queda como estaba), no da XP, oro ni
   leguas, y al final deja el resultado en «pampa-resultado». Si te trabás: ☰ › Terminar el cruce (anota lo que hiciste).
   Cada juego define window.cruceTerminar (para ese botón) y llama a cruceFin(puntos, texto, cómo se calculó). */
const CRUCE=(()=>{const m=/[#&]pampa-cruce=(\d+)&duelo=([\w-]+)/.exec(location.hash);return m?{seed:Number(m[1])>>>0,duelo:m[2],fin:false}:null;})();
function cruceFin(puntos,txt,como){if(!CRUCE)return '';if(!CRUCE.fin){CRUCE.fin=true;
    ls.set('pampa-resultado',JSON.stringify({j:JUEGO.id,seed:CRUCE.seed,duelo:CRUCE.duelo,puntos,txt,t:Date.now()}));}
  return `<p>Para el cruce de La Gran Pampa: <b>${fmt(puntos)} puntos</b><br><small>${como}</small></p><a class="btn go" id="f-pampa" href="pampa.html#resultado">🗺️ Volver a La Gran Pampa</a>`;}
