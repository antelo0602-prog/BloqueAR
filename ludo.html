<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>LudAR</title>
<style>
/* LudAR: el ludo de la mesa del club. Madera oscura, un tablero de cartón pintado y fichas de colores dibujadas en el código. */
:root{--bg:#101418;--line:#2a3440;--ink:#eef1ea;--dim:#a7b2b9;--aqua:#7ce9e5;--gold:#f6c453;
  --wood:#2b1f16;--wood2:#1d140d;--stitch:rgba(214,226,206,.22);
  --parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;--brown:#2a2118;--soft:#7d6d58;--olive:#3f7a5a;--olive2:#2d5c43;--clay:#a3482f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --cr:#d6453a;--cv:#3c9a55;--ca:#e6b12a;--cz:#2f72c4;--cr2:#8f2a22;--cv2:#24643a;--ca2:#a07812;--cz2:#1d4a86;
  /* tablero (las apariencias cambian esto) */
  --tb-marco:#5a3c22;--tb-marco2:#3a2614;--tb-casilla:#f4ecda;--tb-raya:#cbb995;--tb-centro:#efe4cc;--tb-estrella:#b7a27a;--tb-base-in:#f7f0e0}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);flex:none;border-bottom:1px solid #1f2830}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap;display:flex;align-items:center}.brand span{color:#e0a93b}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#cfd8d2;border:1px solid #455261;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#18202a;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink);position:relative}
.icon-btn+.icon-btn{margin-left:0}
.icon-btn[hidden]{display:none}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,6px);grid-template-rows:6px 6px auto;gap:2px;place-content:center;padding:0;min-width:44px;align-content:center}
.games-btn i{width:6px;height:6px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
.games-btn b{grid-column:1/-1;font:800 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:#d5e6ea;margin-top:2px;text-align:center;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e0503f;color:#fff;font:800 11px/18px system-ui;padding:0 5px}
.badge:empty{display:none}
/* La mesa */
.table{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,235,200,.03) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--wood),var(--wood2))}
/* Los jugadores, arriba: color, nombre y cuántas fichas metió */
.seats{flex:none;display:flex;gap:6px;justify-content:center;padding:8px max(8px,env(safe-area-inset-right)) 6px max(8px,env(safe-area-inset-left))}
.seat{position:relative;flex:1 1 0;min-width:0;max-width:170px;display:flex;align-items:center;gap:6px;padding:5px 7px 5px 5px;border-radius:12px;background:rgba(10,14,18,.45);box-shadow:inset 0 0 0 1px rgba(214,226,206,.10);transition:box-shadow .2s,background .2s}
.seat::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:3px;border-radius:2px;background:var(--pc)}
.seat.turn{background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 2px var(--pc),0 0 16px color-mix(in srgb,var(--pc) 45%,transparent)}
.seat.fuera{opacity:.55}
.seat .av{width:30px;height:30px;font-size:16px;margin-left:3px}
.seat .sn{min-width:0;display:flex;flex-direction:column;gap:1px}
.seat b{font:700 13px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat small{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--dim);white-space:nowrap}
.seat small i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--pc);flex:none}
.seat small i.ok{background:var(--pc)}
.seat .tleft{margin-left:4px;font-weight:800;color:#f3dc9a}
.seat .eqt{font-style:normal;font-size:10px;opacity:.8}
.av{border-radius:50%;display:grid;place-items:center;background:var(--c,#3b5866);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 2px rgba(214,226,206,.30);flex:none}
.say{position:absolute;z-index:6;left:50%;top:calc(100% + 4px);transform:translateX(-50%);max-width:170px;padding:5px 10px;border-radius:12px;background:var(--parch);color:var(--brown);font:700 13.5px/1.15 var(--serif);white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.45);border:1px solid var(--rule);pointer-events:none;animation:sayIn .2s ease-out}
@keyframes sayIn{from{opacity:0;transform:translate(-50%,-5px) scale(.94)}}
.chip-chat{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);max-width:150px;padding:4px 9px;border-radius:10px;background:#f4ecdc;color:#2a2118;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:7;box-shadow:0 6px 14px rgba(0,0,0,.4);animation:sayIn .2s ease-out;pointer-events:none}
@media (max-width:520px){.seats.n4{gap:4px}.seats.n4 .seat{padding-left:9px;gap:4px}.seats.n4 .seat .av{display:none}.seats.n4 .seat b{font-size:12.5px}}
/* El tablero */
.tabwrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;padding:2px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left))}
#tab{display:block;width:var(--tb,320px);height:var(--tb,320px);touch-action:manipulation;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5));cursor:default}
#tab.toca{cursor:pointer}
.tb-celda{fill:var(--tb-casilla);stroke:var(--tb-raya);stroke-width:.04}
.tb-marco{fill:var(--tb-marco);stroke:var(--tb-marco2);stroke-width:.12}
.tb-estrella{fill:var(--tb-estrella)}
.tb-centro{fill:var(--tb-centro)}
.tb-basein{fill:var(--tb-base-in);stroke:rgba(0,0,0,.18);stroke-width:.05}
.tb-hueco{fill:rgba(0,0,0,.08);stroke:rgba(0,0,0,.22);stroke-width:.05}
.c-r{--k:var(--cr);--k2:var(--cr2)}.c-v{--k:var(--cv);--k2:var(--cv2)}.c-a{--k:var(--ca);--k2:var(--ca2)}.c-z{--k:var(--cz);--k2:var(--cz2)}
.tb-col{fill:var(--k);stroke:var(--k2);stroke-width:.05}
.tb-base{fill:var(--k);stroke:var(--k2);stroke-width:.08}
.tb-flecha{fill:rgba(255,255,255,.85)}
.tb-base.activa{animation:baseOn 1.4s ease-in-out infinite}
@keyframes baseOn{50%{stroke:#fff6d8;stroke-width:.22}}
/* Fichas: van con transform de CSS (en unidades del tablero) para poder moverlas casilla por casilla */
.pz{transition:transform .14s cubic-bezier(.3,.8,.35,1)}
.pz.lento{transition:transform .38s cubic-bezier(.3,.8,.35,1)}
.pz.quieto{transition:none}
.pz .hit{fill:transparent}
.pz .sombra{fill:rgba(0,0,0,.32)}
.pz .cuerpo{fill:var(--k);stroke:var(--k2);stroke-width:.05}
.pz .tapa{fill:var(--k);stroke:rgba(255,255,255,.75);stroke-width:.06}
.pz .brillo{fill:rgba(255,255,255,.42)}
.pz .aro{fill:none;stroke:#fff3c4;stroke-width:.07;opacity:0}
.pz.puede .aro{opacity:1;animation:aro 1s ease-in-out infinite}
@keyframes aro{50%{stroke-width:.14;stroke:#ffd25a}}
.pz.puede .in{animation:sube 1s ease-in-out infinite}
@keyframes sube{50%{transform:translateY(-.08px)}}
.pz.salta .in{animation:hop .15s ease-out}
@keyframes hop{50%{transform:translateY(-.26px) scale(1.08)}}
.pz.comida .in{animation:comida .42s ease-in forwards}
@keyframes comida{40%{transform:scale(1.35)}100%{transform:scale(.2);opacity:.2}}
.hint{fill:var(--k);opacity:.55;stroke:#fff;stroke-width:.05;pointer-events:none;animation:hint 1s ease-in-out infinite}
@keyframes hint{50%{opacity:.9}}
.fx-anillo{fill:none;stroke:#fff3c4;stroke-width:.1;animation:anillo .6s ease-out forwards;pointer-events:none}
@keyframes anillo{from{transform:scale(.15);opacity:1}to{transform:scale(1);opacity:0}}
.fx-chispa{fill:#ffe08a;pointer-events:none;animation:chispa .7s ease-out forwards}
@keyframes chispa{to{transform:translate(var(--dx),var(--dy));opacity:0}}
/* Abajo: el estado y el dado */
.panel{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:2px max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.status{min-height:20px;font-size:13.5px;color:#e6ece6;text-align:center;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap}
.status b{color:#f3dc9a}
.timer{display:inline-block;min-width:34px;font:800 12px/1 system-ui;color:#2a1f12;background:#e0a93b;border-radius:7px;padding:4px 6px 3px}
.timer.low{background:#e0503f;color:#fff}
.dado-fila{display:flex;align-items:center;gap:14px;justify-content:center;min-height:72px}
.dado{position:relative;width:68px;height:68px;border-radius:16px;border:0;padding:0;background:none;--k:#cfc6b2}
.dado svg{display:block;width:100%;height:100%;filter:drop-shadow(0 5px 8px rgba(0,0,0,.45))}
.dado .cara{fill:#fbf6ea;stroke:var(--k);stroke-width:5}
.dado .pip{fill:#2a2118}
.dado.can{animation:latido 1.4s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.07);filter:drop-shadow(0 0 12px rgba(246,196,83,.6))}}
.dado.rueda svg{animation:rueda .52s cubic-bezier(.2,.7,.3,1)}
/* v70.1: el dado que salta al tablero */
.dado.volando svg{visibility:hidden}
.dado-vuelo{position:fixed;z-index:12;pointer-events:none;will-change:transform;transform-origin:50% 50%}
.dado-vuelo svg{display:block;width:100%;height:100%;filter:drop-shadow(0 12px 16px rgba(0,0,0,.5))}
.dado-vuelo .cara{fill:#fbf6ea;stroke:var(--k);stroke-width:5}.dado-vuelo .pip{fill:#2a2118}
.dado-vuelo.quieto svg{filter:drop-shadow(0 0 18px rgba(246,196,83,.75)) drop-shadow(0 8px 12px rgba(0,0,0,.45))}
@keyframes rueda{0%{transform:rotate(0) translateY(0)}30%{transform:rotate(200deg) translateY(-14px) scale(.92)}70%{transform:rotate(330deg) translateY(2px)}100%{transform:rotate(360deg) translateY(0)}}
.dado:disabled{cursor:default}
.dado-lado{font-size:12.5px;color:#c7d5d2;max-width:110px;line-height:1.25;text-align:center}
.dado-lado b{display:block;font:700 15px/1.2 var(--serif);color:#f3dc9a}
.onl{font-size:11.5px;font-weight:700;color:#cfe3c0;pointer-events:none;text-align:center;margin-bottom:-4px}
.onl.off{color:#e8cf9a}.onl:empty{display:none}
.toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;pointer-events:none;background:rgba(20,26,32,.96);color:var(--ink);border:1px solid rgba(224,169,59,.35);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:min(360px,86vw);text-align:center;animation:tin .2s ease-out}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
.say,.chip-chat,.hint,.onl{pointer-events:none}
/* Partida nueva: colores y reglas */
.colores{display:flex;gap:8px}.colores button{flex:1;height:46px;border-radius:12px;border:2px solid rgba(0,0,0,.15);background:var(--k);color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.45)}
.colores button.on{box-shadow:0 0 0 3px var(--parch),0 0 0 5px var(--olive)}
.reglas-g{display:grid;grid-template-columns:1fr;gap:8px}
.regla{display:flex;flex-direction:column;gap:4px}
.regla>span{font-size:13px;font-weight:700;color:var(--brown)}
.regla .seg .btn{min-height:38px;font-size:13px}
.posi{display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px 10px;border-radius:10px;background:#fbf7ee;border:1px solid #e1d3b6}
.posi div{display:flex;align-items:center;gap:8px;font-size:14px}
.posi div i{width:12px;height:12px;border-radius:50%;background:var(--k);flex:none}
.posi div span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.posi div b{font-family:var(--serif)}
.posi .win{color:#2d5c43;font-weight:800}
.demo-tab{display:flex;justify-content:center}.demo-tab svg{width:170px;height:170px}
/* Carteles, hojas, menú y chat de la mesa */
.over{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,10,12,.58);z-index:9}
.over[hidden]{display:none}
.ccard{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ccard h3{margin:0;font:700 22px/1.2 var(--serif)}
.ccard p{margin:0;color:#4d4031}
.ccard .ic{font-size:34px;line-height:1}
.ccard .btn{width:100%}
.ccard .lines{display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px 10px;border-radius:10px;background:#fbf7ee;border:1px solid #e1d3b6}
.ccard .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ccard .lines b{font-family:var(--serif);font-size:15px}
.ccard .lines .win{color:#2d5c43}
.ccard .cap{font-size:12.5px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:46px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.on{box-shadow:inset 0 0 0 2px #3f7a5a;background:#e8efe2}
.btn:disabled{opacity:.45}
.btn.link{background:none;border:0;box-shadow:none;color:#6b5a44;text-decoration:underline;min-height:36px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,12,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(540px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.sheet h4{margin:6px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.sheet .seg{display:flex;gap:6px;flex-wrap:wrap}.sheet .seg .btn{flex:1;min-width:56px}
.note{font-size:12.5px;color:var(--soft)}
.sheet ul{margin:0;padding-left:18px;color:#4d4031;display:flex;flex-direction:column;gap:4px}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:#4d4031;font-size:13.5px}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ulist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.ulist .av{width:34px;height:34px;font-size:18px}
.ulist .nm{flex:1;font-weight:700;min-width:0}
.ulist .nm small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.ulist .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5aa64a;margin-left:6px}
.ulist button{min-height:38px;border-radius:9px;border:1px solid #7a5d33;background:linear-gradient(#d9bd7d,#bb9856);font-weight:700;padding:0 12px;color:#2a1f12}
.ulist button:disabled{opacity:.5}
.mesa{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.lugar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;min-height:56px}
.lugar .av{width:32px;height:32px;font-size:17px}
.lugar b{display:block;font-size:14px;line-height:1.15}.lugar small{display:block;font-size:11.5px;color:var(--soft)}
.lugar.bot{background:#f3ede0;border-style:dashed}
.lugar>div{flex:1;min-width:0}.lugar .qx{width:28px;height:28px;border-radius:9px;border:1px solid var(--rule);background:#f3ead6;font-size:12px;flex:none;color:inherit}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #b9a27a;border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(8,10,12,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#151b21;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#222b33;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#1b232b;font-weight:650;text-decoration:none;color:var(--ink);text-align:left}
.side .note{color:#9aa6ad}
/* Globos, chips y carteles son sólo para mirar: nunca se comen un toque. */
.mchat{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;width:min(330px,calc(100% - 20px));max-height:min(60vh,420px);display:flex;flex-direction:column;background:#151b21f5;border:1px solid #3a4654;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.55);overflow:hidden}
.mchat[hidden]{display:none}
.mchat header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #26303a}.mchat header b{flex:1;font:700 15px var(--serif)}
.mchat header button{width:36px;height:36px;border-radius:10px;border:0;background:#222b33}
.mchat .msgs{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px}

<script>
/* ───────── v77 · El sonido de la app no corta la música del celular ─────────
   Pedido del 25/10: «no se puede escuchar música en el celular mientras se juega».
   · En iOS (Safari 16.4+ y la app instalada) el sonido de una página usa por defecto una «sesión de audio» que pausa a
     Spotify/Apple Music. Con navigator.audioSession.type = 'ambient' la app SE MEZCLA con la música de otras apps.
     Contra: en 'ambient' el sonido de la app respeta el interruptor de silencio (con el celu en silencio, la app no suena).
   · Va antes que todo (es el primer script de cada página) y además envuelve AudioContext para volver a ponerlo justo antes
     de crear cada contexto (iOS a veces lo resetea al volver de segundo plano).
   · En Android y en la compu no hace falta: Chrome ya mezcla el audio de la página con el de otras apps.
   · iOS más viejo (sin audioSession): no hay forma desde una página web de no pausar la otra música si la app suena;
     ahí lo único que se puede hacer es no crear audio hasta que haga falta (los juegos ya lo crean recién con el primer
     sonido) y bajar el sonido de la app desde sus menús. */
(function(){
'use strict';
function ambient(){try{const s=navigator.audioSession;if(s&&s.type!=='ambient')s.type='ambient';}catch(_){}}
ambient();
for(const k of ['AudioContext','webkitAudioContext']){
  const C=window[k];if(!C||C.__ambient)continue;
  const W=function(...a){ambient();return new C(...a);};
  W.prototype=C.prototype;W.__ambient=true;try{Object.setPrototypeOf(W,C);}catch(_){}
  try{window[k]=W;}catch(_){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)ambient();});
window.addEventListener('pageshow',ambient);
window.SONIDO={ambient,tipo:()=>{try{return navigator.audioSession?navigator.audioSession.type:null;}catch(_){return null;}}};
})();

</script>
<script>
/* ───────── Latido (v76): UNA sola consulta periódica a la planilla para toda la página ─────────
   Antes cada parte preguntaba por su lado (el chat cada 4 s, el buzón del juego cada 5–8 s, los amigos del menú
   cada 4 s, la lista de gente cada 25–30 s, la estancia cada 90 s). Ahora pregunta sólo esto, con la acción «latido»
   de la planilla, y reparte la respuesta a cada parte.
   Cada cuánto (los topes que pidió el usuario):
     · con una charla abierta: cada 2 s, siempre;
     · con el chat cerrado y la app a la vista: arranca en 4 s y, si no pasa nada, sube de a 1 s hasta 9 s
       (así el primer mensaje después de un rato llega en menos de 10 s, contando lo que tarda la red);
     · vuelve a 4 s apenas llega algo, al tocar la pantalla o al volver a la app (en ese caso pregunta enseguida);
     · en segundo plano: cada 30 s;
     · con una mesa armándose o conectándose: cada 3 s como mucho.
   El chat de la mesa durante la partida va directo entre los teléfonos (WebRTC): no pasa por acá.
   Si la planilla es vieja (no conoce «latido»), se apaga solo y cada parte vuelve a preguntar como antes.
   API: LATIDO.registrar(nombre, {armar(p), recibir(j), ms(), error(e)}) · LATIDO.activo() · LATIDO.ahora() · LATIDO.buzon()
        LATIDO.ultimo() → la última respuesta · LATIDO.espera(t0) → cuánto esperar entre consultas del buzón
        mientras se conecta una mesa (0,7 s los primeros 90 s; después 2 s) · evento «bloques-latido» con la respuesta. */
(function(){
'use strict';
if(window.LATIDO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const MIN=4000,MAX=9000,PASO=1000,FONDO=30000,MESA=3000;
const L={parts:{},timer:0,prox:0,ult:0,enCurso:false,otra:false,quietos:0,viejo:false,ok:false,fallas:0,j:null,jAt:0,mesaHasta:0,tocadoAt:0,limpiado:false,
  sig:{t:0,inv:'',pr:'',eg:null,pa:null,am:''},n:0};
async function call(p,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();
    if(!j||!j.ok){const e=new Error(j&&j.error||'La planilla respondió con un error.');e.planilla=true;throw e;}
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
function intervalo(){
  if(document.hidden)return FONDO;
  let ms=Math.min(MAX,MIN+L.quietos*PASO);
  if(Date.now()<L.mesaHasta)ms=Math.min(ms,MESA);
  for(const k in L.parts){try{const m=L.parts[k].ms&&L.parts[k].ms();if(m>0)ms=Math.min(ms,m);}catch(_){}}
  return ms;
}
function programar(ms){
  if(L.viejo||L.pausa||!acct()||!Object.keys(L.parts).length)return;
  if(ms===undefined)ms=Math.max(0,L.ult+intervalo()-Date.now());
  const cuando=Date.now()+ms;
  if(L.timer&&L.prox&&L.prox<=cuando)return;   // ya hay uno antes
  clearTimeout(L.timer);L.prox=cuando;L.timer=setTimeout(tick,ms);
}
function reprogramar(){clearTimeout(L.timer);L.timer=0;L.prox=0;programar();}
async function tick(){
  L.timer=0;L.prox=0;
  if(L.viejo||L.pausa)return;
  const a=acct();if(!a)return;
  if(L.enCurso){L.otra=true;return;}
  L.enCurso=true;L.ult=Date.now();
  const p={accion:'latido',usuario:a.usuario,token:a.token,q:{bz:{}}};
  for(const k in L.parts){try{L.parts[k].armar&&L.parts[k].armar(p);}catch(_){}}
  let j=null,err=null;
  try{j=await call(p);L.n++;}catch(e){err=e;}
  if(j){
    L.ok=true;L.fallas=0;L.j=j;L.jAt=Date.now();
    const nuevo=novedad(j);L.quietos=nuevo||L.n<=1?0:Math.min(L.quietos+1,20);
    for(const k in L.parts){try{const r=L.parts[k].recibir&&L.parts[k].recibir(j);if(r&&r.then)await r.catch(()=>{});}catch(_){}}
    try{window.dispatchEvent(new CustomEvent('bloques-latido',{detail:j}));}catch(_){}
    if(j.lp&&!L.limpiado){L.limpiado=true;call({accion:'limpieza',usuario:a.usuario,token:a.token},60000).catch(()=>{});}   // una vez por día, la hace el primero
  }else{
    const m=String(err&&err.message||err);
    if(/desconocida/i.test(m)){apagar();}
    else if(err&&err.planilla&&!/sesión venció/i.test(m)&&++L.fallas>=3){apagar();}   // algo anda mal con «latido»: mejor como antes
    for(const k in L.parts){try{L.parts[k].error&&L.parts[k].error(err);}catch(_){}}
  }
  L.enCurso=false;
  if(L.otra){L.otra=false;programar(0);}else programar();
}
function novedad(j){
  // Novedad = algo para vos: un mensaje, una invitación, amigos/solicitudes, tu estancia o La Gran Pampa.
  // (Que otro se conecte o cambie de juego no cuenta: con mucha gente pasaría todo el tiempo y nunca se iría más lento.)
  const S=L.sig,am=j.amigos?JSON.stringify(j.amigos):S.am;
  const ch=(Number(j.t)||0)!==S.t||String(j.inv||'')!==S.inv||(j.eg!==undefined&&j.eg!==S.eg)||(j.pa!==undefined&&j.pa!==S.pa)||am!==S.am||(j.bz&&j.bz.invitacion);
  const primera=!L.n||L.n===1;
  S.t=Number(j.t)||0;S.inv=String(j.inv||'');S.am=am;if(j.eg!==undefined)S.eg=j.eg;if(j.pa!==undefined)S.pa=j.pa;
  return ch&&!primera;
}
function apagar(){
  if(L.viejo)return;L.viejo=true;L.ok=false;clearTimeout(L.timer);
  try{window.dispatchEvent(new CustomEvent('bloques-latido-viejo'));}catch(_){}
}
function despertar(){if(L.viejo)return;L.quietos=0;programar(0);}
// Tocar la pantalla: vuelve al paso rápido (sin preguntar de más: como mucho a los 4 s de la anterior).
function tocado(){
  if(L.viejo||document.hidden)return;const t=Date.now();if(t-L.tocadoAt<1500)return;L.tocadoAt=t;
  if(L.quietos>0){L.quietos=0;clearTimeout(L.timer);L.timer=0;L.prox=0;programar(Math.max(150,L.ult+MIN-t));}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)despertar();else reprogramar();});
for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,tocado,{passive:true,capture:true});
window.addEventListener('online',despertar);
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'){L.sig={t:0,inv:'',pr:'',eg:null,pa:null,am:''};L.n=0;programar(300);}});
window.LATIDO={
  registrar(n,o){L.parts[n]=o||{};programar(L.ult?undefined:1200);},
  quitar(n){delete L.parts[n];},
  activo:()=>!L.viejo&&!!acct()&&L.ok,                 // ya respondió bien: las demás partes no preguntan por su lado
  usable:()=>!L.viejo&&!!acct(),                       // todavía no sabemos si la planilla lo conoce, pero se intenta
  get viejo(){return L.viejo;},
  ahora(){if(L.viejo)return;programar(L.enCurso?0:Math.max(0,Math.min(250,L.ult+500-Date.now())));},   // «preguntá ya» (de a una)
  despertar,
  ultimo:()=>L.j,ultimoAt:()=>L.jAt,
  // Lo del buzón que trajo el latido recién (si es de hace menos de 2,5 s): el juego lo usa en vez de preguntar otra vez.
  buzon(){return L.j&&L.j.bz&&Date.now()-L.jAt<2500?Object.assign({ok:true},L.j.bz):null;},
  espera(t0){L.mesaHasta=Date.now()+10000;return Date.now()-(t0||0)<90000?700:2000;},
  mesa(seg){L.mesaHasta=Date.now()+(seg||10)*1000;programar();},
  // v77: la estancia abre un juego en una ventanita adentro (un iframe con su propio latido): mientras tanto el de la estancia
  // se calla, para que no pregunten los dos ni salgan dos veces las invitaciones. Al cerrar la ventanita, pregunta enseguida.
  pausar(v){v=!!v;if(v===!!L.pausa)return;L.pausa=v;if(v){clearTimeout(L.timer);L.timer=0;L.prox=0;}else programar(0);},
  get pausado(){return !!L.pausa;},
  intervalo,
  get estado(){return {quietos:L.quietos,ms:intervalo(),n:L.n,ok:L.ok,viejo:L.viejo};}
};
})();

</script>
<script>
/* ───────── SYNCRO: tu progreso en todos los dispositivos (v63) ─────────
   Va en todas las páginas. Con la cuenta abierta, lo que cada juego guarda en este dispositivo (preferencias,
   partidas en curso contra la compu, récords, rangos, XP, logros, regalos para la estancia…) también se guarda en
   la planilla (accion=sync, hoja «Partes»), y al abrir cualquier juego —o al volver a él— se trae lo del otro
   dispositivo y se junta con lo de acá:
   · cada clave guarda cuándo cambió por última vez: gana la más nueva (una partida en curso, una preferencia);
   · las listas se unen (partidas ya contadas), los récords se quedan con lo mejor, los contadores con lo mayor;
   · «rk» (rangos, XP y logros de todos los juegos) se junta con RANGOS.importData (que también trae LOGROS).
   Los cambios se notan solos (se envuelve localStorage.setItem): se suben a los pocos segundos y al salir.
   Cuando se trae algo nuevo, avisa con el evento «bloques-sync» {detail:{claves:[…], partes:[…]}} para que cada
   juego lo muestre (p. ej. retomar la partida del otro dispositivo).
   BloqueAR (su progreso, medallas, récords y apariencia) sigue con su sincronización de siempre (src/688_cuenta.js),
   y EstanciAR con la suya (hoja EstPriv). API: window.SYNCRO = {ahora(), estado(), html(), onEstado(fn), partes}. */
(function(){
'use strict';
if(window.SYNCRO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
let ST;try{ST=window.localStorage;}catch(_){ST=null;}
const rawSet=ST?Storage.prototype.setItem:null,rawDel=ST?Storage.prototype.removeItem:null;

  json(k,d){try{const v=JSON.parse(ST.getItem(k)||'null');return v??d;}catch(_){return d;}}};

const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const me=()=>{const a=acct();return a?String(a.usuario).toLowerCase():'';};
const dev=(()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;})();
const pruebas=/[?#&]sync-off\b/.test(location.href);

/* ── Qué se guarda de cada juego ──
   [clave, regla]: 'nuevo' (por defecto) · 'union' (lista) · 'min' / 'max' (objeto de números) · 'claves' (objeto: se
   suman las claves) · 'maxnum' (número) · 'recsol' (récords del solitario). «{me}» es tu usuario. */
const PARTES={

  pool:['pool-modo','pool-dif','pool-serie','pool-meta','pool-guia','pool-reloj','pool-reloj-on','pool-n','pool-sonido','pool-vibrar','pool-zurdo','pool-soltar','pool-sens','pool-efecto-fijo','pool-ayuda','pool-tutorial-ok','pool-partida-v1',['pool-xp-hechas','union']],
  ludo:['ludo-dif','ludo-bots','ludo-color','ludo-eq','ludo-reglas','ludo-auto1','ludo-ayuda','ludo-mesa-n','ludo-partida-v1',['ludo-xp-hechas','union']],
  poblar:['poblar-dificultad','poblar-jugadores','poblar-jugadores-online','poblar-ayuda','poblar-partida-v2',['poblar-xp-hechas','union']],
  solos:['sudoku-dif','sudoku-errores','sudoku-choques','sudoku-zona','sudoku-iguales','sudoku-notasAuto','sudoku-faltan','sudoku-ayuda','sudoku-partida-v1','sudoku-dia-curso-v1',['sudoku-records-v1','min'],['sudoku-dias-v1','claves'],['sudoku-xp-hechas','union'],
    'solitario-robo','solitario-consol','solitario-nivel','solitario-ayuda','solitario-partida-v1','solitario-dia-curso-v1','solitario-racha',['solitario-records-v1','recsol'],['solitario-dias-v1','claves'],['solitario-xp-hechas','union'],
    'buscaminas-dif','buscaminas-resaltar','buscaminas-listos','buscaminas-chord','buscaminas-mantener','buscaminas-vibrar','buscaminas-ayuda','buscaminas-partida-v1','buscaminas-dia-curso-v1',['buscaminas-records-v1','min'],['buscaminas-dias-v1','claves'],['buscaminas-stats-v1','nuevo'],['buscaminas-xp-hechas','union']],
  laberinto:['laberinto-pref','laberinto-dif','laberinto-libre','laberinto-ayuda','laberinto-sonido','laberinto-partida-v1',['laberinto-records-v1','max'],['laberinto-campana-v1','max'],['laberinto-dias-v1','claves'],['laberinto-xp-hechas','union']],   // v73
  invasores:['invasores-ajustes','invasores-cfg','invasores-taller','invasores-tut','invasores-partida-v1',['invasores-records','max'],['invasores-dia','claves'],['invasores-xp-hechas','union'],['invasores-historia','max']],   // v73 InvasorAR · v77 progreso de Historia

  pampa:['pampa-resultado','pampa-visto','pampa-resumen','pampa-cruce','pampa-copas','pampa-ayuda-9'],
  gen:[['bloques-novedades','maxnum'],['bloques-chat-read-{me}','max'],['bloques-chat-borr-{me}','max'],'bloques-chat-frase','bloques-chat-modo',
    'bloques-ranked-bloquear','bloques-ranked-poblar','bloques-ranked-truco','bloques-ranked-uno','bloques-ranked-ludo','bloques-ranked-pool','bloques-ranked-invasores','bloques-ranked-estancia',
    'bloques-favoritos-v1','bloques-orden-v1']   // v67: juegos fijados y orden propio del menú de juegos
};
// v75: también el oro. Antes, el oro que ganabas sin que cambiara otra cosa de «rk» (el cofre al subir de nivel la estancia,
// la pulpería, una compra con oro) no se marcaba para subir: si cerrabas la app, el otro dispositivo nunca lo veía.
const RK_CLAVES=['bloques-rangos-v1','bloques-xpjuegos-v1','bloques-logros-v1','bloques-partidas-v1','bloques-oro-v1'];
const clavesDe=n=>(PARTES[n]||[]).map(x=>{const [k,r]=Array.isArray(x)?x:[x,'nuevo'];return [k.replace('{me}',me()),r];});
let MAPA=null,MAPA_U='';
function parteDe(k){
  if(!MAPA||MAPA_U!==me()){MAPA=new Map();MAPA_U=me();for(const x of RK_CLAVES)MAPA.set(x,'rk');MAPA.set('estancia-premios','premios');MAPA.set('pampa-act','act');
    for(const n of Object.keys(PARTES))for(const [x] of clavesDe(n))MAPA.set(x,n);}
  return MAPA.get(k)||'';
}
// JSON con las claves ordenadas, para comparar sin falsos «cambió».
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o);}

/* ── Cuándo cambió cada clave (por dispositivo) ── */
const META_K='sync-meta-v1';
// Otra cuenta en este dispositivo: se arranca de cero y lo que quedó acá de la otra cuenta no se le sube a ésta
// (lo de la cuenta nueva gana; lo que sólo está acá se queda acá hasta que se vuelva a tocar).
function metaCargar(){let M=ls.json(META_K,{});if(M.u&&M.u!==me())M={ajena:true};return M;}
let META=metaCargar();
function metaSave(){META.u=me();ls.set(META_K,JSON.stringify(META));}
function hash(s){if(s==null)return '∅';let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;}
// Mira si cambió algo desde la última vez. «t» = ahora; lo que nunca se miró en este dispositivo arranca en t=1
// (así, si la cuenta tiene algo más nuevo, gana la cuenta).
function revisar(n){const M=(META[n]=META[n]||{});let ch=false;
  for(const [k] of clavesDe(n)){const v=ls.get(k),h=hash(v),m=M[k];
    if(!m){M[k]={h,t:v==null?0:1};}else if(m.h!==h){M[k]={h,t:Date.now()};ch=true;}}
  return ch;}
function exportar(n){revisar(n);const M=META[n]||{},k={};
  for(const [x] of clavesDe(n)){const m=M[x];if(!m)continue;const v=ls.get(x);if(v==null&&!m.t)continue;k[x]=[v,m.t||0];}
  return {k};}
const J=s=>{try{return JSON.parse(s);}catch(_){return null;}};
function juntarValor(regla,a,b){   // a = lo de acá, b = lo de la cuenta (strings)
  if(a==null)return b;if(b==null)return a;
  const A=J(a),B=J(b);
  if(regla==='union'&&Array.isArray(A)&&Array.isArray(B)){const o=[...A];for(const x of B)if(!o.includes(x))o.push(x);return JSON.stringify(o.slice(-120));}
  if((regla==='min'||regla==='max')&&A&&B&&typeof A==='object'&&typeof B==='object'){const o={...A};
    for(const [x,v] of Object.entries(B))if(Number.isFinite(v)&&(!Number.isFinite(o[x])||(regla==='min'?v<o[x]:v>o[x])))o[x]=v;return JSON.stringify(o);}
  if(regla==='claves'&&A&&B&&typeof A==='object'&&typeof B==='object')return JSON.stringify({...B,...A});
  if(regla==='maxnum'){const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?String(Math.max(x,y)):a;}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u','a','l','k','s','o','m','r','v','w'],   // v73: v y w, InvasorAR
    // v70: también ajedrez, pool, ludo, los del día y los retos
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};
    for(const [dv,x] of Object.entries(d.por||{})){if(dv===dev)continue;const y=por[dv]||{};por[dv]={};for(const f of this.F)por[dv][f]=Math.max(x[f]|0,y[f]|0);}
    const s={};for(const f of this.F)s[f]=Object.entries(por).reduce((a,[dv,x])=>dv===dev?a:a+(x[f]|0),0);
    ls.set('sync-act-por',JSON.stringify({d:h,por}));ls.set('sync-act-otros',JSON.stringify({d:h,s}));
    const L={d:h};for(const f of this.F)L[f]=mio[f]+s[f];const antes=ls.get('pampa-act'),nuevo=JSON.stringify(L);
    if(antes!==nuevo){ls.set('pampa-act',nuevo);return true;}return false;}};
const ESPECIALES={rk:RK,premios:PREM,act:ACT};
const TODAS=[...Object.keys(PARTES),'rk','premios','act'];
function datosDe(n){return ESPECIALES[n]?ESPECIALES[n].exportar():exportar(n);}

/* ── Red ── */
async function call(p,ms=15000,keep=false){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow',keepalive:keep});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}

/* ── Estado (para el indicador del menú) ── */
const E={st:'',t:Number(ls.get('sync-ultimo')||0),err:'',sub:new Set()};
function setSt(st,err){E.st=st;E.err=err||'';if(st==='ok'){E.t=Date.now();ls.set('sync-ultimo',String(E.t));}for(const f of E.sub)try{f(E);}catch(_){}pintar();}
function hace(t){if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'recién':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`;}
function texto(){if(!acct())return '';if(E.st==='busy')return '☁️ Guardando en tu cuenta…';if(E.st==='off')return '☁️ Sin conexión: se guarda cuando vuelva';
  if(E.st==='err')return '☁️ No se pudo guardar en tu cuenta';return E.t?`☁️ ✓ Guardado en tu cuenta · ${hace(E.t)}`:'☁️ Se guarda en tu cuenta';}
function html(){const t=texto();return t?`<div class="sync-st" data-sync-st>${t}</div>`:'';}
function pintar(){const t=texto();document.querySelectorAll('[data-sync-st]').forEach(el=>{el.textContent=t;});}
// Si el menú del juego se abre, el renglón aparece solo debajo del rango (rk-mine) o al principio del menú.
function css(){if(document.getElementById('sync-css'))return;const s=document.createElement('style');s.id='sync-css';
  s.textContent='.sync-st{font:500 12px/1.3 system-ui,-apple-system,sans-serif;color:#93a1b6;opacity:.9;margin:-4px 0 10px;text-align:left}';(document.head||document.documentElement).appendChild(s);}
function engancharMenu(){if(!acct())return;
  const box=document.getElementById('side-panel');if(!box)return;const L=box.querySelector('.menu-list');   // sólo en el menú principal del juego
  if(!L||box.querySelector('[data-sync-st]'))return;css();
  const d=document.createElement('div');d.className='sync-st';d.dataset.syncSt='';d.textContent=texto();L.before(d);}

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){
  const a=acct();if(!a||pruebas)return;
  if(SUC.busy){SUC.again=true;return;}SUC.busy=true;clearTimeout(SUC.timer);setSt('busy');
  try{
    let traidos=[],partes=[];const ajena=!!META.ajena;
    if(bajar||SUC.primero){
      const j=await call({accion:'sync',usuario:a.usuario,token:a.token,bajar:true},15000,keep);
      SUC.pullT=Date.now();SUC.primero=false;
      if(j.version!==undefined&&!j.partes)throw new Error('vieja');
      const P=j.partes||{};
      if(ajena){for(const k of RK_CLAVES)ls.set(k,null);partes.push('rk');}   // otra cuenta: los rangos y logros de acá no se mezclan
      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}
      // lo que acá es distinto de la cuenta, se sube
      for(const n of TODAS){const r=P[n];const mio=datosDe(n);if(!mio)continue;
        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);
    SUC.dirty.clear();
    // v73: de a 10 partes por pedido (la planilla toma hasta 12 y ya hay más partes que eso)
    for(let i=0;i<subir.length;i+=10){await call({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)},15000,keep);SUC.last=Date.now();}
    setSt('ok');
    if(partes.length)try{window.dispatchEvent(new CustomEvent('bloques-sync',{detail:{claves:traidos,partes}}));}catch(_){}
  }catch(e){
    const m=String(e&&e.message||e);
    if(/sesión venció/i.test(m)){setSt('err','Tu sesión venció.');}
    else if(m==='vieja'||/Acción desconocida/.test(m)){setSt('err','La planilla todavía no tiene la versión nueva.');}
    else{setSt(navigator.onLine===false||e instanceof TypeError||e.name==='AbortError'?'off':'err',m);for(const n of TODAS)if(n)SUC.dirty.add(n);}
  }finally{SUC.busy=false;if(SUC.again){SUC.again=false;setTimeout(()=>ahora(true),300);}}
}

/* ── Notar los cambios: cada vez que un juego guarda algo de una parte, se programa la subida ── */
if(ST&&!pruebas){
  Storage.prototype.setItem=function(k,v){
    if(this===ST&&k==='estancia-premios'){   // lo que desaparece de la cola es lo que la estancia ya cobró
      try{const antes=J(ST.getItem(k))||[],ahoraL=J(String(v))||[],quedan=new Set(ahoraL.map(idP)),cob=antes.filter(x=>!quedan.has(idP(x))).map(idP);
        if(cob.length){const c=ls.json(PRC,[]);for(const x of cob)if(!c.includes(x))c.push(x);rawSet.call(ST,PRC,JSON.stringify(c.slice(-200)));}}catch(_){}}
    rawSet.call(this,k,v);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
  Storage.prototype.removeItem=function(k){rawDel.call(this,k);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
}
function arrancar(){
  if(!acct()||pruebas)return;
  setTimeout(()=>ahora(true),600);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(SUC.dirty.size)ahora(true,true);}
    else if(Date.now()-SUC.pullT>15000)ahora(true);});
  window.addEventListener('pagehide',()=>{if(!SUC.dirty.size)return;const a=acct();if(!a)return;   // al cerrar: se manda lo que falta, sin esperar
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(Boolean);
    for(let i=0;i<subir.length;i+=10)try{fetch(lbUrl(),{method:'POST',body:JSON.stringify({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)}),headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true});}catch(_){}});
  window.addEventListener('online',()=>{if(SUC.dirty.size)ahora(true);});
  // Cuando se abre un menú lateral, se muestra el renglón del guardado.
  try{const sp=()=>{const b=document.getElementById('side-panel');if(b)new MutationObserver(()=>engancharMenu()).observe(b,{childList:true});};if(document.getElementById('side-panel'))sp();else document.addEventListener('DOMContentLoaded',sp);}catch(_){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arrancar);else arrancar();
// Al entrar con la cuenta (o cambiar de cuenta) en esta página, se trae todo.
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'&&acct()){META=metaCargar();SUC.primero=true;ahora(true);}});

// Para lo que un juego guarda solo al abrir (p. ej. reparte una partida nueva porque no había ninguna):
// queda como «de antes», así una partida que venías jugando en otro dispositivo le gana.
function auto(k){const n=parteDe(k);if(!n||ESPECIALES[n])return;const M=(META[n]=META[n]||{});M[k]={h:hash(ls.get(k)),t:1};metaSave();}
window.SYNCRO={ahora,auto,html,texto,estado:()=>({...E,sub:undefined}),onEstado(f){E.sub.add(f);},partes:PARTES,
  cuenta(){META=metaCargar();SUC.primero=true;ahora(true);},_dev:dev,_canon:canon};
})();

</script>
<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────
   Para todos los juegos en línea. Cuando alguien se corta (se le fue la señal, subió al micro, cerró la app sin
   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el
   juego espera (TrucAR de a 2, el duelo de BloqueAR). Si vuelve, recupera su lugar y su mano.
   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).
   API (window.RECON):
   · GRACIA                         ms de espera (60.000).
   · recordar(juego, info) / recuerdo(juego) / olvidar(juego)   la mesa en la que estás (info: {mesa, host, seat, …}).
     recuerdo() devuelve null si pasó más de GRACIA desde el último recordar() (la partida ya no te espera).
   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta
     encontrar la invitación de vuelta de esa mesa y llama onInv(inv). Devuelve {cancelar()}.
   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa?

   v67 · SEGUNDO PLANO: salir a contestar un WhatsApp y volver.
   · Al pasar a segundo plano (visibilitychange / pagehide / freeze) se manda por TODAS las conexiones abiertas un aviso
     chiquito («\u0001fondo:1»); al volver, «\u0001fondo:0». Los juegos no lo ven: se filtra antes de que llegue a su
     onmessage. Del otro lado, mientras alguien avisó que se fue un momento, RECON.GRACIA vale RECON.GRACIA_FONDO
     (5 minutos; o 3 veces la gracia de las pruebas) en vez de la normal, y el cartel dice «salió un momento de la app».
   · El que volvió: recuerdo() acepta hasta GRACIA_FONDO desde que la página se fue a segundo plano.
   · RECON.fondo() → {yo: ms desde que me fui (0 si estoy), otro: ms desde que el otro avisó (0 si nadie)}.
   v67 · RED: mejor conexión.
   · Toda RTCPeerConnection (de cualquier juego) suma servidores STUN públicos de respaldo (Google 1 y 2, Cloudflare),
     sin repetir los que ya trae el juego.
   · RED.gathered(pc, max=6000): espera los candidatos ICE, pero termina antes si ya hay salida directa (srflx) y relé
     (relay) y no llega nada nuevo en 400 ms, o a los 2,5 s si ya hay alguno de los dos. Sin internet de verdad (sólo
     candidatos locales) espera como antes, hasta «complete» o max. */
(function(){
'use strict';
if(window.RECON)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const GRACIA_BASE=Number(ls.get('recon-gracia'))||60000;   // (las pruebas la pueden achicar)
const GRACIA_FONDO=Number(ls.get('recon-gracia'))?GRACIA_BASE*3:300000;
/* ── Segundo plano (v67) ── */
const FONDO={yoDesde:0};
const MARCA='\u0001fondo:';
const CANALES=new Set(),FUERA=new Map();
const PING='\u0001ping:',PONG='\u0001pong:',RTT=new WeakMap();
setInterval(()=>{if(document.hidden)return;const t=String(Date.now());for(const ch of CANALES){try{if(ch.readyState==='open')ch.send(PING+t);}catch(_){}}},5000);
function rtt(ch){const v=ch&&RTT.get(ch);return v==null?Infinity:v;}
/* v77 · RELEVO: si el que lleva la mesa se va, la sigue otro (el «suplente»).
   · El que lleva la mesa elige el suplente: el jugador con mejor conexión (menor RTT medido con los ping de arriba) y,
     a igualdad, el primero. Le manda a él solo el estado completo de la partida (también en los juegos con cartas tapadas:
     así, si la mesa se cae, nadie pierde la mano) y a todos quién es el suplente. Lo hace cada juego (uno, truco, ludo, pool).
   · Si la mesa se cae y no vuelve en RELEVO_MS (o se fue a propósito: enseguida), el suplente pasa a llevarla: arma la mesa
     con ese estado, la compu ocupa los lugares de los que faltan y les manda a todos la invitación de vuelta de la misma mesa
     (los demás ya la están buscando y aceptan la del suplente igual que la del que llevaba la mesa).
   · El que llevaba la mesa, si vuelve, queda como uno más: busca la invitación del suplente. */
function elegirSuplente(lugares,excluir){let mejor=-1,r=Infinity;
  (lugares||[]).forEach((L,i)=>{if(i===excluir||!L||L.tipo!=='humano'||!L.ch||L.ch.readyState!=='open')return;const x=rtt(L.ch);if(mejor<0||x<r){mejor=i;r=x;}});return mejor;}
function relevoMs(){return Number(ls.get('recon-relevo'))||(fondoOtro()?45000:20000);}
function registrar(ch){
  if(!ch||CANALES.has(ch))return;CANALES.add(ch);
  // Primer oyente del canal: lo nuestro no le llega al juego.
  // Cada conexión lleva su propio «se fue un momento» (se borra con el «volví» o a los GRACIA_FONDO).
  ch.addEventListener('message',e=>{if(typeof e.data!=='string'||e.data.charCodeAt(0)!==1)return;
    if(e.data.startsWith(MARCA)){e.stopImmediatePropagation();if(e.data.endsWith('1'))FUERA.set(ch,Date.now());else FUERA.delete(ch);return;}
    // v77 · RTT: «ping» de un lado, «pong» del otro; cuánto tarda cada conexión (para elegir quién sigue la mesa si el que la lleva se va)
    if(e.data.startsWith(PING)){e.stopImmediatePropagation();try{if(ch.readyState==='open')ch.send(PONG+e.data.slice(PING.length));}catch(_){}return;}
    if(e.data.startsWith(PONG)){e.stopImmediatePropagation();const ms=Date.now()-Number(e.data.slice(PONG.length));if(ms>=0&&ms<60000){const v=RTT.get(ch);RTT.set(ch,v==null?ms:Math.round(v*.7+ms*.3));}return;}});
  ch.addEventListener('close',()=>CANALES.delete(ch));
}
function avisarFondo(si){for(const ch of CANALES){try{if(ch.readyState==='open')ch.send(MARCA+(si?'1':'0'));}catch(_){}}}
let ocultoT=0,cerrando=false;
function alOcultar(){if(!FONDO.yoDesde){FONDO.yoDesde=Date.now();ls.set('recon-fondo',String(FONDO.yoDesde));}avisarFondo(true);}
// Al ocultarse se espera un cuarto de segundo: si en ese rato la página se cierra de verdad, no es «un momento».
function alOcultarLuego(){clearTimeout(ocultoT);ocultoT=setTimeout(()=>{if(!cerrando&&document.hidden)alOcultar();},250);}
// Cerrar la app de verdad (no es «un momento»): se avisa que no, así la mesa espera lo de siempre.
function alCerrar(e){if(e&&e.persisted){alOcultar();return;}cerrando=true;clearTimeout(ocultoT);avisarFondo(false);}
function alVolver(){const ya=FONDO.yoDesde;FONDO.yoDesde=0;if(ya)avisarFondo(false);}
try{
  document.addEventListener('visibilitychange',()=>{document.hidden?alOcultarLuego():(clearTimeout(ocultoT),alVolver());});
  window.addEventListener('pagehide',alCerrar);document.addEventListener('freeze',alOcultar);document.addEventListener('resume',alVolver);
}catch(_){}
function ultimoFuera(){let t=0;for(const [ch,x] of FUERA){if(Date.now()-x>GRACIA_FONDO)FUERA.delete(ch);else if(x>t)t=x;}return t;}
const fondoOtro=()=>!!ultimoFuera();
const fondo=()=>{const t=ultimoFuera();return {yo:FONDO.yoDesde?Date.now()-FONDO.yoDesde:0,otro:t?Date.now()-t:0};};
/* ── RED (v67): STUN de respaldo y espera de candidatos más corta ── */
const STUN_EXTRA=['stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302','stun:stun.cloudflare.com:3478'];
function sumarIce(cfg){
  cfg=cfg&&typeof cfg==='object'?{...cfg}:{};const L=Array.isArray(cfg.iceServers)?cfg.iceServers.slice():[];
  const ya=new Set();for(const x of L)for(const u of [].concat(x&&x.urls||[]))ya.add(String(u));
  const nuevos=STUN_EXTRA.filter(u=>!ya.has(u));if(nuevos.length)L.push({urls:nuevos});cfg.iceServers=L;return cfg;
}
try{
  const PC=window.RTCPeerConnection;
  if(PC&&!PC.__bloques){
    const W=class extends PC{constructor(cfg,...r){super(sumarIce(cfg),...r);try{this.addEventListener('datachannel',e=>registrar(e.channel));}catch(_){}}};
    W.__bloques=true;
    const cdc=PC.prototype.createDataChannel;
    PC.prototype.createDataChannel=function(...a){const ch=cdc.apply(this,a);registrar(ch);return ch;};
    window.RTCPeerConnection=W;
  }
}catch(_){}
function gathered(pc,max=6000){
  return new Promise(res=>{
    if(!pc||pc.iceGatheringState==='complete')return res();
    const t0=Date.now();let ult=t0,n=-1,listo=false;
    const fin=()=>{if(listo)return;listo=true;clearInterval(iv);clearTimeout(to);res();};
    const to=setTimeout(fin,max);
    try{pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete')fin();});}catch(_){}
    const iv=setInterval(()=>{
      if(pc.iceGatheringState==='complete')return fin();
      const sdp=(pc.localDescription&&pc.localDescription.sdp)||'',c=(sdp.match(/a=candidate/g)||[]).length,ahora=Date.now();
      if(c!==n){n=c;ult=ahora;}
      const srflx=/ typ srflx/.test(sdp),relay=/ typ relay/.test(sdp),quieto=ahora-ult>=400,t=ahora-t0;
      if(srflx&&relay&&quieto&&t>=600)fin();
      else if((srflx||relay)&&quieto&&t>=2500)fin();
    },150);
  });
}
window.RED={gathered,sumarIce,STUN_EXTRA};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(p,ms=12000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}
/* ── La mesa en la que estás ── */
function recordar(juego,info){ls.set('recon-'+juego,JSON.stringify({...info,t:Date.now()}));}
// (v67) Si la página se fue a segundo plano después del último recordar(), la partida te espera más (GRACIA_FONDO).
// v77 · BUG «a los demás les aparece que puedo volver, pero yo no puedo»: la página que se abre de nuevo calculaba su espera
// con t + RECON.GRACIA, y en una página recién abierta GRACIA vale 60 s aunque la mesa te espere 5 min (saliste «un momento»).
// Ahora recuerdo() devuelve t corrido para que t + GRACIA sea justo hasta cuándo te espera la mesa (t0: el original; hasta).
function limite(o){const f=Number(ls.get('recon-fondo'))||0;return f&&f>=(o.t||0)-5000?Math.max(GRACIA_BASE,GRACIA_FONDO):GRACIA_BASE;}
function recuerdo(juego){const o=ls.json('recon-'+juego,null);if(!o)return null;const lim=limite(o),t0=o.t||0;
  if(Date.now()-t0>=lim||ls.get('recon-ab-'+juego+'-'+o.mesa))return null;const hasta=Math.max(t0+lim,Date.now()+15000);   // (al menos 15 s para buscar: la mesa cuenta su espera desde el corte, que pudo ser después)
  return {...o,t0,t:hasta-GRACIA_BASE,hasta};}
function olvidar(juego){ls.set('recon-'+juego,null);try{quitar('recon-aviso');}catch(_){}}
/* ── Cartel con cuenta regresiva ── */
const CART=new Map();
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function css(){if(document.getElementById('recon-css'))return;const s=document.createElement('style');s.id='recon-css';
  s.textContent=`.recon-bar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.recon-bar>div{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(20,26,34,.92);color:#f4f1e8;border:1px solid rgba(242,193,78,.55);box-shadow:0 6px 20px rgba(0,0,0,.35);font:600 13.5px/1.3 system-ui,-apple-system,sans-serif;max-width:100%}
.recon-bar>div i{font-style:normal}.recon-bar>div b{font-variant-numeric:tabular-nums;color:#f2c14e;margin-left:auto}
.recon-bar .recon-sp{width:12px;height:12px;border-radius:50%;border:2px solid #f2c14e;border-right-color:transparent;animation:recon-g 1s linear infinite;flex:none}
.recon-bar>div.recon-aviso{border-radius:16px;flex-wrap:wrap}.recon-bar>div.recon-aviso .recon-t{flex:1 1 150px}
@keyframes recon-g{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.recon-bar .recon-sp{animation:none}}`;
  (document.head||document.documentElement).appendChild(s);}
function barra(){let b=document.querySelector('.recon-bar');if(!b){css();b=document.createElement('div');b.className='recon-bar';b.setAttribute('role','status');b.setAttribute('aria-live','polite');document.body.appendChild(b);}return b;}
function cartel(id,texto,hasta,onFin){quitar(id);
  if(fondoOtro()&&/se cort|desconect/i.test(String(texto)))texto=String(texto).replace(/se cortó|se desconectó/i,'salió un momento de la app');const el=document.createElement('div');el.dataset.recon=id;
  el.innerHTML='<span class="recon-sp" aria-hidden="true"></span><span class="recon-t"></span><b></b>';el.querySelector('.recon-t').textContent=texto;barra().appendChild(el);
  if(/^Volviendo a la partida/i.test(String(texto)))setTimeout(()=>{try{if(CART.get(id)&&CART.get(id).el===el)abandonarDesdeCartel(id,el);}catch(_){}},0);
  const pinta=()=>{const r=hasta-Date.now();el.querySelector('b').textContent=mmss(r);if(r<=0){quitar(id);try{onFin&&onFin();}catch(e){console.warn(e);}}};
  pinta();const iv=setInterval(pinta,500);CART.set(id,{el,iv,texto:String(texto),onFin});return el;}
function quitar(id){const c=CART.get(id);if(!c)return;clearInterval(c.iv);c.el.remove();CART.delete(id);}
/* ── El que lleva la mesa: manda la invitación de vuelta y espera ── */
function reinvitar(o){
  let vivo=true,id='';const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{
    const a=acct();if(!a)return;
    while(!fin()&&!id){try{const j=await call({accion:'invitar',usuario:a.usuario,token:a.token,para:o.para,oferta:o.prefijo+JSON.stringify({...o.oferta,re:String(o.re||o.oferta.mesa||'')})});id=j.id;}catch(_){await sleep(2500);}}
    const t0=Date.now();   // v76: mientras se reconecta, cada 0,7 s (los primeros 90 s)
    while(!fin()){await sleep(window.LATIDO?LATIDO.espera(t0):2000);if(fin())break;
      let r;try{r=await call({accion:'buzon',usuario:a.usuario,token:a.token,id});}catch(_){continue;}
      if(r.estado==='aceptada'&&r.respuesta){vivo=false;let sdp='';try{sdp=JSON.parse(r.respuesta).sdp||'';}catch(_){}o.onRespuesta(sdp,id,r.respuesta);return;}   // (raw: para respuestas que no son JSON, como las de BloqueAR)
      if(r.estado==='rechazada'){vivo=false;dejoLaMesa(o.para);return;}   // v77: abandonó («Abandonar»): no se lo espera más
      if(r.estado==='cancelada'||r.estado==='vencida')break;}
    if(id){try{await call({accion:'cancelar',usuario:a.usuario,token:a.token,id});}catch(_){}}
  })();

}
/* v77 · El que se cortó apretó «Abandonar»: se terminan ya los carteles «X se cortó · esperándolo…» de esa persona
   (su onFin es lo mismo que pasa cuando se acaba la espera: la compu ocupa su lugar o la partida termina) y se avisa. */
function dejoLaMesa(nom){const n=String(nom||'').toLowerCase();if(!n)return;let hubo=false;
  for(const [id,c] of [...CART]){if(String(c.texto||'').toLowerCase().includes(n)&&/cort|momento|esperándol|desconect/i.test(c.texto)){hubo=true;quitar(id);try{c.onFin&&c.onFin();}catch(e){console.warn(e);}}}
  aviso(`${nom} abandonó la partida.`);return hubo;}
function aviso(txt){try{if(typeof window.toast==='function'){window.toast(txt);return;}}catch(_){}
  try{css();const el=document.createElement('div');el.textContent=txt;el.style.cssText='opacity:1;transition:opacity .4s';barra().appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),450);},3800);}catch(_){}}
/* ── El que se cortó: busca la invitación de vuelta ── */
function esVuelta(inv,prefijo,mesa){const of=String(inv&&inv.oferta||'');if(!of.startsWith(prefijo))return false;
  try{const o=JSON.parse(of.slice(prefijo.length));return !!o.re&&String(o.re)===String(mesa);}catch(_){return false;}}
function buscarVuelta(o){
  let vivo=true;const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{const a=acct();if(!a)return;
    while(!fin()){
      try{const j=await call({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
        if(inv&&esVuelta(inv,o.prefijo,o.mesa)&&(!o.de||String(inv.de).toLowerCase()===String(o.de).toLowerCase())){vivo=false;o.onInv(inv);return;}}catch(_){}
      await sleep(2500);}
  })();

}
/* ── v77 · «Tenés una partida en curso: Volver / Abandonar» en TODAS las páginas ──
   Antes, volver sólo pasaba si abrías la página de ese juego; si reabrías la app en el inicio (o en otro juego) no había forma
   de volver aunque la mesa te estuviera esperando. Ahora cualquier página muestra el renglón con la cuenta regresiva:
   · Volver → abre el juego, que acepta solo la invitación de vuelta (como siempre).
   · Abandonar → avisa a la planilla (accion «abandonar»): la invitación de vuelta (la que está y las que vengan) se rechaza

     partida…» también trae «Abandonar». */
const JUEGOS={uno:['uno.html','UnoAR'],truco:['truco.html','TrucAR'],'truco-eq':['truco.html','TrucAR'],ludo:['ludo.html','LudoAR'],pool:['pool.html','PoolAR'],poblar:['poblar.html','PoblAR']};   // (InvasorAR no: en el duelo cada uno juega su campo en su aparato; si cerrás la app, esa partida no se puede retomar)
const pagina=()=>{try{return (location.pathname.split('/').pop()||'index.html').toLowerCase();}catch(_){return '';}};
function enCurso(){const out=[];for(const j of Object.keys(JUEGOS)){const rc=recuerdo(j);if(rc&&rc.rol!=='host'&&rc.mesa&&rc.host)out.push([j,rc]);}return out;}
async function abandonar(juego){const o=ls.json('recon-'+juego,null);olvidar(juego);if(!o||!o.mesa)return false;
  ls.set('recon-ab-'+juego+'-'+o.mesa,'1');const a=acct();if(!a||!o.host)return false;
  for(let i=0;i<4;i++){try{await call({accion:'abandonar',usuario:a.usuario,token:a.token,mesa:String(o.mesa),de:String(o.host)});return true;}catch(_){await sleep(1500);}}
  return false;}
function boton(txt,fn,fuerte){const b=document.createElement('button');b.type='button';b.textContent=txt;
  b.style.cssText='font:700 12.5px/1 system-ui,sans-serif;border-radius:999px;padding:6px 11px;cursor:pointer;border:1px solid rgba(242,193,78,.7);'+(fuerte?'background:#f2c14e;color:#1a1f27':'background:transparent;color:#f4f1e8');
  b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();fn();});return b;}
let AV_T=0;
function avisoEnCurso(){
  if(CART.has('recon-aviso'))return;const L=enCurso();if(!L.length)return;
  const pag=pagina(),[j,rc]=L[0],[url,nom]=JUEGOS[j];
  if(pag===url)return;   // en la página del juego se encarga el juego (y su cartel trae «Abandonar»)

  el.classList.add('recon-aviso');el.querySelector('.recon-sp').remove();
  el.insertBefore(boton('Volver',()=>{location.href=url;},true),el.querySelector('b'));

// En la página del juego: «Volviendo a la partida de X…» + «Abandonar» (recarga la página sin esa mesa).
function abandonarDesdeCartel(id,el){
  const pag=pagina(),j=Object.keys(JUEGOS).find(k=>JUEGOS[k][0]===pag&&ls.get('recon-'+k));if(!j)return;
  el.insertBefore(boton('Abandonar',()=>{const c=CART.get(id);if(c)c.onFin=null;quitar(id);abandonar(j).finally(()=>{try{location.replace(location.pathname);}catch(_){location.reload();}});}),el.querySelector('b'));

function arrancarAviso(){try{avisoEnCurso();}catch(e){console.warn(e);}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>setTimeout(arrancarAviso,1200));else setTimeout(arrancarAviso,1200);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(arrancarAviso,1500);});

})();

/* ───────── Gestos y animaciones de salida para paneles (v67) ─────────

       op = {panel:'selector del panel adentro del fondo' (opcional), dir:'derecha'|'abajo'|'nada', ms:180,

<script>

(function(){

// v70: «info» (opcional) dice cómo fue la partida, para que las leguas dependan del rival y del resultado, para los

//   info = {j: 'truco' (id del juego), res: 'g' ganó | 'e' empate | 'p' perdió, rival: 'p' personas | 'c' compu | 's' solo,

/* ── Leguas de La Gran Pampa (v70) ──

/* ── Partidas de cada juego, para el perfil (v70) ──

/* TÍTULOS de los demás (v70): la planilla los manda en «usuarios» (ti, y cau = los campeones de la última semana de La Gran
   Pampa: «Caudillo de la semana» durante la semana siguiente) y en el perfil. Se guardan en «bloques-titulos-v1».
   TITULOS.html(usuario) → <span class="tit-chip"> discreto (o ''), para poner al lado del nombre. */
window.TITULOS=(function(){
  const K='bloques-titulos-v1';let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}M.u=M.u||{};M.cau=Array.isArray(M.cau)?M.cau:[];return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M));}catch(_){}};
  const limpio=t=>String(t||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,32);
  function poner(u,t,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const v=limpio(t);if(v)M.u[k]=v;else delete M.u[k];if(guardar)save();}
  function caudillos(L,sem){load();M.cau=(Array.isArray(L)?L:[]).map(x=>String(x||'').toLowerCase()).filter(Boolean);M.sem=sem||'';save();}
  function guardarLista(L,cau){if(!Array.isArray(L))return;load();for(const x of L)if(x&&x.usuario!==undefined)poner(x.usuario,x.ti,false);if(Array.isArray(cau))M.cau=cau.map(x=>String(x||'').toLowerCase());save();}
  function de(u){load();const k=String(u||'').toLowerCase();if(M.cau.includes(k))return {t:'Caudillo de la semana',cau:true};
    if(window.ORO){try{const a=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');if(a&&String(a.usuario).toLowerCase()===k){const t=ORO.titulo();return t?{t:t.n}:null;}}catch(_){}}
    return M.u[k]?{t:M.u[k]}:null;}
  function html(u){const x=de(u);if(!x)return '';try{ORO.css();}catch(_){}const e=String(x.t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);return `<span class="tit-chip${x.cau?' cau':''}" title="${e}">${x.cau?'🏆 ':''}${e}</span>`;}
  return {poner,caudillos,guardarLista,de,html};
})();

function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;
    try{if(window.RANGOS&&RANGOS.pampaAct)RANGOS.pampaAct('r',1);}catch(_){}}   // v70: los 3 retos de la semana de un juego dan 1 legua para La Gran Pampa
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&(R.GAMES[j]||(R.SOLOS&&R.SOLOS[j])))R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='ludo'&&win){if(d.n>=4&&!d.eq)E.push(['ganadas_4',1]);if(d.eq)E.push(['ganadas_eq',1]);if(d.limpio)E.push(['limpio',1]);}
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='pool'){if(d.modo==='online')E.push(['online_part',1]);if(win&&d.dobles)E.push(['dobles_gan',1]);if(win&&d.limpia)E.push(['limpia',1]);}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}
  if(j==='buscaminas'&&win){E.push(['gan_'+dif,1]);if(dif!=='principiante')E.push(['gan_ie',1]);if(d.diario)E.push(['dias',1]);if(d.sinBand)E.push(['sin_band',1]);
    if(d.limpio){E.push(['sin_pistas',1]);if(dif!=='principiante')E.push(['limpios_ie',1]);}
    if(dif==='principiante'&&d.ms<20000)E.push(['rapido_p',1]);if(dif==='intermedio'&&d.ms<120000)E.push(['rapido_i',1]);}
  if(j==='invasores'){if(d.olas)E.push(['oleadas',d.olas]);if(d.bajas)E.push(['bajas',d.bajas]);if(d.sum)E.push(['suministros',d.sum]);if(d.cen)E.push(['centinela',d.cen]);if(d.nod)E.push(['nodriza',d.nod]);if(d.perf)E.push(['perfectos',d.perf]);
    if(d.escudos)E.push(['escudos',d.escudos]);if(d.diario)E.push(['dias',1]);if(win&&d.limpio)E.push(['limpio',1]);if(win&&dif==='experta'&&d.modo==='solo')E.push(['gan_experta',1]);}
  if(j==='laberinto'){if(d.limpios)E.push(['limpios',d.limpios]);if(d.sinMorir)E.push(['sin_morir',d.sinMorir]);if(d.combo4)E.push(['combo4',1]);if(d.capturas)E.push(['capturas',d.capturas]);
    if(d.bonus)E.push(['bonus',d.bonus]);if(d.vuelta)E.push(['vuelta',1]);if(d.diario)E.push(['dias',1]);if(d.limDif)E.push(['lim_dif',d.limDif]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);out.html=apBoton(j,'fin');return out;}

  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  out.html+=apBoton(j,'fin');   // v72: la apariencia, a mano al terminar
