/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(op.oro)return !!(window.ORO&&ORO.tiene(op.k_));if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
let PREV=null;   // v72: {j,tipo,id} mientras se prueba una en la hoja
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';if(PREV&&PREV.j===j&&PREV.tipo===tipo&&A.op.some(x=>x.id===PREV.id))return PREV.id;const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;
  const retH=rs.length?`<section class="lg-sec"><h3>Retos de la semana</h3><p class="lg-lead">Los mismos para todos. Se renuevan el lunes: faltan ${diasHastaLunes()}.</p>
    ${rs.map(r=>`<div class="lg-reto${r.hecho?' ok':''}"><div class="lg-rt"><b>${esc(r.txt)}</b><small>${r.hecho?'✅ Cumplido':`${fmt(r.va)} de ${fmt(r.n)}`} · +${r.xp} XP${window.ORO?` y ${ORO.ico()} ${ORO.ORO_TABLA.reto} de oro`:''}</small></div><div class="lg-bar"><i style="width:${(r.va/r.n*100).toFixed(1)}%"></i></div></div>`).join('')}</section>`:'';
  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);
    return `<div class="lg-l${on?' on':''}"><i>${L.e}</i><div><b>${esc(L.n)}</b><small>${esc(L.d)}</small>${!on&&m>1?`<div class="lg-bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><small>${fmt(v)} de ${fmt(m)}</small>`:''}</div>${on?'<em>✓</em>':''}</div>`;}).join('')}</div></section>`;
  const tipos=Object.entries(G.ap);
  const apH=tipos.length?`<section class="lg-sec"><h3>Apariencias</h3><p class="lg-lead">Se destraban subiendo de nivel en ${esc(G.n)} (vas por el ${nivel(j)}), con logros o con oro${window.ORO?` (tenés ${ORO.ico()}<b data-oro-saldo>${fmt(ORO.saldo())}</b>)`:''}. Las de nivel 10, 20 y 30 no se venden.</p>
    ${tipos.map(([tipo,A])=>{const cur=apariencia(j,tipo);return `<h4>${esc(A.n)}</h4><div class="lg-aps">${A.op.map(op=>{const ok=libre(j,op,o),req=op.logro?`Logro: ${(G.logros.find(L=>L.id===op.logro)||{}).n||''}`:op.lv?`Nivel ${op.lv}`:'';
      if(op.oro&&!ok&&window.ORO)return `<button type="button" class="lg-ap oro" data-lg-compra="${tipo}|${op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · ${ORO.ico()} ${fmt(op.oro)}</small></button>`;
      return `<button type="button" class="lg-ap${cur===op.id?' on':''}" data-lg-tipo="${tipo}" data-lg-id="${op.id}" ${ok?'':'disabled'} aria-pressed="${cur===op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${cur===op.id?'Puesta':ok?'Elegir':'🔒 '+esc(req)}</small></button>`;}).join('')}</div>`;}).join('')}</section>`:'';
  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};
  const x=root.querySelector('#lg-x');if(x)x.onclick=()=>{op.cerrar?op.cerrar():(root.closest('.side')||{}).hidden=true;};
  root.querySelectorAll('[data-lg-tipo]').forEach(el=>el.onclick=()=>{if(elegir(j,el.dataset.lgTipo,el.dataset.lgId)){const top=root.scrollTop;abrir(j,op);root.scrollTop=top;}});
  // v70: comprar con oro (el primer toque pregunta; el segundo compra y la pone)
  root.querySelectorAll('[data-lg-compra]').forEach(el=>el.onclick=()=>{const [tipo,id]=el.dataset.lgCompra.split('|'),A=D[j]&&D[j].ap[tipo],ap=A&&A.op.find(x=>x.id===id);if(!ap||!window.ORO)return;
    const sm=el.querySelector('small');
    if(el.dataset.seguro!=='1'){root.querySelectorAll('[data-seguro]').forEach(x=>{delete x.dataset.seguro;x.classList.remove('preg');});el.dataset.seguro='1';el.classList.add('preg');
      if(sm)sm.innerHTML=ORO.saldo()>=ap.oro?`¿Comprar por ${ORO.ico()} ${fmt(ap.oro)}? Tocá de nuevo`:`Te faltan ${ORO.ico()} ${fmt(ap.oro-ORO.saldo())}`;return;}
    if(!ORO.comprar(ap.k_,ap.oro,`${D[j].n} · ${ap.n}`)){if(sm)sm.textContent='No te alcanza el oro';return;}
    try{if(window.SFX_ORO)SFX_ORO();}catch(_){}
    elegir(j,tipo,id);const top=root.scrollTop;(op.refrescar||(()=>{if(op.side)abrir(j,op);else{root.innerHTML=panelHtml(j);cablear(root,j,op);}}))();root.scrollTop=top;});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

/* ── v72: hoja «🎨 Apariencia» de cada juego ── */
const tieneAp=j=>j==='bloquear'?typeof window.abrirAparienciaBloquear==='function':!!(D[j]&&Object.keys(D[j].ap||{}).length);
function apBoton(j,donde){if(!tieneAp(j))return '';css();return `<div class="lg-apfin"><button type="button" class="lg-apb" data-ap-hoja="${esc(j)}">🎨 Apariencia de ${esc(j==='bloquear'?'BloqueAR':D[j].n)}</button></div>`;}
function pagina(){return document.documentElement.dataset.apJuego||PAGJ||'';}
const avisarCambio=j=>{try{dispatchEvent(new CustomEvent('lg-apariencia',{detail:{j}}));}catch(_){}};
function prevPoner(j,tipo,id){const A=D[j].ap[tipo];PREV=id?{j,tipo,id}:null;
  for(const t of Object.keys(D[j].ap)){const v=apariencia(j,t);if(v===D[j].ap[t].op[0].id)document.documentElement.removeAttribute('data-lg-'+t);else document.documentElement.setAttribute('data-lg-'+t,v);}
  avisarCambio(j);}
function reqTxt(j,op,o){const G=D[j];if(op.oro)return `${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · se compra con oro`;if(op.logro)return 'Con el logro «'+((G.logros.find(L=>L.id===op.logro)||{}).n||op.logro)+'»';if(op.lv)return `Se destraba en el nivel ${op.lv} de ${G.n} (vas por el ${nivel(j)})${op.lv>=10&&!op.oro?' · no se vende':''}`;return 'La de siempre';}
function hoja(j){
  if(j==='bloquear'){try{window.abrirAparienciaBloquear();}catch(_){}return;}
  const G=D[j];if(!tieneAp(j))return;css();aplicar(j);
  let el=document.getElementById('lg-hoja');if(el)el.remove();
  el=document.createElement('div');el.id='lg-hoja';el.className='lgh';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Apariencia de '+G.n);
  const H={sel:null};
  const pintar=()=>{const o=load(),O=window.ORO;
    const cards=Object.entries(G.ap).map(([tipo,A])=>{const cur=apariencia(j,tipo),eq=(o.ap[j]||{})[tipo]||A.op[0].id,puesta=A.op.some(x=>x.id===eq&&libre(j,x,o))?eq:A.op[0].id;
      return `<h4>${esc(A.n)}</h4><div class="lgh-row" role="listbox" aria-label="${esc(A.n)}">${A.op.map(op=>{const ok=libre(j,op,o),sel=H.sel&&H.sel.tipo===tipo&&H.sel.id===op.id,on=puesta===op.id;
        const est=on?'✓ Puesta':ok?'Tuya':op.oro&&O?`${O.ico()} ${fmt(op.oro)}`:'🔒 '+(op.logro?'Logro':op.lv?'Nivel '+op.lv:'');
        return `<button type="button" class="lgh-c${on?' on':''}${sel?' sel':''}${ok?'':' lock'}${op.oro&&!ok?' oro':''}" data-t="${tipo}" data-id="${op.id}" aria-selected="${sel||(!H.sel&&on)}"><span class="lgh-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${est}</small></button>`;}).join('')}</div>`;}).join('');
    let act='';
    if(H.sel){const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id),ok=libre(j,op,o),eq=apEquipada(j,H.sel.tipo,o);
      const tit=`<div class="lgh-sel"><span class="lgh-sw" style="background:${op.sw}"></span><span><b>${esc(op.n)}</b><small>${esc(A.n)} · ${eq===op.id?'la que tenés puesta':ok?'es tuya':esc(reqTxt(j,op,o))}</small></span></div>`;
      if(eq===op.id)act=tit+`<button type="button" class="lgh-go" disabled>✓ Puesta</button>`;
      else if(ok)act=tit+`<button type="button" class="lgh-go" data-a="poner">Ponérmela</button>`;
      else if(op.oro&&O){const sd=O.saldo();act=tit+(sd>=op.oro?`<button type="button" class="lgh-go oro" data-a="comprar">Comprar por ${O.ico()} ${fmt(op.oro)}</button>`:`<button type="button" class="lgh-go" disabled>Te faltan ${O.ico()} ${fmt(op.oro-sd)}</button>`);}
      else act=tit+`<button type="button" class="lgh-go" disabled>🔒 Todavía no</button>`;}
    else act=`<p class="lgh-tip">Tocá una para probarla en la mesa. Las de nivel 10, 20 y 30 no se venden.</p>`;
    el.innerHTML=`<div class="lgh-in"><header><b>🎨 Apariencia · ${esc(G.n)}</b>${window.ORO?`<span class="lgh-oro" title="Tu oro">${ORO.ico()} <b>${fmt(ORO.saldo())}</b></span>`:''}<button type="button" class="lgh-x" aria-label="Cerrar">✕</button></header>
      <div class="lgh-body">${cards}</div><footer class="lgh-act">${act}</footer></div>`;
    const x=el.querySelector('.lgh-x');x.onclick=cerrar;};
  const cerrar=()=>{PREV=null;el.remove();aplicar(j);avisarCambio(j);document.removeEventListener('keydown',tecla,true);};
  const tecla=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cerrar();}};
  el.addEventListener('click',e=>{
    if(e.target===el){cerrar();return;}
    const c=e.target.closest('.lgh-c');
    if(c){const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
      H.sel={tipo:c.dataset.t,id:c.dataset.id};prevPoner(j,H.sel.tipo,H.sel.id);pintar();
      el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);return;}
    const a=e.target.closest('[data-a]');if(!a||!H.sel)return;
    const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id);
    const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
    if(a.dataset.a==='comprar'){if(!window.ORO||!ORO.comprar(op.k_,op.oro,`${G.n} · ${op.n}`))return;try{if(window.SFX_ORO)SFX_ORO();}catch(_){}}
    PREV=null;elegir(j,H.sel.tipo,H.sel.id);avisarCambio(j);pintar();
    el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);
  });
  ['pointerdown','touchstart','keydown','keyup','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));
  document.addEventListener('keydown',tecla,true);
  document.body.appendChild(el);pintar();try{el.querySelector('.lgh-x').focus({preventScroll:true});}catch(_){}
}
function apEquipada(j,tipo,o){const A=D[j].ap[tipo],id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
// Cualquier botón data-ap-hoja abre la hoja; si estaba dentro del menú ☰, el menú se cierra.
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ap-hoja]');if(!b)return;e.preventDefault();e.stopPropagation();
  const j=b.dataset.apHoja||pagina();if(b.closest('#side')){try{typeof window.closeSide==='function'?window.closeSide():(document.getElementById('side').hidden=true);}catch(_){}}
  hoja(j);},true);
// Se agrega sola al menú ☰ (junto a «Logros y retos») y a «La mesa está lista» de cada juego.
function inyectar(){const j=pagina();if(!j||!tieneAp(j)||j==='bloquear')return;
  const m=document.getElementById('m-logros');
  if(m&&!m.dataset.apOk){m.dataset.apOk='1';const P=m.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.id='m-apariencia';b.dataset.apHoja=j;b.className=m.className;b.textContent='🎨 Apariencia';P.insertBefore(b,m.nextSibling);}}
  const n=document.getElementById('mv-new');
  if(n&&!n.dataset.apOk){n.dataset.apOk='1';const P=n.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.apHoja=j;b.textContent='🎨 Apariencia';P.appendChild(b);}}
}
let INY=0;
try{new MutationObserver(()=>{if(INY)return;INY=requestAnimationFrame(()=>{INY=0;try{inyectar();}catch(_){}});}).observe(document.documentElement,{childList:true,subtree:true});}catch(_){}

/* ── Para el menú de juegos y Mi cuenta ── */
function contar(){const o=load(),out={};for(const j of ORDEN){if(OCULTOS.includes(j))continue;out[j]={tiene:D[j].logros.filter(L=>tiene(o,j,L.id)).length,total:D[j].logros.length};}return out;}
function resumenHtml(){css();const C=contar(),o=load();
  return `<div class="lg-res">${Object.entries(C).map(([j,x])=>{const rs=retos(j),h=rs.filter(r=>r.hecho).length;
    return `<div class="lg-rr"><i>${D[j].e}</i><span><b>${esc(D[j].n)}</b><small>${x.tiene} de ${x.total} logros${rs.length?` · retos de la semana ${h}/${rs.length}`:''}</small></span><span class="lg-bar"><i style="width:${(x.tiene/x.total*100).toFixed(1)}%"></i></span></div>`;}).join('')}</div>`;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() ── */
function exportData(){const o=load();return {g:o.g,c:o.c,s:{w:o.s.w,c:o.s.c,h:o.s.h},ap:o.ap,at:o.at||0};}
// Une lo de la planilla con lo de acá. Devuelve {ch: cambió algo acá, falta: acá hay algo que la planilla no tiene}.
function importData(d){
  const res={ch:false,falta:false};if(!d||typeof d!=='object')return res;const o=load();
  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}
  for(const [j,C] of Object.entries(o.c))for(const [k,v] of Object.entries(C))if(v>((d.c&&d.c[j]&&d.c[j][k])||0))res.falta=true;
  const s=d.s;if(s&&s.w===o.s.w){for(const [j,C] of Object.entries(s.c||{})){if(!D[j])continue;const sc=(o.s.c[j]=o.s.c[j]||{});for(const [k,v] of Object.entries(C||{}))if(Number.isFinite(v)&&v>(sc[k]||0)){sc[k]=v;res.ch=true;}}
    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
  // Los retos que la planilla ya tenía cumplidos se marcan acá sin volver a dar el premio.
  if(res.ch)save(o);
  return res;
}
function ocultar(L){OCULTOS=Array.isArray(L)?L.slice():[];}

<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).

   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},

   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */

  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */

  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);

/* ── Datos guardados en este dispositivo ── */

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){

    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);

  else if(viejo)pie=`<span class="cx-inv-st st-vieja">Ya pasó un rato: puede que la mesa ya esté jugando.</span>`;

   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la

   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve

   · nuevo(juego, de, txt)  (v74) los chats propios (UnoAR, LudAR, InvasorAR) avisan cada mensaje que llega: si está

   El mensaje en la red: {t:'mchat', de, txt, eq}. eq=1: sólo para el equipo del que lo manda. */

   y que al abrirlo en cualquier lugar no se rompa ni quede afuera»):
   · El panel tiene alto fijo chico (clase mc-comp) y los mensajes se leen con scroll adentro. Si estás leyendo arriba,
     no te lo baja: aparece «↓ nuevos».
   · ▁ lo minimiza a una barrita que se puede llevar a cualquier lado; tocándola vuelve a abrirse ahí mismo. Con el chat
     minimizado, cada mensaje nuevo sale como globito arriba (o abajo, si no hay lugar) de la barrita.
   · Se arrastra libre por toda la pantalla. Se guarda el centro como fracción de la pantalla {cx, cy}, por juego y

function mandar(txt){

function agregar(m){S.msgs.push(m);if(S.msgs.length>80)S.msgs=S.msgs.slice(-80);if(!S.abierto&&!enEspera()&&!m.yo&&!m.sis)S.no++;dibujar();}

<script>
/* ==== MOTOR ==== */
/* LudAR: el Ludo de siempre (primo del parchís), de 2 a 4 jugadores, con la compu o con amigos.
   Tablero de 15×15: una pista de 52 casillas alrededor de una cruz, la base de cada color en una esquina y, por
   cada color, un pasillo de 5 casillas hasta la meta del medio.
   · Cada ficha guarda cuánto avanzó desde la salida de su color: -1 = en la base, 0..50 = en la pista,
     51..55 = en su pasillo (ahí nadie la puede comer) y 56 = en la meta.
   · Colores en el sentido del reloj: r rojo (arriba a la izquierda), v verde, a amarillo, z azul. La salida del color c
     es la casilla 13·c de la pista; las casillas seguras son las cuatro salidas y las cuatro estrellas (salida + 8).
   · La partida (M) tiene todo; jugar(M, lugar, acción) aplica una acción y devuelve un texto de error o null.
     En el Ludo no hay nada escondido, así que cada uno ve la partida entera (estadoPara agrega quién es y qué puede mover). */
const COLS=['r','v','a','z'];
const CNOM={r:'Rojo',v:'Verde',a:'Amarillo',z:'Azul'};
const CASA=-1,ULT=50,META=56;
const SEGURAS=[0,8,13,21,26,34,39,47];
const REGLAS0={sacar:'6',exacta:true,tres6:true,premio:true,intentos:true,barrera:false,dado:'justo'};
function reglasDe(o={}){const r={...REGLAS0};
  if(o.sacar==='6'||o.sacar==='16')r.sacar=o.sacar;
  for(const k of ['exacta','tres6','premio','intentos','barrera'])if(typeof o[k]==='boolean')r[k]=o[k];
  if(o.dado==='justo'||o.dado==='parejo')r.dado=o.dado;
  return r;}
function rngDe(seed){let s=(seed>>>0)||1;return ()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function azar(){try{const c=globalThis.crypto;if(c&&c.getRandomValues){const u=new Uint32Array(1);return ()=>{c.getRandomValues(u);return u[0]/4294967296;};}}catch(_){}return Math.random;}
function mezclar(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
// Los colores de la mesa, en el orden en que se juega (el del reloj), arrancando por el color del lugar 0.
// De a 2 se juega en esquinas opuestas; de a 3 queda libre la esquina que sigue a la última.
function coloresPara(n,c0='r'){const k=Math.max(0,COLS.indexOf(c0));
  const pasos=n===2?[0,2]:n===3?[0,1,2]:[0,1,2,3];return pasos.map(x=>COLS[(k+x)%4]);}

/* ───── Partida ─────
   o: {nombres, tipos ('humano'|'bot' por lugar), color (el del lugar 0), eq (de a 4: equipos 2 contra 2, el 0 con el 2 y el 1 con el 3),
       reglas (ver REGLAS0), seed (para repetir una partida: dado y quién empieza)}
   reglas: sacar '6' | '16' (con un 6, o con un 1 o un 6) · exacta (para entrar a la meta hay que sacar justo) · tres6 (tres seises
   seguidos: perdés el turno) · premio (comer o meter una ficha: tirás otra vez) · intentos (con todas en la base, tres intentos
   para sacar) · barrera (dos fichas del mismo color en una casilla no dejan pasar a las de otro color) · dado 'justo' | 'parejo'
   (parejo: cada uno saca del 1 al 6 en orden mezclado, sin repetir hasta que salieron los seis). */
function nuevaPartida(o={}){
  const n=Math.max(2,Math.min(4,(o.nombres||[]).length||2)),seed=(o.seed>>>0)||0,R=seed?rngDe(seed):azar();
  const id=Math.floor(azar()()*2**31).toString(36)+Math.floor(azar()()*2**31).toString(36);
  const M={v:1,id,n,seed,nombres:(o.nombres||['Vos','La compu']).slice(0,n),tipos:(o.tipos||['humano','bot']).slice(0,n),
    colores:coloresPara(n,o.color),eq:n===4&&!!o.eq,R:reglasDe(o.reglas||{}),F:Array.from({length:n},()=>[CASA,CASA,CASA,CASA]),
    turno:Math.floor(R()*n),fase:'tirar',dado:0,seises:0,intentos:0,tiros:0,fin:false,gano:null,puestos:[],acc:0,log:[],ultimo:null,
    est:Array.from({length:n},()=>({comio:0,comido:0,seis:0,llegadas:0,sacadas:0})),bolsas:Array.from({length:n},()=>[]),t0:Date.now()};
  anotar(M,`Empieza ${M.nombres[M.turno]} (${CNOM[M.colores[M.turno]].toLowerCase()}).`);
  return M;
}
function anotar(M,t){M.log.push(t);if(M.log.length>80)M.log=M.log.slice(-80);}
const colIdx=(M,q)=>COLS.indexOf(M.colores[q]);
// Casilla de la pista (0..51) donde está una ficha de q que avanzó p (sólo para 0 ≤ p ≤ 50).
const absDe=(M,q,p)=>(13*colIdx(M,q)+p)%52;
const companeros=(M,a,b)=>a===b||(M.eq&&a%2===b%2);
const termino=(M,q)=>M.F[q].every(p=>p===META);
// De a 4 en equipos: el que ya metió sus cuatro fichas sigue tirando y mueve las de su compañero.
function quienMueve(M,s){return M.eq&&termino(M,s)?(s+2)%4:s;}
// Las fichas que hay en una casilla de la pista
function fichasEn(M,ab){const out=[];for(let q=0;q<M.n;q++)M.F[q].forEach((p,i)=>{if(p>=0&&p<=ULT&&absDe(M,q,p)===ab)out.push({s:q,i});});return out;}
// ¿Hay una barrera (dos o más fichas de un color que no es el tuyo ni el de tu compañero) entre p (sin contarla) y np?
function bloqueado(M,q,p,np){
  for(let k=p===CASA?0:p+1;k<=Math.min(np,ULT);k++){const ab=absDe(M,q,k),c={};
    for(const x of fichasEn(M,ab))if(!companeros(M,x.s,q)){c[x.s]=(c[x.s]||0)+1;if(c[x.s]>=2)return true;}}
  return false;}
const puedeSacar=(M,d)=>d===6||(M.R.sacar==='16'&&d===1);
// Las jugadas posibles para el lugar s con el dado d: una por cada lugar distinto de donde mover (dos fichas en la misma
// casilla son la misma jugada). {f: ficha, q: de quién es, de, a, comio:[{s,i}], llega}
function movimientos(M,s,d){
  if(!d||M.fin)return [];const q=quienMueve(M,s),F=M.F[q],out=[];
  for(let i=0;i<4;i++){const p=F[i];let np;
    if(p===META||out.some(m=>m.de===p))continue;
    if(p===CASA){if(!puedeSacar(M,d))continue;np=0;}
    else{np=p+d;if(np>META){if(M.R.exacta)continue;np=META;}}
    if(M.R.barrera&&bloqueado(M,q,p,np))continue;
    let comio=[];if(np<=ULT){const ab=absDe(M,q,np);if(!SEGURAS.includes(ab))comio=fichasEn(M,ab).filter(x=>!companeros(M,x.s,q));}
    out.push({f:i,q,de:p,a:np,comio,llega:np===META});}
  return out;}
function tirarDado(M,s){
  if(M.R.dado==='parejo'){const B=M.bolsas[s]||(M.bolsas[s]=[]);
    if(!B.length){const R=M.seed?rngDe((M.seed+M.tiros*7919+s*104729)>>>0):azar();B.push(...mezclar([1,2,3,4,5,6],R));}
    M.tiros++;return B.pop();}
  const R=M.seed?rngDe((M.seed+M.tiros*2654435761)>>>0):azar();M.tiros++;return 1+Math.floor(R()*6);}
function pasar(M){M.turno=(M.turno+1)%M.n;M.fase='tirar';M.dado=0;M.seises=0;M.intentos=0;}
function quienJuega(M){return M.fin?null:M.turno;}
// ¿Ganó el lugar s? (en equipos, gana la pareja)
function gano(M,s){return M.fin&&M.gano!==null&&(M.eq?M.gano%2===s%2:M.gano===s);}
function acciones(M,s){if(M.fin||M.turno!==s)return [];if(M.fase==='tirar')return [{t:'tirar'}];return movimientos(M,s,M.dado).map(m=>({t:'mover',f:m.f}));}
// Aplica la acción a del lugar s: {t:'tirar'} o {t:'mover', f: ficha}. Devuelve un texto de error o null.
function jugar(M,s,a,dadoForzado){
  if(M.fin)return 'La partida terminó.';
  if(M.turno!==s)return 'No es tu turno.';
  if(!a||typeof a!=='object')return 'Acción desconocida.';
  const nom=M.nombres[s];
  if(a.t==='tirar'){
    if(M.fase!=='tirar')return 'Ya tiraste: mové una ficha.';
    const d=dadoForzado>=1&&dadoForzado<=6?dadoForzado:tirarDado(M,s);M.acc++;M.dado=d;
    const u={p:s,a:{t:'tirar',d}};M.ultimo=u;
    if(d===6){M.seises++;M.est[s].seis++;
      if(M.R.tres6&&M.seises>=3){u.a.tres=1;anotar(M,`${nom} sacó tres seises seguidos: pierde el turno.`);pasar(M);return null;}}
    else M.seises=0;
    const mv=movimientos(M,s,d);
    if(!mv.length){u.a.sin=1;
      const q=quienMueve(M,s),enJuego=M.F[q].some(p=>p>=0&&p<META);
      if(d===6){M.fase='tirar';anotar(M,`${nom} sacó 6 y no puede mover: tira de nuevo.`);u.a.otra=1;return null;}
      if(M.R.intentos&&!enJuego&&++M.intentos<3){M.fase='tirar';u.a.otra=1;u.a.intento=M.intentos;anotar(M,`${nom} sacó ${d}: ${M.intentos===1?'segundo':'tercer'} intento para sacar.`);return null;}
      anotar(M,`${nom} sacó ${d} y no puede mover.`);pasar(M);return null;}
    M.fase='mover';return null;}
  if(a.t==='mover'){
    if(M.fase!=='mover')return 'Primero tirá el dado.';
    const q=quienMueve(M,s),f=Number(a.f);if(!(f>=0&&f<4))return 'Esa ficha no existe.';
    const p0=M.F[q][f],mv=movimientos(M,s,M.dado).find(m=>m.de===p0);if(!mv)return 'Esa ficha no se puede mover.';
    const d=M.dado;M.F[q][f]=mv.a;M.acc++;
    for(const c of mv.comio){M.F[c.s][c.i]=CASA;M.est[c.s].comido++;M.est[s].comio++;}
    if(p0===CASA)M.est[s].sacadas++;if(mv.llega)M.est[s].llegadas++;
    M.ultimo={p:s,a:{t:'mover',q,f,de:p0,a:mv.a,d,comio:mv.comio.map(c=>({s:c.s,i:c.i,ab:absDe(M,q,mv.a)}))}};
    anotar(M,`${M.nombres[s]}${q!==s?` (por ${M.nombres[q]})`:''}: ${p0===CASA?'saca una ficha':mv.llega?'mete una ficha en la meta':mv.a>ULT?`entra al pasillo con ${d}`:`mueve ${d}`}${mv.comio.length?` y le come ${mv.comio.length>1?mv.comio.length+' fichas':'una ficha'} a ${[...new Set(mv.comio.map(c=>M.nombres[c.s]))].join(' y ')}`:''}.`);
    if(termino(M,q)&&!M.puestos.includes(q)){M.puestos.push(q);anotar(M,`${M.nombres[q]} metió sus cuatro fichas.`);
      if(!M.eq){M.fin=true;M.gano=q;anotar(M,`¡Gana ${M.nombres[q]}!`);return null;}
      if(termino(M,(q+2)%4)){M.fin=true;M.gano=q;anotar(M,`¡Ganan ${M.nombres[q]} y ${M.nombres[(q+2)%4]}!`);return null;}}
    const otra=d===6||(M.R.premio&&(mv.comio.length>0||mv.llega));
    M.intentos=0;
    if(otra){M.fase='tirar';M.dado=0;if(d!==6)M.seises=0;M.ultimo.a.otra=1;return null;}
    pasar(M);return null;}
  return 'Acción desconocida.';
}
// Puestos al final (o en cualquier momento): los que terminaron, en orden, y después por cuánto avanzaron.
function avance(M,q){return M.F[q].reduce((t,p)=>t+(p===CASA?0:p+1),0);}
function posiciones(M){const L=[...Array(M.n).keys()];
  return L.sort((x,y)=>{const ix=M.puestos.indexOf(x),iy=M.puestos.indexOf(y);if(ix>=0||iy>=0)return (ix<0?99:ix)-(iy<0?99:iy);return avance(M,y)-avance(M,x);});}

/* ───── Lo que ve cada uno ───── (todo, menos las bolsas del dado parejo; con quién es y qué puede mover) */
function estadoPara(M,s){
  const {bolsas,...o}=M;
  return {...JSON.parse(JSON.stringify(o)),yo:s,movs:M.turno===s&&M.fase==='mover'&&!M.fin?movimientos(M,s,M.dado):[],log:M.log.slice(-30)};}

/* ───── La compu ─────
   Juega con lo mismo que ve cualquiera en la mesa. Para cada jugada posible mira: si come, si saca una ficha, si la mete en
   el pasillo o en la meta, si la deja en una casilla segura, y cuántas fichas rivales la podrían comer donde queda (las que
   están de 1 a 6 casillas atrás) o donde estaba.
   · Fácil: casi al azar (si puede comer, a veces come).
   · Normal: juega como una persona: come, saca, se cuida de quedar a tiro, pero a veces no ve la mejor.
   · Difícil: además cuenta mejor el peligro, persigue a las fichas que tiene a tiro, cuida las que están por llegar y no se
     equivoca. */
const NIVEL_LUDO={facil:{error:.55,ruido:12,peligro:8,huir:4},normal:{error:.1,ruido:5,peligro:20,huir:15},dificil:{error:0,ruido:1.2,peligro:30,huir:24}};
// Cuántas fichas rivales de q podrían caer en la casilla ab de la pista con una tirada (sin contar las de la lista «sin»).
function amenaza(M,q,ab,sin=[]){
  if(SEGURAS.includes(ab))return 0;let n=0;
  for(let x=0;x<M.n;x++){if(companeros(M,x,q))continue;
    M.F[x].forEach((p,i)=>{if(p<0||p>ULT||sin.some(c=>c.s===x&&c.i===i))return;const dist=(ab-absDe(M,x,p)+52)%52;if(dist>=1&&dist<=6&&p+dist<=ULT)n++;});
    // las de la base salen a su salida (que es segura) y no amenazan, salvo que ya estén afuera
  }
  return n;}
function puntaje(M,s,m,nivel){const N=NIVEL_LUDO[nivel]||NIVEL_LUDO.normal,q=m.q;let v=0;
  const afuera=M.F[q].filter(p=>p>=0&&p<META).length;
  if(m.comio.length){v+=60;if(nivel==='dificil')for(const c of m.comio)v+=Math.max(0,M.F[c.s][c.i])*.5;}
  if(m.de===CASA)v+=32+(afuera===0?18:0)-(afuera>=3?10:0);
  if(m.llega)v+=46;
  else if(m.a>ULT)v+=m.de<=ULT?30:6;
  else{const ab=absDe(M,q,m.a);if(SEGURAS.includes(ab))v+=13;
    v-=amenaza(M,q,ab,m.comio)*N.peligro;
    if(nivel==='dificil'){// persigue: alguna rival de 1 a 6 adelante, en casilla no segura
      for(let x=0;x<M.n;x++){if(companeros(M,x,q))continue;for(const p of M.F[x]){if(p<0||p>ULT)continue;const ab2=absDe(M,x,p),dd=(ab2-ab+52)%52;if(dd>=1&&dd<=6&&m.a+dd<=ULT&&!SEGURAS.includes(ab2))v+=4;}}}}
  if(m.de>=0&&m.de<=ULT){const ab0=absDe(M,q,m.de);v+=amenaza(M,q,ab0)*N.huir;
    if(nivel==='dificil'&&m.de>=38&&m.a<=ULT)v+=3;}   // las que están por llegar, mejor sacarlas del medio
  v+=(m.a-Math.max(0,m.de))*.35;
  if(M.eq&&q!==s)v+=2;
  return v;}
function decidir(V,s,nivel='normal',R=Math.random){
  if(!V||V.fin||V.turno!==s)return null;
  if(V.fase==='tirar')return {t:'tirar'};
  const mv=movimientos(V,s,V.dado);if(!mv.length)return null;
  const N=NIVEL_LUDO[nivel]||NIVEL_LUDO.normal;
  if(nivel==='facil'){const c=mv.filter(m=>m.comio.length);if(c.length&&R()<.5)return {t:'mover',f:c[0].f};}
  if(R()<N.error)return {t:'mover',f:mv[Math.floor(R()*mv.length)].f};
  let best=mv[0],bs=-1e9;for(const m of mv){const v=puntaje(V,s,m,nivel)+R()*N.ruido;if(v>bs){bs=v;best=m;}}
  return {t:'mover',f:best.f};
}

</script>
<script>
'use strict';
/* ───────── LudAR: la mesa ─────────
   De 2 a 4 jugadores: contra la compu o en línea con amigos (los lugares que falten los juega la compu).
   Las reglas están en el motor (arriba); acá se dibuja el tablero, se animan el dado y las fichas, juega la compu y
   se llevan los premios. Todo lo que pasa en la mesa (tuyo, de la compu o de un amigo) entra por una cola de
   animaciones: primero se ve rodar el dado o caminar la ficha, y recién después se puede tocar de nuevo. */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let FAST=false,AUTO=false;const wait=ms=>sleep(FAST?0:ms);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');

/* ───────── Sonido: todo sintetizado con WebAudio, liviano ─────────
   El dado que rueda (ruido filtrado), cada paso de la ficha, sacar, comer, llegar a la meta, el seis y ganar. */
let SND=ls.get('ludo-sonido')!=='0',AC=null,MASTER=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();MASTER=AC.createGain();MASTER.gain.value=.85;MASTER.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return AC;}
document.addEventListener('visibilitychange',()=>{try{if(!AC)return;if(document.hidden)AC.suspend();else AC.resume();}catch(_){}});
function nota(f,t0=0,d=.4,v=.05,tipo='triangle',f2){const a=actx(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);
  o.connect(g).connect(MASTER);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let RUIDO=null;
function slap(t0=0,v=.5,fq=1900,q=.8){const a=actx(),t=a.currentTime+t0;if(!RUIDO){const n=Math.floor(a.sampleRate*.07);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=RUIDO;bp.type='bandpass';bp.frequency.value=fq;bp.Q.value=q;g.gain.value=.22*v;
  s.connect(bp).connect(g).connect(MASTER);s.start(t);s.onended=()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
const SX={
  dado(){for(let i=0;i<7;i++)slap(i*.06+Math.random()*.02,.35+Math.random()*.25,900+Math.random()*900,2.2);slap(.46,.6,700,1.6);},
  paso(){slap(0,.32,2600,1.6);nota(1320,0,.05,.012,'sine');},
  sale(){nota(392,0,.18,.04,'triangle',523);nota(659,.09,.25,.035);slap(0,.4,1500,1);},
  comer(){slap(0,.9,500,1.2);nota(220,0,.32,.07,'square',110);nota(165,.12,.4,.05,'sawtooth',90);},
  comido(){nota(330,0,.25,.05,'square',220);nota(247,.14,.35,.05,'square',165);},
  meta(){[784,988,1175,1568].forEach((f,i)=>nota(f,i*.07,.4,.04,'sine'));},
  seis(){nota(880,0,.12,.035,'square');nota(1175,.08,.18,.035,'square');},

    h+=`<div class="seat${turno?' turn':''}" data-q="${q}" style="--pc:var(--c${c})">${avHtml(P.a,P.c)}<div class="sn"><b>${esc(S.nombres[q])}${bot&&!/🤖$/.test(S.nombres[q])?' 🤖':''}</b>
      <small>${S.F[q].map(p=>`<i class="${p===META?'ok':''}"></i>`).join('')}${S.eq?` <em class="eqt">${q%2===S.yo%2?'tu equipo':'rivales'}</em>`:''}${turno&&LIMITE&&MODO!=='compu'&&!bot?'<span class="tleft"></span>':''}</small></div>
      ${DICHOS[q]?`<span class="say">${esc(DICHOS[q])}</span>`:''}${CHIPS[q]&&!DICHOS[q]?`<span class="chip-chat">${esc(CHIPS[q])}</span>`:''}</div>`;}
  el.innerHTML=h;el.classList.toggle('n4',S.n>=4);tickTimer();}
function renderPanel(){
  const st=$('status'),d=$('dado'),S=EV,me=yo();
  if(!S){st.innerHTML='';d.disabled=true;d.classList.remove('can');$('dado-izq').innerHTML='';$('dado-der').innerHTML='';return;}
  const mio=S.turno===me&&!S.fin,q=S.turno,nom=esc(S.nombres[q]);

  pintarDado(S.fase==='mover'?S.dado:S.ultimo&&S.ultimo.a.t==='tirar'?S.ultimo.a.d:DADO_V);

      :(S.movs||[]).length>1?`<b>Sacaste ${S.dado}.</b> Tocá la ficha que querés mover.`:`<b>Sacaste ${S.dado}.</b> Tocá la ficha que brilla.`;

// Una sola jugada posible (o varias que dan lo mismo): se hace sola a los 0,7 s (se puede apagar en el menú).
let AUTO1_ACC=-1;
function autoUnica(){const S=EV;if(!S||S.fin||AUTO||!CFG.auto1||S.turno!==yo()||S.fase!=='mover'||(S.movs||[]).length!==1||AUTO1_ACC===S.acc)return;

// Lo que dice cada uno (un globo debajo de su lugar)
function dicho(q,txt,ms=1600){DICHOS[q]=txt;renderSeats(EV);setTimeout(()=>{if(DICHOS[q]===txt){delete DICHOS[q];if(EV)renderSeats();}},FAST?10:ms);}
let toastT=0;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),FAST?10:2400);}
function over(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('over');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}
function hideOver(){$('over').hidden=true;}
let TMR=0;
function tickTimer(){clearInterval(TMR);if(!LIMITE)return;const upd=()=>{const s=Math.max(0,Math.ceil((LIMITE-Date.now())/1000));
  const t=$('tmr');if(t){t.textContent=s+' s';t.classList.toggle('low',s<=6);}
  document.querySelectorAll('.tleft').forEach(x=>{x.textContent=s+' s';});if(s<=0)clearInterval(TMR);};upd();TMR=setInterval(upd,500);}

/* ───────── Tocar ─────────
   Un solo lugar escucha los toques (el tablero, que nunca se vuelve a crear) y busca la ficha movible más cerca del dedo:
   así no se pierde un toque aunque el dibujo cambie justo, y no hace falta pegarle exacto a una ficha chica. */
function puntoSvg(ev){const svg=$('tab'),pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const m=svg.getScreenCTM();if(!m)return null;const r=pt.matrixTransform(m.inverse());return [r.x,r.y];}
function tocarTablero(ev){
  if(!EV||EV.fin)return;
  if(EV.turno!==yo()){if(!ocupado())toast(`Todavía no es tu turno: juega ${esc(EV.nombres[EV.turno])}.`);return;}
  if(ocupado()||(MODO==='guest'&&PEND_GUEST))return;
  if(EV.fase==='tirar'){jugarYo({t:'tirar'});return;}
  const pt=puntoSvg(ev);if(!pt)return;let best=null,bd=1e9;
  for(const m of EV.movs||[]){
    VIS[m.q].forEach((p,i)=>{if(p!==m.de)return;const el=$(`pz-${m.q}-${i}`),xy=rotar(lugarFicha(EV.colores[m.q],p,i),GIRO);const d=Math.hypot(xy[0]-pt[0],xy[1]-pt[1]);if(d<bd){bd=d;best=m;}});
    const xa=rotar(lugarFicha(EV.colores[m.q],m.a,m.f),GIRO),da=Math.hypot(xa[0]-pt[0],xa[1]-pt[1])*1.15;if(da<bd){bd=da;best=m;}}
  if(best&&bd<1.25){jugarYo({t:'mover',f:best.f});return;}
  if((EV.movs||[]).length)toast('Tocá una de las fichas que brillan.');}
$('tab').addEventListener('click',tocarTablero);
$('dado').addEventListener('click',()=>{if(EV&&EV.turno===yo()&&EV.fase==='tirar')jugarYo({t:'tirar'});});

/* ───────── El turno ───────── */
// Aplica la acción de q (absoluto en M) sobre la partida que manejo y muestra lo que pasó.
function aplicar(q,a,dado){
  const err=jugar(M,q,a,dado);if(err)return err;
  refrescar();guardar();
  if(MODO==='host')enviarEstados();
  lgJugada(q);mostrar(E);seguir();return null;
}
// Logros y retos: cada jugada mía se cuenta una vez (la clave es la partida y el número de acción).
const LG=()=>window.LOGROS&&(!AUTO||window.LOGROS_TEST);
function lgJugada(q,S=E){const u=S&&S.ultimo;if(!LG()||!u||u.p!==yo())return;const k='l'+(S.id||'')+':'+S.acc,a=u.a;
  try{if(a.t==='tirar'&&a.d===6)LOGROS.evento('ludo','seises',1,k);
    if(a.t==='mover'){if(a.comio&&a.comio.length)LOGROS.evento('ludo','comidas',a.comio.length,k);if(a.a===META)LOGROS.evento('ludo','llegadas',1,k);if(a.de===CASA)LOGROS.evento('ludo','sacadas',1,k);}}catch(e){console.warn('logros',e);}}
async function jugarYo(a){
  if(!E)return;
  if(ocupado()){await COLA;}
  if(!E||E.fin||E.turno!==yo())return;
  if(a.t==='tirar'&&E.fase!=='tirar')return;
  if(a.t==='mover'&&E.fase!=='mover')return;
  if(MODO==='guest'){
    if(!ON||ON.state!=='juego'){toast('Se cortó la conexión con la mesa.');return;}
    if(PEND_GUEST)return;
    if(!ON.ch||ON.ch.readyState!=='open'){toast('Se cortó la conexión con la mesa.');return;}
    PEND_GUEST=true;const acc0=E.acc;renderPanel();marcarMovibles();netSend({t:'accion',a,acc:E.acc});
    setTimeout(()=>{if(PEND_GUEST&&E&&E.acc===acc0){PEND_GUEST=false;renderPanel();marcarMovibles();toast(`La mesa no contesta. Si ${esc(ON&&ON.host?ON.host.usuario:'quien la armó')} salió de la app, avisale que vuelva.`);}},6000);return;}
  if(!M)return;
  const err=aplicar(YO,a);if(err)toast(esc(err));
}
// Después de cada jugada: si le toca a la compu (o a alguien que se cortó), juega cuando terminan las animaciones.
function seguir(){
  if(MODO==='guest'||!M)return;
  if(M.fin){clearTimeout(ON_T);LIMITE=0;return;}
  const tok=++BOTTOK,q=quienJuega(M);if(q===null)return;
  armarTimer(q);
  if(M.tipos[q]==='bot'||(AUTO&&q===YO)){
    COLA.then(()=>wait(M&&M.fase==='tirar'?520+Math.random()*420:380+Math.random()*420)).then(()=>{if(tok!==BOTTOK||!M||quienJuega(M)!==q)return;
      if(ocupado()){COLA.then(()=>{if(tok===BOTTOK&&M&&quienJuega(M)===q)turnoBot(q);});return;}turnoBot(q);});}
}
function nivelBot(q){return MODO==='compu'?CFG.dif:'normal';}
function turnoBot(q){const nv=AUTO&&q===YO?'normal':nivelBot(q),a=decidir(estadoPara(M,q),q,nv);if(!a)return;const err=aplicar(q,a);if(err)console.warn('compu',err);}
// En línea: cada persona tiene 20 segundos por acción; si no, tira o mueve sola (como lo haría la compu).
const TURNO_MS=20000;
function hayGente(){return M&&M.tipos.filter(t=>t!=='bot').length>1;}
let ON_T=0;
function armarTimer(q){clearTimeout(ON_T);LIMITE=0;
  if(MODO!=='host'||!hayGente()||M.tipos[q]==='bot')return;
  LIMITE=Date.now()+TURNO_MS+(ocupado()?1500:0);const acc=M.acc;
  ON_T=setTimeout(()=>{if(!M||M.acc!==acc||quienJuega(M)!==q)return;const a=decidir(estadoPara(M,q),q,'normal');if(!a)return;
    aplicar(q,a);if(q===YO)toast('Se te pasó el tiempo: se jugó solo.');},LIMITE-Date.now());
}

function mostrarFin(){

  if($('pf-share'))$('pf-share').onclick=()=>CHAT.share({j:'ludo',t:`LudAR · ${MODO==='compu'?'Contra la compu ('+DIFN[CFG.dif]+')':'En línea'}`,d:`${gane?'Gané':'Perdí'} · ${S.eq?'2 contra 2':S.n+' jugadores'}`,r:rk.rank||''});
}
function lgFin(gane,S){if(!LG())return '';const me=yo(),amigo=S.tipos.some((t,q)=>q!==me&&t!=='bot');
  try{LOGROS.marca('ludo','max_comidas',S.est[me].comio,'l'+(S.id||''));
    return LOGROS.fin('ludo',{gano:gane,modo:amigo?'online':'compu',dif:MODO==='compu'?CFG.dif:'normal',n:S.n,eq:S.eq,limpio:S.est[me].comido===0,comidas:S.est[me].comio},'l'+(S.id||'')).html;}catch(e){console.warn('logros',e);return '';}}
// XP, rango, regalo para la estancia y leguas (una vez por partida). Las partidas muy cortas (alguien se fue enseguida) no dan XP.
function premios(gane,S){
  const out={html:'',rank:''};if(!window.RANGOS||AUTO)return out;
  const me=yo(),key='l'+(S.id||''),hechas=ls.json('ludo-xp-hechas',[]);
  const amigo=S.tipos.some((t,q)=>q!==me&&t!=='bot'),kind=amigo?'amigo':'compu-'+(MODO==='compu'?CFG.dif:'normal'),X=LUDO_XP;
  let rk=null,xp=0,pr=null;
  try{if(RANGOS.isRanked('ludo')&&kind!=='compu-facil')rk=RANGOS.apply('ludo',{key,win:gane,kind});}catch(_){}
  if(!hechas.includes(key)&&S.acc>=X.minAcciones){xp=X.base+(gane?X.gana:0)+(kind==='compu-dificil'?X.dificil:0)+(amigo?X.amigo:0)+Math.min(10,(S.n-2)*X.porJugador);
    // info para las leguas, los contadores del perfil y las tablas (chat/rangos.js): con «esfuerzo» si la partida fue de verdad
    // (en el Ludo siempre lo es, salvo que se corte enseguida).
    try{RANGOS.addXp('ludo',xp);pr=RANGOS.premio('LudAR',xp,!!rk,{j:'ludo',res:gane?'g':'p',rival:amigo?'p':'c',dif:MODO==='compu'?CFG.dif:'normal',esf:S.acc>=X.minAcciones,ok:S.acc>=X.minAcciones,key,
      x:{n:S.n,eq:S.eq?1:0,co:S.est[me].comio,m:S.F[me].filter(p=>p===META).length,ms:Math.round((Date.now()-(S.t0||Date.now()))/1000)},
      get extra(){return this.x;}});}catch(_){}
    hechas.push(key);ls.set('ludo-xp-hechas',JSON.stringify(hechas.slice(-60)));}
  let lv=null;try{lv=RANGOS.levelInfo(RANGOS.xp('ludo'));}catch(_){}
  out.html=(rk?RANGOS.resultHtml(rk):'')+(lv?`<p class="cap">LudAR nivel ${lv.lv}${xp?` · +${xp} XP`:''}${pr&&pr.oro?` · 🟡 +${fmt(pr.oro)} de oro`:''}${pr&&pr.pesos?` · 🎁 +${fmt(pr.pesos)} 🪙 para tu estancia`:''}${pr?(RANGOS.leguasTxt?RANGOS.leguasTxt(pr):pr.leguas?` · 🚩 +${pr.leguas} leguas en La Gran Pampa`:''):''}${!rk?(kind==='compu-facil'?' · En Fácil no se mueve el rango ni da leguas':!RANGOS.isRanked('ludo')?' · Partida amistosa: no mueve el rango ni da leguas':''):''}</p>`:'');
  out.rank=rk&&rk.after?rk.after.label:'';return out;
}

   El que arma la mesa la lleva: tiene una conexión directa con cada amigo (WebRTC, con servidores públicos
   STUN/TURN de ayuda) y le manda a cada uno sólo lo que puede ver. Las invitaciones viajan por la planilla,
   una por amigo (sin códigos de sala). Los lugares que quedan libres los juega la compu; si alguien se corta,
   la compu sigue en su lugar. El chat de la mesa va por las mismas conexiones: es al toque y no se guarda. */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

async function invitarALugar(u){
  const a=acct(),m=ON&&ON.mesa;if(!a||!m)return;
  const i=m.lugares.findIndex((L,k)=>k<m.n&&L.tipo==='libre');if(i<0){toast('No hay lugares libres: agrandá la mesa.');return;}

  const quien=ON;

    const pc=new RTCPeerConnection({iceServers:await iceServers()});L.pc=pc;
    const ch=pc.createDataChannel('ludo',{ordered:true});
    ch.onopen=()=>{if(ON!==quien||m.lugares[i]!==L)return;L.ch=ch;
      if(ON.state==='juego'){sendCh(ch,{t:'bye'});return;}         // la partida ya empezó
      L.tipo='humano';L.msg='';sfx('turno');toast(`🔗 ${esc(L.usuario)} se sentó a la mesa`);enviarMesa();};
    ch.onclose=()=>perdioLugar(i,L);

    const t0=Date.now();
    while(m.lugares[i]===L&&L.tipo==='invitado'&&Date.now()-t0<7200000){   // v15: vale mientras la mesa espere (hasta 2 h)
      await sleep(window.LATIDO?LATIDO.espera(t0):2000);if(m.lugares[i]!==L)return;   // v76
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:L.id});}catch(_){continue;}
      if(m.lugares[i]!==L)return;

        setTimeout(()=>{if(m.lugares[i]===L&&L.tipo==='invitado'){toast(`No se pudo conectar con ${esc(L.usuario)}.`);soltarLugar(i,false);enviarMesa();}},45000);return;}
      if(r.estado==='rechazada'){toast(`${esc(L.usuario)} dijo «ahora no».`);soltarLugar(i,false);enviarMesa();return;}
      if(r.estado==='vencida'||r.estado==='cancelada'){soltarLugar(i,false);enviarMesa();return;}
    }
    if(m.lugares[i]===L&&L.tipo==='invitado'){toast(`${esc(L.usuario)} no respondió.`);soltarLugar(i,true);enviarMesa();}
  }catch(e){if(m.lugares[i]===L){toast(esc(e.message||'No se pudo invitar.'));soltarLugar(i,true);enviarMesa();}}
}
function perdioLugar(i,L){

  const nom=L.usuario;try{L.pc&&L.pc.close();}catch(_){}L.ch=null;

  if(ON.state==='juego'&&M&&!M.fin&&M.tipos[i]==='humano'&&!L.salio&&window.RECON&&nom){
    const hasta=Date.now()+RECON.GRACIA;
    M.tipos[i]='bot';ON.mesa.lugares[i]={tipo:'ausente',usuario:nom,avatar:L.avatar,color:L.color,hasta};
    const txt=`${nom} se cortó: juega la compu por ${nom} hasta que vuelva.`;addChat('',txt);netSend({t:'chat',de:'',txt});
    RECON.cartel('ludo-'+i,`${nom} se cortó · esperándolo…`,hasta,()=>noVolvio(i,nom));netSend({t:'corte',nom,ms:RECON.GRACIA});
    refrescar();mostrar(E);enviarEstados();seguir();esperarVuelta(i,nom,hasta);relevoVigilar();return;}
  if(ON.state==='juego'&&M&&M.tipos[i]==='humano'){// sigue la compu en su lugar
    M.tipos[i]='bot';M.nombres[i]=nom+' 🤖';ON.mesa.lugares[i]={tipo:'libre'};
    toast(`⚠️ ${esc(nom)} se desconectó. Sigue la compu en su lugar.`);addChat('',`${nom} se desconectó: juega la compu en su lugar.`);
    refrescar();mostrar(E);enviarEstados();if(!hayGente()){LIMITE=0;}seguir();return;}
  if(L.tipo==='humano'||L.tipo==='invitado'){ON.mesa.lugares[i]={tipo:'libre'};toast(`${esc(nom)} se fue de la mesa.`);enviarMesa();}

    pc.onconnectionstatechange=()=>{if(NL&&['failed','closed'].includes(pc.connectionState))perdioLugar(i,NL);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(!sigue()){pc.close();return;}
