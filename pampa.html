.oro-tabla i{font-style:normal;text-align:center}.oro-tabla b{color:#f5c94c;text-align:right}`;
function hojaCss(){css();if(document.getElementById('oro-hoja-css'))return;const s=document.createElement('style');s.id='oro-hoja-css';s.textContent=HOJA_CSS;(document.head||document.documentElement).appendChild(s);}

return {ORO_TABLA,MULT_RES,MULT_RIVAL,TOPE,CAMBIO,norm,calc,premio,saldo,ganar,cobrar,cobrado,tiene,comprar,gastar,cambiar,cambioHoy,hoy,exportData,importData,
  MARCOS,GESTOS_ORO,marco,ponerMarco,gestos,subirPerfil,
  ico,txt,premioTxt,anim,css,niveles,cartel,titulos,titulo,ponerTitulo,TIT_GEN,TIT_J,ADORNO_GEN,ROPA_GEN,cofreGen,cofreEst,PAMPA_ORO,pampaPuesto,hojaHtml,hojaCss,
  sub(f){SUB.add(f);},_load:load,_K:K};
})();
/* TÍTULOS de los demás (v70): la planilla los manda en «usuarios» (ti, y cau = los campeones de la última semana de La Gran
   Pampa: «Caudillo de la semana» durante la semana siguiente) y en el perfil. Se guardan en «bloques-titulos-v1».
   TITULOS.html(usuario) → <span class="tit-chip"> discreto (o ''), para poner al lado del nombre. */
window.TITULOS=(function(){
  const K='bloques-titulos-v1';let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}M.u=M.u||{};M.cau=Array.isArray(M.cau)?M.cau:[];return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M));}catch(_){}};
  const limpio=t=>String(t||'').replace(/[\u0000-\u001f<>]/g,'').trim().slice(0,32);
  function poner(u,t,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const v=limpio(t);if(v)M.u[k]=v;else delete M.u[k];if(guardar)save();}
  function caudillos(L,sem){load();M.cau=(Array.isArray(L)?L:[]).map(x=>String(x||'').toLowerCase()).filter(Boolean);M.sem=sem||'';save();}
  function guardarLista(L,cau){if(!Array.isArray(L))return;load();for(const x of L)if(x&&x.usuario!==undefined)poner(x.usuario,x.ti,false);if(Array.isArray(cau))M.cau=cau.map(x=>String(x||'').toLowerCase());save();}
  function de(u){load();const k=String(u||'').toLowerCase();if(M.cau.includes(k))return {t:'Caudillo de la semana',cau:true};
    if(window.ORO){try{const a=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');if(a&&String(a.usuario).toLowerCase()===k){const t=ORO.titulo();return t?{t:t.n}:null;}}catch(_){}}
    return M.u[k]?{t:M.u[k]}:null;}
  function html(u){const x=de(u);if(!x)return '';try{ORO.css();}catch(_){}const e=String(x.t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);return `<span class="tit-chip${x.cau?' cau':''}" title="${e}">${x.cau?'🏆 ':''}${e}</span>`;}
  return {poner,caudillos,guardarLista,de,html};
})();

<script>
/* ───────── Logros, retos de la semana y apariencias de TrucAR, UnoAR, PoblAR, EstanciAR, La Gran Pampa, SudokAR, SolitARio y BuscaminAR ─────────
   (BloqueAR tiene sus medallas y su desafío del día aparte, en su progreso.)

   API (window.LOGROS):
   · evento(juego, clave, n=1, key?)  suma n al contador «clave» del juego (y al de la semana). Con «key» no se cuenta dos veces
                                      lo mismo (reanudar, revancha, el mismo estado que llega dos veces). Avisa con un cartelito
                                      arriba si se consigue un logro o se cumple un reto. Devuelve los logros nuevos.

function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}
function save(o){o.at=Date.now();ls.set(KEY,JSON.stringify(o));}
const cnt=(o,j)=>(o.c[j]=o.c[j]||{});
const tiene=(o,j,id)=>!!(o.g[j]&&o.g[j][id]);

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;
    try{if(window.RANGOS&&RANGOS.pampaAct)RANGOS.pampaAct('r',1);}catch(_){}}   // v70: los 3 retos de la semana de un juego dan 1 legua para La Gran Pampa
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&(R.GAMES[j]||(R.SOLOS&&R.SOLOS[j])))R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='ludo'&&win){if(d.n>=4&&!d.eq)E.push(['ganadas_4',1]);if(d.eq)E.push(['ganadas_eq',1]);if(d.limpio)E.push(['limpio',1]);}
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='pool'){if(d.modo==='online')E.push(['online_part',1]);if(win&&d.dobles)E.push(['dobles_gan',1]);if(win&&d.limpia)E.push(['limpia',1]);}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}
  if(j==='buscaminas'&&win){E.push(['gan_'+dif,1]);if(dif!=='principiante')E.push(['gan_ie',1]);if(d.diario)E.push(['dias',1]);if(d.sinBand)E.push(['sin_band',1]);
    if(d.limpio){E.push(['sin_pistas',1]);if(dif!=='principiante')E.push(['limpios_ie',1]);}
    if(dif==='principiante'&&d.ms<20000)E.push(['rapido_p',1]);if(dif==='intermedio'&&d.ms<120000)E.push(['rapido_i',1]);}
  if(j==='invasores'){if(d.olas)E.push(['oleadas',d.olas]);if(d.bajas)E.push(['bajas',d.bajas]);if(d.sum)E.push(['suministros',d.sum]);if(d.cen)E.push(['centinela',d.cen]);if(d.nod)E.push(['nodriza',d.nod]);if(d.perf)E.push(['perfectos',d.perf]);
    if(d.escudos)E.push(['escudos',d.escudos]);if(d.diario)E.push(['dias',1]);if(win&&d.limpio)E.push(['limpio',1]);if(win&&dif==='experta'&&d.modo==='solo')E.push(['gan_experta',1]);}
  if(j==='laberinto'){if(d.limpios)E.push(['limpios',d.limpios]);if(d.sinMorir)E.push(['sin_morir',d.sinMorir]);if(d.combo4)E.push(['combo4',1]);if(d.capturas)E.push(['capturas',d.capturas]);
    if(d.bonus)E.push(['bonus',d.bonus]);if(d.vuelta)E.push(['vuelta',1]);if(d.diario)E.push(['dias',1]);if(d.limDif)E.push(['lim_dif',d.limDif]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);out.html=apBoton(j,'fin');return out;}
  for(const [k,n] of finEventos(j,d))sumar(o,j,k,n);
  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  out.html+=apBoton(j,'fin');   // v72: la apariencia, a mano al terminar
  return out;
}

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(op.oro)return !!(window.ORO&&ORO.tiene(op.k_));if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
let PREV=null;   // v72: {j,tipo,id} mientras se prueba una en la hoja
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';if(PREV&&PREV.j===j&&PREV.tipo===tipo&&A.op.some(x=>x.id===PREV.id))return PREV.id;const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;

  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);

  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};

    if(!ORO.comprar(ap.k_,ap.oro,`${D[j].n} · ${ap.n}`)){if(sm)sm.textContent='No te alcanza el oro';return;}
    try{if(window.SFX_ORO)SFX_ORO();}catch(_){}
    elegir(j,tipo,id);const top=root.scrollTop;(op.refrescar||(()=>{if(op.side)abrir(j,op);else{root.innerHTML=panelHtml(j);cablear(root,j,op);}}))();root.scrollTop=top;});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
// Un nombre de usuario de verdad (nunca null, vacío ni el texto «null»/«undefined» que deja un error).
function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre
  // bien): se borran de acá y se vuelven a pedir desde un poco antes, así reaparecen en la charla correcta.
  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));
  if(malos.length){S.msgs=S.msgs.filter(x=>x&&nombreOk(x.de)&&nombreOk(x.para));const t0=Math.min(...malos.map(x=>Number(x&&x.t)||0).filter(Boolean));
    if(t0)S.last=Math.min(S.last,t0-60000);ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
  // Lo que se estaba mandando cuando se cerró la página queda como «No se mandó» (se puede reintentar).
  for(const x of S.msgs)if(x.tmp){x.sending=false;x.fail=true;if(typeof x.p==='string'){try{S.plain[x.id]=JSON.parse(x.p);}catch(_){}}}
  const B=ls.json(kBorr(),{});S.borr=B&&typeof B==='object'?B:{};
  S.invSt=ls.json(kInvSt(),{})||{};
  {const G=ls.json(kGrupos(),[]);S.grupos=Array.isArray(G)?G:[];}S.am=amLimpio(ls.json(kAm(),null));S.amOk=false;try{S.espero=JSON.parse(sessionStorage.getItem('bloques-chat-espero')||'null');}catch(_){S.espero=null;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}
/* ── Borrar chats (v63): sólo para vos. La planilla guarda «borrado hasta tal hora» por charla y no te devuelve
   lo anterior; si el otro te escribe de nuevo, la charla vuelve con lo nuevo. ── */
const kBorr=()=>'bloques-chat-borr-'+lc(S.me);
function borradoLocal(m){const o=conv(m),h=S.borr&&S.borr[o];return !!h&&m.t<=h&&!m.tmp;}
function aplicarBorrados(B){let ch=false;for(const [k,t] of Object.entries(B||{})){const v=Number(t)||0;if(v>(S.borr[lc(k)]||0)){S.borr[lc(k)]=v;ch=true;}}
  if(ch){ls.set(kBorr(),JSON.stringify(S.borr));const n=S.msgs.length;S.msgs=S.msgs.filter(m=>!borradoLocal(m));if(S.msgs.length!==n)saveMsgs();}return ch;}
async function borrarChat(name){
  // La marca usa la hora de la planilla (la de los mensajes), no el reloj de este dispositivo.
  if(!nombreOk(name))return;const k=lc(name),t=lastAny(name);
  if(t>(S.borr[k]||0)){S.borr[k]=t;ls.set(kBorr(),JSON.stringify(S.borr));}S.msgs=S.msgs.filter(m=>!(conv(m)===k&&m.tmp)&&!borradoLocal(m));saveMsgs();
  S.delFor=null;if(lc(S.con)===k){S.con=null;S.view='list';}$('.cx-panel').dataset.sig='';render();badges();

  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para borrar chats en todos tus dispositivos hay que actualizar la planilla (versión nueva). En este quedó borrado.':String(e.message||e);render();}
}
const lastAny=n=>{let t=0;for(const m of S.msgs)if(conv(m)===lc(n)&&m.t>t)t=m.t;return t;};

function amEstado(n){const k=lc(n);if(S.am.a.some(x=>lc(x)===k))return 'amigo';if(S.am.in.some(x=>lc(x)===k))return 'te-pidio';if(S.am.out.some(x=>lc(x)===k))return 'pediste';return '';}

function guardarGrupos(L){if(!Array.isArray(L))return false;const a=JSON.stringify(L),ch=a!==JSON.stringify(S.grupos);S.grupos=L;if(ch)ls.set(kGrupos(),a);return ch;}
function unreadFrom(n){const r=S.read[lc(n)]||0;if(esGK(n))return S.msgs.filter(m=>conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(esG(m)){if(lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>(S.read[conv(m)]||0))n++;continue;}if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ──
   v76: si está el «latido» (chat/latido.js), la consulta la hace él para toda la página: el chat sólo le dice qué
   necesita (armarChat) y procesa la respuesta (recibirChat). Si la planilla es vieja, vuelve a preguntar solo, como antes. */
const conLatido=()=>!!(window.LATIDO&&LATIDO.usable());
const msChat=()=>document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:0;
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  if(conLatido()){LATIDO.registrar('chat',PARTE);return;}   // el latido ajusta su paso (2 s con una charla abierta)
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
function cuentaAlDia(){const a=acct();if(!a){if(S.me){loadLocal();render();}return null;}if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}return a;}
function armarChat(p){
  Object.assign(p,{estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last});
  const pend=invPendientes();if(pend.length)p.invs=pend;
  if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&Date.now()-S.typedAt<4000)p.escribe=S.con;
  if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
  if(conLatido())p.q.pr=1;   // quién está conectado viene en el latido (la lista entera, cada 5 minutos)
  return p;
}
// v76: lo de «en línea» que trae el latido se aplica a la lista que ya tenemos (sin bajarla entera).
function aplicarPresencia(pr){
  if(!Array.isArray(pr)||!S.users.length)return false;
  const M=new Map(pr.map(x=>[lc(x[0]),x[1]]));let falta=false;
  for(const k of M.keys())if(!S.users.some(u=>lc(u.usuario)===k))falta=true;
  const on=a=>a.filter(u=>u.enLinea).map(u=>lc(u.usuario)).sort().join(',');const antes=on(S.users);
  S.users=S.users.map(u=>{const k=lc(u.usuario),en=M.has(k);return en===u.enLinea&&JSON.stringify(u.estado||null)===JSON.stringify(en?M.get(k):null)?u:{...u,enLinea:en,estado:en?M.get(k):null};});
  S.users.sort((a,b)=>(b.enLinea-a.enLinea)||a.usuario.localeCompare(b.usuario));
  if(on(S.users)!==antes)avisarAmigos();
  return falta;
}
async function recibirChat(j){
    if(!cuentaAlDia())return;
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    const falta=j.latido?aplicarPresencia(j.pr):false;
    const ugCambio=j.latido&&j.ug&&S.ug&&j.ug!==S.ug;if(j.latido&&j.ug)S.ug=j.ug;   // v76: la planilla avisa cuando cambió la lista (frase, estado, avatar…)
    if(ugCambio||Date.now()-S.usersAt>(j.latido&&Array.isArray(j.pr)?300000:30000)||falta||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}
    const invCh=j.invs?invGuardarSt(j.invs):false;if(invCh&&$('.cx-panel'))$('.cx-panel').dataset.sig='';
    if(j.borr&&aplicarBorrados(j.borr)&&S.open){$('.cx-panel').dataset.sig='';render();badges();}
    if(j.amigos)guardarAmigos(j.amigos,!S.amOk);
    if(Array.isArray(j.grupos)){S.grSup=true;S.pollOk=Date.now();const gch=guardarGrupos(j.grupos);if(S.open&&(gch||(S.view==='conv'&&esGK(S.con)&&S.gPido&&S.gPido.k===S.con))){$('.cx-panel').dataset.sig='';render();}}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();invCorregir();
}
function errorChat(e){
    const m=String(e&&e.message||e);
    if(/desconocida/i.test(m)){if(conLatido()||(window.LATIDO&&LATIDO.viejo&&/latido/.test(m)))return;S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
}
const PARTE={armar:p=>{if(cuentaAlDia())armarChat(p);},recibir:j=>recibirChat(j),ms:msChat,error:e=>{if(!/desconocida/i.test(String(e&&e.message||e)))errorChat(e);}};
async function poll(){
  if(conLatido()){LATIDO.registrar('chat',PARTE);LATIDO.ahora();return;}   // v76: la consulta la hace el latido
  const a=cuentaAlDia();if(!a)return;
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const j=await call(auth(armarChat({accion:'chat'})));
    await recibirChat(j);
  }catch(e){errorChat(e);
  }finally{S.polling=false;schedule();}
}
// Si la planilla no conoce «latido», el chat vuelve a preguntar por su cuenta (como en la v75).
window.addEventListener('bloques-latido-viejo',()=>{S.err='';schedule();if(!S.polling)setTimeout(poll,200);});
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){try{if(window.TITULOS)TITULOS.guardarLista(j.usuarios,j.cau);}catch(_){}const on=a=>a.filter(u=>u.enLinea).map(u=>lc(u.usuario)).sort().join(',');const ch=on(j.usuarios)!==on(S.users);S.users=j.usuarios;S.usersAt=Date.now();if(ch)avisarAmigos();}}catch(_){}}
const lastFrom=n=>{let t=0;if(esGK(n)){for(const m of S.msgs)if(conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.t>t)t=m.t;return t;}for(const m of S.msgs)if(!esG(m)&&lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id)||!nombreOk(m.de)||!nombreOk(m.para)||borradoLocal(m))continue;
    // Si un «No se mandó» en realidad sí llegó (se cortó la respuesta), se reemplaza por el de la planilla.
    if(lc(m.de)===lc(S.me)&&typeof m.p==='string'){const i=S.msgs.findIndex(x=>x.tmp&&lc(x.para)===lc(m.para)&&x.p===m.p&&Math.abs(x.t-m.t)<5*60e3);if(i>=0){delete S.plain[S.msgs[i].id];S.msgs.splice(i,1);}}
    S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  esperoRevisar(fresh);

  else if(a==='pinx'){S.pinAsk=false;S.err='';$('.cx-panel').dataset.sig='';render();}

  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);

  else if(a==='borrarno'){S.delFor=null;render();}

  else if(a==='reintentar')reintentar(b.dataset.id);
  else if(a==='gnuevo'){S.view='gnuevo';S.gsel={};S.gnom='';S.err='';p0().dataset.sig='';render();loadUsers().then(()=>{if(S.view==='gnuevo'){p0().dataset.sig='';render();}});}
  else if(a==='gsel'){const k=lc(b.dataset.u);if(S.gsel[k])delete S.gsel[k];else S.gsel[k]=b.dataset.u;guardarNombreG();p0().dataset.sig='';render();}

// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}
/* v63: el chat «null». La respuesta de la planilla tarda unos segundos; si mientras tanto volvías a la lista
   (S.con=null) el mensaje se guardaba con para=null y aparecía una charla llamada «null». Ahora el destinatario
   se toma una sola vez al tocar Enviar, y si no se pudo mandar queda en su charla con «No se mandó · Reintentar». */
async function send(){
  const ta=$('#cx-in'),para=S.con;if(!ta||!nombreOk(para))return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const pl=JSON.stringify({x:txt}),tmp={id:'tmp'+Date.now()+Math.random().toString(36).slice(2,6),de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:Date.now(),tmp:true};
  S.plain[tmp.id]={x:txt};S.msgs.push(tmp);saveMsgs();render();
  await mandar(tmp);
}
async function mandar(tmp){
  tmp.fail=false;tmp.sending=true;$('.cx-panel')&&($('.cx-panel').dataset.sig='');render();
  try{
    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    if(!S.msgs.some(x=>x.id===j.id)){const m={id:j.id,de:S.me,para:tmp.para,tipo:'msg',cont:'',p:tmp.p,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]=S.plain[tmp.id];}
    delete S.plain[tmp.id];saveMsgs();if(lc(S.con)===lc(tmp.para))S.err='';
  }catch(e){tmp.sending=false;tmp.fail=true;tmp.why=sinV12(e);saveMsgs();}
  if($('.cx-panel'))$('.cx-panel').dataset.sig='';render();
}
function reintentar(id){const m=S.msgs.find(x=>x.id===id&&x.tmp);if(m&&!m.sending)mandar(m);}
function descartar(id){const i=S.msgs.findIndex(x=>x.id===id&&x.tmp);if(i>=0){S.msgs.splice(i,1);delete S.plain[id];saveMsgs();$('.cx-panel').dataset.sig='';render();}}
async function shareTo(name){
  const c=S.card;if(!c||!nombreOk(name))return;const note=String(($('#cx-snote')||{}).value||'').trim().slice(0,200);
  try{const pl=JSON.stringify({x:note,card:c}),j=await call(auth({accion:'enviar',para:name,tipo:'msg',p:pl}));
    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();
    S.card=null;S.con=name;S.view='conv';S.err='';$('.cx-panel').dataset.sig='';render();}
  catch(e){S.err=sinV12(e);const el=$('.cx-panel');if(el){el.dataset.sig='';}render();}
}
function share(card){ensureDom();S.card=card;S.view='share';S.open=true;$('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;$('.cx-panel').dataset.sig='';try{H.onOpen();}catch(_){}render();loadUsers().then(()=>{if(S.view==='share')render();});}
async function buzz(){

async function react(id,e){
  S.pickFor=null;const m=S.msgs.find(x=>x.id===id);if(!m)return;const para=esG(m)?m.para:other(m);if(!nombreOk(para))return;
  const mine=S.msgs.filter(x=>x.tipo==='reac'&&x.ref===id&&lc(x.de)===lc(S.me)).pop(),cur=mine&&S.plain[mine.id]&&S.plain[mine.id].e;
  const val=cur===e?'':e;

    const r={id:j.id,de:S.me,para,tipo:'reac',cont:'',p:pl,ref:id,t:j.t};S.msgs.push(r);S.plain[r.id]={e:val};saveMsgs();S.err='';}

const JG=[['truco','🃏 TrucAR','De a 4 o 6, en equipos'],['uno','🎴 UnoAR','De 2 a 6'],['poblar','🏘️ PoblAR','De 2 a 4'],['ludo','🎲 LudAR','De 2 a 4'],['pool','🎱 PoolAR','Mano a mano o de a 4'],['invasores','👾 InvasorAR','Duelo de a 2'],['ajedrez','♟️ AjedrezAR','De a 2'],['bloquear','🧱 BloqueAR','Duelo de a 2']];

/* ───────── Chat de la mesa (v66) ─────────
   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la
       pantalla y se recuerda por juego y por orientación (localStorage «mesa-chat-pos:<juego>:v|h»). Agrega «⟲» para
       volver a su lugar. Los globitos de mensajes nuevos salen del lado donde lo dejaste.
   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve
     libre por toda la pantalla. movible(el, juego, {abrir, cerrar, btn, visible, ancla}) — abrir: cómo reabrirlo desde
     la barrita (si no, se muestra el mismo panel); btn: el botón del chat del juego (la barrita se ve mientras él se vea).
   · nuevo(juego, de, txt)  (v74) los chats propios (UnoAR, LudAR, InvasorAR) avisan cada mensaje que llega: si está

   El mensaje en la red: {t:'mchat', de, txt, eq}. eq=1: sólo para el equipo del que lo manda. */

function movible(el,juego,op={}){

    const w=b.offsetWidth||110,h=b.offsetHeight||40;encerrar(b,izq?r.left:r.right-w,abajo?r.bottom-h:r.top);posGuardar(j,'mini',centro(b));}

function restaurar(j){const R=REG[j];if(!R)return;const b=R.mini&&!R.mini.hidden?R.mini:null;

  if(b){const r=b.getBoundingClientRect(),p=R.el,w=(p&&p.offsetWidth)||Math.min(340,innerWidth-20),h=(p&&p.offsetHeight)||260;

// Globito arriba de la barrita (o abajo si está pegada arriba); tocarlo abre el chat.

/* «Avisar a un grupo» (v66): desde la mesa de espera de un juego, el que la armó avisa en un grupo del chat 💬
   («¿Quién se prende?»). Los que tocan «Me prendo» le piden lugar; acá se los va buscando y se los invita solos

  ['pointerdown','touchstart','keydown'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));

})();

<script>
'use strict';
/* ───────── La Gran Pampa ─────────
   La temporada de la semana en un mapa de parajes (hexágonos). Cada lunes, mapa nuevo y todos parejos.
   Con leguas (que se ganan jugando BloqueAR, PoblAR, TrucAR y EstanciAR) reclamás parajes pegados a tu tierra o
   desafiás a un vecino por uno de los suyos: el cruce se juega con un BloqueAR relámpago o con un malón
   en EstanciAR. Cada paraje da puntos por día; el domingo a la medianoche gana el que más juntó.
   Todo lo decide la planilla (Codigo.gs versión 9). */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
// Puntos: con un decimal mientras son pocos (así se nota quién va adelante el lunes).
const fpts=n=>{n=Number(n)||0;return n<100?(Math.floor(n*10)/10).toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}):fmt(n);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lc=s=>String(s||'').toLowerCase();
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function rnd(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
// Hora de la planilla (no la del celular): así el reloj de la semana no depende de la hora del aparato.
let SKEW=0;const ahoraS=()=>Date.now()+SKEW;
function hace(t){const s=Math.max(0,(ahoraS()-t)/1000);if(s<60)return 'recién';if(s<3600)return `hace ${Math.floor(s/60)} min`;if(s<86400)return `hace ${Math.floor(s/3600)} h`;return `hace ${Math.floor(s/86400)} d`;}
function quedan(ms){ms=Math.max(0,ms);const h=Math.floor(ms/3600e3),d=Math.floor(h/24);if(d>=1)return `${d} d ${h%24} h`;if(h>=1)return `${h} h ${Math.floor(ms/60e3)%60} min`;return `${Math.max(1,Math.floor(ms/60e3))} min`;}
function fitScreen(){document.documentElement.style.setProperty('--app-h',(window.visualViewport?visualViewport.height:innerHeight)+'px');}
fitScreen();
function hoyLocal(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);}   // el día en hora argentina, igual que la planilla y RANGOS.pampaAct

/* ───────── Planilla ───────── */
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
// Lo que jugaste hoy en los otros juegos (lo anotan ellos en «pampa-act»): la planilla lo pasa a leguas, con tope.
function actHoy(){const o=ls.json('pampa-act',null),h=hoyLocal(),r={d:h};for(const q of 'bptuaeklsomr')r[q]=o&&o.d===h?(o[q]|0):0;return r;}   // v70: todas las fuentes (en leguas)
async function api(p,ms=20000){
  const a=acct(),url=ls.get('bloques-lb-url-v1')||LB_DEF;if(!a)throw new Error('Necesitás tu cuenta de BloqueAR.');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(url,{method:'POST',body:JSON.stringify({usuario:a.usuario,token:a.token,act:actHoy(),...p}),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();
    if(!j||!j.ok){const e=new Error(j&&j.error||'La planilla respondió con un error.');if(/desconocida/i.test(e.message))e.vieja=true;if(/sesi[oó]n/i.test(e.message))e.sesion=true;throw e;}
    if(!(j.version>=9)||(!j.t&&!/^(modoPacifico|pampaPref)$/.test(p.accion))){const e=new Error('La planilla tiene el código viejo.');e.vieja=true;throw e;}   // v69: el modo y la defensa no traen el mapa
    return j;}
  catch(e){if(e.name==='AbortError'){const x=new Error('La planilla tardó demasiado. Probá de nuevo.');x.red=true;throw x;}if(e instanceof TypeError){const x=new Error('Sin conexión. ¿Hay internet?');x.red=true;throw x;}throw e;}
  finally{clearTimeout(to);}
}

/* ───────── Sonidos (pocos y bajitos) ───────── */
let AC=null,SND=ls.get('pampa-sonido')!=='0';
function actx(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,d,v=.06,delay=0,type='sine'){const a=actx(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.connect(g).connect(a.destination);o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.start(t);o.stop(t+d+.02);}
const SX={tap(){tone(520,480,.06,.035);},claim(){tone(392,392,.16,.05);tone(523,523,.22,.05,.09);},win(){[392,494,587,784].forEach((f,i)=>tone(f,f,.3,.05,i*.1));},lose(){[330,262].forEach((f,i)=>tone(f,f,.3,.05,i*.15));},nope(){tone(180,170,.09,.05);},horn(){tone(220,220,.3,.045);tone(294,294,.36,.045,.22);}};
// v68: ruido corto (para tambores y viento) y sonidos nuevos: clavar la bandera y los tambores de un desafío.
let NOISE=null;function noiseBuf(){const a=actx();if(NOISE)return NOISE;const n=a.sampleRate*2,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}return NOISE=b;}
function golpe(f,delay,v=.09){const a=actx(),t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f*1.8,t);o.frequency.exponentialRampToValueAtTime(f,t+.09);o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0005,t+.32);o.start(t);o.stop(t+.35);}
SX.bandera=function(){golpe(95,0,.1);tone(392,392,.14,.04,.12);tone(587,587,.22,.045,.2);};
SX.tambores=function(){[0,.16,.32,.44,.56].forEach((d,i)=>golpe(i%2?120:80,d,i>2?.11:.08));tone(294,294,.3,.035,.62,'triangle');};
SX.pierdo=function(){tone(300,220,.35,.05);};
function sfx(k){if(!SND)return;try{SX[k]&&SX[k]();}catch(_){}}
/* v68: ambiente de campo, bajito y con volumen propio: viento suave que va y viene y algún pájaro de vez en cuando.
   Arranca con el primer toque (los navegadores no dejan sonar antes) y se calla en segundo plano. */
let AMB=null,AMBV=Math.max(0,Math.min(1,Number(ls.get('pampa-ambiente')??'.35')));
function ambOn(){if(AMB||AMBV<=0||document.hidden)return;try{const a=actx(),src=a.createBufferSource();src.buffer=noiseBuf();src.loop=true;
  const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=480;bp.Q.value=.6;const g=a.createGain();g.gain.value=0;
  const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=.07;lg.gain.value=.012*AMBV;lfo.connect(lg).connect(g.gain);
  src.connect(bp).connect(g).connect(a.destination);src.start();lfo.start();g.gain.setTargetAtTime(.02*AMBV,a.currentTime,1.5);
  AMB={src,g,lfo,bird:setTimeout(pajaro,4000+Math.random()*8000)};}catch(_){AMB=null;}}
function ambOff(){if(!AMB)return;try{AMB.g.gain.setTargetAtTime(0,actx().currentTime,.3);const A=AMB;setTimeout(()=>{try{A.src.stop();A.lfo.stop();}catch(_){}},900);clearTimeout(A.bird);}catch(_){}AMB=null;}
function pajaro(){if(!AMB)return;try{const a=actx(),v=.025*AMBV,f=2200+Math.random()*900,n=2+Math.floor(Math.random()*3);for(let k=0;k<n;k++){const t=a.currentTime+k*.16,o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.35,t+.07);o.frequency.exponentialRampToValueAtTime(f*.9,t+.12);o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0003,t+.13);o.start(t);o.stop(t+.15);}}catch(_){}
  AMB.bird=setTimeout(pajaro,9000+Math.random()*16000);}
function setAmb(v){AMBV=Math.max(0,Math.min(1,v));ls.set('pampa-ambiente',String(AMBV));if(AMB)try{AMB.g.gain.setTargetAtTime(.02*AMBV,actx().currentTime,.3);}catch(_){}if(AMBV<=0)ambOff();else ambOn();}
addEventListener('pointerdown',()=>{if(!AMB&&AMBV>0)ambOn();},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){ambOff();try{AC&&AC.state==='running'&&AC.suspend();}catch(_){}}else{try{AC&&AC.resume();}catch(_){}}});

/* ───────── Geometría del mapa: hexágonos con la punta para arriba, coordenadas axiales ───────── */
const HS=40,SQ3=Math.sqrt(3);
// Vecino del otro lado de cada lado k (entre las esquinas k y k+1).
const SIDE=[[1,0],[0,1],[-1,1],[-1,0],[0,-1],[1,-1]];
let GEO=null;
// R: el mapa entero (los números de paraje no cambian); rv: lo que se juega esta semana (crece con los que se suman).
function geo(R,rv=R){
  if(GEO&&GEO.R===R&&GEO.rv===rv)return GEO;const c=[],m={},xy=[],vis=[];
  for(let q=-R;q<=R;q++)for(let r=Math.max(-R,-q-R);r<=Math.min(R,-q+R);r++){m[q+','+r]=c.length;c.push([q,r]);xy.push([HS*SQ3*(q+r/2),HS*1.5*r]);vis.push((Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2<=rv);}
  const nb=c.map(([q,r])=>SIDE.map(([dq,dr])=>{const j=m[(q+dq)+','+(r+dr)];return j!==undefined&&vis[j]?j:-1;}));
  const W=HS*SQ3*(2*rv+1),H=HS*(3*rv+2);
  return GEO={R,rv,c,m,xy,nb,vis,n:c.length,W,H};
}
const GV=()=>geo(V.R,V.rv||V.R);
function corner(x,y,k,s=HS){const a=Math.PI/180*(60*k-30);return [x+s*Math.cos(a),y+s*Math.sin(a)];}
function hexPath(g,x,y,s=HS){g.beginPath();for(let k=0;k<6;k++){const p=corner(x,y,k,s);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);}g.closePath();}
function hexAt(wx,wy){if(!GEO)return -1;const q=(SQ3/3*wx-wy/3)/HS,r=(2/3*wy)/HS;let x=q,z=r,y=-x-z,rx=Math.round(x),rz=Math.round(z),ry=Math.round(y);
  const dx=Math.abs(rx-x),dy=Math.abs(ry-y),dz=Math.abs(rz-z);if(dx>dy&&dx>dz)rx=-ry-rz;else if(dz>dy)rz=-rx-ry;const i=GEO.m[rx+','+rz]??-1;return i>=0&&GEO.vis[i]?i:-1;}

/* ───────── Dibujo ───────── */
const cv=$('map'),ctx=cv.getContext('2d');
let W=0,Hh=0,DPR=1;const cam={x:0,y:0,z:.5};let zFit=.5,USERCAM=false;
// v61: cada paraje con su color, su claridad y su dibujo (trigo en franjas, pasto con vacas y alambrado, monte tupido y oscuro,
// cerros con nieve, agua con juncos, salitral blanco y cuarteado): se distinguen también sin ver bien los colores.
const TIPO={p:{n:'Pampa',c:'#ddb548'},a:{n:'Pastura',c:'#6aa346'},m:{n:'Monte',c:'#24421f'},s:{n:'Sierra',c:'#87827b'},l:{n:'Laguna',c:'#2f7ea6'},x:{n:'Salitral',c:'#ece6d7'}};
const DESC={p:'Trigales de la pampa húmeda: buena tierra.',a:'Pasturas para la hacienda.',m:'Monte de talas y espinillos.',s:'Sierras con piedra y vetas.',l:'Laguna con juncos: la más codiciada.',x:'Salitral: da poco, pero suma.'};
// v61: el papel de cada paraje (sólo en las semanas con las reglas nuevas: V.reglas.mec)
const ROL={a:m=>`Si tenés una laguna pegada, la riega: <b>+${m.riego} por día</b>.`,l:m=>`Riega: cada pastura tuya pegada da <b>+${m.riego} por día</b>.`,s:m=>`Mirador: desde acá reclamás parajes libres <b>a ${m.alcance} de distancia</b>, sin estar pegados.`,m:m=>`Se defiende solo: desafiarlo cuesta <b>${m.monte} leguas más</b>.`};
function oval(g,x,y,rx,ry,col){g.fillStyle=col;g.beginPath();g.ellipse(x,y,rx,ry,0,0,7);g.fill();}
function circle(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
function line(g,a,b,col,lw){g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';g.stroke();}
// Cada paraje pintado a mano: surcos, matas, árboles, piedras, agua o grietas.
function paintTerrain(g,t,x,y,seed){
  const R=rnd(seed),S=HS;g.save();hexPath(g,x,y,S+.6);g.clip();
  g.fillStyle=TIPO[t].c;g.fillRect(x-S-2,y-S-2,2*S+4,2*S+4);
  if(t==='p'){// trigal: franjas de surcos dorados y espigas
    g.save();g.translate(x,y);g.rotate(-.42);
    for(let i=-9;i<=9;i++){g.fillStyle=i&1?'#c39a33':'#e9c65c';g.fillRect(-S*1.6,i*6-3,S*3.2,6);}
    g.strokeStyle='#8f6a1f';g.lineWidth=.9;
    for(let i=-8;i<=8;i+=2)for(let k=-7;k<=7;k++){const px=k*6+(i%4?3:0)+(R()-.5)*1.5,py=i*6+1;g.beginPath();g.moveTo(px,py+2.4);g.lineTo(px,py-2.6);g.stroke();oval(g,px,py-3.2,1,1.9,'#f6e29a');}
    g.restore();}
  else if(t==='a'){// pastura: pasto parejo con matitas, alambrado y vacas
    for(let i=0;i<7;i++)oval(g,x+(R()-.5)*1.7*S,y+(R()-.5)*1.7*S,6+R()*8,3+R()*4,'rgba(150,200,105,.45)');
    for(let i=0;i<26;i++){const px=x+(R()-.5)*1.9*S,py=y+(R()-.5)*1.9*S;g.strokeStyle=R()<.5?'#3f7a2c':'#9ccc6e';g.lineWidth=1;g.beginPath();g.moveTo(px-2,py);g.lineTo(px-2.6,py-3.6);g.moveTo(px,py);g.lineTo(px,py-4.6);g.moveTo(px+2,py);g.lineTo(px+2.6,py-3.6);g.stroke();}
    const fy=y-S*.42;line(g,[x-S,fy+5],[x+S,fy-5],'rgba(60,42,24,.75)',.8);line(g,[x-S,fy+7.5],[x+S,fy-2.5],'rgba(60,42,24,.5)',.7);
    for(let k=-5;k<=5;k++){const px=x+k*7.5,py=fy-(k*7.5)/S*5;g.fillStyle='#5b3d22';g.fillRect(px-.8,py-2,1.6,7.5);}
    for(let i=0;i<3;i++){const px=x+(R()-.5)*1.15*S,py=y+S*.05+(R()-.2)*.75*S,d=R()<.5?1:-1;
      oval(g,px+1,py+3.2,6,1.8,'rgba(25,30,10,.3)');g.fillStyle='#3b2c22';g.fillRect(px-3.6,py+1,1.2,3);g.fillRect(px+2.4,py+1,1.2,3);
      oval(g,px,py,5.4,3.3,'#f3efe4');oval(g,px+1.5*d,py-.6,1.9,1.5,'#2b2622');oval(g,px-1.8*d,py+.6,1.4,1.2,'#2b2622');
      oval(g,px+5.4*d,py-1.4,2.2,1.8,'#f3efe4');circle(g,px+6.6*d,py-1,1,'#d9a7a0');}}
  else if(t==='m'){// monte: copas tupidas, una al lado de la otra
    const tr=[];for(let r=-5;r<=5;r++)for(let q=-5;q<=5;q++){const px=x+(q+(r&1?.5:0))*9+(R()-.5)*3,py=y+r*7.6+(R()-.5)*3;if(Math.abs(px-x)<S*1.05&&Math.abs(py-y)<S*1.05)tr.push([px,py,5.2+R()*2.6]);}
    tr.sort((a,b)=>a[1]-b[1]);
    for(const [px,py,r] of tr){oval(g,px+1.5,py+r*.7,r*.95,r*.42,'rgba(5,12,3,.5)');circle(g,px,py,r,'#2c5525');circle(g,px-r*.22,py-r*.28,r*.72,'#3c7230');circle(g,px-r*.42,py-r*.5,r*.32,'#64a04c');}}

    txt.innerHTML=`Tachaste <b>${esc(JG(r.dataset.j).n)}</b>. La suerte elige entre los otros dos…`;
    const otros=reels.filter(x=>x!==r);st.cur=0;luces.classList.add('rapido');
    const paso=()=>{otros.forEach((x,k)=>x.classList.toggle('luz',k===st.cur));if(SND)tone(980,980,.035,.025);st.cur=1-st.cur;st.alt=setTimeout(paso,RM?60:105);};if(!RM)paso();
    try{const res=await api({accion:'pampaSorteo',duelo:d.id,tacha:r.dataset.j});st.res=res;const ev=(res.eventos||[])[0]||{};
      st.jf=ev.j||(gu?res.guardia&&res.guardia.pend&&res.guardia.pend.j:(res.duelos||[]).find(x=>x.id===d.id)?.j);
      clearTimeout(st.alt);if(RM||st.saltar)final();else frenarLuces(otros);}
    catch(err){clearTimeout(st.alt);otros.forEach(x=>x.classList.remove('luz'));r.classList.remove('tachado');luces.classList.remove('rapido');sfx('nope');
      st.fase='elige';caja.classList.add('so-elige');reels.forEach(x=>x.disabled=false);txt.innerHTML=esc(err.message)+'<br>Probá de nuevo.';
      pie.innerHTML='<button class="btn" id="so-luego0">Tachar después</button>';ov.querySelector('#so-luego0').onclick=()=>{cerrar();renderAll();};if(err.sesion){cerrar();showError(err);}}}));
  // las luces se alternan cada vez más lento hasta quedar en el que eligió la planilla
  function frenarLuces(otros){const meta=otros.findIndex(x=>x.dataset.j===st.jf),P=[110,140,180,230,290,370,460];let k=P.length;
    // después de k pasos queda prendido «cur»: que sea la meta
    let c=st.cur;if(((c+k-1)%2)!==meta)k--;let i=0;
    const paso=()=>{otros.forEach((x,q)=>x.classList.toggle('luz',q===c));if(SND)tone(980,980,.035,.025);i++;if(i>=k){st.alt=null;T(final,230);return;}c=1-c;st.alt=setTimeout(paso,P[i]);};
    if(meta<0){final();return;}paso();}
  function final(viejo){if(st.fase==='final')return;st.fase='final';ov.dataset.tg=performance.now()|0;clearTimeout(st.alt);tms.forEach(clearTimeout);
    const j=st.jf,J=JG(j);reels.forEach(x=>{x.classList.remove('luz');if(x.dataset.j===j)x.classList.add('gana');else if(x!==st.tachado)x.classList.add('pierde');});
    luces.classList.remove('rapido');luces.classList.add('fiesta');if(!viejo)sfx('win');
    if(!RM&&!viejo){const g=reels.find(x=>x.dataset.j===j),b=g.getBoundingClientRect(),cb=caja.getBoundingClientRect();
      for(let n=0;n<26;n++){const c=document.createElement('i');c.className='so-chispa';const a=Math.random()*Math.PI*2,v=70+Math.random()*120;
        c.style.left=(b.left-cb.left+b.width/2)+'px';c.style.top=(b.top-cb.top+b.height/2)+'px';c.style.background=['#f6c453','#7ce9e5','#c0392b','#5f7a3a','#fbf7ee'][n%5];
        c.style.setProperty('--dx',Math.cos(a)*v+'px');c.style.setProperty('--dy',(Math.sin(a)*v-40)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');caja.appendChild(c);T(()=>c.remove(),1200);}}
    txt.innerHTML=gu?`Tu guardia se juega con <b>${J.e} ${esc(J.n)}</b>.`:`Se juega con <b>${J.e} ${esc(J.n)}</b>.`;
    const dd=gu?(st.res&&st.res.guardia&&st.res.guardia.pend?{...st.res.guardia.pend,guardia:1,yoDe:true}:{...d,j,guardia:1,yoDe:true}):((st.res&&(st.res.duelos||[]).find(x=>x.id===d.id))||{...d,j});
    pie.innerHTML=`<button class="btn go" id="so-go">${J.e} ${gu?'Jugar la guardia':'Jugar ahora'}</button><button class="btn" id="so-luego">Después</button>${gu?'':`<p class="note">Jugás primero, contra la compu. Si no jugás en 2 horas, el cruce se cancela y te devuelven las leguas.</p>`}`;
    if(st.res)try{apply(st.res);}catch(_){}
    ov.querySelector('#so-go').onclick=()=>{cerrar();playDuel(dd);};ov.querySelector('#so-luego').onclick=()=>{cerrar();renderAll();};
    try{ov.querySelector('#so-go').focus({preventScroll:true});}catch(_){}}
  // tocar la pantalla adelanta (mientras gira o mientras se alternan las luces)
  ov.addEventListener('pointerdown',e=>{if(st.fase==='gira'){e.preventDefault();listo();}
    else if(st.fase==='espera'&&st.res&&st.alt){clearTimeout(st.alt);st.alt=null;final();}else if(st.fase==='espera')st.saltar=true;});
}
// Ir a jugar un cruce: el relámpago en BloqueAR y el malón en EstanciAR; al terminar se vuelve al mapa.
// v69: TrucAR, UnoAR y AjedrezAR se abren con «#pampa-cruce=SEMILLA&duelo=ID» y dejan el resultado en «pampa-resultado».
function playDuel(d){
  if(!d.j&&d.sorteo){sorteoAnim(d);return;}   // v74: primero el sorteo
  if(d.j==='malon'){location.href=`estancia.html#pampa-malon=${encodeURIComponent(d.a)}&duelo=${d.id}`;return;}
  ls.set('pampa-cruce',JSON.stringify({id:d.id,j:d.j,t:Date.now(),rival:d.guardia?'':d.yoDe?d.a:d.de,sd:d.yoDe||d.guardia?null:d.sd,guardia:!!d.guardia}));
  // v72: también PoolAR, LudAR, PoblAR y los solitarios (con el mismo «#pampa-cruce=SEMILLA&duelo=ID»)
  const pag={truco:'truco.html',uno:'uno.html',ajedrez:'ajedrez.html',pool:'pool.html',ludo:'ludo.html',poblar:'poblar.html',sudoku:'sudoku.html',buscaminas:'buscaminas.html',solitario:'solitario.html'}[d.j];
  location.href=pag?`${pag}#pampa-cruce=${d.seed}&duelo=${d.id}`:`./#pampa-relampago=${d.seed}&duelo=${d.id}`;
}
// El resultado del relámpago vuelve en «pampa-resultado».
async function pendingResult(){
  const r=ls.json('pampa-resultado',null);if(!r||!r.duelo)return;
  if(Date.now()-r.t>6*3600e3){ls.set('pampa-resultado',null);return;}
  try{const j=await api({accion:'pampaJuego',duelo:r.duelo,puntos:r.puntos});ls.set('pampa-resultado',null);apply(j);
    const ev=(j.eventos||[])[0],d=j.duelos.find(x=>x.id===r.duelo),gano=d&&((d.yoDe&&d.fin==='de')||(!d.yoDe&&d.fin==='a'));sfx(d&&d.fin?(gano?'win':'lose'):'claim');
    const ic=d&&d.doma?'🐎':JG(r.j||(d&&d.j)||'relampago').e,tit=r.lineas!=null?`${r.lineas} ${r.lineas===1?'línea':'líneas'}`:r.txt||'Cruce anotado';
    const el=center(`<div class="ic">${ic}</div><h3>${esc(tit)}</h3><p>${esc(ev?ev.txt:'Listo.')}</p><button class="btn go" id="rs-ok">Al mapa</button>`);$('rs-ok').onclick=hideCenter;}
  catch(e){if(!e.red)ls.set('pampa-resultado',null);
    const el=center(`<div class="ic">⚠️</div><h3>No se pudo anotar</h3><p>${esc(e.message)}${e.red?' Queda guardado: se anota cuando vuelvas a entrar.':''}</p><button class="btn go" id="rs-ok">${e.red?'Reintentar':'Entendido'}</button>`);
    $('rs-ok').onclick=()=>{hideCenter();if(e.red)pendingResult();};}
}
// Al volver de un malón: el resultado ya lo anotó EstanciAR; acá se cuenta cómo salió.
function malonResult(){
  const d=V&&V.duelos.filter(x=>x.j==='malon'&&x.yoDe&&x.fin&&ahoraS()-x.t<6*3600e3).sort((a,b)=>b.t-a.t)[0];if(!d)return;
  const gano=d.fin==='de';sfx(gano?'win':'lose');
  const el=center(`<div class="ic">${gano?'🐎':'🛡️'}</div><h3>${gano?'¡El paraje es tuyo!':`${esc(d.a)} se defendió`}</h3><p>Malón con ${d.sd||0} ⭐ en la estancia de ${esc(d.a)}.${gano?'':' Hacían falta 2 ⭐.'}</p><button class="btn go" id="ml-ok">Al mapa</button>`);$('ml-ok').onclick=hideCenter;
}
function showNoAccount(){
  center(`<div class="ic">🗺️</div><h3>La Gran Pampa</h3><p>Un mapa por semana con tus amigos: ganás leguas jugando, reclamás parajes y peleás las fronteras en cruces. El domingo gana el que juntó más.</p><p>Para entrar necesitás tu cuenta de BloqueAR (usuario y PIN, gratis).</p><a class="btn go" href="./#cuenta" id="nc-go">Crear cuenta o entrar</a><button class="btn link" id="nc-help">¿Cómo se juega?</button>`);
  $('nc-help').onclick=openHelp;$('nc-go').onclick=()=>{try{sessionStorage.setItem('blq-volver','pampa.html');}catch(_){}};
}
function showError(e){
  let h;
  if(e.vieja)h=`<div class="ic">🛠️</div><h3>Falta actualizar la planilla</h3><p>El mapa nuevo necesita el <b>Codigo.gs</b> versión 9: quien administra la planilla tiene que pegarlo y publicar una <b>Nueva versión</b>.</p><button class="btn" id="er-r">Probar de nuevo</button>`;
  else if(e.sesion)h=`<div class="ic">🔑</div><h3>Volvé a entrar</h3><p>${esc(e.message)}</p><a class="btn go" href="./#cuenta" onclick="try{sessionStorage.setItem('blq-volver','pampa.html')}catch(_){}">Entrar con mi cuenta</a>`;
  else h=`<div class="ic">📡</div><h3>No se pudo cargar el mapa</h3><p>${esc(e.message)}</p><button class="btn go" id="er-r">Reintentar</button>`;
  center(h);const r=$('er-r');if(r)r.onclick=()=>{hideCenter();LOADED?load(true):boot();};
}

let POLL=0,BOOT_HASH='',AYUDA_PEND=false;   // v69: la ayuda nueva espera a que cierres el premio
(async function start(){
  ls.set('bloques-ultimo-juego','pampa');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}

    invite:(g,u)=>{location.href=(g==='poblar'?'poblar.html':g==='estancia'?'estancia.html':g==='truco'?'truco.html':'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{location.href=c.j==='poblar'?'poblar.html':c.j==='estancia'?'estancia.html':c.j==='pampa'?'pampa.html':c.j==='truco'?'truco.html':'./';}});

})();
// v68: la cuenta regresiva del aviso se actualiza sola; al pasar el martes 12:00 se vuelve a pedir el mapa.
setInterval(()=>{if(!V||document.hidden)return;const I=V.inscripcion;if(!V.yo&&I&&I.abierta){if(I.hasta-ahoraS()<=0)load(false);else{const c=document.querySelector('#alert .cd');if(c)c.textContent=quedan(I.hasta-ahoraS());}}},20000);
async function boot(){
  const ok=await load(true);if(!ok||LOADED)return;LOADED=true;
  const kAy=V&&V.v69?'pampa-ayuda-69':'pampa-ayuda-9',first=!ls.get(kAy);if(first){ls.set(kAy,'1');ls.set('pampa-ayuda-9','1');if(V&&V.premio)AYUDA_PEND=true;else openHelp();}
  if(ls.get('pampa-resultado'))await pendingResult();
  else if(/^#malon/.test(BOOT_HASH))malonResult();
  else if(!first&&!V.premio)novedades();
  let paVisto=null,paAt=Date.now();
  POLL=setInterval(()=>{if(document.hidden||BUSY)return;if(window.LATIDO&&LATIDO.activo()&&Date.now()-paAt<120000)return;paAt=Date.now();load(false);},30000);
  if(window.LATIDO)LATIDO.registrar('pampa',{armar:p=>{p.q.pa=1;},recibir:j=>{if(j.pa===undefined)return;if(paVisto===null){paVisto=j.pa;return;}
    if(j.pa!==paVisto){paVisto=j.pa;if(!document.hidden&&!BUSY){paAt=Date.now();load(false);}}}});   // v76
}

  get HL(){return HL;},get ANIMS(){return ANIMS;},anim,tierras:()=>tierras(GV(),V.own),get AMB(){return !!AMB;},get AMBV(){return AMBV;},setAmb,sfx};
