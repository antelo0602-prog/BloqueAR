<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>La Gran Pampa</title>
<style>
/* La Gran Pampa: un mapa de parajes como de juego de mesa. El mapa es lo que se luce; lo demás, cuero, bronce y papel. */
:root{--bg:#17140f;--line:#3b3226;--ink:#efe6d2;--aqua:#7ce9e5;--gold:#f6c453;
  --bark:#1e1a14;--brass:#c4a265;--brass2:#8a6a3e;--parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;
  --brown:#2a2118;--soft:#7d6d58;--olive:#5f7a3a;--olive2:#4a6030;--clay:#a3482f;--clay2:#7e3420;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--brown);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
/* Barra de arriba: la misma de todos los juegos */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);flex:none;border-bottom:1px solid #2b251c}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap;display:flex;align-items:center}.brand span{color:#d9b866;margin-left:.3em}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#d9c79e;border:1px solid #6b5a3e;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#211c15;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0}
.games-btn i{width:7px;height:7px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
/* Mapa */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#1d1d14}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* Marcadores de arriba */
.hud{position:absolute;top:8px;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.chip{pointer-events:auto;display:flex;align-items:center;gap:7px;height:34px;padding:0 11px 0 8px;border-radius:11px;background:rgba(30,26,20,.88);border:1px solid rgba(196,162,101,.32);box-shadow:0 4px 14px rgba(0,0,0,.28);color:var(--ink);font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip svg{width:18px;height:18px;display:block;flex:none}
.chip small{font-weight:600;color:#cdbf9f;font-size:12px}
.chip.leg b{font:700 16px/1 var(--serif)}
@media (max-width:430px){.chip .lab{display:none}}
/* celulares chicos: que las tres fichas entren aunque el reloj diga «20 h 27 min» */
@media (max-width:400px){.hud{gap:4px}.chip{gap:5px;padding:0 8px 0 6px;font-size:13px}.chip svg{width:16px;height:16px}.chip.leg b{font-size:15px}#h-rank small{display:none}}
.hud .sp{flex:1}
.alert{position:absolute;left:50%;top:50px;transform:translateX(-50%);width:min(440px,calc(100% - 16px));display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:12px;background:rgba(30,26,20,.94);border:1px solid rgba(196,162,101,.4);color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.35);font-weight:600;font-size:13.5px}
.alert[hidden]{display:none}
.alert .tx{flex:1;min-width:0}.alert .tx b{color:#f0dba2}
.alert.hot{border-color:rgba(201,110,80,.75)}
.alert .go{flex:none;height:34px;padding:0 12px;border-radius:9px;border:1px solid #7a5d33;background:linear-gradient(#d4b674,#b89550);color:#2a1f12;font-weight:750}
/* Tarjeta de abajo: lo que tocaste en el mapa */
.panel{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(460px,calc(100% - 16px));background:var(--parch);border:1px solid var(--rule);border-radius:14px;box-shadow:0 14px 34px rgba(0,0,0,.45);padding:11px 13px 12px;display:flex;flex-direction:column;gap:7px}
.panel[hidden]{display:none}
.panel h3{margin:0;font:700 18px/1.2 var(--serif);display:flex;align-items:center;gap:8px;padding-right:34px}
.panel h3 .sw{width:26px;height:26px;flex:none}
.panel p{margin:0;color:#4d4031;font-size:14px}
.panel .x{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:9px;border:0;background:var(--parch2);font-size:13px;color:var(--brown)}
.panel .stats{display:flex;gap:6px;flex-wrap:wrap}
.panel .st{display:flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:8px;background:#fbf7ee;border:1px solid #e1d3b6;font-size:12.5px;color:#5b4a37;font-variant-numeric:tabular-nums}
.panel .st b{font:700 15px/1 var(--serif);color:var(--brown)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:44px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.gold{background:linear-gradient(#d4b674,#b89550);border-color:#7a5d33;color:#2a1f12}
.btn.red{background:var(--clay);border-color:var(--clay2);color:#fff3e2}
.btn:disabled{opacity:.45}
.btn.col{flex-direction:column;gap:0}
/* Hojas */
.modal{position:fixed;inset:0;z-index:20;background:rgba(14,11,7,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:86%;display:flex;flex-direction:column;background:var(--parch);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.sheet h4{margin:4px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.tabs{display:flex;gap:4px;margin:0 16px 8px;padding:3px;border-radius:11px;background:var(--parch2);flex:none}
.tabs button{flex:1;height:34px;padding:0 10px;border-radius:8px;border:0;background:none;font-weight:700;color:#6b5a44}
.tabs button.on{background:#fbf7ee;color:var(--brown);box-shadow:0 1px 3px rgba(60,40,20,.18)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.rk.me{border-color:#b89550;box-shadow:inset 0 0 0 1px #d4b674}
.rk .pos{width:26px;text-align:center;font:700 17px/1 var(--serif);color:#7a5a24;flex:none}
.rk .av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--c,#7ce9e5);box-shadow:inset 0 0 0 2px rgba(0,0,0,.18);flex:none}
.rk .tx{flex:1;min-width:0}.rk .tx b{display:block;font:700 15.5px/1.2 var(--serif)}.rk .tx small{display:block;color:var(--soft);font-size:12.5px}
.rk .pts{text-align:right;font-variant-numeric:tabular-nums}.rk .pts b{display:block;font:700 17px/1 var(--serif)}.rk .pts small{color:var(--soft);font-size:11.5px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;text-align:left;width:100%}
.item .tx{flex:1;min-width:0}.item .tx b{display:block;font:700 15px/1.25 var(--serif)}.item .tx small{display:block;color:var(--soft);font-size:12.5px}
.item .btn{flex:none;min-height:40px}
.bar{height:6px;border-radius:3px;background:#ded1b4;overflow:hidden}.bar i{display:block;height:100%;background:var(--olive)}
.note{font-size:12.5px;color:var(--soft)}
.news{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:#4d4031}.news small{color:var(--soft)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.legend span{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:#fbf7ee;border:1px solid #e1d3b6;font-size:13px}
.legend i{width:34px;height:34px;flex:none}
.roles{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.45}.roles li{margin:3px 0}
.note.rol{color:inherit;background:rgba(196,162,101,.14);border-radius:8px;padding:6px 9px}
.note.disp{color:#7a2e1c;background:rgba(163,72,47,.12);border-radius:8px;padding:6px 9px}
.item.ini{background:rgba(196,162,101,.16)}
.legend b{font-family:var(--serif)}
/* v69: estrellas, eventos, fortines, juegos de los cruces, medallas y modo pacífico */
.estr{color:#b8860b;letter-spacing:1px;font-size:14px;white-space:nowrap}.estr i{font-style:normal;color:#d8cbb0}
.note.ev{color:inherit;background:rgba(246,196,83,.2);border-radius:8px;padding:6px 9px}
.note.fort{color:inherit;background:rgba(95,122,58,.15);border-radius:8px;padding:6px 9px}
.med-pampa{font-size:.95em;margin-left:2px}
.jg-list{display:flex;flex-direction:column;gap:8px}
.jg{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;text-align:left;width:100%}
.jg.on{border-color:#7a5d33;background:linear-gradient(#f6e7bf,#ecd79f);box-shadow:inset 0 0 0 1px #7a5d33}
.jg .ic{font-size:24px;width:30px;text-align:center;flex:none}.jg .tx{flex:1;min-width:0}.jg .tx b{display:block;font:700 15px/1.25 var(--serif)}.jg .tx small{display:block;color:var(--soft);font-size:12.5px}
.como{display:grid;grid-template-columns:1fr;gap:8px;margin:6px 0}
.como>div{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.como .ic{font-size:22px;line-height:1.1;flex:none;width:28px;text-align:center}.como b{font-family:var(--serif);font-size:15px}.como p{margin:2px 0 0;font-size:13.5px;color:#4d4031}
@media (min-width:560px){.como.dos{grid-template-columns:1fr 1fr}}
.tjg{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0}.tjg td{padding:5px 6px;border-top:1px solid #e1d3b6;vertical-align:top}.tjg td:first-child{white-space:nowrap;font-weight:700}
.paz{display:flex;flex-direction:column;gap:8px}.paz .estado{font:700 17px/1.3 var(--serif)}
/* v68: leyenda de dueños (abajo de los marcadores) */
.leyenda{position:absolute;top:48px;left:max(8px,env(safe-area-inset-left));max-width:calc(100% - 16px);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;pointer-events:auto;z-index:2}
.leyenda::-webkit-scrollbar{display:none}.leyenda[hidden]{display:none}
.ly{flex:none;display:flex;align-items:center;gap:6px;height:30px;padding:0 9px 0 6px;border-radius:15px;background:rgba(30,26,20,.88);border:1px solid rgba(196,162,101,.28);color:var(--ink);font-size:12.5px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.ly i{width:14px;height:14px;border-radius:4px;background:var(--c);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.35)}
.ly b{font-weight:700;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ly small{font:700 12px/1 var(--serif);color:#e8d8b3;background:rgba(0,0,0,.25);border-radius:7px;padding:3px 5px}
.ly.me{border-color:#d4b674;box-shadow:0 0 0 1px #d4b674 inset,0 3px 10px rgba(0,0,0,.25)}
.ly.on{background:#3a2f20;border-color:var(--c);box-shadow:0 0 0 2px var(--c) inset,0 3px 12px rgba(0,0,0,.35)}
body.con-ley .alert{top:90px}
@media (orientation:landscape) and (max-height:520px){body.con-ley .alert{top:86px}}
/* v68: nubes que pasan sobre el mapa (sólo decoración: no se pueden tocar) */
.nubes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.nubes i{position:absolute;left:-40%;width:42%;height:22%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.16),rgba(255,255,255,0) 68%);filter:blur(2px);animation:nube 95s linear infinite;will-change:transform}
.nubes i:nth-child(1){top:12%;animation-duration:110s}.nubes i:nth-child(2){top:46%;width:55%;animation-duration:140s;animation-delay:-60s;opacity:.8}.nubes i:nth-child(3){top:72%;width:36%;animation-duration:85s;animation-delay:-30s;opacity:.7}
@keyframes nube{from{transform:translateX(0)}to{transform:translateX(340%)}}
@media (prefers-reduced-motion:reduce){.nubes{display:none}}
.chip.leg.bump{animation:bump .9s ease-out}
@keyframes bump{0%{transform:scale(1)}25%{transform:scale(1.18);box-shadow:0 0 0 4px rgba(246,196,83,.5),0 4px 14px rgba(0,0,0,.28)}100%{transform:scale(1)}}
.side label.amb{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-height:50px;padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:#231e17;font-weight:650;color:var(--ink);font-size:15px}
.side label.amb input{flex:1;min-width:120px;accent-color:#c4a265}.side label.amb small{color:#a39276;font-size:12px;min-width:56px;text-align:right}
/* v68: ¿Cómo gano leguas? */
.lv-hero{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:linear-gradient(135deg,#3a2f20,#2a2118);color:var(--ink)}
.lv-hero .big{display:flex;align-items:center;gap:6px;flex:none}.lv-hero .big svg{width:28px;height:28px}.lv-hero .big b{font:700 30px/1 var(--serif);color:#f0dba2}
.lv-hero .tx b{display:block;font:700 16px/1.2 var(--serif)}.lv-hero .tx small{display:block;color:#d8cbb0;font-size:12.5px;line-height:1.35}.lv-hero .tx small b{display:inline;font:inherit;color:#f0dba2;font-weight:700}
.lv-hoy{display:flex;flex-direction:column;gap:5px;padding:10px 12px;border-radius:12px;background:rgba(95,122,58,.12);border:1px solid rgba(95,122,58,.35)}.lv-hoy b{font:700 15px/1.2 var(--serif)}.lv-hoy small{color:var(--soft);font-size:12px}
.lv-list{display:flex;flex-direction:column;gap:7px}
.lv-src{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.lv-src.full{background:#f1ecdc;opacity:.86}
.lv-src .ic{width:38px;height:38px;flex:none;display:grid;place-items:center;font-size:22px;border-radius:10px;background:#efe4cc}
.lv-src .tx{flex:1;min-width:0}.lv-src .tx b{display:block;font:700 15px/1.2 var(--serif)}.lv-src .tx b em{font-style:normal;font:700 12.5px/1 system-ui,sans-serif;color:#2a1f12;background:linear-gradient(#e2c47e,#c9a55c);border-radius:6px;padding:2px 6px;margin-left:4px;vertical-align:1px}
.lv-src .tx small{display:block;color:var(--soft);font-size:12px;line-height:1.3}
.lv-bar{display:flex;align-items:center;gap:3px;margin-top:5px}.lv-bar i{width:18px;height:7px;border-radius:3px;background:#ded1b4}.lv-bar i.on{background:var(--olive)}.lv-bar small{margin-left:6px;font-size:11.5px;color:var(--soft);font-weight:650}
.lv-tab{width:100%;border-collapse:collapse;font-size:13px;text-align:center;margin:2px 0 4px}.lv-tab th,.lv-tab td{padding:6px 4px;border-bottom:1px solid var(--rule)}.lv-tab thead th{font-size:11.5px;color:var(--soft);font-weight:700}.lv-tab tbody th{text-align:left;font-weight:700}
.lv-bar.wide{display:block;height:8px;border-radius:4px;background:#ded1b4;overflow:hidden;margin:0}.lv-bar.wide i{display:block;width:0;height:100%;border-radius:0;background:var(--olive)}
.btn.mini{flex:none;min-height:36px;padding:0 12px;font-size:13px}
/* Cartel en el medio (cuenta, errores, resultados) */
.center{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(14,11,7,.55);z-index:5}
.center[hidden]{display:none}
.ccard{width:min(420px,100%);background:var(--parch);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ccard h3{margin:0;font:700 22px/1.2 var(--serif)}
.ccard p{margin:0;color:#4d4031}
.ccard .ic{font-size:34px;line-height:1}
.ccard .btn{width:100%}
.ccard .avs{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:2px 0}.ccard .avs .mas{align-self:center;font-weight:700;color:#4d4031;font-size:14px;margin-left:2px}
.btn.link{background:none;border:0;box-shadow:none;color:#6b5a44;text-decoration:underline;min-height:36px}
/* Menú lateral */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(10,8,5,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#1c1813;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#2a241c;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#231e17;font-weight:650;text-decoration:none;color:var(--ink);font-size:15px}
.side .note{color:#a39276}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:rgba(30,26,20,.95);color:var(--ink);border:1px solid rgba(196,162,101,.3);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,12px);opacity:0}}
.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#cdbf9f;font-weight:650}
.loading[hidden]{display:none}
@media (orientation:landscape) and (max-height:520px){
  .panel{left:auto;right:max(8px,env(safe-area-inset-right));transform:none;width:min(360px,48vw);bottom:8px}
  .alert{top:48px}}
@media (min-width:760px){.sheet{border-radius:18px;border-bottom:1px solid var(--rule);margin-bottom:24px}.modal{align-items:center}}
@media (prefers-reduced-motion:reduce){.sheet,.side-panel,.toast{animation:none}}

/* el botón de juegos dice «Juegos» (un amigo no lo reconocía) */

<script>
/* ───────── Latido (v76): UNA sola consulta periódica a la planilla para toda la página ─────────
   Antes cada parte preguntaba por su lado (el chat cada 4 s, el buzón del juego cada 5–8 s, los amigos del menú
   cada 4 s, la lista de gente cada 25–30 s, la estancia cada 90 s). Ahora pregunta sólo esto, con la acción «latido»
   de la planilla, y reparte la respuesta a cada parte.
   Cada cuánto (los topes que pidió el usuario):
     · con una charla abierta: cada 2 s, siempre;
     · con el chat cerrado y la app a la vista: arranca en 4 s y, si no pasa nada, sube de a 1 s hasta 9 s
       (así el primer mensaje después de un rato llega en menos de 10 s, contando lo que tarda la red);
     · vuelve a 4 s apenas llega algo, al tocar la pantalla o al volver a la app (en ese caso pregunta enseguida);
     · en segundo plano: cada 30 s;
     · con una mesa armándose o conectándose: cada 3 s como mucho.
   El chat de la mesa durante la partida va directo entre los teléfonos (WebRTC): no pasa por acá.
   Si la planilla es vieja (no conoce «latido»), se apaga solo y cada parte vuelve a preguntar como antes.
   API: LATIDO.registrar(nombre, {armar(p), recibir(j), ms(), error(e)}) · LATIDO.activo() · LATIDO.ahora() · LATIDO.buzon()
        LATIDO.ultimo() → la última respuesta · LATIDO.espera(t0) → cuánto esperar entre consultas del buzón
        mientras se conecta una mesa (0,7 s los primeros 90 s; después 2 s) · evento «bloques-latido» con la respuesta. */
(function(){
'use strict';
if(window.LATIDO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const MIN=4000,MAX=9000,PASO=1000,FONDO=30000,MESA=3000;
const L={parts:{},timer:0,prox:0,ult:0,enCurso:false,otra:false,quietos:0,viejo:false,ok:false,fallas:0,j:null,jAt:0,mesaHasta:0,tocadoAt:0,limpiado:false,
  sig:{t:0,inv:'',pr:'',eg:null,pa:null,am:''},n:0};
async function call(p,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();
    if(!j||!j.ok){const e=new Error(j&&j.error||'La planilla respondió con un error.');e.planilla=true;throw e;}
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
function intervalo(){
  if(document.hidden)return FONDO;
  let ms=Math.min(MAX,MIN+L.quietos*PASO);
  if(Date.now()<L.mesaHasta)ms=Math.min(ms,MESA);
  for(const k in L.parts){try{const m=L.parts[k].ms&&L.parts[k].ms();if(m>0)ms=Math.min(ms,m);}catch(_){}}
  return ms;
}
function programar(ms){
  if(L.viejo||!acct()||!Object.keys(L.parts).length)return;
  if(ms===undefined)ms=Math.max(0,L.ult+intervalo()-Date.now());
  const cuando=Date.now()+ms;
  if(L.timer&&L.prox&&L.prox<=cuando)return;   // ya hay uno antes
  clearTimeout(L.timer);L.prox=cuando;L.timer=setTimeout(tick,ms);
}
function reprogramar(){clearTimeout(L.timer);L.timer=0;L.prox=0;programar();}
async function tick(){
  L.timer=0;L.prox=0;
  if(L.viejo)return;
  const a=acct();if(!a)return;
  if(L.enCurso){L.otra=true;return;}
  L.enCurso=true;L.ult=Date.now();
  const p={accion:'latido',usuario:a.usuario,token:a.token,q:{bz:{}}};
  for(const k in L.parts){try{L.parts[k].armar&&L.parts[k].armar(p);}catch(_){}}
  let j=null,err=null;
  try{j=await call(p);L.n++;}catch(e){err=e;}
  if(j){
    L.ok=true;L.fallas=0;L.j=j;L.jAt=Date.now();
    const nuevo=novedad(j);L.quietos=nuevo||L.n<=1?0:Math.min(L.quietos+1,20);
    for(const k in L.parts){try{const r=L.parts[k].recibir&&L.parts[k].recibir(j);if(r&&r.then)await r.catch(()=>{});}catch(_){}}
    try{window.dispatchEvent(new CustomEvent('bloques-latido',{detail:j}));}catch(_){}
    if(j.lp&&!L.limpiado){L.limpiado=true;call({accion:'limpieza',usuario:a.usuario,token:a.token},60000).catch(()=>{});}   // una vez por día, la hace el primero
  }else{
    const m=String(err&&err.message||err);
    if(/desconocida/i.test(m)){apagar();}
    else if(err&&err.planilla&&!/sesión venció/i.test(m)&&++L.fallas>=3){apagar();}   // algo anda mal con «latido»: mejor como antes
    for(const k in L.parts){try{L.parts[k].error&&L.parts[k].error(err);}catch(_){}}
  }
  L.enCurso=false;
  if(L.otra){L.otra=false;programar(0);}else programar();
}
function novedad(j){
  // Novedad = algo para vos: un mensaje, una invitación, amigos/solicitudes, tu estancia o La Gran Pampa.
  // (Que otro se conecte o cambie de juego no cuenta: con mucha gente pasaría todo el tiempo y nunca se iría más lento.)
  const S=L.sig,am=j.amigos?JSON.stringify(j.amigos):S.am;
  const ch=(Number(j.t)||0)!==S.t||String(j.inv||'')!==S.inv||(j.eg!==undefined&&j.eg!==S.eg)||(j.pa!==undefined&&j.pa!==S.pa)||am!==S.am||(j.bz&&j.bz.invitacion);
  const primera=!L.n||L.n===1;
  S.t=Number(j.t)||0;S.inv=String(j.inv||'');S.am=am;if(j.eg!==undefined)S.eg=j.eg;if(j.pa!==undefined)S.pa=j.pa;
  return ch&&!primera;
}
function apagar(){
  if(L.viejo)return;L.viejo=true;L.ok=false;clearTimeout(L.timer);
  try{window.dispatchEvent(new CustomEvent('bloques-latido-viejo'));}catch(_){}
}
function despertar(){if(L.viejo)return;L.quietos=0;programar(0);}
// Tocar la pantalla: vuelve al paso rápido (sin preguntar de más: como mucho a los 4 s de la anterior).
function tocado(){
  if(L.viejo||document.hidden)return;const t=Date.now();if(t-L.tocadoAt<1500)return;L.tocadoAt=t;
  if(L.quietos>0){L.quietos=0;clearTimeout(L.timer);L.timer=0;L.prox=0;programar(Math.max(150,L.ult+MIN-t));}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)despertar();else reprogramar();});
for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,tocado,{passive:true,capture:true});
window.addEventListener('online',despertar);
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'){L.sig={t:0,inv:'',pr:'',eg:null,pa:null,am:''};L.n=0;programar(300);}});
window.LATIDO={
  registrar(n,o){L.parts[n]=o||{};programar(L.ult?undefined:1200);},
  quitar(n){delete L.parts[n];},
  activo:()=>!L.viejo&&!!acct()&&L.ok,                 // ya respondió bien: las demás partes no preguntan por su lado
  usable:()=>!L.viejo&&!!acct(),                       // todavía no sabemos si la planilla lo conoce, pero se intenta
  get viejo(){return L.viejo;},
  ahora(){if(L.viejo)return;programar(L.enCurso?0:Math.max(0,Math.min(250,L.ult+500-Date.now())));},   // «preguntá ya» (de a una)
  despertar,
  ultimo:()=>L.j,ultimoAt:()=>L.jAt,
  // Lo del buzón que trajo el latido recién (si es de hace menos de 2,5 s): el juego lo usa en vez de preguntar otra vez.
  buzon(){return L.j&&L.j.bz&&Date.now()-L.jAt<2500?Object.assign({ok:true},L.j.bz):null;},
  espera(t0){L.mesaHasta=Date.now()+10000;return Date.now()-(t0||0)<90000?700:2000;},
  mesa(seg){L.mesaHasta=Date.now()+(seg||10)*1000;programar();},
  intervalo,
  get estado(){return {quietos:L.quietos,ms:intervalo(),n:L.n,ok:L.ok,viejo:L.viejo};}
};
})();

</script>
<script>
/* ───────── SYNCRO: tu progreso en todos los dispositivos (v63) ─────────
   Va en todas las páginas. Con la cuenta abierta, lo que cada juego guarda en este dispositivo (preferencias,
   partidas en curso contra la compu, récords, rangos, XP, logros, regalos para la estancia…) también se guarda en
   la planilla (accion=sync, hoja «Partes»), y al abrir cualquier juego —o al volver a él— se trae lo del otro
   dispositivo y se junta con lo de acá:
   · cada clave guarda cuándo cambió por última vez: gana la más nueva (una partida en curso, una preferencia);
   · las listas se unen (partidas ya contadas), los récords se quedan con lo mejor, los contadores con lo mayor;
   · «rk» (rangos, XP y logros de todos los juegos) se junta con RANGOS.importData (que también trae LOGROS).
   Los cambios se notan solos (se envuelve localStorage.setItem): se suben a los pocos segundos y al salir.
   Cuando se trae algo nuevo, avisa con el evento «bloques-sync» {detail:{claves:[…], partes:[…]}} para que cada
   juego lo muestre (p. ej. retomar la partida del otro dispositivo).
   BloqueAR (su progreso, medallas, récords y apariencia) sigue con su sincronización de siempre (src/688_cuenta.js),
   y EstanciAR con la suya (hoja EstPriv). API: window.SYNCRO = {ahora(), estado(), html(), onEstado(fn), partes}. */
(function(){
'use strict';
if(window.SYNCRO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
let ST;try{ST=window.localStorage;}catch(_){ST=null;}
const rawSet=ST?Storage.prototype.setItem:null,rawDel=ST?Storage.prototype.removeItem:null;
const ls={get(k){try{return ST.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?rawDel.call(ST,k):rawSet.call(ST,k,v);}catch(_){}},
  json(k,d){try{const v=JSON.parse(ST.getItem(k)||'null');return v??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const me=()=>{const a=acct();return a?String(a.usuario).toLowerCase():'';};
const dev=(()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;})();
const pruebas=/[?#&]sync-off\b/.test(location.href);

/* ── Qué se guarda de cada juego ──
   [clave, regla]: 'nuevo' (por defecto) · 'union' (lista) · 'min' / 'max' (objeto de números) · 'claves' (objeto: se
   suman las claves) · 'maxnum' (número) · 'recsol' (récords del solitario). «{me}» es tu usuario. */
const PARTES={
  truco:['truco-np','truco-meta','truco-dif','truco-lg-dif','truco-ayuda','truco-partida-v1','truco-eq-v1',['truco-xp-hechas','union']],
  uno:['uno-meta','uno-especial','uno-dif','uno-bots','uno-apilar','uno-ayuda','uno-mesa-n','uno-partida-v1',['uno-xp-hechas','union']],
  pool:['pool-modo','pool-dif','pool-serie','pool-meta','pool-guia','pool-reloj','pool-reloj-on','pool-n','pool-sonido','pool-vibrar','pool-zurdo','pool-soltar','pool-sens','pool-efecto-fijo','pool-ayuda','pool-tutorial-ok','pool-partida-v1',['pool-xp-hechas','union']],
  ludo:['ludo-dif','ludo-bots','ludo-color','ludo-eq','ludo-reglas','ludo-auto1','ludo-ayuda','ludo-mesa-n','ludo-partida-v1',['ludo-xp-hechas','union']],
  poblar:['poblar-dificultad','poblar-jugadores','poblar-jugadores-online','poblar-ayuda','poblar-partida-v2',['poblar-xp-hechas','union']],
  solos:['sudoku-dif','sudoku-errores','sudoku-choques','sudoku-zona','sudoku-iguales','sudoku-notasAuto','sudoku-faltan','sudoku-ayuda','sudoku-partida-v1',['sudoku-records-v1','min'],['sudoku-dias-v1','claves'],['sudoku-xp-hechas','union'],
    'solitario-robo','solitario-consol','solitario-nivel','solitario-ayuda','solitario-partida-v1','solitario-racha',['solitario-records-v1','recsol'],['solitario-dias-v1','claves'],['solitario-xp-hechas','union'],
    'buscaminas-dif','buscaminas-resaltar','buscaminas-listos','buscaminas-chord','buscaminas-mantener','buscaminas-vibrar','buscaminas-ayuda','buscaminas-partida-v1',['buscaminas-records-v1','min'],['buscaminas-dias-v1','claves'],['buscaminas-stats-v1','nuevo'],['buscaminas-xp-hechas','union']],
  laberinto:['laberinto-pref','laberinto-dif','laberinto-libre','laberinto-ayuda','laberinto-sonido','laberinto-partida-v1',['laberinto-records-v1','max'],['laberinto-campana-v1','max'],['laberinto-dias-v1','claves'],['laberinto-xp-hechas','union']],   // v73
  invasores:['invasores-ajustes','invasores-cfg','invasores-taller','invasores-tut','invasores-partida-v1',['invasores-records','max'],['invasores-dia','claves'],['invasores-xp-hechas','union']],   // v73 InvasorAR
  pampa:['pampa-resultado','pampa-visto','pampa-resumen','pampa-cruce','pampa-copas','pampa-ayuda-9'],
  gen:[['bloques-novedades','maxnum'],['bloques-chat-read-{me}','max'],['bloques-chat-borr-{me}','max'],'bloques-chat-frase','bloques-chat-modo',
    'bloques-ranked-bloquear','bloques-ranked-poblar','bloques-ranked-truco','bloques-ranked-uno','bloques-ranked-ludo','bloques-ranked-pool','bloques-ranked-invasores','bloques-ranked-estancia',
    'bloques-favoritos-v1','bloques-orden-v1']   // v67: juegos fijados y orden propio del menú de juegos
};
// v75: también el oro. Antes, el oro que ganabas sin que cambiara otra cosa de «rk» (el cofre al subir de nivel la estancia,
// la pulpería, una compra con oro) no se marcaba para subir: si cerrabas la app, el otro dispositivo nunca lo veía.
const RK_CLAVES=['bloques-rangos-v1','bloques-xpjuegos-v1','bloques-logros-v1','bloques-partidas-v1','bloques-oro-v1'];
const clavesDe=n=>(PARTES[n]||[]).map(x=>{const [k,r]=Array.isArray(x)?x:[x,'nuevo'];return [k.replace('{me}',me()),r];});
let MAPA=null,MAPA_U='';
function parteDe(k){
  if(!MAPA||MAPA_U!==me()){MAPA=new Map();MAPA_U=me();for(const x of RK_CLAVES)MAPA.set(x,'rk');MAPA.set('estancia-premios','premios');MAPA.set('pampa-act','act');
    for(const n of Object.keys(PARTES))for(const [x] of clavesDe(n))MAPA.set(x,n);}
  return MAPA.get(k)||'';
}
// JSON con las claves ordenadas, para comparar sin falsos «cambió».
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o);}

/* ── Cuándo cambió cada clave (por dispositivo) ── */
const META_K='sync-meta-v1';
// Otra cuenta en este dispositivo: se arranca de cero y lo que quedó acá de la otra cuenta no se le sube a ésta
// (lo de la cuenta nueva gana; lo que sólo está acá se queda acá hasta que se vuelva a tocar).
function metaCargar(){let M=ls.json(META_K,{});if(M.u&&M.u!==me())M={ajena:true};return M;}
let META=metaCargar();
function metaSave(){META.u=me();ls.set(META_K,JSON.stringify(META));}
function hash(s){if(s==null)return '∅';let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;}
// Mira si cambió algo desde la última vez. «t» = ahora; lo que nunca se miró en este dispositivo arranca en t=1
// (así, si la cuenta tiene algo más nuevo, gana la cuenta).
function revisar(n){const M=(META[n]=META[n]||{});let ch=false;
  for(const [k] of clavesDe(n)){const v=ls.get(k),h=hash(v),m=M[k];
    if(!m){M[k]={h,t:v==null?0:1};}else if(m.h!==h){M[k]={h,t:Date.now()};ch=true;}}
  return ch;}
function exportar(n){revisar(n);const M=META[n]||{},k={};
  for(const [x] of clavesDe(n)){const m=M[x];if(!m)continue;const v=ls.get(x);if(v==null&&!m.t)continue;k[x]=[v,m.t||0];}
  return {k};}
const J=s=>{try{return JSON.parse(s);}catch(_){return null;}};
function juntarValor(regla,a,b){   // a = lo de acá, b = lo de la cuenta (strings)
  if(a==null)return b;if(b==null)return a;
  const A=J(a),B=J(b);
  if(regla==='union'&&Array.isArray(A)&&Array.isArray(B)){const o=[...A];for(const x of B)if(!o.includes(x))o.push(x);return JSON.stringify(o.slice(-120));}
  if((regla==='min'||regla==='max')&&A&&B&&typeof A==='object'&&typeof B==='object'){const o={...A};
    for(const [x,v] of Object.entries(B))if(Number.isFinite(v)&&(!Number.isFinite(o[x])||(regla==='min'?v<o[x]:v>o[x])))o[x]=v;return JSON.stringify(o);}
  if(regla==='claves'&&A&&B&&typeof A==='object'&&typeof B==='object')return JSON.stringify({...B,...A});
  if(regla==='maxnum'){const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?String(Math.max(x,y)):a;}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u','a','l','k','s','o','m','r','v','w'],   // v73: v y w, InvasorAR
    // v70: también ajedrez, pool, ludo, los del día y los retos
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};
    for(const [dv,x] of Object.entries(d.por||{})){if(dv===dev)continue;const y=por[dv]||{};por[dv]={};for(const f of this.F)por[dv][f]=Math.max(x[f]|0,y[f]|0);}
    const s={};for(const f of this.F)s[f]=Object.entries(por).reduce((a,[dv,x])=>dv===dev?a:a+(x[f]|0),0);
    ls.set('sync-act-por',JSON.stringify({d:h,por}));ls.set('sync-act-otros',JSON.stringify({d:h,s}));
    const L={d:h};for(const f of this.F)L[f]=mio[f]+s[f];const antes=ls.get('pampa-act'),nuevo=JSON.stringify(L);
    if(antes!==nuevo){ls.set('pampa-act',nuevo);return true;}return false;}};
const ESPECIALES={rk:RK,premios:PREM,act:ACT};
const TODAS=[...Object.keys(PARTES),'rk','premios','act'];
function datosDe(n){return ESPECIALES[n]?ESPECIALES[n].exportar():exportar(n);}

/* ── Red ── */
async function call(p,ms=15000,keep=false){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow',keepalive:keep});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}

/* ── Estado (para el indicador del menú) ── */
const E={st:'',t:Number(ls.get('sync-ultimo')||0),err:'',sub:new Set()};
function setSt(st,err){E.st=st;E.err=err||'';if(st==='ok'){E.t=Date.now();ls.set('sync-ultimo',String(E.t));}for(const f of E.sub)try{f(E);}catch(_){}pintar();}
function hace(t){if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'recién':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`;}
function texto(){if(!acct())return '';if(E.st==='busy')return '☁️ Guardando en tu cuenta…';if(E.st==='off')return '☁️ Sin conexión: se guarda cuando vuelva';
  if(E.st==='err')return '☁️ No se pudo guardar en tu cuenta';return E.t?`☁️ ✓ Guardado en tu cuenta · ${hace(E.t)}`:'☁️ Se guarda en tu cuenta';}
function html(){const t=texto();return t?`<div class="sync-st" data-sync-st>${t}</div>`:'';}
function pintar(){const t=texto();document.querySelectorAll('[data-sync-st]').forEach(el=>{el.textContent=t;});}
// Si el menú del juego se abre, el renglón aparece solo debajo del rango (rk-mine) o al principio del menú.
function css(){if(document.getElementById('sync-css'))return;const s=document.createElement('style');s.id='sync-css';
  s.textContent='.sync-st{font:500 12px/1.3 system-ui,-apple-system,sans-serif;color:#93a1b6;opacity:.9;margin:-4px 0 10px;text-align:left}';(document.head||document.documentElement).appendChild(s);}
function engancharMenu(){if(!acct())return;
  const box=document.getElementById('side-panel');if(!box)return;const L=box.querySelector('.menu-list');   // sólo en el menú principal del juego
  if(!L||box.querySelector('[data-sync-st]'))return;css();
  const d=document.createElement('div');d.className='sync-st';d.dataset.syncSt='';d.textContent=texto();L.before(d);}

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){
  const a=acct();if(!a||pruebas)return;
  if(SUC.busy){SUC.again=true;return;}SUC.busy=true;clearTimeout(SUC.timer);setSt('busy');
  try{
    let traidos=[],partes=[];const ajena=!!META.ajena;
    if(bajar||SUC.primero){
      const j=await call({accion:'sync',usuario:a.usuario,token:a.token,bajar:true},15000,keep);
      SUC.pullT=Date.now();SUC.primero=false;
      if(j.version!==undefined&&!j.partes)throw new Error('vieja');
      const P=j.partes||{};
      if(ajena){for(const k of RK_CLAVES)ls.set(k,null);partes.push('rk');}   // otra cuenta: los rangos y logros de acá no se mezclan
      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}
      // lo que acá es distinto de la cuenta, se sube
      for(const n of TODAS){const r=P[n];const mio=datosDe(n);if(!mio)continue;
        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);
    SUC.dirty.clear();
    // v73: de a 10 partes por pedido (la planilla toma hasta 12 y ya hay más partes que eso)
    for(let i=0;i<subir.length;i+=10){await call({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)},15000,keep);SUC.last=Date.now();}
    setSt('ok');
    if(partes.length)try{window.dispatchEvent(new CustomEvent('bloques-sync',{detail:{claves:traidos,partes}}));}catch(_){}
  }catch(e){
    const m=String(e&&e.message||e);
    if(/sesión venció/i.test(m)){setSt('err','Tu sesión venció.');}
    else if(m==='vieja'||/Acción desconocida/.test(m)){setSt('err','La planilla todavía no tiene la versión nueva.');}
    else{setSt(navigator.onLine===false||e instanceof TypeError||e.name==='AbortError'?'off':'err',m);for(const n of TODAS)if(n)SUC.dirty.add(n);}
  }finally{SUC.busy=false;if(SUC.again){SUC.again=false;setTimeout(()=>ahora(true),300);}}
}

/* ── Notar los cambios: cada vez que un juego guarda algo de una parte, se programa la subida ── */
if(ST&&!pruebas){
  Storage.prototype.setItem=function(k,v){
    if(this===ST&&k==='estancia-premios'){   // lo que desaparece de la cola es lo que la estancia ya cobró
      try{const antes=J(ST.getItem(k))||[],ahoraL=J(String(v))||[],quedan=new Set(ahoraL.map(idP)),cob=antes.filter(x=>!quedan.has(idP(x))).map(idP);
        if(cob.length){const c=ls.json(PRC,[]);for(const x of cob)if(!c.includes(x))c.push(x);rawSet.call(ST,PRC,JSON.stringify(c.slice(-200)));}}catch(_){}}
    rawSet.call(this,k,v);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
  Storage.prototype.removeItem=function(k){rawDel.call(this,k);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
}
function arrancar(){
  if(!acct()||pruebas)return;
  setTimeout(()=>ahora(true),600);
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){if(SUC.dirty.size)ahora(true,true);}
    else if(Date.now()-SUC.pullT>15000)ahora(true);});
  window.addEventListener('pagehide',()=>{if(!SUC.dirty.size)return;const a=acct();if(!a)return;   // al cerrar: se manda lo que falta, sin esperar
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(Boolean);
    for(let i=0;i<subir.length;i+=10)try{fetch(lbUrl(),{method:'POST',body:JSON.stringify({accion:'sync',usuario:a.usuario,token:a.token,subir:subir.slice(i,i+10)}),headers:{'Content-Type':'text/plain;charset=utf-8'},keepalive:true});}catch(_){}});
  window.addEventListener('online',()=>{if(SUC.dirty.size)ahora(true);});
  // Cuando se abre un menú lateral, se muestra el renglón del guardado.
  try{const sp=()=>{const b=document.getElementById('side-panel');if(b)new MutationObserver(()=>engancharMenu()).observe(b,{childList:true});};if(document.getElementById('side-panel'))sp();else document.addEventListener('DOMContentLoaded',sp);}catch(_){}
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',arrancar);else arrancar();
// Al entrar con la cuenta (o cambiar de cuenta) en esta página, se trae todo.
window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'&&acct()){META=metaCargar();SUC.primero=true;ahora(true);}});

// Para lo que un juego guarda solo al abrir (p. ej. reparte una partida nueva porque no había ninguna):
// queda como «de antes», así una partida que venías jugando en otro dispositivo le gana.
function auto(k){const n=parteDe(k);if(!n||ESPECIALES[n])return;const M=(META[n]=META[n]||{});M[k]={h:hash(ls.get(k)),t:1};metaSave();}
window.SYNCRO={ahora,auto,html,texto,estado:()=>({...E,sub:undefined}),onEstado(f){E.sub.add(f);},partes:PARTES,
  cuenta(){META=metaCargar();SUC.primero=true;ahora(true);},_dev:dev,_canon:canon};
})();

</script>
<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────
   Para todos los juegos en línea. Cuando alguien se corta (se le fue la señal, subió al micro, cerró la app sin
   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el
   juego espera (TrucAR de a 2, el duelo de BloqueAR). Si vuelve, recupera su lugar y su mano.
   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).
   API (window.RECON):
   · GRACIA                         ms de espera (60.000).
   · recordar(juego, info) / recuerdo(juego) / olvidar(juego)   la mesa en la que estás (info: {mesa, host, seat, …}).
     recuerdo() devuelve null si pasó más de GRACIA desde el último recordar() (la partida ya no te espera).
   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta
     encontrar la invitación de vuelta de esa mesa y llama onInv(inv). Devuelve {cancelar()}.
   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa?

   v67 · SEGUNDO PLANO: salir a contestar un WhatsApp y volver.
   · Al pasar a segundo plano (visibilitychange / pagehide / freeze) se manda por TODAS las conexiones abiertas un aviso
     chiquito («\u0001fondo:1»); al volver, «\u0001fondo:0». Los juegos no lo ven: se filtra antes de que llegue a su
     onmessage. Del otro lado, mientras alguien avisó que se fue un momento, RECON.GRACIA vale RECON.GRACIA_FONDO
     (5 minutos; o 3 veces la gracia de las pruebas) en vez de la normal, y el cartel dice «salió un momento de la app».
   · El que volvió: recuerdo() acepta hasta GRACIA_FONDO desde que la página se fue a segundo plano.
   · RECON.fondo() → {yo: ms desde que me fui (0 si estoy), otro: ms desde que el otro avisó (0 si nadie)}.
   v67 · RED: mejor conexión.
   · Toda RTCPeerConnection (de cualquier juego) suma servidores STUN públicos de respaldo (Google 1 y 2, Cloudflare),
     sin repetir los que ya trae el juego.
   · RED.gathered(pc, max=6000): espera los candidatos ICE, pero termina antes si ya hay salida directa (srflx) y relé
     (relay) y no llega nada nuevo en 400 ms, o a los 2,5 s si ya hay alguno de los dos. Sin internet de verdad (sólo
     candidatos locales) espera como antes, hasta «complete» o max. */
(function(){
'use strict';
if(window.RECON)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const GRACIA_BASE=Number(ls.get('recon-gracia'))||60000;   // (las pruebas la pueden achicar)
const GRACIA_FONDO=Number(ls.get('recon-gracia'))?GRACIA_BASE*3:300000;
/* ── Segundo plano (v67) ── */
const FONDO={yoDesde:0};
const MARCA='\u0001fondo:';
const CANALES=new Set(),FUERA=new Map();
function registrar(ch){
  if(!ch||CANALES.has(ch))return;CANALES.add(ch);
  // Primer oyente del canal: lo nuestro no le llega al juego.
  // Cada conexión lleva su propio «se fue un momento» (se borra con el «volví» o a los GRACIA_FONDO).
  ch.addEventListener('message',e=>{if(typeof e.data==='string'&&e.data.startsWith(MARCA)){e.stopImmediatePropagation();if(e.data.endsWith('1'))FUERA.set(ch,Date.now());else FUERA.delete(ch);}});
  ch.addEventListener('close',()=>CANALES.delete(ch));
}
function avisarFondo(si){for(const ch of CANALES){try{if(ch.readyState==='open')ch.send(MARCA+(si?'1':'0'));}catch(_){}}}
let ocultoT=0,cerrando=false;
function alOcultar(){if(!FONDO.yoDesde){FONDO.yoDesde=Date.now();ls.set('recon-fondo',String(FONDO.yoDesde));}avisarFondo(true);}
// Al ocultarse se espera un cuarto de segundo: si en ese rato la página se cierra de verdad, no es «un momento».
function alOcultarLuego(){clearTimeout(ocultoT);ocultoT=setTimeout(()=>{if(!cerrando&&document.hidden)alOcultar();},250);}
// Cerrar la app de verdad (no es «un momento»): se avisa que no, así la mesa espera lo de siempre.
function alCerrar(e){if(e&&e.persisted){alOcultar();return;}cerrando=true;clearTimeout(ocultoT);avisarFondo(false);}
function alVolver(){const ya=FONDO.yoDesde;FONDO.yoDesde=0;if(ya)avisarFondo(false);}
try{
  document.addEventListener('visibilitychange',()=>{document.hidden?alOcultarLuego():(clearTimeout(ocultoT),alVolver());});
  window.addEventListener('pagehide',alCerrar);document.addEventListener('freeze',alOcultar);document.addEventListener('resume',alVolver);
}catch(_){}

<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los

(function(){

  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];

/* v69: MEDALLAS de La Gran Pampa, para mostrar al lado del nombre en todos los juegos.
   La planilla las manda en «usuarios» (med: {o, p, b, g, d}) y en «perfil» (perfil.pampa.med); el mapa de la Pampa
   las manda en jugadores[].med. Se guardan en el celular («bloques-medallas-v1») así cualquier juego las muestra
   sin pedir nada: MEDALLAS.de(usuario) → la mejor ('🥇', '🥈', '🥉', '🤠' Gran Estanciero, '🐎' Domador o '');
   MEDALLAS.html(usuario) → un <span class="med-pampa"> con título; MEDALLAS.lista(med o usuario) → todas con su
   cantidad (para un perfil); MEDALLAS.guardarLista(lista de usuarios) y MEDALLAS.poner(usuario, med) las guardan. */
window.MEDALLAS=(function(){
  const K='bloques-medallas-v1',ORDEN='opbgd',EM={o:'🥇',p:'🥈',b:'🥉',g:'🤠',d:'🐎'},
    NOM={o:'Ganó La Gran Pampa',p:'Segundo en La Gran Pampa',b:'Tercero en La Gran Pampa',g:'Gran Estanciero (más parajes de la semana)',d:'Domador (domó una tropilla salvaje)'};
  let M=null;
  const load=()=>{if(M)return M;try{M=JSON.parse(localStorage.getItem(K)||'{}')||{};}catch(_){M={};}return M;};
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(M||{}));}catch(_){}};
  const limpio=m=>{const o={};if(m&&typeof m==='object')for(const q of ORDEN)if(Number(m[q])>0)o[q]=Math.floor(Number(m[q]));return o;};
  function poner(u,m,guardar=true){load();const k=String(u||'').toLowerCase();if(!k)return;const o=limpio(m);if(Object.keys(o).length)M[k]=o;else delete M[k];if(guardar)save();}
  function guardarLista(L){if(!Array.isArray(L))return;load();for(const x of L)poner(x.usuario||x.n,x.med,false);save();}
  const medDe=u=>typeof u==='object'&&u?limpio(u):load()[String(u||'').toLowerCase()]||null;
  function de(u){const m=medDe(u);if(!m)return '';for(const q of ORDEN)if(m[q])return EM[q];return '';}
  function lista(u){const m=medDe(u)||{};return ORDEN.split('').filter(q=>m[q]).map(q=>({q,e:EM[q],n:m[q],t:NOM[q]}));}
  function titulo(u){return lista(u).map(x=>x.t+(x.n>1?` ×${x.n}`:'')).join(' · ');}
  function html(u){const e=de(u);return e?`<span class="med-pampa" title="${titulo(u).replace(/"/g,'&quot;')}" aria-label="${titulo(u).replace(/"/g,'&quot;')}">${e}</span>`:'';}
  return {de,lista,html,titulo,poner,guardarLista,EM,NOM};
})();
/* ───────── ORO (v70): la moneda de los juegos ─────────
   Dos monedas (pedido del 24/10): los PESOS salen de la estancia y sirven para lo común; el ORO sale de jugar cualquier juego
   y sirve para lo lindo (apariencias, ropa y caballos especiales, adornos únicos, gestos y marcos). Las mejoras grandes de
   la estancia piden las dos. En la pulpería se puede cambiar oro por pesos (1 → 8, hasta 50 de oro por día); al revés no.
   · Cuánto da cada juego: ORO_TABLA (abajo), por partida ganada contra la compu; contra personas ×2, empate ×0,6, perder con
     esfuerzo ×0,4, abandonar 0; contra la compu en Fácil ×0,5 y en Difícil ×1,5 (la misma regla que las leguas: RANGOS.cuenta). Tope del día: 150 enteros, hasta 300 a la mitad, después un cuarto.
   · Se guarda en «bloques-oro-v1» y viaja con la cuenta dentro de RANGOS.exportData() («o»). Para que dos dispositivos no se
     pisen, el saldo no se guarda: se CALCULA. Cada dispositivo anota lo suyo (d[dev] = {g ganado suelto, s gastado suelto}) y lo
     que tiene nombre va aparte: k = premios con clave (cofres de nivel, puestos de La Gran Pampa…: cuentan una sola vez aunque
     se cobren en los dos) y p = compras con clave (una apariencia, un adorno: se pagan una sola vez). Al juntar: de cada
     dispositivo lo mayor y las claves se unen. Saldo = Σ(g − s) + Σk − Σp.
   · Niveles: ORO.niveles() revisa el nivel general y el de cada juego, cobra los cofres y avisa con un cartel lo que ganaste
     (títulos, apariencias, adornos para la estancia, ropa). La primera vez (v70) marca los niveles que ya pasaste y da UN cofre
     de bienvenida (hasta 500).
   · Títulos: el que elegís se ve en tu perfil y al lado de tu nombre en el chat y en las mesas (TITULOS, más abajo). */
window.ORO=(function(){
'use strict';
const K='bloques-oro-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
const dev=()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;};
const diaAR=(t=Date.now())=>new Date(t-3*3600e3).toISOString().slice(0,10);

/* ── Cuánto da cada juego (partida ganada contra la compu, duración normal) ── */
const NIVEL_DIF=s=>({facil:1,principiante:1,normal:2,medio:2,intermedio:2,dificil:3,experto:3,maestro:3})[s]||2;
const ORO_TABLA={
  poblar:12,
  truco:i=>((i.x&&i.x.a)||15)>=30?10:6,          // a 30: 10 · a 15: 6
  ajedrez:i=>i.x&&i.x.ritmo==='bala'?4:8,         // bala: 4
  uno:6,ludo:6,
  pool:4,                                          // por mesa de Bola 8
  bloquear:(i,ex)=>Math.min(10,Math.floor(((ex&&ex.lin)||(i.x&&i.x.lin)||0)/10)),   // 1 cada 10 líneas, hasta 10
  sudoku:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  solitario:i=>i.extra&&i.extra.delDia?6:(i.extra&&i.extra.dificultad==='dificil'?3:2),
  buscaminas:i=>i.extra&&i.extra.delDia?6:NIVEL_DIF(i.extra&&i.extra.dificultad),
  laberinto:i=>i.extra&&i.extra.delDia?6:Math.min(10,4+2*Math.min(3,(i.extra&&i.extra.mapas)||0)),   // v73: 4 por participar, +2 por mapa limpio (hasta 10); el del día 6
  invasores:i=>{const x=i.x||i.extra||{};if(x.modo==='duelo')return 6;if(x.modo==='dia')return 6;return Math.min(10,2+(x.olas||0))*(x.dif==='tranquila'?.6:1);},   // v73: 2 + 1 por oleada limpia (hasta 10); duelo y del día 6
  reto:5                                           // cada reto de la semana cumplido
};
const ORO_DEF=4;   // un juego que todavía no está en la tabla
const MULT_RES={g:1,e:.6,p:.4,a:0},MULT_RIVAL={p:2,c:1,s:1};
const MULT_DIF=d=>d==='facil'?.5:(d==='dificil'||d==='maestro')?1.5:1;
const TOPE=[150,300];   // del día: hasta 150 enteros, hasta 300 a la mitad, después un cuarto
const CAMBIO={tasa:8,dia:50};
const NOM_ID={BloqueAR:'bloquear',PoblAR:'poblar',TrucAR:'truco',UnoAR:'uno',AjedrezAR:'ajedrez',PoolAR:'pool',LudAR:'ludo',SudokAR:'sudoku',SolitARio:'solitario',BuscaminAR:'buscaminas',LaberintAR:'laberinto',InvasorAR:'invasores'};
const SOLOS=new Set(['sudoku','solitario','buscaminas','laberinto']);

// «info» de cada juego, en la forma corta que usa RANGOS ({res:'g'|'e'|'p'|'a', rival:'p'|'c'|'s', esf}); también acepta la larga
// ({rival:'compu'|'personas', res:'gana'|'empata'|'pierde'|'abandona', ok, extra}). Los solitarios van como «solo».
function norm(info,de){if(!info||typeof info!=='object')return info;const o={...info};
  const R={compu:'c',personas:'p',amigos:'p',solo:'s'},S={gana:'g',empata:'e',pierde:'p',abandona:'a'};
  if(R[o.rival])o.rival=R[o.rival];if(S[o.res])o.res=S[o.res];if(o.esf===undefined&&o.ok!==undefined)o.esf=!!o.ok;
  if(!o.j&&de)o.j=NOM_ID[de]||NOM_ID[String(de).replace(/ \(reto\)$/,'')]||'';
  if(SOLOS.has(o.j))o.rival='s';
  if(o.extra&&o.extra.dificultad&&!o.dif)o.dif=o.extra.dificultad;
  return o;}
// Cuánto vale (sin el tope del día). Sin «info» (la forma vieja): como una partida ganada sin rival.
function calc(de,info,extra){
  if(/\(reto\)$/.test(String(de||'')))return ORO_TABLA.reto;
  const i=norm(info||{},de)||{},j=i.j||NOM_ID[de]||'';
  const b=ORO_TABLA[j],base=typeof b==='function'?b(i,extra):b!=null?b:ORO_DEF;
  if(!info)return Math.round(base);
  const res=i.res||'g';if(res==='a'||i.esf===false)return 0;   // sin esfuerzo (perder en 20 segundos, ganar sin jugar) no da
  // contra quién: la misma regla que las leguas (RANGOS.cuenta: personas 2, compu Difícil 1,5, Normal 1, Fácil 0,5, solo 1)
  let rv=1;try{rv=SOLOS.has(j)?1:window.RANGOS&&RANGOS.cuenta?RANGOS.cuenta(j,{rival:i.rival||'c',res,dif:i.dif}).mult||1:(MULT_RIVAL[i.rival]||1)*(i.rival==='c'?MULT_DIF(i.dif):1);}catch(_){}
  return Math.round(base*(MULT_RES[res]??1)*rv);}

/* ── Datos ── */
function load(){const o=ls.json(K,{});o.d=o.d&&typeof o.d==='object'?o.d:{};o.k=o.k&&typeof o.k==='object'?o.k:{};o.p=o.p&&typeof o.p==='object'?o.p:{};o.h=Array.isArray(o.h)?o.h:[];return o;}
function save(o){o.at=Date.now();ls.set(K,JSON.stringify(o));aviso();}
let SUB=new Set();function aviso(){for(const f of SUB)try{f(saldo());}catch(_){}try{document.querySelectorAll('[data-oro-saldo]').forEach(el=>{el.textContent=fmt(saldo());});}catch(_){}}
function saldoDe(o){let s=0;for(const x of Object.values(o.d))s+=(Number(x&&x.g)||0)-(Number(x&&x.s)||0);for(const x of Object.values(o.k))s+=Number(Array.isArray(x)?x[0]:0)||0;for(const x of Object.values(o.p))s-=Number(Array.isArray(x)?x[0]:0)||0;return Math.max(0,Math.round(s));}
function saldo(){return saldoDe(load());}
function hist(o,n,de){o.h.unshift({t:Date.now(),n:Math.round(n),de:String(de||'').slice(0,40)});if(o.h.length>25)o.h.length=25;}
function mio(o){const d=dev();return (o.d[d]=o.d[d]||{g:0,s:0});}
// Ganar oro suelto (una partida). Devuelve lo que entró.
function ganar(n,de,sinAnim){n=Math.round(Number(n)||0);if(n<=0)return 0;const o=load();mio(o).g+=n;hist(o,n,de);save(o);if(!sinAnim)anim(n);return n;}
// Un premio con nombre (cuenta una sola vez, aunque se cobre en dos dispositivos).
function cobrar(key,n,de,sinAnim){key=String(key);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.k[key])return 0;o.k[key]=[n,Date.now()];if(n)hist(o,n,de);save(o);if(n&&!sinAnim)anim(n);return n;}
function cobrado(key){return !!load().k[String(key)];}
// Comprar algo con nombre (se paga una vez). true si ya era tuyo o si alcanzó.
function tiene(id){return !!load().p[String(id)];}
function comprar(id,n,que){id=String(id);n=Math.max(0,Math.round(Number(n)||0));const o=load();if(o.p[id])return true;if(saldoDe(o)<n)return false;o.p[id]=[n,Date.now()];hist(o,-n,que||id);save(o);return true;}
// Gastar suelto (lo que se usa, como el cambio en la pulpería).
function gastar(n,que){n=Math.max(0,Math.round(Number(n)||0));const o=load();if(saldoDe(o)<n)return false;mio(o).s+=n;hist(o,-n,que);save(o);return true;}
// Pulpería: oro → pesos (1 → 8), hasta 50 de oro por día en cada dispositivo. Devuelve los pesos (0 si no se pudo).
function cambioHoy(){const o=load(),c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;return Math.max(0,CAMBIO.dia-c);}
function cambiar(n){n=Math.floor(Number(n)||0);if(n<=0||n>cambioHoy())return 0;const o=load();if(saldoDe(o)<n)return 0;
  mio(o).s+=n;const c=o.cam&&o.cam.d===diaAR()?o.cam.n|0:0;o.cam={d:diaAR(),n:c+n};hist(o,-n,'Cambio en la pulpería');save(o);return n*CAMBIO.tasa;}

/* ── Lo que da una partida (lo llama RANGOS.premio): con el tope del día ── */
function premio(de,info,extra){
  let v=calc(de,info,extra);if(v<=0)return 0;
  const o=load(),hoy=diaAR(),ya=o.dia&&o.dia.d===hoy?o.dia.n|0:0;
  v=Math.max(1,Math.round(v*(ya<TOPE[0]?1:ya<TOPE[1]?.5:.25)));
  o.dia={d:hoy,n:ya+v};mio(o).g+=v;hist(o,v,String(de||'').replace(/ \(reto\)$/,' · reto'));save(o);
  anim(v);
  try{setTimeout(()=>niveles(true),1600);}catch(_){}
  return v;}
function hoy(){const o=load();return o.dia&&o.dia.d===diaAR()?o.dia.n|0:0;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() como «o» ── */
function exportData(){const o=load();return {d:o.d,k:o.k,p:o.p,ti:o.ti||null,mc:o.mc||null,r70:o.r70||0,at:o.at||0};}
function importData(d){if(!d||typeof d!=='object')return false;const o=load();let ch=false;
  for(const [dv,x] of Object.entries(d.d||{})){if(!x||typeof x!=='object')continue;const y=o.d[dv]||{g:0,s:0},g=Math.max(Number(y.g)||0,Number(x.g)||0),s=Math.max(Number(y.s)||0,Number(x.s)||0);if(g!==(y.g||0)||s!==(y.s||0)||!o.d[dv]){o.d[dv]={g,s};ch=true;}}
  for(const M of ['k','p'])for(const [key,x] of Object.entries(d[M]||{})){if(!Array.isArray(x))continue;const y=o[M][key];
    if(!y){o[M][key]=[Number(x[0])||0,Number(x[1])||0];ch=true;}else if((Number(x[0])||0)>(Number(y[0])||0)){o[M][key]=[Number(x[0])||0,Math.min(Number(y[1])||0,Number(x[1])||0)];ch=true;}}
  if(Array.isArray(d.ti)&&(!Array.isArray(o.ti)||(Number(d.ti[2])||0)>(Number(o.ti[2])||0))){o.ti=d.ti;ch=true;}
  if(Array.isArray(d.mc)&&(!Array.isArray(o.mc)||(Number(d.mc[1])||0)>(Number(o.mc[1])||0))){o.mc=d.mc;ch=true;}
  if(d.r70&&!o.r70){o.r70=d.r70;ch=true;}
  if(ch){const at=o.at;ls.set(K,JSON.stringify({...o,at:Math.max(at||0,d.at||0)}));aviso();}
  return ch;}

@media (prefers-reduced-motion:reduce){.oro-fly,.oro-fly.off,.oro-lv,.oro-lv-c{transition:none}.oro-fly .oro-i,.oro-fly .brillo::after{animation:none}}`;
function css(){if(typeof document==='undefined'||document.getElementById('oro-css'))return;const s=document.createElement('style');s.id='oro-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
const ico=()=>{css();return '<i class="oro-i" aria-hidden="true"></i>';};
const txt=n=>{css();return `<span class="oro-chip">${ico()}+${fmt(n)} de oro</span>`;};
// Para el cartel final de cada juego: « · ◆+8 de oro · 🎁 +$ 3 para tu estancia».
function premioTxt(pr){if(!pr)return '';const p=[];if(pr.oro)p.push(txt(pr.oro));if(pr.pesos)p.push(`🎁 +$${fmt(pr.pesos)} para tu estancia`);return p.join(' · ');}
let FLY=null,FLYN=0,FLYT=0;
function anim(n){if(typeof document==='undefined'||!document.body||!(n>0))return;css();
  if(FLY&&FLY.isConnected&&!FLY.classList.contains('off')){FLYN+=n;FLY.querySelector('b').textContent='+'+fmt(FLYN);clearTimeout(FLYT);FLYT=setTimeout(fuera,2200);return;}
  FLYN=n;FLY=document.createElement('div');FLY.className='oro-fly';FLY.setAttribute('role','status');FLY.innerHTML=`<span class="brillo"></span>${ico()}<b>+${fmt(n)}</b><span style="font-weight:700;font-size:13px;opacity:.85">de oro</span>`;
  document.body.appendChild(FLY);requestAnimationFrame(()=>requestAnimationFrame(()=>FLY&&FLY.classList.add('on')));
  try{if(window.SFX_ORO)window.SFX_ORO();}catch(_){}
  FLYT=setTimeout(fuera,2200);}
function fuera(){const el=FLY;if(!el)return;el.classList.add('off');setTimeout(()=>el.remove(),520);FLY=null;}

/* ── Recompensas por nivel ── */
// Nivel general: cofre en cada nivel (20 + 5 × nivel); cada 5, un título y un adorno exclusivo para la estancia; cada 10, ropa.
const TIT_GEN={5:'Peón de campo',10:'Puestero',15:'Baqueano',20:'Rastreador',25:'Domador',30:'Payador',35:'Capataz',40:'Tropero',45:'Mayordomo',50:'Estanciero',55:'Patrón',60:'Caudillo',65:'Gaucho de ley',70:'Leyenda de la pampa'};
const ADORNO_GEN={5:['farol_bronce','Farol de bronce'],10:['banco_tallado','Banco tallado'],15:['aljibe_azulejos','Aljibe de azulejos'],20:['carreta_pintada','Carreta pintada'],25:['fuente_plata','Fuente de plata'],
  30:['ombu_otono','Ombú de otoño'],35:['estatua_bronce','Estatua de bronce'],40:['glorieta_nevada','Glorieta blanca'],45:['molino_plata','Molino de plata'],50:['calesita_oro','Calesita de oro'],55:['capilla_rosa','Capilla rosada'],60:['estatua_oro','Estatua de oro']};
const ROPA_GEN={10:['ropa:gala','Poncho de gala'],20:['som:dorado','Chambergo dorado'],30:['ropa:patrio','Poncho celeste y blanco'],40:['ropa:caudillo','Saco de caudillo'],50:['ropa:vicuna','Poncho de vicuña']};
const cofreGen=L=>20+5*L;
// Nivel de cada juego: 5/10/20/30 una apariencia exclusiva (las declara LOGROS con lv); 10 y 30, un título.
const TIT_J={bloquear:['Apilador','Gran arquitecto'],poblar:['Colono','Fundador de pueblos'],truco:['Gaucho del truco','Mano de oro del truco'],uno:['Cantor del uno','Rey de la mesa'],
  ajedrez:['Alfil del pago','Gran maestro'],ludo:['Fichero','Patrón del ludo'],pool:['Taquero','Mago del paño'],sudoku:['Numerero','Sabio de los números'],solitario:['Paciente','Maestro del solitario'],
  buscaminas:['Rastreador de minas','Desactivador'],invasores:['Defensor de la llanura','Azote de la Nodriza'],estancia:['Chacarero','Gran estanciero']};
const JNOM={bloquear:'BloqueAR',poblar:'PoblAR',truco:'TrucAR',uno:'UnoAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',invasores:'InvasorAR',estancia:'EstanciAR'};
const cofreEst=L=>L>=8?10+2*L:0;   // EstanciAR: desde el nivel 8, un cofre chico por nivel (lo cobra la estancia)
function R(){return window.RANGOS||null;}
function lvGen(){try{return R().general().level.lv;}catch(_){return 1;}}
function lvJ(j){try{return R().levelInfo(R().xp(j)).lv;}catch(_){return 1;}}
function juegos(){const r=R();return r?[...Object.keys(r.GAMES||{}),...Object.keys(r.SOLOS||{})]:[];}
// Todos los títulos que tenés: [{id, n, de}]
function titulos(){const out=[],g=lvGen();
  for(const [L,n] of Object.entries(TIT_GEN))if(g>=+L)out.push({id:'g'+L,n,de:`Nivel general ${L}`});
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);if(l>=10)out.push({id:'j:'+j+':10',n:T[0],de:`${JNOM[j]||j} nivel 10`});if(l>=30)out.push({id:'j:'+j+':30',n:T[1],de:`${JNOM[j]||j} nivel 30`});}
  const o=load(),camp=Object.keys(o.k).filter(k=>/^pm:\d{4}-\d\d-\d\d:\d+:1$/.test(k)).length;
  if(camp)out.push({id:'pm:campeon',n:'Campeón de La Gran Pampa',de:camp===1?'Ganaste una semana':`Ganaste ${camp} semanas`});
  if(Object.keys(o.k).some(k=>/^tp:\d+:1$/.test(k)))out.push({id:'pm:temporada',n:'Campeón de temporada',de:'Ganaste una temporada de La Gran Pampa'});
  return out;}
function titulo(){const o=load(),ti=Array.isArray(o.ti)?o.ti:null;if(!ti||!ti[0])return null;const t=titulos().find(x=>x.id===ti[0]);return t||null;}
function ponerTitulo(id){const o=load();const t=id?titulos().find(x=>x.id===id):null;if(id&&!t)return false;o.ti=[t?t.id:'',t?t.n:'',Date.now()];save(o);
  try{if(window.TITULOS){const a=ls.json('bloques-acct-v1',null);if(a&&a.usuario)TITULOS.poner(a.usuario,t?t.n:'');}}catch(_){}
  subirPerfil();return true;}
/* Marcos para tu foto y gestos para el chat (150 de oro cada uno) */
const MARCOS={dorado:{n:'Aro de oro',p:150},patrio:{n:'Celeste y blanco',p:150},fogon:{n:'Fogón',p:150},filete:{n:'Fileteado',p:150}};
const GESTOS_ORO=[['🧉','Un mate'],['🤠','Gaucho'],['🐎','Al galope'],['🏆','Copa'],['💃','A bailar'],['🥩','Asado']];
function marco(){const o=load(),m=Array.isArray(o.mc)?o.mc[0]:'';if(m&&MARCOS[m]&&o.p['mc:'+m]){css();return m;}return '';}
function ponerMarco(id){const o=load();if(id&&!(MARCOS[id]&&o.p['mc:'+id]))return false;o.mc=[id||'',Date.now()];save(o);subirPerfil();return true;}
function gestos(){const o=load();return GESTOS_ORO.filter(g=>o.p['ge:'+g[0]]).map(g=>g[0]);}
// El título y el marco viajan a la planilla (columna «titulo» de Usuarios) para que los demás los vean.
function subirPerfil(){const t=titulo();return subirTitulo(t?t.n:'',marco());}
async function subirTitulo(n,mc){const a=ls.json('bloques-acct-v1',null);if(!a||!a.usuario||!a.token)return;
  const url=ls.get('bloques-lb-url-v1')||(typeof LB_DEF!=='undefined'?LB_DEF:'https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec');
  try{await fetch(url,{method:'POST',body:JSON.stringify({accion:'perfil',usuario:a.usuario,token:a.token,titulo:String(n||''),marco:String(mc||'')}),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',redirect:'follow'});}catch(_){}}

// Revisa los niveles. «mostrar»: si hay algo nuevo, el cartel. Devuelve la lista de lo nuevo.
let REV=false;
function niveles(mostrar){if(REV||!R())return [];REV=true;try{
  const o=load(),g=lvGen(),nuevos=[];
  if(!o.r70){   // primera vez: lo que ya pasaste queda marcado y va UN cofre de bienvenida
    let tot=0;for(let L=2;L<=g;L++){const k='lv:'+L;if(!o.k[k]){o.k[k]=[0,Date.now()];tot+=cofreGen(L);}}
    o.r70=Date.now();const bien=Math.min(500,tot);if(bien>0&&!o.k.bienvenida){o.k.bienvenida=[bien,Date.now()];hist(o,bien,'Cofre de bienvenida');nuevos.push({e:'oro',b:`Cofre de bienvenida: +${fmt(bien)} de oro`,s:'Por los niveles que ya tenías'});}
    {const ad=[];for(const L of Object.keys(ADORNO_GEN))if(g>=+L)regalarAdorno(o,+L,ad,true);
      if(ad.length)nuevos.push({e:'🏡',b:ad.length===1?ad[0].b:`${ad.length} adornos para tu estancia`,s:(ad.length>1?ad.map(x=>x.b).join(', ')+'. ':'')+'Están en la estancia, en Tienda › Guardados'});}
    for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const L of [10,30])if(l>=L)o.k['tj:'+j+':'+L]=o.k['tj:'+j+':'+L]||[0,Date.now()];}
    const ts=titulos();if(ts.length)nuevos.push({e:'🎖️',b:ts.length===1?`Título: ${ts[0].n}`:`${ts.length} títulos para elegir`,s:'Elegí cuál se ve en tu perfil, en Mi cuenta'});
    save(o);if(mostrar&&nuevos.length)cartel(g,nuevos,true);return nuevos;}
  for(let L=2;L<=g;L++){const k='lv:'+L;if(o.k[k])continue;const n=cofreGen(L);o.k[k]=[n,Date.now()];hist(o,n,`Cofre del nivel ${L}`);
    nuevos.push({e:'oro',b:`Cofre del nivel ${L}: +${fmt(n)} de oro`});
    if(TIT_GEN[L])nuevos.push({e:'🎖️',b:`Título: ${TIT_GEN[L]}`,s:'Elegilo en Mi cuenta'});
    if(ADORNO_GEN[L])regalarAdorno(o,L,nuevos);
    if(ROPA_GEN[L])nuevos.push({e:'🧥',b:ROPA_GEN[L][1],s:'Para tu personaje: ponétela en la estancia (Personaje)'});}
  // títulos de cada juego (10 y 30)
  for(const j of juegos()){const T=TIT_J[j];if(!T)continue;const l=lvJ(j);for(const [L,n] of [[10,T[0]],[30,T[1]]]){const k='tj:'+j+':'+L;if(l>=L&&!o.k[k]){o.k[k]=[0,Date.now()];nuevos.push({e:'🎖️',b:`Título: ${n}`,s:`Por llegar al nivel ${L} en ${JNOM[j]||j}`});}}}
  if(nuevos.length){save(o);if(mostrar)cartel(g,nuevos);}
  return nuevos;}finally{REV=false;}}
// Adorno exclusivo de la estancia: va a la cola de regalos («estancia-premios»), una sola vez.
function regalarAdorno(o,L,nuevos,retro){const A=ADORNO_GEN[L];if(!A)return;const k='adn:'+L;if(o.k[k])return;o.k[k]=[0,Date.now()];
  try{const Q=ls.json('estancia-premios',[]);Q.push({de:`Nivel ${L}`,trigo:0,pesos:0,obj:[A[0]],t:Date.now()+L});ls.set('estancia-premios',JSON.stringify(Q.slice(-40)));}catch(_){}
  nuevos.push({e:'🏡',b:A[1],s:'Para tu estancia: está en Tienda › Guardados'});}
// El cartel lindo de «¡Subiste de nivel!»
const COLA_LV=[];let LV_ON=false;
function cartel(lv,items,bienvenida){if(typeof document==='undefined')return;COLA_LV.push({lv,items,bienvenida});if(!LV_ON)otroCartel();}
function otroCartel(){const c=COLA_LV.shift();if(!c){LV_ON=false;return;}if(!document.body){LV_ON=false;return;}LV_ON=true;css();
  const el=document.createElement('div');el.className='oro-lv';el.setAttribute('role','status');el.setAttribute('aria-label',c.bienvenida?'Llegó el oro':'Subiste de nivel');
  el.innerHTML=`<div class="oro-lv-c">${c.bienvenida?`<div class="oro-lv-n">${ico()}</div><h2>Llegó el oro a BloqueAR</h2><p style="margin:8px 0 0;opacity:.82;font-size:13px">Jugando cualquier juego ganás oro: sirve para apariencias, ropa y adornos únicos. Los pesos siguen siendo de la estancia.</p>`:`<h2>¡Subiste de nivel!</h2><div class="oro-lv-n">Nivel ${c.lv}</div>`}
    <ul>${c.items.map(x=>`<li>${x.e==='oro'?ico():`<i>${x.e}</i>`}<span><b>${esc(x.b)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</span></li>`).join('')}</ul><button type="button">¡Buenísimo!</button></div>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  // No tapa nada: deja pasar los toques (salvo el botón), se va con cualquier toque en la pantalla y solo a los 8 segundos.
  let ido=false;const cerrar=()=>{if(ido)return;ido=true;clearTimeout(to);document.removeEventListener('pointerdown',fuera,true);el.classList.remove('on');setTimeout(()=>{el.remove();otroCartel();},260);};
  const fuera=e=>{if(!el.contains(e.target))cerrar();},to=setTimeout(cerrar,8000);
  el.querySelector('button').onclick=cerrar;setTimeout(()=>document.addEventListener('pointerdown',fuera,true),400);}

/* ── La Gran Pampa: oro por el puesto de la semana ── */
const PAMPA_ORO=p=>p===1?300:p===2?200:p===3?120:40;
function pampaPuesto(pr){if(!pr||!pr.semana)return 0;return cobrar('pm:'+pr.semana+':'+(pr.liga||1)+':'+(pr.puesto||0),PAMPA_ORO(pr.puesto),'La Gran Pampa');}

/* ── Hoja «¿Cómo gano oro?» ── */
function hojaHtml(){css();const o=load(),h=o.h.slice(0,8),y=hoy();
  const filas=[['🏘️','PoblAR, partida ganada','12'],['🃏','TrucAR a 30 (a 15: 6)','10'],['♟️','AjedrezAR (bala: 4)','8'],['🎴','UnoAR · 🎲 LudAR','6'],['🎱','PoolAR, por mesa','4'],['🧱','BloqueAR','1 cada 10 líneas, hasta 10'],['👾','InvasorAR (duelo y del día: 6)','2 + 1 por oleada, hasta 10'],
    ['🧩','Sudoku, Solitario o Buscaminas del día','6'],['🧩','Sudoku, Solitario o Buscaminas común','1 a 3'],['🎯','Cada reto de la semana','5'],['⭐','Cada nivel general','20 + 5 × nivel'],['🗺️','La Gran Pampa: 1.º / 2.º / 3.º','300 / 200 / 120'],['🗺️','Terminar la semana de La Gran Pampa jugando','40']];
  return `<div class="oro-hoja"><p class="oro-saldo">${ico()}<b data-oro-saldo>${fmt(saldoDe(o))}</b><span>de oro</span></p>
  <p>El <b>oro</b> sale de jugar cualquier juego y sirve para lo lindo: apariencias de los juegos, ropa y caballos especiales, adornos únicos para la estancia, gestos y marcos. Los <b>pesos</b> salen de la estancia y sirven para lo de todos los días. Las mejoras grandes de la estancia piden las dos.</p>
  <h4>Cuánto da cada juego</h4><p class="note">Por partida ganada contra la compu. Contra personas, el doble. Empatar da algo y perder peleando, un poco; abandonar no da nada.</p>
  <div class="oro-tabla">${filas.map(f=>`<div><i>${f[0]}</i><span>${f[1]}</span><b>${f[2]}</b></div>`).join('')}</div>
  <p class="note">Hoy juntaste ${fmt(y)} jugando. Los primeros 150 del día van enteros; hasta 300, a la mitad; después, un cuarto.</p>
  <h4>En la pulpería</h4><p class="note">En tu estancia podés cambiar oro por pesos (1 de oro = ${CAMBIO.tasa} pesos, hasta ${CAMBIO.dia} de oro por día). Al revés no se puede.</p>
  ${h.length?`<h4>Últimos movimientos</h4><div class="oro-tabla">${h.map(x=>`<div><i>${x.n>0?'＋':'－'}</i><span>${esc(x.de||'')}</span><b>${x.n>0?'+':''}${fmt(x.n)}</b></div>`).join('')}</div>`:''}</div>`;}
const HOJA_CSS=`.oro-hoja{display:flex;flex-direction:column;gap:8px;text-align:left}.oro-hoja p{margin:0}.oro-hoja h4{margin:8px 0 0;font-size:14px}
.oro-saldo{display:flex;align-items:center;gap:8px;font-size:15px}.oro-saldo .oro-i{width:30px;height:30px}.oro-saldo b{font-size:28px;color:#f5c94c}
