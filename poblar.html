/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(op.oro)return !!(window.ORO&&ORO.tiene(op.k_));if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
let PREV=null;   // v72: {j,tipo,id} mientras se prueba una en la hoja
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';if(PREV&&PREV.j===j&&PREV.tipo===tipo&&A.op.some(x=>x.id===PREV.id))return PREV.id;const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;
  const retH=rs.length?`<section class="lg-sec"><h3>Retos de la semana</h3><p class="lg-lead">Los mismos para todos. Se renuevan el lunes: faltan ${diasHastaLunes()}.</p>
    ${rs.map(r=>`<div class="lg-reto${r.hecho?' ok':''}"><div class="lg-rt"><b>${esc(r.txt)}</b><small>${r.hecho?'✅ Cumplido':`${fmt(r.va)} de ${fmt(r.n)}`} · +${r.xp} XP${window.ORO?` y ${ORO.ico()} ${ORO.ORO_TABLA.reto} de oro`:''}</small></div><div class="lg-bar"><i style="width:${(r.va/r.n*100).toFixed(1)}%"></i></div></div>`).join('')}</section>`:'';
  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);
    return `<div class="lg-l${on?' on':''}"><i>${L.e}</i><div><b>${esc(L.n)}</b><small>${esc(L.d)}</small>${!on&&m>1?`<div class="lg-bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><small>${fmt(v)} de ${fmt(m)}</small>`:''}</div>${on?'<em>✓</em>':''}</div>`;}).join('')}</div></section>`;
  const tipos=Object.entries(G.ap);
  const apH=tipos.length?`<section class="lg-sec"><h3>Apariencias</h3><p class="lg-lead">Se destraban subiendo de nivel en ${esc(G.n)} (vas por el ${nivel(j)}), con logros o con oro${window.ORO?` (tenés ${ORO.ico()}<b data-oro-saldo>${fmt(ORO.saldo())}</b>)`:''}. Las de nivel 10, 20 y 30 no se venden.</p>
    ${tipos.map(([tipo,A])=>{const cur=apariencia(j,tipo);return `<h4>${esc(A.n)}</h4><div class="lg-aps">${A.op.map(op=>{const ok=libre(j,op,o),req=op.logro?`Logro: ${(G.logros.find(L=>L.id===op.logro)||{}).n||''}`:op.lv?`Nivel ${op.lv}`:'';
      if(op.oro&&!ok&&window.ORO)return `<button type="button" class="lg-ap oro" data-lg-compra="${tipo}|${op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · ${ORO.ico()} ${fmt(op.oro)}</small></button>`;
      return `<button type="button" class="lg-ap${cur===op.id?' on':''}" data-lg-tipo="${tipo}" data-lg-id="${op.id}" ${ok?'':'disabled'} aria-pressed="${cur===op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${cur===op.id?'Puesta':ok?'Elegir':'🔒 '+esc(req)}</small></button>`;}).join('')}</div>`;}).join('')}</section>`:'';
  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};
  const x=root.querySelector('#lg-x');if(x)x.onclick=()=>{op.cerrar?op.cerrar():(root.closest('.side')||{}).hidden=true;};
  root.querySelectorAll('[data-lg-tipo]').forEach(el=>el.onclick=()=>{if(elegir(j,el.dataset.lgTipo,el.dataset.lgId)){const top=root.scrollTop;abrir(j,op);root.scrollTop=top;}});
  // v70: comprar con oro (el primer toque pregunta; el segundo compra y la pone)
  root.querySelectorAll('[data-lg-compra]').forEach(el=>el.onclick=()=>{const [tipo,id]=el.dataset.lgCompra.split('|'),A=D[j]&&D[j].ap[tipo],ap=A&&A.op.find(x=>x.id===id);if(!ap||!window.ORO)return;
    const sm=el.querySelector('small');
    if(el.dataset.seguro!=='1'){root.querySelectorAll('[data-seguro]').forEach(x=>{delete x.dataset.seguro;x.classList.remove('preg');});el.dataset.seguro='1';el.classList.add('preg');
      if(sm)sm.innerHTML=ORO.saldo()>=ap.oro?`¿Comprar por ${ORO.ico()} ${fmt(ap.oro)}? Tocá de nuevo`:`Te faltan ${ORO.ico()} ${fmt(ap.oro-ORO.saldo())}`;return;}
    if(!ORO.comprar(ap.k_,ap.oro,`${D[j].n} · ${ap.n}`)){if(sm)sm.textContent='No te alcanza el oro';return;}
    try{if(window.SFX_ORO)SFX_ORO();}catch(_){}
    elegir(j,tipo,id);const top=root.scrollTop;(op.refrescar||(()=>{if(op.side)abrir(j,op);else{root.innerHTML=panelHtml(j);cablear(root,j,op);}}))();root.scrollTop=top;});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

/* ── v72: hoja «🎨 Apariencia» de cada juego ── */
const tieneAp=j=>j==='bloquear'?typeof window.abrirAparienciaBloquear==='function':!!(D[j]&&Object.keys(D[j].ap||{}).length);
function apBoton(j,donde){if(!tieneAp(j))return '';css();return `<div class="lg-apfin"><button type="button" class="lg-apb" data-ap-hoja="${esc(j)}">🎨 Apariencia de ${esc(j==='bloquear'?'BloqueAR':D[j].n)}</button></div>`;}
function pagina(){return document.documentElement.dataset.apJuego||PAGJ||'';}
const avisarCambio=j=>{try{dispatchEvent(new CustomEvent('lg-apariencia',{detail:{j}}));}catch(_){}};
function prevPoner(j,tipo,id){const A=D[j].ap[tipo];PREV=id?{j,tipo,id}:null;
  for(const t of Object.keys(D[j].ap)){const v=apariencia(j,t);if(v===D[j].ap[t].op[0].id)document.documentElement.removeAttribute('data-lg-'+t);else document.documentElement.setAttribute('data-lg-'+t,v);}
  avisarCambio(j);}
function reqTxt(j,op,o){const G=D[j];if(op.oro)return `${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · se compra con oro`;if(op.logro)return 'Con el logro «'+((G.logros.find(L=>L.id===op.logro)||{}).n||op.logro)+'»';if(op.lv)return `Se destraba en el nivel ${op.lv} de ${G.n} (vas por el ${nivel(j)})${op.lv>=10&&!op.oro?' · no se vende':''}`;return 'La de siempre';}
function hoja(j){
  if(j==='bloquear'){try{window.abrirAparienciaBloquear();}catch(_){}return;}
  const G=D[j];if(!tieneAp(j))return;css();aplicar(j);
  let el=document.getElementById('lg-hoja');if(el)el.remove();
  el=document.createElement('div');el.id='lg-hoja';el.className='lgh';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Apariencia de '+G.n);
  const H={sel:null};
  const pintar=()=>{const o=load(),O=window.ORO;
    const cards=Object.entries(G.ap).map(([tipo,A])=>{const cur=apariencia(j,tipo),eq=(o.ap[j]||{})[tipo]||A.op[0].id,puesta=A.op.some(x=>x.id===eq&&libre(j,x,o))?eq:A.op[0].id;
      return `<h4>${esc(A.n)}</h4><div class="lgh-row" role="listbox" aria-label="${esc(A.n)}">${A.op.map(op=>{const ok=libre(j,op,o),sel=H.sel&&H.sel.tipo===tipo&&H.sel.id===op.id,on=puesta===op.id;
        const est=on?'✓ Puesta':ok?'Tuya':op.oro&&O?`${O.ico()} ${fmt(op.oro)}`:'🔒 '+(op.logro?'Logro':op.lv?'Nivel '+op.lv:'');
        return `<button type="button" class="lgh-c${on?' on':''}${sel?' sel':''}${ok?'':' lock'}${op.oro&&!ok?' oro':''}" data-t="${tipo}" data-id="${op.id}" aria-selected="${sel||(!H.sel&&on)}"><span class="lgh-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${est}</small></button>`;}).join('')}</div>`;}).join('');
    let act='';
    if(H.sel){const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id),ok=libre(j,op,o),eq=apEquipada(j,H.sel.tipo,o);
      const tit=`<div class="lgh-sel"><span class="lgh-sw" style="background:${op.sw}"></span><span><b>${esc(op.n)}</b><small>${esc(A.n)} · ${eq===op.id?'la que tenés puesta':ok?'es tuya':esc(reqTxt(j,op,o))}</small></span></div>`;
      if(eq===op.id)act=tit+`<button type="button" class="lgh-go" disabled>✓ Puesta</button>`;
      else if(ok)act=tit+`<button type="button" class="lgh-go" data-a="poner">Ponérmela</button>`;
      else if(op.oro&&O){const sd=O.saldo();act=tit+(sd>=op.oro?`<button type="button" class="lgh-go oro" data-a="comprar">Comprar por ${O.ico()} ${fmt(op.oro)}</button>`:`<button type="button" class="lgh-go" disabled>Te faltan ${O.ico()} ${fmt(op.oro-sd)}</button>`);}
      else act=tit+`<button type="button" class="lgh-go" disabled>🔒 Todavía no</button>`;}
    else act=`<p class="lgh-tip">Tocá una para probarla en la mesa. Las de nivel 10, 20 y 30 no se venden.</p>`;
    el.innerHTML=`<div class="lgh-in"><header><b>🎨 Apariencia · ${esc(G.n)}</b>${window.ORO?`<span class="lgh-oro" title="Tu oro">${ORO.ico()} <b>${fmt(ORO.saldo())}</b></span>`:''}<button type="button" class="lgh-x" aria-label="Cerrar">✕</button></header>
      <div class="lgh-body">${cards}</div><footer class="lgh-act">${act}</footer></div>`;
    const x=el.querySelector('.lgh-x');x.onclick=cerrar;};
  const cerrar=()=>{PREV=null;el.remove();aplicar(j);avisarCambio(j);document.removeEventListener('keydown',tecla,true);};
  const tecla=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cerrar();}};
  el.addEventListener('click',e=>{
    if(e.target===el){cerrar();return;}
    const c=e.target.closest('.lgh-c');
    if(c){const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
      H.sel={tipo:c.dataset.t,id:c.dataset.id};prevPoner(j,H.sel.tipo,H.sel.id);pintar();
      el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);return;}
    const a=e.target.closest('[data-a]');if(!a||!H.sel)return;
    const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id);
    const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
    if(a.dataset.a==='comprar'){if(!window.ORO||!ORO.comprar(op.k_,op.oro,`${G.n} · ${op.n}`))return;try{if(window.SFX_ORO)SFX_ORO();}catch(_){}}
    PREV=null;elegir(j,H.sel.tipo,H.sel.id);avisarCambio(j);pintar();
    el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);
  });
  ['pointerdown','touchstart','keydown','keyup','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));
  document.addEventListener('keydown',tecla,true);
  document.body.appendChild(el);pintar();try{el.querySelector('.lgh-x').focus({preventScroll:true});}catch(_){}
}
function apEquipada(j,tipo,o){const A=D[j].ap[tipo],id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
// Cualquier botón data-ap-hoja abre la hoja; si estaba dentro del menú ☰, el menú se cierra.
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ap-hoja]');if(!b)return;e.preventDefault();e.stopPropagation();
  const j=b.dataset.apHoja||pagina();if(b.closest('#side')){try{typeof window.closeSide==='function'?window.closeSide():(document.getElementById('side').hidden=true);}catch(_){}}
  hoja(j);},true);
// Se agrega sola al menú ☰ (junto a «Logros y retos») y a «La mesa está lista» de cada juego.
function inyectar(){const j=pagina();if(!j||!tieneAp(j)||j==='bloquear')return;
  const m=document.getElementById('m-logros');
  if(m&&!m.dataset.apOk){m.dataset.apOk='1';const P=m.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.id='m-apariencia';b.dataset.apHoja=j;b.className=m.className;b.textContent='🎨 Apariencia';P.insertBefore(b,m.nextSibling);}}
  const n=document.getElementById('mv-new');
  if(n&&!n.dataset.apOk){n.dataset.apOk='1';const P=n.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.apHoja=j;b.textContent='🎨 Apariencia';P.appendChild(b);}}
}
let INY=0;
try{new MutationObserver(()=>{if(INY)return;INY=requestAnimationFrame(()=>{INY=0;try{inyectar();}catch(_){}});}).observe(document.documentElement,{childList:true,subtree:true});}catch(_){}

/* ── Para el menú de juegos y Mi cuenta ── */
function contar(){const o=load(),out={};for(const j of ORDEN){if(OCULTOS.includes(j))continue;out[j]={tiene:D[j].logros.filter(L=>tiene(o,j,L.id)).length,total:D[j].logros.length};}return out;}
function resumenHtml(){css();const C=contar(),o=load();
  return `<div class="lg-res">${Object.entries(C).map(([j,x])=>{const rs=retos(j),h=rs.filter(r=>r.hecho).length;
    return `<div class="lg-rr"><i>${D[j].e}</i><span><b>${esc(D[j].n)}</b><small>${x.tiene} de ${x.total} logros${rs.length?` · retos de la semana ${h}/${rs.length}`:''}</small></span><span class="lg-bar"><i style="width:${(x.tiene/x.total*100).toFixed(1)}%"></i></span></div>`;}).join('')}</div>`;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() ── */
function exportData(){const o=load();return {g:o.g,c:o.c,s:{w:o.s.w,c:o.s.c,h:o.s.h},ap:o.ap,at:o.at||0};}
// Une lo de la planilla con lo de acá. Devuelve {ch: cambió algo acá, falta: acá hay algo que la planilla no tiene}.
function importData(d){
  const res={ch:false,falta:false};if(!d||typeof d!=='object')return res;const o=load();
  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}
  for(const [j,C] of Object.entries(o.c))for(const [k,v] of Object.entries(C))if(v>((d.c&&d.c[j]&&d.c[j][k])||0))res.falta=true;
  const s=d.s;if(s&&s.w===o.s.w){for(const [j,C] of Object.entries(s.c||{})){if(!D[j])continue;const sc=(o.s.c[j]=o.s.c[j]||{});for(const [k,v] of Object.entries(C||{}))if(Number.isFinite(v)&&v>(sc[k]||0)){sc[k]=v;res.ch=true;}}
    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
  // Los retos que la planilla ya tenía cumplidos se marcan acá sin volver a dar el premio.
  if(res.ch)save(o);
  return res;
}
function ocultar(L){OCULTOS=Array.isArray(L)?L.slice():[];}

<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).

   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},

   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */

  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */

  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);

/* ── Datos guardados en este dispositivo ── */

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){

    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);

  else if(viejo)pie=`<span class="cx-inv-st st-vieja">Ya pasó un rato: puede que la mesa ya esté jugando.</span>`;

   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la

   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve

   · nuevo(juego, de, txt)  (v74) los chats propios (UnoAR, LudAR, InvasorAR) avisan cada mensaje que llega: si está

   El mensaje en la red: {t:'mchat', de, txt, eq}. eq=1: sólo para el equipo del que lo manda. */

   y que al abrirlo en cualquier lugar no se rompa ni quede afuera»):
   · El panel tiene alto fijo chico (clase mc-comp) y los mensajes se leen con scroll adentro. Si estás leyendo arriba,
     no te lo baja: aparece «↓ nuevos».
   · ▁ lo minimiza a una barrita que se puede llevar a cualquier lado; tocándola vuelve a abrirse ahí mismo. Con el chat
     minimizado, cada mensaje nuevo sale como globito arriba (o abajo, si no hay lugar) de la barrita.
   · Se arrastra libre por toda la pantalla. Se guarda el centro como fracción de la pantalla {cx, cy}, por juego y

<script>
'use strict';
/* ───────── PoblAR · prueba ─────────
   Juego de colonizar para 2 (vos contra la compu), con onda argentina:
   monte (madera), horno (ladrillo), estancia (lana), pampa (trigo), cerro (mineral) y el salitral.
   Ganás con 8 puntos: rancho 1, pueblo 2 y el camino más largo (5 o más) 2. Con un 7 aparece el cuatrero. */
const RES=['madera','ladrillo','lana','trigo','mineral'];
const RI={madera:{e:'🌳',n:'Madera',hex:'Monte',c:'#2f7a46'},ladrillo:{e:'🧱',n:'Ladrillo',hex:'Horno',c:'#b8613f'},lana:{e:'🐑',n:'Lana',hex:'Estancia',c:'#8fc96b'},trigo:{e:'🌾',n:'Trigo',hex:'Pampa',c:'#e0b54a'},mineral:{e:'⛰️',n:'Mineral',hex:'Cerro',c:'#8b92a3'},salitral:{e:'🧂',n:'',hex:'Salitral',c:'#e8e3d3'}};
const COST={road:{madera:1,ladrillo:1},ranch:{madera:1,ladrillo:1,lana:1,trigo:1},town:{trigo:2,mineral:3},dev:{lana:1,trigo:1,mineral:1}};
const DEV={gaucho:{e:'🐎',n:'Gaucho',d:'Mové al cuatrero y robale una carta al rival. Con 3 gauchos o más tenés la tropilla más grande (+2 puntos).'},
  obra:{e:'🛤️',n:'Obra pública',d:'Construí 2 caminos gratis.'},
  cosecha:{e:'🧺',n:'Buena cosecha',d:'Tomá 2 recursos a elección.'},
  acopio:{e:'🏚️',n:'Acopio',d:'Elegí un recurso: el rival te da todos los que tenga.'},
  procer:{e:'🏛️',n:'Prócer',d:'1 punto escondido. Se suma solo.'}};
const DIFF={facil:'Fácil',normal:'Normal',dificil:'Difícil'};
// Cuánto afina la compu: lugar inicial (entre cuántos de los mejores elige), cuántas cartas le pueden faltar para cambiar con el banco,
// entre cuántos lugares elige para el cuatrero, si compra cartas y cuántas cosas construye por turno como mucho
// (calm: chance de que ese turno se conforme con una sola).
const AI={facil:{top:10,miss:0,miss7:1,rob:-1,buy:0,cap:1,calm:1},normal:{top:5,miss:1,miss7:2,rob:3,buy:.2,cap:2,calm:.5},dificil:{top:1,miss:3,miss7:3,rob:1,buy:1,cap:99,calm:0}};
const dif=p=>(G&&p!=null&&G.p[p]&&G.p[p].dif)||(G&&G.diff)||'normal';let BOTP=null;
const ai=()=>AI[dif(BOTP)]||AI.normal;
const pickTop=k=>{if(k<=1)return 0;if(k===3){const r=Math.random();return r<.5?0:r<.8?1:2;}return Math.floor(Math.random()*k);};// k=-1: cualquiera
const LIMIT={road:15,ranch:5,town:4};
const GOAL=8;// (partidas guardadas antes de la v67: de a 2 a 8, de a 3 o 4 a 10)
const NP=()=>G?G.p.length:2,seats=()=>G.p.map((_,i)=>i),others=p=>seats().filter(q=>q!==p);
/* v67 · Reglas de la partida (viajan en G.reglas, iguales para todos en línea):
   meta  puntos para ganar: por defecto 15 de a 2 y 10 de a 3 o 4 (se elige en Partida nueva y en la mesa en línea).
   seg   cartas con las que estás a salvo del 7: de a 2, 9 (se descarta con 10 o más); de a 3 o 4, 7 (con 8 o más).
   com   cambios entre jugadores. Contra la compu de a 2 vienen apagados: en un mano a mano cualquier cambio ayuda
         al único rival, así que no se usaban; con amigos o de a 3 o 4, prendidos. El banco y los puertos, siempre.
   prop  si la compu te propone cambios en su turno (por defecto no: el cartel molestaba). */
const METAS={2:[10,12,15,18],3:[8,10,12],4:[8,10,12]},META0={2:15,3:10,4:10},SEG0={2:9,3:7,4:7};
const regla=(k)=>{const R=G&&G.reglas;if(R&&R[k]!==undefined)return R[k];const n=NP();
  if(k==='meta')return n>2?10:GOAL;if(k==='seg')return n===2?9:7;if(k==='com')return true;if(k==='prop')return false;};
const goal=()=>regla('meta'),seguro=()=>regla('seg');
// Reglas por defecto para una partida nueva de n (las elegidas se guardan por cantidad de jugadores).
function reglasDe(n,online=false){let o={};try{o=JSON.parse(localStorage.getItem('poblar-reglas-'+n+(online?'-on':''))||'{}')||{};}catch(_){}
  const metas=METAS[n]||METAS[4];return {meta:metas.includes(o.meta)?o.meta:META0[n]||10,seg:[7,8,9].includes(o.seg)?o.seg:SEG0[n]||7,
    com:typeof o.com==='boolean'?o.com:!(n===2&&!online),prop:!!o.prop};}
function guardarReglas(n,R,online=false){try{localStorage.setItem('poblar-reglas-'+n+(online?'-on':''),JSON.stringify(R));}catch(_){}}
const jugadores=(online=false)=>{try{const n=Number(localStorage.getItem(online?'poblar-jugadores-online':'poblar-jugadores'));return n>=2&&n<=4?n:2;}catch(_){return 2;}};
const BOTN=['','Compu roja','Compu naranja','Compu violeta'];// (nombres viejos: ahora cada compu tiene un nombre inventado)
// v67: la compu nunca se llama «Compu»: cada una tiene un nombre criollo (con 🤖 al lado para que se sepa que es la máquina).
const NOMBRES_BOT=['Rosendo','Eulogia','Cirilo','Doña Petrona','Anselmo','Chola','Tomasito','Ramona','Pancho','Nicanora','Baldomero','Etelvina','Crisanto','Juana Rosa','Facundo','Brígida','Indalecio','Pilar','Lucio','Clemencia'];
function nombresBot(k,usados=[]){const pool=NOMBRES_BOT.filter(n=>!usados.includes(n)),out=[];const R=()=>Math.random();
  while(out.length<k&&pool.length){out.push(pool.splice(Math.floor(R()*pool.length),1)[0]);}while(out.length<k)out.push('Paisano '+(out.length+1));return out;}
const esBotNombre=n=>/^(Compu|La compu)\b/.test(String(n||''));
// El rival que va ganando (para la compu: a quién frenar)
function lead(p){let b=null;for(const q of others(p))if(b===null||shown(q)*3+cards(q)>shown(b)*3+cards(b))b=q;return b;}// (sólo lo que se ve)
// Cuántas cartas tiene que descartar cada uno con un 7 (las partidas guardadas viejas sólo tenían discardN, el tuyo)
const dn=p=>G.disc?(G.disc[p]||0):(p===0&&G.phase==='discard'?G.discardN||0:0);
const SAVE='poblar-partida-v2';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pips=n=>n?6-Math.abs(7-n):0;
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ── Tablero: 19 hexágonos, vértices (donde van ranchos) y lados (donde van caminos) ── */
const S=60,SQ=Math.sqrt(3);
function buildBoard(seed){
  const R=rng(seed),hexes=[];
  for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++)hexes.push({q,r,x:S*SQ*(q+r/2),y:S*1.5*r});
  const kinds=shuffle([...Array(4).fill('madera'),...Array(3).fill('ladrillo'),...Array(4).fill('lana'),...Array(4).fill('trigo'),...Array(3).fill('mineral'),'salitral'],R);
  hexes.forEach((h,i)=>h.res=kinds[i]);
  const near=(a,b)=>{const dq=a.q-b.q,dr=a.r-b.r;return Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr)===2;};
  // Números: el 6 y el 8 (los que más salen) nunca juntos.
  for(let tries=0;tries<500;tries++){
    const nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12],R);let k=0;
    for(const h of hexes)h.num=h.res==='salitral'?0:nums[k++];
    const hot=hexes.filter(h=>h.num===6||h.num===8);
    if(!hot.some(a=>hot.some(b=>a!==b&&near(a,b))))break;
  }
  const verts=[],vkey=new Map(),edges=[],ekey=new Map();
  const vid=(x,y)=>{const k=Math.round(x)+','+Math.round(y);if(!vkey.has(k)){vkey.set(k,verts.length);verts.push({x,y,hexes:[],adj:[],edges:[],port:null});}return vkey.get(k);};
  hexes.forEach((h,hi)=>{
    h.v=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);h.v.push(vid(h.x+S*Math.cos(a),h.y+S*Math.sin(a)));}
    for(const v of h.v)verts[v].hexes.push(hi);
    for(let i=0;i<6;i++){const a=h.v[i],b=h.v[(i+1)%6],k=Math.min(a,b)+'-'+Math.max(a,b);
      if(!ekey.has(k)){ekey.set(k,edges.length);edges.push({a,b,hexes:[]});verts[a].adj.push(b);verts[b].adj.push(a);verts[a].edges.push(edges.length-1);verts[b].edges.push(edges.length-1);}
      edges[ekey.get(k)].hexes.push(hi);}
  });
  // Puertos: 9 sobre la costa (4 de 3:1 y uno 2:1 de cada recurso).
  const coast=edges.map((e,i)=>({i,e,ang:Math.atan2((verts[e.a].y+verts[e.b].y)/2,(verts[e.a].x+verts[e.b].x)/2)})).filter(o=>o.e.hexes.length===1).sort((a,b)=>a.ang-b.ang);
  const ptypes=shuffle(['3:1','3:1','3:1','3:1',...RES],R),ports=[];
  for(let k=0;k<9;k++){const o=coast[Math.floor(k*coast.length/9)];ports.push({edge:o.i,type:ptypes[k]});verts[o.e.a].port=ptypes[k];verts[o.e.b].port=ptypes[k];}
  return {hexes,verts,edges,ports};
}

/* ── Estado de la partida ── */
let B=null,G=null;
function newGame(seed=(Math.random()*2**32)>>>0,opt={}){
  PAMPA_CRUCE=opt.cruce||null;   // v72: una partida nueva deja el cruce de La Gran Pampa (salvo que sea el cruce)
  B=buildBoard(seed);
  const n=Math.max(2,Math.min(4,opt.n||jugadores())),first=opt.first!=null?opt.first:Math.floor(Math.random()*n),order=Array.from({length:n},(_,i)=>(first+i)%n);
  const hum=opt.humans||[];// nombres de los otros jugadores de verdad (en línea), en los asientos 1, 2…
  const bn=nombresBot(n,hum);
  const pl=i=>i===0?{name:'Vos',bot:AUTO,hand:hand0(),ranch:0,town:0,road:0,dev:[],gauchos:0}:{name:hum[i-1]||bn[i],bot:!hum[i-1],hand:hand0(),ranch:0,town:0,road:0,dev:[],gauchos:0};
  const deck=shuffle([...Array(14).fill('gaucho'),...Array(5).fill('procer'),'obra','obra','cosecha','cosecha','acopio','acopio'],Math.random);
  G={seed,v:2,deck,turnNo:0,devUsed:false,free:0,after:null,army:null,offers:0,diff:(()=>{try{return localStorage.getItem('poblar-dificultad')||'normal';}catch(_){return 'normal';}})(),owner:B.verts.map(()=>null),town:B.verts.map(()=>false),road:B.edges.map(()=>null),
    robber:B.hexes.findIndex(h=>h.res==='salitral'),
    p:order.map((_,i)=>pl(i)),
    // Armado en serpiente: 1-2-3-4 y de vuelta 4-3-2-1 (de a 2 queda como siempre: A B B A)
    longest:null,longLen:Array(n).fill(0),turn:first,first,setup:[...order,...order.slice().reverse()],setupStep:0,setupPhase:'ranch',lastRanch:null,
    phase:'setup',dice:null,winner:null,log:[],rolls:0,reglas:opt.reglas?{...opt.reglas}:reglasDe(n,!!hum.length)};
  {const ks=asignarCols(n,opt.cols||[miCol()]);G.p.forEach((x,i)=>{x.col=ks[i];});}
  addLog(`Empieza ${first===0?'vos':G.p[first].name}.`);
  if(opt.quiet)return;
  save();render();next();
}
function hand0(){return {madera:0,ladrillo:0,lana:0,trigo:0,mineral:0};}
const cards=p=>RES.reduce((s,r)=>s+G.p[p].hand[r],0);
const hidden=p=>G.p[p].dev.filter(c=>c.k==='procer').length;
const shown=p=>G.p[p].ranch+2*G.p[p].town+(G.longest===p?2:0)+(G.army===p?2:0);
const vp=p=>shown(p)+hidden(p);
const can=(p,what)=>Object.entries(COST[what]).every(([r,n])=>G.p[p].hand[r]>=n);
function pay(p,what){for(const [r,n] of Object.entries(COST[what]))G.p[p].hand[r]-=n;sanoMano('pay '+what);}
// Red de seguridad: ningún recurso queda negativo. Si pasara (un estado viejo, una carrera en línea), se corrige y se anota en la consola.
function sanoMano(donde){if(!G||!G.p)return false;let mal=false;for(const [i,pl] of G.p.entries())for(const r of RES){const v=pl&&pl.hand?pl.hand[r]:0;if(!(v>=0)){mal=true;console.warn('[PoblAR] recurso negativo corregido',{donde,jugador:i,recurso:r,valor:v});pl.hand[r]=0;}}if(mal)window.POB_NEG=(window.POB_NEG||0)+1;return mal;}
function addLog(t){G.logN=(G.logN||G.log.length)+1;G.log.push(t);if(G.log.length>120)G.log.shift();renderLog();}
/* v72: cruce de La Gran Pampa («#pampa-cruce=SEMILLA&duelo=ID»): mano a mano a 8 puntos contra la compu en Normal, el
   mismo tablero (la semilla), arrancás vos. No se guarda ni da XP, rango, oro o leguas.
   Gana: 2000 − 5 por tirada (≥ 1001); pierde: 100 por punto tuyo (≤ 700). */
let PAMPA_CRUCE=null;
function pampaFin(){const P=PAMPA_CRUCE;PAMPA_CRUCE=null;const w=G.winner===0,pts=vp(0),puntos=w?Math.max(1001,2000-5*G.rolls):Math.min(700,100*pts);
  try{localStorage.setItem('pampa-resultado',JSON.stringify({j:'poblar',seed:P.seed,duelo:P.duelo,puntos,txt:w?`Ganaste en ${G.rolls} tiradas`:`Perdiste con ${pts} puntos`,t:Date.now()}));}catch(_){}
  openModal(`<h2>${w?'🏆 ¡Ganaste el cruce!':`Ganó ${escHtml(G.p[G.winner].name)}`}</h2><p>Vos ${vp(0)} · ${escHtml(G.p[1].name)} ${vp(1)} · ${G.rolls} tiradas.</p>
    <p>Para el cruce de La Gran Pampa: <b>${puntos} puntos</b><br><small class="note">${w?'2000 − 5 por cada tirada':'100 por cada punto tuyo'}</small></p><div class="row"><a class="primary" id="pf-pampa" href="pampa.html#resultado" style="text-decoration:none;text-align:center">🗺️ VOLVER A LA GRAN PAMPA</a></div>`);}
function save(){if(PAMPA_CRUCE)return;if(ON&&ON.state==='on'){sendState();return;}if(ON)return;try{localStorage.setItem(SAVE,JSON.stringify(G));}catch(_){}}

/* ── Reglas de dónde se puede construir ── */
function freeSpot(v){return G.owner[v]===null&&B.verts[v].adj.every(a=>G.owner[a]===null);}
function touchesOwnRoad(p,v){return B.verts[v].edges.some(e=>G.road[e]===p);}
function ranchSpots(p,setup=false){
  const out=[];for(let v=0;v<B.verts.length;v++)if(freeSpot(v)&&(setup||touchesOwnRoad(p,v)))out.push(v);return out;
}
function roadSpots(p,fromVert=null){
  const out=[];
  for(let e=0;e<B.edges.length;e++){
    if(G.road[e]!==null)continue;const {a,b}=B.edges[e];
    if(fromVert!==null){if(a===fromVert||b===fromVert)out.push(e);continue;}
    const ok=v=>G.owner[v]===p||(G.owner[v]===null&&B.verts[v].edges.some(x=>x!==e&&G.road[x]===p));
    if(ok(a)||ok(b))out.push(e);
  }
  return out;
}
function townSpots(p){const out=[];for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p&&!G.town[v])out.push(v);return out;}
function rate(p,r){let best=4;for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p&&B.verts[v].port){const t=B.verts[v].port;if(t==='3:1')best=Math.min(best,3);else if(t===r)best=2;}return best;}
// Camino más largo: recorrido sin repetir caminos; un rancho del rival corta el camino.
function longestRoad(p){
  let best=0;const mine=B.edges.map((_,i)=>G.road[i]===p);
  const dfs=(v,used,len)=>{best=Math.max(best,len);if(len>0&&G.owner[v]!==null&&G.owner[v]!==p)return;
    for(const e of B.verts[v].edges)if(mine[e]&&!used.has(e)){used.add(e);const {a,b}=B.edges[e];dfs(a===v?b:a,used,len+1);used.delete(e);}};
  for(let v=0;v<B.verts.length;v++)if(B.verts[v].edges.some(e=>mine[e]))dfs(v,new Set(),0);
  return best;
}
function updateLongest(){
  const L=seats().map(longestRoad);G.longLen=L;const prev=G.longest,h=G.longest;
  // Se lo lleva quien supera al que lo tiene; si el que lo tenía quedó por debajo de 5 (le cortaron el camino), el más largo de 5 o más, si es uno solo.
  const top=c=>{if(!c.length)return null;const m=Math.max(...c.map(p=>L[p])),t=c.filter(p=>L[p]===m);return t.length===1?t[0]:undefined;};
  if(h===null||L[h]<5){const t=top(seats().filter(p=>L[p]>=5));G.longest=t===undefined?null:t;}
  else{const t=top(others(h).filter(p=>L[p]>L[h]));if(t!==null&&t!==undefined)G.longest=t;}
  if(G.longest!==prev&&G.longest!==null){addLog(`🛣️ ${W(G.longest)} ${V(G.longest,'tenés','tiene')} el camino más largo (+2).`);banner(`🛣️ Camino más largo: ${G.p[G.longest].name}`);}
}
const who=p=>p===0?'Vos':G.p[p].name;
// El otro: de a 2, el rival; de a más, el que está jugando (o el que ganó).

      aviso(q,'🏚️',`${nombreReal(p)} se llevó tus ${RI[arg].e}`,n?`jugó Acopio, eligió ${RI[arg].n.toLowerCase()} y se llevó todas las tuyas: ${n}.`:`jugó Acopio y eligió ${RI[arg].n.toLowerCase()}, pero no tenías.`,{k:'acopio',r:Array(Math.min(n,6)).fill(arg),carta:'acopio',quien:nombreReal(p),de:p});
      if(p===0&&n)for(let i=0;i<Math.min(n,6);i++)setTimeout(()=>vuela(arg,$('pl'+q),$('c-'+arg)),i*140);}
    addLog(`${W(p)} se ${V(p,'llevaste','llevó')} ${tot}${RI[arg].e} ${NP()===2?'del rival':'de los demás'}.`);}

}
function updateArmy(){
  const g=seats().map(p=>G.p[p].gauchos||0),prev=G.army;
  for(const p of seats())if(g[p]>=3&&G.army!==p&&(G.army===null?others(p).every(q=>g[p]>g[q]):g[p]>g[G.army]))G.army=p;
  if(G.army!==prev){addLog(`🐎 ${W(G.army)} ${V(G.army,'tenés','tiene')} la tropilla más grande (+2).`);banner(`🐎 Tropilla más grande: ${G.p[G.army].name}`);}
}
/* ── Cambios con el rival ── */
// Cuánto le sirve a la compu cada recurso según lo que le falta para construir.
function needValue(p){
  const h=G.p[p].hand,val={madera:1,ladrillo:1,lana:1,trigo:1,mineral:1};
  const goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');goals.push('road');if(G.deck.length)goals.push('dev');
  goals.forEach((g,gi)=>{for(const r of RES){const need=(COST[g][r]||0)-h[r];if(need>0)val[r]+=(gi===0?1.4:.6)*Math.min(2,need);}});
  for(const r of RES)if(h[r]>=4)val[r]*=.6;
  return val;
}
function botAcceptsOffer(give,want,b=1){// give: lo que le das a la compu; want: lo que pedís; b: qué compu
for(const r of RES)if(G.p[b].hand[r]<want[r])return {ok:false,why:'No tengo esas cartas.'};
  // v67: la compu sólo mira lo que se ve (tus puntos a la vista, no tus cartas escondidas).
  if(shown(0)>=goal()-2)return {ok:false,why:'Estás muy cerca de ganar, no te ayudo 😏'};
  const nIn=RES.reduce((s,r)=>s+give[r],0),nOut=RES.reduce((s,r)=>s+want[r],0);
  if(nOut>nIn+(dif(b)==='facil'?1:0))return {ok:false,why:`¿${nOut} por ${nIn}? ¡Ni loco! 😂`};
  const v=needValue(b),inV=RES.reduce((s,r)=>s+v[r]*give[r],0),outV=RES.reduce((s,r)=>s+v[r]*want[r],0);
  // De a 2 todo lo que te da te ayuda a vos, que sos su único rival: sólo acepta si le conviene claramente.
  const k=(NP()===2?{facil:1,normal:1.3,dificil:1.6}:{facil:.85,normal:1.1,dificil:1.35})[dif(b)]||1.1;
  return inV>=outV*k?{ok:true}:{ok:false,why:'Mmm, no me conviene.'};
}
// v64: el cambio se hace sólo si los dos todavía tienen esas cartas (en línea la respuesta puede llegar tarde).
const puedeCambiar=(give,want,t)=>!!(G&&G.p[0]&&G.p[t]&&RES.every(r=>G.p[0].hand[r]>=(give[r]||0)&&G.p[t].hand[r]>=(want[r]||0)));
function swapCards(give,want,t=1){if(!puedeCambiar(give,want,t)){addLog('El cambio no se hizo: alguno ya no tenía esas cartas.');render();return false;}lgEv('cambios');for(const r of RES){G.p[0].hand[r]-=give[r];G.p[t].hand[r]+=give[r];G.p[t].hand[r]-=want[r];G.p[0].hand[r]+=want[r];}
  const f=o=>RES.filter(r=>o[r]).map(r=>`${o[r]}${RI[r].e}`).join(' ');addLog(ON?`🤝 ${W(0)} cambió con ${W(t)}: dio ${f(give)} y recibió ${f(want)}.`:`🤝 Cambio con ${quien(t)}: das ${f(give)} y recibís ${f(want)}.`);save();render();}

/* ── Turno de la compu ── */
function vertValue(p,v,setup=false){
  if(!freeSpot(v))return -1;let s=0;const have=new Set();
  for(let x=0;x<B.verts.length;x++)if(G.owner[x]===p)for(const h of B.verts[x].hexes)have.add(B.hexes[h].res);
  const kinds=new Set();
  for(const h of B.verts[v].hexes){const H=B.hexes[h];if(H.res==='salitral')continue;s+=pips(H.num)*(h===G.robber?.4:1);kinds.add(H.res);}
  for(const k of kinds)if(!have.has(k))s+=setup?2.2:1.2;
  if(kinds.has('trigo')||kinds.has('mineral'))s+=.6;
  if(B.verts[v].port)s+=B.verts[v].port==='3:1'?1:(kinds.has(B.verts[v].port)?2:.5);
  return s;
}
// Camino que acerca a la mejor esquina libre (búsqueda en anchura desde la red propia).
function bestRoadToward(p){
  const start=[];for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p||(G.owner[v]===null&&B.verts[v].edges.some(e=>G.road[e]===p)))start.push(v);
  const prev=new Map(),dist=new Map(),q=[];for(const v of start){dist.set(v,0);q.push(v);}
  let best=null,bestScore=-1;
  while(q.length){const v=q.shift(),d=dist.get(v);if(d>=4)continue;
    for(const e of B.verts[v].edges){if(G.road[e]!==null)continue;const {a,b}=B.edges[e],w=a===v?b:a;if(dist.has(w)||(G.owner[w]!==null&&G.owner[w]!==p))continue;
      dist.set(w,d+1);prev.set(w,[v,e]);q.push(w);
      const val=vertValue(p,w);if(val>0){const sc=val-d*1.6;if(sc>bestScore){bestScore=sc;best=w;}}}}
  if(best===null)return null;let w=best,e=null;while(prev.has(w)){const [v,ee]=prev.get(w);e=ee;if(dist.get(v)===0)break;w=v;}
  return e;
}
// Cada jugada de la compu tiene su ficha: si mientras espera empieza otra partida (o arranca otra jugada),
// la vieja se corta en la próxima espera y no toca nada más.
let BOTTOK=0;const STOP={};
async function botTurn(){
  const g0=G,p=G.turn,o=NP()===2?1-p:lead(p),tok=++BOTTOK;BOTP=p;
  const alive=()=>G===g0&&BOTTOK===tok&&G.turn===p&&G.p[p].bot&&G.phase!=='over';
  const wait=async ms=>{await sleep(FAST?0:ms);if(!alive()){if(window.BOTDBG)console.log('STOP',G===g0,BOTTOK,tok,G.turn,p,G.p[p].bot,G.phase,new Error().stack.split('\n').slice(1,4).join('|'));throw STOP;}};
  try{await botPlay(p,o,wait,alive);}catch(e){if(e!==STOP)throw e;}
}
async function botPlay(p,o,wait,alive){
  if(G.phase==='setup'){
    await wait(500);
    if(G.setupPhase==='ranch'){const spots=ranchSpots(p,true);spots.sort((a,b)=>vertValue(p,b,true)-vertValue(p,a,true));build(p,'ranch',spots[Math.min(spots.length-1,pickTop(ai().top))]);}
    else{const opts=roadSpots(p,G.lastRanch);let best=opts[0],bs=-1;for(const e of opts){const {a,b}=B.edges[e],w=a===G.lastRanch?b:a;let sc=0;for(const x of B.verts[w].adj)sc=Math.max(sc,vertValue(p,x,true));if(sc>bs){bs=sc;best=e;}}build(p,'road',best);}
    return;
  }
  // Antes de tirar: un gaucho si el cuatrero le bloquea algo o si vas ganando.
  if(G.phase==='roll'&&dif(p)!=='facil'){const i=G.p[p].dev.findIndex(c=>c.k==='gaucho'&&playable(p,c));
    if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||(dif(p)==='dificil'&&shown(o)>=shown(p)))){await wait(500);playDev(p,i);await wait(500);}}
  if(G.phase==='robber'&&G.after==='roll'){await botRobber(p,o);await wait(500);}
  if(G.phase==='roll'){await wait(600);await roll();await wait(700);}
  if(G.phase==='discard')return;// espera que descartes; después sigue sola
  if(G.phase==='robber'){await botRobber(p,o);await wait(700);}
  if(G.phase==='over')return;
  let built=0;const cap=Math.random()<ai().calm?1:ai().cap;
  for(let guard=0;guard<12&&G.phase==='main';guard++){
    let did=false;const room=built<cap;
    if(room&&can(p,'town')&&G.p[p].town<LIMIT.town){const val=v=>B.verts[v].hexes.reduce((s,h)=>s+(B.hexes[h].res==='salitral'?0:pips(B.hexes[h].num)),0);const t=townSpots(p).sort((a,b)=>val(b)-val(a));if(t.length){build(p,'town',t[0]);did=true;built++;}}
    if(room&&!did&&can(p,'ranch')&&G.p[p].ranch<LIMIT.ranch){const s=ranchSpots(p).sort((a,b)=>vertValue(p,b)-vertValue(p,a));if(s.length){build(p,'ranch',s[0]);did=true;built++;}}
    if(room&&!did&&can(p,'road')&&G.p[p].road<LIMIT.road&&!(ranchSpots(p).length&&!can(p,'ranch')&&cards(p)>=3)){const e=bestRoadToward(p);const wantLong=G.longest!==p&&G.longLen[p]>=Math.max(...others(p).map(q=>G.longLen[q]||0))-1&&G.longLen[p]>=3;
      if(e!==null||wantLong){const e2=e!==null?e:roadSpots(p)[0];if(e2!==undefined){build(p,'road',e2);did=true;built++;}}}
    if(!did)did=botDev(p);
    if(G.phase==='robber'){await wait(500);await botRobber(p,o);did=true;}
    if(!did&&G.offers<1&&p!==0&&!G.p[0].bot&&!ON&&dif(p)!=='facil'&&regla('prop')&&regla('com')){did=await botOffer(p,alive);if(!alive())throw STOP;}
    if(!did&&room)did=botTrade(p);
    if(G.phase==='over')return;
    if(!did)break;await wait(650);
  }
  await wait(500);if(G.phase==='main')endTurn();
}
async function botRobber(p,o){
  // A todos los rivales, un poco más al que va ganando; nunca donde tiene ella.
  const L=o??lead(p),opts=[];B.hexes.forEach((h,hi)=>{if(hi===G.robber)return;let s=0;for(const v of h.v){const q=G.owner[v];if(q===null)continue;if(q===p)s-=pips(h.num)*2;else s+=(pips(h.num)*(G.town[v]?2:1)+(cards(q)?.5:0))*(q===L?1:NP()>2?.6:1);}opts.push([s,hi]);});
  opts.sort((a,b)=>b[0]-a[0]);const k=ai().rob,hit=opts.filter(x=>B.hexes[x[1]].v.some(v=>G.owner[v]!==null&&G.owner[v]!==p));
  const pick=k<0?opts[Math.floor(Math.random()*opts.length)]:k===0?(hit.length?hit[Math.floor(Math.random()*hit.length)]:opts[0]):opts[Math.min(opts.length-1,pickTop(k))];
  const vs=victimsAt(pick[1],p);moveRobber(p,pick[1],vs.length?botVictim(p,vs):undefined);
}
// Cartas: compra si le sobra para eso y juega las que le sirven.
function botDev(p){
  const D=G.p[p].dev,os=others(p);if(dif(p)==='facil')return false;
  if(!G.devUsed){
    let i=D.findIndex(c=>c.k==='obra'&&playable(p,c));if(i>=0&&roadSpots(p).length&&G.p[p].road<LIMIT.road-1){playDev(p,i);let n=0;while(G.free>0&&n++<2){const e=bestRoadToward(p)??roadSpots(p)[0];if(e===undefined||e===null)break;build(p,'road',e);}G.free=0;return true;}
    i=D.findIndex(c=>c.k==='cosecha'&&playable(p,c));if(i>=0){const v=needValue(p),pick=RES.slice().sort((a,b)=>v[b]-v[a]);if(v[pick[0]]>1.5){playDev(p,i,[pick[0],v[pick[1]]>1.5?pick[1]:pick[0]]);return true;}}
    i=D.findIndex(c=>c.k==='acopio'&&playable(p,c));if(i>=0){
      const prod=r=>{let s=0;for(let v=0;v<B.verts.length;v++)if(G.owner[v]!==null&&G.owner[v]!==p)for(const h of B.verts[v].hexes)if(B.hexes[h].res===r&&h!==G.robber)s+=pips(B.hexes[h].num)*(G.town[v]?2:1);return s;};
      // v67: elige por lo que producen los demás (se ve en el tablero), nunca mirando sus manos.
      const r=RES.slice().sort((a,b)=>prod(b)-prod(a))[0],ncart=os.reduce((s,q)=>s+cards(q),0);
      if(ncart>=(dif(p)==='dificil'?5:4)){playDev(p,i,r);return true;}}
    i=D.findIndex(c=>c.k==='gaucho'&&playable(p,c));if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||(dif(p)==='dificil'&&G.p[p].gauchos>=2&&G.army!==p))){playDev(p,i);return true;}
  }
  const nothingElse=!(can(p,'ranch')&&ranchSpots(p).length)&&!(can(p,'town')&&townSpots(p).length);
  if(can(p,'dev')&&G.deck.length&&nothingElse&&Math.random()<ai().buy)return buyDev(p);
  return false;
}
// Te ofrece un cambio 1 por 1 si le falta una sola carta para algo.
async function botOffer(p,alive=()=>true){
  const h=G.p[p].hand,o=0,goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(miss!==1)continue;
    const want=need[0];if(!cards(o))continue;// (no mira tu mano: sólo si tenés alguna carta)
    const spare=RES.filter(r=>r!==want&&h[r]-(COST[g][r]||0)>=1).sort((a,b)=>h[b]-h[a]);if(!spare.length)continue;
    G.offers++;const give=spare[0];
    const yes=await askOffer(give,want,G.p[p].name,g,p);
    if(!alive())return false;
    if(yes){let gv=hand0(),wv=hand0();if(yes===true){gv[want]=1;wv[give]=1;}else{gv=yes.hg;wv=yes.hw;}return swapCards(gv,wv,p)!==false;}
    addLog(`No aceptaste el cambio de ${quien(p)}.`);return false;}
  return false;
}
// Cambia con el banco si le falta una sola carta para construir algo.
function botTrade(p){
  const h=G.p[p].hand,goals=[];
  if(G.p[p].town<LIMIT.town&&townSpots(p).length)goals.push('town');
  if(G.p[p].ranch<LIMIT.ranch&&ranchSpots(p).length)goals.push('ranch');
  goals.push('road');
  // Le falta poco (1 o 2 cartas) para algo: cambia lo que le sobra. Con muchas cartas (riesgo del cuatrero) es más decidida.
  const maxMiss=cards(p)>7?ai().miss7:ai().miss;
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(!miss||miss>maxMiss)continue;
    const want=need[0];const spare=RES.filter(r=>!need.includes(r)&&h[r]-(COST[g][r]||0)>=rate(p,r)).sort((a,b)=>(h[b]-rate(p,b))-(h[a]-rate(p,a)));
    if(spare.length){trade(p,spare[0],want);return true;}}
  return false;
}

/* ── Turno tuyo: qué se puede tocar ── */
let mode=null;// 'road' | 'ranch' | 'town' | 'robber' | null
function next(){
  if(!G||G.phase==='over')return;
  if(G.phase==='discard'&&isAuth()){const b=others(0).filter(q=>G.p[q].bot&&dn(q));if(b.length){for(const q of b){const k=dn(q);discard(q,k);delete G.disc[q];addLog(`${G.p[q].name} descartó ${k} cartas.`);}if(!Object.keys(G.disc).length){G.phase='robber';G.discardN=0;}save();}}
  // Con un 7, cada uno elige lo suyo: si te toca, se abre tu descarte (aunque no sea tu turno).
  if(G.phase==='discard'&&dn(0)&&!G.p[0].bot&&DSENT!==discKey()&&!($('dc')&&!$('modal').hidden))openDiscard();
  if(G.turn!==0&&!G.p[G.turn].bot){mode=null;render();return;}// turno de otro jugador de verdad: llega por la conexión
  if(G.p[G.turn].bot){mode=null;render();if(!ON||ON.role==='host')botTurn();return;}// las compus las juega este aparato (o, en línea, el que armó la partida)
  if(G.phase==='setup')mode=G.setupPhase==='ranch'?'ranch':'road';
  else if(G.phase==='robber')mode='robber';else mode=null;
  render();
}
function targets(){
  const p=0;if(G.turn!==0||G.phase==='over')return {v:[],e:[],h:[]};
  if(G.phase==='setup')return G.setupPhase==='ranch'?{v:ranchSpots(p,true),e:[],h:[]}:{v:[],e:roadSpots(p,G.lastRanch),h:[]};
  if(G.phase==='robber')return {v:[],e:[],h:B.hexes.map((_,i)=>i).filter(i=>i!==G.robber)};
  if(mode==='road')return {v:[],e:roadSpots(p),h:[]};
  if(mode==='ranch')return {v:ranchSpots(p),e:[],h:[]};
  if(mode==='town')return {v:townSpots(p),e:[],h:[]};
  return {v:[],e:[],h:[]};

let TAPN=0;
function onBoardTap(kind,i){

  if(G.phase==='robber'&&kind==='h'){const vs=victimsAt(i,0);if(vs.length>1){pickVictim(i,vs);return;}moveRobber(0,i);mode=G.free>0?'road':null;render();return;}

/* ── Dibujo del tablero ──
   Cada terreno tiene su color y su dibujo (arbolitos, ladrillos, ovejas, surcos, cerros, grietas de sal),
   así se distinguen aunque se vean chiquitos. Lo que no cambia (mar, isla, terrenos, números y puertos)
   se arma una sola vez por tablero; en cada jugada sólo se redibujan las piezas. */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
// v64: cada jugador tiene SU color toda la partida, el mismo en todos los celulares (viaja en G.p[i].col).
const COLS={celeste:{n:'Celeste',c:'#4fc3f7',d:'#0d5f86',t:'#04263a'},rojo:{n:'Rojo',c:'#e5383b',d:'#7d1216',t:'#fff'},naranja:{n:'Naranja',c:'#f39c34',d:'#8a4a08',t:'#3a1d00'},
  violeta:{n:'Violeta',c:'#a06ae0',d:'#4b2580',t:'#fff'},blanco:{n:'Blanco',c:'#eef0f3',d:'#5b6474',t:'#1b2230'},rosa:{n:'Rosa',c:'#ff6fae',d:'#8a1f52',t:'#3a0a20'}};
const COLK=Object.keys(COLS),COLFEM={celeste:'celeste',rojo:'roja',naranja:'naranja',violeta:'violeta',blanco:'blanca',rosa:'rosa'};
const miCol=()=>{try{const c=localStorage.getItem('poblar-color');return COLS[c]?c:'celeste';}catch(_){return 'celeste';}};
// Reparte colores sin repetir: cada uno el que pidió si está libre (en orden de asiento), si no el primero libre.
function asignarCols(n,quiero){const out=[],us=new Set();
  for(let i=0;i<n;i++){const q=quiero&&quiero[i];if(q&&COLS[q]&&!us.has(q)){out[i]=q;us.add(q);}}
  for(let i=0;i<n;i++)if(!out[i]){const k=COLK.find(k=>!us.has(k));out[i]=k;us.add(k);}return out;}
// Partidas guardadas o mandadas por un PoblAR anterior (sin colores): se los pone una vez.
function fixCols(g){if(!g||!g.p||g.p.every(x=>x&&COLS[x.col]))return;const ks=asignarCols(g.p.length,g.p.map((x,i)=>x.col||(i===0?miCol():null)));g.p.forEach((x,i)=>{x.col=ks[i];});}
const CK=p=>G&&G.p[p]&&COLS[G.p[p].col]?G.p[p].col:COLK[p]||'celeste';

function botContra(give,want,b){

  const mas=(o)=>{const out=[];for(const r of RES.slice().sort((x,y)=>v[y]-v[x])){if(o.want[r])continue;if(ntot(o.give)+1<=tot0){const g={...o.give};g[r]=(g[r]||0)+1;out.push({give:g,want:{...o.want}});}}return out;};

function askOffer(give,want,from='La compu',goal='',b=null){
  if(G.p[0].bot)return Promise.resolve(false);
  // Se dice para qué lo quiere: así sabés si la estás ayudando a sumar un punto.
  const para=goal==='town'?'Con eso arma un pueblo (+1 punto).':goal==='ranch'?'Con eso arma un rancho (+1 punto).':'';
  const bot=b!=null?b:seats().find(q=>q!==0&&G.p[q].name===from);
  return new Promise(res=>{
    let ronda=0;
    const base=()=>{openModal(`<h2>🤝 ${escHtml(from)} te propone</h2><p style="font-size:18px">Te da <b>1 ${RI[give].e} ${RI[give].n}</b> y te pide <b>1 ${RI[want].e} ${RI[want].n}</b>.</p>${para?`<p><b>${para}</b></p>`:''}<p class="note">Tenés ${G.p[0].hand[want]} ${RI[want].e}.</p>
      <div class="row"><button class="pill" id="ao-no">No, gracias</button>${bot!=null?'<button class="pill" id="ao-con">Contraofertar</button>':''}<button class="primary" id="ao-yes">ACEPTAR</button></div>`);
      $('ao-no').onclick=()=>{closeModal();res(false);};$('ao-yes').onclick=()=>{closeModal();res(true);};
      if($('ao-con'))$('ao-con').onclick=()=>{const hg=hand0(),hw=hand0();hg[want]=Math.min(1,G.p[0].hand[want]);hw[give]=1;editar(hg,hw,'');};};
    // Tu contraoferta: hg lo que das, hw lo que pedís. La compu la evalúa y puede volver a contraofertar.
    const editar=(hg,hw,msg)=>{const h=G.p[0].hand,hb=G.p[bot].hand;
      const row=(o,lm,id)=>`<div class="cnt" id="${id}">${RES.map(r=>`<div><span class="e">${RI[r].e}</span><span class="n">${o[r]}</span><span class="pm"><button data-r="${r}" data-d="-1" ${o[r]?'':'disabled'}>−</button><button data-r="${r}" data-d="1" ${o[r]<lm(r)?'':'disabled'}>+</button></span></div>`).join('')}</div>`;
      openModal(`<h2>↩️ Contraoferta para ${escHtml(from)}</h2><p class="note">Hasta ${NEG_MAXR} contraofertas. ${escHtml(from)} tiene ${cards(bot)} cartas.</p>
        <b>Das</b>${row(hg,r=>h[r],'ct-give')}<b style="display:block;margin-top:10px">Pedís</b>${row(hw,r=>4,'ct-want')}
        ${msg?`<p><b>${msg}</b></p>`:''}
        <div class="row"><button class="pill" id="ct-x">Dejar</button><button class="primary" id="ct-ok" ${ntot(hg)&&ntot(hw)&&ronda<NEG_MAXR?'':'disabled'}>MANDAR</button></div>`);
      const pm=(o,id)=>{$(id).onclick=e=>{const b2=e.target.closest('button[data-r]');if(!b2||b2.disabled)return;const r=b2.dataset.r;o[r]=Math.max(0,o[r]+Number(b2.dataset.d));if(o===hg)hw[r]=0;else hg[r]=0;editar(hg,hw,'');};};
      pm(hg,'ct-give');pm(hw,'ct-want');
      $('ct-x').onclick=()=>{closeModal();res(false);};
      $('ct-ok').onclick=()=>{ronda++;addLog(`↩️ ${W(0)} ${V(0,'le contraofreciste','le contraofreció')} a ${quien(bot)}: ${fcart(hg)} por ${fcart(hw)}.`);
        const R=botAcceptsOffer(hg,hw,bot);
        if(R.ok){closeModal();res({hg:{...hg},hw:{...hw}});return;}
        const c=ronda<NEG_MAXR?botContra(hg,hw,bot):null;
        if(!c){editar(hg,hw,`🤖 «${escHtml(R.why)}»`);return;}
        addLog(`↩️ ${G.p[bot].name} le contraofreció a ${W(0)}: ${fcart(c.want)} por ${fcart(c.give)}.`);
        openModal(`<h2>↩️ ${escHtml(from)} te contraofrece</h2><p>🤖 «${escHtml(R.why)}»</p><p style="font-size:18px">Te da <b>${fcart(c.want)}</b> y te pide <b>${fcart(c.give)}</b>.</p>
          <div class="row"><button class="pill" id="ac-no">No</button>${ronda<NEG_MAXR?'<button class="pill" id="ac-con">Contraofertar</button>':''}<button class="primary" id="ac-yes" ${RES.every(r=>h[r]>=c.give[r])?'':'disabled'}>ACEPTAR</button></div>`);
        $('ac-no').onclick=()=>{closeModal();res(false);};$('ac-yes').onclick=()=>{closeModal();res({hg:c.give,hw:c.want});};
        if($('ac-con'))$('ac-con').onclick=()=>editar({...c.give},{...c.want},'');};};
    // v67: primero un aviso chico abajo del tablero (no tapa nada); «Ver» abre el detalle con la contraoferta.
    const bar=$('propbar');
    if(!bar){base();return;}
    let hecho=false;const fin=v=>{if(hecho)return;hecho=true;clearTimeout(tt);bar.hidden=true;bar.innerHTML='';res(v);};
    bar.innerHTML=`<span class="ic">🤝</span><span class="tx"><b>${escHtml(from)}</b> te propone ${RI[give].e} por tu ${RI[want].e}</span><button class="pb-no">No</button><button class="pb-ver">Ver</button><button class="pb-si" ${G.p[0].hand[want]>=1?'':'disabled'}>Sí</button>`;
    bar.hidden=false;
    bar.querySelector('.pb-no').onclick=()=>{nota('🤝','Le dijiste que no.');fin(false);};
    bar.querySelector('.pb-si').onclick=()=>fin(true);
    bar.querySelector('.pb-ver').onclick=()=>{if(hecho)return;hecho=true;clearTimeout(tt);bar.hidden=true;bar.innerHTML='';base();};
    const tt=setTimeout(()=>fin(false),25000);
  });
}

  if(G.phase==='over')return 'La partida terminó.';
  if(G.turn!==0)return `Esperá tu turno: ahora juega ${G.p[G.turn].name}.`;
  if(G.phase==='setup')return 'Ahora tocá un lugar marcado en el tablero.';
  if(G.phase==='roll')return 'Primero tirá los dados.';
  if(G.phase==='robber')return 'Primero mové al cuatrero.';
  if(G.phase==='discard')return 'Esperando el descarte del 7.';

}

/* ── Sonidos ──

  o.start(t);o.stop(t+dur+.02);o.onended=done(o,g);}

  const t=a.currentTime+delay,src=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();src.buffer=NOISE;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;src.connect(f).connect(g).connect(bus());

function mallet(f,delay=0,vol=.08,dec=.5){const a=actx(),t=a.currentTime+delay,o=a.createOscillator(),o2=a.createOscillator(),g=a.createGain(),g2=a.createGain();
  o.frequency.value=f;o2.frequency.value=f*3.95;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(vol*.32,t+.003);g2.gain.exponentialRampToValueAtTime(.0001,t+.07);
  o.connect(g).connect(bus());o2.connect(g2).connect(bus());o.start(t);o2.start(t);o.stop(t+dec+.03);o2.stop(t+.1);o.onended=done(o,g);o2.onended=done(o2,g2);}
function knock(delay=0,vol=.3,f=850){noise(.04,vol,delay,f,1.6);tone(f/5,f/8,.06,'sine',vol*.45,delay);}          // golpecito de madera
function clack(delay,vol){noise(.016,vol,delay,2700+Math.random()*1500,1.4);noise(.028,vol*.45,delay,850+Math.random()*350);}  // dado contra la mesa
const N={C4:261.6,E4:329.6,G4:392,A4:440,C5:523.3,D5:587.3,E5:659.3,G5:784,A5:880,C6:1046.5,G2:98};
const SFX={
  // Dos dados de madera que ruedan, rebotan y quedan quietos.
  dice(){[0,.04].forEach((o,k)=>{let t=o,gap=.085+k*.012,v=.24;for(let i=0;i<4;i++){clack(t,v);t+=gap;gap*=.72;v*=.64;}});tone(150,110,.06,'sine',.045,.3);},
  gain(){mallet(N.E5,0,.07,.35);mallet(N.A5,.075,.06,.45);},
  lose1(){mallet(N.E4,0,.085,.32);},
  road(){knock(0,.42,820);mallet(N.C4,.02,.035,.25);},
  ranch(){knock(0,.28,840);knock(.1,.26,780);mallet(N.G4,.2,.05,.45);},
  town(){knock(0,.28,820);knock(.1,.26,780);mallet(N.C5,.2,.055,.5);mallet(N.G5,.29,.05,.6);},
  robber(){mallet(N.G2*2,0,.13,.55);noise(.14,.12,0,180,.8);},
  steal(){mallet(N.A4,0,.05,.22);mallet(N.E4,.07,.05,.3);},
  card(){noise(.05,.3,0,5200,.9);noise(.045,.18,.05,3800,.9);},
  play(){mallet(N.D5,0,.06,.35);mallet(N.G5,.08,.055,.45);},
  trade(){knock(0,.22,1250);knock(.09,.2,1050);},
  turn(){mallet(N.E5,0,.05,.4);mallet(N.A5,.11,.045,.55);},
  win(){[N.C5,N.E5,N.G5,N.C6].forEach((f,i)=>mallet(f,i*.11,.07,.7));},

// Sonidos según lo que cambió desde la última vez que se dibujó (así suenan también las jugadas del amigo en línea).
let SNAP=null;
function snapOf(){const sm=f=>seats().reduce((s,p)=>s+f(G.p[p]),0);return {seed:G.seed,rolls:G.rolls,robber:G.robber,road:[sm(x=>x.road),0],ranch:[sm(x=>x.ranch),0],town:[sm(x=>x.town),0],
  dev:[sm(x=>x.dev.length),0],hand:{...G.p[0].hand},turn:G.turn,phase:G.phase,winner:G.winner,dice:G.dice?G.dice[0]+G.dice[1]:0};}
function soundDiff(){
  const n=snapOf(),o=SNAP;SNAP=n;if(!o||o.seed!==n.seed)return;
  const q=[];
  if(n.rolls>o.rolls)q.push('dice');
  let up=0,down=0;for(const r of RES){const d=n.hand[r]-o.hand[r];if(d>0)up+=d;else down-=d;}
  if(n.robber!==o.robber)q.push('robber');
  if(n.town[0]+n.town[1]>o.town[0]+o.town[1])q.push('town');
  else if(n.ranch[0]+n.ranch[1]>o.ranch[0]+o.ranch[1])q.push('ranch');
  else if(n.road[0]+n.road[1]>o.road[0]+o.road[1])q.push('road');
  if(n.dev[0]+n.dev[1]>o.dev[0]+o.dev[1])q.push('card');else if(n.dev[0]+n.dev[1]<o.dev[0]+o.dev[1])q.push('play');
  if(up&&down&&!q.length)q.push('trade');else if(up&&!q.includes('town')&&!q.includes('ranch')&&!q.includes('road'))q.push(n.robber!==o.robber?'steal':'gain');else if(down&&n.robber!==o.robber)q.push('lose1');
  if(n.phase==='over'&&o.phase!=='over')q.push(n.winner===0?'win':'lose');
  else if(n.turn===0&&o.turn!==0&&n.phase==='roll')q.push('turn');
  q.slice(0,2).forEach((k,i)=>setTimeout(()=>sound(k),k==='gain'?650+i*60:i*140));
}

async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}

// La misma partida vista desde el asiento k (k lugares más adelante): el que estaba en k pasa a ser el 0.
function rot(g,k){

async function seguirPartida(id){

/* ── Mesa de 3 o 4 en línea (en estrella) ──

   Los lugares sin amigo los juega la compu en su celular. Cada jugada sale del celular de quien juega, pasa por el que armó

  if($('ms-ll')){const M0=ON;M0.llId=M0.llId||Math.random().toString(36).slice(2,10);$('ms-ll').onclick=()=>MESA_CHAT.llamar({j:'poblar',mesa:M0.llId,t:`PoblAR de a ${M0.n} · ¿quién se prende?`,d:`Gana el primero en llegar a ${reglasDe(M0.n,true).meta}. Los lugares que queden los juega la compu.`,
    vivo:()=>!!(ON===M0&&ON.multi&&ON.state==='lobby'),libres:()=>M0.n-1-M0.peers.filter(vivo).length,
    ya:nm=>M0.peers.some(x=>vivo(x)&&x.usuario.toLowerCase()===String(nm).toLowerCase()),invitar:u=>invitePeer(u)});}

// Cancela la invitación a una persona de la mesa (o la saca si ya estaba sentada).
function mesaQuitar(x){const M=ON;if(!M||!M.multi)return;const a=acct();
  if(a&&x.id&&x.state==='waiting')lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:x.id}).catch(()=>{});
  if(x.state==='on')chSend(x.ch,{t:'bye'});x.state='lost';try{x.pc&&x.pc.close();}catch(_){}
  M.peers=M.peers.filter(y=>y!==x);mesaDraw();mesaTell();}
function mesaWait(){if(!ON||!ON.mesa||ON.multi)return;const L=ON.lobby,host=ON.peer.usuario,n=ON.n||(L&&L.n)||3;
  openModal(`<h2>👥 Mesa de ${n}</h2><p>Estás en la mesa de <b>${escHtml(host)}</b>. Arranca cuando toque EMPEZAR; los lugares que queden los juega la compu.</p>
    ${L?`<ul class="ulist mesa">${L.names.map((u,i)=>`<li>${L.cols&&COLS[L.cols[i]]?`<i class="cdot" style="--cc:${COLS[L.cols[i]].c}" title="${COLS[L.cols[i]].n}"></i>`:''}<span class="nm">${escHtml(u)}</span><small>✅</small></li>`).join('')}</ul>`:''}
    <b class="colh">Tu color</b>${(()=>{const yo=L&&L.names?L.names.findIndex(u=>u&&u.toLowerCase()===me().usuario.toLowerCase()):-1,act=yo>=0&&L.cols?L.cols[yo]:miCol();return colPick('mw-col',act,L&&L.cols?L.cols.filter((_,i)=>i!==yo):[]);})()}
    <p class="note">Si dos piden el mismo, se lo queda el primero de la mesa.</p>
    ${L&&L.reglas?`<div class="rg-sum"><span>📜 A ${L.reglas.meta} puntos · con el 7 descartan los de ${L.reglas.seg+1}+ · cambios ${L.reglas.com?'sí':'no'}</span></div>`:''}
    <div class="row">${window.MESA_CHAT?'<button class="pill" id="mw-chat">💭 Chatear con la mesa</button>':''}<button class="pill" id="mw-x">Salir de la mesa</button></div>`);
  if($('mw-chat'))$('mw-chat').onclick=()=>{try{MESA_CHAT.abrir();}catch(_){}};
  $('mw-col').onclick=e=>{const b=e.target.closest('button[data-col]');if(!b||b.disabled)return;colSet(b.dataset.col);netSend({t:'col',c:b.dataset.col});if(ON&&ON.lobby&&ON.lobby.cols){const yo=ON.lobby.names.findIndex(u=>u&&u.toLowerCase()===me().usuario.toLowerCase());if(yo>=0)ON.lobby.cols[yo]=b.dataset.col;}mesaWait();};
  $('mw-x').onclick=()=>{netLeave();closeModal();if(!G)openNew(true,'online');};}
async function invitePeer(u){
  const a=acct();if(!a||!ON||!ON.multi||ON.state!=='lobby')return;if(ON.peers.some(x=>vivo(x)&&x.usuario.toLowerCase()===u.usuario.toLowerCase())){mesaDraw();return;}
  const M=ON,x={usuario:u.usuario,avatar:u.avatar,color:u.color,state:'preparing',msg:'Preparando la invitación…',seat:null};M.peers=M.peers.filter(y=>y.usuario.toLowerCase()!==u.usuario.toLowerCase());M.peers.push(x);mesaDraw();
  const fail=t=>{if(x.state==='on')return;if(x.id&&x.state==='waiting')lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:x.id}).catch(()=>{});x.state='fail';x.msg=t;try{x.pc&&x.pc.close();}catch(_){}if(ON===M)mesaDraw();};
  try{
    const pc=new RTCPeerConnection({iceServers:await iceServers()});x.pc=pc;const ch=pc.createDataChannel('poblar',{ordered:true});x.ch=ch;
    ch.onopen=()=>{if(ON!==M){try{pc.close();}catch(_){}return;}x.state='on';x.msg='';chSend(ch,{t:'hola',yo:me(),v:4,n:M.n});banner(`🔗 ${x.usuario} se sumó`);sound('turn');mesaDraw();mesaTell();};
    ch.onclose=()=>peerLost(x);ch.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(ON===M)onMsg(m,x);};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))peerLost(x);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(ON!==M||x.state!=='preparing')return;
    const j=await lbCall({accion:'invitar',usuario:a.usuario,token:a.token,para:u.usuario,oferta:'POBLAR:'+JSON.stringify({sdp:pc.localDescription.sdp,n:M.n})});
    if(ON!==M||x.state!=='preparing')return;x.id=j.id;x.state='waiting';x.msg='Esperando que acepte…';mesaDraw();
    const t0=Date.now();
    while(ON===M&&x.state==='waiting'&&Date.now()-t0<7200000){   // v15: vale mientras la mesa espere (hasta 2 h)
      await sleep(window.LATIDO?LATIDO.espera(t0):2000);if(ON!==M||x.state!=='waiting')return;   // v76
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:x.id});}catch(_){continue;}
      if(ON!==M||x.state!=='waiting')return;
      if(r.estado==='aceptada'&&r.respuesta){x.state='connecting';x.msg='Conectando…';mesaDraw();await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});

      if(r.estado==='rechazada'){fail('Dijo «ahora no».');return;}
      if(r.estado==='cancelada'){fail('Cancelaste la invitación.');return;}
      if(r.estado==='vencida'){fail('La invitación venció.');return;}
    }
    if(ON===M&&x.state==='waiting')fail('No respondió.');
  }catch(e){fail(e.message||'No se pudo preparar la conexión.');}
}
function peerLost(x,why='se desconectó'){
  if(!ON||!ON.multi||!ON.peers.includes(x)||['lost','fail','vieja','ausente'].includes(x.state))return;const was=x.state==='on'&&x.inGame;
  // v63: en medio de la partida, si se cortó (no se fue), se le guarda el lugar un rato y la compu juega por él.
  if(was&&ON.state==='on'&&G&&G.phase!=='over'&&!x.salio&&window.RECON&&G.p[x.seat]&&!G.p[x.seat].bot){
    const M=ON,q=x.seat,hasta=Date.now()+RECON.GRACIA;x.state='ausente';x.msg='Se cortó';try{x.pc.close();}catch(_){}
    G.p[q].bot=true;addLog(`⚠️ ${x.usuario} se cortó: juega la compu por ${x.usuario} hasta que vuelva.`);netSend({t:'corte',nom:x.usuario,ms:RECON.GRACIA});
    if(UIQ.pending&&UIQ.pending.t===q){UIQ.pending.res(false);UIQ.pending=null;}
    RECON.cartel('pob-'+q,`${x.usuario} se cortó · esperándolo…`,hasta,()=>mesaNoVolvio(M,x));
    save();render();next();mesaVuelta(M,x,hasta);renderOnline();return;}
  x.state='lost';x.msg='Se desconectó';try{x.pc.close();}catch(_){}
  if(ON.state==='lobby'){mesaDraw();mesaTell();return;}
  if(G&&was&&G.phase!=='over'&&G.p[x.seat]&&!G.p[x.seat].bot){const q=x.seat;G.p[q].bot=true;G.p[q].name=x.usuario+' 🤖';
    addLog(`⚠️ ${x.usuario} ${why}. Sigue la compu en su lugar.`);banner(`⚠️ ${x.usuario} se fue: sigue la compu`);
    if(UIQ.pending&&UIQ.pending.t===q){UIQ.pending.res(false);UIQ.pending=null;}
    if(!ON.peers.some(y=>y.state==='on')){ON=null;renderOnline();save();render();next();return;}// ya no queda nadie: sigue con las compus
    save();render();next();return;}
  if(!ON.peers.some(y=>y.state==='on')){ON=null;}renderOnline();
}
async function mesaVuelta(M,x,hasta){
  const sigue=()=>ON===M&&M.peers.includes(x)&&x.state==='ausente';
  try{const pc=new RTCPeerConnection({iceServers:await iceServers()}),ch=pc.createDataChannel('poblar',{ordered:true});let rv=null;
    const nx={usuario:x.usuario,avatar:x.avatar,color:x.color,state:'connecting',seat:x.seat,inGame:true,cap:true,pc,ch};
    ch.onopen=()=>{if(!sigue()||!G){try{pc.close();}catch(_){}return;}
      nx.state='on';M.peers=M.peers.map(y=>y===x?nx:y);RECON.quitar('pob-'+x.seat);if(rv)rv.cancelar();
      chSend(ch,{t:'hola',yo:me(),v:4,n:M.n});chSend(ch,{t:'start',seat:nx.seat,n:M.n,names:M.names});
      G.p[nx.seat].bot=false;G.p[nx.seat].name=nx.usuario;addLog(`🔗 ${nx.usuario} volvió a la partida.`);netSend({t:'volvio',nom:nx.usuario});banner(`🔗 ${nx.usuario} volvió`);sound('turn');
      save();sendState();render();renderOnline();next();};
    ch.onclose=()=>peerLost(nx);ch.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}if(ON===M)onMsg(m,nx);};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))peerLost(nx);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(!sigue()){pc.close();return;}
    rv=RECON.reinvitar({prefijo:'POBLAR:',para:x.usuario,oferta:{sdp:pc.localDescription.sdp,n:M.n,mesa:M.mesaId},hasta,vivo:sigue,onRespuesta:sdp=>{if(sigue())pc.setRemoteDescription({type:'answer',sdp}).catch(()=>{});}});
    x.rv=rv;
  }catch(e){console.warn('vuelta',e);}
}
function mesaNoVolvio(M,x){if(ON!==M||!M.peers.includes(x)||x.state!=='ausente')return;try{x.rv&&x.rv.cancelar();}catch(_){}x.state='lost';

function mesaStart(){

<script>
/* Experimento de interfaz: sólo conecta accesos directos a funciones ya existentes. */
(function(){
  'use strict';
  const el=id=>document.getElementById(id);
  let raf=0;
  const refresh=()=>{
    if(typeof G==='undefined'||!G||!G.p||!G.p[0])return;
    el('app').classList.toggle('phase-robber',G.phase==='robber');
    el('hand-total').textContent=cards(0);
    const strip=el('dev-shortcuts');
    const my=G.p[0].dev||[];
    const eligible=G.turn===0&&G.phase==='main'&&can(0,'dev')&&G.deck.length>0;
    const html=my.map((c,i)=>`<button type="button" data-dev-i="${i}" ${playable(0,c)?'':'disabled'} title="${DEV[c.k].n}${playable(0,c)?' · Jugar ahora':' · No disponible en este turno'}" aria-label="${DEV[c.k].n}">${DEV[c.k].e}</button>`).join('');
    const buy=`<button type="button" class="buy-card" data-direct-buy ${eligible?'':'disabled'} title="Comprar carta de desarrollo · 🐑🌾⛰️" aria-label="Comprar carta de desarrollo">＋ 🃏</button>`;
    const result=(my.length?'':'<span class="dev-empty">Desarrollo</span>')+html+buy;
    if(strip.innerHTML!==result)strip.innerHTML=result;
  };
  const schedule=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;refresh();});};
  new MutationObserver(schedule).observe(el('hand'),{childList:true,subtree:true,characterData:true});
  el('hud-log').addEventListener('click',()=>{el('log').classList.toggle('open');el('hud-log').classList.toggle('on',el('log').classList.contains('open'));try{renderLog();render();}catch(_){}});
  el('hud-bonuses').addEventListener('click',()=>{
    const b=el('bonos');
    openModal(`<h2>🏅 Bonificaciones y meta</h2><p>El camino más largo y la tropilla más grande suman 2 puntos cada uno.</p><div class="bonos" style="display:grid!important;grid-template-columns:1fr;gap:8px;margin:14px 0">${b.innerHTML}</div><div class="row"><button class="pill" id="bonus-close">Volver al tablero</button></div>`);
    el('bonus-close').onclick=closeModal;
  });
  el('dev-shortcuts').addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled||!G)return;
    if(b.hasAttribute('data-direct-buy')){
      if(G.turn===0&&G.phase==='main'&&can(0,'dev')&&G.deck.length)confirmarCarta();   // v74: con confirmación
      return;
    }
    if(!b.hasAttribute('data-dev-i'))return;
    const i=Number(b.dataset.devI),c=G.p[0].dev[i];
    if(!c||!playable(0,c))return;
    if(c.k==='cosecha')pickRes(2,'🧺 Buena cosecha: elegí 2 recursos',rs=>playDev(0,i,rs));
    else if(c.k==='acopio')pickRes(1,NP()>2?'🏚️ Acopio: ¿qué recurso les sacás a todos?':'🏚️ Acopio: ¿qué recurso le sacás al rival?',rs=>playDev(0,i,rs[0]));
    else{playDev(0,i);next();}
    schedule();
  });
  // La antigua opción «Lo que pasó» de menú sigue mostrando el registro completo.
  // Se conserva el SVG original, sus modos de selección y el zoom/pellizco.
  requestAnimationFrame(()=>{refresh();try{fitBoard();}catch(_){} });
  window.addEventListener('resize',()=>{schedule();requestAnimationFrame(()=>{try{fitBoard();}catch(_){}});});
})();
</script>

<script>
(function(){
 'use strict';
 const get=id=>document.getElementById(id);
 const scene=document.querySelector('.table-surface');
 const activity=get('desktop-activity-content');
 const panel=get('panel');
 const score=get('score');
 const relato=get('relato');
 const log=get('log');
 function arrange(){
   const desktop=window.innerWidth>=840&&window.innerHeight>=570;
   if(desktop){
     // El marcador conserva los mismos IDs y funciones: sólo cambia de lugar.
     if(score.parentElement!==panel)panel.insertBefore(score,panel.querySelector('.hand-head'));
     if(relato.parentElement!==activity)activity.prepend(relato);
     if(log.parentElement!==activity)activity.append(log);
     log.classList.add('open');try{renderLog();}catch(_){}
   }else if(window.innerWidth>window.innerHeight&&window.innerHeight<570&&window.innerWidth>=600){
     // celular acostado: el marcador va arriba del panel de la derecha y el tablero usa todo el alto
     if(score.parentElement!==panel)panel.insertBefore(score,panel.querySelector('.hand-head'));
     if(relato.parentElement!==get('stline'))get('stline').insertBefore(relato,get('propbar'));
     if(log.parentElement!==scene)scene.append(log);
     log.classList.remove('open');get('hud-log').classList.remove('on');
   }else{
     if(score.parentElement!==scene)scene.insertBefore(score,scene.querySelector('.scene-rail'));
      if(relato.parentElement!==get('stline'))get('stline').insertBefore(relato,get('propbar'));
     if(log.parentElement!==scene)scene.append(log);
     log.classList.remove('open');get('hud-log').classList.remove('on');
   }
   try{requestAnimationFrame(()=>fitBoard())}catch(_){}
 }
 arrange();
 window.addEventListener('resize',arrange);
 const costNames=[['road','🛤️','Camino','Extiende tus rutas'],['ranch','🏠','Rancho','1 punto; produce 1 carta'],['town','🏘️','Pueblo','2 puntos; mejora un rancho y produce 2'],['dev','🃏','Desarrollo','Cartas especiales y puntos ocultos']];
 function openCosts(){
   let h;try{h=G?.p?.[0]?.hand||{};}catch(_){h={};}
   const html=costNames.map(([id,art,note,sub])=>{
     const missing=Object.entries(COST[id]).some(([r,n])=>(h[r]||0)<n);
     const req=Object.entries(COST[id]).map(([r,n])=>`<span class="costs-token ${(h[r]||0)<n?'missing':''}" title="${RI[r].n}">${n}${RI[r].e}</span>`).join('');
     return `<div class="costs-row ${missing?'':'available'}"><span class="costs-art">${art}</span><span class="costs-name"><b>${note}</b><small>${sub}</small></span><span class="costs-req">${req}</span></div>`;
   }).join('');
   openModal(`<h2>📖 Guía de costos</h2><p class="costs-intro">Los recursos necesarios para cada construcción. Las filas resaltadas indican que ya tenés los recursos, aunque también necesitás un lugar válido y estar en tu turno.</p><div class="costs-list">${html}</div><p class="costs-hint"><b>⚖️ Intercambios:</b> 4 iguales por 1; con puerto, 3:1 o 2:1 del recurso indicado.<br><b>⭐ Bonificaciones:</b> Camino más largo (+2, desde 5 tramos) y tropilla más grande (+2, desde 3 gauchos).</p><div class="row"><button type="button" class="pill" id="v2-full-help">Reglas completas</button><button type="button" class="primary" id="v2-costs-close">Volver a jugar</button></div>`);
   get('v2-costs-close').onclick=closeModal;
   get('v2-full-help').onclick=openHelp;
 }
 get('hud-costs').addEventListener('click',openCosts);
 get('activity-costs').addEventListener('click',openCosts);
 // El encuadre inicial SIEMPRE muestra la isla entera. El zoom manual sigue disponible.
 // Una partida nueva vuelve a encuadrar el tablero; un simple render no toca el zoom elegido.
 let lastSeed=null;
 const originalFit=fitBoard;
 fitBoard=function(){
   originalFit();
   if(!G)return;
   if(G.seed!==lastSeed){lastSeed=G.seed;zReset();}
 };
 try{fitBoard();}catch(e){console.warn('encuadre inicial',e);}
 // Nota: futuras expansiones deberían registrarse como reglas y configuración, no como CSS condicional.
})();
</script>
