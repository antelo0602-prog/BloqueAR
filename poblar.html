/* ── Sonidos ──
   Sencillos y bajitos: golpecitos de madera, dados de verdad y notas suaves de marimba.
   Todo pasa por un mismo canal con un poquito de sala y un compresor, así suenan parejos y sin chasquidos. */
let AC=null,BUS=null;
let SND_ON=(()=>{try{return localStorage.getItem('poblar-sonido')!=='0';}catch(_){return true;}})();

  const inp=a.createGain(),lp=a.createBiquadFilter(),comp=a.createDynamicsCompressor(),out=a.createGain(),d=a.createDelay(.3),fb=a.createGain(),wet=a.createGain(),dl=a.createBiquadFilter();

  const M=ON&&ON.multi?ON:null;
  const draw=()=>{const list=(UIQ.users||[]).filter(u=>u.usuario.toLowerCase()!==a.usuario.toLowerCase()&&!(M&&M.peers.some(x=>vivo(x)&&x.usuario.toLowerCase()===u.usuario.toLowerCase())));
    openModal(`<h2>👥 ${M?`Mesa de ${M.n}: invitar`:'Jugar con un amigo'}</h2><p class="note">Elegí a quién invitar. El punto verde es que tiene BloqueAR o PoblAR abierto.</p>
      ${UIQ.err?`<p>${escHtml(UIQ.err)}</p>`:''}${UIQ.users?`<ul class="ulist">${list.map(u=>`<li>${avHtml(u.avatar,u.color)}<span class="nm">${escHtml(u.usuario)}${u.enLinea?'<i class="dot"></i>':''}</span><button data-u="${escHtml(u.usuario)}">Invitar</button></li>`).join('')||'<li>Todavía no hay otras cuentas.</li>'}</ul>`:(UIQ.err?'':'<p><span class="busy"></span>Cargando…</p>')}
      <div class="row"><button class="pill" id="fl-x">Cerrar</button></div>`);
    $('fl-x').onclick=()=>{if(M&&ON===M){if(M.peers.length)mesaDraw();else mesaCancel(false);return;}closeModal();if(!G)openNew(true,'online');};document.querySelectorAll('.ulist button[data-u]').forEach(b=>b.onclick=()=>{const u=list.find(x=>x.usuario===b.dataset.u);if(!u)return;if(M&&ON===M)invitePeer(u);else inviteFriend(u);});};
  draw();
  try{const j=await lbCall({accion:'usuarios'},false);if(!Array.isArray(j.usuarios))throw new Error('Hay que actualizar el código de la planilla (versión 4).');UIQ.users=j.usuarios;UIQ.err='';}catch(e){UIQ.err=e.message;}
  if((!ON||ON===M&&M&&M.state==='lobby')&&!$('modal').hidden&&/Elegí a quién invitar/.test($('sheet').textContent))draw();
}
// Buzón: te avisa si alguien te invita (a PoblAR o a BloqueAR).
let pollAt=0,polling=false;
async function pollInbox(force=false){
  const a=acct();if(!a||polling||document.hidden||ON)return;
  const gap=G&&G.turn===0&&G.phase!=='over'?20000:8000;if(!force&&Date.now()-pollAt<gap)return;
  polling=true;pollAt=Date.now();
  let ver;try{ver=sessionStorage.getItem('poblar-accept')||undefined;}catch(_){}   // la que tocaste en el chat (puede haber varias)
  try{const j=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,ver});const inv=j.invitacion;
    const rc=window.RECON&&RECON.recuerdo('poblar');   // v63: la de volver a la partida se acepta sola
    if(inv&&rc&&!UIQ.dismissed.has(inv.id)&&!ON&&RECON.esVuelta(inv,'POBLAR:',rc.mesa)){polling=false;acceptInvite(inv,{seat:rc.seat,n:rc.n,names:rc.names,mesa:rc.mesaFlag,started:true,cap:true});return;}
    if(inv&&!UIQ.dismissed.has(inv.id)&&!ON){
      const pob=String(inv.oferta||'').startsWith('POBLAR:'),tru=String(inv.oferta||'').startsWith('TRUCO:')?true:String(inv.oferta||'').startsWith('UNO:')?'uno':String(inv.oferta||'').startsWith('AJEDREZ:')?'ajedrez':false;
      let want='';try{want=sessionStorage.getItem('poblar-accept')||'';}catch(_){}
      if(pob&&want===inv.id){try{sessionStorage.removeItem('poblar-accept');}catch(_){}acceptInvite(inv);}
      else showInvite(inv,pob,tru);
    }}catch(_){}
  polling=false;
}
function showInvite(inv,pob,tru=false){
  UIQ.dismissed.add(inv.id);
  openModal(`<h2>🤝 Te invitan</h2><div style="display:flex;align-items:center;gap:12px;margin:10px 0">${avHtml(inv.avatar,inv.color)}<div><b style="font-size:18px">${escHtml(inv.de)}</b><div class="note">te invita a jugar ${pob?'<b>PoblAR</b> 🏘️':tru==='uno'?'<b>UnoAR</b> 🎴':tru==='ajedrez'?'<b>AjedrezAR</b> ♟️':tru?'<b>TrucAR</b> 🃏':'<b>BloqueAR</b> 🧱'}</div></div></div>
    <div class="row"><button class="pill" id="iv-no">Ahora no</button><button class="primary" id="iv-yes">ACEPTAR</button></div>`);
  $('iv-no').onclick=()=>{closeModal();const a=acct();if(a)lbCall({accion:'rechazar',usuario:a.usuario,token:a.token,id:inv.id}).catch(()=>{});};
  $('iv-yes').onclick=()=>{closeModal();if(pob)acceptInvite(inv);else if(tru==='uno'){try{sessionStorage.setItem('uno-accept',inv.id);}catch(_){}location.href='uno.html';}else if(tru==='ajedrez'){try{sessionStorage.setItem('ajedrez-accept',inv.id);}catch(_){}location.href='ajedrez.html';}else if(tru){try{sessionStorage.setItem('truco-accept',inv.id);}catch(_){}location.href='truco.html';}else{try{sessionStorage.setItem('blq-accept',inv.id);}catch(_){}location.href='./';}};
}
if(!/[#&]auto/.test(location.hash)){
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);});
  setTimeout(()=>pollInbox(true),1500);
  // Venís de aceptar en otro juego: reintentar seguido unos segundos (la planilla a veces tarda).
  {let want='';try{want=sessionStorage.getItem('poblar-accept')||'';}catch(_){}
   if(want){let n=0;const t=setInterval(()=>{let w='';try{w=sessionStorage.getItem('poblar-accept')||'';}catch(_){}
     if(ON||!w){clearInterval(t);return;}
     if(++n>12){clearInterval(t);try{sessionStorage.removeItem('poblar-accept');}catch(_){}openModal(`<h2>No encontramos la invitación</h2><p>Puede que tu amigo ya no esté esperando o que la haya cancelado. Pedile que te invite de nuevo, o invitalo vos.</p><div class="row"><button class="pill" id="ia-x">Cerrar</button><button class="primary" id="ia-inv">INVITAR</button></div>`);$('ia-x').onclick=closeModal;$('ia-inv').onclick=()=>{closeModal();$('btn-friend').click();};return;}
     pollInbox(true);},2500);}}
}
window.addEventListener('pagehide',()=>{if(ON&&(ON.state==='on'||ON.multi))netSend({t:'bye',corte:1});});   // se cerró la app: puede volver (v63)

/* ── Inicio: seguir la partida guardada o empezar ── */
let FAST=false,AUTO=false;
(function start(){
  if(/[#&]rapido/.test(location.hash))FAST=true;// (pruebas: compus sin esperas)
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas; &jug=3 o 4 para más jugadores).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;newGame(Number((location.hash.match(/semilla=(\d+)/)||[])[1])||undefined,{n:Number((location.hash.match(/jug=(\d)/)||[])[1])||2});return;}
  try{localStorage.setItem('bloques-ultimo-juego','poblar');localStorage.setItem('bloques-hub-v1','1');}catch(_){}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE)||'null');}catch(_){}
  if(saved&&saved.v===2&&saved.phase!=='over'){G=saved;B=buildBoard(G.seed);render();renderLog();next();if(G.phase==='discard'&&G.turn!==0||G.phase==='discard')openDiscard();}
  else{G=null;openNew(true);}
  if(/^#amigos/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}setTimeout(openFriends,200);}
})();
// v63: si se cortó (o cerraste la app) en medio de una partida en línea, se vuelve sola a la misma mesa.
if(!/[#&]auto/.test(location.hash)&&window.RECON&&acct()&&RECON.recuerdo('poblar')){const rc=RECON.recuerdo('poblar'),hasta=(rc.t||Date.now())+RECON.GRACIA;
  const prev={seat:rc.seat,n:rc.n,names:rc.names,mesa:rc.mesaFlag,started:true,cap:true};
  openModal(`<h2>📡 Volviendo a la partida</h2><p>Estabas jugando con <b>${escHtml(rc.host)}</b>. Volviendo a conectar…</p><div class="row"><button class="pill" id="vr-x">No, gracias</button></div>`);
  const no=()=>{RECON.olvidar('poblar');RECON.quitar('pob-c');closeModal();if(!G)openNew(true);};$('vr-x').onclick=()=>{busca.cancelar();no();};
  RECON.cartel('pob-c',`Volviendo a la partida de ${rc.host}…`,hasta,()=>{if(!ON)no();});
  var busca=RECON.buscarVuelta({prefijo:'POBLAR:',mesa:rc.mesa,de:rc.host,hasta,vivo:()=>!ON,onInv:inv=>{UIQ.dismissed.add(inv.id);acceptInvite(inv,prev);}});}
// v63: si al abrir llega de tu cuenta una partida más nueva (la venías jugando en otro dispositivo), se retoma.
window.addEventListener('bloques-sync',e=>{const k=(e.detail&&e.detail.claves)||[];if(AUTO||!k.includes(SAVE)||ON)return;
  let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE)||'null');}catch(_){}
  if(!(saved&&saved.v===2&&saved.phase!=='over'))return;
  try{closeModal();}catch(_){}
  G=saved;B=buildBoard(G.seed);render();renderLog();next();if(G.phase==='discard')openDiscard();
  try{toast('Seguís la partida que venías jugando en tu otro dispositivo.');}catch(_){}
});
// Chat (viene con el sitio; si se abre este archivo suelto, no está).
if(window.RANGOS)RANGOS.css();
try{window.LOGROS&&LOGROS.aplicar('poblar');}catch(_){}
if(window.CHAT)CHAT.init({busy:()=>!!(G&&G.phase!=='over'&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'poblar',inbox:()=>pollInbox(true),
  invite:(g,u)=>{if(g==='estancia'){location.href='estancia.html#malon';return;}if(g==='truco'){location.href='truco.html#invitar='+encodeURIComponent(u);return;}if(g==='uno'){location.href='uno.html#invitar='+encodeURIComponent(u);return;}if(g!=='poblar'){location.href='./#invitar='+encodeURIComponent(u);return;}
    if(ON){openFriends();return;}const x=(UIQ.users||[]).find(y=>y.usuario.toLowerCase()===String(u).toLowerCase())||{usuario:u,avatar:'🙂',color:'#7ce9e5'};inviteFriend(x);},
  play:c=>{if(c.j==='poblar')openNew(!G||G.phase==='over');else location.href=c.j==='estancia'?'estancia.html#malon':c.j==='pampa'?'pampa.html':c.j==='truco'?'truco.html':c.j==='uno'?'uno.html':'./';}});
{const m=/^#invitar=([^&]+)/.exec(location.hash);if(m&&acct()){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
  const u=decodeURIComponent(m[1]);setTimeout(()=>{closeModal();inviteFriend((UIQ.users||[]).find(y=>y.usuario===u)||{usuario:u,avatar:'🙂',color:'#7ce9e5'});},400);}}
window.POBLAR={save,showEnd,rankEnd,pollInbox,get ON(){return ON},flip,rot,onMsg,newGame,applyDisc,openDiscard,moveRobber,endTurn,botAcceptsOffer,mesaStart,invitePeer,openFriends,openNew,get DSENT(){return DSENT},acceptInvite,inviteFriend,get G(){return G},get B(){return B},vp,shown,longestRoad,cards,roll,render,next,askOffer,botOffer,openDev,openTrade};
