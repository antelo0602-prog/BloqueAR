.hlist{display:flex;flex-direction:column;gap:6px;margin-top:4px}.hlist span{display:flex;flex-direction:column}.hlist b{font-size:13.5px}.hlist small{color:#b9c6d6;font-size:12.5px;line-height:1.35}

.boardwrap{touch-action:none}

.zoom-btn{position:absolute;right:8px;bottom:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff38;background:#0b1019b8;color:#fff;font-size:16px;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 4px 12px #0006;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.zoom-btn:active{transform:scale(.94)}
.boardwrap.zoomed{cursor:grab}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0b1019e6;border:1px solid #3a4a60;border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;white-space:nowrap;pointer-events:none}

/* Distribución: el tablero ocupa el lugar que queda; en pantallas anchas va al costado del panel */
/* Pantalla completa sin depender de 100vh/100dvh: en el iPhone con la app instalada calcula mal el alto y quedaba aire abajo */
.app{position:fixed;top:0;left:0;right:0;margin:0 auto;height:var(--app-h,100%);min-height:0;max-width:640px;overflow-y:auto;overscroll-behavior:contain}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{display:contents}
.score{order:0}.boardcol{order:1}.status{order:2;min-height:40px}.log{order:3}.hand{order:4}.actions{order:5}.wide{order:6}
.boardcol{flex:1 1 0;min-height:150px;display:flex;align-items:center;justify-content:center}
.boardwrap{flex:none;max-width:100%}
@media (min-width:760px) and (min-aspect-ratio:1/1),(orientation:landscape) and (max-height:560px){
  .app{max-width:1400px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .main{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,400px);grid-template-rows:minmax(0,1fr);gap:16px}
  .boardcol{height:100%;min-height:0;order:0}
  .panel{order:1}
  .panel{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;overflow-y:auto}
}
@media (orientation:landscape) and (max-height:560px){
  .app{gap:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .icon-btn{height:36px;min-width:36px}
  .panel{gap:6px}
  .pl{padding:4px 10px}.pl .vp{font-size:19px}

  .act{min-height:42px}.pill,.primary{min-height:44px}
}
/* Menú lateral (misma norma en todos los juegos: se abre desde la derecha) */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:#05080dcc}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#111a27;border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.side-panel{animation:none}}
.side-head{display:flex;align-items:center;justify-content:space-between}
.side-head h2{margin:0;font-size:20px}
.side-x{width:44px;height:44px;border-radius:14px;border:0;background:#1a2536;font-size:18px;cursor:pointer}
.side .menu-list{margin-top:0}
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.mode-pick button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:#0f1724;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.mode-pick button small{font-size:11px;color:var(--dim);font-weight:600}

.die.p0{background:var(--me);color:#04263a;box-shadow:0 0 0 2px #04263a inset}
.die.p1{background:var(--cpu);color:#fff;box-shadow:0 0 0 2px #5a0b0e inset}
.card.got{border-color:#57d49b;box-shadow:0 0 0 1px #57d49b inset,0 0 14px #57d49b55}

  .app{padding-left:4px;padding-right:4px;gap:6px}.main{gap:6px}.top{padding:0 2px}
  .boardwrap{border-width:1px;border-radius:12px}

  .card .e{font-size:19px;line-height:1.15}.card .n{font-size:19px;line-height:1.15}.card .l{grid-column:1/-1;text-align:center;line-height:1.2}
  .actions,.wide{gap:5px}.act{min-height:46px;border-radius:12px}.pill,.primary{min-height:48px;border-radius:12px}

<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
function premio(de,xp){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  const p={de,trigo:0,pesos:Math.min(1000,Math.round(n*2)),t:Date.now()};
  const L=ls.json('estancia-premios',[]);L.push(p);ls.set('estancia-premios',JSON.stringify(L.slice(-40)));
  // La Gran Pampa: cada partida terminada da una tirada extra ese día (hasta 3).
  const d=new Date(),dia=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,X=ls.json('pampa-extra',{}),n2=(X.dia===dia?X.n||0:0)+1;
  ls.set('pampa-extra',JSON.stringify({dia,n:n2}));
  const a=ls.json('bloques-acct-v1',null);
  return {...p,tirada:n2<=3&&!!(a&&a.usuario)};
}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){return {r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  const r=ls.json(RKEY,{});if(d.r&&(d.r.at||0)>(r.at||0)){ls.set(RKEY,JSON.stringify(d.r));ch=true;}
  const x=ls.json(XKEY,{});if(d.x){const o={...x};for(const [k,v] of Object.entries(d.x))if(k!=='at'&&Number.isFinite(v)&&v>(o[k]||0)){o[k]=v;ch=true;}if(ch){o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}}
  return ch;
}
function badge(v,small){const i=info(v);return `<span class="rk-badge${small?' sm':''}" style="--rk:${i.t.c}" title="${i.label}${i.next!=null?` · ${i.pr}/${DIV} PR`:''}"><i>${i.t.e}</i>${i.short}</span>`;}
const CSS=`.rk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent);background:color-mix(in srgb,var(--rk) 16%,#0c131e);color:var(--rk);font:800 11.5px/1.3 system-ui,-apple-system,sans-serif;white-space:nowrap;vertical-align:middle}
.rk-badge i{font-style:normal;font-size:12px}.rk-badge.sm{font-size:10.5px;padding:1px 7px 1px 4px}
.rk-res{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-weight:800}
.rk-res .rk-d{font-size:15px}.rk-res .rk-d.up{color:#57d49b}.rk-res .rk-d.down{color:#ff8a6b}
.rk-bar{height:6px;border-radius:3px;background:#283345;overflow:hidden;margin-top:4px}.rk-bar i{display:block;height:100%;background:var(--rk,#7ce9e5)}`;
function css(){if(document.getElementById('rk-css'))return;const s=document.createElement('style');s.id='rk-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
function resultHtml(r){if(!r)return '';const sign=r.delta>0?'+':'';return `<div class="rk-res">${badge(r.after.v)}<span class="rk-d ${r.delta>=0?'up':'down'}">${sign}${r.delta} PR</span>${r.up?'<span>¡Subiste!</span>':r.down?'<span>Bajaste</span>':''}</div>`;}
window.RANGOS={TIERS,GAMES,info,get,generalFrom,isRanked,setRanked,apply,soloTarget,xp,addXp,general,exportData,importData,badge,resultHtml,css,levelInfo,premio,DIV};
})();

</script>
<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no suena ni aparece nada: sólo sube el numerito del botón 💬. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},
  timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}

  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte).slice(-3000);}
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
function unreadFrom(n){const r=S.read[lc(n)]||0;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2500:5000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()}};
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    if(j.t>S.last)await fetchNew();
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(){
  const j=await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id))continue;S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>(r[lc(m.de)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===lc(m.de)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  if(!S.key||!cs)return;
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||m.tmp)continue;const o=await unseal(other(m),m.cont).catch(()=>null);S.plain[m.id]=o;}
}

/* ── Avisos ── */
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'🔒 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;
  if(ST.m==='dnd'){S.pending.length=0;return;}
  const list=S.pending.splice(0),names=[...new Set(list.map(m=>m.de))];
  if(list.some(m=>m.tipo==='zumbido'))beep('zumbido');else beep('msg');
  if(list.length===1){toast(list[0].de,preview(list[0]));return;}
  toast(names.length===1?names[0]:names.slice(0,3).join(', '),`Te ${list.length===1?'escribió':'escribieron'}: ${list.length} mensajes nuevos.`,names.length===1?names[0]:null);
}
function shake(){const el=S.open?$('.cx-panel'):document.body;if(!el)return;el.classList.remove('cx-shake');void el.offsetWidth;el.classList.add('cx-shake');setTimeout(()=>el.classList.remove('cx-shake'),800);}
let baseTitle=document.title,titleTimer=0;
function flashTitle(){if(titleTimer)return;baseTitle=document.title.replace(/^\(\d+\) /,'');let on=false;titleTimer=setInterval(()=>{const n=unreadTotal();if(!document.hidden||!n){clearInterval(titleTimer);titleTimer=0;document.title=baseTitle;return;}on=!on;document.title=on?`(${n}) 💬 Mensaje nuevo`:baseTitle;},1200);}
function sysNotify(m){

  else{const k=await newKeyPair(pin);await call(auth({accion:'llave',pin,llave:JSON.stringify(k.remote),reemplazar:reset||undefined}));local=k.local;}
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;

async function send(){

  try{
    const cont=await seal(S.con,{x:txt});const j=await call(auth({accion:'enviar',para:S.con,tipo:'msg',cont}));
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    const m={id:j.id,de:S.me,para:S.con,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:txt};saveMsgs();S.err='';
  }catch(e){const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);S.err=String(e.message||e);ta.value=txt;}

    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();

  try{const cont=await seal(S.con,{e:val});const j=await call(auth({accion:'enviar',para:S.con,tipo:'reac',cont,ref:id}));
    const r={id:j.id,de:S.me,para:S.con,tipo:'reac',cont,ref:id,t:j.t};S.msgs.push(r);S.plain[r.id]={e:val};saveMsgs();S.err='';}
  catch(err){S.err=String(err.message||err);}
  render();
}

   monte (madera), horno (ladrillo), estancia (lana), pampa (trigo), cerro (mineral) y el salitral.
   Ganás con 8 puntos: rancho 1, pueblo 2 y el camino más largo (5 o más) 2. Con un 7 aparece el cuatrero. */

const DEV={gaucho:{e:'🐎',n:'Gaucho',d:'Mové al cuatrero y robale una carta al rival. Con 3 gauchos o más tenés la tropilla más grande (+2 puntos).'},
  obra:{e:'🛤️',n:'Obra pública',d:'Construí 2 caminos gratis.'},

  acopio:{e:'🏚️',n:'Acopio',d:'Elegí un recurso: el rival te da todos los que tenga.'},

const DIFF={facil:'Fácil',normal:'Normal',dificil:'Difícil'};
const LIMIT={road:15,ranch:5,town:4};
const GOAL=8;
const SAVE='poblar-partida-v2';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pips=n=>n?6-Math.abs(7-n):0;
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ── Tablero: 19 hexágonos, vértices (donde van ranchos) y lados (donde van caminos) ── */
const S=60,SQ=Math.sqrt(3);
function buildBoard(seed){
  const R=rng(seed),hexes=[];
  for(let q=-2;q<=2;q++)for(let r=Math.max(-2,-q-2);r<=Math.min(2,-q+2);r++)hexes.push({q,r,x:S*SQ*(q+r/2),y:S*1.5*r});
  const kinds=shuffle([...Array(4).fill('madera'),...Array(3).fill('ladrillo'),...Array(4).fill('lana'),...Array(4).fill('trigo'),...Array(3).fill('mineral'),'salitral'],R);
  hexes.forEach((h,i)=>h.res=kinds[i]);
  const near=(a,b)=>{const dq=a.q-b.q,dr=a.r-b.r;return Math.abs(dq)+Math.abs(dr)+Math.abs(dq+dr)===2;};
  // Números: el 6 y el 8 (los que más salen) nunca juntos.
  for(let tries=0;tries<500;tries++){
    const nums=shuffle([2,3,3,4,4,5,5,6,6,8,8,9,9,10,10,11,11,12],R);let k=0;
    for(const h of hexes)h.num=h.res==='salitral'?0:nums[k++];
    const hot=hexes.filter(h=>h.num===6||h.num===8);
    if(!hot.some(a=>hot.some(b=>a!==b&&near(a,b))))break;
  }
  const verts=[],vkey=new Map(),edges=[],ekey=new Map();
  const vid=(x,y)=>{const k=Math.round(x)+','+Math.round(y);if(!vkey.has(k)){vkey.set(k,verts.length);verts.push({x,y,hexes:[],adj:[],edges:[],port:null});}return vkey.get(k);};
  hexes.forEach((h,hi)=>{
    h.v=[];for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);h.v.push(vid(h.x+S*Math.cos(a),h.y+S*Math.sin(a)));}
    for(const v of h.v)verts[v].hexes.push(hi);
    for(let i=0;i<6;i++){const a=h.v[i],b=h.v[(i+1)%6],k=Math.min(a,b)+'-'+Math.max(a,b);
      if(!ekey.has(k)){ekey.set(k,edges.length);edges.push({a,b,hexes:[]});verts[a].adj.push(b);verts[b].adj.push(a);verts[a].edges.push(edges.length-1);verts[b].edges.push(edges.length-1);}
      edges[ekey.get(k)].hexes.push(hi);}
  });
  // Puertos: 9 sobre la costa (4 de 3:1 y uno 2:1 de cada recurso).
  const coast=edges.map((e,i)=>({i,e,ang:Math.atan2((verts[e.a].y+verts[e.b].y)/2,(verts[e.a].x+verts[e.b].x)/2)})).filter(o=>o.e.hexes.length===1).sort((a,b)=>a.ang-b.ang);
  const ptypes=shuffle(['3:1','3:1','3:1','3:1',...RES],R),ports=[];
  for(let k=0;k<9;k++){const o=coast[Math.floor(k*coast.length/9)];ports.push({edge:o.i,type:ptypes[k]});verts[o.e.a].port=ptypes[k];verts[o.e.b].port=ptypes[k];}
  return {hexes,verts,edges,ports};
}

/* ── Estado de la partida ── */
let B=null,G=null;
function newGame(seed=(Math.random()*2**32)>>>0){
  B=buildBoard(seed);
  const first=Math.random()<.5?0:1;
  const deck=shuffle([...Array(14).fill('gaucho'),...Array(5).fill('procer'),'obra','obra','cosecha','cosecha','acopio','acopio'],Math.random);
  G={seed,v:2,deck,turnNo:0,devUsed:false,free:0,after:null,army:null,offers:0,diff:(()=>{try{return localStorage.getItem('poblar-dificultad')||'normal';}catch(_){return 'normal';}})(),owner:B.verts.map(()=>null),town:B.verts.map(()=>false),road:B.edges.map(()=>null),
    robber:B.hexes.findIndex(h=>h.res==='salitral'),
    p:[{name:'Vos',bot:AUTO,hand:hand0(),ranch:0,town:0,road:0,dev:[],gauchos:0},{name:'La compu',bot:true,hand:hand0(),ranch:0,town:0,road:0,dev:[],gauchos:0}],
    longest:null,longLen:[0,0],turn:first,first,setup:[first,1-first,1-first,first],setupStep:0,setupPhase:'ranch',lastRanch:null,
    phase:'setup',dice:null,winner:null,log:[],rolls:0};
  addLog(`Empieza ${first===0?'vos':G.p[1].name}.`);
  save();render();next();
}
function hand0(){return {madera:0,ladrillo:0,lana:0,trigo:0,mineral:0};}
const cards=p=>RES.reduce((s,r)=>s+G.p[p].hand[r],0);
const hidden=p=>G.p[p].dev.filter(c=>c.k==='procer').length;
const shown=p=>G.p[p].ranch+2*G.p[p].town+(G.longest===p?2:0)+(G.army===p?2:0);
const vp=p=>shown(p)+hidden(p);
const can=(p,what)=>Object.entries(COST[what]).every(([r,n])=>G.p[p].hand[r]>=n);
function pay(p,what){for(const [r,n] of Object.entries(COST[what]))G.p[p].hand[r]-=n;}
function addLog(t){G.log.push(t);if(G.log.length>60)G.log.shift();renderLog();}
function save(){if(ON&&ON.state==='on'){netSend({t:'state',G:flip(G)});return;}if(ON)return;try{localStorage.setItem(SAVE,JSON.stringify(G));}catch(_){}}

/* ── Reglas de dónde se puede construir ── */
function freeSpot(v){return G.owner[v]===null&&B.verts[v].adj.every(a=>G.owner[a]===null);}
function touchesOwnRoad(p,v){return B.verts[v].edges.some(e=>G.road[e]===p);}
function ranchSpots(p,setup=false){
  const out=[];for(let v=0;v<B.verts.length;v++)if(freeSpot(v)&&(setup||touchesOwnRoad(p,v)))out.push(v);return out;
}
function roadSpots(p,fromVert=null){
  const out=[];
  for(let e=0;e<B.edges.length;e++){
    if(G.road[e]!==null)continue;const {a,b}=B.edges[e];
    if(fromVert!==null){if(a===fromVert||b===fromVert)out.push(e);continue;}
    const ok=v=>G.owner[v]===p||(G.owner[v]===null&&B.verts[v].edges.some(x=>x!==e&&G.road[x]===p));
    if(ok(a)||ok(b))out.push(e);
  }
  return out;
}
function townSpots(p){const out=[];for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p&&!G.town[v])out.push(v);return out;}
function rate(p,r){let best=4;for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p&&B.verts[v].port){const t=B.verts[v].port;if(t==='3:1')best=Math.min(best,3);else if(t===r)best=2;}return best;}
// Camino más largo: recorrido sin repetir caminos; un rancho del rival corta el camino.
function longestRoad(p){
  let best=0;const mine=B.edges.map((_,i)=>G.road[i]===p);
  const dfs=(v,used,len)=>{best=Math.max(best,len);if(len>0&&G.owner[v]!==null&&G.owner[v]!==p)return;
    for(const e of B.verts[v].edges)if(mine[e]&&!used.has(e)){used.add(e);const {a,b}=B.edges[e];dfs(a===v?b:a,used,len+1);used.delete(e);}};
  for(let v=0;v<B.verts.length;v++)if(B.verts[v].edges.some(e=>mine[e]))dfs(v,new Set(),0);
  return best;
}
function updateLongest(){
  const L=[longestRoad(0),longestRoad(1)];G.longLen=L;const prev=G.longest;
  if(G.longest===null){const c=[0,1].filter(p=>L[p]>=5);if(c.length===1||(c.length===2&&L[0]!==L[1]))G.longest=L[0]>L[1]?0:1;}
  else{const o=1-G.longest;if(L[o]>L[G.longest]&&L[o]>=5)G.longest=o;else if(L[G.longest]<5)G.longest=L[o]>=5?o:null;}
  if(G.longest!==prev&&G.longest!==null){addLog(`🛣️ ${who(G.longest)} ${G.longest===0?'tenés':'tiene'} el camino más largo (+2).`);banner(`🛣️ CAMINO MÁS LARGO · ${G.p[G.longest].name.toUpperCase()}`);}
}
const who=p=>p===0?'Vos':G.p[1].name;
const rivalName=()=>G?G.p[1].name:'La compu';

/* ── Acciones ── */
function place(p,kind,at){
  if(kind==='ranch'){G.owner[at]=p;G.p[p].ranch++;}
  else if(kind==='town'){G.town[at]=true;G.p[p].ranch--;G.p[p].town++;}
  else{G.road[at]=p;G.p[p].road++;}
  if(kind!=='town')updateLongest();
}
function build(p,kind,at){
  if(G.phase==='setup'){
    if(G.setupPhase==='ranch'){place(p,'ranch',at);G.lastRanch=at;G.setupPhase='road';
      // Con el segundo rancho se cobran los recursos de alrededor.
      if(G.setupStep>=2)for(const h of B.verts[at].hexes){const r=B.hexes[h].res;if(r!=='salitral'){G.p[p].hand[r]++;}}
    }else{place(p,'road',at);G.setupStep++;G.setupPhase='ranch';G.lastRanch=null;
      if(G.setupStep>=4){G.phase='roll';G.turn=G.first;addLog('¡Arranca la partida!');}else G.turn=G.setup[G.setupStep];}
    save();render();next();return;
  }
  const free=kind==='road'&&G.free>0;
  if(free)G.free--;else pay(p,kind);place(p,kind,at);
  addLog(`${who(p)} ${p===0?'construiste':'construyó'} ${kind==='road'?'un camino':kind==='ranch'?'un rancho':'un pueblo'}${free?' (gratis)':''}.`);
  if(G.free>0&&(!roadSpots(p).length||G.p[p].road>=LIMIT.road))G.free=0;
  if(p===0&&G.free>0)mode='road';
  checkWin();save();render();
}
function checkWin(){for(const p of [0,1])if(vp(p)>=GOAL&&G.phase!=='over'){G.phase='over';G.winner=p;addLog(p===0?'🏆 ¡Ganaste!':`${G.p[1].name} ganó.`);save();render();setTimeout(showEnd,500);}}
async function roll(){
  const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)],n=d[0]+d[1];G.dice=d;G.diceBy=G.turn;G.rolls++;
  addLog(`${who(G.turn)} ${G.turn===0?'sacaste':'sacó'} ${n}.`);
  if(n===7){
    G.phase='robber';G.after='main';
    for(const p of [0,1]){const c=cards(p);if(c<=7)continue;const lose=Math.floor(c/2);
      if(G.p[p].bot||p!==0){discard(p,lose);addLog(`${who(p)} perdió ${lose} cartas por tener más de 7.`);}
      else{G.phase='discard';G.discardN=lose;}}
    if(G.phase==='discard'){save();render(true);openDiscard();return;}
  }else{
    const got=[hand0(),hand0()];
    B.hexes.forEach((h,hi)=>{if(h.num!==n||hi===G.robber)return;for(const v of h.v)if(G.owner[v]!==null){const k=G.town[v]?2:1;G.p[G.owner[v]].hand[h.res]+=k;got[G.owner[v]][h.res]+=k;}});
    for(const p of [0,1]){const t=RES.filter(r=>got[p][r]).map(r=>`${got[p][r]}${RI[r].e}`).join(' ');if(t)addLog(`${who(p)} ${p===0?'recibís':'recibe'} ${t}`);}
    floatGains(n,got);
    G.phase='main';
  }
  save();render(true);
}
// Descartar la mitad: se van las cartas de lo que más tenés.
function discard(p,n){const h=G.p[p].hand;for(let i=0;i<n;i++){const r=RES.reduce((a,b)=>h[b]>h[a]?b:a);h[r]--;}}
function moveRobber(p,hex){
  G.robber=hex;const victims=new Set(B.hexes[hex].v.map(v=>G.owner[v]).filter(o=>o!==null&&o!==p));
  let txt=`${who(p)} ${p===0?'mandaste':'mandó'} al cuatrero a ${RI[B.hexes[hex].res].hex.toLowerCase()}`;
  for(const o of victims){const pool=RES.flatMap(r=>Array(G.p[o].hand[r]).fill(r));if(pool.length){const r=pool[Math.floor(Math.random()*pool.length)];G.p[o].hand[r]--;G.p[p].hand[r]++;txt+=p===0?` y le robaste ${RI[r].e}`:` y te robó ${RI[r].e}`;}}
  addLog(txt+'.');G.byGaucho=false;G.phase=G.after||'main';G.after=null;checkWin();save();render();
}
function trade(p,give,get){const n=rate(p,give);if(G.p[p].hand[give]<n)return false;G.p[p].hand[give]-=n;G.p[p].hand[get]++;addLog(`${who(p)} ${p===0?'cambiaste':'cambió'} ${n}${RI[give].e} por 1${RI[get].e}.`);save();render();return true;}
function endTurn(){if(G.phase!=='main')return;G.free=0;G.turn=1-G.turn;G.turnNo++;G.devUsed=false;G.offers=0;G.phase='roll';G.dice=null;mode=null;save();render();next();}
/* ── Cartas de desarrollo ── */
function buyDev(p){
  if(!can(p,'dev')||!G.deck.length)return false;pay(p,'dev');const k=G.deck.pop();G.p[p].dev.push({k,t:G.turnNo});
  addLog(`${who(p)} ${p===0?`compraste una carta: ${DEV[k].e} ${DEV[k].n}`:'compró una carta'}.`);checkWin();save();render();return true;
}
const playable=(p,c)=>c.k!=='procer'&&c.t<G.turnNo&&!G.devUsed&&G.turn===p&&(c.k==='gaucho'?['roll','main'].includes(G.phase):G.phase==='main');
function playDev(p,i,arg){
  const c=G.p[p].dev[i];if(!c||!playable(p,c))return false;
  G.p[p].dev.splice(i,1);G.devUsed=true;const o=1-p;
  addLog(`${who(p)} ${p===0?'jugaste':'jugó'} ${DEV[c.k].e} ${DEV[c.k].n}.`);banner(`${DEV[c.k].e} ${DEV[c.k].n.toUpperCase()}`);
  if(c.k==='gaucho'){G.p[p].gauchos++;updateArmy();G.after=G.phase;G.phase='robber';G.byGaucho=true;}
  else if(c.k==='obra'){G.free=Math.min(2,LIMIT.road-G.p[p].road);if(!roadSpots(p).length)G.free=0;if(p===0&&G.free)mode='road';}
  else if(c.k==='cosecha'){for(const r of arg)G.p[p].hand[r]++;addLog(`${who(p)} ${p===0?'tomaste':'tomó'} ${arg.map(r=>RI[r].e).join('')}.`);}
  else if(c.k==='acopio'){const n=G.p[o].hand[arg];G.p[o].hand[arg]=0;G.p[p].hand[arg]+=n;addLog(`${who(p)} se ${p===0?'llevaste':'llevó'} ${n}${RI[arg].e} del rival.`);}
  checkWin();save();render();return true;
}
function updateArmy(){
  const g=[G.p[0].gauchos,G.p[1].gauchos],prev=G.army;
  for(const p of [0,1])if(g[p]>=3&&g[p]>g[1-p]&&G.army!==p&&(G.army===null||g[p]>g[G.army]))G.army=p;
  if(G.army!==prev){addLog(`🐎 ${who(G.army)} ${G.army===0?'tenés':'tiene'} la tropilla más grande (+2).`);banner(`🐎 TROPILLA MÁS GRANDE · ${G.p[G.army].name.toUpperCase()}`);}
}
/* ── Cambios con el rival ── */
// Cuánto le sirve a la compu cada recurso según lo que le falta para construir.
function needValue(p){
  const h=G.p[p].hand,val={madera:1,ladrillo:1,lana:1,trigo:1,mineral:1};
  const goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');goals.push('road');if(G.deck.length)goals.push('dev');
  goals.forEach((g,gi)=>{for(const r of RES){const need=(COST[g][r]||0)-h[r];if(need>0)val[r]+=(gi===0?1.4:.6)*Math.min(2,need);}});
  for(const r of RES)if(h[r]>=4)val[r]*=.6;
  return val;
}
function botAcceptsOffer(give,want){// give: lo que le das a la compu; want: lo que pedís
  const b=1;for(const r of RES)if(G.p[b].hand[r]<want[r])return {ok:false,why:'No tengo esas cartas.'};
  if(vp(0)>=GOAL-2)return {ok:false,why:'Estás muy cerca de ganar, no te ayudo 😏'};
  const nIn=RES.reduce((s,r)=>s+give[r],0),nOut=RES.reduce((s,r)=>s+want[r],0);
  if(nOut>nIn+(G.diff==='facil'?1:0))return {ok:false,why:`¿${nOut} por ${nIn}? ¡Ni loco! 😂`};
  const v=needValue(b),inV=RES.reduce((s,r)=>s+v[r]*give[r],0),outV=RES.reduce((s,r)=>s+v[r]*want[r],0);
  const k={facil:.85,normal:1.1,dificil:1.35}[G.diff]||1.1;
  return inV>=outV*k?{ok:true}:{ok:false,why:'Mmm, no me conviene.'};
}
function swapCards(give,want){for(const r of RES){G.p[0].hand[r]-=give[r];G.p[1].hand[r]+=give[r];G.p[1].hand[r]-=want[r];G.p[0].hand[r]+=want[r];}
  const t=o=>RES.filter(r=>o[r]).map(r=>`${o[r]}${RI[r].e}`).join(' ');addLog(`🤝 Cambio con ${G.p[1].bot?'la compu':G.p[1].name}: das ${t(give)} y recibís ${t(want)}.`);save();render();}

/* ── Turno de la compu ── */
function vertValue(p,v,setup=false){
  if(!freeSpot(v))return -1;let s=0;const have=new Set();
  for(let x=0;x<B.verts.length;x++)if(G.owner[x]===p)for(const h of B.verts[x].hexes)have.add(B.hexes[h].res);
  const kinds=new Set();
  for(const h of B.verts[v].hexes){const H=B.hexes[h];if(H.res==='salitral')continue;s+=pips(H.num)*(h===G.robber?.4:1);kinds.add(H.res);}
  for(const k of kinds)if(!have.has(k))s+=setup?2.2:1.2;
  if(kinds.has('trigo')||kinds.has('mineral'))s+=.6;
  if(B.verts[v].port)s+=B.verts[v].port==='3:1'?1:(kinds.has(B.verts[v].port)?2:.5);
  return s;
}
// Camino que acerca a la mejor esquina libre (búsqueda en anchura desde la red propia).
function bestRoadToward(p){
  const start=[];for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p||(G.owner[v]===null&&B.verts[v].edges.some(e=>G.road[e]===p)))start.push(v);
  const prev=new Map(),dist=new Map(),q=[];for(const v of start){dist.set(v,0);q.push(v);}
  let best=null,bestScore=-1;
  while(q.length){const v=q.shift(),d=dist.get(v);if(d>=4)continue;
    for(const e of B.verts[v].edges){if(G.road[e]!==null)continue;const {a,b}=B.edges[e],w=a===v?b:a;if(dist.has(w)||(G.owner[w]!==null&&G.owner[w]!==p))continue;
      dist.set(w,d+1);prev.set(w,[v,e]);q.push(w);
      const val=vertValue(p,w);if(val>0){const sc=val-d*1.6;if(sc>bestScore){bestScore=sc;best=w;}}}}
  if(best===null)return null;let w=best,e=null;while(prev.has(w)){const [v,ee]=prev.get(w);e=ee;if(dist.get(v)===0)break;w=v;}
  return e;
}
async function botTurn(){
  const p=G.turn,o=1-p,wait=ms=>sleep(FAST?0:ms);
  if(G.phase==='setup'){
    await wait(500);
    if(G.setupPhase==='ranch'){const spots=ranchSpots(p,true);spots.sort((a,b)=>vertValue(p,b,true)-vertValue(p,a,true));build(p,'ranch',spots[G.diff==='facil'?Math.floor(Math.random()*Math.min(6,spots.length)):0]);}
    else{const opts=roadSpots(p,G.lastRanch);let best=opts[0],bs=-1;for(const e of opts){const {a,b}=B.edges[e],w=a===G.lastRanch?b:a;let sc=0;for(const x of B.verts[w].adj)sc=Math.max(sc,vertValue(p,x,true));if(sc>bs){bs=sc;best=e;}}build(p,'road',best);}
    return;
  }
  // Antes de tirar: un gaucho si el cuatrero le bloquea algo o si vas ganando.
  if(G.phase==='roll'&&G.diff!=='facil'){const i=G.p[p].dev.findIndex(c=>c.k==='gaucho'&&playable(p,c));
    if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||vp(o)>=shown(p))){await wait(500);playDev(p,i);await wait(500);}}
  if(G.phase==='robber'&&G.after==='roll'){await botRobber(p,o);await wait(500);}
  if(G.phase==='roll'){await wait(600);await roll();await wait(700);}
  if(G.phase==='discard')return;// espera que descartes; después sigue sola
  if(G.phase==='robber'){await botRobber(p,o);await wait(700);}
  if(G.phase==='over')return;
  for(let guard=0;guard<12&&G.phase==='main';guard++){
    let did=false;
    if(can(p,'town')&&G.p[p].town<LIMIT.town){const val=v=>B.verts[v].hexes.reduce((s,h)=>s+(B.hexes[h].res==='salitral'?0:pips(B.hexes[h].num)),0);const t=townSpots(p).sort((a,b)=>val(b)-val(a));if(t.length){build(p,'town',t[0]);did=true;}}
    if(!did&&can(p,'ranch')&&G.p[p].ranch<LIMIT.ranch){const s=ranchSpots(p).sort((a,b)=>vertValue(p,b)-vertValue(p,a));if(s.length){build(p,'ranch',s[0]);did=true;}}
    if(!did&&can(p,'road')&&G.p[p].road<LIMIT.road&&!(ranchSpots(p).length&&!can(p,'ranch')&&cards(p)>=3)){const e=bestRoadToward(p);const wantLong=G.longest!==p&&G.longLen[p]>=G.longLen[o]-1&&G.longLen[p]>=3;
      if(e!==null||wantLong){const e2=e!==null?e:roadSpots(p)[0];if(e2!==undefined){build(p,'road',e2);did=true;}}}
    if(!did)did=botDev(p);
    if(G.phase==='robber'){await wait(500);await botRobber(p,o);did=true;}
    if(!did&&G.offers<1&&G.p[o].bot===false&&G.diff!=='facil')did=await botOffer(p);
    if(!did)did=botTrade(p);

async function botRobber(p,o){
  const opts=[];B.hexes.forEach((h,hi)=>{if(hi===G.robber)return;let s=0;for(const v of h.v){if(G.owner[v]===o)s+=pips(h.num)*(G.town[v]?2:1)+(cards(o)?.5:0);if(G.owner[v]===p)s-=pips(h.num)*2;}opts.push([s,hi]);});
  opts.sort((a,b)=>b[0]-a[0]);const pick=G.diff==='facil'?opts[Math.floor(Math.random()*Math.min(4,opts.length))]:opts[0];

// Cartas: compra si le sobra para eso y juega las que le sirven.
function botDev(p){
  const D=G.p[p].dev,o=1-p;if(G.diff==='facil')return false;
  if(!G.devUsed){
    let i=D.findIndex(c=>c.k==='obra'&&playable(p,c));if(i>=0&&roadSpots(p).length&&G.p[p].road<LIMIT.road-1){playDev(p,i);let n=0;while(G.free>0&&n++<2){const e=bestRoadToward(p)??roadSpots(p)[0];if(e===undefined||e===null)break;build(p,'road',e);}G.free=0;return true;}
    i=D.findIndex(c=>c.k==='cosecha'&&playable(p,c));if(i>=0){const v=needValue(p),pick=RES.slice().sort((a,b)=>v[b]-v[a]);if(v[pick[0]]>1.5){playDev(p,i,[pick[0],v[pick[1]]>1.5?pick[1]:pick[0]]);return true;}}
    i=D.findIndex(c=>c.k==='acopio'&&playable(p,c));if(i>=0){const r=RES.slice().sort((a,b)=>G.p[o].hand[b]-G.p[o].hand[a])[0];if(G.p[o].hand[r]>=2){playDev(p,i,r);return true;}}
    i=D.findIndex(c=>c.k==='gaucho'&&playable(p,c));if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||(G.p[p].gauchos>=2&&G.army!==p))){playDev(p,i);return true;}
  }
  const nothingElse=!(can(p,'ranch')&&ranchSpots(p).length)&&!(can(p,'town')&&townSpots(p).length);
  if(can(p,'dev')&&G.deck.length&&nothingElse&&(G.diff==='dificil'||Math.random()<.6))return buyDev(p);
  return false;

// Te ofrece un cambio 1 por 1 si le falta una sola carta para algo.
async function botOffer(p){
  const h=G.p[p].hand,o=1-p,goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(miss!==1)continue;
    const want=need[0];if(!G.p[o].hand[want])continue;
    const spare=RES.filter(r=>r!==want&&h[r]-(COST[g][r]||0)>=1).sort((a,b)=>h[b]-h[a]);if(!spare.length)continue;
    G.offers++;const give=spare[0];

// Cambia con el banco si le falta una sola carta para construir algo.
function botTrade(p){
  const h=G.p[p].hand,goals=[];
  if(G.p[p].town<LIMIT.town&&townSpots(p).length)goals.push('town');
  if(G.p[p].ranch<LIMIT.ranch&&ranchSpots(p).length)goals.push('ranch');
  goals.push('road');
  // Le falta poco (1 o 2 cartas) para algo: cambia lo que le sobra. Con muchas cartas (riesgo del cuatrero) es más decidida.
  const maxMiss=G.diff==='facil'?1:cards(p)>7||G.diff==='dificil'?3:2;
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(!miss||miss>maxMiss)continue;
    const want=need[0];const spare=RES.filter(r=>!need.includes(r)&&h[r]-(COST[g][r]||0)>=rate(p,r)).sort((a,b)=>(h[b]-rate(p,b))-(h[a]-rate(p,a)));

}

let mode=null;// 'road' | 'ranch' | 'town' | 'robber' | null
function next(){
  if(!G||G.phase==='over')return;
  if(G.turn===1&&!G.p[1].bot){mode=null;render();return;}// turno de tu amigo: llega por la conexión
  if(G.p[G.turn].bot){mode=null;render();botTurn();return;}
  if(G.phase==='setup')mode=G.setupPhase==='ranch'?'ranch':'road';

}
function targets(){
  const p=0;if(G.turn!==0||G.phase==='over')return {v:[],e:[],h:[]};
  if(G.phase==='setup')return G.setupPhase==='ranch'?{v:ranchSpots(p,true),e:[],h:[]}:{v:[],e:roadSpots(p,G.lastRanch),h:[]};
  if(G.phase==='robber')return {v:[],e:[],h:B.hexes.map((_,i)=>i).filter(i=>i!==G.robber)};
  if(mode==='road')return {v:[],e:roadSpots(p),h:[]};
  if(mode==='ranch')return {v:ranchSpots(p),e:[],h:[]};
  if(mode==='town')return {v:townSpots(p),e:[],h:[]};

}
function onBoardTap(kind,i){
  if(G.turn!==0)return;
  if(G.phase==='robber'&&kind==='h'){moveRobber(0,i);mode=G.free>0?'road':null;render();return;}
  if(G.phase==='setup'){build(0,G.setupPhase,i);return;}
  if(mode&&(kind==='v'||kind==='e')){const m=mode;mode=null;build(0,m,i);}

/* ── Sonidos ──
   Sencillos y bajitos: golpecitos de madera, dados de verdad y notas suaves de marimba.

  inp.connect(lp);lp.connect(comp);lp.connect(d);d.connect(dl);dl.connect(fb);fb.connect(d);dl.connect(wet);wet.connect(comp);comp.connect(out);out.connect(a.destination);

const N={C4:261.6,E4:329.6,G4:392,A4:440,C5:523.3,D5:587.3,E5:659.3,G5:784,A5:880,C6:1046.5,G2:98};
const SFX={
  // Dos dados de madera que ruedan, rebotan y quedan quietos.
  dice(){[0,.04].forEach((o,k)=>{let t=o,gap=.085+k*.012,v=.24;for(let i=0;i<4;i++){clack(t,v);t+=gap;gap*=.72;v*=.64;}});tone(150,110,.06,'sine',.045,.3);},

// Sonidos según lo que cambió desde la última vez que se dibujó (así suenan también las jugadas del amigo en línea).
let SNAP=null;
function snapOf(){const pc=p=>G.p[p].road+G.p[p].ranch*10+G.p[p].town*100;return {seed:G.seed,rolls:G.rolls,robber:G.robber,road:[0,1].map(p=>G.p[p].road),ranch:[0,1].map(p=>G.p[p].ranch),town:[0,1].map(p=>G.p[p].town),

function soundDiff(){
  const n=snapOf(),o=SNAP;SNAP=n;if(!o||o.seed!==n.seed)return;
  const q=[];
  if(n.rolls>o.rolls)q.push('dice');
  let up=0,down=0;for(const r of RES){const d=n.hand[r]-o.hand[r];if(d>0)up+=d;else down-=d;}
  if(n.robber!==o.robber)q.push('robber');
  if(n.town[0]+n.town[1]>o.town[0]+o.town[1])q.push('town');
  else if(n.ranch[0]+n.ranch[1]>o.ranch[0]+o.ranch[1])q.push('ranch');
  else if(n.road[0]+n.road[1]>o.road[0]+o.road[1])q.push('road');
  if(n.dev[0]+n.dev[1]>o.dev[0]+o.dev[1])q.push('card');else if(n.dev[0]+n.dev[1]<o.dev[0]+o.dev[1])q.push('play');

const UIQ={users:null,err:'',dismissed:new Set(),pending:null};
function flip(g){// la misma partida vista desde el otro lado
  const x=JSON.parse(JSON.stringify(g)),sw=v=>v===0?1:v===1?0:v;
  x.owner=x.owner.map(sw);x.road=x.road.map(sw);x.p.reverse();x.turn=sw(x.turn);x.first=sw(x.first);x.setup=x.setup.map(sw);
  x.longest=sw(x.longest);x.army=sw(x.army);x.winner=sw(x.winner);if(x.diceBy!==undefined)x.diceBy=sw(x.diceBy);x.longLen=x.longLen.slice().reverse();
  for(const pl of x.p)pl.bot=false;return x;
}
function netSend(m){try{if(ON&&ON.ch&&ON.ch.readyState==='open')ON.ch.send(JSON.stringify(m));}catch(_){}}
const me=()=>{const a=acct();return {usuario:a?a.usuario:'Vos',avatar:a?a.avatar:'🙂',color:a?a.color:'#7ce9e5'};};
function attach(ch){
  ON.ch=ch;
  ch.onopen=()=>{ON.state='on';renderOnline();closeModal();banner('🔗 CONECTADOS');sound('turn');
    netSend({t:'hola',yo:me()});if(ON.role==='host')onlineNewGame();};
  ch.onclose=()=>onLost();
  ch.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}onMsg(m);};
}
// Otra partida: en línea la arma siempre el que invitó (así los dos quedan con la misma).
function playAgain(){
  if(ON&&ON.state==='on'){if(ON.role==='host')onlineNewGame();else{netSend({t:'again'});banner(`⏳ LE PEDISTE LA REVANCHA A ${ON.peer.usuario.toUpperCase()}`);}return;}
  newGame();
}
function onlineNewGame(){
  newGame();G.p[1].bot=false;G.p[1].name=ON.peer.usuario;G.diff='normal';
  G.log=[];addLog(`Partida en línea con ${ON.peer.usuario}. Empieza ${G.first===0?'vos':ON.peer.usuario}.`);
  save();render();next();
}
function onMsg(m){
  if(m.t==='hola'){if(m.yo)ON.peer={...ON.peer,...m.yo};renderOnline();return;}
  if(m.t==='state'&&m.G){
    const g=m.G;g.p[0].bot=false;// ya viene dada vuelta (desde tu lado)
   g.p[1].bot=false;g.p[1].name=ON.peer.usuario;g.p[0].name='Vos';
    const fresh=!G||!B||G.seed!==g.seed;G=g;if(fresh)B=buildBoard(G.seed);closeModalIfGame();
    mode=null;render(true);renderLog();
    if(G.phase==='over'&&G.winner!==null)setTimeout(showEnd,400);else next();return;
  }
  if(m.t==='offer-n'){// propuesta de tu amigo
    const t=o=>RES.filter(r=>o[r]).map(r=>`${o[r]} ${RI[r].e}`).join(' ');
    openModal(`<h2>🤝 ${escHtml(ON.peer.usuario)} te propone</h2><p style="font-size:18px">Te da <b>${t(m.give)}</b> y te pide <b>${t(m.want)}</b>.</p>
      ${RES.every(r=>G.p[0].hand[r]>=m.want[r])?'':'<p class="note">No tenés esas cartas.</p>'}
      <div class="row"><button class="pill" id="fo-no">No</button><button class="primary" id="fo-yes" ${RES.every(r=>G.p[0].hand[r]>=m.want[r])?'':'disabled'}>ACEPTAR</button></div>`);
    $('fo-no').onclick=()=>{closeModal();netSend({t:'offer-reply',id:m.id,ok:false});};$('fo-yes').onclick=()=>{closeModal();netSend({t:'offer-reply',id:m.id,ok:true});};return;}
  if(m.t==='offer-reply'&&UIQ.pending&&UIQ.pending.id===m.id){UIQ.pending.res(!!m.ok);UIQ.pending=null;return;}
  if(m.t==='again'&&ON.role==='host'){banner(`🔁 ${ON.peer.usuario.toUpperCase()} QUIERE LA REVANCHA`);onlineNewGame();return;}
  if(m.t==='bye'){onLost('salió de la partida');}
}
function closeModalIfGame(){const s=$('sheet');if(s&&!$('modal').hidden&&/Jugar con un amigo|Te invitan/.test(s.textContent))closeModal();}
function friendOffer(give,want){
  return new Promise(res=>{const id=Math.random().toString(36).slice(2);UIQ.pending={id,res};netSend({t:'offer-n',id,give,want});
    setTimeout(()=>{if(UIQ.pending&&UIQ.pending.id===id){UIQ.pending=null;res(false);}},60000);});
}
function onLost(why='se desconectó'){
  if(!ON||ON.state==='lost')return;const was=ON.state==='on';ON.state='lost';
  if(G&&was&&G.phase!=='over'){G.p[1].bot=true;addLog(`⚠️ ${G.p[1].name} ${why}. Sigue la compu en su lugar.`);G.p[1].name='La compu';banner('⚠️ SE CORTÓ: SIGUE LA COMPU');}
  try{ON.pc.close();}catch(_){}ON=null;renderOnline();if(G){render();next();}
}
function netLeave(){netSend({t:'bye'});const o=ON;ON=null;try{o&&o.pc&&o.pc.close();}catch(_){}if(G&&G.phase!=='over'){G.p[1].bot=true;G.p[1].name='La compu';}renderOnline();if(G){render();next();}}
function renderOnline(){
  const el=$('onl');if(!ON){el.className='onl';el.textContent='';return;}
  el.className='onl '+(ON.state==='on'?'on':'off');
  el.innerHTML=ON.state==='on'?`● En línea con ${escHtml(ON.peer.usuario)}`:`<span class="busy"></span>${escHtml(ON.msg||'Conectando…')}`;
}
// Invitar: se prepara la conexión y se deja en el buzón del amigo.
async function inviteFriend(u){
  const a=acct();if(!a)return;
  ON={role:'host',peer:{usuario:u.usuario,avatar:u.avatar,color:u.color},state:'preparing',msg:'Preparando la invitación…'};renderOnline();friendsWait();
  const me0=ON;
  try{
    const pc=new RTCPeerConnection({iceServers:await iceServers()});ON.pc=pc;attach(pc.createDataChannel('poblar',{ordered:true}));
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))onLost();};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(ON!==me0)return;
    const j=await lbCall({accion:'invitar',usuario:a.usuario,token:a.token,para:u.usuario,oferta:'POBLAR:'+JSON.stringify({sdp:pc.localDescription.sdp})});
    if(ON!==me0)return;ON.id=j.id;ON.state='waiting';ON.msg=`Esperando que ${u.usuario} acepte…`;renderOnline();friendsWait();
    const t0=Date.now();
    while(ON===me0&&ON.state==='waiting'&&Date.now()-t0<300000){
      await sleep(2000);if(ON!==me0)return;
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:ON.id});}catch(_){continue;}
      if(ON!==me0)return;
      if(r.estado==='aceptada'&&r.respuesta){ON.state='connecting';ON.msg='Conectando…';renderOnline();friendsWait();await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});
        setTimeout(()=>{if(ON===me0&&ON.state!=='on')failOnline('No se pudieron conectar. Prueben con datos móviles en uno de los dos.');},45000);return;}
      if(r.estado==='rechazada'){failOnline(`${u.usuario} dijo «ahora no».`);return;}
      if(r.estado==='vencida'||r.estado==='cancelada'){failOnline('La invitación venció.');return;}
    }
    if(ON===me0&&ON.state==='waiting')failOnline(`${u.usuario} no respondió.`);
  }catch(e){if(ON===me0)failOnline(e.message||'No se pudo preparar la conexión.');}
}
async function acceptInvite(inv){
  const a=acct();if(!a)return;UIQ.dismissed.add(inv.id);
  ON={role:'guest',peer:{usuario:inv.de,avatar:inv.avatar,color:inv.color},state:'connecting',msg:`Conectando con ${inv.de}…`,id:inv.id};renderOnline();friendsWait();
  const me0=ON;
  try{
    const off=JSON.parse(String(inv.oferta).slice(7));const pc=new RTCPeerConnection({iceServers:await iceServers()});ON.pc=pc;
    pc.ondatachannel=e=>attach(e.channel);pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))onLost();};
    await pc.setRemoteDescription({type:'offer',sdp:off.sdp});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    await lbCall({accion:'responder',usuario:a.usuario,token:a.token,id:inv.id,respuesta:JSON.stringify({sdp:pc.localDescription.sdp})});
    setTimeout(()=>{if(ON===me0&&ON.state!=='on')failOnline('No se pudieron conectar. Prueben con datos móviles en uno de los dos.');},45000);
  }catch(e){if(ON===me0)failOnline(e.message||'No se pudo conectar.');}
}
function failOnline(msg,show=true){
  const o=ON;if(o&&o.id&&o.role==='host'&&o.state==='waiting'){const a=acct();if(a)lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:o.id}).catch(()=>{});}
  try{o&&o.pc&&o.pc.close();}catch(_){}ON=null;renderOnline();
  if(!show){closeModal();if(!G)openNew(true,'online');return;}
  openModal(`<h2>👥 Jugar con un amigo</h2><p>${escHtml(msg)}</p><div class="row"><button class="pill" id="fw-x">Cerrar</button><button class="primary" id="fw-again">PROBAR DE NUEVO</button></div>`);
  $('fw-x').onclick=()=>{closeModal();if(!G)openNew(true,'online');};$('fw-again').onclick=openFriends;
}
function friendsWait(){
  if(!ON)return;openModal(`<h2>👥 Jugar con un amigo</h2><div style="display:flex;align-items:center;gap:12px;margin:10px 0">${avHtml(ON.peer.avatar,ON.peer.color)}<b style="font-size:18px">${escHtml(ON.peer.usuario)}</b></div>
    <p><span class="busy"></span>${escHtml(ON.msg||'')}</p>${ON.role==='host'&&ON.state==='waiting'?'<p class="note">Le llega la invitación en BloqueAR o en PoblAR. Si no tiene el juego abierto, le aparece cuando lo abra (dura 5 minutos).</p>':''}
    <div class="row"><button class="pill" id="fw-cancel">Cancelar</button></div>`);
  $('fw-cancel').onclick=()=>failOnline('',false);
}
async function openFriends(){
  const a=acct();
  if(ON&&ON.state!=='on'){friendsWait();return;}
  if(ON&&ON.state==='on'){openModal(`<h2>👥 En línea</h2><p>Estás jugando con <b>${escHtml(ON.peer.usuario)}</b>.</p><div class="row"><button class="pill" id="fx-leave">Salir de la partida</button><button class="primary" id="fx-x">SEGUIR</button></div>`);$('fx-x').onclick=closeModal;$('fx-leave').onclick=()=>{netLeave();closeModal();};return;}
  if(!a){openModal(`<h2>👥 Jugar con un amigo</h2><p>Para invitar a un amigo usás tu <b>cuenta de BloqueAR</b> (es la misma). Creala o entrá en BloqueAR › Yo, y volvé.</p>
    <div class="row"><button class="pill" id="fa-x">Cerrar</button><a class="primary" href="./" style="display:grid;place-items:center;text-decoration:none">IR A BLOQUEAR</a></div>`);$('fa-x').onclick=()=>{closeModal();if(!G)openNew(true,'online');};return;}
  const draw=()=>{const list=(UIQ.users||[]).filter(u=>u.usuario.toLowerCase()!==a.usuario.toLowerCase());
    openModal(`<h2>👥 Jugar con un amigo</h2><p class="note">Elegí a quién invitar. El punto verde es que tiene BloqueAR o PoblAR abierto.</p>
      ${UIQ.err?`<p>${escHtml(UIQ.err)}</p>`:''}${UIQ.users?`<ul class="ulist">${list.map(u=>`<li>${avHtml(u.avatar,u.color)}<span class="nm">${escHtml(u.usuario)}${u.enLinea?'<i class="dot"></i>':''}</span><button data-u="${escHtml(u.usuario)}">Invitar</button></li>`).join('')||'<li>Todavía no hay otras cuentas.</li>'}</ul>`:(UIQ.err?'':'<p><span class="busy"></span>Cargando…</p>')}
      <div class="row"><button class="pill" id="fl-x">Cerrar</button></div>`);
    $('fl-x').onclick=()=>{closeModal();if(!G)openNew(true,'online');};document.querySelectorAll('.ulist button[data-u]').forEach(b=>b.onclick=()=>{const u=list.find(x=>x.usuario===b.dataset.u);if(u)inviteFriend(u);});};
  draw();
  try{const j=await lbCall({accion:'usuarios'},false);if(!Array.isArray(j.usuarios))throw new Error('Hay que actualizar el código de la planilla (versión 4).');UIQ.users=j.usuarios;UIQ.err='';}catch(e){UIQ.err=e.message;}
  if(!ON&&!$('modal').hidden&&/Elegí a quién invitar/.test($('sheet').textContent))draw();
}
// Buzón: te avisa si alguien te invita (a PoblAR o a BloqueAR).
let pollAt=0,polling=false;
async function pollInbox(force=false){
  const a=acct();if(!a||polling||document.hidden||ON)return;
  const gap=G&&G.turn===0&&G.phase!=='over'?20000:12000;if(!force&&Date.now()-pollAt<gap)return;
  polling=true;pollAt=Date.now();
  try{const j=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
    if(inv&&!UIQ.dismissed.has(inv.id)&&!ON){
      const pob=String(inv.oferta||'').startsWith('POBLAR:');
      let want='';try{want=sessionStorage.getItem('poblar-accept')||'';}catch(_){}
      if(pob&&want===inv.id){try{sessionStorage.removeItem('poblar-accept');}catch(_){}acceptInvite(inv);}
      else showInvite(inv,pob);
    }}catch(_){}
  polling=false;
}
function showInvite(inv,pob){
  UIQ.dismissed.add(inv.id);
  openModal(`<h2>🤝 Te invitan</h2><div style="display:flex;align-items:center;gap:12px;margin:10px 0">${avHtml(inv.avatar,inv.color)}<div><b style="font-size:18px">${escHtml(inv.de)}</b><div class="note">te invita a jugar ${pob?'<b>PoblAR</b> 🏘️':'<b>BloqueAR</b> 🧱'}</div></div></div>
    <div class="row"><button class="pill" id="iv-no">Ahora no</button><button class="primary" id="iv-yes">ACEPTAR</button></div>`);
  $('iv-no').onclick=()=>{closeModal();const a=acct();if(a)lbCall({accion:'rechazar',usuario:a.usuario,token:a.token,id:inv.id}).catch(()=>{});};
  $('iv-yes').onclick=()=>{closeModal();if(pob)acceptInvite(inv);else{try{sessionStorage.setItem('blq-accept',inv.id);}catch(_){}location.href='./';}};
}
if(!/[#&]auto/.test(location.hash)){
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);});
  setTimeout(()=>pollInbox(true),1500);
}
window.addEventListener('pagehide',()=>{if(ON&&ON.state==='on')netSend({t:'bye'});});

/* ── Inicio: seguir la partida guardada o empezar ── */
let FAST=false,AUTO=false;
(function start(){
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;newGame(Number((location.hash.match(/semilla=(\d+)/)||[])[1])||undefined);return;}
  try{localStorage.setItem('bloques-ultimo-juego','poblar');localStorage.setItem('bloques-hub-v1','1');}catch(_){}
  let saved=null;try{saved=JSON.parse(localStorage.getItem(SAVE)||'null');}catch(_){}
  if(saved&&saved.v===2&&saved.phase!=='over'){G=saved;B=buildBoard(G.seed);render();renderLog();next();if(G.phase==='discard'&&G.turn!==0||G.phase==='discard')openDiscard();}
  else{G=null;openNew(true);}
  if(/^#amigos/.test(location.hash)){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}setTimeout(openFriends,200);}
})();
// Chat (viene con el sitio; si se abre este archivo suelto, no está).
if(window.RANGOS)RANGOS.css();
if(window.CHAT)CHAT.init({busy:()=>!!(G&&G.phase!=='over'&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'poblar',
  invite:(g,u)=>{if(g==='estancia'){location.href='estancia.html#malon';return;}if(g!=='poblar'){location.href='./#invitar='+encodeURIComponent(u);return;}
    if(ON){openFriends();return;}const x=(UIQ.users||[]).find(y=>y.usuario.toLowerCase()===String(u).toLowerCase())||{usuario:u,avatar:'🙂',color:'#7ce9e5'};inviteFriend(x);},
  play:c=>{if(c.j==='poblar')openNew(!G||G.phase==='over');else location.href=c.j==='estancia'?'estancia.html#malon':c.j==='pampa'?'pampa.html':'./';}});
{const m=/^#invitar=([^&]+)/.exec(location.hash);if(m&&acct()){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}
  const u=decodeURIComponent(m[1]);setTimeout(()=>{closeModal();inviteFriend((UIQ.users||[]).find(y=>y.usuario===u)||{usuario:u,avatar:'🙂',color:'#7ce9e5'});},400);}}
window.POBLAR={showEnd,rankEnd,pollInbox,get ON(){return ON},flip,onMsg,acceptInvite,inviteFriend,get G(){return G},get B(){return B},vp,shown,longestRoad,cards,roll,render,next,askOffer,botOffer,openDev,openTrade};
</script>
