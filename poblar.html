<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" id="vp" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>PoblAR</title>
<style>
:root{--bg:#0b1019;--panel:#141e2c;--line:#283345;--ink:#f4f7fe;--dim:#93a1b6;--aqua:#7ce9e5;--me:#4fc3f7;--cpu:#e5383b;--gold:#f6c453}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% -20%,#1f2b40 0,transparent 60%),var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding:max(8px,env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;gap:8px}
.brand{font-weight:900;letter-spacing:.12em;font-size:15px}.brand span{color:var(--aqua)}
.tag{font-size:10px;font-weight:800;letter-spacing:.08em;color:#0b1019;background:var(--gold);border-radius:6px;padding:2px 6px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#121b29;font-size:17px;cursor:pointer}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0;min-width:40px;box-sizing:border-box}
.games-btn i{background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
.score{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Los dos bonos de +2, siempre a la vista: de quién son y qué hace falta */
/* Lo que te hace el otro, contado por el juego (v58): una línea del relato, cartas que vuelan, la carta jugada sobre el tablero */
.relato{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-radius:12px;background:#1d1610;border-left:4px solid #e0a95a;color:#f6e7cf;font-size:13.5px;line-height:1.35}
.relato[hidden]{display:none}.relato .ic{font-size:20px;line-height:1.1}.relato b{color:#ffd59a}
@media (prefers-reduced-motion:no-preference){.relato.nuevo{animation:relIn .35s ease-out}}@keyframes relIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.vuela{position:fixed;z-index:70;pointer-events:none;display:grid;place-items:center;width:44px;height:58px;border-radius:9px;background:#f6ecd8;border:2px solid #8a6a3e;font-size:24px;box-shadow:0 8px 20px #0008}
.devbig{position:absolute;left:50%;top:50%;z-index:5;width:min(62%,240px);transform:translate(-50%,-50%);pointer-events:none;background:linear-gradient(#fbf3e2,#efe0bf);color:#3a2a16;border:3px solid #8a6a3e;border-radius:18px;padding:16px 14px 14px;text-align:center;box-shadow:0 18px 50px #000b}
.devbig .e{font-size:44px;line-height:1}.devbig b{display:block;font:800 19px/1.2 Georgia,serif;margin-top:6px}.devbig p{margin:6px 0 0;font-size:13px;line-height:1.35}.devbig small{display:block;margin-top:8px;font-size:12px;color:#7a5a2e;font-weight:700}
@media (prefers-reduced-motion:no-preference){.devbig{animation:devIn .35s cubic-bezier(.2,1.3,.4,1)}.devbig.va{transition:transform .5s ease-in,opacity .5s ease-in;opacity:0;transform:translate(-50%,-50%) scale(.3)}}
@keyframes devIn{from{transform:translate(-50%,-30%) scale(.6) rotate(-6deg);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.bonos{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bono{display:flex;align-items:center;gap:7px;min-width:0;padding:4px 9px;border-radius:12px;border:1px dashed var(--line);color:var(--dim);font-size:11.5px;line-height:1.2}
.bono>span:first-child{font-size:16px;flex:none}.bono b{color:var(--ink);font-size:12px;display:block}
.bono.si{border-style:solid;border-color:color-mix(in srgb,var(--pc) 70%,transparent);background:color-mix(in srgb,var(--pc) 14%,#111a27);color:var(--ink)}
.bono.si em{font-style:normal;font-weight:800;color:var(--pc)}
.pl{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:14px;background:#111a27;transition:border-color .2s,box-shadow .2s}
.pl.turn{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc) inset,0 0 18px color-mix(in srgb,var(--pc) 25%,transparent)}
.pl i{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none}
.pl b{font-size:13px}.pl small{display:block;color:var(--dim);font-size:11px}
.pl .vp{margin-left:auto;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}.pl .vp small{display:inline;font-size:11px;color:var(--dim);font-weight:700}
.boardwrap{position:relative;border-radius:18px;overflow:hidden;background:#0b3044;border:2px solid #2a2118;box-shadow:0 0 0 1px #3a5a68,0 10px 30px #0008}
svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hex{stroke:#0e2a38;stroke-width:3}
.ptxt{font-size:10.5px;font-weight:900;text-anchor:middle;dominant-baseline:central;pointer-events:none}.pico{font-size:11px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hname{font-size:10px;font-weight:900;letter-spacing:.12em;fill:#8a7b58;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.num{font-weight:900;font-size:24px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hico{font-size:18px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.port text{font-size:11px;font-weight:800;fill:#e9f3f8;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.spot{fill:#fff;fill-opacity:.0;stroke:none;cursor:pointer}
.spot.on{fill-opacity:1;fill:#f2c14e;stroke:#2a2118;stroke-width:3.5;animation:pulse 1s ease-in-out infinite alternate}
.espot{stroke:#ffffff;stroke-opacity:0;stroke-width:11;stroke-linecap:round;cursor:pointer}
.espot.on{stroke:#f2c14e;stroke-opacity:.95;animation:pulse 1s ease-in-out infinite alternate}
.hexhit.on{fill:#fff;fill-opacity:.0;stroke:#f6c453;stroke-width:5;stroke-dasharray:10 8;animation:pulse 1s ease-in-out infinite alternate;cursor:pointer}
@keyframes pulse{from{opacity:.65}to{opacity:1}}
.status{min-height:22px;font-size:14px;font-weight:700;text-align:center;color:#dfe8f3}
.status small{display:block;font-weight:600;color:var(--dim);font-size:12px}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px 5px;border-radius:12px;background:#121b29;border:1px solid var(--line)}
.card .e{font-size:22px;line-height:1.1}.card .n{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}.card .l{font-size:10px;color:var(--dim);font-weight:700}
.card.zero{opacity:.45}.card.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1);border-color:var(--gold)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.act{min-height:54px;border-radius:14px;border:1px solid var(--line);background:#142133;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:4px}
.act b{font-size:13px}.act small{font-size:11px;color:var(--dim);letter-spacing:.02em}
.act:disabled{opacity:.38;cursor:default}
.act.sel{border-color:var(--aqua);background:#173540}
.wide{display:grid;grid-template-columns:1fr 1fr 1.5fr;gap:6px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}.tabs button{min-height:40px;border-radius:12px;border:1px solid var(--line);background:#0f1724;font-weight:800;cursor:pointer}.tabs button.on{border-color:var(--aqua);background:#173540}
.cnt{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:6px}
@media (max-width:400px){.cnt{gap:4px}.cnt .pm{gap:2px}.cnt .pm button{width:26px;height:30px}}
.cnt>div{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;border-radius:12px;border:1px solid var(--line);background:#0f1724}
.cnt .e{font-size:20px}.cnt .n{font-weight:900;font-size:16px}.cnt small{font-size:10px;color:var(--dim)}
.cnt .pm{display:flex;gap:4px}.cnt .pm button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#1a2638;font-weight:900;cursor:pointer}
.cnt .pm button:disabled{opacity:.3}
.devlist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dev{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:14px;background:#0f1724}
.dev .e{font-size:26px}.dev div{flex:1}.dev b{display:block}.dev small{color:var(--dim);font-size:12px}
.dev button{min-height:38px;padding:0 14px;border-radius:10px;border:0;background:var(--aqua);color:#08262a;font-weight:900;cursor:pointer}.dev button:disabled{opacity:.35}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.diff button{min-height:44px;border-radius:12px;border:1px solid var(--line);background:#0f1724;font-weight:800;cursor:pointer}.diff button.on{border-color:var(--aqua);background:#173540}
.note{font-size:12px;color:var(--dim)}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:#0f1724;font-weight:800;text-decoration:none;color:var(--ink);cursor:pointer;font-size:15px}
.menu-list small{margin-left:auto;color:var(--dim);font-weight:600;font-size:12px}
.ulist{list-style:none;margin:8px 0;padding:0;max-height:300px;overflow:auto}.ulist li{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid #1d2838}.ulist li:first-child{border-top:0}.ulist li .mx{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid #2a3a52;background:#1a2536;color:#cbd6e3;font-size:13px}
.av{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--avc,#7ce9e5);background:color-mix(in srgb,var(--avc,#7ce9e5) 25%,#0c131e);font-size:17px;flex:none}
.ulist .nm{flex:1;font-weight:800}.ulist .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#57d49b;box-shadow:0 0 6px #57d49b;margin-left:6px}
.ulist button{min-height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#1a2638;font-weight:800;cursor:pointer}
.busy{display:inline-block;width:14px;height:14px;border:2px solid #7ce9e555;border-top-color:#7ce9e5;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}
.onl{display:none;align-items:center;gap:6px;font-size:12px;font-weight:800;color:#57d49b}.onl.on{display:flex}.onl.off{display:flex;color:#ff8a6b}
.primary{min-height:54px;border-radius:14px;border:0;background:var(--aqua);color:#08262a;font-weight:900;font-size:15px;letter-spacing:.03em;line-height:1.1;cursor:pointer}
.primary:disabled{opacity:.35}
.pill{min-height:54px;border-radius:14px;border:1px solid var(--line);background:#121b29;font-weight:800;cursor:pointer}
.pill:disabled{opacity:.38}
.dice{display:inline-flex;gap:6px;vertical-align:middle;margin-right:6px}
.die{width:30px;height:30px;border-radius:8px;background:#f4f7fe;color:#0b1019;display:inline-grid;place-items:center;font-weight:900;font-size:17px}
.die.roll{animation:roll .45s ease-out}
@keyframes roll{0%{transform:rotate(-200deg) scale(.6)}100%{transform:none}}
.log{font-size:12px;color:var(--dim);max-height:0;overflow:hidden;transition:max-height .25s}
.log.open{max-height:180px;overflow:auto}
.log p{margin:2px 0}
.modal[hidden]{display:none}
.modal{position:fixed;inset:0;z-index:20;background:#05080ecc;display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);max-height:90vh;overflow:auto;background:#121b29;border:1px solid #3a4a60;border-radius:18px;padding:16px;box-shadow:0 18px 60px #000c}
.sheet h2{margin:0 0 6px;font-size:22px;letter-spacing:.02em}
.sheet p{color:#cbd6e3;margin:6px 0}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.sheet .row>*{flex:1}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:6px}
.pick button{padding:8px 0;border-radius:12px;border:1px solid var(--line);background:#0f1724;display:flex;flex-direction:column;align-items:center;font-size:20px;cursor:pointer}
.pick button small{font-size:10px;color:var(--dim);font-weight:700}
.pick button.on{border-color:var(--aqua);background:#173540}
.pick button:disabled{opacity:.3}
.cost{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:#cbd6e3}
.cost b{color:#fff}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px;margin-top:8px;color:#cbd6e3}
.hgoal{margin:0 0 6px!important;color:#dfe8f3!important}
.hcard{background:#0f1724;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:8px}
.hcard h4{margin:0 0 4px;font-size:15px}.hcard h4 small{color:var(--dim);font-weight:700;font-size:12px}
.hcard p{margin:4px 0 0!important;font-size:13.5px;line-height:1.45}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}.hgrid span{display:flex;flex-direction:column;padding:6px 8px;border-radius:10px;background:#141f2f}.hgrid b{font-size:13px}.hgrid small{color:var(--dim);font-size:12px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1d2838}.hrow b{font-size:14px}.hrow b small{display:block;color:var(--dim);font-size:11.5px;font-weight:700}.hrow span{font-size:17px;letter-spacing:1px;white-space:nowrap}
.hlist{display:flex;flex-direction:column;gap:6px;margin-top:4px}.hlist span{display:flex;flex-direction:column}.hlist b{font-size:13.5px}.hlist small{color:#b9c6d6;font-size:12.5px;line-height:1.35}
.hfoot{position:sticky;bottom:-16px;background:linear-gradient(transparent,#121b29 30%);padding:14px 0 2px;margin-top:4px}
.float{position:absolute;pointer-events:none;font-weight:900;font-size:16px;animation:floatup 1.2s ease-out forwards;text-shadow:0 2px 6px #000}
@keyframes floatup{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
.boardwrap{touch-action:none}
#board{transform-origin:0 0}
.zoom-btn{position:absolute;right:8px;bottom:8px;z-index:2;width:38px;height:38px;border-radius:50%;border:1px solid #ffffff38;background:#0b1019b8;color:#fff;font-size:16px;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 4px 12px #0006;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.zoom-btn:active{transform:scale(.94)}
.boardwrap.zoomed{cursor:grab}
.banners{position:absolute;left:8px;right:8px;top:10px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:3}
.banner{max-width:100%;background:#0b1019eb;border:1px solid #3a4a60;border-radius:16px;padding:6px 14px;font-weight:800;font-size:13px;line-height:1.25;text-align:center;pointer-events:none;animation:bIn .18s ease-out}
@keyframes bIn{from{opacity:0;transform:translateY(-6px)}}

/* Distribución: el tablero ocupa el lugar que queda; en pantallas anchas va al costado del panel */
/* Pantalla completa sin depender de 100vh/100dvh: en el iPhone con la app instalada calcula mal el alto y quedaba aire abajo */
.app{position:fixed;top:0;left:0;right:0;margin:0 auto;height:var(--app-h,100%);min-height:0;max-width:640px;overflow-y:auto;overscroll-behavior:contain}
/* Toques en el celular (v59): la página nunca se desplaza (sólo la app y las ventanas por dentro) y en ningún lado hay zoom de doble toque.
   El touch-action no pasa de un panel que se desplaza a lo de adentro, por eso se pone en cada uno y en cada botón. */
html,body{height:100%;overflow:hidden}
.app,.modal,.sheet,.side,.side-panel,.log,button,a,label,.card,.pl,.bono{touch-action:manipulation}
@media (pointer:coarse){input,textarea,select{font-size:16px!important}}

.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.panel{display:contents}
.score{order:0}.boardcol{order:1}.status{order:2;min-height:40px}.log{order:3}.hand{order:4}.actions{order:5}.wide{order:6}
.boardcol{flex:1 1 0;min-height:150px;display:flex;align-items:center;justify-content:center}
.boardwrap{flex:none;max-width:100%}
@media (min-width:760px) and (min-aspect-ratio:1/1),(orientation:landscape) and (max-height:560px){
  .app{max-width:1400px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .main{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,30vw,400px);grid-template-rows:minmax(0,1fr);gap:16px}
  .boardcol{height:100%;min-height:0;order:0}
  .panel{order:1}
  .panel{display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:0;overflow-y:auto}
}
@media (orientation:landscape) and (max-height:560px){
  .app{gap:6px;padding-top:max(6px,env(safe-area-inset-top));padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .icon-btn{height:36px;min-width:36px}
  .panel{gap:6px}
  .pl{padding:4px 10px}.pl .vp{font-size:19px}
  .status{min-height:32px;font-size:13px}
  .card{padding:3px 2px}.card .e{font-size:17px}.card .n{font-size:15px}
  .act{min-height:42px}.pill,.primary{min-height:44px}
}
/* Menú lateral (misma norma en todos los juegos: se abre desde la derecha) */
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:#05080dcc}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#111a27;border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
@media (prefers-reduced-motion:reduce){.side-panel{animation:none}}
.side-head{display:flex;align-items:center;justify-content:space-between}
.side-head h2{margin:0;font-size:20px}
.side-x{width:44px;height:44px;border-radius:14px;border:0;background:#1a2536;font-size:18px;cursor:pointer}
.side .menu-list{margin-top:0}
.mode-pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 4px}
.mode-pick button{min-height:64px;border-radius:14px;border:1px solid var(--line);background:#0f1724;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:15px}
.mode-pick button small{font-size:11px;color:var(--dim);font-weight:600}
.mode-pick button.on{border-color:var(--aqua);background:#173540}

.die.p0{background:var(--me);color:#04263a;box-shadow:0 0 0 2px #04263a inset}
.die.p1{background:var(--cpu);color:#fff;box-shadow:0 0 0 2px #5a0b0e inset}
.die.p2{background:#f39c34;color:#3a1d00;box-shadow:0 0 0 2px #6b3a05 inset}.die.p3{background:#a06ae0;color:#fff;box-shadow:0 0 0 2px #3d1d6b inset}
/* De a 3 o 4: un panel chico por jugador, todos en una fila */
.score.multi{grid-template-columns:repeat(var(--np,3),minmax(0,1fr));gap:5px}
.score.multi .pl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"i n n" "s s v";gap:0 5px;padding:4px 7px;border-radius:11px;align-items:center}
.score.multi .pl i{grid-area:i;width:9px;height:9px}
.score.multi .pl b{grid-area:n;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.score.multi .pl small.st{grid-area:s;font-size:10.5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.score.multi .pl .vp{grid-area:v;font-size:17px;margin:0;line-height:1.1}.score.multi .pl .vp small{font-size:9px}
.vpick{display:grid;gap:8px;margin:10px 0}

</style>
<script>
/* ───────── SYNCRO: tu progreso en todos los dispositivos (v63) ─────────
   Va en todas las páginas. Con la cuenta abierta, lo que cada juego guarda en este dispositivo (preferencias,
   partidas en curso contra la compu, récords, rangos, XP, logros, regalos para la estancia…) también se guarda en
   la planilla (accion=sync, hoja «Partes»), y al abrir cualquier juego —o al volver a él— se trae lo del otro
   dispositivo y se junta con lo de acá:
   · cada clave guarda cuándo cambió por última vez: gana la más nueva (una partida en curso, una preferencia);
   · las listas se unen (partidas ya contadas), los récords se quedan con lo mejor, los contadores con lo mayor;
   · «rk» (rangos, XP y logros de todos los juegos) se junta con RANGOS.importData (que también trae LOGROS).
   Los cambios se notan solos (se envuelve localStorage.setItem): se suben a los pocos segundos y al salir.
   Cuando se trae algo nuevo, avisa con el evento «bloques-sync» {detail:{claves:[…], partes:[…]}} para que cada
   juego lo muestre (p. ej. retomar la partida del otro dispositivo).
   BloqueAR (su progreso, medallas, récords y apariencia) sigue con su sincronización de siempre (src/688_cuenta.js),
   y EstanciAR con la suya (hoja EstPriv). API: window.SYNCRO = {ahora(), estado(), html(), onEstado(fn), partes}. */
(function(){
'use strict';
if(window.SYNCRO)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
let ST;try{ST=window.localStorage;}catch(_){ST=null;}
const rawSet=ST?Storage.prototype.setItem:null,rawDel=ST?Storage.prototype.removeItem:null;
const ls={get(k){try{return ST.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?rawDel.call(ST,k):rawSet.call(ST,k,v);}catch(_){}},
  json(k,d){try{const v=JSON.parse(ST.getItem(k)||'null');return v??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const me=()=>{const a=acct();return a?String(a.usuario).toLowerCase():'';};
const dev=(()=>{let d=ls.get('sync-dev');if(!d){d=Math.random().toString(36).slice(2,10);ls.set('sync-dev',d);}return d;})();
const pruebas=/[?#&]sync-off\b/.test(location.href);

/* ── Qué se guarda de cada juego ──
   [clave, regla]: 'nuevo' (por defecto) · 'union' (lista) · 'min' / 'max' (objeto de números) · 'claves' (objeto: se
   suman las claves) · 'maxnum' (número) · 'recsol' (récords del solitario). «{me}» es tu usuario. */
const PARTES={
  truco:['truco-np','truco-meta','truco-dif','truco-lg-dif','truco-ayuda','truco-partida-v1','truco-eq-v1',['truco-xp-hechas','union']],
  uno:['uno-meta','uno-especial','uno-dif','uno-bots','uno-apilar','uno-ayuda','uno-mesa-n','uno-partida-v1',['uno-xp-hechas','union']],
  poblar:['poblar-dificultad','poblar-jugadores','poblar-jugadores-online','poblar-ayuda','poblar-partida-v2',['poblar-xp-hechas','union']],
  solos:['sudoku-dif','sudoku-errores','sudoku-ayuda','sudoku-partida-v1',['sudoku-records-v1','min'],['sudoku-dias-v1','claves'],['sudoku-xp-hechas','union'],
    'solitario-robo','solitario-consol','solitario-ayuda','solitario-partida-v1','solitario-racha',['solitario-records-v1','recsol'],['solitario-dias-v1','claves'],['solitario-xp-hechas','union']],
  pampa:['pampa-resultado','pampa-visto','pampa-resumen','pampa-cruce','pampa-copas','pampa-ayuda-9'],
  gen:[['bloques-novedades','maxnum'],['bloques-chat-read-{me}','max'],['bloques-chat-borr-{me}','max'],'bloques-chat-frase','bloques-chat-modo',
    'bloques-ranked-bloquear','bloques-ranked-poblar','bloques-ranked-truco','bloques-ranked-uno','bloques-ranked-estancia']
};
const RK_CLAVES=['bloques-rangos-v1','bloques-xpjuegos-v1','bloques-logros-v1'];
const clavesDe=n=>(PARTES[n]||[]).map(x=>{const [k,r]=Array.isArray(x)?x:[x,'nuevo'];return [k.replace('{me}',me()),r];});
let MAPA=null,MAPA_U='';
function parteDe(k){
  if(!MAPA||MAPA_U!==me()){MAPA=new Map();MAPA_U=me();for(const x of RK_CLAVES)MAPA.set(x,'rk');MAPA.set('estancia-premios','premios');MAPA.set('pampa-act','act');
    for(const n of Object.keys(PARTES))for(const [x] of clavesDe(n))MAPA.set(x,n);}
  return MAPA.get(k)||'';
}
// JSON con las claves ordenadas, para comparar sin falsos «cambió».
function canon(o){if(Array.isArray(o))return '['+o.map(canon).join(',')+']';if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';return JSON.stringify(o===undefined?null:o);}

/* ── Cuándo cambió cada clave (por dispositivo) ── */
const META_K='sync-meta-v1';
// Otra cuenta en este dispositivo: se arranca de cero y lo que quedó acá de la otra cuenta no se le sube a ésta
// (lo de la cuenta nueva gana; lo que sólo está acá se queda acá hasta que se vuelva a tocar).
function metaCargar(){let M=ls.json(META_K,{});if(M.u&&M.u!==me())M={ajena:true};return M;}
let META=metaCargar();
function metaSave(){META.u=me();ls.set(META_K,JSON.stringify(META));}
function hash(s){if(s==null)return '∅';let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+':'+s.length;}
// Mira si cambió algo desde la última vez. «t» = ahora; lo que nunca se miró en este dispositivo arranca en t=1
// (así, si la cuenta tiene algo más nuevo, gana la cuenta).
function revisar(n){const M=(META[n]=META[n]||{});let ch=false;
  for(const [k] of clavesDe(n)){const v=ls.get(k),h=hash(v),m=M[k];
    if(!m){M[k]={h,t:v==null?0:1};}else if(m.h!==h){M[k]={h,t:Date.now()};ch=true;}}
  return ch;}
function exportar(n){revisar(n);const M=META[n]||{},k={};
  for(const [x] of clavesDe(n)){const m=M[x];if(!m)continue;const v=ls.get(x);if(v==null&&!m.t)continue;k[x]=[v,m.t||0];}
  return {k};}
const J=s=>{try{return JSON.parse(s);}catch(_){return null;}};
function juntarValor(regla,a,b){   // a = lo de acá, b = lo de la cuenta (strings)
  if(a==null)return b;if(b==null)return a;
  const A=J(a),B=J(b);
  if(regla==='union'&&Array.isArray(A)&&Array.isArray(B)){const o=[...A];for(const x of B)if(!o.includes(x))o.push(x);return JSON.stringify(o.slice(-120));}
  if((regla==='min'||regla==='max')&&A&&B&&typeof A==='object'&&typeof B==='object'){const o={...A};
    for(const [x,v] of Object.entries(B))if(Number.isFinite(v)&&(!Number.isFinite(o[x])||(regla==='min'?v<o[x]:v>o[x])))o[x]=v;return JSON.stringify(o);}
  if(regla==='claves'&&A&&B&&typeof A==='object'&&typeof B==='object')return JSON.stringify({...B,...A});
  if(regla==='maxnum'){const x=Number(a),y=Number(b);return Number.isFinite(x)&&Number.isFinite(y)?String(Math.max(x,y)):a;}
  if(regla==='recsol'&&A&&B){const o={...A};for(const [x,r] of Object.entries(B)){const q=o[x]||{};o[x]={t:q.t&&r.t?Math.min(q.t,r.t):(q.t||r.t),p:Math.max(q.p||0,r.p||0)};}return JSON.stringify(o);}
  return null;   // 'nuevo': decide la fecha
}
function importar(n,R){const out=[];if(!R||!R.k)return out;revisar(n);const M=META[n]=META[n]||{},ajena=!!META.ajena;
  for(const [x,regla] of clavesDe(n)){const r=R.k[x];if(!Array.isArray(r))continue;const [rv,rt]=r,lv=ls.get(x),m=M[x]||{h:hash(lv),t:0};
    let nv=lv,nt=m.t||0;
    if(ajena){if(rv!==lv){nv=rv;nt=rt||1;}}   // lo de acá es de otra cuenta: gana la cuenta
    else if(regla!=='nuevo'&&lv!=null&&rv!=null){const j=juntarValor(regla,lv,rv);if(j!=null){nv=j;nt=Math.max(nt,rt||0);}}
    else if((rt||0)>(m.t||0)){nv=rv;nt=rt;}
    if(nv!==lv){ls.set(x,nv);out.push(x);}
    M[x]={h:hash(nv),t:nt};}
  metaSave();return out;}

/* ── Partes especiales ── */
// Rangos, XP y logros de todos los juegos.
const RK={exportar(){try{return window.RANGOS?RANGOS.exportData():null;}catch(_){return null;}},
  importar(d){try{return window.RANGOS&&d?!!RANGOS.importData(d):false;}catch(_){return false;}}};
// Regalos para la estancia (los deja cada juego; los cobra EstanciAR). Se juntan las colas de los dos dispositivos
// y lo que ya se cobró en uno no se vuelve a cobrar en el otro.
const PRC='sync-premios-c';
const idP=x=>String(x&&x.t)+'|'+String(x&&x.de);
const PREM={exportar(){return {q:ls.json('estancia-premios',[]),c:ls.json(PRC,[])};},
  importar(d){if(!d)return false;const c=new Set([...ls.json(PRC,[]),...(d.c||[])]),q=[],ids=new Set();
    for(const x of [...ls.json('estancia-premios',[]),...(d.q||[])]){const id=idP(x);if(ids.has(id)||c.has(id))continue;ids.add(id);q.push(x);}
    const antes=ls.get('estancia-premios')||'[]',nuevo=JSON.stringify(q.slice(-40));
    ls.set(PRC,JSON.stringify([...c].slice(-200)));if(nuevo!==antes){ls.set('estancia-premios',nuevo);return true;}return false;}};
// Lo que jugaste hoy para La Gran Pampa: cada dispositivo cuenta lo suyo y en «pampa-act» queda la suma.
const ACT={hoy(){return new Date(Date.now()-3*3600e3).toISOString().slice(0,10);},   // el mismo día que RANGOS.pampaAct (hora argentina)
  F:['b','p','e','t','u'],
  mio(){const L=ls.json('pampa-act',null),O=ls.json('sync-act-otros',null),h=this.hoy(),o={};
    for(const f of this.F)o[f]=L&&L.d===h?Math.max(0,(L[f]|0)-(O&&O.d===h?(O.s[f]|0):0)):0;return o;},
  exportar(){const h=this.hoy(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};por[dev]=this.mio();return {d:h,por};},
  importar(d){const h=this.hoy();if(!d||d.d!==h)return false;const mio=this.mio(),P=ls.json('sync-act-por',null),por=P&&P.d===h?{...P.por}:{};
    for(const [dv,x] of Object.entries(d.por||{})){if(dv===dev)continue;const y=por[dv]||{};por[dv]={};for(const f of this.F)por[dv][f]=Math.max(x[f]|0,y[f]|0);}
    const s={};for(const f of this.F)s[f]=Object.entries(por).reduce((a,[dv,x])=>dv===dev?a:a+(x[f]|0),0);
    ls.set('sync-act-por',JSON.stringify({d:h,por}));ls.set('sync-act-otros',JSON.stringify({d:h,s}));
    const L={d:h};for(const f of this.F)L[f]=mio[f]+s[f];const antes=ls.get('pampa-act'),nuevo=JSON.stringify(L);
    if(antes!==nuevo){ls.set('pampa-act',nuevo);return true;}return false;}};
const ESPECIALES={rk:RK,premios:PREM,act:ACT};
const TODAS=[...Object.keys(PARTES),'rk','premios','act'];
function datosDe(n){return ESPECIALES[n]?ESPECIALES[n].exportar():exportar(n);}

/* ── Red ── */
async function call(p,ms=15000,keep=false){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow',keepalive:keep});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}

/* ── Estado (para el indicador del menú) ── */
const E={st:'',t:Number(ls.get('sync-ultimo')||0),err:'',sub:new Set()};
function setSt(st,err){E.st=st;E.err=err||'';if(st==='ok'){E.t=Date.now();ls.set('sync-ultimo',String(E.t));}for(const f of E.sub)try{f(E);}catch(_){}pintar();}
function hace(t){if(!t)return '';const s=(Date.now()-t)/1000;return s<60?'recién':s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} días`;}
function texto(){if(!acct())return '';if(E.st==='busy')return '☁️ Guardando en tu cuenta…';if(E.st==='off')return '☁️ Sin conexión: se guarda cuando vuelva';
  if(E.st==='err')return '☁️ No se pudo guardar en tu cuenta';return E.t?`☁️ ✓ Guardado en tu cuenta · ${hace(E.t)}`:'☁️ Se guarda en tu cuenta';}
function html(){const t=texto();return t?`<div class="sync-st" data-sync-st>${t}</div>`:'';}
function pintar(){const t=texto();document.querySelectorAll('[data-sync-st]').forEach(el=>{el.textContent=t;});}
// Si el menú del juego se abre, el renglón aparece solo debajo del rango (rk-mine) o al principio del menú.
function css(){if(document.getElementById('sync-css'))return;const s=document.createElement('style');s.id='sync-css';
  s.textContent='.sync-st{font:500 12px/1.3 system-ui,-apple-system,sans-serif;color:#93a1b6;opacity:.9;margin:-4px 0 10px;text-align:left}';(document.head||document.documentElement).appendChild(s);}
function engancharMenu(){if(!acct())return;
  const box=document.getElementById('side-panel');if(!box)return;const L=box.querySelector('.menu-list');   // sólo en el menú principal del juego
  if(!L||box.querySelector('[data-sync-st]'))return;css();
  const d=document.createElement('div');d.className='sync-st';d.dataset.syncSt='';d.textContent=texto();L.before(d);}

/* ── El ciclo: traer, juntar, subir ── */
const SUC={busy:false,again:false,dirty:new Set(),timer:0,last:0,pullT:0,primero:true};
function marcar(n){if(!n||pruebas)return;SUC.dirty.add(n);clearTimeout(SUC.timer);
  const espera=Math.max(4000,20000-(Date.now()-SUC.last));SUC.timer=setTimeout(()=>ahora(false),espera);}
async function ahora(bajar=true,keep=false){
  const a=acct();if(!a||pruebas)return;
  if(SUC.busy){SUC.again=true;return;}SUC.busy=true;clearTimeout(SUC.timer);setSt('busy');
  try{
    let traidos=[],partes=[];const ajena=!!META.ajena;
    if(bajar||SUC.primero){
      const j=await call({accion:'sync',usuario:a.usuario,token:a.token,bajar:true},15000,keep);
      SUC.pullT=Date.now();SUC.primero=false;
      if(j.version!==undefined&&!j.partes)throw new Error('vieja');
      const P=j.partes||{};
      if(ajena){for(const k of RK_CLAVES)ls.set(k,null);partes.push('rk');}   // otra cuenta: los rangos y logros de acá no se mezclan
      for(const n of TODAS){const r=P[n];if(!r)continue;const d=J(r.d);if(!d)continue;
        if(ESPECIALES[n]){if(ESPECIALES[n].importar(d))partes.push(n);}
        else{const ch=importar(n,d);if(ch.length){traidos.push(...ch);partes.push(n);}}}
      // lo que acá es distinto de la cuenta, se sube
      for(const n of TODAS){const r=P[n];const mio=datosDe(n);if(!mio)continue;
        const vacio=ESPECIALES[n]?(n==='rk'?false:n==='premios'?!(mio.q.length||mio.c.length):!Object.values(mio.por).some(x=>Object.values(x).some(v=>v))):!Object.keys(mio.k).length;
        if(vacio&&!r)continue;if(ajena&&!r)continue;if(!r||canon(mio)!==canon(J(r.d)))SUC.dirty.add(n);}
      if(ajena){META.ajena=false;metaSave();}
    }
    const subir=[...SUC.dirty].map(n=>{const d=datosDe(n);return d?{n,d:JSON.stringify(d),t:Date.now()}:null;}).filter(x=>x&&x.d.length<45000);
    SUC.dirty.clear();
    if(subir.length){await call({accion:'sync',usuario:a.usuario,token:a.token,subir},15000,keep);SUC.last=Date.now();}
    setSt('ok');
    if(partes.length)try{window.dispatchEvent(new CustomEvent('bloques-sync',{detail:{claves:traidos,partes}}));}catch(_){}
  }catch(e){
    const m=String(e&&e.message||e);
    if(/sesión venció/i.test(m)){setSt('err','Tu sesión venció.');}
    else if(m==='vieja'||/Acción desconocida/.test(m)){setSt('err','La planilla todavía no tiene la versión nueva.');}
    else{setSt(navigator.onLine===false||e instanceof TypeError||e.name==='AbortError'?'off':'err',m);for(const n of TODAS)if(n)SUC.dirty.add(n);}
  }finally{SUC.busy=false;if(SUC.again){SUC.again=false;setTimeout(()=>ahora(true),300);}}
}

/* ── Notar los cambios: cada vez que un juego guarda algo de una parte, se programa la subida ── */
if(ST&&!pruebas){
  Storage.prototype.setItem=function(k,v){
    if(this===ST&&k==='estancia-premios'){   // lo que desaparece de la cola es lo que la estancia ya cobró
      try{const antes=J(ST.getItem(k))||[],ahoraL=J(String(v))||[],quedan=new Set(ahoraL.map(idP)),cob=antes.filter(x=>!quedan.has(idP(x))).map(idP);
        if(cob.length){const c=ls.json(PRC,[]);for(const x of cob)if(!c.includes(x))c.push(x);rawSet.call(ST,PRC,JSON.stringify(c.slice(-200)));}}catch(_){}}
    rawSet.call(this,k,v);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
  Storage.prototype.removeItem=function(k){rawDel.call(this,k);if(this===ST){const n=parteDe(k);if(n)marcar(n);}};
}
function arrancar(){
  if(!acct()||pruebas)return;
  setTimeout(()=>ahora(true),600);
  document.addEventListener('visibilitychange',()=>{

<script>
/* ───────── RECON: volver a la partida después de un corte (v63) ─────────
   Para todos los juegos en línea. Cuando alguien se corta (se le fue la señal, subió al micro, cerró la app sin
   querer), no se lo da por ido enseguida: hay RECON.GRACIA (60 s) para que vuelva. Mientras tanto la mesa muestra
   «X se cortó · esperándolo… 0:42»; si le toca jugar, juega la compu por él (TrucAR de a 4/6, UnoAR, PoblAR) o el
   juego espera (TrucAR de a 2, el duelo de BloqueAR). Si vuelve, recupera su lugar y su mano.
   Cómo vuelve: el que lleva la mesa le manda solo una invitación nueva por la planilla (con «re»: el id de la mesa,
   así no deja tarjeta en el chat) y el que se cortó la acepta solo, sin preguntar, porque reconoce la mesa
   (RECON.recordar la guarda en este dispositivo mientras dura la partida: así funciona también si reabre la app).
   API (window.RECON):
   · GRACIA                         ms de espera (60.000).
   · recordar(juego, info) / recuerdo(juego) / olvidar(juego)   la mesa en la que estás (info: {mesa, host, seat, …}).
     recuerdo() devuelve null si pasó más de GRACIA desde el último recordar() (la partida ya no te espera).
   · cartel(id, texto, hasta, onFin)   un renglón arriba con cuenta regresiva: «texto · 0:42». Al llegar a 0 llama onFin.
     quitar(id)                       lo saca.  ·  mmss(ms) → «0:42».
   · reinvitar({prefijo, para, oferta, onRespuesta, hasta, vivo})  (el que lleva la mesa) manda la invitación de
     vuelta y espera la respuesta; reintenta si no hay red. «oferta» es un objeto: se le agrega re. Devuelve
     {cancelar()}. onRespuesta(sdp, id, crudo) cuando el otro aceptó. «re» (opcional): el id de la mesa (si no, oferta.mesa). vivo() → false para dejar de esperar.
   · buscarVuelta({prefijo, mesa, de, hasta, onInv, vivo})  (el que se cortó) consulta el buzón cada 2,5 s hasta
     encontrar la invitación de vuelta de esa mesa y llama onInv(inv). Devuelve {cancelar()}.
   · esVuelta(inv, prefijo, mesa)   ¿es la invitación de vuelta de esa mesa? */
(function(){
'use strict';
if(window.RECON)return;
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const GRACIA=Number(ls.get('recon-gracia'))||60000;   // (las pruebas la pueden achicar)
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function call(p,ms=12000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{const r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;}
  finally{clearTimeout(to);}
}
/* ── La mesa en la que estás ── */
function recordar(juego,info){ls.set('recon-'+juego,JSON.stringify({...info,t:Date.now()}));}
function recuerdo(juego){const o=ls.json('recon-'+juego,null);return o&&Date.now()-(o.t||0)<GRACIA?o:null;}
function olvidar(juego){ls.set('recon-'+juego,null);}
/* ── Cartel con cuenta regresiva ── */
const CART=new Map();
function mmss(ms){const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function css(){if(document.getElementById('recon-css'))return;const s=document.createElement('style');s.id='recon-css';
  s.textContent=`.recon-bar{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.recon-bar>div{pointer-events:auto;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:rgba(20,26,34,.92);color:#f4f1e8;border:1px solid rgba(242,193,78,.55);box-shadow:0 6px 20px rgba(0,0,0,.35);font:600 13.5px/1.3 system-ui,-apple-system,sans-serif;max-width:100%}
.recon-bar>div i{font-style:normal}.recon-bar>div b{font-variant-numeric:tabular-nums;color:#f2c14e;margin-left:auto}
.recon-bar .recon-sp{width:12px;height:12px;border-radius:50%;border:2px solid #f2c14e;border-right-color:transparent;animation:recon-g 1s linear infinite;flex:none}
@keyframes recon-g{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.recon-bar .recon-sp{animation:none}}`;
  (document.head||document.documentElement).appendChild(s);}
function barra(){let b=document.querySelector('.recon-bar');if(!b){css();b=document.createElement('div');b.className='recon-bar';b.setAttribute('role','status');b.setAttribute('aria-live','polite');document.body.appendChild(b);}return b;}
function cartel(id,texto,hasta,onFin){quitar(id);const el=document.createElement('div');el.dataset.recon=id;
  el.innerHTML='<span class="recon-sp" aria-hidden="true"></span><span class="recon-t"></span><b></b>';el.querySelector('.recon-t').textContent=texto;barra().appendChild(el);
  const pinta=()=>{const r=hasta-Date.now();el.querySelector('b').textContent=mmss(r);if(r<=0){quitar(id);try{onFin&&onFin();}catch(e){console.warn(e);}}};
  pinta();const iv=setInterval(pinta,500);CART.set(id,{el,iv});return el;}
function quitar(id){const c=CART.get(id);if(!c)return;clearInterval(c.iv);c.el.remove();CART.delete(id);}
/* ── El que lleva la mesa: manda la invitación de vuelta y espera ── */
function reinvitar(o){
  let vivo=true,id='';const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{
    const a=acct();if(!a)return;
    while(!fin()&&!id){try{const j=await call({accion:'invitar',usuario:a.usuario,token:a.token,para:o.para,oferta:o.prefijo+JSON.stringify({...o.oferta,re:String(o.re||o.oferta.mesa||'')})});id=j.id;}catch(_){await sleep(2500);}}
    while(!fin()){await sleep(2000);if(fin())break;
      let r;try{r=await call({accion:'buzon',usuario:a.usuario,token:a.token,id});}catch(_){continue;}
      if(r.estado==='aceptada'&&r.respuesta){vivo=false;let sdp='';try{sdp=JSON.parse(r.respuesta).sdp||'';}catch(_){}o.onRespuesta(sdp,id,r.respuesta);return;}   // (raw: para respuestas que no son JSON, como las de BloqueAR)
      if(r.estado==='rechazada'||r.estado==='cancelada'||r.estado==='vencida')break;}
    if(id){try{await call({accion:'cancelar',usuario:a.usuario,token:a.token,id});}catch(_){}}
  })();
  return {cancelar(){vivo=false;},get id(){return id;}};
}
/* ── El que se cortó: busca la invitación de vuelta ── */
function esVuelta(inv,prefijo,mesa){const of=String(inv&&inv.oferta||'');if(!of.startsWith(prefijo))return false;
  try{const o=JSON.parse(of.slice(prefijo.length));return !!o.re&&String(o.re)===String(mesa);}catch(_){return false;}}
function buscarVuelta(o){
  let vivo=true;const fin=()=>!vivo||Date.now()>o.hasta||(o.vivo&&!o.vivo());
  (async()=>{const a=acct();if(!a)return;
    while(!fin()){
      try{const j=await call({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
        if(inv&&esVuelta(inv,o.prefijo,o.mesa)&&(!o.de||String(inv.de).toLowerCase()===String(o.de).toLowerCase())){vivo=false;o.onInv(inv);return;}}catch(_){}
      await sleep(2500);}
  })();
  return {cancelar(){vivo=false;}};
}
window.RECON={GRACIA,recordar,recuerdo,olvidar,cartel,quitar,mmss,reinvitar,buscarVuelta,esVuelta};
})();

</script>
<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',truco:'TrucAR',uno:'UnoAR',ajedrez:'AjedrezAR'};
// Solitarios (v62): no tienen rango (no son competitivos), pero su XP suma al nivel general.
const SOLOS={sudoku:'SudokAR',solitario:'SolitARio'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
// ranked: sólo las partidas ranked (las que mueven el rango) dan leguas para La Gran Pampa (pedido del usuario, v56).
function premio(de,xp,ranked){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  // v63: para no inflar la estancia, cada partida da su XP en pesos (hasta 300) y, en el mismo día, rinde menos a medida que juntás:
  // los primeros 600 🪙 enteros, hasta 1.200 a la mitad y después a un cuarto (nunca menos de 5).
  const d=new Date(),dia=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`,PD=ls.json('estancia-premios-dia',{}),ya=PD.d===dia?PD.n||0:0;
  const pesos=Math.max(5,Math.round(Math.min(300,n)*(ya<600?1:ya<1200?.5:.25)));ls.set('estancia-premios-dia',JSON.stringify({d:dia,n:ya+pesos}));
  const p={de,trigo:0,pesos,t:Date.now()};
  const L=ls.json('estancia-premios',[]);L.push(p);ls.set('estancia-premios',JSON.stringify(L.slice(-40)));
  return {...p,ranked:!!ranked,leguas:ranked?pampaAct(de==='PoblAR'?'p':de==='TrucAR'?'t':de==='UnoAR'?'u':de==='AjedrezAR'?'a':'b'):0};
}
// La Gran Pampa: lo que jugás cada día da leguas para el mapa (las cobra el mapa al abrirse; la planilla pone los topes).
// Por día: BloqueAR 1 por partida ranked (hasta 4), PoblAR y TrucAR 2 por partida ranked (hasta 2) y EstanciAR 1 por cosecha (hasta 4).
const PAMPA_ACT={b:{tope:4,v:1},p:{tope:2,v:2},e:{tope:4,v:1},t:{tope:2,v:2},u:{tope:2,v:2},a:{tope:2,v:2}};
function pampaAct(q){
  const A=PAMPA_ACT[q];if(!A)return 0;
  // día en hora argentina, como la planilla
  const dia=new Date(Date.now()-3*3600e3).toISOString().slice(0,10),X=ls.json('pampa-act',{}),o=X.d===dia?X:{d:dia,b:0,p:0,e:0,t:0,u:0,a:0};
  o[q]=(o[q]||0)+1;ls.set('pampa-act',JSON.stringify(o));
  const a=ls.json('bloques-acct-v1',null);
  return o[q]<=A.tope&&a&&a.usuario?A.v:0;
}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0)+Object.keys(SOLOS).reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0)+Object.keys(SOLOS).reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){const o={r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};try{if(window.LOGROS)o.lg=window.LOGROS.exportData();}catch(_){}return o;}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  // Rangos (v63): juego por juego, para no perder lo que jugaste en el otro dispositivo: queda el que tiene más
  // partidas ranked; si empatan, el de la última partida más nueva.
  const r=ls.json(RKEY,{});
  if(d.r&&typeof d.r==='object'){const L=r.j||{},R=d.r.j||{},J={...L};let rc=false;
    const ult=x=>{const h=(x&&x.hist)||[];return h.length?Number(h[h.length-1].t||0):0;};
    for(const [g,x] of Object.entries(R)){if(!x||typeof x!=='object')continue;const y=L[g];
      if(!y||(x.n||0)>(y.n||0)||((x.n||0)===(y.n||0)&&ult(x)>ult(y))){if(JSON.stringify(x)!==JSON.stringify(y)){J[g]=x;rc=true;}}}
    if(rc){ls.set(RKEY,JSON.stringify({...r,j:J,at:Math.max(r.at||0,d.r.at||0)}));ch=true;}}
  const x=ls.json(XKEY,{});if(d.x){const o={...x};for(const [k,v] of Object.entries(d.x))if(k!=='at'&&Number.isFinite(v)&&v>(o[k]||0)){o[k]=v;ch=true;}if(ch){o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}}
  // Logros y retos (v60): se unen; si acá hay algo que la planilla no tiene, se avisa que cambió para que se suba.
  try{if(window.LOGROS){const L=window.LOGROS.importData(d.lg||{});if(L.ch||L.falta)ch=true;}}catch(_){}
  return ch;
}
function badge(v,small){const i=info(v);return `<span class="rk-badge${small?' sm':''}" style="--rk:${i.t.c}" title="${i.label}${i.next!=null?` · ${i.pr}/${DIV} PR`:''}"><i>${i.t.e}</i>${i.short}</span>`;}
const CSS=`.rk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent);background:color-mix(in srgb,var(--rk) 16%,#0c131e);color:var(--rk);font:800 11.5px/1.3 system-ui,-apple-system,sans-serif;white-space:nowrap;vertical-align:middle}

// El rango de un juego, para el menú de ese juego.
function mine(g){if(!GAMES[g])return '';const r=get(g),i=info(r.v),L=levelInfo(xp(g));
  return `<div class="rk-mine" style="--rk:${i.t.c}"><div><b>Tu rango en ${GAMES[g]}</b><small>Nivel ${L.lv}${r.n?` · ${r.n} ${r.n===1?'partida ranked':'partidas ranked'}`:' · todavía sin partidas ranked'}</small>${i.next!=null?`<div class="rk-bar"><i style="width:${i.pct*100}%"></i></div>`:''}</div>${badge(r.v)}</div>`;}

/* ── Datos guardados ── */
function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}
function save(o){o.at=Date.now();ls.set(KEY,JSON.stringify(o));}
const cnt=(o,j)=>(o.c[j]=o.c[j]||{});
const tiene=(o,j,id)=>!!(o.g[j]&&o.g[j][id]);

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;}
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&(R.GAMES[j]||(R.SOLOS&&R.SOLOS[j])))R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);return out;}
  for(const [k,n] of finEventos(j,d))sumar(o,j,k,n);
  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  return out;
}

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;

async function call(p,post=true,ms=15000){

const cs=window.crypto&&window.crypto.subtle;

  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);

async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);

/* ── Datos guardados en este dispositivo ── */

function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}

/* ── Consultas periódicas ── */
function schedule(){

async function poll(){

    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    const pend=invPendientes();if(pend.length)p.invs=pend;
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}

    if(j.borr&&aplicarBorrados(j.borr)&&S.open){$('.cx-panel').dataset.sig='';render();badges();}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}

}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id)||!nombreOk(m.de)||!nombreOk(m.para)||borradoLocal(m))continue;
    // Si un «No se mandó» en realidad sí llegó (se cortó la respuesta), se reemplaza por el de la planilla.
    if(lc(m.de)===lc(S.me)&&typeof m.p==='string'){const i=S.msgs.findIndex(x=>x.tmp&&lc(x.para)===lc(m.para)&&x.p===m.p&&Math.abs(x.t-m.t)<5*60e3);if(i>=0){delete S.plain[S.msgs[i].id];S.msgs.splice(i,1);}}

/* ── Cartas de desarrollo ── */
function buyDev(p){
  if(!G||G.phase!=='main'||G.turn!==p||!can(p,'dev')||!G.deck.length)return false;pay(p,'dev');const k=G.deck.pop();G.p[p].dev.push({k,t:G.turnNo});
  addLog(`${W(p)} ${p===0&&!ON?`compraste una carta: ${DEV[k].e} ${DEV[k].n}`:'compró una carta'}.`);checkWin();save();render();return true;
}
const playable=(p,c)=>c.k!=='procer'&&c.t<G.turnNo&&!G.devUsed&&G.turn===p&&(c.k==='gaucho'?['roll','main'].includes(G.phase):G.phase==='main');
function playDev(p,i,arg){
  const c=G.p[p].dev[i];if(!c||!playable(p,c))return false;
  G.p[p].dev.splice(i,1);G.devUsed=true;if(p===0)lgEv('cartas');const o=NP()===2?1-p:null,os=others(p);
  addLog(`${W(p)} ${V(p,'jugaste','jugó')} ${DEV[c.k].e} ${DEV[c.k].n}.`);
  const fx=c.k==='gaucho'?'mueve al cuatrero':c.k==='obra'?'2 caminos gratis':c.k==='cosecha'?(Array.isArray(arg)?'toma '+arg.map(r=>RI[r].e).join(''):'2 recursos'):c.k==='acopio'&&RI[arg]?(NP()>2?(p===0?'te llevás todas las '+RI[arg].e:'se lleva todas las '+RI[arg].e):p===0?'te llevás sus '+RI[arg].e:'se lleva tus '+RI[arg].e):'';
  banner(`${DEV[c.k].e} ${p===0?'':G.p[p].name.toUpperCase()+' JUGÓ '}${DEV[c.k].n.toUpperCase()}${fx?' · '+fx.toUpperCase():''}`);
  if(p!==0&&!ON)cartaGrande(c.k,G.p[p].name,1);else for(const q of os){if(c.k!=='acopio'&&c.k!=='gaucho')aviso(q,DEV[c.k].e,`${nombreReal(p)} jugó ${DEV[c.k].n}`,fx||'',{carta:c.k,quien:nombreReal(p),de:p});else if(c.k==='gaucho')aviso(q,'🐎',`${nombreReal(p)} jugó Gaucho`,'mueve al cuatrero',{carta:'gaucho',quien:nombreReal(p),de:p});}
  if(c.k==='gaucho'){G.p[p].gauchos++;updateArmy();G.after=G.phase;G.phase='robber';G.byGaucho=true;}
  else if(c.k==='obra'){G.free=Math.min(2,LIMIT.road-G.p[p].road);if(!roadSpots(p).length)G.free=0;if(p===0&&G.free)mode='road';}
  else if(c.k==='cosecha'){for(const r of arg)G.p[p].hand[r]++;addLog(`${W(p)} ${V(p,'tomaste','tomó')} ${arg.map(r=>RI[r].e).join('')}.`);}
  else if(c.k==='acopio'){let tot=0;
    for(const q of os){const n=G.p[q].hand[arg];G.p[q].hand[arg]=0;G.p[p].hand[arg]+=n;tot+=n;
      aviso(q,'🏚️',`${nombreReal(p)} se llevó tus ${RI[arg].e}`,n?`jugó Acopio, eligió ${RI[arg].n.toLowerCase()} y se llevó todas las tuyas: ${n}.`:`jugó Acopio y eligió ${RI[arg].n.toLowerCase()}, pero no tenías.`,{k:'acopio',r:Array(Math.min(n,6)).fill(arg),carta:'acopio',quien:nombreReal(p),de:p});
      if(p===0&&n)for(let i=0;i<Math.min(n,6);i++)setTimeout(()=>vuela(arg,$('pl'+q),$('c-'+arg)),i*140);}
    addLog(`${W(p)} se ${V(p,'llevaste','llevó')} ${tot}${RI[arg].e} ${NP()===2?'del rival':'de los demás'}.`);}
  checkWin();save();render();return true;
}
function updateArmy(){
  const g=seats().map(p=>G.p[p].gauchos||0),prev=G.army;
  for(const p of seats())if(g[p]>=3&&G.army!==p&&(G.army===null?others(p).every(q=>g[p]>g[q]):g[p]>g[G.army]))G.army=p;
  if(G.army!==prev){addLog(`🐎 ${W(G.army)} ${V(G.army,'tenés','tiene')} la tropilla más grande (+2).`);banner(`🐎 TROPILLA MÁS GRANDE · ${G.p[G.army].name.toUpperCase()}`);}
}
/* ── Cambios con el rival ── */
// Cuánto le sirve a la compu cada recurso según lo que le falta para construir.
function needValue(p){
  const h=G.p[p].hand,val={madera:1,ladrillo:1,lana:1,trigo:1,mineral:1};
  const goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');goals.push('road');if(G.deck.length)goals.push('dev');
  goals.forEach((g,gi)=>{for(const r of RES){const need=(COST[g][r]||0)-h[r];if(need>0)val[r]+=(gi===0?1.4:.6)*Math.min(2,need);}});
  for(const r of RES)if(h[r]>=4)val[r]*=.6;
  return val;
}
function botAcceptsOffer(give,want,b=1){// give: lo que le das a la compu; want: lo que pedís; b: qué compu
for(const r of RES)if(G.p[b].hand[r]<want[r])return {ok:false,why:'No tengo esas cartas.'};
  if(vp(0)>=goal()-2)return {ok:false,why:'Estás muy cerca de ganar, no te ayudo 😏'};
  const nIn=RES.reduce((s,r)=>s+give[r],0),nOut=RES.reduce((s,r)=>s+want[r],0);
  if(nOut>nIn+(G.diff==='facil'?1:0))return {ok:false,why:`¿${nOut} por ${nIn}? ¡Ni loco! 😂`};
  const v=needValue(b),inV=RES.reduce((s,r)=>s+v[r]*give[r],0),outV=RES.reduce((s,r)=>s+v[r]*want[r],0);
  const k={facil:.85,normal:1.1,dificil:1.35}[G.diff]||1.1;
  return inV>=outV*k?{ok:true}:{ok:false,why:'Mmm, no me conviene.'};
}
function swapCards(give,want,t=1){lgEv('cambios');for(const r of RES){G.p[0].hand[r]-=give[r];G.p[t].hand[r]+=give[r];G.p[t].hand[r]-=want[r];G.p[0].hand[r]+=want[r];}
  const f=o=>RES.filter(r=>o[r]).map(r=>`${o[r]}${RI[r].e}`).join(' ');addLog(ON?`🤝 ${W(0)} cambió con ${W(t)}: dio ${f(give)} y recibió ${f(want)}.`:`🤝 Cambio con ${quien(t)}: das ${f(give)} y recibís ${f(want)}.`);save();render();}

/* ── Turno de la compu ── */
function vertValue(p,v,setup=false){
  if(!freeSpot(v))return -1;let s=0;const have=new Set();
  for(let x=0;x<B.verts.length;x++)if(G.owner[x]===p)for(const h of B.verts[x].hexes)have.add(B.hexes[h].res);
  const kinds=new Set();
  for(const h of B.verts[v].hexes){const H=B.hexes[h];if(H.res==='salitral')continue;s+=pips(H.num)*(h===G.robber?.4:1);kinds.add(H.res);}
  for(const k of kinds)if(!have.has(k))s+=setup?2.2:1.2;
  if(kinds.has('trigo')||kinds.has('mineral'))s+=.6;
  if(B.verts[v].port)s+=B.verts[v].port==='3:1'?1:(kinds.has(B.verts[v].port)?2:.5);
  return s;
}
// Camino que acerca a la mejor esquina libre (búsqueda en anchura desde la red propia).
function bestRoadToward(p){
  const start=[];for(let v=0;v<B.verts.length;v++)if(G.owner[v]===p||(G.owner[v]===null&&B.verts[v].edges.some(e=>G.road[e]===p)))start.push(v);
  const prev=new Map(),dist=new Map(),q=[];for(const v of start){dist.set(v,0);q.push(v);}
  let best=null,bestScore=-1;
  while(q.length){const v=q.shift(),d=dist.get(v);if(d>=4)continue;
    for(const e of B.verts[v].edges){if(G.road[e]!==null)continue;const {a,b}=B.edges[e],w=a===v?b:a;if(dist.has(w)||(G.owner[w]!==null&&G.owner[w]!==p))continue;
      dist.set(w,d+1);prev.set(w,[v,e]);q.push(w);
      const val=vertValue(p,w);if(val>0){const sc=val-d*1.6;if(sc>bestScore){bestScore=sc;best=w;}}}}
  if(best===null)return null;let w=best,e=null;while(prev.has(w)){const [v,ee]=prev.get(w);e=ee;if(dist.get(v)===0)break;w=v;}
  return e;
}
// Cada jugada de la compu tiene su ficha: si mientras espera empieza otra partida (o arranca otra jugada),
// la vieja se corta en la próxima espera y no toca nada más.
let BOTTOK=0;const STOP={};
async function botTurn(){
  const g0=G,p=G.turn,o=NP()===2?1-p:lead(p),tok=++BOTTOK;
  const alive=()=>G===g0&&BOTTOK===tok&&G.turn===p&&G.p[p].bot&&G.phase!=='over';
  const wait=async ms=>{await sleep(FAST?0:ms);if(!alive()){if(window.BOTDBG)console.log('STOP',G===g0,BOTTOK,tok,G.turn,p,G.p[p].bot,G.phase,new Error().stack.split('\n').slice(1,4).join('|'));throw STOP;}};
  try{await botPlay(p,o,wait,alive);}catch(e){if(e!==STOP)throw e;}
}
async function botPlay(p,o,wait,alive){
  if(G.phase==='setup'){
    await wait(500);
    if(G.setupPhase==='ranch'){const spots=ranchSpots(p,true);spots.sort((a,b)=>vertValue(p,b,true)-vertValue(p,a,true));build(p,'ranch',spots[Math.min(spots.length-1,pickTop(ai().top))]);}
    else{const opts=roadSpots(p,G.lastRanch);let best=opts[0],bs=-1;for(const e of opts){const {a,b}=B.edges[e],w=a===G.lastRanch?b:a;let sc=0;for(const x of B.verts[w].adj)sc=Math.max(sc,vertValue(p,x,true));if(sc>bs){bs=sc;best=e;}}build(p,'road',best);}
    return;
  }
  // Antes de tirar: un gaucho si el cuatrero le bloquea algo o si vas ganando.
  if(G.phase==='roll'&&G.diff!=='facil'){const i=G.p[p].dev.findIndex(c=>c.k==='gaucho'&&playable(p,c));
    if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||(G.diff==='dificil'&&vp(o)>=shown(p)))){await wait(500);playDev(p,i);await wait(500);}}
  if(G.phase==='robber'&&G.after==='roll'){await botRobber(p,o);await wait(500);}
  if(G.phase==='roll'){await wait(600);await roll();await wait(700);}
  if(G.phase==='discard')return;// espera que descartes; después sigue sola
  if(G.phase==='robber'){await botRobber(p,o);await wait(700);}
  if(G.phase==='over')return;
  let built=0;const cap=Math.random()<ai().calm?1:ai().cap;
  for(let guard=0;guard<12&&G.phase==='main';guard++){
    let did=false;const room=built<cap;
    if(room&&can(p,'town')&&G.p[p].town<LIMIT.town){const val=v=>B.verts[v].hexes.reduce((s,h)=>s+(B.hexes[h].res==='salitral'?0:pips(B.hexes[h].num)),0);const t=townSpots(p).sort((a,b)=>val(b)-val(a));if(t.length){build(p,'town',t[0]);did=true;built++;}}
    if(room&&!did&&can(p,'ranch')&&G.p[p].ranch<LIMIT.ranch){const s=ranchSpots(p).sort((a,b)=>vertValue(p,b)-vertValue(p,a));if(s.length){build(p,'ranch',s[0]);did=true;built++;}}
    if(room&&!did&&can(p,'road')&&G.p[p].road<LIMIT.road&&!(ranchSpots(p).length&&!can(p,'ranch')&&cards(p)>=3)){const e=bestRoadToward(p);const wantLong=G.longest!==p&&G.longLen[p]>=Math.max(...others(p).map(q=>G.longLen[q]||0))-1&&G.longLen[p]>=3;
      if(e!==null||wantLong){const e2=e!==null?e:roadSpots(p)[0];if(e2!==undefined){build(p,'road',e2);did=true;built++;}}}
    if(!did)did=botDev(p);
    if(G.phase==='robber'){await wait(500);await botRobber(p,o);did=true;}
    if(!did&&G.offers<1&&p!==0&&!G.p[0].bot&&!ON&&G.diff!=='facil'){did=await botOffer(p,alive);if(!alive())throw STOP;}
    if(!did&&room)did=botTrade(p);
    if(G.phase==='over')return;
    if(!did)break;await wait(650);
  }
  await wait(500);if(G.phase==='main')endTurn();
}
async function botRobber(p,o){
  // A todos los rivales, un poco más al que va ganando; nunca donde tiene ella.
  const L=o??lead(p),opts=[];B.hexes.forEach((h,hi)=>{if(hi===G.robber)return;let s=0;for(const v of h.v){const q=G.owner[v];if(q===null)continue;if(q===p)s-=pips(h.num)*2;else s+=(pips(h.num)*(G.town[v]?2:1)+(cards(q)?.5:0))*(q===L?1:NP()>2?.6:1);}opts.push([s,hi]);});
  opts.sort((a,b)=>b[0]-a[0]);const k=ai().rob,hit=opts.filter(x=>B.hexes[x[1]].v.some(v=>G.owner[v]!==null&&G.owner[v]!==p));
  const pick=k<0?opts[Math.floor(Math.random()*opts.length)]:k===0?(hit.length?hit[Math.floor(Math.random()*hit.length)]:opts[0]):opts[Math.min(opts.length-1,pickTop(k))];
  const vs=victimsAt(pick[1],p);moveRobber(p,pick[1],vs.length?botVictim(p,vs):undefined);
}
// Cartas: compra si le sobra para eso y juega las que le sirven.
function botDev(p){
  const D=G.p[p].dev,os=others(p);if(G.diff==='facil')return false;
  if(!G.devUsed){
    let i=D.findIndex(c=>c.k==='obra'&&playable(p,c));if(i>=0&&roadSpots(p).length&&G.p[p].road<LIMIT.road-1){playDev(p,i);let n=0;while(G.free>0&&n++<2){const e=bestRoadToward(p)??roadSpots(p)[0];if(e===undefined||e===null)break;build(p,'road',e);}G.free=0;return true;}
    i=D.findIndex(c=>c.k==='cosecha'&&playable(p,c));if(i>=0){const v=needValue(p),pick=RES.slice().sort((a,b)=>v[b]-v[a]);if(v[pick[0]]>1.5){playDev(p,i,[pick[0],v[pick[1]]>1.5?pick[1]:pick[0]]);return true;}}
    i=D.findIndex(c=>c.k==='acopio'&&playable(p,c));if(i>=0){
      const prod=r=>{let s=0;for(let v=0;v<B.verts.length;v++)if(G.owner[v]!==null&&G.owner[v]!==p)for(const h of B.verts[v].hexes)if(B.hexes[h].res===r&&h!==G.robber)s+=pips(B.hexes[h].num)*(G.town[v]?2:1);return s;};
      const tot=r=>os.reduce((s,q)=>s+G.p[q].hand[r],0),r=G.diff==='dificil'?RES.slice().sort((a,b)=>tot(b)-tot(a))[0]:RES.slice().sort((a,b)=>prod(b)-prod(a))[0];
      if(G.diff!=='dificil'?os.reduce((s,q)=>s+cards(q),0)>=4:tot(r)>=2){playDev(p,i,r);return true;}}
    i=D.findIndex(c=>c.k==='gaucho'&&playable(p,c));if(i>=0&&(B.hexes[G.robber].v.some(v=>G.owner[v]===p)||(G.diff==='dificil'&&G.p[p].gauchos>=2&&G.army!==p))){playDev(p,i);return true;}
  }
  const nothingElse=!(can(p,'ranch')&&ranchSpots(p).length)&&!(can(p,'town')&&townSpots(p).length);
  if(can(p,'dev')&&G.deck.length&&nothingElse&&Math.random()<ai().buy)return buyDev(p);
  return false;
}
// Te ofrece un cambio 1 por 1 si le falta una sola carta para algo.
async function botOffer(p,alive=()=>true){
  const h=G.p[p].hand,o=0,goals=[];if(townSpots(p).length&&G.p[p].town<LIMIT.town)goals.push('town');if(ranchSpots(p).length&&G.p[p].ranch<LIMIT.ranch)goals.push('ranch');
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(miss!==1)continue;
    const want=need[0];if(!G.p[o].hand[want])continue;
    const spare=RES.filter(r=>r!==want&&h[r]-(COST[g][r]||0)>=1).sort((a,b)=>h[b]-h[a]);if(!spare.length)continue;
    G.offers++;const give=spare[0];
    const yes=await askOffer(give,want,G.p[p].name,g);
    if(!alive())return false;
    if(yes){const gv=hand0(),wv=hand0();gv[want]=1;wv[give]=1;swapCards(gv,wv,p);return true;}
    addLog(`No aceptaste el cambio de ${quien(p)}.`);return false;}
  return false;
}
// Cambia con el banco si le falta una sola carta para construir algo.
function botTrade(p){
  const h=G.p[p].hand,goals=[];
  if(G.p[p].town<LIMIT.town&&townSpots(p).length)goals.push('town');
  if(G.p[p].ranch<LIMIT.ranch&&ranchSpots(p).length)goals.push('ranch');
  goals.push('road');
  // Le falta poco (1 o 2 cartas) para algo: cambia lo que le sobra. Con muchas cartas (riesgo del cuatrero) es más decidida.
  const maxMiss=cards(p)>7?ai().miss7:ai().miss;
  for(const g of goals){const need=RES.filter(r=>(COST[g][r]||0)>h[r]);const miss=need.reduce((s,r)=>s+(COST[g][r]-h[r]),0);if(!miss||miss>maxMiss)continue;
    const want=need[0];const spare=RES.filter(r=>!need.includes(r)&&h[r]-(COST[g][r]||0)>=rate(p,r)).sort((a,b)=>(h[b]-rate(p,b))-(h[a]-rate(p,a)));
    if(spare.length){trade(p,spare[0],want);return true;}}
  return false;
}

/* ── Turno tuyo: qué se puede tocar ── */
let mode=null;// 'road' | 'ranch' | 'town' | 'robber' | null
function next(){
  if(!G||G.phase==='over')return;
  if(G.phase==='discard'&&isAuth()){const b=others(0).filter(q=>G.p[q].bot&&dn(q));if(b.length){for(const q of b){const k=dn(q);discard(q,k);delete G.disc[q];addLog(`${G.p[q].name} descartó ${k} cartas.`);}if(!Object.keys(G.disc).length){G.phase='robber';G.discardN=0;}save();}}
  // Con un 7, cada uno elige lo suyo: si te toca, se abre tu descarte (aunque no sea tu turno).
  if(G.phase==='discard'&&dn(0)&&!G.p[0].bot&&DSENT!==discKey()&&!($('dc')&&!$('modal').hidden))openDiscard();
  if(G.turn!==0&&!G.p[G.turn].bot){mode=null;render();return;}// turno de otro jugador de verdad: llega por la conexión
  if(G.p[G.turn].bot){mode=null;render();if(!ON||ON.role==='host')botTurn();return;}// las compus las juega este aparato (o, en línea, el que armó la partida)
  if(G.phase==='setup')mode=G.setupPhase==='ranch'?'ranch':'road';
  else if(G.phase==='robber')mode='robber';else mode=null;
  render();
}
function targets(){
  const p=0;if(G.turn!==0||G.phase==='over')return {v:[],e:[],h:[]};
  if(G.phase==='setup')return G.setupPhase==='ranch'?{v:ranchSpots(p,true),e:[],h:[]}:{v:[],e:roadSpots(p,G.lastRanch),h:[]};
  if(G.phase==='robber')return {v:[],e:[],h:B.hexes.map((_,i)=>i).filter(i=>i!==G.robber)};
  if(mode==='road')return {v:[],e:roadSpots(p),h:[]};
  if(mode==='ranch')return {v:ranchSpots(p),e:[],h:[]};
  if(mode==='town')return {v:townSpots(p),e:[],h:[]};
  return {v:[],e:[],h:[]};
}
function onBoardTap(kind,i){
  if(G.turn!==0)return;
  if(G.phase==='robber'&&kind==='h'){const vs=victimsAt(i,0);if(vs.length>1){pickVictim(i,vs);return;}moveRobber(0,i);mode=G.free>0?'road':null;render();return;}
  if(G.phase==='setup'){build(0,G.setupPhase,i);return;}
  if(mode&&(kind==='v'||kind==='e')){const m=mode;mode=null;build(0,m,i);}
}

// En un terreno con más de un rival, elegís a quién robarle.
function pickVictim(hex,vs){
  openModal(`<h2>🤠 ¿A quién le robás?</h2><p>En ${RI[B.hexes[hex].res].hex.toLowerCase()} hay ${vs.length} rivales. Elegí a quién sacarle una carta (sale al azar de su mano).</p>
    <div class="vpick" id="vk">${vs.map(o=>`<button data-o="${o}" style="--pc:${PC[o]}"><i></i><b>${escHtml(G.p[o].name)}</b><small>${cards(o)} carta${cards(o)===1?'':'s'} · ${shown(o)} punto${shown(o)===1?'':'s'}</small></button>`).join('')}</div>
    <div class="row"><button class="pill" id="vk-x">Elegir otro lugar</button></div>`);
  $('vk').onclick=e=>{const b=e.target.closest('button[data-o]');if(!b)return;closeModal();if(G.phase!=='robber'||G.turn!==0)return;moveRobber(0,hex,Number(b.dataset.o));mode=G.free>0?'road':null;render();};
  $('vk-x').onclick=closeModal;
}

/* ── Dibujo del tablero ──
   Cada terreno tiene su color y su dibujo (arbolitos, ladrillos, ovejas, surcos, cerros, grietas de sal),
   así se distinguen aunque se vean chiquitos. Lo que no cambia (mar, isla, terrenos, números y puertos)
   se arma una sola vez por tablero; en cada jugada sólo se redibujan las piezas. */
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
