<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).
   v67: amigos con solicitudes (pestañas Charlas / Amigos / Global), grupos de juego (Jugar con el grupo, partidas
   del grupo, archivar solos los que nadie usa) y selector de emojis.
   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},
   CHAT.esAmigo(n), CHAT.usuarios() → [{usuario, avatar, color, enLinea, estado}], CHAT.conectados() → {amigos, global}
   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
// Un nombre de usuario de verdad (nunca null, vacío ni el texto «null»/«undefined» que deja un error).
function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre
  // bien): se borran de acá y se vuelven a pedir desde un poco antes, así reaparecen en la charla correcta.
  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));
  if(malos.length){S.msgs=S.msgs.filter(x=>x&&nombreOk(x.de)&&nombreOk(x.para));const t0=Math.min(...malos.map(x=>Number(x&&x.t)||0).filter(Boolean));
    if(t0)S.last=Math.min(S.last,t0-60000);ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
  // Lo que se estaba mandando cuando se cerró la página queda como «No se mandó» (se puede reintentar).
  for(const x of S.msgs)if(x.tmp){x.sending=false;x.fail=true;if(typeof x.p==='string'){try{S.plain[x.id]=JSON.parse(x.p);}catch(_){}}}
  const B=ls.json(kBorr(),{});S.borr=B&&typeof B==='object'?B:{};
  S.invSt=ls.json(kInvSt(),{})||{};
  {const G=ls.json(kGrupos(),[]);S.grupos=Array.isArray(G)?G:[];}S.am=amLimpio(ls.json(kAm(),null));S.amOk=false;try{S.espero=JSON.parse(sessionStorage.getItem('bloques-chat-espero')||'null');}catch(_){S.espero=null;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte&&!borradoLocal(m)).slice(-3000);}
/* ── Borrar chats (v63): sólo para vos. La planilla guarda «borrado hasta tal hora» por charla y no te devuelve
   lo anterior; si el otro te escribe de nuevo, la charla vuelve con lo nuevo. ── */
const kBorr=()=>'bloques-chat-borr-'+lc(S.me);
function borradoLocal(m){const o=conv(m),h=S.borr&&S.borr[o];return !!h&&m.t<=h&&!m.tmp;}
function aplicarBorrados(B){let ch=false;for(const [k,t] of Object.entries(B||{})){const v=Number(t)||0;if(v>(S.borr[lc(k)]||0)){S.borr[lc(k)]=v;ch=true;}}
  if(ch){ls.set(kBorr(),JSON.stringify(S.borr));const n=S.msgs.length;S.msgs=S.msgs.filter(m=>!borradoLocal(m));if(S.msgs.length!==n)saveMsgs();}return ch;}
async function borrarChat(name){
  // La marca usa la hora de la planilla (la de los mensajes), no el reloj de este dispositivo.
  if(!nombreOk(name))return;const k=lc(name),t=lastAny(name);
  if(t>(S.borr[k]||0)){S.borr[k]=t;ls.set(kBorr(),JSON.stringify(S.borr));}S.msgs=S.msgs.filter(m=>!(conv(m)===k&&m.tmp)&&!borradoLocal(m));saveMsgs();
  S.delFor=null;if(lc(S.con)===k){S.con=null;S.view='list';}$('.cx-panel').dataset.sig='';render();badges();
  try{const j=await call(auth({accion:'chatBorrar',con:name}));if(j.hasta)aplicarBorrados({[k]:j.hasta});}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para borrar chats en todos tus dispositivos hay que actualizar la planilla (versión nueva). En este quedó borrado.':String(e.message||e);render();}
}
const lastAny=n=>{let t=0;for(const m of S.msgs)if(conv(m)===lc(n)&&m.t>t)t=m.t;return t;};
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
/* ── Grupos (v66): los mensajes de un grupo van con para = «g:<id>». La charla de un mensaje es el grupo o el otro. ── */
const esGK=k=>/^g:/i.test(String(k||''));
const esG=m=>esGK(m&&m.para);
const conv=m=>esG(m)?lc(m.para):lc(other(m));
const grupoDe=k=>{const id=lc(k).replace(/^g:/,'');return S.grupos.find(g=>lc(g.id)===id)||null;};
const conNombre=k=>esGK(k)?((grupoDe(k)||{}).n||'Grupo'):k;
const kGrupos=()=>'bloques-chat-grupos-'+lc(S.me);
/* ── Amigos (v67) ── */
const kAm=()=>'bloques-chat-amigos-'+lc(S.me);
const amLimpio=o=>({a:Array.isArray(o&&o.a)?o.a.filter(nombreOk):[],in:Array.isArray(o&&o.in)?o.in.filter(nombreOk):[],out:Array.isArray(o&&o.out)?o.out.filter(nombreOk):[]});
function amEstado(n){const k=lc(n);if(S.am.a.some(x=>lc(x)===k))return 'amigo';if(S.am.in.some(x=>lc(x)===k))return 'te-pidio';if(S.am.out.some(x=>lc(x)===k))return 'pediste';return '';}
function avisarAmigos(){try{window.dispatchEvent(new CustomEvent('bloques-amigos',{detail:{amigos:S.am.a.slice(),in:S.am.in.slice(),out:S.am.out.slice()}}));}catch(_){}}
function guardarAmigos(o,primera){
  const n=amLimpio(o),antes=S.am,a=JSON.stringify(n),ch=a!==JSON.stringify(antes);S.am=n;S.amOk=true;
  if(!ch)return false;ls.set(kAm(),a);
  // Una solicitud nueva: un aviso chico (en partida, sólo el «tic»).
  if(!primera){const nuevas=n.in.filter(x=>!antes.in.some(y=>lc(y)===lc(x)));for(const x of nuevas){if(H.busy())beep('soft');else{beep('msg');toast(x,'Te mandó una solicitud de amistad 🤝',x);}}}
  avisarAmigos();return true;}
async function amAccion(accion,p,ok){
  try{const j=await call(auth({accion,...p}));if(j.amigos)guardarAmigos(j.amigos);if(ok)S.err='';poll();return j;}
  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para agregar amigos hay que pegar el código nuevo de la planilla.':String(e.message||e);}
  finally{p0().dataset.sig='';render();}
}
const pedirAmistad=n=>amAccion('amigoPedir',{para:n},true);
const responderAmistad=(n,si)=>amAccion('amigoResponder',{de:n,si:si?1:0},true);
const cancelarAmistad=n=>amAccion('amigoCancelar',{para:n},true);
const quitarAmigo=n=>amAccion('amigoQuitar',{con:n},true);
function guardarGrupos(L){if(!Array.isArray(L))return false;const a=JSON.stringify(L),ch=a!==JSON.stringify(S.grupos);S.grupos=L;if(ch)ls.set(kGrupos(),a);return ch;}
function unreadFrom(n){const r=S.read[lc(n)]||0;if(esGK(n))return S.msgs.filter(m=>conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(esG(m)){if(lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>(S.read[conv(m)]||0))n++;continue;}if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    const pend=invPendientes();if(pend.length)p.invs=pend;
    if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}

// v70.1: la planilla 19 no conoce LudAR ni PoolAR: su tarjeta dice «BloqueAR · Duelo en línea». Se mira esa invitación
// (una sola vez por tarjeta) y se corrige el juego que muestra la tarjeta y adónde lleva «Entrar».
const INV_PREF={TRUCO:'truco',UNO:'uno',POBLAR:'poblar',AJEDREZ:'ajedrez',LUDO:'ludo',POOL:'pool'};
async function invCorregir(){
  if(!(S.ver&&S.ver<20))return;S.invFix=S.invFix||{};
  for(const m of S.msgs.slice(-40)){const c=invCard(m);
    if(!c||c.j!=='bloquear'||S.invFix[c.inv]||lc(m.de)===lc(S.me)||(S.invSt[c.inv]&&S.invSt[c.inv]!=='esperando'))continue;
    S.invFix[c.inv]=1;
    try{const j=await call(auth({accion:'buzon',ver:c.inv})),iv=j.invitacion,of=String(iv&&iv.id===c.inv&&iv.oferta||''),k=(/^([A-Z]+):/.exec(of)||[])[1],g=k&&INV_PREF[k];
      if(!g)continue;let o=null;try{o=JSON.parse(of.slice(of.indexOf(':')+1));}catch(_){}
      c.j=g;c.t='Invitación a '+GAMES[g];c.d=o&&o.re?'Volver a la partida':g==='pool'?(({b8:'Bola 8',b9:'Bola 9',b10:'Bola 10',caram:'Carambola',tres:'Tres bandas'}[o&&o.modo]||'Pool')+(o&&Number(o.n)===4?' · Dobles (2 contra 2)':' · mano a mano')):o&&Number(o.n)>2?'Mesa de '+o.n:'Mano a mano';
      if($('.cx-panel'))$('.cx-panel').dataset.sig='';if(S.open)render();badges();
      if(S.espero)esperoRevisar([m]);}catch(_){}}
}
function esperoRevisar(fresh){
  const e=S.espero;if(!e||Date.now()-e.t>180000)return;
  // v70.1: una planilla vieja no conoce los juegos nuevos (LudAR, PoolAR…) y marca su tarjeta como «bloquear»: también vale.
  for(const m of fresh){const c=invCard(m);if(!c||lc(m.de)!==lc(e.host)||(e.j&&c.j!==e.j&&!(c.j==='bloquear'&&INV_URL[e.j])))continue;
    S.espero=null;try{sessionStorage.removeItem('bloques-chat-espero');}catch(_){}
    invAccion('inventrar',c.inv,c.j==='bloquear'&&e.j&&INV_URL[e.j]?e.j:c.j);return;}
}

  const pl=JSON.stringify({x:'',card:{...card,ll:1,host:S.me}}),para='g:'+g.id;

   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje

     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):

<script>
/* ───────── PoolAR · motor ─────────
   Todo lo que no se dibuja: la mesa (bandas, mandíbulas y troneras de verdad), la física de las bolas (deslizan, ruedan,
   llevan efecto), las reglas BloqueAR de Bola 8, Bola 9, Bola 10, Carambola libre y Tres bandas, la guía de puntería y
   la compu. La misma física sirve para entrenar, para la compu y para jugar en línea.

   · Unidades: metros y segundos. Mesa de juego de 2,00 × 1,00 m (una «mesa de bar» de 7 pies: en el celular las bolas se
     ven más grandes que en una de 9) y bolas de 57,15 mm. El eje largo es x (0 = cabecera, de donde se abre).
   · Paso fijo de 1/240 s, partido en sub‑pasos según la velocidad más alta (ninguna bola avanza más de un cuarto de radio
     por sub‑paso): así no atraviesa bandas ni otras bolas aunque vaya a toda fuerza.
   · Sólo usa + − × ÷ y √ dentro de la simulación (nada de seno, coseno ni exponenciales): el mismo tiro desde el mismo
     estado da el mismo resultado en cualquier navegador. En línea, igual, el que arma la mesa manda el estado final.
   · Modelo: cada bola tiene velocidad y giro (ωx, ωy de avance/retroceso y ωz de efecto lateral). Mientras el punto de
     contacto con el paño patina, el rozamiento (μ 0,2) frena y le cambia el giro; cuando deja de patinar, rueda (μ 0,013).

const POOL=(function(){
'use strict';
const PHYS_V=1,REGLAS_V=1;

const CABECERA=L/4,PIE_X=L*0.75;

// Troneras de esquina: boca de 2,15 diámetros entre las puntas de las bandas; las mandíbulas se cierran un poco hacia

/* ───────── Azar con semilla ───────── */
function rng(seed){let a=(seed>>>0)||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* ───────── La física ─────────

    if(us>1e-4){const dec=MU_S*G,tf=us/(3.5*dec),hh=tf<h?tf:h,ax=-dec*ux/us,ay=-dec*uy/us;
      VX[i]+=ax*hh;VY[i]+=ay*hh;WX[i]+=2.5*ay/R*hh;WY[i]-=2.5*ax/R*hh;
      if(hh<h){WX[i]=-VY[i]/R;WY[i]=VX[i]/R;roll(i,h-hh);}}
    else roll(i,h);
    const dz=2.5*MU_SP*G/R*h;if(WZ[i]>dz)WZ[i]-=dz;else if(WZ[i]<-dz)WZ[i]+=dz;else WZ[i]=0;
    if(VX[i]===0&&VY[i]===0){const u2=R*WY[i],u3=R*WX[i];if(u2*u2+u3*u3<1e-8){MOV[i]=0;WX[i]=0;WY[i]=0;}}};
  const sub=h=>{
    for(let i=0;i<N;i++)if(ON[i]&&MOV[i]){friccion(i,h);X[i]+=VX[i]*h;Y[i]+=VY[i]*h;}
    // bolas contra bolas (siempre en el mismo orden)
    for(let i=0;i<N;i++){if(!ON[i])continue;
      for(let j=i+1;j<N;j++){if(!ON[j]||(!MOV[i]&&!MOV[j]))continue;
        let dx=X[j]-X[i],dy=Y[j]-Y[i];const d2=dx*dx+dy*dy;if(d2>=D*D)continue;
        let d=Math.sqrt(d2);if(d<1e-9){dx=1;dy=0;d=1;}const nx=dx/d,ny=dy/d;
        const vr=(VX[i]-VX[j])*nx+(VY[i]-VY[j])*ny;
        if(vr>0){const J=(1+E_BB)/2*vr;VX[i]-=J*nx;VY[i]-=J*ny;VX[j]+=J*nx;VY[j]+=J*ny;MOV[i]=1;MOV[j]=1;ev.push({k:'bb',t,n:NUM[i],m:NUM[j],e:vr});}
        const o=(D-d)/2+1e-7;X[i]-=nx*o;Y[i]-=ny*o;X[j]+=nx*o;Y[j]+=ny*o;}}
    // bandas y mandíbulas
    for(let i=0;i<N;i++){if(!ON[i]||!MOV[i])continue;
      for(let s=0;s<NS;s++){const g=segs[s];
        let tq=((X[i]-g.ax)*g.dx+(Y[i]-g.ay)*g.dy)/g.l2;tq=tq<0?0:tq>1?1:tq;
        const qx=g.ax+g.dx*tq,qy=g.ay+g.dy*tq;let dx=X[i]-qx,dy=Y[i]-qy;const d2=dx*dx+dy*dy,k=i*NS+s;
        if(d2>=R*R){if(TOCA[k]&&d2>(R+0.002)*(R+0.002))TOCA[k]=0;continue;}
        let d=Math.sqrt(d2);if(d<1e-9){dx=-g.dy;dy=g.dx;d=Math.sqrt(g.l2);}const nx=dx/d,ny=dy/d;
        const vn=VX[i]*nx+VY[i]*ny;
        if(vn<0){const tx=-ny,ty=nx,vt=VX[i]*tx+VY[i]*ty,sl=vt-R*WZ[i];
          let Jt=MU_RAIL*(1+g.e)*(-vn);const stop=Math.abs(sl)/3.5;if(Jt>stop)Jt=stop;if(sl>0)Jt=-Jt;
          const dvn=-(1+g.e)*vn;VX[i]+=dvn*nx+Jt*tx;VY[i]+=dvn*ny+Jt*ty;WZ[i]-=2.5*Jt/R;

          WX[i]*=0.05;WY[i]*=0.05;
          if(!TOCA[k]&&vn<-0.02){ev.push({k:'banda',t,n:NUM[i],s,e:-vn,jaw:g.jaw});}
          TOCA[k]=1;}
        const o=R-d+1e-7;X[i]+=nx*o;Y[i]+=ny*o;}
      // troneras
      for(let p=0;p<pk.length;p++){const P=pk[p],dx=X[i]-P.x,dy=Y[i]-P.y;
        if(dx*dx+dy*dy<P.r*P.r){ON[i]=0;MOV[i]=0;VX[i]=VY[i]=0;ev.push({k:'tronera',t,n:NUM[i],p,e:0});break;}}

// Fuerza (0…1) → velocidad de la blanca: curva suave con mucha resolución en los tiros cortos.

/* ───────── Armar las mesas ───────── */
const SQ3=Math.sqrt(3)/2;

    const lis=mez([1,2,3,4,5,6,7]),ray=mez([9,10,11,12,13,14,15]);const atr=R_()<0.5?[lis.pop(),ray.pop()]:[ray.pop(),lis.pop()];

/* ───────── Ayudas de geometría ───────── */
function libre(bolas,x,y,menos){// ¿se puede poner una bola acá?

// Reponer una bola en el punto de pie: si está ocupado, hacia la banda de pie y si no hay lugar, hacia la cabecera.
function reponer(bolas,n){
  const b=bolas.find(x=>x.n===n);if(!b)return;

  if(!prueba(x)){let ok=false;for(x=PIE_X;x<=L-R;x+=0.002)if(prueba(x)){ok=true;break;}
    if(!ok)for(x=PIE_X;x>=R;x-=0.002)if(prueba(x)){ok=true;break;}
    if(!ok)x=PIE_X;}
  b.x=q6(x);b.y=q6(W/2);b.on=1;

/* ───────── Reglas ─────────

// Resumen del tiro a partir de los eventos de la física.
function leerTiro(ev,taco){

// Aplicar un tiro: valida, simula y arbitra. input: {dx,dy,p (0…1),a,b, x,y (la blanca, si estaba en mano), bola, tronera}

// (idempotente: aplicarla dos veces da lo mismo; la dirección no hace falta que mida 1, la física la normaliza)

<script>
'use strict';
const MOTOR_SRC="/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 PoolAR \u00b7 motor \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   Todo lo que no se dibuja: la mesa (bandas, mand\u00edbulas y troneras de verdad), la f\u00edsica de las bolas (deslizan, ruedan,\n   llevan efecto), las reglas BloqueAR de Bola 8, Bola 9, Bola 10, Carambola libre y Tres bandas, la gu\u00eda de punter\u00eda y\n   la compu. La misma f\u00edsica sirve para entrenar, para la compu y para jugar en l\u00ednea.\n\n   \u00b7 Unidades: metros y segundos. Mesa de juego de 2,00 \u00d7 1,00 m (una \u00abmesa de bar\u00bb de 7 pies: en el celular las bolas se\n     ven m\u00e1s grandes que en una de 9) y bolas de 57,15 mm. El eje largo es x (0 = cabecera, de donde se abre).\n   \u00b7 Paso fijo de 1/240 s, partido en sub\u2011pasos seg\u00fan la velocidad m\u00e1s alta (ninguna bola avanza m\u00e1s de un cuarto de radio\n     por sub\u2011paso): as\u00ed no atraviesa bandas ni otras bolas aunque vaya a toda fuerza.\n   \u00b7 S\u00f3lo usa + \u2212 \u00d7 \u00f7 y \u221a dentro de la simulaci\u00f3n (nada de seno, coseno ni exponenciales): el mismo tiro desde el mismo\n     estado da el mismo resultado en cualquier navegador. En l\u00ednea, igual, el que arma la mesa manda el estado final.\n   \u00b7 Modelo: cada bola tiene velocidad y giro (\u03c9x, \u03c9y de avance/retroceso y \u03c9z de efecto lateral). Mientras el punto de\n     contacto con el pa\u00f1o patina, el rozamiento (\u03bc 0,2) frena y le cambia el giro; cuando deja de patinar, rueda (\u03bc 0,013).\n     Entre bolas: choque casi el\u00e1stico (0,95) que no toca el giro: por eso la blanca con efecto arriba sigue y con efecto\n     abajo vuelve (lo hace el pa\u00f1o despu\u00e9s del choque). En las bandas: rebote 0,80 y el efecto lateral cambia la salida.\n   PHYS_V cambia si cambia algo de la f\u00edsica (las partidas en l\u00ednea guardan con qu\u00e9 versi\u00f3n se jugaron). */\nconst POOL=(function(){\n'use strict';\nconst PHYS_V=1,REGLAS_V=1;\nconst L=2.0,W=1.0,R=0.028575,D=2*R;\nconst MU_S=0.17,MU_R=0.013,MU_SP=0.044,G=9.81;\nconst E_BB=0.95,E_RAIL=0.80,E_JAW=0.66,MU_RAIL=0.14;\nconst K_EF=1.3;   // un poco m\u00e1s de efecto que en la vida real: se nota y se aprende antes\nconst VMIN=0.10,VMAX=5.4,VSTOP=0.005,TMAX=25;\nconst CABECERA=L/4,PIE_X=L*0.75;\nconst q6=v=>Math.round(v*1e6)/1e6;\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La mesa \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n// Troneras de esquina: boca de 2,15 di\u00e1metros entre las puntas de las bandas; las mand\u00edbulas se cierran un poco hacia\n// adentro (la garganta queda de ~1,9 di\u00e1metros). Laterales: boca de 2,3 di\u00e1metros. Una bola cae cuando su centro entra\n// en la zona de ca\u00edda (detr\u00e1s de la boca), no por rozar la tronera.\nconst BOCA_E=2.15*D,BOCA_L=2.30*D,CE=BOCA_E/Math.SQRT2;\nfunction crearMesa(tipo){\n  const segs=[],pockets=[];\n  const S=(ax,ay,bx,by,e,jaw)=>{const dx=bx-ax,dy=by-ay;segs.push({ax,ay,bx,by,dx,dy,l2:dx*dx+dy*dy,e,jaw:!!jaw});};\n  if(tipo==='carambola'){S(0,0,L,0,E_RAIL);S(L,0,L,W,E_RAIL);S(L,W,0,W,E_RAIL);S(0,W,0,0,E_RAIL);return {tipo,segs,pockets};}\n  const hl=BOCA_L/2;\n  // bandas largas (arriba y abajo, partidas por la tronera del medio) y cortas\n  S(CE,0,L/2-hl,0,E_RAIL);S(L/2+hl,0,L-CE,0,E_RAIL);S(CE,W,L/2-hl,W,E_RAIL);S(L/2+hl,W,L-CE,W,E_RAIL);\n  S(0,CE,0,W-CE,E_RAIL);S(L,CE,L,W-CE,E_RAIL);\n  // esquinas: se arma la de (0,0) y se refleja\n  const jl=0.055,ja=[-0.788,-0.616];\n  const esquina=(cx,cy,idx)=>{const sx=cx?-1:1,sy=cy?-1:1,P=(x,y)=>[cx+sx*x,cy+sy*y];\n    const A=P(CE,0),A2=P(CE+ja[0]*jl,ja[1]*jl),B=P(0,CE),B2=P(ja[1]*jl,CE+ja[0]*jl);\n    S(A[0],A[1],A2[0],A2[1],E_JAW,1);S(B[0],B[1],B2[0],B2[1],E_JAW,1);\n    const c=P(-0.016,-0.016),m=P(0.006,0.006),f=P(0.03,0.03);\n    pockets[idx]={x:c[0],y:c[1],r:0.058,mx:m[0],my:m[1],fx:f[0],fy:f[1],ax:-sx*Math.SQRT1_2,ay:-sy*Math.SQRT1_2,esq:true};};\n  const lateral=(cy,idx)=>{const sy=cy?-1:1,jl2=0.04,jx=0.259*jl2,jy=0.966*jl2;\n    S(L/2-hl,cy,L/2-hl+jx,cy-sy*jy,E_JAW,1);S(L/2+hl,cy,L/2+hl-jx,cy-sy*jy,E_JAW,1);\n    pockets[idx]={x:L/2,y:cy-sy*0.05,r:0.045,mx:L/2,my:cy-sy*0.008,fx:L/2,fy:cy+sy*0.03,ax:0,ay:-sy,esq:false};};\n  // numeradas 1\u20266 en el sentido de las agujas del reloj desde arriba a la izquierda (vista acostada)\n  esquina(0,0,0);lateral(0,1);esquina(L,0,2);esquina(L,W,3);lateral(W,4);esquina(0,W,5);\n  return {tipo,segs,pockets};\n}\nconst MESAS={pool:crearMesa('pool'),carambola:crearMesa('carambola')};\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Azar con semilla \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction rng(seed){let a=(seed>>>0)||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La f\u00edsica \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   simular(mesa, bolas, golpe) \u2192 {cuadros, ev, final, t, error}\n   bolas: [{n,x,y}] (s\u00f3lo las que est\u00e1n en la mesa) \u00b7 golpe: {n (la bola que se golpea), dx,dy (direcci\u00f3n), v (m/s),\n   a (efecto lateral, \u22120,5\u20260,5 del radio), b (arriba/abajo, \u22120,5\u20260,5)}.\n   cuadros: posiciones cada 1/60 s (Float32Array con x,y de cada bola; NaN si ya cay\u00f3). ev: lo que pas\u00f3, en orden:\n   {k:'taco'|'bb'|'banda'|'tronera'|'error', t, n, m (la otra bola), p (tronera), e (energ\u00eda del golpe)}. */\nfunction simular(mesa,bolas,golpe,op){\n  op=op||{};const N=bolas.length,X=new Float64Array(N),Y=new Float64Array(N),VX=new Float64Array(N),VY=new Float64Array(N),\n    WX=new Float64Array(N),WY=new Float64Array(N),WZ=new Float64Array(N),ON=new Uint8Array(N),MOV=new Uint8Array(N),NUM=new Int16Array(N);\n  const segs=mesa.segs,pk=mesa.pockets,NS=segs.length,TOCA=new Uint8Array(N*NS);\n  for(let i=0;i<N;i++){X[i]=bolas[i].x;Y[i]=bolas[i].y;ON[i]=1;NUM[i]=bolas[i].n;}\n  const ev=[],cuadros=[],guardar=op.cuadros!==false;\n  const foto=()=>{const f=new Float32Array(N*2);for(let i=0;i<N;i++){f[2*i]=ON[i]?X[i]:NaN;f[2*i+1]=ON[i]?Y[i]:NaN;}cuadros.push(f);};\n  let t=0,error=null;\n  const ci=bolas.findIndex(b=>b.n===golpe.n);\n  if(ci>=0){\n    let dx=golpe.dx,dy=golpe.dy;const l=Math.sqrt(dx*dx+dy*dy)||1;dx/=l;dy/=l;\n    const v=Math.max(0,Math.min(VMAX,golpe.v||0)),a=Math.max(-0.5,Math.min(0.5,golpe.a||0)),b=Math.max(-0.5,Math.min(0.5,golpe.b||0));\n    VX[ci]=v*dx;VY[ci]=v*dy;\n    WX[ci]=-K_EF*2.5*b*v*dy/R;WY[ci]=K_EF*2.5*b*v*dx/R;WZ[ci]=-2.5*a*v/R;\n    MOV[ci]=v>0?1:0;ev.push({k:'taco',t:0,n:NUM[ci],e:v});\n  }\n  if(guardar)foto();\n  const DT=1/240;let paso=0;\n  const roll=(i,h)=>{const s=Math.sqrt(VX[i]*VX[i]+VY[i]*VY[i]);\n    if(s>0){const ns=s-MU_R*G*h;if(ns<VSTOP){VX[i]=0;VY[i]=0;}else{const f=ns/s;VX[i]*=f;VY[i]*=f;}}\n    WX[i]=-VY[i]/R;WY[i]=VX[i]/R;};\n  const friccion=(i,h)=>{\n    const ux=VX[i]-R*WY[i],uy=VY[i]+R*WX[i],us=Math.sqrt(ux*ux+uy*uy);\n    if(us>1e-4){const dec=MU_S*G,tf=us/(3.5*dec),hh=tf<h?tf:h,ax=-dec*ux/us,ay=-dec*uy/us;\n      VX[i]+=ax*hh;VY[i]+=ay*hh;WX[i]+=2.5*ay/R*hh;WY[i]-=2.5*ax/R*hh;\n      if(hh<h){WX[i]=-VY[i]/R;WY[i]=VX[i]/R;roll(i,h-hh);}}\n    else roll(i,h);\n    const dz=2.5*MU_SP*G/R*h;if(WZ[i]>dz)WZ[i]-=dz;else if(WZ[i]<-dz)WZ[i]+=dz;else WZ[i]=0;\n    if(VX[i]===0&&VY[i]===0){const u2=R*WY[i],u3=R*WX[i];if(u2*u2+u3*u3<1e-8){MOV[i]=0;WX[i]=0;WY[i]=0;}}};\n  const sub=h=>{\n    for(let i=0;i<N;i++)if(ON[i]&&MOV[i]){friccion(i,h);X[i]+=VX[i]*h;Y[i]+=VY[i]*h;}\n    // bolas contra bolas (siempre en el mismo orden)\n    for(let i=0;i<N;i++){if(!ON[i])continue;\n      for(let j=i+1;j<N;j++){if(!ON[j]||(!MOV[i]&&!MOV[j]))continue;\n        let dx=X[j]-X[i],dy=Y[j]-Y[i];const d2=dx*dx+dy*dy;if(d2>=D*D)continue;\n        let d=Math.sqrt(d2);if(d<1e-9){dx=1;dy=0;d=1;}const nx=dx/d,ny=dy/d;\n        const vr=(VX[i]-VX[j])*nx+(VY[i]-VY[j])*ny;\n        if(vr>0){const J=(1+E_BB)/2*vr;VX[i]-=J*nx;VY[i]-=J*ny;VX[j]+=J*nx;VY[j]+=J*ny;MOV[i]=1;MOV[j]=1;ev.push({k:'bb',t,n:NUM[i],m:NUM[j],e:vr});}\n        const o=(D-d)/2+1e-7;X[i]-=nx*o;Y[i]-=ny*o;X[j]+=nx*o;Y[j]+=ny*o;}}\n    // bandas y mand\u00edbulas\n    for(let i=0;i<N;i++){if(!ON[i]||!MOV[i])continue;\n      for(let s=0;s<NS;s++){const g=segs[s];\n        let tq=((X[i]-g.ax)*g.dx+(Y[i]-g.ay)*g.dy)/g.l2;tq=tq<0?0:tq>1?1:tq;\n        const qx=g.ax+g.dx*tq,qy=g.ay+g.dy*tq;let dx=X[i]-qx,dy=Y[i]-qy;const d2=dx*dx+dy*dy,k=i*NS+s;\n        if(d2>=R*R){if(TOCA[k]&&d2>(R+0.002)*(R+0.002))TOCA[k]=0;continue;}\n        let d=Math.sqrt(d2);if(d<1e-9){dx=-g.dy;dy=g.dx;d=Math.sqrt(g.l2);}const nx=dx/d,ny=dy/d;\n        const vn=VX[i]*nx+VY[i]*ny;\n        if(vn<0){const tx=-ny,ty=nx,vt=VX[i]*tx+VY[i]*ty,sl=vt-R*WZ[i];\n          let Jt=MU_RAIL*(1+g.e)*(-vn);const stop=Math.abs(sl)/3.5;if(Jt>stop)Jt=stop;if(sl>0)Jt=-Jt;\n          const dvn=-(1+g.e)*vn;VX[i]+=dvn*nx+Jt*tx;VY[i]+=dvn*ny+Jt*ty;WZ[i]-=2.5*Jt/R;\n          // el giro de avance/retroceso se gasta bastante contra la goma\n          WX[i]*=0.05;WY[i]*=0.05;\n          if(!TOCA[k]&&vn<-0.02){ev.push({k:'banda',t,n:NUM[i],s,e:-vn,jaw:g.jaw});}\n          TOCA[k]=1;}\n        const o=R-d+1e-7;X[i]+=nx*o;Y[i]+=ny*o;}\n      // troneras\n      for(let p=0;p<pk.length;p++){const P=pk[p],dx=X[i]-P.x,dy=Y[i]-P.y;\n        if(dx*dx+dy*dy<P.r*P.r){ON[i]=0;MOV[i]=0;VX[i]=VY[i]=0;ev.push({k:'tronera',t,n:NUM[i],p,e:0});break;}}\n      // por las dudas: una bola que se fue de la mesa (no deber\u00eda pasar nunca)\n      if(ON[i]&&(X[i]<-0.12||X[i]>L+0.12||Y[i]<-0.12||Y[i]>W+0.12)){let bp=0,bd=1e9;for(let p=0;p<pk.length;p++){const dd=(X[i]-pk[p].x)**2+(Y[i]-pk[p].y)**2;if(dd<bd){bd=dd;bp=p;}}\n        ON[i]=0;MOV[i]=0;error='fuera';ev.push({k:'error',t,n:NUM[i],p:bp,e:0});if(pk.length)ev.push({k:'tronera',t,n:NUM[i],p:bp,e:0});}}\n  };\n  while(true){\n    let vmax=0,alguna=false;\n    for(let i=0;i<N;i++)if(ON[i]&&MOV[i]){alguna=true;const s=Math.sqrt(VX[i]*VX[i]+VY[i]*VY[i])+R*Math.sqrt(WX[i]*WX[i]+WY[i]*WY[i])*0.3;if(s>vmax)vmax=s;}\n    if(!alguna)break;\n    const n=Math.max(1,Math.ceil(vmax*DT/(0.25*R))),h=DT/n;\n    for(let k=0;k<n;k++)sub(h);\n    t+=DT;paso++;\n    if(guardar&&paso%4===0)foto();\n    if(t>TMAX){error='tiempo';ev.push({k:'error',t,n:-1,e:0});for(let i=0;i<N;i++){MOV[i]=0;VX[i]=VY[i]=0;}break;}\n  }\n  // una bola que qued\u00f3 quieta con el centro pasando el borde de la mesa (colgando en la boca de una tronera) se cae\n  if(pk.length)for(let i=0;i<N;i++){if(!ON[i])continue;if(X[i]<-0.002||X[i]>L+0.002||Y[i]<-0.002||Y[i]>W+0.002){let bp=0,bd=1e9;for(let p=0;p<pk.length;p++){const dd=(X[i]-pk[p].x)**2+(Y[i]-pk[p].y)**2;if(dd<bd){bd=dd;bp=p;}}\n    ON[i]=0;ev.push({k:'tronera',t,n:NUM[i],p:bp,e:0});}}\n  // al final, por las dudas, se separan las que quedaron apenas pegadas (d\u00e9cimas de mil\u00edmetro)\n  for(let it=0;it<12;it++){let mov=false;\n    for(let i=0;i<N;i++){if(!ON[i])continue;for(let j=i+1;j<N;j++){if(!ON[j])continue;const dx=X[j]-X[i],dy=Y[j]-Y[i],d2=dx*dx+dy*dy;\n      if(d2<D*D-1e-9){const d=Math.sqrt(d2)||1e-9,o=(D-d)/2+1e-6;X[i]-=dx/d*o;Y[i]-=dy/d*o;X[j]+=dx/d*o;Y[j]+=dy/d*o;mov=true;}}}\n    for(let i=0;i<N;i++){if(!ON[i])continue;for(let s=0;s<NS;s++){const g=segs[s];let tq=((X[i]-g.ax)*g.dx+(Y[i]-g.ay)*g.dy)/g.l2;tq=tq<0?0:tq>1?1:tq;\n      const qx=g.ax+g.dx*tq,qy=g.ay+g.dy*tq,dx=X[i]-qx,dy=Y[i]-qy,d2=dx*dx+dy*dy;if(d2<R*R-1e-9){const d=Math.sqrt(d2)||1e-9;X[i]+=dx/d*(R-d+1e-6);Y[i]+=dy/d*(R-d+1e-6);mov=true;}}}\n    if(!mov)break;}\n  if(guardar)foto();\n  const final=[];for(let i=0;i<N;i++)final.push({n:NUM[i],x:q6(X[i]),y:q6(Y[i]),on:ON[i]?1:0});\n  return {cuadros,ev,final,t,error,nums:Array.from(NUM)};\n}\n// Fuerza (0\u20261) \u2192 velocidad de la blanca: curva suave con mucha resoluci\u00f3n en los tiros cortos.\nconst vel=p=>{p=Math.max(0,Math.min(1,p||0));return p<=0?0:VMIN+(VMAX-VMIN)*Math.pow(p,1.7);};\nconst fuerzaDe=v=>v<=VMIN?0.01:Math.pow((Math.min(VMAX,v)-VMIN)/(VMAX-VMIN),1/1.7);\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Armar las mesas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nconst SQ3=Math.sqrt(3)/2;\nfunction triangulo(filas,orden,sep){// filas hacia el pie, la primera (v\u00e9rtice) en el punto de pie\n  const out=[];let k=0;const s=D+(sep||0.0004);\n  for(let r=0;r<filas.length;r++)for(let c=0;c<filas[r];c++){out.push({n:orden[k++],x:q6(PIE_X+r*s*SQ3),y:q6(W/2+(c-(filas[r]-1)/2)*s)});}\n  return out;\n}\nfunction armar(modo,seed){\n  const R_=rng(seed||1),mez=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R_()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\n  const blanca={n:0,x:q6(CABECERA*0.6),y:q6(W/2+(R_()-0.5)*0.2)};\n  if(modo==='b8'){// 8 en el centro; atr\u00e1s, en las puntas, una lisa y una rayada\n    const lis=mez([1,2,3,4,5,6,7]),ray=mez([9,10,11,12,13,14,15]);const atr=R_()<0.5?[lis.pop(),ray.pop()]:[ray.pop(),lis.pop()];\n    const resto=mez(lis.concat(ray)),o=new Array(15);\n    o[4]=8;o[10]=atr[0];o[14]=atr[1];let k=0;for(let i=0;i<15;i++)if(o[i]===undefined)o[i]=resto[k++];\n    return [blanca].concat(triangulo([1,2,3,4,5],o));}\n  if(modo==='b9'){const r=mez([2,3,4,5,6,7,8]),o=[1,r[0],r[1],r[2],9,r[3],r[4],r[5],r[6]];return [blanca].concat(triangulo([1,2,3,2,1],o));}\n  if(modo==='b10'){const r=mez([2,3,4,5,6,7,8,9]),o=[1,r[0],r[1],r[2],10,r[3],r[4],r[5],r[6],r[7]];return [blanca].concat(triangulo([1,2,3,4],o));}\n  if(modo==='caram'||modo==='tres'){return [{n:0,x:q6(L*0.25),y:q6(W*0.40)},{n:1,x:q6(L*0.25),y:q6(W*0.60)},{n:2,x:q6(L*0.75),y:q6(W*0.5)}];}\n  return [blanca];\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Ayudas de geometr\u00eda \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\nfunction libre(bolas,x,y,menos){// \u00bfse puede poner una bola ac\u00e1?\n  if(x<R||x>L-R||y<R||y>W-R)return false;\n  for(const b of bolas){if(!b.on||b.n===menos)continue;const dx=b.x-x,dy=b.y-y;if(dx*dx+dy*dy<(D+0.0005)*(D+0.0005))return false;}\n  return true;\n}\n// Reponer una bola en el punto de pie: si est\u00e1 ocupado, hacia la banda de pie y si no hay lugar, hacia la cabecera.\nfunction reponer(bolas,n){\n  const b=bolas.find(x=>x.n===n);if(!b)return;\n  const prueba=x=>libre(bolas,x,W/2,n);\n  let x=PIE_X;\n  if(!prueba(x)){let ok=false;for(x=PIE_X;x<=L-R;x+=0.002)if(prueba(x)){ok=true;break;}\n    if(!ok)for(x=PIE_X;x>=R;x-=0.002)if(prueba(x)){ok=true;break;}\n    if(!ok)x=PIE_X;}\n  b.x=q6(x);b.y=q6(W/2);b.on=1;\n}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Reglas \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   El estado de una partida (todo serializable, viaja por la red):\n   {v, id, modo:'b8'|'b9'|'b10'|'caram'|'tres'|'libre', reglas:{decl8, meta, serie, guia, reloj}, equipos:[[lugares],[lugares]],\n    bolas:[{n,x,y,on}], turno (equipo), prox:[i,i] (qui\u00e9n del equipo tira), grupos:[g,g] ('lisas'|'rayadas'|null),\n    abierta, apertura, enMano:null|'cabecera'|'mesa', decision:null|{eq}, puntos, innings, racks, abre, fin, msg, rev, tiros} */\nconst LISAS=[1,2,3,4,5,6,7],RAYADAS=[9,10,11,12,13,14,15];\nconst NOMBRE_MODO={b8:'Bola 8',b9:'Bola 9',b10:'Bola 10',caram:'Carambola libre',tres:'Tres bandas',libre:'Entrenamiento'};\nconst esCarambola=m=>m==='caram'||m==='tres';\nfunction nuevaPartida(cfg){\n  cfg=cfg||{};const modo=cfg.modo||'b8',n=cfg.n===4&&modo==='b8'?4:2,seed=cfg.seed||Math.floor(Math.random()*2147483646)+1;\n  const reglas={decl8:cfg.decl8!==false,meta:esCarambola(modo)?(cfg.meta||(modo==='tres'?5:10)):0,serie:esCarambola(modo)?1:(cfg.serie||1),guia:cfg.guia||'basica',reloj:cfg.reloj||0};\n  const abre=cfg.abre!=null?cfg.abre:(seed%2);\n  const Gm={v:1,pv:PHYS_V,rv:REGLAS_V,id:cfg.id||seed.toString(36),modo,reglas,n,equipos:n===4?[[0,2],[1,3]]:[[0],[1]],seed,\n    bolas:[],turno:abre,prox:[0,0],grupos:[null,null],abierta:true,apertura:!esCarambola(modo)&&modo!=='libre',enMano:null,decision:null,\n    puntos:[0,0],innings:[0,0],racks:[0,0],rack:1,abre,fin:null,msg:'',ult:null,rev:0,tiros:0,sinEmbocar:0,compensa:null,historia:[]};\n  rearmar(Gm,abre);\n  return Gm;\n}\nfunction rearmar(Gm,abre){\n  Gm.bolas=armar(Gm.modo,(Gm.seed+Gm.rack*7919)>>>0).map(b=>({...b,on:1}));\n  Gm.turno=abre;Gm.abre=abre;Gm.grupos=[null,null];Gm.abierta=true;Gm.apertura=!esCarambola(Gm.modo)&&Gm.modo!=='libre';\n  Gm.enMano=Gm.apertura?'cabecera':Gm.modo==='libre'?'mesa':null;Gm.decision=null;Gm.sinEmbocar=0;\n  if(esCarambola(Gm.modo)){// cada uno tira con su bola: el que abre, la blanca\n    Gm.bolaDe=abre===0?[0,1]:[1,0];Gm.innings=[0,0];Gm.innings[abre]=1;Gm.compensa=null;}\n}\nfunction clonar(Gm){return JSON.parse(JSON.stringify(Gm));}\nfunction tirador(Gm){const E=Gm.equipos[Gm.turno];return E[Gm.prox[Gm.turno]%E.length];}\nfunction equipoDe(Gm,lugar){return Gm.equipos[0].includes(lugar)?0:1;}\nconst enMesa=(Gm,ns)=>ns.filter(n=>Gm.bolas.some(b=>b.n===n&&b.on));\nconst grupoNums=g=>g==='lisas'?LISAS:g==='rayadas'?RAYADAS:[];\nconst familia=n=>n>=1&&n<=7?'lisas':n>=9&&n<=15?'rayadas':null;\nfunction menor(Gm){let m=99;for(const b of Gm.bolas)if(b.on&&b.n>0&&b.n<m)m=b.n;return m===99?null:m;}\n// Qu\u00e9 bolas se pueden tocar primero (para la gu\u00eda, la compu y los avisos).\nfunction legales(Gm){\n  const m=Gm.modo;\n  if(m==='libre')return Gm.bolas.filter(b=>b.on&&b.n).map(b=>b.n);\n  if(esCarambola(m)){const mia=Gm.bolaDe[Gm.turno];return [0,1,2].filter(n=>n!==mia);}\n  if(m==='b9'||m==='b10'){const x=menor(Gm);return x==null?[]:[x];}\n  if(Gm.apertura)return Gm.bolas.filter(b=>b.on&&b.n).map(b=>b.n);\n  const g=Gm.grupos[Gm.turno];if(Gm.abierta||!g)return Gm.bolas.filter(b=>b.on&&b.n&&b.n!==8).map(b=>b.n);\n  const quedan=enMesa(Gm,grupoNums(g));return quedan.length?quedan:[8];\n}\nconst bolaTaco=Gm=>esCarambola(Gm.modo)?Gm.bolaDe[Gm.turno]:0;\n// \u00bfHace falta cantar tronera (y bola) en este tiro?\nfunction pideDeclarar(Gm){\n  if(Gm.apertura||Gm.fin||Gm.decision)return null;\n  if(Gm.modo==='b8'&&Gm.reglas.decl8){const L_=legales(Gm);if(L_.length===1&&L_[0]===8)return 'tronera';}\n  if(Gm.modo==='b10')return 'bola';\n  return null;\n}\nfunction apex(Gm){// la bola del v\u00e9rtice (la m\u00e1s cercana a la cabecera en el armado)\n  if(Gm.modo==='b9'||Gm.modo==='b10')return 1;\n  let best=null,bx=9;for(const b of Gm.bolas)if(b.on&&b.n&&b.x<bx){bx=b.x;best=b.n;}return best;\n}\n// Resumen del tiro a partir de los eventos de la f\u00edsica.\nfunction leerTiro(ev,taco){\n  const r={primera:null,primeraT:0,bandasTras:false,bandaBolas:new Set(),cayeron:[],blanca:false,contactos:[],bandasTaco:[],bandas:0,error:null};\n  for(const e of ev){\n    if(e.k==='bb'){const otra=e.n===taco?e.m:e.m===taco?e.n:null;if(otra!=null){if(r.primera==null){r.primera=otra;r.primeraT=e.t;}r.contactos.push({n:otra,t:e.t});}}\n    else if(e.k==='banda'){r.bandas++;if(r.primera!=null)r.bandasTras=true;r.bandaBolas.add(e.n);if(e.n===taco)r.bandasTaco.push(e.t);}\n    else if(e.k==='tronera'){r.cayeron.push({n:e.n,p:e.p,t:e.t});if(e.n===taco)r.blanca=true;}\n    else if(e.k==='error')r.error=e;\n  }\n  return r;\n}\n// Aplicar un tiro: valida, simula y arbitra. input: {dx,dy,p (0\u20261),a,b, x,y (la blanca, si estaba en mano), bola, tronera}\n// Devuelve {G (nuevo estado), sim, res} o {err}.\nfunction validar(Gm,inp){\n  if(Gm.fin)return 'La partida termin\u00f3.';\n  if(Gm.decision)return 'Hay que elegir qu\u00e9 hacer con la apertura.';\n  const nums=['dx','dy','p','a','b'];for(const k of nums)if(inp[k]!=null&&!Number.isFinite(inp[k]))return 'Tiro inv\u00e1lido.';\n  if(!(inp.p>0&&inp.p<=1))return 'Eleg\u00ed la fuerza.';\n  if(!(Math.abs(inp.dx)+Math.abs(inp.dy)>0))return 'Tiro inv\u00e1lido.';\n  if(Gm.enMano&&inp.x!=null){if(!Number.isFinite(inp.x)||!Number.isFinite(inp.y))return 'La blanca no puede ir ah\u00ed.';\n    if(!libre(Gm.bolas,inp.x,inp.y,bolaTaco(Gm)))return 'La blanca no puede ir ah\u00ed.';\n    if(Gm.enMano==='cabecera'&&inp.x>CABECERA)return 'En una. Cambia el turno.'};\n  }\n  // \u2500\u2500 Bola 9 \u2500\u2500\n  if(m==='b9'){\n    const nueve=cayN.includes(9);\n    if(nueve&&!falta){G2.enMano=null;ganaRack(G2,eq,'Meti\u00f3 la 9');return {msg:'\u00a1Meti\u00f3 la 9! Gana el rack.',gana:eq};}\n    if(nueve)reponer(G2.bolas,9);\n    if(falta){if(T.blanca)ponerBlanca();G2.turno=rival;G2.enMano='mesa';return {msg:`${falta}${nueve?' (la 9 vuelve al punto)':''}. Blanca en mano para el rival.`,falta};}\n    if(cay.length)return {msg:`\u00a1Adentro! ${cuantoN(cayN)} Segu\u00eds.`,sigue:true};\n    G2.turno=rival;return {msg:'No entr\u00f3 ninguna. Cambia el turno.'};\n  }\n  // \u2500\u2500 Bola 10 \u2500\u2500\n  if(m==='b10'){\n    const diez=cay.find(x=>x.n===10),ok=cay.some(x=>x.n===inp.bola&&x.p===inp.tronera);\n    if(diez&&!falta&&ok&&inp.bola===10&&G2._ultima10){G2.enMano=null;ganaRack(G2,eq,'Meti\u00f3 la 10 cantada');return {msg:'\u00a1Meti\u00f3 la 10 en la tronera cantada! Gana el rack.',gana:eq};}\n    if(diez)reponer(G2.bolas,10);\n    if(falta){if(T.blanca)ponerBlanca();G2.turno=rival;G2.enMano='mesa';return {msg:`${falta}${diez?' (la 10 vuelve al punto)':''}. Blanca en mano para el rival.`,falta};}\n    if(ok)return {msg:`\u00a1La ${inp.bola} entr\u00f3 donde la cantaste!${diez&&inp.bola!==10?' La 10 vuelve al punto.':''} Segu\u00eds.`,sigue:true};\n    G2.turno=rival;\n    return {msg:cay.length?`${cay.some(x=>x.n===inp.bola)?`La ${inp.bola} entr\u00f3 en otra tronera`:`Entr\u00f3 ${listaN(cayN)}, no la cantada`}${diez?' (la 10 vuelve al punto)':''}. Cambia el turno.`:'No entr\u00f3 la cantada. Cambia el turno.'};\n  }\n  return {msg:''};\n}\n// Bolas del v\u00e9rtice y legales \u00abal empezar el tiro\u00bb (se calculan antes de simular: ver prepararTiro).\nfunction legalesAntes(G2){return G2._leg||[];}\nfunction arbCarambola(G2,T,eq){\n  const mia=G2.bolaDe[eq],otras=[0,1,2].filter(n=>n!==mia),rival=1-eq;\n  // la primera vez que toca cada una de las otras dos\n  const t1={};for(const c of T.contactos)if(otras.includes(c.n)&&t1[c.n]==null)t1[c.n]=c.t;\n  let punto=t1[otras[0]]!=null&&t1[otras[1]]!=null,falta=null;\n  if(punto&&G2.modo==='tres'){const seg=Math.max(t1[otras[0]],t1[otras[1]]),nb=T.bandasTaco.filter(t=>t<=seg).length;if(nb<3){punto=false;falta=`Toc\u00f3 las dos, pero con ${nb} banda${nb===1?'':'s'} antes de la segunda (hacen falta 3)`;}}\n  if(punto){G2.puntos[eq]++;\n    const meta=G2.reglas.meta;\n    if(G2.compensa!=null&&G2.compensa===eq){// el turno de compensaci\u00f3n\n      if(G2.puntos[eq]>=meta){G2.fin={gana:G2.puntos[0]===G2.puntos[1]?-1:eq,motivo:G2.puntos[0]===G2.puntos[1]?'Empate':'Lleg\u00f3 a '+meta};return {msg:G2.puntos[0]===G2.puntos[1]?`\u00a1Carambola! Empatan a ${meta}.`:'\u00a1Carambola! Gana.',gana:G2.fin.gana};}\n      return {msg:`\u00a1Carambola! ${G2.puntos[eq]} de ${meta}. Segu\u00eds.`,sigue:true};}\n    if(G2.puntos[eq]>=meta){\n      if(G2.innings[rival]<G2.innings[eq]){G2.compensa=rival;cambiarTurno(G2);return {msg:`\u00a1Lleg\u00f3 a ${meta}! Le queda un \u00faltimo turno al otro para empatar.`,sigue:false};}\n      G2.fin={gana:eq,motivo:'Lleg\u00f3 a '+meta};return {msg:`\u00a1Carambola! Lleg\u00f3 a ${meta} y gana.`,gana:eq};}\n    return {msg:`\u00a1Carambola! ${G2.puntos[eq]} de ${meta}. Segu\u00eds.`,sigue:true};}\n  if(G2.compensa!=null&&G2.compensa===eq){G2.fin={gana:rival,motivo:'Lleg\u00f3 a '+G2.reglas.meta};return {msg:'No hizo carambola: gana el otro.',gana:rival};}\n  cambiarTurno(G2);\n  const que=t1[otras[0]]==null&&t1[otras[1]]==null?'No toc\u00f3 ninguna':t1[otras[0]]==null||t1[otras[1]]==null?'Toc\u00f3 una sola':'';\n  return {msg:`${falta||que}. Cambia el turno.`,falta:null};\n}\nconst listaN=a=>a.length===1?`la ${a[0]}`:'la '+a.slice(0,-1).join(', la ')+' y la '+a[a.length-1];\nconst cuantoN=a=>a.length===1?`Entr\u00f3 la ${a[0]}.`:`Entraron ${listaN(a)}.`;\n// Antes de simular se anota lo que vale \u00abal empezar el tiro\u00bb (la 8 habilitada, si la 10 es la \u00faltima, el v\u00e9rtice).\nconst _jugar=jugarTiro;\nfunction jugar(Gm,inp,op){\n  const G0=clonar(Gm);G0._leg=legales(Gm);G0._apex=Gm.apertura?apex(Gm):null;\n  const g=Gm.grupos[Gm.turno];G0._ocho=Gm.modo==='b8'&&!Gm.abierta&&!!g&&enMesa(Gm,grupoNums(g)).length===0;\n  G0._ultima10=Gm.modo==='b10'&&enMesa(Gm,[1,2,3,4,5,6,7,8,9]).length===0;\n  const r=_jugar(G0,inp,op);if(r.err)return r;\n  delete r.G._leg;delete r.G._apex;delete r.G._ocho;delete r.G._ultima10;delete r.G._antesBolas;return r;\n}\n// La apertura ilegal: el rival elige seguir con blanca en mano o rearmar y abrir \u00e9l.\nfunction decidirApertura(Gm,que){\n  if(!Gm.decision)return Gm;const G2=clonar(Gm),eq=G2.decision.eq;G2.decision=null;G2.rev++;\n  if(que==='rearmar'){rearmar(G2,eq);G2.msg='Se rearma la mesa: abre el otro.';}\n  else{G2.turno=eq;G2.enMano='mesa';G2.msg='Sigue la mesa como qued\u00f3, con blanca en mano.';}\n  return G2;\n}\n// Se acab\u00f3 el tiempo del tiro: falta (blanca en mano para el rival); en carambola, pasa el turno sin mover nada.\nfunction tiempo(Gm){\n  if(Gm.fin||Gm.decision)return Gm;const G2=clonar(Gm),eq=G2.turno;G2.rev++;\n  if(esCarambola(G2.modo)){if(G2.compensa===eq){G2.fin={gana:1-eq,motivo:'Se le acab\u00f3 el tiempo'};G2.msg='Se acab\u00f3 el tiempo.';return G2;}cambiarTurno(G2);G2.msg='Se acab\u00f3 el tiempo. Cambia el turno.';return G2;}\n  rotar(G2,eq);\n  G2.turno=1-eq;G2.enMano=G2.apertura?'cabecera':'mesa';if(G2.apertura)G2.abre=G2.turno;G2.msg='Se acab\u00f3 el tiempo: blanca en mano para el rival.';\n  G2.ult={lugar:tirador(Gm),eq,msg:G2.msg,falta:'tiempo',rev:G2.rev};\n  return G2;\n}\n// Rendirse / abandonar.\nfunction abandonar(Gm,eq){const G2=clonar(Gm);G2.fin={gana:1-eq,motivo:'Abandono'};G2.rev++;G2.msg='Abandon\u00f3.';return G2;}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La gu\u00eda de punter\u00eda \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   L\u00ednea recta de la blanca hasta lo primero que toque (una bola o una banda). Si es una bola: d\u00f3nde queda la \u00abbola\n   fantasma\u00bb, hacia d\u00f3nde sale la bola tocada y hacia d\u00f3nde se abre la blanca. Es orientativa: no calcula el efecto. */\nfunction rayoBola(cx,cy,dx,dy,bx,by,rr){// distancia hasta que el centro pase a rr de (bx,by)\n  const fx=cx-bx,fy=cy-by,b=fx*dx+fy*dy,c=fx*fx+fy*fy-rr*rr;if(c<0)return 0;const disc=b*b-c;if(disc<0||b>0)return -1;return -b-Math.sqrt(disc);}\nfunction rayoBanda(cx,cy,dx,dy){let t=1e9,nx=0,ny=0;\n  if(dx>1e-9){const q=(L-R-cx)/dx;if(q<t){t=q;nx=-1;ny=0;}}if(dx<-1e-9){const q=(R-cx)/dx;if(q<t){t=q;nx=1;ny=0;}}\n  if(dy>1e-9){const q=(W-R-cy)/dy;if(q<t){t=q;nx=0;ny=-1;}}if(dy<-1e-9){const q=(R-cy)/dy;if(q<t){t=q;nx=0;ny=1;}}\n  return {t:Math.max(0,t),nx,ny};}\nfunction guia(Gm,dx,dy,cue){\n  const taco=bolaTaco(Gm),c=cue||Gm.bolas.find(b=>b.n===taco);if(!c)return null;\n  const l=Math.sqrt(dx*dx+dy*dy)||1;dx/=l;dy/=l;\n  const tramo=(cx,cy,dx,dy,excluir)=>{let best=-1,bn=null;\n    for(const b of Gm.bolas){if(!b.on||b.n===taco||b.n===excluir)continue;const t=rayoBola(cx,cy,dx,dy,b.x,b.y,D);if(t>=0&&(best<0||t<best)){best=t;bn=b;}}\n    const rb=rayoBanda(cx,cy,dx,dy);\n    if(bn&&best<=rb.t)return {t:best,bola:bn};return {t:rb.t,banda:rb};};\n  const r1=tramo(c.x,c.y,dx,dy);const out={x0:c.x,y0:c.y,x1:c.x+dx*r1.t,y1:c.y+dy*r1.t,dx,dy};\n  if(r1.bola){const gx=out.x1,gy=out.y1,nx=(r1.bola.x-gx)/D,ny=(r1.bola.y-gy)/D,dot=dx*nx+dy*ny;\n    out.bola=r1.bola.n;out.bx=r1.bola.x;out.by=r1.bola.y;out.ox=nx;out.oy=ny;out.fuerza=dot;\n    let tx=dx-dot*nx,ty=dy-dot*ny;const tl=Math.sqrt(tx*tx+ty*ty);out.tx=tl>1e-6?tx/tl:0;out.ty=tl>1e-6?ty/tl:0;out.tl=tl;\n    out.leg=legales(Gm).includes(r1.bola.n);\n    // \u00bfad\u00f3nde va la bola tocada? (para cantar tronera solo)\n    out.tronera=troneraHacia(r1.bola.x,r1.bola.y,nx,ny);}\n  else if(r1.banda){const b=r1.banda,vn=dx*b.nx+dy*b.ny;out.rx=dx-2*vn*b.nx;out.ry=dy-2*vn*b.ny;\n    const r2=tramo(out.x1,out.y1,out.rx,out.ry);out.x2=out.x1+out.rx*r2.t;out.y2=out.y1+out.ry*r2.t;if(r2.bola){out.bola2=r2.bola.n;}}\n  return out;\n}\n// La tronera m\u00e1s alineada con una direcci\u00f3n (para sugerir d\u00f3nde cantar)\nfunction troneraHacia(x,y,dx,dy){const P=MESAS.pool.pockets;let best=-1,bv=-2;\n  for(let p=0;p<6;p++){const ax=P[p].mx-x,ay=P[p].my-y,l=Math.sqrt(ax*ax+ay*ay)||1,c=(ax*dx+ay*dy)/l;if(c>bv){bv=c;best=p;}}return bv>0.6?best:-1;}\n\n/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 La compu \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n   Piensa con la misma f\u00edsica: arma tiros posibles (de la blanca a la \u00abbola fantasma\u00bb de cada bola que vale, hacia cada\n   tronera), los simula sin error, se queda con el que mete y deja mejor parada la blanca, y despu\u00e9s tira con el pulso de\n   su nivel (un poco de error en el \u00e1ngulo y la fuerza). No ve el futuro: no sabe con qu\u00e9 error le va a salir.\n   F\u00e1cil: pocas opciones, mucho error, no piensa la posici\u00f3n. Normal: piensa la posici\u00f3n. Dif\u00edcil: adem\u00e1s prueba que el\n   tiro sea seguro con peque\u00f1os errores y, si no hay nada claro, juega de defensa. */\nconst NIVELES={facil:{cand:4,err:2.7,errP:0.18,pos:false,seguro:false,def:false,sims:10},normal:{cand:7,err:0.9,errP:0.08,pos:true,seguro:false,def:true,sims:24},dificil:{cand:10,err:0.4,errP:0.045,pos:true,seguro:true,def:true,sims:46}};\n// Ruido con forma de campana (desv\u00edo 1): la suma de cuatro al azar, sin funciones trascendentes\nconst gauss=R_=>(R_()+R_()+R_()+R_()-2)*1.7320508;\nfunction despejado(Gm,x0,y0,x1,y1,excl,rr){// \u00bfninguna bola corta el camino de (x0,y0) a (x1,y1)?\n  const dx=x1-x0,dy=y1-y0,l2=dx*dx+dy*dy;if(l2<1e-9)return true;\n  for(const b of Gm.bolas){if(!b.on||excl.includes(b.n))continue;let t=((b.x-x0)*dx+(b.y-y0)*dy)/l2;if(t<0||t>1)continue;const qx=x0+dx*t,qy=y0+dy*t;if((b.x-qx)**2+(b.y-qy)**2<rr*rr)return false;}\n  return true;}\n// Tiros directos posibles desde (cx,cy): [{n, p (tronera), dx,dy, corte, dist, puntaje}]\nfunction candidatos(Gm,cx,cy,leg){\n  const out=[],taco=bolaTaco(Gm),P=MESAS.pool.pockets;\n  for(const n of leg){const b=Gm.bolas.find(x=>x.n===n&&x.on);if(!b)continue;\n    for(let p=0;p<6;p++){const pk=P[p];let ax=pk.mx-b.x,ay=pk.my-b.y;const d2=Math.sqrt(ax*ax+ay*ay);if(d2<1e-6)continue;ax/=d2;ay/=d2;\n      // \u00e1ngulo de llegada a la tronera (las laterales no aceptan llegadas muy cruzadas)\n      const lleg=ax*pk.ax+ay*pk.ay;if(lleg<(pk.esq?0.38:0.42))continue;\n      const gx=b.x-ax*D,gy=b.y-ay*D;if(gx<R||gx>L-R||gy<R||gy>W-R)continue;\n      let dx=gx-cx,dy=gy-cy;const d1=Math.sqrt(dx*dx+dy*dy);if(d1<1e-6)continue;dx/=d1;dy/=d1;\n      const corte=dx*ax+dy*ay;if(corte<0.14)continue;\n      if(!despejado(Gm,cx,cy,gx,gy,[taco,n],D*0.98))continue;\n      if(!despejado(Gm,b.x,b.y,pk.mx,pk.my,[taco,n],D*0.95))continue;\n      const pt=corte*corte*(pk.esq?1:0.85)*lleg/(1+0.35*d1+0.55*d2);\n      out.push({n,p,dx,dy,corte,d1,d2,pt});}}\n  return out.sort((a,b)=>b.pt-a.pt);}\n// Qu\u00e9 tan f\u00e1cil queda la mesa para el que tira desde (cx,cy): el mejor puntaje de tiro directo.\nfunction facilidad(Gm,cx,cy,leg){const c=candidatos(Gm,cx,cy,leg);return c.length?c[0].pt+0.15*Math.min(3,c.length-1)*c[c.length>1?1:0].pt:0;}\n// Eval\u00faa el resultado de un tiro para el que tira (m\u00e1s alto = mejor).\nfunction valorar(Gm,r,eq,niv){\n  const G2=r.G;\n  if(G2.fin)return G2.fin.gana===eq?10000:G2.fin.gana===-1?0:-10000;\n  if(G2.siguiente&&G2.siguiente.gana!==undefined&&G2.rack>Gm.rack)return G2.siguiente.gana===eq?5000:-5000;\n  if(G2.decision)return -120;\n  let v=0;\n  if(r.res.falta)v-=150;\n  if(G2.turno===eq&&!G2.decision){v+=200;\n    if(niv.pos){const c=G2.bolas.find(b=>b.n===bolaTaco(G2));if(c)v+=120*facilidad(G2,c.x,c.y,legales(G2));}}\n  else{// le deja la mesa al otro\n    if(niv.def){const c=G2.bolas.find(b=>b.n===bolaTaco(G2));if(c&&!G2.enMano)v-=90*facilidad(G2,c.x,c.y,legales(G2));else if(G2.enMano)v-=60;}}\n  if(G2.modo==='b8'&&!r.res.falta){const g=G2.grupos[eq];if(g){const ant=enMesa(Gm,grupoNums(g)).length,des=enMesa(G2,grupoNums(g)).length;v+=25*(ant-des);}}\n  return v;\n}\n// Velocidad que hace falta, m\u00e1s o menos, para que la bola llegue a la tronera con margen.\nfunction velPara(c){const vObj=1.15*Math.sqrt(2*MU_R*G*(c.d2+0.15))+0.4,vImp=vObj/Math.max(0.25,c.corte)/0.97;return Math.min(VMAX,Math.sqrt(vImp*vImp+2*MU_R*G*c.d1*3)+0.05);}\nfunction pensar(Gm,nivel,seed){\n  const niv=NIVELES[nivel]||NIVELES.normal,R_=rng(seed||7),eq=Gm.turno,taco=bolaTaco(Gm),pide=pideDeclarar(Gm);\n  let presup=niv.sims;\n  const probar=inp=>{if(presup<=0)return null;presup--;const r=jugar(Gm,inp,{cuadros:false});if(r.err)return null;return {inp,r,v:valorar(Gm,r,eq,niv)};};\n  let cue=Gm.bolas.find(b=>b.n===taco);\n  if(Gm.decision)return {decidir:R_()<0.5?'aceptar':'rearmar'};\n  // la apertura: fuerte al v\u00e9rtice\n  if(Gm.apertura){const a=Gm.bolas.find(b=>b.n===apex(Gm));const cx=CABECERA*0.55,cy=W/2+(R_()-0.5)*0.25*(nivel==='facil'?1:0.6);\n    let dx=a.x-cx,dy=a.y-cy;const l=Math.sqrt(dx*dx+dy*dy);dx/=l;dy/=l;const e=(R_()-0.5)*0.004*(nivel==='facil'?2:1);\n    return {inp:{dx:dx-dy*e,dy:dy+dx*e,p:nivel==='facil'?0.82:0.95,a:0,b:-0.08,x:cx,y:cy}};}\n  if(esCarambola(Gm.modo))return pensarCarambola(Gm,niv,R_,nivel);\n  const leg=legales(Gm);\n  // blanca en mano: busca el mejor lugar\n  if(Gm.enMano){let bx=cue.x,by=cue.y,bv=-1;const pasos=nivel==='facil'?5:8;\n    for(let i=1;i<=pasos*2;i++)for(let j=1;j<pasos;j++){const x=i*L/(pasos*2+1),y=j*W/pasos;if(Gm.enMano==='cabecera'&&x>CABECERA)continue;if(!libre(Gm.bolas,x,y,taco))continue;\n      const f=facilidad(Gm,x,y,leg)+R_()*0.01;if(f>bv){bv=f;bx=x;by=y;}}\n    cue={n:taco,x:bx,y:by};}\n  const conMano=o=>Gm.enMano?{...o,x:cue.x,y:cue.y}:o;\n  const cands=candidatos(Gm,cue.x,cue.y,leg).slice(0,niv.cand);\n  let mejor=null;\n  for(const c of cands){const v0=velPara(c),pp=fuerzaDe(v0);\n    const opciones=niv.pos?[[pp,0,0],[Math.min(1,pp*1.25),0,0.25],[Math.min(1,pp*1.1),0,-0.3],[Math.min(1,pp*1.5),0,0]]:[[Math.min(1,pp*1.15),0,0]];\n    for(const [p,a,b] of opciones){const inp=conMano({dx:c.dx,dy:c.dy,p:Math.max(0.05,p),a,b});\n      if(pide==='tronera'){inp.tronera=c.p;}if(pide==='bola'){inp.bola=c.n;inp.tronera=c.p;}\n      const r=probar(inp);if(!r)continue;r.v+=c.pt*20;\n      if(!mejor||r.v>mejor.v)mejor=r;}}\n  // Dif\u00edcil: \u00bfel mejor aguanta un poco de error?\n  if(mejor&&niv.seguro&&mejor.v>100){let peor=mejor.v;for(const s of [-1,1]){const e=0.004*s,i=mejor.inp,inp={...i,dx:i.dx-i.dy*e,dy:i.dy+i.dx*e};const r=probar(inp);if(r)peor=Math.min(peor,r.v);}if(peor<0)mejor.v=(mejor.v+peor)/2;}\n  // defensa (o, en F\u00e1cil, cualquier toque a una bola que vale)\n  if(!mejor||mejor.v<150){\n    presup+=niv.def?10:4;\n    for(const n of leg.slice(0,6)){const b=Gm.bolas.find(x=>x.n===n&&x.on);if(!b)continue;\n      // a qu\u00e9 punto apuntar: directo si el camino est\u00e1 libre; si no, de una banda (reflejando la bola en cada banda)\n      const metas=[];if(despejado(Gm,cue.x,cue.y,b.x,b.y,[taco,n],D*0.98))metas.push({x:b.x,y:b.y,off:niv.def?[-0.6,0,0.6]:[0]});\n      else for(const [mx,my] of [[b.x,2*R-b.y],[b.x,2*(W-R)-b.y],[2*R-b.x,b.y],[2*(L-R)-b.x,b.y]])metas.push({x:mx,y:my,off:[0],banda:1});\n      for(const mt of metas){let dx=mt.x-cue.x,dy=mt.y-cue.y;const l=Math.sqrt(dx*dx+dy*dy);dx/=l;dy/=l;\n        for(const off of mt.off){const o=off*D/l;\n          for(const p of niv.def&&!mt.banda?[0.28,0.45]:[mt.banda?0.5:0.4]){const inp=conMano({dx:dx-dy*o,dy:dy+dx*o,p,a:0,b:0});\n            const tr=troneraHacia(b.x,b.y,dx,dy);if(pide==='tronera')inp.tronera=tr>=0?tr:0;\n            if(pide==='bola'){inp.bola=n;inp.tronera=Math.max(0,tr);}\n            const r=probar(inp);if(r&&(!mejor||r.v>mejor.v))mejor=r;}}}}}\n  if(!mejor){// nada: tira derecho a la primera que vale\n    const b=Gm.bolas.find(x=>x.on&&leg.includes(x.n))||Gm.bolas.find(x=>x.on&&x.n!==taco);let dx=b.x-cue.x,dy=b.y-cue.y; /* ───────── Sonido ─────────
   El taco (según la fuerza), el choque de bolas (según la energía), la banda, la caída en la tronera, la falta, el aviso
   de turno y una victoria corta. No hay música: no se mezcla con nada. Como mucho 6 sonidos a la vez. */

function ruido(){const a=actx();if(!RUIDO){const n=Math.floor(a.sampleRate*.08);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);}return RUIDO;}
function golpeRuido(t0,v,fq,q,dur=.06){const a=actx(),t=a.currentTime+t0,s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=ruido();bp.type='bandpass';bp.frequency.value=fq;bp.Q.value=q;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);s.connect(bp).connect(g).connect(MASTER);s.start(t);s.stop(t+dur+.02);SON_VIVOS++;s.onended=()=>{SON_VIVOS--;try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
function tono(f,t0,d,v,tipo='sine',f2){const a=actx(),t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.connect(g).connect(MASTER);o.start(t);o.stop(t+d+.03);SON_VIVOS++;o.onended=()=>{SON_VIVOS--;try{o.disconnect();g.disconnect();}catch(_){}};}

  taco(e){const v=Math.min(1,e/5);golpeRuido(0,.25+.5*v,1500+800*v,1.4,.05);tono(180+120*v,0,.07,.05+.08*v,'triangle',90);},

/* ───────── PoolAR: la mesa en el canvas ─────────
   El mundo tiene sus propias coordenadas (metros); girar el celular o cambiar el tamaño sólo cambia la vista: nunca
   mueve las bolas. En vertical la mesa se gira 90° (la cabecera queda abajo) para aprovechar la pantalla.
   · El fondo (madera, bandas, troneras, paño, diamantes) se dibuja una vez en un canvas aparte.
   · Cada bola se pinta pixel por pixel en su propio canvas chiquito (con su número que gira al rodar) y sólo se repinta
     cuando giró algo; después se copia a la mesa. Las sombras y el taco van encima. */
const CV=$('cv'),CX=CV.getContext('2d');
const FR_C=0.042,FR_M=0.075,FR=FR_C+FR_M;   // ancho de la banda de goma y de la madera (en metros)
const VIEW={w:0,h:0,dpr:1,k:100,rot:0,ox:0,oy:0};
function medir(){
  const z=$('zona'),w=z.clientWidth,h=z.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  const eW=P.L+2*FR,eH=P.W+2*FR,kH=Math.min(w/eW,h/eH),kV=Math.min(w/eH,h/eW);

/* ── La animación de un tiro: se reproduce lo que calculó la física ── */
let ANIM=null;const CAIDAS=[];
function empezarAnim(sim,fin){
  const nb=[];const f0=sim.cuadros[0];const nums=[];// el orden de las bolas en los cuadros = el de ANTES del tiro
  ANIM={sim,t0:performance.now(),fin,pos:[],ev:sim.ev.slice(),i:0,nums:sim.nums,ult:{}};
  for(let i=0;i<sim.nums.length;i++){ANIM.ult[sim.nums[i]]=[f0[2*i],f0[2*i+1]];}
  avanzarAnim(ANIM.t0);pedir();
}
function avanzarAnim(now){
  const A=ANIM,cs=A.sim.cuadros,vel=FAST?1e6:1;let t=(now-A.t0)/1000*vel;const tf=(cs.length-1)/60;
  // los cuadros van cada 1/60 s, salvo el último (cuando se quedan quietas)
  if(t>=tf)t=tf;if(!(t>0))t=0;
  const fi=Math.min(cs.length-1,Math.floor(t*60)),fr=Math.min(1,t*60-fi),a=cs[fi],b=cs[Math.min(cs.length-1,fi+1)];
  A.pos=[];
  for(let i=0;i<A.nums.length;i++){const n=A.nums[i];let x=a[2*i],y=a[2*i+1];const x2=b[2*i],y2=b[2*i+1];
    if(isNaN(x))continue;if(!isNaN(x2)){x+=(x2-x)*fr;y+=(y2-y)*fr;}
    const u=A.ult[n];if(u){rodar(n,x-u[0],y-u[1]);}A.ult[n]=[x,y];A.pos.push({n,x,y});}
  // sonidos y caídas
  while(A.i<A.ev.length&&A.ev[A.i].t<=t){const e=A.ev[A.i++];
    if(e.k==='bb')sfx('bola',e.e);else if(e.k==='banda')sfx('banda',e.e);
    else if(e.k==='tronera'){sfx('tronera');const pk=P.MESAS.pool.pockets[e.p],u=A.ult[e.n]||[pk.x,pk.y];if(pk)CAIDAS.push({n:e.n,x:u[0],y:u[1],px:pk.x,py:pk.y,t0:now});}}
  if(t>=tf){const f=A.fin;ANIM=null;f&&f();}
}

/* ───────── PoolAR: la partida ─────────

   el entrenamiento y el tutorial. En línea, el que arma la mesa es la autoridad (enlinea.js). */
let G=null;                 // el estado de la partida (motor)

let CFG={modo:ls.get('pool-modo')||'b8',dif:ls.get('pool-dif')||'normal',serie:Number(ls.get('pool-serie'))===3?3:1,meta:Number(ls.get('pool-meta'))||0,guia:ls.get('pool-guia')||'basica',reloj:Number(ls.get('pool-reloj'))||0,n:Number(ls.get('pool-n'))===4?4:2};
if(!MODOS.some(m=>m[0]===CFG.modo))CFG.modo='b8';if(!DIFN[CFG.dif])CFG.dif='normal';if(!['basica','extendida','sin'].includes(CFG.guia))CFG.guia='basica';
function guardarCfg(){ls.set('pool-modo',CFG.modo);ls.set('pool-dif',CFG.dif);ls.set('pool-serie',String(CFG.serie));ls.set('pool-meta',String(CFG.meta||0));ls.set('pool-guia',CFG.guia);ls.set('pool-reloj',String(CFG.reloj||0));ls.set('pool-n',String(CFG.n));}

/* ───────── Empezar ───────── */

  const modo=op.modo||CFG.modo,meta=modo==='caram'?(CFG.meta||10):modo==='tres'?(CFG.meta&&CFG.meta<=10?CFG.meta:5):0;
  G=P.nuevaPartida({modo,seed:op.seed,serie:CFG.serie,meta,guia:CFG.guia,reloj:op.reloj!=null?op.reloj:0,abre:op.abre!=null?op.abre:Math.random()<0.5?0:1});

function arrancar(){
  MESA_CARAM=P.esCarambola(G.modo);ORI.clear();BOLAS_CV.clear();FONDO=null;
  STATS={t0:Date.now(),seg:0,tiros:{},emb:{},faltas:{},turnoEmb:0,rackTir:{},limpia:true};
  AIM.p=AIM.p||0.4;AIM.a=AIM.b=0;MANO=null;otroOlvidar();BOT_AIM=null;
  apuntarInicial();pintarTodo();guardar();
  if(G.apertura)ponerEstado(`${P.NOMBRE_MODO[G.modo]} · abre ${G.equipos[G.turno].includes(YO)?'vos':nombreEq(G.turno)}`);

function apuntarInicial(){// hacia la bola que vale más cerca (o al vértice en la apertura)
  if(!G)return;const c=G.bolas.find(b=>b.n===P.bolaTaco(G)&&b.on);if(!c)return;
  const leg=P.legales(G);let best=null,bd=1e9;for(const b of G.bolas){if(!b.on||!leg.includes(b.n))continue;const d=(b.x-c.x)**2+(b.y-c.y)**2;if(d<bd){bd=d;best=b;}}
  if(G.apertura){const ap=G.bolas.find(b=>b.n===P.apex(G));if(ap)best=ap;}
  if(best)AIM.ang=Math.atan2(best.y-c.y,best.x-c.x);

  MODO='compu';YO=0;G=s.G;PERF=s.perf||PERF;TIPOS=s.tipos||['yo','bot'];
  MESA_CARAM=P.esCarambola(G.modo);ORI.clear();BOLAS_CV.clear();FONDO=null;
  STATS=s.st?{...s.st,t0:Date.now()}:{t0:Date.now(),seg:0,tiros:{},emb:{},faltas:{},turnoEmb:0,rackTir:{},limpia:true};

/* ───────── Quién juega ───────── */

  clearTimeout(RELOJ_T);RELOJ={hasta:0,total:0,lugar:-1};BOT_AIM=null;
  if(!G){FASE='nada';pintarTodo();return;}
  MESA_CARAM=P.esCarambola(G.modo);

  if(G.siguiente&&!G.siguienteVisto){G.siguienteVisto=1;const s=G.siguiente;toast(`🎱 Rack para ${esc(nombreEq(s.gana))} (${esc(s.motivo)}). Van ${G.racks[0]} a ${G.racks[1]}.`,3200);STATS.limpia=true;STATS.rackTir={};}
  if(G.decision){FASE='esperando';const eq=G.decision.eq,l=G.equipos[eq][G.prox[eq]%G.equipos[eq].length];
    pintarTodo();
    if(l===YO)abrirDecide();
    else if(esBot(l)&&autoridad()){const tk=BOTTOK;setTimeout(()=>{if(tk!==BOTTOK||!G||!G.decision)return;decidir(Math.random()<0.55?'aceptar':'rearmar');},FAST?0:1100);}
    else ponerEstado(`${esc(nombreLugar(l))} elige qué hacer con la apertura…`);
    return;}
  const t=P.tirador(G);
  if(t===YO&&MODO!=='guest'||t===YO&&MODO==='guest'){FASE='apuntar';prepararApuntar();arrancarReloj(t);pintarTodo();if(AUTO)setTimeout(autoYo,FAST?0:200);return;}

function prepararApuntar(){

  if(MANO&&G.enMano==='cabecera'&&MANO.x>P.CABECERA){MANO.x=P.CABECERA*0.6;}
  if(MANO&&!P.libre(G.bolas,MANO.x,MANO.y,MANO.n)){const p=lugarLibreCerca(MANO.x,MANO.y,MANO.n);MANO.x=p[0];MANO.y=p[1];}

function lugarLibreCerca(x,y,n){for(let r=0;r<0.6;r+=0.01)for(let k=0;k<16;k++){const a=k/16*Math.PI*2,px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;if((G.enMano!=='cabecera'||px<=P.CABECERA)&&P.libre(G.bolas,px,py,n))return [px,py];}return [x,y];}
// La declaración automática (8 y bola 10): la tronera hacia donde sale la bola según la guía; tocando otra se cambia.
function actualizarDecl(){

  const c=MANO||G.bolas.find(b=>b.n===P.bolaTaco(G)),gd=P.guia(G,Math.cos(AIM.ang),Math.sin(AIM.ang),c);
  if(d==='bola'&&gd&&gd.bola!=null&&!AIM.bolaManual)AIM.bola=gd.bola;
  if(!AIM.trManual&&gd&&gd.bola!=null&&gd.tronera>=0)AIM.tronera=gd.tronera;

/* ───────── Tirar ───────── */
function motivoNoTiro(){
  if(!G)return 'Empezá una partida';
  if(G.fin)return 'Terminó';
  if(FASE==='animando')return '';
  if(G.decision)return 'Elegí qué hacer';
  if(!miTurno())return (MODO==='guest'&&!ON)?'Sin conexión':`Tira ${nombreLugar(P.tirador(G))}`;
  if(FASE!=='apuntar')return '';
  if(!(AIM.p>0.005))return 'Elegí la fuerza';
  if(MANO&&MANO.mal)return 'La blanca no va ahí';
  const d=P.pideDeclarar(G);
  if(d==='tronera'&&!(AIM.tronera>=0))return 'Elegí la tronera de la 8';
  if(d==='bola'&&!(AIM.tronera>=0&&AIM.bola!=null))return 'Cantá bola y tronera';
  if(d==='bola'&&AIM.bola===10&&P.enMesa(G,[1,2,3,4,5,6,7,8,9]).length)return 'La 10 va al final';
  return '';
}
function armarInput(){
  const inp={dx:Math.cos(AIM.ang),dy:Math.sin(AIM.ang),p:AIM.p,a:AIM.a,b:AIM.b};
  if(G.enMano&&MANO){inp.x=MANO.x;inp.y=MANO.y;}
  const d=P.pideDeclarar(G);if(d){inp.tronera=AIM.tronera;if(d==='bola')inp.bola=AIM.bola;}
  return inp;
}
let ULT_TIRO=0;

// Con autoridad (contra la compu, entrenando o el que arma la mesa): simula, anima y arbitra.
function aplicarTiro(lugar,inp,alTerminar){
  const r=P.jugar(G,inp);if(r.err){if(lugar===YO)toast(esc(r.err));return r;}
  const G0=G;FASE='animando';cerrarDecide();clearTimeout(RELOJ_T);
  contarTiro(lugar,r,G0);
  if(MODO==='host')netResultado(inp,G0.rev,r.G);
  animarTiro(G0,inp,r,()=>{G=r.G;MANO=null;despuesDelTiro(r,lugar,G0);alTerminar&&alTerminar();});
  return r;
}
function animarTiro(G0,inp,r,fin){
  const taco=P.bolaTaco(G0),c=inp.x!=null?{x:inp.x,y:inp.y}:G0.bolas.find(b=>b.n===taco);
  if(inp.x!=null){const b=G0.bolas.find(x=>x.n===taco);if(b){b.x=inp.x;b.y=inp.y;}}
  otroOlvidar();BOT_AIM=null;AIM.ang=Math.atan2(inp.dy,inp.dx);
  const v=P.vel(inp.p),tira=6+inp.p*0.16*VIEW.k,skin=PERF_TACO(P.tirador(G0));
  GOLPE={t0:performance.now(),ms:FAST?1:Math.max(70,140-inp.p*70),c,ang:Math.atan2(inp.dy,inp.dx),tira,skin,
    fin:()=>{sfx('taco',v);if(P.tirador(G0)===YO)vibrar(12+Math.round(inp.p*25));empezarAnim(r.sim,fin);}};
  pintarTodo();pedir();
}
function PERF_TACO(l){return l===YO?tacoActual():(PERF[l]&&PERF[l].taco)||'club';}
function contarTiro(lugar,r,G0){
  if(!STATS)return;const T=r.T||{cayeron:[]};STATS.tiros[lugar]=(STATS.tiros[lugar]||0)+1;
  if(r.res&&r.res.falta)STATS.faltas[lugar]=(STATS.faltas[lugar]||0)+1;
  const eq=P.equipoDe(G0,lugar);STATS.rackTir[eq]=(STATS.rackTir[eq]||0)+1;
  const mias=T.cayeron.filter(x=>x.n!==P.bolaTaco(G0));
  if(!r.res.falta)STATS.emb[lugar]=(STATS.emb[lugar]||0)+mias.length;
  if(lugar===YO&&G0.modo!=='libre')lgTiro(r,G0,mias);
}
function despuesDelTiro(r,lugar,G0){

  guardar();

function arrancarReloj(lugar,ms){

  const total=seg*1000,rest=ms!=null?ms:total;RELOJ={hasta:Date.now()+rest,total,lugar};
  const tick=()=>{pintarReloj();if(!RELOJ.hasta)return;const q=RELOJ.hasta-Date.now();
    if(q<=0){RELOJ.hasta=0;pintarReloj();if(autoridad()&&G&&!G.fin&&(FASE==='apuntar'||FASE==='esperando'||FASE==='pensando')&&P.tirador(G)===lugar)seAcaboElTiempo();return;}
    if(q<5200&&lugar===YO&&Math.ceil(q/1000)!==RELOJ.ult){RELOJ.ult=Math.ceil(q/1000);if(RELOJ.ult<=5)sfx('msg');}

let WORKER=null,WK_ID=0;const WK_CB=new Map();
function worker(){if(WORKER!==null)return WORKER;
  try{const src=MOTOR_SRC+'\nonmessage=e=>{const d=e.data;let r;try{r=POOL.pensar(d.G,d.nivel,d.seed);}catch(err){r={error:String(err)};}postMessage({id:d.id,r});};';
    WORKER=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));WORKER.onmessage=e=>{const cb=WK_CB.get(e.data.id);WK_CB.delete(e.data.id);cb&&cb(e.data.r);};
    WORKER.onerror=()=>{WORKER=false;for(const [id,cb] of WK_CB){WK_CB.delete(id);cb(null);}};}catch(_){WORKER=false;}
  return WORKER;}
function pensarAsync(Gm,nivel,seed){return new Promise(res=>{const w=worker();
  if(w){const id=++WK_ID;const t=setTimeout(()=>{if(WK_CB.has(id)){WK_CB.delete(id);res(P.pensar(Gm,nivel,seed));}},8000);WK_CB.set(id,r=>{clearTimeout(t);res(r&&!r.error?r:P.pensar(Gm,nivel,seed));});w.postMessage({id,G:Gm,nivel,seed});}
  else setTimeout(()=>res(P.pensar(Gm,nivel,seed)),0);});}
function nivelBot(){return MODO==='compu'?CFG.dif:'normal';}
async function turnoBot(l){
  const tk=++BOTTOK,G0=G,nom=nombreLugar(l);
  $('piensa').textContent=`${nom} estudia la mesa…`;$('piensa').hidden=FAST;
  const t0=Date.now();const d=await pensarAsync(G0,nivelBot(),(G0.seed+G0.tiros*131+7)>>>0);
  if(tk!==BOTTOK||G!==G0)return;
  await wait(Math.max(0,(G0.apertura?500:800+Math.random()*900)-(Date.now()-t0)));if(tk!==BOTTOK||G!==G0)return;
  $('piensa').hidden=true;
  if(!d||d.decidir){decidir(d&&d.decidir||'aceptar');return;}
  const inp=d.inp;
  // blanca en mano: la acomoda
  if(inp.x!=null&&G.enMano&&!FAST){const c=G.bolas.find(b=>b.n===P.bolaTaco(G));MANO={n:c.n,x:c.x,y:c.y};const x0=c.x,y0=c.y,ms=450,t1=performance.now();
    await new Promise(res=>{const st=()=>{if(tk!==BOTTOK){res();return;}const u=Math.min(1,(performance.now()-t1)/ms),e=u*u*(3-2*u);MANO.x=x0+(inp.x-x0)*e;MANO.y=y0+(inp.y-y0)*e;dibujar(performance.now());if(u<1)requestAnimationFrame(st);else res();};st();});
    if(tk!==BOTTOK)return;}
  // gira el taco hasta el ángulo elegido y lo tira para atrás
  const a1=Math.atan2(inp.dy,inp.dx);let a0=BOT_AIM?BOT_AIM.ang:(OTRO_AIM?OTRO_AIM.ang:a1+((Math.random()<.5?-1:1)*(0.3+Math.random()*0.5)));
  let da=a1-a0;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;a0=a1-da;
  if(!FAST){const ms=500+Math.abs(da)*260,t1=performance.now();BOT_AIM={ang:a0,p:0.05};pedir();
    await new Promise(res=>{const st=()=>{if(tk!==BOTTOK){res();return;}const u=Math.min(1,(performance.now()-t1)/ms),e=1-Math.pow(1-u,3);BOT_AIM={ang:a0+da*e,p:0.05+(inp.p-0.05)*Math.min(1,u*1.3)};pedir();if(u<1)requestAnimationFrame(st);else res();};st();});
    if(tk!==BOTTOK)return;await wait(250);if(tk!==BOTTOK)return;}
  if(inp.tronera!=null){AIM.tronera=inp.tronera;}
  BOT_AIM=null;MANO=null;aplicarTiro(l,inp);
}

// XP, rango, pesos para la estancia y leguas: una sola vez por partida (ver PREMIOS_POOL en base.js).
function premiosFin(gane,empate){
  const out={html:'',rank:''};if(!window.RANGOS||AUTO||MODO==='entreno'||MODO==='tutorial')return out;
  const key='p'+G.id,hechas=ls.json('pool-xp-hechas',[]),T=PREMIOS_POOL;
  const amigos=G.equipos.flat().filter(l=>l!==YO&&TIPOS[l]!=='bot'&&TIPOS[l]!=='yo');const amigo=MODO!=='compu'&&amigos.length>0;
  const dif=MODO==='compu'?CFG.dif:'normal',kind=amigo?'amigo':'compu-'+dif;
  const seg=segJugados(),mios=STATS.tiros[YO]||0,activa=seg>=T.MIN_SEG&&mios>=T.MIN_TIROS;
  const guiaExt=G.reglas.guia==='extendida';
  let rk=null,xp=0,pr=null,nota='';
  const rankeable=RANGOS.isRanked('pool')&&!guiaExt&&kind!=='compu-facil'&&!empate&&activa;
  if(!hechas.includes(key)){
    const X=amigo?T.xp.amigo:T.xp.compu[dif]||T.xp.compu.normal;xp=X.jugar+(gane?X.ganar:0);
    if(G.n>2)xp+=T.xp.dobles;if(G.reglas.serie>1)xp=Math.round(xp*T.xp.serie3);
    let factor=1;
    if(!activa){factor=0;nota=`Partida muy corta (menos de ${T.MIN_SEG} s o ${T.MIN_TIROS} tiros tuyos): sin pesos ni leguas`;xp=Math.min(xp,T.XP_SIN_PREMIO);}
    else if(!amigo){const n=sumarDia('compu');if(n>T.COMPU_DIA){factor=0;xp=T.XP_SIN_PREMIO;nota=`Ya jugaste ${T.COMPU_DIA} partidas con premio contra la compu hoy`;}}
    else{const riv=amigos.map(l=>(PERF[l]||{}).n||'').sort().join('+').toLowerCase(),n=sumarDia('r:'+riv);if(n>T.RIVAL_DIA[1]){factor=0;nota='Contra la misma gente, hoy ya no da pesos ni leguas';}else if(n>T.RIVAL_DIA[0])factor=0.5;}
    try{if(rankeable&&factor>0)rk=RANGOS.apply('pool',{key,win:gane,kind});}catch(_){}
    const oro=gane&&activa?Math.round(T.ORO.ganar*(amigo?T.ORO.personas:1)*factor):0;
    // la forma de rangos.js v70: rival 'p'/'c', res 'g'/'e'/'p', esf (y «ok»/«extra», la otra forma de decir lo mismo)
    try{RANGOS.addXp('pool',xp);pr=RANGOS.premio('PoolAR',Math.round(xp*factor),!!rk,{j:'pool',rival:amigo?'p':'c',res:empate?'e':gane?'g':'p',dif:amigo?undefined:dif,esf:activa&&factor>0,ok:activa&&factor>0,key,
      x:{modo:G.modo,dobles:G.n>2?1:0,seg,tiros:mios,emb:STATS.emb[YO]||0,oro},extra:{modo:G.modo,oro}});}catch(_){}
    hechas.push(key);ls.set('pool-xp-hechas',JSON.stringify(hechas.slice(-60)));
  }
  let lv=null;try{lv=RANGOS.levelInfo(RANGOS.xp('pool'));}catch(_){}
  const sinRk=!rk&&!nota?(guiaExt?' · Con la guía extendida es amistosa: no mueve el rango ni da leguas':kind==='compu-facil'?' · En Fácil no se mueve el rango ni da leguas':!RANGOS.isRanked('pool')?' · Partida amistosa: no mueve el rango ni da leguas':''):'';
  out.html=(rk?RANGOS.resultHtml(rk):'')+(lv?`<p class="cap">PoolAR nivel ${lv.lv}${xp?` · +${xp} XP`:''}${pr?`${pr.oro?` · 🥇 +${fmt(pr.oro)} de oro`:''} · 🎁 +${fmt(pr.pesos)} 🪙 para tu estancia${pr.leguas?` · 🚩 +${pr.leguas} ${pr.leguas===1?'legua':'leguas'} en La Gran Pampa`:pr.nota?` · 🚩 ${esc(pr.nota)}`:''}`:''}${nota?' · '+esc(nota):sinRk}</p>`:'');
  out.rank=rk&&rk.after?rk.after.label:'';return out;
}
// Logros durante la partida
const LG=()=>window.LOGROS&&(!AUTO||window.LOGROS_TEST);
function lgTiro(r,G0,mias){
  if(!LG())return;const k='o'+G0.id+':'+G0.rev,T=r.T,res=r.res||{};
  try{
    if(P.esCarambola(G0.modo)){if(r.G.puntos[P.equipoDe(G0,YO)]>G0.puntos[P.equipoDe(G0,YO)]){LOGROS.evento('pool','carambolas',1,k);if(G0.modo==='tres')LOGROS.evento('pool','tresbandas',1,k);}return;}
    if(res.falta||G0.apertura){STATS.turnoEmb=0;return;}
    const n=mias.length;if(n){LOGROS.evento('pool','embocadas',n,k);STATS.turnoEmb+=n;if(STATS.turnoEmb>=3)LOGROS.evento('pool','seguidas3',1,'o'+G0.id+':t'+G0.rev);}
    // banda y adentro: una bola que tocó banda antes de caer
    for(const c of mias){const b=r.sim.ev.find(e=>e.k==='banda'&&e.n===c.n&&e.t<c.t);if(b){LOGROS.evento('pool','banda_adentro',1,k);break;}}
    if(r.G.turno!==P.equipoDe(G0,YO))STATS.turnoEmb=0;
  }catch(e){console.warn('logros',e);}
}
