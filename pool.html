/* ── La mesa con el dedo / el mouse ── */
let PT=null;
function puedoTocar(){return G&&FASE==='apuntar'&&miTurno()&&!ANIM&&!GOLPE;}
function bolaEn(sx,sy){const rp=P.R*VIEW.k,lim=Math.max(rp*1.35,20);let best=null,bd=1e9;for(const b of posBolas()){const [x,y]=aPan(b.x,b.y),d=Math.hypot(x-sx,y-sy);if(d<lim&&d<bd){bd=d;best=b;}}return best;}
function troneraEn(sx,sy){const pk=P.MESAS.pool.pockets,r=Math.max(16,P.R*VIEW.k*1.3);for(let p=0;p<6;p++){const k=pk[p],[x,y]=aPan(k.mx-k.ax*0.045,k.my-k.ay*0.045);if(Math.hypot(x-sx,y-sy)<r+6)return p;}return -1;}
function cueAhora(){const t=P.bolaTaco(G);return MANO&&MANO.n===t?MANO:G.bolas.find(b=>b.n===t);}
function apuntarA(wx,wy){const c=cueAhora();if(!c)return;if(Math.hypot(wx-c.x,wy-c.y)<P.R*0.6)return;AIM.ang=Math.atan2(wy-c.y,wx-c.x);actualizarDecl();OTRO_ENVIAR();}
function evXY(e){const r=CV.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];}
CV.addEventListener('pointerdown',e=>{
  if(!puedoTocar())return;
  if(PT&&PT.id!==e.pointerId){cancelarPT();return;}   // segundo dedo: se cancela
  const [sx,sy]=evXY(e),decl=P.pideDeclarar(G);
  if(decl&&!MESA_CARAM){const tr=troneraEn(sx,sy);if(tr>=0){AIM.tronera=tr;AIM.trManual=true;sfx('tiza');pintarTodo();return;}}
  const b=bolaEn(sx,sy),taco=P.bolaTaco(G);
  const mover=b&&((b.n===taco&&G.enMano)||MODO==='entreno');
  PT={id:e.pointerId,sx,sy,x0:sx,y0:sy,t0:Date.now(),modo:'tap',bola:b,mover,mouse:e.pointerType==='mouse'};
  const c=cueAhora(),[wx,wy]=aMun(sx,sy);PT.last=c?Math.atan2(wy-c.y,wx-c.x):0;PT.ang0=AIM.ang;

});
CV.addEventListener('pointermove',e=>{
  const [sx,sy]=evXY(e);
  if(!PT){if(e.pointerType==='mouse'&&puedoTocar()&&!AIM.fija&&!e.buttons){const [wx,wy]=aMun(sx,sy);apuntarA(wx,wy);pintarCtrl();pedir();}return;}
  if(e.pointerId!==PT.id)return;
  const mov=Math.hypot(sx-PT.x0,sy-PT.y0);
  if(PT.modo==='tap'&&mov>6){PT.modo=PT.mover?'mover':'girar';
    if(PT.modo==='mover'){if(MODO==='entreno')ENT.hist.push(G.bolas.map(b=>({...b})));MANO={n:PT.bola.n,x:PT.bola.x,y:PT.bola.y,mal:false,arrastra:true,ok:[PT.bola.x,PT.bola.y]};}}
  const [wx,wy]=aMun(sx,sy);
  if(PT.modo==='mover'){const zona=PT.bola.n===P.bolaTaco(G)&&G.enMano==='cabecera';
    const x=Math.max(P.R,Math.min(zona?P.CABECERA:P.L-P.R,wx)),y=Math.max(P.R,Math.min(P.W-P.R,wy));
    MANO.x=x;MANO.y=y;MANO.mal=!P.libre(G.bolas,x,y,MANO.n);if(!MANO.mal)MANO.ok=[x,y];actualizarDecl();pintarCtrl();pedir();OTRO_ENVIAR();return;}
  if(PT.modo==='girar'){const c=cueAhora();if(!c)return;const d=Math.hypot(wx-c.x,wy-c.y);const a=Math.atan2(wy-c.y,wx-c.x);
    let da=a-PT.last;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;PT.last=a;
    if(d>P.R*2.2){AIM.ang+=da*PREF.sens;AIM.fija=false;actualizarDecl();tutRevisar();pintarCtrl();pedir();OTRO_ENVIAR();}}
});
function soltarPT(e,cancelar){
  if(!PT||(e&&e.pointerId!==PT.id))return;const p=PT;PT=null;
  if(p.modo==='mover'&&MANO){if(cancelar||MANO.mal){MANO.x=MANO.ok[0];MANO.y=MANO.ok[1];MANO.mal=false;}MANO.arrastra=false;
    if(MODO==='entreno'&&MANO.n!==P.bolaTaco(G)){const b=G.bolas.find(x=>x.n===MANO.n);b.x=MANO.x;b.y=MANO.y;MANO=null;BOLAS_CV.delete(b.n);const c=G.bolas.find(x=>x.n===0);MANO={n:0,x:c.x,y:c.y};}
    else if(MODO==='entreno'){const b=G.bolas.find(x=>x.n===MANO.n);b.x=MANO.x;b.y=MANO.y;}
    actualizarDecl();pintarTodo();return;}
  if(cancelar){if(p.modo==='girar'){AIM.ang=p.ang0;}pintarTodo();return;}
  if(p.modo==='tap'){const [wx,wy]=aMun(p.sx,p.sy);
    // v70.1 (pedido del 24/10): con el mouse, mover = apuntar y clic = fijar. El clic deja la dirección exactamente como se
    // veía (antes, si caía sobre una bola, re-apuntaba al centro de esa bola y la línea se corría). Sí sirve para cantar bola.
    if(p.mouse){if(p.bola&&p.bola.n!==P.bolaTaco(G)&&P.pideDeclarar(G)==='bola'){AIM.bola=p.bola.n;AIM.bolaManual=true;}AIM.ang=p.ang0;}
    else if(p.bola&&p.bola.n!==P.bolaTaco(G)){const c=cueAhora();if(c){AIM.ang=Math.atan2(p.bola.y-c.y,p.bola.x-c.x);if(P.pideDeclarar(G)==='bola'){AIM.bola=p.bola.n;AIM.bolaManual=true;}}}
    else if(!p.bola)apuntarA(wx,wy);
    if(p.mouse)AIM.fija=!AIM.fija;
    actualizarDecl();tutRevisar();OTRO_ENVIAR();pintarTodo();}
}
function cancelarPT(){if(PT)soltarPT({pointerId:PT.id},true);}
CV.addEventListener('pointerup',e=>soltarPT(e,false));

CV.addEventListener('lostpointercapture',e=>{if(PT&&e.pointerId===PT.id&&PT.modo!=='tap')soltarPT(e,false);});

/* ── La ruedita fina ── */
const FINO=$('fino'),FCV=$('fino-cv');let FPT=null;
function pintarFino(){const r=FINO.getBoundingClientRect(),dpr=Math.min(2,window.devicePixelRatio||1);if(!r.width)return;

  const g=FCV.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,r.width,r.height);
  const off=((AIM.ang*180/Math.PI)*12)%14;g.strokeStyle='rgba(240,225,190,.35)';g.lineWidth=1;
  for(let x=-14;x<r.width+14;x+=7){const xx=x-off,cen=Math.abs(xx-r.width/2)/(r.width/2),h=(1-cen*cen)*r.height*0.55;g.globalAlpha=0.25+0.75*(1-cen);g.beginPath();g.moveTo(xx,(r.height-h)/2);g.lineTo(xx,(r.height+h)/2);g.stroke();}
  g.globalAlpha=1;g.strokeStyle='#e0b14a';g.lineWidth=2;g.beginPath();g.moveTo(r.width/2,4);g.lineTo(r.width/2,r.height-4);g.stroke();}
FINO.addEventListener('pointerdown',e=>{if(e.target.closest('.fb'))return;if(!puedoTocar())return;FPT={id:e.pointerId,x:e.clientX};try{FINO.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();});
FINO.addEventListener('pointermove',e=>{if(!FPT||e.pointerId!==FPT.id)return;const dx=e.clientX-FPT.x;FPT.x=e.clientX;AIM.ang+=dx*0.0009*PREF.sens;AIM.fija=true;actualizarDecl();tutRevisar();pintarCtrl();pedir();OTRO_ENVIAR();});
['pointerup','pointercancel'].forEach(k=>FINO.addEventListener(k,e=>{if(FPT&&e.pointerId===FPT.id)FPT=null;}));
function empujon(dir){let n=0,t=null;const paso=()=>{if(!puedoTocar())return;AIM.ang+=dir*(n>8?0.0035:0.0017);AIM.fija=true;n++;actualizarDecl();pintarCtrl();pedir();OTRO_ENVIAR();};
  return {down:e=>{e.preventDefault();n=0;paso();t=setInterval(paso,90);},up:()=>{clearInterval(t);t=null;}};}
for(const [id,d] of [['fino-l',-1],['fino-r',1]]){const h=empujon(d),b=$(id);b.addEventListener('pointerdown',h.down);['pointerup','pointercancel','pointerleave'].forEach(k=>b.addEventListener(k,h.up));}

/* ── La fuerza ── */
const FZ=$('fz-tr');let ZPT=null;
function fuerzaDesde(e){const r=FZ.getBoundingClientRect(),acostada=document.body.classList.contains('alto');return Math.max(0,Math.min(1,acostada?(e.clientX-r.left)/r.width:(r.bottom-e.clientY)/r.height));}
FZ.addEventListener('pointerdown',e=>{if(!G||FASE==='animando')return;ZPT={id:e.pointerId,max:0};AIM.p=Math.max(0.01,fuerzaDesde(e));ZPT.max=AIM.p;try{FZ.setPointerCapture(e.pointerId);}catch(_){}tutRevisar();pintarCtrl();pedir();OTRO_ENVIAR();e.preventDefault();});
FZ.addEventListener('pointermove',e=>{if(!ZPT||e.pointerId!==ZPT.id)return;AIM.p=Math.max(0.01,fuerzaDesde(e));ZPT.max=Math.max(ZPT.max,AIM.p);if(Math.round(AIM.p*100)%10===0)vibrar(4);tutRevisar();pintarCtrl();pedir();OTRO_ENVIAR();});
FZ.addEventListener('pointerup',e=>{if(!ZPT||e.pointerId!==ZPT.id)return;ZPT=null;if(PREF.soltar&&AIM.p>0.03&&puedoTocar())disparar();});
FZ.addEventListener('pointercancel',()=>{ZPT=null;});
FZ.addEventListener('keydown',e=>{const d=e.key==='ArrowUp'||e.key==='ArrowRight'?1:e.key==='ArrowDown'||e.key==='ArrowLeft'?-1:0;if(!d)return;e.preventDefault();e.stopPropagation();AIM.p=Math.max(0.01,Math.min(1,AIM.p+d*(e.shiftKey?0.002:0.01)));pintarCtrl();pedir();});

/* ── Efecto ── */
function abrirEfecto(){if(!G)return;$('efpanel').hidden=false;pintarEfecto();}
function pintarEfecto(){const b=$('efbola');b.style.setProperty('--ex',AIM.a*2);b.style.setProperty('--ey',AIM.b*2);
  const v=AIM.b>0.08?'<b>Arriba:</b> después de pegar, la blanca sigue para adelante.':AIM.b<-0.08?'<b>Abajo (retroceso):</b> después de pegar, la blanca vuelve.':'',
    h=AIM.a>0.08?'<b>Derecha:</b> sale de las bandas hacia la derecha.':AIM.a<-0.08?'<b>Izquierda:</b> sale de las bandas hacia la izquierda.':'';
  $('eftxt').innerHTML=v||h?[v,h].filter(Boolean).join('<br>'):'Al centro: la blanca se frena al pegar de lleno. Tocá la bola grande para darle efecto.';pintarCtrl();}
{let EPT=null;const b=$('efbola');const set=e=>{const r=b.getBoundingClientRect();let x=(e.clientX-r.left)/r.width*2-1,y=-((e.clientY-r.top)/r.height*2-1);const l=Math.hypot(x,y),m=0.7/0.7;
    x/=0.7;y/=0.7;const ll=Math.hypot(x,y);if(ll>1){x/=ll;y/=ll;}AIM.a=Math.round(x*0.5*100)/100;AIM.b=Math.round(y*0.5*100)/100;pintarEfecto();};
  b.addEventListener('pointerdown',e=>{EPT=e.pointerId;try{b.setPointerCapture(e.pointerId);}catch(_){}set(e);e.preventDefault();});
  b.addEventListener('pointermove',e=>{if(EPT===e.pointerId)set(e);});
  ['pointerup','pointercancel'].forEach(k=>b.addEventListener(k,()=>{EPT=null;}));}
$('ef-c').onclick=()=>{AIM.a=0;AIM.b=0;pintarEfecto();};

/* ── Teclado (PC) ── */
document.addEventListener('keydown',e=>{
  const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  if(!$('modal').hidden||!$('side').hidden){if(e.key==='Escape'){if(!$('modal').hidden)closeSheet();else closeSide();}return;}
  if(!$('efpanel').hidden){if(e.key==='Escape'||e.key==='Enter'||e.key==='e'||e.key==='E'){$('efpanel').hidden=true;e.preventDefault();}return;}
  if(e.key==='Escape'){if(PT){cancelarPT();return;}openMenu();return;}
  if(!puedoTocar())return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();AIM.ang+=(e.key==='ArrowRight'?1:-1)*(e.shiftKey?0.05:0.25)*Math.PI/180;AIM.fija=true;actualizarDecl();pintarCtrl();pedir();OTRO_ENVIAR();}
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();AIM.p=Math.max(0.01,Math.min(1,AIM.p+(e.key==='ArrowUp'?1:-1)*(e.shiftKey?0.002:0.01)));pintarCtrl();pedir();OTRO_ENVIAR();}
  else if(e.key===' '||e.code==='Space'){e.preventDefault();if(!e.repeat)disparar();}
  else if(e.key==='e'||e.key==='E'){abrirEfecto();}
});

/* ───────── PoolAR en línea: mesa de 2 (mano a mano) o de 4 (Dobles: dos contra dos) ─────────
   El que arma la mesa la lleva: tiene una conexión directa con cada amigo (WebRTC, con servidores públicos STUN/TURN de
   ayuda) y es la autoridad: recibe los tiros, los simula, arbitra y les manda a todos el estado nuevo. Los demás
   reproducen el mismo tiro con la misma física (para verlo moverse) y al final se quedan con lo que dijo la mesa.
   Las invitaciones viajan por la planilla, una por amigo (prefijo POOL:). Los lugares libres los juega la compu y si
   alguien se corta, la compu tira por él hasta que vuelve (RECON). El chat de la mesa va por las mismas conexiones
   (MESA_CHAT; en Dobles se puede hablar sólo con el equipo). */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];
async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

// La puntería del que tira, para que los demás vean el taco (y la blanca en mano) moverse.
// v72 (pedido del 24/10: «veo muy lagueado a mi compañero»): antes iban como mucho 6 por segundo, el último movimiento
// se perdía si quedaba dentro de esa ventana, y el que miraba saltaba de una posición a la otra. Ahora van hasta 20 por
// segundo, siempre sale el último (con una espera corta) y el que mira desliza suave hacia lo último que llegó
// (otroSuave, en cada cuadro). El tiro en sí ya se reproduce entero en cada pantalla con la misma física (recibirResultado).
const APUNTA_MS=50;let APUNTA_PEND=0,OTRO_OBJ=null,OTRO_MANO=null,OTRO_T=0;
function OTRO_ENVIAR(){if(!ON||ON.state!=='juego'||!G||!miTurno())return;const now=Date.now(),falta=APUNTA_MS-(now-APUNTA_T);
  if(falta>0){if(!APUNTA_PEND)APUNTA_PEND=setTimeout(()=>{APUNTA_PEND=0;OTRO_ENVIAR();},falta);return;}
  clearTimeout(APUNTA_PEND);APUNTA_PEND=0;APUNTA_T=now;
  const m={t:'apunta',ang:Math.round(AIM.ang*1e4)/1e4,p:Math.round(AIM.p*100)/100,de:YO,taco:tacoActual(),rev:G.rev};if(MANO){m.x=Math.round(MANO.x*1e4)/1e4;m.y=Math.round(MANO.y*1e4)/1e4;}netSend(m);}
function recibirApunta(x){if(!G||P.tirador(G)!==x.de||x.de===YO)return;if(x.rev!=null&&x.rev!==G.rev)return;   // de un turno que ya pasó
  OTRO_OBJ={ang:x.ang,p:x.p};if(!OTRO_AIM)OTRO_AIM={ang:x.ang,p:x.p,skin:x.taco};else OTRO_AIM.skin=x.taco;
  if(x.x!=null&&G.enMano){OTRO_MANO={x:x.x,y:x.y};if(!MANO||MANO.n!==P.bolaTaco(G))MANO={n:P.bolaTaco(G),x:x.x,y:x.y};}
  OTRO_T=performance.now();pedir();}
// Cada cuadro: el taco del otro se acerca a lo último que llegó (≈ 60 ms para llegar a dos tercios del camino).
function otroSuave(now){if(!OTRO_OBJ||!OTRO_AIM)return false;const dt=Math.min(100,Math.max(0,now-(otroSuave.t||now)));otroSuave.t=now;
  const k=1-Math.exp(-dt/60);let da=OTRO_OBJ.ang-OTRO_AIM.ang;while(da>Math.PI)da-=2*Math.PI;while(da<-Math.PI)da+=2*Math.PI;
  OTRO_AIM.ang+=da*k;OTRO_AIM.p+=(OTRO_OBJ.p-OTRO_AIM.p)*k;let sigue=Math.abs(da)>1e-4||Math.abs(OTRO_OBJ.p-OTRO_AIM.p)>1e-3;
  if(OTRO_MANO&&MANO&&G&&G.enMano&&!miTurno()){const dx=OTRO_MANO.x-MANO.x,dy=OTRO_MANO.y-MANO.y;MANO.x+=dx*k;MANO.y+=dy*k;if(Math.abs(dx)+Math.abs(dy)>1e-4)sigue=true;}
  if(!sigue){OTRO_AIM.ang=OTRO_OBJ.ang;OTRO_AIM.p=OTRO_OBJ.p;otroSuave.t=0;}
  return sigue;}
function otroOlvidar(){OTRO_AIM=null;OTRO_OBJ=null;OTRO_MANO=null;otroSuave.t=0;}

async function invitarALugar(u,team){
  const a=acct(),m=ON&&ON.mesa;if(!a||!m)return;

  const quien=ON;

    const pc=new RTCPeerConnection({iceServers:await iceServers()});L.pc=pc;
    const ch=pc.createDataChannel('pool',{ordered:true});
    ch.onopen=()=>{if(ON!==quien||m.lugares[i]!==L)return;L.ch=ch;
      if(ON.state==='juego'){sendCh(ch,{t:'bye'});return;}
      L.tipo='humano';L.msg='';sfx('turno');toast(`🔗 ${esc(L.usuario)} se sentó a la mesa`);enviarMesa();};
    ch.onclose=()=>perdioLugar(i,L);
    ch.onmessage=e=>{let x;try{x=JSON.parse(e.data);}catch(_){return;}msgDeLugar(i,L,x);};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))perdioLugar(i,L);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(m.lugares[i]!==L)return;
    const j=await lbCall({accion:'invitar',usuario:a.usuario,token:a.token,para:u.usuario,oferta:'POOL:'+JSON.stringify({sdp:pc.localDescription.sdp,mesa:m.id,seat:i,n:m.n,modo:m.cfg.modo})});
    if(m.lugares[i]!==L)return;L.id=j.id;L.msg='Esperando que acepte…';enviarMesa();
    const t0=Date.now();
    while(m.lugares[i]===L&&L.tipo==='invitado'&&Date.now()-t0<7200000){
      await sleep(2000);if(m.lugares[i]!==L)return;
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:L.id});}catch(_){continue;}
      if(m.lugares[i]!==L)return;
      if(r.estado==='aceptada'&&r.respuesta){L.msg='Conectando…';enviarMesa();await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});

// v70.1: si abriste tu mesa y todavía no invitaste a nadie, igual te llegan las invitaciones (si los dos abren «En línea»
// a la vez, el primero que invita gana): al aceptar, tu mesa vacía se cierra sola.
function mesaSola(){return !!(ON&&ON.role==='host'&&ON.state==='mesa'&&ON.mesa&&ON.mesa.lugares.every((L,i)=>i===0||L.tipo==='libre'));}
async function pollInbox(force=false){
  const a=acct();if(!a||polling||document.hidden||(ON&&ON.state!=='perdido'&&!mesaSola())||AUTO)return;
  const gap=G&&!G.fin&&miTurno()?20000:8000;if(!force&&Date.now()-pollAt<gap)return;
  polling=true;pollAt=Date.now();
  let ver;try{ver=sessionStorage.getItem('pool-accept')||undefined;}catch(_){}
  try{const j=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,ver});const inv=j.invitacion;
    const rc=window.RECON&&RECON.recuerdo('pool');
    if(inv&&rc&&!UIQ.dismissed.has(inv.id)&&!ON&&RECON.esVuelta(inv,'POOL:',rc.mesa)){acceptInvite(inv,true);polling=false;return;}
    if(inv&&!UIQ.dismissed.has(inv.id)&&(!ON||mesaSola())){
      const pool=String(inv.oferta||'').startsWith('POOL:');let want='';try{want=sessionStorage.getItem('pool-accept')||'';}catch(_){}
      if(pool&&want===inv.id){try{sessionStorage.removeItem('pool-accept');}catch(_){}acceptInvite(inv);}
      else showInvite(inv);}}catch(_){}
  polling=false;
}
const INV_PAG={'TRUCO:':['truco.html','truco-accept','TrucAR 🃏'],'UNO:':['uno.html','uno-accept','UnoAR 🎴'],'POBLAR:':['poblar.html','poblar-accept','PoblAR 🏘️'],'AJEDREZ:':['ajedrez.html','ajedrez-accept','AjedrezAR ♟️'],'LUDO:':['ludo.html','ludo-accept','LudAR 🎲']};
function showInvite(inv){
  UIQ.dismissed.add(inv.id);const sola=mesaSola();if(sola)LOBBY=false;const of=String(inv.oferta||''),pool=of.startsWith('POOL:'),otro=Object.keys(INV_PAG).find(k=>of.startsWith(k));
  let det='';if(pool){try{const o=JSON.parse(of.slice(5));det=`${P.NOMBRE_MODO[o.modo]||'Pool'}${Number(o.n)===4?' · Dobles':''}`;}catch(_){}}
  const juego=pool?`<b>PoolAR</b> 🎱${det?' · '+esc(det):''}`:otro?`<b>${INV_PAG[otro][2]}</b>`:'<b>BloqueAR</b> 🧱';
  sheet('Te invitan',`<div style="display:flex;align-items:center;gap:12px">${avHtml(inv.avatar,inv.color)}<div><b style="font:700 18px var(--serif)">${esc(inv.de)}</b><div class="note">te invita a jugar ${juego}</div></div></div>
    ${pool&&G&&!G.fin&&MODO==='compu'?'<p class="note">Tu partida contra la compu queda guardada.</p>':''}${sola?'<p class="note">Si aceptás, se cierra la mesa que abriste (todavía no había nadie).</p>':''}<div class="row"><button class="btn" id="iv-no">Ahora no</button><button class="btn go" id="iv-yes">Aceptar</button></div>`);
  $('iv-no').onclick=()=>{closeSheet();const a=acct();if(a)lbCall({accion:'rechazar',usuario:a.usuario,token:a.token,id:inv.id}).catch(()=>{});if(sola&&mesaSola()){LOBBY=true;drawLobby();}};
  $('iv-yes').onclick=()=>{closeSheet();if(pool){acceptInvite(inv);return;}
    if(otro){try{sessionStorage.setItem(INV_PAG[otro][1],inv.id);}catch(_){}location.href=INV_PAG[otro][0];return;}
    try{sessionStorage.setItem('blq-accept',inv.id);}catch(_){}location.href='./';};
}
window.addEventListener('pagehide',()=>{if(ON)netSend({t:'bye',corte:1});});

/* ───────── Arranque ───────── */
function aceptando(){try{return !!sessionStorage.getItem('pool-accept');}catch(_){return false;}}
function esperarInvitacion(){
  sheet('Mesa de un amigo','<p><span class="busy"></span>Buscando la invitación de tu amigo…</p>');
  let n=0;const t=setInterval(()=>{
    if(ON||!aceptando()){clearInterval(t);return;}
    if(++n>12){clearInterval(t);try{sessionStorage.removeItem('pool-accept');}catch(_){}
      sheet('Mesa de un amigo','<p>No encontramos la invitación: puede que tu amigo ya no esté esperando o que la haya cancelado.</p><p>Pedile que te invite de nuevo, o armá vos una mesa.</p><button class="btn go" id="ia-inv">Armar una mesa</button><button class="btn" id="ia-new">Jugar con la compu</button>');
      $('ia-inv').onclick=openMesa;$('ia-new').onclick=openNew;return;}
    pollInbox(true);
  },2500);
  setTimeout(()=>pollInbox(true),300);
}
function guardadaValida(){const s=ls.json(SAVE,null);return s&&s.G&&s.G.v===1&&s.G.pv===P.PHYS_V&&!s.G.fin?s:null;}
(function start(){
  try{window.LOGROS&&LOGROS.aplicar('pool');}catch(_){}
  if(window.RANGOS)RANGOS.css();
  layout();
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;const d=(location.hash.match(/dif=(\w+)/)||[])[1];if(d&&DIFN[d])CFG.dif=d;
    const m=(location.hash.match(/modo=(\w+)/)||[])[1];if(m&&MODOS.some(x=>x[0]===m))CFG.modo=m;CFG.meta=CFG.modo==='tres'?3:CFG.modo==='caram'?5:0;
    nuevaCompu({seed:Number((location.hash.match(/semilla=(\d+)/)||[])[1])||undefined,abre:0});return;}
  ls.set('bloques-ultimo-juego','pool');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  const sv=guardadaValida(),pcr=/[#&]pampa-cruce=(\d+)&duelo=([\w-]+)/.exec(hash);   // v72: un cruce de La Gran Pampa
  if(pcr){const cfg=CFG;CFG={...CFG,modo:'b8',dif:'normal',serie:1,meta:0};nuevaCompu({modo:'b8',seed:Number(pcr[1]),abre:0,cruce:{seed:Number(pcr[1]),duelo:pcr[2],cfg}});
    setTimeout(()=>toast('⚔️ Cruce de La Gran Pampa: una mesa de Bola 8 contra la compu (la misma que tu rival). Abrís vos.'),500);}
  else if(/^#tutorial/.test(hash))tutorial();
  else if(/^#entrenar/.test(hash))entrenar('b8');
  else if(sv&&!aceptando())seguirGuardada(sv);
  else{pintarTodo();if(!/^#(invitar|amigos|mesa)/.test(hash)&&!aceptando()){if(!ls.get('pool-ayuda')){ls.set('pool-ayuda','1');bienvenida();}else openNew();}}
  if(aceptando())esperarInvitacion();
  else if(!pcr&&window.RECON&&acct()&&RECON.recuerdo('pool')){const rc=RECON.recuerdo('pool'),hasta=(rc.t||Date.now())+RECON.GRACIA;
    try{$('modal').hidden=true;}catch(_){}
    RECON.cartel('pool-host',`Volviendo a la partida de ${rc.host}…`,hasta,()=>{if(!ON){RECON.olvidar('pool');toast(`La mesa de ${esc(rc.host)} ya no está.`);if(!G)openNew();}});
    RECON.buscarVuelta({prefijo:'POOL:',mesa:rc.mesa,de:rc.host,hasta,vivo:()=>!ON,onInv:inv=>{UIQ.dismissed.add(inv.id);acceptInvite(inv,true);}});}
  if(/^#(amigos|mesa)/.test(hash))setTimeout(openMesa,200);
  {const m=/^#invitar=([^&]+)/.exec(hash);if(m&&acct()){let u='';try{u=decodeURIComponent(m[1]);}catch(_){u=m[1];}
    setTimeout(()=>{irAInvitar();invitarALugar((UIQ.users||[]).find(y=>y.usuario===u)||{usuario:u,avatar:'🙂',color:'#3b5866'},1);},400);}}
  if(window.MESA_CHAT)MESA_CHAT.montar({juego:'pool',activo:()=>!!(ON&&(ON.state==='juego'||ON.state==='mesa')),
    enviar:m=>{if(!ON)return;if(ON.role==='guest'){sendCh(ON.ch,{t:'mchat',txt:m.txt,eq:m.eq?1:0});return;}
      const de=miNombre();ON.mesa.lugares.forEach((L,j)=>{if(j>0&&L.ch&&(!m.eq||j%2===0))sendCh(L.ch,{t:'mchat',de,txt:m.txt,eq:m.eq?1:0});});},
    equipos:()=>!!(G&&G.n===4),nota:'Sólo lo ve la gente de esta mesa y se borra al terminar.',sonido:()=>sfx('msg')});
  if(window.CHAT)CHAT.init({busy:()=>!!(G&&!G.fin&&MODO!=='entreno'&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'pool',inbox:()=>pollInbox(true),
    invite:(g,u)=>{if(g==='pool'){irAInvitar();invitarALugar((UIQ.users||[]).find(y=>y.usuario.toLowerCase()===String(u).toLowerCase())||{usuario:u,avatar:'🙂',color:'#3b5866'},1);return;}
      if(g==='estancia'){location.href='estancia.html#malon';return;}
      location.href=({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',ajedrez:'ajedrez.html',ludo:'ludo.html'}[g]||'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='pool'){openNew();return;}
      location.href=c.j==='estancia'?'estancia.html#malon':({poblar:'poblar.html',truco:'truco.html',uno:'uno.html',ajedrez:'ajedrez.html',pampa:'pampa.html',sudoku:'sudoku.html',solitario:'solitario.html',ludo:'ludo.html',buscaminas:'buscaminas.html'}[c.j]||'./');}});
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);
    // contra la compu, el tiempo de juego no corre mientras la app está en segundo plano
    if(STATS){if(document.hidden){STATS.seg=segJugados();STATS.t0=Date.now();STATS.pausa=1;}else if(STATS.pausa){STATS.t0=Date.now();STATS.pausa=0;}}});
  setTimeout(()=>pollInbox(true),1500);
})();
function bienvenida(){
  over(`<div class="ic">🎱</div><h3>¡Bienvenido a PoolAR!</h3><p>El pool del club: Bola 8, Bola 9, Bola 10, Carambola y Tres bandas. Contra la compu, con amigos (también de a cuatro, en parejas) o para entrenar.</p>
    <button class="btn go" id="bv-tut">🎓 Aprender en 2 minutos</button><button class="btn" id="bv-new">Ya sé jugar: partida nueva</button>`);
  $('bv-tut').onclick=()=>{hideOver();tutorial();};$('bv-new').onclick=()=>{hideOver();openNew();};
}
// Si llega de tu cuenta una partida contra la compu más nueva (la venías jugando en otro dispositivo), se retoma.
window.addEventListener('bloques-sync',e=>{const k=(e.detail&&e.detail.claves)||[];if(AUTO||!k.includes(SAVE)||MODO!=='compu'||aceptando()||FASE==='animando')return;
  const s=guardadaValida();if(!s||(G&&G.id===s.G.id&&G.rev>=s.G.rev))return;try{$('modal').hidden=true;}catch(_){}BOTTOK++;seguirGuardada(s);toast('Seguís la partida que venías jugando en tu otro dispositivo.');});
window.POOLAR={get G(){return G;},set G(v){G=v;},get MODO(){return MODO;},get FASE(){return FASE;},get ON(){return ON;},get AIM(){return AIM;},get MANO(){return MANO;},get VIEW(){return VIEW;},get CFG(){return CFG;},get STATS(){return STATS;},get TIPOS(){return TIPOS;},get PERF(){return PERF;},get YO(){return YO;},get ANIM(){return ANIM;},get OTRO_AIM(){return OTRO_AIM;},
  nuevaCompu,entrenar,tutorial,openNew,openMesa,openHelp,openMenu,disparar,aplicarTiro,siguiente,pintarTodo,aPan,aMun,miTurno,motivoNoTiro,decidir,salirPartida,irAInvitar,invitarALugar,empezarMesa,acceptInvite,netLeave,netSend,pollInbox,perdioLugar,mostrarFin,
  TUT,set FAST(v){FAST=v;},set AUTO(v){AUTO=v;},P};
