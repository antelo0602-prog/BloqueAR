let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;
  const retH=rs.length?`<section class="lg-sec"><h3>Retos de la semana</h3><p class="lg-lead">Los mismos para todos. Se renuevan el lunes: faltan ${diasHastaLunes()}.</p>
    ${rs.map(r=>`<div class="lg-reto${r.hecho?' ok':''}"><div class="lg-rt"><b>${esc(r.txt)}</b><small>${r.hecho?'✅ Cumplido':`${fmt(r.va)} de ${fmt(r.n)}`} · +${r.xp} XP${window.ORO?` y ${ORO.ico()} ${ORO.ORO_TABLA.reto} de oro`:''}</small></div><div class="lg-bar"><i style="width:${(r.va/r.n*100).toFixed(1)}%"></i></div></div>`).join('')}</section>`:'';
  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);
    return `<div class="lg-l${on?' on':''}"><i>${L.e}</i><div><b>${esc(L.n)}</b><small>${esc(L.d)}</small>${!on&&m>1?`<div class="lg-bar"><i style="width:${(v/m*100).toFixed(1)}%"></i></div><small>${fmt(v)} de ${fmt(m)}</small>`:''}</div>${on?'<em>✓</em>':''}</div>`;}).join('')}</div></section>`;
  const tipos=Object.entries(G.ap);
  const apH=tipos.length?`<section class="lg-sec"><h3>Apariencias</h3><p class="lg-lead">Se destraban subiendo de nivel en ${esc(G.n)} (vas por el ${nivel(j)}), con logros o con oro${window.ORO?` (tenés ${ORO.ico()}<b data-oro-saldo>${fmt(ORO.saldo())}</b>)`:''}. Las de nivel 10, 20 y 30 no se venden.</p>
    ${tipos.map(([tipo,A])=>{const cur=apariencia(j,tipo);return `<h4>${esc(A.n)}</h4><div class="lg-aps">${A.op.map(op=>{const ok=libre(j,op,o),req=op.logro?`Logro: ${(G.logros.find(L=>L.id===op.logro)||{}).n||''}`:op.lv?`Nivel ${op.lv}`:'';
      if(op.oro&&!ok&&window.ORO)return `<button type="button" class="lg-ap oro" data-lg-compra="${tipo}|${op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · ${ORO.ico()} ${fmt(op.oro)}</small></button>`;
      return `<button type="button" class="lg-ap${cur===op.id?' on':''}" data-lg-tipo="${tipo}" data-lg-id="${op.id}" ${ok?'':'disabled'} aria-pressed="${cur===op.id}"><span class="lg-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${cur===op.id?'Puesta':ok?'Elegir':'🔒 '+esc(req)}</small></button>`;}).join('')}</div>`;}).join('')}</section>`:'';
  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};
  const x=root.querySelector('#lg-x');if(x)x.onclick=()=>{op.cerrar?op.cerrar():(root.closest('.side')||{}).hidden=true;};
  root.querySelectorAll('[data-lg-tipo]').forEach(el=>el.onclick=()=>{if(elegir(j,el.dataset.lgTipo,el.dataset.lgId)){const top=root.scrollTop;abrir(j,op);root.scrollTop=top;}});
  // v70: comprar con oro (el primer toque pregunta; el segundo compra y la pone)
  root.querySelectorAll('[data-lg-compra]').forEach(el=>el.onclick=()=>{const [tipo,id]=el.dataset.lgCompra.split('|'),A=D[j]&&D[j].ap[tipo],ap=A&&A.op.find(x=>x.id===id);if(!ap||!window.ORO)return;
    const sm=el.querySelector('small');
    if(el.dataset.seguro!=='1'){root.querySelectorAll('[data-seguro]').forEach(x=>{delete x.dataset.seguro;x.classList.remove('preg');});el.dataset.seguro='1';el.classList.add('preg');
      if(sm)sm.innerHTML=ORO.saldo()>=ap.oro?`¿Comprar por ${ORO.ico()} ${fmt(ap.oro)}? Tocá de nuevo`:`Te faltan ${ORO.ico()} ${fmt(ap.oro-ORO.saldo())}`;return;}
    if(!ORO.comprar(ap.k_,ap.oro,`${D[j].n} · ${ap.n}`)){if(sm)sm.textContent='No te alcanza el oro';return;}
    try{if(window.SFX_ORO)SFX_ORO();}catch(_){}
    elegir(j,tipo,id);const top=root.scrollTop;(op.refrescar||(()=>{if(op.side)abrir(j,op);else{root.innerHTML=panelHtml(j);cablear(root,j,op);}}))();root.scrollTop=top;});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

/* ── v72: hoja «🎨 Apariencia» de cada juego ── */
const tieneAp=j=>j==='bloquear'?typeof window.abrirAparienciaBloquear==='function':!!(D[j]&&Object.keys(D[j].ap||{}).length);
function apBoton(j,donde){if(!tieneAp(j))return '';css();return `<div class="lg-apfin"><button type="button" class="lg-apb" data-ap-hoja="${esc(j)}">🎨 Apariencia de ${esc(j==='bloquear'?'BloqueAR':D[j].n)}</button></div>`;}
function pagina(){return document.documentElement.dataset.apJuego||PAGJ||'';}
const avisarCambio=j=>{try{dispatchEvent(new CustomEvent('lg-apariencia',{detail:{j}}));}catch(_){}};
function prevPoner(j,tipo,id){const A=D[j].ap[tipo];PREV=id?{j,tipo,id}:null;
  for(const t of Object.keys(D[j].ap)){const v=apariencia(j,t);if(v===D[j].ap[t].op[0].id)document.documentElement.removeAttribute('data-lg-'+t);else document.documentElement.setAttribute('data-lg-'+t,v);}
  avisarCambio(j);}
function reqTxt(j,op,o){const G=D[j];if(op.oro)return `${op.oro>=800?'Legendaria':op.oro>=300?'Especial':'Común'} · se compra con oro`;if(op.logro)return 'Con el logro «'+((G.logros.find(L=>L.id===op.logro)||{}).n||op.logro)+'»';if(op.lv)return `Se destraba en el nivel ${op.lv} de ${G.n} (vas por el ${nivel(j)})${op.lv>=10&&!op.oro?' · no se vende':''}`;return 'La de siempre';}
function hoja(j){
  if(j==='bloquear'){try{window.abrirAparienciaBloquear();}catch(_){}return;}
  const G=D[j];if(!tieneAp(j))return;css();aplicar(j);
  let el=document.getElementById('lg-hoja');if(el)el.remove();
  el=document.createElement('div');el.id='lg-hoja';el.className='lgh';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','Apariencia de '+G.n);
  const H={sel:null};
  const pintar=()=>{const o=load(),O=window.ORO;
    const cards=Object.entries(G.ap).map(([tipo,A])=>{const cur=apariencia(j,tipo),eq=(o.ap[j]||{})[tipo]||A.op[0].id,puesta=A.op.some(x=>x.id===eq&&libre(j,x,o))?eq:A.op[0].id;
      return `<h4>${esc(A.n)}</h4><div class="lgh-row" role="listbox" aria-label="${esc(A.n)}">${A.op.map(op=>{const ok=libre(j,op,o),sel=H.sel&&H.sel.tipo===tipo&&H.sel.id===op.id,on=puesta===op.id;
        const est=on?'✓ Puesta':ok?'Tuya':op.oro&&O?`${O.ico()} ${fmt(op.oro)}`:'🔒 '+(op.logro?'Logro':op.lv?'Nivel '+op.lv:'');
        return `<button type="button" class="lgh-c${on?' on':''}${sel?' sel':''}${ok?'':' lock'}${op.oro&&!ok?' oro':''}" data-t="${tipo}" data-id="${op.id}" aria-selected="${sel||(!H.sel&&on)}"><span class="lgh-sw" style="background:${op.sw}"></span><b>${esc(op.n)}</b><small>${est}</small></button>`;}).join('')}</div>`;}).join('');
    let act='';
    if(H.sel){const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id),ok=libre(j,op,o),eq=apEquipada(j,H.sel.tipo,o);
      const tit=`<div class="lgh-sel"><span class="lgh-sw" style="background:${op.sw}"></span><span><b>${esc(op.n)}</b><small>${esc(A.n)} · ${eq===op.id?'la que tenés puesta':ok?'es tuya':esc(reqTxt(j,op,o))}</small></span></div>`;
      if(eq===op.id)act=tit+`<button type="button" class="lgh-go" disabled>✓ Puesta</button>`;
      else if(ok)act=tit+`<button type="button" class="lgh-go" data-a="poner">Ponérmela</button>`;
      else if(op.oro&&O){const sd=O.saldo();act=tit+(sd>=op.oro?`<button type="button" class="lgh-go oro" data-a="comprar">Comprar por ${O.ico()} ${fmt(op.oro)}</button>`:`<button type="button" class="lgh-go" disabled>Te faltan ${O.ico()} ${fmt(op.oro-sd)}</button>`);}
      else act=tit+`<button type="button" class="lgh-go" disabled>🔒 Todavía no</button>`;}
    else act=`<p class="lgh-tip">Tocá una para probarla en la mesa. Las de nivel 10, 20 y 30 no se venden.</p>`;
    el.innerHTML=`<div class="lgh-in"><header><b>🎨 Apariencia · ${esc(G.n)}</b>${window.ORO?`<span class="lgh-oro" title="Tu oro">${ORO.ico()} <b>${fmt(ORO.saldo())}</b></span>`:''}<button type="button" class="lgh-x" aria-label="Cerrar">✕</button></header>
      <div class="lgh-body">${cards}</div><footer class="lgh-act">${act}</footer></div>`;
    const x=el.querySelector('.lgh-x');x.onclick=cerrar;};
  const cerrar=()=>{PREV=null;el.remove();aplicar(j);avisarCambio(j);document.removeEventListener('keydown',tecla,true);};
  const tecla=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();cerrar();}};
  el.addEventListener('click',e=>{
    if(e.target===el){cerrar();return;}
    const c=e.target.closest('.lgh-c');
    if(c){const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
      H.sel={tipo:c.dataset.t,id:c.dataset.id};prevPoner(j,H.sel.tipo,H.sel.id);pintar();
      el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);return;}
    const a=e.target.closest('[data-a]');if(!a||!H.sel)return;
    const A=G.ap[H.sel.tipo],op=A.op.find(x=>x.id===H.sel.id);
    const sc=el.querySelector('.lgh-body').scrollTop,rows=[...el.querySelectorAll('.lgh-row')].map(r=>r.scrollLeft);
    if(a.dataset.a==='comprar'){if(!window.ORO||!ORO.comprar(op.k_,op.oro,`${G.n} · ${op.n}`))return;try{if(window.SFX_ORO)SFX_ORO();}catch(_){}}
    PREV=null;elegir(j,H.sel.tipo,H.sel.id);avisarCambio(j);pintar();
    el.querySelector('.lgh-body').scrollTop=sc;el.querySelectorAll('.lgh-row').forEach((r,i)=>r.scrollLeft=rows[i]||0);
  });
  ['pointerdown','touchstart','keydown','keyup','wheel'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));
  document.addEventListener('keydown',tecla,true);
  document.body.appendChild(el);pintar();try{el.querySelector('.lgh-x').focus({preventScroll:true});}catch(_){}
}
function apEquipada(j,tipo,o){const A=D[j].ap[tipo],id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
// Cualquier botón data-ap-hoja abre la hoja; si estaba dentro del menú ☰, el menú se cierra.
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ap-hoja]');if(!b)return;e.preventDefault();e.stopPropagation();
  const j=b.dataset.apHoja||pagina();if(b.closest('#side')){try{typeof window.closeSide==='function'?window.closeSide():(document.getElementById('side').hidden=true);}catch(_){}}
  hoja(j);},true);
// Se agrega sola al menú ☰ (junto a «Logros y retos») y a «La mesa está lista» de cada juego.
function inyectar(){const j=pagina();if(!j||!tieneAp(j)||j==='bloquear')return;
  const m=document.getElementById('m-logros');
  if(m&&!m.dataset.apOk){m.dataset.apOk='1';const P=m.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.id='m-apariencia';b.dataset.apHoja=j;b.className=m.className;b.textContent='🎨 Apariencia';P.insertBefore(b,m.nextSibling);}}
  const n=document.getElementById('mv-new');
  if(n&&!n.dataset.apOk){n.dataset.apOk='1';const P=n.parentNode;if(P&&!P.querySelector('[data-ap-hoja]')){const b=document.createElement('button');b.type='button';b.className='btn';b.dataset.apHoja=j;b.textContent='🎨 Apariencia';P.appendChild(b);}}
}
let INY=0;
try{new MutationObserver(()=>{if(INY)return;INY=requestAnimationFrame(()=>{INY=0;try{inyectar();}catch(_){}});}).observe(document.documentElement,{childList:true,subtree:true});}catch(_){}

/* ── Para el menú de juegos y Mi cuenta ── */
function contar(){const o=load(),out={};for(const j of ORDEN){if(OCULTOS.includes(j))continue;out[j]={tiene:D[j].logros.filter(L=>tiene(o,j,L.id)).length,total:D[j].logros.length};}return out;}
function resumenHtml(){css();const C=contar(),o=load();
  return `<div class="lg-res">${Object.entries(C).map(([j,x])=>{const rs=retos(j),h=rs.filter(r=>r.hecho).length;
    return `<div class="lg-rr"><i>${D[j].e}</i><span><b>${esc(D[j].n)}</b><small>${x.tiene} de ${x.total} logros${rs.length?` · retos de la semana ${h}/${rs.length}`:''}</small></span><span class="lg-bar"><i style="width:${(x.tiene/x.total*100).toFixed(1)}%"></i></span></div>`;}).join('')}</div>`;}

/* ── Cuenta: viaja dentro de RANGOS.exportData() ── */
function exportData(){const o=load();return {g:o.g,c:o.c,s:{w:o.s.w,c:o.s.c,h:o.s.h},ap:o.ap,at:o.at||0};}
// Une lo de la planilla con lo de acá. Devuelve {ch: cambió algo acá, falta: acá hay algo que la planilla no tiene}.
function importData(d){
  const res={ch:false,falta:false};if(!d||typeof d!=='object')return res;const o=load();
  for(const [j,L] of Object.entries(d.g||{})){if(!D[j]||!L||typeof L!=='object')continue;o.g[j]=o.g[j]||{};
    for(const [id,t] of Object.entries(L))if(Number.isFinite(t)&&(!o.g[j][id]||t<o.g[j][id])){if(!o.g[j][id])res.ch=true;o.g[j][id]=t;}}
  for(const [j,L] of Object.entries(o.g))for(const id of Object.keys(L))if(!(d.g&&d.g[j]&&d.g[j][id]))res.falta=true;
  for(const [j,C] of Object.entries(d.c||{})){if(!D[j]||!C||typeof C!=='object')continue;const c=cnt(o,j);for(const [k,v] of Object.entries(C))if(Number.isFinite(v)&&v>(c[k]||0)){c[k]=v;res.ch=true;}}
  for(const [j,C] of Object.entries(o.c))for(const [k,v] of Object.entries(C))if(v>((d.c&&d.c[j]&&d.c[j][k])||0))res.falta=true;
  const s=d.s;if(s&&s.w===o.s.w){for(const [j,C] of Object.entries(s.c||{})){if(!D[j])continue;const sc=(o.s.c[j]=o.s.c[j]||{});for(const [k,v] of Object.entries(C||{}))if(Number.isFinite(v)&&v>(sc[k]||0)){sc[k]=v;res.ch=true;}}
    for(const [j,H] of Object.entries(s.h||{})){if(!D[j]||!Array.isArray(H))continue;const sh=(o.s.h[j]=o.s.h[j]||[]);for(const id of H)if(!sh.includes(id)){sh.push(id);res.ch=true;}}}
  // la apariencia: si acá no se eligió nada, la de la cuenta
  for(const [j,A] of Object.entries(d.ap||{})){if(!D[j]||!A)continue;o.ap[j]=o.ap[j]||{};for(const [t,id] of Object.entries(A))if(!o.ap[j][t]&&typeof id==='string'){o.ap[j][t]=id;res.ch=true;}}
  // Los retos que la planilla ya tenía cumplidos se marcan acá sin volver a dar el premio.
  if(res.ch)save(o);
  return res;
}
function ocultar(L){OCULTOS=Array.isArray(L)?L.slice():[];}

<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────

   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no aparece ningún cartel: suena un «tic» cortito y sube el numerito del 💬 (v67).

   del grupo, archivar solos los que nadie usa) y selector de emojis.
   API para los juegos y el menú de juegos: CHAT.amigos() → [nombres], CHAT.solicitudes() → {in, out},
   CHAT.esAmigo(n), CHAT.usuarios() → [{usuario, avatar, color, enLinea, estado}], CHAT.conectados() → {amigos, global}
   (usuarios conectados ahora), CHAT.pedirAmistad(n), CHAT.responderAmistad(n, si), CHAT.quitarAmigo(n).
   Evento «bloques-amigos» en window cuando cambian los amigos, las solicitudes o la gente conectada.
   Grupos de juego: CHAT.grupoJuego() → {gid, j} si tocaste «Jugar» en un grupo (lo usa el chat de la mesa para avisar
   solo al armar la mesa), CHAT.grupoPartida(gid, {j, id, n}, quitar) para dejar una partida guardada en el grupo. */

const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';

const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR',sudoku:'SudokAR',solitario:'SolitARio',buscaminas:'BuscaminAR',ajedrez:'AjedrezAR',ludo:'LudAR',pool:'PoolAR'};

const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  borr:{},grupos:[],am:{a:[],in:[],out:[]},amOk:false,tab:ls.get('bloques-chat-tab')||'charlas',gq:'',emo:false,gtipo:'',gdias:0,verArch:false,espero:null,gsel:{},gnom:'',gconf:false,delFor:null,timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,invSt:{},invBusy:{},unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}

const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

const cs=window.crypto&&window.crypto.subtle;

  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}

  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);

  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}

  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
// Un nombre de usuario de verdad (nunca null, vacío ni el texto «null»/«undefined» que deja un error).
function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;

  // v63: limpieza de charlas «null» que quedaron guardadas. Esos mensajes sí llegaron a la planilla (con el nombre
  // bien): se borran de acá y se vuelven a pedir desde un poco antes, así reaparecen en la charla correcta.
  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));

  {const G=ls.json(kGrupos(),[]);S.grupos=Array.isArray(G)?G:[];}S.am=amLimpio(ls.json(kAm(),null));S.amOk=false;try{S.espero=JSON.parse(sessionStorage.getItem('bloques-chat-espero')||'null');}catch(_){S.espero=null;}

const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
/* ── Grupos (v66): los mensajes de un grupo van con para = «g:<id>». La charla de un mensaje es el grupo o el otro. ── */
const esGK=k=>/^g:/i.test(String(k||''));

/* ── Amigos (v67) ── */
const kAm=()=>'bloques-chat-amigos-'+lc(S.me);
const amLimpio=o=>({a:Array.isArray(o&&o.a)?o.a.filter(nombreOk):[],in:Array.isArray(o&&o.in)?o.in.filter(nombreOk):[],out:Array.isArray(o&&o.out)?o.out.filter(nombreOk):[]});

  const n=amLimpio(o),antes=S.am,a=JSON.stringify(n),ch=a!==JSON.stringify(antes);S.am=n;S.amOk=true;

  catch(e){S.err=/desconocida/i.test(String(e.message))?'Para agregar amigos hay que pegar el código nuevo de la planilla.':String(e.message||e);}

// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}

    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);

const LL={op:null,iv:0,hasta:0,busy:false};
function cerrarPick(){const x=document.getElementById('mc-pick');if(x)x.remove();}
function llamar(op){
  css();cerrarPick();const C=window.CHAT;

  const G=C&&C.grupos?C.grupos():[];
  const el=document.createElement('div');el.id='mc-pick';el.className='mc-pick';el.setAttribute('role','dialog');el.setAttribute('aria-label','Avisar a un grupo');
  el.innerHTML=`<div class="mc-pick-in"><header><b>📣 Avisar a un grupo</b><button type="button" class="mc-px" aria-label="Cerrar">✕</button></header>

      :'<p class="mc-pn">Todavía no estás en ningún grupo. Armá uno en el chat 💬 (👥 Armar un grupo) y volvé.</p><button type="button" class="mc-pchat">Abrir el chat</button>'}</div>`;
  ['pointerdown','touchstart','keydown'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));

function escuchar(op){
  LL.op=op;LL.hasta=Date.now()+30*60e3;clearInterval(LL.iv);

    catch(_){}
    LL.busy=false;
  },3500);
}

/* ───────── SudokAR: el motor ─────────
   Tablero: 81 números (0 = vacío), fila por fila.
   · resolver / contarSoluciones: búsqueda con máscaras de bits (la celda con menos opciones primero).
   · generar(semilla, dificultad): arma una solución al azar y le saca números de a pares simétricos mientras la
     solución siga siendo única. Después lo califica con un «resolvedor humano» (las técnicas que usa una persona)
     y se queda con el que encaja en la dificultad pedida. Todo sale de la semilla: el sudoku del día es el mismo
     para todos. */
'use strict';
const DIFS=['facil','normal','dificil','experto'];
const DIFN={facil:'Fácil',normal:'Normal',dificil:'Difícil',experto:'Experto'};
function rngDe(seed){let a=(seed>>>0)||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function hashTxt(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const ROW=i=>Math.floor(i/9),COL=i=>i%9,BOX=i=>Math.floor(ROW(i)/3)*3+Math.floor(COL(i)/3);
// Para cada celda, sus 20 vecinas (misma fila, columna o caja).
const PEERS=[];const UNITS=[];
(function(){for(let r=0;r<9;r++)UNITS.push([...Array(9)].map((_,c)=>r*9+c));
  for(let c=0;c<9;c++)UNITS.push([...Array(9)].map((_,r)=>r*9+c));
  for(let b=0;b<9;b++){const r0=Math.floor(b/3)*3,c0=b%3*3,u=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)u.push((r0+r)*9+c0+c);UNITS.push(u);}
  for(let i=0;i<81;i++){const s=new Set();for(const u of UNITS)if(u.includes(i))for(const j of u)if(j!==i)s.add(j);PEERS.push([...s]);}})();
const BIT=d=>1<<(d-1);
const POP=m=>{let n=0;while(m){m&=m-1;n++;}return n;};
const DIGS=m=>{const o=[];for(let d=1;d<=9;d++)if(m&BIT(d))o.push(d);return o;};
function candidatos(g,i){if(g[i])return 0;let m=511;for(const j of PEERS[i])if(g[j])m&=~BIT(g[j]);return m;}
function valido(g){for(let i=0;i<81;i++)if(g[i])for(const j of PEERS[i])if(g[j]===g[i])return false;return true;}

// Cuenta soluciones hasta «tope» (con 2 alcanza para saber si es única). Si R viene, prueba los números en orden al azar.
function contarSoluciones(g0,tope=2,R=null,salida=null){
  const g=g0.slice();let n=0;
  const rec=()=>{
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){const m=candidatos(g,i),c=POP(m);if(c===0)return false;if(c<bc){bc=c;best=i;bm=m;if(c===1)break;}}
    if(best<0){n++;if(salida&&n===1)for(let i=0;i<81;i++)salida[i]=g[i];return n>=tope;}
    const ds=DIGS(bm);if(R)for(let k=ds.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[ds[k],ds[j]]=[ds[j],ds[k]];}
    for(const d of ds){g[best]=d;if(rec())return true;}
    g[best]=0;return false;};
  rec();return n;
}
function resolver(g){if(!valido(g))return null;const out=new Array(81).fill(0);return contarSoluciones(g,1,null,out)>=1?out:null;}

/* Resolvedor «humano»: devuelve la técnica más difícil que necesitó (1 a 4) o 5 si con lógica no alcanza.
   1 solitarios (desnudos y ocultos) · 2 pares, señaladores y caja-línea · 3 tríos, pares ocultos y X-wing · 4 cadenas simples (Y-wing)
   y además cuántos pasos dio (para afinar dentro de cada nivel). */
function calificar(g0){
  const g=g0.slice(),C=new Array(81);
  for(let i=0;i<81;i++)C[i]=candidatos(g,i);
  let nivel=1,pasos=0;
  const poner=(i,d)=>{g[i]=d;C[i]=0;for(const j of PEERS[i])C[j]&=~BIT(d);pasos++;};
  const vacias=()=>{for(let i=0;i<81;i++)if(!g[i])return true;return false;};
  const singles=()=>{let hubo=false;
    for(let i=0;i<81;i++)if(!g[i]&&POP(C[i])===1){poner(i,DIGS(C[i])[0]);hubo=true;}
    for(const u of UNITS)for(let d=1;d<=9;d++){let pos=-1,cnt=0;for(const i of u){if(g[i]===d){cnt=-9;break;}if(!g[i]&&C[i]&BIT(d)){cnt++;pos=i;}}if(cnt===1){poner(pos,d);hubo=true;}}
    return hubo;};
  const nivel2=()=>{let hubo=false;
    // pares desnudos
    for(const u of UNITS){const pares=u.filter(i=>!g[i]&&POP(C[i])===2);
      for(let a=0;a<pares.length;a++)for(let b=a+1;b<pares.length;b++)if(C[pares[a]]===C[pares[b]]){const m=C[pares[a]];
        for(const i of u)if(i!==pares[a]&&i!==pares[b]&&!g[i]&&(C[i]&m)){C[i]&=~m;hubo=true;}}}
    // señaladores (caja → fila/columna) y caja-línea (fila/columna → caja)
    for(let d=1;d<=9;d++){const b=BIT(d);
      for(let bx=18;bx<27;bx++){const cs=UNITS[bx].filter(i=>!g[i]&&C[i]&b);if(cs.length<2)continue;
        const rs=new Set(cs.map(ROW)),cl=new Set(cs.map(COL));
        if(rs.size===1){const r=ROW(cs[0]);for(const i of UNITS[r])if(!cs.includes(i)&&!g[i]&&C[i]&b){C[i]&=~b;hubo=true;}}
        if(cl.size===1){const c=COL(cs[0]);for(const i of UNITS[9+c])if(!cs.includes(i)&&!g[i]&&C[i]&b){C[i]&=~b;hubo=true;}}}
      for(let L=0;L<18;L++){const cs=UNITS[L].filter(i=>!g[i]&&C[i]&b);if(cs.length<2)continue;const bs=new Set(cs.map(BOX));
        if(bs.size===1){const bxi=18+BOX(cs[0]);for(const i of UNITS[bxi])if(!cs.includes(i)&&!g[i]&&C[i]&b){C[i]&=~b;hubo=true;}}}}
    return hubo;};
  const nivel3=()=>{let hubo=false;
    // tríos desnudos
    for(const u of UNITS){const cs=u.filter(i=>!g[i]&&POP(C[i])>=2&&POP(C[i])<=3);
      for(let a=0;a<cs.length;a++)for(let b=a+1;b<cs.length;b++)for(let c=b+1;c<cs.length;c++){const m=C[cs[a]]|C[cs[b]]|C[cs[c]];if(POP(m)!==3)continue;
        for(const i of u)if(i!==cs[a]&&i!==cs[b]&&i!==cs[c]&&!g[i]&&(C[i]&m)){C[i]&=~m;hubo=true;}}}
    // pares ocultos
    for(const u of UNITS){const pos={};for(let d=1;d<=9;d++){const p=u.filter(i=>!g[i]&&C[i]&BIT(d));if(p.length===2)pos[d]=p;}
      const ds=Object.keys(pos).map(Number);
      for(let a=0;a<ds.length;a++)for(let b=a+1;b<ds.length;b++){const P=pos[ds[a]],Q=pos[ds[b]];if(P[0]===Q[0]&&P[1]===Q[1]){const m=BIT(ds[a])|BIT(ds[b]);
        for(const i of P)if(C[i]&~m){C[i]&=m;hubo=true;}}}}
    // X-wing por filas y por columnas
    for(let d=1;d<=9;d++){const b=BIT(d);
      for(const [A,B,other] of [[0,9,COL],[9,0,ROW]]){
        const L=[];for(let k=0;k<9;k++){const cs=UNITS[A+k].filter(i=>!g[i]&&C[i]&b);if(cs.length===2)L.push(cs);}
        for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++){const p=L[x].map(other),q=L[y].map(other);if(p[0]!==q[0]||p[1]!==q[1])continue;
          for(const k of p)for(const i of UNITS[B+k])if(!L[x].includes(i)&&!L[y].includes(i)&&!g[i]&&C[i]&b){C[i]&=~b;hubo=true;}}}}
    return hubo;};
  const nivel4=()=>{let hubo=false;
    // Y-wing: pivote XY con dos alas XZ e YZ; se borra Z de lo que vean las dos alas
    const bi=[];for(let i=0;i<81;i++)if(!g[i]&&POP(C[i])===2)bi.push(i);
    for(const p of bi){const ps=new Set(PEERS[p]);const al=bi.filter(i=>i!==p&&ps.has(i)&&POP(C[i]&C[p])===1);
      for(let a=0;a<al.length;a++)for(let b=a+1;b<al.length;b++){const A=al[a],B=al[b];if((C[A]&C[p])===(C[B]&C[p]))continue;
        const z=C[A]&C[B]&~C[p];if(POP(z)!==1||(C[A]|C[B]|C[p])!==(C[p]|z))continue;
        const pa=new Set(PEERS[A]);for(const i of PEERS[B])if(i!==p&&pa.has(i)&&!g[i]&&C[i]&z){C[i]&=~z;hubo=true;}}}
    return hubo;};
  let vueltas=0;
  while(vacias()&&vueltas++<400){
    if(singles())continue;
    if(nivel2()){nivel=Math.max(nivel,2);continue;}
    if(nivel3()){nivel=Math.max(nivel,3);continue;}
    if(nivel4()){nivel=Math.max(nivel,4);continue;}
    return {nivel:5,pasos,resuelto:false};
  }
  return {nivel,pasos,resuelto:!vacias()};
}

// Lo que busca cada dificultad: cuántas pistas (números dados) y qué técnica hace falta.
const META={facil:{min:36,max:42,niv:[1,1]},normal:{min:29,max:34,niv:[1,2]},dificil:{min:25,max:30,niv:[2,3]},experto:{min:22,max:27,niv:[3,5]}};
function solucionAlAzar(R){const g=new Array(81).fill(0),out=new Array(81).fill(0);contarSoluciones(g,1,R,out);return out;}
function vaciar(sol,R,minPistas){
  const g=sol.slice(),orden=[];for(let i=0;i<41;i++)orden.push(i);
  for(let k=orden.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[orden[k],orden[j]]=[orden[j],orden[k]];}
  let pistas=81;
  for(const i of orden){if(pistas<=minPistas)break;const j=80-i,a=g[i],b=g[j];g[i]=0;g[j]=0;
    const quita=i===j?1:2;
    if(contarSoluciones(g,2)!==1){g[i]=a;g[j]=b;}else pistas-=quita;}
  return g;
}
const pistasDe=g=>g.reduce((a,x)=>a+(x?1:0),0);
function generar(seed,dif='normal'){
  const R=rngDe(seed),M=META[dif]||META.normal;let mejor=null,mejorD=1e9;
  for(let intento=0;intento<60;intento++){
    const sol=solucionAlAzar(R);
    // primero lo más vacío que se pueda dentro del rango; después se le devuelven números si quedó más difícil de lo pedido
    let g=vaciar(sol,R,M.min);let cal=calificar(g);
    if(cal.nivel>M.niv[1]){const vac=[];for(let i=0;i<81;i++)if(!g[i])vac.push(i);
      for(let k=vac.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[vac[k],vac[j]]=[vac[j],vac[k]];}
      for(const i of vac){if(pistasDe(g)>=M.max)break;g[i]=sol[i];cal=calificar(g);if(cal.nivel<=M.niv[1])break;}}
    const p=pistasDe(g),okN=cal.nivel>=M.niv[0]&&cal.nivel<=M.niv[1],okP=p>=M.min&&p<=M.max;
    if(okN&&okP)return {dado:g,sol,dif,pistas:p,nivel:cal.nivel,seed};
    const dist=(okN?0:10*Math.min(Math.abs(cal.nivel-M.niv[0]),Math.abs(cal.nivel-M.niv[1])))+(okP?0:Math.min(Math.abs(p-M.min),Math.abs(p-M.max)));
    if(dist<mejorD){mejorD=dist;mejor={dado:g,sol,dif,pistas:p,nivel:cal.nivel,seed};}
  }
  return mejor;
}
/* ───────── v67: sudokus del banco (de verdad, verificados) ─────────
   Antes se armaban acá mismo y el «Experto» casi siempre pedía técnicas más allá de las que conoce una persona (hacía falta
   probar y volver atrás): se sentían «sin solución» aunque tuvieran una. Ahora salen del banco (sudoku_banco.js) y cada
   partida usa un «disfraz» al azar: es el mismo sudoku por dentro, con la misma dificultad, pero no se ve igual. */
const BANCO=(typeof SUDOKU_BANCO!=='undefined')?SUDOKU_BANCO:(typeof require!=='undefined'?require('./sudoku_banco.js'):null);
const REG=83;   // 81 casillas + la nota SE en 2 cifras
function bancoN(dif){return BANCO&&BANCO[dif]?BANCO[dif].length/REG:0;}
function bancoLeer(dif,k){const s=BANCO[dif].substr(k*REG,REG);return {g:[...s.slice(0,81)].map(ch=>ch==='.'?0:Number(ch)),se:Number(s.slice(81))/10};}
// Disfraz: cambia los números (1-9 por otra permutación), permuta filas dentro de cada banda, las bandas, columnas
// dentro de cada pila, las pilas, y a veces lo transpone. No cambia ni la solución única ni la dificultad.
function disfrazar(g,R){
  const perm=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(R()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;};
  const dig=[0,...perm([1,2,3,4,5,6,7,8,9])];
  const ejes=()=>{const b=perm([0,1,2]),o=[];for(const x of b)for(const y of perm([0,1,2]))o.push(x*3+y);return o;};
  const fr=ejes(),co=ejes(),tr=R()<.5,out=new Array(81);
  for(let r=0;r<9;r++)for(let c=0;c<9;c++){const v=g[fr[r]*9+co[c]];out[tr?c*9+r:r*9+c]=dig[v];}
  return out;
}
function delBanco(dif,k,disfraz){
  dif=DIFS.includes(dif)?dif:'normal';const n=bancoN(dif);if(!n)return generar(disfraz>>>0,dif);
  k=((k%n)+n)%n;const {g:g0,se}=bancoLeer(dif,k),g=disfrazar(g0,rngDe(disfraz>>>0)),sol=resolver(g);
  return {dado:g,sol,dif,pistas:pistasDe(g),nivel:calificar(g).nivel,se,seed:k*1e6+((disfraz>>>0)%1e6),banco:k,disfraz:disfraz>>>0};
}
function alAzar(dif,R=Math.random){const n=bancoN(dif)||1;return delBanco(dif,Math.floor(R()*n),Math.floor(R()*2**31));}
// El del día: fecha en hora argentina; la dificultad va subiendo en la semana (lunes fácil, domingo experto).
function fechaAR(t=Date.now()){return new Date(t-3*3600e3).toISOString().slice(0,10);}
function difDelDia(fecha){const dow=new Date(fecha+'T12:00:00Z').getUTCDay();return ['experto','facil','normal','normal','dificil','normal','dificil'][dow];}
function delDia(fecha=fechaAR()){const dif=difDelDia(fecha),h=hashTxt('SUDOKAR·'+fecha);return {...delBanco(dif,h%997,hashTxt('disfraz·'+fecha)),fecha};}

</script>
<script>
'use strict';
const JUEGO={id:'sudoku',n:'SudokAR',compartir:'¿Un sudoku? Hay uno nuevo cada día, el mismo para todos.'};
/* ───────── Lo común de los solitarios: ayudas, sonido, hojas, menú, carteles, XP y premios ───────── */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const acct=()=>{try{const o=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');return o&&o.usuario&&o.token?o:null;}catch(_){return null;}};
// 1:05 · 12:30 · 1:02:03
function reloj(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`;}

/* Sonido: chiquito y opcional */
let SND=ls.get(JUEGO.id+'-sonido')!=='0',AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC;}
function nota(f,t0=0,d=.25,v=.04,tipo='triangle'){const a=actx();if(!a)return;const t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.value=f;
  o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
const SX_BASE={tic(){nota(1180,0,.06,.02,'sine');},bien(){nota(660,0,.12,.03);nota(990,.06,.16,.025);},mal(){nota(220,0,.18,.035,'square');},
  gano(){[523,659,784,1047].forEach((f,i)=>nota(f,i*.09,.5,.045));},pista(){nota(880,0,.2,.03,'sine');nota(1320,.08,.25,.02,'sine');}};
let SX={...SX_BASE};
function sfx(k){if(!SND)return;try{SX[k]&&SX[k]();}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&AC&&AC.state==='running')AC.suspend().catch(()=>{});});

/* Carteles */
let toastT=0;function toast(t,ms=2200){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),ms);}
function over(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('over');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}
function hideOver(){$('over').hidden=true;}
function sheet(title,body){$('sheet').innerHTML=`<header><h2>${title}</h2><button class="x" id="sh-x" aria-label="Cerrar">✕</button></header><div class="body">${body}</div>`;$('modal').hidden=false;$('sh-x').onclick=closeSheet;}
function closeSheet(){$('modal').hidden=true;if(typeof alCerrarHoja==='function')alCerrarHoja();}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
function openSide(h){$('side-panel').innerHTML=h;$('side').hidden=false;}
function closeSide(){$('side').hidden=true;if(typeof alCerrarHoja==='function')alCerrarHoja();}
$('side').addEventListener('click',e=>{if(e.target.id==='side')closeSide();});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;
  if(!$('modal').hidden){closeSheet();e.preventDefault();}else if(!$('side').hidden){closeSide();e.preventDefault();}});
const tapado=()=>!$('modal').hidden||!$('side').hidden||!$('over').hidden||document.hidden;
function confeti(){if(RM)return;const box=document.createElement('div');box.className='confeti';const C=['#e0a93b','#7ce9e5','#e0503a','#57d49b','#c7a5ff','#f4ecdc'];
  for(let i=0;i<46;i++){const p=document.createElement('i');p.style.left=Math.random()*100+'%';p.style.background=C[i%C.length];p.style.animationDelay=(Math.random()*.6)+'s';p.style.animationDuration=(1.2+Math.random()*1.1)+'s';box.appendChild(p);}
  document.body.appendChild(box);setTimeout(()=>box.remove(),3200);}

/* Nivel del juego (sin rango: estos no son competitivos) */
function nivelHtml(){const R=window.RANGOS;if(!R)return '';const L=R.levelInfo(R.xp(JUEGO.id));
  return `<div class="lv-mine"><span class="lv">${L.lv}</span><div><b>Tu nivel en ${JUEGO.n}</b><small>Faltan ${fmt(L.need-L.into)} XP para el ${L.lv+1}</small><div class="bar"><i style="width:${(L.into/L.need*100).toFixed(1)}%"></i></div></div></div>`;}
// XP y un regalito para la estancia (una vez por partida). No da leguas: no es ranked.
// info (opcional, v70): lo que RANGOS.premio usa para la economía {rival, res, ok, extra}.
function premiosSolo(key,xp,info){
  const out={xp:0,pesos:0,lv:null};if(!window.RANGOS||!xp)return out;
  const H=ls.json(JUEGO.id+'-xp-hechas',[]);
  if(!H.includes(key)){try{RANGOS.addXp(JUEGO.id,xp);out.xp=xp;const pr=RANGOS.premio(JUEGO.n,xp,false,info);if(pr){out.pesos=pr.pesos;out.oro=pr.oro||0;}}catch(_){}H.push(key);ls.set(JUEGO.id+'-xp-hechas',JSON.stringify(H.slice(-80)));}
  try{out.lv=RANGOS.levelInfo(RANGOS.xp(JUEGO.id));}catch(_){}
  return out;}
/* v70: el del día va a la tabla del día (con tu cuenta) y da 1 legua para La Gran Pampa (una por día).
   valor: lo que ordena la tabla (segundos); extra: lo demás que muestra (err, mov…). En el cartel final va
   <p class="cap" id="f-dia"></p> y acá se completa con el puesto y la legua. */
const LEG_DIA={sudoku:'s',solitario:'o',buscaminas:'m'};
async function delDiaEnviar(fecha,valor,extra){
  const R=window.RANGOS,el=()=>$('f-dia');if(!R||!R.resultado||!fecha)return null;
  if(!acct()){const e=el();if(e)e.innerHTML='Con una cuenta, el del día entra en la tabla de todos y da leguas para La Gran Pampa.';return null;}
  let leg=0;try{leg=R.pampaAct(LEG_DIA[JUEGO.id]||'s',1);}catch(_){}
  const pon=j=>{const e=el();if(!e)return;const p=[];if(j&&j.puesto)p.push(`🏆 Hoy vas <b>${j.puesto}°</b> de ${j.de}${j.ya?' (cuenta la primera vez)':''}`);else if(j&&j.ya)p.push('🏆 En la tabla cuenta la primera vez del día');
    if(leg)p.push('🚩 +1 legua en La Gran Pampa');e.innerHTML=(p.join(' · ')||'🏆 Va a la tabla del día cuando haya internet')+` · <a href="./#tablas=${JUEGO.id}">Ver tabla</a>`;};
  pon(null);
  let j=null;try{j=await R.resultado(JUEGO.id,'dia',valor,{fecha,...(extra||{})},JUEGO.id+':dia:'+fecha);}catch(_){}
  pon(j&&j.ok?j:null);return j;
}
function premiosHtml(p){if(!p||!p.lv)return '';return `<p class="cap">${JUEGO.n} nivel ${p.lv.lv}${p.xp?` · +${p.xp} XP`:''}${window.ORO?(ORO.premioTxt(p)?' · '+ORO.premioTxt(p):''):p.pesos?` · 🎁 +${fmt(p.pesos)} 🪙 para tu estancia`:''}</p>`;}

/* v72: cruce de La Gran Pampa contra reloj («#pampa-cruce=SEMILLA&duelo=ID»). Los dos juegan el mismo tablero, cada uno
   cuando puede, y gana el que hace más puntos. No se guarda (tu partida de siempre queda como estaba), no da XP, oro ni
   leguas, y al final deja el resultado en «pampa-resultado». Si te trabás: ☰ › Terminar el cruce (anota lo que hiciste).
   Cada juego define window.cruceTerminar (para ese botón) y llama a cruceFin(puntos, texto, cómo se calculó). */
const CRUCE=(()=>{const m=/[#&]pampa-cruce=(\d+)&duelo=([\w-]+)/.exec(location.hash);return m?{seed:Number(m[1])>>>0,duelo:m[2],fin:false}:null;})();
function cruceFin(puntos,txt,como){if(!CRUCE)return '';if(!CRUCE.fin){CRUCE.fin=true;
    ls.set('pampa-resultado',JSON.stringify({j:JUEGO.id,seed:CRUCE.seed,duelo:CRUCE.duelo,puntos,txt,t:Date.now()}));}
  return `<p>Para el cruce de La Gran Pampa: <b>${fmt(puntos)} puntos</b><br><small>${como}</small></p><a class="btn go" id="f-pampa" href="pampa.html#resultado">🗺️ Volver a La Gran Pampa</a>`;}
function cruceAviso(txt){setTimeout(()=>toast('⚔️ '+txt,4200),500);}
/* Menú lateral con lo de siempre al final */
function menuPie(){return `${CRUCE&&!CRUCE.fin?'<button id="m-cruce">⚔️ Terminar el cruce <small>se anota lo que hiciste</small></button>':''}${window.LOGROS?'<button id="m-logros">🏅 Logros y retos</button>':''}${JUEGO.id==='buscaminas'?'':`<a href="./#tablas=${JUEGO.id}">🏆 Tabla del día y de la semana</a>`}
  <a href="estancia.html" data-campo>🏡 Mi estancia</a><a href="./#cuenta">👤 Mi cuenta</a><a href="./#juegos">🎮 Menú de juegos</a>`;}
function cablearPie(volver){if($('m-cruce'))$('m-cruce').onclick=()=>{closeSide();if(confirm('¿Terminar el cruce? Se anota lo que hiciste hasta ahora.')&&window.cruceTerminar)window.cruceTerminar();};
  if($('m-logros'))$('m-logros').onclick=()=>LOGROS.abrir(JUEGO.id,{side:openSide,volver,cerrar:closeSide});}
async function shareGame(){const url=location.href.replace(/[#?].*$/,''),data={title:JUEGO.n,text:JUEGO.compartir,url};
  try{if(navigator.share){await navigator.share(data);return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(url);toast('Link copiado');}catch(_){toast(esc(url));}}

function fitScreen(){document.documentElement.style.setProperty('--app-h',(window.visualViewport?visualViewport.height:innerHeight)+'px');if(typeof acomodar==='function')acomodar();}
window.addEventListener('resize',fitScreen);if(window.visualViewport)visualViewport.addEventListener('resize',fitScreen);

/* Chat de la app y las invitaciones que llegan mientras jugás solo */
function iniciarComun(busy){
  ls.set('bloques-ultimo-juego',JUEGO.id);ls.set('bloques-hub-v1','1');
  try{window.LOGROS&&LOGROS.aplicar(JUEGO.id);}catch(_){}
  if(window.RANGOS)RANGOS.css();
  const pag={poblar:'poblar.html',truco:'truco.html',uno:'uno.html',estancia:'estancia.html',pampa:'pampa.html',sudoku:'sudoku.html',solitario:'solitario.html',buscaminas:'buscaminas.html'};
  if(window.CHAT)CHAT.init({busy,account:()=>{location.href='./#cuenta';},game:()=>JUEGO.id,
    invite:(g,u)=>{if(g==='estancia'){location.href='estancia.html#malon';return;}location.href=(pag[g]||'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j===JUEGO.id){if(typeof openNew==='function')openNew();return;}location.href=c.j==='estancia'?'estancia.html#malon':(pag[c.j]||'./');}});
  fitScreen();
}

/* ───────── SudokAR: la hoja ─────────
   Tocás una casilla y después el número. Con «Notas» anotás con lápiz los que podrían ir.
   Se guarda solo: si cerrás, seguís donde estabas. El del día es el mismo para todos. */
const SAVE='sudoku-partida-v1',RECS='sudoku-records-v1',DIAS='sudoku-dias-v1';
const XP_DIF={facil:30,normal:45,dificil:60,experto:80},PISTAS=3;
/* v67: las ayudas visuales arrancan apagadas (también para los que nunca las tocaron) y cada una se prende aparte en Ajustes.
   «Marcar errores» apagado no marca NADA: ni el número en rojo, ni los repetidos, ni el destello verde al completar una fila
   (eso también te decía si estaba bien). Antes, con errores apagado, los repetidos se seguían pintando de rojo. */
const AYUDAS=[['errores','Marcar errores','El número equivocado se pone en rojo y se cuentan los errores.'],
  ['choques','Marcar repetidos','Si ponés un número que ya está en la fila, la columna o la caja, se marca.'],
  ['zona','Resaltar fila, columna y caja','Al elegir una casilla, se sombrea por dónde no puede repetirse.'],
  ['iguales','Resaltar números iguales','Al elegir un número, se marcan los iguales en todo el tablero.'],
  ['notasAuto','Borrar notas solas','Al poner un número, se borra de las notas de su fila, columna y caja.'],
  ['faltan','Cuántos faltan de cada número','Abajo de cada botón, cuántos quedan por poner.']];
const ayudaOn=k=>ls.get('sudoku-'+k)==='1';
let CFG={dif:DIFS.includes(ls.get('sudoku-dif'))?ls.get('sudoku-dif'):'facil'};for(const [k] of AYUDAS)CFG[k]=ayudaOn(k);
let P=null,SEL=-1,NOTAS=false,HL=0,ULT=0,PUESTO=-1,PUESTO_T=0;
SX.poner=()=>nota(740,0,.07,.025,'sine');SX.nota=()=>nota(1240,0,.05,.015,'sine');SX.linea=()=>{nota(784,0,.12,.03);nota(1046,.07,.18,.025);};

function guardar(){if(!P||P.cruce)return;ls.set(SAVE,JSON.stringify(P));}
/* v72: cruce de La Gran Pampa (comun.js): el mismo sudoku Normal para los dos, con los errores a la vista.
   Resuelto: 10000 − 2 por segundo − 300 por error o pista (≥ 1000). Sin terminar: 5 por casilla bien puesta (≤ 405). */
function nuevoCruce(){const n=bancoN('normal')||1,p=delBanco('normal',CRUCE.seed%n,CRUCE.seed);CFG.errores=true;
  P={v:1,dado:p.dado,sol:p.sol,cur:p.dado.slice(),notas:new Array(81).fill(0),pis:[],dif:p.dif,seed:p.seed,se:p.se||null,fecha:null,t:0,errores:0,undo:[],hecho:false,usoNotas:false,id:'x'+CRUCE.seed,cruce:1};
  SEL=-1;HL=0;NOTAS=false;ULT=Date.now();hideOver();render();cruceAviso('Cruce de La Gran Pampa: el mismo sudoku que tu rival. Cuentan el tiempo y los errores (cada pista, como un error).');}
function finCruce(resuelto){if(!P||!P.cruce)return;P.hecho=true;SEL=-1;HL=0;render();
  const seg=Math.round(P.t/1000),mal=P.errores+P.pis.length,bien=P.cur.filter((v,i)=>!P.dado[i]&&v&&v===P.sol[i]).length;
  const puntos=resuelto?Math.max(1000,10000-2*seg-300*mal):Math.min(405,5*bien);
  if(resuelto){sfx('gano');confeti();}
  over(`<div class="ic">${resuelto?'🧩':'⚔️'}</div><h3>${resuelto?'¡Sudoku resuelto!':'Cruce terminado'}</h3><p>${reloj(P.t)} · ${mal} ${mal===1?'error o pista':'errores o pistas'}</p>
    ${cruceFin(puntos,resuelto?`Resuelto en ${reloj(P.t)}`:`${bien} casillas bien`,resuelto?'10000 − 2 por segundo − 300 por error o pista':'5 por casilla bien puesta')}`);}
window.cruceTerminar=()=>finCruce(false);
function nuevo(dif,seed,fecha){
  if(P&&P.cruce)CFG.errores=ayudaOn('errores');   // v72: al dejar el cruce vuelven tus ajustes
  let p;if(fecha)p=delDia(fecha);else{dif=DIFS.includes(dif)?dif:'normal';p=seed!=null?delBanco(dif,Math.floor(seed/1e6),seed%1e6):alAzar(dif);}
  P={v:1,dado:p.dado,sol:p.sol,cur:p.dado.slice(),notas:new Array(81).fill(0),pis:[],dif:p.dif,seed:p.seed,se:p.se||null,fecha:fecha||null,t:0,errores:0,undo:[],hecho:false,usoNotas:false,id:(fecha?'d'+fecha:p.dif+':'+p.seed)};
  SEL=-1;HL=0;NOTAS=false;ULT=Date.now();hideOver();guardar();render();
  if(!fecha&&dif)ls.set('sudoku-dif',dif);
}
const esDado=i=>!!P.dado[i]||P.pis.includes(i);
function chocan(i){const v=P.cur[i];if(!v)return false;for(const j of PEERS[i])if(P.cur[j]===v)return true;return false;}
function faltan(d){let n=9;for(let i=0;i<81;i++)if(P.cur[i]===d)n--;return n;}

/* ───────── Dibujar ───────── */
function render(){
  if(!P)return;const tab=$('tab');
  if(tab.children.length!==81){let h='';for(let i=0;i<81;i++){const c=COL(i),r=ROW(i);h+=`<button class="c${c===2||c===5?' bc':''}${r===2||r===5?' br':''}" data-i="${i}" role="gridcell" aria-label="Fila ${r+1}, columna ${c+1}"></button>`;}tab.innerHTML=h;}
  const sv=SEL>=0?P.cur[SEL]:0,hd=sv||HL;
  for(let i=0;i<81;i++){const el=tab.children[i],v=P.cur[i],dado=esDado(i);
    let cls='c'+(COL(i)===2||COL(i)===5?' bc':'')+(ROW(i)===2||ROW(i)===5?' br':'');
    if(P.dado[i])cls+=' dado';else if(P.pis.includes(i))cls+=' pista';
    if(CFG.zona&&SEL>=0&&i!==SEL&&(ROW(i)===ROW(SEL)||COL(i)===COL(SEL)||BOX(i)===BOX(SEL)))cls+=' zn';
    if(hd&&v===hd&&i!==SEL&&(CFG.iguales||HL))cls+=' mi';
    if(i===SEL)cls+=' sl';
    if(v&&!dado&&CFG.errores&&v!==P.sol[i])cls+=' malo';
    if(CFG.choques&&v&&!dado&&chocan(i))cls+=' choca';
    if(i===PUESTO)cls+=' puesto';
    const full=cls+(el.classList.contains('ok')?' ok':'');if(el.className!==full)el.className=full;
    let inner='';
    if(v)inner=String(v);
    else if(P.notas[i]){inner='<span class="notas">';for(let d=1;d<=9;d++)inner+=`<i${hd===d&&(CFG.iguales||HL)&&P.notas[i]&BIT(d)?' class="mi"':''}>${P.notas[i]&BIT(d)?d:''}</i>`;inner+='</span>';}
    if(el.dataset.h!==inner){el.innerHTML=inner;el.dataset.h=inner;}
    el.setAttribute('aria-label',`Fila ${ROW(i)+1}, columna ${COL(i)+1}${v?', '+v:', vacía'}`);
  }
  const pl=PISTAS-P.pis.length;
  $('herr').innerHTML=`<button class="hb" id="h-undo" ${P.undo.length&&!P.hecho?'':'disabled'}><i>↶</i>Deshacer</button>
    <button class="hb" id="h-borrar" ${SEL>=0&&!esDado(SEL)&&(P.cur[SEL]||P.notas[SEL])&&!P.hecho?'':'disabled'}><i>⌫</i>Borrar</button>
    <button class="hb${NOTAS?' on':''}" id="h-notas" aria-pressed="${NOTAS}"><i>✏️</i>Notas: ${NOTAS?"sí":"no"}</button>
    <button class="hb" id="h-pista" ${pl>0&&!P.hecho?'':'disabled'}><i>💡</i>Pista<span class="cnt">${pl}</span></button>`;
  $('h-undo').onclick=deshacer;$('h-borrar').onclick=borrar;$('h-notas').onclick=()=>{NOTAS=!NOTAS;render();};$('h-pista').onclick=pista;
  let nh='';for(let d=1;d<=9;d++){const f=faltan(d);nh+=CFG.faltan?`<button class="nb${f<=0?' lleno':''}${NOTAS?' notas-on':''}" data-d="${d}" aria-label="${d}${f>0?`, faltan ${f}`:', completo'}">${d}<small>${f>0?f:'✓'}</small></button>`:`<button class="nb${NOTAS?' notas-on':''}" data-d="${d}" aria-label="${d}">${d}</button>`;}
  $('nums').innerHTML=nh;
  hud();
}
function hud(){if(!P)return;$('hud').innerHTML=`<span class="dif">${P.fecha?'<span class="dia">Del día</span>':''}<b>${DIFN[P.dif]}</b>${CFG.errores?` · ${P.errores} ${P.errores===1?'error':'errores'}`:''}</span><span class="t" id="reloj">${reloj(P.t)}</span>`;}

/* ───────── Jugar ───────── */
function elegir(i){if(!P||P.hecho)return;SEL=i;HL=0;sfx('tic');render();}
function apuntar(i,cambios){cambios.push([i,P.cur[i],P.notas[i]]);}
function poner(d){
  if(!P||P.hecho)return;
  if(SEL<0||esDado(SEL)){HL=HL===d?0:d;render();return;}
  const i=SEL,ch=[];
  if(NOTAS){if(P.cur[i])return;apuntar(i,ch);P.notas[i]^=BIT(d);P.usoNotas=true;P.undo.push(ch);sfx('nota');guardar();render();return;}
  apuntar(i,ch);
  if(P.cur[i]===d){P.cur[i]=0;P.undo.push(ch);guardar();render();return;}
  P.cur[i]=d;P.notas[i]=0;PUESTO=i;clearTimeout(PUESTO_T);PUESTO_T=setTimeout(()=>{PUESTO=-1;},400);
  if(CFG.notasAuto)for(const j of PEERS[i])if(P.notas[j]&BIT(d)){apuntar(j,ch);P.notas[j]&=~BIT(d);}
  P.undo.push(ch);if(P.undo.length>300)P.undo.shift();
  if(d!==P.sol[i]){P.errores++;if(CFG.errores){sfx('mal');if(navigator.vibrate)try{navigator.vibrate(30);}catch(_){}}else sfx('poner');}
  else{sfx('poner');if(CFG.errores)festejarUnidades(i);}
  guardar();render();revisarFin();
}
function festejarUnidades(i){const L=[];for(const u of UNITS)if(u.includes(i)&&u.every(j=>P.cur[j]===P.sol[j]))L.push(...u);
  if(!L.length||RM)return;sfx('linea');const tab=$('tab');
  setTimeout(()=>{for(const j of new Set(L)){const el=tab.children[j];el.classList.remove('ok');void el.offsetWidth;el.classList.add('ok');setTimeout(()=>el.classList.remove('ok'),500);}},10);}
function borrar(){if(!P||P.hecho||SEL<0||esDado(SEL))return;const ch=[];apuntar(SEL,ch);P.cur[SEL]=0;P.notas[SEL]=0;P.undo.push(ch);guardar();render();}
function deshacer(){if(!P||P.hecho)return;const ch=P.undo.pop();if(!ch)return;for(let k=ch.length-1;k>=0;k--){const [i,v,n]=ch[k];P.cur[i]=v;P.notas[i]=n;}SEL=ch[0][0];sfx('tic');guardar();render();}
function pista(){
  if(!P||P.hecho||P.pis.length>=PISTAS)return;
  let i=SEL>=0&&!esDado(SEL)&&P.cur[SEL]!==P.sol[SEL]?SEL:-1;
  if(i<0){// la casilla vacía (o equivocada) con menos opciones
    let best=10;for(let j=0;j<81;j++)if(!esDado(j)&&P.cur[j]!==P.sol[j]){const g=P.cur.map((v,k)=>v===P.sol[k]?v:0);const n=POP(candidatos(g,j));if(n<best){best=n;i=j;}}}
  if(i<0)return;
  const d=P.sol[i],ch=[];apuntar(i,ch);P.cur[i]=d;P.notas[i]=0;for(const j of PEERS[i])if(P.notas[j]&BIT(d)){apuntar(j,ch);P.notas[j]&=~BIT(d);}
  P.pis.push(i);P.undo=P.undo.filter(c=>!c.some(x=>x[0]===i));SEL=i;PUESTO=i;clearTimeout(PUESTO_T);PUESTO_T=setTimeout(()=>{PUESTO=-1;},400);sfx('pista');guardar();render();if(CFG.errores)festejarUnidades(i);revisarFin();
}
function revisarFin(){
  if(!P||P.hecho)return;
  for(let i=0;i<81;i++)if(!P.cur[i])return;
  if(P.cur.some((v,i)=>v!==P.sol[i])){toast(CFG.errores?'Está todo lleno, pero hay números en rojo.':'Está todo lleno, pero algo no cierra. Si querés verlo, prendé «Marcar errores» en ☰ › Ajustes.',3200);return;}
  terminar();
}
function terminar(){
  if(P.cruce){finCruce(true);return;}
  P.hecho=true;SEL=-1;HL=0;guardar();render();sfx('gano');confeti();
  const ms=P.t,limpio=P.errores===0&&P.pis.length===0,R=ls.json(RECS,{}),antes=R[P.dif]||0,rec=!antes||ms<antes;
  if(rec){R[P.dif]=ms;ls.set(RECS,JSON.stringify(R));}
  if(P.fecha){const D=ls.json(DIAS,{});if(!D[P.fecha])D[P.fecha]={t:ms,dif:P.dif};ls.set(DIAS,JSON.stringify(D));}
  const xp=XP_DIF[P.dif]+(P.fecha?15:0)+(limpio?10:0),pr=premiosSolo('s'+P.id,xp,{res:'gana',ok:true,extra:{dificultad:P.dif,delDia:!!P.fecha}});
  let lg='';try{if(window.LOGROS)lg=LOGROS.fin('sudoku',{gano:true,modo:'solo',dif:P.dif,limpio,ms,diario:!!P.fecha,notas:P.usoNotas},P.id).html||'';}catch(_){}
  setTimeout(()=>{
    over(`<div class="ic">${limpio?'🌟':'🎉'}</div><h3>${limpio?'¡Impecable!':'¡Sudoku resuelto!'}</h3>
      <p>${P.fecha?`Sudoku del día · ${DIFN[P.dif]}`:DIFN[P.dif]}${limpio?' · sin errores ni pistas':''}</p>
      <div class="stats"><div class="${rec?'rec':''}"><b>${reloj(ms)}</b><small>${rec?'¡Récord!':'Tiempo'}</small></div>${CFG.errores?`<div><b>${P.errores}</b><small>${P.errores===1?'error':'errores'}</small></div>`:''}<div><b>${P.pis.length}</b><small>${P.pis.length===1?'pista':'pistas'}</small></div></div>
      ${!rec&&antes?`<p class="cap">Tu mejor en ${DIFN[P.dif]}: ${reloj(antes)}</p>`:''}
      ${premiosHtml(pr)}${P.fecha?'<p class="cap" id="f-dia"></p>':''}${lg}
      <div class="row"><button class="btn go" id="f-otro">Otro en ${DIFN[P.dif]}</button></div>
      <div class="row"><button class="btn" id="f-dif">Cambiar dificultad</button>${window.CHAT&&acct()?'<button class="btn" id="f-share">💬 Compartir</button>':''}</div>
      <a class="btn" href="./#juegos">Menú de juegos</a>`);
    $('f-otro').onclick=()=>nuevo(P.dif);$('f-dif').onclick=()=>{hideOver();openNew();};
    if($('f-share'))$('f-share').onclick=()=>CHAT.share({j:'sudoku',t:`SudokAR · ${P.fecha?'Sudoku del día':DIFN[P.dif]}`,d:`Lo resolví en ${reloj(ms)}${limpio?' sin errores':''}`,r:''});
    // v70: tabla del día (menos errores primero; cada pista cuenta como un error) y 1 legua
    if(P.fecha)delDiaEnviar(P.fecha,Math.round(ms/1000),{err:P.errores+P.pis.length,dif:DIFN[P.dif]});
  },RM?0:650);
}

/* ───────── Reloj ───────── */
setInterval(()=>{const now=Date.now(),dt=Math.min(5000,now-ULT);ULT=now;if(!P||P.hecho||tapado())return;P.t+=dt;const r=$('reloj');if(r)r.textContent=reloj(P.t);if(Math.floor(P.t/5000)!==Math.floor((P.t-dt)/5000))guardar();},1000);
document.addEventListener('visibilitychange',()=>{ULT=Date.now();if(document.hidden)guardar();});

/* ───────── Toques y teclado ───────── */
$('tab').addEventListener('click',e=>{const b=e.target.closest('.c');if(!b)return;const i=Number(b.dataset.i);if(SEL===i&&!esDado(i)){SEL=-1;render();return;}elegir(i);});
$('nums').addEventListener('click',e=>{const b=e.target.closest('.nb');if(!b)return;poner(Number(b.dataset.d));});
document.addEventListener('keydown',e=>{
  if(!P||P.hecho||!$('modal').hidden||!$('side').hidden||!$('over').hidden)return;if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(/^[1-9]$/.test(k)){poner(Number(k));e.preventDefault();return;}
  if(k==='Backspace'||k==='Delete'||k==='0'){borrar();e.preventDefault();return;}
  if(k==='n'||k==='N'){NOTAS=!NOTAS;render();return;}
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='Z')){deshacer();e.preventDefault();return;}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(mv){e.preventDefault();let i=SEL<0?40:SEL;if(mv===-1&&COL(i)===0)i+=8;else if(mv===1&&COL(i)===8)i-=8;else i=(i+mv+81)%81;elegir(i);}
});

/* ───────── Hojas: partida nueva, récords, ayuda, menú ───────── */
function enCurso(){return P&&!P.hecho&&P.cur.some((v,i)=>v&&!P.dado[i]);}
function openNew(){
  const hoy=fechaAR(),dd=difDelDia(hoy),D=ls.json(DIAS,{}),hecho=D[hoy];
  sheet('Sudoku nuevo',`<button class="btn tall${hecho?'':' go'}" id="n-dia">📅 Sudoku del día<small>${hecho?`Ya lo hiciste en ${reloj(hecho.t)} · lo podés repetir`:`Hoy toca ${DIFN[dd]} · el mismo para todos · tabla del día y 🚩 1 legua`}</small></button>
    <h4>Elegí la dificultad</h4>
    <div class="seg">${DIFS.map(d=>`<button class="btn tall${CFG.dif===d?' on':''}" data-dif="${d}">${DIFN[d]}<small>${{facil:'para arrancar',normal:'pensando un poco',dificil:'con técnica',experto:'para expertos'}[d]}</small></button>`).join('')}</div>
    ${enCurso()?'<p class="note">El sudoku que estás haciendo se reemplaza.</p>':''}
    <button class="btn go" id="n-go">Empezar ${DIFN[CFG.dif]}</button>`);
  document.querySelectorAll('#sheet [data-dif]').forEach(b=>b.onclick=()=>{CFG.dif=b.dataset.dif;ls.set('sudoku-dif',CFG.dif);openNew();});
  $('n-go').onclick=()=>{$('modal').hidden=true;nuevo(CFG.dif);};
  $('n-dia').onclick=()=>{$('modal').hidden=true;nuevo(null,null,hoy);};
}
function alCerrarHoja(){if(!P){openNew();}}
function openRecs(){const R=ls.json(RECS,{}),D=ls.json(DIAS,{}),dias=Object.keys(D).length;
  sheet('Tus récords',`<div class="recs">${DIFS.map(d=>`<div><span>${DIFN[d]}</span><b>${R[d]?reloj(R[d]):'—'}</b></div>`).join('')}</div>
    <p class="note">${dias?`Hiciste ${dias} ${dias===1?'sudoku del día':'sudokus del día'}.`:'Todavía no hiciste ningún sudoku del día.'}</p>`);}
function openHelp(){
  sheet('Cómo se juega',`<p>Completá la grilla para que <b>cada fila, cada columna y cada caja de 3×3</b> tenga los números del 1 al 9, sin repetir.</p>
    <h4>Cómo se anota</h4><ul><li>Tocá una casilla y después el número de abajo. Tocando el mismo número otra vez, se borra.</li>
    <li><b>Notas:</b> con el lápiz prendido anotás chiquito los números que podrían ir.</li>
    <li><b>Ayudas:</b> marcar errores, repetidos, resaltar fila y columna, números iguales y más se prenden en ☰ › Ajustes. Arrancan apagadas.</li>
    <li>Sin casilla elegida, tocar un número te muestra dónde está en todo el tablero.</li>
    <li><b>Pista:</b> te completa una casilla (hay ${PISTAS} por sudoku).</li></ul>
    <h4>Las dificultades</h4><p>Fácil sale sólo mirando qué falta. Normal pide buscar dónde va cada número. Difícil pide técnicas (pares, señaladores, X-wing). Experto, técnicas finas y notas. Todos salen con lógica: nunca hace falta adivinar.</p>
    <p class="note">Cada sudoku tiene una sola solución. El del día es el mismo para todos y se pone más difícil a medida que avanza la semana (el domingo, Experto). Con teclado: números, flechas, Borrar y la N para las notas.</p>
    <button class="btn go" id="h-ok">Entendido</button>`);$('h-ok').onclick=closeSheet;}
function openAjustes(){
  sheet('Ajustes',`<p class="note">Todas arrancan apagadas: prendé sólo las que te sirvan.</p><div class="ajustes">${AYUDAS.map(([k,n,d])=>`<button class="aj${CFG[k]?' on':''}" data-aj="${k}" role="switch" aria-checked="${CFG[k]}"><span><b>${n}</b><small>${d}</small></span><i aria-hidden="true"></i></button>`).join('')}</div>
    <button class="btn go" id="aj-ok">Listo</button>`);
  document.querySelectorAll('#sheet [data-aj]').forEach(b=>b.onclick=()=>{const k=b.dataset.aj;CFG[k]=!CFG[k];ls.set('sudoku-'+k,CFG[k]?'1':'0');render();openAjustes();});
  $('aj-ok').onclick=closeSheet;}
function openMenu(){
  openSide(`<div class="side-head"><h2>Menú</h2><button class="side-x" id="m-x" aria-label="Cerrar">✕</button></div>${nivelHtml()}<div class="menu-list">
    <button id="m-new">🧩 Sudoku nuevo</button><button id="m-dia">📅 Sudoku del día</button><button id="m-recs">⏱️ Tus récords</button>
    <button id="m-aj">⚙️ Ajustes: ayudas y marcas</button>
    <button id="m-help">❓ Cómo se juega</button><button id="m-snd">${SND?'🔊 Sonido: prendido':'🔇 Sonido: apagado'}</button><button id="m-share">📲 Pasar el juego</button>
    <a class="salir" id="m-salir" href="./#juegos">🚪 Salir de la partida</a>
    ${menuPie()}</div><p class="note" style="margin-top:auto;text-align:center">SudokAR · versión 72</p>`);
  const go=f=>()=>{$('side').hidden=true;f();};
  $('m-x').onclick=closeSide;$('m-new').onclick=go(openNew);$('m-dia').onclick=go(()=>nuevo(null,null,fechaAR()));$('m-recs').onclick=go(openRecs);$('m-help').onclick=go(openHelp);$('m-share').onclick=go(shareGame);
  $('m-aj').onclick=go(openAjustes);
  $('m-snd').onclick=()=>{SND=!SND;ls.set('sudoku-sonido',SND?'1':'0');openMenu();};
  cablearPie(openMenu);
}
$('btn-menu').onclick=openMenu;

/* ───────── Tamaño del tablero ───────── */
function acomodar(){
  const app=$('app'),H=app.clientHeight,W=app.clientWidth,top=app.querySelector('.top').offsetHeight+$('hud').offsetHeight;
  const land=matchMedia('(orientation:landscape) and (max-height:560px)').matches;
  let bs;
  if(land)bs=Math.min(H-top-18,W-Math.min(300,W*.42)-44);
  else{const ctrl=($('herr').offsetHeight||54)+($('nums').offsetHeight||58)+34;bs=Math.min(W-20,H-top-ctrl,560);}
  document.documentElement.style.setProperty('--bs',Math.max(220,Math.floor(bs))+'px');
}

/* ───────── Arranque ───────── */
(function start(){
  iniciarComun(()=>!!(P&&!P.hecho&&enCurso()));
  const s=ls.json(SAVE,null);
  if(CRUCE)nuevoCruce();
  else if(s&&s.v===1&&Array.isArray(s.cur)&&s.cur.length===81){P=s;P.undo=P.undo||[];P.pis=P.pis||[];ULT=Date.now();render();if(P.hecho)setTimeout(()=>{if(!$('modal').hidden||!$('side').hidden)return;over(`<div class="ic">🧩</div><h3>¿Otro sudoku?</h3><p>El último ya lo resolviste.</p><button class="btn go" id="o-new">Sudoku nuevo</button><button class="btn" id="o-dia">Sudoku del día</button>`);$('o-new').onclick=()=>{hideOver();openNew();};$('o-dia').onclick=()=>nuevo(null,null,fechaAR());},200);}
  else{nuevo(CFG.dif);try{window.SYNCRO&&SYNCRO.auto(SAVE);}catch(_){}if(!ls.get('sudoku-ayuda')){ls.set('sudoku-ayuda','1');openHelp();}}
  if(!CRUCE&&/^#dia/.test(location.hash))nuevo(null,null,fechaAR());
  if(location.hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  acomodar();requestAnimationFrame(acomodar);
})();
// v63: si de tu cuenta llega un sudoku más nuevo (lo venías haciendo en otro dispositivo), se sigue ése.
window.addEventListener('bloques-sync',e=>{if(P&&P.cruce)return;const k=(e.detail&&e.detail.claves)||[];let aj=false;for(const [a] of AYUDAS)if(k.includes('sudoku-'+a)){CFG[a]=ayudaOn(a);aj=true;}if(aj&&P)render();if(!k.includes(SAVE))return;
  const s=ls.json(SAVE,null);if(!(s&&s.v===1&&Array.isArray(s.cur)&&s.cur.length===81)||s.hecho)return;
  try{$('modal').hidden=true;}catch(_){}P=s;P.undo=P.undo||[];P.pis=P.pis||[];ULT=Date.now();render();
  try{toast('Seguís el sudoku que venías haciendo en tu otro dispositivo.');}catch(_){}});
window.SUDOKU={get CFG(){return CFG;},openAjustes,get P(){return P;},get SEL(){return SEL;},nuevo,elegir,poner,borrar,deshacer,pista,openNew,openMenu,render,
  set NOTAS(v){NOTAS=!!v;render();},llenarCasi(){for(let i=0;i<81;i++)if(!P.cur[i]){P.cur[i]=P.sol[i];}const v=P.cur.findIndex((x,i)=>!P.dado[i]);P.cur[v]=0;guardar();render();return v;}};

</script>
