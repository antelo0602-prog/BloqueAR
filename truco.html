<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16110c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>TrucAR</title>
<style>
/* TrucAR: una mesa de boliche. Madera oscura, paño verde gastado y naipes españoles dibujados a mano. */
:root{--bg:#16110c;--line:#3a2e22;--ink:#efe6d2;--aqua:#7ce9e5;--gold:#f6c453;
  --brass:#c4a265;--brass2:#8a6a3e;--parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;--brown:#2a2118;--soft:#7d6d58;
  --olive:#5f7a3a;--olive2:#4a6030;--clay:#a3482f;--clay2:#7e3420;
  --wood:#3b2717;--wood2:#2a1b10;--felt:#2e4a35;--felt2:#223a29;--stitch:rgba(214,196,150,.28);
  --card:#f6efde;--cardline:#b9a27c;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --cw:96px;--ch:144px;--tw:72px;--th:108px}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
/* Barra de arriba: la misma de todos los juegos */
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);color:var(--ink);flex:none;border-bottom:1px solid #2b2118;position:relative;z-index:3}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap;display:flex;align-items:center}.brand span{color:#d9b866}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#d9c79e;border:1px solid #6b5a3e;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#211910;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}
.icon-btn+.icon-btn{margin-left:0}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,7px);grid-template-rows:repeat(2,7px);gap:3px;place-content:center;padding:0}
.games-btn i{width:7px;height:7px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
/* La mesa: madera alrededor, paño en el medio */
.table{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 40%,rgba(255,220,170,.08),transparent 60%),
    repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,235,200,.035) 9px 10px,transparent 10px 23px),
    linear-gradient(180deg,var(--wood),var(--wood2))}
.rival{flex:none;display:flex;align-items:center;gap:10px;padding:10px max(14px,env(safe-area-inset-right)) 6px max(14px,env(safe-area-inset-left));position:relative}
.who{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--c,#8a6a3e);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 2px rgba(214,196,150,.35);flex:none}
.who .tx{min-width:0}.who b{display:block;font:700 16px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{display:block;color:#c9b996;font-size:12px}
.mano-tag{display:inline-block;margin-left:6px;font:700 10.5px/1 system-ui;letter-spacing:.04em;color:#2a1f12;background:linear-gradient(#d4b674,#b89550);border-radius:5px;padding:3px 5px 2px;vertical-align:2px}
.backs{display:flex;flex:none;height:62px;align-items:flex-start;padding-right:4px}
.backs .card{width:40px;height:60px;margin-left:-14px;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.backs .card:first-child{margin-left:0}
.backs .card:nth-child(1){transform:rotate(-7deg)}.backs .card:nth-child(3){transform:rotate(7deg)}
/* Paño */
.felt{position:relative;flex:1;min-height:0;margin:2px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-radius:22px;
  background:radial-gradient(90% 70% at 50% 45%,#365a40 0%,var(--felt) 55%,var(--felt2) 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 40px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.felt::before{content:"";position:absolute;inset:7px;border-radius:17px;border:1.5px dashed var(--stitch);pointer-events:none}
.felt::after{content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.03) 0 1px,transparent 1px 3px)}
/* Tanteador con fósforos */
.score{position:relative;z-index:1;display:flex;flex-direction:column;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(18,26,20,.45);box-shadow:inset 0 0 0 1px rgba(214,196,150,.16);flex:none}
.score .ln{display:flex;align-items:center;gap:8px}
.score .nm{width:auto;min-width:30px;max-width:74px;font-size:11px;color:#cdbf9f;font-weight:650;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .n{min-width:22px;text-align:right;font:700 17px/1 var(--serif);color:#f3e9d0;font-variant-numeric:tabular-nums}
.score svg{display:block}
.score .meta{font-size:11px;color:#a9b89f;text-align:center;letter-spacing:.02em}
/* Bazas: la carta del rival arriba y la tuya abajo */
.bazas{position:relative;z-index:1;display:flex;gap:10px;align-items:center}
.baza{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.slot{width:var(--tw);height:var(--th);border-radius:8px;box-shadow:inset 0 0 0 1.5px rgba(214,196,150,.14);position:relative}
.slot .card{position:absolute;inset:0;width:100%;height:100%}
.slot .card.win{box-shadow:0 0 0 2px #e9cf86,0 0 18px rgba(233,207,134,.55),0 6px 14px rgba(0,0,0,.45)}
.slot .card.lose{filter:saturate(.55) brightness(.82)}
.baza .tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font:700 10px/1 system-ui;letter-spacing:.06em;color:#e7dcc4;background:rgba(20,16,10,.82);border-radius:6px;padding:4px 6px 3px;white-space:nowrap;z-index:2}
/* Lo que se dice: globos */
.say{position:absolute;z-index:6;max-width:min(280px,80vw);padding:9px 14px;border-radius:14px;background:var(--parch);color:var(--brown);font:700 19px/1.15 var(--serif);box-shadow:0 10px 26px rgba(0,0,0,.45);border:1px solid var(--rule);pointer-events:none;animation:sayIn .22s cubic-bezier(.2,1.4,.4,1)}
.say small{display:block;font:600 12.5px/1.25 system-ui,sans-serif;color:#6b5a44;margin-top:2px}
.say.r{top:64px;left:max(64px,calc(env(safe-area-inset-left) + 64px))}
.say.r::before{content:"";position:absolute;top:-7px;left:16px;border:7px solid transparent;border-top:0;border-bottom-color:var(--parch)}
.say.m{bottom:calc(100% + 10px);left:50%;transform:translateX(-50%)}
.say.m::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--parch)}
.say.hot{background:#f5e3c8;border-color:#c9925a;color:#5a1f12}
@keyframes sayIn{from{opacity:0;transform:translateY(6px) scale(.92)}}
.say.m{animation:sayInM .22s cubic-bezier(.2,1.4,.4,1)}
@keyframes sayInM{from{opacity:0;transform:translate(-50%,6px) scale(.92)}}
/* Tu lado: estado, botones y mano */
.me{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.status{min-height:20px;font-size:13.5px;color:#e3d6b8;text-align:center;font-weight:600}
.status b{color:#f3dc9a}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:46px;width:min(520px,100%)}
.act{min-height:46px;min-width:86px;padding:0 14px;border-radius:12px;border:1px solid #7a5d33;background:linear-gradient(#d4b674,#b89550);color:#2a1f12;font:750 15px/1.1 system-ui,sans-serif;box-shadow:0 3px 0 #5d4425,0 6px 14px rgba(0,0,0,.35)}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 #5d4425}
.act.yes{background:linear-gradient(#7d9a4c,#5f7a3a);border-color:#3f5226;color:#f6f1e2;box-shadow:0 3px 0 #33441e,0 6px 14px rgba(0,0,0,.35)}
.act.no{background:linear-gradient(#bd5b3e,#a3482f);border-color:#6e2c1b;color:#fff3e2;box-shadow:0 3px 0 #5e2416,0 6px 14px rgba(0,0,0,.35)}
.act.ghost{background:rgba(30,22,14,.6);border-color:#5a4630;color:#e3d6b8;box-shadow:none;min-width:0}
.act small{display:block;font-weight:600;font-size:11px;opacity:.85}
.act:disabled{opacity:.4}
.hand{display:flex;justify-content:center;align-items:flex-start;height:calc(var(--ch) + 18px);padding-top:4px;position:relative}
.hand .card{width:var(--cw);height:var(--ch);margin:0 -6px;transition:transform .16s ease,box-shadow .16s ease;box-shadow:0 8px 18px rgba(0,0,0,.45);position:relative}
.hand .card:nth-child(1){transform:rotate(-6deg) translateY(6px)}.hand .card:nth-child(3){transform:rotate(6deg) translateY(6px)}
.hand.two .card:nth-child(1){transform:rotate(-4deg) translateY(3px)}.hand.two .card:nth-child(2){transform:rotate(4deg) translateY(3px)}
.hand.play .card{cursor:pointer}
.hand.play .card:hover{transform:translateY(-10px)!important}
.hand:not(.play) .card{filter:brightness(.9)}
.hand.deal .card{animation:dealIn .38s cubic-bezier(.2,.9,.3,1) both}.hand.deal .card:nth-child(2){animation-delay:.08s}.hand.deal .card:nth-child(3){animation-delay:.16s}
.backs.deal .card{animation:dealTop .32s ease-out both}.backs.deal .card:nth-child(2){animation-delay:.08s}.backs.deal .card:nth-child(3){animation-delay:.16s}
@keyframes dealIn{from{translate:0 70px;opacity:0}}@keyframes dealTop{from{translate:0 -40px;opacity:0}}
.card{display:block;border-radius:8px;background:var(--card);overflow:hidden}
.card svg{display:block;width:100%;height:100%}
.envhint{font-size:12px;color:#bfae8a}
/* Elegir envido */
.pick{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:#211910;border:1px solid #5a4630;box-shadow:0 14px 30px rgba(0,0,0,.5);z-index:8;min-width:190px}
.pick[hidden]{display:none}
.pick button{min-height:44px;border-radius:10px;border:1px solid #5a4630;background:#2c2218;color:var(--ink);font-weight:700;text-align:left;padding:0 12px}
.pick button small{color:#bfae8a;font-weight:600;margin-left:6px}
/* Carteles, hojas y menú (como en los otros juegos) */
.center{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(14,10,6,.58);z-index:9}
.center[hidden]{display:none}
.ccard{width:min(420px,100%);max-height:100%;overflow:auto;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ccard h3{margin:0;font:700 22px/1.2 var(--serif)}
.ccard p{margin:0;color:#4d4031}
.ccard .ic{font-size:34px;line-height:1}
.ccard .btn{width:100%}
.ccard .lines{display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px 10px;border-radius:10px;background:#fbf7ee;border:1px solid #e1d3b6}
.ccard .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ccard .lines b{font-family:var(--serif);font-size:15px}
.ccard .mini{display:flex;justify-content:center;gap:6px}
.ccard .mini .card{width:52px;height:78px;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.ccard .mini .card.used{opacity:.55}
.ccard .cap{font-size:12.5px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:46px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.15}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.gold{background:linear-gradient(#d4b674,#b89550);border-color:#7a5d33;color:#2a1f12}
.btn.red{background:var(--clay);border-color:var(--clay2);color:#fff3e2}
.btn.on{box-shadow:inset 0 0 0 2px #5f7a3a;background:#eef0dc}
.btn:disabled{opacity:.45}
.btn.col{flex-direction:column;gap:0}
.btn.link{background:none;border:0;box-shadow:none;color:#6b5a44;text-decoration:underline;min-height:36px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(14,10,6,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(520px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.sheet h4{margin:6px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.sheet .seg{display:flex;gap:6px}.sheet .seg .btn{flex:1}
.sheet .note,.note{font-size:12.5px;color:var(--soft)}
.sheet ul{margin:0;padding-left:18px;color:#4d4031;display:flex;flex-direction:column;gap:4px}
.ladder{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ladder .card{width:100%;aspect-ratio:2/3;height:auto;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.ladder i{grid-column:1/-1;font-style:normal;font-size:11.5px;color:var(--soft);text-align:center}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:#4d4031;font-size:13.5px}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ulist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.ulist .av{width:34px;height:34px;font-size:18px}
.ulist .nm{flex:1;font-weight:700}
.ulist .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5aa64a;margin-left:6px}
.ulist button{min-height:38px;border-radius:9px;border:1px solid #7a5d33;background:linear-gradient(#d4b674,#b89550);font-weight:700;padding:0 12px;color:#2a1f12}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #b9a27a;border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(10,8,5,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#1c1610;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#2a2118;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#241c14;font-weight:650;text-decoration:none;color:var(--ink);font-size:15px;text-align:left}
.side .note{color:#a39276}
.onl{position:absolute;top:6px;right:max(12px,env(safe-area-inset-right));font-size:11.5px;font-weight:700;color:#cfe3c0;z-index:4}
.onl.off{color:#e8cf9a}.onl:empty{display:none}
.toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;background:rgba(30,24,16,.95);color:var(--ink);border:1px solid rgba(196,162,101,.3);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:92vw;text-align:center;animation:tin .25s ease-out}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
.flying{position:fixed;z-index:12;pointer-events:none;transition:transform .32s cubic-bezier(.3,.8,.3,1);will-change:transform}
/* Tamaños */
@media (max-height:740px){:root{--cw:84px;--ch:126px;--tw:58px;--th:87px}.rival{padding-top:6px}.backs{height:52px}.backs .card{width:34px;height:51px}}
@media (max-height:640px){:root{--cw:74px;--ch:111px;--tw:50px;--th:75px}.felt{padding:8px}.score{padding:6px 8px;gap:5px}}
@media (max-width:370px){.score .nm{display:none}.bazas{gap:6px}}
@media (min-width:700px) and (min-height:700px){:root{--cw:112px;--ch:168px;--tw:84px;--th:126px}.felt{flex-direction:row;gap:40px;width:min(860px,calc(100% - 28px));margin-left:auto;margin-right:auto}.bazas{gap:18px}
  .rival{width:min(860px,calc(100% - 28px));margin:0 auto;padding-left:4px;padding-right:4px}.say.r{left:calc(50% - min(430px,50% - 14px) + 56px)}}
/* Celular acostado: la mano y los botones al costado */
@media (orientation:landscape) and (max-height:520px){
  :root{--cw:62px;--ch:93px;--tw:46px;--th:69px}
  .table{display:grid;grid-template-columns:1fr minmax(250px,36%);grid-template-rows:auto 1fr;}
  .rival{grid-column:1;grid-row:1;padding-top:4px;padding-bottom:2px}
  .felt{grid-column:1;grid-row:2;margin-bottom:6px;gap:12px;flex-direction:row}
  .me{grid-column:2;grid-row:1/3;justify-content:center;padding-top:6px}
  .backs{height:44px}.backs .card{width:28px;height:42px}
  .av{width:34px;height:34px;font-size:18px}
  .say.r{top:44px}
  .acts{min-height:40px}.act{min-height:40px;min-width:70px;font-size:14px}
  .hand{height:calc(var(--ch) + 8px)}}
@media (prefers-reduced-motion:reduce){.sheet,.side-panel,.toast,.say,.hand.deal .card,.backs.deal .card{animation:none}.flying{transition:none}}
</style>
<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',truco:'TrucAR'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
function premio(de,xp){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  const p={de,trigo:0,pesos:Math.min(1000,Math.round(n*2)),t:Date.now()};
  const L=ls.json('estancia-premios',[]);L.push(p);ls.set('estancia-premios',JSON.stringify(L.slice(-40)));
  return {...p,leguas:pampaAct(de==='PoblAR'?'p':de==='TrucAR'?'t':'b')};
}
// La Gran Pampa: lo que jugás cada día da leguas para el mapa (las cobra el mapa al abrirse; la planilla pone los topes).
// Por día: BloqueAR 1 por partida (hasta 4), PoblAR y TrucAR 2 por partida (hasta 2) y EstanciAR 1 por cosecha (hasta 4).
const PAMPA_ACT={b:{tope:4,v:1},p:{tope:2,v:2},e:{tope:4,v:1},t:{tope:2,v:2}};
function pampaAct(q){
  const A=PAMPA_ACT[q];if(!A)return 0;
  const d=new Date(),dia=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,X=ls.json('pampa-act',{}),o=X.d===dia?X:{d:dia,b:0,p:0,e:0,t:0};
  o[q]=(o[q]||0)+1;ls.set('pampa-act',JSON.stringify(o));
  const a=ls.json('bloques-acct-v1',null);
  return o[q]<=A.tope&&a&&a.usuario?A.v:0;
}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){return {r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  const r=ls.json(RKEY,{});if(d.r&&(d.r.at||0)>(r.at||0)){ls.set(RKEY,JSON.stringify(d.r));ch=true;}
  const x=ls.json(XKEY,{});if(d.x){const o={...x};for(const [k,v] of Object.entries(d.x))if(k!=='at'&&Number.isFinite(v)&&v>(o[k]||0)){o[k]=v;ch=true;}if(ch){o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}}
  return ch;
}
function badge(v,small){const i=info(v);return `<span class="rk-badge${small?' sm':''}" style="--rk:${i.t.c}" title="${i.label}${i.next!=null?` · ${i.pr}/${DIV} PR`:''}"><i>${i.t.e}</i>${i.short}</span>`;}
const CSS=`.rk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent);background:color-mix(in srgb,var(--rk) 16%,#0c131e);color:var(--rk);font:800 11.5px/1.3 system-ui,-apple-system,sans-serif;white-space:nowrap;vertical-align:middle}
.rk-badge i{font-style:normal;font-size:12px}.rk-badge.sm{font-size:10.5px;padding:1px 7px 1px 4px}
.rk-res{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-weight:800}
.rk-res .rk-d{font-size:15px}.rk-res .rk-d.up{color:#57d49b}.rk-res .rk-d.down{color:#ff8a6b}
.rk-bar{height:6px;border-radius:3px;background:#283345;overflow:hidden;margin-top:4px}.rk-bar i{display:block;height:100%;background:var(--rk,#7ce9e5)}`;
function css(){if(document.getElementById('rk-css'))return;const s=document.createElement('style');s.id='rk-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
function resultHtml(r){if(!r)return '';const sign=r.delta>0?'+':'';return `<div class="rk-res">${badge(r.after.v)}<span class="rk-d ${r.delta>=0?'up':'down'}">${sign}${r.delta} PR</span>${r.up?'<span>¡Subiste!</span>':r.down?'<span>Bajaste</span>':''}</div>`;}
window.RANGOS={TIERS,GAMES,info,get,generalFrom,isRanked,setRanked,apply,soloTarget,xp,addXp,general,exportData,importData,badge,resultHtml,css,levelInfo,premio,pampaAct,PAMPA_ACT,DIV};
})();

</script>
<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no suena ni aparece nada: sólo sube el numerito del botón 💬. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},
  timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte).slice(-3000);}
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
function unreadFrom(n){const r=S.read[lc(n)]||0;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2500:5000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()}};
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    if(j.t>S.last)await fetchNew();
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(){
  const j=await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id))continue;S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>(r[lc(m.de)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===lc(m.de)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  if(!S.key||!cs)return;
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||m.tmp)continue;const o=await unseal(other(m),m.cont).catch(()=>null);S.plain[m.id]=o;}
}

/* ── Avisos ── */
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'🔒 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;
  if(ST.m==='dnd'){S.pending.length=0;return;}
  const list=S.pending.splice(0),names=[...new Set(list.map(m=>m.de))];
  if(list.some(m=>m.tipo==='zumbido'))beep('zumbido');else beep('msg');
  if(list.length===1){toast(list[0].de,preview(list[0]));return;}
  toast(names.length===1?names[0]:names.slice(0,3).join(', '),`Te ${list.length===1?'escribió':'escribieron'}: ${list.length} mensajes nuevos.`,names.length===1?names[0]:null);
}
function shake(){const el=S.open?$('.cx-panel'):document.body;if(!el)return;el.classList.remove('cx-shake');void el.offsetWidth;el.classList.add('cx-shake');setTimeout(()=>el.classList.remove('cx-shake'),800);}
let baseTitle=document.title,titleTimer=0;
function flashTitle(){if(titleTimer)return;baseTitle=document.title.replace(/^\(\d+\) /,'');let on=false;titleTimer=setInterval(()=>{const n=unreadTotal();if(!document.hidden||!n){clearInterval(titleTimer);titleTimer=0;document.title=baseTitle;return;}on=!on;document.title=on?`(${n}) 💬 Mensaje nuevo`:baseTitle;},1200);}
function sysNotify(m){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const u=userOf(m.de),n=new Notification(`${u?u.avatar+' ':''}${m.de}`,{body:preview(m),tag:'bloques-chat-'+lc(m.de),silent:false});
    n.onclick=()=>{window.focus();open(m.de);n.close();};}catch(_){}
}
function toast(who,txt,openWho=who){
  const box=$('.cx-toasts');if(!box)return;const u=userOf(who);
  const el=document.createElement('button');el.type='button';el.className='cx-toast';
  el.innerHTML=`${u?avatar(u):'<span class="cx-av">💬</span>'}<span><b>${esc(who)}</b><small>${esc(txt).slice(0,140)}</small></span>`;
  el.onclick=()=>{el.remove();open(openWho||undefined);};
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},6500);
}
function badges(){
  const n=unreadTotal();
  document.querySelectorAll('[data-chat-btn]').forEach(b=>{let s=b.querySelector('.cx-badge');if(!n){if(s)s.remove();return;}if(!s){s=document.createElement('span');s.className='cx-badge';b.appendChild(s);}s.textContent=n>9?'9+':String(n);});
  if(!document.hidden)document.title=baseTitle;
}

const avatar=(u,big)=>`<span class="cx-av${big?' big':''}" style="--avc:${/^#[0-9a-fA-F]{6}$/.test(u&&u.color||'')?u.color:'#7ce9e5'}">${esc(u&&u.avatar||'🙂')}</span>`;
const hora=t=>{const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});if(d.toDateString()===n.toDateString())return hm;const y=new Date(n-864e5);if(d.toDateString()===y.toDateString())return 'ayer '+hm;return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});};

function ensureDom(){
  if($('#cx-root'))return;
  const r=document.createElement('div');r.id='cx-root';
  r.innerHTML=`<div class="cx-scrim" hidden></div><aside class="cx-panel" hidden role="dialog" aria-modal="true" aria-label="Chat"></aside><div class="cx-toasts" aria-live="polite"></div>`;
  document.body.appendChild(r);
  $('.cx-scrim').onclick=close;
  const p=$('.cx-panel');
  p.addEventListener('click',onClick);
  p.addEventListener('focusout',e=>{if(e.target.id==='cx-frase')saveFrase(e.target.value);});
  p.addEventListener('input',e=>{if(e.target.id==='cx-in'){S.typedAt=Date.now();autoGrow(e.target);}});
  p.addEventListener('keydown',e=>{
    if(e.target.id==='cx-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
    if(e.target.id==='cx-pin'&&e.key==='Enter'){e.preventDefault();activate();}

}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function convList(){
  const me=lc(S.me),by={};
  for(const m of S.msgs){const o=lc(other(m));if(!by[o]||m.t>by[o].t)by[o]=m;}
  const users=S.users.filter(u=>lc(u.usuario)!==me);
  for(const k of Object.keys(by))if(!users.some(u=>lc(u.usuario)===k)){const m=by[k];users.push({usuario:other(m),avatar:'🙂',color:'#93a1b6',enLinea:false});}
  return users.map(u=>({u,m:by[lc(u.usuario)]||null})).sort((a,b)=>((b.m?b.m.t:0)-(a.m?a.m.t:0))||((b.u.enLinea?1:0)-(a.u.enLinea?1:0))||a.u.usuario.localeCompare(b.u.usuario));
}

function markRead(n){const t=lastFrom(n);if(t>(S.read[lc(n)]||0)){S.read[lc(n)]=t;saveRead();badges();}}
async function onClick(e){
  const b=e.target.closest('[data-a],[data-con]');if(!b)return;
  if(b.dataset.con&&!b.dataset.a){S.con=b.dataset.con;S.view='conv';S.pickFor=null;S.invFor=null;S.err='';render();poll();return;}
  const a=b.dataset.a;
  if(a==='cerrar')close();
  else if(a==='volver'){if(S.view==='perfil'&&S.con){S.view='conv';}else{S.view='list';S.con=null;}S.pickFor=null;S.invFor=null;S.card=null;render();}
  else if(a==='modo'){ST.m=b.dataset.m;ls.set('bloques-chat-modo',ST.m);modeBtns();poll();}
  else if(a==='perfil')openProfile(b.dataset.u);
  else if(a==='invitar'){S.invFor=b.dataset.u;$('.cx-panel').dataset.sig='';render();}
  else if(a==='invx'){S.invFor=null;$('.cx-panel').dataset.sig='';render();}
  else if(a==='inv'){const who=S.invFor,g=b.dataset.g;S.invFor=null;close();try{H.invite&&H.invite(g,who);}catch(_){}}
  else if(a==='sharecon')shareTo(b.dataset.u);
  else if(a==='cardplay'){const o=S.plain[b.dataset.id];if(o&&o.card&&H.play){close();try{H.play(o.card);}catch(_){}}}
  else if(a==='cuenta'){close();H.account();}
  else if(a==='activar')activate();
  else if(a==='reset')activate(true);
  else if(a==='enviar')send();
  else if(a==='zumbido')buzz();
  else if(a==='permiso'){try{await Notification.requestPermission();}catch(_){}render();}
  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);
}
// Abre (o crea) la llave del chat con el PIN. Se llama sola al entrar a la cuenta, así a cualquiera
// le pueden escribir aunque nunca haya abierto el chat.
async function ensureKey(pin,reset=false){
  if(!cs||!acct())return false;
  loadLocal();if(S.key&&!reset)return true;
  const j=await call(auth({accion:'llave'}));
  let local;
  if(j.llave&&!reset){local=await openRemote(JSON.parse(j.llave),pin);}
  else{const k=await newKeyPair(pin);await call(auth({accion:'llave',pin,llave:JSON.stringify(k.remote),reemplazar:reset||undefined}));local=k.local;}
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(reset=false){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  const err=t=>{S.err=t;const el=$('#cx-err');if(el)el.textContent=t;};
  if(!/^\d{4,6}$/.test(pin)){err('El PIN tiene de 4 a 6 números.');return;}
  err('Abriendo…');
  try{
    try{await ensureKey(pin,reset);}catch(e){if(e&&e.name==='OperationError'){err('PIN incorrecto.');const b=$('#cx-reset');if(b)b.hidden=false;return;}throw e;}
    S.err='';$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();poll();
  }catch(e){err(String(e.message||e).replace('Acción desconocida.','Para usar el chat hay que actualizar la planilla a la versión 5.'));}
}
async function send(){
  const ta=$('#cx-in');if(!ta||!S.con)return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const tmp={id:'tmp'+Date.now(),de:S.me,para:S.con,tipo:'msg',cont:'',ref:'',t:Date.now(),tmp:true};S.plain[tmp.id]={x:txt};S.msgs.push(tmp);render();
  try{
    const cont=await seal(S.con,{x:txt});const j=await call(auth({accion:'enviar',para:S.con,tipo:'msg',cont}));
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    const m={id:j.id,de:S.me,para:S.con,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:txt};saveMsgs();S.err='';
  }catch(e){const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);S.err=String(e.message||e);ta.value=txt;}
  render();
}
async function shareTo(name){
  const c=S.card;if(!c)return;const note=String(($('#cx-snote')||{}).value||'').trim().slice(0,200);
  try{const cont=await seal(name,{x:note,card:c});const j=await call(auth({accion:'enviar',para:name,tipo:'msg',cont}));
    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();
    S.card=null;S.con=name;S.view='conv';S.err='';$('.cx-panel').dataset.sig='';render();}
  catch(e){S.err=String(e.message||e);const el=$('.cx-panel');if(el){el.dataset.sig='';}render();}
}
function share(card){ensureDom();S.card=card;S.view='share';S.open=true;$('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;$('.cx-panel').dataset.sig='';try{H.onOpen();}catch(_){}render();loadUsers().then(()=>{if(S.view==='share')render();});}
async function buzz(){
  if(!S.con)return;if(Date.now()-S.zbAt<8000){S.err='Esperá un poquito para mandar otro zumbido.';render();return;}
  S.zbAt=Date.now();shake();beep('zumbido');
  try{const j=await call(auth({accion:'enviar',para:S.con,tipo:'zumbido'}));S.msgs.push({id:j.id,de:S.me,para:S.con,tipo:'zumbido',cont:'',ref:'',t:j.t});saveMsgs();S.err='';}
  catch(e){S.err=String(e.message||e);}
  render();
}
async function react(id,e){
  S.pickFor=null;const m=S.msgs.find(x=>x.id===id);if(!m)return;
  const mine=S.msgs.filter(x=>x.tipo==='reac'&&x.ref===id&&lc(x.de)===lc(S.me)).pop(),cur=mine&&S.plain[mine.id]&&S.plain[mine.id].e;
  const val=cur===e?'':e;
  try{const cont=await seal(S.con,{e:val});const j=await call(auth({accion:'enviar',para:S.con,tipo:'reac',cont,ref:id}));
    const r={id:j.id,de:S.me,para:S.con,tipo:'reac',cont,ref:id,t:j.t};S.msgs.push(r);S.plain[r.id]={e:val};saveMsgs();S.err='';}
  catch(err){S.err=String(err.message||err);}
  render();
}
function open(name){
  ensureDom();S.open=true;S.err=S.unsupported?S.err:'';
  if(name){S.con=name;S.view='conv';}else if(S.view!=='conv')S.view='list';
  $('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;document.documentElement.classList.add('cx-on');
  try{H.onOpen();}catch(_){}
  render();loadUsers().then(render);poll();
}
function close(){
  S.open=false;S.pickFor=null;const p=$('.cx-panel');if(p){p.hidden=true;$('.cx-scrim').hidden=true;}document.documentElement.classList.remove('cx-on');
  try{H.onClose();}catch(_){}schedule();
}

function bindButtons(){document.querySelectorAll('[data-chat-btn]').forEach(b=>{if(!b.dataset.cxOn){b.dataset.cxOn='1';b.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();S.open?close():open();});}});badges();}
function init(opts={}){
  Object.assign(H,opts);injectCss();ensureDom();loadLocal();
  bindButtons();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden){ST.lastInput=Date.now();document.title=baseTitle;poll();}});
  for(const ev of ['pointerdown','keydown'])document.addEventListener(ev,()=>{ST.lastInput=Date.now();},{passive:true,capture:true});
  ST.frase=ls.get('bloques-chat-frase');
  window.addEventListener('storage',e=>{if(e.key==='bloques-acct-v1'||e.key===kKey){loadLocal();render();badges();}});
  badges();
  if(acct())setTimeout(poll,1200);
}
window.CHAT={share,ensureKey:(pin)=>ensureKey(pin).then(()=>{decryptAll().then(()=>{render();badges();});poll();return true;}).catch(()=>false),init,open,close,get unread(){return unreadTotal();},get state(){return S;},poll,bindButtons};
})();

<script>

function anotar(M,t){M.log.push(t);if(M.log.length>200)M.log.splice(0,M.log.length-200);}

/* ───── La compu ─────

function pluck(f,t0=0,d=.5,v=.06){const a=actx(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator(),o2=a.createOscillator(),lp=a.createBiquadFilter();
  o.type='triangle';o2.type='sine';o.frequency.value=f;o2.frequency.value=f*2.003;lp.type='lowpass';lp.frequency.setValueAtTime(f*7,t);lp.frequency.exponentialRampToValueAtTime(f*1.6,t+d);
  const g2=a.createGain();g2.gain.value=.35;o.connect(lp);o2.connect(g2).connect(lp);lp.connect(g).connect(a.destination);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.004);g.gain.exponentialRampToValueAtTime(.0004,t+d);
  o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}
function slap(t0=0,v=.5){const a=actx(),t=a.currentTime+t0,n=Math.floor(a.sampleRate*.07),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=1800;bp.Q.value=.8;g.gain.value=.22*v;
  s.connect(bp).connect(g).connect(a.destination);s.start(t);
  const o=a.createOscillator(),g3=a.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(70,t+.08);g3.gain.setValueAtTime(.08*v,t);g3.gain.exponentialRampToValueAtTime(.0005,t+.1);o.connect(g3).connect(a.destination);o.start(t);o.stop(t+.12);}
const SX={carta(){slap();},canto(){pluck(196,0,.4,.07);pluck(294,.08,.45,.06);pluck(392,.16,.5,.05);},quiero(){pluck(262,0,.35,.06);pluck(392,.09,.45,.06);},
  noquiero(){pluck(247,0,.35,.06);pluck(185,.11,.5,.05);},baza(){pluck(587,0,.2,.03);},repartir(){for(let i=0;i<6;i++)slap(i*.06,.35);},
  gano(){[392,494,587,784].forEach((f,i)=>pluck(f,i*.09,.6,.05));},pierdo(){[330,262,196].forEach((f,i)=>pluck(f,i*.14,.6,.05));},tap(){pluck(660,0,.08,.02);}};

// Tanteador: grupos de 5 fósforos (cuadradito y diagonal). A 30: malas y buenas.
function fosforos(n,meta){const w=15,gap=4,grupos=meta/5,sep=meta===30?9:0;let x=0,out='';
  for(let g=0;g<grupos;g++){if(meta===30&&g===3)x+=sep;const k=Math.max(0,Math.min(5,n-g*5)),a=x+2,b=x+w-1,t=2,u=w-1;
    const L=[[a,t,b,t],[b,t,b,u],[b,u,a,u],[a,u,a,t],[a,t,b,u]];
    out+=`<rect x="${a}" y="${t}" width="${b-a}" height="${u-t}" fill="none" stroke="rgba(214,196,150,.13)"/>`;
    for(let i=0;i<k;i++){const [x1,y1,x2,y2]=L[i];out+=`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#eadab3" stroke-width="2" stroke-linecap="round"/><circle cx="${x2}" cy="${y2}" r="1.8" fill="#b9432d"/>`;}
    x+=w+gap;}
  const mid=meta===30?3*(w+gap)+sep/2-gap/2:0;
  return `<svg width="${x-gap}" height="${w+1}" viewBox="0 0 ${x-gap} ${w+1}" aria-hidden="true">${meta===30?`<path d="M${mid} 0V${w+1}" stroke="rgba(214,196,150,.4)" stroke-dasharray="2 2"/>`:''}${out}</svg>`;}
function rivalInfo(){
  if(MODO==='compu')return {av:'🧉',col:'#8a6a3e',sub:`Nivel ${(DIFN[CFG.dif]||'Normal').toLowerCase()}`};
  const p=ON&&ON.peer||{};return {av:p.avatar||'🙂',col:p.color||'#7ce9e5',sub:ON&&ON.state==='on'?'En línea':'Se cortó'};}
let REPARTO=null;// para animar el reparto una sola vez por mano

    <div class="meta">${E.meta===30?'a 30 · malas y buenas':'a 15'}</div>`;}
function renderBazas(){let h='';
  for(let b=0;b<3;b++){const w=E.bazas[b],mine=E.jugadas[0][b],his=E.jugadas[1][b];
    const cls=who=>w===undefined?'':w==='p'?'lose':w===who?'win':'lose';

  $('bazas').innerHTML=h;}
const TXT_TRUCO=n=>['','Truco','Retruco','Vale cuatro'][n];
function puedo(t,k){return E&&E.acciones.some(a=>a.t===t&&(k===undefined||a.k===k));}
function renderMe(nueva=false){
  const st=$('status'),acts=$('acts'),hand=$('hand');
  const miTurno=E.turno===0&&!E.pend&&!E.finMano&&!E.fin,espero=!E.finMano&&!E.fin&&E.acciones.length===0;

      b+=`<button class="act ghost" data-a="mazo">Al mazo</button>`;}}
  acts.innerHTML=b;
  // Mano
  hand.className='hand'+(miTurno&&!PEND_GUEST?' play':'')+(E.mias.length===2?' two':'')+(nueva&&E.mias.length===3&&!FAST?' deal':'');
  hand.innerHTML=E.mias.map(c=>cartaHtml(c)).join('');
  if(miTurno&&!PEND_GUEST)hand.querySelectorAll('.card').forEach(el=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Tirar '+nombreCarta(el.dataset.c).replace(/^el /,''));});
  if(E.mias.length===0&&!E.finMano)hand.innerHTML='';
}
const ENVN={E:'Envido',R:'Real envido',F:'Falta envido'};
function TXT_ENV(canto){if(!canto.length)return 'envido';const c=canto.map(k=>ENVN[k].toLowerCase());if(canto.length===2&&canto[0]==='E'&&canto[1]==='E')return 'envido envido';return c[c.length-1];}
// Globos: lo que dijo cada uno
let DICHO_T=[0,0];
function dicho(q,txt,o={}){DICHO[q]={txt,sub:o.sub||'',hot:!!o.hot,keep:!!o.keep};clearTimeout(DICHO_T[q]);
  if(!o.keep)DICHO_T[q]=setTimeout(()=>{DICHO[q]=null;renderDichos();},FAST?0:(o.ms||2300));renderDichos();}

// Una carta que vuela de la mano a la mesa
function origenCarta(q,c){const el=q===0?document.querySelector(`#hand .card[data-c="${c}"]`):document.querySelector('#rival .backs .card:last-child')||document.querySelector('#rival .av');return el?el.getBoundingClientRect():null;}
function volar(q,c,desde){if(!desde||RM||FAST)return;const el=document.querySelector(`#bazas .card[data-c="${c}"]`);if(!el)return;
  const to=el.getBoundingClientRect();if(!to.width)return;const dx=desde.left+desde.width/2-(to.left+to.width/2),dy=desde.top+desde.height/2-(to.top+to.height/2),sc=desde.width/to.width;
  el.style.transition='none';el.style.transform=`translate(${dx}px,${dy}px) scale(${sc}) rotate(${q?9:-7}deg)`;el.getBoundingClientRect();
  el.style.transition='transform .3s cubic-bezier(.3,.8,.3,1)';el.style.transform='';}

/* ───────── Cantos y avisos de lo que pasó ───────── */
async function anunciar(q,a,Ea,En){
  const otro=1-q;
  if(a.t==='carta'){DICHO[q]=null;return;}// la carta vuela en «aplicar»
  if(a.t==='truco'){const n=En.pend?En.pend.nivel:(Ea.pend?Ea.pend.nivel+1:1);const sube=Ea.pend&&Ea.pend.k==='truco';
    DICHO[otro]=null;dicho(q,sube?`¡Quiero ${TXT_TRUCO(n).toLowerCase()}!`:`¡${TXT_TRUCO(n)}!`,{hot:true,keep:true});sfx('canto');return;}
  if(a.t==='env'){DICHO[otro]=null;const primero=Ea.pend&&Ea.pend.k==='truco';
    dicho(q,primero?'¡El envido está primero!':`¡${ENVN[a.k]}!`,{hot:true,keep:true,sub:primero?ENVN[a.k]:(En.envCanto.length>1?En.envCanto.map(k=>ENVN[k]).join(' · '):'')});sfx('canto');return;}
  if(a.t==='mazo'){DICHO[otro]=null;dicho(q,'Me voy al mazo');sfx('noquiero');return;}
  if(a.t==='noquiero'){DICHO[otro]=null;dicho(q,'No quiero');sfx('noquiero');
    if(Ea.pend&&Ea.pend.k==='env'&&En.env){const g=En.env.gano;await wait(900);toast(`${g===0?'Sumás':esc(En.nombres[1])+' suma'} ${En.env.pts} por el envido`);}
    return;}
  if(a.t==='quiero'){DICHO[otro]=null;dicho(q,'¡Quiero!');sfx('quiero');
    if(Ea.pend&&Ea.pend.k==='env'&&En.env&&En.env.quiso){
      // Los tantos: primero el mano, después el pie («son mejores» o «son buenas»)
      const mano=En.mano,pie=1-mano,pts=w=>w===0?En.env.mio:En.env.suyo;
      await wait(850);dicho(mano,`Tengo ${pts(mano)}`,{ms:2600});
      await wait(1000);const ganaPie=En.env.gano===pie;dicho(pie,ganaPie?`${pts(pie)} son mejores`:'Son buenas',{ms:2600});
      await wait(700);toast(`${En.env.gano===0?'Ganaste':esc(En.nombres[1])+' gana'} el envido: ${En.env.pts} ${En.env.pts===1?'punto':'puntos'}`);
      if(En.env.gano===0)sfx('quiero');}
    return;}
}
let toastT=0;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),FAST?10:2600);}

/* ───────── El turno ───────── */
// Aplica la acción de q (0 = yo, 1 = el rival) sobre la partida que manejo y muestra lo que pasó.
async function aplicar(q,a){
  const Ea=E,desde=a.t==='carta'?origenCarta(q,a.c):null;
  const err=jugar(M,q,a);if(err)return err;
  refrescar();guardar();
  if(MODO==='host')enviarEstado();
  render();if(a.t==='carta'){volar(q,a.c,desde);sfx('carta');if(E.bazas.length>Ea.bazas.length&&!E.finMano){await wait(250);sfx('baza');}}
  await anunciar(q,a,Ea,E);
  seguir();return null;
}
async function jugarYo(a){
  if(BUSY||!E)return;closePick();
  if(MODO==='guest'){if(!ON||ON.state!=='on'||PEND_GUEST)return;PEND_GUEST=true;renderMe();netSend({t:'accion',a,n:E.n});setTimeout(()=>{if(PEND_GUEST){PEND_GUEST=false;renderMe();}},6000);return;}
  if(!M||quienJuega(M)!==0)return;
  BUSY=true;try{const err=await aplicar(0,a);if(err)toast(esc(err));}finally{BUSY=false;}
}
function seguir(){
  if(MODO==='guest'||!M)return;
  if(M.fin){setTimeout(mostrarFin,FAST?0:900);return;}
  if(M.H.fin){setTimeout(mostrarFinMano,FAST?0:1100);return;}
  if(quienJuega(M)===1&&MODO==='compu')turnoCompu();
  if(quienJuega(M)===0&&AUTO)setTimeout(autoYo,FAST?0:300);
}
async function turnoCompu(){
  const tok=++BOTTOK,M0=M,V=vistaDe(M,1);let a;
  try{a=decidir(V,CFG.dif);}catch(e){console.warn('compu',e);a=V.acciones.find(x=>x.t==='carta')||V.acciones[0];}
  const pausa=a.t==='carta'?650+Math.random()*450:a.t==='quiero'||a.t==='noquiero'?900+Math.random()*700:750+Math.random()*450;
  await wait(pausa);
  if(tok!==BOTTOK||M!==M0||MODO!=='compu'||quienJuega(M)!==1)return;
  const err=await aplicar(1,a);
  if(err){console.warn('compu',err,a);const b=vistaDe(M,1).acciones.find(x=>x.t==='carta')||vistaDe(M,1).acciones.find(x=>x.t==='quiero');if(b)await aplicar(1,b);}
}
// Para las pruebas: la compu juega también por vos (#auto).
function autoYo(){if(!M||M.fin||M.H.fin||quienJuega(M)!==0||BUSY)return;const a=decidir(vistaDe(M,0),'normal');jugarYo(a);}

function center(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('center');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}

function lineasMano(){
  const F=E.finMano,L=[],yo=E.nombres[0],el=E.nombres[1];
  if(E.env){const g=E.env.gano,c=E.env.canto.map(k=>ENVN[k]).join(' · ');
    L.push([`${c}`,E.env.quiso?`${g===0?'Vos':esc(el)} +${E.env.pts}`+(E.env.suyo!=null?` <small>(tenías ${E.env.mio}; ${esc(el)} ${E.env.suyo})</small>`:` <small>(tenías ${E.env.mio})</small>`):`${g===0?'Vos':esc(el)} +${E.env.pts} <small>(no ${g===0?'quiso':'quisiste'})</small>`]);}
  if(F){const quien=F.gano===0?'Vos':esc(el),niv=F.nivel?TXT_TRUCO(F.nivel).toLowerCase()+' querido':'sin truco';
    const como=F.por==='ganó las bazas'?niv:F.por==='se fue al mazo'?`${F.gano===0?esc(el)+' se fue':'te fuiste'} al mazo`:/^no quiso/.test(F.por)?`no ${F.gano===0?'quiso':'quisiste'} el ${F.por.replace('no quiso el ','')}`:F.por;

function mostrarFinMano(){

/* ───────── En línea con un amigo ─────────
   Como en PoblAR: la invitación viaja por la planilla (sin códigos de sala) y la partida va directo entre los
   dos celulares (WebRTC, con servidores públicos STUN/TURN de ayuda). El que invita reparte y lleva la partida;
   al otro le manda sólo lo que puede ver: nunca sus cartas. */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];
async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

// El que fue invitado recibe lo que puede ver y lo muestra (con los cantos y la carta que vuela).
async function recibirEstado(En){
  const Ea=E;PEND_GUEST=false;MODO='guest';M=null;BOTTOK++;
  const misma=Ea&&Ea.id===En.id,nueva=misma&&Ea.n===En.n&&En.acc>Ea.acc&&En.ultimo;

  else if(Ea.n!==En.n){FIN_VISTO=null;limpiarDichos();hideCenter();sfx('repartir');}
  const u=En.ultimo,desde=nueva&&u.a.t==='carta'?origenCarta(u.p,u.a.c):null;
  E=En;render();
  if(nueva){if(u.a.t==='carta'){volar(u.p,u.a.c,desde);sfx('carta');if(En.bazas.length>Ea.bazas.length&&!En.finMano){await wait(250);sfx('baza');}}await anunciar(u.p,u.a,Ea,En);}
  if(E===En){if(E.fin)setTimeout(mostrarFin,FAST?0:900);else if(E.finMano)setTimeout(mostrarFinMano,FAST?0:1100);}

function onMsg(m){
  if(m.t==='hola'){if(m.yo)ON.peer={...ON.peer,...m.yo};renderOnline();if(E)renderRival();return;}
  if(m.t==='estado'&&ON.role==='guest'&&m.E){recibirEstado(m.E);return;}
  if(m.t==='accion'&&ON.role==='host'){
    if(!M||MODO!=='host'||quienJuega(M)!==1){enviarEstado();return;}
    (async()=>{while(BUSY)await sleep(120);BUSY=true;try{const err=await aplicar(1,m.a);if(err){netSend({t:'error',msg:err});enviarEstado();}}finally{BUSY=false;}})();return;}
  if(m.t==='listo'&&ON.role==='host'){ON.listo=m.n;intentarRepartir();return;}
  if(m.t==='otra'&&ON.role==='host'){toast(`🔁 ${esc(ON.peer.usuario)} quiere la revancha`);nuevaOnline();return;}
  if(m.t==='error'){PEND_GUEST=false;toast(esc(m.msg));if(E)renderMe();return;}
  if(m.t==='bye'){onLost('salió de la partida');}
}
function onLost(why='se desconectó'){
  if(!ON||ON.state==='lost')return;const was=ON.state==='on',peer=ON.peer.usuario;ON.state='lost';clearTimeout(ON.tRep);try{ON.pc&&ON.pc.close();}catch(_){}
  if(MODO==='host'&&M&&!M.fin&&was){ON=null;MODO='compu';CFG.dif='normal';M.nombres[1]='La compu';renderOnline();toast(`⚠️ ${esc(peer)} ${esc(why)}. Sigue la compu en su lugar.`);refrescar();render();guardar();if(M.H.fin){FIN_VISTO=null;mostrarFinMano();}else seguir();return;}
  if(MODO==='guest'&&was&&E&&!E.fin){ON=null;renderOnline();
    center(`<div class="ic">📡</div><h3>Se cortó</h3><p>${esc(peer)} ${esc(why)}. La partida la llevaba su celular, así que desde acá no se puede seguir.</p><button class="btn go" id="lc-new">Jugar con la compu</button><button class="btn" id="lc-x">Cerrar</button>`);

function netLeave(){netSend({t:'bye'});const o=ON;ON=null;try{o&&o.pc&&o.pc.close();}catch(_){}renderOnline();}
function renderOnline(){const el=$('onl');if(!ON||ON.state==='on'){el.className='onl';el.textContent='';if(E)renderRival();return;}
  el.className='onl'+(ON.state==='on'?'':' off');el.innerHTML=ON.state==='on'?`● En línea con ${esc(ON.peer.usuario)}`:`<span class="busy"></span>${esc(ON.msg||'Conectando…')}`;}
// Invitar: se prepara la conexión y se deja en el buzón del amigo.
async function inviteFriend(u){
  const a=acct();if(!a){openFriends();return;}
  if(ON)netLeave();
  ON={role:'host',peer:{usuario:u.usuario,avatar:u.avatar,color:u.color},state:'preparing',msg:'Preparando la invitación…'};renderOnline();friendsWait();
  const me0=ON;
  try{
    const pc=new RTCPeerConnection({iceServers:await iceServers()});ON.pc=pc;attach(pc.createDataChannel('truco',{ordered:true}));
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))onLost();};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(ON!==me0)return;
    const j=await lbCall({accion:'invitar',usuario:a.usuario,token:a.token,para:u.usuario,oferta:'TRUCO:'+JSON.stringify({sdp:pc.localDescription.sdp,meta:CFG.meta})});
    if(ON!==me0)return;ON.id=j.id;ON.state='waiting';ON.msg=`Esperando que ${u.usuario} acepte…`;renderOnline();friendsWait();
    const t0=Date.now();
    while(ON===me0&&ON.state==='waiting'&&Date.now()-t0<300000){
      await sleep(2000);if(ON!==me0)return;
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:ON.id});}catch(_){continue;}
      if(ON!==me0)return;
      if(r.estado==='aceptada'&&r.respuesta){ON.state='connecting';ON.msg='Conectando…';renderOnline();friendsWait();await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});
        setTimeout(()=>{if(ON===me0&&ON.state!=='on')failOnline('No se pudieron conectar. Prueben con datos móviles en uno de los dos.');},45000);return;}
      if(r.estado==='rechazada'){failOnline(`${u.usuario} dijo «ahora no».`);return;}
      if(r.estado==='vencida'||r.estado==='cancelada'){failOnline('La invitación venció.');return;}
    }
    if(ON===me0&&ON.state==='waiting')failOnline(`${u.usuario} no respondió.`);
  }catch(e){if(ON===me0)failOnline(e.message||'No se pudo preparar la conexión.');}
}
async function acceptInvite(inv){
  const a=acct();if(!a)return;UIQ.dismissed.add(inv.id);
  if(ON)netLeave();BOTTOK++;
  ON={role:'guest',peer:{usuario:inv.de,avatar:inv.avatar,color:inv.color},state:'connecting',msg:`Conectando con ${inv.de}…`,id:inv.id};renderOnline();friendsWait();
  const me0=ON;
  try{
    const off=JSON.parse(String(inv.oferta).slice(6));const pc=new RTCPeerConnection({iceServers:await iceServers()});ON.pc=pc;
    pc.ondatachannel=e=>attach(e.channel);pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))onLost();};
    await pc.setRemoteDescription({type:'offer',sdp:off.sdp});await pc.setLocalDescription(await pc.createAnswer());await gathered(pc);
    await lbCall({accion:'responder',usuario:a.usuario,token:a.token,id:inv.id,respuesta:JSON.stringify({sdp:pc.localDescription.sdp})});
    setTimeout(()=>{if(ON===me0&&ON.state!=='on')failOnline('No se pudieron conectar. Prueben con datos móviles en uno de los dos.');},45000);
  }catch(e){if(ON===me0)failOnline(e.message||'No se pudo conectar.');}
}
function failOnline(msg,show=true){
  const o=ON;if(o&&o.id&&o.role==='host'&&o.state==='waiting'){const a=acct();if(a)lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:o.id}).catch(()=>{});}
  try{o&&o.pc&&o.pc.close();}catch(_){}ON=null;renderOnline();
  if(!show){closeSheet();if(!E)openNew();return;}
  sheet('Jugar con un amigo',`<p>${esc(msg)}</p><div class="row"><button class="btn" id="fw-x">Cerrar</button><button class="btn go" id="fw-again">Probar de nuevo</button></div>`);
  $('fw-x').onclick=()=>{closeSheet();if(!E)openNew();};$('fw-again').onclick=openFriends;
}
function friendsWait(){
  if(!ON)return;sheet('Jugar con un amigo',`<div style="display:flex;align-items:center;gap:12px">${avHtml(ON.peer.avatar,ON.peer.color)}<b style="font:700 18px var(--serif)">${esc(ON.peer.usuario)}</b></div>
    <p><span class="busy"></span>${esc(ON.msg||'')}</p>${ON.role==='host'&&ON.state==='waiting'?'<p class="note">Le llega la invitación en cualquiera de los juegos. Si no tiene ninguno abierto, le aparece cuando abra uno (dura 5 minutos).</p>':''}
    <div class="row"><button class="btn" id="fw-cancel">Cancelar</button></div>`);
  $('fw-cancel').onclick=()=>failOnline('',false);
}
async function openFriends(){
  const a=acct();
  if(ON&&ON.state!=='on'){friendsWait();return;}
  if(!a){sheet('Jugar con un amigo',`<p>Para jugar en línea necesitás tu cuenta de BloqueAR (usuario y PIN, gratis). Con la cuenta elegís a tu amigo de una lista y le llega la invitación.</p><a class="btn go" href="./#cuenta" id="fr-acct">Crear cuenta o entrar</a>`);
    $('fr-acct').onclick=()=>{try{sessionStorage.setItem('blq-volver','truco.html');}catch(_){}};return;}
  const draw=()=>{const me=a.usuario.toLowerCase(),list=(UIQ.users||[]).filter(u=>u.usuario.toLowerCase()!==me).sort((x,y)=>(y.enLinea?1:0)-(x.enLinea?1:0));
    sheet('Jugar con un amigo',`<p class="note">Elegí a quién invitar. El punto verde es que tiene alguno de los juegos abierto. Se juega ${CFG.meta===15?'a 15':'a 30'} (lo cambiás en Partida nueva).</p>
      ${UIQ.err?`<p>${esc(UIQ.err)}</p>`:''}${UIQ.users?`<ul class="ulist">${list.map(u=>`<li>${avHtml(u.avatar,u.color)}<span class="nm">${esc(u.usuario)}${u.enLinea?'<i class="dot"></i>':''}</span><button data-u="${esc(u.usuario)}">Invitar</button></li>`).join('')||'<li>Todavía no hay otras cuentas.</li>'}</ul>`:(UIQ.err?'':'<p><span class="busy"></span>Cargando…</p>')}`);
    document.querySelectorAll('.ulist button[data-u]').forEach(b=>b.onclick=()=>{const u=list.find(x=>x.usuario===b.dataset.u);if(u)inviteFriend(u);});};
  draw();
  try{const j=await lbCall({accion:'usuarios'},false);if(!Array.isArray(j.usuarios))throw new Error('Hay que actualizar el código de la planilla.');UIQ.users=j.usuarios;UIQ.err='';}catch(e){UIQ.err=e.message;}
  if(!ON&&!$('modal').hidden&&/Elegí a quién invitar/.test($('sheet').textContent))draw();
}
// Buzón: te avisa si alguien te invita (a TrucAR o a otro juego).
let pollAt=0,polling=false;
async function pollInbox(force=false){
  const a=acct();if(!a||polling||document.hidden||ON||AUTO)return;
  const gap=E&&!E.fin&&E.turno===0?20000:12000;if(!force&&Date.now()-pollAt<gap)return;
  polling=true;pollAt=Date.now();
  try{const j=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token});const inv=j.invitacion;
    if(inv&&!UIQ.dismissed.has(inv.id)&&!ON){
      const tru=String(inv.oferta||'').startsWith('TRUCO:');
      let want='';try{want=sessionStorage.getItem('truco-accept')||'';}catch(_){}
      if(tru&&want===inv.id){try{sessionStorage.removeItem('truco-accept');}catch(_){}acceptInvite(inv);}
      else showInvite(inv);}}catch(_){}
  polling=false;
}
function showInvite(inv){
  UIQ.dismissed.add(inv.id);const of=String(inv.oferta||''),tru=of.startsWith('TRUCO:'),pob=of.startsWith('POBLAR:'),juego=tru?'<b>TrucAR</b> 🃏':pob?'<b>PoblAR</b> 🏘️':'<b>BloqueAR</b> 🧱';
  sheet('Te invitan',`<div style="display:flex;align-items:center;gap:12px">${avHtml(inv.avatar,inv.color)}<div><b style="font:700 18px var(--serif)">${esc(inv.de)}</b><div class="note">te invita a jugar ${juego}</div></div></div>
    ${tru&&E&&!E.fin&&MODO==='compu'?'<p class="note">Tu partida contra la compu queda guardada.</p>':''}<div class="row"><button class="btn" id="iv-no">Ahora no</button><button class="btn go" id="iv-yes">Aceptar</button></div>`);
  $('iv-no').onclick=()=>{closeSheet();const a=acct();if(a)lbCall({accion:'rechazar',usuario:a.usuario,token:a.token,id:inv.id}).catch(()=>{});};
  $('iv-yes').onclick=()=>{closeSheet();if(tru)acceptInvite(inv);else if(pob){try{sessionStorage.setItem('poblar-accept',inv.id);}catch(_){}location.href='poblar.html';}else{try{sessionStorage.setItem('blq-accept',inv.id);}catch(_){}location.href='./';}};
}
window.addEventListener('pagehide',()=>{if(ON&&ON.state==='on')netSend({t:'bye'});});

function mesaVacia(){$('rival').innerHTML='';$('score').innerHTML='';$('bazas').innerHTML=Array.from({length:3},()=>'<div class="baza"><div class="slot"></div><div class="slot"></div></div>').join('');
  $('status').innerHTML='';$('acts').innerHTML='';$('hand').innerHTML='';}
(function start(){
  defsNaipes();
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;const d=(location.hash.match(/dif=(\w+)/)||[])[1];if(d&&DIFN[d])CFG.dif=d;
    const mt=(location.hash.match(/meta=(\d+)/)||[])[1];if(mt)CFG.meta=Number(mt)===15?15:30;nuevaCompu(Number((location.hash.match(/semilla=(\d+)/)||[])[1])||undefined);return;}
  ls.set('bloques-ultimo-juego','truco');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  const saved=ls.json(SAVE,null);
  if(saved&&saved.M&&saved.M.v===1&&saved.M.H&&!saved.M.fin){M=saved.M;CFG={...CFG,...(saved.cfg||{})};MODO='compu';refrescar();render();if(M.H.fin)mostrarFinMano();else seguir();}
  else{mesaVacia();if(!/^#(invitar|amigos)/.test(hash)){if(!ls.get('truco-ayuda')){ls.set('truco-ayuda','1');openHelp();$('h-ok').onclick=()=>{closeSheet();openNew();};}else openNew();}}
  if(/^#amigos/.test(hash))setTimeout(openFriends,200);
  {const m=/^#invitar=([^&]+)/.exec(hash);if(m&&acct()){let u='';try{u=decodeURIComponent(m[1]);}catch(_){u=m[1];}setTimeout(()=>inviteFriend((UIQ.users||[]).find(y=>y.usuario===u)||{usuario:u,avatar:'🙂',color:'#7ce9e5'}),400);}}
  if(window.RANGOS)RANGOS.css();
  if(window.CHAT)CHAT.init({busy:()=>!!(E&&!E.fin&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'truco',
    invite:(g,u)=>{if(g==='truco'){inviteFriend((UIQ.users||[]).find(y=>y.usuario.toLowerCase()===String(u).toLowerCase())||{usuario:u,avatar:'🙂',color:'#7ce9e5'});return;}
      if(g==='estancia'){location.href='estancia.html#malon';return;}location.href=(g==='poblar'?'poblar.html':'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='truco')openNew();else location.href=c.j==='poblar'?'poblar.html':c.j==='estancia'?'estancia.html#malon':c.j==='pampa'?'pampa.html':'./';}});
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);});setTimeout(()=>pollInbox(true),1500);
})();
window.TRUCO={get M(){return M;},get E(){return E;},get MODO(){return MODO;},get ON(){return ON;},get CFG(){return CFG;},jugarYo,nuevaCompu,openNew,openHelp,openFriends,inviteFriend,acceptInvite,onMsg,recibirEstado,enviarEstado,
  decidir,vistaDe,estadoPara,quienJuega,acciones,repartir,jugar,seguir,mostrarFinMano,mostrarFin,siguienteMano,render,pollInbox,
  set FAST(v){FAST=v;},set AUTO(v){AUTO=v;},get BUSY(){return BUSY;}};
