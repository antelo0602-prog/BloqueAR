function lunesAR(t=Date.now()){const d=new Date(t-3*3600e3),dow=d.getUTCDay(),m=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-((dow+6)%7)*864e5);return m.toISOString().slice(0,10);}
function load(){const o=ls.json(KEY,{});o.g=o.g||{};o.c=o.c||{};o.ap=o.ap||{};o.k=Array.isArray(o.k)?o.k:[];
  const w=lunesAR();if(!o.s||o.s.w!==w)o.s={w,c:{},h:{}};o.s.c=o.s.c||{};o.s.h=o.s.h||{};return o;}
function save(o){o.at=Date.now();ls.set(KEY,JSON.stringify(o));}
const cnt=(o,j)=>(o.c[j]=o.c[j]||{});
const tiene=(o,j,id)=>!!(o.g[j]&&o.g[j][id]);

/* ── Retos de la semana: los mismos para todos ── */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=seed>>>0||1;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
function retosDe(j,w){const L=(D[j]&&D[j].retos)||[];if(!L.length)return [];const R=rng(hash(w+':'+j)),pool=L.slice(),out=[];
  while(out.length<3&&pool.length){const r=pool.splice(Math.floor(R()*pool.length),1)[0];const n=r.v[Math.floor(R()*r.v.length)];out.push({id:r.id+n,k:r.k,n,txt:r.t(n),xp:r.xp+(n===r.v[r.v.length-1]&&r.v.length>1?10:0)});}
  return out;}
function retos(j){const o=load(),c=o.s.c[j]||{},h=o.s.h[j]||[];return retosDe(j,o.s.w).map(r=>({...r,va:Math.min(r.n,c[r.k]||0),hecho:h.includes(r.id)}));}

/* ── Contar ── */
function revisar(o,j){
  const nuevos=[],cumplidos=[],Gd=D[j];if(!Gd)return {nuevos,cumplidos};
  // retos (antes que los logros: completar los 3 cuenta para «Semana redonda»)
  const sc=o.s.c[j]||{},sh=(o.s.h[j]=o.s.h[j]||[]),rs=retosDe(j,o.s.w);
  for(const r of rs)if(!sh.includes(r.id)&&(sc[r.k]||0)>=r.n){sh.push(r.id);cumplidos.push(r);premiar(j,r);}
  if(cumplidos.length&&rs.length&&rs.every(r=>sh.includes(r.id))){const c=cnt(o,j);c.semanas=(c.semanas||0)+1;
    try{if(window.RANGOS&&RANGOS.pampaAct)RANGOS.pampaAct('r',1);}catch(_){}}   // v70: los 3 retos de la semana de un juego dan 1 legua para La Gran Pampa
  const c=cnt(o,j);o.g[j]=o.g[j]||{};
  for(const L of Gd.logros)if(!o.g[j][L.id]&&(c[L.k]||0)>=(L.m||1)){o.g[j][L.id]=Date.now();nuevos.push(L);}
  return {nuevos,cumplidos};
}
function premiar(j,r){const R=window.RANGOS;if(!R)return;
  try{if(j!=='estancia'&&j!=='pampa'&&(R.GAMES[j]||(R.SOLOS&&R.SOLOS[j])))R.addXp(j,r.xp);}catch(_){}
  try{R.premio(`${D[j].n} (reto)`,r.xp,false);}catch(_){}}
function visto(o,key){if(!key)return false;if(o.k.includes(key))return true;o.k.push(key);if(o.k.length>300)o.k.splice(0,o.k.length-300);return false;}
function sumar(o,j,k,n){const c=cnt(o,j);c[k]=(c[k]||0)+n;const s=(o.s.c[j]=o.s.c[j]||{});s[k]=(s[k]||0)+n;}
function evento(j,k,n=1,key,quiet){
  if(!D[j]||!k||!(n>0))return [];const o=load();if(visto(o,key&&(j+':'+key+':'+k))){save(o);return [];}
  sumar(o,j,k,n);const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
function marca(j,k,v,key,quiet){
  if(!D[j]||!k||!Number.isFinite(v))return [];const o=load();if(visto(o,key&&(j+':'+key+':m:'+k))){save(o);return [];}
  const c=cnt(o,j);if(v>(c[k]||0))c[k]=v;const r=revisar(o,j);save(o);if(!quiet)avisar(j,r);return r.nuevos;
}
// Al terminar la partida. Cada juego pasa lo suyo en «datos»; acá se arman los contadores.
function finEventos(j,d){const E=[],win=!!d.gano,compu=d.modo==='compu',dif=d.dif||'';
  E.push(['partidas',1]);
  if(win){E.push(['ganadas',1]);if(compu&&dif==='dificil')E.push(['ganadas_dif',1]);if(compu&&(dif==='normal'||dif==='dificil'))E.push(['ganadas_nd',1]);if(d.modo==='online')E.push(['ganadas_online',1]);}
  if(j==='truco'&&win){if(d.meta&&d.tantos&&d.tantos[1]<d.meta/2)E.push(['zapatero',1]);if(d.remontada)E.push(['remontada',1]);}
  if(j==='uno'&&win&&d.n>=6)E.push(['ganadas_6',1]);
  if(j==='ludo'&&win){if(d.n>=4&&!d.eq)E.push(['ganadas_4',1]);if(d.eq)E.push(['ganadas_eq',1]);if(d.limpio)E.push(['limpio',1]);}
  if(j==='poblar'&&win){if(d.n>=4)E.push(['ganadas_4',1]);if(compu&&dif==='dificil'&&d.n>=3)E.push(['diez_dif',1]);}
  if(j==='ajedrez'){if(d.dist)E.push(['part_dist',1]);if(d.tablas)E.push(['tablas',1]);
    if(win){if(d.mate)E.push(['mates',1]);if(d.mate&&d.jugadas<=20)E.push(['mate20',1]);if(d.dist)E.push(['gan_dist',1]);if(d.blitz)E.push(['gan_blitz',1]);if(d.negras)E.push(['gan_negras',1]);if(compu&&dif==='maestro')E.push(['gan_maestro',1],['ganadas_dif',1]);if(compu&&dif==='maestro')E.push(['ganadas_nd',1]);}}
  if(j==='pool'){if(d.modo==='online')E.push(['online_part',1]);if(win&&d.dobles)E.push(['dobles_gan',1]);if(win&&d.limpia)E.push(['limpia',1]);}
  if(j==='sudoku'&&win){E.push(['gan_'+dif,1]);if(dif!=='facil')E.push(['gan_nd',1]);if(dif==='dificil'||dif==='experto')E.push(['gan_de',1]);
    if(d.limpio)E.push(['limpios',1]);if(d.notas)E.push(['con_notas',1]);if(d.diario)E.push(['dias',1]);
    if(dif==='facil'&&d.ms<300000)E.push(['rapido_facil',1]);if(dif==='normal'&&d.ms<480000)E.push(['rapido_normal',1]);}
  if(j==='solitario'&&win){if(d.robo===3)E.push(['gan_3',1]);if(d.limpio)E.push(['limpios',1]);if(d.diario)E.push(['dias',1]);
    if(d.ms<180000)E.push(['rapido',1]);if(d.ms<300000)E.push(['rapido5',1]);if(d.movidas<120)E.push(['pocos',1]);}
  if(j==='buscaminas'&&win){E.push(['gan_'+dif,1]);if(dif!=='principiante')E.push(['gan_ie',1]);if(d.diario)E.push(['dias',1]);if(d.sinBand)E.push(['sin_band',1]);
    if(d.limpio){E.push(['sin_pistas',1]);if(dif!=='principiante')E.push(['limpios_ie',1]);}
    if(dif==='principiante'&&d.ms<20000)E.push(['rapido_p',1]);if(dif==='intermedio'&&d.ms<120000)E.push(['rapido_i',1]);}
  if(j==='invasores'){if(d.olas)E.push(['oleadas',d.olas]);if(d.bajas)E.push(['bajas',d.bajas]);if(d.sum)E.push(['suministros',d.sum]);if(d.cen)E.push(['centinela',d.cen]);if(d.nod)E.push(['nodriza',d.nod]);if(d.perf)E.push(['perfectos',d.perf]);
    if(d.escudos)E.push(['escudos',d.escudos]);if(d.diario)E.push(['dias',1]);if(win&&d.limpio)E.push(['limpio',1]);if(win&&dif==='experta'&&d.modo==='solo')E.push(['gan_experta',1]);}
  if(j==='laberinto'){if(d.limpios)E.push(['limpios',d.limpios]);if(d.sinMorir)E.push(['sin_morir',d.sinMorir]);if(d.combo4)E.push(['combo4',1]);if(d.capturas)E.push(['capturas',d.capturas]);
    if(d.bonus)E.push(['bonus',d.bonus]);if(d.vuelta)E.push(['vuelta',1]);if(d.diario)E.push(['dias',1]);if(d.limDif)E.push(['lim_dif',d.limDif]);}
  return E;}
function fin(j,d,key){
  const out={nuevos:[],retos:[],html:''};if(!D[j]||!d)return out;const o=load();
  if(visto(o,key&&(j+':fin:'+key))){save(o);out.html=apBoton(j,'fin');return out;}
  for(const [k,n] of finEventos(j,d))sumar(o,j,k,n);
  const r=revisar(o,j);save(o);out.nuevos=r.nuevos;out.retos=r.cumplidos;
  const p=[...r.nuevos.map(L=>`<span class="lg-chip"><i>${L.e}</i>${esc(L.n)}</span>`),...r.cumplidos.map(x=>`<span class="lg-chip reto"><i>🎯</i>${esc(x.txt)} · +${x.xp} XP</span>`)];
  if(p.length){css();out.html=`<div class="lg-fin"><small>${r.nuevos.length?(r.nuevos.length===1?'Logro nuevo':'Logros nuevos'):''}${r.nuevos.length&&r.cumplidos.length?' y ':''}${r.cumplidos.length?(r.cumplidos.length===1?(r.nuevos.length?'reto cumplido':'Reto cumplido'):(r.nuevos.length?'retos cumplidos':'Retos cumplidos')):''}</small>${p.join('')}</div>`;}
  out.html+=apBoton(j,'fin');   // v72: la apariencia, a mano al terminar
  return out;
}

/* ── Cartelito: aparece debajo de la barra de arriba, chico, y se va solo ── */
const COLA=[];let MOSTRANDO=false;
function avisar(j,r){for(const L of r.nuevos)COLA.push({e:L.e,t:'Logro: '+L.n,s:L.d});for(const x of r.cumplidos)COLA.push({e:'🎯',t:'Reto cumplido',s:`${x.txt} · +${x.xp} XP`});if(!MOSTRANDO)siguiente();}
// Si el juego está mostrando su propio cartel (.toast), espera a que se vaya; y si aparece uno mientras se ve éste,
// se corre y vuelve después, para que nunca queden uno encima del otro.
const hayToast=()=>!!document.querySelector('.toast');
function siguiente(espera=0){if(!COLA.length){MOSTRANDO=false;return;}MOSTRANDO=true;
  if(!document.body){MOSTRANDO=false;return;}
  if(hayToast()&&espera<25){setTimeout(()=>siguiente(espera+1),400);return;}
  const a=COLA.shift();css();
  const el=document.createElement('div');el.className='lg-aviso';el.setAttribute('role','status');el.innerHTML=`<i>${a.e}</i><span><b>${esc(a.t)}</b><small>${esc(a.s)}</small></span>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add('on'));
  let t=0;const iv=setInterval(()=>{t+=300;const corta=hayToast()&&t<3000;
    if(t>=3400||corta){clearInterval(iv);if(corta)COLA.unshift(a);el.classList.remove('on');setTimeout(()=>{el.remove();siguiente();},260);}},300);}

/* ── Apariencias ── */
function nivel(j){try{const R=window.RANGOS;return R?R.levelInfo(R.xp(j)).lv:1;}catch(_){return 1;}}
function libre(j,op,o){if(op.oro)return !!(window.ORO&&ORO.tiene(op.k_));if(!op.lv&&!op.logro)return true;if(op.logro)return tiene(o,j,op.logro);return nivel(j)>=op.lv;}
let PREV=null;   // v72: {j,tipo,id} mientras se prueba una en la hoja
function apariencia(j,tipo){const A=D[j]&&D[j].ap[tipo];if(!A)return '';if(PREV&&PREV.j===j&&PREV.tipo===tipo&&A.op.some(x=>x.id===PREV.id))return PREV.id;const o=load(),id=(o.ap[j]||{})[tipo],op=A.op.find(x=>x.id===id);return op&&libre(j,op,o)?op.id:A.op[0].id;}
function elegir(j,tipo,id){const A=D[j]&&D[j].ap[tipo];if(!A)return false;const o=load(),op=A.op.find(x=>x.id===id);if(!op||!libre(j,op,o))return false;
  (o.ap[j]=o.ap[j]||{})[tipo]=id;save(o);aplicar(j);return true;}
let PAGJ='';
function aplicar(j){const G=D[j];if(!G)return;css();if(!PAGJ)PAGJ=j;
  let st=document.getElementById('lg-ap-'+j);
  if(!st){let txt='';for(const [tipo,A] of Object.entries(G.ap))for(const op of A.op.slice(1))try{txt+=A.css(op,`html[data-lg-${tipo}="${op.id}"]`)+'\n';}catch(e){console.warn('apariencia',j,tipo,op.id,e);}
    st=document.createElement('style');st.id='lg-ap-'+j;st.textContent=txt;(document.head||document.documentElement).appendChild(st);}
  for(const tipo of Object.keys(G.ap)){const id=apariencia(j,tipo),A=G.ap[tipo];if(id===A.op[0].id)document.documentElement.removeAttribute('data-lg-'+tipo);else document.documentElement.setAttribute('data-lg-'+tipo,id);}
}

/* ── Panel ── */
function diasHastaLunes(){const w=lunesAR(),next=Date.parse(w+'T03:00:00Z')+7*864e5,ms=next-Date.now(),d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/3600e3);return d>=1?`${d} ${d===1?'día':'días'}`:`${Math.max(1,h)} ${h===1?'hora':'horas'}`;}
function panelHtml(j){const G=D[j];if(!G)return '';css();const o=load(),c=o.c[j]||{},rs=retos(j),tot=G.logros.length,got=G.logros.filter(L=>tiene(o,j,L.id)).length;

  const logH=`<section class="lg-sec"><h3>Logros <small>${got} de ${tot}</small></h3><div class="lg-list">${G.logros.map(L=>{const on=tiene(o,j,L.id),m=L.m||1,v=Math.min(m,c[L.k]||0);

  return `<div class="side-head"><button type="button" class="lg-back" id="lg-back" aria-label="Volver al menú">‹</button><h2>${rs.length?'Logros y retos':'Logros'}</h2><button class="side-x" id="lg-x" aria-label="Cerrar">✕</button></div><div class="lg-panel">${retH}${logH}${apH}</div>`;
}
function cablear(root,j,op={}){if(!root)return;
  const b=root.querySelector('#lg-back');if(b)b.onclick=()=>{op.volver?op.volver():op.cerrar&&op.cerrar();};

    if(!ORO.comprar(ap.k_,ap.oro,`${D[j].n} · ${ap.n}`)){if(sm)sm.textContent='No te alcanza el oro';return;}
    try{if(window.SFX_ORO)SFX_ORO();}catch(_){}
    elegir(j,tipo,id);const top=root.scrollTop;(op.refrescar||(()=>{if(op.side)abrir(j,op);else{root.innerHTML=panelHtml(j);cablear(root,j,op);}}))();root.scrollTop=top;});
}
function abrir(j,op={}){if(!op.side)return;op.side(panelHtml(j));const root=document.getElementById('side-panel');cablear(root,j,{...op,cerrar:op.cerrar||(()=>{const s=document.getElementById('side');if(s)s.hidden=true;})});}

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';

function nombreOk(n){return typeof n==='string'&&n.trim()!==''&&!/^(null|undefined)$/i.test(n.trim());}
function loadLocal(){

  const malos=S.msgs.filter(x=>!x||!nombreOk(x.de)||!nombreOk(x.para));
  if(malos.length){S.msgs=S.msgs.filter(x=>x&&nombreOk(x.de)&&nombreOk(x.para));const t0=Math.min(...malos.map(x=>Number(x&&x.t)||0).filter(Boolean));
    if(t0)S.last=Math.min(S.last,t0-60000);ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}

function unreadFrom(n){const r=S.read[lc(n)]||0;if(esGK(n))return S.msgs.filter(m=>conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    const pend=invPendientes();if(pend.length)p.invs=pend;
    if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!esGK(S.con)&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}
    const invCh=j.invs?invGuardarSt(j.invs):false;if(invCh&&$('.cx-panel'))$('.cx-panel').dataset.sig='';
    if(j.borr&&aplicarBorrados(j.borr)&&S.open){$('.cx-panel').dataset.sig='';render();badges();}
    if(j.amigos)guardarAmigos(j.amigos,!S.amOk);
    if(Array.isArray(j.grupos)){S.grSup=true;S.pollOk=Date.now();const gch=guardarGrupos(j.grupos);if(S.open&&(gch||(S.view==='conv'&&esGK(S.con)&&S.gPido&&S.gPido.k===S.con))){$('.cx-panel').dataset.sig='';render();}}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();invCorregir();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){try{if(window.TITULOS)TITULOS.guardarLista(j.usuarios,j.cau);}catch(_){}const on=a=>a.filter(u=>u.enLinea).map(u=>lc(u.usuario)).sort().join(',');const ch=on(j.usuarios)!==on(S.users);S.users=j.usuarios;S.usersAt=Date.now();if(ch)avisarAmigos();}}catch(_){}}
const lastFrom=n=>{let t=0;if(esGK(n)){for(const m of S.msgs)if(conv(m)===lc(n)&&lc(m.de)!==lc(S.me)&&m.t>t)t=m.t;return t;}for(const m of S.msgs)if(!esG(m)&&lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id)||!nombreOk(m.de)||!nombreOk(m.para)||borradoLocal(m))continue;
    // Si un «No se mandó» en realidad sí llegó (se cortó la respuesta), se reemplaza por el de la planilla.
    if(lc(m.de)===lc(S.me)&&typeof m.p==='string'){const i=S.msgs.findIndex(x=>x.tmp&&lc(x.para)===lc(m.para)&&x.p===m.p&&Math.abs(x.t-m.t)<5*60e3);if(i>=0){delete S.plain[S.msgs[i].id];S.msgs.splice(i,1);}}
    S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  esperoRevisar(fresh);
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>(esG(m)?lc(m.de)!==lc(S.me):lc(m.para)===lc(S.me))&&m.tipo!=='reac'&&m.t>(r[conv(m)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===conv(m)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||(m.tmp&&typeof m.p!=='string'))continue;
    if(typeof m.p==='string'){try{S.plain[m.id]=JSON.parse(m.p);}catch(_){S.plain[m.id]=null;}continue;}
    if(S.key&&cs)S.plain[m.id]=await unseal(other(m),m.cont).catch(()=>null);}
}
// Mensajes viejos (v5–v11) que este dispositivo no puede abrir sin el PIN.

let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
/* ── Invitaciones que quedan en el chat (planilla v15) ──
   Cada invitación llega como una tarjeta {card:{inv,j,t,d}}. El estado (esperando, aceptada, rechazada, cancelada,
   vencida, vieja) se pide junto con la consulta periódica, sólo de las que todavía pueden cambiar. */
// «vencida» puede volver a «esperando» si el que invita estuvo sin señal un rato: se sigue preguntando hasta 2 horas.
const INV_FIN=['aceptada','rechazada','cancelada','vieja'];

async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}

   se toma una sola vez al tocar Enviar, y si no se pudo mandar queda en su charla con «No se mandó · Reintentar». */
async function send(){
  const ta=$('#cx-in'),para=S.con;if(!ta||!nombreOk(para))return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const pl=JSON.stringify({x:txt}),tmp={id:'tmp'+Date.now()+Math.random().toString(36).slice(2,6),de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:Date.now(),tmp:true};
  S.plain[tmp.id]={x:txt};S.msgs.push(tmp);saveMsgs();render();
  await mandar(tmp);
}
async function mandar(tmp){
  tmp.fail=false;tmp.sending=true;$('.cx-panel')&&($('.cx-panel').dataset.sig='');render();
  try{
    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    if(!S.msgs.some(x=>x.id===j.id)){const m={id:j.id,de:S.me,para:tmp.para,tipo:'msg',cont:'',p:tmp.p,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]=S.plain[tmp.id];}
    delete S.plain[tmp.id];saveMsgs();if(lc(S.con)===lc(tmp.para))S.err='';
  }catch(e){tmp.sending=false;tmp.fail=true;tmp.why=sinV12(e);saveMsgs();}

}

function descartar(id){const i=S.msgs.findIndex(x=>x.id===id&&x.tmp);if(i>=0){S.msgs.splice(i,1);delete S.plain[id];saveMsgs();$('.cx-panel').dataset.sig='';render();}}

function llamadoHtml(c,m){

async function mePrendo(mid){

  S.espero={host:c.host||m.de,j:c.j,mesa:c.mesa||'',t:Date.now(),mid};try{sessionStorage.setItem('bloques-chat-espero',JSON.stringify(S.espero));}catch(_){}

// v70.1: la planilla 19 no conoce LudAR ni PoolAR: su tarjeta dice «BloqueAR · Duelo en línea». Se mira esa invitación
// (una sola vez por tarjeta) y se corrige el juego que muestra la tarjeta y adónde lleva «Entrar».
const INV_PREF={TRUCO:'truco',UNO:'uno',POBLAR:'poblar',AJEDREZ:'ajedrez',LUDO:'ludo',POOL:'pool',INVASOR:'invasores'};

      if(!g)continue;let o=null;try{o=JSON.parse(of.slice(of.indexOf(':')+1));}catch(_){}

function esperoRevisar(fresh){

}

async function llamar(gid,card){

  const pl=JSON.stringify({x:'',card:{...card,ll:1,host:S.me}}),para='g:'+g.id;

/* ───────── Chat de la mesa (v66) ─────────
   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la
       pantalla y se recuerda por juego y por orientación (localStorage «mesa-chat-pos:<juego>:v|h»). Agrega «⟲» para
       volver a su lugar. Los globitos de mensajes nuevos salen del lado donde lo dejaste.
   · (v74) El panel queda chico (alto fijo, scroll adentro), tiene ▁ para minimizarlo a una barrita arrastrable y se mueve
     libre por toda la pantalla. movible(el, juego, {abrir, cerrar, btn, visible, ancla}) — abrir: cómo reabrirlo desde
     la barrita (si no, se muestra el mismo panel); btn: el botón del chat del juego (la barrita se ve mientras él se vea).
   · nuevo(juego, de, txt)  (v74) los chats propios (UnoAR, LudAR, InvasorAR) avisan cada mensaje que llega: si está
     minimizado, suma en la barrita y sale un globito arriba de ella (tocarlo abre el chat). Devuelve true si lo mostró.
   El mensaje en la red: {t:'mchat', de, txt, eq}. eq=1: sólo para el equipo del que lo manda. */

   y que al abrirlo en cualquier lugar no se rompa ni quede afuera»):
   · El panel tiene alto fijo chico (clase mc-comp) y los mensajes se leen con scroll adentro. Si estás leyendo arriba,
     no te lo baja: aparece «↓ nuevos».
   · ▁ lo minimiza a una barrita que se puede llevar a cualquier lado; tocándola vuelve a abrirse ahí mismo. Con el chat
     minimizado, cada mensaje nuevo sale como globito arriba (o abajo, si no hay lugar) de la barrita.
   · Se arrastra libre por toda la pantalla. Se guarda el centro como fracción de la pantalla {cx, cy}, por juego y

<script>
/* ==== MOTOR ==== */
/* TrucAR: truco argentino de a dos, con flor o sin flor (v67).
   Cartas: número (1-7, 10-12) y palo (e espadas, b bastos, o oros, c copas), como texto: '1e', '12c'.
   La partida (M) tiene todo; cada jugador (y la compu) sólo ve lo suyo con vistaDe(M,p). */
const PALOS=['e','b','o','c'],NUMS=[1,2,3,4,5,6,7,10,11,12];

const cN=c=>parseInt(c,10),cP=c=>c.slice(-1);
// Jerarquía del truco: ancho de espadas, ancho de bastos, 7 de espadas, 7 de oros, 3, 2, anchos falsos, 12, 11, 10, 7 falsos, 6, 5, 4.
function rango(c){const n=cN(c);
  if(c==='1e')return 14;if(c==='1b')return 13;if(c==='7e')return 12;if(c==='7o')return 11;
  return {3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1}[n];}
const envVal=c=>{const n=cN(c);return n<=7?n:0;};

function envidoDe(cards){let best=-1;
  for(const p of PALOS){const v=cards.filter(c=>cP(c)===p).map(envVal).sort((a,b)=>b-a);if(v.length>=2)best=Math.max(best,20+v[0]+v[1]);}
  return best>=0?best:Math.max(0,...cards.map(envVal));}
// Flor (v67): las tres del mismo palo. Vale 20 más las tres (las figuras valen 0), como el envido.
const esFlor=cs=>cs.length===3&&cs.every(c=>cP(c)===cP(cs[0]));
const florDe=cs=>esFlor(cs)?20+cs.reduce((a,c)=>a+envVal(c),0):0;
const FLOR_N={F:'Flor',A:'Con flor me achico',C:'Contraflor',R:'Contraflor al resto'};
function mazo(){const d=[];for(const p of PALOS)for(const n of NUMS)d.push(n+p);return d;}
function rngDe(seed){let s=(seed>>>0)||1;return ()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

  if(c==='1e')return 'el ancho de espadas';if(c==='1b')return 'el ancho de bastos';
  return `el ${n} de ${PNOM[p]}`;}

const ENV_N={E:'Envido',R:'Real envido',F:'Falta envido'};
const valorTruco=l=>l+1;// sin truco 1; truco 2; retruco 3; vale cuatro 4

/* ───── Partida ───── */
// Azar de verdad para repartir (con semilla sólo en las pruebas). El número de partida que viaja es otro y no sirve para adivinar el mazo.

    ultimo:null};

function repartir(M,cartas){

  M.H={n:M.n,cartas:[d.slice(0,3),d.slice(3,6)],repartidas:[d.slice(0,3),d.slice(3,6)],jugadas:[[],[]],baza:0,bazas:[],abre:M.mano,turno:M.mano,
    env:{canto:[],hecho:false,res:null},flor:{hecho:false,res:null,canto:null},tru:{nivel:0,quiero:null},pend:null,susp:null,fin:false,gano:null,pts:0,por:''};
  M.ultimo=null;

function anotar(M,t){M.log.push(t);if(M.log.length>200)M.log.splice(0,M.log.length-200);}
const quienJuega=M=>{const H=M.H;if(!H||H.fin||M.fin)return -1;return H.pend?1-H.pend.por:H.turno;};
// ¿p tiene flor y todavía la puede cantar? (en la primera, antes de tirar su carta, y si nadie la cantó todavía)
const tieneFlor=(M,p)=>!!(M.flor&&M.H&&esFlor(M.H.repartidas[p]));

// Envido: sólo en la primera baza, antes de tirar tu carta y mientras no se haya querido el truco.
const puedeEnvido=(M,p)=>{const H=M.H;return H.baza===0&&!H.env.hecho&&H.jugadas[p].length===0&&H.tru.nivel===0&&!puedeFlor(M,p)&&!(H.flor&&H.flor.hecho);};
function envSiguientes(canto){
  if(canto.includes('F'))return [];
  const e=canto.filter(x=>x==='E').length,r=canto.includes('R'),out=[];
  if(!r&&e<2&&canto.length===e)out.push('E');
  if(!r)out.push('R');
  out.push('F');return out;}
const faltaVale=M=>Math.max(1,M.meta-Math.max(M.tantos[0],M.tantos[1]));
const envQuerido=(canto,M)=>canto.includes('F')?faltaVale(M):canto.reduce((a,k)=>a+(k==='E'?2:3),0);

const puedeTruco=(M,p)=>{const H=M.H;return !H.pend&&H.turno===p&&H.tru.nivel<3&&(H.tru.nivel===0||H.tru.quiero===p);};
// Qué puede hacer p ahora (para los botones y para validar).
function acciones(M,p){
  const H=M.H,out=[];if(quienJuega(M)!==p)return out;
  if(H.pend){
    // La flor: el que la tiene contesta con su flor (achicarse, contraflor o contraflor al resto)
    if(H.pend.k==='flor'){out.push({t:'flor',k:'A'},{t:'flor',k:'C'},{t:'flor',k:'R'});return out;}
    if(H.pend.k==='cfr'){out.push({t:'quiero'},{t:'noquiero'});return out;}
    // Con flor, al envido se le contesta «¡Flor!» (se anula el envido)
    if(H.pend.k==='env'&&puedeFlor(M,p)){out.push({t:'flor'});return out;}
    out.push({t:'quiero'},{t:'noquiero'});
    if(H.pend.k==='env'){for(const k of envSiguientes(H.env.canto))out.push({t:'env',k});}
    else{if(H.pend.nivel<3)out.push({t:'truco'});
      if(puedeEnvido(M,p))for(const k of ['E','R','F'])out.push({t:'env',k,primero:true});
      if(puedeFlor(M,p))out.push({t:'flor',primero:true});}
    return out;}
  for(const c of H.cartas[p])out.push({t:'carta',c});
  if(puedeFlor(M,p))out.push({t:'flor'});
  if(puedeEnvido(M,p))for(const k of ['E','R','F'])out.push({t:'env',k});
  if(puedeTruco(M,p))out.push({t:'truco'});
  out.push({t:'mazo'});
  return out;
}
const mismaAccion=(a,b)=>a.t===b.t&&(a.c||'')===(b.c||'')&&(a.k||'')===(b.k||'');
// Aplica una acción de p. Devuelve null si se pudo, o el motivo si no vale.
function jugar(M,p,a){
  if(M.fin)return 'La partida terminó.';const H=M.H;if(!H||H.fin)return 'La mano terminó.';
  if(quienJuega(M)!==p)return 'No es tu turno.';
  if(!acciones(M,p).some(x=>mismaAccion(x,a)))return 'Eso no se puede ahora.';
  const yo=M.nombres[p],otro=1-p;
  M.ultimo={p,a:{...a}};M.acc=(M.acc||0)+1;
  if(H.pend){
    if(H.pend.k==='flor'){anotar(M,`${yo}: «${FLOR_N[a.k]}».`);
      if(a.k==='A')return resolverFlor(M,H.pend.por,4,'se achicó');
      if(a.k==='C')return resolverFlor(M,null,6,'contraflor');
      H.pend={k:'cfr',por:p};return null;}
    if(H.pend.k==='cfr'){
      if(a.t==='quiero'){anotar(M,`${yo}: «Quiero».`);return resolverFlor(M,null,faltaVale(M),'contraflor al resto');}
      anotar(M,`${yo}: «No quiero».`);return resolverFlor(M,H.pend.por,6,'no quiso la contraflor al resto');}
    if(a.t==='flor'){// «¡Flor!» contestando un envido (lo anula) o «la flor está primero» contestando un truco
      if(H.pend.k==='env'){anotar(M,`${yo}: «¡Flor!» (se anula el envido).`);H.env.canto=[];H.pend=null;H.env.hecho=true;}
      else{H.susp=H.pend;H.pend=null;anotar(M,`${yo}: «¡La flor está primero!»`);}

      if(a.t==='quiero')return resolverEnvido(M,true);
      if(a.t==='noquiero')return resolverEnvido(M,false);

    if(a.t==='quiero'){H.tru.nivel=L;H.tru.quiero=p;H.pend=null;anotar(M,`${yo}: «Quiero».`);return null;}
    if(a.t==='noquiero'){anotar(M,`${yo}: «No quiero».`);return terminarMano(M,H.pend.por,L,'no quiso el '+TRUCO_N[L].toLowerCase());}
    if(a.t==='truco'){H.tru.nivel=L;H.tru.quiero=p;H.pend={k:'truco',nivel:L+1,por:p};anotar(M,`${yo}: «Quiero ${TRUCO_N[L+1].toLowerCase()}».`);return null;}
    if(a.t==='env'){H.susp=H.pend;H.env.canto=[a.k];H.pend={k:'env',por:p};anotar(M,`${yo}: «El envido está primero: ${ENV_N[a.k].toLowerCase()}».`);return null;}
    return 'Eso no se puede ahora.';
  }
  if(a.t==='carta'){
    const i=H.cartas[p].indexOf(a.c);H.cartas[p].splice(i,1);H.jugadas[p].push(a.c);
    anotar(M,`${yo} tira ${nombreCarta(a.c)}.`);
    if(H.jugadas[otro].length>H.baza)return cerrarBaza(M);
    H.turno=otro;return null;}
  if(a.t==='flor'){anotar(M,`${yo}: «¡Flor!»`);return cantarFlor(M,p);}
  if(a.t==='env'){H.env.canto=[a.k];H.pend={k:'env',por:p};anotar(M,`${yo}: «${ENV_N[a.k]}».`);return null;}
  if(a.t==='truco'){H.pend={k:'truco',nivel:H.tru.nivel+1,por:p};anotar(M,`${yo}: «${TRUCO_N[H.tru.nivel+1]}».`);return null;}
  if(a.t==='mazo'){anotar(M,`${yo} se va al mazo.`);return terminarMano(M,otro,valorTruco(H.tru.nivel),'se fue al mazo');}

// p cantó flor. Si el otro no tiene, suma 3 y listo. Si tiene, le toca contestar (achicarse, contraflor o al resto).
function cantarFlor(M,p){const H=M.H,o=1-p;H.flor.canto=p;H.env.hecho=true;
  if(!tieneFlor(M,o)){anotar(M,`${M.nombres[o]} no tiene flor: ${M.nombres[p]} suma 3.`);return resolverFlor(M,p,3,'flor');}
  H.pend={k:'flor',por:p};return null;}
// g: quién gana (null = se comparan las flores; empate, gana el mano)
function resolverFlor(M,g,pts,como){const H=M.H,f=[florDe(H.repartidas[0]),florDe(H.repartidas[1])],comp=g==null;
  if(comp){g=f[0]>f[1]?0:f[1]>f[0]?1:M.mano;anotar(M,`${M.nombres[M.mano]}: «${f[M.mano]} de flor». ${M.nombres[1-M.mano]}: «${g===M.mano?'Son buenas':f[1-M.mano]+' son mejores'}».`);}
  anotar(M,`${M.nombres[g]} gana la flor: ${pts} ${pts===1?'punto':'puntos'}.`);
  H.flor.hecho=true;H.env.hecho=true;H.flor.res={g,pts,como,comp,f:comp?f:null,canto:H.flor.canto};
  H.pend=null;if(H.susp){H.pend=H.susp;H.susp=null;}
  sumar(M,g,pts);return null;}
function resolverEnvido(M,quiso){
  const H=M.H,canto=H.env.canto,canta=H.pend.por,resp=1-canta;let gano,pts;
  const e=[envidoDe(H.repartidas[0]),envidoDe(H.repartidas[1])];
  if(!quiso){gano=canta;pts=envNoQuerido(canto);anotar(M,`${M.nombres[resp]}: «No quiero». ${M.nombres[canta]} suma ${pts}.`);}
  else{pts=envQuerido(canto,M);gano=e[0]>e[1]?0:e[1]>e[0]?1:M.mano;
    const pie=1-M.mano;anotar(M,`${M.nombres[resp]}: «Quiero». ${M.nombres[M.mano]}: «Tengo ${e[M.mano]}». ${M.nombres[pie]}: «${gano===pie?e[pie]+' son mejores':'Son buenas'}».`);
    anotar(M,`${M.nombres[gano]} gana el envido: ${pts} ${pts===1?'punto':'puntos'}.`);}
  H.env.hecho=true;H.env.res={quiso,pts,gano,e,canto:canto.slice()};
  H.pend=null;if(H.susp){H.pend=H.susp;H.susp=null;}
  sumar(M,gano,pts);
  return null;
}
function sumar(M,p,pts){M.tantos[p]=Math.min(M.meta,M.tantos[p]+pts);if(M.tantos[p]>=M.meta&&!M.fin){M.fin=true;M.gano=p;if(M.H){M.H.fin=true;M.H.pend=null;M.H.susp=null;if(M.H.gano==null){M.H.gano=p;M.H.por='llegó a '+M.meta;}}anotar(M,`🏆 ${M.nombres[p]} llegó a ${M.meta} y gana la partida.`);}}
// Quién gana la mano según las bazas ('p' es parda).
function ganadorMano(bz,mano){
  if(bz.length<2)return null;const [a,b,c]=bz;
  if(bz.length===2){if(a!=='p'&&(b===a||b==='p'))return a;if(a==='p'&&b!=='p')return b;return null;}
  if(c!=='p')return c;if(a!=='p')return a;return mano;}
function cerrarBaza(M){
  const H=M.H,b=H.baza,c0=H.jugadas[0][b],c1=H.jugadas[1][b],r0=rango(c0),r1=rango(c1),w=r0>r1?0:r1>r0?1:'p';
  H.bazas.push(w);anotar(M,w==='p'?`${['Primera','Segunda','Tercera'][b]}: parda.`:`${['Primera','Segunda','Tercera'][b]} para ${M.nombres[w]}.`);
  const g=ganadorMano(H.bazas,M.mano);
  if(g!==null)return terminarMano(M,g,valorTruco(H.tru.nivel),'ganó las bazas');

}
function terminarMano(M,g,pts,por){
  const H=M.H;H.fin=true;H.gano=g;H.pts=pts;H.por=por;H.pend=null;H.susp=null;
  anotar(M,`${M.nombres[g]} gana la mano: ${pts} ${pts===1?'punto':'puntos'}.`);
  sumar(M,g,pts);return null;

// Lo que ve el jugador p: sus cartas, lo jugado, los cantos y los tantos. Nunca las cartas del otro.
function vistaDe(M,p){
  const H=M.H,o=1-p;let env=null;
  if(H.env.res){const r=H.env.res,pie=1-M.mano;
    // El que gana el envido lo dice; el que pierde lo dijo sólo si es mano (el pie dice «son buenas»).
    env={quiso:r.quiso,pts:r.pts,gano:r.gano,canto:r.canto.slice(),suyo:r.quiso?(r.gano===o||o===M.mano?r.e[o]:null):null,mio:r.e[p]};}

    jugadas:[H.jugadas[0].slice(),H.jugadas[1].slice()],bazas:H.bazas.slice(),baza:H.baza,abre:H.abre,turno:H.turno,

    lesQuedan:H.cartas[o].length,fin:H.fin,acciones:acciones(M,p),
    conFlor:!!M.flor,miFlor:M.flor?florDe(H.repartidas[p]):0,florHecho:!!(H.flor&&H.flor.hecho),flor:florVista(M,p),
    // Para la compu: si el otro ya mostró que no tiene flor (tiró su primera carta sin cantarla) o si la cantó.
    rivalFlor:!M.flor?false:(H.flor&&H.flor.canto===o)||(H.pend&&H.pend.k==='flor'&&H.pend.por===o)?true:(H.flor&&H.flor.res&&H.flor.res.comp)?true:H.jugadas[o].length>0?false:null};
}
// La flor que se ve: quién ganó, cuánto, y los valores sólo si se compararon.
function florVista(M,p){const H=M.H;if(!H.flor||!H.flor.res)return null;const r=H.flor.res;return {g:r.g,pts:r.pts,como:r.como,comp:r.comp,f:r.f?r.f.slice():null,canto:r.canto};}

/* ───── La compu ─────
   Decide sólo con la vista (vistaDe): no ve tus cartas. Para el truco imagina muchas manos posibles tuyas
   (con las cartas que no vio) y calcula cuántas veces gana jugando bien. */
const NIVEL_IA={
  // v67: más «humana». Fácil se equivoca seguido y casi no miente; Normal arriesga a veces y se equivoca un poco;
  // Difícil cuenta lo que salió, miente cuando le conviene y no regala nada. Ninguna ve tus cartas.
  facil:{mc:0,farol:.03,error:.18,envCanta:29,envQuiere:27,truCanta:.82,truQuiere:.52,sube:.94},

  dificil:{mc:200,farol:.12,error:0,envCanta:26,envQuiere:25,truCanta:.74,truQuiere:.48,sube:.85}};
// Manos posibles del rival que coinciden con lo que se vio (cartas jugadas y lo que dijo en el envido).
function manosPosibles(V,N,R){
  const o=1-V.p,vistas=new Set([...V.misRepartidas,...V.jugadas[o]]),pool=mazo().filter(c=>!vistas.has(c)),need=V.lesQuedan,out=[];
  let tries=0;
  while(out.length<N&&tries<N*40){tries++;mezclar(pool,R);const h=pool.slice(0,need),full=[...V.jugadas[o],...h];
    if(V.conFlor&&V.rivalFlor!=null&&full.length===3&&esFlor(full)!==V.rivalFlor)continue;   // lo que se sabe de su flor
    if(V.env&&V.env.quiso){const e=envidoDe(full);
      if(V.env.suyo!=null){if(e!==V.env.suyo)continue;}
      else{if(e>V.env.mio||(e===V.env.mio&&o===V.mano))continue;}}
    out.push(h);}

}
// Con todas las cartas a la vista: ¿gana p jugando los dos lo mejor posible? (1 o 0)
function resolver(manos,bz,mesa,turno,abre,mano,p){
  const g=ganadorMano(bz,mano);if(g!==null)return g===p?1:0;
  const q=turno,cs=manos[q];let best=q===p?-1:2;
  for(let i=0;i<cs.length;i++){const c=cs[i],nm=[manos[0],manos[1]];nm[q]=cs.filter((_,j)=>j!==i);let v;
    if(!mesa)v=resolver(nm,bz,{c,q},1-q,q,mano,p);

// Estado de la mesa desde la vista: la carta que está esperando respuesta en esta baza.
function mesaDe(V){const b=V.baza,a=V.abre;if(V.jugadas[a].length>b&&V.jugadas[1-a].length===b)return {c:V.jugadas[a][b],q:a};return null;}

function chances(V,N,R,peso){

<script>

  const miTurno=E.turno===0&&!E.pend&&!E.finMano&&!E.fin,espero=!E.finMano&&!E.fin&&E.acciones.length===0;
  let s='';
  if(E.finMano||E.fin)s='';
  else if(E.pend&&E.pend.por===1)s=E.pend.k==='env'?(puedo('flor')?`${esc(E.nombres[1])} cantó ${TXT_ENV(E.envCanto)}, pero tenés flor: <b>¡cantala!</b>`:`${esc(E.nombres[1])} cantó ${TXT_ENV(E.envCanto)}: ¿querés?`)
    :E.pend.k==='flor'?`${esc(E.nombres[1])} cantó flor y vos también tenés: <b>¿qué hacés?</b>`:E.pend.k==='cfr'?`${esc(E.nombres[1])} cantó contraflor al resto: ¿querés?`
    :`${E.envHecho&&E.baza===0&&E.jugadas[0].length===0&&E.jugadas[1].length===0&&E.tru.nivel===0?'Ahora el truco: ':''}${esc(E.nombres[1])} cantó ${TXT_TRUCO(E.pend.nivel).toLowerCase()}: ¿querés?`;
  else if(E.pend&&E.pend.por===0)s=`Esperando qué contesta ${esc(E.nombres[1])}…`;
  else if(miTurno)s=`${E.mano===0&&E.baza===0&&E.jugadas[0].length===0?'Sos mano. ':''}<b>Te toca.</b>`;
  else s=`Juega ${esc(E.nombres[1])}…`;
  if(!E.finMano&&!E.fin&&E.baza===0&&E.jugadas[0].length===0&&E.conFlor&&E.miFlor&&!E.florHecho)s+=` <span class="envhint">· Tenés flor (${E.miFlor})</span>`;
  else if(!E.finMano&&!E.fin&&E.baza===0&&!E.envHecho&&E.jugadas[0].length===0&&E.tru.nivel===0)s+=` <span class="envhint">· Tenés ${E.miEnvido} de envido</span>`;// mientras todavía se puede cantar
  st.innerHTML=s;
  // Botones
  let b='';
  if(!E.finMano&&!E.fin&&!PEND_GUEST){
    if(E.pend&&E.pend.por===1){
      if(E.pend.k==='flor'){b+=`<button class="act" data-a="flor" data-k="A">Me achico<small>+4 para ${esc(E.nombres[1])}</small></button><button class="act yes" data-a="flor" data-k="C">Contraflor<small>la mejor +6</small></button><button class="act no" data-a="flor" data-k="R">Al resto<small>${faltaTxt()}</small></button>`;}
      else if(E.pend.k==='env'&&puedo('flor'))b+=`<button class="act yes hot" data-a="flor">¡Flor!<small>anula el envido</small></button>`;
      else{b+=`<button class="act yes" data-a="quiero">Quiero</button><button class="act no" data-a="noquiero">No quiero</button>`;
        if(E.pend.k==='truco'&&puedo('truco'))b+=`<button class="act" data-a="truco">${TXT_TRUCO(E.pend.nivel+1)}</button>`;
        if(E.pend.k==='env'&&puedo('env'))b+=`<button class="act" data-a="pickenv">Subir…</button>`;
        if(E.pend.k==='truco'&&puedo('flor'))b+=`<button class="act hot" data-a="flor">¡Flor!<small>está primero</small></button>`;
        else if(E.pend.k==='truco'&&puedo('env'))b+=`<button class="act" data-a="pickenv">Envido…<small>está primero</small></button>`;}}
    else if(miTurno){
      if(puedo('flor'))b+=`<button class="act hot" data-a="flor">¡Flor!</button>`;
      if(puedo('env'))b+=`<button class="act" data-a="pickenv">Envido…</button>`;
      if(puedo('truco'))b+=`<button class="act" data-a="truco">${TXT_TRUCO(E.tru.nivel+1)}</button>`;
      b+=`<button class="act ghost" data-a="mazo">Al mazo</button>`;}}
  // si cambió la pregunta pero los botones quedan en el mismo lugar, se traban un momento (que no se conteste dos veces)
  const sig=(E.pend?E.pend.k+(E.pend.nivel||'')+E.envCanto.join(''):'t')+':'+E.acc;
  if(ACT_SIG&&sig!==ACT_SIG&&/quiero/.test(b)&&/quiero/.test(acts.innerHTML)&&!FAST){ACT_LOCK=Date.now()+700;acts.classList.add('lock');setTimeout(()=>acts.classList.remove('lock'),700);}
  ACT_SIG=sig;
  acts.innerHTML=b;
  // Mano
  hand.className='hand'+(miTurno&&!PEND_GUEST?' play':'')+(E.mias.length===2?' two':'')+(nueva&&E.mias.length===3&&!FAST?' deal':'');
  hand.innerHTML=E.mias.map(c=>cartaHtml(c)).join('');
  if(miTurno&&!PEND_GUEST)hand.querySelectorAll('.card').forEach(el=>{el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label','Tirar '+nombreCarta(el.dataset.c).replace(/^el /,''));});
  if(E.mias.length===0&&!E.finMano)hand.innerHTML='';
}
const ENVN={E:'Envido',R:'Real envido',F:'Falta envido'};
function TXT_ENV(canto){if(!canto.length)return 'envido';const c=canto.map(k=>ENVN[k].toLowerCase());if(canto.length===2&&canto[0]==='E'&&canto[1]==='E')return 'envido envido';return c[c.length-1];}
// Globos: lo que dijo cada uno
let DICHO_T=[0,0];
function dicho(q,txt,o={}){DICHO[q]={txt,sub:o.sub||'',hot:!!o.hot,keep:!!o.keep};clearTimeout(DICHO_T[q]);
  if(!o.keep)DICHO_T[q]=setTimeout(()=>{DICHO[q]=null;renderDichos();},FAST?0:(o.ms||2300));renderDichos();}
function renderDichos(){document.querySelectorAll('.say').forEach(x=>x.remove());

    (q?$('table'):$('acts')).appendChild(el);}}

// Una carta que vuela de la mano a la mesa
function origenCarta(q,c){const el=q===0?document.querySelector(`#hand .card[data-c="${c}"]`):document.querySelector('#rival .backs .card:last-child')||document.querySelector('#rival .av');return el?el.getBoundingClientRect():null;}
// v72: vuela una carta «fantasma» y la de verdad queda oculta hasta que se apoya (ver chat/vuelo.js). Antes se animaba la carta
// misma y el redibujo siguiente la cortaba: la del rival aparecía de golpe. También anda con «reducir movimiento» (versión corta).
function volar(q,c,desde){if(!desde||FAST)return;const sel=`#bazas .card[data-c="${c}"]`;
  VUELO.carta({html:cartaHtml(c),desde,hasta:sel,ocultar:sel,giro:q?9:-7,alLlegar:()=>sfx('apoyo')});}

/* v67: el reparto se ve: los naipes salen del mazo (en el medio del paño) y van uno a uno a cada mano.
   Son dibujos aparte sin toques (pointer-events:none): las cartas de verdad ya están en su lugar y se pueden tocar. */
function voladores(destinos,origen,cls=''){
  // v72: con chat/vuelo.js (animaciones del navegador, más parejas aunque el celular esté ocupado). Los lugares chicos (la cara
  // de un jugador) reciben un naipe de tamaño de carta, centrado.
  if(!origen||!destinos.length)return;
  const D=destinos.map(d=>{const r=d.r,w=d.el?r.width:Math.max(24,Math.min(r.width,46)),h=w*1.5;
    const rr=d.el?r:{left:r.left+r.width/2-w/2,top:r.top+r.height/2-h/2,width:w,height:h};
    if(d.el)d.el.style.opacity='0';
    return {html:dorsoHtml(),hastaRect:rr,dorso:true,escalaFin:d.el?1:.6,alLlegar:d.el?()=>{d.el.style.opacity='';}:null};});
  VUELO.reparto(D,origen,{paso:90,dur:300});
  setTimeout(()=>D.forEach((x,i)=>{const d=destinos[i];if(d.el)d.el.style.opacity='';}),90*D.length+1200);   // por las dudas
  sfx('repartir');}
function repartirAnim(){const f=$('felt');if(!f)return;const o=f.getBoundingClientRect();
  const mias=[...document.querySelectorAll('#hand .card')],suyas=[...document.querySelectorAll('#rival .backs .card')];
  if(!mias.length)return;$('hand').classList.remove('deal');document.querySelector('#rival .backs')?.classList.remove('deal');
  const dest=[];for(let i=0;i<3;i++){if(suyas[i])dest.push({el:suyas[i],r:suyas[i].getBoundingClientRect()});if(mias[i])dest.push({el:mias[i],r:mias[i].getBoundingClientRect()});}
  voladores(dest,{left:o.left+o.width/2-1,top:o.top+o.height/2-1,width:2,height:2});}
// Al terminar la mano, las cartas de la mesa se juntan hacia el que la ganó.
function juntarBazas(gane){if(FAST)return;const cs=[...document.querySelectorAll('#bazas .card')];const h=gane?$('hand'):document.querySelector('#rival .backs')||$('rival');

/* ───────── Cantos y avisos de lo que pasó ───────── */
async function anunciar(q,a,Ea,En){
  const otro=1-q;
  if(a.t==='carta'){DICHO[q]=null;return;}// la carta vuela en «aplicar»
  if(a.t==='truco'){const n=En.pend?En.pend.nivel:(Ea.pend?Ea.pend.nivel+1:1);const sube=Ea.pend&&Ea.pend.k==='truco';
    DICHO[otro]=null;dicho(q,sube?`¡Quiero ${TXT_TRUCO(n).toLowerCase()}!`:`¡${TXT_TRUCO(n)}!`,{hot:true,keep:true});sfxCanto(n);return;}
  if(a.t==='env'){DICHO[otro]=null;const primero=Ea.pend&&Ea.pend.k==='truco';
    dicho(q,primero?'¡El envido está primero!':`¡${ENVN[a.k]}!`,{hot:true,keep:true,sub:primero?ENVN[a.k]:(En.envCanto.length>1?En.envCanto.map(k=>ENVN[k]).join(' · '):'')});sfx('envido');return;}
  if(a.t==='flor'){DICHO[otro]=null;
    if(!a.k){const primero=Ea.pend&&Ea.pend.k==='truco',anula=Ea.pend&&Ea.pend.k==='env';dicho(q,primero?'¡La flor está primero!':'¡Flor!',{hot:true,keep:!En.flor,sub:anula?'se anula el envido':''});sfx('flor');
      if(En.flor&&!En.flor.comp){await wait(1100);dicho(otro,'No tengo flor',{ms:2000});await wait(900);toast(`${En.flor.g===0?'Sumás':esc(En.nombres[1])+' suma'} ${En.flor.pts} por la flor`);soltarTantos();}
      await trucoQueVuelve(En);return;}
    dicho(q,`¡${FLORN[a.k]}!`,{hot:true,keep:a.k==='R'});sfx(a.k==='A'?'noquiero':'flor');
    if(En.flor){await decirFlores(En);await trucoQueVuelve(En);}
    return;}
  if(a.t==='mazo'){DICHO[otro]=null;dicho(q,'Me voy al mazo');sfx('noquiero');return;}
  if(a.t==='noquiero'){DICHO[otro]=null;dicho(q,'No quiero');sfx('noquiero');
    if(Ea.pend&&Ea.pend.k==='env'&&En.env){const g=En.env.gano;await wait(900);toast(`${g===0?'Sumás':esc(En.nombres[1])+' suma'} ${En.env.pts} por el envido · la mano sigue`);soltarTantos();await trucoQueVuelve(En);}
    else if(Ea.pend&&Ea.pend.k==='cfr'&&En.flor){await wait(900);toast(`${En.flor.g===0?'Sumás':esc(En.nombres[1])+' suma'} ${En.flor.pts} por la flor`);soltarTantos();await trucoQueVuelve(En);}
    return;}
  if(a.t==='quiero'){DICHO[otro]=null;dicho(q,'¡Quiero!');sfx('quiero');
    if(Ea.pend&&Ea.pend.k==='env'&&En.env&&En.env.quiso){
      // Los tantos: primero el mano, después el pie («son mejores» o «son buenas»). Recién al final se suma.
      const mano=En.mano,pie=1-mano,pts=w=>w===0?En.env.mio:En.env.suyo;
      await wait(900);dicho(mano,`Tengo ${pts(mano)}`,{keep:true});
      await wait(1300);const ganaPie=En.env.gano===pie;dicho(pie,ganaPie?`${pts(pie)} son mejores`:'Son buenas',{keep:true});
      await wait(1200);toast(`${En.env.gano===0?'Ganaste':esc(En.nombres[1])+' gana'} el envido: ${En.env.pts} ${En.env.pts===1?'punto':'puntos'}`);
      soltarTantos();if(En.env.gano===0)sfx('quiero');
      setTimeout(()=>{if(DICHO[0]&&!DICHO[0].hot)DICHO[0]=null;if(DICHO[1]&&!DICHO[1].hot)DICHO[1]=null;renderDichos();},FAST?0:1400);
      await trucoQueVuelve(En);}
    else if(Ea.pend&&Ea.pend.k==='cfr'&&En.flor){await decirFlores(En);await trucoQueVuelve(En);}
    return;}
}
// Las flores, dichas desde la mano, y recién después se suma.
async function decirFlores(En){const F=En.flor;
  if(!F.comp){await wait(700);toast(`${F.g===0?'Sumás':esc(En.nombres[1])+' suma'} ${F.pts} por la flor`);soltarTantos();return;}
  const mano=En.mano,pie=1-mano,v=w=>F.f?F.f[w]:'';
  await wait(900);dicho(mano,`${v(mano)} de flor`,{keep:true});
  await wait(1300);dicho(pie,F.g===pie?`${v(pie)} son mejores`:'Son buenas',{keep:true});
  await wait(1200);toast(`${F.g===0?'Ganaste':esc(En.nombres[1])+' gana'} la flor: ${F.pts} puntos`);soltarTantos();
  setTimeout(()=>{DICHO[0]=DICHO[1]=null;renderDichos();},FAST?0:1400);}
// Si había un truco esperando (el envido o la flor estaban primero), se avisa clarito que ahora hay que contestarlo.
async function trucoQueVuelve(En){if(!E||E!==En||!En.pend||En.pend.k!=='truco')return;
  if(En.pend.por===1){await wait(500);dicho(1,`¿Y el ${TXT_TRUCO(En.pend.nivel).toLowerCase()}? ¿Querés?`,{hot:true,keep:true});sfxCanto(En.pend.nivel);}
  else{await wait(400);toast(`Ahora ${esc(En.nombres[1])} contesta tu ${TXT_TRUCO(En.pend.nivel).toLowerCase()}`);}}
let toastT=0;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),FAST?10:2600);}

/* ───────── El turno ───────── */
// Aplica la acción de q (0 = yo, 1 = el rival) sobre la partida que manejo y muestra lo que pasó.
// ¿Esta jugada resuelve un envido o una flor? Entonces el tanteador espera a que se digan los tantos.
function retieneTantos(Ea,En,a){if(!Ea||!En||FAST)return false;const pe=Ea.pend&&Ea.pend.k;
  return (pe==='env'&&(a.t==='quiero'||a.t==='noquiero'||a.t==='flor'))||pe==='flor'||pe==='cfr'||(a.t==='flor'&&!!En.flor);}
async function aplicar(q,a){
  const Ea=E,desde=a.t==='carta'?origenCarta(q,a.c):null;
  const err=jugar(M,q,a);if(err)return err;
  let retuve=false;if(Ea&&!Ea.fin){const En0=estadoPara(M,0,false);if(retieneTantos(Ea,En0,a)&&(En0.tantos[0]!==Ea.tantos[0]||En0.tantos[1]!==Ea.tantos[1])){TANTOS_VIS=Ea.tantos.slice();retuve=true;}}
  refrescar();guardar();
  if(MODO==='host')enviarEstado();
  render();if(a.t==='carta'){volar(q,a.c,desde);sfx('carta');if(E.bazas.length>Ea.bazas.length&&!E.finMano){await wait(250);sfx('baza');}}
  await anunciar(q,a,Ea,E);if(retuve)soltarTantos();
  seguir();return null;
}
let ESPERA_YO=false,PEND_TOK=0;
async function jugarYo(a){
  if(!E)return;
  // Si todavía se está mostrando lo anterior (por ejemplo los tantos del envido), la jugada espera y sale después: no se pierde el toque.
  if(BUSY){if(ESPERA_YO||MODO==='guest')return;ESPERA_YO=true;try{while(BUSY)await sleep(60);}finally{ESPERA_YO=false;}if(!M||quienJuega(M)!==0)return;}
  closePick();
  if(MODO==='guest'){if(!ON||ON.state!=='on'){toast('Se cortó la conexión con la mesa.');return;}if(PEND_GUEST){toast('Un momento: esperando a la mesa…');return;}
    PEND_GUEST=true;const pt=++PEND_TOK;renderMe();netSend({t:'accion',a,n:E.n});setTimeout(()=>{if(PEND_GUEST&&pt===PEND_TOK){PEND_GUEST=false;renderMe();toast('La mesa no contesta. Si tu amigo salió de la app, avisale que vuelva.');}},6000);return;}
  if(!M||quienJuega(M)!==0)return;
  BUSY=true;try{const err=await aplicar(0,a);if(err)toast(esc(err));}finally{BUSY=false;}
}
function seguir(){
  if(MODO==='guest'||!M)return;
  if(M.fin){setTimeout(mostrarFin,FAST?0:900);return;}
  if(M.H.fin){setTimeout(mostrarFinMano,FAST?0:1100);return;}
  if(quienJuega(M)===1&&MODO==='compu')turnoCompu();
  if(quienJuega(M)===0&&AUTO)setTimeout(autoYo,FAST?0:300);
}
async function turnoCompu(){
  const tok=++BOTTOK,M0=M,acc0=M.acc||0,V=vistaDe(M,1);let a;
  try{a=decidir(V,CFG.dif);}catch(e){console.warn('compu',e);a=V.acciones.find(x=>x.t==='carta')||V.acciones[0];}
  const pausa=a.t==='carta'?650+Math.random()*450:a.t==='quiero'||a.t==='noquiero'?900+Math.random()*700:750+Math.random()*450;
  await wait(pausa);
  if(tok!==BOTTOK||M!==M0||MODO!=='compu'||quienJuega(M)!==1)return;
  if((M.acc||0)!==acc0){turnoCompu();return;}   // mientras pensaba cambió la mesa: vuelve a pensar con lo nuevo
  const err=await aplicar(1,a);
  if(err){console.warn('compu',err,a);const b=vistaDe(M,1).acciones.find(x=>x.t==='carta')||vistaDe(M,1).acciones.find(x=>x.t==='quiero');if(b)await aplicar(1,b);}
}
// Para las pruebas: la compu juega también por vos (#auto).
function autoYo(){if(!M||M.fin||M.H.fin||quienJuega(M)!==0||BUSY)return;const a=decidir(vistaDe(M,0),'normal');jugarYo(a);}

function center(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('center');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}
function hideCenter(){$('center').hidden=true;}
function lineasMano(){
  const F=E.finMano,L=[],yo=E.nombres[0],el=E.nombres[1];
  if(E.env){const g=E.env.gano,c=E.env.canto.map(k=>ENVN[k]).join(' · ');
    L.push([`${c}`,E.env.quiso?`${g===0?'Vos':esc(el)} +${E.env.pts}`+(E.env.suyo!=null?` <small>(tenías ${E.env.mio}; ${esc(el)} ${E.env.suyo})</small>`:` <small>(tenías ${E.env.mio})</small>`):`${g===0?'Vos':esc(el)} +${E.env.pts} <small>(no ${g===0?'quiso':'quisiste'})</small>`]);}
  if(E.flor){const g=E.flor.g,F2=E.flor;L.push([F2.como==='flor'?'Flor':F2.como==='se achicó'?'Flor <small>(con flor me achico)</small>':F2.como==='contraflor'?'Contraflor':F2.como==='contraflor al resto'?'Contraflor al resto':'Contraflor al resto <small>(no quiso)</small>',
    `${g===0?'Vos':esc(el)} +${F2.pts}`+(F2.comp&&F2.f?` <small>(${F2.f[0]} a ${F2.f[1]})</small>`:'')]);}
  if(F){const quien=F.gano===0?'Vos':esc(el),niv=F.nivel?TXT_TRUCO(F.nivel).toLowerCase()+' querido':'sin truco';
    const como=F.por==='ganó las bazas'?niv:F.por==='se fue al mazo'?`${F.gano===0?esc(el)+' se fue':'te fuiste'} al mazo`:/^no quiso/.test(F.por)?`no ${F.gano===0?'quiso':'quisiste'} el ${F.por.replace('no quiso el ','')}`:F.por;
    if(F.pts)L.push([`La mano <small>(${como})</small>`,`${quien} +${F.pts}`]);}
  return L.map(([a,b])=>`<div><span>${a}</span><b>${b}</b></div>`).join('');
}
// Logros y retos (v60): lo de cada mano se cuenta una vez (la clave es la partida y la mano), también al reanudar o en línea.
const LG=()=>window.LOGROS&&(!AUTO||window.LOGROS_TEST);
function lgMano(){if(!LG()||!E||!E.finMano)return;const F=E.finMano,k='t'+(E.id||'')+':'+E.n,L=LOGROS;
  try{let pts=0;
    if(F.gano===0){L.evento('truco','manos',1,k);pts+=F.pts||0;if(F.nivel>=1&&F.pts>1)L.evento('truco','trucos',1,k);if(F.nivel>=2&&F.pts>2)L.evento('truco','retrucos',1,k);if(F.nivel>=3&&F.pts>=4)L.evento('truco','vale4',1,k);}
    if(E.env&&E.env.gano===0){pts+=E.env.pts||0;L.evento('truco','envidos',1,k);if(E.env.quiso&&(E.env.canto||[]).includes('F'))L.evento('truco','falta',1,k);}
    if(E.miEnvido===33)L.evento('truco','env33',1,k);
    if(pts)L.evento('truco','tantos',pts,k);

function anotSumar(i,v,txt){

/* ───────── En línea con un amigo ─────────
   Como en PoblAR: la invitación viaja por la planilla (sin códigos de sala) y la partida va directo entre los
   dos celulares (WebRTC, con servidores públicos STUN/TURN de ayuda). El que invita reparte y lleva la partida;
   al otro le manda sólo lo que puede ver: nunca sus cartas. */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}
const ICE=[{urls:'stun:stun.l.google.com:19302'},{urls:['turn:eu-0.turn.peerjs.com:3478','turn:us-0.turn.peerjs.com:3478'],username:'peerjs',credential:'peerjsp'}];
async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

async function recibirEstado(En){
  const Ea=E;PEND_GUEST=false;MODO='guest';M=null;BOTTOK++;
  const misma=Ea&&Ea.id===En.id,nueva=misma&&Ea.n===En.n&&En.acc>Ea.acc&&En.ultimo;
  if(!misma){FIN_VISTO=null;limpiarDichos();hideCenter();sfx('repartir');if(ON)ON.otraYo=ON.otraEl=false;}
  else if(Ea.n!==En.n){FIN_VISTO=null;limpiarDichos();hideCenter();sfx('repartir');}
  const u=En.ultimo,desde=nueva&&u.a.t==='carta'?origenCarta(u.p,u.a.c):null;
  if(nueva&&retieneTantos(Ea,En,u.a)&&(En.tantos[0]!==Ea.tantos[0]||En.tantos[1]!==Ea.tantos[1]))TANTOS_VIS=Ea.tantos.slice();
  E=En;render();

  if(nueva){if(u.a.t==='carta'){volar(u.p,u.a.c,desde);sfx('carta');if(En.bazas.length>Ea.bazas.length&&!En.finMano){await wait(250);sfx('baza');}}await anunciar(u.p,u.a,Ea,En);}
  if(E===En)soltarTantos();else TANTOS_VIS=null;
  if(E===En){if(E.fin)setTimeout(mostrarFin,FAST?0:900);else if(E.finMano)setTimeout(mostrarFinMano,FAST?0:1100);}

function onMsg(m){
  if(m.t==='hola'){if(m.yo)ON.peer={...ON.peer,...m.yo};renderOnline();if(E)renderRival();return;}
  if(m.t==='mchat'){if(window.MESA_CHAT)MESA_CHAT.recibir({de:ON.peer.usuario,txt:m.txt});return;}
  if(m.t==='estado'&&ON.role==='guest'&&m.E){recibirEstado(m.E);return;}
  if(m.t==='accion'&&ON.role==='host'){
    if(!M||MODO!=='host'||quienJuega(M)!==1){enviarEstado();return;}
    (async()=>{while(BUSY)await sleep(120);BUSY=true;try{const err=await aplicar(1,m.a);if(err){netSend({t:'error',msg:err});enviarEstado();}}finally{BUSY=false;}})();return;}
  if(m.t==='listo'&&ON.role==='host'){ON.listo=m.n;intentarRepartir();return;}
  if(m.t==='otra'){
    if(enJuego())return;                                    // pedido viejo: ya arrancó otra
    ON.otraEl=true;if(ON.otraYo){revanchaArranca();return;}
    center(`<div class="ic">🔁</div><h3>${esc(ON.peer.usuario)} quiere la revancha</h3><p>Si aceptás, se reparte de nuevo desde cero.</p><button class="btn go" id="rv-si">Dale</button><button class="btn" id="rv-no">Ahora no</button>`);

/* v63: si el otro se corta en medio de la partida, no se lo da por ido enseguida. La partida espera (de a 2 la compu

async function esperarVueltaTruco(o){

      o.busca=RECON.buscarVuelta({prefijo:'TRUCO:',mesa:o.mesaId,de:host,hasta,vivo:()=>ON===o&&o.state==='reconectando',onInv:inv=>{UIQ.dismissed.add(inv.id);acceptInvite(inv,true);}});
      return;}}
  try{window.RECON&&RECON.olvidar('truco');RECON.quitar('truco-c');if(ON.busca)ON.busca.cancelar();if(ON.rv)ON.rv.cancelar();}catch(_){}
  const was=ON.state==='on',peer=ON.peer.usuario;ON.state='lost';clearTimeout(ON.tRep);try{ON.pc&&ON.pc.close();}catch(_){}
  if(MODO==='host'&&M&&!M.fin&&was){ON=null;MODO='compu';CFG.dif='normal';M.nombres[1]=peer+' 🤖';renderOnline();toast(`⚠️ ${esc(peer)} ${esc(why)}. Sigue la compu en su lugar.`);refrescar();render();guardar();if(M.H.fin){FIN_VISTO=null;mostrarFinMano();}else seguir();return;}

    $('lc-new').onclick=()=>{hideCenter();nuevaCompu();};$('lc-x').onclick=hideCenter;return;}
