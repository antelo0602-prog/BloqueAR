  const ic={bloquear:'🧱',poblar:'🏘️',truco:'🃏',uno:'🎴',ajedrez:'♟️'}[c.j]||'🎮',nom=GAMES[c.j]||'jugar';
  const est={esperando:mine?'Esperando que entre…':'Te está esperando',aceptada:mine?'✓ Entró':'✓ Entraste',rechazada:mine?'Dijo «ahora no»':'Dijiste «ahora no»',
    cancelada:mine?'La cancelaste':'La canceló',vencida:mine?'Venció':'Ya no está esperando',vieja:'Invitación anterior'}[e]||'';
  let btn='';
  if(busy)btn=`<span class="cx-inv-b"><i class="cx-spin"></i></span>`;
  else if(e==='esperando')btn=mine?`<span class="cx-inv-b"><button type="button" class="cx-inv-x" data-a="invcancel" data-id="${esc(c.inv)}">Cancelar invitación</button></span>`
    :`<span class="cx-inv-b"><button type="button" class="cx-inv-no" data-a="invno" data-id="${esc(c.inv)}">Ahora no</button><button type="button" class="cx-cplay" data-a="inventrar" data-id="${esc(c.inv)}" data-j="${esc(c.j)}">▶ Entrar</button></span>`;
  else if(e==='vencida'&&!mine)btn=`<span class="cx-inv-msg">Ya no está esperando. ¿Le mandás un mensaje o lo invitás vos?</span><span class="cx-inv-b"><button type="button" class="cx-cplay" data-a="invitar" data-u="${esc(otro)}">🎮 Invitarlo vos</button></span>`;
  return `<b>${ic} ${mine?`Invitaste a ${esc(otro)}`:`${esc(otro)} te invitó`} a ${esc(nom)}</b>${c.d?`<span>${esc(c.d)}</span>`:''}<span class="cx-inv-st st-${e}">${esc(est)}</span>${btn}`;

async function invAccion(a,id,j){

    try{sessionStorage.setItem(INV_KEY[j]||'blq-accept',id);}catch(_){}

  catch(e){S.err=String(e.message||e);}

function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card&&o.card.inv)return '🎮 Te invitó a '+(GAMES[o.card.j]||'jugar');if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'💬 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;

  else if(a==='volver'){S.delFor=null;if(S.view==='perfil'&&S.con){S.view='conv';}else{S.view='list';S.con=null;}S.pickFor=null;S.invFor=null;S.card=null;render();}
  else if(a==='modo'){ST.m=b.dataset.m;ls.set('bloques-chat-modo',ST.m);modeBtns();poll();}
  else if(a==='perfil')openProfile(b.dataset.u);
  else if(a==='invitar'){S.invFor=b.dataset.u;$('.cx-panel').dataset.sig='';render();}
  else if(a==='invx'){S.invFor=null;$('.cx-panel').dataset.sig='';render();}
  else if(a==='inv'){const who=S.invFor,g=b.dataset.g;S.invFor=null;close();if(g==='ajedrez'&&H.game()!=='ajedrez'){location.href='ajedrez.html#invitar='+encodeURIComponent(who);return;}try{H.invite&&H.invite(g,who);}catch(_){}}
  else if(a==='sharecon')shareTo(b.dataset.u);
  else if(a==='inventrar'||a==='invno'||a==='invcancel')invAccion(a,b.dataset.id,b.dataset.j);
  else if(a==='cardplay'){const o=S.plain[b.dataset.id];if(o&&o.card&&o.card.j==='ajedrez'&&H.game()!=='ajedrez'){close();location.href='ajedrez.html'+(o.card.aj?'#partida='+encodeURIComponent(o.card.aj):'');return;}if(o&&o.card&&H.play){close();try{H.play(o.card);}catch(_){}}}
  else if(a==='cuenta'){close();H.account();}
  else if(a==='activar')activate();
  else if(a==='verpin'){S.pinAsk=true;$('.cx-panel').dataset.sig='';render();setTimeout(()=>$('#cx-pin')?.focus(),50);}
  else if(a==='pinx'){S.pinAsk=false;S.err='';$('.cx-panel').dataset.sig='';render();}
  else if(a==='enviar')send();
  else if(a==='zumbido')buzz();
  else if(a==='permiso'){try{await Notification.requestPermission();}catch(_){}render();}
  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);
  else if(a==='borrar'){S.delFor=lc(S.delFor)===lc(b.dataset.u)?null:b.dataset.u;render();}
  else if(a==='borrarno'){S.delFor=null;render();}
  else if(a==='borrarsi')borrarChat(b.dataset.u);
  else if(a==='reintentar')reintentar(b.dataset.id);
  else if(a==='descartar')descartar(b.dataset.id);
}
// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}
/* v63: el chat «null». La respuesta de la planilla tarda unos segundos; si mientras tanto volvías a la lista
   (S.con=null) el mensaje se guardaba con para=null y aparecía una charla llamada «null». Ahora el destinatario
   se toma una sola vez al tocar Enviar, y si no se pudo mandar queda en su charla con «No se mandó · Reintentar». */
async function send(){
  const ta=$('#cx-in'),para=S.con;if(!ta||!nombreOk(para))return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const pl=JSON.stringify({x:txt}),tmp={id:'tmp'+Date.now()+Math.random().toString(36).slice(2,6),de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:Date.now(),tmp:true};
  S.plain[tmp.id]={x:txt};S.msgs.push(tmp);saveMsgs();render();
  await mandar(tmp);
}
async function mandar(tmp){
  tmp.fail=false;tmp.sending=true;$('.cx-panel')&&($('.cx-panel').dataset.sig='');render();
  try{
    const j=await call(auth({accion:'enviar',para:tmp.para,tipo:'msg',p:tmp.p}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    if(!S.msgs.some(x=>x.id===j.id)){const m={id:j.id,de:S.me,para:tmp.para,tipo:'msg',cont:'',p:tmp.p,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]=S.plain[tmp.id];}
    delete S.plain[tmp.id];saveMsgs();if(lc(S.con)===lc(tmp.para))S.err='';
  }catch(e){tmp.sending=false;tmp.fail=true;tmp.why=sinV12(e);saveMsgs();}
  if($('.cx-panel'))$('.cx-panel').dataset.sig='';render();
}
function reintentar(id){const m=S.msgs.find(x=>x.id===id&&x.tmp);if(m&&!m.sending)mandar(m);}
function descartar(id){const i=S.msgs.findIndex(x=>x.id===id&&x.tmp);if(i>=0){S.msgs.splice(i,1);delete S.plain[id];saveMsgs();$('.cx-panel').dataset.sig='';render();}}
async function shareTo(name){
  const c=S.card;if(!c||!nombreOk(name))return;const note=String(($('#cx-snote')||{}).value||'').trim().slice(0,200);
  try{const pl=JSON.stringify({x:note,card:c}),j=await call(auth({accion:'enviar',para:name,tipo:'msg',p:pl}));
    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();
    S.card=null;S.con=name;S.view='conv';S.err='';$('.cx-panel').dataset.sig='';render();}
  catch(e){S.err=sinV12(e);const el=$('.cx-panel');if(el){el.dataset.sig='';}render();}
}
function share(card){ensureDom();S.card=card;S.view='share';S.open=true;$('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;$('.cx-panel').dataset.sig='';try{H.onOpen();}catch(_){}render();loadUsers().then(()=>{if(S.view==='share')render();});}
async function buzz(){
  const para=S.con;if(!nombreOk(para))return;if(Date.now()-S.zbAt<8000){S.err='Esperá un poquito para mandar otro zumbido.';render();return;}
  S.zbAt=Date.now();shake();beep('zumbido');
  try{const j=await call(auth({accion:'enviar',para,tipo:'zumbido'}));S.msgs.push({id:j.id,de:S.me,para,tipo:'zumbido',cont:'',ref:'',t:j.t});saveMsgs();S.err='';}
  catch(e){if(lc(S.con)===lc(para))S.err=String(e.message||e);}
  render();
}
async function react(id,e){
  S.pickFor=null;const m=S.msgs.find(x=>x.id===id);if(!m)return;const para=other(m);if(!nombreOk(para))return;
  const mine=S.msgs.filter(x=>x.tipo==='reac'&&x.ref===id&&lc(x.de)===lc(S.me)).pop(),cur=mine&&S.plain[mine.id]&&S.plain[mine.id].e;
  const val=cur===e?'':e;
  try{const pl=JSON.stringify({e:val}),j=await call(auth({accion:'enviar',para,tipo:'reac',p:pl,ref:id}));
    const r={id:j.id,de:S.me,para,tipo:'reac',cont:'',p:pl,ref:id,t:j.t};S.msgs.push(r);S.plain[r.id]={e:val};saveMsgs();S.err='';}
  catch(err){if(lc(S.con)===lc(para))S.err=sinV12(err);}
  render();
}
function open(name){
  ensureDom();S.open=true;S.err=S.unsupported?S.err:'';
  if(nombreOk(name)){S.con=name;S.view='conv';}else if(S.view!=='conv'||!nombreOk(S.con)){S.view='list';S.con=null;}
  $('.cx-panel').hidden=false;$('.cx-scrim').hidden=false;document.documentElement.classList.add('cx-on');
  try{H.onOpen();}catch(_){}
  render();loadUsers().then(render);poll();
}
function close(){
  S.open=false;S.pickFor=null;const p=$('.cx-panel');if(p){p.hidden=true;$('.cx-scrim').hidden=true;}document.documentElement.classList.remove('cx-on');
  try{H.onClose();}catch(_){}schedule();
}

   Cartas: número (1-7, 10-12) y palo (e espadas, b bastos, o oros, c copas), como texto: '1e', '12c'.
   La partida (M) tiene todo; cada jugador (y la compu) sólo ve lo suyo con vistaDe(M,p). */
const PALOS=['e','b','o','c'],NUMS=[1,2,3,4,5,6,7,10,11,12];
const PNOM={e:'espadas',b:'bastos',o:'oros',c:'copas'};
const cN=c=>parseInt(c,10),cP=c=>c.slice(-1);
// Jerarquía del truco: ancho de espadas, ancho de bastos, 7 de espadas, 7 de oros, 3, 2, anchos falsos, 12, 11, 10, 7 falsos, 6, 5, 4.
function rango(c){const n=cN(c);
  if(c==='1e')return 14;if(c==='1b')return 13;if(c==='7e')return 12;if(c==='7o')return 11;
  return {3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1}[n];}
const envVal=c=>{const n=cN(c);return n<=7?n:0;};
// Envido: dos del mismo palo suman 20 más sus valores (las figuras valen 0); si no, vale la carta más alta.
function envidoDe(cards){let best=-1;
  for(const p of PALOS){const v=cards.filter(c=>cP(c)===p).map(envVal).sort((a,b)=>b-a);if(v.length>=2)best=Math.max(best,20+v[0]+v[1]);}
  return best>=0?best:Math.max(0,...cards.map(envVal));}
function mazo(){const d=[];for(const p of PALOS)for(const n of NUMS)d.push(n+p);return d;}
function rngDe(seed){let s=(seed>>>0)||1;return ()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function mezclar(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}
function nombreCarta(c){const n=cN(c),p=cP(c);
  if(c==='1e')return 'el ancho de espadas';if(c==='1b')return 'el ancho de bastos';
  return `el ${n} de ${PNOM[p]}`;}
const TRUCO_N=['','Truco','Retruco','Vale cuatro'];
const ENV_N={E:'Envido',R:'Real envido',F:'Falta envido'};
const valorTruco=l=>l+1;// sin truco 1; truco 2; retruco 3; vale cuatro 4

/* ───── Partida ───── */
// Azar de verdad para repartir (con semilla sólo en las pruebas). El número de partida que viaja es otro y no sirve para adivinar el mazo.
function azar(){try{const c=globalThis.crypto;if(c&&c.getRandomValues){const u=new Uint32Array(1);return ()=>{c.getRandomValues(u);return u[0]/4294967296;};}}catch(_){}return Math.random;}
function nuevaPartida(o={}){

  const id=Math.floor(azar()()*2**31).toString(36)+Math.floor(azar()()*2**31).toString(36);
  return {v:1,id,meta:o.meta===15?15:30,seed,tantos:[0,0],nombres:o.nombres||['Vos','La compu'],n:0,mano:o.mano??(R()<.5?0:1),H:null,fin:false,gano:null,log:[],
    ultimo:null};

function repartir(M,cartas){

  let d=cartas;if(!d){const R=M.seed?rngDe((M.seed+M.n*2654435761)>>>0):azar();d=mezclar(mazo(),R);}
  M.H={n:M.n,cartas:[d.slice(0,3),d.slice(3,6)],repartidas:[d.slice(0,3),d.slice(3,6)],jugadas:[[],[]],baza:0,bazas:[],abre:M.mano,turno:M.mano,
    env:{canto:[],hecho:false,res:null},tru:{nivel:0,quiero:null},pend:null,susp:null,fin:false,gano:null,pts:0,por:''};
  M.ultimo=null;

function anotar(M,t){M.log.push(t);if(M.log.length>200)M.log.splice(0,M.log.length-200);}
const quienJuega=M=>{const H=M.H;if(!H||H.fin||M.fin)return -1;return H.pend?1-H.pend.por:H.turno;};
// Envido: sólo en la primera baza, antes de tirar tu carta y mientras no se haya querido el truco.
const puedeEnvido=(M,p)=>{const H=M.H;return H.baza===0&&!H.env.hecho&&H.jugadas[p].length===0&&H.tru.nivel===0;};
function envSiguientes(canto){
  if(canto.includes('F'))return [];
  const e=canto.filter(x=>x==='E').length,r=canto.includes('R'),out=[];
  if(!r&&e<2&&canto.length===e)out.push('E');
  if(!r)out.push('R');
  out.push('F');return out;}
const faltaVale=M=>Math.max(1,M.meta-Math.max(M.tantos[0],M.tantos[1]));
const envQuerido=(canto,M)=>canto.includes('F')?faltaVale(M):canto.reduce((a,k)=>a+(k==='E'?2:3),0);

// Qué puede hacer p ahora (para los botones y para validar).
function acciones(M,p){
  const H=M.H,out=[];if(quienJuega(M)!==p)return out;
  if(H.pend){
    out.push({t:'quiero'},{t:'noquiero'});
    if(H.pend.k==='env'){for(const k of envSiguientes(H.env.canto))out.push({t:'env',k});}
    else{if(H.pend.nivel<3)out.push({t:'truco'});
      if(puedeEnvido(M,p))for(const k of ['E','R','F'])out.push({t:'env',k,primero:true});}
    return out;}
  for(const c of H.cartas[p])out.push({t:'carta',c});
  if(puedeEnvido(M,p))for(const k of ['E','R','F'])out.push({t:'env',k});
  if(puedeTruco(M,p))out.push({t:'truco'});

}
const mismaAccion=(a,b)=>a.t===b.t&&(a.c||'')===(b.c||'')&&(a.k||'')===(b.k||'');
// Aplica una acción de p. Devuelve null si se pudo, o el motivo si no vale.
function jugar(M,p,a){

  if(!acciones(M,p).some(x=>mismaAccion(x,a)))return 'Eso no se puede ahora.';
  const yo=M.nombres[p],otro=1-p;
  M.ultimo={p,a:{...a}};M.acc=(M.acc||0)+1;
  if(H.pend){
    if(H.pend.k==='env'){
      if(a.t==='quiero')return resolverEnvido(M,true);
      if(a.t==='noquiero')return resolverEnvido(M,false);
      H.env.canto.push(a.k);H.pend={k:'env',por:p};anotar(M,`${yo}: «${ENV_N[a.k]}».`);return null;}
    const L=H.pend.nivel;
    if(a.t==='quiero'){H.tru.nivel=L;H.tru.quiero=p;H.pend=null;anotar(M,`${yo}: «Quiero».`);return null;}
    if(a.t==='noquiero'){anotar(M,`${yo}: «No quiero».`);return terminarMano(M,H.pend.por,L,'no quiso el '+TRUCO_N[L].toLowerCase());}
    if(a.t==='truco'){H.tru.nivel=L;H.tru.quiero=p;H.pend={k:'truco',nivel:L+1,por:p};anotar(M,`${yo}: «Quiero ${TRUCO_N[L+1].toLowerCase()}».`);return null;}
    if(a.t==='env'){H.susp=H.pend;H.env.canto=[a.k];H.pend={k:'env',por:p};anotar(M,`${yo}: «El envido está primero: ${ENV_N[a.k].toLowerCase()}».`);return null;}
    return 'Eso no se puede ahora.';
  }
  if(a.t==='carta'){
    const i=H.cartas[p].indexOf(a.c);H.cartas[p].splice(i,1);H.jugadas[p].push(a.c);
    anotar(M,`${yo} tira ${nombreCarta(a.c)}.`);
    if(H.jugadas[otro].length>H.baza)return cerrarBaza(M);
    H.turno=otro;return null;}
  if(a.t==='env'){H.env.canto=[a.k];H.pend={k:'env',por:p};anotar(M,`${yo}: «${ENV_N[a.k]}».`);return null;}
  if(a.t==='truco'){H.pend={k:'truco',nivel:H.tru.nivel+1,por:p};anotar(M,`${yo}: «${TRUCO_N[H.tru.nivel+1]}».`);return null;}
  if(a.t==='mazo'){anotar(M,`${yo} se va al mazo.`);return terminarMano(M,otro,valorTruco(H.tru.nivel),'se fue al mazo');}

function resolverEnvido(M,quiso){
  const H=M.H,canto=H.env.canto,canta=H.pend.por,resp=1-canta;let gano,pts;

  if(!quiso){gano=canta;pts=envNoQuerido(canto);anotar(M,`${M.nombres[resp]}: «No quiero». ${M.nombres[canta]} suma ${pts}.`);}
  else{pts=envQuerido(canto,M);gano=e[0]>e[1]?0:e[1]>e[0]?1:M.mano;
    const pie=1-M.mano;anotar(M,`${M.nombres[resp]}: «Quiero». ${M.nombres[M.mano]}: «Tengo ${e[M.mano]}». ${M.nombres[pie]}: «${gano===pie?e[pie]+' son mejores':'Son buenas'}».`);
    anotar(M,`${M.nombres[gano]} gana el envido: ${pts} ${pts===1?'punto':'puntos'}.`);}

  H.pend=null;if(H.susp){H.pend=H.susp;H.susp=null;}

function sumar(M,p,pts){M.tantos[p]=Math.min(M.meta,M.tantos[p]+pts);if(M.tantos[p]>=M.meta&&!M.fin){M.fin=true;M.gano=p;if(M.H){M.H.fin=true;M.H.pend=null;M.H.susp=null;if(M.H.gano==null){M.H.gano=p;M.H.por='llegó a '+M.meta;}}anotar(M,`🏆 ${M.nombres[p]} llegó a ${M.meta} y gana la partida.`);}}
// Quién gana la mano según las bazas ('p' es parda).
function ganadorMano(bz,mano){

  if(bz.length===2){if(a!=='p'&&(b===a||b==='p'))return a;if(a==='p'&&b!=='p')return b;return null;}

function cerrarBaza(M){

  const g=ganadorMano(H.bazas,M.mano);
  if(g!==null)return terminarMano(M,g,valorTruco(H.tru.nivel),'ganó las bazas');

}
function terminarMano(M,g,pts,por){

  anotar(M,`${M.nombres[g]} gana la mano: ${pts} ${pts===1?'punto':'puntos'}.`);

// Lo que ve el jugador p: sus cartas, lo jugado, los cantos y los tantos. Nunca las cartas del otro.
function vistaDe(M,p){

  if(H.env.res){const r=H.env.res,pie=1-M.mano;
    // El que gana el envido lo dice; el que pierde lo dijo sólo si es mano (el pie dice «son buenas»).
    env={quiso:r.quiso,pts:r.pts,gano:r.gano,canto:r.canto.slice(),suyo:r.quiso?(r.gano===o||o===M.mano?r.e[o]:null):null,mio:r.e[p]};}

    jugadas:[H.jugadas[0].slice(),H.jugadas[1].slice()],bazas:H.bazas.slice(),baza:H.baza,abre:H.abre,turno:H.turno,

    lesQuedan:H.cartas[o].length,fin:H.fin,acciones:acciones(M,p)};

/* ───── La compu ─────
   Decide sólo con la vista (vistaDe): no ve tus cartas. Para el truco imagina muchas manos posibles tuyas
   (con las cartas que no vio) y calcula cuántas veces gana jugando bien. */
const NIVEL_IA={
  facil:{mc:0,farol:0,error:.16,envCanta:29,envQuiere:27,truCanta:.82,truQuiere:.5,sube:.93},
  normal:{mc:40,farol:.06,error:.08,envCanta:27,envQuiere:25,truCanta:.72,truQuiere:.4,sube:.92},// un jugador razonable le gana cerca de 4 de cada 10
  dificil:{mc:200,farol:.06,error:0,envCanta:26,envQuiere:25,truCanta:.75,truQuiere:.5,sube:.85}};
// Manos posibles del rival que coinciden con lo que se vio (cartas jugadas y lo que dijo en el envido).
function manosPosibles(V,N,R){

  while(out.length<N&&tries<N*40){tries++;mezclar(pool,R);const h=pool.slice(0,need),full=[...V.jugadas[o],...h];
    if(V.env&&V.env.quiso){const e=envidoDe(full);
      if(V.env.suyo!=null){if(e!==V.env.suyo)continue;}
      else{if(e>V.env.mio||(e===V.env.mio&&o===V.mano))continue;}}
    out.push(h);}
  return out;
}
// Con todas las cartas a la vista: ¿gana p jugando los dos lo mejor posible? (1 o 0)
function resolver(manos,bz,mesa,turno,abre,mano,p){
  const g=ganadorMano(bz,mano);if(g!==null)return g===p?1:0;

  for(let i=0;i<cs.length;i++){const c=cs[i],nm=[manos[0],manos[1]];nm[q]=cs.filter((_,j)=>j!==i);let v;
    if(!mesa)v=resolver(nm,bz,{c,q},1-q,q,mano,p);

    if(q===p){if(v>best)best=v;if(best===1)break;}else{if(v<best)best=v;if(best===0)break;}}
  return best;
}
// Estado de la mesa desde la vista: la carta que está esperando respuesta en esta baza.
function mesaDe(V){const b=V.baza,a=V.abre;if(V.jugadas[a].length>b&&V.jugadas[1-a].length===b)return {c:V.jugadas[a][b],q:a};return null;}
// Probabilidad de ganar la mano (y la mejor carta) promediando sobre manos posibles del rival.
function chances(V,N,R,peso){
  const o=1-V.p,ms=manosPosibles(V,N,R);if(!ms.length)return {p:.5,carta:V.mias[0]};

      for(let i=0;i<V.mias.length;i++){const c=V.mias[i],nm=[manos[0],manos[1]];nm[V.p]=V.mias.filter((_,j)=>j!==i);let v;
        if(!mesa)v=resolver(nm,V.bazas,{c,q:V.p},o,V.p,V.mano,V.p);

// Fuerza simple de una mano (0 a 1): para la compu fácil y para pesar qué manos cantan truco.
function fuerza(cs){const r=cs.map(rango).sort((a,b)=>b-a);return Math.min(1,((r[0]||0)*1.2+(r[1]||0)*.8+(r[2]||0)*.4)/32);}

  const c=est(null);

      if(R()<P.error)return R()<.5?{t:'quiero'}:{t:'noquiero'};

      const umbral=P.envQuiere+extraEnv+(canto.includes('R')?1:0)+(acc>=5?1:0);

    const L=H.pend.nivel;
    if(has('env','E')&&envEq>=P.envCanta+extraEnv+1)return {t:'env',k:envEq>=31&&R()<.5?'R':'E'};
    if(R()<P.error)return R()<.6?{t:'quiero'}:{t:'noquiero'};

  let best=-1,quien=null,teams=new Set();

  const gana=c=>rango(c)>best,empata=c=>rango(c)===best;
  if(!yaJ.length){// arranco la baza
    if(b===0)return {t:'carta',c:ord[Math.min(1,ord.length-1)]};
    if(gan>0)return {t:'carta',c:ord[0]};               // ya ganamos una: que se la jueguen los otros
    return {t:'carta',c:ord[ord.length-1]};}

    if(rivDesp===0)return {t:'carta',c:mata[0]};

  const tapa=ord.find(empata);

}

let ESPERA_YO=false,PEND_TOK=0;
async function jugarYo(a){

  if(BUSY){if(ESPERA_YO||MODO==='guest')return;ESPERA_YO=true;try{while(BUSY)await sleep(60);}finally{ESPERA_YO=false;}if(!M||quienJuega(M)!==0)return;}

    PEND_GUEST=true;const pt=++PEND_TOK;renderMe();netSend({t:'accion',a,n:E.n});setTimeout(()=>{if(PEND_GUEST&&pt===PEND_TOK){PEND_GUEST=false;renderMe();toast('La mesa no contesta. Si tu amigo salió de la app, avisale que vuelva.');}},6000);return;}
  if(!M||quienJuega(M)!==0)return;

function seguir(){

async function turnoCompu(){

    if(E.env&&E.env.gano===0){pts+=E.env.pts||0;L.evento('truco','envidos',1,k);if(E.env.quiso&&(E.env.canto||[]).includes('F'))L.evento('truco','falta',1,k);}

    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}

let QESPERA=false;
async function eqJugarYo(a){

  if(QBUSY){if(QESPERA||QMODO==='guest')return;QESPERA=true;try{while(QBUSY)await sleep(60);}finally{QESPERA=false;}if(!Q||Q.fin||Q.H.fin||(a.t==='carta'&&eqQuienJuega(Q)!==0))return;}
  eqClosePick();

    setTimeout(()=>{if(QPEND){QPEND=false;if(QE)eqRenderMe();}},6000);return;}
  if(!Q)return;
  QBUSY=true;try{const err=await eqAplicar(0,a);if(err)toast(esc(err));else if(a.t==='sena')toast('Les hiciste la seña a tus compañeros');}finally{QBUSY=false;}
}
function eqSeguir(){

  if(Q.tipos[q]==='bot')eqTurnoBot(q);

}
async function eqTurnoBot(q){
  const tok=++QTOK,Q0=Q;let a;
  try{a=eqDecidir(Q,q,CFG.dif);}catch(e){console.warn('compu',e);a=eqAcciones(Q,q).find(x=>x.t==='carta')||eqAcciones(Q,q)[0];}
  if(!a)return;
  const pausa=(a.t==='carta'?600+Math.random()*450:a.t==='quiero'||a.t==='noquiero'?900+Math.random()*600:750+Math.random()*450)+Math.max(0,QHOLD-Date.now());
  await wait(pausa);
  if(tok!==QTOK||Q!==Q0||!Q||eqQuienJuega(Q)!==q||Q.tipos[q]!=='bot')return;
  while(QBUSY)await sleep(60);
  if(tok!==QTOK||Q!==Q0||eqQuienJuega(Q)!==q)return;
  QBUSY=true;let err;try{err=await eqAplicar(q,a);}finally{QBUSY=false;}
  if(err){console.warn('compu',err,a);const A=eqAcciones(Q,q),b=A.find(x=>x.t==='carta')||A.find(x=>x.t==='quiero');if(b){QBUSY=true;try{await eqAplicar(q,b);}finally{QBUSY=false;}}}
}

  if(o.role==='host'){for(const L of o.mesa.lugares){if(L.tipo==='invitado'&&L.id){const a=acct();if(a)lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:L.id}).catch(()=>{});}L.soltado=true;if(L.ch)eqSendCh(L.ch,{t:'bye'});try{L.pc&&L.pc.close();}catch(_){}}
    if(Q&&QMODO==='host'){// lo que queda lo juega la compu
      Q.tipos=Q.tipos.map((t,i)=>i&&t==='humano'?'bot':t);QMODO='compu';}}
  else{eqSendCh(o.ch,{t:'bye'});try{o.pc&&o.pc.close();}catch(_){}if(QMODO==='guest'){QE=null;QMODO='compu';}}
