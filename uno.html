<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="BloqueAR">
<title>UnoAR</title>
<style>
/* UnoAR: una mesa de club. Madera oscura, paño azul petróleo y cartas de colores dibujadas en el código. */
:root{--bg:#101418;--line:#2a3440;--ink:#eef1ea;--dim:#a7b2b9;--aqua:#7ce9e5;--gold:#f6c453;
  --wood:#2b1f16;--wood2:#1d140d;--felt:#1f4250;--felt2:#163240;--stitch:rgba(214,226,206,.22);
  --parch:#f2ead8;--parch2:#e7dcc4;--rule:#cdbb98;--brown:#2a2118;--soft:#7d6d58;--olive:#3f7a5a;--olive2:#2d5c43;--clay:#a3482f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --cw:84px;--ch:126px;--pw:92px;--ph:138px}
*{box-sizing:border-box}
html{background:var(--bg);height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{margin:0;height:100%;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{position:fixed;inset:0 0 auto 0;height:var(--app-h,100%);display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));background:var(--bg);flex:none;border-bottom:1px solid #1f2830}
.brand{font-weight:800;letter-spacing:.12em;font-size:15px;white-space:nowrap;display:flex;align-items:center}.brand span{color:#e0a93b}
.beta{margin-left:8px;font:700 10px/1 system-ui,-apple-system,sans-serif;font-style:normal;letter-spacing:.06em;color:#cfd8d2;border:1px solid #455261;border-radius:6px;padding:3px 5px 2px}
.icon-btn{margin-left:auto;min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#18202a;font-size:17px;display:grid;place-items:center;text-decoration:none;color:var(--ink);position:relative}
.icon-btn+.icon-btn{margin-left:0}
.icon-btn[hidden]{display:none}
.games-btn{margin-left:0;display:grid;grid-template-columns:repeat(2,6px);grid-template-rows:6px 6px auto;gap:2px;place-content:center;padding:0;min-width:44px;align-content:center}
.games-btn i{width:6px;height:6px;background:var(--aqua);border-radius:2px}.games-btn i:nth-child(4){background:var(--gold)}
.games-btn b{grid-column:1/-1;font:800 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.02em;color:#d5e6ea;margin-top:2px;text-align:center;white-space:nowrap}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e0503f;color:#fff;font:800 11px/18px system-ui;padding:0 5px}
.badge:empty{display:none}
/* La mesa */
.table{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;
  background:repeating-linear-gradient(92deg,rgba(0,0,0,.10) 0 2px,transparent 2px 9px,rgba(255,235,200,.03) 9px 10px,transparent 10px 23px),linear-gradient(180deg,var(--wood),var(--wood2))}
.seats{flex:none;display:flex;gap:8px;justify-content:flex-start;padding:10px max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));overflow-x:auto;scrollbar-width:none}
.seats::-webkit-scrollbar{display:none}
.seats>:first-child{margin-left:auto}.seats>:last-child{margin-right:auto}
.seats.many{gap:6px}.seats.many .seat{width:64px;padding-top:7px}.seats.many .seat .fan{position:absolute;top:4px;right:8px;width:0;height:0}.seats.many .seat .fan .card{display:none}.seats.many .seat .cnt{top:0;right:-10px}.seats.many .seat b{font-size:11.5px;max-width:60px}.seats.many .av{width:30px;height:30px;font-size:16px}
.seat{position:relative;flex:0 0 auto;width:96px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px 5px;border-radius:14px;background:rgba(10,14,18,.4);box-shadow:inset 0 0 0 1px rgba(214,226,206,.10);transition:box-shadow .2s,background .2s}
.seat.turn{background:rgba(224,169,59,.14);box-shadow:inset 0 0 0 2px #e0a93b,0 0 18px rgba(224,169,59,.25)}
.seat.out{opacity:.55}
.seat .av{width:36px;height:36px;font-size:19px}
.seat b{max-width:90px;font:700 13px/1.15 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat small{font-size:11px;color:var(--dim);white-space:nowrap}
.seat .fan{position:relative;height:26px;width:62px}
.seat .fan .card{position:absolute;top:0;width:17px;height:26px;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat .cnt{position:absolute;right:-2px;top:4px;min-width:20px;height:20px;border-radius:10px;background:#f4ecdc;color:#2a2118;font:800 12px/20px system-ui;text-align:center;padding:0 4px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.seat .unoTag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font:800 10px/1 system-ui;letter-spacing:.06em;color:#2a1f12;background:#e0a93b;border-radius:6px;padding:3px 6px 2px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.seat .ring{position:absolute;inset:-2px;border-radius:15px;pointer-events:none}
.av{border-radius:50%;display:grid;place-items:center;background:var(--c,#3b5866);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25),0 0 0 2px rgba(214,226,206,.30);flex:none}
.say{position:absolute;z-index:6;left:50%;bottom:calc(100% - 6px);transform:translateX(-50%);max-width:180px;padding:5px 10px;border-radius:12px;background:var(--parch);color:var(--brown);font:700 14px/1.15 var(--serif);white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.45);border:1px solid var(--rule);pointer-events:none;animation:sayIn .2s ease-out}
@keyframes sayIn{from{opacity:0;transform:translate(-50%,5px) scale(.94)}}
/* Paño con el mazo y el pozo */
.felt{position:relative;flex:1;min-height:0;margin:2px max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left));border-radius:22px;
  background:radial-gradient(90% 70% at 50% 45%,#2b5867 0%,var(--felt) 55%,var(--felt2) 100%);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 0 40px rgba(0,0,0,.45),0 10px 24px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;gap:22px}
.felt::before{content:"";position:absolute;inset:7px;border-radius:17px;border:1.5px dashed var(--stitch);pointer-events:none}
.pile{position:relative;width:var(--pw);height:var(--ph)}
.pile .card{position:absolute;inset:0;width:100%;height:100%}
.pile.mazo .card:nth-child(1){transform:translate(-4px,4px)}.pile.mazo .card:nth-child(2){transform:translate(-2px,2px)}
.mazo-btn{position:absolute;inset:-4px;border:0;background:none;border-radius:12px;padding:0}
.mazo-btn:disabled{cursor:default}
.mazo-btn.can{animation:latido 1.6s ease-in-out infinite}
@keyframes latido{50%{box-shadow:0 0 0 3px rgba(246,196,83,.55),0 0 22px rgba(246,196,83,.35)}}
.mazo-n{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11.5px;color:#c7d5d2;white-space:nowrap}
.pozo .card{box-shadow:0 8px 18px rgba(0,0,0,.45)}
.pozo .card.p1{transform:rotate(-9deg) translate(-6px,2px);filter:brightness(.85)}.pozo .card.p2{transform:rotate(7deg) translate(5px,1px);filter:brightness(.9)}
.colorpill{position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;font-size:12px;color:#e8efe9;white-space:nowrap}
.colorpill i{width:14px;height:14px;border-radius:50%;background:var(--cc);box-shadow:0 0 0 2px rgba(255,255,255,.65),0 0 10px var(--cc)}
.dir{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:12px;color:#c7d5d2;display:flex;align-items:center;gap:6px;white-space:nowrap;z-index:1}
.dir svg{width:18px;height:18px}
.pena{position:absolute;top:30px;left:50%;transform:translateX(-50%);font:800 13px/1 system-ui;color:#2a1f12;background:#e0a93b;border-radius:8px;padding:5px 8px 4px;z-index:1}
/* Tu lado */
.me{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 max(10px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
.status{min-height:20px;font-size:13.5px;color:#e6ece6;text-align:center;font-weight:600;display:flex;align-items:center;gap:8px;justify-content:center}
.status b{color:#f3dc9a}
.timer{display:inline-block;min-width:34px;font:800 12px/1 system-ui;color:#2a1f12;background:#e0a93b;border-radius:7px;padding:4px 6px 3px}
.timer.low{background:#e0503f;color:#fff}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:nowrap;min-height:46px;width:min(560px,100%)}
.act{min-height:46px;min-width:0;flex:0 1 auto;padding:0 14px;white-space:nowrap;border-radius:12px;border:1px solid #7a5d33;background:linear-gradient(#d9bd7d,#bb9856);color:#2a1f12;font:750 15px/1.1 system-ui,sans-serif;box-shadow:0 3px 0 #5d4425,0 6px 14px rgba(0,0,0,.35)}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 #5d4425}
.act.uno{background:linear-gradient(#e5574a,#c4453a);border-color:#7c241c;color:#fff4e8;box-shadow:0 3px 0 #6b1d16,0 6px 14px rgba(0,0,0,.35);font-size:16px;letter-spacing:.04em}
.act.uno.pulse{animation:unoP 1s ease-in-out infinite}@keyframes unoP{50%{box-shadow:0 3px 0 #6b1d16,0 0 0 4px rgba(229,87,74,.45),0 0 22px rgba(229,87,74,.55)}}
.act.ghost{background:rgba(16,22,28,.7);border-color:#3a4654;color:#dfe6e2;box-shadow:none}
.act:disabled{opacity:.4}
.hand{position:relative;width:100%;height:calc(var(--ch) + 20px);display:flex;justify-content:center;align-items:flex-start;padding-top:12px;overflow:visible}
.hand .card{position:relative;flex:none;width:var(--cw);height:var(--ch);margin-left:var(--step,-30px);transition:transform .15s ease,filter .15s ease;box-shadow:0 8px 18px rgba(0,0,0,.45)}
.hand .card:first-child{margin-left:0}
.hand.play .card.ok{cursor:pointer;transform:translateY(-10px)}
.hand.play .card.ok:hover{transform:translateY(-18px)}
.hand.play .card:not(.ok){filter:brightness(.62) saturate(.7)}
.hand.play .card.drawn{transform:translateY(-16px);box-shadow:0 0 0 3px #f6c453,0 10px 22px rgba(0,0,0,.5)}
.hand.deal .card{animation:dealIn .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes dealIn{from{translate:0 60px;opacity:0}}
.card{display:block;border-radius:10px;overflow:hidden;background:#f4ecdc}
.card svg{display:block;width:100%;height:100%}
/* Elegir color del comodín */
.pick{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,58px);gap:8px;padding:12px;border-radius:16px;background:#141b22;border:1px solid #3a4654;box-shadow:0 14px 30px rgba(0,0,0,.5);z-index:8}
.pick[hidden]{display:none}
.pick p{grid-column:1/-1;margin:0 0 2px;text-align:center;font-weight:700;color:#e6ece6}
.pick button{height:58px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:var(--cc);font:700 11px system-ui;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
/* Carteles, hojas, menú y chat de la mesa */
.over{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(8,10,12,.58);z-index:9}
.over[hidden]{display:none}
.ccard{width:min(440px,100%);max-height:100%;overflow:auto;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;text-align:center}
.ccard h3{margin:0;font:700 22px/1.2 var(--serif)}
.ccard p{margin:0;color:#4d4031}
.ccard .ic{font-size:34px;line-height:1}
.ccard .btn{width:100%}
.ccard .lines{display:flex;flex-direction:column;gap:5px;text-align:left;padding:8px 10px;border-radius:10px;background:#fbf7ee;border:1px solid #e1d3b6}
.ccard .lines div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.ccard .lines b{font-family:var(--serif);font-size:15px}
.ccard .lines .win{color:#2d5c43}
.ccard .cap{font-size:12.5px;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.btn{min-height:46px;border-radius:11px;border:1px solid #b9a27a;background:#fbf7ee;font-weight:700;font-size:14.5px;padding:0 12px;color:var(--brown);box-shadow:0 1px 0 rgba(90,70,40,.15);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn small{display:block;font-weight:600;font-size:11.5px;opacity:.8}
.btn.go{background:var(--olive);border-color:var(--olive2);color:#f4efe0}
.btn.on{box-shadow:inset 0 0 0 2px #3f7a5a;background:#e8efe2}
.btn:disabled{opacity:.45}
.btn.link{background:none;border:0;box-shadow:none;color:#6b5a44;text-decoration:underline;min-height:36px}
.modal{position:fixed;inset:0;z-index:20;background:rgba(8,10,12,.72);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.sheet{width:min(540px,100%);max-height:88%;display:flex;flex-direction:column;background:var(--parch);color:var(--brown);border:1px solid var(--rule);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.45);animation:sheetIn .2s ease-out;padding-bottom:env(safe-area-inset-bottom)}
@keyframes sheetIn{from{transform:translateY(40px);opacity:.4}}
.sheet>header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
.sheet>header h2{margin:0;font:700 22px/1.15 var(--serif);flex:1}
.sheet>header .x{width:38px;height:38px;border-radius:10px;border:0;background:var(--parch2);font-size:15px;color:var(--brown)}
.sheet .body{overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sheet p{margin:0;color:#4d4031}
.sheet h4{margin:6px 0 0;font:700 16px/1.2 var(--serif);color:var(--brown)}
.sheet .seg{display:flex;gap:6px;flex-wrap:wrap}.sheet .seg .btn{flex:1;min-width:56px}
.note{font-size:12.5px;color:var(--soft)}
.sheet ul{margin:0;padding-left:18px;color:#4d4031;display:flex;flex-direction:column;gap:4px}
.demo{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.demo .card{width:52px;height:78px;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.log{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:#4d4031;font-size:13.5px}
.ulist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ulist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee}
.ulist .av{width:34px;height:34px;font-size:18px}
.ulist .nm{flex:1;font-weight:700;min-width:0}
.ulist .nm small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.ulist .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5aa64a;margin-left:6px}
.ulist button{min-height:38px;border-radius:9px;border:1px solid #7a5d33;background:linear-gradient(#d9bd7d,#bb9856);font-weight:700;padding:0 12px;color:#2a1f12}
.ulist button:disabled{opacity:.5}
.mesa{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.lugar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--rule);background:#fbf7ee;min-height:56px}
.lugar .av{width:32px;height:32px;font-size:17px}
.lugar b{display:block;font-size:14px;line-height:1.15}.lugar small{display:block;font-size:11.5px;color:var(--soft)}
.lugar.bot{background:#f3ede0;border-style:dashed}
.busy{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #b9a27a;border-top-color:transparent;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.side{position:fixed;inset:0;z-index:19;display:flex;justify-content:flex-end;background:rgba(8,10,12,.72)}
.side[hidden]{display:none}
.side-panel{width:min(340px,88vw);height:100%;overflow-y:auto;background:#151b21;color:var(--ink);border-left:1px solid var(--line);box-shadow:-24px 0 60px #000b;padding:calc(12px + env(safe-area-inset-top)) 14px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:sideIn .2s ease-out}
@keyframes sideIn{from{transform:translateX(36px);opacity:.3}}
.side-head{display:flex;align-items:center;justify-content:space-between}.side-head h2{margin:0;font:700 21px/1.2 var(--serif)}
.side-x{width:44px;height:44px;border-radius:12px;border:0;background:#222b33;font-size:17px;color:var(--ink)}
.menu-list{display:flex;flex-direction:column;gap:8px}.menu-list button,.menu-list a{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#1b232b;font-weight:650;text-decoration:none;color:var(--ink);text-align:left}
.side .note{color:#9aa6ad}
.onl{position:absolute;top:4px;right:max(12px,env(safe-area-inset-right));font-size:11.5px;font-weight:700;color:#cfe3c0;z-index:4}
.onl.off{color:#e8cf9a}.onl:empty{display:none}
.toast{position:fixed;left:50%;top:34%;transform:translateX(-50%);z-index:30;background:rgba(20,26,32,.96);color:var(--ink);border:1px solid rgba(224,169,59,.35);border-radius:12px;padding:10px 16px;font-weight:650;box-shadow:0 12px 30px rgba(0,0,0,.45);max-width:min(360px,86vw);text-align:center;animation:tin .2s ease-out}
@keyframes tin{from{transform:translate(-50%,-10px);opacity:0}}
.flying{position:fixed;z-index:12;pointer-events:none;transition:transform .32s cubic-bezier(.3,.8,.3,1);will-change:transform}
.mchat{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:calc(10px + env(safe-area-inset-bottom));z-index:15;width:min(330px,calc(100% - 20px));max-height:min(60vh,420px);display:flex;flex-direction:column;background:#151b21f5;border:1px solid #3a4654;border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.55);overflow:hidden}
.mchat[hidden]{display:none}
.mchat header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid #26303a}.mchat header b{flex:1;font:700 15px var(--serif)}
.mchat header button{width:36px;height:36px;border-radius:10px;border:0;background:#222b33}
.mchat .msgs{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.mchat .msg{font-size:13.5px;line-height:1.35;color:#e6ece6}.mchat .msg b{color:#f3dc9a;margin-right:4px}.mchat .msg.yo b{color:#9fe3c0}
.mchat .empty{color:#8f9ba3;font-size:13px}
.mchat .quick{display:flex;gap:6px;padding:6px 10px 0}.mchat .quick button{flex:1;height:36px;border-radius:10px;border:1px solid #3a4654;background:#1b232b;font-size:18px}
.mchat form{display:flex;gap:6px;padding:8px 10px 10px}.mchat input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid #3a4654;background:#0f1419;color:var(--ink);padding:0 10px;font-size:16px;-webkit-user-select:text;user-select:text}
.mchat form button{height:40px;border-radius:10px;border:0;background:#e0a93b;color:#2a1f12;font-weight:800;padding:0 12px}
.chip-chat{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);max-width:150px;padding:4px 9px;border-radius:10px;background:#f4ecdc;color:#2a2118;font-size:12px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:7;box-shadow:0 6px 14px rgba(0,0,0,.4);animation:sayIn .2s ease-out}
/* Tamaños */

<script>
/* ───────── Rangos y niveles de todos los juegos ─────────
   · Nivel de cada juego: sale de la experiencia (XP) que ganás jugando ese juego.
   · Nivel general: la suma de la XP de todos los juegos.
   · Rango de cada juego (Hierro → Maestro): sólo se mueve en partidas «ranked». Ganar suma puntos de
     rango (PR) y perder resta, como en los juegos competitivos. En «amistoso» no se gana ni se pierde.
   · Rango general: el promedio de tus 3 mejores juegos. Si tenés rango en uno solo, cuenta como si los
     otros estuvieran en cero: para ser Diamante general hay que ser bueno en varios juegos. */
(function(){
'use strict';
const TIERS=[
  {id:'hierro',n:'Hierro',c:'#9aa3ad',e:'⚙️'},{id:'bronce',n:'Bronce',c:'#c98b5a',e:'🥉'},{id:'plata',n:'Plata',c:'#cfd8e3',e:'🥈'},
  {id:'oro',n:'Oro',c:'#f2c14e',e:'🥇'},{id:'platino',n:'Platino',c:'#6fe0d0',e:'💠'},{id:'diamante',n:'Diamante',c:'#8ab8ff',e:'💎'},{id:'maestro',n:'Maestro',c:'#d9a6ff',e:'👑'}];
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',truco:'TrucAR',uno:'UnoAR'};
const DIV=100,PER=3,MAX=(TIERS.length-1)*DIV*PER; // Maestro arranca en 1800 PR y no tiene techo
const RKEY='bloques-rangos-v1',XKEY='bloques-xpjuegos-v1',PKEY='bloques-progress-v1',DONE='bloques-rangos-hechas-v1';
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')||d;}catch(_){return d;}}};
const ROMAN=['III','II','I'];
function info(v){
  v=Math.max(0,Math.round(v||0));
  if(v>=MAX){const t=TIERS[TIERS.length-1];return {v,t,tier:TIERS.length-1,name:t.n,div:'',pr:v-MAX,label:`${t.n}`,short:t.n,next:null,pct:1};}
  const tier=Math.floor(v/(DIV*PER)),d=Math.floor((v%(DIV*PER))/DIV),t=TIERS[tier];
  return {v,t,tier,name:t.n,div:ROMAN[d],pr:v%DIV,label:`${t.n} ${ROMAN[d]}`,short:`${t.n} ${ROMAN[d]}`,next:DIV-v%DIV,pct:(v%DIV)/DIV};
}
function all(){const o=ls.json(RKEY,{});o.j=o.j||{};return o;}
function get(g){const o=all().j[g]||{};return {v:o.v||0,w:o.w||0,l:o.l||0,n:o.n||0,hist:o.hist||[]};}
function save(o){o.at=Date.now();ls.set(RKEY,JSON.stringify(o));}
function isRanked(g){return ls.get('bloques-ranked-'+g)!=='0';}
function setRanked(g,on){ls.set('bloques-ranked-'+g,on?'1':'0');}
// Cuánto da o saca cada resultado. «kind»: compu-facil, compu-normal, compu-dificil, amigo, solo.
const TABLE={'compu-facil':[10,-16],'compu-normal':[18,-14],'compu-dificil':[25,-10],amigo:[25,-15],solo:[20,-15],malon:[16,-10]};
function apply(g,res){
  // res: {key (para no contar dos veces), win, kind, extra}
  if(!isRanked(g)||!res||!TABLE[res.kind])return null;
  const done=ls.json(DONE,[]);if(res.key&&done.includes(g+':'+res.key))return null;
  const o=all(),r=o.j[g]||{v:0,w:0,l:0,n:0,hist:[]},before=info(r.v);
  const [up,down]=TABLE[res.kind];
  let d=res.win?up+(res.extra||0):down;
  if(!res.win&&before.tier===0&&r.v<DIV)d=Math.round(d/2);        // en Hierro III se pierde la mitad
  if(res.win&&r.n<5)d=Math.round(d*1.5);                            // las primeras partidas ubican más rápido
  const nv=Math.max(0,r.v+d);
  r.v=nv;r.n=(r.n||0)+1;if(res.win)r.w=(r.w||0)+1;else r.l=(r.l||0)+1;
  r.hist=(r.hist||[]).concat([{t:Date.now(),d:nv-before.v,k:res.kind}]).slice(-30);
  o.j[g]=r;save(o);
  if(res.key){done.push(g+':'+res.key);ls.set(DONE,JSON.stringify(done.slice(-80)));}
  const after=info(nv);
  return {delta:nv-before.v,before,after,up:after.tier>before.tier||(after.tier===before.tier&&after.div!==before.div&&nv>before.v),down:nv<before.v&&(after.tier<before.tier||after.div!==before.div)};
}
// Meta de líneas en Maratón ranked según tu rango (Hierro 10 … Maestro 100).
function soloTarget(g){const t=info(get(g).v).tier;return [10,20,30,45,60,80,100][t];}
// XP por juego. La de BloqueAR vive en su progreso; la de los demás, acá.
function xp(g){if(g==='bloquear'){const p=ls.json(PKEY,{});return p.xp||0;}return (ls.json(XKEY,{})[g])||0;}
function addXp(g,n){if(g==='bloquear')return;const o=ls.json(XKEY,{});o[g]=(o[g]||0)+Math.max(0,Math.round(n));o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}
// Premios para EstanciAR: jugar los otros juegos deja trigo y pesos para la estancia.
// ranked: sólo las partidas ranked (las que mueven el rango) dan leguas para La Gran Pampa (pedido del usuario, v56).
function premio(de,xp,ranked){
  const n=Math.max(0,Math.round(xp||0));if(!n)return null;
  const p={de,trigo:0,pesos:Math.min(1000,Math.round(n*2)),t:Date.now()};
  const L=ls.json('estancia-premios',[]);L.push(p);ls.set('estancia-premios',JSON.stringify(L.slice(-40)));
  return {...p,ranked:!!ranked,leguas:ranked?pampaAct(de==='PoblAR'?'p':de==='TrucAR'?'t':de==='UnoAR'?'u':'b'):0};
}
// La Gran Pampa: lo que jugás cada día da leguas para el mapa (las cobra el mapa al abrirse; la planilla pone los topes).
// Por día: BloqueAR 1 por partida ranked (hasta 4), PoblAR y TrucAR 2 por partida ranked (hasta 2) y EstanciAR 1 por cosecha (hasta 4).
const PAMPA_ACT={b:{tope:4,v:1},p:{tope:2,v:2},e:{tope:4,v:1},t:{tope:2,v:2},u:{tope:2,v:2}};
function pampaAct(q){
  const A=PAMPA_ACT[q];if(!A)return 0;
  const d=new Date(),dia=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,X=ls.json('pampa-act',{}),o=X.d===dia?X:{d:dia,b:0,p:0,e:0,t:0,u:0};
  o[q]=(o[q]||0)+1;ls.set('pampa-act',JSON.stringify(o));
  const a=ls.json('bloques-acct-v1',null);
  return o[q]<=A.tope&&a&&a.usuario?A.v:0;
}
function levelInfo(x){let lv=1,acc=0,need=120;while(x>=acc+need){acc+=need;lv++;need=120+60*(lv-1);}return {lv,into:x-acc,need};}
function general(){
  const games=Object.keys(GAMES),tot=games.reduce((a,g)=>a+xp(g),0);
  const vals=games.map(g=>get(g).v).sort((a,b)=>b-a),best=[0,1,2].map(i=>vals[i]||0);
  return {xp:tot,level:levelInfo(tot),rank:info((best[0]+best[1]+best[2])/3),games:games.map(g=>({g,name:GAMES[g],xp:xp(g),level:levelInfo(xp(g)),rank:info(get(g).v),rec:get(g)})),count:vals.filter(v=>v>0).length};
}
// Lo mismo, pero con los datos del perfil público de otro jugador.
function generalFrom(d){
  const games=Object.keys(GAMES),X=d.xp||{},Rk=d.rangos||{},xpOf=g=>Number(X[g]||0),vOf=g=>Number((Rk[g]||{}).v||0);
  const tot=games.reduce((a,g)=>a+xpOf(g),0),vals=games.map(vOf).sort((a,b)=>b-a);
  return {xp:tot,level:levelInfo(tot),rank:info(((vals[0]||0)+(vals[1]||0)+(vals[2]||0))/3),games:games.map(g=>({g,name:GAMES[g],xp:xpOf(g),level:levelInfo(xpOf(g)),rank:info(vOf(g))}))};
}
// Para la cuenta: se suben y se bajan junto con el progreso de BloqueAR.
function exportData(){return {r:ls.json(RKEY,{}),x:ls.json(XKEY,{})};}
function importData(d){
  if(!d||typeof d!=='object')return false;let ch=false;
  const r=ls.json(RKEY,{});if(d.r&&(d.r.at||0)>(r.at||0)){ls.set(RKEY,JSON.stringify(d.r));ch=true;}
  const x=ls.json(XKEY,{});if(d.x){const o={...x};for(const [k,v] of Object.entries(d.x))if(k!=='at'&&Number.isFinite(v)&&v>(o[k]||0)){o[k]=v;ch=true;}if(ch){o.at=Date.now();ls.set(XKEY,JSON.stringify(o));}}
  return ch;
}
function badge(v,small){const i=info(v);return `<span class="rk-badge${small?' sm':''}" style="--rk:${i.t.c}" title="${i.label}${i.next!=null?` · ${i.pr}/${DIV} PR`:''}"><i>${i.t.e}</i>${i.short}</span>`;}
const CSS=`.rk-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 5px;border-radius:999px;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent);background:color-mix(in srgb,var(--rk) 16%,#0c131e);color:var(--rk);font:800 11.5px/1.3 system-ui,-apple-system,sans-serif;white-space:nowrap;vertical-align:middle}
.rk-badge i{font-style:normal;font-size:12px}.rk-badge.sm{font-size:10.5px;padding:1px 7px 1px 4px}
.rk-res{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0 2px;font-weight:800}
.rk-res .rk-d{font-size:15px}.rk-res .rk-d.up{color:#57d49b}.rk-res .rk-d.down{color:#ff8a6b}
.rk-bar{height:6px;border-radius:3px;background:#283345;overflow:hidden;margin-top:4px}.rk-bar i{display:block;height:100%;background:var(--rk,#7ce9e5)}
.rk-mine{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:0 0 10px;border-radius:12px;border:1px solid color-mix(in srgb,var(--rk) 35%,#283345);background:color-mix(in srgb,var(--rk) 7%,#0f1622);font:500 13px/1.3 system-ui,-apple-system,sans-serif;color:#f4f7fe}
.rk-mine>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left}.rk-mine b{font-size:14px;display:block}.rk-mine small{color:#93a1b6;font-size:12px;display:block}
.rk-mine>.rk-badge{display:inline-flex!important;flex-direction:row!important;flex:none!important;width:auto!important;min-height:0!important;margin:0!important;padding:2px 8px 2px 5px!important;font-size:11.5px!important;background:color-mix(in srgb,var(--rk) 16%,#0c131e)!important;border:1px solid color-mix(in srgb,var(--rk) 60%,transparent)!important;color:var(--rk)!important}
.rk-mine>.rk-badge i{font-size:12px!important;display:inline!important}
.rk-mine .rk-bar{width:100%}`;
// El rango de un juego, para el menú de ese juego.
function mine(g){if(!GAMES[g])return '';const r=get(g),i=info(r.v),L=levelInfo(xp(g));
  return `<div class="rk-mine" style="--rk:${i.t.c}"><div><b>Tu rango en ${GAMES[g]}</b><small>Nivel ${L.lv}${r.n?` · ${r.n} ${r.n===1?'partida ranked':'partidas ranked'}`:' · todavía sin partidas ranked'}</small>${i.next!=null?`<div class="rk-bar"><i style="width:${i.pct*100}%"></i></div>`:''}</div>${badge(r.v)}</div>`;}
function css(){if(document.getElementById('rk-css'))return;const s=document.createElement('style');s.id='rk-css';s.textContent=CSS;(document.head||document.documentElement).appendChild(s);}
function resultHtml(r){if(!r)return '';const sign=r.delta>0?'+':'';return `<div class="rk-res">${badge(r.after.v)}<span class="rk-d ${r.delta>=0?'up':'down'}">${sign}${r.delta} PR</span>${r.up?'<span>¡Subiste!</span>':r.down?'<span>Bajaste</span>':''}</div>`;}
window.RANGOS={TIERS,GAMES,info,get,mine,generalFrom,isRanked,setRanked,apply,soloTarget,xp,addXp,general,exportData,importData,badge,resultHtml,css,levelInfo,premio,pampaAct,PAMPA_ACT,DIV};
})();

</script>
<script>
/* ───────── Chat de BloqueAR (versión 5 de la planilla) ─────────
   Es el mismo en BloqueAR, PoblAR y el menú de juegos. Charlas de a dos, reacciones, zumbidos,
   «escribiendo…» y «visto». Los mensajes salen cifrados de este dispositivo (AES-GCM con una llave
   ECDH por par de usuarios); la planilla sólo guarda texto ilegible. La llave secreta de cada uno se
   guarda en la planilla cerrada con su PIN, así el chat se lee en cualquier dispositivo con la cuenta.
   Mientras hay una partida en juego no suena ni aparece nada: sólo sube el numerito del botón 💬. */
(function(){
'use strict';
const LB_DEF='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const REACS=['❤️','😂','😮','😢','👍','🔥'];
const DIAS=30;
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},
  json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const $=(sel,root=document)=>root.querySelector(sel);
const acct=()=>{const a=ls.json('bloques-acct-v1',null);return a&&a.usuario&&a.token?a:null;};
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEF;
const lc=s=>String(s||'').toLowerCase();
const H={busy:()=>false,account:()=>{location.href='./';},onOpen:()=>{},onClose:()=>{},game:()=>'',invite:null,play:null,inbox:null};
const GAMES={bloquear:'BloqueAR',poblar:'PoblAR',estancia:'EstanciAR',pampa:'La Gran Pampa',truco:'TrucAR',uno:'UnoAR'};
// Mi estado, como en el MSN: conectado, ausente o no molestar (y «ausente» solo si no tocás nada por 5 minutos).
const ST={m:ls.get('bloques-chat-modo')||'on',lastInput:Date.now()};
function effMode(){if(ST.m==='dnd')return 'dnd';if(ST.m==='aus'||Date.now()-ST.lastInput>5*60e3)return 'aus';return 'on';}
function estTxt(u){const e=u&&u.estado;if(!u||!u.enLinea)return 'Desconectado';if(!e)return 'Conectado';
  if(e.g&&GAMES[e.j])return '🎮 Jugando '+GAMES[e.j];if(e.m==='dnd')return '⛔ No molestar';if(e.m==='aus')return '🌙 Ausente';return GAMES[e.j]?'Conectado en '+GAMES[e.j]:'Conectado';}
function dotCls(u){const e=u&&u.estado;if(!u||!u.enLinea)return '';if(e&&e.g)return ' play';if(e&&e.m==='dnd')return ' dnd';if(e&&e.m==='aus')return ' aus';return ' on';}
const S={users:[],usersAt:0,msgs:[],last:0,read:{},vistos:{},typing:[],open:false,view:'list',con:null,key:null,keys:{},plain:{},ver:0,pinAsk:false,
  timer:0,polling:false,prof:null,profData:null,card:null,invFor:null,unsupported:false,err:'',pending:[],typedAt:0,lastSeenSent:{},inited:false,me:'',zbAt:0,errAt:0,pickFor:null};

/* ── Red ── */
async function call(p,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{
    let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(p),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(p))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');
    return j;
  }catch(e){
    if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');
    if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');
    throw e;
  }finally{clearTimeout(to);}
}
const auth=o=>{const a=acct();return {usuario:a.usuario,token:a.token,...o};};

/* ── Cifrado ── */
const cs=window.crypto&&window.crypto.subtle;
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=u=>{let s='';const b=new Uint8Array(u);for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const unb64=s=>{s=String(s).replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s),o=new Uint8Array(r.length);for(let i=0;i<r.length;i++)o[i]=r.charCodeAt(i);return o;};
async function pinKey(pin,sal){const base=await cs.importKey('raw',enc.encode(String(pin)),'PBKDF2',false,['deriveKey']);
  return cs.deriveKey({name:'PBKDF2',salt:sal,iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function newKeyPair(pin){
  const kp=await cs.generateKey({name:'ECDH',namedCurve:'P-256'},true,['deriveKey']);
  const pub=await cs.exportKey('jwk',kp.publicKey),priv=await cs.exportKey('jwk',kp.privateKey);
  const sal=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await cs.encrypt({name:'AES-GCM',iv},await pinKey(pin,sal),enc.encode(JSON.stringify(priv)));
  return {local:{pub:JSON.stringify(pub),priv},remote:{pub:JSON.stringify(pub),priv:b64(ct),sal:b64(sal),iv:b64(iv),v:1}};
}
async function openRemote(r,pin){
  const k=await pinKey(pin,unb64(r.sal));
  const pt=await cs.decrypt({name:'AES-GCM',iv:unb64(r.iv)},k,unb64(r.priv));
  return {pub:r.pub,priv:JSON.parse(dec.decode(pt))};
}
async function myPriv(){if(!S.key)return null;if(!S.key.ck)S.key.ck=await cs.importKey('jwk',S.key.priv,{name:'ECDH',namedCurve:'P-256'},false,['deriveKey']);return S.key.ck;}
async function convKey(name){
  const u=userOf(name);if(!u||!u.pub)return null;
  const c=S.keys[lc(name)];if(c&&c.pub===u.pub)return c.k;
  const pub=await cs.importKey('jwk',JSON.parse(u.pub),{name:'ECDH',namedCurve:'P-256'},false,[]);
  const k=await cs.deriveKey({name:'ECDH',public:pub},await myPriv(),{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
  S.keys[lc(name)]={pub:u.pub,k};return k;
}
async function seal(name,obj){const k=await convKey(name);if(!k)throw new Error(`${name} todavía no abrió su chat: cuando lo abra, le podés escribir.`);
  const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await cs.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(obj)));return b64(iv)+'.'+b64(ct);}
async function unseal(name,cont){const k=await convKey(name);if(!k)return null;const [iv,ct]=String(cont).split('.');
  try{return JSON.parse(dec.decode(await cs.decrypt({name:'AES-GCM',iv:unb64(iv)},k,unb64(ct))));}catch(_){return null;}}

/* ── Datos guardados en este dispositivo ── */
const kMsgs=()=>'bloques-chat-msgs-'+lc(S.me),kRead=()=>'bloques-chat-read-'+lc(S.me),kKey='bloques-chatkey-v1';
function loadLocal(){
  const a=acct();S.me=a?a.usuario:'';S.msgs=[];S.last=0;S.read={};S.plain={};S.keys={};S.key=null;
  if(!a)return;
  const m=ls.json(kMsgs(),null);if(m&&Array.isArray(m.list)){S.msgs=m.list;S.last=m.last||0;}
  S.read=ls.json(kRead(),{});
  const k=ls.json(kKey,null);if(k&&lc(k.usuario)===lc(S.me)&&k.priv)S.key={pub:k.pub,priv:k.priv};
  prune();
}
function prune(){const corte=Date.now()-DIAS*864e5;S.msgs=S.msgs.filter(m=>m.t>corte).slice(-3000);}
function saveMsgs(){ls.set(kMsgs(),JSON.stringify({last:S.last,list:S.msgs}));}
function saveRead(){ls.set(kRead(),JSON.stringify(S.read));}
const userOf=n=>S.users.find(u=>lc(u.usuario)===lc(n));
const other=m=>lc(m.de)===lc(S.me)?m.para:m.de;
function unreadFrom(n){const r=S.read[lc(n)]||0;return S.msgs.filter(m=>lc(m.de)===lc(n)&&lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>r).length;}
function unreadTotal(){const seen=new Set();let n=0;for(const m of S.msgs){if(lc(m.para)!==lc(S.me)||m.tipo==='reac')continue;const r=S.read[lc(m.de)]||0;if(m.t>r)n++;seen.add(lc(m.de));}return n;}

/* ── Consultas periódicas ── */
function schedule(){
  clearTimeout(S.timer);if(!acct()||S.unsupported)return;
  // v57: más seguido (los mensajes tardaban). Con la charla abierta, cada 2 s.
  const ms=document.hidden?30000:S.open&&S.view==='conv'?2000:S.open?3000:4000;
  S.timer=setTimeout(poll,ms);
}
async function poll(){
  const a=acct();
  if(!a){if(S.me){loadLocal();render();}return;}
  if(lc(a.usuario)!==lc(S.me)){loadLocal();render();}
  if(S.polling){schedule();return;}S.polling=true;
  try{
    const p={accion:'chat',estado:{m:effMode(),j:String(H.game()||''),g:!!H.busy()},desde:S.last};
    if(S.open&&S.view==='conv'&&S.con&&Date.now()-S.typedAt<4000)p.escribe=S.con;
    if(S.open&&S.view==='conv'&&S.con&&!document.hidden){const t=lastFrom(S.con);if(t&&S.lastSeenSent[lc(S.con)]!==t){p.leido={con:S.con,t};S.lastSeenSent[lc(S.con)]=t;}}
    const j=await call(auth(p));
    S.ver=Number(j.version)||S.ver;S.err='';S.typing=j.escribiendo||[];S.vistos=j.vistos||{};
    if(Date.now()-S.usersAt>30000||(j.t>S.last&&!S.users.length)){await loadUsers();await decryptAll();}
    // Planilla v11: si hay mensajes nuevos vienen en la misma respuesta (una consulta menos), y avisa si te invitaron.
    if(j.inv&&H.inbox&&j.inv!==S.lastInv){S.lastInv=j.inv;try{H.inbox(j.inv);}catch(_){}}
    if(j.t>S.last)await fetchNew(Array.isArray(j.mensajes)?j:null);
    else if(S.open)render();
    checkDeferred();
  }catch(e){
    const m=String(e.message||e);
    if(/desconocida/i.test(m)){S.unsupported=true;S.err='Para usar el chat hay que actualizar el código de la planilla a la versión 5.';}
    else if(/sesión venció/i.test(m)){S.err='Tu sesión venció: volvé a entrar con tu usuario y PIN.';}
    else S.err=m;
    if(S.open)render();
  }finally{S.polling=false;schedule();}
}
async function loadUsers(){try{const j=await call({accion:'usuarios'},false);if(Array.isArray(j.usuarios)){S.users=j.usuarios;S.usersAt=Date.now();}}catch(_){}}
const lastFrom=n=>{let t=0;for(const m of S.msgs)if(lc(m.de)===lc(n)&&m.t>t)t=m.t;return t;};
async function fetchNew(pre){
  const j=pre||await call(auth({accion:'mensajes',desde:S.last}));
  const known=new Set(S.msgs.map(m=>m.id)),fresh=[];
  for(const m of j.mensajes||[]){if(m.t>S.last)S.last=m.t;if(known.has(m.id))continue;S.msgs.push(m);fresh.push(m);}
  const first=!S.inited;S.inited=true;
  if(!fresh.length){saveMsgs();if(S.open)render();return;}
  prune();saveMsgs();await decryptAll();
  if(!first){for(const m of fresh)if(lc(m.de)!==lc(S.me))arrived(m);}
  else{// Al abrir la app: si te escribieron mientras no estabas, un aviso con el resumen.
    const r=S.read,nuevos=fresh.filter(m=>lc(m.para)===lc(S.me)&&m.tipo!=='reac'&&m.t>(r[lc(m.de)]||0)&&!(S.open&&S.view==='conv'&&lc(S.con)===lc(m.de)));
    if(nuevos.length){S.pending.push(...nuevos);checkDeferred();}}
  render();badges();
}
async function decryptAll(){
  for(const m of S.msgs){if(S.plain[m.id]||m.tipo==='zumbido'||m.tmp)continue;
    if(typeof m.p==='string'){try{S.plain[m.id]=JSON.parse(m.p);}catch(_){S.plain[m.id]=null;}continue;}
    if(S.key&&cs)S.plain[m.id]=await unseal(other(m),m.cont).catch(()=>null);}
}
// Mensajes viejos (v5–v11) que este dispositivo no puede abrir sin el PIN.
const viejoCerrado=m=>m.tipo!=='zumbido'&&!m.tmp&&typeof m.p!=='string'&&!S.plain[m.id];
// Desde la planilla v12 el chat anda con la cuenta: el texto se manda y la planilla lo guarda cerrado.
function sinV12(e){const t=String(e&&e.message||e);return S.ver&&S.ver<12&&/vacío|cifrado|inválido/i.test(t)?'Para escribir sin PIN hay que actualizar la planilla a la versión 12 (pegar el Codigo.gs nuevo y publicar una Nueva versión).':t;}

/* ── Avisos ── */
let AC=null;
function beep(kind){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t0=AC.currentTime,notes=kind==='zumbido'?[[90,.06],[110,.06],[90,.06],[110,.06],[90,.06],[110,.06]]:kind==='soft'?[[880,.08]]:[[784,.1],[1175,.18]];
    let t=t0;for(const [f,d] of notes){const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='zumbido'?'sawtooth':'sine';o.frequency.value=f;o.connect(g).connect(AC.destination);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='zumbido'?.08:.12,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};t+=d*.9;}
  }catch(_){}
}
function preview(m){if(m.tipo==='zumbido')return '📳 ¡Te mandó un zumbido!';const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Compartió una partida')+(o.x?' · '+o.x:'');return o&&o.x?o.x:'💬 Mensaje nuevo';}
function arrived(m){
  if(m.tipo==='reac')return;
  const from=m.de,viewing=S.open&&S.view==='conv'&&lc(S.con)===lc(from)&&!document.hidden;
  if(viewing){if(m.tipo==='zumbido')shake();else beep('soft');markRead(from);return;}
  if(ST.m==='dnd'){badges();return;}
  if(document.hidden){sysNotify(m);flashTitle();}
  if(H.busy()){S.pending.push(m);return;}
  notice(m);
}
function notice(m){
  if(m.tipo==='zumbido'){shake();beep('zumbido');try{navigator.vibrate&&navigator.vibrate([120,60,120,60,200]);}catch(_){}}
  else beep('msg');
  toast(m.de,preview(m));
}
function checkDeferred(){
  if(!S.pending.length||H.busy())return;
  if(ST.m==='dnd'){S.pending.length=0;return;}
  const list=S.pending.splice(0),names=[...new Set(list.map(m=>m.de))];
  if(list.some(m=>m.tipo==='zumbido'))beep('zumbido');else beep('msg');
  if(list.length===1){toast(list[0].de,preview(list[0]));return;}
  toast(names.length===1?names[0]:names.slice(0,3).join(', '),`Te ${list.length===1?'escribió':'escribieron'}: ${list.length} mensajes nuevos.`,names.length===1?names[0]:null);
}
function shake(){const el=S.open?$('.cx-panel'):document.body;if(!el)return;el.classList.remove('cx-shake');void el.offsetWidth;el.classList.add('cx-shake');setTimeout(()=>el.classList.remove('cx-shake'),800);}
let baseTitle=document.title,titleTimer=0;
function flashTitle(){if(titleTimer)return;baseTitle=document.title.replace(/^\(\d+\) /,'');let on=false;titleTimer=setInterval(()=>{const n=unreadTotal();if(!document.hidden||!n){clearInterval(titleTimer);titleTimer=0;document.title=baseTitle;return;}on=!on;document.title=on?`(${n}) 💬 Mensaje nuevo`:baseTitle;},1200);}
function sysNotify(m){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const u=userOf(m.de),n=new Notification(`${u?u.avatar+' ':''}${m.de}`,{body:preview(m),tag:'bloques-chat-'+lc(m.de),silent:false});
    n.onclick=()=>{window.focus();open(m.de);n.close();};}catch(_){}
}
function toast(who,txt,openWho=who){
  const box=$('.cx-toasts');if(!box)return;const u=userOf(who);
  const el=document.createElement('button');el.type='button';el.className='cx-toast';
  el.innerHTML=`${u?avatar(u):'<span class="cx-av">💬</span>'}<span><b>${esc(who)}</b><small>${esc(txt).slice(0,140)}</small></span>`;
  el.onclick=()=>{el.remove();open(openWho||undefined);};
  box.appendChild(el);while(box.children.length>3)box.firstChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),400);},6500);
}
function badges(){
  const n=unreadTotal();
  document.querySelectorAll('[data-chat-btn]').forEach(b=>{let s=b.querySelector('.cx-badge');if(!n){if(s)s.remove();return;}if(!s){s=document.createElement('span');s.className='cx-badge';b.appendChild(s);}s.textContent=n>9?'9+':String(n);});
  if(!document.hidden)document.title=baseTitle;
}

/* ── Vista ── */
const avatar=(u,big)=>`<span class="cx-av${big?' big':''}" style="--avc:${/^#[0-9a-fA-F]{6}$/.test(u&&u.color||'')?u.color:'#7ce9e5'}">${esc(u&&u.avatar||'🙂')}</span>`;
const hora=t=>{const d=new Date(t),n=new Date();const hm=d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});if(d.toDateString()===n.toDateString())return hm;const y=new Date(n-864e5);if(d.toDateString()===y.toDateString())return 'ayer '+hm;return d.toLocaleDateString('es-AR',{day:'numeric',month:'short'});};
const dia=t=>{const d=new Date(t),n=new Date();if(d.toDateString()===n.toDateString())return 'Hoy';if(d.toDateString()===new Date(n-864e5).toDateString())return 'Ayer';return d.toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'});};
function ensureDom(){
  if($('#cx-root'))return;
  const r=document.createElement('div');r.id='cx-root';
  r.innerHTML=`<div class="cx-scrim" hidden></div><aside class="cx-panel" hidden role="dialog" aria-modal="true" aria-label="Chat"></aside><div class="cx-toasts" aria-live="polite"></div>`;
  document.body.appendChild(r);
  $('.cx-scrim').onclick=close;
  const p=$('.cx-panel');
  p.addEventListener('click',onClick);
  p.addEventListener('focusout',e=>{if(e.target.id==='cx-frase')saveFrase(e.target.value);});
  p.addEventListener('input',e=>{if(e.target.id==='cx-in'){S.typedAt=Date.now();autoGrow(e.target);}});
  p.addEventListener('keydown',e=>{
    if(e.target.id==='cx-in'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send();}
    if(e.target.id==='cx-pin'&&e.key==='Enter'){e.preventDefault();activate();}
    if(e.target.id==='cx-frase'&&e.key==='Enter'){e.preventDefault();e.target.blur();}
    e.stopPropagation();
  });
  document.addEventListener('keydown',e=>{if(S.open&&e.key==='Escape'){e.preventDefault();e.stopPropagation();if(S.invFor){S.invFor=null;$('.cx-panel').dataset.sig='';render();}else if(S.pickFor){S.pickFor=null;render();}else if(S.view==='perfil'&&S.con){S.view='conv';render();}else if(S.view==='conv'||S.view==='perfil'||S.view==='share'){S.view='list';S.card=null;render();}else close();}},true);
}
function autoGrow(t){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px';}
function convList(){
  const me=lc(S.me),by={};
  for(const m of S.msgs){const o=lc(other(m));if(!by[o]||m.t>by[o].t)by[o]=m;}
  const users=S.users.filter(u=>lc(u.usuario)!==me);
  for(const k of Object.keys(by))if(!users.some(u=>lc(u.usuario)===k)){const m=by[k];users.push({usuario:other(m),avatar:'🙂',color:'#93a1b6',enLinea:false});}
  return users.map(u=>({u,m:by[lc(u.usuario)]||null})).sort((a,b)=>((b.m?b.m.t:0)-(a.m?a.m.t:0))||((b.u.enLinea?1:0)-(a.u.enLinea?1:0))||a.u.usuario.localeCompare(b.u.usuario));
}
function render(){
  const p=$('.cx-panel');if(!p||!S.open)return;
  const a=acct();
  if(!a){p.innerHTML=head('Chat')+`<div class="cx-empty"><p>Para chatear con tus amigos necesitás una cuenta (la misma de los juegos).</p><button type="button" class="cx-primary" data-a="cuenta">Crear cuenta o entrar</button></div>`;return;}
  if(S.unsupported){p.innerHTML=head('Chat')+`<div class="cx-empty"><p>${esc(S.err)}</p><p class="cx-dim">Es la misma planilla de la tabla: Extensiones › Apps Script, pegar el código nuevo e Implementar › Nueva versión.</p></div>`;return;}
  if(S.view==='conv'&&S.con){renderConv(p);return;}
  if(S.view==='perfil'&&S.prof){p.dataset.sig='';renderProfile(p);return;}
  if(S.view==='share'&&S.card){if(p.dataset.sig!=='share'){p.dataset.sig='share';renderShare(p);}else{const l=$('#cx-slist');if(l)l.innerHTML=shareRows();}return;}
  const rows=convList().map(({u,m})=>{
    const n=unreadFrom(u.usuario),typing=S.typing.some(x=>lc(x)===lc(u.usuario));
    const sub=typing?'<i class="cx-typing">escribiendo…</i>':m?esc((lc(m.de)===lc(S.me)?'Vos: ':'')+(m.tipo==='zumbido'?'📳 Zumbido':m.tipo==='reac'?'Reaccionó a un mensaje':previewOwn(m))):esc(u.frase||estTxt(u));
    return `<button type="button" class="cx-row${n?' unread':''}" data-con="${esc(u.usuario)}">${avatar(u)}<span class="cx-mid"><b>${esc(u.usuario)}<i class="cx-dot${dotCls(u)}" title="${esc(estTxt(u))}"></i>${u.estado&&u.estado.g?'<em class="cx-st">🎮</em>':''}</b><small>${sub}</small></span><span class="cx-end">${m?`<small>${hora(m.t)}</small>`:''}${n?`<span class="cx-n">${n}</span>`:''}</span></button>`;
  }).join('')||'<p class="cx-dim cx-pad">Todavía no hay otras cuentas. Cuando tus amigos se creen una, aparecen acá.</p>'+'<p class="cx-dim cx-pad">Para chatear alcanza con tu cuenta. Los mensajes se guardan protegidos en la planilla del juego y se borran a los 30 días. No mandes contraseñas ni datos de tarjetas.</p>';
  if(p.dataset.sig==='list'&&$('#cx-frase')){$('.cx-list').innerHTML=rows;modeBtns();return;}
  p.dataset.sig='list';
  const a2=acct(),mine=userOf(S.me)||{},canAsk='Notification' in window&&Notification.permission==='default'&&!/iPhone|iPad/.test(navigator.userAgent);
  p.innerHTML=head('Chat')+`<div class="cx-me">${avatar({avatar:a2.avatar,color:a2.color})}<div class="cx-me-r"><b>${esc(S.me)}</b>
      <input id="cx-frase" maxlength="60" placeholder="Tu frase (la ven tus amigos)" value="${esc(ST.frase??mine.frase??'')}"></div></div>
    <div class="cx-modes" role="group" aria-label="Mi estado"><button type="button" data-a="modo" data-m="on">🟢 Conectado</button><button type="button" data-a="modo" data-m="aus">🌙 Ausente</button><button type="button" data-a="modo" data-m="dnd">⛔ No molestar</button></div>`+
    (S.err?`<p class="cx-err cx-pad">${esc(S.err)}</p>`:'')+(canAsk?`<button type="button" class="cx-ask" data-a="permiso">🔔 Avisarme en la compu cuando me escriben</button>`:'')+
    `<div class="cx-list">${rows}</div>`;
  modeBtns();
}
function modeBtns(){document.querySelectorAll('.cx-modes [data-m]').forEach(b=>{const on=b.dataset.m===ST.m;b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));});}
function previewOwn(m){const o=S.plain[m.id];if(o&&o.card)return '🃏 '+(o.card.t||'Partida');return o&&o.x||'🔒 Mensaje anterior';}
async function saveFrase(v){v=String(v||'').replace(/\s+/g,' ').trim().slice(0,60);if(v===(ST.frase??'')&&ST.saved)return;ST.frase=v;ls.set('bloques-chat-frase',v);
  try{await call(auth({accion:'perfil',frase:v}));ST.saved=true;const me=userOf(S.me);if(me)me.frase=v;}catch(e){S.err=String(e.message||e);}}
/* Perfil de un jugador: nivel, rangos, medallas y récords. */
async function openProfile(name){S.view='perfil';S.prof=name;S.profData=null;render();
  try{const j=await call({accion:'perfil',usuario:name},false);S.profData=j.perfil;}catch(e){S.profData={error:String(e.message||e)};}

function renderProfile(p){

    <div class="cx-list">${body}${me?'':`<div class="cx-pact"><button type="button" class="cx-primary" data-con="${esc(S.prof)}">💬 Escribirle</button>${H.invite?`<button type="button" class="cx-sec" data-a="invitar" data-u="${esc(S.prof)}">🎮 Invitar a jugar</button>`:''}</div>`}</div>

/* Compartir una partida: elegís a quién y le llega como tarjeta con un botón para jugar. */

function head(t,extra=''){return `<div class="cx-head"><h2>${t}</h2>${extra}<button type="button" class="cx-x" data-a="cerrar" aria-label="Cerrar">✕</button></div>`;}
function renderConv(p){
  const sig=[S.con,S.msgs.length,S.typing.join(','),JSON.stringify(S.vistos),S.err,S.pickFor,S.invFor,S.pinAsk,!!S.key,Object.keys(S.plain).length,(userOf(S.con)||{}).enLinea,JSON.stringify((userOf(S.con)||{}).estado),(userOf(S.con)||{}).pub?1:0].join('|');

async function onClick(e){
  const b=e.target.closest('[data-a],[data-con]');if(!b)return;
  if(b.dataset.con&&!b.dataset.a){S.con=b.dataset.con;S.view='conv';S.pickFor=null;S.invFor=null;S.err='';render();poll();return;}
  const a=b.dataset.a;
  if(a==='cerrar')close();
  else if(a==='volver'){if(S.view==='perfil'&&S.con){S.view='conv';}else{S.view='list';S.con=null;}S.pickFor=null;S.invFor=null;S.card=null;render();}
  else if(a==='modo'){ST.m=b.dataset.m;ls.set('bloques-chat-modo',ST.m);modeBtns();poll();}
  else if(a==='perfil')openProfile(b.dataset.u);
  else if(a==='invitar'){S.invFor=b.dataset.u;$('.cx-panel').dataset.sig='';render();}
  else if(a==='invx'){S.invFor=null;$('.cx-panel').dataset.sig='';render();}
  else if(a==='inv'){const who=S.invFor,g=b.dataset.g;S.invFor=null;close();try{H.invite&&H.invite(g,who);}catch(_){}}
  else if(a==='sharecon')shareTo(b.dataset.u);
  else if(a==='cardplay'){const o=S.plain[b.dataset.id];if(o&&o.card&&H.play){close();try{H.play(o.card);}catch(_){}}}
  else if(a==='cuenta'){close();H.account();}
  else if(a==='activar')activate();
  else if(a==='verpin'){S.pinAsk=true;$('.cx-panel').dataset.sig='';render();setTimeout(()=>$('#cx-pin')?.focus(),50);}
  else if(a==='pinx'){S.pinAsk=false;S.err='';$('.cx-panel').dataset.sig='';render();}
  else if(a==='enviar')send();
  else if(a==='zumbido')buzz();
  else if(a==='permiso'){try{await Notification.requestPermission();}catch(_){}render();}
  else if(a==='reac'){if(window.getSelection&&String(window.getSelection()).length)return;S.pickFor=S.pickFor===b.dataset.id?null:b.dataset.id;render();}
  else if(a==='dar')react(b.dataset.id,b.dataset.e);
}
// Chat viejo (v5–v11): abre con el PIN la llave que ya existía, sólo para leer los mensajes de antes.
// Ya no se crean llaves nuevas: desde la v12 alcanza con la cuenta. (Al entrar a la cuenta se llama sola con el PIN.)
async function ensureKey(pin){
  if(!cs||!acct())return false;
  loadLocal();if(S.key)return true;
  const j=await call(auth({accion:'llave'}));
  if(!j.llave)return false;
  const local=await openRemote(JSON.parse(j.llave),pin);
  S.key={pub:local.pub,priv:local.priv};ls.set(kKey,JSON.stringify({usuario:S.me,pub:local.pub,priv:local.priv}));
  return true;
}
async function activate(){
  const pin=String(($('#cx-pin')||{}).value||'').trim();
  if(!/^\d{4,6}$/.test(pin)){S.err='El PIN tiene de 4 a 6 números.';$('.cx-panel').dataset.sig='';render();return;}
  try{
    let okk=false;try{okk=await ensureKey(pin);}catch(e){if(e&&e.name==='OperationError'){S.err='PIN incorrecto.';$('.cx-panel').dataset.sig='';render();return;}throw e;}
    S.err=okk?'':'No hay mensajes anteriores para abrir con el PIN.';S.pinAsk=false;$('.cx-panel').dataset.sig='';await loadUsers();await decryptAll();render();
  }catch(e){S.err=String(e.message||e);$('.cx-panel').dataset.sig='';render();}
}
async function send(){
  const ta=$('#cx-in');if(!ta||!S.con)return;const txt=ta.value.trim();if(!txt)return;
  ta.value='';autoGrow(ta);ta.focus();
  const tmp={id:'tmp'+Date.now(),de:S.me,para:S.con,tipo:'msg',cont:'',ref:'',t:Date.now(),tmp:true};S.plain[tmp.id]={x:txt};S.msgs.push(tmp);render();

    const pl=JSON.stringify({x:txt}),j=await call(auth({accion:'enviar',para:S.con,tipo:'msg',p:pl}));S.ver=Number(j.version)||S.ver;
    const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);
    const m={id:j.id,de:S.me,para:S.con,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:txt};saveMsgs();S.err='';
  }catch(e){const i=S.msgs.indexOf(tmp);if(i>=0)S.msgs.splice(i,1);S.err=sinV12(e);ta.value=txt;}
  render();
}

    const m={id:j.id,de:S.me,para:name,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};S.msgs.push(m);S.plain[m.id]={x:note,card:c};saveMsgs();

/* UnoAR: el juego de cartas de colores, de 2 a 6 jugadores (la gente que falte la completa la compu).

   y una letra al final para distinguir las repetidas: 'r7a', 'r7b', 'zDa'. Comodines: 'Wa'..'Wd' y +4: 'Xa'..'Xd'.
   La partida (M) tiene todo; cada uno ve sólo lo suyo con estadoPara(M,p), girado para que él sea siempre el 0. */

    const top=H.pozo.pop();const R=M.seed?rngDe((M.seed+M.acc*7919)>>>0):azar();H.mazo=mezclar(H.pozo,R);H.pozo=[top];anotar(M,'Se mezcló el pozo para seguir robando.');}
  return H.mazo.pop()||null;}
function darCartas(M,p,k){const out=[];for(let i=0;i<k;i++){const c=robarDelMazo(M);if(!c)break;M.H.manos[p].push(c);out.push(c);}if(M.H.manos[p].length!==1)M.H.uno[p]=false;return out;}
function repartir(M,cartas){
  M.mano++;M.reparte=(M.reparte+1)%M.n;
  let d=cartas?cartas.slice():null;if(!d){const R=M.seed?rngDe((M.seed+M.mano*2654435761)>>>0):azar();d=mezclar(mazoUno(),R);}
  const manos=Array.from({length:M.n},()=>[]);for(let i=0;i<7;i++)for(let p=0;p<M.n;p++)manos[p].push(d.pop());
  // La primera del pozo es siempre un número (si sale otra cosa, va al fondo del mazo).
  let top=d.pop(),g=0;while((esComodin(top)||!/[0-9]/.test(cVal(top)))&&g++<120){d.unshift(top);top=d.pop();}
  M.H={n:M.mano,manos,mazo:d,pozo:[top],color:cCol(top),dir:1,turno:(M.reparte+1)%M.n,robo:null,olvido:null,uno:Array(M.n).fill(false),pena:0,fin:false,gano:null,pts:0,jugadas:0};
  M.ultimo=null;anotar(M,`Mano ${M.mano}: reparte ${M.nombres[M.reparte]}. Arranca ${M.nombres[M.H.turno]}.`);
}
const topPozo=M=>M.H.pozo[M.H.pozo.length-1];
// ¿Se puede tirar c? Mismo color, mismo número o símbolo, o comodín. Con +2/+4 pendientes (si se apila) sólo otro +2/+4.
function sePuede(M,c){const H=M.H,t=topPozo(M);
  if(H.pena>0)return cVal(c)==='X'||(cVal(c)==='D'&&cVal(t)==='D');
  if(esComodin(c))return true;
  return cCol(c)===H.color||cVal(c)===cVal(t);}
function acciones(M,p){const H=M.H;if(!H||H.fin||M.fin)return [];
  const out=[];
  if(H.turno===p){
    if(H.robo&&H.robo.p===p){const c=H.robo.c;if(c&&H.manos[p].includes(c)&&sePuede(M,c))out.push({t:'jugar',c});out.push({t:'pasar'});}
    else{for(const c of H.manos[p])if(sePuede(M,c))out.push({t:'jugar',c});out.push({t:'robar'});}
  }
  // ¡UNO!: el que va a quedar con una (tiene 2 y le toca) o el que quedó con una sin avisar
  if(!H.uno[p]&&((H.turno===p&&H.manos[p].length===2)||(H.olvido===p&&H.manos[p].length===1)))out.push({t:'uno'});
  if(H.olvido!==null&&H.olvido!==p&&H.manos[H.olvido].length===1)out.push({t:'cantar',a:H.olvido});
  return out;}
function quienJuega(M){return M.H&&!M.H.fin&&!M.fin?M.H.turno:null;}
// Aplica la acción a de p. Devuelve un texto de error o null.
function jugar(M,p,a){
  const H=M.H;if(!H||H.fin||M.fin)return 'La mano terminó.';
  if(a.t==='uno'){if(!acciones(M,p).some(x=>x.t==='uno'))return 'Ahora no hace falta.';H.uno[p]=true;if(H.olvido===p)H.olvido=null;anotar(M,`${M.nombres[p]}: «¡Uno!»`);M.acc++;M.ultimo={p,a:{t:'uno'}};return null;}
  if(a.t==='cantar'){const v=H.olvido;if(v===null||v===p||H.manos[v].length!==1||H.uno[v])return 'Tarde.';
    H.olvido=null;darCartas(M,v,2);anotar(M,`${M.nombres[p]} le cantó a ${M.nombres[v]} que no dijo «uno»: roba 2.`);M.acc++;M.ultimo={p,a:{t:'cantar',a:v}};return null;}
  if(H.turno!==p)return 'No es tu turno.';
  // Cualquier jugada del que sigue cierra la ventana para cantarle al que se olvidó del «uno».
  if(H.olvido!==null&&H.olvido!==p)H.olvido=null;
  if(a.t==='robar'){
    if(H.robo&&H.robo.p===p)return 'Ya robaste.';
    if(H.pena>0){const k=H.pena;H.pena=0;darCartas(M,p,k);anotar(M,`${M.nombres[p]} roba ${k}.`);M.acc++;M.ultimo={p,a:{t:'robar',k}};H.robo=null;pasarTurno(M,1);return null;}
    const [c]=darCartas(M,p,1);M.acc++;M.ultimo={p,a:{t:'robar',k:1}};anotar(M,`${M.nombres[p]} roba una.`);
    if(c&&sePuede(M,c)){H.robo={p,c};return null;}
    H.robo=null;pasarTurno(M,1);return null;}
  if(a.t==='pasar'){if(!(H.robo&&H.robo.p===p))return 'Primero tenés que robar.';H.robo=null;M.acc++;M.ultimo={p,a:{t:'pasar'}};anotar(M,`${M.nombres[p]} pasa.`);pasarTurno(M,1);return null;}
  if(a.t==='jugar'){
    const c=a.c,i=H.manos[p].indexOf(c);if(i<0)return 'No tenés esa carta.';
    if(H.robo&&H.robo.p===p&&H.robo.c!==c)return 'Sólo podés tirar la que robaste.';
    if(!sePuede(M,c))return 'Esa no se puede tirar ahora.';
    let col=cCol(c);if(esComodin(c)){col=COLORES.includes(a.color)?a.color:null;if(!col)return 'Elegí un color.';}
    H.manos[p].splice(i,1);H.pozo.push(c);H.color=col;H.robo=null;H.jugadas++;M.acc++;
    M.ultimo={p,a:{t:'jugar',c,color:esComodin(c)?col:undefined}};
    anotar(M,`${M.nombres[p]} tira ${nombreCarta(c)}${esComodin(c)?` y pide ${CNOM[col]}`:''}.`);
    const quedan=H.manos[p].length;
    if(quedan===1&&!H.uno[p])H.olvido=p;     // se olvidó de decir «uno»: lo pueden cantar hasta que juegue el que sigue
    if(quedan!==1)H.uno[p]=false;
    if(quedan===0){aplicarEfecto(M,p,c,true);terminarMano(M,p);return null;}
    aplicarEfecto(M,p,c,false);return null;}
  return 'Acción desconocida.';
}
function aplicarEfecto(M,p,c,ultima){const H=M.H,v=cVal(c);
  if(v==='R'){if(M.n===2){if(!ultima)pasarTurno(M,2);return;}H.dir*=-1;if(!ultima)pasarTurno(M,1);return;}
  if(v==='S'){if(!ultima){anotar(M,`${M.nombres[siguiente(M,p)]} pierde el turno.`);pasarTurno(M,2);}return;}
  if(v==='D'||v==='X'){const k=v==='D'?2:4,q=siguiente(M,p);
    if(M.apilar&&!ultima){H.pena+=k;pasarTurno(M,1);return;}
    const tot=k+(H.pena||0);H.pena=0;darCartas(M,q,tot);anotar(M,`${M.nombres[q]} roba ${tot} y pierde el turno.`);if(!ultima)pasarTurno(M,2);return;}
  if(!ultima)pasarTurno(M,1);}
function pasarTurno(M,k){const H=M.H;H.turno=siguiente(M,H.turno,k);}
function terminarMano(M,p){const H=M.H;let pts=0;
  for(let q=0;q<M.n;q++)if(q!==p)for(const c of H.manos[q])pts+=puntosCarta(c);
  H.fin=true;H.gano=p;H.pts=pts;H.olvido=null;M.puntos[p]+=pts;
  anotar(M,`${M.nombres[p]} se quedó sin cartas y gana la mano: ${pts} puntos.`);
  if(!M.meta||M.puntos[p]>=M.meta){M.fin=true;M.gano=p;anotar(M,`${M.nombres[p]} gana la partida.`);}
}

/* ───── Lo que ve cada uno (girado: él es el 0) ───── */
function estadoPara(M,p){
  const H=M.H,n=M.n,rel=q=>q===null||q===undefined?q:((q-p)%n+n)%n,rot=a=>a.map((_,i)=>a[(i+p)%n]);
  const out={id:M.id,n,mano:M.mano,acc:M.acc,meta:M.meta,apilar:M.apilar,nombres:rot(M.nombres),tipos:rot(M.tipos),puntos:rot(M.puntos),fin:M.fin,gano:rel(M.gano),log:M.log.slice(-30),
    reparte:rel(M.reparte)};
  if(!H)return out;
  Object.assign(out,{mias:H.manos[p].slice(),cuantas:rot(H.manos.map(m=>m.length)),top:topPozo(M),pozo:H.pozo.slice(-4),mazo:H.mazo.length,color:H.color,dir:H.dir,
    turno:rel(H.turno),robo:H.robo&&H.robo.p===p?{c:H.robo.c}:(H.robo?{otro:rel(H.robo.p)}:null),olvido:rel(H.olvido),uno:rot(H.uno),pena:H.pena,
    finMano:H.fin?{gano:rel(H.gano),pts:H.pts}:null,acciones:acciones(M,p)});
  const u=M.ultimo;out.ultimo=u?{p:rel(u.p),a:u.a.t==='cantar'?{t:'cantar',a:rel(u.a.a)}:{...u.a}}:null;
  return out;
}
// Para la compu: sólo lo que ve (sus cartas, lo que hay arriba del pozo y cuántas tiene cada uno).
function vistaDe(M,p){return estadoPara(M,p);}

/* ───── La compu ─────
   Fácil: tira lo primero que puede. Normal: guarda los comodines, sigue el color que más tiene y castiga al que
   está por ganar. Difícil: además cuenta lo que salió y elige el color que menos le sirve al que sigue. */
const NIVEL_UNO={facil:{uno:.7,cantar:.35},normal:{uno:.93,cantar:.7},dificil:{uno:1,cantar:.95}};
function colorPreferido(mias){const k={r:0,a:0,v:0,z:0};for(const c of mias){const x=cCol(c);if(x)k[x]+=1+(/[SRD]/.test(cVal(c))?.3:0);}
  return COLORES.slice().sort((x,y)=>k[y]-k[x])[0];}
function decidir(V,nivel='normal',R=Math.random){
  const A=V.acciones||[];if(!A.length)return null;
  const jug=A.filter(a=>a.t==='jugar');
  if(A.some(a=>a.t==='uno')&&(jug.length||V.olvido===0)&&R()<NIVEL_UNO[nivel].uno)return {t:'uno'};// avisa sólo si va a tirar (o si ya se olvidó)
  if(V.turno!==0)return null;
  const otro=A.find(a=>a.t==='pasar');
  if(!jug.length)return otro||{t:'robar'};
  const amenaza=V.cuantas[V.dir===1?1:V.n-1]<=2,mias=V.mias;
  const col=colorPreferido(mias.filter(c=>!esComodin(c)));
  const pick=c=>{const a={t:'jugar',c};if(esComodin(c))a.color=col;return a;};
  if(nivel==='facil'){const nc=jug.filter(a=>!esComodin(a.c));const lista=nc.length?nc:jug;return pick(lista[Math.floor(R()*lista.length)].c);}
  let best=null,bs=-1e9;
  for(const a of jug){const c=a.c,v=cVal(c);let s=0;
    if(esComodin(c))s-=v==='X'?14:9;                    // los comodines se guardan para cuando hacen falta
    if(cCol(c)===col)s+=4;
    s+=puntosCarta(c)*.08;                               // sacarse de encima lo que más pesa
    if(amenaza&&(v==='D'||v==='X'||v==='S'||(v==='R'&&V.n>2)))s+=nivel==='dificil'?22:14;
    if(!amenaza&&(v==='D'||v==='X'))s-=nivel==='dificil'?3:0;
    if(mias.length<=2&&esComodin(c))s+=12;              // con pocas cartas, el comodín asegura
    s+=R()*(nivel==='dificil'?1:3);
    if(s>bs){bs=s;best=c;}}
  // Si lo único que hay es un +4 y no hay apuro, a veces conviene robar.
  if(best&&cVal(best)==='X'&&jug.length===1&&!amenaza&&nivel!=='facil'&&mias.length>4&&R()<.35&&!V.robo)return {t:'robar'};
  return pick(best);
}
// ¿La compu le canta a alguien que no dijo «uno»?
function botCanta(V,nivel,R=Math.random){const a=(V.acciones||[]).find(x=>x.t==='cantar');return a&&R()<NIVEL_UNO[nivel].cantar?a:null;}

</script>
<script>
'use strict';
/* ───────── Cartas dibujadas en el código ─────────
   Diseño propio: campo de color con una trama fina, una ficha central con el número o el símbolo y los índices
   en las esquinas. Comodines: fondo carbón con una rosa de cuatro pétalos de colores. */
const CCOL={r:'#c4453a',a:'#e0a93b',v:'#3f8c5d',z:'#2f6aa6'};
const CDARK={r:'#8f2a22',a:'#a87517',v:'#265d3b',z:'#1c4573'};
const CSEL={r:'#f07a6b',a:'#ffd57a',v:'#7fd39f',z:'#7fb2ef'};
function glifo(v,x,y,s,fill){
  if(/[0-9]/.test(v))return `<text x="${x}" y="${y+s*.36}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s}" fill="${fill}">${v}</text>`;
  if(v==='D')return `<text x="${x}" y="${y+s*.3}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s*.78}" fill="${fill}">+2</text>`;
  if(v==='X')return `<text x="${x}" y="${y+s*.3}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s*.78}" fill="${fill}">+4</text>`;
  if(v==='S'){const r=s*.36;return `<g fill="none" stroke="${fill}" stroke-width="${s*.11}" stroke-linecap="round"><circle cx="${x}" cy="${y}" r="${r}"/><path d="M${x-r*.7} ${y+r*.7}L${x+r*.7} ${y-r*.7}"/></g>`;}
  if(v==='R'){const r=s*.34,w=s*.1;return `<g fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M${x-r} ${y-r*.15}A${r} ${r} 0 0 1 ${x+r*.75} ${y-r*.65}"/><path d="M${x+r*.35} ${y-r*1.05}L${x+r*.8} ${y-r*.62}L${x+r*.28} ${y-r*.3}"/>
    <path d="M${x+r} ${y+r*.15}A${r} ${r} 0 0 1 ${x-r*.75} ${y+r*.65}"/><path d="M${x-r*.35} ${y+r*1.05}L${x-r*.8} ${y+r*.62}L${x-r*.28} ${y+r*.3}"/></g>`;}

  const p=(ang,col)=>{const a=ang*Math.PI/180,c=Math.cos(a),s=Math.sin(a);const tx=(u,v)=>`${(x+u*c-v*s).toFixed(1)} ${(y+u*s+v*c).toFixed(1)}`;

function cartaSVG(c){
  const v=cVal(c),k=cCol(c),wild=esComodin(c),base=wild?'#24212b':CCOL[k],dark=wild?'#141218':CDARK[k];
  const ink=wild?'#f4ecdc':'#fbf6ea',idx=(x,y,rot)=>`<g transform="translate(${x} ${y}) rotate(${rot})">${v==='W'?rosa(0,0,9):v==='X'?`<text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="${ink}">+4</text>`:glifo(v,0,0,v==='D'?18:20,ink)}</g>`;
  const centro=v==='X'?`${rosa(60,82,30)}<g transform="translate(0 2)">${glifo('X',60,128,30,ink)}</g>`:wild?rosa(60,90,34):glifo(v,60,90,v==='D'?54:62,dark);
  const ficha=wild?'':`<rect x="24" y="44" width="72" height="92" rx="16" fill="#fbf6ea" stroke="${dark}" stroke-width="2.5"/><rect x="29" y="49" width="62" height="82" rx="12" fill="none" stroke="${base}" stroke-width="1.2" opacity=".55"/>`;
  return `<svg viewBox="0 0 120 180" aria-hidden="true"><defs><pattern id="tr-${k||'w'}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="6" height="6" fill="${base}"/><rect width="1.4" height="6" fill="rgba(255,255,255,.07)"/></pattern></defs>
    <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="5" y="5" width="110" height="170" rx="9" fill="url(#tr-${k||'w'})"/>
    <rect x="5" y="5" width="110" height="170" rx="9" fill="none" stroke="${dark}" stroke-width="1.5"/>
    ${ficha}${centro}${idx(18,22,0)}${idx(102,158,180)}</svg>`;}
function dorsoSVG(){return `<svg viewBox="0 0 120 180" aria-hidden="true"><defs><pattern id="dz" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#5b1f2b"/><path d="M7 0L14 7L7 14L0 7Z" fill="none" stroke="rgba(244,214,160,.22)" stroke-width="1.2"/><circle cx="7" cy="7" r="1.3" fill="rgba(244,214,160,.3)"/></pattern></defs>
  <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="6" y="6" width="108" height="168" rx="9" fill="url(#dz)" stroke="#3b111a" stroke-width="1.5"/>
  <rect x="18" y="56" width="84" height="68" rx="34" fill="#3b111a" stroke="#d7b874" stroke-width="2"/><text x="60" y="99" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="22" fill="#f1dca8" letter-spacing="1">Uno<tspan fill="#e0a93b">AR</tspan></text></svg>`;}
function cartaHtml(c,cls=''){return `<span class="card${cls?' '+cls:''}" data-c="${c}" role="img" aria-label="${nombreCarta(c)}">${cartaSVG(c)}</span>`;}
function dorsoHtml(cls=''){return `<span class="card back${cls?' '+cls:''}" aria-hidden="true">${dorsoSVG()}</span>`;}

/* ───────── UnoAR: la mesa ─────────
   De 2 a 6 jugadores: contra la compu o en línea con amigos (los lugares que falten los juega la compu).
   Las reglas están en el motor (arriba); acá se dibuja la mesa, juega la compu y se llevan los puntos. */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let FAST=false,AUTO=false,AUTO_SIN_CANTO=false;const wait=ms=>sleep(FAST?0:ms);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');

/* ───────── Sonido: cartas sobre el paño y un par de notas ───────── */
let SND=ls.get('uno-sonido')!=='0',AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function nota(f,t0=0,d=.4,v=.05,tipo='triangle'){const a=actx(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.value=f;
  o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let RUIDO=null;
function slap(t0=0,v=.5){const a=actx(),t=a.currentTime+t0;if(!RUIDO){const n=Math.floor(a.sampleRate*.07);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=RUIDO;bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.8;g.gain.value=.22*v;
  s.connect(bp).connect(g).connect(a.destination);s.start(t);s.onended=()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
const SX={carta(){slap();},robar(){slap(0,.3);slap(.07,.25);},uno(){nota(392,0,.3,.06);nota(523,.08,.4,.06);nota(659,.16,.5,.05);},cantar(){nota(330,0,.3,.06,'square');nota(247,.12,.4,.05,'square');},
  turno(){nota(784,0,.12,.025);},repartir(){for(let i=0;i<7;i++)slap(i*.05,.3);},gano(){[392,494,587,784].forEach((f,i)=>nota(f,i*.09,.6,.05));},pierdo(){[330,262,196].forEach((f,i)=>nota(f,i*.14,.6,.05));},
  msg(){nota(880,0,.1,.02);}};
function sfx(k){if(!SND||FAST)return;try{SX[k]&&SX[k]();}catch(_){}}

/* ───────── Estado ───────── */
const SAVE='uno-partida-v1';
