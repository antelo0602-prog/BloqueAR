  if(!(S.ver&&S.ver<20))return;S.invFix=S.invFix||{};
  for(const m of S.msgs.slice(-40)){const c=invCard(m);
    if(!c||c.j!=='bloquear'||S.invFix[c.inv]||lc(m.de)===lc(S.me)||(S.invSt[c.inv]&&S.invSt[c.inv]!=='esperando'))continue;
    S.invFix[c.inv]=1;
    try{const j=await call(auth({accion:'buzon',ver:c.inv})),iv=j.invitacion,of=String(iv&&iv.id===c.inv&&iv.oferta||''),k=(/^([A-Z]+):/.exec(of)||[])[1],g=k&&INV_PREF[k];
      if(!g)continue;let o=null;try{o=JSON.parse(of.slice(of.indexOf(':')+1));}catch(_){}
      c.j=g;c.t='Invitación a '+GAMES[g];c.d=o&&o.re?'Volver a la partida':g==='pool'?(({b8:'Bola 8',b9:'Bola 9',b10:'Bola 10',caram:'Carambola',tres:'Tres bandas'}[o&&o.modo]||'Pool')+(o&&Number(o.n)===4?' · Dobles (2 contra 2)':' · mano a mano')):o&&Number(o.n)>2?'Mesa de '+o.n:'Mano a mano';
      if($('.cx-panel'))$('.cx-panel').dataset.sig='';if(S.open)render();badges();
      if(S.espero)esperoRevisar([m]);}catch(_){}}
}
function esperoRevisar(fresh){
  const e=S.espero;if(!e||Date.now()-e.t>180000)return;
  // v70.1: una planilla vieja no conoce los juegos nuevos (LudAR, PoolAR…) y marca su tarjeta como «bloquear»: también vale.
  for(const m of fresh){const c=invCard(m);if(!c||lc(m.de)!==lc(e.host)||(e.j&&c.j!==e.j&&!(c.j==='bloquear'&&INV_URL[e.j])))continue;
    S.espero=null;try{sessionStorage.removeItem('bloques-chat-espero');}catch(_){}
    invAccion('inventrar',c.inv,c.j==='bloquear'&&e.j&&INV_URL[e.j]?e.j:c.j);return;}
}
// Para los juegos: avisar en un grupo que hay lugar en la mesa.
async function llamar(gid,card){
  const g=grupoDe(gid);if(!g)throw new Error('No encontramos ese grupo.');
  const pl=JSON.stringify({x:'',card:{...card,ll:1,host:S.me}}),para='g:'+g.id;
  const j=await call(auth({accion:'enviar',para,tipo:'msg',p:pl}));
  const m={id:j.id,de:S.me,para,tipo:'msg',cont:'',p:pl,ref:'',t:j.t};if(!S.msgs.some(x=>x.id===j.id)){S.msgs.push(m);S.plain[m.id]=JSON.parse(pl);saveMsgs();}
  return g;
}

   El mismo chat chico para todos los juegos en línea (TrucAR de a 2 y por equipos, PoblAR, AjedrezAR y el duelo de
   BloqueAR; UnoAR tiene el suyo de antes). No usa la planilla: cada juego lo manda por la conexión que ya tiene
   (en estrella: el que armó la mesa se lo pasa a los demás). En AjedrezAR distendido, el juego lo guarda en la partida.

   API (window.MESA_CHAT):
   · montar(op)  op = {
       juego: 'truco',                    // para el lugar del botón y los textos
       activo: () => bool,                // ¿hay mesa en línea? (se mira cada segundo y muestra/oculta el botón)
       enviar: m => void,                 // manda {t:'mchat', txt, eq} por la red del juego
       equipos: () => bool,               // opcional: muestra «A todos / A mi equipo»
       chip: (de, txt) => void,           // opcional: globo al lado del jugador en el juego
       sonido: () => void,                // opcional: sonido al llegar un mensaje
       nota: 'Sólo lo ve la gente…'       // opcional: texto cuando no hay mensajes
     }
   · recibir({de, txt, eq})               lo que llegó de otro (o lo que repartió el que armó la mesa)
   · sistema(txt)                         un renglón gris («Ana se cortó»)
   · cargar([{de, txt, yo}])              reemplaza todo (partidas distendidas)
   · vaciar()                             mesa nueva
   · abrir() / cerrar() / abierto()
   · limpiar(txt)                         el texto tal como se manda (sin saltos, 120 letras)
   · espera(el, op)   (v67) el mismo chat, abierto y metido en la pantalla de espera de la mesa (mientras se suma la gente):
       el = el contenedor (un <div> de la pantalla de espera) o null para sacarlo. op (opcional) = {titulo, nota}.
       Mientras está puesto, los mensajes no suman al numerito ni salen como globo. Hay que tener montar() hecho
       (el envío usa op.enviar de montar). Ejemplo: MESA_CHAT.espera(document.getElementById('ms-chat'));
   · Grupos de juego (v67): si en el chat 💬 tocaste «Jugar» en un grupo, al abrir la pantalla de espera con el botón
     «Avisar a un grupo» (#ms-ll, #qm-ll o cualquier [data-mc-llamar]) se avisa solo a ese grupo, sin preguntar.
     Los juegos que quieran abrir su mesa en línea directo pueden mirar el «#grupo=<id>» de la dirección.
   · movible(el, juego, op)   (v72) hace arrastrable un panel de chat fijo (el de acá o el propio de UnoAR/LudAR) desde su
       <header>: con umbral (un toque sigue siendo un toque), se pega al borde izquierdo o derecho, nunca queda fuera de la
       pantalla y se recuerda por juego y por orientación (localStorage «mesa-chat-pos:<juego>:v|h»). Agrega «⟲» para

function movible(el,juego,op={}){

/* «Avisar a un grupo» (v66): desde la mesa de espera de un juego, el que la armó avisa en un grupo del chat 💬

const LL={op:null,iv:0,hasta:0,busy:false};
function cerrarPick(){const x=document.getElementById('mc-pick');if(x)x.remove();}
function llamar(op){
  css();cerrarPick();const C=window.CHAT;
  // (v67) Vino de «Jugar» en un grupo: se le avisa a ese grupo sin preguntar.
  {const gj=C&&C.grupoJuego&&C.grupoJuego();if(gj&&(!gj.j||gj.j===op.j)&&C.grupos().some(g=>g.id===gj.gid)){C.grupoJuegoListo();

  const G=C&&C.grupos?C.grupos():[];
  const el=document.createElement('div');el.id='mc-pick';el.className='mc-pick';el.setAttribute('role','dialog');el.setAttribute('aria-label','Avisar a un grupo');
  el.innerHTML=`<div class="mc-pick-in"><header><b>📣 Avisar a un grupo</b><button type="button" class="mc-px" aria-label="Cerrar">✕</button></header>

  ['pointerdown','touchstart','keydown'].forEach(ev=>el.addEventListener(ev,e=>e.stopPropagation(),{passive:ev!=='keydown'}));

function escuchar(op){
  LL.op=op;LL.hasta=Date.now()+30*60e3;clearInterval(LL.iv);
  LL.iv=setInterval(async()=>{
    const o=LL.op;if(!o||Date.now()>LL.hasta){clearInterval(LL.iv);return;}
    let vivo=false;try{vivo=!!o.vivo();}catch(_){}if(!vivo){clearInterval(LL.iv);LL.op=null;return;}

}

<script>
/* ==== MOTOR ==== */
/* UnoAR: el juego de cartas de colores, de 2 a 6 jugadores (la gente que falte la completa la compu).
   Cartas como texto: color (r rojo, a amarillo, v verde, z azul) + valor (0-9, S salta, R reversa, D +2)
   y una letra al final para distinguir las repetidas: 'r7a', 'r7b', 'zDa'. Comodines: 'Wa'..'Wd' y +4: 'Xa'..'Xd'.
   La partida (M) tiene todo; cada uno ve sólo lo suyo con estadoPara(M,p), girado para que él sea siempre el 0. */
const COLORES=['r','a','v','z'];
const CNOM={r:'rojo',a:'amarillo',v:'verde',z:'azul'};
const cCol=c=>c[0]==='W'||c[0]==='X'?'':c[0];
const cVal=c=>c[0]==='W'?'W':c[0]==='X'?'X':c[1];
const esComodin=c=>c[0]==='W'||c[0]==='X';
function mazoUno(){const d=[];
  for(const k of COLORES){d.push(k+'0a');for(const v of ['1','2','3','4','5','6','7','8','9','S','R','D'])d.push(k+v+'a',k+v+'b');}
  for(const s of 'abcd')d.push('W'+s,'X'+s);
  return d;}
function puntosCarta(c){const v=cVal(c);if(v==='W'||v==='X')return 50;if(v==='S'||v==='R'||v==='D')return 20;return Number(v);}
function nombreCarta(c){const v=cVal(c);if(v==='W')return 'un comodín';if(v==='X')return 'un +4';

function rngDe(seed){let s=(seed>>>0)||1;return ()=>{s=(s+0x6D2B79F5)|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}

function mezclar(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const x=a[i];a[i]=a[j];a[j]=x;}return a;}

/* ───── Partida ─────
   o: {nombres, tipos ('yo'|'humano'|'bot' por lugar), meta (puntos para ganar; 0 = una sola mano), apilar, especial (false: no se puede terminar con una especial), seed}
   apilar (v67): false = no se apila · 'igual' = +2 sobre +2 y +4 sobre +4 · 'todo' = +2 y +4 mezclados (cualquiera sobre cualquiera).
   Las partidas viejas con apilar:true siguen como antes ('mixto': el +4 va sobre todo, el +2 sólo sobre otro +2). */

const modoApilar=a=>a===true?'mixto':APILAR.includes(a)?a:false;
function nuevaPartida(o={}){

function anotar(M,t){M.log.push(t);if(M.log.length>80)M.log=M.log.slice(-80);}

function acciones(M,p){const H=M.H;if(!H||H.fin||M.fin)return [];

  const vaAQuedar=H.turno===p&&H.manos[p].length===2&&!(H.robo&&H.robo.p===p)&&H.manos[p].some(c=>puedeTirar(M,p,c));

function quienJuega(M){return M.H&&!M.H.fin&&!M.fin?M.H.turno:null;}
// Aplica la acción a de p. Devuelve un texto de error o null.
function jugar(M,p,a){

  // Cualquier jugada del que sigue cierra la ventana para cantarle al que se olvidó del «uno».
  if(H.olvido!==null&&H.olvido!==p)H.olvido=null;
  if(a.t==='robar'){
    if(H.robo&&H.robo.p===p)return 'Ya robaste.';
    if(H.pena>0){const k=H.pena;H.pena=0;darCartas(M,p,k);anotar(M,`${M.nombres[p]} roba ${k}.`);M.acc++;M.ultimo={p,a:{t:'robar',k}};H.robo=null;pasarTurno(M,1);return null;}
    if(H.color){H.falta=H.falta||Array.from({length:M.n},()=>[]);if(!H.falta[p].includes(H.color))H.falta[p].push(H.color);}   // a la vista de todos: no tenía de ese color

    if(c&&sePuede(M,c)){H.robo={p,c};return null;}
    H.robo=null;pasarTurno(M,1);return null;}

/* ───── Lo que ve cada uno (girado: él es el 0) ───── */
function estadoPara(M,p){

// Para la compu: sólo lo que ve (sus cartas, lo que hay arriba del pozo y cuántas tiene cada uno).
function vistaDe(M,p){return estadoPara(M,p);}

/* ───── La compu ─────
   Juega sólo con lo que ve cualquiera en la mesa (vistaDe = lo mismo que ve un jugador sentado en ese lugar): sus cartas,

   · Fácil: tira casi cualquier cosa que vaya, se olvida seguido del «uno» y a veces se equivoca de color.
   · Normal: juega como una persona: sigue el color que más tiene, guarda los comodines para cuando hacen falta y castiga
     al que está por ganar, pero no siempre ve la mejor jugada.

function contarColores(mias){const k={r:0,a:0,v:0,z:0};for(const c of mias){const x=cCol(c);if(x)k[x]+=1+(/[SRD]/.test(cVal(c))?.3:0);}return k;}

function colorPedir(V,mias,nivel,R){

  if(R()<N.error)return pick(jug[Math.floor(R()*jug.length)].c);   // a veces no ve la mejor (como cualquiera)

    if(nivel==='dificil'){// mira con qué color queda la mesa después de tirar: mejor uno del que me queden muchas
      const kc=contarColores(mias.filter(x=>x!==c&&!esComodin(x))),queda=esComodin(c)?col:cCol(c);s+=(kc[queda]||0)*2.2;
      if(!amenaza&&(v==='S'||v==='R'||v==='D'))s-=2;}       // las especiales, mejor guardarlas para cuando sirvan
    else if(cCol(c)===pref)s+=4;

    if(alguien&&nivel==='dificil'&&(v==='X'||v==='D'))s+=6;   // arriesga cuando alguien está por cerrar
    if(!amenaza&&(v==='D'||v==='X'))s-=nivel==='dificil'?3:0;
    if(nivel==='dificil'&&cCol(c)&&falSig.includes(cCol(c)))s+=5;   // le deja un color que (se vio que) no tiene

  if(best&&cVal(best)==='X'&&jug.length===1&&!amenaza&&nivel!=='facil'&&mias.length>4&&R()<.35&&!V.robo)return {t:'robar'};

}
// ¿La compu le canta a alguien que no dijo «uno»?
function botCanta(V,nivel,R=Math.random){const a=(V.acciones||[]).find(x=>x.t==='cantar');return a&&R()<NIVEL_UNO[nivel].cantar?a:null;}

</script>
<script>

})();

/* ───────── Cartas dibujadas en el código ─────────

    return `<path d="M${tx(0,0)}C${tx(r*.25,-r*.55)} ${tx(r*.95,-r*.55)} ${tx(r,0)}C${tx(r*.95,r*.55)} ${tx(r*.25,r*.55)} ${tx(0,0)}Z" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`;};
  return `<g>${p(-135,CCOL.r)}${p(-45,CCOL.a)}${p(45,CCOL.v)}${p(135,CCOL.z)}<circle cx="${x}" cy="${y}" r="${r*.16}" fill="#f4ecdc"/></g>`;}
function cartaSVG(c){
  const v=cVal(c),k=cCol(c),wild=esComodin(c),base=wild?'#24212b':CCOL[k],dark=wild?'#141218':CDARK[k];
  const ink=wild?'#f4ecdc':'#fbf6ea',idx=(x,y,rot)=>`<g transform="translate(${x} ${y}) rotate(${rot})">${v==='W'?rosa(0,0,9):v==='X'?`<text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="${ink}">+4</text>`:glifo(v,0,0,v==='D'?18:20,ink)}</g>`;
  const centro=v==='X'?`${rosa(60,82,30)}<g transform="translate(0 2)">${glifo('X',60,128,30,ink)}</g>`:wild?rosa(60,90,34):glifo(v,60,90,v==='D'?54:62,dark);
  const ficha=wild?'':`<rect x="24" y="44" width="72" height="92" rx="16" fill="#fbf6ea" stroke="${dark}" stroke-width="2.5"/><rect x="29" y="49" width="62" height="82" rx="12" fill="none" stroke="${base}" stroke-width="1.2" opacity=".55"/>`;
  return `<svg viewBox="0 0 120 180" aria-hidden="true"><defs><pattern id="tr-${k||'w'}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="6" height="6" fill="${base}"/><rect width="1.4" height="6" fill="rgba(255,255,255,.07)"/></pattern></defs>
    <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="5" y="5" width="110" height="170" rx="9" fill="url(#tr-${k||'w'})"/>
    <rect x="5" y="5" width="110" height="170" rx="9" fill="none" stroke="${dark}" stroke-width="1.5"/>
    ${ficha}${centro}${idx(18,22,0)}${idx(102,158,180)}</svg>`;}

  <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="6" y="6" width="108" height="168" rx="9" fill="url(#dz)" stroke="#3b111a" stroke-width="1.5"/>
  <rect x="18" y="56" width="84" height="68" rx="34" fill="#3b111a" stroke="#d7b874" stroke-width="2"/><text x="60" y="99" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="22" fill="#f1dca8" letter-spacing="1">Uno<tspan fill="#e0a93b">AR</tspan></text></svg>`;}

/* ───────── Sonido (v67): todo sintetizado con WebAudio, liviano, con un volumen general ─────────
   Cartas sobre el paño (ruido filtrado), barajar, robar, «¡UNO!», salta, reversa, +2/+4 y la fanfarria de ganar. */
let SND=ls.get('uno-sonido')!=='0',AC=null,MASTER=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();MASTER=AC.createGain();MASTER.gain.value=.85;MASTER.connect(AC.destination);}if(AC.state==='suspended')AC.resume();return AC;}

function nota(f,t0=0,d=.4,v=.05,tipo='triangle',f2){const a=actx(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d*.9);
  o.connect(g).connect(MASTER);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let RUIDO=null;
function slap(t0=0,v=.5,fq=1900,q=.8){const a=actx(),t=a.currentTime+t0;if(!RUIDO){const n=Math.floor(a.sampleRate*.07);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=RUIDO;bp.type='bandpass';bp.frequency.value=fq;bp.Q.value=q;g.gain.value=.22*v;
  s.connect(bp).connect(g).connect(MASTER);s.start(t);s.onended=()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
const SX={
  carta(){slap(0,.6);slap(.012,.25,900,1.2);},
  apoyo(){slap(0,.2);},
  robar(){slap(0,.28,2600,.7);slap(.06,.22,2200,.7);},
  barajar(){for(let i=0;i<16;i++)slap(i*.028+(i>7?.09:0),.2+Math.random()*.15,1600+Math.random()*1400,.9);},
  repartir(){SX.barajar();for(let i=0;i<7;i++)slap(.6+i*.06,.32);},
  uno(){nota(392,0,.22,.06,'square');nota(523,.07,.25,.06,'square');nota(784,.14,.5,.06,'triangle');},
  cantar(){nota(330,0,.3,.06,'square');nota(247,.12,.4,.05,'square');},
  salta(){nota(660,0,.18,.05,'square',330);slap(0,.4);},
  reversa(){nota(440,0,.16,.045,'triangle',660);nota(660,.13,.18,.045,'triangle',440);slap(0,.35);},
  mas(){slap(0,.8,700,1);nota(196,0,.35,.07,'sawtooth',98);nota(392,.1,.25,.04,'square');},
  comodin(){[523,659,784,1046].forEach((f,i)=>nota(f,i*.05,.25,.035,'sine'));slap(0,.5);},
  turno(){nota(784,0,.12,.025);},
  gano(){[392,494,587,784,988].forEach((f,i)=>nota(f,i*.1,.7,.05));nota(196,0,1,.04,'triangle');},
  pierdo(){[330,262,196].forEach((f,i)=>nota(f,i*.14,.6,.05));},
  msg(){nota(880,0,.1,.02);}};

/* v70: MANO DEL DÍA. La misma mano para todos (el mazo sale de la fecha) contra 3 de la compu en Normal, a una mano, sin
   apilar. La compu también decide con la semilla. Ganar suma lo que les quedó a los demás; perder resta lo que te quedó.

const DIA_KEY='uno-dia-v1';

function semillaDia(f){let h=2166136261;const s='UNOAR·MANO·'+f;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0)||1;}

  if(PAMPA_CRUCE)PAMPA_CRUCE=null;if(ON)netLeave();
  const f=fechaAR(),seed=semillaDia(f);
  BOTTOK++;MODO='compu';FIN_VISTO=null;LIMITE=0;DICHOS={};hideOver();closeSheet();
  const a=acct(),bn=['Chacho','Pocha','Tito'];
  PERFILES.length=0;PERFILES.push({a:a?a.avatar:'🙂',c:a?a.color:'#3b5866'});bn.forEach((_,i)=>PERFILES.push({a:['🤖','🦉','🦊'][i],c:['#46555f','#5a4a3a','#6a3f35'][i]}));
  M=nuevaPartida({nombres:[miNombre(),...bn],tipos:['humano','bot','bot','bot'],meta:0,apilar:false,especial:true,seed});M.dia=f;M.t0=Date.now();
  repartir(M);sfx('repartir');refrescar();guardar();render();seguir();toast('📅 Mano del día: la misma para todos');
}

  if(primera){D[f]={v,t:Date.now()};const K=Object.keys(D).sort().slice(-30),O={};K.forEach(k=>O[k]=D[k]);ls.set(DIA_KEY,JSON.stringify(O));}

}

   STUN/TURN de ayuda) y le manda a cada uno sólo lo que puede ver. Las invitaciones viajan por la planilla,
   una por amigo (sin códigos de sala). Los lugares que quedan libres los juega la compu; si alguien se corta,

const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

function reglasResumen(m){return `${m.meta?'A '+m.meta:'Una mano'} · ${apilarTxt(m.apilar)} · ${m.especial===false?'no se puede terminar con una especial':'se puede terminar con una especial'}`;}
// Lista chica para invitar: primero tus amigos y los conectados; al resto lo encontrás buscando por nombre.
function genteParaInvitar(){const a=acct(),me=a?a.usuario.toLowerCase():'',q=UIQ.q.trim().toLowerCase();
  let am=[];try{if(window.CHAT&&typeof CHAT.amigos==='function')am=(CHAT.amigos()||[]).map(x=>String(x.usuario||x).toLowerCase());}catch(_){}
  const L=(UIQ.users||[]).filter(u=>u.usuario.toLowerCase()!==me).map(u=>({...u,amigo:am.includes(u.usuario.toLowerCase())}));
  const vis=q?L.filter(u=>u.usuario.toLowerCase().includes(q)):UIQ.todos?L:L.filter(u=>u.amigo||u.enLinea);
  return vis.sort((x,y)=>(y.amigo-x.amigo)||((y.enLinea?1:0)-(x.enLinea?1:0))||x.usuario.localeCompare(y.usuario)).slice(0,40);}
function listaInvitarHtml(m){const usados=new Set(m.lugares.filter(L=>L.usuario).map(L=>L.usuario.toLowerCase())),libres=m.lugares.slice(0,m.n).filter(L=>L.tipo==='libre').length;
  if(!UIQ.users)return UIQ.err?`<p class="note">${esc(UIQ.err)}</p>`:'<p class="note"><span class="busy"></span>Cargando…</p>';
  const L=genteParaInvitar();
  const todos=!UIQ.q&&!UIQ.todos&&(UIQ.users||[]).length>L.length+1?`<li class="mas"><button class="lnk" id="ms-todos">Ver a todos los jugadores</button></li>`:'';
  if(!L.length)return `<p class="note">${UIQ.q?'Nadie con ese nombre.':'Ahora no hay nadie conectado. Buscá a alguien por su nombre: le llega la invitación y entra cuando la vea.'}</p>${todos?`<ul class="ulist">${todos}</ul>`:''}`;
  return todos+L.map(u=>`<li>${avHtml(u.avatar,u.color)}<span class="nm">${esc(u.usuario)}${u.enLinea?'<i class="dot"></i>':''}${u.amigo?' <small>amigo</small>':''}</span><button data-u="${esc(u.usuario)}" ${usados.has(u.usuario.toLowerCase())||!libres?'disabled':''}>${usados.has(u.usuario.toLowerCase())?'En la mesa':'Invitar'}</button></li>`).join('');}
function charlaHtml(){return `<div class="charla"><div class="msgs" id="lb-msgs"></div><form id="lb-f"><input id="lb-t" maxlength="120" placeholder="Escribile a la mesa" autocomplete="off" enterkeyhint="send"><button type="submit">Mandar</button></form></div>`;}
function cablearCharla(){const f=$('lb-f');if(!f)return;drawChat();
  f.onsubmit=e=>{e.preventDefault();const t=$('lb-t');mandarChat(t.value);t.value='';};$('lb-t').addEventListener('keydown',e=>e.stopPropagation());}
function drawLobby(){
  if(!ON||ON.role!=='host'||!LOBBY)return;const m=ON.mesa;
  const ocupados=m.lugares.slice(0,m.n).filter(L=>L.tipo!=='libre').length,libres=m.n-ocupados;
  const minN=Math.max(2,m.lugares.filter(L=>L.tipo==='humano'||L.tipo==='invitado').length+1);
  const enfoque=document.activeElement&&document.activeElement.id,borrador=$('lb-t')?$('lb-t').value:'';
  if(PASO==='reglas'){
    sheet('Jugar en línea',`<div class="seg modos"><button class="btn" id="ms-compu">🤖 La compu</button><button class="btn on" aria-pressed="true">👥 En línea</button></div>${pasosHtml('reglas')}
      <h4>Jugadores</h4><div class="seg">${[2,3,4,5,6].map(k=>`<button class="btn${m.n===k?' on':''}" data-n="${k}" ${k<minN?'disabled':''}>${k}</button>`).join('')}</div>
      <p class="note">Los lugares que no llenes con amigos los juega la compu.</p>
      <h4>Hasta cuándo</h4><div class="seg"><button class="btn${m.meta===0?' on':''}" data-meta="0">Una mano</button><button class="btn${m.meta===100?' on':''}" data-meta="100">A 100</button><button class="btn${m.meta===200?' on':''}" data-meta="200">A 200</button></div>
      ${reglasApilarHtml(m.apilar)}
      <h4>Terminar con especial</h4><div class="seg"><button class="btn${m.especial!==false?' on':''}" data-esp="1">Sí</button><button class="btn${m.especial===false?' on':''}" data-esp="0">No</button></div>
      <p class="note">${m.especial===false?'La última carta no puede ser un salta, reversa, +2 ni comodín: si te queda una así, robás.':'Se puede ganar tirando como última carta un salta, reversa, +2 o comodín.'}</p>
      ${window.RANGOS?`<h4>Partida</h4><div class="seg"><button class="btn${RANGOS.isRanked('uno')?' on':''}" data-rk="1">Ranked</button><button class="btn${RANGOS.isRanked('uno')?'':' on'}" data-rk="0">Amistosa</button></div>`:''}
      <div class="row pie"><button class="btn" id="ms-x">‹ Volver</button><button class="btn go" id="ms-sig">Invitar amigos</button></div>`);
  }else{
    sheet('Jugar en línea',`${pasosHtml('invitar')}
      <p class="note reglas-r">${esc(reglasResumen(m))} · <button class="lnk" id="ms-reglas">cambiar</button></p>
      <div class="seg lug">${[2,3,4,5,6].map(k=>`<button class="btn chico${m.n===k?' on':''}" data-n="${k}" ${k<minN?'disabled':''}>${k}</button>`).join('')}</div>
      <div class="mesa">${m.lugares.map((L,i)=>lugarHtml(L,i,m.n)).join('')}</div>
      <h4>Invitar amigos <small class="note">${libres?(libres===1?'1 lugar libre':libres+' lugares libres'):'mesa llena'}</small></h4>
      <input class="buscar" id="ms-q" type="search" placeholder="Buscar por nombre" value="${esc(UIQ.q)}" autocomplete="off">
      <ul class="ulist chica" id="ms-ul">${listaInvitarHtml(m)}</ul>
      <div class="mini-acts">${window.MESA_CHAT&&libres?'<button class="btn chico" id="ms-ll">📣 Avisar a un grupo</button>':''}${m.lugares.filter(L=>L.tipo==='invitado').length>1?'<button class="btn chico" id="ms-xinv">Cancelar las invitaciones</button>':''}<button class="btn chico" id="ms-x">Cerrar la mesa</button></div>
      <h4>Charla de la mesa</h4>${charlaHtml()}
      <div class="row pie"><button class="btn" id="ms-atras">‹ Reglas</button><button class="btn go" id="ms-go">Iniciar partida</button></div>`);
  }
  document.querySelectorAll('#sheet [data-n]').forEach(b=>b.onclick=()=>{m.n=Number(b.dataset.n);ls.set('uno-mesa-n',String(m.n));
    // si achica, los invitados que quedan afuera se cancelan
    m.lugares.forEach((L,i)=>{if(i>=m.n&&L.tipo!=='libre'&&L.tipo!=='yo')soltarLugar(i,true);});enviarMesa();});
  document.querySelectorAll('#sheet [data-meta]').forEach(b=>b.onclick=()=>{m.meta=Number(b.dataset.meta);CFG.meta=m.meta;ls.set('uno-meta',String(m.meta));enviarMesa();});
  document.querySelectorAll('#sheet [data-ap]').forEach(b=>b.onclick=()=>{m.apilar=b.dataset.ap==='no'?false:b.dataset.ap;CFG.apilar=m.apilar;ls.set('uno-apilar',m.apilar||'0');enviarMesa();});
  document.querySelectorAll('#sheet [data-esp]').forEach(b=>b.onclick=()=>{m.especial=b.dataset.esp==='1';CFG.especial=m.especial;ls.set('uno-especial',m.especial?'1':'0');enviarMesa();});
  document.querySelectorAll('#sheet [data-rk]').forEach(b=>b.onclick=()=>{RANGOS.setRanked('uno',b.dataset.rk==='1');drawLobby();});
  const cablearLista=()=>{document.querySelectorAll('#ms-ul button[data-u]').forEach(b=>b.onclick=()=>{const u=(UIQ.users||[]).find(x=>x.usuario===b.dataset.u);if(u)invitarALugar(u);});
    const t=$('ms-todos');if(t)t.onclick=()=>{UIQ.todos=true;$('ms-ul').innerHTML=listaInvitarHtml(m);cablearLista();};};
  cablearLista();
  if($('ms-q'))$('ms-q').oninput=e=>{UIQ.q=e.target.value;$('ms-ul').innerHTML=listaInvitarHtml(m);cablearLista();};
  document.querySelectorAll('#sheet [data-x]').forEach(b=>b.onclick=()=>{soltarLugar(Number(b.dataset.x),true);enviarMesa();});
  if($('ms-xinv'))$('ms-xinv').onclick=()=>{m.lugares.forEach((L,i)=>{if(L.tipo==='invitado')soltarLugar(i,true);});enviarMesa();};
  if($('ms-ll'))$('ms-ll').onclick=()=>MESA_CHAT.llamar({j:'uno',mesa:m.id,t:`UnoAR de a ${m.n} · ¿quién se prende?`,d:'Los lugares que queden los juega la compu.',
    vivo:()=>!!(ON&&ON.role==='host'&&ON.state==='mesa'&&ON.mesa===m),
    libres:()=>m.lugares.slice(0,m.n).filter(L=>L.tipo==='libre').length,
    ya:n=>m.lugares.some(L=>L.usuario&&L.usuario.toLowerCase()===String(n).toLowerCase()),
    invitar:u=>invitarALugar(u)});
  $('ms-x').onclick=()=>{LOBBY=false;netLeave();closeSheet();};
  // v68: desde las reglas se vuelve a «Partida nueva» (contra la compu): antes quedabas atrapado en «En línea».
  if(PASO==='reglas'){const volver=()=>{if(m.lugares.some(L=>L.tipo==='humano'||L.tipo==='invitado')&&!confirm('¿Cerrar la mesa? Se cancelan las invitaciones.'))return;LOBBY=false;netLeave();closeSheet();openNew();};
    $('ms-x').onclick=volver;if($('ms-compu'))$('ms-compu').onclick=volver;}
  if($('ms-sig'))$('ms-sig').onclick=()=>{PASO='invitar';drawLobby();};
  if($('ms-reglas'))$('ms-reglas').onclick=()=>{PASO='reglas';drawLobby();};
  if($('ms-atras'))$('ms-atras').onclick=()=>{PASO='reglas';drawLobby();};
  if($('ms-go'))$('ms-go').onclick=()=>{LOBBY=false;closeSheet();empezarMesa();};
  $('sh-x').onclick=()=>{LOBBY=false;$('modal').hidden=true;};
  cablearCharla();if($('lb-t')&&borrador)$('lb-t').value=borrador;
  if(enfoque&&$(enfoque)&&/^(ms-q|lb-t)$/.test(enfoque)){const el=$(enfoque);el.focus({preventScroll:true});try{el.setSelectionRange(el.value.length,el.value.length);}catch(_){}}
}
// Ir directo al paso de invitar (la mesa ya tiene las reglas de siempre). todos: mostrar a todos los jugadores en la lista.
function irAInvitar(todos=false){if(!ON||ON.role!=='host')openMesa();if(!ON||ON.role!=='host')return;PASO='invitar';if(todos)UIQ.todos=true;LOBBY=true;drawLobby();}
async function cargarUsuarios(){
  try{const j=await lbCall({accion:'usuarios'},false);if(!Array.isArray(j.usuarios))throw new Error('Hay que actualizar el código de la planilla.');UIQ.users=j.usuarios;UIQ.err='';}catch(e){UIQ.err=e.message;}
  if(LOBBY)drawLobby();
}
function soltarLugar(i,cancelar){const L=ON.mesa.lugares[i];if(!L)return;
  if(cancelar&&L.id&&L.tipo==='invitado'){const a=acct();if(a)lbCall({accion:'cancelar',usuario:a.usuario,token:a.token,id:L.id}).catch(()=>{});}
  if(L.ch)sendCh(L.ch,{t:'bye'});try{L.pc&&L.pc.close();}catch(_){}
  ON.mesa.lugares[i]={tipo:'libre'};}
async function invitarALugar(u){
  const a=acct(),m=ON&&ON.mesa;if(!a||!m)return;
  const i=m.lugares.findIndex((L,k)=>k<m.n&&L.tipo==='libre');if(i<0){toast('No hay lugares libres: agrandá la mesa.');return;}
  const L={tipo:'invitado',usuario:u.usuario,avatar:u.avatar,color:u.color,msg:'Preparando la invitación…'};m.lugares[i]=L;enviarMesa();
  const quien=ON;
  try{
    const pc=new RTCPeerConnection({iceServers:await iceServers()});L.pc=pc;
    const ch=pc.createDataChannel('uno',{ordered:true});
    ch.onopen=()=>{if(ON!==quien||m.lugares[i]!==L)return;L.ch=ch;
      if(ON.state==='juego'){sendCh(ch,{t:'bye'});return;}         // la partida ya empezó
      L.tipo='humano';L.msg='';sfx('turno');toast(`🔗 ${esc(L.usuario)} se sentó a la mesa`);enviarMesa();};
    ch.onclose=()=>perdioLugar(i,L);
    ch.onmessage=e=>{let x;try{x=JSON.parse(e.data);}catch(_){return;}msgDeLugar(i,L,x);};
    pc.onconnectionstatechange=()=>{if(['failed','closed'].includes(pc.connectionState))perdioLugar(i,L);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(m.lugares[i]!==L)return;
    const j=await lbCall({accion:'invitar',usuario:a.usuario,token:a.token,para:u.usuario,oferta:'UNO:'+JSON.stringify({sdp:pc.localDescription.sdp,mesa:m.id,seat:i,n:m.n})});
    if(m.lugares[i]!==L)return;L.id=j.id;L.msg='Esperando que acepte…';enviarMesa();
    const t0=Date.now();
    while(m.lugares[i]===L&&L.tipo==='invitado'&&Date.now()-t0<7200000){   // v15: vale mientras la mesa espere (hasta 2 h)
      await sleep(2000);if(m.lugares[i]!==L)return;
      let r;try{r=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,id:L.id});}catch(_){continue;}
      if(m.lugares[i]!==L)return;
      if(r.estado==='aceptada'&&r.respuesta){L.msg='Conectando…';enviarMesa();await pc.setRemoteDescription({type:'answer',sdp:JSON.parse(r.respuesta).sdp});
        setTimeout(()=>{if(m.lugares[i]===L&&L.tipo==='invitado'){toast(`No se pudo conectar con ${esc(L.usuario)}.`);soltarLugar(i,false);enviarMesa();}},45000);return;}
      if(r.estado==='rechazada'){toast(`${esc(L.usuario)} dijo «ahora no».`);soltarLugar(i,false);enviarMesa();return;}
      if(r.estado==='vencida'||r.estado==='cancelada'){soltarLugar(i,false);enviarMesa();return;}
    }
    if(m.lugares[i]===L&&L.tipo==='invitado'){toast(`${esc(L.usuario)} no respondió.`);soltarLugar(i,true);enviarMesa();}
  }catch(e){if(m.lugares[i]===L){toast(esc(e.message||'No se pudo invitar.'));soltarLugar(i,true);enviarMesa();}}
}
function perdioLugar(i,L){
  if(!ON||ON.role!=='host'||ON.mesa.lugares[i]!==L||L.perdido)return;L.perdido=true;
  const nom=L.usuario;try{L.pc&&L.pc.close();}catch(_){}L.ch=null;
  // v63: si se cortó (no se fue a propósito), se le guarda el lugar un rato: juega la compu por él y le mandamos
  // solos una invitación para volver; si vuelve, recupera su lugar y su mano.
  if(ON.state==='juego'&&M&&!M.fin&&M.tipos[i]==='humano'&&!L.salio&&window.RECON&&nom){
    const hasta=Date.now()+RECON.GRACIA;
    M.tipos[i]='bot';ON.mesa.lugares[i]={tipo:'ausente',usuario:nom,avatar:L.avatar,color:L.color,hasta};
    const txt=`${nom} se cortó: juega la compu por ${nom} hasta que vuelva.`;addChat('',txt);netSend({t:'chat',de:'',txt});
    RECON.cartel('uno-'+i,`${nom} se cortó · esperándolo…`,hasta,()=>noVolvio(i,nom));netSend({t:'corte',nom,ms:RECON.GRACIA});
    refrescar();render();enviarEstados();seguir();esperarVuelta(i,nom,hasta);return;}
  if(ON.state==='juego'&&M&&M.tipos[i]==='humano'){// sigue la compu en su lugar
    M.tipos[i]='bot';M.nombres[i]=nom+' 🤖';ON.mesa.lugares[i]={tipo:'libre'};
    toast(`⚠️ ${esc(nom)} se desconectó. Sigue la compu en su lugar.`);addChat('',`${nom} se desconectó: juega la compu en su lugar.`);
    refrescar();render();enviarEstados();if(!hayGente()){LIMITE=0;}seguir();return;}
  if(L.tipo==='humano'||L.tipo==='invitado'){ON.mesa.lugares[i]={tipo:'libre'};toast(`${esc(nom)} se fue de la mesa.`);enviarMesa();}
}
// v63: el que se cortó, de vuelta en la mesa
async function esperarVuelta(i,nom,hasta){
  const m=ON&&ON.mesa,quien=ON;if(!m)return;
  const sigue=()=>ON===quien&&m.lugares[i]&&m.lugares[i].tipo==='ausente'&&m.lugares[i].usuario===nom;
  try{
    const pc=new RTCPeerConnection({iceServers:await iceServers()});const ch=pc.createDataChannel('uno',{ordered:true});
    let NL=null;
    ch.onopen=()=>{if(!sigue()||!M){try{pc.close();}catch(_){}return;}const A=m.lugares[i];
      NL={tipo:'humano',usuario:nom,avatar:A.avatar,color:A.color,pc,ch};m.lugares[i]=NL;M.tipos[i]='humano';
      RECON.quitar('uno-'+i);if(rv)rv.cancelar();
      const txt=`${nom} volvió a la mesa.`;addChat('',txt);netSend({t:'chat',de:'',txt});netSend({t:'volvio',nom});toast(`🔗 ${esc(nom)} volvió`);sfx('turno');
      enviarMesa();refrescar();render();enviarEstados();seguir();};
    ch.onclose=()=>{if(NL)perdioLugar(i,NL);};
    ch.onmessage=e=>{let x;try{x=JSON.parse(e.data);}catch(_){return;}if(NL)msgDeLugar(i,NL,x);};
    pc.onconnectionstatechange=()=>{if(NL&&['failed','closed'].includes(pc.connectionState))perdioLugar(i,NL);};
    await pc.setLocalDescription(await pc.createOffer());await gathered(pc);if(!sigue()){pc.close();return;}
    var rv=RECON.reinvitar({prefijo:'UNO:',para:nom,oferta:{sdp:pc.localDescription.sdp,mesa:m.id,seat:i,n:m.n},hasta,vivo:sigue,
      onRespuesta:sdp=>{if(sigue())pc.setRemoteDescription({type:'answer',sdp}).catch(()=>{});}});
    m.lugares[i].rv=rv;
  }catch(e){console.warn('vuelta',e);}
}
function noVolvio(i,nom){const m=ON&&ON.mesa;if(!m||!m.lugares[i]||m.lugares[i].tipo!=='ausente'||m.lugares[i].usuario!==nom)return;
  try{m.lugares[i].rv&&m.lugares[i].rv.cancelar();}catch(_){}
  m.lugares[i]={tipo:'libre'};if(M){M.nombres[i]=nom+' 🤖';}
  const txt=`${nom} no volvió: sigue la compu en su lugar.`;addChat('',txt);netSend({t:'chat',de:'',txt});netSend({t:'volvio',nom,no:1});toast(`⚠️ ${esc(txt)}`);
  if(M){refrescar();render();enviarEstados();if(!hayGente())LIMITE=0;seguir();}}
function msgDeLugar(i,L,x){
  if(x.t==='hola'){if(x.yo){L.avatar=x.yo.avatar||L.avatar;L.color=x.yo.color||L.color;}enviarMesa();return;}
  if(x.t==='bye'){if(!x.corte)L.salio=true;perdioLugar(i,L);return;}
  if(x.t==='chat'){const t=limpiarChat(x.txt);if(t)chatDe(L.usuario,t,i);return;}
  if(x.t==='accion'&&M&&ON.state==='juego'&&M.tipos[i]==='humano'){
    const a=x.a||{};const err=aplicar(i,a);if(err){sendCh(L.ch,{t:'error',msg:err});enviarEstados();}return;}
}
// Empieza: los lugares libres (o con invitaciones sin contestar) quedan para la compu.
function empezarMesa(){
  const m=ON&&ON.mesa;if(!m)return;
  m.lugares.forEach((L,i)=>{if(i>=m.n)return;if(L.tipo==='invitado')soltarLugar(i,true);});
  // los que quedaron más allá de n se van
  m.lugares.forEach((L,i)=>{if(i>=m.n&&L.tipo!=='libre')soltarLugar(i,true);});
  ON.state='juego';MODO='host';BOTTOK++;FIN_VISTO=null;DICHOS={};hideOver();
  const L=m.lugares.slice(0,m.n),bots=L.filter(x=>x.tipo==='libre').length,bn=botNombres(bots,L.filter(x=>x.usuario).map(x=>x.usuario));let b=0;
  PERFILES.length=0;
  const nombres=[],tipos=[];

  L.forEach((x,i)=>{if(x.tipo==='libre'||x.tipo==='ausente'){nombres.push(x.tipo==='ausente'?x.usuario:bn[b]);tipos.push('bot');PERFILES.push({a:['🤖','🦉','🦊','🐢','🦜'][b]||'🤖',c:['#46555f','#5a4a3a','#6a3f35','#3f5a45','#4a3f60'][b]||'#46555f'});b++;}
    else{nombres.push(x.usuario);tipos.push('humano');PERFILES.push({a:x.avatar||'🙂',c:x.color||'#3b5866'});}});
  M=nuevaPartida({nombres,tipos,meta:m.meta,apilar:m.apilar,especial:m.especial!==false});repartir(M);sfx('repartir');refrescar();render();renderOnline();enviarEstados();seguir();
}
function otraMesa(){if(!ON||ON.role!=='host'){openNew();return;}
  if(!ON.mesa.lugares.some(L=>L.tipo==='humano')){toast('Ya no queda nadie conectado: jugás con la compu.');}
  empezarMesa();}

/* ── Sumarse a una mesa (el invitado) ── */
async function acceptInvite(inv,vuelta=false){
  const a=acct();if(!a)return;UIQ.dismissed.add(inv.id);
