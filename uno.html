// ¿Se puede tirar c? Mismo color, mismo número o símbolo, o comodín. Con +2/+4 pendientes (si se apila) sólo otro +2/+4.
function sePuede(M,c){const H=M.H,t=topPozo(M);
  if(H.pena>0)return cVal(c)==='X'||(cVal(c)==='D'&&cVal(t)==='D');
  if(esComodin(c))return true;
  return cCol(c)===H.color||cVal(c)===cVal(t);}
// Especiales: salta, reversa, +2, comodín y +4. Con «Terminar con especial: No» no pueden ser la última carta.
const esEspecial=c=>{const v=cVal(c);return v==='S'||v==='R'||v==='D'||v==='W'||v==='X';};
const cierraMal=(M,p,c)=>M.especial===false&&M.H.manos[p].length===1&&esEspecial(c);
function puedeTirar(M,p,c){return sePuede(M,c)&&!cierraMal(M,p,c);}
function acciones(M,p){const H=M.H;if(!H||H.fin||M.fin)return [];
  const out=[];
  if(H.turno===p){
    if(H.robo&&H.robo.p===p){const c=H.robo.c;if(c&&H.manos[p].includes(c)&&puedeTirar(M,p,c))out.push({t:'jugar',c});out.push({t:'pasar'});}
    else{for(const c of H.manos[p])if(puedeTirar(M,p,c))out.push({t:'jugar',c});out.push({t:'robar'});}
  }
  // ¡UNO!: el que va a quedar con una (tiene 2, le toca y tiene alguna para tirar) o el que quedó con una sin avisar
  const vaAQuedar=H.turno===p&&H.manos[p].length===2&&!(H.robo&&H.robo.p===p)&&H.manos[p].some(c=>puedeTirar(M,p,c));
  if(!H.uno[p]&&(vaAQuedar||(H.olvido===p&&H.manos[p].length===1)))out.push({t:'uno'});
  if(H.olvido!==null&&H.olvido!==p&&H.manos[H.olvido].length===1)out.push({t:'cantar',a:H.olvido});
  return out;}
function quienJuega(M){return M.H&&!M.H.fin&&!M.fin?M.H.turno:null;}
// Aplica la acción a de p. Devuelve un texto de error o null.
function jugar(M,p,a){
  const H=M.H;if(!H||H.fin||M.fin)return 'La mano terminó.';
  if(a.t==='uno'){if(!acciones(M,p).some(x=>x.t==='uno'))return 'Ahora no hace falta.';H.uno[p]=true;if(H.olvido===p)H.olvido=null;anotar(M,`${M.nombres[p]}: «¡Uno!»`);M.acc++;M.ultimo={p,a:{t:'uno'}};return null;}
  if(a.t==='cantar'){const v=H.olvido;if(v===null||v===p||H.manos[v].length!==1||H.uno[v])return 'Tarde.';
    H.olvido=null;darCartas(M,v,2);anotar(M,`${M.nombres[p]} le cantó a ${M.nombres[v]} que no dijo «uno»: roba 2.`);M.acc++;M.ultimo={p,a:{t:'cantar',a:v}};return null;}
  if(H.turno!==p)return 'No es tu turno.';
  // Cualquier jugada del que sigue cierra la ventana para cantarle al que se olvidó del «uno».
  if(H.olvido!==null&&H.olvido!==p)H.olvido=null;
  if(a.t==='robar'){
    if(H.robo&&H.robo.p===p)return 'Ya robaste.';
    if(H.pena>0){const k=H.pena;H.pena=0;darCartas(M,p,k);anotar(M,`${M.nombres[p]} roba ${k}.`);M.acc++;M.ultimo={p,a:{t:'robar',k}};H.robo=null;pasarTurno(M,1);return null;}
    const [c]=darCartas(M,p,1);M.acc++;M.ultimo={p,a:{t:'robar',k:1}};anotar(M,`${M.nombres[p]} roba una.`);
    if(c&&sePuede(M,c)){H.robo={p,c};return null;}
    H.robo=null;pasarTurno(M,1);return null;}
  if(a.t==='pasar'){if(!(H.robo&&H.robo.p===p))return 'Primero tenés que robar.';H.robo=null;M.acc++;M.ultimo={p,a:{t:'pasar'}};anotar(M,`${M.nombres[p]} pasa.`);pasarTurno(M,1);return null;}
  if(a.t==='jugar'){
    const c=a.c,i=H.manos[p].indexOf(c);if(i<0)return 'No tenés esa carta.';
    if(H.robo&&H.robo.p===p&&H.robo.c!==c)return 'Sólo podés tirar la que robaste.';
    if(!sePuede(M,c))return 'Esa no se puede tirar ahora.';
    if(cierraMal(M,p,c))return 'No se puede terminar con una especial.';
    let col=cCol(c);if(esComodin(c)){col=COLORES.includes(a.color)?a.color:null;if(!col)return 'Elegí un color.';}
    H.manos[p].splice(i,1);H.pozo.push(c);H.color=col;H.robo=null;H.jugadas++;M.acc++;
    M.ultimo={p,a:{t:'jugar',c,color:esComodin(c)?col:undefined}};
    anotar(M,`${M.nombres[p]} tira ${nombreCarta(c)}${esComodin(c)?` y pide ${CNOM[col]}`:''}.`);
    const quedan=H.manos[p].length;
    if(quedan===1&&!H.uno[p])H.olvido=p;     // se olvidó de decir «uno»: lo pueden cantar hasta que juegue el que sigue
    if(quedan!==1)H.uno[p]=false;
    if(quedan===0){aplicarEfecto(M,p,c,true);terminarMano(M,p);return null;}
    aplicarEfecto(M,p,c,false);return null;}
  return 'Acción desconocida.';
}
function aplicarEfecto(M,p,c,ultima){const H=M.H,v=cVal(c);
  if(v==='R'){if(M.n===2){if(!ultima)pasarTurno(M,2);return;}H.dir*=-1;if(!ultima)pasarTurno(M,1);return;}
  if(v==='S'){if(!ultima){anotar(M,`${M.nombres[siguiente(M,p)]} pierde el turno.`);pasarTurno(M,2);}return;}
  if(v==='D'||v==='X'){const k=v==='D'?2:4,q=siguiente(M,p);
    if(M.apilar&&!ultima){H.pena+=k;pasarTurno(M,1);return;}
    const tot=k+(H.pena||0);H.pena=0;darCartas(M,q,tot);anotar(M,`${M.nombres[q]} roba ${tot} y pierde el turno.`);if(!ultima)pasarTurno(M,2);return;}
  if(!ultima)pasarTurno(M,1);}
function pasarTurno(M,k){const H=M.H;H.turno=siguiente(M,H.turno,k);}
function terminarMano(M,p){const H=M.H;let pts=0;
  for(let q=0;q<M.n;q++)if(q!==p)for(const c of H.manos[q])pts+=puntosCarta(c);
  H.fin=true;H.gano=p;H.pts=pts;H.olvido=null;M.puntos[p]+=pts;
  anotar(M,`${M.nombres[p]} se quedó sin cartas y gana la mano: ${pts} puntos.`);
  if(!M.meta||M.puntos[p]>=M.meta){M.fin=true;M.gano=p;anotar(M,`${M.nombres[p]} gana la partida.`);}
}

/* ───── Lo que ve cada uno (girado: él es el 0) ───── */
function estadoPara(M,p){
  const H=M.H,n=M.n,rel=q=>q===null||q===undefined?q:((q-p)%n+n)%n,rot=a=>a.map((_,i)=>a[(i+p)%n]);
  const out={id:M.id,n,mano:M.mano,acc:M.acc,meta:M.meta,apilar:M.apilar,especial:M.especial!==false,nombres:rot(M.nombres),tipos:rot(M.tipos),puntos:rot(M.puntos),fin:M.fin,gano:rel(M.gano),log:M.log.slice(-30),
    reparte:rel(M.reparte)};
  if(!H)return out;
  Object.assign(out,{mias:H.manos[p].slice(),cuantas:rot(H.manos.map(m=>m.length)),top:topPozo(M),pozo:H.pozo.slice(-4),mazo:H.mazo.length,color:H.color,dir:H.dir,
    turno:rel(H.turno),robo:H.robo&&H.robo.p===p?{c:H.robo.c}:(H.robo?{otro:rel(H.robo.p)}:null),olvido:rel(H.olvido),uno:rot(H.uno),pena:H.pena,
    finMano:H.fin?{gano:rel(H.gano),pts:H.pts}:null,acciones:acciones(M,p)});
  const u=M.ultimo;out.ultimo=u?{p:rel(u.p),a:u.a.t==='cantar'?{t:'cantar',a:rel(u.a.a)}:{...u.a}}:null;
  return out;
}
// Para la compu: sólo lo que ve (sus cartas, lo que hay arriba del pozo y cuántas tiene cada uno).
function vistaDe(M,p){return estadoPara(M,p);}

/* ───── La compu ─────
   Fácil: tira lo primero que puede. Normal: guarda los comodines, sigue el color que más tiene y castiga al que
   está por ganar. Difícil: además cuenta lo que salió y elige el color que menos le sirve al que sigue. */
const NIVEL_UNO={facil:{uno:.7,cantar:.35},normal:{uno:.93,cantar:.7},dificil:{uno:1,cantar:.95}};
function colorPreferido(mias){const k={r:0,a:0,v:0,z:0};for(const c of mias){const x=cCol(c);if(x)k[x]+=1+(/[SRD]/.test(cVal(c))?.3:0);}
  return COLORES.slice().sort((x,y)=>k[y]-k[x])[0];}
function decidir(V,nivel='normal',R=Math.random){
  const A=V.acciones||[];if(!A.length)return null;
  const jug=A.filter(a=>a.t==='jugar');
  if(A.some(a=>a.t==='uno')&&(jug.length||V.olvido===0)&&R()<NIVEL_UNO[nivel].uno)return {t:'uno'};// avisa sólo si va a tirar (o si ya se olvidó)
  if(V.turno!==0)return null;
  const otro=A.find(a=>a.t==='pasar');
  if(!jug.length)return otro||{t:'robar'};
  const amenaza=V.cuantas[V.dir===1?1:V.n-1]<=2,mias=V.mias;
  const col=colorPreferido(mias.filter(c=>!esComodin(c)));
  const pick=c=>{const a={t:'jugar',c};if(esComodin(c))a.color=col;return a;};
  if(nivel==='facil'){const nc=jug.filter(a=>!esComodin(a.c));const lista=nc.length?nc:jug;return pick(lista[Math.floor(R()*lista.length)].c);}
  let best=null,bs=-1e9;
  for(const a of jug){const c=a.c,v=cVal(c);let s=0;
    if(esComodin(c))s-=v==='X'?14:9;                    // los comodines se guardan para cuando hacen falta
    if(cCol(c)===col)s+=4;
    s+=puntosCarta(c)*.08;                               // sacarse de encima lo que más pesa
    if(amenaza&&(v==='D'||v==='X'||v==='S'||(v==='R'&&V.n>2)))s+=nivel==='dificil'?22:14;
    if(!amenaza&&(v==='D'||v==='X'))s-=nivel==='dificil'?3:0;
    if(mias.length<=2&&esComodin(c))s+=12;              // con pocas cartas, el comodín asegura
    s+=R()*(nivel==='dificil'?1:3);
    if(s>bs){bs=s;best=c;}}
  // Si lo único que hay es un +4 y no hay apuro, a veces conviene robar.
  if(best&&cVal(best)==='X'&&jug.length===1&&!amenaza&&nivel!=='facil'&&mias.length>4&&R()<.35&&!V.robo)return {t:'robar'};
  return pick(best);
}
// ¿La compu le canta a alguien que no dijo «uno»?
function botCanta(V,nivel,R=Math.random){const a=(V.acciones||[]).find(x=>x.t==='cantar');return a&&R()<NIVEL_UNO[nivel].cantar?a:null;}

</script>
<script>
'use strict';
/* ───────── Cartas dibujadas en el código ─────────
   Diseño propio: campo de color con una trama fina, una ficha central con el número o el símbolo y los índices
   en las esquinas. Comodines: fondo carbón con una rosa de cuatro pétalos de colores. */
const CCOL={r:'#c4453a',a:'#e0a93b',v:'#3f8c5d',z:'#2f6aa6'};
const CDARK={r:'#8f2a22',a:'#a87517',v:'#265d3b',z:'#1c4573'};
const CSEL={r:'#f07a6b',a:'#ffd57a',v:'#7fd39f',z:'#7fb2ef'};
function glifo(v,x,y,s,fill){
  if(/[0-9]/.test(v))return `<text x="${x}" y="${y+s*.36}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s}" fill="${fill}">${v}</text>`;
  if(v==='D')return `<text x="${x}" y="${y+s*.3}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s*.78}" fill="${fill}">+2</text>`;
  if(v==='X')return `<text x="${x}" y="${y+s*.3}" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="${s*.78}" fill="${fill}">+4</text>`;
  if(v==='S'){const r=s*.36;return `<g fill="none" stroke="${fill}" stroke-width="${s*.11}" stroke-linecap="round"><circle cx="${x}" cy="${y}" r="${r}"/><path d="M${x-r*.7} ${y+r*.7}L${x+r*.7} ${y-r*.7}"/></g>`;}
  if(v==='R'){const r=s*.34,w=s*.1;return `<g fill="none" stroke="${fill}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">
    <path d="M${x-r} ${y-r*.15}A${r} ${r} 0 0 1 ${x+r*.75} ${y-r*.65}"/><path d="M${x+r*.35} ${y-r*1.05}L${x+r*.8} ${y-r*.62}L${x+r*.28} ${y-r*.3}"/>
    <path d="M${x+r} ${y+r*.15}A${r} ${r} 0 0 1 ${x-r*.75} ${y+r*.65}"/><path d="M${x-r*.35} ${y+r*1.05}L${x-r*.8} ${y+r*.62}L${x-r*.28} ${y+r*.3}"/></g>`;}
  if(v==='W')return rosa(x,y,s*.42);
  return '';}
function rosa(x,y,r,elegido){// cuatro pétalos de colores (comodín)
  const p=(ang,col)=>{const a=ang*Math.PI/180,c=Math.cos(a),s=Math.sin(a);const tx=(u,v)=>`${(x+u*c-v*s).toFixed(1)} ${(y+u*s+v*c).toFixed(1)}`;
    return `<path d="M${tx(0,0)}C${tx(r*.25,-r*.55)} ${tx(r*.95,-r*.55)} ${tx(r,0)}C${tx(r*.95,r*.55)} ${tx(r*.25,r*.55)} ${tx(0,0)}Z" fill="${col}" stroke="rgba(0,0,0,.25)" stroke-width="1"/>`;};
  return `<g>${p(-135,CCOL.r)}${p(-45,CCOL.a)}${p(45,CCOL.v)}${p(135,CCOL.z)}<circle cx="${x}" cy="${y}" r="${r*.16}" fill="#f4ecdc"/></g>`;}
function cartaSVG(c){
  const v=cVal(c),k=cCol(c),wild=esComodin(c),base=wild?'#24212b':CCOL[k],dark=wild?'#141218':CDARK[k];
  const ink=wild?'#f4ecdc':'#fbf6ea',idx=(x,y,rot)=>`<g transform="translate(${x} ${y}) rotate(${rot})">${v==='W'?rosa(0,0,9):v==='X'?`<text x="0" y="5" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="14" fill="${ink}">+4</text>`:glifo(v,0,0,v==='D'?18:20,ink)}</g>`;
  const centro=v==='X'?`${rosa(60,82,30)}<g transform="translate(0 2)">${glifo('X',60,128,30,ink)}</g>`:wild?rosa(60,90,34):glifo(v,60,90,v==='D'?54:62,dark);
  const ficha=wild?'':`<rect x="24" y="44" width="72" height="92" rx="16" fill="#fbf6ea" stroke="${dark}" stroke-width="2.5"/><rect x="29" y="49" width="62" height="82" rx="12" fill="none" stroke="${base}" stroke-width="1.2" opacity=".55"/>`;
  return `<svg viewBox="0 0 120 180" aria-hidden="true"><defs><pattern id="tr-${k||'w'}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="6" height="6" fill="${base}"/><rect width="1.4" height="6" fill="rgba(255,255,255,.07)"/></pattern></defs>
    <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="5" y="5" width="110" height="170" rx="9" fill="url(#tr-${k||'w'})"/>
    <rect x="5" y="5" width="110" height="170" rx="9" fill="none" stroke="${dark}" stroke-width="1.5"/>
    ${ficha}${centro}${idx(18,22,0)}${idx(102,158,180)}</svg>`;}
function dorsoSVG(){return `<svg viewBox="0 0 120 180" aria-hidden="true"><defs><pattern id="dz" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#5b1f2b"/><path d="M7 0L14 7L7 14L0 7Z" fill="none" stroke="rgba(244,214,160,.22)" stroke-width="1.2"/><circle cx="7" cy="7" r="1.3" fill="rgba(244,214,160,.3)"/></pattern></defs>
  <rect x="1" y="1" width="118" height="178" rx="12" fill="#f4ecdc"/><rect x="6" y="6" width="108" height="168" rx="9" fill="url(#dz)" stroke="#3b111a" stroke-width="1.5"/>
  <rect x="18" y="56" width="84" height="68" rx="34" fill="#3b111a" stroke="#d7b874" stroke-width="2"/><text x="60" y="99" text-anchor="middle" font-family="Iowan Old Style,Palatino Linotype,Palatino,Georgia,serif" font-weight="700" font-size="22" fill="#f1dca8" letter-spacing="1">Uno<tspan fill="#e0a93b">AR</tspan></text></svg>`;}
function cartaHtml(c,cls=''){return `<span class="card${cls?' '+cls:''}" data-c="${c}" role="img" aria-label="${nombreCarta(c)}">${cartaSVG(c)}</span>`;}
function dorsoHtml(cls=''){return `<span class="card back${cls?' '+cls:''}" aria-hidden="true">${dorsoSVG()}</span>`;}

/* ───────── UnoAR: la mesa ─────────
   De 2 a 6 jugadores: contra la compu o en línea con amigos (los lugares que falten los juega la compu).
   Las reglas están en el motor (arriba); acá se dibuja la mesa, juega la compu y se llevan los puntos. */
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k);}catch(_){return null;}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(_){}},json(k,d){try{return JSON.parse(localStorage.getItem(k)||'null')??d;}catch(_){return d;}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let FAST=false,AUTO=false,AUTO_SIN_CANTO=false;const wait=ms=>sleep(FAST?0:ms);
const fmt=n=>Math.floor(Number(n)||0).toLocaleString('es-AR');

/* ───────── Sonido: cartas sobre el paño y un par de notas ───────── */
let SND=ls.get('uno-sonido')!=='0',AC=null;
function actx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;AC=new C();}if(AC.state==='suspended')AC.resume();return AC;}
function nota(f,t0=0,d=.4,v=.05,tipo='triangle'){const a=actx(),t=a.currentTime+t0,g=a.createGain(),o=a.createOscillator();o.type=tipo;o.frequency.value=f;
  o.connect(g).connect(a.destination);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0004,t+d);o.start(t);o.stop(t+d+.05);
  o.onended=()=>{try{o.disconnect();g.disconnect();}catch(_){}};}
let RUIDO=null;
function slap(t0=0,v=.5){const a=actx(),t=a.currentTime+t0;if(!RUIDO){const n=Math.floor(a.sampleRate*.07);RUIDO=a.createBuffer(1,n,a.sampleRate);const d=RUIDO.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);}
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=RUIDO;bp.type='bandpass';bp.frequency.value=1900;bp.Q.value=.8;g.gain.value=.22*v;
  s.connect(bp).connect(g).connect(a.destination);s.start(t);s.onended=()=>{try{s.disconnect();bp.disconnect();g.disconnect();}catch(_){}};}
const SX={carta(){slap();},robar(){slap(0,.3);slap(.07,.25);},uno(){nota(392,0,.3,.06);nota(523,.08,.4,.06);nota(659,.16,.5,.05);},cantar(){nota(330,0,.3,.06,'square');nota(247,.12,.4,.05,'square');},
  turno(){nota(784,0,.12,.025);},repartir(){for(let i=0;i<7;i++)slap(i*.05,.3);},gano(){[392,494,587,784].forEach((f,i)=>nota(f,i*.09,.6,.05));},pierdo(){[330,262,196].forEach((f,i)=>nota(f,i*.14,.6,.05));},
  msg(){nota(880,0,.1,.02);}};
function sfx(k){if(!SND||FAST)return;try{SX[k]&&SX[k]();}catch(_){}}

/* ───────── Estado ───────── */
const SAVE='uno-partida-v1';
let M=null;                 // la partida, cuando la manejo yo (contra la compu, o la mesa que armé en línea); yo soy el lugar 0
let MODO='compu';           // 'compu' | 'host' | 'guest'
let CFG={dif:ls.get('uno-dif')||'normal',bots:Math.max(1,Math.min(5,Number(ls.get('uno-bots'))||3)),meta:ls.get('uno-meta')!==null&&[0,100,200].includes(Number(ls.get('uno-meta')))?Number(ls.get('uno-meta')):200,apilar:ls.get('uno-apilar')==='1',especial:ls.get('uno-especial')!=='0'};
let E=null;                 // lo que veo: siempre yo soy 0
let BUSY=false,BOTTOK=0,FIN_VISTO=null,PEND_GUEST=false,LIMITE=0;
const DIFN={facil:'Fácil',normal:'Normal',dificil:'Difícil'};
const acct=()=>{try{const o=JSON.parse(localStorage.getItem('bloques-acct-v1')||'null');return o&&o.usuario&&o.token?o:null;}catch(_){return null;}};
function miNombre(){const a=acct();return a?a.usuario:'Vos';}
const PERFILES=[];          // avatar y color de cada lugar (para dibujar)
function refrescar(){if(M)E=estadoPara(M,0);}

/* ───────── Dibujar ───────── */
function avHtml(a,c,cls=''){return `<span class="av${cls?' '+cls:''}" style="--c:${/^#[0-9a-f]{6}$/i.test(c||'')?c:'#3b5866'}">${esc(a||'🙂')}</span>`;}
function perfil(q){// q relativo (0 = yo)
  if(!E)return {};const n=E.n;
  if(MODO==='guest'){const P=(E.perfiles||[])[q];return P||{a:'🙂',c:'#3b5866'};}
  const abs=q%n,P=PERFILES[abs];if(P)return P;return E.tipos[q]==='bot'?{a:'🤖',c:'#46555f'}:{a:'🙂',c:'#3b5866'};}
let REPARTO=null,DICHOS={};
function render(){if(!E){mesaVacia();return;}
  const nueva=REPARTO!==(E.id+':'+E.mano);REPARTO=E.id+':'+E.mano;

}
function renderSeats(){
  const n=E.n,el=$('seats');let h='';
  for(let k=1;k<n;k++){const q=E.dir===1?k:n-k,P=perfil(q),cnt=(E.cuantas||[])[q]||0,turno=E.turno===q&&!E.finMano&&!E.fin;
    const fan=Array.from({length:Math.min(cnt,6)},(_,i)=>dorsoHtml().replace('class="card back"',`class="card back" style="left:${i*7}px;transform:rotate(${(i-2.5)*5}deg)"`)).join('');
    h+=`<div class="seat${turno?' turn':''}${E.tipos[q]==='bot'&&MODO!=='compu'&&/\(compu\)/.test(E.nombres[q])?' out':''}" data-q="${q}">
      ${(E.uno||[])[q]&&cnt===1?'<span class="unoTag">¡UNO!</span>':''}
      ${avHtml(P.a,P.c)}<b>${esc(E.nombres[q])}</b><div class="fan">${fan}<span class="cnt">${cnt}</span></div><small>${E.meta?fmt(E.puntos[q])+' pts':''}${turno&&MODO!=='compu'&&E.tipos[q]!=='bot'&&LIMITE?` · <span class="tleft" data-q="${q}"></span>`:''}</small>
      ${DICHOS[q]?`<span class="say">${esc(DICHOS[q])}</span>`:''}${CHIPS[q]?`<span class="chip-chat">${esc(CHIPS[q])}</span>`:''}</div>`;}
  el.innerHTML=h;el.classList.toggle('many',n>=5&&innerWidth<600);
}
const flecha=d=>d===1?'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10a6 6 0 1 1 2 4.5"/><path d="M3 15l3-1 0-3"/></svg>':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 10a6 6 0 1 0-2 4.5"/><path d="M17 15l-3-1 0-3"/></svg>';
function renderFelt(){

  const puedoRobar=puedo('robar');
  $('mazo').innerHTML=`${dorsoHtml()}${dorsoHtml()}${dorsoHtml()}<button class="mazo-btn${puedoRobar?' can':''}" id="b-mazo" aria-label="Robar una carta" ${puedoRobar?'':'disabled'}></button><span class="mazo-n">${E.mazo} en el mazo</span>`;

const puedo=(t,c)=>E&&(E.acciones||[]).some(a=>a.t===t&&(c===undefined||a.c===c));
function layoutHand(){const h=$('hand'),n=h.children.length;if(!n)return;
  const W=h.clientWidth-8,cw=h.children[0].offsetWidth||84;let step=-cw*.32;
  if(n>1){const need=cw+(n-1)*(cw+step);if(need>W)step=Math.max(-cw*.86,(W-cw)/(n-1)-cw);}
  h.style.setProperty('--step',step.toFixed(1)+'px');}
function renderMe(nueva=false){
  const st=$('status'),acts=$('acts'),hand=$('hand');
  if(E.fin||E.finMano){st.innerHTML='';acts.innerHTML='';}
  const mio=E.turno===0&&!E.finMano&&!E.fin,mias=E.mias||[];

  const can=(E.acciones||[]).find(a=>a.t==='cantar');
  if(can)b+=`<button class="act uno" id="a-cantar">¡${esc(E.nombres[can.a])} no dijo uno!</button>`;
  if(mio&&puedo('robar'))b+=`<button class="act" id="a-robar">Robar${E.pena>0?' '+E.pena:''}</button>`;
  if(mio&&puedo('pasar'))b+=`<button class="act ghost" id="a-pasar">Pasar</button>`;
  if(!b)b='<span class="note" style="align-self:center;color:#9aa6ad">'+(mias.length===2&&!(E.uno||[])[0]?'Si te queda una, apretá «¡UNO!»':'&nbsp;')+'</span>';

// Por qué no se puede tirar la carta c ahora (con lo que se ve en la mesa).
function motivoNo(c){
  if(!E||E.fin||E.finMano)return 'La mano terminó.';
  if(E.turno!==0)return `Todavía no es tu turno: juega ${esc(E.nombres[E.turno]||'otro')}.`;
  const t=E.top,vc=cVal(c),vt=t?cVal(t):'',col=CNOM[E.color]||'',fem={r:'roja',a:'amarilla',v:'verde',z:'azul'}[E.color]||col;
  if(E.robo&&E.robo.c)return c===E.robo.c?'Esa no va.':'Ya robaste: sólo podés tirar la que robaste (la que está levantada) o pasar.';
  if(E.pena>0)return `Hay un +${E.pena} acumulado: sólo podés tirar otro ${vt==='D'?'+2 o un +4':'+4'}, o robar ${E.pena}.`;
  if(E.especial===false&&(E.mias||[]).length===1&&/[SRDWX]/.test(vc))return 'No se puede terminar con una especial (salta, reversa, +2 o comodín): tenés que robar.';
  if(vt==='D'&&/[0-9]/.test(vc))return `Arriba hay un +2, no un 2: va otro +2, una carta ${fem} o un comodín.`;
  if(vc==='D'&&/[0-9]/.test(vt))return `El +2 no es un 2: va sobre una carta ${fem} o sobre otro +2.`;
  if(t&&esComodin(t))return `Pidieron ${col}: tiene que ser una carta ${fem} o un comodín.`;
  return `Arriba hay ${esc(nombreCarta(t))}: va una carta ${fem}, ${/[0-9]/.test(vt)?'un '+vt:'otro '+({S:'salta',R:'reversa'}[vt]||'igual')} o un comodín.`;
}
function openPick(c){const p=$('pick');p.innerHTML=`<p>¿Qué color pedís?</p>${COLORES.map(k=>`<button style="--cc:${CCOL[k]}" data-k="${k}">${CNOM[k]}</button>`).join('')}`;p.hidden=false;
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{p.hidden=true;jugarYo({t:'jugar',c,color:b.dataset.k});});}
function closePick(){$('pick').hidden=true;}
document.addEventListener('pointerdown',e=>{const p=$('pick');if(!p.hidden&&!p.contains(e.target)&&!e.target.closest('#hand'))p.hidden=true;});
// Lo que dice cada uno (un globo arriba de su lugar o arriba de tu mano)
function dicho(q,txt,ms=1600){DICHOS[q]=txt;if(q===0){toast(esc(txt));return;}renderSeats();setTimeout(()=>{if(DICHOS[q]===txt){delete DICHOS[q];if(E)renderSeats();}},FAST?10:ms);}
let toastT=0;function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast';d.innerHTML=t;document.body.appendChild(d);clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),FAST?10:2400);}
function over(html){document.querySelectorAll('.toast').forEach(x=>x.remove());const el=$('over');el.innerHTML=`<div class="ccard">${html}</div>`;el.hidden=false;return el;}
function hideOver(){$('over').hidden=true;}
// Una carta que vuela desde la mano (o el lugar de alguien) hasta el pozo
function origen(q,c){const el=q===0?document.querySelector(`#hand .card[data-c="${c}"]`):document.querySelector(`.seat[data-q="${q}"] .av`);return el?el.getBoundingClientRect():null;}
function volar(desde,c){if(!desde||RM||FAST)return;const dst=document.querySelector('#pozo .card:last-of-type');if(!dst)return;const r=dst.getBoundingClientRect();
  const f=document.createElement('div');f.className='flying';f.innerHTML=cartaHtml(c);f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;f.firstChild.style.cssText='width:100%;height:100%';
  f.style.transform=`translate(${desde.left-r.left}px,${desde.top-r.top}px) scale(${Math.max(.3,desde.width/r.width)})`;document.body.appendChild(f);dst.style.visibility='hidden';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform='none';}));setTimeout(()=>{f.remove();dst.style.visibility='';},360);}
// Cuenta regresiva del turno (en línea)
let TMR=0;
function tickTimer(){clearInterval(TMR);if(!LIMITE)return;const upd=()=>{const s=Math.max(0,Math.ceil((LIMITE-Date.now())/1000));
  const t=$('tmr');if(t){t.textContent=s+' s';t.classList.toggle('low',s<=7);}
  document.querySelectorAll('.tleft').forEach(x=>{x.textContent=s+' s';});if(s<=0)clearInterval(TMR);};upd();TMR=setInterval(upd,500);}

/* ───────── El turno ───────── */
// Aplica la acción de q (absoluto en M) sobre la partida que manejo y muestra lo que pasó.
function aplicar(q,a){
  const desde=a.t==='jugar'?origen(q,a.c):null,mano0=M.mano;
  const err=jugar(M,q,a);if(err)return err;
  refrescar();guardar();
  if(MODO==='host')enviarEstados();
  render();anunciarUltimo(desde);
  if(M.mano!==mano0||M.H.fin||M.fin){seguir();return null;}
  seguir();return null;
}
// Logros y retos (v60): cada jugada mía se cuenta una vez (la clave es la partida y el número de jugada).
const LG=()=>window.LOGROS&&(!AUTO||window.LOGROS_TEST);
function lgJugada(){const u=E&&E.ultimo;if(!LG()||!u||u.p!==0)return;const k='u'+(E.id||'')+':'+E.acc,a=u.a;
  try{if(a.t==='uno')LOGROS.evento('uno','uno_dicho',1,k);else if(a.t==='cantar')LOGROS.evento('uno','cantadas',1,k);else if(a.t==='jugar'&&cVal(a.c)==='X')LOGROS.evento('uno','mas4',1,k);}catch(e){console.warn('logros',e);}}
function lgMano(){if(!LG()||!E||!E.finMano||E.finMano.gano!==0)return;const F=E.finMano,k='u'+(E.id||'')+':m'+E.mano,u=E.ultimo;
  try{LOGROS.evento('uno','manos',1,k);if(F.pts)LOGROS.evento('uno','puntos',F.pts,k);LOGROS.marca('uno','mano_max',F.pts||0,k);
    if(u&&u.p===0&&u.a.t==='jugar'){const v=cVal(u.a.c);if(v==='X')LOGROS.evento('uno','cierre4',1,k);else if(v==='W')LOGROS.evento('uno','cierre_comodin',1,k);}}catch(e){console.warn('logros',e);}}
function lgFin(gane){if(!LG())return '';const amigo=E.tipos.some((t,q)=>q!==0&&t!=='bot');
  try{return LOGROS.fin('uno',{gano:gane,modo:amigo?'online':'compu',dif:MODO==='compu'?CFG.dif:'normal',n:E.n},'u'+(E.id||'')).html;}catch(e){console.warn('logros',e);return '';}}
function anunciarUltimo(desde){const u=E&&E.ultimo;if(!u)return;lgJugada();
  const q=u.p,a=u.a;
  if(a.t==='jugar'){volar(desde,a.c);sfx('carta');const v=cVal(a.c);
    if(v==='X'||v==='D'||v==='S'||v==='R'||v==='W'){const t=v==='X'?`+4 · ${CNOM[a.color]}`:v==='W'?`Comodín · ${CNOM[a.color]}`:v==='D'?'+2':v==='S'?'¡Salta!':'¡Reversa!';if(q!==0)dicho(q,t);}}
  else if(a.t==='robar'){sfx('robar');if(q!==0&&a.k>1)dicho(q,`Roba ${a.k}`);}
  else if(a.t==='uno'){sfx('uno');dicho(q,'¡UNO!',1900);}
  else if(a.t==='cantar'){sfx('cantar');dicho(q,`¡${E.nombres[a.a]} no dijo uno!`,2000);if(a.a===0)toast('Te cantaron que no dijiste «uno»: robás 2.');}
  else if(a.t==='pasar'){if(q!==0)dicho(q,'Paso',1000);}
  if(E.turno===0&&q!==0&&!E.finMano&&!E.fin)sfx('turno');
}
async function jugarYo(a){
  if(BUSY||!E)return;closePick();
  if(MODO==='guest'){
    if(!ON||ON.state!=='juego'){toast('Se cortó la conexión con la mesa.');return;}
    if(PEND_GUEST){toast('Un momento: esperando a la mesa…');return;}
    if(!ON.ch||ON.ch.readyState!=='open'){toast('Se cortó la conexión con la mesa.');return;}
    PEND_GUEST=a.t!=='uno'&&a.t!=='cantar';const acc0=E.acc;renderMe();netSend({t:'accion',a,acc:E.acc});
    // Si la mesa no contesta (p. ej. el que la armó salió de la app), se libera y se avisa.
    setTimeout(()=>{if(PEND_GUEST&&E&&E.acc===acc0){PEND_GUEST=false;renderMe();toast(`La mesa no contesta. Si ${esc(ON&&ON.host?ON.host.usuario:'quien la armó')} salió de la app, avisale que vuelva.`);}},6000);return;}
  if(!M)return;
  const err=aplicar(0,a);if(err)toast(esc(err));
}
// Después de cada jugada: si le toca a la compu, juega; si alguien se olvidó del «uno», la compu quizás le canta.
function seguir(){
  if(MODO==='guest'||!M)return;
  if(M.fin){setTimeout(mostrarFin,FAST?0:900);return;}
  if(M.H.fin){setTimeout(mostrarFinMano,FAST?0:900);return;}
  const tok=++BOTTOK;
  // La compu le canta al que no dijo «uno» (con un rato para que la gente también pueda)
  if(M.H.olvido!==null){const v=M.H.olvido;
    for(let q=0;q<M.n;q++){if(q===v||M.tipos[q]!=='bot')continue;const nv=nivelBot(q),R=Math.random();
      if(R<NIVEL_UNO[nv].cantar){const ms=FAST?0:900+Math.random()*1600;setTimeout(()=>{if(!M||!M.H||M.H.olvido!==v||M.tipos[q]!=='bot')return;aplicar(q,{t:'cantar',a:v});},ms);break;}}}
  const q=quienJuega(M);if(q===null)return;
  armarTimer(q);
  if(M.tipos[q]==='bot'||(AUTO&&q===0)){
    const ms=FAST?0:(M.H.robo?650:M.H.olvido!==null&&M.tipos[M.H.olvido]!=='bot'?2400:950+Math.random()*700);// si alguien no dijo «uno», un rato para cantarle
    setTimeout(()=>{if(tok!==BOTTOK||!M||quienJuega(M)!==q)return;turnoBot(q);},ms);}
}
function nivelBot(q){return MODO==='compu'?CFG.dif:'normal';}
function turnoBot(q){
  const nv=AUTO&&q===0?'normal':nivelBot(q),V=vistaDe(M,q);
  // Antes de jugar, si el de antes no dijo «uno», quizás le canta (después ya no se puede).
  if(V.olvido!==null&&V.olvido!==0&&!AUTO_SIN_CANTO){const c=botCanta(V,nv);if(c){aplicar(q,{t:'cantar',a:(c.a+q)%M.n});setTimeout(()=>{if(M&&quienJuega(M)===q)turnoBot(q);},FAST?0:700);return;}}
  let a=decidir(V,nv);
  if(!a)return;
  if(a.t==='uno'){aplicar(q,a);setTimeout(()=>{if(M&&quienJuega(M)===q)turnoBot(q);},FAST?0:500);return;}
  if(a.t==='cantar')a={t:'cantar',a:(a.a+q)%M.n};
  const err=aplicar(q,a);if(err){const alt=V.acciones.find(x=>x.t==='robar'||x.t==='pasar');if(alt)aplicar(q,alt);}
}
// En línea: cada persona tiene 25 segundos por turno; si no juega, roba (o pasa) sola.
const TURNO_MS=25000;
function hayGente(){return M&&M.tipos.filter(t=>t!=='bot').length>1;}
function armarTimer(q){clearTimeout(ON_T);LIMITE=0;
  if(MODO!=='host'||!hayGente()||M.tipos[q]==='bot')return;
  LIMITE=Date.now()+TURNO_MS;const acc=M.acc;
  ON_T=setTimeout(()=>{if(!M||M.acc!==acc||quienJuega(M)!==q)return;
    const A=acciones(M,q);const a=A.find(x=>x.t==='pasar')||A.find(x=>x.t==='robar');if(!a)return;
    aplicar(q,a);if(M&&quienJuega(M)===q&&M.H.robo){const p=acciones(M,q).find(x=>x.t==='pasar');if(p)aplicar(q,p);}
    if(q===0)toast('Se te pasó el tiempo: robaste una.');},TURNO_MS);
  render();
}
let ON_T=0;

/* ───────── Fin de mano y de partida ───────── */

function mostrarFin(){
  if(!E||!E.fin)return;const key='fin:'+(E.id||'');if(FIN_VISTO===key)return;FIN_VISTO=key;clearInterval(TMR);clearTimeout(ON_T);LIMITE=0;
  const gane=E.gano===0;sfx(gane?'gano':'pierdo');if(MODO==='compu')ls.set(SAVE,null);
  lgMano();const rk=premios(gane);rk.html+=lgFin(gane);
  over(`<div class="ic">${gane?'🏆':'🃏'}</div><h3>${gane?'¡Ganaste la partida!':`Ganó ${esc(E.nombres[E.gano])}`}</h3>

   El que arma la mesa la lleva: tiene una conexión directa con cada amigo (WebRTC, con servidores públicos
   STUN/TURN de ayuda) y le manda a cada uno sólo lo que puede ver. Las invitaciones viajan por la planilla,
   una por amigo (sin códigos de sala). Los lugares que quedan libres los juega la compu; si alguien se corta,
   la compu sigue en su lugar. El chat de la mesa va por las mismas conexiones: es al toque y no se guarda. */
const LB_DEFAULT='https://script.google.com/macros/s/AKfycbxSxfHSE3gMATJnPGXKEfyC3h2votf8IJBqdVsHfnllm_7Igsoh1lFqlfUJoW7s0lqy/exec';
const lbUrl=()=>ls.get('bloques-lb-url-v1')||LB_DEFAULT;
async function lbCall(params,post=true,ms=15000){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),ms);
  try{let r;
    if(post)r=await fetch(lbUrl(),{method:'POST',body:JSON.stringify(params),headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',signal:ctl.signal,redirect:'follow'});
    else{const u=new URL(lbUrl());for(const [k,v] of Object.entries(params))u.searchParams.set(k,String(v));u.searchParams.set('_',Date.now());r=await fetch(u,{cache:'no-store',signal:ctl.signal,redirect:'follow'});}
    const j=await r.json();if(!j||!j.ok)throw new Error(j&&j.error||'La planilla respondió con un error.');return j;
  }catch(e){if(e.name==='AbortError')throw new Error('La planilla tardó demasiado.');if(e instanceof TypeError)throw new Error('Sin conexión. ¿Hay internet?');throw e;}
  finally{clearTimeout(to);}
}

async function iceServers(){
  const list=ICE.map(s=>({...s}));
  try{const te=new TextEncoder(),user=`${Math.floor(Date.now()/1000)+86400}:bloques`;
    const key=await crypto.subtle.importKey('raw',te.encode('openrelayprojectsecret'),{name:'HMAC',hash:'SHA-1'},false,['sign']);
    const sig=new Uint8Array(await crypto.subtle.sign('HMAC',key,te.encode(user)));
    list.push({urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443?transport=tcp'],username:user,credential:btoa(String.fromCharCode(...sig))});}catch(_){}
  return list;
}

  b.hidden=!gente;
  if(!ON){el.textContent='';return;}
  if(ON.role==='host'){const n=ON.mesa.lugares.filter(L=>L.tipo==='humano').length,inv=ON.mesa.lugares.filter(L=>L.tipo==='invitado').length;
    el.className='onl';el.textContent=ON.state==='juego'?(n?`● Mesa en línea · ${n+1} personas`:''):`Mesa: ${n+1} ${n?'personas':'persona'}${inv?` · ${inv} invitado${inv>1?'s':''}`:''}`;}
  else{el.className='onl'+(ON.state==='conectando'?' off':'');el.textContent=ON.state==='conectando'?'Conectando…':`● Mesa de ${ON.host.usuario}`;}
}

/* ── Chat de la mesa ── */
const limpiarChat=t=>String(t||'').replace(/[\u0000-\u001f]/g,' ').replace(/\s+/g,' ').trim().slice(0,120);
function addChat(de,txt,yo=false){MCH.push({de,txt,yo});if(MCH.length>60)MCH=MCH.slice(-60);if($('mchat').hidden){if(de)MCH_NO++;}drawChat();}
function seatDe(nombre){if(!E)return -1;return E.nombres.findIndex(n=>n===nombre);}
function chip(q,txt){if(q<=0)return;CHIPS[q]=txt;if(E)renderSeats();setTimeout(()=>{if(CHIPS[q]===txt){delete CHIPS[q];if(E)renderSeats();}},4500);}
function chatDe(de,txt,seat){// el que lleva la mesa recibe y reparte
  addChat(de,txt);sfx('msg');chip(seat,txt);netSend({t:'chat',de,txt});}
function chatEntra(de,txt){const yo=de===yoPerfil().usuario;addChat(yo?'Vos':de,txt,yo);if(!yo){sfx('msg');chip(seatDe(de),txt);}}
function mandarChat(t){t=limpiarChat(t);if(!t||!ON)return;const me=yoPerfil().usuario;
  if(ON.role==='host'){addChat('Vos',t,true);netSend({t:'chat',de:me,txt:t});}
  else{sendCh(ON.ch,{t:'chat',txt:t});}}
function drawChat(){const el=$('mchat');$('mesa-badge').textContent=MCH_NO?String(MCH_NO):'';if(el.hidden)return;
  const box=el.querySelector('.msgs');if(!box)return;
  box.innerHTML=MCH.length?MCH.map(m=>m.de?`<div class="msg${m.yo?' yo':''}"><b>${esc(m.de)}:</b>${esc(m.txt)}</div>`:`<div class="msg" style="color:#9aa6ad">${esc(m.txt)}</div>`).join(''):'<div class="empty">Sólo lo ve la gente de esta mesa y se borra al terminar.</div>';
  box.scrollTop=box.scrollHeight;}
function openChat(){const el=$('mchat');
  if(!el.hidden){el.hidden=true;return;}
  el.innerHTML=`<header><b>Chat de la mesa</b><button type="button" id="mc-x" aria-label="Cerrar">✕</button></header><div class="msgs"></div>
    <div class="quick">${['👍','😂','😡','🔥','🙏'].map(e=>`<button type="button" data-e="${e}">${e}</button>`).join('')}</div>
    <form id="mc-f"><input id="mc-t" maxlength="120" placeholder="Escribile a la mesa" autocomplete="off" enterkeyhint="send"><button type="submit">Mandar</button></form>`;
  el.hidden=false;MCH_NO=0;drawChat();
  $('mc-x').onclick=()=>{el.hidden=true;};
  el.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>mandarChat(b.dataset.e));
  $('mc-f').onsubmit=e=>{e.preventDefault();const t=$('mc-t');mandarChat(t.value);t.value='';};
  $('mc-t').addEventListener('keydown',e=>e.stopPropagation());}
$('btn-mesa').onclick=openChat;

/* ── Buzón: te avisa si alguien te invita (a UnoAR o a otro juego) ── */
let pollAt=0,polling=false;
async function pollInbox(force=false){
  const a=acct();if(!a||polling||document.hidden||(ON&&ON.state!=='perdido')||AUTO)return;
  const gap=E&&!E.fin&&E.turno===0?20000:8000;if(!force&&Date.now()-pollAt<gap)return;
  polling=true;pollAt=Date.now();
  let ver;try{ver=sessionStorage.getItem('uno-accept')||undefined;}catch(_){}   // la que tocaste en el chat (puede haber varias)
  try{const j=await lbCall({accion:'buzon',usuario:a.usuario,token:a.token,ver});const inv=j.invitacion;
    const rc=window.RECON&&RECON.recuerdo('uno');
    if(inv&&rc&&!UIQ.dismissed.has(inv.id)&&!ON&&RECON.esVuelta(inv,'UNO:',rc.mesa)){acceptInvite(inv,true);polling=false;return;}   // v63: volver a la partida
    if(inv&&!UIQ.dismissed.has(inv.id)&&!ON){
      const uno=String(inv.oferta||'').startsWith('UNO:');
      let want='';try{want=sessionStorage.getItem('uno-accept')||'';}catch(_){}
      if(uno&&want===inv.id){try{sessionStorage.removeItem('uno-accept');}catch(_){}acceptInvite(inv);}
      else showInvite(inv);}}catch(_){}
  polling=false;
}
function showInvite(inv){
  UIQ.dismissed.add(inv.id);const of=String(inv.oferta||''),uno=of.startsWith('UNO:'),tru=of.startsWith('TRUCO:'),pob=of.startsWith('POBLAR:'),aj=of.startsWith('AJEDREZ:');
  const juego=uno?'<b>UnoAR</b> 🃏 en su mesa':tru?'<b>TrucAR</b> 🃏':pob?'<b>PoblAR</b> 🏘️':aj?'<b>AjedrezAR</b> ♟️':'<b>BloqueAR</b> 🧱';
  sheet('Te invitan',`<div style="display:flex;align-items:center;gap:12px">${avHtml(inv.avatar,inv.color)}<div><b style="font:700 18px var(--serif)">${esc(inv.de)}</b><div class="note">te invita a jugar ${juego}</div></div></div>
    ${uno&&E&&!E.fin&&MODO==='compu'?'<p class="note">Tu partida contra la compu queda guardada.</p>':''}<div class="row"><button class="btn" id="iv-no">Ahora no</button><button class="btn go" id="iv-yes">Aceptar</button></div>`);
  $('iv-no').onclick=()=>{closeSheet();const a=acct();if(a)lbCall({accion:'rechazar',usuario:a.usuario,token:a.token,id:inv.id}).catch(()=>{});};
  $('iv-yes').onclick=()=>{closeSheet();if(uno)acceptInvite(inv);
    else if(tru){try{sessionStorage.setItem('truco-accept',inv.id);}catch(_){}location.href='truco.html';}
    else if(pob){try{sessionStorage.setItem('poblar-accept',inv.id);}catch(_){}location.href='poblar.html';}
    else if(aj){try{sessionStorage.setItem('ajedrez-accept',inv.id);}catch(_){}location.href='ajedrez.html';}
    else{try{sessionStorage.setItem('blq-accept',inv.id);}catch(_){}location.href='./';}};
}
window.addEventListener('pagehide',()=>{if(ON)netSend({t:'bye',corte:1});});   // se cerró la app: puede volver (v63)

/* ───────── Arranque ───────── */
// Venís de aceptar una invitación en otro juego: se busca enseguida y se reintenta unos segundos (la planilla a veces tarda).
function aceptando(){try{return !!sessionStorage.getItem('uno-accept');}catch(_){return false;}}
function saved0(){const s=ls.json(SAVE,null);return !!(s&&s.M&&s.M.v===1&&s.M.H&&!s.M.fin);}
function esperarInvitacion(){
  sheet('Mesa de un amigo',`<p><span class="busy"></span>Buscando la invitación de tu amigo…</p>${saved0()?'<p class="note">Tu partida contra la compu queda guardada.</p>':''}`);
  let n=0;const t=setInterval(()=>{
    if(ON||!aceptando()){clearInterval(t);return;}
    if(++n>12){clearInterval(t);try{sessionStorage.removeItem('uno-accept');}catch(_){}
      sheet('Mesa de un amigo','<p>No encontramos la invitación: puede que tu amigo ya no esté esperando o que la haya cancelado.</p><p>Pedile que te invite de nuevo, o armá vos una mesa.</p><button class="btn go" id="ia-inv">Armar una mesa</button><button class="btn" id="ia-new">Jugar con la compu</button>');
      $('ia-inv').onclick=openMesa;$('ia-new').onclick=openNew;return;}
    pollInbox(true);
  },2500);
  setTimeout(()=>pollInbox(true),300);
}
(function start(){
  try{window.LOGROS&&LOGROS.aplicar('uno');}catch(_){}
  // Para las pruebas: #auto hace que la compu juegue también por vos (#auto-rapido, sin esperas).
  if(/[#&]auto/.test(location.hash)){FAST=/rapido/.test(location.hash);AUTO=true;const d=(location.hash.match(/dif=(\w+)/)||[])[1];if(d&&DIFN[d])CFG.dif=d;
    const b=(location.hash.match(/bots=(\d)/)||[])[1];if(b)CFG.bots=Math.max(1,Math.min(5,Number(b)));
    const mt=(location.hash.match(/meta=(\d+)/)||[])[1];if(mt!==undefined)CFG.meta=[0,100,200].includes(Number(mt))?Number(mt):200;
    nuevaCompu(Number((location.hash.match(/semilla=(\d+)/)||[])[1])||undefined);return;}
  ls.set('bloques-ultimo-juego','uno');ls.set('bloques-hub-v1','1');
  const hash=location.hash;if(hash){try{history.replaceState(null,'',location.pathname+location.search);}catch(_){}}
  const saved=ls.json(SAVE,null);
  if(saved&&saved.M&&saved.M.v===1&&saved.M.H&&!saved.M.fin){M=saved.M;CFG={...CFG,...(saved.cfg||{})};PERFILES.length=0;(saved.perf||[]).forEach(p=>PERFILES.push(p));MODO='compu';refrescar();render();if(M.H.fin)mostrarFinMano();else seguir();}
  else{mesaVacia();if(!/^#(invitar|amigos|mesa)/.test(hash)&&!aceptando()){if(!ls.get('uno-ayuda')){ls.set('uno-ayuda','1');AYUDA1=true;openHelp();}else openNew();}}
  if(aceptando())esperarInvitacion();
  // v63: si se cortó (o cerraste la app) en medio de una partida en línea, se vuelve sola a la misma mesa.
  else if(window.RECON&&acct()&&RECON.recuerdo('uno')){const rc=RECON.recuerdo('uno'),hasta=(rc.t||Date.now())+RECON.GRACIA;
    try{$('modal').hidden=true;}catch(_){}
    RECON.cartel('uno-host',`Volviendo a la partida de ${rc.host}…`,hasta,()=>{if(!ON){RECON.olvidar('uno');toast(`La mesa de ${esc(rc.host)} ya no está.`);openNew();}});
    RECON.buscarVuelta({prefijo:'UNO:',mesa:rc.mesa,de:rc.host,hasta,vivo:()=>!ON,onInv:inv=>{UIQ.dismissed.add(inv.id);acceptInvite(inv,true);}});}
  if(/^#(amigos|mesa)/.test(hash))setTimeout(openMesa,200);
  {const m=/^#invitar=([^&]+)/.exec(hash);if(m&&acct()){let u='';try{u=decodeURIComponent(m[1]);}catch(_){u=m[1];}
    setTimeout(()=>{openMesa();invitarALugar((UIQ.users||[]).find(y=>y.usuario===u)||{usuario:u,avatar:'🙂',color:'#3b5866'});},400);}}
  if(window.RANGOS)RANGOS.css();
  if(window.CHAT)CHAT.init({busy:()=>!!(E&&!E.fin&&!AUTO),account:()=>{location.href='./#cuenta';},game:()=>'uno',inbox:()=>pollInbox(true),
    invite:(g,u)=>{if(g==='uno'){openMesa();invitarALugar((UIQ.users||[]).find(y=>y.usuario.toLowerCase()===String(u).toLowerCase())||{usuario:u,avatar:'🙂',color:'#3b5866'});return;}
      if(g==='estancia'){location.href='estancia.html#malon';return;}location.href=(g==='poblar'?'poblar.html':g==='truco'?'truco.html':'./')+'#invitar='+encodeURIComponent(u);},
    play:c=>{if(c.j==='uno')openNew();else location.href=c.j==='poblar'?'poblar.html':c.j==='truco'?'truco.html':c.j==='estancia'?'estancia.html#malon':c.j==='pampa'?'pampa.html':'./';}});
  setInterval(()=>pollInbox(),5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>pollInbox(true),500);});setTimeout(()=>pollInbox(true),1500);
})();
// v63: si al abrir llega de tu cuenta una partida contra la compu más nueva (la venías jugando en otro dispositivo), se retoma.
window.addEventListener('bloques-sync',e=>{const k=(e.detail&&e.detail.claves)||[];if(AUTO||!k.includes(SAVE)||MODO!=='compu'||aceptando())return;
  const saved=ls.json(SAVE,null);if(!(saved&&saved.M&&saved.M.v===1&&saved.M.H&&!saved.M.fin))return;
  try{$('modal').hidden=true;}catch(_){}
  M=saved.M;CFG={...CFG,...(saved.cfg||{})};PERFILES.length=0;(saved.perf||[]).forEach(p=>PERFILES.push(p));MODO='compu';refrescar();render();if(M.H.fin)mostrarFinMano();else seguir();
  toast('Seguís la partida que venías jugando en tu otro dispositivo.');
});
window.UNO={refrescar,get M(){return M;},get E(){return E;},get MODO(){return MODO;},get ON(){return ON;},get CFG(){return CFG;},get LIMITE(){return LIMITE;},get MCH(){return MCH;},
  jugarYo,nuevaCompu,openNew,openHelp,openMesa,invitarALugar,empezarMesa,acceptInvite,mandarChat,openChat,pollInbox,netLeave,
  decidir,vistaDe,estadoPara,quienJuega,acciones,repartir,jugar,seguir,mostrarFinMano,mostrarFin,siguienteMano,render,enviarEstados,perdioLugar,
  set FAST(v){FAST=v;},set AUTO(v){AUTO=v;},get BUSY(){return BUSY;}};

</script>
